id: basler-fasnacht-morgestraich-beginn
lang: pt
source_version: 1
question: O que acontece no Morgestraich, o início do Carnaval de Basileia (Basler Fasnacht)?
options:
  a: O presidente da câmara entrega a chave da cidade à sociedade carnavalesca.
  b: As ruas são iluminadas com muita luz e começa um espetáculo de fogo de artifício.
  c: As luzes nas ruas apagam-se e, depois, começam a tocar os pífaros e os tambores.
  d: Os foliões atiram confetes da torre da catedral (Münsterturm) e fazem tocar todos os sinos das igrejas.
explanation: O Morgestraich começa na segunda-feira a seguir à Quarta-feira de Cinzas, às quatro horas
  da manhã. Nessa altura, as luzes nas ruas são apagadas. Depois, começa a música de pífaros e tambores.
