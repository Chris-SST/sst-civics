    question_de: Was geschieht am Morgestraich, dem Beginn der Basler Fasnacht?
    options_de:
      a: Der Gemeindepräsident übergibt der Fasnachtsgesellschaft den Schlüssel der Stadt.
      b: Die Strassen werden mit viel Licht beleuchtet und ein Feuerwerksspektakel beginnt.
      c: Die Lichter in den Strassen gehen aus und dann beginnen die Piccolos und die Trommeln zu spielen.
      d: Die Fasnächtler werfen Konfetti vom Münsterturm und lassen alle Kirchenglocken läuten.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch um vier Uhr morgens. Zu
      diesem Zeitpunkt werden die Lichter in den Strassen gelöscht. Dann beginnt die Musik der Piccolos
      und Trommeln.
