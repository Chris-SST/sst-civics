question: Qual cantão é o cantão mais jovem da Suíça?
options:
  a: Jura
  b: Appenzell Ausserrhoden
  c: Basileia-Campo
  d: Neuchâtel
explanation: O cantão do Jura foi fundado em 1979. Separou-se do cantão de Berna e é, desde então, o mais
  jovem dos 26 cantões. A Constituição Federal menciona-o entre os cantões da Confederação Suíça.
