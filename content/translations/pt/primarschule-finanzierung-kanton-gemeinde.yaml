question: Quem financia e organiza o ensino primário no cantão de Zurique?
options:
  a: Apenas as comunas paroquiais (Kirchgemeinden)
  b: Apenas os pais dos alunos
  c: Apenas a Confederação
  d: O cantão e as comunas (Gemeinden) em conjunto
explanation: A escola pública no cantão de Zurique é uma tarefa partilhada entre o cantão e as comunas.
  O cantão define as bases, e as comunas gerem as escolas no local.
