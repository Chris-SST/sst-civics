id: eidgenossenschaft-name-der-schweiz
lang: pt
source_version: 1
question: Que outro nome também é utilizado para a Suíça na Constituição Federal?
options:
  a: República Federal
  b: Eidgenossenschaft
  c: Confederação dos cantões
  d: Reino Federal
explanation: A designação oficial é «Confederação Suíça» («Schweizerische Eidgenossenschaft»). A palavra
  Eidgenossenschaft designa, portanto, a Suíça como um todo. Recorda as alianças seladas por um juramento.
