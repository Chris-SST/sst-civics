id: bundeshaus-bern-sitz-parlament
lang: pt
source_version: 1
question: Qual edifício em Berna é o local de reunião do Parlamento suíço?
options:
  a: O Kornhaus
  b: O Rathaus (câmara municipal)
  c: O Tribunal Administrativo Federal
  d: O Bundeshaus (Palácio Federal)
explanation: O Parlamento suíço reúne-se no Bundeshaus, em Berna. Aí encontram-se o Conselho Nacional
  e o Conselho dos Estados (Ständerat) para as suas sessões. O Rathaus é um edifício do cantão de Berna
  ou da cidade, não do Parlamento da Confederação.
