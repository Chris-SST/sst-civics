    question_de: Welches Gebäude in Bern ist der Tagungsort des Schweizer Parlaments?
    options_de:
      a: Das Kornhaus
      b: Das Rathaus
      c: Das Bundesverwaltungsgericht
      d: Das Bundeshaus
    explanation_de: Das Schweizer Parlament tagt im Bundeshaus in Bern. Dort kommen der Nationalrat und
      der Ständerat zu ihren Sessionen zusammen. Das Rathaus ist ein Gebäude des Kantons Bern oder der
      Stadt, nicht des Parlaments der Eidgenossenschaft.
