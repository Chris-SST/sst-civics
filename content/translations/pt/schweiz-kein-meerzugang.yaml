    question_de: Welche der Aussagen über die geografische Lage der Schweiz ist richtig?
    options_de:
      a: Die Schweiz hat keinen direkten Zugang zum Meer.
      b: Die Schweiz grenzt im Westen an den Atlantischen Ozean.
      c: Die Schweiz grenzt im Süden an das Mittelmeer.
      d: Die Schweiz grenzt im Norden an die Nordsee.
    explanation_de: 'Die Schweiz ist ein Land ohne Küste: Sie ist vollständig von anderen Ländern umgeben
      und hat keine Meeresküste. Es stimmt, dass auf dem Rhein Schiffe von Basel bis zur Nordsee fahren,
      aber kein Meer grenzt direkt an die Schweiz.'
