id: schweiz-kein-meerzugang
lang: pt
source_version: 2
question: Qual das afirmações sobre a localização geográfica da Suíça está correta?
options:
  a: A Suíça não tem acesso direto ao mar.
  b: A Suíça faz fronteira a oeste com o Oceano Atlântico.
  c: A Suíça faz fronteira a sul com o Mar Mediterrâneo.
  d: A Suíça faz fronteira a norte com o Mar do Norte.
explanation: 'A Suíça é um país sem litoral: está completamente rodeada por outros países e não tem costa
  marítima. É verdade que, no Reno, navegam barcos de Basileia até ao Mar do Norte, mas nenhum mar faz
  fronteira direta com a Suíça.'
