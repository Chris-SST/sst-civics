    question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenentwurf gibt es
      eine Eventualfrage. Wozu dient sie?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Kantone überhaupt an der Abstimmung teilnehmen dürfen
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften noch einmal überprüft werden müssen
    explanation_de: Die Stimmberechtigten können sowohl die Initiative als auch den Gegenentwurf annehmen.
      Mit der Eventualfrage geben sie an, welche Vorlage in Kraft treten soll, falls beide angenommen
      werden. So gehen die Stimmen nicht zwischen zwei ähnlichen Vorlagen verloren.
