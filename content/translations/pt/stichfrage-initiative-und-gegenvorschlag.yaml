id: stichfrage-initiative-und-gegenvorschlag
lang: pt
source_version: 1
question: Numa votação sobre uma iniciativa popular (Volksinitiative) e um contraprojeto direto, existe
  uma pergunta subsidiária. Para que serve?
options:
  a: Decide se a votação tem de ser repetida
  b: Decide se os cantões podem, de todo, participar na votação
  c: Decide qual projeto se aplica quando ambos são aceites
  d: Decide se as assinaturas devem ser verificadas mais uma vez
explanation: Os eleitores podem aprovar tanto a iniciativa como o contraprojeto. Com a pergunta subsidiária,
  indicam qual projeto deve entrar em vigor caso ambos sejam aceites. Assim, os votos não se perdem entre
  dois projetos semelhantes.
