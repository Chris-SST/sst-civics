    question_de: In welchem Verhältnis stehen in der Schweiz der Zivildienst und der Militärdienst zueinander?
    options_de:
      a: Der Zivildienst kann nur von Frauen geleistet werden.
      b: Wer Zivildienst leistet, muss keine Steuern bezahlen.
      c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
      d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
    explanation_de: Der Zivildienst ist ein ziviler Ersatz für den Militärdienst. Er richtet sich an militärdiensttaugliche
      Personen, die den Militärdienst nicht mit ihrem Gewissen vereinbaren können. Dafür muss ein Gesuch
      gestellt werden, und der Zivildienst dauert länger als der Militärdienst.
