id: zivildienst-anstelle-militaerdienst
lang: pt
source_version: 3
question: Como estão relacionados, na Suíça, o serviço civil (Zivildienst) e o serviço militar?
options:
  a: O serviço civil só pode ser prestado por mulheres.
  b: Quem presta serviço civil não precisa pagar impostos.
  c: O serviço civil tem de ser prestado além do serviço militar.
  d: O serviço civil pode ser prestado em vez do serviço militar.
explanation: O serviço civil é um substituto civil do serviço militar. Destina-se a pessoas aptas para
  o serviço militar que não conseguem conciliar o serviço militar com a sua consciência. Para isso, é
  necessário apresentar um pedido, e o serviço civil dura mais tempo do que o serviço militar.
