id: zollwesen-zustaendigkeit-bund
lang: pt
source_version: 1
question: Quem se encarrega, na Suíça, da administração aduaneira?
options:
  a: A Confederação
  b: As comunas (Gemeinden) na fronteira
  c: Os cantões em cujo território se situam as fronteiras
  d: Os cantões e a Confederação, cada um em metade
explanation: Segundo a Constituição Federal, a administração aduaneira é da competência da Confederação.
  Ela regula as taxas aduaneiras e o controlo da circulação de mercadorias através da fronteira. Os cantões
  e as comunas não têm competência própria nesta matéria.
