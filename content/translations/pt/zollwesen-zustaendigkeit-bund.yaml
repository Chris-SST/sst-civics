    question_de: Wer ist in der Schweiz für das Zollwesen zuständig?
    options_de:
      a: Der Bund
      b: Die Gemeinden an der Grenze
      c: Die Kantone, auf deren Gebiet die Grenzen liegen
      d: Die Kantone und der Bund, jeweils zur Hälfte
    explanation_de: Gemäss der Bundesverfassung fällt das Zollwesen in die Zuständigkeit des Bundes. Er
      regelt die Zollabgaben und die Kontrolle des Warenverkehrs über die Grenze. Die Kantone und die
      Gemeinden haben in dieser Angelegenheit keine eigene Zuständigkeit.
