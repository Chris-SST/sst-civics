id: referendum-gesetz-verhindern
lang: pt
source_version: 1
question: O que as pessoas com direito de voto podem alcançar com um referendo?
options:
  a: Podem redigir elas próprias uma nova lei e fazê-la entrar em vigor.
  b: Podem impedir uma lei aprovada pelo Parlamento.
  c: Podem destituir os membros do Conselho Federal (Bundesrat).
  d: Podem dissolver o Parlamento e exigir novas eleições.
explanation: Com um referendo, as pessoas com direito de voto podem exigir que uma lei aprovada pelo Parlamento
  seja submetida a votação. Se o povo rejeitar a lei, ela não entra em vigor.
