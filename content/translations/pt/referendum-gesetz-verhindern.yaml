    question_de: Was können Stimmberechtigte mit einem Referendum erreichen?
    options_de:
      a: Sie können selbst ein neues Gesetz verfassen und in Kraft setzen.
      b: Sie können ein vom Parlament verabschiedetes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates absetzen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Mit einem Referendum können Stimmberechtigte verlangen, dass ein vom Parlament verabschiedetes
      Gesetz zur Abstimmung vorgelegt wird. Wenn das Volk das Gesetz ablehnt, tritt es nicht in Kraft.
