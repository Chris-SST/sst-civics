id: universitaet-zuerich-traegerschaft-kanton
lang: pt
source_version: 1
question: Quem é responsável, no cantão de Zurique, pelo funcionamento e pela entidade mantenedora da
  Universidade de Zurique?
options:
  a: A Confederação
  b: A cidade de Zurique
  c: O cantão de Zurique
  d: Os conselhos distritais do cantão
explanation: A Universidade de Zurique é uma instituição de ensino superior cantonal. O cantão de Zurique
  é a sua entidade mantenedora e é ele que a gere. A cidade de Zurique e a Confederação não são os principais
  responsáveis por ela.
