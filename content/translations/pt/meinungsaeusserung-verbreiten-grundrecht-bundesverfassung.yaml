id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: pt
source_version: 1
question: Qual dos direitos fundamentais garantidos pela Constituição Federal permite expressar e divulgar
  livremente a própria opinião?
options:
  a: A liberdade de opinião
  b: O direito de voto
  c: A garantia da propriedade
  d: A liberdade de estabelecimento
explanation: A liberdade de opinião permite expressar e divulgar livremente a própria opinião. Está consagrada
  no artigo 16 da Constituição Federal. O direito de voto, por sua vez, diz respeito à participação em
  eleições e votações.
