    question_de: Welches der in der Bundesverfassung garantierten Grundrechte erlaubt es, die eigene Meinung
      frei zu äussern und zu verbreiten?
    options_de:
      a: Die Meinungsfreiheit
      b: Das Stimmrecht
      c: Die Eigentumsgarantie
      d: Die Niederlassungsfreiheit
    explanation_de: Die Meinungsfreiheit erlaubt es, die eigene Meinung frei zu äussern und zu verbreiten.
      Sie ist in Artikel 16 der Bundesverfassung verankert. Das Stimmrecht hingegen betrifft die Teilnahme
      an Wahlen und Abstimmungen.
