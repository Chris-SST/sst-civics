id: jodeln-eigene-stimme-instrument
lang: pt
source_version: 1
question: O que serve de instrumento no jodel?
options:
  a: A trompa dos Alpes (Alphorn)
  b: A própria voz
  c: O Schwyzerörgeli
  d: O acordeão (Handorgel)
explanation: No jodel, canta-se sem palavras, geralmente apenas com sílabas, e alterna-se rapidamente
  entre a voz de peito e a voz de cabeça. A própria voz é o instrumento. O jodel faz parte das tradições
  da Suíça e é frequentemente associado à trompa dos Alpes ou ao Schwyzerörgeli.
