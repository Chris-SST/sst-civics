id: strafgesetzbuch-haftstrafe-entscheid
lang: pt
source_version: 1
question: De acordo com que lei se determina se uma pessoa tem de cumprir uma pena de prisão?
options:
  a: De acordo com o Código Civil
  b: De acordo com o Código das Obrigações
  c: De acordo com o direito do arrendamento
  d: De acordo com o Código Penal
explanation: O Código Penal determina quais os atos puníveis e quais as penas possíveis para esses atos.
  Entre elas contam-se as penas pecuniárias e as penas privativas de liberdade. Quem decide sobre a pena
  em cada caso concreto é um tribunal.
