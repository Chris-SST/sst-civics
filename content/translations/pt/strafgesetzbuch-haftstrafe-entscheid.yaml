    question_de: Nach welchem Gesetz wird bestimmt, ob eine Person eine Gefängnisstrafe verbüssen muss?
    options_de:
      a: Nach dem Zivilgesetzbuch
      b: Nach dem Obligationenrecht
      c: Nach dem Mietrecht
      d: Nach dem Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch bestimmt, welche Handlungen strafbar sind und welche Strafen für
      diese Handlungen möglich sind. Dazu gehören Geldstrafen und Freiheitsstrafen. Wer im konkreten Einzelfall
      über die Strafe entscheidet, ist ein Gericht.
