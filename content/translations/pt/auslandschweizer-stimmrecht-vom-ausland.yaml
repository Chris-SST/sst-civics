id: auslandschweizer-stimmrecht-vom-ausland
lang: pt
source_version: 2
question: Uma cidadã suíça vive permanentemente no estrangeiro. Como pode participar nas eleições e votações
  federais?
options:
  a: Só pode votar se viajar para a Suíça para esse efeito.
  b: Só pode participar nas eleições, mas não nas votações.
  c: Pode eleger e votar a partir do seu local de residência no estrangeiro, sem viajar para a Suíça.
  d: Perde o direito de voto e de eleição a nível da Confederação.
explanation: Os suíços residentes no estrangeiro podem eleger e votar a nível federal sem precisar de
  viajar para a Suíça. Para isso, têm de estar registados na representação suíça competente no estrangeiro
  e solicitar, por intermédio dela, a inscrição no registo eleitoral. O material de eleição e de votação
  é depois enviado pela respetiva comuna de voto.
