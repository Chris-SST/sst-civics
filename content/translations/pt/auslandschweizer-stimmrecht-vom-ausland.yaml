    question_de: Eine Schweizer Bürgerin lebt dauerhaft im Ausland. Wie kann sie an den eidgenössischen
      Wahlen und Abstimmungen teilnehmen?
    options_de:
      a: Sie kann nur abstimmen, wenn sie zu diesem Zweck in die Schweiz reist.
      b: Sie kann nur an den Wahlen teilnehmen, aber nicht an den Abstimmungen.
      c: Sie kann von ihrem Wohnort im Ausland aus wählen und abstimmen, ohne in die Schweiz zu reisen.
      d: Sie verliert das Stimm- und Wahlrecht auf Ebene des Bundes.
    explanation_de: Auslandschweizer können auf Bundesebene wählen und abstimmen, ohne in die Schweiz
      reisen zu müssen. Dafür müssen sie bei der zuständigen schweizerischen Vertretung im Ausland registriert
      sein und über sie die Eintragung in das Stimmregister beantragen. Das Wahl- und Abstimmungsmaterial
      wird danach von der jeweiligen Stimmgemeinde zugesandt.
