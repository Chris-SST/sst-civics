    question_de: Gegen welche Risiken bietet das Sozialversicherungssystem der Schweiz unter anderem Schutz?
    options_de:
      a: Gegen Verluste bei privaten Finanzanlagen
      b: Gegen Schäden am Auto und am Hausrat, die durch Diebstahl verursacht werden
      c: Gegen die Folgen von Krankheit und Unfall
      d: Gegen Preiserhöhungen bei den Mieten
    explanation_de: Die Sozialversicherungen schützen die Menschen vor den finanziellen Folgen wichtiger
