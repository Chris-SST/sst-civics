id: absicherung-krankheit-unfall-sozialversicherung
lang: pt
source_version: 1
question: Contra quais riscos o sistema de seguros sociais da Suíça oferece proteção, entre outros?
options:
  a: Contra perdas em investimentos financeiros privados
  b: Contra danos ao automóvel e ao recheio da casa causados por furto
  c: Contra as consequências de doença e acidente
  d: Contra aumentos de preços nos arrendamentos
explanation: Os seguros sociais protegem as pessoas das consequências financeiras de importantes riscos
  da vida. Entre eles contam-se a doença e o acidente. O seguro de saúde e o seguro de acidentes são exemplos.
