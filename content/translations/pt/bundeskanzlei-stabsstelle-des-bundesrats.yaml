    question_de: Welche Funktion hat die Bundeskanzlei für den Bundesrat?
    options_de:
      a: Sie ist das Stabsorgan des Bundesrates.
      b: Sie prüft als Gericht die Entscheidungen des Bundesrates.
      c: Sie leitet das Finanzdepartement.
      d: Sie wählt die Mitglieder des Bundesrates.
    explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der
      Vorbereitung der Sitzungen. Sie steht unter der Leitung der Bundeskanzlerin oder des Bundeskanzlers.
      Der Bundesrat wird von der Bundesversammlung gewählt.
