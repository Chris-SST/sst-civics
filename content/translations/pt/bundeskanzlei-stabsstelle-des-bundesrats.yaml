id: bundeskanzlei-stabsstelle-des-bundesrats
lang: pt
source_version: 1
question: Qual é a função da Chancelaria Federal (Bundeskanzlei) para o Conselho Federal (Bundesrat)?
options:
  a: É o órgão de apoio do Conselho Federal.
  b: Examina, como tribunal, as decisões do Conselho Federal.
  c: Dirige o Departamento das Finanças.
  d: Elege os membros do Conselho Federal.
explanation: A Chancelaria Federal apoia o Conselho Federal no seu trabalho, por exemplo na preparação
  das sessões. Está sob a direção da chanceler federal ou do chanceler federal. O Conselho Federal é eleito
  pela Assembleia Federal (Bundesversammlung).
