id: einsprache-gegen-steuerveranlagung-schriftlich
lang: pt
source_version: 1
question: Uma pessoa sujeita a imposto não concorda com a sua taxação fiscal. O que pode fazer?
options:
  a: Pode pedir que a assembleia municipal (Gemeindeversammlung) vote sobre o assunto.
  b: Pode recusar o pagamento sem tomar mais nenhuma medida.
  c: Pode apresentar uma reclamação por escrito junto da autoridade fiscal.
  d: Pode apresentar uma iniciativa popular (Volksinitiative) ao Conselho Federal (Bundesrat).
explanation: Contra a taxação existe o meio de recurso da reclamação. Esta deve ser apresentada por escrito
  junto da autoridade fiscal, e isso dentro de um prazo.
