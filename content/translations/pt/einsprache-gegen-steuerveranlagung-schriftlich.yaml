    question_de: Eine steuerpflichtige Person ist mit ihrer Steuereinschätzung nicht einverstanden. Was
      kann sie tun?
    options_de:
      a: Sie kann verlangen, dass die Gemeindeversammlung über die Angelegenheit abstimmt.
      b: Sie kann die Zahlung verweigern, ohne weitere Massnahmen zu ergreifen.
      c: Sie kann bei der Steuerbehörde schriftlich eine Einsprache einreichen.
      d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
    explanation_de: Gegen die Einschätzung besteht das Rechtsmittel der Einsprache. Diese muss schriftlich
      bei der Steuerbehörde eingereicht werden, und zwar innerhalb einer Frist.
