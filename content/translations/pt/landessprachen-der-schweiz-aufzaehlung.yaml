id: landessprachen-der-schweiz-aufzaehlung
lang: pt
source_version: 1
question: Quais línguas são línguas nacionais na Suíça?
options:
  a: Alemão, francês, romanche e espanhol
  b: Alemão, francês, italiano e romanche
  c: Alemão, francês, italiano e inglês
  d: Alemão, francês e italiano
explanation: A Constituição Federal indica o alemão, o francês, o italiano e o romanche como línguas nacionais.
  O inglês não é uma língua nacional, mas é frequentemente utilizado como língua de comunicação.
