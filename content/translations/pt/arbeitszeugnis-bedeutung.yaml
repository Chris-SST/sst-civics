id: arbeitszeugnis-bedeutung
lang: pt
source_version: 1
question: O que é um certificado de trabalho (Arbeitszeugnis)?
options:
  a: Um atestado do médico ou da médica a confirmar que a pessoa não pode trabalhar
  b: Um documento do empregador que avalia o desempenho e o comportamento da pessoa empregada
  c: A autorização do serviço de migração para trabalhar na Suíça
  d: O certificado de salário anual para a declaração de impostos
explanation: O certificado de trabalho é emitido pelo empregador. Descreve o tipo e a duração do trabalho
  e avalia o desempenho e o comportamento. Os trabalhadores podem solicitá-lo a qualquer momento.
