    question_de: Was ist ein Arbeitszeugnis?
    options_de:
      a: Ein Attest der Ärztin oder des Arztes, das bestätigt, dass die Person nicht arbeiten kann
      b: Ein Dokument des Arbeitgebers, das die Leistung und das Verhalten der angestellten Person beurteilt
      c: Die Bewilligung der Migrationsbehörde, in der Schweiz zu arbeiten
      d: Der jährliche Lohnausweis für die Steuererklärung
    explanation_de: Das Arbeitszeugnis wird vom Arbeitgeber ausgestellt. Es beschreibt die Art und die
      Dauer der Arbeit und beurteilt die Leistung und das Verhalten. Die Arbeitnehmenden können es jederzeit
      verlangen.
