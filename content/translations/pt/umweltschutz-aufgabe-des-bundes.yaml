id: umweltschutz-aufgabe-des-bundes
lang: pt
source_version: 1
question: Que nível é responsável, na Suíça, por proteger o ambiente e por emitir normas para esse fim?
options:
  a: A Confederação
  b: As organizações privadas
  c: Apenas as comunas (Gemeinde)
  d: Apenas os distritos
explanation: A Constituição Federal encarrega a Confederação de proteger o ser humano e o ambiente contra
  efeitos nocivos. Para isso, ela emite leis, por exemplo sobre a proteção das águas e da natureza. Os
  cantões aplicam muitas dessas normas.
