    question_de: Welche Ebene ist in der Schweiz für den Schutz der Umwelt und für den Erlass von Vorschriften
      dazu zuständig?
    options_de:
      a: Der Bund
      b: Die privaten Organisationen
      c: Nur die Gemeinden
      d: Nur die Bezirke
    explanation_de: Die Bundesverfassung beauftragt den Bund, den Menschen und die Umwelt vor schädlichen
