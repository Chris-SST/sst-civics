    question_de: Was gilt für ein Bundesgesetz, das beide Kammern des Parlaments verabschiedet haben?
    options_de:
      a: Die Stimmberechtigten können mittels eines Referendums eine Volksabstimmung über das Gesetz verlangen.
      b: Der Bundesrat muss es anschliessend noch dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass das Volk sich dazu äussern kann.
      d: Die Regierungen der Kantone müssen es zuerst einzeln genehmigen.
    explanation_de: Nach dem Beschluss beider Kammern unterliegen die Bundesgesetze dem fakultativen Referendum.
      Wenn das Referendum gültig verlangt wird, entscheiden die Stimmberechtigten an der Urne über das
      Gesetz.
