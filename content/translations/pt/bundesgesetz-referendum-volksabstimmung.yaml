id: bundesgesetz-referendum-volksabstimmung
lang: pt
source_version: 1
question: O que se aplica a uma lei federal que ambas as câmaras do Parlamento aprovaram?
options:
  a: Os eleitores podem exigir, por meio de um referendo, uma votação popular sobre a lei.
  b: O Conselho Federal (Bundesrat) deve, em seguida, submetê-la ainda ao Tribunal Federal (Bundesgericht)
    para aprovação.
  c: Entra sempre em vigor imediatamente, sem que o povo possa se pronunciar.
  d: Os governos dos cantões devem primeiro aprová-la individualmente.
explanation: Após a decisão de ambas as câmaras, as leis federais estão sujeitas ao referendo facultativo.
  Se o referendo for validamente requerido, os eleitores decidem sobre a lei nas urnas.
