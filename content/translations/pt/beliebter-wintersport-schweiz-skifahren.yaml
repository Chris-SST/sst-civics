question: Que desporto é praticado por muitas pessoas na Suíça, em especial no inverno?
options:
  a: Pólo aquático
  b: Esqui
  c: Remo
  d: Voleibol de praia
explanation: O esqui é muito popular na Suíça no inverno, e muitas pessoas esquiam nas montanhas. Muitas
  vezes, as crianças aprendem a esquiar desde cedo, por exemplo num campo de esqui da escola. O pólo aquático,
  o remo e o voleibol de praia, pelo contrário, são desportos praticados sobretudo no verão ou na água.
