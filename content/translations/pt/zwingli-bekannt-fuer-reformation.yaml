    question_de: Wofür ist Huldrych (Ulrich) Zwingli in der Geschichte Zürichs vor allem bekannt?
    options_de:
      a: Er baute die erste Eisenbahn des Kantons.
      b: Er war der erste Bundespräsident der Schweiz.
      c: Er führte das Stimmrecht der Frauen ein.
      d: Er war der Anführer der Reformation in Zürich.
    explanation_de: Im 16. Jahrhundert führte Huldrych (Ulrich) Zwingli die Reformation in Zürich an,
      und die Zürcher Kirche wurde reformiert. Die Eisenbahn, der Bundesstaat mit einem Bundespräsidenten
      und das Stimmrecht der Frauen entstanden erst Jahrhunderte später.
