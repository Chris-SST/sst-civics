id: zwingli-bekannt-fuer-reformation
lang: pt
source_version: 2
question: Pelo que Huldrych (Ulrich) Zwingli é sobretudo conhecido na história de Zurique?
options:
  a: Construiu o primeiro caminho-de-ferro do cantão.
  b: Foi o primeiro Presidente da Confederação (Bundespräsident) da Suíça.
  c: Introduziu o direito de voto das mulheres.
  d: Foi o líder da Reforma em Zurique.
explanation: No século XVI, Huldrych (Ulrich) Zwingli liderou a Reforma em Zurique, e a Igreja de Zurique
  tornou-se reformada. O caminho-de-ferro, o Estado federal com um Presidente da Confederação e o direito
  de voto das mulheres só surgiram séculos mais tarde.
