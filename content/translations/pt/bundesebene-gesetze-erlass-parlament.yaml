    question_de: Welche Behörde verabschiedet die Gesetze auf Ebene des Bundes?
    options_de:
      a: Die Bundesversammlung, also der Nationalrat und der Ständerat
      b: Die Schweizerische Nationalbank
      c: Die Bundeskanzlei
      d: Die Konferenz der Kantonsregierungen
    explanation_de: Die Bundesversammlung ist das Parlament des Bundes und setzt sich aus dem Nationalrat
      und dem Ständerat zusammen. Sie ist für die Gesetzgebung zuständig. Die Bundeskanzlei hingegen unterstützt
      den Bundesrat als Stabsorgan.
