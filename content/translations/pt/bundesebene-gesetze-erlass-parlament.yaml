id: bundesebene-gesetze-erlass-parlament
lang: pt
source_version: 1
question: Qual autoridade aprova as leis a nível da Confederação?
options:
  a: A Assembleia Federal (Bundesversammlung), ou seja, o Conselho Nacional (Nationalrat) e o Conselho
    dos Estados (Ständerat)
  b: O Banco Nacional Suíço
  c: A Chancelaria Federal (Bundeskanzlei)
  d: A Conferência dos Governos Cantonais
explanation: A Assembleia Federal é o parlamento da Confederação e é composta pelo Conselho Nacional e
  pelo Conselho dos Estados. Ela é responsável pela legislação. A Chancelaria Federal, por sua vez, apoia
  o Conselho Federal (Bundesrat) como órgão de estado-maior.
