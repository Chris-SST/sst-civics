    question_de: Eine Arbeitnehmerin erhält ungerechtfertigterweise einen zu niedrigen Lohn. An welche
      Stelle kann sie sich wenden?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Bundesamt für Statistik
      c: Das Arbeitsgericht
      d: Die Gemeindeversammlung
    explanation_de: Bei Streitigkeiten aus dem Arbeitsverhältnis, zum Beispiel wegen eines zu niedrigen
      Lohns, ist das Arbeitsgericht zuständig. Das RAV hilft bei der Stellensuche und nicht bei Lohnstreitigkeiten.
