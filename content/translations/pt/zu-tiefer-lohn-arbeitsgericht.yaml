id: zu-tiefer-lohn-arbeitsgericht
lang: pt
source_version: 1
question: Uma trabalhadora recebe, de forma injustificada, um salário demasiado baixo. A que entidade
  pode recorrer?
options:
  a: O Centro Regional de Colocação (RAV)
  b: O Gabinete Federal de Estatística
  c: O Tribunal do Trabalho
  d: A assembleia municipal (Gemeindeversammlung)
explanation: Em caso de litígios decorrentes da relação de trabalho, por exemplo por causa de um salário
  demasiado baixo, o Tribunal do Trabalho é competente. O RAV ajuda na procura de emprego e não em litígios
  salariais.
