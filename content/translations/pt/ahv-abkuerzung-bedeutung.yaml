id: ahv-abkuerzung-bedeutung
lang: pt
source_version: 1
question: O que significa a abreviatura AHV?
options:
  a: Seguro de velhice e sobrevivência (Alters- und Hinterlassenenversicherung)
  b: Seguro oficial do agregado familiar (Amtliche Haushaltsversicherung)
  c: Ajuda geral para segurados (Allgemeine Hilfe für Versicherte)
  d: Seguro de desemprego e de tratamento médico (Arbeitslosen- und Heilungsversicherung)
explanation: AHV significa seguro de velhice e sobrevivência (AVS). Paga pensões na velhice e aos sobreviventes,
  por exemplo a viúvas, viúvos e órfãos.
