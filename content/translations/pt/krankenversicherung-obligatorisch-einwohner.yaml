id: krankenversicherung-obligatorisch-einwohner
lang: pt
source_version: 1
question: Quem deve contratar um seguro de saúde na Suíça?
options:
  a: Apenas pessoas com cidadania (Bürgerrecht) suíça
  b: Todas as pessoas que residem na Suíça
  c: Apenas pessoas com menos de 65 anos
  d: Apenas pessoas que exercem uma atividade profissional
explanation: O seguro de saúde obrigatório (obligatorische Krankenpflegeversicherung) aplica-se a todas
  as pessoas com domicílio na Suíça. A cidadania, a atividade profissional e a idade não têm qualquer
  importância. O seguro deve ser contratado no prazo de três meses após a mudança para a Suíça.
