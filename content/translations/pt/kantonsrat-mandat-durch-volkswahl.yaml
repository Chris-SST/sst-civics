id: kantonsrat-mandat-durch-volkswahl
lang: pt
source_version: 1
question: Como os membros do Conselho Cantonal (Kantonsrat) de Zurique obtêm o seu mandato?
options:
  a: São eleitos pelo povo.
  b: São designados pelos conselhos das comunas (Gemeinderäte).
  c: São nomeados pelo Conselho de Governo (Regierungsrat).
  d: São empossados pelo Conselho Federal (Bundesrat).
explanation: Os membros do Conselho Cantonal são eleitos pelos cidadãos com direito de voto do cantão
  numa eleição popular. O parlamento é, assim, determinado directamente pelo povo. Nem o governo nem a
  Confederação nomeiam os membros.
