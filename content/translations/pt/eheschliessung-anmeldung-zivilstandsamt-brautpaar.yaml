    question_de: Wer meldet die geplante Eheschliessung dem Zivilstandsamt?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Die Verlobten gemeinsam
      c: Das Einwohneramt der Wohngemeinde, automatisch
      d: Die Eltern der Braut oder des Bräutigams
    explanation_de: Die Verlobten stellen gemeinsam beim Zivilstandsamt den Antrag auf Durchführung des
      Vorbereitungsverfahrens der Eheschliessung. Andere Personen können das nicht an ihrer Stelle tun.
      Danach prüft die Stelle die Voraussetzungen für die Eheschliessung.
