id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: pt
source_version: 1
question: Quem comunica o casamento previsto ao registo civil (Zivilstandsamt)?
options:
  a: As testemunhas do casamento, em nome do casal
  b: Os noivos em conjunto
  c: O serviço de registo de residentes (Einwohneramt) do município de residência, automaticamente
  d: Os pais da noiva ou do noivo
explanation: Os noivos apresentam em conjunto ao registo civil o pedido de realização do processo preparatório
  do casamento. Outras pessoas não o podem fazer em seu lugar. Depois, o serviço verifica os requisitos
  do casamento.
