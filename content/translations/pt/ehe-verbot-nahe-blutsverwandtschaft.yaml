id: ehe-verbot-nahe-blutsverwandtschaft
lang: pt
source_version: 1
question: Quem não pode casar-se na Suíça?
options:
  a: Pessoas que já foram divorciadas
  b: Pessoas que são originárias de cantões diferentes
  c: Pessoas que são parentes consanguíneos próximos
  d: Pessoas que residem em comunas (Gemeinden) diferentes
explanation: O casamento entre parentes consanguíneos próximos é proibido, por exemplo entre irmãos ou
  entre pais e filhos. Em contrapartida, a origem, o local de residência e um divórcio anterior não constituem
  impedimento ao casamento.
