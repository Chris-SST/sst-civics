id: alv-beitraege-arbeitgeber-lohnabzug
lang: pt
source_version: 1
question: Quem desconta do salário as contribuições para o seguro de desemprego?
options:
  a: A comuna (Gemeinde) do local de residência
  b: O próprio trabalhador ou a própria trabalhadora, mediante pagamento
  c: O Centro Regional de Colocação (Regionales Arbeitsvermittlungszentrum)
  d: O empregador
explanation: O empregador desconta automaticamente as contribuições do salário e transfere-as para o organismo
  competente. Os trabalhadores não têm de se ocupar disso pessoalmente. O empregador também paga uma parte
  das contribuições.
