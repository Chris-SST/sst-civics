    question_de: Wer zieht die Beiträge für die Arbeitslosenversicherung vom Lohn ab?
    options_de:
      a: Die Gemeinde des Wohnorts
      b: Der Arbeitnehmer oder die Arbeitnehmerin selbst, durch Zahlung
      c: Das Regionale Arbeitsvermittlungszentrum
      d: Der Arbeitgeber
    explanation_de: Der Arbeitgeber zieht die Beiträge automatisch vom Lohn ab und überweist sie an die
      zuständige Stelle. Die Arbeitnehmenden müssen sich nicht persönlich darum kümmern. Der Arbeitgeber
      zahlt auch einen Teil der Beiträge.
