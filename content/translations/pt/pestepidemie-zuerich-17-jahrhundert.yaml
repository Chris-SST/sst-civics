question: Que catástrofe custou a vida a quase metade da população de Zurique no início do século XVII?
options:
  a: Um incêndio na cidade
  b: Uma epidemia de peste
  c: Uma inundação
  d: Uma fome
explanation: No início do século XVII, quase metade dos habitantes de Zurique morreu de peste. A peste
  era uma doença contagiosa que, naquela época, se espalhou várias vezes pela Europa.
