id: roestigraben-kulturelle-unterschiede
lang: pt
source_version: 1
question: O que se designa na Suíça com o termo «Röstigraben»?
options:
  a: Os Alpes como linha de separação entre o norte e o sul
  b: As diferenças entre a cidade e o campo
  c: A fronteira entre a Suíça e a Alemanha
  d: As diferenças culturais entre a Suíça alemã e a Suíça romanda
explanation: O termo «Röstigraben» é uma expressão figurada. Descreve as diferenças culturais entre a
  Suíça alemã e a Suíça romanda, de língua francesa. Essas diferenças manifestam-se, por exemplo, por
  vezes nas votações.
