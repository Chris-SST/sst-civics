    question_de: Was bezeichnet man in der Schweiz mit dem Begriff «Röstigraben»?
    options_de:
      a: Die Alpen als Trennlinie zwischen dem Norden und dem Süden
      b: Die Unterschiede zwischen Stadt und Land
      c: Die Grenze zwischen der Schweiz und Deutschland
      d: Die kulturellen Unterschiede zwischen der Deutschschweiz und der Romandie
    explanation_de: Der Begriff «Röstigraben» ist ein bildlicher Ausdruck. Er beschreibt die kulturellen
      Unterschiede zwischen der Deutschschweiz und der französischsprachigen Romandie. Diese Unterschiede
      zeigen sich zum Beispiel manchmal bei Abstimmungen.
