id: rechtsprechende-gewalt-bund-bundesgericht
lang: pt
source_version: 1
question: Qual autoridade é, a nível federal, o órgão judicial supremo da Suíça?
options:
  a: A Chancelaria Federal (Bundeskanzlei)
  b: O Conselho Federal (Bundesrat)
  c: A Assembleia Federal (Bundesversammlung)
  d: O Tribunal Federal (Bundesgericht)
explanation: A Constituição Federal atribui o poder judicial da Confederação ao Tribunal Federal. Este
  é a autoridade judicial suprema da Confederação. O Conselho Federal e a Assembleia Federal exercem,
  respetivamente, o poder executivo e o poder legislativo.
