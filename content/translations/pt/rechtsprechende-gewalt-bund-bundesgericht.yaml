    question_de: Welche Behörde ist auf Bundesebene das oberste Gerichtsorgan der Schweiz?
    options_de:
      a: Die Bundeskanzlei
      b: Der Bundesrat
      c: Die Bundesversammlung
      d: Das Bundesgericht
    explanation_de: Die Bundesverfassung überträgt die richterliche Gewalt des Bundes dem Bundesgericht.
      Dieses ist die oberste richterliche Behörde des Bundes. Der Bundesrat und die Bundesversammlung
      üben jeweils die vollziehende Gewalt und die gesetzgebende Gewalt aus.
