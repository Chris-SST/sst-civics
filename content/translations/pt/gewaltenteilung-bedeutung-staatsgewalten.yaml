id: gewaltenteilung-bedeutung-staatsgewalten
lang: pt
source_version: 1
question: O que significa o princípio da separação de poderes na Suíça?
options:
  a: A Confederação, os cantões e as comunas (Gemeinde) repartem entre si as receitas fiscais.
  b: O governo, o parlamento e os tribunais partilham o poder do Estado.
  c: O poder no Estado pertence exclusivamente ao Conselho Federal (Bundesrat).
  d: O povo e os meios de comunicação social partilham o poder do Estado.
explanation: Na separação de poderes, o executivo (governo), o legislativo (parlamento) e o judiciário
  (tribunais) assumem tarefas diferentes. Assim, nenhuma instituição pode ter poder excessivo por si só.
  Os poderes do Estado controlam-se mutuamente.
