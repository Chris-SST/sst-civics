    question_de: Was bedeutet das Prinzip der Gewaltenteilung in der Schweiz?
    options_de:
      a: Der Bund, die Kantone und die Gemeinden teilen die Steuereinnahmen unter sich auf.
      b: Die Regierung, das Parlament und die Gerichte teilen die Staatsgewalt unter sich.
      c: Die Macht im Staat gehört ausschliesslich dem Bundesrat.
      d: Das Volk und die Medien teilen die Staatsgewalt unter sich.
    explanation_de: Bei der Gewaltenteilung übernehmen die Exekutive (Regierung), die Legislative (Parlament)
      und die Judikative (Gerichte) unterschiedliche Aufgaben. So kann keine Institution für sich allein
      zu viel Macht haben. Die Staatsgewalten kontrollieren sich gegenseitig.
