id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: pt
source_version: 1
question: Qual direito fundamental protege a liberdade de formar uma opinião própria e de se informar
  a partir de fontes de acesso geral?
options:
  a: A liberdade de estabelecimento
  b: A liberdade de opinião e de informação
  c: A liberdade económica
  d: A liberdade de reunião
explanation: A Constituição Federal protege a liberdade de opinião e de informação no artigo 16. Qualquer
  pessoa pode obter livremente informações a partir de fontes de acesso geral. Esta é uma base importante
  da democracia.
