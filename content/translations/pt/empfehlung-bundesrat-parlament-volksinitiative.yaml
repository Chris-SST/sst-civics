id: empfehlung-bundesrat-parlament-volksinitiative
lang: pt
source_version: 1
question: Quem recomenda aos eleitores, antes da votação sobre uma iniciativa popular (Volksinitiative)
  federal, que aceitem ou rejeitem a iniciativa?
options:
  a: O Conselho Federal (Bundesrat) e o Parlamento
  b: Os governos cantonais
  c: A Chancelaria Federal (Bundeskanzlei) por si só
  d: O Tribunal Federal (Bundesgericht)
explanation: Depois de uma iniciativa popular ter sido formalmente aceite, o Conselho Federal e o Parlamento
  tomam posição sobre ela. O Parlamento recomenda aos eleitores que aceitem ou rejeitem a iniciativa.
  Esta recomendação consta também das explicações sobre a votação, que os eleitores recebem antes da votação.
