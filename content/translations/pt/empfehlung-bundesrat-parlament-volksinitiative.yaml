    question_de: Wer empfiehlt den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative,
      die Initiative anzunehmen oder abzulehnen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Kantonsregierungen
      c: Die Bundeskanzlei allein
      d: Das Bundesgericht
    explanation_de: Nachdem eine Volksinitiative formell zustande gekommen ist, nehmen der Bundesrat und
      das Parlament dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten, die Initiative anzunehmen
      oder abzulehnen. Diese Empfehlung steht auch in den Abstimmungserläuterungen, die die Stimmberechtigten
      vor der Abstimmung erhalten.
