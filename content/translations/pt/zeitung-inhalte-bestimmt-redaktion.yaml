id: zeitung-inhalte-bestimmt-redaktion
lang: pt
source_version: 1
question: Quem decide, na Suíça, quais conteúdos são publicados num jornal?
options:
  a: O Tribunal Federal (Bundesgericht)
  b: A comuna (Gemeinde) em que o jornal é publicado
  c: A redação do jornal
  d: O Conselho Federal (Bundesrat)
explanation: A liberdade dos meios de comunicação protege os jornais contra a influência do Estado. A
  redação decide por si própria o que publica. A Constituição Federal proíbe a censura.
