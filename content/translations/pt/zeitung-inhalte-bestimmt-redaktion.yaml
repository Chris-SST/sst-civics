    question_de: Wer entscheidet in der Schweiz, welche Inhalte in einer Zeitung veröffentlicht werden?
    options_de:
      a: Das Bundesgericht
      b: Die Gemeinde, in der die Zeitung herausgegeben wird
      c: Die Redaktion der Zeitung
      d: Der Bundesrat
    explanation_de: Die Freiheit der Medien schützt die Zeitungen vor dem Einfluss des Staates. Die Redaktion
      entscheidet selbst, was sie veröffentlicht. Die Bundesverfassung verbietet die Zensur.
