    question_de: Wer ist grundsätzlich in der Schweiz steuerpflichtig?
    options_de:
      a: Die Personen, die in der Schweiz wohnen
      b: Nur die Personen, die ein Unternehmen führen
      c: Nur die Personen mit schweizerischem Bürgerrecht
      d: Nur die Personen, die das Stimmrecht haben
    explanation_de: Die Steuerpflicht hängt vom Wohnsitz ab und nicht vom Bürgerrecht. Auch Ausländer
      und Ausländerinnen, die in der Schweiz wohnen, bezahlen Steuern. Das Stimmrecht spielt in dieser
      Hinsicht keine Rolle.
