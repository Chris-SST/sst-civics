id: steuerpflicht-wohnhafte-personen-schweiz
lang: pt
source_version: 1
question: Quem é, em princípio, obrigado a pagar impostos na Suíça?
options:
  a: As pessoas que residem na Suíça
  b: Apenas as pessoas que gerem uma empresa
  c: Apenas as pessoas com cidadania suíça (Bürgerrecht)
  d: Apenas as pessoas que têm direito de voto
explanation: A obrigação fiscal depende do domicílio e não da cidadania. Também os estrangeiros e as estrangeiras
  que residem na Suíça pagam impostos. O direito de voto não tem qualquer importância nesse aspeto.
