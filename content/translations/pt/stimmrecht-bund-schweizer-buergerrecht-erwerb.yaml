    question_de: Ab welchem Zeitpunkt erhält eine aus dem Ausland stammende Person das Stimm- und Wahlrecht
      auf Ebene des Bundes?
    options_de:
      a: Sobald sie zehn Jahre in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (Ausweis C) erhält.
      c: Sobald sie Steuern zahlt und in der Schweiz arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht hat und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Ebene des Bundes ist an das Schweizer Bürgerrecht gebunden.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Bezahlen von Steuern genügen
      dafür nicht. Wer eingebürgert ist und volljährig ist, kann an den eidgenössischen Wahlen und Abstimmungen
      teilnehmen.
