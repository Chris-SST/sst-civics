id: stimmrecht-bund-schweizer-buergerrecht-erwerb
lang: pt
source_version: 1
question: A partir de que momento uma pessoa vinda do estrangeiro obtém o direito de voto e de elegibilidade
  a nível da Confederação?
options:
  a: Assim que tiver vivido dez anos na Suíça.
  b: Assim que obtiver uma autorização de estabelecimento (Niederlassungsbewilligung) (autorização C).
  c: Assim que pagar impostos e trabalhar na Suíça.
  d: Assim que tiver a cidadania (Bürgerrecht) suíça e for maior de idade.
explanation: O direito de voto e de elegibilidade a nível da Confederação está ligado à cidadania suíça.
  Uma autorização de estabelecimento, uma determinada duração de residência ou o pagamento de impostos
  não são suficientes para isso. Quem é naturalizado e é maior de idade pode participar nas eleições e
  votações federais.
