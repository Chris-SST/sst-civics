id: parlament-zwei-kammern-bund
lang: pt
source_version: 1
question: De que duas câmaras é composto o Parlamento suíço a nível da Confederação?
options:
  a: Do Conselho Federal (Bundesrat) e do Conselho dos Estados (Ständerat)
  b: Do Conselho Federal e do Conselho Nacional (Nationalrat)
  c: Do Conselho dos Estados e do Tribunal Federal (Bundesgericht)
  d: Do Conselho Nacional e do Conselho dos Estados
explanation: 'A Assembleia Federal (Bundesversammlung), o Parlamento da Confederação, é composta por duas
  câmaras: o Conselho Nacional e o Conselho dos Estados. O Conselho Federal é o governo e não faz parte
  do Parlamento.'
