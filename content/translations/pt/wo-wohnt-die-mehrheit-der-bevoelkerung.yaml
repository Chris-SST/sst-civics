id: wo-wohnt-die-mehrheit-der-bevoelkerung
lang: pt
source_version: 2
question: Em que região da Suíça vive a maioria da população?
options:
  a: Nos Alpes
  b: No Tessino
  c: No Planalto Suíço (Mittelland)
  d: No Jura
explanation: O Planalto Suíço situa-se entre o Jura e os Alpes. É lá que se encontram a maioria das grandes
  cidades e que vive a maior parte da população. Os Alpes cobrem, é certo, uma grande área, mas são pouco
  povoados.
