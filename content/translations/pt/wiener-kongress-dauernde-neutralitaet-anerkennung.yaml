question: Qual acontecimento de 1815 é importante para a neutralidade da Suíça?
options:
  a: A Suíça declarou guerra a todos os Estados vizinhos.
  b: As grandes potências reconheceram a neutralidade permanente da Suíça.
  c: A Suíça aderiu à Sociedade das Nações.
  d: A Suíça realizou pela primeira vez uma votação popular sobre a neutralidade.
explanation: No Congresso de Viena de 1815, as grandes potências europeias reconheceram a neutralidade
  permanente da Suíça. Isso deu à neutralidade uma base internacional.
