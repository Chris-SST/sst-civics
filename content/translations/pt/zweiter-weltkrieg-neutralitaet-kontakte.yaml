id: zweiter-weltkrieg-neutralitaet-kontakte
lang: pt
source_version: 1
question: Como se comportou a Suíça na Segunda Guerra Mundial?
options:
  a: Cortou todos os contactos com as partes em conflito e fechou completamente as fronteiras.
  b: Aliou-se à Alemanha e forneceu tropas.
  c: Manteve-se neutra e manteve contactos políticos e económicos com as partes em conflito.
  d: Aderiu à aliança dos Aliados e combateu ao seu lado.
explanation: A Suíça não se tornou parte em conflito na Segunda Guerra Mundial. No entanto, manteve contactos
  políticos e económicos com as partes em conflito. Esta atitude continua a ser debatida do ponto de vista
  histórico até hoje.
