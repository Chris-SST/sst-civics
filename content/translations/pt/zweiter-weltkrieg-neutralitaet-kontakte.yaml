    question_de: Wie hat sich die Schweiz im Zweiten Weltkrieg verhalten?
    options_de:
      a: Sie brach alle Kontakte zu den Konfliktparteien ab und schloss die Grenzen vollständig.
      b: Sie verbündete sich mit Deutschland und stellte Truppen zur Verfügung.
      c: Sie blieb neutral und pflegte politische und wirtschaftliche Kontakte zu den Konfliktparteien.
      d: Sie trat dem Bündnis der Alliierten bei und kämpfte an ihrer Seite.
    explanation_de: Die Schweiz wurde im Zweiten Weltkrieg nicht zur Konfliktpartei. Dennoch pflegte sie
