id: petition-ohne-stimmrecht-zuerich
lang: pt
source_version: 1
question: Que possibilidade política têm os estrangeiros e as estrangeiras no cantão de Zurique que não
  têm direito de voto?
options:
  a: Podem votar nas urnas sobre projetos cantonais.
  b: Podem eleger membros do Conselho Cantonal (Kantonsrat).
  c: Podem dirigir-se às autoridades através de uma petição.
  d: Podem apresentar uma iniciativa popular (Volksinitiative) no cantão.
explanation: O direito de petição está aberto a todas as pessoas, incluindo as que não têm direito de
  voto. Desta forma, podem comunicar por escrito às autoridades preocupações, pedidos ou críticas. Apenas
  as pessoas com direito de voto podem votar, eleger e assinar iniciativas.
