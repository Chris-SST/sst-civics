    question_de: Mit welchem Geld werden die öffentlichen Schulen in der Schweiz hauptsächlich bezahlt?
    options_de:
      a: Mit dem Schulgeld, das die Eltern jeden Monat bezahlen
      b: Mit dem Steuergeld des Kantons und der Gemeinden
      c: Mit den Einnahmen der Post und der SBB
      d: Mit den Beiträgen der Krankenkassen
    explanation_de: Gemäss der Bundesverfassung ist die obligatorische öffentliche Schule unentgeltlich.
      Sie wird mit Steuergeldern finanziert, vor allem von den Kantonen und den Gemeinden.
