id: schulen-finanzierung-steuergelder
lang: pt
source_version: 2
question: Com que dinheiro são principalmente pagas as escolas públicas na Suíça?
options:
  a: Com as propinas que os pais pagam todos os meses
  b: Com o dinheiro dos impostos do cantão e das comunas (Gemeinden)
  c: Com as receitas dos Correios e dos SBB
  d: Com as contribuições das seguradoras de saúde (Krankenkassen)
explanation: Segundo a Constituição Federal, a escola pública obrigatória é gratuita. É financiada com
  dinheiro dos impostos, sobretudo dos cantões e das comunas.
