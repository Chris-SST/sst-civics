id: bern-bundesstadt-landeshauptstadt
lang: pt
source_version: 1
question: Qual cidade assume na Suíça o papel de capital do país?
options:
  a: Berna
  b: Genebra
  c: Lausana
  d: Zurique
explanation: Berna é a sede do Conselho Federal (Bundesrat) e da Assembleia Federal (Bundesversammlung)
  e é designada como cidade federal. A Constituição Federal não menciona nenhuma capital, mas Berna assume
  esse papel. Zurique é a maior cidade, Lausana é a sede do Tribunal Federal (Bundesgericht).
