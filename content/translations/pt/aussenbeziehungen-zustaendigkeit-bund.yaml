id: aussenbeziehungen-zustaendigkeit-bund
lang: pt
source_version: 1
question: Quem é, em princípio, responsável na Suíça por moldar as relações com outros Estados?
options:
  a: A Conferência dos Governos Cantonais
  b: A Confederação
  c: Os cantões em conjunto
  d: As comunas (Gemeinden) situadas na fronteira
explanation: Segundo a Constituição Federal, a política externa é da competência da Confederação. Os cantões
  podem cooperar com o estrangeiro nas suas próprias áreas de competência, mas a responsabilidade global
  cabe à Confederação.
