id: schulpflicht-beginn-kindergarten-zuerich
lang: pt
source_version: 1
question: Com que começa, no cantão de Zurique, a escolaridade obrigatória de uma criança?
options:
  a: Com a entrada no ensino secundário (Sekundarschule)
  b: Com a entrada na escola primária (Primarschule)
  c: Com a entrada no grupo de jogos (Spielgruppe)
  d: Com a entrada no jardim de infância (Kindergarten)
explanation: No cantão de Zurique, o jardim de infância faz parte da escola pública obrigatória (Volksschule).
  Por isso, a escolaridade obrigatória começa já com a entrada no jardim de infância. O grupo de jogos
  é facultativo.
