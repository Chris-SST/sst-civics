id: referendum-gegen-parlamentsbeschluss
lang: pt
source_version: 1
question: Contra que decisões se dirige um referendo a nível federal?
options:
  a: Contra leis aprovadas pelo Conselho Nacional (Nationalrat) e pelo Conselho dos Estados (Ständerat)
  b: Contra decisões tomadas pela Chancelaria Federal (Bundeskanzlei)
  c: Contra sentenças proferidas pelo Tribunal Federal (Bundesgericht)
  d: Contra regulamentos emitidos por comunas (Gemeinden) individuais
explanation: Um referendo dirige-se contra leis aprovadas pelo Parlamento. O Parlamento é composto pelo
  Conselho Nacional e pelo Conselho dos Estados. As sentenças judiciais e as decisões administrativas
  não podem ser contestadas por meio de um referendo.
