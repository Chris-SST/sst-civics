    question_de: Gegen welche Entscheide richtet sich ein Referendum auf Bundesebene?
    options_de:
      a: Gegen Gesetze, die vom Nationalrat und vom Ständerat verabschiedet wurden
      b: Gegen Entscheide, die von der Bundeskanzlei getroffen wurden
      c: Gegen Urteile, die vom Bundesgericht gefällt wurden
      d: Gegen Verordnungen, die von einzelnen Gemeinden erlassen wurden
    explanation_de: Ein Referendum richtet sich gegen Gesetze, die vom Parlament verabschiedet wurden.
      Das Parlament besteht aus dem Nationalrat und dem Ständerat. Gerichtsurteile und Verwaltungsentscheide
      können nicht mittels eines Referendums angefochten werden.
