id: zivilgesetzbuch-ehe-scheidung-regeln
lang: pt
source_version: 1
question: Qual lei regula, entre outras matérias, como um casamento é celebrado e como é dissolvido por
  divórcio?
options:
  a: O Código Civil
  b: O Código Penal
  c: A Lei do Asilo
  d: A Lei do Tribunal Federal (Bundesgerichtsgesetz)
explanation: O Código Civil regula o direito das pessoas, o direito da família, o direito das sucessões
  e os direitos reais. Isso inclui também a celebração do casamento e o divórcio. O Código Penal, por
  sua vez, trata das infrações penais e das penas.
