id: unfallversicherung-spitalkosten-arbeitsunfall
lang: pt
source_version: 1
question: Uma trabalhadora sofre um acidente grave no trabalho e tem de ser internada no hospital. Qual
  seguro cobre as despesas hospitalares?
options:
  a: O seguro de desemprego
  b: O seguro de acidentes
  c: O regime de compensação de perda de rendimento (Erwerbsersatzordnung)
  d: O seguro de velhice e sobrevivência
explanation: O seguro de acidentes obrigatório paga, em caso de acidentes profissionais, os custos de
  tratamento, ou seja, por exemplo, as despesas hospitalares. Os trabalhadores estão segurados contra
  esse risco através da entidade empregadora. Os outros seguros mencionados cobrem outros riscos.
