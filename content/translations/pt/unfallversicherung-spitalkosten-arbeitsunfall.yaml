    question_de: Eine Arbeitnehmerin erleidet bei der Arbeit einen schweren Unfall und muss ins Spital
      eingewiesen werden. Welche Versicherung deckt die Spitalkosten?
    options_de:
      a: Die Arbeitslosenversicherung
      b: Die Unfallversicherung
      c: Die Erwerbsersatzordnung
      d: Die Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt bei Berufsunfällen die Behandlungskosten,
      das heisst zum Beispiel die Spitalkosten. Die Arbeitnehmer sind über die Arbeitgeberin gegen dieses
      Risiko versichert. Die anderen genannten Versicherungen decken andere Risiken.
