question: Qual figura simbólica está representada na moeda de dois francos?
options:
  a: O Matterhorn
  b: Helvetia
  c: Guilherme Tell
  d: Um membro do Conselho Federal (Bundesrat) suíço
explanation: Na moeda suíça de dois francos vê-se Helvetia, a figura simbólica feminina da Confederação
