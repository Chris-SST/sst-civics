id: bundesstaat-1848-neue-verfassung
lang: pt
source_version: 1
question: O que surgiu na Suíça em 1848?
options:
  a: A República Helvética com um governo central
  b: A confederação de Estados sob supervisão francesa
  c: O Estado federal moderno com uma nova constituição
  d: A Confederação dos três cantões primitivos
explanation: Em 1848, os cantões deram a si próprios uma Constituição Federal e fundaram o Estado federal
  moderno. Este uniu tarefas comuns da Confederação à autonomia dos cantões. Esta constituição é a base
  da Suíça atual.
