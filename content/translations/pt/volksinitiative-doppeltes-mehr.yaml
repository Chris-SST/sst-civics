id: volksinitiative-doppeltes-mehr
lang: pt
source_version: 2
question: O que precisa uma iniciativa popular (Volksinitiative) federal para ser aceite na votação?
options:
  a: O sim de dois terços dos votantes
  b: O sim do Conselho Federal (Bundesrat) e da maioria dos votantes
  c: O sim da maioria dos votantes e da maioria dos cantões
  d: Apenas o sim da maioria dos votantes
explanation: 'Uma iniciativa popular federal quer alterar a Constituição Federal. Por isso precisa da
  dupla maioria: a maioria dos votantes (maioria do povo, Volksmehr) e a maioria dos cantões (maioria
  dos cantões, Ständemehr) têm de dizer sim. Numa iniciativa cantonal no cantão de Zurique, pelo contrário,
  basta a maioria dos votantes.'
