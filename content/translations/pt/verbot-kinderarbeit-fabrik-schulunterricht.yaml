id: verbot-kinderarbeit-fabrik-schulunterricht
lang: pt
source_version: 1
question: O que a proibição do trabalho infantil nas fábricas, em 1877, devia garantir sobretudo?
options:
  a: Que as fábricas pudessem pagar salários mais baixos
  b: Que as crianças pudessem frequentar a escola
  c: Que as crianças tivessem de ajudar mais cedo nas tarefas domésticas
  d: Que as fábricas contratassem mais mão de obra do estrangeiro
explanation: A Lei das Fábricas de 1877 proibiu o trabalho das crianças nas fábricas. Elas deviam frequentar
  a escola em vez de trabalhar. A lei protegia também a saúde dos trabalhadores.
