id: regierungsgewalt-des-bundes-beim-bundesrat
lang: pt
source_version: 1
question: Qual autoridade exerce o poder governamental supremo a nível da Confederação?
options:
  a: O Conselho Federal (Bundesrat)
  b: O Conselho Nacional (Nationalrat)
  c: A Chancelaria Federal (Bundeskanzlei)
  d: O Tribunal Federal (Bundesgericht)
explanation: Segundo a Constituição Federal, o Conselho Federal é a autoridade suprema de direção e execução
  da Confederação. O Parlamento faz as leis, o Tribunal Federal administra a justiça.
