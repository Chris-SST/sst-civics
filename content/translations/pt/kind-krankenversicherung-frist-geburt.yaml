id: kind-krankenversicherung-frist-geburt
lang: pt
source_version: 1
question: Em que prazo, a contar do nascimento, deve existir um seguro de saúde para uma criança residente
  na Suíça?
options:
  a: no prazo de 12 meses
  b: no prazo de 3 meses
  c: no prazo de 14 dias
  d: no prazo de 6 meses
explanation: Os pais devem contratar um seguro de saúde para a criança no prazo de três meses após o nascimento.
  Se o prazo for respeitado, a cobertura do seguro vigora retroativamente a partir do nascimento.
