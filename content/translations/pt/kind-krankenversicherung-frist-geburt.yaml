    question_de: Innerhalb welcher Frist, gerechnet ab der Geburt, muss für ein in der Schweiz wohnhaftes
      Kind eine Krankenversicherung bestehen?
    options_de:
      a: innerhalb von 12 Monaten
      b: innerhalb von 3 Monaten
      c: innerhalb von 14 Tagen
      d: innerhalb von 6 Monaten
    explanation_de: Die Eltern müssen innerhalb von drei Monaten nach der Geburt eine Krankenversicherung
