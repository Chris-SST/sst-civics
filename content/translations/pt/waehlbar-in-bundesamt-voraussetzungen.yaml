id: waehlbar-in-bundesamt-voraussetzungen
lang: pt
source_version: 2
question: Quem pode ser eleito para o Conselho Nacional (Nationalrat), para o Conselho Federal (Bundesrat)
  ou para o Tribunal Federal (Bundesgericht)?
options:
  a: Apenas quem concluiu um curso superior
  b: Apenas quem vive na Suíça há pelo menos dez anos
  c: Apenas quem é membro de um partido político
  d: Todos os cidadãos suíços com direito de voto a partir dos 18 anos
explanation: Segundo a Constituição Federal, todas as pessoas com direito de voto são elegíveis. Têm direito
  de voto os cidadãos suíços a partir dos 18 anos. Não é necessário ser membro de um partido nem ter uma
  formação específica.
