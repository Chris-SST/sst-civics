    question_de: Wer kann in den Nationalrat, in den Bundesrat oder ins Bundesgericht gewählt werden?
    options_de:
      a: Nur wer ein Hochschulstudium abgeschlossen hat
      b: Nur wer seit mindestens zehn Jahren in der Schweiz lebt
      c: Nur wer Mitglied einer politischen Partei ist
      d: Alle Schweizer Bürgerinnen und Bürger mit Stimmrecht ab 18 Jahren
    explanation_de: Gemäss der Bundesverfassung sind alle stimmberechtigten Personen wählbar. Stimmberechtigt
      sind die Schweizer Bürgerinnen und Bürger ab 18 Jahren. Es ist weder nötig, Mitglied einer Partei
      zu sein, noch eine bestimmte Ausbildung zu haben.
