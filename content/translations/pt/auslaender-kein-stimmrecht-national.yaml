id: auslaender-kein-stimmrecht-national
lang: pt
source_version: 1
question: Os estrangeiros que vivem na Suíça há anos podem participar em votações federais?
options:
  a: Sim, mas apenas em votações e não em eleições.
  b: Sim, se tiverem uma autorização de estabelecimento (Niederlassungsbewilligung, autorização C).
  c: Sim, se pagarem impostos.
  d: Não, a nível nacional não têm direito de voto.
explanation: O direito de voto a nível nacional está ligado à cidadania (Bürgerrecht) suíça. Os estrangeiros
  só podem exercê-lo após uma naturalização.
