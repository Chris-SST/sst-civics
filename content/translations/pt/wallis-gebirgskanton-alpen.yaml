question: Qual destes cantões é fortemente marcado pela montanha?
options:
  a: Basileia-Cidade
  b: Valais
  c: Turgóvia
  d: Genebra
explanation: No Valais encontram-se muitos picos alpinos elevados, entre eles a Dufourspitze, a montanha
  mais alta da Suíça. A Turgóvia, Basileia-Cidade e Genebra situam-se mais em zonas planas ou junto a
  lagos e rios.
