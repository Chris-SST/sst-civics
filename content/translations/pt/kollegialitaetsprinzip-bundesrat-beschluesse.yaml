id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: pt
source_version: 1
question: O que significa o princípio da colegialidade no Conselho Federal (Bundesrat)?
options:
  a: A Presidente ou o Presidente da Confederação (Bundespräsident) decide sozinho.
  b: Os membros defendem de forma unitária, perante o exterior, as decisões do Conselho Federal.
  c: Cada membro decide no seu departamento sem consultar os outros.
  d: Os membros podem defender publicamente a sua opinião divergente.
explanation: O Conselho Federal decide como colégio. Mesmo quem defendeu uma opinião diferente no Conselho
  Federal apoia a decisão perante o exterior. Assim, o governo apresenta-se de forma unida.
