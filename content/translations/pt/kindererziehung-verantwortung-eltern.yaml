id: kindererziehung-verantwortung-eltern
lang: pt
source_version: 1
question: Quem é o principal responsável pela educação das crianças na Suíça?
options:
  a: A comuna (Gemeinde)
  b: Os pais
  c: A escola
  d: O cantão
explanation: Segundo o Código Civil, os pais zelam pelo bem-estar da criança e dirigem a sua educação.
  A escola complementa esta tarefa com o ensino. O Estado só intervém quando o bem-estar da criança está
  em risco.
