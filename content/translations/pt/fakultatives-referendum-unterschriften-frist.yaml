id: fakultatives-referendum-unterschriften-frist
lang: pt
source_version: 1
question: Quantas assinaturas são necessárias para que um referendo facultativo contra uma lei federal
  seja validado, e em que prazo?
options:
  a: 50 000 assinaturas no prazo de 18 meses
  b: 50 000 assinaturas no prazo de 100 dias
  c: 100 000 assinaturas no prazo de 30 dias
  d: 100 000 assinaturas no prazo de 100 dias
explanation: Para um referendo facultativo são necessárias 50 000 assinaturas válidas no prazo de 100
  dias após a publicação da lei na Folha Federal (Bundesblatt). Se o referendo for validado, o povo vota
  sobre a lei.
