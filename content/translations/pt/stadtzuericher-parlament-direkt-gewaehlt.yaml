id: stadtzuericher-parlament-direkt-gewaehlt
lang: pt
source_version: 1
question: Como é constituído o parlamento da cidade de Zurique, o conselho municipal (Gemeinderat)?
options:
  a: O Conselho de Governo (Regierungsrat) do cantão (Kanton) nomeia-o
  b: A Câmara Municipal (Stadtrat) determina ela própria os membros
  c: Os partidos sorteiam os lugares entre si
  d: A população elege-o diretamente nas urnas
explanation: Os eleitores da cidade de Zurique elegem o conselho municipal em eleições gerais. Ele é o
  parlamento da cidade e substitui a assembleia municipal (Gemeindeversammlung).
