    question_de: Wie setzt sich das Parlament der Stadt Zürich, der Gemeinderat, zusammen?
    options_de:
      a: Der Regierungsrat des Kantons ernennt ihn
      b: Der Stadtrat bestimmt die Mitglieder selbst
      c: Die Parteien losen die Sitze untereinander aus
      d: Die Bevölkerung wählt ihn direkt an der Urne
    explanation_de: Die Wählerinnen und Wähler der Stadt Zürich wählen den Gemeinderat in allgemeinen
