id: abkuerzung-mwst-bedeutung
lang: pt
source_version: 1
question: Em faturas e recibos aparece frequentemente a abreviatura «MWST». O que significa?
options:
  a: Imposto sobre apartamentos arrendados (Mietwohnungssteuer)
  b: Imposto de defesa militar (Militärwehrsteuer)
  c: Imposto sobre veículos a motor (Motorwagensteuer)
  d: Imposto sobre o valor acrescentado (Mehrwertsteuer)
explanation: MWST significa Mehrwertsteuer, ou seja, imposto sobre o valor acrescentado. É cobrado sobre
  a maior parte dos bens e serviços e está incluído no preço. É uma importante fonte de receitas da Confederação.
