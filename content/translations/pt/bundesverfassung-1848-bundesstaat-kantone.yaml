question: O que mudou para a Suíça com a Constituição Federal de 1848?
options:
  a: Voltou a ser uma confederação de Estados pouco coesa
  b: Tornou-se uma monarquia com um rei
  c: Tornou-se um Estado federal, no qual os cantões continuam a ser autónomos
  d: Tornou-se um Estado unitário sem cantões
explanation: Em 1848 surgiu o Estado federal moderno, com instituições comuns. Os cantões mantiveram,
  porém, atribuições próprias e uma estatalidade própria. Esta repartição marca a Suíça até hoje.
