id: sozialhilfe-bei-ungenuegendem-einkommen
lang: pt
source_version: 1
question: O que oferece a comuna (Gemeinde) quando o rendimento e o património de uma pessoa não são suficientes
  para viver?
options:
  a: Apoio social
  b: Uma licença de construção
  c: Uma naturalização
  d: Uma bolsa de estudo da escola obrigatória
explanation: Quem não consegue pagar o seu sustento com meios próprios tem direito a apoio através da
  assistência social. Esta é prestada pela comuna em que a pessoa reside. É a última rede da segurança
  social.
