id: neue-bundesgesetze-beschluss-kammern
lang: pt
source_version: 1
question: Quem aprova a maioria das novas leis federais?
options:
  a: O Tribunal Federal (Bundesgericht)
  b: Apenas o Conselho Federal (Bundesrat)
  c: Os parlamentos cantonais
  d: O Conselho Nacional (Nationalrat) e o Conselho dos Estados (Ständerat)
explanation: A maioria das novas leis federais é aprovada pelas duas câmaras do Parlamento. O Conselho
  Federal prepara os projetos, mas não decide sozinho. Contra uma lei, o povo pode lançar um referendo.
