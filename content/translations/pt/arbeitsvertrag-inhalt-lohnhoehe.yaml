    question_de: Was wird unter anderem im Arbeitsvertrag zwischen dem Arbeitgeber und der Arbeitnehmerin
      festgelegt?
    options_de:
      a: Die Höhe des Lohns
      b: Die Höhe der Rente der Alters- und Hinterlassenenversicherung (AHV)
      c: Die Höhe der Mehrwertsteuer
      d: Die Höhe der Prämie der Krankenversicherung (Krankenkasse)
    explanation_de: Im Arbeitsvertrag werden die wichtigsten Arbeitsbedingungen vereinbart, zum Beispiel
      die Tätigkeit, die Arbeitszeit und der Lohn. Die Rente der Alters- und Hinterlassenenversicherung,
      die Mehrwertsteuer und die Prämie der Krankenversicherung werden nicht im Arbeitsvertrag festgelegt.
