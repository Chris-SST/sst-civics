id: arbeitsvertrag-inhalt-lohnhoehe
lang: pt
source_version: 1
question: O que é definido, entre outras coisas, no contrato de trabalho entre o empregador e a trabalhadora?
options:
  a: O montante do salário
  b: O montante da pensão do seguro de velhice e sobrevivência (AHV)
  c: O montante do imposto sobre o valor acrescentado
  d: O montante do prémio da seguradora de saúde (Krankenkasse)
explanation: No contrato de trabalho são acordadas as condições mais importantes do trabalho, por exemplo
  a atividade, o horário de trabalho e o salário. A pensão do seguro de velhice e sobrevivência, o imposto
  sobre o valor acrescentado e o prémio da seguradora de saúde não são determinados no contrato de trabalho.
