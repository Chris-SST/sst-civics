id: ahv-iv-sozialversicherungen-schweiz
lang: pt
source_version: 1
question: Qual afirmação sobre os seguros sociais da Suíça está correta?
options:
  a: O seguro de velhice e sobrevivência (AHV) e o seguro de invalidez (IV) fazem parte dos seguros sociais
    da Suíça.
  b: O seguro de velhice e sobrevivência e o seguro de invalidez são geridos apenas pelas comunas (Gemeinden).
  c: O seguro de velhice e sobrevivência e o seguro de invalidez são seguros privados, sem base legal.
  d: O seguro de velhice e sobrevivência e o seguro de invalidez destinam-se apenas a trabalhadores independentes.
explanation: AHV significa seguro de velhice e sobrevivência (Alters- und Hinterlassenenversicherung),
  IV significa seguro de invalidez (Invalidenversicherung). Ambos estão regulados no direito federal e
  fazem parte do sistema estatal de seguros sociais.
