    question_de: Welche Aussage über die Sozialversicherungen der Schweiz ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung (IV) gehören zu
        den Sozialversicherungen der Schweiz.
      b: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung werden nur von den Gemeinden
        verwaltet.
      c: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung sind private Versicherungen
        ohne gesetzliche Grundlage.
      d: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung sind nur für Selbstständigerwerbende
        bestimmt.
    explanation_de: AHV bedeutet Alters- und Hinterlassenenversicherung, IV bedeutet Invalidenversicherung.
      Beide sind im Bundesrecht geregelt und gehören zum staatlichen System der Sozialversicherungen.
