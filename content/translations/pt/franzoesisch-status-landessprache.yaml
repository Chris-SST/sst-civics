id: franzoesisch-status-landessprache
lang: pt
source_version: 1
question: Que estatuto tem o francês na Suíça?
options:
  a: O francês é apenas uma língua estrangeira na escola.
  b: O francês é apenas uma língua regional de comunicação.
  c: O francês é uma língua nacional.
  d: O francês é uma língua minoritária sem estatuto oficial.
explanation: O francês é uma das línguas nacionais da Suíça. É falado sobretudo na Suíça Ocidental (Romandia)
  e é uma língua oficial ao nível da Confederação.
