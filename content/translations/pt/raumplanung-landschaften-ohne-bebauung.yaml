    source_version: 2
    question_de: Was ist ein Ziel der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll die unbebauten Landschaften schützen und den Boden haushälterisch nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis des Baulandes bestimmen.
    explanation_de: Die Raumplanung bestimmt, wo gebaut werden darf und wo nicht. Sie trennt die Bauzone
      von der Nichtbauzone, damit die Landschaften und das Landwirtschaftsland erhalten bleiben. Da der
      Boden knapp ist, soll er haushälterisch genutzt werden und es sollen vorzugsweise die bestehenden
      Siedlungen verdichtet werden, anstatt neue Bauzonen zu schaffen.
