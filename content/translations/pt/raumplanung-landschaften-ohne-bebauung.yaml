id: raumplanung-landschaften-ohne-bebauung
lang: pt
source_version: 2
question: Qual é um objetivo do ordenamento do território na Suíça?
options:
  a: Deve proteger as paisagens não edificadas e utilizar o solo de forma económica.
  b: Deve redefinir regularmente as fronteiras entre os cantões.
  c: Deve criar o maior número possível de novas zonas de construção.
  d: Deve determinar o preço dos terrenos para construção.
explanation: O ordenamento do território determina onde se pode construir e onde não. Separa a zona edificável
  da zona não edificável, para que as paisagens e os terrenos agrícolas sejam preservados. Como o solo
  é escasso, deve utilizar-se de forma económica e, de preferência, densificar os aglomerados existentes,
  em vez de criar novas zonas de construção.
