id: wasserkraft-stromproduktion-schweiz
lang: pt
source_version: 1
question: A Suíça tem água em abundância. Como é que ela é utilizada para a produção de eletricidade?
options:
  a: Em centrais a gás
  b: Em refinarias de petróleo
  c: Em centrais hidroelétricas
  d: Em centrais a carvão
explanation: A água dos rios e das albufeiras faz funcionar as turbinas nas centrais hidroelétricas. Na
  Suíça, a energia hidroelétrica é uma fonte nacional central de eletricidade.
