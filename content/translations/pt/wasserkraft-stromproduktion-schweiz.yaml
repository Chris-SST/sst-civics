    question_de: Die Schweiz hat im Überfluss Wasser. Wie wird es für die Stromerzeugung genutzt?
    options_de:
      a: In Gaskraftwerken
      b: In Erdölraffinerien
      c: In Wasserkraftwerken
      d: In Kohlekraftwerken
