id: notruf-polizei-nummer
lang: pt
source_version: 1
question: Que número de telefone se marca na Suíça quando, numa emergência, se precisa da polícia?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: A polícia pode ser contactada em toda a Suíça através do número 117. Os bombeiros têm o 118
  e o serviço de emergência médica, o 144. O 143 é o número da «Dargebotene Hand», para pessoas em situação
  de crise.
