id: auslaender-anzahl-schweiz-2020
lang: pt
source_version: 1
question: Quantas pessoas sem passaporte suíço residiam, em 2020, de forma permanente na Suíça, aproximadamente?
options:
  a: cerca de 2,1 milhões
  b: cerca de 0,8 milhão
  c: cerca de 3,5 milhões
  d: cerca de 1,4 milhão
explanation: No final de 2020, viviam na Suíça cerca de 2,1 milhões de estrangeiros e estrangeiras. Eles
  fazem parte da população residente permanente. Os números são publicados pelo Gabinete Federal de Estatística
  (Bundesamt für Statistik).
