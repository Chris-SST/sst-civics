id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: pt
source_version: 1
question: Como se compõe a Suíça enquanto Estado federal?
options:
  a: De distritos como Estados membros
  b: De regiões linguísticas como Estados membros
  c: De cantões como Estados membros
  d: De regiões como Estados membros
explanation: A Suíça é um Estado federal. Os cantões são os seus Estados membros e têm uma constituição
  própria, um parlamento próprio e um governo próprio. Os distritos e as regiões não são Estados membros.
