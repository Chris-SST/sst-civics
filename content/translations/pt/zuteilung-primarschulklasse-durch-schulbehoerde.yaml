id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: pt
source_version: 3
question: Quem decide, no cantão de Zurique, a que turma do ensino primário uma criança é atribuída?
options:
  a: O conselho escolar (Schulpflege) ou a direção da escola
  b: O departamento da educação da Confederação
  c: A assembleia municipal (Gemeindeversammlung)
  d: Os pais da criança
explanation: O conselho escolar ou a direção da escola atribui as crianças às turmas. Os pais não podem
  escolher livremente a turma. Assim, a escola organiza o seu funcionamento e o tamanho das turmas.
