question: Em que instituição do cantão de Zurique os visitantes podem tocar e experimentar eles próprios
  fenómenos científicos e técnicos?
options:
  a: Na Ópera de Zurique (Opernhaus Zürich)
  b: No Technorama de Winterthur
  c: No Museu Nacional Suíço de Zurique (Landesmuseum Zürich)
  d: No Kunsthaus de Zurique
explanation: O Technorama de Winterthur é um centro de ciência. Aí, os visitantes experimentam eles próprios
  nos objetos expostos. O Kunsthaus, o Museu Nacional Suíço e a Ópera mostram arte, história e espetáculos.
