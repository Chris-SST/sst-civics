question: Como foi a situação económica da Suíça nas décadas posteriores à Segunda Guerra Mundial, por
  exemplo, nos anos 1960?
options:
  a: 'Foi melhorando cada vez mais: havia muito trabalho e o bem-estar de muitas pessoas aumentou.'
  b: A economia encolheu fortemente e muitas pessoas ficaram desempregadas.
  c: A Suíça tornou-se membro da União Europeia.
  d: A Suíça já não precisava de mão de obra do estrangeiro.
explanation: Depois da Segunda Guerra Mundial, a economia suíça cresceu fortemente. Havia muito trabalho
  e muitas pessoas passaram a poder permitir-se mais. Por isso, as empresas foram buscar muita mão de
  obra ao estrangeiro, sobretudo à Itália, no início.
