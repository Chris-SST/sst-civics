id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: pt
source_version: 1
question: Como é que os eleitores na Suíça influenciam diretamente a legislação da Confederação?
options:
  a: Votam nas urnas sobre iniciativas e referendos.
  b: Elegem os juízes que decidem sobre as novas leis.
  c: Nomeiam os conselheiros federais, que aprovam as novas leis.
  d: Aprovam eles próprios as leis na Assembleia Federal (Bundesversammlung).
explanation: Os eleitores participam em votações populares sobre iniciativas e referendos e decidem aí
  em conjunto. Assim, entre as eleições, participam diretamente na legislação. Isto é uma característica
  da democracia direta.
