    question_de: Wie beeinflussen die Stimmberechtigten in der Schweiz die Gesetzgebung des Bundes direkt?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über die neuen Gesetze entscheiden.
      c: Sie ernennen die Bundesräte, die die neuen Gesetze verabschieden.
      d: Sie verabschieden die Gesetze selbst in der Bundesversammlung.
    explanation_de: Die Stimmberechtigten nehmen an Volksabstimmungen über Initiativen und Referenden
      teil und entscheiden dort gemeinsam. So beteiligen sie sich zwischen den Wahlen direkt an der Gesetzgebung.
      Das ist ein Merkmal der direkten Demokratie.
