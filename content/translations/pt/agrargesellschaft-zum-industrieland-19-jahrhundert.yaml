id: agrargesellschaft-zum-industrieland-19-jahrhundert
lang: pt
source_version: 1
question: Como mudou a Suíça do ponto de vista económico no século XIX?
options:
  a: Vivia sobretudo do comércio com colónias.
  b: Até 1900, manteve-se quase exclusivamente um país de agricultores.
  c: Passou de país industrial a sociedade agrária.
  d: Passou de sociedade agrária a país industrial.
explanation: No século XIX, o trabalho deixou a agricultura e passou para as fábricas. Novas vias de transporte,
  como o caminho de ferro, apoiaram essa mudança. Assim, o país agrário tornou-se um país industrial.
