id: urnengang-bund-immer-sonntag
lang: pt
source_version: 1
question: Em que dia da semana se realizam as votações e eleições federais na Suíça?
options:
  a: Sempre a um domingo
  b: Sempre a um sábado
  c: Sempre a uma sexta-feira
  d: Num dia da semana que cada cantão escolhe por si próprio
explanation: As votações nas urnas a nível da Confederação realizam-se sempre num domingo. Assim, o maior
  número possível de pessoas com direito de voto pode participar, e a data é a mesma para todos.
