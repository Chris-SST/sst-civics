id: rav-aufgabe-stellensuchende-unterstuetzen
lang: pt
source_version: 1
question: Qual é a função do Centro Regional de Colocação (RAV)?
options:
  a: Controla os salários nas empresas
  b: Paga uma pensão a todos os habitantes
  c: Apoia as pessoas à procura de emprego na sua busca de trabalho e encaminha-as para vagas
  d: Emite certificados de trabalho para as pessoas à procura de emprego
explanation: O RAV é o ponto de contacto regional para as pessoas à procura de emprego. Aconselha-as e
  encaminha-as para vagas. No cantão de Zurique, pertence ao Serviço do Trabalho (Amt für Arbeit).
