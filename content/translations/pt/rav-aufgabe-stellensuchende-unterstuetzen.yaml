    question_de: Welche Aufgabe hat das Regionale Arbeitsvermittlungszentrum (RAV)?
    options_de:
      a: Es kontrolliert die Löhne in den Unternehmen
      b: Es zahlt allen Einwohnern eine Rente
      c: Es unterstützt Stellensuchende bei der Arbeitssuche und weist ihnen offene Stellen zu
      d: Es stellt Stellensuchenden Arbeitszeugnisse aus
    explanation_de: Das RAV ist die regionale Anlaufstelle für Stellensuchende. Es berät sie und weist
