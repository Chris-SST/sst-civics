id: krankenkasse-freie-wahl-versicherte
lang: pt
source_version: 1
question: Na Suíça, quem decide em qual seguradora de saúde (Krankenkasse) uma pessoa contrata o seguro
  básico?
options:
  a: A comuna de residência determina a seguradora de saúde
  b: A própria pessoa segurada escolhe a sua seguradora de saúde
  c: O empregador determina a seguradora de saúde para todos os funcionários
  d: O cantão de residência atribui uma seguradora de saúde a cada pessoa
explanation: Na Suíça vigora a livre escolha da seguradora de saúde. As pessoas seguradas podem escolher
  entre as seguradoras de saúde autorizadas e, sob determinadas condições, mudar de seguradora.
