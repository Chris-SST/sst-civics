    question_de: Was versteht man unter den Begriffen «Romandie» oder «Welschland»?
    options_de:
      a: Den italienischsprachigen Teil der Schweiz
      b: Den französischsprachigen Teil der Schweiz
      c: Den rätoromanischsprachigen Teil der Schweiz
