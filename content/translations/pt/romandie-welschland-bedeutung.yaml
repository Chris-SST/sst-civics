id: romandie-welschland-bedeutung
lang: pt
source_version: 1
question: O que se entende pelos termos «Romandia» ou «Welschland»?
options:
  a: A parte da Suíça de língua italiana
  b: A parte da Suíça de língua francesa
  c: A parte da Suíça de língua reto-românica
  d: A parte da Suíça de língua alemã
explanation: Com Romandia ou Welschland designam-se as regiões da Suíça onde se fala francês. Fazem parte
  delas, por exemplo, os cantões de Genebra e Vaud. A parte de língua italiana é sobretudo o Tessino.
