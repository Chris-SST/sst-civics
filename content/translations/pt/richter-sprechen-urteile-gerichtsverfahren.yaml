id: richter-sprechen-urteile-gerichtsverfahren
lang: pt
source_version: 1
question: Quem pronuncia a sentença num processo judicial?
options:
  a: A juíza ou o juiz
  b: A polícia ou o polícia
  c: A presidente da comuna (Gemeinde) ou o presidente da comuna
  d: A procuradora ou o procurador do Ministério Público
explanation: As juízas e os juízes decidem de forma independente nos processos judiciais e proferem a
  sentença. O Ministério Público conduz a investigação e deduz a acusação. A polícia investiga, mas não
  julga.
