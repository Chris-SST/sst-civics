id: primarschule-traegerschaft-gemeinde-zuerich
lang: pt
source_version: 2
question: Quem gere, no cantão de Zurique, as escolas do ensino primário?
options:
  a: A Direção da Educação do cantão
  b: A Confederação
  c: As comunas (Gemeinden)
  d: Os distritos
explanation: No cantão de Zurique, as comunas gerem as escolas primárias. Dependendo da localidade, trata-se
  das comunas políticas ou de comunas escolares próprias, e o conselho escolar eleito (Schulpflege) é
  a autoridade escolar local. O cantão apenas define o quadro geral, por exemplo o plano de estudos, e
  supervisiona a escola pública.
