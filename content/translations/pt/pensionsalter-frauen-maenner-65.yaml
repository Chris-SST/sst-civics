id: pensionsalter-frauen-maenner-65
lang: pt
source_version: 3
question: Qual é a idade de reforma (hoje chamada «idade de referência») que se aplica, a partir de 2028,
  a mulheres e homens no seguro de velhice e sobrevivência (AHV)?
options:
  a: Mulheres 64 anos, homens 65 anos
  b: Mulheres e homens 65 anos
  c: Mulheres e homens 63 anos
  d: Mulheres e homens 67 anos
explanation: Desde a reforma AHV 21, a idade de reforma chama-se oficialmente «idade de referência». A
  partir de 2025, para as mulheres aumenta três meses por ano, até atingir os 65 anos. A partir de 2028,
  mulheres e homens têm a mesma idade de referência de 65 anos.
