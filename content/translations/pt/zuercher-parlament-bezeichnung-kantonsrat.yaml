id: zuercher-parlament-bezeichnung-kantonsrat
lang: pt
source_version: 1
question: Como se chama o parlamento do cantão de Zurique?
options:
  a: Grosser Rat
  b: Landrat
  c: Conselho municipal (Gemeinderat)
  d: Conselho Cantonal (Kantonsrat)
explanation: O parlamento do cantão de Zurique chama-se Conselho Cantonal. Outros cantões usam outras
  designações, por exemplo Grosser Rat ou Landrat. O conselho municipal, por sua vez, é uma autoridade
  ao nível da comuna (Gemeinde).
