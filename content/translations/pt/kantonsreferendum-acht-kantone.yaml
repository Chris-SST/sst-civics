    question_de: Wer kann neben 50 000 Stimmberechtigten ebenfalls ein fakultatives Referendum gegen ein
      Bundesgesetz verlangen?
    options_de:
      a: Acht Kantone
      b: Drei grosse Parteien gemeinsam
      c: Der Bundesrat
      d: Das Bundesgericht
    explanation_de: Gemäss der Bundesverfassung können auch acht Kantone eine Volksabstimmung über ein
      Bundesgesetz verlangen. Dies nennt man Kantonsreferendum. Es wird selten genutzt, zeigt aber, dass
      die Kantone im Bundesstaat Mitwirkungsrechte haben.
