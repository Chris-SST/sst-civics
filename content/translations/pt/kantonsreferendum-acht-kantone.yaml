id: kantonsreferendum-acht-kantone
lang: pt
source_version: 1
question: Quem pode, além de 50 000 cidadãos com direito de voto, exigir igualmente um referendo facultativo
  contra uma lei federal?
options:
  a: Oito cantões
  b: Três grandes partidos em conjunto
  c: O Conselho Federal (Bundesrat)
  d: O Tribunal Federal (Bundesgericht)
explanation: Segundo a Constituição Federal, também oito cantões podem exigir uma votação popular sobre
  uma lei federal. Isto chama-se referendo cantonal (Kantonsreferendum). É raramente utilizado, mas mostra
  que os cantões têm direitos de participação no Estado federal.
