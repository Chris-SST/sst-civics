id: zuerich-zwei-staenderaete
lang: pt
source_version: 1
question: Quantos representantes o cantão de Zurique envia ao Conselho dos Estados (Ständerat)?
options:
  a: Um representante
  b: Quatro representantes
  c: Seis representantes
  d: Dois representantes
explanation: O cantão de Zurique é um cantão pleno e tem dois assentos no Conselho dos Estados. Os membros
  do Conselho dos Estados são eleitos pelo eleitorado do cantão. Apenas os meios-cantões têm um representante
  cada.
