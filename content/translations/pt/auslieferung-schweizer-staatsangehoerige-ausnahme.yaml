id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: pt
source_version: 2
question: O que se aplica, em princípio, à extradição de cidadãos suíços para o estrangeiro?
options:
  a: São extraditados a pedido de qualquer Estado.
  b: Não são extraditados para outro Estado contra a sua vontade. Podem, no entanto, ser entregues a um
    tribunal internacional.
  c: Só são extraditados para Estados vizinhos da Suíça.
  d: São extraditados se o Conselho Federal (Bundesrat) assim o quiser num caso concreto.
explanation: Segundo o artigo 25 da Constituição Federal, os cidadãos suíços não podem ser expulsos. Só
  podem ser extraditados para outro Estado se eles próprios o consentirem. Um tribunal internacional,
  por exemplo o Tribunal Penal Internacional, não é uma autoridade estrangeira; por isso, uma lei federal
  permite entregar-lhe cidadãos suíços para efeitos de um processo.
