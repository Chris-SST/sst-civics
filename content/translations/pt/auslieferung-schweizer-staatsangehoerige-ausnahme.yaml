    question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Bürgerinnen und Bürgern ins
      Ausland?
    options_de:
      a: Sie werden auf Ersuchen jedes Staates ausgeliefert.
      b: Sie werden nicht gegen ihren Willen an einen anderen Staat ausgeliefert. Sie können jedoch an
        ein internationales Gericht überstellt werden.
      c: Sie werden nur an Nachbarstaaten der Schweiz ausgeliefert.
      d: Sie werden ausgeliefert, wenn der Bundesrat dies in einem konkreten Fall so will.
    explanation_de: Gemäss Artikel 25 der Bundesverfassung dürfen Schweizer Bürgerinnen und Bürger nicht
      aus der Schweiz ausgewiesen werden. Sie dürfen nur an einen anderen Staat ausgeliefert werden, wenn
      sie selbst zustimmen. Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof,
      ist keine ausländische Behörde; deshalb erlaubt ein Bundesgesetz, ihm Schweizer Bürgerinnen und
      Bürger für die Zwecke eines Verfahrens zu überstellen.
