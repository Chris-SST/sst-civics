id: nationalhymne-schweizerpsalm
lang: pt
source_version: 1
question: Qual é o nome do hino nacional da Suíça?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Schweizerpsalm
explanation: O hino nacional da Suíça é o Schweizerpsalm. O Conselho Federal (Bundesrat) declarou-o definitivamente
  hino nacional em 1981. Antes disso, cantava-se frequentemente «Rufst du, mein Vaterland».
