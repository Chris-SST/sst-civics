    question_de: Wer gilt in der Schweiz als Grenzgängerin oder Grenzgänger?
    options_de:
      a: Eine Person, die in der Schweiz arbeitet, aber ihren Wohnsitz im Ausland hat und regelmässig
        dorthin zurückkehrt
      b: Eine Person, die beim Zoll arbeitet und die Grenze des Landes kontrolliert
      c: Eine Person, die die Grenze ohne Bewilligung überquert, um hier zu arbeiten
      d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
    explanation_de: Grenzgängerinnen und Grenzgänger haben ihren Arbeitsort in der Schweiz, leben aber
      in einem anderen Land. Sie benötigen eine Grenzgängerbewilligung und kehren regelmässig, mindestens
      einmal pro Woche, an ihren Wohnort im Ausland zurück. Wer sich nur zwischen zwei Kantonen bewegt,
      ist keine Grenzgängerin und kein Grenzgänger.
