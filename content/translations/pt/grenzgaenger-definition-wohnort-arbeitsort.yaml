id: grenzgaenger-definition-wohnort-arbeitsort
lang: pt
source_version: 2
question: Quem é considerado trabalhador transfronteiriço (Grenzgängerin ou Grenzgänger) na Suíça?
options:
  a: Uma pessoa que trabalha na Suíça, mas tem o seu domicílio no estrangeiro e regressa regularmente
    para lá
  b: Uma pessoa que trabalha na alfândega e controla a fronteira do país
  c: Uma pessoa que atravessa a fronteira sem autorização para trabalhar aqui
  d: Uma pessoa que vive num cantão e trabalha todos os dias noutro cantão
explanation: Os trabalhadores transfronteiriços têm o seu local de trabalho na Suíça, mas vivem noutro
  país. Precisam de uma autorização de trabalhador transfronteiriço e regressam regularmente, pelo menos
  uma vez por semana, ao seu local de residência no estrangeiro. Quem se desloca apenas entre dois cantões
  não é trabalhador transfronteiriço.
