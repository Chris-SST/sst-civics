id: mieterverband-vertritt-mietende
lang: pt
source_version: 1
question: Qual é a função da associação de inquilinos (Mieterverband)?
options:
  a: Representa os interesses dos proprietários de imóveis
  b: Fixa as rendas de todos os apartamentos
  c: Arrenda apartamentos por conta do cantão
  d: Representa os interesses dos inquilinos
explanation: A associação de inquilinos é uma organização que defende os interesses dos inquilinos. Aconselha
  os seus membros, por exemplo, em questões relacionadas com o direito do arrendamento. Os interesses
  dos proprietários de imóveis são representados por outras associações.
