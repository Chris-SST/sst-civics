id: rechtsstaat-keine-festnahme-ohne-grund
lang: pt
source_version: 1
question: O que vale num Estado de direito em matéria de detenção e prisão?
options:
  a: O Estado não pode deter nem prender ninguém sem motivo.
  b: O Estado pode manter pessoas detidas segundo o seu próprio critério.
  c: O governo pode colocar críticos em prisão preventiva por precaução.
  d: Só os estrangeiros e as estrangeiras podem ser detidos sem motivo.
explanation: Num Estado de direito, a atuação do Estado está vinculada ao direito. Uma detenção ou prisão
  requer um motivo previsto na lei. Isto protege a liberdade das pessoas contra a arbitrariedade.
