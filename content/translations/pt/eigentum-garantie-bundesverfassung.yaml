id: eigentum-garantie-bundesverfassung
lang: pt
source_version: 1
question: Qual direito fundamental protege, na Suíça, as casas, os terrenos e outros bens patrimoniais
  das pessoas privadas?
options:
  a: A garantia da propriedade
  b: A liberdade de crença e de consciência
  c: A liberdade de estabelecimento
  d: A liberdade de reunião
explanation: A Constituição Federal garante a propriedade no artigo 26. O Estado só pode restringir a
  propriedade sob determinadas condições, por exemplo, com base legal e indemnização integral em caso
  de expropriação.
