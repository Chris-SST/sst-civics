question: Em que data cai o feriado nacional da Confederação Suíça, o feriado nacional da Suíça?
options:
  a: O dia 1.º de agosto
  b: O dia 26 de dezembro
  c: O dia 11 de novembro
  d: O dia 1.º de maio
explanation: O feriado nacional da Suíça é no dia 1.º de agosto. Nessa data, recorda-se o Pacto Federal
  de 1291. Em muitos lugares, as celebrações incluem fogos de artifício, fogueiras nas montanhas e discursos.
