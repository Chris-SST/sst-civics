id: finanzausgleich-hilfe-schwache-gemeinden
lang: pt
source_version: 1
question: Para que serve a compensação financeira entre as comunas (Gemeinden) no cantão de Zurique?
options:
  a: Reduz os impostos em todas as comunas para a mesma taxa.
  b: Paga às comunas os custos das assembleias municipais (Gemeindeversammlungen).
  c: Ajuda as comunas com poucos recursos financeiros ou sobrecarregadas por elevados custos sociais a
    cumprirem as suas tarefas.
  d: Distribui o dinheiro da Confederação de forma igual a todos os habitantes.
explanation: As comunas têm possibilidades financeiras muito diferentes. A compensação financeira equilibra
  parcialmente essas diferenças. Assim, também as comunas com pouca capacidade fiscal ou com elevados
  custos sociais podem cumprir as suas tarefas.
