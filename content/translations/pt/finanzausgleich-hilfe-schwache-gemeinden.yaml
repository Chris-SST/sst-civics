    question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden im Kanton Zürich?
    options_de:
      a: Er senkt die Steuern in allen Gemeinden auf den gleichen Satz.
      b: Er bezahlt den Gemeinden die Kosten der Gemeindeversammlungen.
      c: Er hilft Gemeinden mit geringen finanziellen Mitteln oder Gemeinden, die durch hohe Sozialkosten
        belastet sind, ihre Aufgaben zu erfüllen.
      d: Er verteilt das Geld des Bundes gleichmässig an alle Einwohner.
    explanation_de: Die Gemeinden haben sehr unterschiedliche finanzielle Möglichkeiten. Der Finanzausgleich
      gleicht diese Unterschiede teilweise aus. So können auch Gemeinden mit geringer Steuerkraft oder
      mit hohen Sozialkosten ihre Aufgaben erfüllen.
