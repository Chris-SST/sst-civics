id: roemer-badekultur-in-zuerich
lang: pt
source_version: 1
question: Que novidade os romanos trouxeram para Zurique?
options:
  a: A imprensa (a impressão de livros)
  b: As corporações de ofício
  c: A cultura dos banhos
  d: A Reforma
explanation: Os romanos introduziram em Zurique a cultura dos banhos, ou seja, banhos públicos segundo
  o modelo romano. As corporações de ofício, a imprensa e a Reforma pertencem apenas à Idade Média e ao
  início da Idade Moderna.
