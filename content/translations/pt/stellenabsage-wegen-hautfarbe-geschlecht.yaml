id: stellenabsage-wegen-hautfarbe-geschlecht
lang: pt
source_version: 2
question: Uma mulher candidata-se a um emprego. É rejeitada apenas por ser mulher. Que direito fundamental
  é violado desta forma?
options:
  a: A liberdade de estabelecimento
  b: A liberdade de reunião
  c: A igualdade perante a lei e a proibição da discriminação
  d: A proteção da vida privada
explanation: O artigo 8 da Constituição Federal estabelece que todas as pessoas são iguais perante a lei
  e que mulheres e homens têm os mesmos direitos. Ninguém pode ser discriminado, por exemplo, em razão
  da origem, da raça ou do sexo. Quem rejeita uma candidata apenas por causa do seu sexo viola, por isso,
  a igualdade perante a lei e a proibição da discriminação.
