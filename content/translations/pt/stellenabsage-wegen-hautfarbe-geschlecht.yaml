    question_de: Eine Frau bewirbt sich um eine Stelle. Sie wird nur abgelehnt, weil sie eine Frau ist.
      Welches Grundrecht wird dadurch verletzt?
    options_de:
      a: Die Niederlassungsfreiheit
      b: Die Versammlungsfreiheit
      c: Die Rechtsgleichheit und das Diskriminierungsverbot
      d: Der Schutz der Privatsphäre
    explanation_de: Artikel 8 der Bundesverfassung legt fest, dass alle Menschen vor dem Gesetz gleich
      sind und dass Frauen und Männer die gleichen Rechte haben. Niemand darf diskriminiert werden, zum
      Beispiel wegen der Herkunft, der Rasse oder des Geschlechts. Wer eine Bewerberin nur wegen ihres
      Geschlechts ablehnt, verletzt deshalb die Rechtsgleichheit und das Diskriminierungsverbot.
