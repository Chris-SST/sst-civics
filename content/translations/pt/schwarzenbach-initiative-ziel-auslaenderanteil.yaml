    question_de: Was wollte die Schwarzenbach-Initiative, über die 1970 abgestimmt wurde?
    options_de:
      a: Sie wollte die Einbürgerung für alle Ausländer erleichtern.
      b: Sie wollte nur die Einwanderung aus Italien verbieten.
      c: Sie wollte den Anteil der in der Schweiz lebenden Ausländer begrenzen.
