id: schwarzenbach-initiative-ziel-auslaenderanteil
lang: pt
source_version: 1
question: O que queria a iniciativa Schwarzenbach, sobre a qual se votou em 1970?
options:
  a: Queria facilitar a naturalização para todos os estrangeiros.
  b: Queria proibir a imigração apenas da Itália.
  c: Queria limitar a proporção de estrangeiros que vivem na Suíça.
  d: Queria introduzir o direito de voto para os estrangeiros.
explanation: A iniciativa exigia que se limitasse a proporção de estrangeiros na Suíça. Foi rejeitada
  pelo povo em 1970. Mostra como a imigração era então muito debatida.
