    question_de: Welche Folge hatte die Reformation für die Schweiz?
    options_de:
      a: Die Schweiz wurde religiös in einen reformierten und einen katholischen Teil gespalten.
      b: Die Schweiz wurde Teil des Deutschen Reiches.
      c: Die Kirche verlor überall jeglichen Einfluss auf die Politik.
      d: Alle Kantone der Eidgenossenschaft wurden reformiert.
    explanation_de: Einige Kantone schlossen sich der Reformation an, andere blieben katholisch. So entstand
      ein religiöser Gegensatz, der die Eidgenossenschaft lange Zeit belastete. Es gab auch Konflikte
      zwischen den Konfessionen.
