id: reformation-spaltung-der-alten-eidgenossenschaft
lang: pt
source_version: 1
question: Que consequência teve a Reforma para a Suíça?
options:
  a: A Suíça ficou religiosamente dividida numa parte reformada e numa parte católica.
  b: A Suíça tornou-se parte do Império Alemão.
  c: A Igreja perdeu, em todo o lado, qualquer influência sobre a política.
  d: Todos os cantões da Confederação tornaram-se reformados.
explanation: Alguns cantões aderiram à Reforma, outros permaneceram católicos. Assim surgiu uma oposição
  religiosa que durante muito tempo pesou sobre a Confederação. Houve também conflitos entre as confissões.
