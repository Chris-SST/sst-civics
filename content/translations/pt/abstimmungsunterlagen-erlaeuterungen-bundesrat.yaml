    model: claude-sonnet-5-5
    at: 2026-11-02
    source_version: 1
    question_de: Was erhalten die Stimmberechtigten vor einer eidgenössischen Abstimmung zusammen mit
      dem Stimmmaterial, um sich über die Abstimmungsvorlagen informieren zu können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Ein Gutachten des Bundesgerichts
      c: Ein Gutachten des eigenen Kantons
      d: Die Wahlliste aller Parteien
    explanation_de: Der Bundesrat erläutert in den Erläuterungen, die oft Abstimmungsbüchlein genannt
      werden, worum es bei jeder Abstimmungsvorlage geht. Darin stehen auch die Argumente des Initiativ-
      oder Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments. So kann sich jeder
      seine eigene Meinung bilden.
