id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: pt
source_version: 1
question: O que recebem os eleitores, juntamente com o material de voto, antes de uma votação federal,
  para poderem informar-se sobre os objetos submetidos a votação?
options:
  a: As explicações do Conselho Federal (Bundesrat)
  b: Um parecer do Tribunal Federal (Bundesgericht)
  c: Um parecer do próprio cantão
  d: A lista eleitoral de todos os partidos
explanation: O Conselho Federal explica, nas explicações, muitas vezes chamadas de brochura de votação,
  do que trata cada objeto submetido a votação. Nelas constam também os argumentos do comité da iniciativa
  ou do referendo, bem como a recomendação do Conselho Federal e do Parlamento. Assim, todos podem formar
  a sua própria opinião.
