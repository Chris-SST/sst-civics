    question_de: Was wird in einem Mietvertrag festgelegt?
    options_de:
      a: Die Rechte der Nachbarn an der Liegenschaft
      b: Die Höhe der Steuern der Mieter
      c: Die Pflichten der Gemeinde gegenüber den Mietern
      d: Die Rechte und die Pflichten der Vermieter und der Mieter
    explanation_de: Der Mietvertrag regelt das Verhältnis zwischen der Person, die vermietet, und der
      Person, die mietet. Dazu gehören zum Beispiel der Mietzins und die Mietdauer. Das Obligationenrecht
      enthält die gesetzlichen Regeln zu diesem Thema.
