id: mietvertrag-rechte-pflichten-regeln
lang: pt
source_version: 1
question: O que é estabelecido num contrato de arrendamento?
options:
  a: Os direitos dos vizinhos no imóvel
  b: O montante dos impostos dos arrendatários
  c: As obrigações da comuna (Gemeinde) para com os arrendatários
  d: Os direitos e as obrigações dos senhorios e dos arrendatários
explanation: O contrato de arrendamento regula a relação entre a pessoa que arrenda e a pessoa que toma
  de arrendamento. Fazem parte disso, por exemplo, a renda e a duração do arrendamento. O Código das Obrigações
  (Obligationenrecht) contém as regras legais sobre esta matéria.
