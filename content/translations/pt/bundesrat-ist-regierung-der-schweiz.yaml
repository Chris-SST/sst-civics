id: bundesrat-ist-regierung-der-schweiz
lang: pt
source_version: 1
question: Qual é o papel do Conselho Federal (Bundesrat) na Suíça?
options:
  a: É o governo da Suíça.
  b: É o tribunal supremo do país.
  c: É o parlamento da Confederação.
  d: É a representação dos cantões.
explanation: O Conselho Federal é a autoridade suprema de direção e execução da Confederação, ou seja,
  o governo. Tem sete membros. O parlamento e o Tribunal Federal (Bundesgericht) são outros poderes.
