id: krankenversicherung-pflicht-wohnhafte-personen
lang: pt
source_version: 1
question: O que se aplica às pessoas que residem na Suíça em relação ao seguro de saúde?
options:
  a: Só têm de se segurar se trabalharem na Suíça
  b: São legalmente obrigadas a contratar um seguro de saúde
  c: Só têm de se segurar se tiverem mais de 50 anos
  d: Podem decidir livremente se querem ou não fazer um seguro
explanation: A Lei do Seguro de Saúde obriga todas as pessoas com domicílio na Suíça a ter um seguro de
  saúde. É necessário segurar-se no prazo de três meses após o nascimento ou após a fixação de residência.
