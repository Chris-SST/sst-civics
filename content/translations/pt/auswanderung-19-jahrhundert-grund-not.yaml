id: auswanderung-19-jahrhundert-grund-not
lang: pt
source_version: 1
question: No século XIX, muitas pessoas deixaram a Suíça e emigraram, por exemplo, para a América. Qual
  foi um motivo importante para isso?
options:
  a: A miséria e a falta de trabalho ameaçavam a sua existência.
  b: A Confederação proibiu-as de viver na Suíça.
  c: A Suíça tinha pouco espaço para fábricas.
  d: No estrangeiro não havia impostos para os recém-chegados.
explanation: No século XIX, a Suíça ainda era um país de emigração. Fomes, pobreza e falta de trabalho
  levaram muitas pessoas a procurar uma nova vida no estrangeiro. Só mais tarde a Suíça se tornou um país
  de imigração.
