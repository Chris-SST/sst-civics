id: militaerdienstpflicht-schweizer-maenner
lang: pt
source_version: 1
question: Quem é sujeito, na Suíça, à obrigação de prestar serviço militar ou serviço de substituição?
options:
  a: Todos os habitantes a partir dos 18 anos
  b: Homens com cidadania (Bürgerrecht) suíça
  c: Todos os homens que residem na Suíça
  d: Apenas mulheres com cidadania suíça
explanation: Segundo a Constituição Federal, todo homem suíço é obrigado a prestar serviço militar. Quem
  não puder conciliá-lo com a sua consciência presta um serviço de substituição civil. Os estrangeiros
  não estão sujeitos a esta obrigação.
