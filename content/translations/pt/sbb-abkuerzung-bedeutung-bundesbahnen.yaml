id: sbb-abkuerzung-bedeutung-bundesbahnen
lang: pt
source_version: 1
question: O que significa a sigla «SBB», que se vê nos comboios e nas estações de caminho de ferro na
  Suíça?
options:
  a: Schweizer Busbetriebe (Empresas suíças de autocarros)
  b: Schweizerische Bundesbahnen (Caminhos de Ferro Federais Suíços)
  c: Schweizerische Bahn- und Busbetriebe (Empresas suíças de comboios e autocarros)
  d: Schweizer Bergbahnen (Caminhos de ferro de montanha suíços)
explanation: SBB significa Schweizerische Bundesbahnen (Caminhos de Ferro Federais Suíços). A empresa
  explora uma grande parte da rede ferroviária suíça e pertence à Confederação. Além dela, existem outras
  empresas ferroviárias, por exemplo a BLS ou os Caminhos de Ferro Reciános (Rhätische Bahn).
