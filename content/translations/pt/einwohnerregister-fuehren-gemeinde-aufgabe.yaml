id: einwohnerregister-fuehren-gemeinde-aufgabe
lang: pt
source_version: 1
question: Qual das seguintes tarefas é cumprida, nas comunas (Gemeinde) de Zurique, pelo Einwohneramt
  (serviço de registo de habitantes)?
options:
  a: Emite sentenças penais.
  b: Mantém o registo de habitantes da comuna.
  c: Concede licenças de construção para estradas cantonais.
  d: Define as leis fiscais.
explanation: A comuna mantém o registo das pessoas que nela residem. É lá que você se regista, cancela
  o registo ou comunica uma mudança de morada quando se muda. Sentenças penais, leis fiscais e estradas
  cantonais não fazem parte desta tarefa.
