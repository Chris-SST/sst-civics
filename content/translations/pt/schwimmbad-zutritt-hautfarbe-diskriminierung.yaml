id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: pt
source_version: 1
question: Uma piscina pública recusa a entrada a uma pessoa por causa da cor da sua pele. Que princípio
  da Constituição Federal é violado desta forma?
options:
  a: A liberdade económica
  b: A proibição de discriminação
  c: O direito de voto
  d: O direito ao casamento e à família
explanation: A Constituição Federal proíbe, no artigo 8.º, a discriminação, por exemplo em razão da origem
  ou da raça. Por isso, ninguém pode ser tratado de forma pior.
