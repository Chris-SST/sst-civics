    question_de: Ein öffentliches Schwimmbad verweigert einer Person wegen ihrer Hautfarbe den Zutritt.
      Welcher Grundsatz der Bundesverfassung wird dadurch verletzt?
    options_de:
      a: Die Wirtschaftsfreiheit
      b: Das Diskriminierungsverbot
      c: Das Stimmrecht
      d: Das Recht auf Ehe und Familie
    explanation_de: Die Bundesverfassung verbietet in Artikel 8 die Diskriminierung, zum Beispiel aufgrund
      der Herkunft oder der Rasse. Deshalb darf niemand schlechter behandelt werden.
