question: Segundo a crença popular, o que significa quando, no Sechseläuten, a cabeça do Böögg arde rapidamente?
options:
  a: O próximo verão será chuvoso.
  b: O próximo inverno será particularmente frio.
  c: O próximo verão será bonito.
  d: A colheita do outono será fraca.
explanation: 'O Böögg é um boneco de neve que é queimado em Zurique durante o Sechseläuten. Segundo a
  crença popular: quanto mais rapidamente a sua cabeça arde ou explode, mais bonito será o próximo verão.'
