id: kleine-gemeinde-vertretung-gemeindepraesident
lang: pt
source_version: 1
question: Quem representa para o exterior uma comuna (Gemeinde) zuriquenha de menor dimensão?
options:
  a: a presidente ou o presidente da comuna
  b: a conselheira distrital ou o conselheiro distrital
  c: a secretária ou o secretário da comuna
  d: a diretora ou o diretor da escola
explanation: Nas comunas zuriquenhas de menor dimensão, a presidente ou o presidente da comuna representa
  a comuna para o exterior. Ela ou ele preside o conselho municipal (Gemeinderat). Na cidade de Zurique,
  esse papel cabe à presidente ou ao presidente da cidade.
