id: nachbarland-im-sueden-der-schweiz
lang: pt
source_version: 1
question: Qual país se situa a sul da Suíça e faz fronteira com ela?
options:
  a: Espanha
  b: Itália
  c: Eslovénia
  d: França
explanation: A Itália é o vizinho a sul da Suíça. A fronteira passa, entre outros locais, pelos Alpes
  e pelos cantões do Tessino (Tessin) e dos Grisões (Graubünden). A Espanha e a Eslovénia não fazem fronteira
  com a Suíça.
