id: stimmrecht-bund-schweizer-buergerrecht
lang: pt
source_version: 1
question: Qual é um requisito para o direito de voto e de elegibilidade a nível da Confederação?
options:
  a: A cidadania (Bürgerrecht) suíça
  b: A filiação a um partido político
  c: Pelo menos dez anos de residência na Suíça
  d: Uma autorização de estabelecimento (Niederlassungsbewilligung) (autorização C)
explanation: A nível da Confederação, só as pessoas com cidadania suíça podem votar e eleger. Os estrangeiros
  não têm direito de voto e de elegibilidade a nível da Confederação, nem mesmo com uma autorização de
  estabelecimento. A filiação a um partido não é necessária.
