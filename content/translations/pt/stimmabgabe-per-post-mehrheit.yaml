    question_de: Wie stimmt die Mehrheit der Stimmberechtigten in der Schweiz heute bei Abstimmungen und
      Wahlen ab?
    options_de:
      a: Sie stimmen am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie geben ihre Stimme am Abstimmungssonntag persönlich an der Urne ab.
      c: Sie senden ihre Stimme per Post an die Gemeinde.
      d: Sie stimmen über eine Website des Bundes ab.
    explanation_de: Die Mehrheit der Stimmberechtigten stimmt brieflich ab, das heisst per Post. Am Abstimmungssonntag
      an die Urne zu gehen ist für die Mehrheit nicht mehr üblich.
