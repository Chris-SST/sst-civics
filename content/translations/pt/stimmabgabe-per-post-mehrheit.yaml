id: stimmabgabe-per-post-mehrheit
lang: pt
source_version: 1
question: Como é que a maioria dos eleitores na Suíça vota hoje em votações e eleições?
options:
  a: Votam no domingo da votação na assembleia municipal (Gemeindeversammlung).
  b: Depositam o voto pessoalmente na urna no domingo da votação.
  c: Enviam o voto por correio para a comuna (Gemeinde).
  d: Votam através de um site da Confederação.
explanation: A maioria dos eleitores vota por correspondência, ou seja, pelo correio. Ir à urna no domingo
  da votação já não é habitual para a maioria.
