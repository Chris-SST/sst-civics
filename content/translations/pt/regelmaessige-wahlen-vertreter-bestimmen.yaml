id: regelmaessige-wahlen-vertreter-bestimmen
lang: pt
source_version: 1
question: Que importância têm as eleições regulares numa democracia?
options:
  a: A população decide por si própria quem a representa.
  b: O governo nomeia ele próprio os seus sucessores.
  c: Os partidos definem a representação entre si.
  d: O tribunal decide quem assume um cargo.
explanation: Nas eleições, os eleitores decidem quem os representa no parlamento ou no governo. Como as
  eleições se realizam regularmente, podem confirmar determinadas pessoas ou substituí-las por outras.
  Assim, a população mantém influência sobre a política.
