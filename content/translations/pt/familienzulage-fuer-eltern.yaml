    question_de: Welche staatliche Leistung erhalten Eltern in der Schweiz, wenn sie angestellt oder selbstständig
      erwerbstätig sind und Kinder haben?
    options_de:
      a: Die Invalidenrente
      b: Das Arbeitslosengeld
      c: Die Ergänzungsleistung zur Alters- und Hinterlassenenversicherung (AHV)
      d: Die Familienzulage
    explanation_de: Die Familienzulagen helfen den Familien, einen Teil der Kosten für Kinder zu tragen.
      Sie umfassen die Kinderzulagen und die Ausbildungszulagen. Auch Selbstständigerwerbende können sie
      erhalten.
