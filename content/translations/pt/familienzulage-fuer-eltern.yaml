id: familienzulage-fuer-eltern
lang: pt
source_version: 1
question: Que prestação estatal recebem os pais na Suíça quando são empregados ou trabalham por conta
  própria e têm filhos?
options:
  a: A pensão de invalidez
  b: O subsídio de desemprego
  c: A prestação complementar ao seguro de velhice e sobrevivência (AHV)
  d: O abono de família
explanation: Os abonos de família ajudam as famílias a suportar uma parte dos custos com os filhos. Compreendem
  os abonos por filho e os abonos de formação. Também os trabalhadores por conta própria podem recebê-los.
