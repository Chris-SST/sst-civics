id: obligationenrecht-miete-wohnraum-vorschriften
lang: pt
source_version: 2
question: Em que lei estão estabelecidas as regras para o arrendamento de uma habitação?
options:
  a: No Código das Obrigações
  b: Na Lei do Trabalho
  c: No Código Penal
  d: Na Lei da Circulação Rodoviária
explanation: As regras sobre o arrendamento de habitações encontram-se no Código das Obrigações (OR).
  Aí estabelece-se, por exemplo, o que vale no contrato de arrendamento, qual pode ser o valor da renda
  e como se pode rescindir o contrato. O Código Civil (ZGB), por sua vez, regula sobretudo temas como
  a família, o casamento e a herança.
