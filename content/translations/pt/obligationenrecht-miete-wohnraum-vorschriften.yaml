    question_de: In welchem Gesetz sind die Regeln für die Miete einer Wohnung festgelegt?
    options_de:
      a: Im Obligationenrecht
      b: Im Arbeitsgesetz
      c: Im Strafgesetzbuch
      d: Im Strassenverkehrsgesetz
    explanation_de: Die Regeln über die Miete von Wohnungen finden sich im Obligationenrecht (OR). Dort
      wird zum Beispiel festgelegt, was im Mietvertrag gilt, wie hoch der Mietzins sein darf und wie man
      den Vertrag kündigen kann. Das Zivilgesetzbuch (ZGB) regelt demgegenüber vor allem Themen wie Familie,
      Ehe und Erbschaft.
