id: arbeitsrecht-beratung-anlaufstellen
lang: pt
source_version: 1
question: Quem pode ajudar em questões de direito do trabalho?
options:
  a: A Schulpflege (comissão escolar) e a paróquia
  b: A advocacia, os sindicatos e os tribunais do trabalho
  c: As empresas de transportes públicos e os correios
  d: As conservatórias do registo civil e o controlo de residentes
explanation: Em questões de direito do trabalho, existem vários pontos de contacto. Entre eles contam-se
  advogadas e advogados, os sindicatos e os tribunais do trabalho. As outras entidades são responsáveis
  por outras tarefas.
