question: Quais são as cores do brasão do cantão de Zurique?
options:
  a: Vermelho e branco
  b: Verde e branco
  c: Branco e azul
  d: Azul e amarelo
explanation: O brasão de Zurique é dividido na diagonal em branco e azul. Na heráldica, o branco chama-se
