id: pfahlbauten-am-zuerichsee-vorgeschichte
lang: pt
source_version: 1
question: Como eram construídos os povoados pré-históricos no Lago de Zurique?
options:
  a: Como cavernas na rocha
  b: Como palafitas, ou seja, casas sobre estacas
  c: Como casas de tijolo em aldeias
  d: Como castelos sobre rochedos
explanation: Na margem do Lago de Zurique existiam, na época pré-histórica, palafitas, ou seja, casas
  sobre estacas. Os vestígios dessas construções encontram-se ainda hoje debaixo de água e são estudados
  por arqueólogos subaquáticos.
