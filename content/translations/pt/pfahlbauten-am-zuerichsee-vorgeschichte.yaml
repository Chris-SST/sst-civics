    question_de: Wie wurden die prähistorischen Siedlungen am Zürichsee gebaut?
    options_de:
      a: Als Höhlen im Fels
      b: Als Pfahlbauten, das heisst Häuser auf Pfählen
      c: Als Backsteinhäuser in Dörfern
      d: Als Burgen auf Felsen
    explanation_de: Am Ufer des Zürichsees gab es in prähistorischer Zeit Pfahlbauten, das heisst Häuser
