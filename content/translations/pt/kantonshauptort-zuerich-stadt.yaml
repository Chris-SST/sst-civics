question: Qual cidade é a capital do cantão de Zurique?
options:
  a: Uster
  b: A cidade de Zurique
  c: Winterthur
  d: Dübendorf
explanation: A cidade de Zurique é a capital do cantão e tem o mesmo nome. Aí estão sediados, entre outros,
