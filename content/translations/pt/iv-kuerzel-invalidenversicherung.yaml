id: iv-kuerzel-invalidenversicherung
lang: pt
source_version: 1
question: O que significa a abreviatura «IV» no sistema suíço de seguros sociais?
options:
  a: Seguro interno (Inlandversicherung)
  b: Seguro de invalidez (Invalidenversicherung)
  c: Seguro de integração (Integrationsversicherung)
  d: Seguro individual (Individualversicherung)
explanation: IV significa seguro de invalidez (Invalidenversicherung). Faz parte do primeiro pilar da
  previdência para a velhice e ajuda pessoas com limitações de saúde, por exemplo com medidas de reinserção
  ou com pensões.
