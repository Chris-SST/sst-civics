id: lateinischer-name-der-schweiz
lang: pt
source_version: 2
question: Como se chama a Confederação Suíça em latim?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: Em latim, a Suíça chama-se Confoederatio Helvetica. Daí vem a abreviatura CH, que se vê,
  por exemplo, nas matrículas dos automóveis e nos endereços da Internet (.ch). Usa-se o nome latino porque
  é neutro e não favorece nenhuma das quatro línguas nacionais.
