    question_de: Welche Aufgabe hat der Stadtrat der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die kantonalen Gesetze für das Stadtgebiet.
