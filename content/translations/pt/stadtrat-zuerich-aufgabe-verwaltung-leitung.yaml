id: stadtrat-zuerich-aufgabe-verwaltung-leitung
lang: pt
source_version: 1
question: Qual é a função da Câmara Municipal (Stadtrat) da cidade de Zurique?
options:
  a: Dirige a administração fiscal cantonal na cidade.
  b: Promulga as leis cantonais para o território da cidade.
  c: Faz justiça em litígios entre os habitantes.
  d: Dirige a administração municipal e define as diretrizes da actuação da cidade.
explanation: A Câmara Municipal é o poder executivo da cidade de Zurique. Dirige a administração municipal
  e determina a direção em que a cidade se desenvolve. Os tribunais fazem justiça, e as leis cantonais
  são promulgadas pelo Conselho Cantonal (Kantonsrat).
