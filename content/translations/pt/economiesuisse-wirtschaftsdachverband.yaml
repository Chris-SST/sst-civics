id: economiesuisse-wirtschaftsdachverband
lang: pt
source_version: 1
question: O que é a Economiesuisse?
options:
  a: Uma caixa de seguro-desemprego da Confederação
  b: O Gabinete Federal da Economia
  c: A federação-mãe da economia, que representa os interesses das empresas
  d: Um sindicato para empregados do comércio a retalho
explanation: A Economiesuisse é a federação-mãe da economia suíça e representa os interesses das empresas.
  Não é um organismo estatal nem um sindicato.
