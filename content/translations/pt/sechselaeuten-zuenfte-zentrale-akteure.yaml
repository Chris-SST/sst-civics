question: Quem são os protagonistas da festa da primavera de Zurique, o Sechseläuten?
options:
  a: As turmas escolares de Zurique
  b: As corporações (Zünfte) de Zurique
  c: Os presidentes das comunas (Gemeinde) do cantão
