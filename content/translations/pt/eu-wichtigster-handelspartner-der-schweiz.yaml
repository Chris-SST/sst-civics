id: eu-wichtigster-handelspartner-der-schweiz
lang: pt
source_version: 1
question: Com qual espaço económico a Suíça realiza, no total, mais comércio?
options:
  a: Com os Estados do Médio Oriente
  b: Com os Estados asiáticos
  c: Com a União Europeia
  d: Com os Estados Unidos da América
explanation: A União Europeia é o principal parceiro comercial da Suíça. Uma grande parte das importações
  e exportações passa pelos Estados da UE. Por isso, as relações com a UE são muito importantes para a
  economia suíça.
