id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: pt
source_version: 1
question: Uma mulher muda-se para a Suíça e quer escolher ela própria a sua religião. Pondera também não
  pertencer a nenhuma religião. O que lhe garante a Constituição Federal a este respeito?
options:
  a: Ela só pode pertencer a uma religião que seja reconhecida no cantão por direito público.
  b: Ela pode escolher livremente a sua religião, praticá-la ou não pertencer a nenhuma religião.
  c: Ela pode escolher a sua religião em privado, mas não a pode praticar em lado nenhum em conjunto com
    outras pessoas.
  d: Ela tem de decidir-se, junto da comuna (Gemeinde), por uma religião reconhecida.
explanation: A liberdade de crença e de consciência está garantida no artigo 15 da Constituição Federal.
  Qualquer pessoa pode escolher livremente a sua religião, praticá-la sozinha ou com outras pessoas, ou
  não pertencer a nenhuma religião. Ninguém pode ser obrigado a pertencer a uma comunidade religiosa.
