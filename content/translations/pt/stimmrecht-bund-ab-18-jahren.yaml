id: stimmrecht-bund-ab-18-jahren
lang: pt
source_version: 2
question: Quem pode votar e eleger a nível da Confederação?
options:
  a: Cidadãos suíços a partir dos 20 anos
  b: Todas as pessoas com autorização de estabelecimento (autorização C) (Niederlassungsbewilligung) a
    partir dos 18 anos
  c: Cidadãos suíços a partir dos 18 anos
  d: Todas as pessoas com domicílio na Suíça a partir dos 16 anos
explanation: Na Confederação, os cidadãos suíços podem votar e eleger a partir do 18.º aniversário. Os
  estrangeiros não têm este direito a nível da Confederação, nem mesmo com uma autorização de estabelecimento
  (autorização C). Também os cidadãos suíços que vivem no estrangeiro podem participar, se se inscreverem
  no registo eleitoral.
