    question_de: Wer darf auf Ebene des Bundes abstimmen und wählen?
    options_de:
      a: Schweizer Bürger ab 20 Jahren
      b: Alle Personen mit Niederlassungsbewilligung (Bewilligung C) ab 18 Jahren
      c: Schweizer Bürger ab 18 Jahren
      d: Alle Personen mit Wohnsitz in der Schweiz ab 16 Jahren
    explanation_de: Auf Bundesebene dürfen Schweizer Bürger ab dem 18. Geburtstag abstimmen und wählen.
      Ausländer haben dieses Recht auf Bundesebene nicht, auch nicht mit einer Niederlassungsbewilligung
      (Bewilligung C). Auch im Ausland lebende Schweizer Bürger können teilnehmen, wenn sie sich im Stimmregister
      eintragen lassen.
