id: staendemehr-mehrheit-der-kantone
lang: pt
source_version: 1
question: O que significa o termo «maioria dos cantões (Ständemehr)» nas votações federais?
options:
  a: A maioria dos cantões deve aprovar o projeto.
  b: A maioria das comunas (Gemeinden) deve aprovar o projeto.
  c: A maioria dos partidos deve aprovar o projeto.
  d: A maioria dos membros do Conselho dos Estados (Ständerat) deve estar presente.
explanation: A maioria dos cantões exige que a maioria dos cantões aprove um projeto. Os votos de um cantão
  contam de acordo com o resultado da votação nesse cantão. Nas alterações da Constituição, além da maioria
  do povo (Volksmehr), é também necessária a maioria dos cantões.
