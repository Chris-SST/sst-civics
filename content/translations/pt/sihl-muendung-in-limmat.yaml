id: sihl-muendung-in-limmat
lang: pt
source_version: 1
question: Em que rio desagua o Sihl no meio da cidade de Zurique?
options:
  a: No Töss
  b: No Limmat
  c: No Glatt
  d: No Aare
explanation: O Sihl atravessa Zurique e desagua no Limmat junto ao Platzspitz. O Glatt e o Töss são outros
  rios zuriquenses que desaguam no Reno. O Aare só recebe o Limmat mais abaixo, no cantão da Argóvia.
