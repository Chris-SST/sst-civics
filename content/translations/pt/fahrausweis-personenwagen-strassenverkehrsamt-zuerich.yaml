id: fahrausweis-personenwagen-strassenverkehrsamt-zuerich
lang: pt
source_version: 1
question: Que entidade emite, no cantão de Zurique, a carta de condução para automóveis ligeiros de passageiros?
options:
  a: O tribunal distrital
  b: O serviço de circulação rodoviária (Strassenverkehrsamt) do cantão
  c: A polícia municipal da comuna (Gemeinde) de residência
  d: O Gabinete Federal das Estradas
explanation: No cantão de Zurique, o serviço de circulação rodoviária (Strassenverkehrsamt) é responsável
  pelas cartas de condução. Pertence à Direção de Segurança. As comunas e a Confederação não emitem cartas
  de condução.
