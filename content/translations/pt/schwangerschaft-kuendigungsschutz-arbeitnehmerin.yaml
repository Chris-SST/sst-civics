id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: pt
source_version: 1
question: O que se aplica às trabalhadoras grávidas na Suíça em caso de despedimento?
options:
  a: Só têm proteção contra o despedimento em empresas com convenção coletiva de trabalho
  b: Durante a gravidez, beneficiam de proteção legal contra o despedimento
  c: Têm de comunicar imediatamente a gravidez à entidade patronal, caso contrário a proteção caduca
  d: Podem ser despedidas a qualquer momento, sem qualquer restrição
explanation: A lei protege as mulheres contra o despedimento por parte da entidade patronal durante a
  gravidez. A proteção aplica-se independentemente da empresa. Destina-se a garantir a segurança das mulheres
  durante este período.
