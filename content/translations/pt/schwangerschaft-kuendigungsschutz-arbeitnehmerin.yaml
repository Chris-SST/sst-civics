    question_de: Was gilt in der Schweiz für schwangere Arbeitnehmerinnen im Falle einer Kündigung?
    options_de:
      a: Sie haben nur in Betrieben mit einem Gesamtarbeitsvertrag Kündigungsschutz
      b: Während der Schwangerschaft geniessen sie gesetzlichen Schutz vor Kündigung
      c: Sie müssen die Schwangerschaft dem Arbeitgeber sofort mitteilen, sonst verfällt der Schutz
      d: Sie können jederzeit ohne jegliche Einschränkung gekündigt werden
    explanation_de: Das Gesetz schützt Frauen während der Schwangerschaft vor einer Kündigung durch den
      Arbeitgeber. Der Schutz gilt unabhängig vom Betrieb. Er soll die Sicherheit der Frauen in dieser
      Zeit gewährleisten.
