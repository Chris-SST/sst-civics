id: volksinitiative-eigene-forderungen-durchsetzen
lang: pt
source_version: 1
question: Para que serve uma iniciativa popular (Volksinitiative) aos cidadãos com direito de voto?
options:
  a: Com ela, podem alterar uma sentença do Tribunal Federal (Bundesgericht).
  b: Com ela, podem colocar as suas próprias reivindicações na agenda política.
  c: Com ela, podem fixar a data das próximas eleições.
  d: Com ela, podem impedir uma lei do Parlamento.
explanation: Com uma iniciativa popular, os cidadãos com direito de voto podem propor uma alteração da
  Constituição Federal. Se a iniciativa for validamente apresentada, é submetida a votação. Assim, podem
  fazer valer as suas próprias preocupações, mesmo contra a vontade do Parlamento, se o povo e os cantões
  a aprovarem.
