    question_de: Wozu dient eine Volksinitiative den stimmberechtigten Bürgerinnen und Bürgern?
    options_de:
      a: Damit können sie ein Urteil des Bundesgerichts ändern.
      b: Damit können sie ihre eigenen Anliegen auf die politische Agenda setzen.
      c: Damit können sie das Datum der nächsten Wahlen festlegen.
      d: Damit können sie ein Gesetz des Parlaments verhindern.
    explanation_de: Mit einer Volksinitiative können die stimmberechtigten Bürgerinnen und Bürger eine
      Änderung der Bundesverfassung vorschlagen. Wenn die Initiative gültig eingereicht wird, wird sie
      zur Abstimmung gebracht. So können sie ihre eigenen Anliegen durchsetzen, auch gegen den Willen
      des Parlaments, wenn das Volk und die Kantone sie annehmen.
