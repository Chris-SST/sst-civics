id: armee-zustaendigkeit-bund
lang: pt
source_version: 1
question: Qual nível do Estado é responsável pelo exército?
options:
  a: Os cantões
  b: A Confederação
  c: Os distritos
  d: As comunas (Gemeinden)
explanation: A defesa militar é da competência da Confederação. Ela regula o exército e as suas funções
  na Constituição Federal e em leis federais. Os cantões participam na execução, por exemplo no recrutamento.
