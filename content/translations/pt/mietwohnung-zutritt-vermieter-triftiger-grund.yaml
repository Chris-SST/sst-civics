    question_de: In welchem Fall müssen die Mieter dem Vermieter den Zugang zur Wohnung gestatten?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein gerechtfertigter Grund vorliegt
      c: Nur wenn der Vermieter es verlangt, ohne Begründung
      d: Jederzeit und ohne vorherige Ankündigung
    explanation_de: Die Mieter müssen den Zugang gestatten, wenn ein gerechtfertigter Grund vorliegt,
      zum Beispiel eine dringende Reparatur. Der Vermieter muss den Besuch jedoch im Voraus ankündigen
      und auf die Mieter Rücksicht nehmen. Der Zugang ohne Grund ist nicht erlaubt.
