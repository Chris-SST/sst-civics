id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: pt
source_version: 1
question: Em que caso os inquilinos devem permitir o acesso ao apartamento por parte do senhorio?
options:
  a: Nunca, o apartamento está sempre protegido
  b: Quando existe um motivo justificado
  c: Apenas quando o senhorio o exige, sem justificação
  d: A qualquer momento e sem aviso prévio
explanation: Os inquilinos devem permitir o acesso quando existe um motivo justificado, por exemplo, uma
  reparação urgente. No entanto, o senhorio deve anunciar a visita com antecedência e ter consideração
  pelos inquilinos. Não é permitido o acesso sem motivo.
