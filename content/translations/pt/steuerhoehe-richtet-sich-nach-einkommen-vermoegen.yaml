    question_de: Wovon hängt hauptsächlich die Höhe der Einkommens- und Vermögenssteuer ab, die eine Person
      im Kanton Zürich bezahlt?
    options_de:
      a: Vom steuerbaren Einkommen und Vermögen
      b: vom Beruf der Person
      c: Von der Aufenthaltsdauer in der Gemeinde
