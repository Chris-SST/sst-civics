id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
lang: pt
source_version: 1
question: De que depende principalmente o valor do imposto sobre o rendimento e sobre o património que
  uma pessoa paga no cantão de Zurique?
options:
  a: Do rendimento e do património tributáveis
  b: da profissão da pessoa
  c: Do tempo de residência na comuna (Gemeinde)
  d: Do número de vezes que a pessoa exerceu o direito de voto
explanation: O imposto é calculado sobre o rendimento e o património tributáveis. Quem ganha ou possui
  mais paga, em regra, mais impostos.
