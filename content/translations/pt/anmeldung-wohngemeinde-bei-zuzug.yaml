    question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
    options_de:
      a: Sie müssen sich in der Wohngemeinde anmelden.
      b: Sie müssen sich bei der Armee melden.
      c: Sie müssen sich beim Bundesrat melden.
      d: Sie müssen sich bei der Steuerverwaltung des Bundes melden.
    explanation_de: Wer an einen neuen Ort zieht, muss sich in der Wohngemeinde anmelden. Das geschieht
      in der Regel bei der Einwohnerkontrolle. So ist die Gemeinde über ihre Einwohner informiert.
