id: anmeldung-wohngemeinde-bei-zuzug
lang: pt
source_version: 1
question: O que devem fazer as pessoas que se estabelecem numa comuna (Gemeinde)?
options:
  a: Devem registar-se na comuna de residência.
  b: Devem apresentar-se ao exército.
  c: Devem apresentar-se ao Conselho Federal (Bundesrat).
  d: Devem apresentar-se à administração fiscal da Confederação.
explanation: Quem se muda para um novo local deve registar-se na comuna de residência. Isso é feito, em
  regra, no serviço de registo de residentes (Einwohnerkontrolle). Assim, a comuna está informada sobre
  os seus habitantes.
