id: volksschule-leitung-vor-ort-schulleitung
lang: pt
source_version: 2
question: Quem dirige diretamente uma escola pública (Volksschule) no cantão de Zurique?
options:
  a: O Conselho Cantonal (Kantonsrat)
  b: A direção da escola
  c: O conselho de pais
  d: O Conselho de Governo (Regierungsrat)
explanation: Cada escola pública no cantão de Zurique tem uma direção da escola, que conduz e organiza
  o funcionamento diretamente na escola. O Conselho de Governo e o Conselho Cantonal atuam ao nível do
  cantão. O conselho de pais apresenta as preocupações dos pais, mas não dirige a escola.
