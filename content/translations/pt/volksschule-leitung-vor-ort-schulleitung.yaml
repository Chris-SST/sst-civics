    question_de: Wer leitet im Kanton Zürich eine Volksschule direkt?
    options_de:
      a: Der Kantonsrat
      b: Die Schulleitung
      c: Der Elternrat
      d: Der Regierungsrat
    explanation_de: Jede Volksschule im Kanton Zürich hat eine Schulleitung, die den Betrieb direkt an
      der Schule führt und organisiert. Der Regierungsrat und der Kantonsrat wirken auf der Ebene des
      Kantons. Der Elternrat bringt die Anliegen der Eltern vor, leitet aber die Schule nicht.
