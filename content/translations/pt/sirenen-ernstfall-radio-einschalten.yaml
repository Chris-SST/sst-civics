    question_de: Im Notfall ertönen die Sirenen des «Allgemeinen Alarms» (ein heulender Ton, der auf-
      und abschwillt). Was sollten Sie tun?
    options_de:
      a: Sofort das Haus verlassen
      b: Die Feuerwehr anrufen
      c: Radio hören und den Anweisungen der Behörden folgen
      d: Mit dem Auto flüchten
    explanation_de: Im Fall eines Allgemeinen Alarms informieren die Behörden über das Radio, was zu tun
      ist. Informationen gibt es auch in der App Alertswiss. Man soll den Anweisungen folgen und die Notrufnummern
      nicht unnötig anrufen, damit sie für echte Notfälle frei bleiben.
