id: sirenen-ernstfall-radio-einschalten
lang: pt
source_version: 2
question: Em caso de emergência, soam as sirenes do «Alarme Geral» (um som uivante que sobe e desce).
  O que deve fazer?
options:
  a: Sair imediatamente de casa
  b: Ligar para os bombeiros
  c: Ouvir a rádio e seguir as instruções das autoridades
  d: Fugir de carro
explanation: Em caso de Alarme Geral, as autoridades informam pela rádio o que se deve fazer. Também há
  informações na aplicação Alertswiss. Deve-se seguir as instruções e não ligar desnecessariamente para
  os números de emergência, para que fiquem livres para emergências reais.
