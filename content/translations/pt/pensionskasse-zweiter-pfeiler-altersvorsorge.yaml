id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: pt
source_version: 1
question: A previdência para a velhice na Suíça assenta em três pilares. Que instituição constitui o segundo
  pilar?
options:
  a: As prestações complementares ao seguro de velhice e sobrevivência (AHV)
  b: O seguro de velhice e sobrevivência (AHV) (seguro estatal de pensões)
  c: A caixa de pensões (Pensionskasse) (previdência profissional)
  d: A conta de poupança privada com dedução fiscal (pilar 3a)
explanation: A caixa de pensões pertence à previdência profissional e constitui o segundo pilar. Complementa
  o seguro de velhice e sobrevivência, para que os reformados possam manter de forma adequada o seu padrão
  de vida habitual. O seguro de velhice e sobrevivência é o primeiro pilar, a previdência privada é o
  terceiro pilar.
