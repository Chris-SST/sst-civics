    question_de: Die Altersvorsorge in der Schweiz beruht auf drei Säulen. Welche Einrichtung bildet die
      zweite Säule?
    options_de:
      a: Die Ergänzungsleistungen zur Alters- und Hinterlassenenversicherung (AHV)
      b: Die Alters- und Hinterlassenenversicherung (AHV) (staatliche Rentenversicherung)
      c: Die Pensionskasse (berufliche Vorsorge)
      d: Das private Sparkonto mit Steuerabzug (Säule 3a)
    explanation_de: Die Pensionskasse gehört zur beruflichen Vorsorge und bildet die zweite Säule. Sie
      ergänzt die Alters- und Hinterlassenenversicherung, damit die Rentner ihren gewohnten Lebensstandard
      angemessen beibehalten können. Die Alters- und Hinterlassenenversicherung ist die erste Säule, die
      private Vorsorge ist die dritte Säule.
