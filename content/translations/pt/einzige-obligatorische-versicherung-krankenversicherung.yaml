id: einzige-obligatorische-versicherung-krankenversicherung
lang: pt
source_version: 1
question: Qual dos seguintes seguros é obrigatório por lei na Suíça para todos os habitantes?
options:
  a: O seguro de protecção jurídica
  b: O seguro de saúde
  c: O seguro de viagem
  d: O seguro de recheio da habitação
explanation: O seguro de saúde é obrigatório para todas as pessoas com domicílio na Suíça. Os seguros
  de recheio da habitação, de protecção jurídica e de viagem são facultativos.
