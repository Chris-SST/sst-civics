id: osze-schweizer-engagement-friedenssicherung
lang: pt
source_version: 2
question: Pelo que se empenha a Suíça na Organização para a Segurança e a Cooperação na Europa (OSCE)?
options:
  a: Pela paz e pela segurança na Europa, por exemplo, na Europa de Leste e na Ásia Central
  b: Pela distribuição de fundos de apoio na Europa Ocidental
  c: Pela introdução de uma moeda comum
  d: Pela redução das tarifas aduaneiras no comércio mundial
explanation: A Suíça é membro fundador da OSCE e serve-se dela para promover a paz e a segurança na Europa.
  A OSCE atua com missões no terreno, sobretudo na Europa de Leste e do Sudeste e na Ásia Central. Em
  2026, a Suíça exerce a presidência da OSCE.
