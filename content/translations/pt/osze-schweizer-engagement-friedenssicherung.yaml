    question_de: Wofür setzt sich die Schweiz in der Organisation für Sicherheit und Zusammenarbeit in
      Europa (OSZE) ein?
    options_de:
      a: Für Frieden und Sicherheit in Europa, zum Beispiel in Osteuropa und in Zentralasien
      b: Für die Verteilung von Fördergeldern in Westeuropa
      c: Für die Einführung einer gemeinsamen Währung
      d: Für die Senkung der Zölle im Welthandel
    explanation_de: Die Schweiz ist Gründungsmitglied der OSZE und nutzt sie, um Frieden und Sicherheit
      in Europa zu fördern. Die OSZE ist mit Feldmissionen tätig, vor allem in Ost- und Südosteuropa und
      in Zentralasien. Im Jahr 2026 hat die Schweiz den Vorsitz der OSZE inne.
