id: textilindustrie-fruehe-industrialisierung-schweiz
lang: pt
source_version: 1
question: Qual foi o setor económico mais importante na fase inicial da industrialização da Suíça?
options:
  a: A indústria relojoeira
  b: A indústria farmacêutica
  c: A indústria têxtil
  d: A indústria de máquinas
explanation: Na fase inicial da industrialização, a indústria têxtil marcou a economia suíça, por exemplo
  com fiações, tecelagens e bordados. Um exemplo conhecido são os bordados de St. Gallen (St. Galler Stickereien),
  que eram muito procurados em todo o mundo. Outros setores só se tornaram tão importantes mais tarde.
