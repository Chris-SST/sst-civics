    question_de: Was gilt in der Schweiz in Bezug auf die Ehe mit mehreren Partnerinnen oder mehreren
      Partnern gleichzeitig?
    options_de:
      a: Sie ist erlaubt, wenn alle einverstanden sind
      b: Sie ist verboten
      c: Sie ist erlaubt, wenn es eine religiöse Rechtfertigung gibt
      d: Sie ist nur für Personen mit ausländischem Pass erlaubt
    explanation_de: Die Schweiz anerkennt nur die monogame Ehe. Wer bereits verheiratet ist oder in einer
      eingetragenen Partnerschaft lebt, kann keine weitere Ehe eingehen. Dies gilt unabhängig von der
      Religion oder der Herkunft.
