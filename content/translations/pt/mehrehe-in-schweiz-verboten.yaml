id: mehrehe-in-schweiz-verboten
lang: pt
source_version: 1
question: O que vale na Suíça em relação ao casamento com várias parceiras ou vários parceiros ao mesmo
  tempo?
options:
  a: É permitido, se todos concordarem
  b: É proibido
  c: É permitido, se tiver uma justificação religiosa
  d: É permitido apenas para pessoas com passaporte estrangeiro
explanation: A Suíça reconhece apenas o casamento monogâmico. Quem já é casado ou vive em união registada
  não pode contrair outro casamento. Isto aplica-se independentemente da religião ou da origem.
