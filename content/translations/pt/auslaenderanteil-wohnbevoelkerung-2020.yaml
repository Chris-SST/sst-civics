question: Qual era, aproximadamente, em 2020, a proporção de estrangeiros e estrangeiras na população
  residente permanente da Suíça?
options:
  a: cerca de três quintos
  b: cerca de um décimo
  c: cerca de metade
  d: cerca de um quarto
explanation: Em 2020, cerca de um quarto da população residente permanente não tinha passaporte suíço.
  No final de 2020, eram cerca de 2,2 de 8,7 milhões de pessoas, ou seja, aproximadamente 25 por cento.
  Em comparação com outros países da Europa, esta proporção é elevada.
