    question_de: Wer trägt in der Schweiz hauptsächlich die Verantwortung für die obligatorische öffentliche
      Schule?
    options_de:
      a: Die Schulleitungen und die Eltern
      b: Nur der Bund
      c: Die Bezirke und die Kirchen
      d: Die Kantone und die Gemeinden
    explanation_de: Die öffentliche Schule (Volksschule) liegt in der Zuständigkeit der Kantone und der
      Gemeinden. Der Kanton legt den allgemeinen Rahmen fest, und die Gemeinden führen die Schulen vor
      Ort. Der Bund spielt in der obligatorischen Schulzeit nur eine kleine Rolle.
