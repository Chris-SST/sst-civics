id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: pt
source_version: 1
question: Quem assume, na Suíça, principalmente a responsabilidade pela escola pública obrigatória?
options:
  a: As direções das escolas e os pais
  b: Apenas a Confederação
  c: Os distritos e as igrejas
  d: Os cantões e as comunas (Gemeinden)
explanation: A escola pública (Volksschule) é da competência dos cantões e das comunas. O cantão define
  o quadro geral, e as comunas gerem as escolas no local. A Confederação desempenha apenas um papel pequeno
  na escolaridade obrigatória.
