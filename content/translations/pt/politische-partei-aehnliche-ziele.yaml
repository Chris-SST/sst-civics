    question_de: Was beschreibt eine politische Partei am besten?
    options_de:
      a: Ein Gericht, das politische Streitigkeiten entscheidet
      b: Ein Zusammenschluss von Personen mit ähnlichen politischen Zielen
      c: Eine Gruppe von Gemeinden, die Aufgaben gemeinsam erfüllen
      d: Eine Behörde, die Wahlen und Abstimmungen durchführt
    explanation_de: In einer Partei kommen Personen zusammen, die ähnliche politische Ziele verfolgen.
      Bei Wahlen stellen die Parteien Kandidatinnen und Kandidaten auf und äussern sich zu den Vorlagen,
      über die abgestimmt wird. Sie sind keine staatlichen Behörden.
