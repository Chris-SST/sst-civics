id: politische-partei-aehnliche-ziele
lang: pt
source_version: 1
question: O que descreve melhor um partido político?
options:
  a: Um tribunal que decide litígios políticos
  b: Uma associação de pessoas com objetivos políticos semelhantes
  c: Um grupo de comunas (Gemeinden) que cumprem tarefas em conjunto
  d: Uma autoridade que realiza eleições e votações
explanation: Num partido, reúnem-se pessoas que perseguem objetivos políticos semelhantes. Nas eleições,
  os partidos apresentam candidatas e candidatos e pronunciam-se sobre os projetos submetidos a votação.
  Não são autoridades estatais.
