id: eidgenoessische-abstimmungstermine-pro-jahr
lang: pt
source_version: 1
question: Quantas vezes por ano se realizam normalmente votações populares federais na Suíça?
options:
  a: Uma vez
  b: Apenas de quatro em quatro anos
  c: Até quatro vezes
  d: Todos os meses
explanation: Para as votações populares federais estão previstos, por ano, até quatro domingos de votação.
  Numa mesma data, vota-se muitas vezes sobre vários projetos ao mesmo tempo. Em contrapartida, as eleições
  para o Conselho Nacional (Nationalrat) realizam-se de quatro em quatro anos e não são votações.
