question: De onde provém a maior parte dos estrangeiros residentes na Suíça?
options:
  a: De Estados da Ásia, cerca de dois terços
  b: De Estados de África, cerca de metade
  c: De Estados da União Europeia, cerca de dois terços
  d: De Estados da América, cerca de um terço
explanation: Cerca de 66 por cento da população estrangeira residente provém de Estados da UE, ou seja,
  aproximadamente dois terços. O restante vem de outros Estados europeus e do resto do mundo. O número
  pode variar ligeiramente com o tempo.
