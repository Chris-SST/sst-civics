id: ruetli-zusammenschluss-der-urkantone
lang: pt
source_version: 1
question: O que representa o Rütli na história suíça?
options:
  a: A união dos cantões primitivos
  b: A vitória na batalha de Marignano
  c: O início da Reforma
  d: A fundação do Estado federal em 1848
explanation: Segundo a tradição, representantes dos cantões primitivos terão feito uma aliança no Rütli.
  Por isso, o local é considerado um símbolo das origens da Confederação. O prado situa-se junto ao Lago
  dos Quatro Cantões.
