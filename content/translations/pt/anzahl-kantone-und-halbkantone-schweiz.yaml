question: Quantos cantões tem a Suíça e quantos deles são meios-cantões?
options:
  a: 26 cantões, dos quais 6 são meios-cantões
  b: 26 cantões, dos quais 3 são meios-cantões
  c: 23 cantões, dos quais 6 são meios-cantões
  d: 20 cantões, dos quais 6 são meios-cantões
explanation: 'A Suíça tem 26 cantões. Seis deles são meios-cantões: Obwalden, Nidwalden, Basileia-Cidade,
  Basileia-Campo, Appenzell Rodes Exteriores e Appenzell Rodes Interiores. No Conselho dos Estados (Ständerat),
  cada um deles tem um voto em vez de dois.'
