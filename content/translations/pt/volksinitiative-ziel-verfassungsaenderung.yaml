id: volksinitiative-ziel-verfassungsaenderung
lang: pt
source_version: 2
question: O que podem exigir os eleitores com uma iniciativa popular (Volksinitiative) federal?
options:
  a: Que o Conselho Federal (Bundesrat) seja destituído
  b: Que a Constituição Federal seja alterada
  c: Que uma lei federal existente seja diretamente revogada
  d: Que a constituição cantonal seja alterada
explanation: Com uma iniciativa popular federal, os eleitores podem exigir uma alteração da Constituição
  Federal. Com um referendo, por outro lado, o povo pode votar sobre uma nova lei que o Parlamento acabou
  de aprovar. Uma lei já existente não pode ser abolida por essa via.
