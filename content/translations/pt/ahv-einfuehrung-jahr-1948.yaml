id: ahv-einfuehrung-jahr-1948
lang: pt
source_version: 1
question: Em que ano foi introduzido o seguro de velhice e sobrevivência (AHV), o seguro estatal de pensões
  para a velhice e para os sobreviventes?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: O seguro de velhice e sobrevivência iniciou a sua atividade em 1948, depois de o povo ter
  aprovado a lei em 1947. Constitui o primeiro pilar do sistema suíço dos três pilares. Garante a subsistência
  na velhice e a dos sobreviventes.
