    question_de: Welche Funktion haben die politischen Parteien in der Demokratie?
    options_de:
      a: Sie urteilen über Streitigkeiten
      b: Sie vertreten die verschiedenen Interessen der Bevölkerung
      c: Sie führen die eidgenössischen Abstimmungen durch
      d: Sie wenden die Gesetze im Alltag an
    explanation_de: Die Parteien bündeln die verschiedenen Interessen und Meinungen der Bevölkerung und
      tragen sie in die Politik. Die Gesetze durchzusetzen ist Aufgabe der Behörden, und Recht zu sprechen
      ist Aufgabe der Gerichte.
