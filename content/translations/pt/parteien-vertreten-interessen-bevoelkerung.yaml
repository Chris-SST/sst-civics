id: parteien-vertreten-interessen-bevoelkerung
lang: pt
source_version: 1
question: Qual é a função dos partidos políticos na democracia?
options:
  a: Eles julgam os litígios
  b: Eles representam os diferentes interesses da população
  c: Eles realizam as votações federais
  d: Eles aplicam as leis no dia a dia
explanation: Os partidos reúnem os diversos interesses e opiniões da população e levam-nos para a política.
  Fazer cumprir as leis é tarefa das autoridades, e julgar é tarefa dos tribunais.
