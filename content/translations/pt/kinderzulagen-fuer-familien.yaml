id: kinderzulagen-fuer-familien
lang: pt
source_version: 1
question: Que prestação estatal recebem as famílias com filhos na Suíça?
options:
  a: Pensão de invalidez
  b: Abonos para filhos
  c: Prémio para a propriedade de habitação própria
  d: Subsídio diário de desemprego
explanation: As famílias recebem abonos para filhos como contributo para os custos de sustento dos filhos.
  Fazem parte dos abonos de família, que são regulados na lei da Confederação.
