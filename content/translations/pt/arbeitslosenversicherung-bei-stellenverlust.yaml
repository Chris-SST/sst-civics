id: arbeitslosenversicherung-bei-stellenverlust
lang: pt
source_version: 1
question: Qual seguro social entra em ação quando uma pessoa perde o seu emprego?
options:
  a: O seguro de invalidez
  b: O seguro de velhice e sobrevivência
  c: O seguro de desemprego
  d: O seguro de acidentes
explanation: O seguro de desemprego paga, sob determinadas condições, uma indemnização quando alguém perde
  o emprego. Também ajuda na procura de um novo trabalho.
