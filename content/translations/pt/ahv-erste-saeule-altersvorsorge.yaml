id: ahv-erste-saeule-altersvorsorge
lang: pt
source_version: 1
question: Qual instituição constitui o primeiro pilar da previdência para a velhice na Suíça?
options:
  a: O pilar privado 3a
  b: O seguro de velhice e sobrevivência (AHV) estatal
  c: A caixa de pensões
  d: A seguradora de saúde (Krankenkasse)
explanation: O seguro de velhice e sobrevivência é a previdência estatal e constitui o primeiro pilar.
  A caixa de pensões é o segundo pilar, a previdência privada é o terceiro pilar.
