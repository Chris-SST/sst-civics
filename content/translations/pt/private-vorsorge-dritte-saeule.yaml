question: O que constitui, na Suíça, o terceiro pilar da previdência para a velhice?
options:
  a: O seguro obrigatório contra acidentes
  b: A previdência privada
  c: A caixa de pensões da entidade patronal
  d: As prestações complementares
explanation: O terceiro pilar é a previdência privada, por exemplo a poupança vinculada. É facultativa
  e complementa os dois primeiros pilares.
