question: Como é a bandeira da Suíça?
options:
  a: Uma cruz branca, isolada, sobre um quadrado vermelho
  b: Uma cruz branca sobre fundo vermelho, com um brasão no centro
  c: Uma cruz branca que se estende até à borda do retângulo vermelho
  d: Uma cruz vermelha, isolada, sobre um quadrado branco
explanation: A bandeira da Suíça é quadrada. Mostra uma cruz branca sobre fundo vermelho, cujos braços
  não tocam a borda. Juntamente com a bandeira do Vaticano, é uma das duas bandeiras nacionais quadradas.
