    question_de: Welche Ebene des Staates in der Schweiz ist dafür verantwortlich, den sozialen Schutz
      der Bevölkerung sicherzustellen, zum Beispiel durch die Altersvorsorge?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Der Bund
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung überträgt dem Bund wichtige Aufgaben der sozialen Sicherheit.
      Dazu zählen zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung.
      So gelten in der ganzen Schweiz einheitliche Grundlagen.
