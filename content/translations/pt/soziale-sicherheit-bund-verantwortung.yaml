id: soziale-sicherheit-bund-verantwortung
lang: pt
source_version: 1
question: Qual nível do Estado na Suíça é responsável por garantir a proteção social da população, por
  exemplo através da previdência para a velhice?
options:
  a: Os distritos
  b: Apenas as comunas (Gemeinden)
  c: A Confederação
  d: Apenas os cantões
explanation: A Constituição Federal atribui à Confederação importantes tarefas de segurança social. Entre
  elas contam-se, por exemplo, o seguro de velhice e sobrevivência (AVS) e o seguro de invalidez. Assim,
  aplicam-se bases uniformes em toda a Suíça.
