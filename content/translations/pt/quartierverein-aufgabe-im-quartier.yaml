    question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Gemeinde oder Stadt des
      Kantons Zürich?
    options_de:
      a: Er vertritt die Anliegen der Quartierbevölkerung gegenüber den Behörden und fördert das Zusammenleben.
      b: Er führt das Einwohnerregister des Quartiers.
      c: Er erhebt Steuern bei den Einwohnern des Quartiers.
      d: Er bewilligt Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Einwohnern. Er bringt
      die Anliegen des Quartiers bei den Behörden vor und organisiert Anlässe, die das Zusammenleben stärken.
      Hoheitliche Aufgaben wie Steuern, Baubewilligungen oder das Einwohnerregister gehören zur Gemeinde.
