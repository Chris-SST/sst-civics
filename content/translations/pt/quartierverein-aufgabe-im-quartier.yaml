id: quartierverein-aufgabe-im-quartier
lang: pt
source_version: 1
question: Qual é uma tarefa típica de uma associação de bairro (Quartierverein) numa comuna (Gemeinde)
  ou cidade de Zurique?
options:
  a: Representa as preocupações da população do bairro perante as autoridades e promove a convivência.
  b: Gere o registo de residentes do bairro.
  c: Cobra impostos aos habitantes do bairro.
  d: Autoriza pedidos de licença de construção no bairro.
explanation: Uma associação de bairro é uma união voluntária de habitantes. Apresenta às autoridades as
  preocupações do bairro e organiza eventos que reforçam a convivência. As tarefas de autoridade pública,
  como impostos, licenças de construção ou o registo de residentes, pertencem à comuna.
