id: kantonsrat-amtsdauer-vier-jahre
lang: pt
source_version: 1
question: Por quantos anos são eleitos os membros do Conselho Cantonal (Kantonsrat) de Zurique?
options:
  a: Por dois anos
  b: Por três anos
  c: Por seis anos
  d: Por quatro anos
explanation: Os membros do Conselho Cantonal de Zurique são eleitos para um mandato de quatro anos. Depois
  disso, realizam-se eleições de renovação integral. As pessoas com direito de voto podem então decidir
  novamente quem terá assento no parlamento.
