id: datenschutz-verletzung-ohne-einverstaendnis
lang: pt
source_version: 1
question: Em que caso é violada a proteção de dados?
options:
  a: Informações privadas sobre uma pessoa são divulgadas sem o seu consentimento e sem base legal.
  b: Uma autoridade armazena dados, conforme exigido por uma lei.
  c: Uma pessoa fornece voluntariamente o seu próprio endereço.
  d: Uma pessoa autoriza expressamente a publicação da sua fotografia.
explanation: A proteção da esfera privada inclui a proteção contra o uso indevido de dados pessoais. As
  informações privadas só podem ser divulgadas com o consentimento da pessoa ou com base numa lei. Se
  não existir nenhum dos dois, há uma violação.
