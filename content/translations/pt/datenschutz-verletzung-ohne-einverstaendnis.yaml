    source_version: 1
    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Informationen über eine Person werden ohne ihre Einwilligung und ohne gesetzliche Grundlage
        weitergegeben.
      b: Eine Behörde speichert Daten, wie es ein Gesetz verlangt.
      c: Eine Person gibt freiwillig ihre eigene Adresse an.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz der Privatsphäre umfasst den Schutz vor dem missbräuchlichen Gebrauch persönlicher
      Daten. Private Informationen dürfen nur mit der Einwilligung der Person oder aufgrund eines Gesetzes
      weitergegeben werden. Wenn keines von beidem vorliegt, liegt eine Verletzung vor.
