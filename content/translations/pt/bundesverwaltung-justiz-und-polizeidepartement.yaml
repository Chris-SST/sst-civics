id: bundesverwaltung-justiz-und-polizeidepartement
lang: pt
source_version: 1
question: Qual das seguintes entidades pertence à administração federal?
options:
  a: O Conselho Nacional (Nationalrat)
  b: A Assembleia Federal (Bundesversammlung)
  c: O Tribunal Federal (Bundesgericht)
  d: O Departamento de Justiça e Polícia
explanation: A administração federal está organizada em departamentos. O Departamento de Justiça e Polícia
  é um deles e pertence à administração sob a direção do Conselho Federal (Bundesrat). O Conselho Nacional
  e a Assembleia Federal pertencem ao Parlamento, o Tribunal Federal ao poder judicial.
