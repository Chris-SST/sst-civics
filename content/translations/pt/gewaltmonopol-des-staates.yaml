id: gewaltmonopol-des-staates
lang: pt
source_version: 2
question: Quem pode, em princípio, recorrer à força física na Suíça?
options:
  a: Empresas de segurança privadas, por incumbência de associações
  b: Qualquer pessoa que se sinta ameaçada
  c: Apenas o Estado
  d: Qualquer comuna (Gemeinde) com milícias de cidadãos próprias
explanation: 'Na Suíça, o Estado detém o monopólio da força: em princípio, só ele pode recorrer à força
  física, por exemplo através da polícia ou do exército. Uma exceção é a legítima defesa: quem for atacado
  ilicitamente pode defender-se de forma proporcionada, mas o simples sentimento de estar ameaçado não
  é suficiente para isso.'
