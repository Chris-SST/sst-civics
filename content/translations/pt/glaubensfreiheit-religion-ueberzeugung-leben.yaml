    question_de: Was gehört gemäss Bundesverfassung zur Glaubens- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und gemäss diesen zu leben
      b: Nur die Mitgliedschaft in einer anerkannten Kantonskirche
      c: Die Pflicht, den Glauben der Eltern beizubehalten
      d: Das Recht, andere Personen zu zwingen, den eigenen Glauben anzunehmen
    explanation_de: Jede Person kann ihre Religion und ihre philosophische Überzeugung frei wählen und
      gemäss diesen leben. Es ist auch erlaubt, den Glauben zu wechseln oder keinen zu haben. Niemand
      kann gezwungen werden, einen Glauben zu haben.
