id: glaubensfreiheit-religion-ueberzeugung-leben
lang: pt
source_version: 1
question: O que faz parte da liberdade de crença e de consciência segundo a Constituição Federal?
options:
  a: O direito de ter uma crença e uma convicção e de viver de acordo com elas
  b: Apenas a filiação a uma igreja cantonal reconhecida
  c: O dever de manter a crença dos pais
  d: O direito de obrigar outras pessoas a adotar a própria crença
explanation: Toda pessoa pode escolher livremente a sua religião e a sua convicção filosófica e viver
  de acordo com elas. Também é permitido mudar de crença ou não ter nenhuma. Ninguém pode ser forçado
  a ter uma crença.
