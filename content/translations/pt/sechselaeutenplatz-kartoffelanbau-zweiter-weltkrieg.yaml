    explanation_de: Während des Zweiten Weltkriegs gab es in der Schweiz wenig Lebensmittel. Deshalb wurden
      mit der «Anbauschlacht» auch Flächen mitten in den Städten bepflanzt, zum Beispiel der Sechseläutenplatz
      in Zürich, wo Kartoffeln gepflanzt wurden. Tabak, Weinreben und Baumwolle wurden dort nicht angebaut.
