question: Qual destas plantas foi cultivada na Sechseläutenplatz, em Zurique, durante a Segunda Guerra
  Mundial?
options:
  a: Tabaco
  b: Videiras
  c: Algodão
  d: Batatas
explanation: Durante a Segunda Guerra Mundial, havia poucos alimentos na Suíça. Por isso, com a «Batalha
  das Culturas» («Anbauschlacht»), também se cultivaram áreas no meio das cidades, por exemplo a Sechseläutenplatz,
  em Zurique, onde se plantaram batatas. Tabaco, videiras e algodão não foram cultivados ali.
