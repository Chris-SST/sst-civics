    source_version: 1
    question_de: Wer entscheidet auf Ebene des Bundes in letzter Instanz in einer Abstimmung, ob eine
      Volksinitiative oder ein Referendum angenommen wird?
    options_de:
      a: Die Bundesversammlung in einer gemeinsamen Sitzung der beiden Kammern
      b: Der Bundesrat nach Anhörung der Kantonsregierungen
      c: Das Bundesgericht nach einer rechtlichen Prüfung der Vorlage
      d: Die stimmberechtigten Bürgerinnen und Bürger, die an der Urne oder auf dem Korrespondenzweg abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die stimmberechtigten Bürgerinnen und Bürger
      das letzte Wort. Sie entscheiden in der Volksabstimmung an der Urne, was in der Schweiz auch auf
      dem Korrespondenzweg möglich ist. Der Bundesrat, das Parlament und das Bundesgericht können das
      Ergebnis nicht ersetzen.
