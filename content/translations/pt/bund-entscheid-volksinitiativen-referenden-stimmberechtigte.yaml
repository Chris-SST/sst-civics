id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: pt
source_version: 1
question: Quem decide em última instância, a nível da Confederação, numa votação, se uma iniciativa popular
  (Volksinitiative) ou um referendo é aceite?
options:
  a: A Assembleia Federal (Bundesversammlung) numa sessão conjunta das duas câmaras
  b: O Conselho Federal (Bundesrat) após audição dos governos dos cantões
  c: O Tribunal Federal (Bundesgericht) após uma análise jurídica do projeto
  d: Os cidadãos com direito de voto, que votam na urna ou por correspondência
explanation: Nas iniciativas populares e nos referendos, os cidadãos com direito de voto têm a última
  palavra. Decidem na votação popular, na urna, que na Suíça também é possível por correspondência. O
  Conselho Federal, o Parlamento e o Tribunal Federal não podem substituir o resultado.
