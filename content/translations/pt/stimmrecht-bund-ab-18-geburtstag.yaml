id: stimmrecht-bund-ab-18-geburtstag
lang: pt
source_version: 1
question: A partir de que idade os cidadãos suíços podem votar e eleger a nível federal?
options:
  a: A partir do 20.º aniversário
  b: A partir do 21.º aniversário
  c: A partir do 16.º aniversário
  d: A partir do 18.º aniversário
explanation: O direito de voto e de eleição a nível da Confederação começa com a maioridade, ou seja,
  com o 18.º aniversário. Esta idade aplica-se da mesma forma às eleições e às votações da Confederação.
