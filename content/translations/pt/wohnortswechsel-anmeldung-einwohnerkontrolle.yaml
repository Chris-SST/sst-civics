id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: pt
source_version: 1
question: Onde deve se registar se se mudar para outra comuna (Gemeinde) do cantão de Zurique?
options:
  a: No tribunal distrital
  b: No Serviço Federal de Estatística da Confederação
  c: Na polícia cantonal
  d: No controlo de habitantes da nova comuna de residência
explanation: O registo é feito no controlo de habitantes (Einwohnerkontrolle), também chamado serviço
  de habitantes (Einwohneramt). Este mantém o registo dos habitantes da comuna.
