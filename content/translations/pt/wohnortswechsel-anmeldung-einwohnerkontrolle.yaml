    question_de: Wo muss man sich anmelden, wenn man in eine andere Gemeinde des Kantons Zürich umzieht?
    options_de:
      a: Beim Bezirksgericht
      b: Beim Bundesamt für Statistik
      c: Bei der Kantonspolizei
      d: Bei der Einwohnerkontrolle der neuen Wohngemeinde
    explanation_de: Die Anmeldung erfolgt bei der Einwohnerkontrolle, auch Einwohneramt genannt. Diese
      führt das Register der Einwohner der Gemeinde.
