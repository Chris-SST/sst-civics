id: foehn-warmer-trockener-suedwind
lang: pt
source_version: 1
question: O que é o Föhn?
options:
  a: Um vento frio e húmido vindo do norte
  b: Um vento frio vindo do leste no inverno
  c: Uma chuva forte na primavera
  d: Um vento quente e seco vindo da direção sul
explanation: O Föhn é um vento descendente quente e seco que sopra nos Alpes, sobretudo do sul. Pode fazer
  as temperaturas subir rapidamente e tornar a visibilidade muito nítida.
