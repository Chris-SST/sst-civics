id: jass-klassisches-schweizer-kartenspiel
lang: pt
source_version: 1
question: Qual jogo de cartas é considerado na Suíça o jogo de cartas clássico e tradicional do país?
options:
  a: Bridge
  b: Jass
  c: Pôquer
  d: Rummy
explanation: O Jass é considerado o jogo de cartas típico da Suíça. Joga-se, em geral, a quatro, em duas
  equipas, muitas vezes com cartas francesas ou com cartas da Suíça alemã. Joga-se em muitas famílias
  e em muitos restaurantes e tabernas (Beizen).
