    question_de: Seit wann steht die Gleichberechtigung von Männern und Frauen in der Schweizerischen
      Bundesverfassung?
    options_de:
      a: Seit 1999
      b: Seit 1971
      c: Seit 1981
      d: Seit 1848
    explanation_de: 1981 wurde der Gleichstellungsartikel in die Bundesverfassung aufgenommen. Er verpflichtet
      den Staat, die Gleichstellung in der Familie, in der Ausbildung und bei der Arbeit zu gewährleisten.
      Das Stimmrecht der Frauen gab es bereits seit 1971.
