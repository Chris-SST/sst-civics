id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: pt
source_version: 1
question: Desde quando a igualdade de direitos entre homens e mulheres consta da Constituição Federal
  suíça?
options:
  a: Desde 1999
  b: Desde 1971
  c: Desde 1981
  d: Desde 1848
explanation: Em 1981, o artigo sobre a igualdade foi incluído na Constituição Federal. Ele obriga o Estado
  a garantir a igualdade na família, na formação e no trabalho. O direito de voto das mulheres já existia
  desde 1971.
