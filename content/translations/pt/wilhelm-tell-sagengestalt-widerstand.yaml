id: wilhelm-tell-sagengestalt-widerstand
lang: pt
source_version: 1
question: O que representa a figura lendária Guilherme Tell, da Suíça Central?
options:
  a: A resistência contra governantes estrangeiros
  b: A neutralidade da Suíça em tempo de guerra
  c: A introdução da Reforma
  d: A fundação do primeiro banco suíço
explanation: A lenda conta a história de um homem que se defende da opressão exercida por bailios estrangeiros.
  Por isso, Guilherme Tell é considerado um símbolo da liberdade. Não está comprovado que ele tenha realmente
  existido.
