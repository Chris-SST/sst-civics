id: ch-kuerzel-lateinischer-landesname
lang: pt
source_version: 1
question: O que significa a sigla do país «CH» da Suíça?
options:
  a: O nome francês Confédération Helvétique
  b: A expressão «Cantons Helvétiques»
  c: O nome latino Civitas Helvetica
  d: O nome latino do país Confoederatio Helvetica
explanation: CH é a forma abreviada de Confoederatio Helvetica, o nome latino da Suíça. Utiliza-se o latim
  porque não favorece nenhuma das quatro línguas nacionais. A sigla aparece, por exemplo, nas matrículas
  dos automóveis e nos endereços da Internet.
