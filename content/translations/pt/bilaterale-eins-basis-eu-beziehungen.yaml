id: bilaterale-eins-basis-eu-beziehungen
lang: pt
source_version: 1
question: Quais tratados, aprovados pelo povo em 2000, constituem a base das relações actuais da Suíça
  com a UE?
options:
  a: Os Acordos Bilaterais I
  b: O tratado do EEE
  c: O tratado de Schengen isoladamente
  d: O tratado de adesão à UE
explanation: O eleitorado aprovou os Acordos Bilaterais I em 2000. Estes regulam o acesso a determinados
  sectores do mercado interno, por exemplo a livre circulação de pessoas e os transportes terrestres.
  O povo não tinha aprovado o EEE em 1992.
