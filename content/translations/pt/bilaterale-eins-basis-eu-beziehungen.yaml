    question_de: Welche Verträge, die 2000 vom Volk angenommen wurden, bilden die Grundlage der aktuellen
      Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen Abkommen I
      b: Der EWR-Vertrag
      c: Der Schengen-Vertrag allein
      d: Der Vertrag über den Beitritt zur EU
    explanation_de: Die Stimmberechtigten haben die Bilateralen Abkommen I im Jahr 2000 angenommen. Diese
      regeln den Zugang zu bestimmten Sektoren des Binnenmarkts, zum Beispiel die Personenfreizügigkeit
      und den Landverkehr. Das Volk hatte den EWR 1992 nicht angenommen.
