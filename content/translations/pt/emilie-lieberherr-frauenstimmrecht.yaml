question: Pelo que se empenhou a política zuriquense Emilie Lieberherr?
options:
  a: Pela construção do aeroporto de Zurique
  b: Pela adesão da Suíça à ONU
  c: Pelo direito de voto e de eleição das mulheres
  d: Pela abolição da assembleia municipal (Gemeindeversammlung)
explanation: Emilie Lieberherr lutou, na década de 1960, pelo direito de voto e de eleição das mulheres.
  A nível da Confederação, esse direito foi introduzido em 1971. No cantão de Zurique, vigora desde 1970.
