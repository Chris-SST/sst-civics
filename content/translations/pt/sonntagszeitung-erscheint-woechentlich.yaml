question: Com que frequência é publicado um jornal dominical na Suíça?
options:
  a: Uma vez por semana
  b: Duas vezes por semana
  c: Uma vez por mês
  d: Todos os dias
explanation: Um jornal dominical é publicado apenas uma vez por semana, ao domingo. Os jornais diários,
  por outro lado, são publicados na maioria dos dias da semana. A imprensa faz parte da cultura e da formação
  da opinião no país.
