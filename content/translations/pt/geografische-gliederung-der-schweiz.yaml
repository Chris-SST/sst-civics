question: Em quais três grandes regiões paisagísticas a Suíça se divide geograficamente?
options:
  a: Jura, Planalto Suíço (Mittelland) e Alpes
  b: Jura, Lago de Constança e Alpes
  c: Floresta Negra, Planalto Suíço e Alpes
  d: Planalto Suíço, Pré-Alpes e Tessino
explanation: O Jura situa-se no noroeste e os Alpes ocupam a maior parte da superfície. Entre eles situa-se
  o Planalto Suíço, onde vive a maioria das pessoas.
