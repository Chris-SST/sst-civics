    question_de: Was bedeutet der Grundsatz der Rechtsgleichheit (Gleichheit vor dem Gesetz)?
    options_de:
      a: Alle Kantone haben dieselben Gesetze.
      b: Alle Personen bekleiden dieselben politischen Ämter.
      c: Alle Personen haben dasselbe Einkommen.
      d: Das Gesetz gilt für alle Personen gleichermassen.
    explanation_de: Die Gleichheit vor dem Gesetz ist in Artikel 8 der Bundesverfassung vorgesehen. Alle
      Menschen sind vor dem Gesetz gleich, und niemand darf zum Beispiel aufgrund der Herkunft oder des
      Geschlechts diskriminiert werden. Das bedeutet nicht, dass alle die gleiche Menge an Gütern besitzen.
