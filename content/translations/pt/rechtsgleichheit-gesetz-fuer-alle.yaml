id: rechtsgleichheit-gesetz-fuer-alle
lang: pt
source_version: 1
question: O que significa o princípio da igualdade perante a lei?
options:
  a: Todos os cantões têm as mesmas leis.
  b: Todas as pessoas ocupam os mesmos cargos políticos.
  c: Todas as pessoas têm o mesmo rendimento.
  d: A lei aplica-se a todas as pessoas por igual.
explanation: A igualdade perante a lei está prevista no artigo 8 da Constituição Federal. Todos os seres
  humanos são iguais perante a lei e ninguém pode ser discriminado, por exemplo, em razão da origem ou
  do sexo. Isso não significa que todos possuam a mesma quantidade de bens.
