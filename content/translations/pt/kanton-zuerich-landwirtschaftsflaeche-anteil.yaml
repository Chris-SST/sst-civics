question: Qual é, aproximadamente, a proporção da superfície do cantão de Zurique que é utilizada para
  fins agrícolas?
options:
  a: Cerca de 68 por cento
  b: Cerca de 25 por cento
  c: Cerca de 11 por cento
  d: Cerca de 41 por cento
explanation: Cerca de 41 por cento da superfície do cantão de Zurique é utilizada para a agricultura.
  O restante é composto sobretudo por floresta, área urbanizada e massas de água.
