question: Entre quem foi travada, em 1847, a Guerra do Sonderbund na Suíça?
options:
  a: Entre os cantões de língua alemã e os cantões de língua francesa
  b: Entre as forças liberais e os cantões católicos
  c: Entre cantões urbanos e cantões rurais por causa dos impostos
  d: Entre a Suíça e a França
explanation: No Sonderbund, vários cantões católico-conservadores tinham-se unido. As forças liberais
  queriam uma Confederação mais forte. A curta guerra terminou com a vitória do lado liberal e abriu caminho
  ao Estado federal de 1848.
