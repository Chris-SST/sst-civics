id: limmat-fliesst-durch-kanton-zuerich
lang: pt
source_version: 1
question: Qual rio sai do Lago de Zurique, atravessa a cidade de Zurique e segue depois pelo território
  do cantão?
options:
  a: O Thur
  b: O Birs
  c: O Reuss
  d: O Limmat
explanation: O Limmat nasce na saída do Lago de Zurique e atravessa a cidade de Zurique e o vale do Limmat
  (Limmattal). Depois deixa o território do cantão em direção ao Aargau. O Reuss, o Thur e o Birs não
  saem do Lago de Zurique.
