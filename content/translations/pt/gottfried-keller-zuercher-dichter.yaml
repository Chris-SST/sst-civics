id: gottfried-keller-zuercher-dichter
lang: pt
source_version: 2
question: Qual destes conhecidos poetas e escritores era natural de Zurique?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller nasceu em Zurique em 1819, escreveu, por exemplo, «O Henrique Verde» («Der
  grüne Heinrich») e também trabalhou como secretário do governo (Staatsschreiber) do cantão de Zurique.
  Robert Walser era natural de Biel, Friedrich Dürrenmatt de Konolfingen, no cantão de Berna, e Jeremias
  Gotthelf atuou como pastor no cantão de Berna.
