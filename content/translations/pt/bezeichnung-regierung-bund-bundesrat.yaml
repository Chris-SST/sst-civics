id: bezeichnung-regierung-bund-bundesrat
lang: pt
source_version: 1
question: Como se chama o governo da Suíça a nível federal?
options:
  a: Assembleia Federal (Bundesversammlung)
  b: Conselho Federal (Bundesrat)
  c: Chancelaria Federal (Bundeskanzlei)
  d: Tribunal Federal (Bundesgericht)
explanation: O governo da Confederação chama-se Conselho Federal. A Assembleia Federal é o parlamento,
  o Tribunal Federal é o tribunal supremo. A Chancelaria Federal apoia o Conselho Federal.
