lang: pt
source_version: 1
question: Quem conta os votos depositados nas eleições e votações numa comuna (Gemeinde) do cantão de
  Zurique?
options:
  a: A autoridade de assistência social
  b: A mesa eleitoral
  c: A secretária municipal, sozinha
  d: O Ministério Público
explanation: A mesa eleitoral apura os resultados da comuna nas votações e nas eleições. É composta por
  várias pessoas, para que a contagem decorra de forma correta e transparente.
