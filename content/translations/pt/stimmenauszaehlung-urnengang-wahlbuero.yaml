    question_de: Wer zählt bei Wahlen und Abstimmungen in einer Gemeinde des Kantons Zürich die abgegebenen
      Stimmen aus?
    options_de:
      a: Die Sozialbehörde
      b: Das Wahlbüro
      c: Die Gemeindeschreiberin allein
      d: Die Staatsanwaltschaft
    explanation_de: Das Wahlbüro ermittelt bei Abstimmungen und Wahlen die Ergebnisse der Gemeinde. Es
