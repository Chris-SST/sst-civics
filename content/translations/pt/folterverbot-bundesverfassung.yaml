    question_de: Was sagt die Bundesverfassung über die Folter?
    options_de:
      a: Die Folter ist nur in Bezug auf Straftäter verboten.
      b: Die Folter ist der Polizei in Notfallsituationen erlaubt.
      c: Die Folter ist erlaubt, wenn ein Gericht seine Zustimmung gibt.
      d: Niemand darf gefoltert werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet die Folter und jede andere Art grausamer,
      unmenschlicher oder erniedrigender Behandlung. Dieses Verbot gilt für alle Personen ohne Ausnahme.
      Nicht einmal der Staat darf Ausnahmen machen.
