id: folterverbot-bundesverfassung
lang: pt
source_version: 1
question: O que diz a Constituição Federal sobre a tortura?
options:
  a: A tortura só é proibida em relação a criminosos.
  b: A tortura é permitida à polícia em situações de emergência.
  c: A tortura é permitida se um tribunal der o seu consentimento.
  d: Ninguém pode ser torturado.
explanation: O artigo 10 da Constituição Federal proíbe a tortura e qualquer outro tipo de tratamento
  cruel, desumano ou degradante. Esta proibição aplica-se a todas as pessoas, sem exceção. Nem mesmo o
  Estado pode fazer exceções.
