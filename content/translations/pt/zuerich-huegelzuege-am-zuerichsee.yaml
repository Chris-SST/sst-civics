id: zuerich-huegelzuege-am-zuerichsee
lang: pt
source_version: 2
question: Quais cadeias de colinas se situam nas margens do lago de Zurique?
options:
  a: Uetliberg, Albis e Pfannenstiel
  b: Lägern, Irchel e Kohlfirst
  c: Hörnli, Bachtel e Allmann
  d: Heitersberg, Gubrist e Randen
explanation: O Uetliberg e o Albis estendem-se ao longo da margem esquerda do lago de Zurique, e o Pfannenstiel
  situa-se na margem direita. As outras elevações ficam mais afastadas do lago, por exemplo no Unterland,
  no Weinland, no Oberland zuriquense ou noutros cantões.
