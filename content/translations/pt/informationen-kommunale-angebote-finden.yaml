id: informationen-kommunale-angebote-finden
lang: pt
source_version: 2
question: Onde se encontram informações sobre as ofertas e as regras da própria comuna (Gemeinde)?
options:
  a: Na Folha Federal da Confederação (Bundesblatt)
  b: No jornal local ou no site da comuna
  c: Na embaixada do país de origem
  d: No Conselho Federal (Bundesrat), em Berna
explanation: A comuna informa sobre as suas ofertas e regras principalmente no jornal local e no seu site
  na internet. A Confederação e o Conselho Federal são responsáveis por temas nacionais; uma embaixada
  estrangeira não é de todo responsável pela comuna. A administração da comuna também presta informações.
