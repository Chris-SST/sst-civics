    question_de: Wo findet man Informationen über die Angebote und die Regeln der eigenen Gemeinde?
    options_de:
      a: Im Bundesblatt des Bundes
      b: In der lokalen Zeitung oder auf der Website der Gemeinde
      c: In der Botschaft des Herkunftslandes
      d: Im Bundesrat in Bern
    explanation_de: Die Gemeinde informiert hauptsächlich in der lokalen Zeitung und auf ihrer Website
      im Internet über ihre Angebote und Regeln. Der Bund und der Bundesrat sind für nationale Themen
      zuständig; eine ausländische Botschaft ist für die Gemeinde überhaupt nicht zuständig. Auch die
      Gemeindeverwaltung erteilt Auskünfte.
