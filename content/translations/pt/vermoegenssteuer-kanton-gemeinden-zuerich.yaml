id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: pt
source_version: 1
question: Qual destes impostos o cantão de Zurique e as comunas (Gemeinden) cobram sobre o património
  de uma pessoa, por exemplo sobre depósitos bancários e valores mobiliários?
options:
  a: O imposto antecipado
  b: O imposto sobre o valor acrescentado
  c: O imposto sobre o património
  d: O imposto sobre os óleos minerais
explanation: O cantão e as comunas tributam o património das pessoas singulares. O imposto sobre o valor
  acrescentado, o imposto antecipado e o imposto sobre os óleos minerais são impostos da Confederação.
