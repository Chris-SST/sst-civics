id: zulassung-motorfahrzeuge-kantonales-strassenverkehrsamt
lang: pt
source_version: 1
question: Quem, no cantão de Zurique, autoriza um veículo a motor a circular na via pública e emite para
  isso as matrículas?
options:
  a: A polícia cantonal durante uma fiscalização de trânsito
  b: O serviço de trânsito rodoviário do cantão (Strassenverkehrsamt)
  c: O Touring Club Suíça
  d: A administração da comuna (Gemeinde) do local de residência
explanation: A autorização de veículos a motor é da competência do serviço cantonal de trânsito rodoviário.
  É também este serviço que emite as matrículas. A comuna e a polícia não são competentes para isso.
