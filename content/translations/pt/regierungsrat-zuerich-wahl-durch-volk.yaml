id: regierungsrat-zuerich-wahl-durch-volk
lang: pt
source_version: 1
question: Quem determina, no cantão de Zurique, quem faz parte do Conselho de Governo (Regierungsrat)?
options:
  a: A Assembleia Federal (Bundesversammlung) elege os membros do Conselho de Governo.
  b: O Conselho Cantonal (Kantonsrat) elege os membros de entre os seus próprios membros.
  c: Os presidentes e as presidentes das comunas (Gemeinde) elegem os membros.
  d: A população cantonal com direito de voto elege os membros diretamente.
explanation: No cantão de Zurique, o povo elege o Conselho de Governo diretamente nas urnas. O Conselho
  Cantonal é o parlamento e não elege o governo. Isto distingue o cantão da Confederação, onde a Assembleia
  Federal elege o Conselho Federal (Bundesrat).
