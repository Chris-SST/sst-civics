id: einkommenssteuer-kanton-gemeinden-zuerich
lang: pt
source_version: 1
question: Que imposto importante o cantão de Zurique e as comunas (Gemeinden) cobram sobre o salário e
  outros rendimentos das pessoas?
options:
  a: O imposto sobre o rendimento
  b: O imposto sobre heranças
  c: O imposto sobre cães
  d: O imposto sobre veículos a motor
explanation: O imposto sobre o rendimento é um dos impostos mais importantes do cantão e das comunas.
  É cobrado sobre o rendimento das pessoas singulares. Os outros impostos são menos importantes ou incidem
  sobre outra coisa.
