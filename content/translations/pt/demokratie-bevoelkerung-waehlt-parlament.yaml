    question_de: Was gehört in einer Demokratie wie der Schweiz zu den Rechten der Bevölkerung?
    options_de:
      a: Sie ernennt die Richter des Bundesgerichts durch Losentscheid.
      b: Sie bestimmt die Gesetze allein, ohne das Parlament.
      c: Sie bestimmt ihr Parlament durch Wahlen.
      d: Sie wählt die Führung der Armee direkt.
    explanation_de: In der Demokratie wählt die Bevölkerung ihre Vertreter ins Parlament. Auf Ebene des
      Bundes sind dies der Nationalrat und der Ständerat. Das Parlament verabschiedet dann im Namen des
      Volkes die Bundesgesetze.
