id: demokratie-bevoelkerung-waehlt-parlament
lang: pt
source_version: 1
question: Numa democracia como a Suíça, o que faz parte dos direitos da população?
options:
  a: Ela nomeia por sorteio os juízes do Tribunal Federal (Bundesgericht).
  b: Ela determina sozinha as leis, sem o Parlamento.
  c: Ela determina o seu Parlamento através de eleições.
  d: Ela elege diretamente a chefia do exército.
explanation: Na democracia, a população elege os seus representantes para o Parlamento. A nível da Confederação,
  estes são o Conselho Nacional (Nationalrat) e o Conselho dos Estados (Ständerat). O Parlamento aprova
  então, em nome do povo, as leis federais.
