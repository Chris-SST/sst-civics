    question_de: Ein Angestellter oder eine Angestellte übt neben der Arbeit ein öffentliches Amt aus,
      zum Beispiel in der Schulbehörde der Gemeinde. Was gewährt der Arbeitgeber dafür normalerweise?
    options_de:
      a: Einen Bonus auf den Lohn
      b: Eine Beförderung
      c: Bezahlte freie Zeit
      d: Nichts, für das Amt muss man Ferien nehmen
    explanation_de: Wer ein öffentliches Amt ausübt, erhält in der Regel vom Arbeitgeber dafür bezahlte
      freie Zeit. Die genaue Menge hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von anderen
      Regelungen ab. Für ein Amt gibt es weder einen Bonus noch eine Beförderung, und normalerweise muss
      man dafür auch keine Ferien nehmen.
