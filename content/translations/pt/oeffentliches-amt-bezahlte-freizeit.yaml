id: oeffentliches-amt-bezahlte-freizeit
lang: pt
source_version: 3
question: Um funcionário ou uma funcionária exerce, além do seu trabalho, um cargo público, por exemplo
  na autoridade escolar da comuna (Gemeinde). O que é que o empregador normalmente concede para isso?
options:
  a: Um bónus no salário
  b: Uma promoção
  c: Tempo livre remunerado
  d: Nada, para o cargo é preciso tirar férias
explanation: Quem exerce um cargo público recebe, em regra, do empregador tempo livre remunerado para
  esse efeito. A quantidade exata depende do contrato de trabalho, da convenção coletiva de trabalho ou
  de outras regulamentações. Por um cargo não há bónus nem promoção, e normalmente também não é preciso
  tirar férias para o exercer.
