id: selbstjustiz-verbot-staat-bestraft
lang: pt
source_version: 2
question: O que se aplica na Suíça quando alguém infringiu uma lei?
options:
  a: A vizinhança decide em conjunto sobre a pena.
  b: O Estado persegue e pune o ato; a justiça pelas próprias mãos é proibida.
  c: A vítima pode determinar e executar ela própria a pena.
  d: A família da vítima pode punir ela própria o autor ou a autora do crime.
explanation: Na Suíça, só o Estado tem o direito de perseguir e punir crimes. Para isso, são competentes
  a polícia, o Ministério Público e os tribunais. Quem se vinga por conta própria, mesmo como vítima ou
  como família da vítima, pode ele próprio cometer um crime.
