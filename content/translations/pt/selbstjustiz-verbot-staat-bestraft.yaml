    question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz verletzt hat?
    options_de:
      a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
      b: Der Staat verfolgt und bestraft die Tat; Selbstjustiz ist verboten.
      c: Das Opfer kann die Strafe selbst bestimmen und vollstrecken.
      d: Die Familie des Opfers kann den Täter oder die Täterin selbst bestrafen.
    explanation_de: In der Schweiz hat nur der Staat das Recht, Straftaten zu verfolgen und zu bestrafen.
      Dafür sind die Polizei, die Staatsanwaltschaft und die Gerichte zuständig. Wer auf eigene Faust
      Rache nimmt, auch als Opfer oder als Familie des Opfers, kann selbst eine Straftat begehen.
