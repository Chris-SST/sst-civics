question: O que têm em comum o Simplon, o Gotthard e o Grande São Bernardo?
options:
  a: São cantões nos Alpes.
  b: São rios que desaguam no mar.
  c: São lagos no Planalto Suíço (Mittelland).
  d: São passagens através dos Alpes.
explanation: O Simplon, o Gotthard e o Grande São Bernardo são passos de montanha conhecidos que atravessam
  os Alpes. Ligam o lado norte dos Alpes ao lado sul dos Alpes.
