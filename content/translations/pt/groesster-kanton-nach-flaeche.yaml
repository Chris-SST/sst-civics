id: groesster-kanton-nach-flaeche
lang: pt
source_version: 1
question: Qual cantão tem a maior superfície de todos os cantões suíços?
options:
  a: Ticino
  b: Valais
  c: Berna
  d: Grisões
explanation: Os Grisões são o maior cantão da Suíça em termos de superfície. Situam-se inteiramente nos
  Alpes e têm muitos vales e montanhas. Valais, Berna e Ticino também são grandes, mas mais pequenos do
  que os Grisões.
