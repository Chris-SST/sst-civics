    question_de: Wozu dient die Steuererklärung, die die Steuerpflichtigen jedes Jahr ausfüllen?
    options_de:
      a: Sie dient der Anmeldung beim Einwohnerregister.
      b: Sie ist der Antrag auf eine Krankenversicherung.
      c: Sie ist die Anmeldung für den Zivildienst.
      d: Sie dient dazu, den Steuerbehörden die finanzielle Situation offenzulegen.
    explanation_de: Mit der Steuererklärung geben die Steuerpflichtigen das Einkommen, das Vermögen und
      die Abzüge an. Auf der Grundlage dieser Angaben berechnet die Steuerbehörde die Steuer.
