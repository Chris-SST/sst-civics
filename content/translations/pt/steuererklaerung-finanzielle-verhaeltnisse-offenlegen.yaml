id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: pt
source_version: 1
question: Para que serve a declaração de impostos que os contribuintes preenchem todos os anos?
options:
  a: Serve para o registo no serviço de registo de residentes.
  b: É o pedido de um seguro de saúde.
  c: É a inscrição para o serviço civil (Zivildienst).
  d: Serve para revelar às autoridades fiscais a situação financeira.
explanation: Com a declaração de impostos, os contribuintes indicam o rendimento, o património e as deduções.
  Com base nesses dados, a autoridade fiscal calcula o imposto.
