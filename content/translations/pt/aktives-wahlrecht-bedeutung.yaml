id: aktives-wahlrecht-bedeutung
lang: pt
source_version: 3
question: O que significa o direito de voto ativo?
options:
  a: O direito de fundar um partido
  b: O direito de ser eleito para um cargo
  c: O direito de apresentar iniciativas no Parlamento
  d: O direito de participar em eleições e votações e de exprimir o seu próprio voto
explanation: Quem tem o direito de voto ativo pode votar pessoalmente em eleições e votações, por exemplo
  na eleição do Conselho Nacional (Nationalrat) ou numa votação popular. Já o direito de ser eleito para
  um cargo chama-se direito de voto passivo.
