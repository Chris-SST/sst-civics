    question_de: Was bedeutet das aktive Stimmrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht, in ein Amt gewählt zu werden
      c: Das Recht, im Parlament Initiativen einzureichen
      d: Das Recht, an Wahlen und Abstimmungen teilzunehmen und seine eigene Stimme abzugeben
    explanation_de: Wer das aktive Stimmrecht hat, kann persönlich bei Wahlen und Abstimmungen abstimmen,
      zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, in ein Amt
      gewählt zu werden, nennt man hingegen passives Stimmrecht.
