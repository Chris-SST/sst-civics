id: krankenversicherung-obligatorisch-alle-einwohner
lang: pt
source_version: 1
question: Quem deve ter, na Suíça, um seguro de base junto de uma seguradora de saúde (Krankenkasse)?
options:
  a: todas as pessoas que residem na Suíça
  b: apenas as pessoas com rendimentos baixos
  c: apenas as pessoas com cidadania (Bürgerrecht) suíça
  d: apenas as pessoas que exercem uma atividade profissional
explanation: O seguro de saúde é obrigatório para todas as pessoas com domicílio na Suíça. Isto aplica-se
  independentemente da nacionalidade, da idade ou do exercício de uma atividade profissional. As seguradoras
  de saúde têm de aceitar todas as pessoas no seguro de base.
