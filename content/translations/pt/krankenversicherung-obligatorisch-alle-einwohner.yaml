    question_de: Wer muss in der Schweiz eine Grundversicherung bei einer Krankenkasse haben?
    options_de:
      a: alle Personen, die in der Schweiz wohnen
      b: nur Personen mit niedrigem Einkommen
      c: nur Personen mit Schweizer Bürgerrecht
      d: nur Personen, die einer Erwerbstätigkeit nachgehen
    explanation_de: Die Krankenversicherung ist für alle Personen mit Wohnsitz in der Schweiz obligatorisch.
      Dies gilt unabhängig von der Staatsangehörigkeit, vom Alter oder von der Ausübung einer Erwerbstätigkeit.
      Die Krankenkassen müssen alle Personen in der Grundversicherung aufnehmen.
