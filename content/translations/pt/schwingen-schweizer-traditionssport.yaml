question: Qual desporto tradicional na Suíça é uma espécie de luta livre?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen (lançamento da pedra)
explanation: 'O Schwingen é uma luta entre duas pessoas numa arena redonda coberta de serradura e é considerado
  um desporto tradicional suíço. O Hornussen e o Steinstossen também são desportos suíços antigos, mas
  não são lutas: no Hornussen, bate-se num pequeno disco que voa longe pelo ar; no Steinstossen, lança-se
  uma pedra pesada. O curling joga-se no gelo e é originário da Escócia.'
