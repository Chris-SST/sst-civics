    question_de: Welcher Tag ist in der ganzen Schweiz gesetzlich ein arbeitsfreier Feiertag?
    options_de:
      a: 2. Januar (Berchtoldstag)
      b: Der Fasnachtsmontag
      c: Der Karfreitag
