id: nationalfeiertag-1-august-bundesweit
lang: pt
source_version: 1
question: Qual é o dia que, em toda a Suíça, é por lei um feriado não laborável?
options:
  a: 2 de janeiro (Berchtoldstag)
  b: A segunda-feira de Carnaval (Fasnachtsmontag)
  c: A Sexta-feira Santa
  d: 1.º de agosto, o dia da festa nacional
explanation: O 1.º de agosto é o dia da festa nacional e é feriado em todo o país. A maioria dos outros
  feriados, como a Sexta-feira Santa ou o Berchtoldstag, é regulada pelos próprios cantões e nem em todo
  o lado são dias livres.
