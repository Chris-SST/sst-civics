id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: pt
source_version: 1
question: Qual das seguintes instituições faz parte dos seguros sociais da Suíça?
options:
  a: O seguro de invalidez (Invalidenversicherung, IV)
  b: O seguro de viagem
  c: O seguro de protecção jurídica
  d: O seguro do recheio da casa
explanation: O seguro de invalidez (IV) é um seguro social regulamentado pelo Estado. Apoia as pessoas
  que, devido a doença ou acidente, não podem trabalhar ou só podem trabalhar de forma limitada. Os seguros
  do recheio da casa, de viagem e de protecção jurídica são seguros privados.
