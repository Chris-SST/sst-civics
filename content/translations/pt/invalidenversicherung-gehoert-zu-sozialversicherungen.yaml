    question_de: Welche der folgenden Institutionen gehört zu den Sozialversicherungen der Schweiz?
    options_de:
      a: Die Invalidenversicherung (IV)
      b: Die Reiseversicherung
      c: Die Rechtsschutzversicherung
      d: Die Hausratversicherung
    explanation_de: Die Invalidenversicherung (IV) ist eine vom Staat geregelte Sozialversicherung. Sie
      unterstützt Personen, die wegen Krankheit oder Unfall nicht arbeiten können oder nur eingeschränkt
      arbeiten können. Die Hausratversicherung, die Reiseversicherung und die Rechtsschutzversicherung
      sind Privatversicherungen.
