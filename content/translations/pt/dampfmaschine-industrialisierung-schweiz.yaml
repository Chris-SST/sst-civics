id: dampfmaschine-industrialisierung-schweiz
lang: pt
source_version: 2
question: Qual invenção marcou fortemente a industrialização na Suíça no século XIX?
options:
  a: O avião
  b: A máquina a vapor
  c: O computador
  d: A linha de montagem
explanation: No século XIX, a máquina a vapor tornou-se importante na Suíça. Ela movia as máquinas nas
  fábricas e, mais tarde, também os comboios, e cada vez mais pessoas trabalhavam em fábricas. O avião,
  a linha de montagem e o computador só se tornaram importantes no século XX.
