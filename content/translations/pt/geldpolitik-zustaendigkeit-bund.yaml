id: geldpolitik-zustaendigkeit-bund
lang: pt
source_version: 1
question: Quem é responsável pela política monetária na Suíça?
options:
  a: A Confederação
  b: As comunas (Gemeinden)
  c: Os bancos cantonais
  d: Os cantões em conjunto
explanation: Segundo a Constituição Federal, a política monetária e cambial é da competência da Confederação.
  Ela tem o direito de emitir moedas e notas. O Banco Nacional Suíço executa a política monetária por
  incumbência da Confederação e é independente nessa função.
