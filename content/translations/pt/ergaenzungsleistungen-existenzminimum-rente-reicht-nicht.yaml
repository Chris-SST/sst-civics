    question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
    options_de:
      a: Personen, die ihre Arbeit verloren haben und Arbeitslosengeld erhalten
      b: Alle Personen über 50 Jahre
      c: Personen, deren Rente der Alters- und Hinterlassenenversicherung (AHV) oder der Invalidenversicherung
        (IV) das Existenzminimum nicht deckt
      d: Alle Personen, die Sozialhilfe erhalten
    explanation_de: Die Ergänzungsleistungen helfen Personen, deren Rente der Alters- und Hinterlassenenversicherung
      (AHV) oder der Invalidenversicherung und die übrigen Einkünfte zum Leben nicht ausreichen. Sie sind
      ein gesetzlicher Anspruch und keine Sozialhilfe. Sie werden zusätzlich zur Rente ausbezahlt.
