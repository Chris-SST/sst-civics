id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
lang: pt
source_version: 1
question: Quem pode receber prestações complementares na Suíça?
options:
  a: Pessoas que perderam o emprego e recebem subsídio de desemprego
  b: Todas as pessoas com mais de 50 anos
  c: Pessoas cuja pensão do seguro de velhice e sobrevivência (AHV) ou do seguro de invalidez (IV) não
    cobre o mínimo existencial
  d: Todas as pessoas que recebem assistência social
explanation: As prestações complementares ajudam as pessoas cuja pensão do seguro de velhice e sobrevivência
  (AHV) ou do seguro de invalidez e os demais rendimentos não são suficientes para viver. Constituem um
  direito legal e não são assistência social. São pagas além da pensão.
