id: zuwanderung-fuenfzigerjahre-italien
lang: pt
source_version: 1
question: De que país provinha, na década de 1950, a maioria dos trabalhadores que imigraram para a Suíça?
options:
  a: Da Itália
  b: Da Turquia
  c: De Portugal
  d: Da Espanha
explanation: Na década de 1950, a maioria dos trabalhadores imigrantes vinha da Itália. Naquela época,
  a economia precisava de muita mão de obra, por exemplo na construção e na indústria. Mais tarde, também
  chegaram muitas pessoas de outros países.
