id: helvetische-republik-zentralstaat-1798
lang: pt
source_version: 1
question: O que aconteceu com a Suíça em 1798, sob a influência de Napoleão Bonaparte?
options:
  a: Tornou-se parte do Império Alemão.
  b: Tornou-se uma monarquia com um rei próprio.
  c: Foi dividida de forma permanente em dois Estados.
  d: Tornou-se temporariamente um Estado centralizado, a República Helvética.
explanation: Em 1798, após a invasão das tropas francesas, surgiu a República Helvética. Era um Estado
  unitário governado de forma centralizada e substituiu temporariamente a antiga Confederação. Os cantões
  tinham poucos direitos próprios.
