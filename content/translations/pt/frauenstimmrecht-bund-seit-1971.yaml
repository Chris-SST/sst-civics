id: frauenstimmrecht-bund-seit-1971
lang: pt
source_version: 1
question: Desde quando as mulheres podem votar e participar em votações a nível nacional na Suíça?
options:
  a: Desde 1918
  b: Desde 1848
  c: Desde 1971
  d: Desde 1991
explanation: A nível da Confederação, o direito de voto das mulheres foi introduzido em 1971. Alguns cantões
  e comunas (Gemeinden) já o conheciam antes, enquanto outros só o introduziram mais tarde. O último cantão
  a fazê-lo foi Appenzell Innerrhoden, em 1990.
