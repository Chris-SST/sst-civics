    question_de: Seit wann dürfen Frauen in der Schweiz auf nationaler Ebene wählen und abstimmen?
    options_de:
      a: Seit 1918
      b: Seit 1848
      c: Seit 1971
      d: Seit 1991
    explanation_de: Auf Ebene des Bundes wurde das Stimmrecht der Frauen 1971 eingeführt. Einige Kantone
      und Gemeinden kannten es bereits früher, während andere es erst später einführten. Der letzte Kanton,
      der dies tat, war Appenzell Innerrhoden im Jahr 1990.
