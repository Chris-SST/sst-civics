id: staenderat-vertritt-anliegen-kantone
lang: pt
source_version: 1
question: Qual câmara do Parlamento defende principalmente os interesses dos cantões?
options:
  a: O Conselho Federal (Bundesrat)
  b: O Conselho Nacional (Nationalrat)
  c: O Conselho dos Estados (Ständerat)
  d: O Tribunal Federal (Bundesgericht)
explanation: O Conselho dos Estados representa sobretudo os cantões. Cada cantão envia representantes
  a esta câmara. O Conselho Nacional, por sua vez, representa o povo.
