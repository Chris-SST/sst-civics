id: frauenstimmrecht-national-1971
lang: pt
source_version: 2
question: Desde que ano as mulheres podem votar e participar em votações a nível federal na Suíça?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: Em 1971, os homens suíços aprovaram, numa votação popular, o direito de voto das mulheres
  a nível federal. Desde então, as mulheres podem votar, participar em votações e candidatar-se a nível
  nacional. Os cantões introduziram o direito de voto das mulheres em épocas diferentes, alguns já antes
  de 1971, sendo Appenzell Innerrhoden o último cantão, apenas em 1990.
