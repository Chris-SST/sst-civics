id: referendum-sammelfrist-100-tage
lang: pt
source_version: 1
question: Quanto tempo têm os comités de referendo para recolher as assinaturas para um referendo facultativo
  contra uma lei federal?
options:
  a: 60 dias
  b: 18 meses
  c: 100 dias
  d: 30 dias
explanation: O prazo é de 100 dias a contar da publicação oficial do ato legislativo. Os 18 meses aplicam-se,
  pelo contrário, à recolha de assinaturas para uma iniciativa popular (Volksinitiative).
