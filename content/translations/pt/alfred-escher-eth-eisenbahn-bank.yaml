id: alfred-escher-eth-eisenbahn-bank
lang: pt
source_version: 2
question: Pelo que é conhecido o político e empresário zuriquense Alfred Escher?
options:
  a: Comandou as tropas suíças na Guerra do Sonderbund.
  b: Escreveu sozinho a primeira Constituição Federal.
  c: Fundou a Cruz Vermelha em Genebra.
  d: Promoveu a ETH e a construção de ferrovias e fundou o banco que mais tarde se tornou o Credit Suisse.
explanation: No século XIX, Alfred Escher empenhou-se na fundação da ETH Zurique e na construção de ferrovias,
  sobretudo da ferrovia do Gotardo. Em 1856 fundou o Schweizerische Kreditanstalt (Banco de Crédito Suíço),
  o futuro Credit Suisse. Este banco foi adquirido pelo UBS em 2023.
