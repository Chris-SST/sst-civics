    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er befehligte die Schweizer Truppen im Sonderbundskrieg.
      b: Er schrieb allein die erste Bundesverfassung.
      c: Er gründete das Rote Kreuz in Genf.
      d: Er förderte die ETH und den Bau von Eisenbahnen und gründete die Bank, die später zur Credit
        Suisse wurde.
    explanation_de: Im 19. Jahrhundert setzte sich Alfred Escher für die Gründung der ETH Zürich und für
      den Bau von Eisenbahnen ein, vor allem der Gotthardbahn. Im Jahr 1856 gründete er die Schweizerische
      Kreditanstalt (Schweizer Kreditbank), die spätere Credit Suisse. Diese Bank wurde 2023 von der UBS
      übernommen.
