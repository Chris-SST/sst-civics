id: schienennetz-dichte-weltweit
lang: pt
source_version: 1
question: Pelo que é conhecida a rede ferroviária suíça na comparação internacional?
options:
  a: É a rede ferroviária com a malha mais densa do mundo.
  b: É a única rede ferroviária que passa inteiramente por túneis.
  c: É a rede ferroviária mais extensa da Europa.
  d: É a rede ferroviária mais antiga do mundo.
explanation: Numa área pequena existem muitíssimas linhas ferroviárias e estações. Por isso, a rede suíça
  é considerada a mais densa do mundo. No entanto, a densidade não diz nada sobre o comprimento absoluto.
