id: heirat-planen-zivilstandsamt
lang: pt
source_version: 1
question: A que serviço se dirigem os casais que desejam casar-se?
options:
  a: À comissão escolar (Schulpflege)
  b: Ao registo civil (Zivilstandsamt)
  c: À repartição de finanças (Steueramt)
  d: Ao serviço de cobrança de dívidas (Betreibungsamt)
explanation: O registo civil prepara o casamento e realiza-o. Também regista oficialmente outros acontecimentos,
  como nascimentos e óbitos.
