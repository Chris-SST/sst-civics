    source_version: 1
    question_de: Auf welche Weise beteiligen sich die Stimmberechtigten in ihrer Gemeinde über die Urne
      politisch?
    options_de:
      a: Sie führen den Vorsitz bei den Sitzungen des Gemeinderats
      b: Sie führen die Beschlüsse der Gemeinde aus
      c: Sie wählen bei Wahlen und Abstimmungen
      d: Sie erarbeiten die Gesetze des Kantons selbst
    explanation_de: Bei den Abstimmungen und Wahlen an der Urne stimmen die Stimmberechtigten über Vorlagen
      ab und wählen die Behörden. Die Ausführung der Beschlüsse ist Aufgabe der Behörden und der Verwaltung.
