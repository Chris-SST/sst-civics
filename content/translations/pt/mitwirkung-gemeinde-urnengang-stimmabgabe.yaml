id: mitwirkung-gemeinde-urnengang-stimmabgabe
lang: pt
source_version: 1
question: De que forma as pessoas com direito de voto participam politicamente na sua comuna (Gemeinde)
  através das urnas?
options:
  a: Presidem às sessões do conselho municipal (Gemeinderat)
  b: Executam as decisões da comuna
  c: Votam em eleições e votações
  d: Elaboram elas próprias as leis do cantão
explanation: Nas votações e eleições nas urnas, as pessoas com direito de voto votam sobre projetos e
  elegem as autoridades. A execução das decisões é tarefa das autoridades e da administração.
