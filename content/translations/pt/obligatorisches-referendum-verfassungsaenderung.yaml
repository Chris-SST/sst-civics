id: obligatorisches-referendum-verfassungsaenderung
lang: pt
source_version: 1
question: Sobre qual projeto é sempre necessário votar na Suíça, mesmo que não se recolham assinaturas?
options:
  a: Sobre cada nova lei federal
  b: Sobre cada alteração da Constituição Federal
  c: Sobre cada regulamento do Conselho Federal (Bundesrat)
  d: Sobre cada orçamento da Confederação
explanation: Cada alteração da Constituição Federal deve ser obrigatoriamente submetida ao povo e aos
  cantões. Isso chama-se referendo obrigatório. As leis federais estão sujeitas apenas ao referendo facultativo.
status: approved
