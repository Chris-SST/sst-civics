    at: *id001
    source_version: 1
    question_de: Über welche Vorlage muss in der Schweiz immer abgestimmt werden, auch wenn keine Unterschriften
      gesammelt werden?
    options_de:
      a: Über jedes neue Bundesgesetz
      b: Über jede Änderung der Bundesverfassung
      c: Über jede Verordnung des Bundesrates
      d: Über jedes Budget der Eidgenossenschaft
    explanation_de: Jede Änderung der Bundesverfassung muss zwingend dem Volk und den Kantonen vorgelegt
      werden. Dies nennt man obligatorisches Referendum. Die Bundesgesetze unterliegen nur dem fakultativen
      Referendum.
