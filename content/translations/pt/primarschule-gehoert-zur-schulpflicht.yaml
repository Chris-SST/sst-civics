question: Qual destes níveis de ensino faz parte da escolaridade obrigatória na Suíça?
options:
  a: A escola superior (Hochschule)
  b: A escola primária
  c: O grupo de jogos (Spielgruppe)
  d: A escola profissional
explanation: 'No cantão de Zurique, a escolaridade obrigatória dura onze anos: jardim de infância, escola
  primária e ensino secundário do primeiro ciclo (Sekundarstufe I). O grupo de jogos para crianças pequenas
  é facultativo. A escola profissional e a escola superior só são frequentadas depois da escolaridade
  obrigatória.'
