id: volksinitiative-unterschreiben-wer-darf
lang: pt
source_version: 2
question: Quem pode assinar uma iniciativa popular (Volksinitiative) federal?
options:
  a: Todas as pessoas com 16 anos ou mais domiciliadas na Suíça
  b: Todas as pessoas com 18 anos ou mais com autorização de estabelecimento (autorização C) (Niederlassungsbewilligung)
  c: Apenas membros de um partido político com 18 anos ou mais
  d: Cidadãs e cidadãos suíços com 18 anos ou mais
explanation: Pode assinar uma iniciativa popular federal quem tem direito de voto a nível da Confederação.
  Trata-se das suíças e dos suíços com 18 anos ou mais, incluindo os que vivem no estrangeiro, desde que
  estejam inscritos no registo eleitoral. Só estão excluídas as pessoas que, por incapacidade de discernimento
  permanente, se encontram sob curatela geral ou são representadas por uma pessoa designada por mandato
  por razões de incapacidade; as estrangeiras e os estrangeiros não têm direitos políticos a nível da
  Confederação, nem mesmo com autorização C.
