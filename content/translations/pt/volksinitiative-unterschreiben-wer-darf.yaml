    question_de: Wer kann eine eidgenössische Volksinitiative unterschreiben?
    options_de:
      a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
      b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung (Bewilligung C)
      c: Nur Mitglieder einer politischen Partei ab 18 Jahren
      d: Schweizer Bürgerinnen und Bürger ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative kann unterschreiben, wer auf Bundesebene stimmberechtigt
      ist. Es handelt sich um Schweizerinnen und Schweizer ab 18 Jahren, einschliesslich derjenigen, die
      im Ausland leben, sofern sie im Stimmregister eingetragen sind. Ausgeschlossen sind nur Personen,
      die wegen dauernder Urteilsunfähigkeit unter umfassender Beistandschaft stehen oder durch eine vorsorgebeauftragte
      Person wegen Urteilsunfähigkeit vertreten werden; Ausländerinnen und Ausländer haben auf Bundesebene
      keine politischen Rechte, nicht einmal mit Bewilligung C.
