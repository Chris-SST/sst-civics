    question_de: Welche Ebene nimmt in der dreistufigen staatlichen Struktur der Schweiz die unterste
      Stellung ein?
    options_de:
      a: Die Gemeinde
      b: Die Region
      c: Der Kanton
      d: Die Eidgenossenschaft
    explanation_de: 'Die Schweiz ist in drei Ebenen organisiert: die Eidgenossenschaft, die Kantone und
      die Gemeinden. Die Gemeinde ist die unterste und den Menschen am nächsten stehende Ebene. Sie erledigt
      viele Aufgaben selbstständig, zum Beispiel die Primarschule, die Baubewilligungen oder die Sozialhilfe.'
