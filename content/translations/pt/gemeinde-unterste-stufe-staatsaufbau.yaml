id: gemeinde-unterste-stufe-staatsaufbau
lang: pt
source_version: 2
question: Qual nível ocupa a posição mais baixa na estrutura estatal de três níveis da Suíça?
options:
  a: A comuna (Gemeinde)
  b: A região
  c: O cantão
  d: A Confederação
explanation: 'A Suíça está organizada em três níveis: a Confederação, os cantões e as comunas. A comuna
  é o nível mais baixo e o mais próximo das pessoas. Ela realiza muitas tarefas por conta própria, por
  exemplo a escola primária, as licenças de construção ou a assistência social.'
