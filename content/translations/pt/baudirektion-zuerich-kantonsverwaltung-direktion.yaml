id: baudirektion-zuerich-kantonsverwaltung-direktion
lang: pt
source_version: 1
question: Qual dos seguintes serviços é uma direção da administração do cantão de Zurique?
options:
  a: A Direção da comuna (Gemeinde)
  b: A Direção das Obras (Baudirektion)
  c: A Direção da cidade
  d: A Direção da Confederação
explanation: A Direção das Obras (Baudirektion) faz parte das direções da administração do cantão de Zurique.
  A administração do cantão está dividida em várias direções, cada uma dirigida por um membro do Conselho
  de Governo (Regierungsrat).
