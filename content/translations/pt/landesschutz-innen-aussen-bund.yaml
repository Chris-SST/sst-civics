id: landesschutz-innen-aussen-bund
lang: pt
source_version: 1
question: Qual das seguintes tarefas é uma das tarefas centrais da Confederação?
options:
  a: A organização das escolas locais
  b: A proteção do país contra ameaças internas e externas
  c: A manutenção das ruas da comuna (Gemeinde)
  d: A administração dos registos de habitantes das comunas
explanation: A Confederação zela pela segurança do país no exterior, por exemplo com o exército, e pela
  segurança interna. As escolas, as ruas das comunas e os registos de habitantes são, pelo contrário,
  sobretudo da responsabilidade dos cantões e das comunas.
