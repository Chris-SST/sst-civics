    question_de: Welche der folgenden Aufgaben ist eine der zentralen Aufgaben des Bundes?
    options_de:
      a: Die Organisation der örtlichen Schulen
      b: Der Schutz des Landes vor inneren und äusseren Bedrohungen
      c: Der Unterhalt der Strassen der Gemeinde
      d: Die Verwaltung der Einwohnerregister der Gemeinden
    explanation_de: Der Bund sorgt für die Sicherheit des Landes nach aussen, zum Beispiel mit der Armee,
      und für die innere Sicherheit. Die Schulen, die Strassen der Gemeinden und die Einwohnerregister
      fallen hingegen vor allem in die Verantwortung der Kantone und der Gemeinden.
