question: Qual é a tarefa mais importante do Parlamento da Confederação?
options:
  a: Dirigir a polícia em todo o país
  b: Decidir litígios entre pessoas
  c: Debater e aprovar leis
  d: Fazer cumprir as leis no dia a dia
explanation: O Parlamento é o poder legislativo. Debate e aprova as leis da Confederação. O Governo executa-as
  e os tribunais julgam os litígios.
