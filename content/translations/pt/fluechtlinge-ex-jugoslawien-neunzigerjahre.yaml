id: fluechtlinge-ex-jugoslawien-neunzigerjahre
lang: pt
source_version: 1
question: Por que motivo, nos anos 1990, muitas pessoas da antiga Jugoslávia procuraram acolhimento na
  Suíça?
options:
  a: Queriam estudar em universidades suíças.
  b: Fugiam de uma grande catástrofe natural.
  c: Fugiam da guerra no seu país de origem.
  d: Foram recrutadas por empresas suíças como trabalhadores sazonais.
explanation: A desintegração da Jugoslávia levou a guerras nos anos 1990. Por isso, muitas pessoas procuraram
  proteção na Suíça. Uma parte delas ficou e vive hoje aqui.
