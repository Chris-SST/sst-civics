    question_de: Die Schweiz ist in drei Staatsebenen organisiert. Welches ist die höchste Ebene?
    options_de:
      a: Die Gemeinden
      b: Der Bund
      c: Die Kantone
      d: Die Bezirke
    explanation_de: Der Bund ist die höchste der drei Staatsebenen. Unter ihm kommen die Kantone und danach
      die Gemeinden. Die Bezirke bilden keine eigene Staatsebene, sondern sind nur in einigen Kantonen
      Verwaltungseinheiten innerhalb des Kantons.
