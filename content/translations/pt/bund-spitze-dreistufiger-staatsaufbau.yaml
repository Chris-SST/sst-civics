id: bund-spitze-dreistufiger-staatsaufbau
lang: pt
source_version: 2
question: A Suíça está organizada em três níveis de Estado. Qual é o nível mais alto?
options:
  a: As comunas (Gemeinden)
  b: A Confederação
  c: Os cantões
  d: Os distritos
explanation: A Confederação é o mais alto dos três níveis de Estado. Abaixo dela vêm os cantões e, depois,
  as comunas. Os distritos não constituem um nível de Estado próprio, sendo apenas, em alguns cantões,
  unidades administrativas dentro do cantão.
