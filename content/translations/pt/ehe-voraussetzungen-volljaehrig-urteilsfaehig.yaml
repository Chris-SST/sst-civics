id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: pt
source_version: 1
question: Que requisitos as pessoas devem cumprir para poderem casar-se na Suíça?
options:
  a: Devem possuir a cidadania (Bürgerrecht) suíça e ser maiores de idade
  b: Devem ser maiores de idade e ter capacidade de agir de forma racional
  c: Devem viver juntas há pelo menos cinco anos
  d: Devem pertencer à mesma religião
explanation: Pode casar-se quem é maior de idade e tem capacidade de discernimento. Ter capacidade de
  discernimento significa que a pessoa consegue agir de forma racional. A nacionalidade, a religião ou
  uma determinada duração da vida em comum não são requisitos.
