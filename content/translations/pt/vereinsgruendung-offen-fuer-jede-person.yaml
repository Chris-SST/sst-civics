id: vereinsgruendung-offen-fuer-jede-person
lang: pt
source_version: 1
question: Quem pode fundar uma associação na Suíça?
options:
  a: Apenas pessoas com domicílio na comuna (Gemeinde)
  b: Qualquer pessoa
  c: Apenas cidadãos suíços
  d: Apenas pessoas com autorização de estabelecimento (Niederlassungsbewilligung) (autorização C)
explanation: Na Suíça, a fundação de uma associação está aberta a qualquer pessoa. A liberdade de associação
  está garantida na Constituição Federal. A nacionalidade ou o estatuto de residência não têm qualquer
  importância a este respeito.
