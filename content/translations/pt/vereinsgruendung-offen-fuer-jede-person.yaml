    question_de: Wer kann in der Schweiz einen Verein gründen?
    options_de:
      a: Nur Personen mit Wohnsitz in der Gemeinde
      b: Jede Person
      c: Nur Schweizer Bürger
      d: Nur Personen mit Niederlassungsbewilligung (Bewilligung C)
    explanation_de: In der Schweiz steht die Gründung eines Vereins jeder Person offen. Die Vereinigungsfreiheit
