id: dienstpflicht-nur-maenner-bis-alter
lang: pt
source_version: 1
question: Quem, na Suíça, é obrigado a prestar serviço militar ou serviço civil de substituição até uma
  determinada idade?
options:
  a: Apenas os homens
  b: Mulheres e homens por igual
  c: Apenas as pessoas com uma formação
  d: Apenas as pessoas que exercem um cargo numa comuna (Gemeinde)
explanation: Na Suíça, a obrigação de prestar serviço aplica-se apenas aos homens. Para as mulheres, o
  serviço militar é voluntário. A obrigação dura até uma idade fixada por lei.
