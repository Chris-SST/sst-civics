    question_de: Wer ist in der Schweiz bis zu einem bestimmten Alter verpflichtet, Militärdienst oder
      zivilen Ersatzdienst zu leisten?
    options_de:
      a: Nur die Männer
      b: Frauen und Männer gleichermassen
      c: Nur Personen mit einer Ausbildung
      d: Nur Personen, die in einer Gemeinde ein Amt ausüben
    explanation_de: In der Schweiz gilt die Dienstpflicht nur für die Männer. Für die Frauen ist der Militärdienst
      freiwillig. Die Pflicht dauert bis zu einem gesetzlich festgelegten Alter.
