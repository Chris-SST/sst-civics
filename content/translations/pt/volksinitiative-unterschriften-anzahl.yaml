question: Quantas assinaturas de pessoas com direito de voto são necessárias para que uma iniciativa popular
  (Volksinitiative) federal seja validamente apresentada?
options:
  a: 50 000 assinaturas
  b: 150 000 assinaturas
  c: 200 000 assinaturas
  d: 100 000 assinaturas
explanation: Para uma iniciativa popular federal são necessárias 100 000 assinaturas válidas. Estas têm
  de ser recolhidas no prazo de 18 meses.
