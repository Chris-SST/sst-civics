    question_de: Was riskiert eine Person, die ein Auto unter Alkohol- oder Drogeneinfluss lenkt?
    options_de:
      a: Den Verlust des Stimmrechts
      b: Die Ausweisung aus der Wohngemeinde
      c: Den Entzug der Krankenversicherung
