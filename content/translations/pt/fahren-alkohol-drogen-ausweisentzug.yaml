id: fahren-alkohol-drogen-ausweisentzug
lang: pt
source_version: 2
question: O que arrisca uma pessoa que conduz um automóvel sob o efeito de álcool ou de drogas?
options:
  a: A perda do direito de voto
  b: A expulsão do município de residência
  c: A retirada do seguro de saúde
  d: A apreensão da carta de condução
explanation: Quem não está apto a conduzir coloca outras pessoas em perigo no trânsito rodoviário. Por
  isso, a autoridade pode retirar a carta de condução. A isso podem somar-se também multas ou outras penas.
