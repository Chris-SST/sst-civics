    question_de: Worauf beruhen im Wesentlichen die Beziehungen zwischen der Schweiz und der Europäischen
      Union (EU)?
    options_de:
      a: Auf einem Paket bilateraler Abkommen
      b: Auf einer gemeinsamen Regierung
      c: Auf dem Beitritt der Schweiz zur EU
      d: Auf einer gemeinsamen Verfassung
    explanation_de: Die Schweiz ist kein Mitglied der EU. Ihre Beziehungen werden durch viele bilaterale
      Abkommen geregelt, das heisst Verträge zwischen zwei Partnern. Sie betreffen zum Beispiel den Handel
      und die Personenfreizügigkeit.
