id: beziehungen-schweiz-eu-bilaterale-abkommen
lang: pt
source_version: 1
question: Em que se baseiam, no essencial, as relações entre a Suíça e a União Europeia (UE)?
options:
  a: Num pacote de acordos bilaterais
  b: Num governo comum
  c: Na adesão da Suíça à UE
  d: Numa constituição comum
explanation: A Suíça não é membro da UE. As suas relações são reguladas por muitos acordos bilaterais,
  ou seja, tratados entre dois parceiros. Dizem respeito, por exemplo, ao comércio e à livre circulação
  de pessoas.
