id: polizei-befugnis-festnahme-straftaeter
lang: pt
source_version: 2
question: Que entidade pode deter pessoas suspeitas de terem cometido uma infração penal?
options:
  a: A autoridade escolar
  b: A polícia
  c: O parlamento
  d: A repartição de finanças
explanation: A polícia pode deter pessoas suspeitas de uma infração penal, desde que estejam reunidas
  as condições previstas na lei. Se alguém é culpado ou não, é depois decidido por um tribunal. A autoridade
  escolar, o parlamento e a repartição de finanças não têm esse poder.
