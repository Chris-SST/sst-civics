    question_de: Welche Stelle kann Personen festnehmen, die verdächtigt werden, eine Straftat begangen
      zu haben?
    options_de:
      a: Die Schulbehörde
      b: Die Polizei
      c: Das Parlament
      d: Das Finanzamt
    explanation_de: Die Polizei kann Personen festnehmen, die einer Straftat verdächtigt werden, sofern
      die im Gesetz vorgesehenen Bedingungen erfüllt sind. Ob jemand schuldig ist oder nicht, wird danach
      von einem Gericht entschieden. Die Schulbehörde, das Parlament und das Finanzamt haben diese Befugnis
      nicht.
