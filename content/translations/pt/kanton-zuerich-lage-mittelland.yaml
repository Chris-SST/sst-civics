id: kanton-zuerich-lage-mittelland
lang: pt
source_version: 2
question: A que grande região paisagística da Suíça pertence o cantão de Zurique?
options:
  a: Aos Alpes do Sul
  b: Ao Jura
  c: Ao Planalto Suíço (Mittelland)
  d: Aos Alpes Centrais
explanation: O cantão de Zurique pertence ao Planalto Suíço (Mittelland), ou seja, à zona mais plana entre
  o Jura, a noroeste, e os Alpes, a sul. O Planalto Suíço é a parte mais densamente povoada da Suíça.
