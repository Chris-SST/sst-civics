id: bahnunternehmen-der-schweiz-erkennen
lang: pt
source_version: 1
question: Qual das seguintes abreviaturas designa, em todos os casos, empresas ferroviárias da Suíça?
options:
  a: SOB, SEM, BLS e SZU
  b: SBB, BLS, SOB e SZU
  c: SBB, SRF, SOB e SUVA
  d: BLS, SZU, SNB e SBB
explanation: SBB, BLS, SOB e SZU são empresas ferroviárias que operam comboios na Suíça. A SBB é a maior
  empresa; as outras são ferrovias mais pequenas, que circulam frequentemente a nível regional. As outras
  abreviaturas designam organizações como o Banco Nacional (SNB), a Secretaria de Estado da Migração (SEM)
  ou o seguro de acidentes (SUVA).
