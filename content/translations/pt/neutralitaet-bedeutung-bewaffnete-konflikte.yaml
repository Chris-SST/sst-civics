    question_de: Was bedeutet die Neutralität der Schweiz bei bewaffneten Konflikten zwischen anderen
      Staaten?
    options_de:
      a: Die Schweiz schickt Truppen zur Friedenssicherung in alle Kriegsgebiete.
      b: Die Schweiz bricht alle Beziehungen zu den beteiligten Staaten ab.
      c: Die Schweiz ergreift für keine der Konfliktparteien Partei.
      d: Die Schweiz unterstützt immer die schwächere Seite.
    explanation_de: Neutralität bedeutet, dass die Schweiz sich auf die Seite keiner der Krieg führenden
      Parteien stellt. So bleibt sie ausserhalb der Konflikte anderer Staaten. Das schliesst Gespräche
      und humanitäre Hilfe nicht aus.
