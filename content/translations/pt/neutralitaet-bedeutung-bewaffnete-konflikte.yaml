id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: pt
source_version: 1
question: O que significa a neutralidade da Suíça em caso de conflitos armados entre outros Estados?
options:
  a: A Suíça envia tropas para a manutenção da paz a todas as zonas de guerra.
  b: A Suíça rompe todas as relações com os Estados envolvidos.
  c: A Suíça não toma partido por nenhuma das partes em conflito.
  d: A Suíça apoia sempre o lado mais fraco.
explanation: Neutralidade significa que a Suíça não se coloca ao lado de nenhuma das partes em guerra.
  Assim, permanece fora dos conflitos de outros Estados. Isso não exclui conversações nem ajuda humanitária.
