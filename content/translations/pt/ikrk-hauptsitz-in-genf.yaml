question: Em que país o Comité Internacional da Cruz Vermelha (CICV) tem a sua sede?
options:
  a: Nos Países Baixos
  b: Na Suíça
  c: Na Áustria
  d: Na Bélgica
explanation: O CICV tem a sua sede em Genebra, na Suíça. Foi fundado em Genebra em 1863 e protege as vítimas
