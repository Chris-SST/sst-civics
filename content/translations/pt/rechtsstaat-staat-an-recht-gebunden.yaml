    question_de: Was gilt für die Behörden und die Regierung in einem Rechtsstaat wie der Schweiz?
    options_de:
      a: Sie können selbst wählen, welche Gesetze sie einhalten.
      b: Auch sie müssen das geltende Recht beachten.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen sich nur nach den Entscheidungen der Medien richten.
    explanation_de: In einem Rechtsstaat muss nicht nur die Bevölkerung das Recht beachten, sondern auch
      der Staat selbst. Die Behörden und die Regierung dürfen nur so handeln, wie es das Recht erlaubt.
      So schützt der Rechtsstaat die Menschen vor Willkür.
