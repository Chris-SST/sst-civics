id: rechtsstaat-staat-an-recht-gebunden
lang: pt
source_version: 2
question: O que se aplica às autoridades e ao governo num Estado de direito como a Suíça?
options:
  a: Podem escolher por si próprios quais as leis que cumprem.
  b: Também eles têm de respeitar o direito em vigor.
  c: Estão acima do direito em vigor.
  d: Só têm de se orientar pelas decisões dos meios de comunicação social.
explanation: Num Estado de direito, não é apenas a população que tem de respeitar o direito, mas também
  o próprio Estado. As autoridades e o governo só podem agir da forma que o direito permite. Assim, o
  Estado de direito protege as pessoas contra o arbítrio.
