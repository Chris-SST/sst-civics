    question_de: Welche Regelung gilt in der Schweiz seit 2002 für den Schwangerschaftsabbruch in den
      ersten zwölf Wochen?
    options_de:
      a: In diesem Zeitraum ist der Abbruch grundsätzlich verboten.
      b: Die Frau kann selbst über den Abbruch entscheiden.
      c: Der Ehemann oder der Partner muss dem Abbruch zustimmen.
      d: Ein Gericht muss den Abbruch genehmigen.
    explanation_de: Seit 2002 gilt die sogenannte Fristenregelung. Nach dieser Regelung entscheidet die
      Frau während der ersten zwölf Schwangerschaftswochen selbst. Dafür muss sie schriftlich eine Notlage
      geltend machen.
