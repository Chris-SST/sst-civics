id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: pt
source_version: 1
question: Que regulamentação vigora na Suíça desde 2002 para a interrupção da gravidez nas primeiras doze
  semanas?
options:
  a: Nesse período, a interrupção é, em princípio, proibida.
  b: A mulher pode decidir por si mesma sobre a interrupção.
  c: O marido ou o parceiro tem de consentir na interrupção.
  d: Um tribunal tem de autorizar a interrupção.
explanation: Desde 2002 vigora o chamado regime de prazo. Segundo este regime, a mulher decide por si
  mesma durante as primeiras doze semanas de gravidez. Para isso, tem de invocar por escrito uma situação
  de angústia.
