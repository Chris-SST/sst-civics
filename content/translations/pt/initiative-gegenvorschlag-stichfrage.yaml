id: initiative-gegenvorschlag-stichfrage
lang: pt
source_version: 1
question: Sobre uma iniciativa popular (Volksinitiative) e um contraprojeto direto da Assembleia Federal
  (Bundesversammlung) vota-se ao mesmo tempo. Para que serve, neste caso, a pergunta decisiva?
options:
  a: Decide se a votação tem de ser repetida
  b: Decide se a iniciativa é válida
  c: Decide qual dos projetos vale se ambos forem aceites
  d: Decide se os cantões podem participar na votação
explanation: Os eleitores podem aprovar tanto a iniciativa como o contraprojeto. Com a pergunta decisiva,
  indicam qual dos dois projetos deve entrar em vigor, caso ambos sejam aceites. Assim, nenhum voto a
  favor de uma mudança se perde.
