    source_version: 1
    question_de: Über eine Volksinitiative und einen direkten Gegenentwurf der Bundesversammlung wird
      gleichzeitig abgestimmt. Wozu dient in diesem Fall die Stichfrage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Initiative gültig ist
      c: Sie entscheidet, welche der Vorlagen gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Kantone an der Abstimmung teilnehmen dürfen
    explanation_de: Die Stimmberechtigten können sowohl die Initiative als auch den Gegenentwurf annehmen.
      Mit der Stichfrage geben sie an, welche der beiden Vorlagen in Kraft treten soll, falls beide angenommen
      werden. So geht keine Stimme für eine Änderung verloren.
