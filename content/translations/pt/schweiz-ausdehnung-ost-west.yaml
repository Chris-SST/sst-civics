id: schweiz-ausdehnung-ost-west
lang: pt
source_version: 1
question: Qual é, aproximadamente, a distância entre o ponto mais a leste e o ponto mais a oeste da Suíça?
options:
  a: Cerca de 250 quilómetros
  b: Cerca de 350 quilómetros
  c: Cerca de 550 quilómetros
  d: Cerca de 150 quilómetros
explanation: A Suíça mede cerca de 350 quilómetros de leste a oeste. É, portanto, um país bastante pequeno,
  que é mais comprido na direção leste-oeste do que de norte a sul.
