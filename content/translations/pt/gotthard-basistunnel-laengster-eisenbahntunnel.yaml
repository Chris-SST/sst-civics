id: gotthard-basistunnel-laengster-eisenbahntunnel
lang: pt
source_version: 1
question: O que distingue o túnel de base do São Gotardo (Gotthard-Basistunnel) em comparação com o resto
  do mundo?
options:
  a: É o túnel ferroviário mais longo do mundo.
  b: É o túnel ferroviário situado a maior altitude do mundo.
  c: É o túnel rodoviário mais longo do mundo.
  d: É o túnel ferroviário mais antigo da Europa.
explanation: O túnel de base do São Gotardo é o túnel ferroviário mais longo do mundo. Liga o norte da
  Suíça ao Tessino e constitui uma parte importante do eixo norte-sul através dos Alpes.
