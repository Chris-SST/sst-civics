    question_de: Welche Aufgabe haben die Gewerkschaften in der Schweiz?
    options_de:
      a: Sie vertreten die Anliegen der Arbeitnehmer.
      b: Sie erteilen Ausländern die Bewilligung zu arbeiten.
      c: Sie legen die Steuersätze für die Unternehmen fest.
      d: Sie vertreten die Interessen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Die Gewerkschaften sind Organisationen der Arbeitnehmer. Sie vertreten deren Interessen,
      zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln oft mit den Arbeitgebern Gesamtarbeitsverträge
      aus. Die Arbeitsbewilligungen hingegen werden von den Behörden ausgestellt, nicht von den Gewerkschaften.
