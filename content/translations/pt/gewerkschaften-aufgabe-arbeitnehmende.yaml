id: gewerkschaften-aufgabe-arbeitnehmende
lang: pt
source_version: 2
question: Qual é a função dos sindicatos na Suíça?
options:
  a: Defendem as preocupações dos trabalhadores.
  b: Concedem a estrangeiros a autorização para trabalhar.
  c: Fixam as taxas de imposto para as empresas.
  d: Representam os interesses dos empregadores perante a Confederação.
explanation: Os sindicatos são organizações de trabalhadores. Representam os interesses destes, por exemplo
  em matéria de salários e condições de trabalho, e muitas vezes negociam convenções coletivas de trabalho
  com os empregadores. As autorizações de trabalho, pelo contrário, são emitidas pelas autoridades, não
  pelos sindicatos.
