    question_de: Eine Arbeitnehmerin hält ihre Kündigung für unbegründet und möchte sie anfechten. Welche
      Stelle behandelt solche Streitigkeiten aus dem Arbeitsverhältnis?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungs- und Konkursamt
    explanation_de: Das Arbeitsgericht ist für Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern
      zuständig. Dazu gehört auch der Streit über eine Kündigung. Das RAV hingegen hilft bei der Arbeitssuche.
