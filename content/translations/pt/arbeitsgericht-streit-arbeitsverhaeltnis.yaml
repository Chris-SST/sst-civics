id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: pt
source_version: 2
question: Uma trabalhadora considera que o seu despedimento é infundado e pretende contestá-lo. Qual é
  a entidade que trata deste tipo de litígios decorrentes da relação de trabalho?
options:
  a: O Centro Regional de Colocação (RAV)
  b: O Serviço de Circulação Rodoviária
  c: O Tribunal do Trabalho
  d: O Serviço de Cobranças e Falências
explanation: O Tribunal do Trabalho é competente para os litígios entre empregadores e trabalhadores.
  Isto inclui também a disputa sobre um despedimento. O RAV, por sua vez, ajuda na procura de emprego.
