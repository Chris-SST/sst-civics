question: Quem decide, em regra, no cantão de Zurique sobre o pedido de licença de construção para uma
  nova habitação?
options:
  a: O Conselho de Governo (Regierungsrat)
  b: A autoridade de construção da comuna (Gemeinde)
  c: O tribunal distrital
  d: O Gabinete Federal do Desenvolvimento Territorial
explanation: Os pedidos de licença de construção para habitações são apresentados na comuna. A autoridade
  de construção comunal analisa o pedido e concede ou recusa a licença de construção. O cantão só intervém
  em casos especiais.
