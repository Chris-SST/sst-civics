    question_de: Wer entscheidet im Kanton Zürich in der Regel über das Baubewilligungsgesuch für eine
      neue Wohnung?
    options_de:
      a: Der Regierungsrat
      b: Die Baubehörde der Gemeinde
      c: Das Bezirksgericht
      d: Das Bundesamt für Raumentwicklung
    explanation_de: Baugesuche für Wohnungen werden bei der Gemeinde eingereicht. Die kommunale Baubehörde
      prüft das Gesuch und erteilt oder verweigert die Baubewilligung. Der Kanton greift nur in besonderen
      Fällen ein.
