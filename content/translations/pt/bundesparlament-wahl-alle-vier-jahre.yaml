id: bundesparlament-wahl-alle-vier-jahre
lang: pt
source_version: 2
question: Com que periodicidade o povo elege de novo o Parlamento federal?
options:
  a: De três em três anos
  b: De quatro em quatro anos
  c: De seis em seis anos
  d: De dois em dois anos
explanation: O povo elege de novo o Conselho Nacional (Nationalrat) de quatro em quatro anos. Também os
  membros do Conselho dos Estados (Ständerat) são hoje eleitos por quatro anos em todos os cantões. Como
  se elege e, em parte, também quando, cada cantão determina por si próprio.
