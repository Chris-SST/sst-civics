id: ordentliche-kuendigung-einschreiben-empfang
lang: pt
source_version: 1
question: Como deve ser entregue uma rescisão ordinária de uma relação de trabalho, para que se possa
  comprovar a sua receção?
options:
  a: Através de uma comunicação à administração da comuna (Gemeinde)
  b: Por carta registada, ou a outra parte confirma a receção por escrito
  c: Por simples e-mail, sem confirmação
  d: Oralmente, numa conversa a sós
explanation: Com uma carta registada ou uma confirmação de receção por escrito, é possível provar que
  a rescisão chegou ao destinatário. Isto é importante porque os prazos de rescisão começam a contar a
  partir da receção.
