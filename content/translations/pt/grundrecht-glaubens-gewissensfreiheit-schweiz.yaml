id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: pt
source_version: 1
question: Qual dos direitos fundamentais é protegido na Suíça pela Constituição Federal?
options:
  a: O direito a um rendimento pago pelo Estado
  b: O direito a um automóvel
  c: O direito a um posto de trabalho
  d: A liberdade de crença e de consciência
explanation: A liberdade de crença e de consciência está prevista no artigo 15 da Constituição Federal.
  O Estado não pode obrigar ninguém a ter uma crença. Não existe, como direito fundamental, um direito
  a um posto de trabalho ou a um rendimento.
