    question_de: Welches der Grundrechte wird in der Schweiz durch die Bundesverfassung geschützt?
    options_de:
      a: Das Recht auf ein vom Staat bezahltes Einkommen
      b: Das Recht auf ein Auto
      c: Das Recht auf einen Arbeitsplatz
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung vorgesehen.
      Der Staat darf niemanden zu einem Glauben zwingen. Ein Recht auf einen Arbeitsplatz oder auf ein
      Einkommen gibt es als Grundrecht nicht.
