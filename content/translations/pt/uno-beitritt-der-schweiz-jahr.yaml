id: uno-beitritt-der-schweiz-jahr
lang: pt
source_version: 1
question: Em que ano a Suíça se tornou membro das Nações Unidas (ONU)?
options:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
explanation: A Suíça aderiu à ONU em 2002, depois de o povo e os cantões terem aprovado a adesão. Foi,
  assim, um dos últimos países a aderir. No entanto, muitas organizações da ONU têm sede em Genebra há
  muito tempo.
