id: volksinitiative-unterschriften-sammelfrist
lang: pt
source_version: 1
question: De quantas assinaturas precisa uma iniciativa popular (Volksinitiative) federal e durante quanto
  tempo é permitido recolhê-las?
options:
  a: 100 000 assinaturas em 100 dias
  b: 50 000 assinaturas em 100 dias
  c: 50 000 assinaturas em 18 meses
  d: 100 000 assinaturas em 18 meses
explanation: Uma iniciativa popular federal precisa de 100 000 assinaturas válidas no prazo de 18 meses.
  O referendo facultativo, pelo contrário, precisa de 50 000 assinaturas em 100 dias.
