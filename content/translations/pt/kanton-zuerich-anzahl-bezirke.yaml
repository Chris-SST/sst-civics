question: Em quantos distritos está dividido o cantão de Zurique?
options:
  a: Em dez distritos
  b: Em doze distritos
  c: Em catorze distritos
  d: Em oito distritos
explanation: O cantão de Zurique está dividido em doze distritos, por exemplo Affoltern, Meilen, Winterthur
  e Zurique. Os distritos são distritos administrativos e judiciais situados entre o cantão e as comunas
  (Gemeinden).
