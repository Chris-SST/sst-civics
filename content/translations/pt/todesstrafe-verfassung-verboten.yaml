id: todesstrafe-verfassung-verboten
lang: pt
source_version: 1
question: O que se aplica na Suíça à pena de morte, segundo a Constituição Federal?
options:
  a: Só é permitida em caso de homicídio.
  b: Só é permitida em tempo de guerra.
  c: Os cantões decidem se ela se aplica.
  d: É proibida.
explanation: A Constituição Federal protege o direito à vida no artigo 10. A pena de morte é expressamente
  proibida, mesmo para crimes graves.
