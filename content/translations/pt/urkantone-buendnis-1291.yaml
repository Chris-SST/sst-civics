question: Quais três territórios se aliaram em 1291 e são considerados o núcleo da futura Confederação
  Helvética?
options:
  a: Uri, Schwyz e Unterwalden
  b: Glarus, Zug e Uri
  c: Basileia, Schaffhausen e Appenzell
  d: Zurique, Berna e Lucerna
explanation: Uri, Schwyz e Unterwalden formaram em 1291 uma Confederação. Esta data é considerada a origem
  da Suíça e é celebrada a 1 de agosto. Os outros cantões só aderiram mais tarde à Confederação.
