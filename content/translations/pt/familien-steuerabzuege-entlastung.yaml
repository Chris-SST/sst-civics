id: familien-steuerabzuege-entlastung
lang: pt
source_version: 1
question: Como as famílias são aliviadas em matéria de impostos?
options:
  a: As famílias não pagam impostos.
  b: As famílias podem fazer deduções nos impostos.
  c: As famílias não precisam preencher a declaração de impostos.
  d: As famílias pagam apenas o imposto sobre o valor acrescentado.
explanation: As famílias podem, por exemplo, fazer deduções para os filhos ou para o acolhimento de crianças.
  Desse modo, o rendimento tributável diminui e, com ele, o imposto.
