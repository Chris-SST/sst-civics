    question_de: Wie werden Familien steuerlich entlastet?
    options_de:
      a: Familien zahlen keine Steuern.
      b: Familien können Abzüge bei den Steuern vornehmen.
      c: Familien müssen die Steuererklärung nicht ausfüllen.
      d: Familien zahlen nur die Mehrwertsteuer.
