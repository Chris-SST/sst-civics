id: parlamentsmitglieder-direkt-gewaehlt-volk
lang: pt
source_version: 2
question: Quem elege os membros do Conselho Nacional (Nationalrat)?
options:
  a: O Conselho Federal (Bundesrat) nomeia-os.
  b: Os partidos designam-nos sem eleição.
  c: O Tribunal Federal (Bundesgericht) escolhe-os.
  d: Os cidadãos com direito de voto elegem-nos diretamente.
explanation: Os membros do Conselho Nacional são eleitos diretamente, de quatro em quatro anos, pelos
  eleitores com direito de voto. Hoje, também os membros do Conselho dos Estados (Ständerat) são eleitos
  pelo povo em todos os cantões, segundo as regras de cada cantão; em Appenzell Rodes Interiores (Appenzell
  Innerrhoden), isso acontece na Landsgemeinde.
