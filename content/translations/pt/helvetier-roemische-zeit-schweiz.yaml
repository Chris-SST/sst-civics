    question_de: Welches Volk lebte zur Zeit der Römer auf dem Gebiet der heutigen Schweiz?
    options_de:
      a: Die Hunnen
      b: Die Wikinger
      c: Die Goten
      d: Die Helvetier
    explanation_de: Die Helvetier waren ein keltischer Stamm des Schweizer Mittellandes. Die Römer unterwarfen
      sie und das Gebiet wurde Teil des Römischen Reiches. Der lateinische Name Helvetia, der für die
      Schweiz verwendet wird, erinnert noch heute an dieses Volk.
