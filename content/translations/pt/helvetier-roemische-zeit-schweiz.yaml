id: helvetier-roemische-zeit-schweiz
lang: pt
source_version: 1
question: Que povo vivia, no tempo dos romanos, no território da atual Suíça?
options:
  a: Os hunos
  b: Os vikings
  c: Os godos
  d: Os helvécios
explanation: Os helvécios eram uma tribo celta do Planalto Suíço (Mittelland). Os romanos submeteram-nos
  e o território passou a fazer parte do Império Romano. O nome latino Helvetia, usado para a Suíça, ainda
  lembra esse povo.
