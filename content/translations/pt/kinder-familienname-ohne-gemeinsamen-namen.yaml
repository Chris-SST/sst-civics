    question_de: Zwei Ehegatten haben bei der Heirat keinen gemeinsamen Familiennamen bestimmt. Wer bestimmt
      dann den Namen der gemeinsamen Kinder?
    options_de:
      a: Die Kinder erhalten automatisch den Namen des Vaters.
      b: Das Zivilstandsamt entscheidet nach der alphabetischen Reihenfolge der Namen.
      c: Die Ehegatten wählen den Namen der Kinder selbst.
      d: Die Kinder erhalten automatisch den Namen der Mutter.
    explanation_de: Wenn die Ehegatten keinen gemeinsamen Familiennamen bestimmt haben, müssen sie den
