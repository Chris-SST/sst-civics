id: kinder-familienname-ohne-gemeinsamen-namen
lang: pt
source_version: 1
question: Dois cônjuges não determinaram um apelido de família comum no momento do casamento. Quem define,
  então, o apelido dos filhos em comum?
options:
  a: Os filhos recebem automaticamente o apelido do pai.
  b: O registo civil decide de acordo com a ordem alfabética dos apelidos.
  c: Os cônjuges escolhem eles próprios o apelido dos filhos.
  d: Os filhos recebem automaticamente o apelido da mãe.
explanation: Se os cônjuges não determinaram um apelido de família comum, devem escolher eles próprios
  o apelido dos filhos. A lei não o define automaticamente. As regras constam do Código Civil suíço.
