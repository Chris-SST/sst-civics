    question_de: Was sind die Aufgaben der Kantone?
    options_de:
      a: Sie bestimmen die Aussenpolitik und die Währung der Schweiz.
      b: Sie erlassen die Gesetze für das ganze Land.
      c: Sie führen die Armee und bestimmen die Zollgebühren.
      d: Sie führen ihre eigene Verwaltung und erlassen das kantonale Recht.
    explanation_de: Jeder Kanton hat eine eigene Regierung, ein eigenes Parlament und eine eigene Verwaltung.
      Er erarbeitet seine eigenen Gesetze, die nur im Kanton gelten, zum Beispiel für die Schulen oder
      die Polizei. Die Aussenpolitik, die Währung, die Armee, die Zollgebühren und die Gesetze für die
      ganze Schweiz fallen in die Zuständigkeit des Bundes.
