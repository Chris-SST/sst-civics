id: kantone-eigene-verwaltung-und-recht
lang: pt
source_version: 2
question: Quais são as tarefas dos cantões?
options:
  a: Determinam a política externa e a moeda da Suíça.
  b: Promulgam as leis para todo o país.
  c: Dirigem o exército e determinam as taxas alfandegárias.
  d: Dirigem a sua própria administração e promulgam o direito cantonal.
explanation: Cada cantão tem um governo próprio, um parlamento próprio e uma administração própria. Elabora
  as suas próprias leis, que só valem no cantão, por exemplo para as escolas ou a polícia. A política
  externa, a moeda, o exército, as taxas alfandegárias e as leis para toda a Suíça são da competência
  da Confederação.
