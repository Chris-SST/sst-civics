id: pfaeffikersee-im-kanton-zuerich
lang: pt
source_version: 1
question: Em que cantão se situa o Pfäffikersee?
options:
  a: Cantão da Turgóvia
  b: Cantão de São Galo
  c: Cantão de Zurique
  d: Cantão de Zug
explanation: O Pfäffikersee situa-se no Zürcher Oberland e pertence ao território do cantão de Zurique.
  É um dos lagos maiores do cantão. Os outros cantões mencionados fazem fronteira, em parte, com Zurique,
  mas não contêm o lago.
