id: alv-beitraege-pensionierte-personen
lang: pt
source_version: 1
question: Quem, na Suíça, já não tem de pagar contribuições para o seguro de desemprego (ALV)?
options:
  a: Pessoas com um contrato de trabalho sem termo
  b: Pessoas que atingiram a idade de reforma ordinária do seguro de velhice e sobrevivência (AHV)
  c: Pessoas que trabalham a tempo parcial
  d: Pessoas que nos últimos dois anos nunca estiveram desempregadas
explanation: A obrigação de contribuir para o seguro de desemprego termina quando se atinge a idade de
  reforma do seguro de velhice e sobrevivência. Quem está reformado já não paga contribuições para o seguro
  de desemprego (ALV) sobre um eventual salário. Os trabalhadores a tempo parcial e a tempo inteiro, pelo
  contrário, pagam contribuições.
