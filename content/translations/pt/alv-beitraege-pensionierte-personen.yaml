    question_de: Wer muss in der Schweiz keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen mit einem unbefristeten Arbeitsvertrag
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die in Teilzeit arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Beitragspflicht an die Arbeitslosenversicherung endet, wenn das Rentenalter der
      Alters- und Hinterlassenenversicherung erreicht wird. Wer pensioniert ist, bezahlt auf einem allfälligen
      Lohn keine Beiträge mehr an die Arbeitslosenversicherung (ALV). Teilzeit- und Vollzeitbeschäftigte
      hingegen bezahlen Beiträge.
