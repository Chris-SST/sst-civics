    question_de: Eine Person beleidigt öffentlich andere Personen wegen ihres Glaubens oder ihrer Herkunft.
      Wie ist das in der Schweiz geregelt?
    options_de:
      a: Es ist nur in Schulen und in Unternehmen verboten.
      b: Es ist verboten und kann bestraft werden.
      c: Es ist nur verboten, wenn es in der Zeitung veröffentlicht wird.
      d: Es ist immer durch die Meinungsfreiheit geschützt.
