id: beschimpfung-wegen-glauben-verboten
lang: pt
source_version: 1
question: Uma pessoa insulta publicamente outras pessoas por causa da sua fé ou da sua origem. Como é
  que isso está regulado na Suíça?
options:
  a: Só é proibido nas escolas e nas empresas.
  b: É proibido e pode ser punido.
  c: Só é proibido se for publicado no jornal.
  d: Está sempre protegido pela liberdade de expressão.
explanation: O Código Penal proíbe a discriminação pública de pessoas por causa da sua raça, etnia, religião
  ou orientação sexual. A liberdade de expressão não é ilimitada.
