id: bundesgesetz-referendum-volksmehr-genuegt
lang: pt
source_version: 1
question: Foi lançado um referendo facultativo contra uma nova lei federal. O que é necessário para que
  a lei seja aprovada na votação popular?
options:
  a: A maioria dos votantes em toda a Suíça
  b: Uma maioria de dois terços dos votantes
  c: Apenas a maioria dos cantões
  d: A maioria dos votantes e a maioria dos cantões
explanation: Num referendo facultativo contra uma lei federal, conta apenas a maioria do povo (Volksmehr),
  ou seja, a maioria dos votos válidos em toda a Suíça. A maioria dos cantões (Ständemehr) só é necessária
  adicionalmente no caso de alterações da Constituição Federal e de certos tratados internacionais.
