id: ahv-pflichtversicherung
lang: pt
source_version: 1
question: Qual afirmação sobre o seguro de velhice e sobrevivência (AHV) está correta?
options:
  a: O seguro de velhice e sobrevivência faz parte dos seguros obrigatórios.
  b: O seguro de velhice e sobrevivência é um seguro facultativo para trabalhadores independentes.
  c: O seguro de velhice e sobrevivência aplica-se apenas a pessoas com passaporte suíço.
  d: O seguro de velhice e sobrevivência é um seguro privado dos empregadores.
explanation: O seguro de velhice e sobrevivência é obrigatório. Quem reside ou trabalha na Suíça está,
  em princípio, segurado e tem de pagar contribuições.
