    question_de: Für wen gilt in der Schweiz die obligatorische Grundversicherung für ärztliche Behandlungen?
    options_de:
      a: Nur für Personen mit Schweizer Bürgerrecht
      b: Nur für Personen mit bezahlter Erwerbstätigkeit
      c: Nur für Personen mit niedrigem Einkommen
      d: Für alle Einwohner der Schweiz
    explanation_de: Die obligatorische Krankenpflegeversicherung gilt für alle Personen, die in der Schweiz
