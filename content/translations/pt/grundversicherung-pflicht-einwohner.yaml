id: grundversicherung-pflicht-einwohner
lang: pt
source_version: 1
question: Para quem vale, na Suíça, o seguro de base obrigatório para tratamentos médicos?
options:
  a: Apenas para pessoas com cidadania (Bürgerrecht) suíça
  b: Apenas para pessoas com atividade profissional remunerada
  c: Apenas para pessoas com baixos rendimentos
  d: Para todos os habitantes da Suíça
explanation: O seguro obrigatório de cuidados de saúde vale para todas as pessoas que residem na Suíça.
  A cidadania, a atividade profissional e os rendimentos não têm qualquer importância neste contexto.
