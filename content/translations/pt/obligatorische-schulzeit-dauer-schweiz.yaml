id: obligatorische-schulzeit-dauer-schweiz
lang: pt
source_version: 3
question: Quantos anos dura a escolaridade obrigatória no cantão de Zurique, incluindo o jardim de infância?
options:
  a: Onze anos
  b: Dez anos
  c: Doze anos
  d: Nove anos
explanation: 'No cantão de Zurique, todas as crianças frequentam a escola de forma obrigatória durante
  onze anos: dois anos de jardim de infância, seis anos de escola primária (Primarschule) e três anos
  de ensino secundário I (Sekundarstufe I). A maioria dos cantões uniformizou esta duração através do
  Concordato HarmoS. Alguns cantões, porém, não aderiram, e aí, em parte, é obrigatório apenas um ano
  de jardim de infância.'
