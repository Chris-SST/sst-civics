id: volksinitiative-sammelfrist-monate
lang: pt
source_version: 1
question: De quanto tempo dispõem os autores da iniciativa para recolher as assinaturas para uma iniciativa
  popular (Volksinitiative) federal?
options:
  a: 6 meses
  b: 12 meses
  c: 18 meses
  d: 36 meses
explanation: O prazo para a recolha de assinaturas é de 18 meses a contar da publicação na Folha Federal
  (Bundesblatt). Se não conseguirem reunir as 100 000 assinaturas necessárias durante esse período, a
  iniciativa não se concretiza.
