id: forstleute-andere-baumarten-pflanzen
lang: pt
source_version: 1
question: Como reagem os silvicultores na Suíça ao aumento das temperaturas?
options:
  a: Plantam cada vez mais outras espécies de árvores.
  b: Plantam apenas árvores que sempre estiveram ali.
  c: Abandonam por completo os cuidados com a floresta.
  d: Desflorestam as florestas em altitudes baixas.
explanation: Algumas espécies de árvores toleram mal o calor e a seca. Por isso, os silvicultores apostam
  em outras espécies, mais adaptadas ao clima mais quente. Assim, pretende-se que a floresta permaneça
  estável.
