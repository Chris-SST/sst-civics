    question_de: Wie reagieren die Forstwirte in der Schweiz auf den Anstieg der Temperaturen?
    options_de:
      a: Sie pflanzen immer mehr andere Baumarten.
      b: Sie pflanzen nur Bäume, die schon immer dort waren.
      c: Sie geben die Pflege des Waldes vollständig auf.
      d: Sie roden die Wälder in tiefen Lagen.
    explanation_de: Einige Baumarten vertragen Hitze und Trockenheit schlecht. Deshalb setzen die Forstwirte
      auf andere Arten, die besser an das wärmere Klima angepasst sind. Damit soll der Wald stabil bleiben.
