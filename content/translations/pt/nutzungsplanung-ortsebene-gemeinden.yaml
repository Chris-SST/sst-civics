    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie der Boden genutzt wird, zum Beispiel
      wo die Wohnzonen und die Gewerbezonen liegen?
    options_de:
      a: Die Bundesversammlung der Schweiz
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Die Bezirksräte allein
    explanation_de: Die Gemeinden erarbeiten den Nutzungsplan für ihr Gebiet, zum Beispiel die Bau- und
