id: nutzungsplanung-ortsebene-gemeinden
lang: pt
source_version: 1
question: Quem planeia, no cantão de Zurique, a nível local, como o solo é utilizado, por exemplo onde
  ficam as zonas residenciais e as zonas comerciais?
options:
  a: A Assembleia Federal (Bundesversammlung) da Suíça
  b: A polícia cantonal
  c: As comunas (Gemeinden)
  d: Os conselhos distritais (Bezirksräte) sozinhos
explanation: As comunas elaboram o plano de utilização para o seu território, por exemplo o regulamento
  de construção e zonamento. Ao fazê-lo, respeitam as diretrizes da Confederação e do cantão. Assim, participam
  na decisão sobre a forma como a localidade se desenvolve.
