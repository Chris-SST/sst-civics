id: fakultatives-referendum-unterschriften-anzahl
lang: pt
source_version: 1
question: Quantas assinaturas são necessárias para um referendo facultativo contra uma lei federal?
options:
  a: 200 000 assinaturas
  b: 30 000 assinaturas
  c: 50 000 assinaturas
  d: 100 000 assinaturas
explanation: Para um referendo facultativo são necessárias 50 000 assinaturas válidas de pessoas com direito
  de voto. Elas devem ser recolhidas no prazo de 100 dias após a publicação da lei.
