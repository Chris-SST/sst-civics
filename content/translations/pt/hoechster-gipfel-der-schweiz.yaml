id: hoechster-gipfel-der-schweiz
lang: pt
source_version: 2
question: Qual é o nome do cume mais alto da Suíça?
options:
  a: Piz Bernina
  b: Matterhorn
  c: Dufourspitze
  d: Jungfrau
explanation: A Dufourspitze, no maciço do Monte Rosa, no Valais, é, com cerca de 4634 metros, o cume mais
  alto da Suíça. O Matterhorn é mais conhecido, mas mais baixo. O Piz Bernina, nos Grisões, é o cume mais
  alto dos Alpes Orientais.
