id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: pt
source_version: 1
question: Qual das seguintes tarefas faz parte da missão da polícia?
options:
  a: Perseguir as infrações à lei
  b: Realizar votações populares
  c: Promulgar leis para o país
  d: Proferir sentenças judiciais sobre criminosos
explanation: A polícia zela pela segurança e pela ordem e persegue as infrações à lei. Investiga crimes
  e encaminha os resultados. As leis são promulgadas pelo Parlamento; as sentenças são proferidas pelos
  tribunais.
