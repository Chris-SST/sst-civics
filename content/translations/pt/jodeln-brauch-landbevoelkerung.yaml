question: Qual costume tradicional da população rural suíça é uma forma de cantar em que a voz muda rapidamente
  entre a voz de peito e a voz de cabeça?
options:
  a: Tocar a trompa alpina (Alphornblasen)
  b: O canto jodel (Jodeln)
  c: Hornussen
  d: Lançamento de bandeiras (Fahnenschwingen)
explanation: No jodel, a voz muda rapidamente entre a voz de peito e a voz de cabeça. O jodel é um costume
  tradicional da população rural suíça. O jodel natural dispensa palavras, mas muitas canções de jodel
  têm um texto.
