id: henry-dunant-gruender-rotes-kreuz
lang: pt
source_version: 2
question: Quem é considerado o fundador da Cruz Vermelha em Genebra?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: O genebrino Henry Dunant viu, em 1859, após a batalha de Solferino, que muitos feridos ficavam
  sem qualquer ajuda. Por isso empenhou-se nos cuidados prestados a eles, e em 1863 nasceu em Genebra
  a Cruz Vermelha. Por esse feito, Dunant recebeu em 1901, juntamente com Frédéric Passy, o primeiro Prémio
  Nobel da Paz.
