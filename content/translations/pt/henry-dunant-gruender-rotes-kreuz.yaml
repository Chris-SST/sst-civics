    question_de: Wer gilt als der Gründer des Roten Kreuzes in Genf?
    options_de:
      a: Alfred Escher
      b: Johann Heinrich Pestalozzi
      c: Huldrych Zwingli
      d: Henry Dunant
    explanation_de: Der Genfer Henry Dunant sah 1859 nach der Schlacht von Solferino, dass viele Verwundete
      ohne jede Hilfe blieben. Deshalb setzte er sich für ihre Pflege ein, und 1863 entstand in Genf das
      Rote Kreuz. Für diese Tat erhielt Dunant 1901 zusammen mit Frédéric Passy den ersten Friedensnobelpreis.
