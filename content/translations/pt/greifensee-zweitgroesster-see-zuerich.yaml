id: greifensee-zweitgroesster-see-zuerich
lang: pt
source_version: 1
question: Qual é o segundo maior lago do cantão de Zurique, depois do lago de Zurique?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: O Greifensee situa-se entre Uster e Dübendorf e é, depois do lago de Zurique, o segundo maior
  lago do cantão. O Pfäffikersee é menor. O Türlersee e o Katzensee são ainda claramente menores.
