id: hundehaltung-abgabe-hundesteuer
lang: pt
source_version: 2
question: O que se aplica no cantão de Zurique às pessoas que têm um cão?
options:
  a: Têm de pagar todos os anos uma taxa pelo cão à comuna (Gemeinde).
  b: Só têm de pagar uma vez, no momento da compra do cão, uma taxa à Confederação.
  c: Têm de fazer todos os anos um exame com o cão junto do cantão.
  d: Só têm de pagar uma taxa se ganharem dinheiro com o cão.
explanation: Quem tem um cão no cantão de Zurique paga todos os anos uma taxa pelo cão, o chamado imposto
  sobre cães. O dinheiro vai para a comuna de residência, não para a Confederação. A taxa não é única
  e aplica-se também aos cães que se têm apenas para uso privado.
