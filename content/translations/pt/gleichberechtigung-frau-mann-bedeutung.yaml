id: gleichberechtigung-frau-mann-bedeutung
lang: pt
source_version: 1
question: O que significa, em princípio, a igualdade de direitos entre mulheres e homens?
options:
  a: Em princípio, mulheres e homens têm os mesmos direitos.
  b: Em todas as áreas da vida, mulheres e homens têm os mesmos deveres, mas direitos diferentes.
  c: Mulheres e homens ganham exatamente o mesmo em todas as profissões.
  d: Mulheres e homens têm de dividir igualmente todas as tarefas na família.
explanation: Igualdade de direitos significa que, em princípio, ambos os sexos possuem os mesmos direitos.
  Ela está consagrada na Constituição Federal. O princípio não diz nada sobre a forma como as famílias
  dividem, em cada caso, as suas tarefas.
