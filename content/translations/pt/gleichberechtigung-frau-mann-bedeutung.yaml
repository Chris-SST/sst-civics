    question_de: Was bedeutet die Gleichberechtigung von Frauen und Männern grundsätzlich?
    options_de:
      a: Grundsätzlich haben Frauen und Männer die gleichen Rechte.
      b: In allen Lebensbereichen haben Frauen und Männer die gleichen Pflichten, aber unterschiedliche
        Rechte.
      c: Frauen und Männer verdienen in allen Berufen genau gleich viel.
      d: Frauen und Männer müssen alle Aufgaben in der Familie gleichmässig aufteilen.
    explanation_de: Gleichberechtigung bedeutet, dass grundsätzlich beide Geschlechter die gleichen Rechte
      haben. Sie ist in der Bundesverfassung verankert. Das Prinzip sagt nichts darüber aus, wie die Familien
      ihre Aufgaben im jeweiligen Fall aufteilen.
