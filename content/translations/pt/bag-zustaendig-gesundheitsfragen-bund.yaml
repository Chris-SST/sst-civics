id: bag-zustaendig-gesundheitsfragen-bund
lang: pt
source_version: 1
question: Qual autoridade da Confederação é responsável pelas questões de saúde?
options:
  a: O Gabinete Federal do Ambiente (BAFU)
  b: A Secretaria de Estado da Migração (SEM)
  c: O Gabinete Federal de Estatística (BFS)
  d: O Gabinete Federal da Saúde (BAG)
explanation: O Gabinete Federal da Saúde (BAG) é a autoridade da Confederação responsável pelas questões
  de saúde. Supervisiona, por exemplo, o seguro social de saúde.
