id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
lang: pt
source_version: 1
question: Quem tem, na Suíça, direito legal à licença de maternidade após o nascimento de um filho?
options:
  a: Apenas as mulheres que trabalham numa empresa com mais de 50 empregados
  b: Toda mulher com atividade profissional que dá à luz um filho
  c: Apenas as mulheres que são casadas
  d: Apenas as mulheres com cidadania (Bürgerrecht) suíça
explanation: A lei prevê, para as mães com atividade profissional, o direito à licença de maternidade
  e a uma indemnização. O tamanho da empresa, a nacionalidade e o estado civil não têm qualquer importância
  para esse efeito. A indemnização é financiada através do regime de compensação por perda de rendimentos
  (Erwerbsersatzordnung).
