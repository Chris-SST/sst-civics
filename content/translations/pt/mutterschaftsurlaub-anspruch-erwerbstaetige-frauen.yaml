    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes einen gesetzlichen Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Unternehmen mit mehr als 50 Angestellten arbeiten
      b: Jede erwerbstätige Frau, die ein Kind zur Welt bringt
      c: Nur Frauen, die verheiratet sind
      d: Nur Frauen mit schweizerischem Bürgerrecht
    explanation_de: Das Gesetz sieht für erwerbstätige Mütter den Anspruch auf Mutterschaftsurlaub und
      auf eine Entschädigung vor. Die Grösse des Unternehmens, die Staatsangehörigkeit und der Zivilstand
      spielen dafür keine Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
