id: notruf-144-rettungsdienst
lang: pt
source_version: 1
question: Que número de telefone se marca na Suíça, em caso de emergência médica, para chamar o serviço
  de emergência médica?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: O número 144 é o número de emergência do serviço de emergência médica em casos de urgência
  médica. O 117 é para a polícia e o 118 para os bombeiros. O 145 é o número do Tox Info Suisse em caso
  de intoxicações.
