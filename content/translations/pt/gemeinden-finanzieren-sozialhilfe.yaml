id: gemeinden-finanzieren-sozialhilfe
lang: pt
source_version: 1
question: Quem financia, no cantão de Zurique, a assistência social para pessoas em situação de emergência?
options:
  a: Apenas as igrejas
  b: O Banco Nacional Suíço
  c: As associações de empregadores
  d: As comunas (Gemeinden)
explanation: No cantão de Zurique, as comunas são responsáveis pela assistência social e suportam os respetivos
  custos. Isso pode sobrecarregar fortemente as comunas mais pequenas. Por isso existe a compensação financeira.
