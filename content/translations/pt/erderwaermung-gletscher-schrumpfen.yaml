id: erderwaermung-gletscher-schrumpfen
lang: pt
source_version: 1
question: Qual é o efeito do aquecimento global sobre os glaciares dos Alpes suíços?
options:
  a: Os glaciares diminuem.
  b: Os glaciares deslocam-se para norte.
  c: Os glaciares crescem mais depressa.
  d: Os glaciares permanecem inalterados.
explanation: Com o aumento das temperaturas, derrete-se mais gelo do que aquele que é reposto pela neve.
  Por isso, os glaciares suíços ficam mais pequenos. Isto também afeta as águas e a paisagem dos Alpes.
