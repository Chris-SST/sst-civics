question: Quem liderou a Reforma em Zurique na década de 1520?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martinho Lutero
  d: João Calvino
explanation: Ulrich Zwingli era pároco (Leutpriester) na Grossmünster e introduziu a Reforma em Zurique.
  O conselho da cidade apoiou-o nesse processo. Calvino atuou em Genebra e Lutero na Alemanha.
