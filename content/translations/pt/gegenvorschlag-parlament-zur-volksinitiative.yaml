id: gegenvorschlag-parlament-zur-volksinitiative
lang: pt
source_version: 1
question: O que pode o Parlamento opor a uma iniciativa popular (Volksinitiative) federal?
options:
  a: Uma prorrogação do prazo de recolha de assinaturas por mais um ano
  b: Uma contraproposta própria, que também será submetida a votação
  c: Uma segunda recolha de assinaturas em todos os cantões
  d: Uma proibição de submeter a iniciativa a votação
explanation: O Parlamento pode opor a uma iniciativa popular uma contraproposta direta. Esta acolhe frequentemente
  o pedido em parte, mas vai menos longe. Os eleitores votam então, no mesmo dia, sobre a iniciativa e
  sobre a contraproposta.
