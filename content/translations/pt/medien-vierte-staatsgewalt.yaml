id: medien-vierte-staatsgewalt
lang: pt
source_version: 1
question: Os meios de comunicação social são frequentemente designados por uma expressão especial que
  descreve o seu papel no Estado. Que expressão é essa?
options:
  a: Segundo poder do Estado
  b: Poder supremo do Estado
  c: Primeiro poder do Estado
  d: Quarto poder do Estado
explanation: Os três poderes do Estado são o legislativo, o executivo e o judicial. Os meios de comunicação
  social não fazem parte deles, mas fiscalizam a política e informam a população. Por isso, são frequentemente
  chamados de quarto poder do Estado.
