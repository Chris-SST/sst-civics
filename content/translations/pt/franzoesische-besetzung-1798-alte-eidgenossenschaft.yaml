id: franzoesische-besetzung-1798-alte-eidgenossenschaft
lang: pt
source_version: 1
question: Qual foi a consequência da entrada das tropas francesas na Suíça em 1798?
options:
  a: Tornou a Suíça parte da França
  b: Reforçou o poder dos antigos cantões (alte Orte)
  c: Levou à fundação do Estado federal de 1848
  d: Pôs fim à antiga ordem da Antiga Confederação
explanation: Com a ocupação pela França, a antiga Confederação Suíça (Eidgenossenschaft) desmoronou-se.
  Em seu lugar surgiu a República Helvética, como Estado unitário. O atual Estado federal só surgiu em
  1848.
