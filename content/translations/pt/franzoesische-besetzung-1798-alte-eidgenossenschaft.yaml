    question_de: Was war die Folge des Einmarsches der französischen Truppen in die Schweiz im Jahr 1798?
    options_de:
      a: Er machte die Schweiz zu einem Teil Frankreichs
      b: Er stärkte die Macht der alten Orte
      c: Er führte zur Gründung des Bundesstaates von 1848
      d: Er setzte der alten Ordnung der Alten Eidgenossenschaft ein Ende
    explanation_de: Mit der Besetzung durch Frankreich brach die alte Schweizerische Eidgenossenschaft
      zusammen. An ihre Stelle trat die Helvetische Republik als Einheitsstaat. Der heutige Bundesstaat
      entstand erst 1848.
