id: schweiz-staatsform-demokratie
lang: pt
source_version: 1
question: Qual é a forma de governo da Suíça?
options:
  a: É uma ditadura com um único partido.
  b: É uma monarquia com um rei eleito.
  c: É um Estado democrático.
  d: É um Estado governado por uma família da nobreza.
explanation: A Suíça é uma democracia. A população participa nas decisões políticas por meio de eleições
  e votações. A Constituição Federal estabelece isso como base do Estado.
