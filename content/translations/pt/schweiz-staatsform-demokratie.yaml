    question_de: Was ist die Regierungsform der Schweiz?
    options_de:
      a: Sie ist eine Diktatur mit einer einzigen Partei.
      b: Sie ist eine Monarchie mit einem gewählten König.
      c: Sie ist ein demokratischer Staat.
      d: Sie ist ein Staat, der von einer Adelsfamilie regiert wird.
    explanation_de: Die Schweiz ist eine Demokratie. Die Bevölkerung beteiligt sich durch Wahlen und Abstimmungen
      an den politischen Entscheidungen. Die Bundesverfassung legt dies als Grundlage des Staates fest.
