id: zollwesen-zustaendigkeit-bund
lang: es
source_version: 1
question: ¿Quién se encarga en Suiza de los asuntos aduaneros?
options:
  a: La Confederación
  b: Los municipios (Gemeinden) situados en la frontera
  c: Los cantones en los que se encuentran las fronteras
  d: Los cantones y la Confederación, a partes iguales
explanation: Según la Constitución Federal, los asuntos aduaneros son competencia de la Confederación.
  Esta regula los aranceles y el control del tráfico de mercancías a través de la frontera. Los cantones
  y los municipios no tienen competencia propia en esta materia.
