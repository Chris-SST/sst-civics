    question_de: Wer ist in der Schweiz für das Zollwesen zuständig?
    options_de:
      a: Der Bund
      b: Die Gemeinden an der Grenze
      c: Die Kantone, in denen sich die Grenzen befinden
      d: Die Kantone und der Bund, zu gleichen Teilen
    explanation_de: Gemäss der Bundesverfassung fällt das Zollwesen in die Zuständigkeit des Bundes. Dieser
      regelt die Zölle und die Kontrolle des Warenverkehrs über die Grenze. Die Kantone und die Gemeinden
      haben in diesem Bereich keine eigene Zuständigkeit.
