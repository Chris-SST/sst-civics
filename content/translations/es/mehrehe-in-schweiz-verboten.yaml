id: mehrehe-in-schweiz-verboten
lang: es
source_version: 1
question: ¿Qué rige en Suiza respecto al matrimonio con varias parejas al mismo tiempo?
options:
  a: Está permitido si todas las personas están de acuerdo
  b: Está prohibido
  c: Está permitido si tiene una justificación religiosa
  d: Solo está permitido para personas con pasaporte extranjero
explanation: Suiza solo reconoce el matrimonio monógamo. Quien ya está casado o vive en una unión registrada
  no puede contraer otro matrimonio. Esto se aplica independientemente de la religión o del origen.
