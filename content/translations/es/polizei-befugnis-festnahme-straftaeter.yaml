id: polizei-befugnis-festnahme-straftaeter
lang: es
source_version: 2
question: ¿Qué organismo puede detener a las personas sospechosas de haber cometido un delito?
options:
  a: La autoridad escolar
  b: La policía
  c: El Parlamento
  d: La oficina de impuestos
explanation: La policía puede detener a las personas sospechosas de haber cometido un delito, siempre
  que se cumplan los requisitos legales. Después, un tribunal decide si la persona es culpable. La autoridad
  escolar, el Parlamento y la oficina de impuestos no tienen esta facultad.
