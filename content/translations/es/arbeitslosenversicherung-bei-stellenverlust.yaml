id: arbeitslosenversicherung-bei-stellenverlust
lang: es
source_version: 1
question: ¿Qué seguro social interviene cuando una persona pierde su puesto de trabajo?
options:
  a: El seguro de invalidez
  b: El seguro de vejez y supervivencia
  c: El seguro de desempleo
  d: El seguro de accidentes
explanation: El seguro de desempleo paga una indemnización, bajo determinadas condiciones, cuando alguien
  pierde su puesto de trabajo. También ayuda en la búsqueda de un nuevo empleo.
