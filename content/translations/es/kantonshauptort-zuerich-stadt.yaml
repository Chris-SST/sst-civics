question: ¿Qué ciudad es la capital del cantón de Zúrich?
options:
  a: Uster
  b: La ciudad de Zúrich
  c: Winterthur
  d: Dübendorf
explanation: La ciudad de Zúrich es la capital del cantón y lleva el mismo nombre. Allí tienen su sede,
  entre otros, el Consejo Cantonal (Kantonsrat) y el Consejo de Gobierno (Regierungsrat). Winterthur es
  la segunda ciudad más grande del cantón.
