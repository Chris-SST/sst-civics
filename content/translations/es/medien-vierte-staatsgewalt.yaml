id: medien-vierte-staatsgewalt
lang: es
source_version: 1
question: A los medios de comunicación se les designa a menudo con una expresión especial que describe
  su papel en el Estado. ¿Qué expresión es esa?
options:
  a: Segundo poder del Estado
  b: Poder supremo del Estado
  c: Primer poder del Estado
  d: Cuarto poder del Estado
explanation: Los tres poderes del Estado son el legislativo, el ejecutivo y el judicial. Los medios de
  comunicación no forman parte de ellos, pero controlan la política e informan a la población. Por eso
  se les llama a menudo el cuarto poder del Estado.
