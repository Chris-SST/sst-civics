lang: es
source_version: 1
question: ¿Cómo se constituye el parlamento de la ciudad de Zúrich, el consejo municipal (Gemeinderat)?
options:
  a: Lo nombra el Consejo de Gobierno (Regierungsrat) del cantón
  b: El Consejo de la Ciudad (Stadtrat) determina por sí mismo a los miembros
  c: Los partidos se reparten los escaños entre sí por sorteo
  d: La población lo elige directamente en las urnas
explanation: Las personas con derecho a voto de la ciudad de Zúrich eligen el consejo municipal en elecciones
  generales. Es el parlamento de la ciudad y sustituye a la asamblea municipal (Gemeindeversammlung).
