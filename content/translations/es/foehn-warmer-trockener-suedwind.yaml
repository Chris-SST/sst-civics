id: foehn-warmer-trockener-suedwind
lang: es
source_version: 1
question: ¿Qué es el Föhn?
options:
  a: Un viento frío y húmedo del norte
  b: Un viento frío del este en invierno
  c: Una lluvia fuerte en primavera
  d: Un viento cálido y seco procedente del sur
explanation: El Föhn es un viento descendente cálido y seco que sopla en los Alpes, sobre todo desde el
  sur. Puede hacer que las temperaturas suban rápidamente y que la visibilidad sea muy nítida.
