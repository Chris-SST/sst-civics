    question_de: Welches durch die Bundesverfassung garantierte Grundrecht erlaubt es, die eigene Meinung
      frei zu äussern und zu verbreiten?
    options_de:
      a: Die Meinungsfreiheit
      b: Das Stimmrecht
      c: Die Eigentumsgarantie
      d: Die Niederlassungsfreiheit
    explanation_de: Die Meinungsfreiheit erlaubt es, die eigene Meinung frei zu äussern und zu verbreiten.
      Sie ist in Artikel 16 der Bundesverfassung verankert. Das Stimmrecht hingegen bezieht sich auf die
      Teilnahme an Wahlen und Abstimmungen.
