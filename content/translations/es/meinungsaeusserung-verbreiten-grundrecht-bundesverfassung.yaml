id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: es
source_version: 1
question: ¿Qué derecho fundamental garantizado por la Constitución Federal permite expresar y difundir
  libremente la propia opinión?
options:
  a: La libertad de opinión
  b: El derecho de voto
  c: La garantía de la propiedad
  d: La libertad de establecimiento
explanation: La libertad de opinión permite expresar y difundir libremente la propia opinión. Está recogida
  en el artículo 16 de la Constitución Federal. El derecho de voto, en cambio, se refiere a la participación
  en elecciones y votaciones.
