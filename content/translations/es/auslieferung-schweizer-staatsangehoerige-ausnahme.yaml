    question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Staatsangehörigen ins Ausland?
    options_de:
      a: Sie werden auf Ersuchen eines beliebigen Staates ausgeliefert.
      b: Sie werden nicht gegen ihren Willen an einen anderen Staat ausgeliefert. Sie können jedoch an
        ein internationales Gericht überstellt werden.
      c: Sie werden nur an die Nachbarstaaten der Schweiz ausgeliefert.
      d: Sie werden ausgeliefert, wenn der Bundesrat es in einem konkreten Fall wünscht.
    explanation_de: Nach Artikel 25 der Bundesverfassung dürfen Schweizer Bürgerinnen und Bürger nicht
      ausgewiesen werden. Sie dürfen nur an einen anderen Staat ausgeliefert werden, wenn sie selbst einverstanden
      sind. Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine ausländische
      Behörde; deshalb erlaubt ein Bundesgesetz, Schweizer Staatsangehörige dorthin für ein Verfahren
      zu überstellen.
