id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: es
source_version: 2
question: ¿Qué se aplica en principio a la extradición de nacionales suizos al extranjero?
options:
  a: Son extraditados a petición de cualquier Estado.
  b: No son extraditados a otro Estado contra su voluntad. Sin embargo, pueden ser entregados a un tribunal
    internacional.
  c: Solo son extraditados a los Estados vecinos de Suiza.
  d: Son extraditados si el Consejo Federal (Bundesrat) lo desea en un caso concreto.
explanation: Según el artículo 25 de la Constitución Federal, los ciudadanos suizos no pueden ser expulsados.
  Solo pueden ser extraditados a otro Estado si ellos mismos están de acuerdo. Un tribunal internacional,
  por ejemplo la Corte Penal Internacional, no es una autoridad extranjera; por eso una ley federal permite
  entregar allí a nacionales suizos para un proceso.
