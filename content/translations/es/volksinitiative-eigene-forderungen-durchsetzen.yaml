id: volksinitiative-eigene-forderungen-durchsetzen
lang: es
source_version: 1
question: ¿Para qué sirve una iniciativa popular (Volksinitiative) a las personas con derecho a voto?
options:
  a: Con ella pueden modificar una sentencia del Tribunal Federal (Bundesgericht).
  b: Con ella pueden poner sus propias demandas en la agenda política.
  c: Con ella pueden fijar la fecha de las próximas elecciones.
  d: Con ella pueden impedir una ley del Parlamento.
explanation: Con una iniciativa popular, las personas con derecho a voto pueden proponer una modificación
  de la Constitución Federal. Si la iniciativa prospera, se somete a votación. Así pueden imponer sus
  propias reivindicaciones incluso contra la voluntad del Parlamento, si el pueblo y los cantones la aprueban.
