id: landessprachen-der-schweiz-aufzaehlung
lang: es
source_version: 1
question: ¿Qué idiomas son lenguas nacionales en Suiza?
options:
  a: Alemán, francés, romanche y español
  b: Alemán, francés, italiano y romanche
  c: Alemán, francés, italiano e inglés
  d: Alemán, francés e italiano
explanation: La Constitución Federal menciona el alemán, el francés, el italiano y el romanche como lenguas
  nacionales. El inglés no es una lengua nacional, pero se utiliza a menudo como lengua de comunicación.
