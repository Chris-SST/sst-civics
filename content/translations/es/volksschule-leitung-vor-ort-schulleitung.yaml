id: volksschule-leitung-vor-ort-schulleitung
lang: es
source_version: 2
question: ¿Quién dirige directamente en el propio centro una escuela pública (Volksschule) del cantón
  de Zúrich?
options:
  a: El Consejo Cantonal (Kantonsrat)
  b: La dirección escolar
  c: El consejo de padres
  d: El Consejo de Gobierno (Regierungsrat)
explanation: Cada escuela pública del cantón de Zúrich tiene una dirección escolar, que dirige y organiza
  el funcionamiento directamente en el centro. El Consejo de Gobierno y el Consejo Cantonal trabajan a
  nivel del cantón. El consejo de padres presenta las inquietudes de los padres, pero no dirige la escuela.
