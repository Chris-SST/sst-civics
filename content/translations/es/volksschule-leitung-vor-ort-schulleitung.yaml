    question_de: Wer leitet eine Volksschule des Kantons Zürich direkt vor Ort im eigenen Schulhaus?
    options_de:
      a: Der Kantonsrat
      b: Die Schulleitung
      c: Der Elternrat
      d: Der Regierungsrat
    explanation_de: Jede Volksschule des Kantons Zürich hat eine Schulleitung, die den Betrieb direkt
      vor Ort leitet und organisiert. Der Regierungsrat und der Kantonsrat arbeiten auf kantonaler Ebene.
      Der Elternrat bringt die Anliegen der Eltern vor, leitet die Schule aber nicht.
