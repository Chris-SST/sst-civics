lang: es
source_version: 2
question: ¿Por qué es conocido principalmente Huldrych (Ulrich) Zwingli en la historia de Zúrich?
options:
  a: Construyó el primer ferrocarril del cantón.
  b: Fue el primer presidente de la Confederación (Bundespräsident) de Suiza.
  c: Introdujo el derecho de voto de las mujeres.
  d: Fue el líder de la Reforma en Zúrich.
explanation: Huldrych (Ulrich) Zwingli lideró la Reforma en Zúrich en el siglo XVI, y la Iglesia de Zúrich
  pasó a ser reformada. El ferrocarril, el Estado federal con un presidente de la Confederación y el derecho
  de voto de las mujeres llegaron solo siglos después.
