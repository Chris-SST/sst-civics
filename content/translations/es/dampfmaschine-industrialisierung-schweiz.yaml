id: dampfmaschine-industrialisierung-schweiz
lang: es
source_version: 2
question: ¿Qué invento marcó con fuerza la industrialización en Suiza en el siglo XIX?
options:
  a: El avión
  b: La máquina de vapor
  c: El ordenador
  d: La cadena de montaje
explanation: En el siglo XIX, la máquina de vapor adquirió importancia en Suiza. Hacía funcionar las máquinas
  en las fábricas y, más tarde, también los ferrocarriles, y cada vez más personas trabajaban en fábricas.
  El avión, la cadena de montaje y el ordenador no adquirieron importancia hasta el siglo XX.
