    question_de: Welche Erfindung prägte die Industrialisierung in der Schweiz im 19. Jahrhundert stark?
    options_de:
      a: Das Flugzeug
      b: Die Dampfmaschine
      c: Der Computer
      d: Das Fliessband
    explanation_de: Im 19. Jahrhundert gewann die Dampfmaschine in der Schweiz an Bedeutung. Sie trieb
