id: geografische-gliederung-der-schweiz
lang: es
source_version: 1
question: ¿En qué tres grandes regiones paisajísticas se divide Suiza geográficamente?
options:
  a: El Jura, la Meseta suiza y los Alpes
  b: El Jura, el lago de Constanza y los Alpes
  c: La Selva Negra, la Meseta suiza y los Alpes
  d: La Meseta suiza, los Prealpes y el Tesino
explanation: El Jura se encuentra en el noroeste y los Alpes ocupan la mayor parte de la superficie. Entre
  ambos se sitúa la Meseta suiza, donde vive la mayoría de la población.
