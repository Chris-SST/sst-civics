id: eidgenossenschaft-name-der-schweiz
lang: es
source_version: 1
question: ¿Qué nombre se utiliza también para Suiza en la Constitución Federal?
options:
  a: República Federal
  b: Eidgenossenschaft
  c: Confederación de los cantones
  d: Reino Confederado
explanation: El nombre oficial es «Confederación Suiza» (Schweizerische Eidgenossenschaft). La palabra
  Eidgenossenschaft designa, por lo tanto, a Suiza en su conjunto. Recuerda las alianzas que se sellaban
  mediante un juramento.
