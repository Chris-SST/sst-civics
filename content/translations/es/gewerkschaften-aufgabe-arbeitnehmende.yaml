id: gewerkschaften-aufgabe-arbeitnehmende
lang: es
source_version: 2
question: ¿Qué función tienen los sindicatos en Suiza?
options:
  a: Defienden las demandas de los trabajadores y las trabajadoras.
  b: Conceden a los extranjeros y las extranjeras el permiso para trabajar.
  c: Fijan los tipos impositivos para las empresas.
  d: Representan las demandas de los empleadores ante la Confederación.
explanation: Los sindicatos son organizaciones de los trabajadores y las trabajadoras. Representan sus
  intereses, por ejemplo en materia de salarios y condiciones de trabajo, y a menudo negocian convenios
  colectivos de trabajo con los empleadores. En cambio, los permisos de trabajo los expiden las autoridades,
  no los sindicatos.
