    question_de: Welche Funktion haben die Gewerkschaften in der Schweiz?
    options_de:
      a: Sie verteidigen die Forderungen der Arbeitnehmer und Arbeitnehmerinnen.
      b: Sie erteilen den Ausländern und Ausländerinnen die Erlaubnis zu arbeiten.
      c: Sie legen die Steuersätze für die Unternehmen fest.
      d: Sie vertreten die Forderungen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Die Gewerkschaften sind Organisationen der Arbeitnehmer und Arbeitnehmerinnen. Sie
      vertreten deren Interessen, zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln
      oft Gesamtarbeitsverträge mit den Arbeitgebern aus. Die Arbeitsbewilligungen hingegen werden von
      den Behörden ausgestellt, nicht von den Gewerkschaften.
