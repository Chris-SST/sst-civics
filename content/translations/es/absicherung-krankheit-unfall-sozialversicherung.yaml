question: ¿Contra qué riesgos protege, entre otros, el sistema de seguros sociales de Suiza?
options:
  a: Contra las pérdidas en inversiones financieras privadas
  b: Contra los daños al automóvil y al mobiliario del hogar por robo
  c: Contra las consecuencias de la enfermedad y del accidente
  d: Contra los aumentos de precio de los alquileres
explanation: Los seguros sociales protegen a las personas frente a las consecuencias económicas de importantes
  riesgos de la vida. Entre ellos se cuentan la enfermedad y el accidente. El seguro de enfermedad y el
  seguro de accidentes son ejemplos de ello.
