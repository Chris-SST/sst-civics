id: pfaeffikersee-im-kanton-zuerich
lang: es
source_version: 1
question: ¿En qué cantón se encuentra el lago de Pfäffikon (Pfäffikersee)?
options:
  a: Cantón de Turgovia
  b: Cantón de San Galo
  c: Cantón de Zúrich
  d: Cantón de Zug
explanation: El Pfäffikersee se encuentra en el Oberland zuriqués (Zürcher Oberland) y pertenece al territorio
  del cantón de Zúrich. Es uno de los lagos más grandes del cantón. Los otros cantones mencionados limitan
  en parte con Zúrich, pero no contienen el lago.
