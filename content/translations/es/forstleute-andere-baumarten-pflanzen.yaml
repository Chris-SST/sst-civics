id: forstleute-andere-baumarten-pflanzen
lang: es
source_version: 1
question: ¿Cómo reaccionan los silvicultores en Suiza ante el aumento de las temperaturas?
options:
  a: Plantan cada vez más otras especies de árboles.
  b: Solo plantan árboles que siempre han estado allí.
  c: Renuncian por completo al cuidado del bosque.
  d: Talan los bosques en las zonas de baja altitud.
explanation: Algunas especies de árboles toleran mal el calor y la sequía. Por eso, los silvicultores
  apuestan por otras especies que se adaptan mejor al clima más cálido. De este modo se pretende que el
  bosque se mantenga estable.
