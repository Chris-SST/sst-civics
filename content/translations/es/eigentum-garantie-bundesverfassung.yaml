id: eigentum-garantie-bundesverfassung
lang: es
source_version: 1
question: ¿Qué derecho fundamental protege en Suiza las casas, los terrenos y otros bienes patrimoniales
  de las personas privadas?
options:
  a: La garantía de la propiedad
  b: La libertad de creencia y de conciencia
  c: La libertad de establecimiento
  d: La libertad de reunión
explanation: La Constitución Federal garantiza la propiedad en el artículo 26. El Estado solo puede restringir
  la propiedad bajo determinadas condiciones, por ejemplo, con una base legal y con una indemnización
  completa en caso de expropiación.
