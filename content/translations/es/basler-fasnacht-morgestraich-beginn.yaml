    question_de: Was geschieht am Morgestraich, dem Beginn der Basler Fasnacht?
    options_de:
      a: Der Stadtpräsident übergibt der Fasnachtsgesellschaft den Schlüssel der Stadt.
      b: Die Gassen werden hell beleuchtet und ein Feuerwerk beginnt.
      c: Die Lichter der Gassen werden gelöscht und dann beginnen die Piccolos und die Trommeln zu spielen.
      d: Die Fasnachtsteilnehmer werfen Konfetti vom Turm des Münsters und lassen alle Kirchenglocken
        läuten.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch um vier Uhr morgens. Dann
      werden die Lichter der Gassen gelöscht. Danach beginnt die Musik der Piccolos und Trommeln.
