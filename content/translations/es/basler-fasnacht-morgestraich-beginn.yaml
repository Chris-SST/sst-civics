lang: es
source_version: 1
question: ¿Qué sucede en el Morgestraich, el comienzo del carnaval de Basilea?
options:
  a: El alcalde entrega la llave de la ciudad a la sociedad del carnaval.
  b: Las callejuelas se iluminan con intensidad y comienza un espectáculo de fuegos artificiales.
  c: Se apagan las luces de las callejuelas y luego empiezan a tocar los pífanos y los tambores.
  d: Los participantes del carnaval lanzan confeti desde la torre de la catedral y hacen sonar todas las
    campanas de las iglesias.
explanation: El Morgestraich comienza el lunes siguiente al Miércoles de Ceniza, a las cuatro de la madrugada.
  Entonces se apagan las luces de las callejuelas. Después empieza la música de pífanos y tambores.
