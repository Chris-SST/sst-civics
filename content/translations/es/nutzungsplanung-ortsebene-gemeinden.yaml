    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie der Boden genutzt wird, zum Beispiel
      wo sich die Wohnzonen und die Gewerbezonen befinden?
    options_de:
      a: Die Bundesversammlung der Schweiz
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Nur die Bezirksräte
    explanation_de: Die Gemeinden erarbeiten die Nutzungsplanung für ihr Gebiet, zum Beispiel die Bau-
      und Zonenordnung. Dabei berücksichtigen sie die Vorgaben des Bundes und des Kantons. So wirken sie
      mit, zu entscheiden, wie sich der Ort entwickelt.
