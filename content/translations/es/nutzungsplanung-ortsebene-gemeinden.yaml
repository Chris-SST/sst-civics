id: nutzungsplanung-ortsebene-gemeinden
lang: es
source_version: 1
question: ¿Quién planifica en el cantón de Zúrich, a nivel local, cómo se utiliza el suelo, por ejemplo
  dónde se encuentran las zonas residenciales y las zonas comerciales?
options:
  a: La Asamblea Federal (Bundesversammlung) de Suiza
  b: La policía cantonal
  c: Los municipios (Gemeinden)
  d: Solo los consejos de distrito
explanation: Los municipios elaboran la planificación del uso del suelo para su territorio, por ejemplo
  el reglamento de construcción y zonificación. Para ello tienen en cuenta las disposiciones de la Confederación
  y del cantón. Así participan en decidir cómo se desarrolla la localidad.
