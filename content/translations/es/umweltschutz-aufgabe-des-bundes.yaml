id: umweltschutz-aufgabe-des-bundes
lang: es
source_version: 1
question: ¿Qué nivel es responsable en Suiza de proteger el medio ambiente y de dictar las normas correspondientes?
options:
  a: La Confederación
  b: Las organizaciones privadas
  c: Únicamente los municipios (Gemeinden)
  d: Únicamente los distritos
explanation: La Constitución Federal encarga a la Confederación proteger a las personas y al medio ambiente
  frente a los efectos nocivos. Para ello dicta leyes, por ejemplo sobre la protección de las aguas y
  de la naturaleza. Los cantones aplican muchas de estas normas.
