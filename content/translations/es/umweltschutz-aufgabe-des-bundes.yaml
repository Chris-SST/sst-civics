    question_de: Welche Ebene ist in der Schweiz dafür verantwortlich, die Umwelt zu schützen und die
      entsprechenden Vorschriften zu erlassen?
    options_de:
      a: Der Bund
      b: Die privaten Organisationen
      c: Ausschliesslich die Gemeinden
      d: Ausschliesslich die Bezirke
    explanation_de: Die Bundesverfassung beauftragt den Bund, den Menschen und die Umwelt vor schädlichen
