id: grenzgaenger-definition-wohnort-arbeitsort
lang: es
source_version: 2
question: ¿Quién se considera trabajador transfronterizo o trabajadora transfronteriza en Suiza?
options:
  a: Una persona que trabaja en Suiza, pero tiene su domicilio en el extranjero y regresa allí con regularidad
  b: Una persona que trabaja en la aduana y controla la frontera nacional
  c: Una persona que cruza la frontera sin permiso para trabajar aquí
  d: Una persona que vive en un cantón y trabaja cada día en otro cantón
explanation: Los trabajadores transfronterizos y las trabajadoras transfronterizas tienen su puesto de
  trabajo en Suiza, pero viven en otro país. Necesitan un permiso de trabajador transfronterizo y regresan
  con regularidad, al menos una vez por semana, a su lugar de residencia en el extranjero. Quien solo
  se desplaza entre dos cantones no es un trabajador transfronterizo.
