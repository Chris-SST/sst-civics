id: juengster-kanton-der-schweiz
lang: es
source_version: 1
question: ¿Cuál es el cantón más joven de Suiza?
options:
  a: Jura
  b: Appenzell Ausserrhoden
  c: Basilea-Campiña
  d: Neuchâtel
explanation: El cantón del Jura fue fundado en 1979. Se separó del cantón de Berna y es, desde entonces,
  el más joven de los 26 cantones. La Constitución Federal lo menciona entre los cantones de la Confederación
  Suiza.
