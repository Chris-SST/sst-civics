id: vereinsgruendung-offen-fuer-jede-person
lang: es
source_version: 1
question: ¿Quién puede fundar una asociación en Suiza?
options:
  a: Solo las personas que tienen su domicilio en el municipio (Gemeinde)
  b: Cualquier persona
  c: Solo los ciudadanos suizos
  d: Solo las personas con un permiso de establecimiento (permiso C) (Niederlassungsbewilligung)
explanation: La fundación de una asociación está abierta a cualquier persona en Suiza. La libertad de
  asociación está garantizada en la Constitución Federal. La nacionalidad o el estatus de residencia no
  tienen ninguna importancia a este respecto.
