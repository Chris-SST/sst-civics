    question_de: Wer kann in der Schweiz einen Verein gründen?
    options_de:
      a: Nur die Personen, die ihren Wohnsitz in der Gemeinde haben
      b: Jede Person
      c: Nur die Schweizer Bürger
      d: Nur die Personen mit einer Niederlassungsbewilligung (Bewilligung C)
    explanation_de: Die Gründung eines Vereins steht in der Schweiz jeder Person offen. Die Vereinigungsfreiheit
      ist in der Bundesverfassung garantiert. Die Staatsangehörigkeit oder der Aufenthaltsstatus haben
      dabei keinerlei Bedeutung.
