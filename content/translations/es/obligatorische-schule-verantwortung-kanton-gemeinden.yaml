    question_de: Wer trägt hauptsächlich die Verantwortung für die öffentliche obligatorische Schule in
      der Schweiz?
    options_de:
      a: Die Schulleitungen und die Eltern
      b: Nur der Bund
      c: Die Bezirke und die Kirchen
      d: Die Kantone und die Gemeinden
    explanation_de: Die öffentliche obligatorische Schule liegt in der Zuständigkeit der Kantone und der
      Gemeinden. Der Kanton legt den allgemeinen Rahmen fest und die Gemeinden führen die Schulen auf
      lokaler Ebene. Der Bund spielt in der obligatorischen Schule nur eine untergeordnete Rolle.
