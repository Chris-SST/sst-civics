id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: es
source_version: 1
question: ¿Quién asume principalmente la responsabilidad de la escuela pública obligatoria en Suiza?
options:
  a: Las direcciones escolares y los padres
  b: Solo la Confederación
  c: Los distritos y las iglesias
  d: Los cantones y los municipios (Gemeinden)
explanation: La escuela obligatoria pública es competencia de los cantones y de los municipios. El cantón
  establece el marco general y los municipios gestionan las escuelas a nivel local. La Confederación desempeña
  solo un papel menor en la escuela obligatoria.
