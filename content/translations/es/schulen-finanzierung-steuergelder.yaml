question: ¿De dónde proviene principalmente el dinero para pagar las escuelas públicas en Suiza?
options:
  a: De las tasas escolares que los padres pagan cada mes
  b: De los ingresos fiscales del cantón y de los municipios (Gemeinden)
  c: De los ingresos de Correos y de los SBB
  d: De las contribuciones de las aseguradoras de salud (Krankenkassen)
explanation: Según la Constitución Federal, la escuela pública obligatoria es gratuita. Se financia con
  ingresos fiscales, sobre todo de los cantones y de los municipios.
