    question_de: Woher stammt das Geld für die Bezahlung der öffentlichen Schulen in der Schweiz hauptsächlich?
    options_de:
      a: Aus den Schulgebühren, die die Eltern jeden Monat bezahlen
      b: Aus den Steuereinnahmen des Kantons und der Gemeinden
      c: Aus den Einnahmen der Post und der SBB
      d: Aus den Beiträgen der Krankenkassen
    explanation_de: Gemäss der Bundesverfassung ist die obligatorische öffentliche Schule unentgeltlich.
      Sie wird durch Steuereinnahmen finanziert, vor allem der Kantone und der Gemeinden.
