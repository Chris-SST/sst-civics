id: kindererziehung-verantwortung-eltern
lang: es
source_version: 1
question: ¿Quién es el principal responsable de la educación de los niños en Suiza?
options:
  a: El municipio (Gemeinde)
  b: Los padres
  c: La escuela
  d: El cantón
explanation: Según el Código Civil, los padres velan por el bienestar del niño y dirigen su educación.
  La escuela complementa esta tarea con la instrucción. El Estado solo interviene cuando el bienestar
  del niño está en peligro.
