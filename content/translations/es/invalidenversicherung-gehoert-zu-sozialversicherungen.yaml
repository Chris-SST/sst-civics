id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: es
source_version: 1
question: ¿Cuál de las siguientes instituciones forma parte de los seguros sociales de Suiza?
options:
  a: El seguro de invalidez (Invalidenversicherung)
  b: El seguro de viaje
  c: El seguro de protección jurídica
  d: El seguro del hogar
explanation: El seguro de invalidez (IV) es un seguro social regulado por el Estado. Apoya a las personas
  que, debido a una enfermedad o a un accidente, no pueden trabajar o solo pueden hacerlo de forma limitada.
  Los seguros del hogar, de viaje y de protección jurídica son seguros privados.
