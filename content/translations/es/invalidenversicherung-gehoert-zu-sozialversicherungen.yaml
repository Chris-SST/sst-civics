    question_de: Welche der folgenden Einrichtungen gehört zu den Sozialversicherungen der Schweiz?
    options_de:
      a: Die Invalidenversicherung
      b: Die Reiseversicherung
      c: Die Rechtsschutzversicherung
      d: Die Hausratversicherung
    explanation_de: Die Invalidenversicherung (IV) ist eine vom Staat geregelte Sozialversicherung. Sie
      unterstützt Personen, die wegen einer Krankheit oder eines Unfalls nicht arbeiten können oder nur
      eingeschränkt arbeiten können. Die Hausrat-, die Reise- und die Rechtsschutzversicherung sind private
      Versicherungen.
