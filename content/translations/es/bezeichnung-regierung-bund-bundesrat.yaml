id: bezeichnung-regierung-bund-bundesrat
lang: es
source_version: 1
question: ¿Cómo se llama el gobierno de Suiza a nivel federal?
options:
  a: Asamblea Federal (Bundesversammlung)
  b: Consejo Federal (Bundesrat)
  c: Cancillería Federal (Bundeskanzlei)
  d: Tribunal Federal (Bundesgericht)
explanation: El gobierno de la Confederación se llama Consejo Federal. La Asamblea Federal es el parlamento,
  el Tribunal Federal es el tribunal supremo. La Cancillería Federal apoya al Consejo Federal.
