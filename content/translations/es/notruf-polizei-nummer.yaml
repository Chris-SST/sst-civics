id: notruf-polizei-nummer
lang: es
source_version: 1
question: ¿Qué número de teléfono se marca en Suiza cuando se necesita a la policía en caso de emergencia?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: A la policía se puede llamar en toda Suiza al número 117. Los bomberos tienen el 118 y los
  servicios sanitarios de urgencia, el 144. El 143 es el número de la Mano Tendida (Dargebotene Hand),
  destinado a personas en situación de crisis.
