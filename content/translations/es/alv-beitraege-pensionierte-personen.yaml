id: alv-beitraege-pensionierte-personen
lang: es
source_version: 1
question: ¿Quién deja de tener que pagar cotizaciones al seguro de desempleo (ALV) en Suiza?
options:
  a: Las personas con una relación laboral de duración indefinida
  b: Las personas que han alcanzado la edad ordinaria de jubilación del seguro de vejez y supervivencia
    (AHV)
  c: Las personas que trabajan a tiempo parcial
  d: Las personas que no han estado nunca en situación de desempleo en los últimos dos años
explanation: La obligación de cotizar al seguro de desempleo termina al alcanzar la edad de jubilación
  del AVS. Quien está jubilado ya no paga cotizaciones a la ALV sobre un posible salario. En cambio, los
  empleados a tiempo parcial y a tiempo completo sí pagan cotizaciones.
