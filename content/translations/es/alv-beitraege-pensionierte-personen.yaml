    question_de: Wer muss in der Schweiz keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen mit einem unbefristeten Arbeitsverhältnis
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die in Teilzeit arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Beitragspflicht zur Arbeitslosenversicherung endet mit dem Erreichen des AHV-Rentenalters.
      Wer pensioniert ist, bezahlt auf einen allfälligen Lohn keine Beiträge mehr an die ALV. Dagegen
      bezahlen Teilzeitangestellte und Vollzeitangestellte sehr wohl Beiträge.
