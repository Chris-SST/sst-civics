id: beschimpfung-wegen-glauben-verboten
lang: es
source_version: 1
question: Una persona insulta públicamente a otras personas por sus creencias o por su origen. ¿Cómo está
  regulado esto en Suiza?
options:
  a: Solo está prohibido en las escuelas y en las empresas.
  b: Está prohibido y puede ser sancionado penalmente.
  c: Solo está prohibido si aparece en el periódico.
  d: Siempre está protegido por la libertad de expresión.
explanation: El Código Penal prohíbe la discriminación pública de personas por motivo de su raza, etnia,
  religión u orientación sexual. La libertad de expresión no es ilimitada.
