id: obligatorisches-referendum-verfassungsaenderung
lang: es
source_version: 1
question: ¿Sobre qué proyecto se debe votar siempre en Suiza, incluso si no se recogen firmas?
options:
  a: Sobre cada nueva ley federal
  b: Sobre cada modificación de la Constitución Federal
  c: Sobre cada ordenanza del Consejo Federal (Bundesrat)
  d: Sobre cada presupuesto de la Confederación
explanation: Toda modificación de la Constitución Federal debe someterse obligatoriamente al pueblo y
  a los cantones. Esto se llama referéndum obligatorio. Las leyes federales solo están sujetas al referéndum
  facultativo.
