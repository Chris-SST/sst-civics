lang: es
source_version: 1
question: ¿Cuál de los siguientes seguros es obligatorio por ley en Suiza para todos los habitantes?
options:
  a: El seguro de protección jurídica
  b: El seguro de enfermedad
  c: El seguro de viaje
  d: El seguro de hogar
explanation: El seguro de enfermedad es obligatorio para todas las personas con domicilio en Suiza. Los
  seguros de hogar, de protección jurídica y de viaje son voluntarios.
