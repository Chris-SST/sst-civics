id: volksinitiative-sammelfrist-monate
lang: es
source_version: 1
question: ¿De cuánto tiempo disponen las personas que promueven una iniciativa popular (Volksinitiative)
  federal para recoger las firmas?
options:
  a: 6 meses
  b: 12 meses
  c: 18 meses
  d: 36 meses
explanation: El plazo para recoger las firmas es de 18 meses a partir de la publicación en la Hoja Federal
  (Bundesblatt). Si en ese tiempo no logran reunir las 100 000 firmas necesarias, la iniciativa no prospera.
