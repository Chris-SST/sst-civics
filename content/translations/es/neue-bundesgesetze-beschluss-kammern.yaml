id: neue-bundesgesetze-beschluss-kammern
lang: es
source_version: 1
question: ¿Quién aprueba la mayoría de las nuevas leyes federales?
options:
  a: El Tribunal Federal (Bundesgericht)
  b: El Consejo Federal (Bundesrat) por sí solo
  c: Los parlamentos cantonales
  d: El Consejo Nacional (Nationalrat) y el Consejo de los Estados (Ständerat)
explanation: La mayoría de las nuevas leyes federales son aprobadas por las dos cámaras del Parlamento.
  El Consejo Federal prepara los proyectos, pero no decide por sí solo. El pueblo puede interponer un
  referéndum contra una ley.
