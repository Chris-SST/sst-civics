id: bundesgesetz-referendum-volksmehr-genuegt
lang: es
source_version: 1
question: Se ha interpuesto un referéndum facultativo contra una nueva ley federal. ¿Qué se necesita para
  que la ley sea aprobada en la votación popular?
options:
  a: La mayoría de los votantes en toda Suiza
  b: Una mayoría de dos tercios de los votantes
  c: La mayoría de los cantones únicamente
  d: La mayoría de los votantes y la mayoría de los cantones
explanation: En un referéndum facultativo contra una ley federal, solo cuenta la mayoría del pueblo (Volksmehr),
  es decir, la mayoría de los votos válidos en toda Suiza. La mayoría de los cantones (Ständemehr) solo
  se exige además en el caso de modificaciones de la Constitución Federal y de determinados tratados internacionales.
