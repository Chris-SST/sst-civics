id: arbeitsvertrag-inhalt-lohnhoehe
lang: es
source_version: 1
question: ¿Qué se establece, entre otras cosas, en el contrato de trabajo entre el empleador y la empleada?
options:
  a: El importe del salario
  b: El importe de la pensión del seguro de vejez y supervivencia (AHV)
  c: El importe del impuesto sobre el valor añadido
  d: El importe de la prima de la aseguradora de salud (Krankenkasse)
explanation: En el contrato de trabajo se acuerdan las condiciones más importantes del trabajo, por ejemplo
  la actividad, el horario de trabajo y el salario. La pensión del seguro de vejez y supervivencia, el
  impuesto sobre el valor añadido y la prima de la aseguradora de salud no se determinan en el contrato
  de trabajo.
