    question_de: Wer gibt den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative
      eine Empfehlung ab, ob sie die Initiative annehmen oder ablehnen sollen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Regierungen der Kantone
      c: Die Bundeskanzlei allein
      d: Das Bundesgericht
    explanation_de: Sobald eine Volksinitiative zustande gekommen ist, nehmen der Bundesrat und das Parlament
      dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten, sie anzunehmen oder abzulehnen. Diese
      Empfehlung steht auch in den Abstimmungserläuterungen, welche die Stimmberechtigten vor der Abstimmung
      erhalten.
