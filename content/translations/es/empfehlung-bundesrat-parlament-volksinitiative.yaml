id: empfehlung-bundesrat-parlament-volksinitiative
lang: es
source_version: 1
question: ¿Quién emite una recomendación a las personas con derecho a voto, antes de la votación sobre
  una iniciativa popular (Volksinitiative) federal, sobre si deben aceptar o rechazar la iniciativa?
options:
  a: El Consejo Federal (Bundesrat) y el Parlamento
  b: Los gobiernos de los cantones
  c: La Cancillería Federal (Bundeskanzlei) por sí sola
  d: El Tribunal Federal (Bundesgericht)
explanation: Una vez que una iniciativa popular se ha formalizado, el Consejo Federal y el Parlamento
  toman posición al respecto. El Parlamento recomienda a las personas con derecho a voto que la acepten
  o la rechacen. Esta recomendación figura también en las explicaciones de voto que las personas con derecho
  a voto reciben antes de la votación.
