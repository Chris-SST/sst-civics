id: zeitung-inhalte-bestimmt-redaktion
lang: es
source_version: 1
question: ¿Quién decide en Suiza qué contenidos se publican en un periódico?
options:
  a: El Tribunal Federal (Bundesgericht)
  b: El municipio (Gemeinde) en el que se publica el periódico
  c: La redacción del periódico
  d: El Consejo Federal (Bundesrat)
explanation: La libertad de los medios de comunicación protege a los periódicos frente a la injerencia
  del Estado. La redacción decide por sí misma qué publica. La Constitución Federal prohíbe la censura.
