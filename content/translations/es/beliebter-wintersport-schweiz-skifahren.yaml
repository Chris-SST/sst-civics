question: ¿Qué deporte practican especialmente muchas personas en Suiza en invierno?
options:
  a: Waterpolo
  b: Esquí
  c: Remo
  d: Vóley playa
explanation: El esquí es muy popular en Suiza en invierno, y mucha gente esquía en las montañas. A menudo
  los niños ya aprenden a esquiar, por ejemplo en un campamento de esquí de la escuela. El waterpolo,
  el remo y el vóley playa, en cambio, son deportes que se practican sobre todo en verano o en el agua.
