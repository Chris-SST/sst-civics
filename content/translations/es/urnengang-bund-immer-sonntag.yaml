id: urnengang-bund-immer-sonntag
lang: es
source_version: 1
question: ¿En qué día de la semana se celebran en Suiza las votaciones y elecciones federales?
options:
  a: Siempre en domingo
  b: Siempre en sábado
  c: Siempre en viernes
  d: En un día de la semana que cada cantón elige por sí mismo
explanation: Las votaciones en las urnas a nivel de la Confederación se celebran siempre en domingo. Así
  pueden participar el mayor número posible de personas con derecho a voto, y la fecha es la misma para
  todos.
