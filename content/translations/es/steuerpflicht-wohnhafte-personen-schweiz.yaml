id: steuerpflicht-wohnhafte-personen-schweiz
lang: es
source_version: 1
question: ¿Quién está obligado en principio a pagar impuestos en Suiza?
options:
  a: Las personas que residen en Suiza
  b: Solo las personas que dirigen una empresa
  c: Solo las personas con ciudadanía suiza (Bürgerrecht)
  d: Solo las personas que tienen derecho de voto
explanation: La obligación tributaria depende del domicilio y no de la ciudadanía. Los extranjeros y las
  extranjeras que residen en Suiza también pagan impuestos. El derecho de voto no tiene ninguna importancia
  en este caso.
