    question_de: Wer ist in der Schweiz grundsätzlich steuerpflichtig?
    options_de:
      a: Die Personen, die in der Schweiz wohnen
      b: Nur die Personen, die ein Unternehmen führen
      c: Nur die Personen mit Schweizer Bürgerrecht
      d: Nur die Personen, die das Stimmrecht haben
    explanation_de: Die Steuerpflicht hängt vom Wohnsitz ab und nicht vom Bürgerrecht. Auch Ausländer
      und Ausländerinnen, die in der Schweiz wohnen, zahlen Steuern. Das Stimmrecht spielt in diesem Fall
      keine Rolle.
