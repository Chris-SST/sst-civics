id: dienstpflicht-nur-maenner-bis-alter
lang: es
source_version: 1
question: ¿Quién está obligado en Suiza a prestar servicio militar o servicio civil sustitutorio hasta
  una determinada edad?
options:
  a: Solo los hombres
  b: Las mujeres y los hombres por igual
  c: Solo las personas con una formación
  d: Solo las personas que ocupan un cargo en un municipio (Gemeinde)
explanation: En Suiza, la obligación de prestar servicio solo rige para los hombres. Para las mujeres,
  el servicio militar es voluntario. La obligación dura hasta una edad fijada por la ley.
