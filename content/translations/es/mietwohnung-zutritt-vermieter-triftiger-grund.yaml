    question_de: In welchem Fall müssen die Mieter der Vermieterseite den Zutritt zur Wohnung gewähren?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein berechtigter Grund vorliegt
      c: Nur wenn der Vermieter es verlangt, ohne jeden Grund
      d: Jederzeit und ohne Vorankündigung
    explanation_de: Die Mieter müssen den Zutritt gewähren, wenn ein berechtigter Grund dafür vorliegt,
      zum Beispiel eine dringende Reparatur. Die Vermieterseite muss den Besuch jedoch rechtzeitig ankündigen
      und auf die Mieter Rücksicht nehmen. Der Zutritt ohne Grund ist nicht erlaubt.
