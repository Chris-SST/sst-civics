id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: es
source_version: 1
question: ¿En qué caso deben los inquilinos permitir el acceso a la vivienda a la parte arrendadora?
options:
  a: Nunca, la vivienda está siempre protegida
  b: Cuando existe un motivo justificado
  c: Solo cuando el arrendador lo exige, sin motivo alguno
  d: En cualquier momento y sin previo aviso
explanation: Los inquilinos deben permitir el acceso cuando existe un motivo justificado para ello, por
  ejemplo, una reparación urgente. Sin embargo, la parte arrendadora debe anunciar la visita con la debida
  antelación y tener consideración con los inquilinos. No se permite el acceso sin motivo.
