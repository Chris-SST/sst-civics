id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: es
source_version: 1
question: ¿Qué significa la neutralidad de Suiza en los conflictos armados entre otros Estados?
options:
  a: Suiza envía tropas para el mantenimiento de la paz a cualquier zona de guerra.
  b: Suiza rompe todas las relaciones con los Estados implicados.
  c: Suiza no toma partido por ninguna de las partes en conflicto.
  d: Suiza apoya siempre al bando más débil.
explanation: Neutralidad significa que Suiza no se pone del lado de ninguna parte beligerante. De este
  modo permanece al margen de los conflictos de otros Estados. Esto no excluye el diálogo ni la ayuda
  humanitaria.
