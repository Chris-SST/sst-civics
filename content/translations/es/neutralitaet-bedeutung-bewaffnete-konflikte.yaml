    question_de: Was bedeutet die Neutralität der Schweiz in bewaffneten Konflikten zwischen anderen Staaten?
    options_de:
      a: Die Schweiz schickt Truppen zur Friedenssicherung in jedes Kriegsgebiet.
      b: Die Schweiz bricht alle Beziehungen zu den beteiligten Staaten ab.
      c: Die Schweiz ergreift für keine der Konfliktparteien Partei.
      d: Die Schweiz unterstützt immer die schwächere Seite.
    explanation_de: Neutralität bedeutet, dass sich die Schweiz auf die Seite keiner kriegführenden Partei
      stellt. Auf diese Weise bleibt sie den Konflikten anderer Staaten fern. Dies schliesst weder den
      Dialog noch die humanitäre Hilfe aus.
