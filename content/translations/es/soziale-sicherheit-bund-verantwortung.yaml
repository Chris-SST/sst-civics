    question_de: Welche Staatsebene ist in der Schweiz dafür verantwortlich, den sozialen Schutz der Bevölkerung
      zu gewährleisten, zum Beispiel durch die Altersvorsorge?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Der Bund
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung weist dem Bund wichtige Aufgaben der sozialen Sicherheit zu.
      Dazu gehören zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung.
      So gelten einheitliche Grundlagen für die ganze Schweiz.
