id: soziale-sicherheit-bund-verantwortung
lang: es
source_version: 1
question: ¿Qué nivel del Estado es responsable en Suiza de garantizar la protección social de la población,
  por ejemplo mediante la previsión para la vejez?
options:
  a: Los distritos
  b: Solo los municipios (Gemeinden)
  c: La Confederación
  d: Solo los cantones
explanation: La Constitución Federal asigna a la Confederación importantes tareas de seguridad social.
  Entre ellas figuran, por ejemplo, el seguro de vejez y supervivencia (AVS) y el seguro de invalidez.
  Así, rigen bases uniformes para toda Suiza.
