id: bundesrat-ist-regierung-der-schweiz
lang: es
source_version: 1
question: ¿Qué función tiene el Consejo Federal (Bundesrat) en Suiza?
options:
  a: Es el gobierno de Suiza.
  b: Es el tribunal supremo del país.
  c: Es el parlamento de la Confederación.
  d: Es la representación de los cantones.
explanation: El Consejo Federal es la máxima autoridad directiva y ejecutiva de la Confederación, es decir,
  el gobierno. Tiene siete miembros. El parlamento y el Tribunal Federal (Bundesgericht) son otros poderes.
