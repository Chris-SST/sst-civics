id: obligationenrecht-miete-wohnraum-vorschriften
lang: es
source_version: 2
question: ¿En qué ley están establecidas las normas sobre el alquiler de una vivienda?
options:
  a: En el Código de las Obligaciones
  b: En la Ley del Trabajo
  c: En el Código Penal
  d: En la Ley de Tráfico Vial
explanation: Las normas sobre el alquiler de viviendas se encuentran en el Código de las Obligaciones
  (OR). Allí se establece, por ejemplo, qué se aplica en el contrato de alquiler, hasta qué importe puede
  llegar el alquiler y cómo se puede rescindir el contrato. El Código Civil (ZGB), en cambio, regula sobre
  todo temas como la familia, el matrimonio y la herencia.
