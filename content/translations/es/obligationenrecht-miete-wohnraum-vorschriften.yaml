    question_de: In welchem Gesetz sind die Regeln über die Miete einer Wohnung festgelegt?
    options_de:
      a: Im Obligationenrecht
      b: Im Arbeitsgesetz
      c: Im Strafgesetzbuch
      d: Im Strassenverkehrsgesetz
    explanation_de: Die Regeln über die Miete von Wohnungen finden sich im Obligationenrecht (OR). Dort
      ist zum Beispiel festgelegt, was im Mietvertrag gilt, bis zu welchem Betrag die Miete gehen darf
      und wie der Vertrag gekündigt werden kann. Das Zivilgesetzbuch (ZGB) hingegen regelt vor allem Themen
      wie Familie, Ehe und Erbschaft.
