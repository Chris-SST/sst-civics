id: bag-zustaendig-gesundheitsfragen-bund
lang: es
source_version: 1
question: ¿Qué autoridad de la Confederación es competente en materia de salud?
options:
  a: La Oficina Federal de Medio Ambiente (BAFU)
  b: La Secretaría de Estado de Migración (SEM)
  c: La Oficina Federal de Estadística (BFS)
  d: La Oficina Federal de Salud Pública (BAG)
explanation: La Oficina Federal de Salud Pública (BAG) es la autoridad de la Confederación competente
  en materia de salud. Supervisa, por ejemplo, el seguro social de enfermedad.
