id: rechtsstaat-keine-festnahme-ohne-grund
lang: es
source_version: 1
question: ¿Qué rige en un Estado de derecho en materia de detención y prisión?
options:
  a: El Estado no puede detener ni encarcelar a nadie sin motivo.
  b: El Estado puede retener a las personas según su propio criterio.
  c: El Gobierno puede encarcelar preventivamente a sus críticos.
  d: Solo los extranjeros y las extranjeras pueden ser detenidos sin motivo.
explanation: En un Estado de derecho, la actuación del Estado está sujeta al derecho. Una detención o
  una privación de libertad requiere un motivo previsto por la ley. Esto protege la libertad de las personas
  frente a la arbitrariedad.
