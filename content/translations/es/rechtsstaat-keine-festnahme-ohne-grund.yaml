    question_de: Was gilt in einem Rechtsstaat in Bezug auf Festnahme und Haft?
    options_de:
      a: Der Staat darf niemanden ohne Grund festnehmen oder inhaftieren.
      b: Der Staat darf Personen nach eigenem Ermessen festhalten.
      c: Die Regierung darf ihre Kritiker vorsorglich inhaftieren.
      d: Nur Ausländer und Ausländerinnen dürfen ohne Grund festgenommen werden.
    explanation_de: In einem Rechtsstaat ist das Handeln des Staates an das Recht gebunden. Eine Festnahme
      oder ein Freiheitsentzug erfordert einen vom Gesetz vorgesehenen Grund. Dies schützt die Freiheit
      der Menschen vor Willkür.
