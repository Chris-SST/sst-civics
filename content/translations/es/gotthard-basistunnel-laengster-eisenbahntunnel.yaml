question: ¿Qué distingue al túnel de base del Gotthard en comparación con el resto del mundo?
options:
  a: Es el túnel ferroviario más largo del mundo.
  b: Es el túnel ferroviario situado a mayor altitud del mundo.
  c: Es el túnel de carretera más largo del mundo.
  d: Es el túnel ferroviario más antiguo de Europa.
explanation: El túnel de base del Gotthard es el túnel ferroviario más largo del mundo. Conecta el norte
