id: bund-spitze-dreistufiger-staatsaufbau
lang: es
source_version: 2
question: Suiza está organizada en tres niveles estatales. ¿Cuál es el nivel superior?
options:
  a: Los municipios (Gemeinden)
  b: La Confederación
  c: Los cantones
  d: Los distritos
explanation: La Confederación es el nivel superior de los tres niveles estatales. Por debajo están los
  cantones y después los municipios. Los distritos no son un nivel estatal propio, sino que en algunos
  cantones son únicamente unidades administrativas dentro del cantón.
