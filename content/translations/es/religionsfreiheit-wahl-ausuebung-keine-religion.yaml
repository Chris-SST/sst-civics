id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: es
source_version: 1
question: Una mujer se traslada a Suiza y quiere elegir ella misma su religión. También se plantea no
  pertenecer a ninguna religión. ¿Qué le garantiza la Constitución Federal en este contexto?
options:
  a: Solo puede pertenecer a una religión que esté reconocida de derecho público en el cantón.
  b: Puede elegir libremente su religión, practicarla o no pertenecer a ninguna religión.
  c: Puede elegir su religión en privado, pero no puede practicarla en ningún lugar junto con otras personas.
  d: Debe decidirse en el municipio (Gemeinde) por una religión reconocida.
explanation: La libertad de creencia y de conciencia está garantizada en el artículo 15 de la Constitución
  Federal. Toda persona puede elegir libremente su religión, practicarla sola o con otras personas, o
  no pertenecer a ninguna religión. Nadie puede ser obligado a pertenecer a una comunidad religiosa.
