    question_de: Eine Frau zieht in die Schweiz und möchte ihre Religion selbst wählen. Sie erwägt auch,
      keiner Religion anzugehören. Was garantiert ihr die Bundesverfassung in diesem Zusammenhang?
    options_de:
      a: Sie kann nur einer Religion angehören, die im Kanton öffentlich-rechtlich anerkannt ist.
      b: Sie kann ihre Religion frei wählen, sie ausüben oder keiner Religion angehören.
      c: Sie kann ihre Religion privat wählen, darf sie aber nirgends gemeinsam mit anderen Personen ausüben.
      d: Sie muss sich in der Gemeinde für eine anerkannte Religion entscheiden.
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung garantiert.
      Jede Person kann ihre Religion frei wählen, sie allein oder mit anderen Personen ausüben oder keiner
      Religion angehören. Niemand kann gezwungen werden, einer Religionsgemeinschaft anzugehören.
