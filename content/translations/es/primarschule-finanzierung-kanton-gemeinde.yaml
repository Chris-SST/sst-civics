id: primarschule-finanzierung-kanton-gemeinde
lang: es
source_version: 1
question: ¿Quién financia y organiza la escuela primaria en el cantón de Zúrich?
options:
  a: Solo las Kirchgemeinden (municipios eclesiásticos)
  b: Solo los padres de los alumnos
  c: Solo la Confederación
  d: El cantón y los municipios (Gemeinden) conjuntamente
explanation: La escuela obligatoria (Volksschule) en el cantón de Zúrich es una tarea compartida entre
  el cantón y los municipios. El cantón establece las bases y los municipios dirigen las escuelas en el
  lugar.
