id: strafgesetzbuch-haftstrafe-entscheid
lang: es
source_version: 1
question: ¿Según qué ley se determina si una persona debe cumplir una pena de prisión?
options:
  a: Según el Código Civil
  b: Según el Código de las Obligaciones
  c: Según el derecho de arrendamiento
  d: Según el Código Penal
explanation: El Código Penal establece qué actos son punibles y qué penas pueden imponerse por ellos.
  Entre ellas se incluyen las penas pecuniarias y las penas privativas de libertad. La pena en cada caso
  concreto la decide un tribunal.
