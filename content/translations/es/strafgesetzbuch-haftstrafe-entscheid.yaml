    question_de: Nach welchem Gesetz wird bestimmt, ob eine Person eine Freiheitsstrafe verbüssen muss?
    options_de:
      a: Nach dem Zivilgesetzbuch
      b: Nach dem Obligationenrecht
      c: Nach dem Mietrecht
      d: Nach dem Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch legt fest, welche Handlungen strafbar sind und welche Strafen
