id: flughafen-zuerich-standort-gemeinde
lang: es
source_version: 2
question: ¿En el territorio de cuál de estos municipios (Gemeinden) se encuentra el aeropuerto de Zúrich?
options:
  a: Winterthur
  b: Kloten
  c: Uster
  d: Dübendorf
explanation: El aeropuerto de Zúrich se encuentra en su mayor parte en el territorio de la ciudad de Kloten,
  en el Zürcher Unterland (la parte baja del cantón de Zúrich). Por eso mucha gente también dice «aeropuerto
  de Kloten». En Dübendorf hay otro aeródromo.
