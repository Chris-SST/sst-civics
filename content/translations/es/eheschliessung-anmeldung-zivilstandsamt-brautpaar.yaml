id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: es
source_version: 1
question: ¿Quién comunica al Registro Civil el matrimonio previsto?
options:
  a: Los testigos de la boda en nombre de la pareja
  b: Los novios conjuntamente
  c: La oficina de registro de habitantes del municipio de residencia, de forma automática
  d: Los padres de la novia o del novio
explanation: Los novios presentan conjuntamente ante el Registro Civil la solicitud para que se lleve
  a cabo el procedimiento preparatorio del matrimonio. Otras personas no pueden hacerlo en su lugar. Después,
  la oficina examina los requisitos del matrimonio.
