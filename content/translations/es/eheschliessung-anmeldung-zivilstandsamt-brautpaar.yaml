    question_de: Wer meldet dem Zivilstandsamt die geplante Eheschliessung?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Das Brautpaar gemeinsam
      c: Das Einwohnerkontrollamt der Wohngemeinde, automatisch
      d: Die Eltern der Braut oder des Bräutigams
    explanation_de: Das Brautpaar reicht beim Zivilstandsamt gemeinsam das Gesuch ein, damit das Vorbereitungsverfahren
      der Eheschliessung durchgeführt wird. Andere Personen können dies nicht an ihrer Stelle tun. Danach
      prüft das Amt die Voraussetzungen der Eheschliessung.
