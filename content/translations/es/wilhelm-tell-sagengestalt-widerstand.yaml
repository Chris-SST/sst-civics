    question_de: Wofür steht die legendäre Figur Wilhelm Tell, die aus der Zentralschweiz stammt?
    options_de:
      a: Der Widerstand gegen fremde Herrscher
      b: Die Neutralität der Schweiz im Krieg
      c: Die Einführung der Reformation
      d: Die Gründung der ersten Schweizer Bank
    explanation_de: Die Legende erzählt die Geschichte eines Mannes, der sich gegen die Unterdrückung
      durch fremde Vögte wehrt. Deshalb gilt Wilhelm Tell als Symbol der Freiheit. Es ist nicht erwiesen,
      dass er wirklich existiert hat.
