id: wilhelm-tell-sagengestalt-widerstand
lang: es
source_version: 1
question: ¿Qué representa el personaje legendario Guillermo Tell, originario de la Suiza central?
options:
  a: La resistencia contra los gobernantes extranjeros
  b: La neutralidad de Suiza en la guerra
  c: La introducción de la Reforma
  d: La fundación del primer banco suizo
explanation: La leyenda cuenta la historia de un hombre que se defiende de la opresión de los bailíos
  extranjeros. Por eso, Guillermo Tell se considera un símbolo de la libertad. No está comprobado que
  haya existido realmente.
