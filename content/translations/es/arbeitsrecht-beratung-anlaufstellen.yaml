id: arbeitsrecht-beratung-anlaufstellen
lang: es
source_version: 1
question: ¿Quién ayuda con las preguntas sobre el derecho laboral?
options:
  a: La junta escolar (Schulpflege) y la parroquia (Kirchgemeinde)
  b: La abogacía, los sindicatos y los tribunales laborales
  c: Las empresas de transporte público y el servicio de correos
  d: Los registros del estado civil y el control de habitantes
explanation: Para las preguntas sobre el derecho laboral existen varios puntos de contacto. Entre ellos
  se encuentran las abogadas y los abogados, los sindicatos y los tribunales laborales. Los demás organismos
  son competentes para otras tareas.
