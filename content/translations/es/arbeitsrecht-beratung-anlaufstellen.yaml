    question_de: Wer hilft bei Fragen zum Arbeitsrecht?
    options_de:
      a: Die Schulpflege und die Kirchgemeinde
      b: Die Anwaltschaft, die Gewerkschaften und die Arbeitsgerichte
      c: Die Unternehmen des öffentlichen Verkehrs und der Postdienst
      d: Die Zivilstandsämter und die Einwohnerkontrolle
    explanation_de: Für Fragen zum Arbeitsrecht gibt es verschiedene Anlaufstellen. Dazu gehören die Anwältinnen
