id: franzoesisch-status-landessprache
lang: es
source_version: 1
question: ¿Qué estatus tiene el francés en Suiza?
options:
  a: El francés es solo una lengua extranjera en la escuela.
  b: El francés es solo una lengua de comunicación regional.
  c: El francés es una lengua nacional.
  d: El francés es una lengua minoritaria sin estatus oficial.
explanation: El francés es una de las lenguas nacionales de Suiza. Se habla sobre todo en la Suiza occidental
  y es una lengua oficial a nivel de la Confederación.
