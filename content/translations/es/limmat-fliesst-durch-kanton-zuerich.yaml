id: limmat-fliesst-durch-kanton-zuerich
lang: es
source_version: 2
question: ¿Qué río sale del lago de Zúrich, atraviesa la ciudad de Zúrich y continúa a través del territorio
  del cantón?
options:
  a: El Thur
  b: El Birs
  c: El Reuss
  d: El Limmat
explanation: El Limmat nace en la salida del lago de Zúrich y atraviesa la ciudad de Zúrich y el valle
  del Limmat. Después abandona el territorio del cantón en dirección a Argovia. El Reuss, el Thur y el
  Birs no salen del lago de Zúrich.
