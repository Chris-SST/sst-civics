id: einsprache-gegen-steuerveranlagung-schriftlich
lang: es
source_version: 1
question: Una persona contribuyente no está de acuerdo con su tasación fiscal. ¿Qué puede hacer?
options:
  a: Puede hacer que se vote sobre ello en la asamblea municipal (Gemeindeversammlung).
  b: Puede negarse a pagar sin emprender ninguna otra acción.
  c: Puede presentar una reclamación por escrito ante la autoridad fiscal.
  d: Puede presentar una iniciativa popular (Volksinitiative) ante el Consejo Federal (Bundesrat).
explanation: Contra la tasación fiscal existe el recurso de la reclamación. Debe presentarse por escrito
  ante la autoridad fiscal, y además dentro de un plazo.
