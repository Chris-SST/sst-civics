id: auslaender-kein-stimmrecht-national
lang: es
source_version: 1
question: ¿Pueden las extranjeras y los extranjeros que viven en Suiza desde hace años participar en las
  votaciones federales?
options:
  a: Sí, pero solo en las votaciones y no en las elecciones.
  b: Sí, si tienen un permiso de establecimiento (permiso C) (Niederlassungsbewilligung).
  c: Sí, si pagan impuestos.
  d: No, a nivel nacional no tienen derecho de voto.
explanation: El derecho de voto a nivel nacional está vinculado a la ciudadanía (Bürgerrecht) suiza. Las
  extranjeras y los extranjeros solo pueden ejercerlo después de una naturalización.
