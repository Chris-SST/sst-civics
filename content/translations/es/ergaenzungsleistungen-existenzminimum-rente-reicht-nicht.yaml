    question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
    options_de:
      a: Personen, die ihre Arbeitsstelle verloren haben und Arbeitslosenentschädigung beziehen
      b: Alle Personen über 50 Jahre
      c: Personen, deren Rente der Alters- und Hinterlassenenversicherung (AHV) oder der Invalidenversicherung
        (IV) das Existenzminimum nicht deckt
      d: Alle Personen, die Sozialhilfe beziehen
    explanation_de: Die Ergänzungsleistungen helfen Personen, deren AHV- oder IV-Rente und das übrige
      Einkommen nicht zum Leben ausreichen. Sie sind ein gesetzlicher Anspruch und keine Sozialhilfe.
      Sie werden zusätzlich zur Rente ausbezahlt.
