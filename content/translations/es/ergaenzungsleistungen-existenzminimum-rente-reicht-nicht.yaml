id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
lang: es
source_version: 1
question: ¿Quién puede recibir prestaciones complementarias en Suiza?
options:
  a: Las personas que han perdido su empleo y perciben subsidios de desempleo
  b: Todas las personas mayores de 50 años
  c: Las personas cuya renta del seguro de vejez y supervivencia (AHV) o del seguro de invalidez (IV)
    no cubre el mínimo vital
  d: Todas las personas que perciben ayuda social
explanation: Las prestaciones complementarias ayudan a las personas cuya renta del AHV o del IV y el resto
  de sus ingresos no bastan para vivir. Constituyen un derecho legal y no son ayuda social. Se pagan además
  de la renta.
