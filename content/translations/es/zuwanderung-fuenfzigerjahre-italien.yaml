id: zuwanderung-fuenfzigerjahre-italien
lang: es
source_version: 1
question: ¿De qué país procedía en los años cincuenta la mayor parte de la mano de obra que inmigró a
  Suiza?
options:
  a: De Italia
  b: De Turquía
  c: De Portugal
  d: De España
explanation: En los años cincuenta, la mayor parte de la mano de obra inmigrante procedía de Italia. En
  aquella época, la economía necesitaba mucha mano de obra, por ejemplo en la construcción y en la industria.
  Más tarde llegaron también muchas personas de otros países.
