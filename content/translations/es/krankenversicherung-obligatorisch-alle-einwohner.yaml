    question_de: Wer muss in der Schweiz bei einer Krankenkasse eine Grundversicherung haben?
    options_de:
      a: alle Personen, die in der Schweiz leben
      b: nur Personen mit niedrigem Einkommen
      c: nur Personen mit Schweizer Bürgerrecht
      d: nur Personen, die einer Erwerbstätigkeit nachgehen
    explanation_de: Die Krankenversicherung ist für alle Personen mit Wohnsitz in der Schweiz obligatorisch.
      Dies gilt unabhängig von der Staatsangehörigkeit, dem Alter oder der Erwerbstätigkeit. Die Krankenkassen
      müssen alle Personen in die Grundversicherung aufnehmen.
