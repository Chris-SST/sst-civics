id: krankenversicherung-obligatorisch-alle-einwohner
lang: es
source_version: 1
question: ¿Quién debe tener en Suiza un seguro básico en una aseguradora de salud (Krankenkasse)?
options:
  a: todas las personas que viven en Suiza
  b: solo las personas con ingresos bajos
  c: solo las personas con ciudadanía (Bürgerrecht) suiza
  d: solo las personas que ejercen una actividad laboral
explanation: El seguro de enfermedad es obligatorio para todas las personas con domicilio en Suiza. Esto
  es válido independientemente de la nacionalidad, la edad o la actividad laboral. Las aseguradoras de
  salud deben admitir a todas las personas en el seguro básico.
