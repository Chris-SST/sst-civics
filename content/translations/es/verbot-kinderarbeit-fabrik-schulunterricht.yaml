id: verbot-kinderarbeit-fabrik-schulunterricht
lang: es
source_version: 1
question: ¿Qué debía garantizar sobre todo la prohibición del trabajo infantil en las fábricas de 1877?
options:
  a: Que las fábricas tuvieran que pagar salarios más bajos
  b: Que los niños pudieran asistir a la escuela
  c: Que los niños tuvieran que ayudar antes en las tareas del hogar
  d: Que las fábricas trajeran más mano de obra del extranjero
explanation: La ley federal sobre las fábricas de 1877 prohibió el trabajo de los niños en las fábricas.
  Los niños debían asistir a clase en lugar de trabajar. La ley también protegía la salud de los trabajadores.
