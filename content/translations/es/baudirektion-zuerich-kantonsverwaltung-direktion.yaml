id: baudirektion-zuerich-kantonsverwaltung-direktion
lang: es
source_version: 1
question: ¿Cuál de los siguientes organismos es una dirección de la administración del cantón de Zúrich?
options:
  a: La Dirección del municipio (Gemeinde)
  b: La Dirección de Obras Públicas (Baudirektion)
  c: La Dirección de la ciudad
  d: La Dirección de la Confederación
explanation: La Dirección de Obras Públicas pertenece a las direcciones de la administración del cantón
  de Zúrich. La administración cantonal se divide en varias direcciones, cada una de las cuales está dirigida
  por un miembro del Consejo de Gobierno (Regierungsrat).
