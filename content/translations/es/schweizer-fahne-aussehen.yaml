question: ¿Cómo es la bandera suiza?
options:
  a: Una cruz blanca aislada sobre un cuadrado rojo
  b: Una cruz blanca sobre fondo rojo con un escudo de armas en el centro
  c: Una cruz blanca que llega hasta el borde del rectángulo rojo
  d: Una cruz roja aislada sobre un cuadrado blanco
explanation: La bandera suiza es cuadrada. Muestra una cruz blanca sobre fondo rojo, cuyos brazos no tocan
  el borde. Junto con la bandera del Vaticano, es una de las dos banderas nacionales cuadradas.
