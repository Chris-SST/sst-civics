    question_de: Wie sieht die Schweizer Flagge aus?
    options_de:
      a: Ein freistehendes weisses Kreuz auf einem roten Quadrat
      b: Ein weisses Kreuz auf rotem Grund mit einem Wappen in der Mitte
      c: Ein weisses Kreuz, das bis zum Rand des roten Rechtecks reicht
      d: Ein freistehendes rotes Kreuz auf einem weissen Quadrat
    explanation_de: Die Schweizer Flagge ist quadratisch. Sie zeigt ein weisses Kreuz auf rotem Grund,
      dessen Arme den Rand nicht berühren. Zusammen mit der Flagge des Vatikans ist sie eine der beiden
      quadratischen Nationalflaggen.
