id: jodeln-brauch-landbevoelkerung
lang: es
source_version: 2
question: ¿Qué costumbre tradicional de la población rural suiza es una forma de cantar en la que la voz
  cambia rápidamente entre la voz de pecho y la voz de cabeza?
options:
  a: Tocar el alphorn
  b: Cantar yodel
  c: Hornussen
  d: Lanzar la bandera
explanation: En el yodel, la voz cambia rápidamente entre la voz de pecho y la voz de cabeza. El yodel
  es una costumbre tradicional de la población rural suiza. El yodel natural no necesita palabras, pero
  muchas canciones de yodel tienen letra.
