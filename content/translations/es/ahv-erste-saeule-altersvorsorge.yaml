id: ahv-erste-saeule-altersvorsorge
lang: es
source_version: 1
question: ¿Qué institución constituye el primer pilar de la previsión para la vejez en Suiza?
options:
  a: El pilar 3a privado
  b: El seguro de vejez y supervivencia (AHV) estatal
  c: La caja de pensiones
  d: La aseguradora de salud (Krankenkasse)
explanation: El seguro de vejez y supervivencia es la previsión estatal y constituye el primer pilar.
  La caja de pensiones es el segundo pilar y la previsión privada es el tercer pilar.
