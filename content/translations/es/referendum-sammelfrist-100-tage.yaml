id: referendum-sammelfrist-100-tage
lang: es
source_version: 1
question: ¿Cuánto tiempo tienen los comités del referéndum para recoger las firmas para un referéndum
  facultativo contra una ley federal?
options:
  a: 60 días
  b: 18 meses
  c: 100 días
  d: 30 días
explanation: El plazo es de 100 días a partir de la publicación oficial del acto legislativo. En cambio,
  los 18 meses se aplican a la recogida de firmas para una iniciativa popular (Volksinitiative).
