    question_de: Was bedeutet das aktive Stimmrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht, selbst in ein Amt gewählt zu werden
      c: Das Recht, im Parlament parlamentarische Initiativen einzureichen
      d: Das Recht, an Wahlen und Abstimmungen teilzunehmen und die eigene Stimme abzugeben
    explanation_de: Wer das aktive Stimmrecht hat, kann bei Wahlen und Abstimmungen persönlich seine Stimme
      abgeben, zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, selbst
      in ein Amt gewählt zu werden, wird dagegen passives Stimmrecht genannt.
