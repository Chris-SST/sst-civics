id: aktives-wahlrecht-bedeutung
lang: es
source_version: 3
question: ¿Qué significa el derecho de voto activo?
options:
  a: El derecho a fundar un partido
  b: El derecho a ser elegido uno mismo para un cargo
  c: El derecho a presentar iniciativas parlamentarias en el Parlamento
  d: El derecho a participar en elecciones y votaciones y a emitir el propio voto
explanation: Quien tiene el derecho de voto activo puede emitir personalmente su voto en elecciones y
  votaciones, por ejemplo en la elección del Consejo Nacional (Nationalrat) o en una votación popular.
  El derecho a ser elegido uno mismo para un cargo se denomina, en cambio, derecho de voto pasivo.
