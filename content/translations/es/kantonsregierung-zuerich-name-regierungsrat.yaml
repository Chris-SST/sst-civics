question: ¿Cómo se llama el gobierno del cantón de Zúrich?
options:
  a: Tribunal Superior (Obergericht)
  b: Consejo Cantonal (Kantonsrat)
  c: Consejo Federal (Bundesrat)
  d: Consejo de Gobierno (Regierungsrat)
