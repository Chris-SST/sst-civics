id: erderwaermung-gletscher-schrumpfen
lang: es
source_version: 1
question: ¿Qué efecto tiene el calentamiento global en los glaciares de los Alpes suizos?
options:
  a: Los glaciares se reducen.
  b: Los glaciares se desplazan hacia el norte.
  c: Los glaciares crecen más rápido.
  d: Los glaciares permanecen sin cambios.
explanation: Cuando las temperaturas aumentan, se derrite más hielo del que se repone con la nieve. Por
  eso los glaciares suizos se hacen más pequeños. Esto también afecta a las aguas y al paisaje de los
  Alpes.
