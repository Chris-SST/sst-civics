id: krankenversicherung-obligatorisch-einwohner
lang: es
source_version: 1
question: ¿Quién debe contratar un seguro de enfermedad en Suiza?
options:
  a: Solo las personas con ciudadanía (Bürgerrecht) suiza
  b: Todas las personas que residen en Suiza
  c: Solo las personas menores de 65 años
  d: Solo las personas con actividad laboral
explanation: El seguro obligatorio de atención médica rige para todas las personas con domicilio en Suiza.
  La ciudadanía, la actividad laboral y la edad no tienen ninguna importancia. El seguro debe contratarse
  en un plazo de tres meses desde la llegada al país.
