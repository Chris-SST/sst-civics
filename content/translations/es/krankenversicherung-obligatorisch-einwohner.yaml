    question_de: Wer muss in der Schweiz eine Krankenversicherung abschliessen?
    options_de:
      a: Nur Personen mit Schweizer Bürgerrecht
      b: Alle Personen, die in der Schweiz wohnen
      c: Nur Personen unter 65 Jahren
      d: Nur Personen mit Erwerbstätigkeit
    explanation_de: Die obligatorische Krankenpflegeversicherung gilt für alle Personen mit Wohnsitz in
      der Schweiz. Das Bürgerrecht, die Erwerbstätigkeit und das Alter spielen keine Rolle. Die Versicherung
      muss innerhalb von drei Monaten nach der Einreise in das Land abgeschlossen werden.
