id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: es
source_version: 1
question: ¿De qué se compone Suiza como Estado federal?
options:
  a: De distritos como Estados miembros
  b: De regiones lingüísticas como Estados miembros
  c: De cantones como Estados miembros
  d: De regiones como Estados miembros
explanation: Suiza es un Estado federal. Los cantones son sus Estados miembros y tienen su propia constitución,
  su propio parlamento y su propio gobierno. Los distritos y las regiones no son Estados miembros.
