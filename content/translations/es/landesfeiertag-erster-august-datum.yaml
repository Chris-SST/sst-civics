question: ¿En qué fecha cae la fiesta federal suiza, la fiesta nacional de Suiza?
options:
  a: El 1 de agosto
  b: El 26 de diciembre
  c: El 11 de noviembre
  d: El 1 de mayo
explanation: La fiesta nacional de Suiza es el 1 de agosto. Ese día se conmemora el Pacto Federal de 1291.
  En muchos lugares, la celebración incluye fuegos artificiales, hogueras en las alturas y discursos.
