id: volksinitiative-doppeltes-mehr
lang: es
source_version: 2
question: ¿Qué necesita una iniciativa popular (Volksinitiative) federal para ser aprobada en la votación?
options:
  a: El sí de dos tercios de los votantes
  b: El sí del Consejo Federal (Bundesrat) y de la mayoría de los votantes
  c: El sí de la mayoría de los votantes y de la mayoría de los cantones
  d: Solo el sí de la mayoría de los votantes
explanation: 'Una iniciativa popular federal quiere modificar la Constitución Federal (Bundesverfassung).
  Por eso necesita la doble mayoría: la mayoría de los votantes (mayoría del pueblo, Volksmehr) y la mayoría
  de los cantones (mayoría de los cantones, Ständemehr) deben votar sí. En cambio, en el caso de una iniciativa
  cantonal en el cantón de Zúrich basta con la mayoría de los votantes.'
