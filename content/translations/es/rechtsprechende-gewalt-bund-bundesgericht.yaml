id: rechtsprechende-gewalt-bund-bundesgericht
lang: es
source_version: 1
question: ¿Qué autoridad es, a nivel de la Confederación, el órgano judicial supremo de Suiza?
options:
  a: La Cancillería Federal (Bundeskanzlei)
  b: El Consejo Federal (Bundesrat)
  c: La Asamblea Federal (Bundesversammlung)
  d: El Tribunal Federal (Bundesgericht)
explanation: La Constitución Federal atribuye el poder judicial de la Confederación al Tribunal Federal
  (Bundesgericht). Es la autoridad judicial suprema de la Confederación. El Consejo Federal (Bundesrat)
  y la Asamblea Federal (Bundesversammlung) ejercen respectivamente el poder ejecutivo y el poder legislativo.
