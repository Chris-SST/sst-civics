id: aussenbeziehungen-zustaendigkeit-bund
lang: es
source_version: 1
question: ¿Quién es, en principio, el responsable en Suiza de configurar las relaciones con otros Estados?
options:
  a: La Conferencia de Gobiernos Cantonales
  b: La Confederación
  c: Los cantones en conjunto
  d: Los municipios (Gemeinden) fronterizos
explanation: Según la Constitución Federal, la política exterior es competencia de la Confederación. Los
  cantones pueden cooperar con el extranjero en sus propios ámbitos de competencia, pero la responsabilidad
  general recae en la Confederación.
