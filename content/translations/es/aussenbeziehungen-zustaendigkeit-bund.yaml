    question_de: Wer ist in der Schweiz grundsätzlich dafür zuständig, die Beziehungen zu anderen Staaten
      zu gestalten?
    options_de:
      a: Die Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone gemeinsam
      d: Die Grenzgemeinden
    explanation_de: Gemäss der Bundesverfassung fällt die Aussenpolitik in die Zuständigkeit des Bundes.
      Die Kantone können in ihren eigenen Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, aber
      die Gesamtverantwortung liegt beim Bund.
