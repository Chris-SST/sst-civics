id: arbeitszeugnis-bedeutung
lang: es
source_version: 1
question: ¿Qué es un certificado de trabajo (Arbeitszeugnis)?
options:
  a: Una confirmación del médico o de la médica de que una persona no puede trabajar
  b: Un documento del empleador que evalúa el rendimiento y el comportamiento de la persona empleada
  c: El permiso de la oficina de migración para trabajar en Suiza
  d: El certificado de salario anual para la declaración de impuestos
explanation: El certificado de trabajo lo expide el empleador. Describe el tipo y la duración del trabajo
  y evalúa el rendimiento y el comportamiento. Las personas empleadas pueden solicitarlo en cualquier
  momento.
