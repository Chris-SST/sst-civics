id: einkommenssteuer-kanton-gemeinden-zuerich
lang: es
source_version: 1
question: ¿Qué impuesto importante cobran el cantón de Zúrich y los municipios (Gemeinden) sobre el salario
  y otros ingresos de las personas?
options:
  a: El impuesto sobre la renta
  b: El impuesto sobre sucesiones
  c: El impuesto sobre los perros
  d: El impuesto sobre los vehículos de motor
explanation: El impuesto sobre la renta es uno de los impuestos más importantes del cantón y de los municipios.
  Se cobra sobre los ingresos de las personas físicas. Los demás impuestos son menos importantes o gravan
  otra cosa.
