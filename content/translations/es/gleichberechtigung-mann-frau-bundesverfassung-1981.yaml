id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: es
source_version: 1
question: ¿Desde cuándo figura la igualdad de derechos entre hombres y mujeres en la Constitución Federal
  suiza?
options:
  a: Desde 1999
  b: Desde 1971
  c: Desde 1981
  d: Desde 1848
explanation: En 1981 se incorporó a la Constitución Federal el artículo sobre la igualdad. Este obliga
  al Estado a garantizar la igualdad en la familia, la formación y el trabajo. El derecho de voto de las
  mujeres existía ya desde 1971.
