id: sonntagszeitung-erscheint-woechentlich
lang: es
source_version: 1
question: ¿Con qué frecuencia se publica un periódico dominical en Suiza?
options:
  a: Una vez por semana
  b: Dos veces por semana
  c: Una vez al mes
  d: Todos los días
explanation: Un periódico dominical se publica solo una vez por semana, el domingo. Los periódicos diarios,
  en cambio, se publican la mayoría de los días de la semana. La prensa forma parte de la cultura y de
  la formación de la opinión en el país.
