question: ¿Cuántas personas sin pasaporte suizo residían de forma permanente en Suiza aproximadamente
  en el año 2020?
options:
  a: unos 2,1 millones
  b: unos 0,8 millones
  c: unos 3,5 millones
  d: unos 1,4 millones
