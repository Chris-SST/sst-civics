id: pfahlbauten-am-zuerichsee-vorgeschichte
lang: es
source_version: 1
question: ¿Cómo estaban construidos los asentamientos prehistóricos del lago de Zúrich?
options:
  a: Como cuevas en la roca
  b: Como palafitos, es decir, casas sobre pilotes
  c: Como casas de ladrillo en aldeas
  d: Como castillos sobre rocas
explanation: En la orilla del lago de Zúrich había en tiempos prehistóricos palafitos, es decir, casas
  sobre pilotes. Sus restos se encuentran todavía hoy bajo el agua y son investigados por arqueólogos
  subacuáticos.
