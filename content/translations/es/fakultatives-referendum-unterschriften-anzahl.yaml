question: ¿Cuántas firmas se necesitan para un referéndum facultativo contra una ley federal?
options:
  a: 200 000 firmas
  b: 30 000 firmas
  c: 50 000 firmas
  d: 100 000 firmas
explanation: Para un referéndum facultativo se necesitan 50 000 firmas válidas de personas con derecho
  a voto. Deben recogerse en un plazo de 100 días a partir de la publicación de la ley.
