id: agrargesellschaft-zum-industrieland-19-jahrhundert
lang: es
source_version: 1
question: ¿Cómo cambió económicamente Suiza en el siglo XIX?
options:
  a: Vivía principalmente del comercio con las colonias.
  b: Siguió siendo, hasta 1900, un país casi exclusivamente campesino.
  c: Pasó de ser un país industrial a una sociedad agraria.
  d: Pasó de ser una sociedad agraria a un país industrial.
explanation: En el siglo XIX, el trabajo se desplazó de la agricultura a las fábricas. Nuevas vías de
  transporte, como el ferrocarril, favorecieron este cambio. Así, el país agrario se convirtió en un país
  industrial.
