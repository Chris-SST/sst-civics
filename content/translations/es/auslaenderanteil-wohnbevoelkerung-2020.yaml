id: auslaenderanteil-wohnbevoelkerung-2020
lang: es
source_version: 2
question: ¿Cuál era aproximadamente en 2020 la proporción de extranjeros en la población residente permanente
  de Suiza?
options:
  a: aproximadamente tres quintos
  b: aproximadamente una décima parte
  c: aproximadamente la mitad
  d: aproximadamente una cuarta parte
explanation: En 2020, alrededor de una cuarta parte de la población residente permanente no tenía pasaporte
  suizo. A finales de 2020 eran unos 2,2 de 8,7 millones de personas, es decir, aproximadamente el 25
  por ciento. En comparación con otros países de Europa, esta proporción es alta.
