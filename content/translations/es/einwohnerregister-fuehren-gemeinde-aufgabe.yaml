id: einwohnerregister-fuehren-gemeinde-aufgabe
lang: es
source_version: 1
question: ¿Cuál de las siguientes tareas cumple la oficina de registro de habitantes (Einwohneramt) en
  los municipios (Gemeinde) de Zúrich?
options:
  a: Dicta sentencias penales.
  b: Lleva el registro de habitantes del municipio.
  c: Concede permisos de construcción para carreteras cantonales.
  d: Establece las leyes fiscales.
explanation: El municipio lleva el registro de las personas que residen en él. Allí usted se da de alta,
  de baja o comunica un cambio de domicilio cuando se muda. Las sentencias penales, las leyes fiscales
  y las carreteras cantonales no forman parte de esta tarea.
