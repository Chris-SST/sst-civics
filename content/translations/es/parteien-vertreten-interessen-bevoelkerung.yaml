id: parteien-vertreten-interessen-bevoelkerung
lang: es
source_version: 1
question: ¿Qué función tienen los partidos políticos en la democracia?
options:
  a: Dictan sentencia en caso de litigios
  b: Representan los distintos intereses de la población
  c: Llevan a cabo las votaciones federales
  d: Hacen cumplir las leyes en la vida cotidiana
explanation: Los partidos agrupan los diversos intereses y opiniones de la población y los trasladan a
  la política. Hacer cumplir las leyes es tarea de las autoridades; dictar sentencia es tarea de los tribunales.
