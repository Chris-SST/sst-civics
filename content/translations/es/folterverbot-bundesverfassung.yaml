    question_de: Was sagt die Bundesverfassung zur Folter?
    options_de:
      a: Die Folter ist nur für Straftäter verboten.
      b: Die Folter ist für die Polizei in Notsituationen erlaubt.
      c: Die Folter ist erlaubt, wenn ein Gericht sie genehmigt.
      d: Niemand darf der Folter unterworfen werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet die Folter und jede andere Art grausamer,
      unmenschlicher oder erniedrigender Behandlung. Dieses Verbot gilt für alle Personen ohne Ausnahme.
      Auch der Staat darf keine Ausnahmen machen.
