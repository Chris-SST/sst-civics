id: folterverbot-bundesverfassung
lang: es
source_version: 1
question: ¿Qué dice la Constitución Federal sobre la tortura?
options:
  a: La tortura solo está prohibida para los delincuentes.
  b: La tortura está permitida para la policía en situaciones de emergencia.
  c: La tortura está permitida si un tribunal lo aprueba.
  d: Nadie puede ser sometido a tortura.
explanation: El artículo 10 de la Constitución Federal prohíbe la tortura y cualquier otro tipo de trato
  cruel, inhumano o degradante. Esta prohibición se aplica a todas las personas sin excepción. Tampoco
  el Estado puede hacer excepciones.
