id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: es
source_version: 1
question: ¿Qué derecho fundamental protege la libertad de formarse una opinión propia y de informarse
  a partir de fuentes de acceso general?
options:
  a: La libertad de establecimiento
  b: La libertad de opinión y de información
  c: La libertad económica
  d: La libertad de reunión
explanation: La Constitución Federal protege la libertad de opinión y de información en el artículo 16.
  Toda persona puede obtener libremente información de fuentes de acceso general. Esto es una base importante
  de la democracia.
