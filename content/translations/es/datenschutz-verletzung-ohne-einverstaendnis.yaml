id: datenschutz-verletzung-ohne-einverstaendnis
lang: es
source_version: 1
question: ¿En qué caso se vulnera la protección de datos?
options:
  a: Se dan a conocer datos privados sobre una persona sin su consentimiento y sin base legal.
  b: Una autoridad almacena datos, tal como lo exige una ley.
  c: Una persona facilita voluntariamente su propia dirección.
  d: Una persona autoriza expresamente la publicación de su foto.
explanation: La protección de la esfera privada incluye la protección frente al uso indebido de datos
  personales. La información privada solo puede darse a conocer con el consentimiento de la persona o
  con base en una ley. Si no se da ninguna de las dos condiciones, existe una vulneración.
