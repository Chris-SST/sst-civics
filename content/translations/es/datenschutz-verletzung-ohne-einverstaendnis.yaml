    source_version: 1
    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Daten über eine Person werden ohne ihre Einwilligung und ohne gesetzliche Grundlage bekannt
        gegeben.
      b: Eine Behörde speichert Daten, so wie es ein Gesetz verlangt.
      c: Eine Person gibt freiwillig ihre eigene Adresse an.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz der Privatsphäre schliesst den Schutz vor dem missbräuchlichen Gebrauch
      persönlicher Daten ein. Private Informationen dürfen nur mit der Einwilligung der Person oder aufgrund
      eines Gesetzes bekannt gegeben werden. Ist keine der beiden Bedingungen erfüllt, liegt eine Verletzung
      vor.
