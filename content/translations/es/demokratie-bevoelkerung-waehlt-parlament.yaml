    question_de: Welches der folgenden ist ein Recht der Bevölkerung in einer Demokratie wie der Schweiz?
    options_de:
      a: Sie ernennt die Richter des Bundesgerichts per Losentscheid.
      b: Sie bestimmt die Gesetze allein, ohne das Parlament.
      c: Sie bestimmt ihr Parlament durch Wahlen.
      d: Sie wählt die Befehlshaber der Armee direkt.
    explanation_de: In der Demokratie wählt die Bevölkerung ihre Vertreter im Parlament. Auf Ebene des
      Bundes sind dies der Nationalrat und der Ständerat. Das Parlament erlässt dann im Namen des Volkes
      die Bundesgesetze.
