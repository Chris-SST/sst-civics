id: demokratie-bevoelkerung-waehlt-parlament
lang: es
source_version: 1
question: ¿Cuál de los siguientes es un derecho de la población en una democracia como Suiza?
options:
  a: Nombra a los jueces del Tribunal Federal (Bundesgericht) por sorteo.
  b: Determina las leyes por sí sola, sin el Parlamento.
  c: Determina su Parlamento mediante elecciones.
  d: Elige directamente a los mandos del Ejército.
explanation: En la democracia, la población elige a sus representantes en el Parlamento. A nivel de la
  Confederación, estos son el Consejo Nacional (Nationalrat) y el Consejo de los Estados (Ständerat).
  El Parlamento dicta entonces las leyes federales en nombre del pueblo.
