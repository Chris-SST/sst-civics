    question_de: Im 19. Jahrhundert verliessen viele Menschen die Schweiz und wanderten zum Beispiel nach
      Amerika aus. Was war ein wichtiger Grund dafür?
    options_de:
      a: Not und Arbeitsmangel bedrohten ihre Existenz.
      b: Der Bund verbot ihnen, in der Schweiz zu leben.
      c: Die Schweiz hatte sehr wenig Platz für Fabriken.
      d: Im Ausland gab es für Neuankömmlinge keine Steuern.
    explanation_de: Im 19. Jahrhundert war die Schweiz noch ein Auswanderungsland. Hungersnöte, Armut
      und Arbeitsmangel führten dazu, dass viele Menschen im Ausland ein neues Leben suchten. Erst später
      wurde die Schweiz zu einem Einwanderungsland.
