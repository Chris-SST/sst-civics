id: auswanderung-19-jahrhundert-grund-not
lang: es
source_version: 1
question: En el siglo XIX, muchas personas abandonaron Suiza y emigraron, por ejemplo, a América. ¿Cuál
  fue una razón importante para ello?
options:
  a: La miseria y la falta de trabajo amenazaban su existencia.
  b: La Confederación les prohibió vivir en Suiza.
  c: Suiza tenía muy poco espacio para fábricas.
  d: En el extranjero no había impuestos para los recién llegados.
explanation: En el siglo XIX, Suiza todavía era un país de emigración. Las hambrunas, la pobreza y la
  falta de trabajo llevaron a muchas personas a buscar una nueva vida en el extranjero. Solo más tarde
  Suiza se convirtió en un país de inmigración.
