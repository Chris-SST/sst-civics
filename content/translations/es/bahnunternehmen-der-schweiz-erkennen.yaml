id: bahnunternehmen-der-schweiz-erkennen
lang: es
source_version: 1
question: ¿Cuáles de las siguientes abreviaturas corresponden todas a empresas ferroviarias de Suiza?
options:
  a: SOB, SEM, BLS y SZU
  b: SBB, BLS, SOB y SZU
  c: SBB, SRF, SOB y SUVA
  d: BLS, SZU, SNB y SBB
explanation: SBB, BLS, SOB y SZU son empresas ferroviarias que operan trenes en Suiza. La SBB es la empresa
  más grande; las demás son ferrocarriles más pequeños, que a menudo circulan a nivel regional. Las demás
  abreviaturas corresponden a organizaciones como el Banco Nacional (SNB), la Secretaría de Estado de
  Migración (SEM) o el seguro de accidentes (SUVA).
