id: militaerdienstpflicht-schweizer-maenner
lang: es
source_version: 1
question: ¿A quién obliga en Suiza el deber de prestar el servicio militar o el servicio sustitutorio?
options:
  a: A todos los habitantes a partir de los 18 años
  b: A los hombres con ciudadanía (Bürgerrecht) suiza
  c: A todos los hombres que residen en Suiza
  d: Solo a las mujeres con ciudadanía suiza
explanation: Según la Constitución Federal, todo hombre suizo está obligado a prestar el servicio militar.
  Quien no pueda conciliarlo con su conciencia presta un servicio sustitutorio civil. Los extranjeros
  no están sujetos a la obligación de prestar servicio.
