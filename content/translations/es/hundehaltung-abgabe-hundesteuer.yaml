    question_de: Was gilt im Kanton Zürich für Personen, die einen Hund haben?
    options_de:
      a: Sie müssen jedes Jahr eine Hundesteuer an die Gemeinde bezahlen.
      b: Sie müssen nur einmal, beim Kauf des Hundes, eine Gebühr an den Bund bezahlen.
      c: Sie müssen jedes Jahr mit dem Hund eine Prüfung beim Kanton ablegen.
      d: Sie müssen nur dann eine Steuer bezahlen, wenn sie mit dem Hund Geld verdienen.
    explanation_de: Wer im Kanton Zürich einen Hund hat, bezahlt jedes Jahr eine Steuer für den Hund,
      die sogenannte Hundesteuer. Das Geld geht an die Wohngemeinde, nicht an den Bund. Die Steuer ist
      nicht einmalig und gilt auch für Hunde, die nur privat gehalten werden.
