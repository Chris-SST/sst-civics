id: hundehaltung-abgabe-hundesteuer
lang: es
source_version: 2
question: ¿Qué se aplica en el cantón de Zúrich a las personas que tienen un perro?
options:
  a: Deben pagar cada año un impuesto por el perro al municipio (Gemeinde).
  b: Solo deben pagar una tasa una única vez, al comprar el perro, a la Confederación.
  c: Deben hacer cada año un examen con el perro ante el cantón.
  d: Solo deben pagar un impuesto si ganan dinero con el perro.
explanation: Quien tiene un perro en el cantón de Zúrich paga cada año un impuesto por el perro, el llamado
  impuesto sobre perros (Hundesteuer). El dinero va al municipio de residencia, no a la Confederación.
  El impuesto no es único y también se aplica a los perros que se tienen solo de forma privada.
