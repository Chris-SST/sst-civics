    question_de: Wer führt im Kanton Zürich die Primarschulen?
    options_de:
      a: Die Bildungsdirektion des Kantons
      b: Der Bund
      c: Die Gemeinden
      d: Die Bezirke
    explanation_de: Im Kanton Zürich führen die Gemeinden die Primarschulen. Je nach Ort handelt es sich
      um die politischen Gemeinden oder um eigene Schulgemeinden, und die gewählte Schulpflege ist die
      örtliche Schulbehörde. Der Kanton legt nur den Rahmen fest, zum Beispiel den Lehrplan, und beaufsichtigt
      die öffentliche obligatorische Schule.
