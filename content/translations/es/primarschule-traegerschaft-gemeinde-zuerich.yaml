id: primarschule-traegerschaft-gemeinde-zuerich
lang: es
source_version: 2
question: ¿Quién gestiona las escuelas de primaria en el cantón de Zúrich?
options:
  a: La Dirección de Educación del cantón
  b: La Confederación
  c: Los municipios (Gemeinden)
  d: Los distritos
explanation: En el cantón de Zúrich, los municipios gestionan las escuelas primarias. Según el lugar,
  se trata de los municipios políticos o de municipios escolares propios, y la Schulpflege elegida es
  la autoridad escolar local. El cantón solo establece el marco, por ejemplo el plan de estudios, y supervisa
  la escuela obligatoria pública.
