id: ehe-verbot-nahe-blutsverwandtschaft
lang: es
source_version: 1
question: ¿Quién no puede casarse en Suiza?
options:
  a: Las personas que ya se han divorciado alguna vez
  b: Las personas que proceden de distintos cantones
  c: Las personas que son parientes consanguíneos cercanos
  d: Las personas que viven en distintos municipios (Gemeinden)
explanation: El matrimonio entre parientes consanguíneos cercanos está prohibido, por ejemplo entre hermanos
  o entre padres e hijos. En cambio, el origen, el lugar de residencia y un divorcio anterior no son un
  impedimento para contraer matrimonio.
