    question_de: Wer darf in der Schweiz nicht heiraten?
    options_de:
      a: Personen, die sich schon einmal scheiden liessen
      b: Personen, die aus verschiedenen Kantonen stammen
      c: Personen, die nahe Blutsverwandte sind
      d: Personen, die in verschiedenen Gemeinden wohnen
    explanation_de: Die Ehe zwischen nahen Blutsverwandten ist verboten, zum Beispiel zwischen Geschwistern
