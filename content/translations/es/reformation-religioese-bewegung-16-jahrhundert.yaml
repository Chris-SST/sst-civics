question: ¿Qué importante movimiento religioso marcó Europa, y también Suiza, en el siglo XVI?
options:
  a: La Reforma
  b: La Ilustración
  c: La Regeneración
  d: La República Helvética
explanation: En el siglo XVI, la Reforma dividió la Iglesia en Europa. En Suiza fueron importantes, por
  ejemplo, Huldrych Zwingli en Zúrich y Juan Calvino en Ginebra. Los demás términos designan acontecimientos
  posteriores.
