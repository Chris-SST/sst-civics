id: fakultatives-referendum-unterschriften-frist
lang: es
source_version: 1
question: ¿Cuántas firmas son necesarias para que prospere un referéndum facultativo contra una ley federal,
  y en qué plazo?
options:
  a: 50 000 firmas en un plazo de 18 meses
  b: 50 000 firmas en un plazo de 100 días
  c: 100 000 firmas en un plazo de 30 días
  d: 100 000 firmas en un plazo de 100 días
explanation: Para un referéndum facultativo se necesitan 50 000 firmas válidas en un plazo de 100 días
  desde la publicación de la ley en la Hoja Federal (Bundesblatt). Si prospera, el pueblo vota sobre la
  ley.
