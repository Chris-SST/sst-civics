    explanation_de: Während des Zweiten Weltkriegs herrschte in der Schweiz Nahrungsmittelknappheit. Deshalb
      wurden mit der «Anbauschlacht» auch mitten in den Stadtzentren Flächen bepflanzt, zum Beispiel der
      Sechseläutenplatz in Zürich, der mit Kartoffeln bebaut wurde. Dort wurden weder Tabak, Weinrebe
      noch Baumwolle angebaut.
