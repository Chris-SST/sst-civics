id: sechselaeutenplatz-kartoffelanbau-zweiter-weltkrieg
lang: es
source_version: 2
question: ¿Cuál de estas plantas se cultivó en la plaza Sechseläutenplatz de Zúrich durante la Segunda
  Guerra Mundial?
options:
  a: Tabaco
  b: Vid
  c: Algodón
  d: Patatas
explanation: Durante la Segunda Guerra Mundial, en Suiza había escasez de alimentos. Por eso, con la «batalla
  de los cultivos» («Anbauschlacht») también se plantaron superficies en pleno centro de las ciudades,
  por ejemplo la plaza Sechseläutenplatz de Zúrich, que se cultivó con patatas. Allí no se cultivaron
  tabaco, vid ni algodón.
