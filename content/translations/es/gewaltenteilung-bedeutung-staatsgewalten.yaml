    question_de: Was bedeutet das Prinzip der Gewaltenteilung in der Schweiz?
    options_de:
      a: Der Bund, die Kantone und die Gemeinden teilen die Steuereinnahmen untereinander auf.
      b: Die Regierung, das Parlament und die Gerichte teilen die Staatsmacht untereinander auf.
      c: Die Macht im Staat liegt einzig beim Bundesrat.
      d: Das Volk und die Medien teilen die Staatsmacht untereinander auf.
    explanation_de: Bei der Gewaltenteilung übernehmen die Exekutive (Regierung), die Legislative (Parlament)
      und die Judikative (Gerichte) unterschiedliche Aufgaben. So kann kein Organ allein zu viel Macht
      haben. Die Staatsgewalten kontrollieren sich gegenseitig.
