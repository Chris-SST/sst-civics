id: gewaltenteilung-bedeutung-staatsgewalten
lang: es
source_version: 1
question: ¿Qué significa el principio de la separación de poderes en Suiza?
options:
  a: La Confederación, los cantones y los municipios (Gemeinden) se reparten entre sí los ingresos fiscales.
  b: El gobierno, el parlamento y los tribunales se reparten el poder del Estado.
  c: El poder en el Estado reside únicamente en el Consejo Federal (Bundesrat).
  d: El pueblo y los medios de comunicación se reparten el poder del Estado.
explanation: En la separación de poderes, el ejecutivo (gobierno), el legislativo (parlamento) y el judicial
  (tribunales) asumen tareas distintas. Así, ningún órgano puede tener por sí solo demasiado poder. Los
  poderes del Estado se controlan entre sí.
