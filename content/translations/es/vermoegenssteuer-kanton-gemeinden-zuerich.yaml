id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: es
source_version: 1
question: ¿Cuál de estos impuestos recaudan el cantón de Zúrich y los municipios (Gemeinden) sobre el
  patrimonio de una persona, por ejemplo sobre los depósitos bancarios y los valores?
options:
  a: El impuesto anticipado
  b: El impuesto sobre el valor añadido
  c: El impuesto sobre el patrimonio
  d: El impuesto sobre los aceites minerales
explanation: El cantón y los municipios gravan el patrimonio de las personas físicas. El impuesto sobre
  el valor añadido, el impuesto anticipado y el impuesto sobre los aceites minerales son impuestos de
  la Confederación.
