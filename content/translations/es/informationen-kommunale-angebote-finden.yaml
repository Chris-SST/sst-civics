id: informationen-kommunale-angebote-finden
lang: es
source_version: 2
question: ¿Dónde se puede encontrar información sobre los servicios y las normas del propio municipio
  (Gemeinde)?
options:
  a: En la Hoja Federal (Bundesblatt) de la Confederación Suiza
  b: En el periódico local o en el sitio web del municipio
  c: En la embajada del país de origen
  d: En el Consejo Federal (Bundesrat) en Berna
explanation: El municipio informa sobre sus servicios y normas sobre todo en el periódico local y en su
  sitio web en internet. La Confederación y el Consejo Federal son competentes en temas nacionales; una
  embajada extranjera no lo es en absoluto para el municipio. La administración municipal también ofrece
  información.
