    question_de: Wo kann man Informationen über die Dienstleistungen und die Regeln der eigenen Gemeinde
      finden?
    options_de:
      a: Im Bundesblatt der Schweizerischen Eidgenossenschaft
      b: In der lokalen Zeitung oder auf der Website der Gemeinde
      c: In der Botschaft des Herkunftslandes
      d: Beim Bundesrat in Bern
    explanation_de: Die Gemeinde informiert über ihre Dienstleistungen und Regeln vor allem in der lokalen
      Zeitung und auf ihrer Website im Internet. Der Bund und der Bundesrat sind für nationale Themen
      zuständig; eine ausländische Botschaft ist für die Gemeinde überhaupt nicht zuständig. Auch die
      Gemeindeverwaltung bietet Informationen an.
