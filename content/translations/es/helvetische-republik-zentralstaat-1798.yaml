id: helvetische-republik-zentralstaat-1798
lang: es
source_version: 1
question: ¿Qué le ocurrió a Suiza en 1798 bajo la influencia de Napoleón Bonaparte?
options:
  a: Pasó a formar parte del Imperio alemán.
  b: Se convirtió en una monarquía con un rey propio.
  c: Fue dividida de forma permanente en dos Estados.
  d: 'Pasó a ser, de manera temporal, un Estado centralizado: la República Helvética.'
explanation: En 1798, tras la entrada de las tropas francesas, surgió la República Helvética. Era un Estado
  unitario gobernado desde el centro y sustituyó temporalmente a la antigua Confederación. Los cantones
  apenas tenían derechos propios.
