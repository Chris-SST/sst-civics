    question_de: Welche Folge hatte die Reformation für die Schweiz?
    options_de:
      a: Die Schweiz war religiös in einen reformierten und einen katholischen Teil gespalten.
      b: Die Schweiz wurde Teil des Deutschen Reiches.
      c: Die Kirche verlor überall vollständig ihren Einfluss auf die Politik.
      d: Alle Kantone der Eidgenossenschaft wurden reformiert.
