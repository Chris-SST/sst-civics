question: ¿Qué consecuencia tuvo la Reforma para Suiza?
options:
  a: Suiza quedó dividida religiosamente en una parte reformada y otra católica.
  b: Suiza pasó a formar parte del Imperio alemán.
  c: La Iglesia perdió por completo su influencia en la política en todas partes.
  d: Todos los cantones de la Confederación se hicieron reformados.
explanation: Algunos cantones adoptaron la Reforma, otros siguieron siendo católicos. Así surgió una oposición
  religiosa que afectó durante mucho tiempo a la Confederación. También hubo conflictos entre las confesiones.
