id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: es
source_version: 1
question: ¿Qué significa el principio de colegialidad en el Consejo Federal (Bundesrat)?
options:
  a: La presidenta o el presidente de la Confederación (Bundespräsident) decide por sí solo.
  b: Los miembros defienden de forma unitaria hacia el exterior las decisiones del Consejo Federal.
  c: Cada miembro decide en su departamento sin consultar con los demás.
  d: Los miembros pueden defender públicamente su opinión discrepante.
explanation: El Consejo Federal decide como órgano colegiado. Incluso quien haya defendido una opinión
  diferente dentro del Consejo Federal respalda la decisión hacia el exterior. De este modo, el Gobierno
  se presenta de manera unida.
