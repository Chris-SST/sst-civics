    question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
    options_de:
      a: Die Bundespräsidentin oder der Bundespräsident entscheidet allein.
      b: Die Mitglieder vertreten die Entscheide des Bundesrates nach aussen einheitlich.
      c: Jedes Mitglied entscheidet in seinem Departement, ohne sich mit den anderen zu beraten.
      d: Die Mitglieder dürfen ihre abweichende Meinung öffentlich vertreten.
    explanation_de: Der Bundesrat entscheidet als Kollegialbehörde. Auch wer innerhalb des Bundesrates
      eine andere Meinung vertreten hat, unterstützt den Entscheid nach aussen. Auf diese Weise tritt
      die Regierung geschlossen auf.
