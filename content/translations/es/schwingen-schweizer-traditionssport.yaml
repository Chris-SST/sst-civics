question: ¿Qué deporte tradicional de Suiza es una especie de lucha?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'El Schwingen es una lucha entre dos personas en un área circular cubierta de serrín y se
  considera un deporte tradicional suizo. El Hornussen y el Steinstossen también son deportes suizos antiguos,
  pero no son luchas: en el Hornussen se golpea un pequeño disco para lanzarlo lejos por el aire, y en
  el Steinstossen se lanza una piedra pesada. El curling se juega sobre hielo y es originario de Escocia.'
