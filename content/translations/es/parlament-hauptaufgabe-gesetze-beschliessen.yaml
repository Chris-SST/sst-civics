id: parlament-hauptaufgabe-gesetze-beschliessen
lang: es
source_version: 1
question: ¿Cuál es la tarea más importante del Parlamento de la Confederación?
options:
  a: Dirigir la policía en todo el país
  b: Decidir en los litigios entre personas
  c: Debatir y aprobar leyes
  d: Hacer cumplir las leyes en la vida cotidiana
explanation: El Parlamento es el poder legislativo. Debate y aprueba las leyes de la Confederación. El
  Gobierno las aplica y los tribunales dictan sentencia en los litigios.
