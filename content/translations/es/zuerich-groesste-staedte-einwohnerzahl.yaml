question: ¿Cuáles son las tres ciudades más grandes del cantón de Zúrich según el número de habitantes?
options:
  a: Zúrich, Uster y Wetzikon
  b: Zúrich, Dietikon y Winterthur
  c: Zúrich, Winterthur y Uster
