question: ¿Quién decide, por regla general, en el cantón de Zúrich sobre la solicitud de licencia de construcción
  de una nueva vivienda?
options:
  a: El Consejo de Gobierno (Regierungsrat)
  b: La autoridad de construcción del municipio (Gemeinde)
  c: El tribunal de distrito
  d: La Oficina Federal de Desarrollo Territorial
explanation: Las solicitudes de licencia de construcción para viviendas se presentan en el municipio.
  La autoridad municipal de construcción examina la solicitud y concede o deniega la licencia de construcción.
  El cantón solo interviene en casos especiales.
