id: kantonsrat-amtsdauer-vier-jahre
lang: es
source_version: 1
question: ¿Por cuántos años se elige a los miembros del Consejo Cantonal (Kantonsrat) de Zúrich?
options:
  a: Por dos años
  b: Por tres años
  c: Por seis años
  d: Por cuatro años
explanation: Los miembros del Consejo Cantonal de Zúrich se eligen para un mandato de cuatro años. Después
  se celebran elecciones generales de renovación total. Entonces, las personas con derecho a voto pueden
  decidir de nuevo quién ocupa un escaño en el Parlamento.
