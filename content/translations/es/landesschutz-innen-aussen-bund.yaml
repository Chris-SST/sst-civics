    question_de: Welche der folgenden Aufgaben gehört zu den zentralen Aufgaben des Bundes?
    options_de:
      a: Die Organisation der örtlichen Schulen
      b: Der Schutz des Landes nach innen und nach aussen
      c: Der Unterhalt der Strassen der Gemeinden
      d: Die Verwaltung der Einwohnerregister der Gemeinden
    explanation_de: Der Bund kümmert sich um die Sicherheit des Landes nach aussen, zum Beispiel mit der
      Armee, und um die innere Sicherheit. Die Schulen, die Strassen der Gemeinden und die Einwohnerregister
      hingegen fallen vor allem in die Zuständigkeit der Kantone und der Gemeinden.
