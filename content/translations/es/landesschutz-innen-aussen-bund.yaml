id: landesschutz-innen-aussen-bund
lang: es
source_version: 1
question: ¿Cuál de las siguientes tareas forma parte de las tareas centrales de la Confederación?
options:
  a: La organización de las escuelas locales
  b: La protección del país hacia el interior y hacia el exterior
  c: El mantenimiento de las calles de los municipios (Gemeinde)
  d: La administración de los registros de habitantes de los municipios
explanation: La Confederación se ocupa de la seguridad del país hacia el exterior, por ejemplo con el
  ejército, y de la seguridad interior. En cambio, las escuelas, las calles de los municipios y los registros
  de habitantes son competencia sobre todo de los cantones y de los municipios.
