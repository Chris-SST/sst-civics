id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: es
source_version: 3
question: ¿Quién decide en el cantón de Zúrich a qué clase de primaria se asigna a un niño?
options:
  a: La Schulpflege (comisión escolar) o la dirección de la escuela
  b: El departamento de educación de la Confederación
  c: La asamblea municipal (Gemeindeversammlung)
  d: Los padres del niño
explanation: La Schulpflege (comisión escolar) o la dirección de la escuela asigna a los niños a las clases.
  Los padres no pueden elegir la clase libremente. De este modo, la escuela organiza su funcionamiento
  y el tamaño de las clases.
