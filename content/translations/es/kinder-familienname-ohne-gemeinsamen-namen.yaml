id: kinder-familienname-ohne-gemeinsamen-namen
lang: es
source_version: 1
question: Dos cónyuges no determinaron un apellido familiar común al casarse. ¿Quién fija entonces el
  apellido de sus hijos comunes?
options:
  a: Los hijos reciben automáticamente el apellido del padre.
  b: El Registro Civil decide según el orden alfabético de los apellidos.
  c: Los cónyuges eligen ellos mismos el apellido de sus hijos.
  d: Los hijos reciben automáticamente el apellido de la madre.
explanation: Si los cónyuges no han determinado un apellido familiar común, deben elegir ellos mismos
  el apellido de los hijos. La ley no lo fija automáticamente. Las normas figuran en el Código Civil suizo.
