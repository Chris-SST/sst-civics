id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: es
source_version: 1
question: ¿Para qué sirve la declaración de impuestos que los contribuyentes rellenan cada año?
options:
  a: Sirve para el registro en la oficina de control de habitantes.
  b: Es la solicitud de un seguro de enfermedad.
  c: Es la inscripción para el servicio civil (Zivildienst).
  d: Revela la situación financiera ante las autoridades fiscales.
explanation: Con la declaración de impuestos, los contribuyentes indican sus ingresos, su patrimonio y
  sus deducciones. Sobre esta base, la autoridad fiscal calcula el impuesto.
