question: ¿Por qué causa se comprometió la política zuriquesa Emilie Lieberherr?
options:
  a: Por la construcción del aeropuerto de Zúrich
  b: Por la adhesión de Suiza a la ONU
  c: Por el derecho de voto y de elegibilidad de las mujeres
  d: Por la supresión de la asamblea municipal (Gemeindeversammlung)
explanation: Emilie Lieberherr luchó en los años sesenta por el derecho de voto y de elegibilidad de las
  mujeres. A nivel de la Confederación se introdujo en 1971. En el cantón de Zúrich rige desde 1970.
