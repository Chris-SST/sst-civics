id: beziehungen-schweiz-eu-bilaterale-abkommen
lang: es
source_version: 1
question: ¿En qué se basan, en esencia, las relaciones entre Suiza y la Unión Europea (UE)?
options:
  a: En un paquete de acuerdos bilaterales
  b: En un gobierno común
  c: En la pertenencia de Suiza a la UE
  d: En una constitución común
explanation: Suiza no es miembro de la UE. Sus relaciones se rigen por numerosos acuerdos bilaterales,
  es decir, tratados entre dos partes. Se refieren, por ejemplo, al comercio y a la libre circulación
  de personas.
