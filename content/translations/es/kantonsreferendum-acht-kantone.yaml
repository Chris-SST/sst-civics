    question_de: Wer kann gegen ein Bundesgesetz zusätzlich zu 50 000 Stimmberechtigten ebenfalls ein
      fakultatives Referendum verlangen?
    options_de:
      a: Acht Kantone
      b: Drei grosse Parteien gemeinsam
      c: Der Bundesrat
      d: Das Bundesgericht
    explanation_de: Gemäss der Bundesverfassung können auch acht Kantone eine Volksabstimmung über ein
      Bundesgesetz verlangen. Dies wird Kantonsreferendum genannt. Es wird selten angewendet, zeigt aber,
      dass die Kantone im Bundesstaat Mitwirkungsrechte haben.
