id: kantonsreferendum-acht-kantone
lang: es
source_version: 1
question: ¿Quién puede solicitar también un referéndum facultativo contra una ley federal, además de 50
  000 personas con derecho a voto?
options:
  a: Ocho cantones
  b: Tres grandes partidos conjuntamente
  c: El Consejo Federal (Bundesrat)
  d: El Tribunal Federal (Bundesgericht)
explanation: Según la Constitución Federal, también ocho cantones pueden solicitar una votación popular
  sobre una ley federal. Esto se denomina referéndum cantonal (Kantonsreferendum). Se utiliza raramente,
  pero muestra que los cantones tienen derechos de participación en el Estado federal.
