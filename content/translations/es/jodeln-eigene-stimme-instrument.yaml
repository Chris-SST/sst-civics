    question_de: Was dient beim Jodeln als Instrument?
    options_de:
      a: Das Alphorn
      b: Die eigene Stimme
      c: Das Schwyzerörgeli
      d: Die Handorgel
    explanation_de: Beim Jodeln wird ohne Worte gesungen, meistens nur mit Silben, und es wird schnell
      zwischen Bruststimme und Kopfstimme gewechselt. Die eigene Stimme ist das Instrument. Das Jodeln
      gehört zu den Traditionen der Schweiz und wird oft mit dem Alphorn oder mit dem Schwyzerörgeli in
      Verbindung gebracht.
