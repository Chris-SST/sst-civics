id: jodeln-eigene-stimme-instrument
lang: es
source_version: 1
question: ¿Qué sirve como instrumento en el canto yodel?
options:
  a: La trompa alpina (Alphorn)
  b: La propia voz
  c: El Schwyzerörgeli (acordeón diatónico suizo)
  d: El acordeón diatónico (Handorgel)
explanation: En el yodel se canta sin palabras, la mayoría de las veces solo con sílabas, y se cambia
  rápidamente entre la voz de pecho y la voz de cabeza. La propia voz es el instrumento. El yodel forma
  parte de las tradiciones de Suiza y a menudo se asocia con la trompa alpina o con el Schwyzerörgeli.
