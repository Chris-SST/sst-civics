id: zivildienst-anstelle-militaerdienst
lang: es
source_version: 3
question: ¿Cómo se relacionan en Suiza el servicio civil (Zivildienst) y el servicio militar?
options:
  a: El servicio civil solo pueden prestarlo las mujeres.
  b: Quien presta el servicio civil no tiene que pagar impuestos.
  c: El servicio civil hay que prestarlo además del servicio militar.
  d: El servicio civil puede prestarse en lugar del servicio militar.
explanation: El servicio civil es un sustituto civil del servicio militar. Está pensado para las personas
  aptas para el servicio militar que no pueden conciliar el servicio militar con su conciencia. Para ello
  hay que presentar una solicitud, y el servicio civil dura más que el servicio militar.
