    question_de: Wie stehen in der Schweiz der Zivildienst und der Militärdienst zueinander in Beziehung?
    options_de:
      a: Den Zivildienst können nur Frauen leisten.
      b: Wer Zivildienst leistet, muss keine Steuern zahlen.
      c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
      d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
    explanation_de: Der Zivildienst ist ein ziviler Ersatz für den Militärdienst. Er ist für militärdiensttaugliche
      Personen gedacht, die den Militärdienst nicht mit ihrem Gewissen vereinbaren können. Dafür muss
      ein Gesuch gestellt werden, und der Zivildienst dauert länger als der Militärdienst.
