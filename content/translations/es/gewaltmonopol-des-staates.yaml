    question_de: Wer darf in der Schweiz grundsätzlich körperliche Gewalt anwenden?
    options_de:
      a: Private Sicherheitsunternehmen im Auftrag von Vereinen
      b: Jede Person, die sich bedroht fühlt
      c: Nur der Staat
      d: Jede Gemeinde mit ihren eigenen Bürgermilizen
    explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich darf nur er körperliche
      Gewalt anwenden, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist die Notwehr: Wer
      rechtswidrig angegriffen wird, kann sich verhältnismässig verteidigen, aber die blosse Tatsache,
      sich bedroht zu fühlen, genügt dafür nicht.'
