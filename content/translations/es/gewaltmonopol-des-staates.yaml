id: gewaltmonopol-des-staates
lang: es
source_version: 2
question: ¿Quién puede, en principio, emplear la fuerza física en Suiza?
options:
  a: Las empresas privadas de seguridad por encargo de asociaciones
  b: Cualquier persona que se sienta amenazada
  c: Solo el Estado
  d: Cada municipio (Gemeinde) con sus propias milicias ciudadanas
explanation: 'En Suiza, el Estado tiene el monopolio de la fuerza: en principio, solo él puede emplear
  la fuerza física, por ejemplo a través de la policía o del ejército. Una excepción es la legítima defensa:
  quien sea atacado de forma ilícita puede defenderse de manera proporcionada, pero el mero hecho de sentirse
  amenazado no basta para ello.'
