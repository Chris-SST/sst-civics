id: parlament-zwei-kammern-bund
lang: es
source_version: 1
question: ¿Por qué dos cámaras está formado el Parlamento suizo a nivel federal?
options:
  a: Por el Consejo Federal (Bundesrat) y el Consejo de los Estados (Ständerat)
  b: Por el Consejo Federal y el Consejo Nacional (Nationalrat)
  c: Por el Consejo de los Estados y el Tribunal Federal (Bundesgericht)
  d: Por el Consejo Nacional y el Consejo de los Estados
explanation: 'La Asamblea Federal (Bundesversammlung), el Parlamento de la Confederación, está formada
  por dos cámaras: el Consejo Nacional y el Consejo de los Estados. El Consejo Federal es el Gobierno
  y no forma parte del Parlamento.'
