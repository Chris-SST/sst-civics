id: auslandschweizer-stimmrecht-vom-ausland
lang: es
source_version: 2
question: Una ciudadana suiza vive de forma permanente en el extranjero. ¿Cómo puede participar en las
  elecciones y votaciones federales?
options:
  a: Solo puede votar si viaja a Suiza para ello.
  b: Solo puede participar en las elecciones, pero no en las votaciones.
  c: Puede votar y elegir desde su lugar de residencia en el extranjero, sin viajar a Suiza.
  d: Pierde el derecho de voto y de elección a nivel de la Confederación.
explanation: Los suizos y las suizas residentes en el extranjero pueden elegir y votar a nivel de la Confederación
  sin tener que viajar a Suiza. Para ello, deben estar registrados en la representación suiza competente
  en el extranjero y solicitar a través de ella la inscripción en el registro electoral. Su municipio
  de voto les enviará entonces la documentación para las elecciones y votaciones.
