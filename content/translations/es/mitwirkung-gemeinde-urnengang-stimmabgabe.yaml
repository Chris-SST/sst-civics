    question_de: Wie beteiligen sich die stimmberechtigten Bürgerinnen und Bürger in ihrer Gemeinde politisch
      an den Urnenabstimmungen?
    options_de:
      a: Sie leiten die Sitzungen des Gemeinderats
      b: Sie setzen die Beschlüsse der Gemeinde um
      c: Sie geben ihre Stimme bei Wahlen und Abstimmungen ab
      d: Sie erlassen die Gesetze des Kantons selbst
    explanation_de: Bei Urnenabstimmungen stimmen die Stimmberechtigten über Vorlagen ab und wählen die
