id: mitwirkung-gemeinde-urnengang-stimmabgabe
lang: es
source_version: 1
question: ¿Cómo participan políticamente los ciudadanos con derecho a voto en su municipio (Gemeinde)
  en las votaciones en las urnas?
options:
  a: Dirigen las sesiones del consejo municipal (Gemeinderat)
  b: Ponen en práctica las decisiones del municipio
  c: Emiten su voto en elecciones y votaciones
  d: Promulgan ellos mismos las leyes del cantón
explanation: En las votaciones en las urnas, las personas con derecho a voto votan sobre proyectos y eligen
  a las autoridades. La puesta en práctica de las decisiones es tarea de las autoridades y de la administración.
