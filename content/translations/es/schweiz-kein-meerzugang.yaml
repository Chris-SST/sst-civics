question: ¿Qué afirmación sobre la situación geográfica de Suiza es correcta?
options:
  a: Suiza no tiene acceso directo al mar.
  b: Suiza limita al oeste con el océano Atlántico.
  c: Suiza limita al sur con el mar Mediterráneo.
  d: Suiza limita al norte con el mar del Norte.
explanation: 'Suiza es un país sin litoral: está completamente rodeada por otros países y no tiene costa
  marítima. Es cierto que por el Rin navegan barcos desde Basilea hasta el mar del Norte, pero ningún
  mar limita directamente con Suiza.'
