    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes einen gesetzlichen Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Unternehmen mit mehr als 50 Angestellten arbeiten
      b: Jede erwerbstätige Frau, die ein Kind zur Welt bringt
      c: Nur Frauen, die verheiratet sind
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Das Gesetz sieht für erwerbstätige Mütter einen Anspruch auf Mutterschaftsurlaub und
      auf eine finanzielle Leistung vor. Die Grösse des Unternehmens, die Staatsangehörigkeit und der
      Zivilstand haben darauf keinen Einfluss. Die Leistung wird über die Erwerbsersatzordnung finanziert.
