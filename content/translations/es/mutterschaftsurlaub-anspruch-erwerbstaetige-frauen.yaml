id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
lang: es
source_version: 1
question: ¿Quién tiene en Suiza, tras el nacimiento de un hijo, un derecho legal a la licencia de maternidad?
options:
  a: Solo las mujeres que trabajan en una empresa con más de 50 empleados
  b: Toda mujer con actividad laboral que da a luz a un hijo
  c: Solo las mujeres que están casadas
  d: Solo las mujeres con ciudadanía suiza (Bürgerrecht)
explanation: La ley prevé para las madres con actividad laboral un derecho a la licencia de maternidad
  y a una prestación económica. El tamaño de la empresa, la nacionalidad y el estado civil no influyen
  en ello. La prestación se financia a través del régimen de compensación por pérdida de ingresos (Erwerbsersatzordnung).
