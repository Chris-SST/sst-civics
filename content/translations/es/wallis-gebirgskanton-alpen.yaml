id: wallis-gebirgskanton-alpen
lang: es
source_version: 1
question: ¿Cuál de estos cantones está marcado en gran medida por la montaña?
options:
  a: Basilea-Ciudad
  b: Valais
  c: Turgovia
  d: Ginebra
explanation: En Valais se encuentran muchas cumbres alpinas elevadas, entre ellas la Punta Dufour, la
  montaña más alta de Suiza. Turgovia, Basilea-Ciudad y Ginebra se encuentran más bien en tierras llanas
  o junto a lagos y ríos.
