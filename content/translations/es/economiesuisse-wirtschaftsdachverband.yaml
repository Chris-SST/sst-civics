question: ¿Qué es Economiesuisse?
options:
  a: Una caja de desempleo de la Confederación
  b: La Oficina Federal de Economía
  c: La organización paraguas del sector empresarial que representa los intereses de las empresas
  d: Un sindicato para empleados del comercio minorista
explanation: Economiesuisse es la organización paraguas de la economía suiza y representa los intereses
  de las empresas. No es un organismo estatal ni un sindicato.
