id: franzoesische-besetzung-1798-alte-eidgenossenschaft
lang: es
source_version: 1
question: ¿Qué consecuencia tuvo la entrada de las tropas francesas en Suiza en 1798?
options:
  a: Convirtió a Suiza en una parte de Francia
  b: Reforzó el poder de los antiguos cantones
  c: Condujo a la fundación del Estado federal de 1848
  d: Puso fin al antiguo orden de la antigua Confederación
explanation: Con la ocupación francesa se derrumbó la antigua Confederación. En su lugar surgió la República
  Helvética como Estado unitario. El actual Estado federal no nació hasta 1848.
