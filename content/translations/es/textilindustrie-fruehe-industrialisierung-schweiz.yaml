question: ¿Qué sector económico fue el más importante durante la primera industrialización de Suiza?
options:
  a: La industria relojera
  b: La industria farmacéutica
  c: La industria textil
  d: La industria de maquinaria
explanation: En la primera industrialización, la industria textil marcó la economía suiza, por ejemplo
  con hilanderías, tejedurías y bordados. Un ejemplo conocido son los bordados de San Galo, que eran muy
  demandados en todo el mundo. Otros sectores no adquirieron tanta importancia hasta más tarde.
