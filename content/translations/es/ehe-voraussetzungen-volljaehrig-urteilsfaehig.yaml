id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: es
source_version: 1
question: ¿Qué requisitos deben cumplir las personas para poder casarse en Suiza?
options:
  a: Deben tener la ciudadanía (Bürgerrecht) suiza y ser mayores de edad
  b: Deben ser mayores de edad y capaces de actuar con raciocinio
  c: Deben convivir desde hace al menos cinco años
  d: Deben pertenecer a la misma religión
explanation: Puede casarse quien sea mayor de edad y capaz de discernimiento. Ser capaz de discernimiento
  significa que se puede actuar con raciocinio. La nacionalidad, la religión o una determinada duración
  de la convivencia no son requisitos.
