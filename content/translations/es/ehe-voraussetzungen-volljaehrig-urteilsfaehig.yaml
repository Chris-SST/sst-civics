    question_de: Welche Voraussetzungen müssen Personen erfüllen, um in der Schweiz heiraten zu können?
    options_de:
      a: Sie müssen das Schweizer Bürgerrecht haben und volljährig sein
      b: Sie müssen volljährig und fähig sein, vernunftgemäss zu handeln
      c: Sie müssen seit mindestens fünf Jahren zusammenleben
      d: Sie müssen derselben Religion angehören
    explanation_de: Heiraten kann, wer volljährig und urteilsfähig ist. Urteilsfähig zu sein bedeutet,
      dass man vernunftgemäss handeln kann. Die Staatsangehörigkeit, die Religion oder eine bestimmte
      Dauer des Zusammenlebens sind keine Voraussetzungen.
