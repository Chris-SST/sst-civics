id: notruf-144-rettungsdienst
lang: es
source_version: 1
question: ¿Qué número de teléfono se marca en Suiza en caso de una emergencia médica para llamar al servicio
  de rescate?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: El número 144 es el número de emergencia del servicio de rescate en caso de emergencias médicas.
  El 117 corresponde a la policía y el 118 a los bomberos. El 145 es el número de Tox Info Suisse en caso
  de intoxicaciones.
