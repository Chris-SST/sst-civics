question: ¿En qué localidad suiza se celebra regularmente la reunión anual del Foro Económico Mundial
  (WEF)?
options:
  a: En Davos
  b: En Lucerna
  c: En Montreux
  d: En Interlaken
explanation: El Foro Económico Mundial se reúne regularmente en Davos, en el cantón de los Grisones. Allí
