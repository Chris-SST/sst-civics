    question_de: Ein Arbeitnehmer oder eine Arbeitnehmerin übt neben der Arbeit ein öffentliches Amt aus,
      zum Beispiel in der Schulbehörde der Gemeinde. Was gewährt ihm oder ihr der Arbeitgeber dafür normalerweise?
    options_de:
      a: Eine zusätzliche Gratifikation zum Lohn
      b: Eine Beförderung
      c: Bezahlte freie Zeit
      d: Nichts; für das Amt muss man Ferien nehmen
    explanation_de: Wer ein öffentliches Amt ausübt, erhält dafür in der Regel vom Arbeitgeber bezahlte
      freie Zeit. Die genaue Menge hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von anderen
      Vorschriften ab. Für ein Amt wird weder eine Gratifikation noch eine Beförderung gewährt, und normalerweise
      muss man dafür auch keine Ferien nehmen.
