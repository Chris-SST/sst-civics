id: oeffentliches-amt-bezahlte-freizeit
lang: es
source_version: 3
question: Un empleado o una empleada ejerce, además de su trabajo, un cargo público, por ejemplo en la
  autoridad escolar del municipio (Gemeinde). ¿Qué le concede normalmente el empleador por ello?
options:
  a: Una bonificación adicional al salario
  b: Un ascenso
  c: Tiempo libre remunerado
  d: Nada; para el cargo hay que tomar vacaciones
explanation: Quien ejerce un cargo público recibe por ello, por regla general, tiempo libre remunerado
  por parte del empleador. La cantidad exacta depende del contrato de trabajo, del convenio colectivo
  de trabajo o de otras normas. Por un cargo no se concede ni una bonificación ni un ascenso, y normalmente
  tampoco hay que tomar vacaciones para ejercerlo.
