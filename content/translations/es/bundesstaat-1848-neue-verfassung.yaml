id: bundesstaat-1848-neue-verfassung
lang: es
source_version: 1
question: ¿Qué surgió en Suiza en el año 1848?
options:
  a: La República Helvética con un gobierno central
  b: La confederación de Estados bajo supervisión francesa
  c: El Estado federal moderno con una nueva constitución
  d: La Confederación de los tres cantones originarios
explanation: En 1848, los cantones se dieron una Constitución Federal y fundaron el Estado federal moderno.
  Este Estado combinó tareas comunes de la Confederación con la autonomía de los cantones. Esta constitución
  es la base de la Suiza actual.
