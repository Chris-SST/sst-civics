question: ¿Qué país se encuentra al sur de Suiza y hace frontera con ella?
options:
  a: España
  b: Italia
  c: Eslovenia
  d: Francia
explanation: Italia es el país vecino de Suiza al sur. La frontera atraviesa, entre otros, los Alpes,
