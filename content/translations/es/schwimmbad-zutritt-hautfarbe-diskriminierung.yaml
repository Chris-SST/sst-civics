id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: es
source_version: 1
question: Una piscina pública niega la entrada a una persona por el color de su piel. ¿Qué principio de
  la Constitución Federal se vulnera con ello?
options:
  a: La libertad económica
  b: La prohibición de discriminación
  c: El derecho de voto
  d: El derecho al matrimonio y a la familia
explanation: La Constitución Federal prohíbe en su artículo 8 la discriminación, por ejemplo por origen
  o por raza. Por ello, nadie puede ser tratado peor.
