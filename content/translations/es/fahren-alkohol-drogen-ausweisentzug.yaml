id: fahren-alkohol-drogen-ausweisentzug
lang: es
source_version: 2
question: ¿Qué riesgo corre una persona que conduce un coche bajo los efectos del alcohol o de las drogas?
options:
  a: La pérdida del derecho de voto
  b: La expulsión del municipio de residencia
  c: La retirada del seguro de enfermedad
  d: La retirada del permiso de conducir
explanation: Quien no está en condiciones de conducir pone en peligro a otras personas en la circulación
  vial. Por eso, la autoridad puede retirar el permiso de conducir. Además, pueden añadirse multas u otras
  sanciones.
