    question_de: Welche Bedeutung haben regelmässige Wahlen in einer Demokratie?
    options_de:
      a: Die Bevölkerung entscheidet selbst, wer sie vertritt.
      b: Die Regierung ernennt selbst ihre Nachfolger.
      c: Die Parteien legen die Vertretung unter sich fest.
      d: Das Gericht entscheidet, wer ein Amt übernimmt.
    explanation_de: Bei den Wahlen entscheiden die stimmberechtigten Personen, wer sie im Parlament oder
      in der Regierung vertritt. Da die Wahlen regelmässig stattfinden, können sie die Personen in ihrem
      Amt bestätigen oder durch andere ersetzen. So behält die Bevölkerung ihren Einfluss auf die Politik.
