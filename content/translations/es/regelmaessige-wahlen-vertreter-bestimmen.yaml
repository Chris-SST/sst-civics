id: regelmaessige-wahlen-vertreter-bestimmen
lang: es
source_version: 1
question: ¿Qué importancia tienen las elecciones periódicas en una democracia?
options:
  a: La población decide por sí misma quién la representa.
  b: El gobierno nombra por sí mismo a sus sucesores.
  c: Los partidos fijan la representación entre ellos.
  d: El tribunal decide quién asume un cargo.
explanation: En las elecciones, las personas con derecho a voto deciden quién las representa en el parlamento
  o en el gobierno. Como las elecciones se celebran periódicamente, pueden confirmar a las personas en
  su cargo o sustituirlas por otras. Así, la población conserva su influencia sobre la política.
