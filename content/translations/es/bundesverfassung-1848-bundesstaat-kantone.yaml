question: ¿Qué cambió para Suiza con la Constitución Federal de 1848?
options:
  a: Volvió a ser una confederación de Estados poco cohesionada
  b: Se convirtió en una monarquía con un rey
  c: Se convirtió en un Estado federal en el que los cantones siguen siendo autónomos
  d: Se convirtió en un Estado unitario sin cantones
explanation: En 1848 surgió el Estado federal moderno, con instituciones comunes. Sin embargo, los cantones
  conservaron competencias propias y una estatalidad propia. Este reparto caracteriza a Suiza hasta el
  día de hoy.
