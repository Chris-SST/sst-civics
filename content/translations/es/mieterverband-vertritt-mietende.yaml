id: mieterverband-vertritt-mietende
lang: es
source_version: 1
question: ¿Qué función tiene la asociación de inquilinos?
options:
  a: Representa los intereses de los propietarios de viviendas
  b: Fija los alquileres de todas las viviendas
  c: Alquila viviendas por encargo del cantón
  d: Representa los intereses de los inquilinos
explanation: La asociación de inquilinos es una organización que defiende los intereses de los inquilinos.
  Asesora a sus miembros, por ejemplo, en cuestiones de derecho de arrendamiento. Los intereses de los
  propietarios de viviendas los representan otras asociaciones.
