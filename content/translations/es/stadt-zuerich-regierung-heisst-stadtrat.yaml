question: ¿Cómo se llama el gobierno de la ciudad de Zúrich?
options:
  a: Consejo de la Ciudad (Stadtrat)
  b: Consejo de distrito (Bezirksrat)
  c: Consejo municipal (Gemeinderat)
  d: Parlamento de la ciudad (Stadtparlament)
explanation: El poder ejecutivo de la ciudad de Zúrich se llama Consejo de la Ciudad. El consejo municipal,
  en cambio, es el parlamento de la ciudad.
