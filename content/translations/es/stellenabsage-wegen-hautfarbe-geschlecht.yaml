id: stellenabsage-wegen-hautfarbe-geschlecht
lang: es
source_version: 2
question: Una mujer se postula para un puesto de trabajo. Es rechazada únicamente por ser mujer. ¿Qué
  derecho fundamental se vulnera con ello?
options:
  a: La libertad de establecimiento
  b: La libertad de reunión
  c: La igualdad ante la ley y la prohibición de discriminación
  d: La protección de la esfera privada
explanation: El artículo 8 de la Constitución Federal establece que todas las personas son iguales ante
  la ley y que la mujer y el hombre tienen los mismos derechos. Nadie puede ser discriminado, por ejemplo,
  por su origen, su raza o su sexo. Por ello, quien rechaza a una candidata únicamente por su sexo vulnera
  la igualdad ante la ley y la prohibición de discriminación.
