    question_de: Eine Frau bewirbt sich um eine Arbeitsstelle. Sie wird einzig deshalb abgelehnt, weil
      sie eine Frau ist. Welches Grundrecht wird dadurch verletzt?
    options_de:
      a: Die Niederlassungsfreiheit
      b: Die Versammlungsfreiheit
      c: Die Rechtsgleichheit und das Diskriminierungsverbot
      d: Der Schutz der Privatsphäre
    explanation_de: Artikel 8 der Bundesverfassung legt fest, dass alle Menschen vor dem Gesetz gleich
      sind und dass Frau und Mann gleiche Rechte haben. Niemand darf zum Beispiel wegen seiner Herkunft,
      seiner Rasse oder seines Geschlechts diskriminiert werden. Daher verletzt, wer eine Bewerberin einzig
      wegen ihres Geschlechts ablehnt, die Rechtsgleichheit und das Diskriminierungsverbot.
