id: fahrausweis-personenwagen-strassenverkehrsamt-zuerich
lang: es
source_version: 1
question: ¿Qué organismo expide en el cantón de Zúrich el permiso de conducir para turismos?
options:
  a: El tribunal de distrito
  b: La oficina de tráfico del cantón (Strassenverkehrsamt)
  c: La policía municipal del municipio (Gemeinde) de residencia
  d: La Oficina Federal de Carreteras
explanation: En el cantón de Zúrich, la oficina de tráfico (Strassenverkehrsamt) es la competente para
  los permisos de conducir. Pertenece a la Dirección de Seguridad. Los municipios y la Confederación no
  expiden permisos de conducir.
