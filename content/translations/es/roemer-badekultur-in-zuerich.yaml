question: ¿Qué novedad llevaron los romanos a Zúrich?
options:
  a: La imprenta
  b: Los gremios
  c: La cultura de los baños
  d: La Reforma
explanation: Los romanos introdujeron en Zúrich la cultura de los baños, es decir, baños públicos siguiendo
  el modelo romano. Los gremios, la imprenta y la Reforma pertenecen solo a la Edad Media y a la primera
  Edad Moderna.
