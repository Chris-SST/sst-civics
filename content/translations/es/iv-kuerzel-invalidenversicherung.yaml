id: iv-kuerzel-invalidenversicherung
lang: es
source_version: 1
question: ¿Qué significa la abreviatura «IV» (IV) en el sistema de seguros sociales suizo?
options:
  a: Seguro nacional (Inlandversicherung)
  b: Seguro de invalidez (Invalidenversicherung)
  c: Seguro de integración (Integrationsversicherung)
  d: Seguro individual (Individualversicherung)
explanation: IV significa seguro de invalidez (Invalidenversicherung). Forma parte del primer pilar de
  la previsión para la vejez y ayuda a las personas con limitaciones de salud, por ejemplo mediante medidas
  de integración o rentas.
