id: groesster-kanton-nach-flaeche
lang: es
source_version: 1
question: ¿Qué cantón tiene la mayor superficie de todos los cantones suizos?
options:
  a: Tesino
  b: Valais
  c: Berna
  d: Grisones
explanation: Los Grisones son el cantón más grande de Suiza por superficie. Se encuentra por completo
  en los Alpes y tiene muchos valles y montañas. También Valais, Berna y Tesino son grandes, pero más
  pequeños que los Grisones.
