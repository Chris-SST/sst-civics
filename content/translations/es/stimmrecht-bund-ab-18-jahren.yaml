    question_de: Wer darf auf Bundesebene abstimmen und wählen?
    options_de:
      a: Die Schweizer Bürgerinnen und Bürger ab 20 Jahren
      b: Alle Personen mit Niederlassungsbewilligung (Ausweis C) ab 18 Jahren
      c: Die Schweizer Bürgerinnen und Bürger ab 18 Jahren
      d: Alle Personen mit Wohnsitz in der Schweiz ab 16 Jahren
    explanation_de: Auf Bundesebene dürfen Schweizer und Schweizerinnen ab ihrem 18. Geburtstag abstimmen
      und wählen. Ausländer und Ausländerinnen haben dieses Recht auf Bundesebene nicht, auch nicht mit
      einer Niederlassungsbewilligung. Auch Schweizer und Schweizerinnen, die im Ausland leben, können
      teilnehmen, wenn sie sich in das Stimmregister eintragen.
