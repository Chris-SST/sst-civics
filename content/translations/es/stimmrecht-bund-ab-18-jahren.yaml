id: stimmrecht-bund-ab-18-jahren
lang: es
source_version: 2
question: ¿Quién puede votar y elegir a nivel de la Confederación?
options:
  a: Los ciudadanos suizos a partir de los 20 años
  b: Todas las personas con permiso de establecimiento (permiso C) (Niederlassungsbewilligung) a partir
    de los 18 años
  c: Los ciudadanos suizos a partir de los 18 años
  d: Todas las personas con domicilio en Suiza a partir de los 16 años
explanation: En la Confederación, los suizos y las suizas pueden votar y elegir a partir de su 18.º cumpleaños.
  Los extranjeros y las extranjeras no tienen este derecho a nivel de la Confederación, ni siquiera con
  un permiso de establecimiento. También los suizos y las suizas que viven en el extranjero pueden participar
  si se inscriben en el registro electoral.
