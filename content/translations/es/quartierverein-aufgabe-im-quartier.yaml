id: quartierverein-aufgabe-im-quartier
lang: es
source_version: 1
question: ¿Cuál es una tarea típica de una asociación de barrio (Quartierverein) en un municipio (Gemeinde)
  o ciudad del cantón de Zúrich?
options:
  a: Representa los intereses de la población del barrio ante las autoridades y fomenta la convivencia.
  b: Lleva el registro de habitantes del barrio.
  c: Cobra impuestos a los habitantes del barrio.
  d: Autoriza las solicitudes de construcción en el barrio.
explanation: Una asociación de barrio es una agrupación voluntaria de habitantes. Presenta ante las autoridades
  las inquietudes del barrio y organiza actos que refuerzan la convivencia. Las tareas de autoridad, como
  los impuestos, los permisos de construcción o el registro de habitantes, corresponden al municipio.
