    question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Gemeinde oder Stadt des
      Kantons Zürich?
    options_de:
      a: Er vertritt die Interessen der Bevölkerung des Quartiers gegenüber den Behörden und fördert das
        Zusammenleben.
      b: Er führt das Einwohnerregister des Quartiers.
      c: Er erhebt Steuern bei den Einwohnerinnen und Einwohnern des Quartiers.
      d: Er bewilligt die Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Einwohnerinnen und Einwohnern.
      Er bringt die Anliegen des Quartiers bei den Behörden vor und organisiert Veranstaltungen, die das
      Zusammenleben stärken. Behördliche Aufgaben wie Steuern, Baubewilligungen oder das Einwohnerregister
      sind Sache der Gemeinde.
