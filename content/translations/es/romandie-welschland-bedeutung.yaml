id: romandie-welschland-bedeutung
lang: es
source_version: 1
question: ¿Qué se entiende por el término «Romandía» o «Welschland»?
options:
  a: La parte de Suiza de habla italiana
  b: La parte de Suiza de habla francesa
  c: La parte de Suiza de habla retorrománica
  d: La parte de Suiza de habla alemana
explanation: Con Romandía o Welschland se designan las regiones de Suiza en las que se habla francés.
  Entre ellas se encuentran, por ejemplo, los cantones de Ginebra y Vaud. La parte de habla italiana es
  sobre todo el Tesino.
