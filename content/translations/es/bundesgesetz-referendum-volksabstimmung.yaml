    question_de: Was gilt für ein Bundesgesetz, das beide Kammern des Parlaments verabschiedet haben?
    options_de:
      a: Die stimmberechtigten Bürgerinnen und Bürger können mittels eines Referendums eine Volksabstimmung
        darüber verlangen.
      b: Der Bundesrat muss es anschliessend dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass das Volk mitreden kann.
      d: Die Regierungen der Kantone müssen es zuerst, eine nach der anderen, genehmigen.
    explanation_de: Nach dem Beschluss beider Kammern unterstehen die Bundesgesetze dem fakultativen Referendum.
      Kommt dieses zustande, entscheiden die stimmberechtigten Bürgerinnen und Bürger an der Urne über
      das Gesetz.
