id: bundesgesetz-referendum-volksabstimmung
lang: es
source_version: 1
question: ¿Qué se aplica a una ley federal que han aprobado ambas cámaras del Parlamento?
options:
  a: Los ciudadanos con derecho a voto pueden exigir una votación popular sobre ella mediante un referéndum.
  b: El Consejo Federal (Bundesrat) debe presentarla después al Tribunal Federal (Bundesgericht) para
    su aprobación.
  c: Siempre entra en vigor de inmediato, sin que el pueblo pueda opinar.
  d: Los gobiernos de los cantones deben aprobarla primero, uno por uno.
explanation: Tras la decisión de ambas cámaras, las leyes federales están sujetas al referéndum facultativo.
  Si este se logra, los ciudadanos con derecho a voto deciden en las urnas sobre la ley.
