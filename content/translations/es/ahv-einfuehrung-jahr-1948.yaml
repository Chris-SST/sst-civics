id: ahv-einfuehrung-jahr-1948
lang: es
source_version: 1
question: ¿En qué año se introdujo el seguro de vejez y supervivencia (AHV), el seguro estatal de pensiones
  para la vejez y los supervivientes?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: El seguro de vejez y supervivencia comenzó su actividad en 1948, después de que el pueblo
  aprobara la ley en 1947. Constituye el primer pilar del sistema suizo de los tres pilares. Garantiza
  el sustento económico en la vejez y para los supervivientes.
