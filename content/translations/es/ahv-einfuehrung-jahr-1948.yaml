    question_de: In welchem Jahr wurde die Alters- und Hinterlassenenversicherung (AHV), die staatliche
      Rentenversicherung für das Alter und die Hinterlassenen, eingeführt?
    options_de:
      a: '1975'
      b: '1918'
      c: '1930'
      d: '1948'
    explanation_de: Die Alters- und Hinterlassenenversicherung nahm 1948 ihre Tätigkeit auf, nachdem das
      Volk das Gesetz 1947 angenommen hatte. Sie bildet die erste Säule des Schweizer Drei-Säulen-Systems.
      Sie garantiert den wirtschaftlichen Lebensunterhalt im Alter und für die Hinterlassenen.
