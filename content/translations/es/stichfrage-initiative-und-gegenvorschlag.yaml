id: stichfrage-initiative-und-gegenvorschlag
lang: es
source_version: 1
question: En una votación sobre una iniciativa popular (Volksinitiative) y un contraproyecto directo hay
  una pregunta de desempate. ¿Para qué sirve?
options:
  a: Decide si la votación debe repetirse
  b: Decide si los cantones pueden siquiera participar en la votación
  c: Decide qué proyecto se aplica si se aprueban ambos
  d: Decide si las firmas se vuelven a comprobar
explanation: Las personas con derecho a voto pueden aprobar tanto la iniciativa como el contraproyecto.
  Con la pregunta de desempate indican qué proyecto debe entrar en vigor en caso de que se aprueben ambos.
  Así, los votos no se pierden entre dos proyectos similares.
