id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: es
source_version: 1
question: La previsión para la vejez en Suiza se basa en tres pilares. ¿Qué institución constituye el
  segundo pilar?
options:
  a: 'Las prestaciones complementarias del seguro de vejez y supervivencia (AVS; en alemán: AHV)'
  b: El seguro de vejez y supervivencia (pensión estatal)
  c: La caja de pensiones (previsión profesional)
  d: La cuenta de ahorro privada con deducción fiscal (pilar 3a)
explanation: La caja de pensiones forma parte de la previsión profesional y constituye el segundo pilar.
  Complementa el seguro de vejez y supervivencia, para que las personas jubiladas puedan mantener de forma
  adecuada su nivel de vida habitual. El seguro de vejez y supervivencia es el primer pilar y la previsión
  privada, el tercero.
