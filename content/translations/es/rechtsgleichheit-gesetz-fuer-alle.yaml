id: rechtsgleichheit-gesetz-fuer-alle
lang: es
source_version: 1
question: ¿Qué significa el principio de la igualdad ante la ley?
options:
  a: Todos los cantones tienen las mismas leyes.
  b: Todas las personas tienen los mismos cargos políticos.
  c: Todas las personas tienen los mismos ingresos.
  d: La ley se aplica a todas las personas por igual.
explanation: La igualdad ante la ley está recogida en el artículo 8 de la Constitución Federal. Todas
  las personas son iguales ante la ley y nadie puede ser discriminado, por ejemplo, por su origen o por
  su sexo. Esto no significa que todas las personas posean la misma cantidad de bienes.
