    question_de: Was bedeutet der Grundsatz der Gleichheit vor dem Gesetz?
    options_de:
      a: Alle Kantone haben die gleichen Gesetze.
      b: Alle Personen haben die gleichen politischen Ämter.
      c: Alle Personen haben das gleiche Einkommen.
      d: Das Gesetz wird auf alle Personen gleich angewendet.
    explanation_de: Die Gleichheit vor dem Gesetz ist in Artikel 8 der Bundesverfassung festgehalten.
      Alle Personen sind vor dem Gesetz gleich und niemand darf zum Beispiel wegen seiner Herkunft oder
      seines Geschlechts diskriminiert werden. Das bedeutet nicht, dass alle Personen die gleiche Menge
      an Gütern besitzen.
