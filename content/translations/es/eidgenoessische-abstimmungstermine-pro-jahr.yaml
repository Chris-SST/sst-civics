    explanation_de: Für die eidgenössischen Volksabstimmungen sind bis zu vier Abstimmungssonntage pro
      Jahr vorgesehen. An einem einzigen Datum wird oft über mehrere Vorlagen gleichzeitig abgestimmt.
      Dagegen finden alle vier Jahre die Wahlen in den Nationalrat statt, die keine Abstimmungen sind.
