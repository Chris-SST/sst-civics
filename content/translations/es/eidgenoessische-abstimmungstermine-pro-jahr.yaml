id: eidgenoessische-abstimmungstermine-pro-jahr
lang: es
source_version: 1
question: ¿Cuántas veces al año se celebran normalmente en Suiza votaciones populares federales?
options:
  a: Una vez
  b: Solo cada cuatro años
  c: Hasta cuatro veces
  d: Todos los meses
explanation: Para las votaciones populares federales se prevén hasta cuatro domingos de votación al año.
  En una misma fecha a menudo se vota sobre varios proyectos a la vez. En cambio, cada cuatro años se
  celebran las elecciones al Consejo Nacional (Nationalrat), que no son votaciones.
