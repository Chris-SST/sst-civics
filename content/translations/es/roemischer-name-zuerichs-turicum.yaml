question: ¿Cuál era el nombre romano de Zúrich?
options:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
explanation: 'Los romanos llamaron Turicum a su asentamiento y puesto aduanero junto al río Limmat. De
  ahí se desarrolló más tarde el nombre de Zúrich. Los otros nombres corresponden a lugares romanos situados
  en la actual Suiza: Windisch, Augst y Avenches.'
