id: hoechster-gipfel-der-schweiz
lang: es
source_version: 2
question: ¿Cómo se llama la cumbre más alta de Suiza?
options:
  a: Piz Bernina
  b: Matterhorn
  c: Dufourspitze
  d: Jungfrau
explanation: La Dufourspitze, en el macizo del Monte Rosa, en el Valais, es la cumbre más alta de Suiza,
  con unos 4634 metros. El Matterhorn es más conocido, pero más bajo. El Piz Bernina, en los Grisones,
  es la cumbre más alta de los Alpes orientales.
