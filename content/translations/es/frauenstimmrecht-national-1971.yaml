id: frauenstimmrecht-national-1971
lang: es
source_version: 2
question: ¿Desde qué año pueden las mujeres votar y participar en votaciones a nivel de la Confederación
  en Suiza?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: En 1971, los hombres suizos aprobaron en una votación popular el derecho de voto de las mujeres
  a nivel de la Confederación. Desde entonces, las mujeres pueden votar, participar en votaciones y presentarse
  como candidatas a nivel nacional. Los cantones introdujeron el derecho de voto de las mujeres en momentos
  distintos, algunos ya antes de 1971; Appenzell Rodas Interiores (Appenzell Innerrhoden) fue el último
  cantón, solo en 1990.
