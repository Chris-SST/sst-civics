    question_de: Seit welchem Jahr dürfen Frauen in der Schweiz auf Ebene des Bundes wählen und abstimmen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: 1971 nahmen die Schweizer Männer in einer Volksabstimmung das Stimmrecht der Frauen
      auf Bundesebene an. Seitdem können Frauen auf nationaler Ebene wählen, abstimmen und sich als Kandidatinnen
      aufstellen lassen. Die Kantone führten das Frauenstimmrecht zu unterschiedlichen Zeitpunkten ein,
      einige bereits vor 1971; Appenzell Innerrhoden war der letzte Kanton, erst im Jahr 1990.
