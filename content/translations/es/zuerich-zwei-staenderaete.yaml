id: zuerich-zwei-staenderaete
lang: es
source_version: 1
question: ¿Cuántos representantes envía el cantón de Zúrich al Consejo de los Estados (Ständerat)?
options:
  a: Un representante
  b: Cuatro representantes
  c: Seis representantes
  d: Dos representantes
explanation: El cantón de Zúrich es un cantón completo y tiene dos escaños en el Consejo de los Estados.
  Las consejeras y los consejeros de los Estados son elegidos por el electorado del cantón. Solo los semicantones
  tienen un representante cada uno.
