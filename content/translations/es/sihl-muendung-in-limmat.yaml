id: sihl-muendung-in-limmat
lang: es
source_version: 1
question: ¿En qué río desemboca el Sihl en pleno centro de la ciudad de Zúrich?
options:
  a: En el Töss
  b: En el Limmat
  c: En el Glatt
  d: En el Aare
explanation: El Sihl atraviesa Zúrich y desemboca en el Limmat en el Platzspitz. El Glatt y el Töss son
  otros ríos zuriqueses que desembocan en el Rin. El Aare recibe las aguas del Limmat mucho más abajo,
  en el cantón de Argovia.
