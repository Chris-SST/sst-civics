id: nationalhymne-schweizerpsalm
lang: es
source_version: 1
question: ¿Cómo se llama el himno nacional de Suiza?
options:
  a: «Rufst du, mein Vaterland»
  b: «Lueget vo Bärg und Tal»
  c: «Vo Luzern gäg Weggis zue»
  d: «Schweizerpsalm»
explanation: El himno nacional de Suiza es el «Schweizerpsalm». El Consejo Federal (Bundesrat) lo declaró
  himno nacional de forma definitiva en 1981. Antes se cantaba con frecuencia «Rufst du, mein Vaterland».
