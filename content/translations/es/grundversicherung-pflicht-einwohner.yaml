id: grundversicherung-pflicht-einwohner
lang: es
source_version: 1
question: ¿Para quién rige en Suiza el seguro básico obligatorio para tratamientos médicos?
options:
  a: Solo para las personas con ciudadanía (Bürgerrecht) suiza
  b: Solo para las personas con actividad laboral que perciben un salario
  c: Solo para las personas con ingresos bajos
  d: Para todos los habitantes de Suiza
explanation: El seguro obligatorio de atención médica rige para todas las personas que residen en Suiza.
  La ciudadanía, la actividad laboral y los ingresos no tienen ninguna importancia a este respecto.
