id: zuercher-parlament-bezeichnung-kantonsrat
lang: es
source_version: 1
question: ¿Cómo se llama el Parlamento del cantón de Zúrich?
options:
  a: Grosser Rat
  b: Landrat
  c: Consejo municipal (Gemeinderat)
  d: Consejo Cantonal (Kantonsrat)
explanation: El Parlamento del cantón de Zúrich se llama Consejo Cantonal. Otros cantones utilizan otras
  denominaciones, por ejemplo Grosser Rat o Landrat. El consejo municipal, en cambio, es una autoridad
  a nivel de municipio (Gemeinde).
