id: stimmabgabe-per-post-mehrheit
lang: es
source_version: 1
question: ¿Cómo emiten hoy su voto la mayoría de las personas con derecho a voto en Suiza en las votaciones
  y elecciones?
options:
  a: Lo emiten el domingo de la votación en la asamblea municipal (Gemeindeversammlung).
  b: Lo depositan personalmente en la urna el domingo de la votación.
  c: Lo envían por correo al municipio (Gemeinde).
  d: Lo emiten a través de una página web de la Confederación.
explanation: La mayoría de las personas con derecho a voto vota por correspondencia, es decir, por vía
  postal. Acudir a la urna el domingo de la votación ya no es lo habitual para la mayoría.
