id: obligatorische-schulzeit-dauer-schweiz
lang: es
source_version: 2
question: ¿Cuántos años dura la escolaridad obligatoria en el cantón de Zúrich, si se cuenta el jardín
  de infancia (Kindergarten)?
options:
  a: Once años
  b: Diez años
  c: Doce años
  d: Nueve años
explanation: 'En el cantón de Zúrich, todos los niños asisten obligatoriamente a la escuela durante once
  años: dos años de jardín de infancia, seis años de escuela primaria y tres años de secundaria I (Sekundarstufe
  I). La mayoría de los cantones han unificado esta duración mediante el concordato HarmoS. Sin embargo,
  algunos cantones no se han adherido, y en ellos a veces solo es obligatorio un año de jardín de infancia.'
