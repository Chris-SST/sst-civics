id: sozialhilfe-bei-ungenuegendem-einkommen
lang: es
source_version: 1
question: ¿Qué ofrece el municipio (Gemeinde) cuando los ingresos y el patrimonio de una persona no son
  suficientes para vivir?
options:
  a: Asistencia social
  b: Un permiso de construcción
  c: Una naturalización
  d: Una beca de la escuela obligatoria
explanation: Quien no puede pagar su sustento con sus propios medios tiene derecho a recibir apoyo de
  la asistencia social. Esta la presta el municipio en el que vive la persona. Es la última red de la
  seguridad social.
