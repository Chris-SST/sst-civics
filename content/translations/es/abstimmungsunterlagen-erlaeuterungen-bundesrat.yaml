id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: es
source_version: 1
question: ¿Qué reciben las personas con derecho a voto, junto con el material de votación, antes de una
  votación federal para poder informarse sobre los proyectos sometidos a votación?
options:
  a: Las explicaciones del Consejo Federal (Bundesrat)
  b: Una opinión del Tribunal Federal (Bundesgericht)
  c: Un dictamen del propio cantón
  d: La lista electoral de todos los partidos
explanation: El Consejo Federal explica en las explicaciones, a menudo llamadas folleto de votación (Abstimmungsbüchlein),
  de qué trata cada proyecto. También figuran en ellas los argumentos del comité de la iniciativa o del
  referéndum, así como la recomendación del Consejo Federal y del Parlamento. De este modo, todas las
  personas pueden formarse una opinión propia.
