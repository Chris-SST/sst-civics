    question_de: Was erhalten die Stimmberechtigten zusammen mit dem Abstimmungsmaterial vor einer eidgenössischen
      Abstimmung, um sich über die zur Abstimmung gebrachten Vorlagen informieren zu können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Eine Stellungnahme des Bundesgerichts
      c: Ein Gutachten des Kantons selbst
      d: Die Wahlliste aller Parteien
    explanation_de: Der Bundesrat erläutert in den Erläuterungen, die oft Abstimmungsbüchlein genannt
      werden, worum es bei jeder Vorlage geht. Darin finden sich auch die Argumente des Initiativ- oder
      Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments. So kann sich jede Person
      eine eigene Meinung bilden.
