id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: es
source_version: 1
question: ¿Qué regulación rige en Suiza desde 2002 para la interrupción del embarazo durante las primeras
  doce semanas?
options:
  a: En principio, la interrupción del embarazo está prohibida durante este periodo.
  b: La mujer puede decidir por sí misma sobre la interrupción del embarazo.
  c: El marido o la pareja debe dar su consentimiento a la interrupción del embarazo.
  d: Un tribunal debe autorizar la interrupción del embarazo.
explanation: Desde 2002 rige el denominado régimen de plazos. Según este, la mujer decide por sí misma
  durante las primeras doce semanas de embarazo. Para ello debe alegar por escrito una situación de angustia.
