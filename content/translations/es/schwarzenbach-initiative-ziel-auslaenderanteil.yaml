id: schwarzenbach-initiative-ziel-auslaenderanteil
lang: es
source_version: 1
question: ¿Qué quería la iniciativa Schwarzenbach, sobre la que se votó en 1970?
options:
  a: Quería facilitar la naturalización de todos los extranjeros.
  b: Quería prohibir la inmigración únicamente procedente de Italia.
  c: Quería limitar la proporción de extranjeros que vivían en Suiza.
  d: Quería introducir el derecho de voto para los extranjeros.
explanation: La iniciativa exigía limitar la proporción de extranjeros en Suiza. Fue rechazada por el
  pueblo en 1970. Muestra cuánto se debatía entonces la inmigración.
