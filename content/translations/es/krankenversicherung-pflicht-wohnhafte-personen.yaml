id: krankenversicherung-pflicht-wohnhafte-personen
lang: es
source_version: 1
question: ¿Qué se aplica a las personas que residen en Suiza en relación con el seguro de enfermedad?
options:
  a: Solo tienen que asegurarse si trabajan en Suiza
  b: Están obligadas por ley a contratar un seguro de enfermedad
  c: Solo tienen que asegurarse si tienen más de 50 años
  d: Pueden decidir libremente si desean asegurarse
explanation: La Ley del Seguro de Enfermedad obliga a toda persona con domicilio en Suiza a tener un seguro
  de enfermedad. Hay que asegurarse dentro de los tres meses siguientes al nacimiento o a la fijación
  del domicilio.
