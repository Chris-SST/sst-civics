id: armee-zustaendigkeit-bund
lang: es
source_version: 1
question: ¿Qué nivel del Estado es competente en materia de ejército?
options:
  a: Los cantones
  b: La Confederación
  c: Los distritos
  d: Los municipios (Gemeinden)
explanation: Los asuntos militares son competencia de la Confederación. Esta regula el ejército y sus
  tareas en la Constitución Federal y en las leyes federales. Los cantones participan en la ejecución,
  por ejemplo, en el reclutamiento.
