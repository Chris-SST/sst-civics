id: schienennetz-dichte-weltweit
lang: es
source_version: 1
question: ¿Por qué es conocida la red ferroviaria suiza en la comparación internacional?
options:
  a: Es la red ferroviaria más densa del mundo.
  b: Es la única red ferroviaria que discurre íntegramente por túneles.
  c: Es la red ferroviaria más larga de Europa.
  d: Es la red ferroviaria más antigua del mundo.
explanation: En una superficie pequeña hay muchísimas líneas de tren y estaciones. Por eso la red suiza
  se considera la más densa del mundo. Sin embargo, la densidad no dice nada sobre la longitud absoluta.
