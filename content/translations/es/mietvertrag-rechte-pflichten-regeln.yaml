id: mietvertrag-rechte-pflichten-regeln
lang: es
source_version: 1
question: ¿Qué se establece en un contrato de arrendamiento?
options:
  a: Los derechos de los vecinos en el inmueble
  b: El importe de los impuestos de los arrendatarios
  c: Las obligaciones del municipio (Gemeinde) hacia los arrendatarios
  d: Los derechos y obligaciones de los arrendadores y de los arrendatarios
explanation: El contrato de arrendamiento regula la relación entre la persona que arrienda y la persona
  que alquila. Esto incluye, por ejemplo, el alquiler y la duración del arrendamiento. El Código de las
  Obligaciones (Obligationenrecht) contiene las normas legales al respecto.
