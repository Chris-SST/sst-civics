id: wasserkraft-stromproduktion-schweiz
lang: es
source_version: 1
question: Suiza dispone de abundante agua. ¿Cómo se utiliza para producir electricidad?
options:
  a: En centrales de gas
  b: En refinerías de petróleo
  c: En centrales hidroeléctricas
  d: En centrales de carbón
explanation: El agua de los ríos y de los embalses hace funcionar las turbinas en las centrales hidroeléctricas.
  La energía hidráulica es en Suiza una fuente nacional fundamental de electricidad.
