    question_de: Die Schweiz verfügt über reichlich Wasser. Wie wird es zur Stromerzeugung genutzt?
    options_de:
      a: In Gaskraftwerken
      b: In Erdölraffinerien
      c: In Wasserkraftwerken
      d: In Kohlekraftwerken
    explanation_de: Das Wasser der Flüsse und der Stauseen treibt in den Wasserkraftwerken die Turbinen
