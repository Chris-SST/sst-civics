id: osze-schweizer-engagement-friedenssicherung
lang: es
source_version: 2
question: ¿Por qué se compromete Suiza en la Organización para la Seguridad y la Cooperación en Europa
  (OSCE)?
options:
  a: Por la paz y la seguridad en Europa, por ejemplo en Europa del Este y en Asia Central
  b: Por la distribución de fondos de ayuda en Europa Occidental
  c: Por la introducción de una moneda común
  d: Por la reducción de los aranceles en el comercio mundial
explanation: Suiza es miembro fundador de la OSCE y la utiliza para promover la paz y la seguridad en
  Europa. La OSCE actúa con misiones sobre el terreno, especialmente en Europa del Este y del Sudeste,
  así como en Asia Central. En 2026, Suiza ocupa la presidencia de la OSCE.
