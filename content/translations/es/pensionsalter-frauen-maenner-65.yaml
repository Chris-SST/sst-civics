id: pensionsalter-frauen-maenner-65
lang: es
source_version: 3
question: ¿Qué edad de jubilación (hoy llamada «edad de referencia») se aplica en el seguro de vejez y
  supervivencia (AHV) a partir de 2028 para mujeres y hombres?
options:
  a: Mujeres 64 años, hombres 65 años
  b: Mujeres y hombres 65 años
  c: Mujeres y hombres 63 años
  d: Mujeres y hombres 67 años
explanation: Desde la reforma AHV 21, la edad de jubilación se denomina oficialmente «edad de referencia».
  A partir de 2025, para las mujeres aumenta cada año tres meses, hasta alcanzar los 65 años. A partir
  de 2028, mujeres y hombres tienen la misma edad de referencia de 65 años.
