question: ¿Cuántos cantones tiene Suiza y cuántos de ellos son semicantones?
options:
  a: 26 cantones, de los cuales 6 son semicantones
  b: 26 cantones, de los cuales 3 son semicantones
  c: 23 cantones, de los cuales 6 son semicantones
  d: 20 cantones, de los cuales 6 son semicantones
explanation: 'Suiza tiene 26 cantones. Seis de ellos son semicantones: Obwalden, Nidwalden, Basilea Ciudad,
  Basilea Campiña, Appenzell Rodas Exteriores y Appenzell Rodas Interiores. En el Consejo de los Estados
  (Ständerat) tienen un voto cada uno en lugar de dos.'
