id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: es
source_version: 1
question: ¿Qué se aplica a las trabajadoras embarazadas en Suiza en caso de despido?
options:
  a: Solo tienen protección contra el despido en las empresas con convenio colectivo de trabajo
  b: Gozan de protección legal contra el despido durante el embarazo
  c: Deben comunicar su embarazo al empleador de inmediato; de lo contrario, la protección caduca
  d: Pueden ser despedidas en cualquier momento y sin ninguna restricción
explanation: La ley protege a las mujeres contra el despido por parte del empleador durante el embarazo.
  La protección se aplica independientemente de la empresa. Su objetivo es dar seguridad a las mujeres
  en ese período.
