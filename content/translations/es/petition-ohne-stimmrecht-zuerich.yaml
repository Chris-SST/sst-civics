    question_de: Welche politische Möglichkeit haben im Kanton Zürich ausländische Personen, die kein
      Stimmrecht haben?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können die Mitglieder des Kantonsrats wählen.
      c: Sie können sich mit einer Petition an die Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen Personen offen, auch denjenigen, die kein Stimmrecht
      haben. Auf diese Weise können sie den Behörden ihre Anliegen, Wünsche oder Kritik schriftlich mitteilen.
      Nur Personen mit Stimmrecht können abstimmen, wählen und Initiativen unterschreiben.
