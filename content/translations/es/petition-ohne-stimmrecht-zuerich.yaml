id: petition-ohne-stimmrecht-zuerich
lang: es
source_version: 1
question: ¿Qué posibilidad política tienen en el cantón de Zúrich las personas extranjeras que no tienen
  derecho de voto?
options:
  a: Pueden votar en las urnas sobre proyectos cantonales.
  b: Pueden elegir a los miembros del Consejo Cantonal (Kantonsrat).
  c: Pueden dirigirse a las autoridades mediante una petición.
  d: Pueden presentar una iniciativa popular (Volksinitiative) en el cantón.
explanation: El derecho de petición está abierto a todas las personas, también a quienes no tienen derecho
  de voto. De este modo pueden comunicar por escrito a las autoridades sus inquietudes, deseos o críticas.
  Solo las personas con derecho de voto pueden votar, elegir y firmar iniciativas.
