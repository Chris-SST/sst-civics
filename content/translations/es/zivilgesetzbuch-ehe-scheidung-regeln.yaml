id: zivilgesetzbuch-ehe-scheidung-regeln
lang: es
source_version: 1
question: ¿Qué ley regula, entre otras cosas, cómo se contrae matrimonio y cómo se disuelve mediante el
  divorcio?
options:
  a: El Código Civil
  b: El Código Penal
  c: La Ley de Asilo
  d: La Ley del Tribunal Federal
explanation: El Código Civil regula el derecho de las personas, el derecho de familia, el derecho sucesorio
  y los derechos reales. Esto incluye también la celebración del matrimonio y el divorcio. El Código Penal,
  en cambio, se ocupa de los delitos y las penas.
