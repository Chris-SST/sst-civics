    question_de: Welches Gesetz regelt unter anderem, wie die Ehe geschlossen und wie sie durch die Scheidung
      aufgelöst wird?
    options_de:
      a: Das Zivilgesetzbuch
      b: Das Strafgesetzbuch
      c: Das Asylgesetz
      d: Das Bundesgerichtsgesetz
    explanation_de: Das Zivilgesetzbuch regelt das Personenrecht, das Familienrecht, das Erbrecht und
      das Sachenrecht. Dazu gehören auch die Eheschliessung und die Scheidung. Das Strafgesetzbuch hingegen
      befasst sich mit den Straftaten und den Strafen.
