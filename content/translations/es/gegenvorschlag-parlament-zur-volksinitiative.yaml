    question_de: Was kann das Parlament einer eidgenössischen Volksinitiative entgegensetzen?
    options_de:
      a: Eine Verlängerung der Frist für die Unterschriftensammlung um ein weiteres Jahr
      b: Einen eigenen Gegenentwurf, der ebenfalls zur Abstimmung gebracht wird
      c: Eine zweite Unterschriftensammlung in allen Kantonen
      d: Ein Verbot, die Initiative zur Abstimmung zu bringen
    explanation_de: Das Parlament kann einer Volksinitiative einen direkten Gegenentwurf entgegensetzen.
      Dieser greift das Anliegen der Initiative oft teilweise auf, geht aber weniger weit. Die Stimmberechtigten
      stimmen dann am selben Tag über die Initiative und über den Gegenentwurf ab.
