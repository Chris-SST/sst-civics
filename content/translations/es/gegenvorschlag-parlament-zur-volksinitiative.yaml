id: gegenvorschlag-parlament-zur-volksinitiative
lang: es
source_version: 1
question: ¿Qué puede oponer el Parlamento a una iniciativa popular (Volksinitiative) federal?
options:
  a: Una prórroga del plazo de recogida de firmas de un año más
  b: Un contraproyecto propio, que también se somete a votación
  c: Una segunda recogida de firmas en todos los cantones
  d: Una prohibición de someter la iniciativa a votación
explanation: El Parlamento puede oponer a una iniciativa popular un contraproyecto directo. Este recoge
  a menudo la preocupación de la iniciativa de forma parcial, pero llega menos lejos. Las personas con
  derecho a voto votan entonces el mismo día sobre la iniciativa y sobre el contraproyecto.
