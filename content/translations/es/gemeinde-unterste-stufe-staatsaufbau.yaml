id: gemeinde-unterste-stufe-staatsaufbau
lang: es
source_version: 2
question: ¿Qué nivel se encuentra en la parte más baja de la estructura estatal de tres niveles de Suiza?
options:
  a: El municipio (Gemeinde)
  b: La región
  c: El cantón
  d: La Confederación
explanation: 'Suiza está organizada en tres niveles: la Confederación, los cantones y los municipios.
  El municipio es el nivel más bajo y el más cercano a las personas. Se encarga por sí mismo de muchas
  tareas, por ejemplo, la escuela primaria, los permisos de construcción o la ayuda social.'
