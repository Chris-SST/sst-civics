id: lateinischer-name-der-schweiz
lang: es
source_version: 2
question: ¿Cómo se llama en latín la Confederación Suiza?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: En latín, Suiza se llama Confoederatio Helvetica. De ahí proviene la abreviatura CH, que
  se ve, por ejemplo, en las matrículas de los automóviles y en las direcciones de internet (.ch). Se
  utiliza el nombre latino porque es neutral y no favorece a ninguna de las cuatro lenguas nacionales.
