id: initiative-gegenvorschlag-stichfrage
lang: es
source_version: 1
question: Se vota al mismo tiempo sobre una iniciativa popular (Volksinitiative) y un contraproyecto directo
  de la Asamblea Federal (Bundesversammlung). ¿Para qué sirve en este caso la pregunta decisiva?
options:
  a: Decide si la votación debe repetirse
  b: Decide si la iniciativa es válida
  c: Decide qué proyecto se aplica si se aprueban ambos
  d: Decide si los cantones pueden participar en la votación
explanation: Las personas con derecho a voto pueden aprobar tanto la iniciativa como el contraproyecto.
  Con la pregunta decisiva indican cuál de los dos proyectos debe entrar en vigor en caso de que ambos
  sean aprobados. Así no se pierde ningún voto a favor de un cambio.
