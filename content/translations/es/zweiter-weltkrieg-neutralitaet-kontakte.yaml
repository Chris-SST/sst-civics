question: ¿Cómo se comportó Suiza durante la Segunda Guerra Mundial?
options:
  a: Rompió todos los contactos con las partes beligerantes y cerró por completo las fronteras.
  b: Se alió con Alemania y le suministró tropas.
  c: Permaneció neutral y mantuvo contactos políticos y económicos con las partes beligerantes.
  d: Se unió a la alianza de los Aliados y combatió junto a ellos.
explanation: Durante la Segunda Guerra Mundial, Suiza no se convirtió en parte beligerante. Sin embargo,
  mantuvo contactos políticos y económicos con las partes beligerantes. Esta actitud sigue siendo objeto
  de debate histórico hasta hoy.
