id: ordentliche-kuendigung-einschreiben-empfang
lang: es
source_version: 1
question: ¿Cómo debería notificarse una rescisión ordinaria de una relación laboral para poder demostrar
  su recepción?
options:
  a: Mediante un aviso a la administración del municipio (Gemeinde)
  b: Por correo certificado, o bien la otra parte confirma la recepción por escrito
  c: Por correo electrónico simple, sin confirmación
  d: De forma oral, en una conversación a solas
explanation: Con un correo certificado o una confirmación de recepción por escrito se puede demostrar
  que la rescisión ha llegado. Esto es importante porque los plazos de preaviso corren a partir de la
  recepción.
