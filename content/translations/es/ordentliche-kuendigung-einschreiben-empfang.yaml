    question_de: Wie sollte eine ordentliche Kündigung eines Arbeitsverhältnisses zugestellt werden, um
      ihren Empfang nachweisen zu können?
    options_de:
      a: Durch eine Mitteilung an die Gemeindeverwaltung
      b: Per eingeschriebenem Brief, oder die andere Partei bestätigt den Empfang schriftlich
      c: Per einfacher E-Mail, ohne Bestätigung
      d: Mündlich, in einem Gespräch unter vier Augen
    explanation_de: Mit einem eingeschriebenen Brief oder einer schriftlichen Empfangsbestätigung kann
      nachgewiesen werden, dass die Kündigung angekommen ist. Das ist wichtig, weil die Kündigungsfristen
      ab dem Empfang laufen.
