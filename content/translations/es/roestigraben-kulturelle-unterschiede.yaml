question: ¿Qué se designa en Suiza con el término «Röstigraben»?
options:
  a: Los Alpes como línea divisoria entre el norte y el sur
  b: Las diferencias entre la ciudad y el campo
  c: La frontera entre Suiza y Alemania
  d: Las diferencias culturales entre la Suiza germanófona y la Suiza romanda
explanation: El término «Röstigraben» es una expresión figurada. Describe las diferencias culturales entre
  la Suiza germanófona y la Suiza romanda, de lengua francesa. Estas diferencias se manifiestan, por ejemplo,
  a veces en las votaciones.
