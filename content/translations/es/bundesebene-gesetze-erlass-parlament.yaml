id: bundesebene-gesetze-erlass-parlament
lang: es
source_version: 1
question: ¿Qué autoridad dicta las leyes a nivel de la Confederación?
options:
  a: La Asamblea Federal (Bundesversammlung), es decir, el Consejo Nacional (Nationalrat) y el Consejo
    de los Estados (Ständerat)
  b: El Banco Nacional Suizo
  c: La Cancillería Federal (Bundeskanzlei)
  d: La Conferencia de los Gobiernos Cantonales
explanation: La Asamblea Federal es el Parlamento de la Confederación y se compone del Consejo Nacional
  y del Consejo de los Estados. Es la responsable de la legislación. La Cancillería Federal, en cambio,
  apoya al Consejo Federal (Bundesrat) como órgano de estado mayor.
