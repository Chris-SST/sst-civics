id: kanton-zuerich-lage-mittelland
lang: es
source_version: 2
question: ¿A qué gran región paisajística de Suiza pertenece el cantón de Zúrich?
options:
  a: A los Alpes del Sur
  b: Al Jura
  c: A la Meseta suiza (Mittelland)
  d: A los Alpes Centrales
explanation: El cantón de Zúrich pertenece a la Meseta suiza (Mittelland), es decir, a la zona más llana
  situada entre el Jura, al noroeste, y los Alpes, al sur. La Meseta suiza es la parte más densamente
  poblada de Suiza.
