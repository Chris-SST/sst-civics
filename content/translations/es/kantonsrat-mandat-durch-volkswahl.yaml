id: kantonsrat-mandat-durch-volkswahl
lang: es
source_version: 1
question: ¿Cómo obtienen su mandato los miembros del Consejo Cantonal (Kantonsrat) de Zúrich?
options:
  a: Son elegidos por el pueblo.
  b: Son designados por los consejos municipales (Gemeinderäte).
  c: Son nombrados por el Consejo de Gobierno (Regierungsrat).
  d: Son designados por el Consejo Federal (Bundesrat).
explanation: Los miembros del Consejo Cantonal son elegidos por las personas con derecho a voto del cantón
  mediante elección popular. De este modo, el parlamento es determinado directamente por el pueblo. Ni
  el gobierno ni la Confederación designan a los miembros.
