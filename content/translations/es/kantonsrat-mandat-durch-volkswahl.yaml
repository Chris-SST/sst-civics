    question_de: Wie erhalten die Mitglieder des Kantonsrats von Zürich ihr Mandat?
    options_de:
      a: Sie werden vom Volk gewählt.
      b: Sie werden von den Gemeinderäten bestimmt.
      c: Sie werden vom Regierungsrat ernannt.
      d: Sie werden vom Bundesrat bestimmt.
    explanation_de: Die Mitglieder des Kantonsrats werden von den Stimmberechtigten des Kantons in einer
      Volkswahl gewählt. Auf diese Weise wird das Parlament direkt vom Volk bestimmt. Weder die Regierung
      noch der Bund bestimmen die Mitglieder.
