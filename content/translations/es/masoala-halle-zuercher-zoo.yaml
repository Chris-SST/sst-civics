question: ¿A qué institución de Zúrich pertenece el Pabellón Masoala (Masoala-Halle) con la selva tropical
  de Madagascar?
options:
  a: Al zoológico de Zúrich
  b: Al Jardín Botánico de la Universidad
  c: Al Museo de Historia Natural
  d: Al Technorama
explanation: El Pabellón Masoala forma parte del zoológico de Zúrich. Muestra una selva tropical como
  la que crece en Madagascar. Allí también viven animales de esta selva tropical.
