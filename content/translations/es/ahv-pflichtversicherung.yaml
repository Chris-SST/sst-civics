id: ahv-pflichtversicherung
lang: es
source_version: 1
question: ¿Qué afirmación sobre el seguro de vejez y supervivencia (AHV) es correcta?
options:
  a: El seguro de vejez y supervivencia pertenece a los seguros obligatorios.
  b: El seguro de vejez y supervivencia es un seguro voluntario para trabajadores autónomos.
  c: El seguro de vejez y supervivencia solo se aplica a las personas con pasaporte suizo.
  d: El seguro de vejez y supervivencia es un seguro privado de los empleadores.
explanation: El seguro de vejez y supervivencia es obligatorio. En principio, quien vive o trabaja en
  Suiza está asegurado y debe pagar cotizaciones.
