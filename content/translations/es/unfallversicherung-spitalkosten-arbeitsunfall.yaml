    question_de: Eine Arbeitnehmerin erleidet bei der Arbeit einen schweren Unfall und muss ins Spital
      eingeliefert werden. Welche Versicherung übernimmt die Spitalkosten?
    options_de:
      a: Die Arbeitslosenversicherung
      b: Die Unfallversicherung
      c: Die Erwerbsersatzordnung
      d: Die Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt bei Arbeitsunfällen die Behandlungskosten,
      das heisst zum Beispiel die Spitalkosten. Die Arbeitnehmer sind dafür über den Arbeitgeber versichert.
      Die anderen genannten Versicherungen decken andere Risiken ab.
