id: unfallversicherung-spitalkosten-arbeitsunfall
lang: es
source_version: 1
question: Una trabajadora sufre un accidente grave en el trabajo y debe ser ingresada en el hospital.
  ¿Qué seguro se hace cargo de los gastos hospitalarios?
options:
  a: El seguro de desempleo
  b: El seguro de accidentes
  c: El régimen de compensación por pérdida de ingresos
  d: El seguro de vejez y de supervivientes
explanation: El seguro obligatorio de accidentes paga, en caso de accidentes laborales, los gastos de
  tratamiento, es decir, por ejemplo, los gastos hospitalarios. Los trabajadores están asegurados contra
  ello a través del empleador. Los demás seguros mencionados cubren otros riesgos.
