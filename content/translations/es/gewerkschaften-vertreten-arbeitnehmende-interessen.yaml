id: gewerkschaften-vertreten-arbeitnehmende-interessen
lang: es
source_version: 1
question: ¿Los intereses de quiénes representan los sindicatos?
options:
  a: Los intereses de los empleadores
  b: Los intereses de los municipios (Gemeinden)
  c: Los intereses de los bancos
  d: Los intereses de los trabajadores
explanation: Los sindicatos defienden las demandas de los trabajadores, por ejemplo en materia de salarios
  y condiciones de trabajo. A menudo negocian con los empleadores convenios colectivos de trabajo.
