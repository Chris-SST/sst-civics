id: stimmenauszaehlung-urnengang-wahlbuero
lang: es
source_version: 1
question: ¿Quién cuenta los votos emitidos en las votaciones en las urnas en un municipio (Gemeinde) del
  cantón de Zúrich?
options:
  a: La autoridad de asistencia social
  b: La oficina electoral
  c: La secretaria municipal por sí sola
  d: La fiscalía
explanation: La oficina electoral determina los resultados del municipio en las votaciones y en las elecciones.
  Está formada por varias personas, para que el recuento se desarrolle de forma correcta y verificable.
