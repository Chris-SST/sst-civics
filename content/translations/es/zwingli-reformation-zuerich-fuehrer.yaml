question: ¿Quién dirigió la Reforma en Zúrich en la década de 1520?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martín Lutero
  d: Juan Calvino
explanation: Ulrich Zwingli era sacerdote popular (Leutpriester) en el Grossmünster e introdujo la Reforma
  en Zúrich. El Consejo de la ciudad lo apoyó en ello. Calvino actuó en Ginebra y Lutero en Alemania.
