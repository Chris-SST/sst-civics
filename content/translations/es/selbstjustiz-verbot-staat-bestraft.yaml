id: selbstjustiz-verbot-staat-bestraft
lang: es
source_version: 2
question: ¿Qué se aplica en Suiza cuando alguien ha infringido una ley?
options:
  a: El vecindario decide conjuntamente sobre la pena.
  b: El Estado persigue y castiga el delito; la justicia por mano propia está prohibida.
  c: La víctima puede determinar y ejecutar la pena por sí misma.
  d: La familia de la víctima puede castigar por sí misma a la autora o al autor del delito.
explanation: En Suiza, solo el Estado tiene el derecho de perseguir y castigar los delitos. De ello se
  encargan la policía, la fiscalía y los tribunales. Quien se toma la venganza por su cuenta, incluso
  como víctima o como familia de la víctima, puede incurrir con ello en responsabilidad penal.
