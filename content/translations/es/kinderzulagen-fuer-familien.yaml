id: kinderzulagen-fuer-familien
lang: es
source_version: 1
question: ¿Qué prestación estatal reciben las familias con hijos en Suiza?
options:
  a: Pensión de invalidez
  b: Asignaciones por hijos
  c: Prima para la propiedad de vivienda
  d: Subsidio diario de desempleo
explanation: Las familias reciben asignaciones por hijos como contribución a los gastos de manutención
  de los hijos. Forman parte de las asignaciones familiares, que están reguladas en la ley de la Confederación.
