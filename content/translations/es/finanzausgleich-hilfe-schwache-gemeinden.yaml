id: finanzausgleich-hilfe-schwache-gemeinden
lang: es
source_version: 1
question: ¿Para qué sirve la compensación financiera entre los municipios (Gemeinden) del cantón de Zúrich?
options:
  a: Reduce los impuestos en todos los municipios a un mismo tipo impositivo.
  b: Paga a los municipios los costes de las asambleas municipales (Gemeindeversammlungen).
  c: Ayuda a los municipios con pocos recursos financieros o gravados por elevados costes sociales a cumplir
    sus tareas.
  d: Distribuye el dinero de la Confederación por igual entre todos los habitantes.
explanation: Los municipios tienen posibilidades financieras muy diferentes. La compensación financiera
  equilibra en parte estas diferencias. Así, también los municipios con poca capacidad fiscal o con elevados
  costes sociales pueden cumplir sus tareas.
