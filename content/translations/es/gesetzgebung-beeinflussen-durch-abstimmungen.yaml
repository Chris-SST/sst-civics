    question_de: Wie nehmen die Stimmberechtigten in der Schweiz direkt Einfluss auf die Gesetzgebung
      des Bundes?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über die neuen Gesetze entscheiden.
      c: Sie ernennen die Mitglieder des Bundesrates, die die neuen Gesetze erlassen.
      d: Sie genehmigen die Gesetze selbst in der Bundesversammlung.
    explanation_de: Die Stimmberechtigten nehmen an Volksabstimmungen über Initiativen und Referenden
      teil und entscheiden darin. So beteiligen sie sich zwischen einer Wahl und der nächsten direkt an
      der Gesetzgebung. Dies ist ein Merkmal der direkten Demokratie.
