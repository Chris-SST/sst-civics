id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: es
source_version: 1
question: ¿Cómo influyen directamente las personas con derecho a voto en Suiza en la legislación de la
  Confederación?
options:
  a: Votan en las urnas sobre iniciativas y referéndums.
  b: Eligen a los jueces que deciden sobre las nuevas leyes.
  c: Nombran a los miembros del Consejo Federal, que promulgan las nuevas leyes.
  d: Aprueban ellas mismas las leyes en la Asamblea Federal (Bundesversammlung).
explanation: Las personas con derecho a voto participan en votaciones populares sobre iniciativas y referéndums
  y deciden en ellas. Así participan directamente en la legislación entre una elección y otra. Esto es
  una característica de la democracia directa.
