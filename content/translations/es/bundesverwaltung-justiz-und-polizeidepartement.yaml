id: bundesverwaltung-justiz-und-polizeidepartement
lang: es
source_version: 1
question: ¿Cuál de las siguientes entidades forma parte de la administración de la Confederación (Bundesverwaltung)?
options:
  a: El Consejo Nacional (Nationalrat)
  b: La Asamblea Federal (Bundesversammlung)
  c: El Tribunal Federal (Bundesgericht)
  d: El Departamento de Justicia y Policía
explanation: La administración de la Confederación está organizada en departamentos. El Departamento de
  Justicia y Policía es uno de ellos y forma parte de la administración bajo la dirección del Consejo
  Federal (Bundesrat). El Consejo Nacional y la Asamblea Federal pertenecen al Parlamento, y el Tribunal
  Federal pertenece al poder judicial.
