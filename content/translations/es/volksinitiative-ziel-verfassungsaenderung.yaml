id: volksinitiative-ziel-verfassungsaenderung
lang: es
source_version: 2
question: ¿Qué pueden exigir las personas con derecho a voto mediante una iniciativa popular (Volksinitiative)
  federal?
options:
  a: Que el Consejo Federal (Bundesrat) sea destituido mediante votación
  b: Que se modifique la Constitución Federal
  c: Que una ley federal existente sea derogada directamente
  d: Que se modifique la constitución cantonal
explanation: Mediante una iniciativa popular federal, las personas con derecho a voto pueden exigir una
  modificación de la Constitución Federal. En cambio, con un referéndum el pueblo puede votar sobre una
  nueva ley que el Parlamento acaba de aprobar. Con ello no se puede abolir una ley ya existente.
