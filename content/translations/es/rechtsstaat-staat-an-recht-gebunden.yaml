id: rechtsstaat-staat-an-recht-gebunden
lang: es
source_version: 2
question: ¿Qué rige para las autoridades y el gobierno en un Estado de derecho como Suiza?
options:
  a: Pueden elegir por sí mismos qué leyes cumplir.
  b: Ellos también deben respetar el derecho vigente.
  c: Están por encima del derecho vigente.
  d: Solo deben guiarse por las decisiones de los medios de comunicación.
explanation: En un Estado de derecho, no solo la población debe respetar el derecho, sino también el propio
  Estado. Las autoridades y el gobierno solo pueden actuar de la manera que el derecho permite. Así, el
  Estado de derecho protege a las personas de la arbitrariedad.
