id: zuerich-huegelzuege-am-zuerichsee
lang: es
source_version: 2
question: ¿Qué cadenas de colinas se encuentran a orillas del lago de Zúrich?
options:
  a: Uetliberg, Albis y Pfannenstiel
  b: Lägern, Irchel y Kohlfirst
  c: Hörnli, Bachtel y Allmann
  d: Heitersberg, Gubrist y Randen
explanation: El Uetliberg y el Albis se extienden a lo largo de la orilla izquierda del lago de Zúrich,
  mientras que el Pfannenstiel se encuentra en la orilla derecha. Las demás elevaciones están más alejadas
  del lago, por ejemplo en el Unterland, en el Weinland, en el Oberland zuriqués o en otros cantones.
