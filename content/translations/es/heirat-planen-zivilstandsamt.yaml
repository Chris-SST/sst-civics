id: heirat-planen-zivilstandsamt
lang: es
source_version: 1
question: ¿A qué oficina deben dirigirse las parejas que desean casarse?
options:
  a: A la Comisión escolar (Schulpflege)
  b: A la oficina del Registro Civil
  c: A la oficina de impuestos
  d: A la oficina de cobro de deudas
explanation: La oficina del Registro Civil prepara y celebra el matrimonio. También registra oficialmente
  otros acontecimientos, como los nacimientos y las defunciones.
