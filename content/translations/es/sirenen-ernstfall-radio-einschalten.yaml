id: sirenen-ernstfall-radio-einschalten
lang: es
source_version: 2
question: En caso de emergencia suena la «Alarma general» de las sirenas (un sonido aullante que sube
  y baja). ¿Qué debe hacer usted?
options:
  a: Salir de la casa inmediatamente
  b: Llamar a los bomberos
  c: Escuchar la radio y seguir las instrucciones de las autoridades
  d: Marcharse en coche
explanation: Con la Alarma general, las autoridades informan por la radio de lo que hay que hacer. También
  hay información en la aplicación Alertswiss. Hay que seguir las instrucciones y no llamar innecesariamente
  a los números de emergencia, para que queden libres para emergencias reales.
