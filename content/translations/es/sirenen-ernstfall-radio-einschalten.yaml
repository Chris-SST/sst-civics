    question_de: Im Notfall ertönt der «Allgemeine Alarm» der Sirenen (ein auf- und abschwellender heulender
      Ton). Was müssen Sie tun?
    options_de:
      a: Das Haus sofort verlassen
      b: Die Feuerwehr anrufen
      c: Radio hören und den Anweisungen der Behörden folgen
      d: Mit dem Auto wegfahren
    explanation_de: Beim Allgemeinen Alarm informieren die Behörden über das Radio darüber, was zu tun
      ist. Informationen gibt es auch in der App Alertswiss. Man muss den Anweisungen folgen und die Notrufnummern
      nicht unnötig anrufen, damit sie für echte Notfälle frei bleiben.
