question: ¿Qué acontecimiento de 1815 es importante para la neutralidad de Suiza?
options:
  a: Suiza declaró la guerra a todos los Estados vecinos.
  b: Las grandes potencias reconocieron la neutralidad perpetua de Suiza.
  c: Suiza ingresó en la Sociedad de Naciones.
  d: Suiza celebró por primera vez una votación popular sobre la neutralidad.
explanation: En el Congreso de Viena de 1815, las grandes potencias europeas reconocieron la neutralidad
  perpetua de Suiza. Esto dio a la neutralidad una base internacional.
