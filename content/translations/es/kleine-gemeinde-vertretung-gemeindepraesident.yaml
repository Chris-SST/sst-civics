id: kleine-gemeinde-vertretung-gemeindepraesident
lang: es
source_version: 1
question: ¿Quién representa hacia el exterior a un municipio (Gemeinde) zuriqués pequeño?
options:
  a: la presidenta o el presidente del municipio
  b: la consejera o el consejero del distrito
  c: la secretaria o el secretario del municipio
  d: la directora o el director de la escuela
explanation: En los municipios zuriqueses pequeños, la presidenta o el presidente del municipio representa
  al municipio hacia el exterior. Esta persona dirige el consejo municipal (Gemeinderat). En la ciudad
  de Zúrich, este cargo lo ocupa la presidenta o el presidente de la ciudad.
