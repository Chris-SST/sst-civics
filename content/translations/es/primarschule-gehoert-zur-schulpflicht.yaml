question: ¿Cuál de estas etapas forma parte de la escolaridad obligatoria en Suiza?
options:
  a: La universidad o escuela superior (Hochschule)
  b: La escuela primaria
  c: El grupo de juego (Spielgruppe)
  d: La escuela profesional (Berufsfachschule)
explanation: 'En el cantón de Zúrich, la escolaridad obligatoria dura once años: jardín de infancia, escuela
  primaria y nivel secundario I. El grupo de juego para niños pequeños es voluntario. A la escuela profesional
  y a la universidad o escuela superior se asiste solo después de la escolaridad obligatoria.'
