id: todesstrafe-verfassung-verboten
lang: es
source_version: 1
question: ¿Qué se aplica en Suiza a la pena de muerte según la Constitución Federal?
options:
  a: Solo está permitida en caso de asesinato.
  b: Solo está permitida en tiempo de guerra.
  c: Los cantones deciden si se aplica.
  d: Está prohibida.
explanation: La Constitución Federal protege el derecho a la vida en el artículo 10. La pena de muerte
  está expresamente prohibida, incluso para delitos graves.
