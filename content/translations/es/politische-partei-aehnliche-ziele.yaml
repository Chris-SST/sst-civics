id: politische-partei-aehnliche-ziele
lang: es
source_version: 1
question: ¿Qué describe mejor a un partido político?
options:
  a: Un tribunal que decide sobre conflictos políticos
  b: Una asociación de personas con objetivos políticos similares
  c: Un grupo de municipios (Gemeinde) que cumplen tareas conjuntamente
  d: Una autoridad que organiza elecciones y votaciones
explanation: En un partido se unen personas que persiguen objetivos políticos similares. En las elecciones,
  los partidos presentan candidatas y candidatos y se pronuncian sobre los proyectos sometidos a votación.
  No son autoridades estatales.
