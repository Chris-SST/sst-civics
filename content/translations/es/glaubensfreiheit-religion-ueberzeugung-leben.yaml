    question_de: Was umfasst die Glaubens- und Gewissensfreiheit gemäss der Bundesverfassung?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und entsprechend diesen zu leben
      b: Ausschliesslich die Zugehörigkeit zu einer anerkannten kantonalen Kirche
      c: Die Pflicht, den Glauben der Eltern beizubehalten
      d: Das Recht, andere Personen zu zwingen, den eigenen Glauben anzunehmen
    explanation_de: Jede Person kann ihre Religion und ihre philosophische oder weltanschauliche Überzeugung
      frei wählen und entsprechend diesen leben. Man kann auch den Glauben wechseln oder keinen haben.
      Niemand kann gezwungen werden, einen Glauben anzunehmen.
