id: glaubensfreiheit-religion-ueberzeugung-leben
lang: es
source_version: 1
question: ¿Qué comprende la libertad de creencia y de conciencia según la Constitución Federal?
options:
  a: El derecho a tener una creencia y una convicción y a vivir de acuerdo con ellas
  b: Únicamente la pertenencia a una Iglesia cantonal reconocida
  c: La obligación de mantener la fe de los padres
  d: El derecho a obligar a otras personas a adoptar la propia creencia
explanation: Toda persona puede elegir libremente su religión y su convicción filosófica o ideológica,
  y vivir de acuerdo con ellas. También se puede cambiar de creencia o no tener ninguna. Nadie puede ser
  obligado a adoptar una creencia.
