id: bundeshaus-bern-sitz-parlament
lang: es
source_version: 1
question: ¿Qué edificio de Berna es la sede de reunión del Parlamento suizo?
options:
  a: La Kornhaus
  b: El ayuntamiento (Rathaus)
  c: El Tribunal Administrativo Federal
  d: El Palacio Federal (Bundeshaus)
explanation: El Parlamento suizo se reúne en el Palacio Federal (Bundeshaus) de Berna. Allí se reúnen
  el Consejo Nacional y el Consejo de los Estados (Ständerat) en sus sesiones. El ayuntamiento (Rathaus)
  es un edificio del cantón de Berna o de la ciudad, no del Parlamento de la Confederación.
