id: waehlbar-in-bundesamt-voraussetzungen
lang: es
source_version: 2
question: ¿Quién puede ser elegido para el Consejo Nacional (Nationalrat), el Consejo Federal (Bundesrat)
  o el Tribunal Federal (Bundesgericht)?
options:
  a: Solo quien haya terminado estudios universitarios
  b: Solo quien viva en Suiza desde hace al menos diez años
  c: Solo quien sea miembro de un partido político
  d: Todos los ciudadanos y ciudadanas suizos con derecho a voto a partir de los 18 años
explanation: Según la Constitución Federal, todas las personas con derecho a voto son elegibles. Tienen
  derecho a voto los ciudadanos y ciudadanas suizos a partir de los 18 años. No se necesita pertenecer
  a un partido ni tener una formación determinada.
