question: ¿En qué región de Suiza vive la mayoría de la población?
options:
  a: En los Alpes
  b: En el Tesino
  c: En el Mittelland (Meseta suiza)
  d: En el Jura
explanation: El Mittelland se encuentra entre el Jura y los Alpes. Allí están la mayoría de las grandes
  ciudades y allí vive la mayor parte de la población. Los Alpes ocupan una superficie grande, pero están
  poco poblados.
