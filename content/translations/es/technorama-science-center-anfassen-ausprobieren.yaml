id: technorama-science-center-anfassen-ausprobieren
lang: es
source_version: 1
question: ¿En qué institución del cantón de Zúrich pueden los visitantes tocar y probar por sí mismos
  fenómenos científicos y técnicos?
options:
  a: En la Ópera de Zúrich (Opernhaus Zürich)
  b: En el Technorama de Winterthur
  c: En el Museo Nacional de Zúrich (Landesmuseum Zürich)
  d: En el Kunsthaus de Zúrich
explanation: El Technorama de Winterthur es un centro de ciencias. Allí los visitantes experimentan por
  sí mismos con los objetos expuestos. El Kunsthaus, el Museo Nacional y la Ópera presentan arte, historia
  y espectáculos.
