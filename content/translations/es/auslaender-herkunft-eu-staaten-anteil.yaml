question: ¿De dónde procede la mayor parte de las personas extranjeras residentes en Suiza?
options:
  a: De Estados de Asia, aproximadamente dos tercios
  b: De Estados de África, aproximadamente la mitad
  c: De Estados de la Unión Europea, aproximadamente dos tercios
  d: De Estados de América, aproximadamente un tercio
explanation: Aproximadamente el 66 por ciento de la población extranjera residente procede de Estados
  de la UE, es decir, alrededor de dos tercios. El resto procede de otros Estados europeos y del resto
  del mundo. La cifra puede variar ligeramente con el tiempo.
