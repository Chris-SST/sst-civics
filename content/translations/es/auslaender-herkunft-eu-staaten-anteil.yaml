    question_de: Woher stammt der grösste Teil der in der Schweiz wohnhaften ausländischen Personen?
    options_de:
      a: Aus Staaten Asiens, ungefähr zwei Drittel
      b: Aus Staaten Afrikas, ungefähr die Hälfte
