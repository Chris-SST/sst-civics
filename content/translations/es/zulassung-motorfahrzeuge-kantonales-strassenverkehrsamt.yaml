id: zulassung-motorfahrzeuge-kantonales-strassenverkehrsamt
lang: es
source_version: 1
question: ¿Quién autoriza en el cantón de Zúrich la circulación de un vehículo de motor por la vía pública
  y entrega para ello las placas de matrícula?
options:
  a: La policía cantonal durante un control de tráfico
  b: La oficina de tráfico vial del cantón
  c: El Touring Club Suiza
  d: La administración del municipio (Gemeinde) del lugar de residencia
explanation: La autorización de los vehículos de motor es competencia de la oficina cantonal de tráfico
  vial. Esta también entrega las placas de matrícula. El municipio y la policía no son competentes para
  ello.
