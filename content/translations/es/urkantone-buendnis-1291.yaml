question: ¿Qué tres territorios se aliaron en 1291 y se consideran el núcleo de la posterior Antigua Confederación
  Suiza?
options:
  a: Uri, Schwyz y Unterwalden
  b: Glarus, Zug y Uri
  c: Basilea, Schaffhausen y Appenzell
  d: Zúrich, Berna y Lucerna
explanation: Uri, Schwyz y Unterwalden concluyeron en 1291 una Confederación. Esta fecha se considera
  el origen de Suiza y se celebra el 1 de agosto. Los demás lugares se incorporaron a la Confederación
  solo más tarde.
