id: schulpflicht-beginn-kindergarten-zuerich
lang: es
source_version: 1
question: ¿Con qué comienza la escolaridad obligatoria de un niño en el cantón de Zúrich?
options:
  a: Con el ingreso en la escuela secundaria (Sekundarschule)
  b: Con el ingreso en la escuela primaria (Primarschule)
  c: Con el ingreso en el grupo de juego (Spielgruppe)
  d: Con el ingreso en el jardín de infancia (Kindergarten)
explanation: En el cantón de Zúrich, el jardín de infancia forma parte de la escuela pública obligatoria
  (Volksschule). Por eso, la escolaridad obligatoria comienza ya con el ingreso en el jardín de infancia.
  El grupo de juego es voluntario.
