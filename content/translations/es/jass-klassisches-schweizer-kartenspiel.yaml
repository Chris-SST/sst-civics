question: ¿Qué juego de cartas se considera en Suiza el juego de cartas autóctono clásico?
options:
  a: Bridge
  b: Jass
  c: Póker
  d: Rummy
explanation: El Jass se considera el juego de cartas típico de Suiza. Se juega por lo general entre cuatro
  personas, en dos equipos, a menudo con cartas francesas o con cartas de la Suiza alemana. Se juega en
  muchas familias y en muchas tabernas.
