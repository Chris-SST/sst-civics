id: geldpolitik-zustaendigkeit-bund
lang: es
source_version: 1
question: ¿Quién es responsable de la política monetaria en Suiza?
options:
  a: La Confederación
  b: Los municipios (Gemeinden)
  c: Los bancos cantonales
  d: Los cantones conjuntamente
explanation: Según la Constitución Federal, la política monetaria y cambiaria es competencia de la Confederación.
  Esta tiene el derecho de emitir monedas y billetes. El Banco Nacional Suizo lleva a cabo la política
  monetaria por encargo de la Confederación y es independiente en el ejercicio de esta función.
