    question_de: Wer ist in der Schweiz für die Geldpolitik zuständig?
    options_de:
      a: Der Bund
      b: Die Gemeinden
      c: Die Kantonalbanken
      d: Die Kantone gemeinsam
    explanation_de: Gemäss der Bundesverfassung fällt die Geld- und Währungspolitik in die Zuständigkeit
      des Bundes. Dieser hat das Recht, Münzen und Banknoten auszugeben. Die Schweizerische Nationalbank
      führt die Geldpolitik im Auftrag des Bundes durch und ist bei der Ausübung dieser Aufgabe unabhängig.
