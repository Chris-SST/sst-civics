    question_de: Eine Arbeitnehmerin hält ihre Kündigung für ungerechtfertigt und möchte sie anfechten.
      Welche Stelle befasst sich mit dieser Art von Streitigkeiten aus dem Arbeitsverhältnis?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungsamt
    explanation_de: Das Arbeitsgericht ist für die Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern
      zuständig. Dazu gehört auch der Streit um eine Kündigung. Das RAV hingegen hilft bei der Stellensuche.
