id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: es
source_version: 1
question: Una trabajadora considera que su despido es improcedente y quiere impugnarlo. ¿Qué organismo
  se ocupa de este tipo de litigios derivados de la relación laboral?
options:
  a: El Centro Regional de Colocación (RAV)
  b: La Oficina de Tráfico (Strassenverkehrsamt)
  c: El Tribunal de Trabajo (Arbeitsgericht)
  d: La Oficina de Cobros (Betreibungsamt)
explanation: El Tribunal de Trabajo es competente para los litigios entre empleadores y trabajadores.
  Esto incluye también la disputa por un despido. El RAV, en cambio, ayuda en la búsqueda de empleo.
