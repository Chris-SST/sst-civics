question: ¿Qué ciudad asume en Suiza el papel de capital del país?
options:
  a: Berna
  b: Ginebra
  c: Lausana
  d: Zúrich
explanation: Berna es la sede del Consejo Federal (Bundesrat) y de la Asamblea Federal (Bundesversammlung)
  y se denomina «ciudad federal». La Constitución Federal no menciona ninguna capital, pero Berna asume
  ese papel. Zúrich es la ciudad más grande y Lausana es la sede del Tribunal Federal (Bundesgericht).
