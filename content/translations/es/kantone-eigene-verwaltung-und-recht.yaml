id: kantone-eigene-verwaltung-und-recht
lang: es
source_version: 2
question: ¿Cuál es una de las tareas de los cantones?
options:
  a: Determinan la política exterior y la moneda de Suiza.
  b: Dictan las leyes para todo el país.
  c: Dirigen el ejército y determinan los aranceles.
  d: Dirigen su propia administración y dictan el derecho cantonal.
explanation: Cada cantón tiene su propio gobierno, su propio parlamento y su propia administración. Hace
  sus propias leyes, que solo rigen en el cantón, por ejemplo para las escuelas o la policía. La política
  exterior, la moneda, el ejército, los aranceles y las leyes para toda Suiza son competencia de la Confederación.
