id: greifensee-zweitgroesster-see-zuerich
lang: es
source_version: 1
question: ¿Qué lago es el segundo más grande del cantón de Zúrich, después del lago de Zúrich?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: El Greifensee se encuentra entre Uster y Dübendorf y, después del lago de Zúrich, es el segundo
  lago más grande del cantón. El Pfäffikersee es más pequeño. El Türlersee y el Katzensee son todavía
  claramente más pequeños.
