id: nationalfeiertag-1-august-bundesweit
lang: es
source_version: 1
question: ¿Qué día es legalmente un día festivo no laborable en toda Suiza?
options:
  a: El 2 de enero (Berchtoldstag)
  b: El lunes de carnaval (Fasnachtsmontag)
  c: El Viernes Santo
  d: El 1 de agosto, la fiesta nacional
explanation: El 1 de agosto es la fiesta nacional y se considera día festivo en todo el país. La mayoría
  de los demás días festivos, como el Viernes Santo o el Berchtoldstag, los regulan los cantones por su
  cuenta y no son festivos en todas partes.
