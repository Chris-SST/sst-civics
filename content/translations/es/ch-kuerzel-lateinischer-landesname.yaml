id: ch-kuerzel-lateinischer-landesname
lang: es
source_version: 1
question: ¿Qué significa la sigla del país «CH» de Suiza?
options:
  a: El nombre francés Confédération Helvétique
  b: La expresión «Cantons Helvétiques»
  c: El nombre latino Civitas Helvetica
  d: El nombre latino del país, Confoederatio Helvetica
explanation: CH es la forma abreviada de Confoederatio Helvetica, el nombre latino de Suiza. Se utiliza
  el latín porque no favorece a ninguna de las cuatro lenguas nacionales. La sigla aparece, por ejemplo,
  en las matrículas de los automóviles y en las direcciones de internet.
