id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: es
source_version: 1
question: ¿Qué derecho fundamental está protegido en Suiza por la Constitución Federal?
options:
  a: El derecho a recibir unos ingresos del Estado
  b: El derecho a tener un coche
  c: El derecho a un puesto de trabajo
  d: La libertad de creencias y de conciencia
explanation: La libertad de creencias y de conciencia figura en el artículo 15 de la Constitución Federal.
  El Estado no puede obligar a nadie a profesar una creencia. Como derecho fundamental no existe un derecho
  a un puesto de trabajo ni a unos ingresos.
