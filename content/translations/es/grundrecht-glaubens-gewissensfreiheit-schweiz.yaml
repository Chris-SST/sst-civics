    question_de: Welches Grundrecht ist in der Schweiz durch die Bundesverfassung geschützt?
    options_de:
      a: Das Recht, vom Staat ein Einkommen zu erhalten
      b: Das Recht, ein Auto zu besitzen
      c: Das Recht auf eine Arbeitsstelle
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit steht in Artikel 15 der Bundesverfassung. Der
      Staat kann niemanden dazu zwingen, einen Glauben zu bekennen. Als Grundrecht gibt es kein Recht
      auf eine Arbeitsstelle und auch keines auf ein Einkommen.
