id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
lang: es
source_version: 1
question: ¿De qué depende principalmente cuánto impuesto sobre la renta y el patrimonio paga una persona
  en el cantón de Zúrich?
options:
  a: De la renta y el patrimonio imponibles
  b: De la profesión de la persona
  c: Del tiempo de residencia en el municipio (Gemeinde)
  d: Del número de veces que se ha ejercido el derecho de voto
explanation: El impuesto se calcula sobre la renta y el patrimonio imponibles. Quien gana o posee más
  paga, por lo general, más impuestos.
