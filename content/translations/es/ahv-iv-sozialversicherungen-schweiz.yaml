id: ahv-iv-sozialversicherungen-schweiz
lang: es
source_version: 1
question: ¿Qué afirmación sobre los seguros sociales de Suiza es correcta?
options:
  a: El seguro de vejez y supervivencia (AVS) y el seguro de invalidez (IV) forman parte de los seguros
    sociales de Suiza.
  b: El seguro de vejez y supervivencia y el seguro de invalidez son gestionados únicamente por los municipios
    (Gemeinden).
  c: El seguro de vejez y supervivencia y el seguro de invalidez son seguros privados sin base legal.
  d: El seguro de vejez y supervivencia y el seguro de invalidez están pensados solo para los trabajadores
    autónomos.
explanation: AHV significa seguro de vejez y supervivencia (Alters- und Hinterlassenenversicherung) e
  IV significa seguro de invalidez (Invalidenversicherung). Ambos están regulados en el derecho de la
  Confederación y forman parte del sistema estatal de seguros sociales.
