    question_de: Wie wird die steuerliche Belastung der Familien im Bereich der Steuern gemildert?
    options_de:
      a: Familien zahlen keine Steuern.
      b: Familien können bei den Steuern Abzüge geltend machen.
      c: Familien müssen keine Steuererklärung ausfüllen.
      d: Familien zahlen nur die Mehrwertsteuer.
    explanation_de: Familien können zum Beispiel Abzüge für die Kinder oder für die Kinderbetreuung geltend
      machen. Dadurch sinkt das steuerbare Einkommen und somit die Steuer.
