id: familien-steuerabzuege-entlastung
lang: es
source_version: 1
question: ¿Cómo se alivia la carga fiscal de las familias en materia de impuestos?
options:
  a: Las familias no pagan impuestos.
  b: Las familias pueden hacer valer deducciones en los impuestos.
  c: Las familias no tienen que rellenar una declaración de impuestos.
  d: Las familias solo pagan el impuesto sobre el valor añadido.
explanation: Las familias pueden hacer valer, por ejemplo, deducciones por los hijos o por el cuidado
  de los hijos. Con ello disminuye la renta imponible y, por tanto, el impuesto.
