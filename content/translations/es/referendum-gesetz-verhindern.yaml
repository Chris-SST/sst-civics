id: referendum-gesetz-verhindern
lang: es
source_version: 1
question: ¿Qué pueden lograr los ciudadanos con derecho a voto mediante un referéndum?
options:
  a: Pueden redactar ellos mismos una nueva ley y ponerla en vigor.
  b: Pueden impedir una ley aprobada por el Parlamento.
  c: Pueden destituir a los miembros del Consejo Federal (Bundesrat).
  d: Pueden disolver el Parlamento y exigir nuevas elecciones.
explanation: Mediante un referéndum, los ciudadanos con derecho a voto pueden exigir que se vote sobre
  una ley aprobada por el Parlamento. Si el pueblo rechaza la ley, esta no entra en vigor.
