    question_de: Was können die stimmberechtigten Bürgerinnen und Bürger mit einem Referendum erreichen?
    options_de:
      a: Sie können selbst ein neues Gesetz verfassen und in Kraft setzen.
      b: Sie können ein vom Parlament verabschiedetes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates absetzen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Mit einem Referendum können die stimmberechtigten Bürgerinnen und Bürger verlangen,
      dass über ein vom Parlament verabschiedetes Gesetz abgestimmt wird. Lehnt das Volk das Gesetz ab,
      tritt es nicht in Kraft.
