id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: es
source_version: 1
question: ¿Cuál de las siguientes tareas forma parte del mandato de la policía?
options:
  a: Perseguir las infracciones de la ley
  b: Llevar a cabo votaciones populares
  c: Promulgar leyes para el país
  d: Dictar sentencias judiciales sobre los delincuentes
explanation: La policía garantiza la seguridad y el orden y persigue las infracciones de la ley. Investiga
  los delitos y transmite los resultados. Las leyes las promulga el Parlamento y las sentencias las dictan
  los tribunales.
