    question_de: Welche der folgenden Aufgaben gehört zum Auftrag der Polizei?
    options_de:
      a: Gesetzesverstösse verfolgen
      b: Volksabstimmungen durchführen
      c: Gesetze für das Land erlassen
      d: Gerichtsurteile über die Straftäter fällen
    explanation_de: Die Polizei gewährleistet die Sicherheit und Ordnung und verfolgt die Gesetzesverstösse.
      Sie untersucht die Straftaten und übermittelt die Ergebnisse. Die Gesetze werden vom Parlament erlassen
      und die Urteile werden von den Gerichten gefällt.
