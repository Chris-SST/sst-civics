    question_de: Wer fällt in einem Gerichtsverfahren das Urteil?
    options_de:
      a: Die Richterin oder der Richter
      b: Die Polizistin oder der Polizist
      c: Die Präsidentin oder der Präsident der Gemeinde
      d: Die Staatsanwältin oder der Staatsanwalt
    explanation_de: Die Richterinnen und Richter entscheiden in Gerichtsverfahren unabhängig und fällen
      das Urteil. Die Staatsanwaltschaft leitet die Untersuchung und erhebt die Anklage. Die Polizei ermittelt,
      fällt aber kein Urteil.
