id: richter-sprechen-urteile-gerichtsverfahren
lang: es
source_version: 1
question: ¿Quién dicta la sentencia en un proceso judicial?
options:
  a: La jueza o el juez
  b: La policía o el policía
  c: La presidenta o el presidente del municipio (Gemeinde)
  d: La fiscal o el fiscal
explanation: Las juezas y los jueces deciden de forma independiente en los procesos judiciales y dictan
  la sentencia. La fiscalía dirige la investigación y presenta la acusación. La policía investiga, pero
  no dicta sentencia.
