id: raumplanung-landschaften-ohne-bebauung
lang: es
source_version: 2
question: ¿Cuál es uno de los objetivos de la ordenación del territorio en Suiza?
options:
  a: Debe proteger los paisajes sin edificar y utilizar el suelo de forma moderada.
  b: Debe volver a fijar periódicamente los límites entre los cantones.
  c: Debe crear el mayor número posible de nuevas zonas edificables.
  d: Debe determinar el precio del suelo edificable.
explanation: La ordenación del territorio determina dónde se puede construir y dónde no. Separa el suelo
  edificable del no edificable para que se preserven los paisajes y las tierras de cultivo. Como el suelo
  es escaso, debe utilizarse de forma moderada y, más bien, densificar los asentamientos existentes en
  lugar de crear nuevas zonas edificables.
