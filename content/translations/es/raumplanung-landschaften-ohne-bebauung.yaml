    question_de: Was ist eines der Ziele der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll unbebaute Landschaften schützen und den Boden massvoll nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen periodisch neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis des Baulandes bestimmen.
    explanation_de: Die Raumplanung legt fest, wo gebaut werden darf und wo nicht. Sie trennt das Bauland
      vom Nichtbauland, damit die Landschaften und das Kulturland erhalten bleiben. Da der Boden knapp
      ist, muss er massvoll genutzt werden und es sollen eher die bestehenden Siedlungen verdichtet werden,
      anstatt neue Bauzonen zu schaffen.
