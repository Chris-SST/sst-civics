id: regierungsgewalt-des-bundes-beim-bundesrat
lang: es
source_version: 1
question: ¿Qué autoridad ejerce el poder gubernamental supremo a nivel de la Confederación?
options:
  a: El Consejo Federal (Bundesrat)
  b: El Consejo Nacional (Nationalrat)
  c: La Cancillería Federal (Bundeskanzlei)
  d: El Tribunal Federal (Bundesgericht)
explanation: Según la Constitución Federal, el Consejo Federal es la autoridad suprema de dirección y
  ejecución de la Confederación. El Parlamento elabora las leyes y el Tribunal Federal imparte justicia.
