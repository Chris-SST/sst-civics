id: regierungsrat-zuerich-wahl-durch-volk
lang: es
source_version: 1
question: ¿Quién determina en el cantón de Zúrich quién forma parte del Consejo de Gobierno (Regierungsrat)?
options:
  a: La Asamblea Federal (Bundesversammlung) elige a los miembros del Consejo de Gobierno.
  b: El Consejo Cantonal (Kantonsrat) elige a los miembros de entre sus propias filas.
  c: Los presidentes y las presidentas de los municipios (Gemeinde) eligen a los miembros.
  d: La población del cantón con derecho a voto elige directamente a los miembros.
explanation: En el cantón de Zúrich, el pueblo elige directamente el Consejo de Gobierno en las urnas.
  El Consejo Cantonal es el parlamento y no elige al gobierno. Esto distingue al cantón de la Confederación,
  donde la Asamblea Federal elige al Consejo Federal (Bundesrat).
