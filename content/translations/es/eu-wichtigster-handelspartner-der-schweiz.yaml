id: eu-wichtigster-handelspartner-der-schweiz
lang: es
source_version: 1
question: ¿Con qué espacio económico comercia Suiza más en total?
options:
  a: Con los Estados de Oriente Próximo
  b: Con los Estados asiáticos
  c: Con la Unión Europea
  d: Con los Estados Unidos de América
explanation: La Unión Europea es el socio comercial más importante de Suiza. Una gran parte de las importaciones
  y exportaciones se realiza a través de los Estados de la UE. Por eso, las relaciones con la UE son muy
  importantes para la economía suiza.
