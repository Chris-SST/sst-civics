id: henry-dunant-gruender-rotes-kreuz
lang: es
source_version: 2
question: ¿Quién es considerado el fundador de la Cruz Roja en Ginebra?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: El ginebrino Henry Dunant vio en 1859, después de la batalla de Solferino, cómo muchos heridos
  quedaban sin ayuda. Por ello se comprometió a favor de su cuidado, y en 1863 nació en Ginebra la Cruz
  Roja. Por ello, Dunant recibió en 1901, junto con Frédéric Passy, el primer Premio Nobel de la Paz.
