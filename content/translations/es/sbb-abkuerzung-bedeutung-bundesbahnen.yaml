id: sbb-abkuerzung-bedeutung-bundesbahnen
lang: es
source_version: 1
question: ¿Qué significa la abreviatura «SBB» que se ve en los trenes y en las estaciones de Suiza?
options:
  a: Empresas suizas de autobuses (Schweizer Busbetriebe)
  b: Ferrocarriles Federales Suizos (Schweizerische Bundesbahnen)
  c: Empresas suizas de ferrocarril y autobús (Schweizerische Bahn- und Busbetriebe)
  d: Ferrocarriles suizos de montaña (Schweizer Bergbahnen)
explanation: SBB significa Schweizerische Bundesbahnen (Ferrocarriles Federales Suizos). La empresa explota
  una gran parte de la red ferroviaria suiza y pertenece a la Confederación. Además, existen otras empresas
  ferroviarias, por ejemplo BLS o el Ferrocarril Rético (Rhätische Bahn).
