id: schweiz-staatsform-demokratie
lang: es
source_version: 1
question: ¿Qué forma de Estado tiene Suiza?
options:
  a: Es una dictadura con un único partido.
  b: Es una monarquía con un rey elegido.
  c: Es un Estado democrático.
  d: Es un Estado gobernado por una familia noble.
explanation: Suiza es una democracia. La población participa en las decisiones políticas mediante elecciones
  y votaciones. La Constitución Federal establece esto como fundamento del Estado.
