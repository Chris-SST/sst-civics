id: stimmrecht-bund-ab-18-geburtstag
lang: es
source_version: 1
question: ¿A partir de qué edad pueden votar y elegir los ciudadanos suizos a nivel federal?
options:
  a: A partir del 20.º cumpleaños
  b: A partir del 21.º cumpleaños
  c: A partir del 16.º cumpleaños
  d: A partir del 18.º cumpleaños
explanation: El derecho de voto y de elección a nivel de la Confederación comienza con la mayoría de edad,
  es decir, con el 18.º cumpleaños. Esta edad se aplica por igual a las elecciones y a las votaciones
  de la Confederación.
