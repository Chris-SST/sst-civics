id: ruetli-zusammenschluss-der-urkantone
lang: es
source_version: 1
question: ¿Qué simboliza el Rütli en la historia suiza?
options:
  a: La unión de los cantones primitivos
  b: La victoria en la batalla de Marignano
  c: El comienzo de la Reforma
  d: La fundación del Estado federal en 1848
explanation: Según la tradición, en el Rütli se aliaron representantes de los cantones primitivos. Por
  ello se considera un símbolo de los orígenes de la Confederación. La pradera se encuentra a orillas
  del lago de los Cuatro Cantones.
