id: uno-beitritt-der-schweiz-jahr
lang: es
source_version: 1
question: ¿En qué año pasó Suiza a ser miembro de las Naciones Unidas (ONU)?
options:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
explanation: Suiza ingresó en la ONU en 2002, después de que el pueblo y los cantones dieran su aprobación.
  Fue así uno de los últimos países en adherirse. Sin embargo, muchas organizaciones de la ONU tienen
  su sede en Ginebra desde hace mucho tiempo.
