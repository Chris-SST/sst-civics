id: rav-aufgabe-stellensuchende-unterstuetzen
lang: es
source_version: 1
question: ¿Qué función tiene el Centro Regional de Colocación (RAV)?
options:
  a: Controla los salarios en las empresas
  b: Paga una pensión a todos los habitantes
  c: Apoya a las personas que buscan empleo en su búsqueda de trabajo y les intermedia puestos de trabajo
  d: Expide certificados de trabajo a las personas que buscan empleo
explanation: El RAV es el punto de contacto regional para las personas que buscan empleo. Las asesora
  y les intermedia puestos de trabajo. En el cantón de Zúrich forma parte de la Oficina de Trabajo.
