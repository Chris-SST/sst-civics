id: kind-krankenversicherung-frist-geburt
lang: es
source_version: 1
question: ¿En qué plazo, a partir del nacimiento, debe existir un seguro de enfermedad para un niño que
  reside en Suiza?
options:
  a: en un plazo de 12 meses
  b: en un plazo de 3 meses
  c: en un plazo de 14 días
  d: en un plazo de 6 meses
explanation: Los padres deben contratar un seguro de enfermedad para su hijo en un plazo de tres meses
  después del nacimiento. Si se cumple el plazo, la cobertura del seguro es retroactiva desde el nacimiento.
