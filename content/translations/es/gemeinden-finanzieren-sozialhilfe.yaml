id: gemeinden-finanzieren-sozialhilfe
lang: es
source_version: 1
question: ¿Quién financia en el cantón de Zúrich la asistencia social para las personas en situación de
  necesidad?
options:
  a: Solo las iglesias
  b: El Banco Nacional Suizo
  c: Las asociaciones de empleadores
  d: Los municipios (Gemeinden)
explanation: En el cantón de Zúrich, los municipios son responsables de la asistencia social y asumen
  sus costes. Esto puede suponer una fuerte carga para los municipios más pequeños. Por eso existe la
  compensación financiera.
