    question_de: Wie erging es der Schweiz wirtschaftlich in den Jahrzehnten nach dem Zweiten Weltkrieg,
      zum Beispiel in den Sechzigerjahren?
    options_de:
      a: 'Es erging ihr immer besser: Es gab viel Arbeit und der Wohlstand vieler Menschen nahm zu.'
      b: Die Wirtschaft schrumpfte stark und viele Menschen blieben ohne Arbeit.
      c: Die Schweiz wurde Mitglied der Europäischen Union.
      d: Die Schweiz brauchte keine Arbeitskräfte aus dem Ausland mehr.
    explanation_de: Nach dem Zweiten Weltkrieg wuchs die Schweizer Wirtschaft stark. Es gab viel Arbeit
      und viele Menschen konnten sich mehr Dinge leisten. Deshalb stellten die Unternehmen viele Arbeitskräfte
      aus dem Ausland ein, zu Beginn vor allem aus Italien.
