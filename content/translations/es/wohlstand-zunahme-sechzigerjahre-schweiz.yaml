question: ¿Cómo le fue a Suiza económicamente en las décadas posteriores a la Segunda Guerra Mundial,
  por ejemplo en los años sesenta?
options:
  a: 'Le fue cada vez mejor: había mucho trabajo y el bienestar de muchas personas aumentó.'
  b: La economía se contrajo con fuerza y muchas personas se quedaron sin trabajo.
  c: Suiza se convirtió en miembro de la Unión Europea.
  d: Suiza ya no necesitaba trabajadores del extranjero.
explanation: Después de la Segunda Guerra Mundial, la economía suiza creció con fuerza. Había mucho trabajo
  y muchas personas podían permitirse más cosas. Por eso, las empresas contrataron a muchos trabajadores
  del extranjero, al principio sobre todo de Italia.
