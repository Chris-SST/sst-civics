    question_de: Was ist eine Voraussetzung für das Stimm- und Wahlrecht auf Ebene des Bundes?
    options_de:
      a: Das Schweizer Bürgerrecht
      b: Die Mitgliedschaft in einer politischen Partei
      c: Mindestens zehn Jahre Wohnsitz in der Schweiz
      d: Eine Niederlassungsbewilligung (Bewilligung C) Niederlassungsbewilligung C
    explanation_de: Auf Ebene des Bundes dürfen nur Personen mit Schweizer Bürgerrecht abstimmen und wählen.
      Ausländer haben auf Ebene des Bundes kein Stimm- und Wahlrecht, auch nicht mit einer Niederlassungsbewilligung.
      Es ist nicht nötig, Mitglied einer Partei zu sein.
