id: stimmrecht-bund-schweizer-buergerrecht
lang: es
source_version: 1
question: ¿Cuál es un requisito para el derecho de voto y de elección a nivel de la Confederación?
options:
  a: La ciudadanía suiza (Bürgerrecht)
  b: La afiliación a un partido político
  c: Al menos diez años de residencia en Suiza
  d: Un permiso de establecimiento (permiso C) (Niederlassungsbewilligung) C
explanation: A nivel de la Confederación, solo las personas con ciudadanía suiza pueden votar y elegir.
  Los extranjeros no tienen derecho de voto ni de elección a nivel de la Confederación, ni siquiera con
  un permiso de establecimiento. No es necesario estar afiliado a un partido.
