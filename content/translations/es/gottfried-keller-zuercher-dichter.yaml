id: gottfried-keller-zuercher-dichter
lang: es
source_version: 2
question: ¿Qué conocido poeta y escritor era originario de Zúrich?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller nació en Zúrich en 1819, escribió, por ejemplo, «El Enrique verde» («Der
  grüne Heinrich») y trabajó también como secretario del Estado (Staatsschreiber) del cantón de Zúrich.
  Robert Walser era originario de Biel, Friedrich Dürrenmatt de Konolfingen, en el cantón de Berna, y
  Jeremias Gotthelf ejerció como pastor en el cantón de Berna.
