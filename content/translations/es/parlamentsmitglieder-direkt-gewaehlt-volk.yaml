id: parlamentsmitglieder-direkt-gewaehlt-volk
lang: es
source_version: 2
question: ¿Quién elige a los miembros del Consejo Nacional (Nationalrat)?
options:
  a: El Consejo Federal (Bundesrat) los nombra.
  b: Los partidos los designan sin elecciones.
  c: El Tribunal Federal (Bundesgericht) los selecciona.
  d: Los ciudadanos con derecho a voto los eligen directamente.
explanation: Los miembros del Consejo Nacional se eligen cada cuatro años directamente por las personas
  con derecho a voto. Hoy en día, en todos los cantones también es el pueblo quien elige a los miembros
  del Consejo de los Estados (Ständerat), según las normas de cada cantón; en Appenzell Rodas Interiores
  esto se hace en la Landsgemeinde.
