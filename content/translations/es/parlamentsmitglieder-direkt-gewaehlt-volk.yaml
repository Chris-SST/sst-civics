    question_de: Wer wählt die Mitglieder des Nationalrats?
    options_de:
      a: Der Bundesrat ernennt sie.
      b: Die Parteien bestimmen sie ohne Wahlen.
      c: Das Bundesgericht wählt sie aus.
      d: Die stimmberechtigten Bürger wählen sie direkt.
    explanation_de: Die Mitglieder des Nationalrats werden alle vier Jahre direkt von den stimmberechtigten
      Personen gewählt. Heute ist es in allen Kantonen auch das Volk, das die Mitglieder des Ständerats
      wählt, nach den Regeln jedes Kantons; in Appenzell Innerrhoden geschieht dies an der Landsgemeinde.
