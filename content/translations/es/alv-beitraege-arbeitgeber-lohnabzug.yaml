id: alv-beitraege-arbeitgeber-lohnabzug
lang: es
source_version: 1
question: ¿Quién deduce del salario las cotizaciones al seguro de desempleo?
options:
  a: El municipio (Gemeinde) del lugar de residencia
  b: La trabajadora o el trabajador mismo, mediante un pago
  c: El Centro Regional de Colocación (Regionales Arbeitsvermittlungszentrum)
  d: El empleador
explanation: El empleador deduce las cotizaciones automáticamente del salario y las transfiere al organismo
  competente. Los trabajadores no tienen que ocuparse de ello personalmente. El empleador también paga
  una parte de las cotizaciones.
