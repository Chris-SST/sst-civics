id: krankenkasse-freie-wahl-versicherte
lang: es
source_version: 1
question: ¿Quién decide en Suiza con qué aseguradora de salud (Krankenkasse) contrata una persona el seguro
  básico?
options:
  a: El municipio de residencia determina la aseguradora de salud
  b: La persona asegurada elige ella misma su aseguradora de salud
  c: El empleador determina la aseguradora de salud para todos los empleados
  d: El cantón de residencia asigna una aseguradora de salud a cada persona
explanation: En Suiza rige la libre elección de la aseguradora de salud. Las personas aseguradas pueden
  elegir entre las aseguradoras de salud autorizadas y cambiar de aseguradora bajo determinadas condiciones.
