id: zu-tiefer-lohn-arbeitsgericht
lang: es
source_version: 1
question: Una trabajadora recibe de forma injustificada un salario demasiado bajo. ¿A qué entidad puede
  recurrir?
options:
  a: El Centro Regional de Colocación Laboral (RAV)
  b: La Oficina Federal de Estadística
  c: El tribunal laboral
  d: La asamblea municipal (Gemeindeversammlung)
explanation: En los conflictos derivados de la relación laboral, por ejemplo por un salario demasiado
  bajo, es competente el tribunal laboral. El RAV ayuda en la búsqueda de empleo y no en los conflictos
  salariales.
