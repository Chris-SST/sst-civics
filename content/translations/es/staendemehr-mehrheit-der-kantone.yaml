id: staendemehr-mehrheit-der-kantone
lang: es
source_version: 1
question: ¿Qué significa el término «mayoría de los cantones (Ständemehr)» en las votaciones federales?
options:
  a: La mayoría de los cantones debe aprobar el proyecto.
  b: La mayoría de los municipios (Gemeinden) debe aprobar el proyecto.
  c: La mayoría de los partidos debe aprobar el proyecto.
  d: La mayoría de los miembros del Consejo de los Estados (Ständerat) debe estar presente.
explanation: La mayoría de los cantones exige que la mayoría de los cantones apruebe un proyecto. Los
  votos de un cantón cuentan según el resultado de la votación en ese cantón. En las modificaciones de
  la Constitución se necesita, además de la mayoría del pueblo (Volksmehr), también la mayoría de los
  cantones.
