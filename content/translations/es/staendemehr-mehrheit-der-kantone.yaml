    question_de: Was bedeutet der Begriff «Ständemehr» bei eidgenössischen Abstimmungen?
    options_de:
      a: Die Mehrheit der Kantone muss die Vorlage annehmen.
      b: Die Mehrheit der Gemeinden muss die Vorlage annehmen.
      c: Die Mehrheit der Parteien muss die Vorlage annehmen.
      d: Die Mehrheit der Mitglieder des Ständerates muss anwesend sein.
    explanation_de: Das Ständemehr verlangt, dass die Mehrheit der Kantone eine Vorlage annimmt. Die Stimmen
      eines Kantons zählen gemäss dem Abstimmungsergebnis in diesem Kanton. Bei Änderungen der Verfassung
      braucht es zusätzlich zum Volksmehr auch das Ständemehr.
