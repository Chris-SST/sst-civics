id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: es
source_version: 1
question: ¿Dónde debe registrarse usted si se traslada a otro municipio (Gemeinde) del cantón de Zúrich?
options:
  a: En el tribunal de distrito
  b: En la Oficina Federal de Estadística
  c: En la policía cantonal
  d: En el control de habitantes (Einwohnerkontrolle) del nuevo municipio de residencia
explanation: El registro se realiza en el control de habitantes, también llamado oficina de habitantes
  (Einwohneramt). Este lleva el registro de los habitantes del municipio.
