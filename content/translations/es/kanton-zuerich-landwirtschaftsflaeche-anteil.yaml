question: ¿Cuál es aproximadamente la proporción de la superficie del cantón de Zúrich que se utiliza
  para la agricultura?
options:
  a: Aproximadamente el 68 por ciento
  b: Aproximadamente el 25 por ciento
  c: Aproximadamente el 11 por ciento
  d: Aproximadamente el 41 por ciento
explanation: Aproximadamente el 41 por ciento de la superficie del cantón de Zúrich se dedica a la agricultura.
  El resto está formado sobre todo por bosque, superficie urbanizada y aguas.
