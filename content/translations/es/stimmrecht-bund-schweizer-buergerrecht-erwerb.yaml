id: stimmrecht-bund-schweizer-buergerrecht-erwerb
lang: es
source_version: 1
question: ¿A partir de qué momento obtiene una persona procedente del extranjero el derecho de voto y
  de elección a nivel de la Confederación?
options:
  a: En cuanto haya vivido diez años en Suiza.
  b: En cuanto reciba un permiso de establecimiento (Niederlassungsbewilligung) (permiso C).
  c: En cuanto pague impuestos y trabaje en Suiza.
  d: En cuanto tenga la ciudadanía (Bürgerrecht) suiza y sea mayor de edad.
explanation: El derecho de voto y de elección a nivel de la Confederación está vinculado a la ciudadanía
  suiza. Un permiso de establecimiento, una determinada duración de residencia o el pago de impuestos
  no son suficientes para ello. Quien se naturaliza y es mayor de edad puede participar en las elecciones
  y votaciones federales.
