    question_de: Ab wann erhält eine Person aus dem Ausland das Stimm- und Wahlrecht auf Bundesebene?
    options_de:
      a: Sobald sie zehn Jahre in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (C-Bewilligung) erhält.
      c: Sobald sie Steuern zahlt und in der Schweiz arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht hat und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Bundesebene ist an das Schweizer Bürgerrecht gebunden.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Zahlen von Steuern reichen
      dafür nicht aus. Wer eingebürgert wird und volljährig ist, kann an den eidgenössischen Wahlen und
      Abstimmungen teilnehmen.
