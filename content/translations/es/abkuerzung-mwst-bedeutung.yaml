id: abkuerzung-mwst-bedeutung
lang: es
source_version: 1
question: En las facturas y los recibos suele aparecer la abreviatura «MWST». ¿Qué significa?
options:
  a: Impuesto sobre la vivienda de alquiler (Mietwohnungssteuer)
  b: Impuesto de defensa militar (Militärwehrsteuer)
  c: Impuesto sobre los vehículos de motor (Motorwagensteuer)
  d: Impuesto sobre el valor añadido (Mehrwertsteuer)
explanation: MWST significa «Mehrwertsteuer», es decir, impuesto sobre el valor añadido (IVA). Se aplica
  a la mayoría de los bienes y servicios y está incluido en el precio. Es una fuente de ingresos importante
  de la Confederación.
