id: bundeskanzlei-stabsstelle-des-bundesrats
lang: es
source_version: 1
question: ¿Qué función tiene la Cancillería Federal (Bundeskanzlei) para el Consejo Federal (Bundesrat)?
options:
  a: Es el órgano de apoyo del Consejo Federal.
  b: Revisa, como tribunal, las decisiones del Consejo Federal.
  c: Dirige el Departamento de Finanzas.
  d: Elige a los miembros del Consejo Federal.
explanation: La Cancillería Federal apoya al Consejo Federal en su trabajo, por ejemplo en la preparación
  de las sesiones. Está bajo la dirección de la canciller o del canciller de la Confederación. El Consejo
  Federal es elegido por la Asamblea Federal (Bundesversammlung).
