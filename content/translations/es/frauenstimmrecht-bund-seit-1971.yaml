id: frauenstimmrecht-bund-seit-1971
lang: es
source_version: 1
question: ¿Desde cuándo pueden las mujeres votar y elegir a nivel nacional en Suiza?
options:
  a: Desde 1918
  b: Desde 1848
  c: Desde 1971
  d: Desde 1991
explanation: A nivel de la Confederación, el derecho de voto de las mujeres se introdujo en 1971. Algunos
  cantones y municipios (Gemeinden) lo conocían antes, mientras que otros lo introdujeron más tarde. El
  último cantón en hacerlo fue Appenzell Rodas Interiores, en 1990.
