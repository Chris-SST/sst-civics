id: stadtrat-zuerich-aufgabe-verwaltung-leitung
lang: es
source_version: 1
question: ¿Qué función tiene el Consejo de la Ciudad (Stadtrat) de la ciudad de Zúrich?
options:
  a: Dirige la administración fiscal cantonal en la ciudad.
  b: Promulga las leyes cantonales para el territorio de la ciudad.
  c: Imparte justicia en los litigios entre los habitantes.
  d: Dirige la administración de la ciudad y establece las directrices de la actuación de la ciudad.
explanation: El Consejo de la Ciudad es el poder ejecutivo de la ciudad de Zúrich. Dirige la administración
  de la ciudad y determina en qué dirección se desarrolla la ciudad. Los tribunales imparten justicia,
  y las leyes cantonales las promulga el Consejo Cantonal (Kantonsrat).
