    question_de: Welche Funktion hat der Stadtrat der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die kantonalen Gesetze für das Gebiet der Stadt.
      c: Er spricht Recht in den Streitigkeiten zwischen den Einwohnern.
      d: Er leitet die Verwaltung der Stadt und legt die Richtlinien für das Handeln der Stadt fest.
    explanation_de: Der Stadtrat ist die ausführende Gewalt der Stadt Zürich. Er leitet die Verwaltung
      der Stadt und bestimmt, in welche Richtung sich die Stadt entwickelt. Die Gerichte sprechen Recht,
      und die kantonalen Gesetze werden vom Kantonsrat erlassen.
