id: staenderat-vertritt-anliegen-kantone
lang: es
source_version: 1
question: ¿Qué cámara del Parlamento defiende principalmente los intereses de los cantones?
options:
  a: El Consejo Federal (Bundesrat)
  b: El Consejo Nacional (Nationalrat)
  c: El Consejo de los Estados (Ständerat)
  d: El Tribunal Federal (Bundesgericht)
explanation: El Consejo de los Estados (Ständerat) representa sobre todo a los cantones. Cada cantón envía
  representantes a esta cámara. El Consejo Nacional (Nationalrat), en cambio, representa al pueblo.
