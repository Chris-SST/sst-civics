    question_de: Wer kann eine eidgenössische Volksinitiative unterschreiben?
    options_de:
      a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
      b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung (Bewilligung C)
      c: Nur Mitglieder einer politischen Partei ab 18 Jahren
      d: Schweizer Bürgerinnen und Bürger ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative kann unterschreiben, wer auf Ebene des Bundes
      stimmberechtigt ist. Dabei handelt es sich um Schweizerinnen und Schweizer ab 18 Jahren, auch die
      im Ausland wohnhaften, wenn sie im Stimmregister eingetragen sind. Ausgeschlossen sind nur Personen,
      die wegen dauernder Urteilsunfähigkeit unter einer umfassenden Beistandschaft stehen oder durch
      eine Person vertreten werden, die durch einen Vorsorgeauftrag bestimmt wurde; Ausländerinnen und
      Ausländer haben auf Ebene des Bundes keine politischen Rechte, nicht einmal mit der Bewilligung
      C.
