id: volksinitiative-unterschreiben-wer-darf
lang: es
source_version: 2
question: ¿Quién puede firmar una iniciativa popular (Volksinitiative) federal?
options:
  a: Todas las personas a partir de los 16 años con domicilio en Suiza
  b: Todas las personas a partir de los 18 años con permiso de establecimiento (Niederlassungsbewilligung)
    (permiso C)
  c: Solo los miembros de un partido político a partir de los 18 años
  d: Ciudadanas y ciudadanos suizos a partir de los 18 años
explanation: Puede firmar una iniciativa popular federal quien tiene derecho de voto a nivel de la Confederación.
  Se trata de las suizas y los suizos a partir de los 18 años, también los residentes en el extranjero,
  si están inscritos en el registro electoral. Solo quedan excluidas las personas que, por incapacidad
  de discernimiento permanente, están bajo una curatela general o están representadas por una persona
  designada mediante un mandato por causa de incapacidad; las extranjeras y los extranjeros no tienen
  derechos políticos a nivel de la Confederación, ni siquiera con el permiso C.
