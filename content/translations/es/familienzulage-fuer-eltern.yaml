id: familienzulage-fuer-eltern
lang: es
source_version: 1
question: ¿Qué prestación estatal reciben en Suiza los padres que trabajan por cuenta ajena o por cuenta
  propia y tienen hijos?
options:
  a: La renta de invalidez
  b: La prestación por desempleo
  c: La prestación complementaria del seguro de vejez y supervivencia (AHV)
  d: El subsidio familiar
explanation: Los subsidios familiares ayudan a las familias a asumir una parte de los costes de los hijos.
  Se componen de subsidios por hijo y subsidios de formación. También los trabajadores por cuenta propia
  pueden recibirlos.
