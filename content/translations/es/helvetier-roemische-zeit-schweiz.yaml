id: helvetier-roemische-zeit-schweiz
lang: es
source_version: 1
question: ¿Qué pueblo se asentaba en el territorio de la actual Suiza en la época de los romanos?
options:
  a: Los hunos
  b: Los vikingos
  c: Los godos
  d: Los helvecios
explanation: Los helvecios eran una tribu celta del Mittelland (la meseta suiza). Los romanos los sometieron
  y el territorio pasó a formar parte del Imperio romano. El nombre latino Helvetia, que designa a Suiza,
  aún los recuerda.
