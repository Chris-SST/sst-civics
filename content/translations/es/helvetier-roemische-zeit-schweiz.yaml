    question_de: Welches Volk liess sich zur Zeit der Römer auf dem Gebiet der heutigen Schweiz nieder?
    options_de:
      a: Die Hunnen
      b: Die Wikinger
      c: Die Goten
      d: Die Helvetier
    explanation_de: Die Helvetier waren ein keltischer Stamm des Mittellandes (der Schweizer Hochebene).
      Die Römer unterwarfen sie, und das Gebiet wurde Teil des Römischen Reiches. Der lateinische Name
      Helvetia, der die Schweiz bezeichnet, erinnert noch immer an sie.
