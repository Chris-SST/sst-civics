    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er führte die Schweizer Truppen im Sonderbundskrieg an.
      b: Er verfasste allein die erste Bundesverfassung.
      c: Er gründete das Rote Kreuz in Genf.
      d: Er förderte die ETH und den Bau der Eisenbahn und gründete die Bank, aus der die Credit Suisse
        hervorging.
    explanation_de: Im 19. Jahrhundert setzte sich Alfred Escher für die Gründung der ETH Zürich und für
      den Bau von Eisenbahnen ein, vor allem der Gotthardbahn. 1856 gründete er die Schweizerische Kreditanstalt
      (Schweizerische Kreditbank), die spätere Credit Suisse. Diese Bank wurde 2023 von der UBS übernommen.
