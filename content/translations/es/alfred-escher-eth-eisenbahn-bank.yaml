id: alfred-escher-eth-eisenbahn-bank
lang: es
source_version: 2
question: ¿Por qué es conocido el político y empresario zuriqués Alfred Escher?
options:
  a: Dirigió a las tropas suizas en la guerra del Sonderbund.
  b: Redactó él solo la primera Constitución Federal.
  c: Fundó la Cruz Roja en Ginebra.
  d: Impulsó la ETH y la construcción del ferrocarril y fundó el banco del que surgió Credit Suisse.
explanation: En el siglo XIX, Alfred Escher se comprometió con la fundación de la ETH de Zúrich y con
  la construcción de ferrocarriles, sobre todo del ferrocarril del Gotardo. En 1856 fundó el Schweizerische
  Kreditanstalt (Banco Suizo de Crédito), la posterior Credit Suisse. Este banco fue adquirido por UBS
  en 2023.
