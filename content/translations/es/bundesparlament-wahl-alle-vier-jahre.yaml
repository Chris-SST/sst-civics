    question_de: In welchem Abstand wählt das Volk das Parlament des Bundes neu?
    options_de:
      a: Alle drei Jahre
      b: Alle vier Jahre
      c: Alle sechs Jahre
      d: Alle zwei Jahre
    explanation_de: Das Volk wählt den Nationalrat alle vier Jahre neu. Heute werden in allen Kantonen
      auch die Mitglieder des Ständerates für vier Jahre gewählt. Jeder Kanton bestimmt selbst, wie die
      Wahl durchgeführt wird und teilweise auch, wann.
