id: bundesparlament-wahl-alle-vier-jahre
lang: es
source_version: 2
question: ¿Con qué periodicidad elige el pueblo de nuevo el Parlamento de la Confederación?
options:
  a: Cada tres años
  b: Cada cuatro años
  c: Cada seis años
  d: Cada dos años
explanation: El pueblo elige de nuevo el Consejo Nacional (Nationalrat) cada cuatro años. Hoy en día,
  también los miembros del Consejo de los Estados (Ständerat) son elegidos por cuatro años en todos los
  cantones. Cada cantón determina por sí mismo cómo se realiza la elección y, en parte, también cuándo.
