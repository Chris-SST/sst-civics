id: gleichberechtigung-frau-mann-bedeutung
lang: es
source_version: 1
question: ¿Qué significa, en principio, la igualdad de derechos entre mujeres y hombres?
options:
  a: Las mujeres y los hombres tienen, en principio, los mismos derechos.
  b: Las mujeres y los hombres tienen en todos los ámbitos de la vida las mismas obligaciones, pero derechos
    diferentes.
  c: Las mujeres y los hombres ganan exactamente lo mismo en cualquier profesión.
  d: Las mujeres y los hombres deben repartirse por igual todas las tareas de la familia.
explanation: La igualdad de derechos significa que ambos sexos poseen, en principio, los mismos derechos.
  Está consagrada en la Constitución Federal. El principio no dice nada sobre cómo reparten las familias
  sus tareas en cada caso concreto.
