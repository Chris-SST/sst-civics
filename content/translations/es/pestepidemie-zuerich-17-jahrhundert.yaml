id: pestepidemie-zuerich-17-jahrhundert
lang: es
source_version: 1
question: ¿Qué catástrofe costó la vida a casi la mitad de la población de Zúrich a principios del siglo
  XVII?
options:
  a: Un incendio en la ciudad
  b: Una epidemia de peste
  c: Una inundación
  d: Una hambruna
explanation: A principios del siglo XVII, casi la mitad de los habitantes de Zúrich murió a causa de la
  peste. La peste era una enfermedad contagiosa que se extendió varias veces por Europa en aquella época.
