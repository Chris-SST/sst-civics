id: kanton-zuerich-anzahl-bezirke
lang: es
source_version: 1
question: ¿En cuántos distritos está dividido el cantón de Zúrich?
options:
  a: En diez distritos
  b: En doce distritos
  c: En catorce distritos
  d: En ocho distritos
explanation: El cantón de Zúrich está dividido en doce distritos, por ejemplo Affoltern, Meilen, Winterthur
  y Zúrich. Los distritos son circunscripciones administrativas y judiciales situadas entre el cantón
  y los municipios (Gemeinden).
