    question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Ebene des Bundes?
    options_de:
      a: Gegen die vom Nationalrat und vom Ständerat verabschiedeten Gesetze
      b: Gegen die von der Bundeskanzlei gefassten Beschlüsse
      c: Gegen die vom Bundesgericht gefällten Urteile
      d: Gegen die von einzelnen Gemeinden erlassenen Reglemente
    explanation_de: Ein Referendum richtet sich gegen die vom Parlament verabschiedeten Gesetze. Das Parlament
      setzt sich aus dem Nationalrat und dem Ständerat zusammen. Gerichtsurteile und Verwaltungsentscheide
      können nicht mittels eines Referendums angefochten werden.
