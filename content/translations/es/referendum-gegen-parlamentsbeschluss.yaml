id: referendum-gegen-parlamentsbeschluss
lang: es
source_version: 1
question: ¿Contra qué decisiones se dirige un referéndum a nivel de la Confederación?
options:
  a: Contra las leyes aprobadas por el Consejo Nacional (Nationalrat) y el Consejo de los Estados (Ständerat)
  b: Contra las decisiones adoptadas por la Cancillería Federal (Bundeskanzlei)
  c: Contra las sentencias dictadas por el Tribunal Federal (Bundesgericht)
  d: Contra los reglamentos dictados por municipios (Gemeinde) individuales
explanation: Un referéndum se dirige contra las leyes aprobadas por el Parlamento. El Parlamento se compone
  del Consejo Nacional y del Consejo de los Estados. Las sentencias judiciales y las decisiones administrativas
  no se pueden impugnar mediante un referéndum.
