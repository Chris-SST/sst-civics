id: universitaet-zuerich-traegerschaft-kanton
lang: es
source_version: 1
question: ¿Quién es responsable en el cantón de Zúrich del funcionamiento y de la entidad titular de la
  Universidad de Zúrich?
options:
  a: La Confederación
  b: La ciudad de Zúrich
  c: El cantón de Zúrich
  d: Los consejos de distrito del cantón
explanation: La Universidad de Zúrich es una universidad cantonal. El cantón de Zúrich es su entidad titular
  y la gestiona. La ciudad de Zúrich y la Confederación no son los principales responsables de ella.
