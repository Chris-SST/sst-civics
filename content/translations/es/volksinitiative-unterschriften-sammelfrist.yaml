id: volksinitiative-unterschriften-sammelfrist
lang: es
source_version: 1
question: ¿Cuántas firmas necesita una iniciativa popular (Volksinitiative) federal y durante cuánto tiempo
  se pueden recoger?
options:
  a: 100 000 firmas en 100 días
  b: 50 000 firmas en 100 días
  c: 50 000 firmas en 18 meses
  d: 100 000 firmas en 18 meses
explanation: Una iniciativa popular federal necesita 100 000 firmas válidas en un plazo de 18 meses. El
  referéndum facultativo, en cambio, necesita 50 000 firmas en 100 días.
