id: anmeldung-wohngemeinde-bei-zuzug
lang: es
source_version: 1
question: ¿Qué deben hacer las personas que se establecen en un municipio (Gemeinde)?
options:
  a: Deben registrarse en el municipio de residencia.
  b: Deben presentarse en el ejército.
  c: Deben presentarse ante el Consejo Federal (Bundesrat).
  d: Deben presentarse en la administración de impuestos de la Confederación.
explanation: Quien se traslada a un nuevo lugar debe registrarse en el municipio de residencia. Por lo
  general, esto se hace en la oficina de control de habitantes (Einwohnerkontrolle). De este modo, el
  municipio está informado sobre sus habitantes.
