question: ¿Entre quiénes se libró en Suiza la guerra del Sonderbund en 1847?
options:
  a: Entre los cantones de habla alemana y los cantones de habla francesa
  b: Entre las fuerzas liberales y los cantones católicos
  c: Entre los cantones urbanos y los cantones rurales por los impuestos
  d: Entre Suiza y Francia
explanation: En el Sonderbund se habían unido varios cantones católicos y conservadores. Las fuerzas liberales
  querían una Confederación más fuerte. La breve guerra terminó con la victoria del bando liberal y allanó
  el camino hacia el Estado federal de 1848.
