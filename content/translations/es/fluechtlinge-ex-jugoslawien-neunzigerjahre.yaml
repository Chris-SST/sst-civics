id: fluechtlinge-ex-jugoslawien-neunzigerjahre
lang: es
source_version: 1
question: ¿Por qué motivo muchas personas de la antigua Yugoslavia buscaron acogida en Suiza en la década
  de 1990?
options:
  a: Querían estudiar en universidades suizas.
  b: Huían de una gran catástrofe natural.
  c: Huían de la guerra en su país de origen.
  d: Fueron contratadas por empresas suizas como trabajadores de temporada (Saisonniers).
explanation: La desintegración de Yugoslavia provocó guerras en la década de 1990. Por eso, muchas personas
  buscaron protección en Suiza. Una parte de ellas se quedó y vive hoy aquí.
