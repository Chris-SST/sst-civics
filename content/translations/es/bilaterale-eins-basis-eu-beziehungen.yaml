    question_de: Welche Verträge, die vom Volk im Jahr 2000 genehmigt wurden, bilden die Grundlage der
      heutigen Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen Abkommen I
      b: Der EWR-Vertrag
      c: Der Schengen-Vertrag allein
      d: Der Vertrag über den Beitritt zur EU
    explanation_de: Die Stimmberechtigten genehmigten die Bilateralen Abkommen I im Jahr 2000. Diese regeln
      den Zugang zu bestimmten Bereichen des Binnenmarkts, zum Beispiel die Personenfreizügigkeit und
      den Landverkehr. Das Volk hatte den EWR 1992 nicht genehmigt.
