id: bilaterale-eins-basis-eu-beziehungen
lang: es
source_version: 1
question: ¿Qué tratados, aprobados por el pueblo en el año 2000, constituyen la base de las actuales relaciones
  de Suiza con la UE?
options:
  a: Los Acuerdos Bilaterales I
  b: El tratado del EEE
  c: El tratado de Schengen por sí solo
  d: El tratado de adhesión a la UE
explanation: El electorado aprobó los Acuerdos Bilaterales I en el año 2000. Estos regulan el acceso a
  determinados ámbitos del mercado interior, por ejemplo la libre circulación de personas y el transporte
  terrestre. El pueblo no había aprobado el EEE en 1992.
