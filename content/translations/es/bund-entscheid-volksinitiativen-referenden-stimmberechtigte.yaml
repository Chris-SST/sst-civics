id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: es
source_version: 1
question: ¿Quién decide de manera definitiva, a nivel de la Confederación, en una votación si se aprueba
  una iniciativa popular (Volksinitiative) o un referéndum?
options:
  a: La Asamblea Federal (Bundesversammlung) en una sesión conjunta de ambas cámaras
  b: El Consejo Federal (Bundesrat) tras consultar a los gobiernos de los cantones
  c: El Tribunal Federal (Bundesgericht) tras un examen jurídico del proyecto
  d: Los ciudadanos con derecho a voto, que votan en la urna o por correo
explanation: En las iniciativas populares y los referéndums, los ciudadanos con derecho a voto tienen
  la última palabra. Deciden en la votación popular en la urna, que en Suiza también es posible por correo.
  El Consejo Federal, el Parlamento y el Tribunal Federal no pueden sustituir el resultado.
