    question_de: Wer entscheidet auf Ebene des Bundes in einer Abstimmung endgültig darüber, ob eine Volksinitiative
      oder ein Referendum angenommen wird?
    options_de:
      a: Die Bundesversammlung in einer gemeinsamen Sitzung beider Kammern
      b: Der Bundesrat nach Anhörung der Regierungen der Kantone
      c: Das Bundesgericht nach einer rechtlichen Prüfung der Vorlage
      d: Die stimmberechtigten Bürger, die an der Urne oder brieflich abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die stimmberechtigten Bürger das letzte
      Wort. Sie entscheiden in der Volksabstimmung an der Urne, was in der Schweiz auch brieflich möglich
      ist. Der Bundesrat, das Parlament und das Bundesgericht können das Ergebnis nicht ersetzen.
