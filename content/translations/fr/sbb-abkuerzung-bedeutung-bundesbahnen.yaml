question: Que signifie l'abréviation «SBB» que l'on voit sur les trains et dans les gares en Suisse ?
options:
  a: Schweizer Busbetriebe (entreprises suisses de bus)
  b: Schweizerische Bundesbahnen (chemins de fer fédéraux suisses)
  c: Schweizerische Bahn- und Busbetriebe (entreprises suisses de chemins de fer et de bus)
  d: Schweizer Bergbahnen (chemins de fer de montagne suisses)
explanation: SBB signifie Schweizerische Bundesbahnen (chemins de fer fédéraux suisses). L'entreprise
  exploite une grande partie du réseau ferroviaire suisse et appartient à la Confédération. Il existe
  en outre d'autres entreprises ferroviaires, par exemple le BLS ou le Chemin de fer rhétique.
