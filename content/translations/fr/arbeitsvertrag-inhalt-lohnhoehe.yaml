    question_de: Was wird insbesondere im Arbeitsvertrag zwischen dem Arbeitgeber und der Arbeitnehmerin
      festgelegt?
    options_de:
      a: Die Höhe des Lohnes
      b: Die Höhe der Rente der Alters- und Hinterlassenenversicherung (AHV)
      c: Die Höhe der Mehrwertsteuer
      d: Die Höhe der Prämie der Krankenkasse
    explanation_de: Der Arbeitsvertrag legt die wichtigsten Bedingungen der Arbeit fest, zum Beispiel
      die Tätigkeit, die Arbeitszeit und den Lohn. Die AHV-Rente, die Mehrwertsteuer und die Prämie der
      Krankenkasse werden nicht im Arbeitsvertrag festgelegt.
