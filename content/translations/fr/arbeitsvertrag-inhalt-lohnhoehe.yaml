id: arbeitsvertrag-inhalt-lohnhoehe
lang: fr
source_version: 1
question: Qu'est-ce qui est notamment fixé dans le contrat de travail entre l'employeur et l'employée
  ?
options:
  a: Le montant du salaire
  b: Le montant de la rente de l'assurance-vieillesse et survivants (AHV)
  c: Le montant de la taxe sur la valeur ajoutée
  d: Le montant de la prime de la caisse-maladie (Krankenkasse)
explanation: Le contrat de travail définit les principales conditions du travail, par exemple l'activité,
  le temps de travail et le salaire. La rente AVS, la taxe sur la valeur ajoutée et la prime de la caisse-maladie
  ne sont pas fixées dans le contrat de travail.
