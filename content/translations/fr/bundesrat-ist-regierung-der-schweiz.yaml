id: bundesrat-ist-regierung-der-schweiz
lang: fr
source_version: 1
question: Quel est le rôle du Conseil fédéral (Bundesrat) en Suisse ?
options:
  a: Il est le gouvernement de la Suisse.
  b: Il est la plus haute juridiction du pays.
  c: Il est le parlement de la Confédération.
  d: Il est la représentation des cantons.
explanation: Le Conseil fédéral est l'autorité dirigeante et exécutive suprême de la Confédération, donc
  le gouvernement. Il compte sept membres. Le Parlement et le Tribunal fédéral (Bundesgericht) sont d'autres
  pouvoirs.
