question: Comment la Suisse se portait-elle économiquement durant les décennies qui ont suivi la Seconde
  Guerre mondiale, par exemple dans les années 1960 ?
options:
  a: 'Sa situation s''améliorait sans cesse : il y avait beaucoup de travail et le niveau de vie de nombreuses
    personnes augmentait.'
  b: L'économie s'est fortement contractée et beaucoup de personnes se sont retrouvées au chômage.
  c: La Suisse est devenue membre de l'Union européenne.
  d: La Suisse n'avait plus besoin de main-d'œuvre venant de l'étranger.
explanation: Après la Seconde Guerre mondiale, l'économie suisse a connu une forte croissance. Il y avait
  beaucoup de travail, et beaucoup de personnes pouvaient se permettre davantage. Les entreprises ont
  donc fait venir de nombreux travailleurs de l'étranger, au début surtout d'Italie.
