question: Qui peut vous aider pour des questions de droit du travail ?
options:
  a: La commission scolaire (Schulpflege) et la paroisse
  b: Les avocats, les syndicats et les tribunaux des prud'hommes
  c: Les entreprises de transports publics et la Poste
  d: Les offices de l'état civil et le contrôle des habitants
explanation: Pour les questions de droit du travail, il existe plusieurs interlocuteurs. Parmi eux figurent
  les avocates et les avocats, les syndicats et les tribunaux des prud'hommes. Les autres services sont
  compétents pour d'autres tâches.
