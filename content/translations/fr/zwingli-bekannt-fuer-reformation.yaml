question: Pour quelle raison Huldrych (Ulrich) Zwingli est-il surtout connu dans l'histoire de Zurich
  ?
options:
  a: Il a construit le premier chemin de fer du canton.
  b: Il a été le premier président de la Confédération (Bundespräsident) de la Suisse.
  c: Il a introduit le droit de vote des femmes.
  d: Il a été le chef de la Réforme à Zurich.
explanation: Au 16e siècle, Huldrych (Ulrich) Zwingli a dirigé la Réforme à Zurich, et l'Église zurichoise
  est devenue réformée. Le chemin de fer, l'État fédéral avec un président de la Confédération et le droit
  de vote des femmes ne sont apparus que plusieurs siècles plus tard.
