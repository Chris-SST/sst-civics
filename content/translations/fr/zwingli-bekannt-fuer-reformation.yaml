    question_de: Wofür ist Huldrych (Ulrich) Zwingli in der Geschichte Zürichs vor allem bekannt?
    options_de:
      a: Er hat die erste Eisenbahn des Kantons gebaut.
      b: Er war der erste Bundespräsident der Schweiz.
      c: Er hat das Frauenstimmrecht eingeführt.
      d: Er war der Anführer der Reformation in Zürich.
    explanation_de: Im 16. Jahrhundert leitete Huldrych (Ulrich) Zwingli die Reformation in Zürich, und
      die Zürcher Kirche wurde reformiert. Die Eisenbahn, der Bundesstaat mit einem Bundespräsidenten
      und das Frauenstimmrecht sind erst mehrere Jahrhunderte später entstanden.
