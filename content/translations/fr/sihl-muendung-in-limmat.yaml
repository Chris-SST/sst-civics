id: sihl-muendung-in-limmat
lang: fr
source_version: 1
question: Dans quelle rivière la Sihl se jette-t-elle au milieu de la ville de Zurich ?
options:
  a: Dans la Töss
  b: Dans la Limmat
  c: Dans la Glatt
  d: Dans l'Aar
explanation: La Sihl traverse Zurich et se jette dans la Limmat au Platzspitz. La Glatt et la Töss sont
  d'autres cours d'eau zurichois qui se jettent dans le Rhin. L'Aar ne reçoit la Limmat que plus en aval,
  dans le canton d'Argovie.
