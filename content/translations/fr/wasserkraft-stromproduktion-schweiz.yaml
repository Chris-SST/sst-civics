id: wasserkraft-stromproduktion-schweiz
lang: fr
source_version: 1
question: La Suisse dispose de beaucoup d'eau. Comment celle-ci est-elle utilisée pour produire de l'électricité
  ?
options:
  a: Dans des centrales à gaz
  b: Dans des raffineries de pétrole
  c: Dans des centrales hydroélectriques
  d: Dans des centrales à charbon
explanation: L'eau des rivières et des lacs de retenue actionne des turbines dans les centrales hydroélectriques.
  En Suisse, la force hydraulique est une source d'électricité indigène essentielle.
