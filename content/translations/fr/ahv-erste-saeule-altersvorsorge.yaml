id: ahv-erste-saeule-altersvorsorge
lang: fr
source_version: 1
question: Quelle institution constitue le premier pilier de la prévoyance vieillesse en Suisse ?
options:
  a: Le pilier privé 3a
  b: L'assurance-vieillesse et survivants (AHV) de l'État
  c: La caisse de pension
  d: La caisse-maladie (Krankenkasse)
explanation: L'assurance-vieillesse et survivants (AHV) est la prévoyance étatique et constitue le premier
  pilier. La caisse de pension est le deuxième pilier, la prévoyance privée le troisième pilier.
