id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: fr
source_version: 1
question: La prévoyance vieillesse en Suisse repose sur trois piliers. Quelle institution constitue le
  deuxième pilier ?
options:
  a: Les prestations complémentaires à l'assurance-vieillesse et survivants (AHV)
  b: L'AVS (assurance de rente de l'État)
  c: La caisse de pension (prévoyance professionnelle)
  d: Le compte d'épargne privé avec déduction fiscale (pilier 3a)
explanation: La caisse de pension fait partie de la prévoyance professionnelle et constitue le deuxième
  pilier. Elle complète l'AVS afin que les retraités puissent continuer à maintenir de manière appropriée
  leur niveau de vie habituel. L'AVS est le premier pilier, la prévoyance privée le troisième.
