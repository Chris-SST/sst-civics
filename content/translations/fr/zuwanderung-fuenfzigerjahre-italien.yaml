question: De quel pays provenaient, dans les années 1950, la plupart des travailleurs qui ont immigré
  en Suisse ?
options:
  a: D'Italie
  b: De Turquie
  c: Du Portugal
  d: D'Espagne
explanation: Dans les années 1950, la plupart des travailleurs immigrés venaient d'Italie. L'économie
  avait alors besoin de beaucoup de main-d'œuvre, par exemple dans la construction et dans l'industrie.
  Plus tard, de nombreuses personnes sont également venues d'autres pays.
