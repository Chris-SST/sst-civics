id: zollwesen-zustaendigkeit-bund
lang: fr
source_version: 1
question: Qui s'occupe des douanes en Suisse ?
options:
  a: La Confédération
  b: Les communes (Gemeinden) situées à la frontière
  c: Les cantons dans lesquels se trouvent les frontières
  d: Les cantons et la Confédération, chacun pour moitié
explanation: Selon la Constitution fédérale, les douanes relèvent de la Confédération. Celle-ci règle
  les droits de douane et le contrôle de la circulation des marchandises à travers la frontière. Les cantons
  et les communes n'ont aucune compétence propre en la matière.
