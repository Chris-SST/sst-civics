    question_de: Welche Ebene ist in der Schweiz für den Umweltschutz und den Erlass der entsprechenden
      Vorschriften zuständig?
    options_de:
      a: Der Bund
      b: Die privaten Organisationen
      c: Allein die Gemeinden
