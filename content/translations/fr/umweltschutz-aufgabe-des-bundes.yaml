id: umweltschutz-aufgabe-des-bundes
lang: fr
source_version: 1
question: Quel niveau est responsable, en Suisse, de la protection de l'environnement et de l'édiction
  des prescriptions en la matière ?
options:
  a: La Confédération
  b: Les organisations privées
  c: Les communes (Gemeinden) seules
  d: Les districts seuls
explanation: La Constitution fédérale charge la Confédération de protéger l'être humain et son environnement
  contre les atteintes nuisibles. Elle édicte à cet effet des lois, par exemple sur la protection des
  eaux et de la nature. Les cantons mettent en œuvre beaucoup de ces prescriptions.
