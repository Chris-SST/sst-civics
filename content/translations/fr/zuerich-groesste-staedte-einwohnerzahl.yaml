question: Quelles sont, en nombre d'habitants, les trois plus grandes villes du canton de Zurich ?
options:
  a: Zurich, Uster et Wetzikon
  b: Zurich, Dietikon et Winterthour
  c: Zurich, Winterthour et Uster
  d: Zurich, Winterthour et Dübendorf
explanation: Zurich est de loin la plus grande ville, suivie de Winterthour et d'Uster. Dübendorf, Dietikon
  et Wetzikon sont également des villes assez grandes, mais elles comptent moins d'habitants qu'Uster.
