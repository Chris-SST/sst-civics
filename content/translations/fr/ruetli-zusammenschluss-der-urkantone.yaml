id: ruetli-zusammenschluss-der-urkantone
lang: fr
source_version: 1
question: Que symbolise le Grütli dans l'histoire suisse ?
options:
  a: L'union des cantons primitifs
  b: La victoire à la bataille de Marignan
  c: Le début de la Réforme
  d: La fondation de l'État fédéral en 1848
explanation: Selon la tradition, des représentants des cantons primitifs se seraient alliés sur le Grütli.
  C'est pourquoi il est considéré comme le symbole des débuts de la Confédération. La prairie se trouve
  au bord du lac des Quatre-Cantons.
