    question_de: Wer in der Schweiz muss keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen, die einen unbefristeten Arbeitsvertrag haben
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die in Teilzeit arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Beitragspflicht an die Arbeitslosenversicherung endet, wenn man das Rentenalter
      der AHV erreicht. Pensionierte Personen bezahlen auf einem allfälligen Lohn keine ALV-Beiträge mehr.
      Hingegen bezahlen Teilzeit- und Vollzeitangestellte Beiträge.
