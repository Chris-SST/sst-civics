id: alv-beitraege-pensionierte-personen
lang: fr
source_version: 1
question: Qui, en Suisse, n'a plus à payer de cotisations à l'assurance-chômage (AC) ?
options:
  a: Les personnes qui ont un contrat de travail de durée indéterminée
  b: Les personnes qui ont atteint l'âge ordinaire de la retraite de l'assurance-vieillesse et survivants
    (AHV)
  c: Les personnes qui travaillent à temps partiel
  d: Les personnes qui n'ont jamais été au chômage au cours des deux dernières années
explanation: L'obligation de cotiser à l'assurance-chômage prend fin lorsque l'on atteint l'âge de la
  retraite de l'AVS. Les personnes retraitées ne paient plus de cotisations AC sur un éventuel salaire.
  En revanche, les employés à temps partiel et à plein temps paient des cotisations.
