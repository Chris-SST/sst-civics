question: Combien de cantons la Suisse compte-t-elle et combien d'entre eux sont des demi-cantons ?
options:
  a: 26 cantons, dont 6 demi-cantons
  b: 26 cantons, dont 3 demi-cantons
  c: 23 cantons, dont 6 demi-cantons
  d: 20 cantons, dont 6 demi-cantons
explanation: 'La Suisse compte 26 cantons. Six d''entre eux sont des demi-cantons : Obwald, Nidwald, Bâle-Ville,
  Bâle-Campagne, Appenzell Rhodes-Extérieures et Appenzell Rhodes-Intérieures. Au Conseil des États (Ständerat),
  ils ont chacun une voix au lieu de deux.'
