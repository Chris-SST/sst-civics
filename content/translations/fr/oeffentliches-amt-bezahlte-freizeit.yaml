    question_de: Eine Angestellte oder ein Angestellter übt zusätzlich zu ihrer bzw. seiner Arbeit ein
      öffentliches Amt aus, zum Beispiel in der Schulbehörde der Gemeinde. Was gewährt der Arbeitgeber
      dafür normalerweise?
    options_de:
      a: Eine Prämie zusätzlich zum Lohn
      b: Eine Beförderung
      c: Bezahlte freie Zeit
      d: 'Nichts: Für dieses Amt muss man Ferien nehmen'
    explanation_de: Eine Person, die ein öffentliches Amt ausübt, erhält in der Regel von ihrem Arbeitgeber
      bezahlte freie Zeit. Die genaue Dauer hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von
      anderen Regelungen ab. Ein öffentliches Amt berechtigt weder zu einer Prämie noch zu einer Beförderung,
      und normalerweise ist es auch nicht nötig, für die Ausübung Ferien zu nehmen.
