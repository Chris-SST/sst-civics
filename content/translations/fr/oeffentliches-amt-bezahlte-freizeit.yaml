id: oeffentliches-amt-bezahlte-freizeit
lang: fr
source_version: 3
question: Une employée ou un employé exerce, en plus de son travail, une fonction publique, par exemple
  au sein de l'autorité scolaire de la commune (Gemeinde). Que l'employeur accorde-t-il normalement pour
  cela ?
options:
  a: Une prime en plus du salaire
  b: Une promotion
  c: Du temps libre payé
  d: 'Rien : pour cette fonction, il faut prendre des vacances'
explanation: Une personne qui exerce une fonction publique reçoit en règle générale de son employeur du
  temps libre payé. La durée exacte dépend du contrat de travail, de la convention collective de travail
  ou d'autres réglementations. Une fonction publique ne donne droit ni à une prime ni à une promotion,
  et normalement il n'est pas non plus nécessaire de prendre des vacances pour l'exercer.
