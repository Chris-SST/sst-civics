question: Qui est considéré comme frontalier ou frontalière en Suisse ?
options:
  a: Une personne qui travaille en Suisse, mais dont le domicile est à l'étranger et qui y retourne régulièrement
  b: Une personne qui travaille à la douane et contrôle la frontière nationale
  c: Une personne qui franchit la frontière sans autorisation pour travailler ici
  d: Une personne qui habite dans un canton et travaille chaque jour dans un autre canton
explanation: Les frontaliers et les frontalières ont leur lieu de travail en Suisse, mais vivent dans
  un autre pays. Ils ont besoin d'une autorisation de frontalier et retournent régulièrement, au moins
  une fois par semaine, à leur lieu de domicile à l'étranger. Celui qui fait uniquement la navette entre
  deux cantons n'est pas un frontalier.
