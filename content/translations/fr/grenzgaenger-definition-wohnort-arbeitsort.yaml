    question_de: Wer gilt in der Schweiz als Grenzgänger oder Grenzgängerin?
    options_de:
      a: Eine Person, die in der Schweiz arbeitet, aber ihren Wohnsitz im Ausland hat und regelmässig
        dorthin zurückkehrt
      b: Eine Person, die beim Zoll arbeitet und die Landesgrenze kontrolliert
      c: Eine Person, die die Grenze ohne Bewilligung überquert, um hier zu arbeiten
      d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
    explanation_de: Grenzgänger und Grenzgängerinnen haben ihren Arbeitsort in der Schweiz, leben aber
      in einem anderen Land. Sie brauchen eine Grenzgängerbewilligung und kehren regelmässig, mindestens
      einmal pro Woche, an ihren Wohnort im Ausland zurück. Wer nur zwischen zwei Kantonen pendelt, ist
      kein Grenzgänger.
