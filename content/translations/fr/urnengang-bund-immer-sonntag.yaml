id: urnengang-bund-immer-sonntag
lang: fr
source_version: 1
question: Quel jour de la semaine les votations et les élections fédérales ont-elles lieu en Suisse ?
options:
  a: Toujours un dimanche
  b: Toujours un samedi
  c: Toujours un vendredi
  d: Un jour de la semaine que chaque canton choisit lui-même
explanation: Les scrutins au niveau de la Confédération ont toujours lieu un dimanche. Ainsi, le plus
  grand nombre possible de personnes ayant le droit de vote peuvent y participer, et la date est la même
  pour tous.
