question: Que prévaut-il dans le canton de Zurich pour les personnes qui possèdent un chien ?
options:
  a: Elles doivent payer chaque année une taxe sur les chiens à la commune (Gemeinde).
  b: Elles doivent payer une seule fois, lors de l'achat du chien, une redevance à la Confédération.
  c: Elles doivent passer chaque année un examen avec leur chien auprès du canton.
  d: Elles ne doivent payer une taxe que si elles gagnent de l'argent avec le chien.
explanation: Dans le canton de Zurich, la personne qui possède un chien paie chaque année une taxe pour
  son chien, appelée impôt sur les chiens. L'argent va à la commune de domicile, et non à la Confédération.
  La taxe n'est pas unique et s'applique aussi aux chiens détenus uniquement à titre privé.
