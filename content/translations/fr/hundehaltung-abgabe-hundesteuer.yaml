    question_de: Was gilt im Kanton Zürich für Personen, die einen Hund besitzen?
    options_de:
      a: Sie müssen jedes Jahr eine Hundesteuer an die Gemeinde bezahlen.
      b: Sie müssen einmalig beim Kauf des Hundes eine Gebühr an den Bund bezahlen.
      c: Sie müssen jedes Jahr mit ihrem Hund eine Prüfung beim Kanton ablegen.
      d: Sie müssen nur dann eine Steuer bezahlen, wenn sie mit dem Hund Geld verdienen.
    explanation_de: Im Kanton Zürich bezahlt die Person, die einen Hund besitzt, jedes Jahr eine Abgabe
      für ihren Hund, die Hundesteuer genannt wird. Das Geld geht an die Wohngemeinde und nicht an den
      Bund. Die Abgabe ist nicht einmalig und gilt auch für Hunde, die nur privat gehalten werden.
