    question_de: Wer ist in der Schweiz grundsätzlich verpflichtet, Steuern zu zahlen?
    options_de:
      a: Personen, die in der Schweiz wohnen
      b: Nur Personen, die ein Unternehmen leiten
      c: Nur Personen mit Schweizer Bürgerrecht
      d: Nur Personen, die das Stimmrecht haben
    explanation_de: Die Steuerpflicht hängt vom Wohnsitz ab und nicht vom Bürgerrecht. Auch Ausländerinnen
      und Ausländer, die in der Schweiz wohnen, zahlen Steuern. Das Stimmrecht spielt dabei keine Rolle.
