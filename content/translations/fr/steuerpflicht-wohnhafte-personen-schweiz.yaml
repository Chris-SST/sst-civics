question: Qui est en principe tenu de payer des impôts en Suisse ?
options:
  a: Les personnes qui habitent en Suisse
  b: Uniquement les personnes qui dirigent une entreprise
  c: Uniquement les personnes ayant le droit de cité suisse (Bürgerrecht)
  d: Uniquement les personnes qui ont le droit de vote
explanation: L'assujettissement à l'impôt dépend du domicile et non du droit de cité. Les étrangères et
  les étrangers qui habitent en Suisse paient eux aussi des impôts. Le droit de vote ne joue aucun rôle
  à cet égard.
