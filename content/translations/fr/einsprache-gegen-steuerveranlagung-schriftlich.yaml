    question_de: Eine steuerpflichtige Person ist mit ihrer Steuerveranlagung nicht einverstanden. Was
      kann sie tun?
    options_de:
      a: Sie kann die Gemeindeversammlung abstimmen lassen.
      b: Sie kann sich weigern zu zahlen, ohne weitere Schritte zu unternehmen.
      c: Sie kann bei der Steuerbehörde schriftlich Einsprache erheben.
      d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
    explanation_de: Gegen die Veranlagung besteht der Rechtsweg der Einsprache. Sie muss schriftlich bei
      der Steuerbehörde erhoben werden, und zwar innerhalb einer bestimmten Frist.
