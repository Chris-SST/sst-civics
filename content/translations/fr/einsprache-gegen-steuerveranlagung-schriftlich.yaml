id: einsprache-gegen-steuerveranlagung-schriftlich
lang: fr
source_version: 1
question: Une personne assujettie à l'impôt n'est pas d'accord avec sa taxation fiscale. Que peut-elle
  faire ?
options:
  a: Elle peut faire voter l'assemblée communale (Gemeindeversammlung).
  b: Elle peut refuser de payer sans entreprendre d'autre démarche.
  c: Elle peut former une réclamation par écrit auprès de l'autorité fiscale.
  d: Elle peut déposer une initiative populaire (Volksinitiative) auprès du Conseil fédéral (Bundesrat).
explanation: Contre la taxation, il existe la voie de droit de la réclamation. Elle doit être formée par
  écrit auprès de l'autorité fiscale, et ce dans un délai déterminé.
