id: auslandschweizer-stimmrecht-vom-ausland
lang: fr
source_version: 2
question: Une Suissesse vit durablement à l'étranger. Comment peut-elle participer aux élections et aux
  votations fédérales ?
options:
  a: Elle ne peut voter que si elle se rend en Suisse pour cela.
  b: Elle peut uniquement participer aux élections, mais pas aux votations.
  c: Elle peut voter et élire depuis son lieu de résidence à l'étranger, sans se rendre en Suisse.
  d: Elle perd le droit de vote et d'éligibilité au niveau de la Confédération.
explanation: Les Suisses et Suissesses de l'étranger peuvent voter et élire au niveau fédéral sans devoir
  se rendre en Suisse. Pour cela, ils doivent être annoncés auprès de la représentation suisse compétente
  à l'étranger et demander par son intermédiaire leur inscription au registre des électeurs. Leur commune
  de vote leur envoie ensuite le matériel d'élection et de vote.
