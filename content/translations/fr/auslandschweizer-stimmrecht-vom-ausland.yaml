    question_de: Eine Schweizerin lebt dauerhaft im Ausland. Wie kann sie an den eidgenössischen Wahlen
      und Abstimmungen teilnehmen?
    options_de:
      a: Sie kann nur abstimmen, wenn sie dafür in die Schweiz reist.
      b: Sie kann nur an den Wahlen teilnehmen, aber nicht an den Abstimmungen.
      c: Sie kann von ihrem Wohnort im Ausland aus abstimmen und wählen, ohne in die Schweiz zu reisen.
      d: Sie verliert das Stimm- und Wahlrecht auf Ebene des Bundes.
    explanation_de: Auslandschweizerinnen und Auslandschweizer können auf Bundesebene abstimmen und wählen,
      ohne in die Schweiz reisen zu müssen. Dafür müssen sie bei der zuständigen schweizerischen Vertretung
      im Ausland gemeldet sein und über diese ihre Eintragung in das Stimmregister beantragen. Ihre Stimmgemeinde
      schickt ihnen anschliessend das Wahl- und Abstimmungsmaterial.
