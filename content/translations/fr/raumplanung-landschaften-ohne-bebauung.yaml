id: raumplanung-landschaften-ohne-bebauung
lang: fr
source_version: 2
question: Quel est un objectif de l'aménagement du territoire en Suisse ?
options:
  a: Il doit protéger les paysages non bâtis et utiliser le sol avec parcimonie.
  b: Il doit redéfinir régulièrement les frontières entre les cantons.
  c: Il doit créer le plus grand nombre possible de nouvelles zones à bâtir.
  d: Il doit fixer le prix des terrains à bâtir.
explanation: L'aménagement du territoire détermine où l'on peut construire et où l'on ne le peut pas.
  Il sépare le territoire à bâtir du territoire non constructible, afin de préserver les paysages et les
  terres cultivées. Comme le sol est rare, il faut l'utiliser avec parcimonie et plutôt densifier les
  zones urbanisées existantes que créer de nouvelles zones à bâtir.
