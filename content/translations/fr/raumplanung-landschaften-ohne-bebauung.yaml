    question_de: Was ist ein Ziel der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll die unbebauten Landschaften schützen und den Boden haushälterisch nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis des Baulands festlegen.
    explanation_de: Die Raumplanung bestimmt, wo gebaut werden darf und wo nicht. Sie trennt das Baugebiet
      vom nicht bebaubaren Gebiet, um die Landschaften und das Kulturland zu erhalten. Da der Boden knapp
      ist, muss er haushälterisch genutzt werden, und man soll eher die bestehenden überbauten Gebiete
      verdichten, als neue Bauzonen zu schaffen.
