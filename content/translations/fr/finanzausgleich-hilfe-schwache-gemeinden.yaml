    question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden des Kantons Zürich?
    options_de:
      a: Er senkt die Steuern in allen Gemeinden auf einen identischen Satz.
      b: Er bezahlt den Gemeinden die Kosten der Gemeindeversammlungen.
      c: Er hilft finanzschwachen Gemeinden oder Gemeinden, die durch hohe Sozialkosten benachteiligt
        sind, ihre Aufgaben zu erfüllen.
      d: Er verteilt das Geld des Bundes gleichmässig auf alle Einwohnerinnen und Einwohner.
    explanation_de: Die Gemeinden haben sehr unterschiedliche finanzielle Möglichkeiten. Der Finanzausgleich
      gleicht diese Unterschiede teilweise aus. So können auch Gemeinden, die eine geringe Steuerkraft
      oder hohe Sozialkosten haben, ihre Aufgaben erfüllen.
