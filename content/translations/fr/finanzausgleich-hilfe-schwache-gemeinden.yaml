id: finanzausgleich-hilfe-schwache-gemeinden
lang: fr
source_version: 1
question: À quoi sert la péréquation financière entre les communes (Gemeinden) du canton de Zurich ?
options:
  a: Elle réduit les impôts à un taux identique dans toutes les communes.
  b: Elle paie aux communes les coûts des assemblées communales (Gemeindeversammlungen).
  c: Elle aide les communes financièrement faibles ou pénalisées par des coûts sociaux élevés à accomplir
    leurs tâches.
  d: Elle répartit l'argent de la Confédération de manière égale entre tous les habitants et toutes les
    habitantes.
explanation: Les communes ont des capacités financières très différentes. La péréquation financière compense
  en partie ces différences. Ainsi, les communes qui ont une faible capacité fiscale ou des coûts sociaux
  élevés peuvent elles aussi accomplir leurs tâches.
