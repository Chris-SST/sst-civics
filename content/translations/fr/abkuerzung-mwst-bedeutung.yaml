id: abkuerzung-mwst-bedeutung
lang: fr
source_version: 1
question: Sur les factures et les quittances figure souvent l'abréviation «MWST». Que signifie-t-elle
  ?
options:
  a: Impôt sur les logements locatifs (Mietwohnungssteuer)
  b: Impôt militaire de défense (Militärwehrsteuer)
  c: Impôt sur les véhicules à moteur (Motorwagensteuer)
  d: Taxe sur la valeur ajoutée (Mehrwertsteuer)
explanation: MWST signifie Mehrwertsteuer, c'est-à-dire taxe sur la valeur ajoutée. Elle est prélevée
  sur la plupart des biens et des services et est comprise dans le prix. Elle constitue une source de
  revenus importante de la Confédération.
