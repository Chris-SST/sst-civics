question: Qui élit les membres du Conseil national (Nationalrat) ?
options:
  a: Le Conseil fédéral (Bundesrat) les nomme.
  b: Les partis les désignent sans élection.
  c: Le Tribunal fédéral (Bundesgericht) les choisit.
  d: Les citoyennes et citoyens ayant le droit de vote les élisent directement.
explanation: Les membres du Conseil national sont élus tous les quatre ans directement par les électeurs.
  Aujourd'hui, les membres du Conseil des États (Ständerat) sont eux aussi élus par le peuple dans tous
  les cantons, selon les règles de chaque canton ; en Appenzell Rhodes-Intérieures, cette élection a lieu
  lors de la Landsgemeinde.
