id: anmeldung-wohngemeinde-bei-zuzug
lang: fr
source_version: 1
question: Que doivent faire les personnes qui s'établissent dans une commune (Gemeinde) ?
options:
  a: Elles doivent s'annoncer auprès de leur commune de domicile.
  b: Elles doivent s'annoncer auprès de l'armée.
  c: Elles doivent s'annoncer auprès du Conseil fédéral (Bundesrat).
  d: Elles doivent s'annoncer auprès de l'administration fiscale de la Confédération.
explanation: Toute personne qui s'installe dans un nouvel endroit doit s'enregistrer auprès de sa commune
  de domicile. Cela se fait en général au contrôle des habitants. Ainsi, la commune est informée de ses
  habitantes et habitants.
