    question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
    options_de:
      a: Sie müssen sich bei ihrer Wohnsitzgemeinde anmelden.
      b: Sie müssen sich bei der Armee anmelden.
      c: Sie müssen sich beim Bundesrat anmelden.
      d: Sie müssen sich bei der Steuerverwaltung des Bundes anmelden.
    explanation_de: Jede Person, die sich an einem neuen Ort niederlässt, muss sich bei ihrer Wohnsitzgemeinde
      registrieren. Das geschieht in der Regel bei der Einwohnerkontrolle. So ist die Gemeinde über ihre
      Einwohnerinnen und Einwohner informiert.
