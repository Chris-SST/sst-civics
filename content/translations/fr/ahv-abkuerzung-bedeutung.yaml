id: ahv-abkuerzung-bedeutung
lang: fr
source_version: 1
question: Que signifie l'abréviation AHV (assurance-vieillesse et survivants, AVS) ?
options:
  a: Assurance-vieillesse et survivants
  b: Assurance officielle du ménage
  c: Aide générale pour les assurés
  d: Assurance-chômage et assurance de guérison
explanation: L'AHV signifie « Alters- und Hinterlassenenversicherung », c'est-à-dire assurance-vieillesse
  et survivants. Elle verse des rentes à la retraite et aux survivants, par exemple aux veuves, aux veufs
  et aux orphelins.
