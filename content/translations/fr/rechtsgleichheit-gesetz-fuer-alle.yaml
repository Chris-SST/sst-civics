    question_de: Was bedeutet der Grundsatz der Rechtsgleichheit (Gleichheit vor dem Gesetz)?
    options_de:
      a: Alle Kantone haben die gleichen Gesetze.
      b: Alle Personen haben die gleichen politischen Ämter inne.
      c: Alle Personen haben das gleiche Einkommen.
      d: Das Gesetz wird auf alle Personen auf die gleiche Weise angewendet.
    explanation_de: Die Gleichheit vor dem Gesetz steht in Artikel 8 der Bundesverfassung. Alle Menschen
      sind vor dem Gesetz gleich und niemand darf diskriminiert werden, zum Beispiel wegen seiner Herkunft
      oder seines Geschlechts. Das bedeutet nicht, dass alle gleich viel besitzen.
