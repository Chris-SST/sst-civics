id: rechtsgleichheit-gesetz-fuer-alle
lang: fr
source_version: 1
question: Que signifie le principe de l'égalité devant la loi ?
options:
  a: Tous les cantons ont les mêmes lois.
  b: Toutes les personnes occupent les mêmes fonctions politiques.
  c: Toutes les personnes ont le même revenu.
  d: La loi s'applique de la même manière à toutes les personnes.
explanation: L'égalité devant la loi figure à l'article 8 de la Constitution fédérale. Tous les êtres
  humains sont égaux devant la loi et personne ne doit être discriminé, par exemple en raison de son origine
  ou de son sexe. Cela ne signifie pas que tout le monde possède autant.
