question: Qui exploite les écoles du niveau primaire dans le canton de Zurich ?
options:
  a: La Direction de l'instruction publique du canton
  b: La Confédération
  c: Les communes (Gemeinden)
  d: Les districts
explanation: Dans le canton de Zurich, ce sont les communes qui exploitent les écoles primaires. Selon
  le lieu, il s'agit des communes politiques ou de communes scolaires distinctes, et la Schulpflege élue
  est l'autorité scolaire locale. Le canton ne fixe que le cadre, par exemple le plan d'études, et surveille
  l'école obligatoire.
