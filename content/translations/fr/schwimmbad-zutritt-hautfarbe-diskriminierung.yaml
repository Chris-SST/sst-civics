id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: fr
source_version: 1
question: Une piscine publique refuse l'entrée à une personne en raison de la couleur de sa peau. Quel
  principe de la Constitution fédérale est ainsi violé ?
options:
  a: La liberté économique
  b: L'interdiction de la discrimination
  c: Le droit de vote
  d: Le droit au mariage et à la famille
explanation: La Constitution fédérale interdit la discrimination à l'article 8, par exemple en raison
  de l'origine ou de la race. Personne ne doit donc être traité moins bien.
