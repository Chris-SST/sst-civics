question: Laquelle de ces plantes a été cultivée sur la Sechseläutenplatz à Zurich pendant la Seconde
  Guerre mondiale ?
options:
  a: Le tabac
  b: La vigne
  c: Le coton
  d: Les pommes de terre
explanation: Pendant la Seconde Guerre mondiale, la Suisse manquait de denrées alimentaires. C'est pourquoi,
  avec la « bataille des cultures » (Anbauschlacht), des surfaces situées en plein cœur des villes ont
  aussi été mises en culture, par exemple la Sechseläutenplatz à Zurich, plantée de pommes de terre. Le
  tabac, la vigne et le coton n'y ont pas été cultivés.
