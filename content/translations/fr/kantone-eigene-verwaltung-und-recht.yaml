id: kantone-eigene-verwaltung-und-recht
lang: fr
source_version: 2
question: Quelles tâches relèvent des cantons ?
options:
  a: Ils déterminent la politique étrangère et la monnaie de la Suisse.
  b: Ils édictent les lois pour l'ensemble du pays.
  c: Ils dirigent l'armée et fixent les droits de douane.
  d: Ils gèrent leur propre administration et édictent le droit cantonal.
explanation: Chaque canton a son propre gouvernement, son propre parlement et sa propre administration.
  Il fait ses propres lois, qui ne s'appliquent que dans le canton, par exemple pour les écoles ou la
  police. La politique étrangère, la monnaie, l'armée, les droits de douane et les lois pour l'ensemble
  de la Suisse relèvent de la Confédération.
