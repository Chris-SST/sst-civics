id: stimmrecht-bund-ab-18-geburtstag
lang: fr
source_version: 1
question: À partir de quel âge les Suisses et les Suissesses peuvent-ils voter et élire au niveau fédéral
  ?
options:
  a: À partir de leur 20e anniversaire
  b: À partir de leur 21e anniversaire
  c: À partir de leur 16e anniversaire
  d: À partir de leur 18e anniversaire
explanation: Le droit de vote au niveau de la Confédération commence avec la majorité, c'est-à-dire à
  18 ans révolus. Cet âge s'applique de la même manière aux élections et aux votations de la Confédération.
