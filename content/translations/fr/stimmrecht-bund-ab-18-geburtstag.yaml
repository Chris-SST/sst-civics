    question_de: Ab welchem Alter dürfen Schweizer und Schweizerinnen auf Bundesebene abstimmen und wählen?
    options_de:
      a: Ab ihrem 20. Geburtstag
      b: Ab ihrem 21. Geburtstag
      c: Ab ihrem 16. Geburtstag
      d: Ab ihrem 18. Geburtstag
    explanation_de: Das Stimmrecht auf Bundesebene beginnt mit der Volljährigkeit, das heisst mit vollendeten
      18 Jahren. Dieses Alter gilt in gleicher Weise für die Wahlen und die Abstimmungen des Bundes.
