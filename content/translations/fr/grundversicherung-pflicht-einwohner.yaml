lang: fr
source_version: 1
question: Pour qui l'assurance de base obligatoire pour les traitements médicaux s'applique-t-elle en
  Suisse ?
options:
  a: Uniquement pour les personnes ayant le droit de cité suisse (Bürgerrecht)
  b: Uniquement pour les personnes actives percevant un salaire
  c: Uniquement pour les personnes à faible revenu
  d: Pour toutes les habitantes et tous les habitants de la Suisse
explanation: L'assurance obligatoire des soins s'applique à toutes les personnes qui vivent en Suisse.
  Le droit de cité, l'activité lucrative et le revenu n'ont aucune importance à cet égard.
