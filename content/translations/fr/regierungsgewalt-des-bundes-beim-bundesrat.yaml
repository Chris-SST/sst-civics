id: regierungsgewalt-des-bundes-beim-bundesrat
lang: fr
source_version: 1
question: Quelle autorité exerce le pouvoir gouvernemental suprême au niveau de la Confédération ?
options:
  a: Le Conseil fédéral (Bundesrat)
  b: Le Conseil national (Nationalrat)
  c: La Chancellerie fédérale (Bundeskanzlei)
  d: Le Tribunal fédéral (Bundesgericht)
explanation: Selon la Constitution fédérale, le Conseil fédéral est l'autorité directrice et exécutive
  suprême de la Confédération. Le Parlement élabore les lois, le Tribunal fédéral rend la justice.
