id: bundesstaat-1848-neue-verfassung
lang: fr
source_version: 1
question: Qu'est-ce qui est apparu en Suisse en 1848 ?
options:
  a: La République helvétique avec un gouvernement central
  b: La confédération d'États sous surveillance française
  c: L'État fédéral moderne avec une nouvelle constitution
  d: L'alliance des trois cantons primitifs (Urkantone)
explanation: En 1848, les cantons se sont dotés d'une Constitution fédérale et ont fondé l'État fédéral
  moderne. Celui-ci associait des tâches communes de la Confédération à l'autonomie des cantons. Cette
  constitution est la base de la Suisse actuelle.
