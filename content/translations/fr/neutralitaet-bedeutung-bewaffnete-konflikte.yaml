id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: fr
source_version: 1
question: Que signifie la neutralité de la Suisse lors de conflits armés entre d'autres États ?
options:
  a: La Suisse envoie des troupes pour le maintien de la paix dans chaque zone de guerre.
  b: La Suisse rompt toutes les relations avec les États impliqués.
  c: La Suisse ne prend parti pour aucune des parties au conflit.
  d: La Suisse soutient toujours le camp le plus faible.
explanation: La neutralité signifie que la Suisse ne se range pas du côté d'une partie belligérante. Elle
  reste ainsi à l'écart des conflits d'autres États. Cela n'exclut ni les discussions ni l'aide humanitaire.
