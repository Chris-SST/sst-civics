id: bundesparlament-wahl-alle-vier-jahre
lang: fr
source_version: 2
question: À quel rythme le peuple renouvelle-t-il le Parlement fédéral ?
options:
  a: Tous les trois ans
  b: Tous les quatre ans
  c: Tous les six ans
  d: Tous les deux ans
explanation: Le peuple élit le Conseil national (Nationalrat) tous les quatre ans. Les membres du Conseil
  des États (Ständerat) sont eux aussi aujourd'hui élus pour quatre ans dans tous les cantons. Chaque
  canton détermine lui-même comment l'élection a lieu et, en partie aussi, quand elle a lieu.
