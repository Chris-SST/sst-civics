question: Laquelle des assurances suivantes est obligatoire par la loi pour toutes les personnes qui vivent
  en Suisse ?
options:
  a: L'assurance de protection juridique
  b: L'assurance-maladie
  c: L'assurance voyage
  d: L'assurance ménage
explanation: L'assurance-maladie est obligatoire pour toutes les personnes domiciliées en Suisse. Les
  assurances ménage, de protection juridique et voyage sont facultatives.
