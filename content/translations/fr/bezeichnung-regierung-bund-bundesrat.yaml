id: bezeichnung-regierung-bund-bundesrat
lang: fr
source_version: 1
question: Comment s'appelle le gouvernement de la Suisse au niveau fédéral ?
options:
  a: Assemblée fédérale (Bundesversammlung)
  b: Conseil fédéral (Bundesrat)
  c: Chancellerie fédérale (Bundeskanzlei)
  d: Tribunal fédéral (Bundesgericht)
explanation: Le gouvernement de la Confédération s'appelle Conseil fédéral. L'Assemblée fédérale est le
  Parlement, le Tribunal fédéral est la plus haute instance judiciaire. La Chancellerie fédérale soutient
  le Conseil fédéral.
