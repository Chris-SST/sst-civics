id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: fr
source_version: 2
question: Que prévaut-il en principe pour l'extradition de ressortissants suisses à l'étranger ?
options:
  a: Ils sont extradés à la demande de n'importe quel État.
  b: Ils ne sont pas extradés vers un autre État contre leur gré. Ils peuvent toutefois être remis à un
    tribunal international.
  c: Ils ne sont extradés qu'à des États voisins de la Suisse.
  d: Ils sont extradés si le Conseil fédéral (Bundesrat) le souhaite dans un cas particulier.
explanation: Selon l'article 25 de la Constitution fédérale, les Suisses et les Suissesses ne peuvent
  pas être expulsés. Ils ne peuvent être extradés vers un autre État que s'ils y consentent eux-mêmes.
  Un tribunal international, par exemple la Cour pénale internationale, n'est pas une autorité étrangère
  ; c'est pourquoi une loi fédérale permet de lui remettre des ressortissants suisses pour une procédure.
