    question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Staatsangehörigen ins Ausland?
    options_de:
      a: Sie werden auf Ersuchen eines beliebigen Staates ausgeliefert.
      b: Sie werden nicht gegen ihren Willen an einen anderen Staat ausgeliefert. Sie können jedoch einem
        internationalen Gericht übergeben werden.
      c: Sie werden nur an Nachbarstaaten der Schweiz ausgeliefert.
      d: Sie werden ausgeliefert, wenn der Bundesrat dies in einem Einzelfall wünscht.
    explanation_de: Nach Artikel 25 der Bundesverfassung dürfen Schweizerinnen und Schweizer nicht ausgewiesen
      werden. Sie dürfen nur dann an einen anderen Staat ausgeliefert werden, wenn sie selbst zustimmen.
      Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine ausländische
      Behörde; deshalb erlaubt ein Bundesgesetz, ihm Schweizer Staatsangehörige für ein Verfahren zu übergeben.
