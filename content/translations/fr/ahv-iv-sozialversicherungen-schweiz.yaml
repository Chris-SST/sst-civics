id: ahv-iv-sozialversicherungen-schweiz
lang: fr
source_version: 1
question: Quelle affirmation sur les assurances sociales de la Suisse est correcte ?
options:
  a: L'assurance-vieillesse et survivants (AVS) et l'assurance-invalidité (AI) font partie des assurances
    sociales de la Suisse.
  b: L'AVS et l'AI sont gérées uniquement par les communes (Gemeinden).
  c: L'AVS et l'AI sont des assurances privées sans base légale.
  d: L'AVS et l'AI sont destinées uniquement aux indépendants.
explanation: AVS signifie assurance-vieillesse et survivants, AI signifie assurance-invalidité. Les deux
  sont réglées par le droit fédéral et font partie du système public d'assurances sociales.
