    question_de: Welche Aussage über die Sozialversicherungen der Schweiz ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung (IV) gehören zu
        den Sozialversicherungen der Schweiz.
      b: Die AHV und die IV werden ausschliesslich von den Gemeinden verwaltet.
      c: Die AHV und die IV sind private Versicherungen ohne gesetzliche Grundlage.
      d: Die AHV und die IV sind ausschliesslich für Selbstständigerwerbende bestimmt.
    explanation_de: AHV bedeutet Alters- und Hinterlassenenversicherung, IV bedeutet Invalidenversicherung.
      Beide sind im Bundesrecht geregelt und gehören zum öffentlichen System der Sozialversicherungen.
