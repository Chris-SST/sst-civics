id: forstleute-andere-baumarten-pflanzen
lang: fr
source_version: 1
question: Comment les forestiers en Suisse réagissent-ils à la hausse des températures ?
options:
  a: Ils plantent de plus en plus d'autres essences d'arbres.
  b: Ils ne plantent plus que des arbres qui ont toujours été présents sur place.
  c: Ils renoncent complètement à l'entretien de la forêt.
  d: Ils défrichent les forêts situées à basse altitude.
explanation: Certaines essences d'arbres supportent mal la chaleur et la sécheresse. Les forestiers misent
  donc sur d'autres essences, mieux adaptées au climat plus chaud. L'objectif est que la forêt reste stable.
