    question_de: Wie reagieren die Försterinnen und Förster in der Schweiz auf den Anstieg der Temperaturen?
    options_de:
      a: Sie pflanzen immer mehr andere Baumarten.
      b: Sie pflanzen nur noch Bäume, die schon immer vor Ort vorhanden waren.
      c: Sie verzichten vollständig auf die Pflege des Waldes.
      d: Sie roden die Wälder in tiefen Lagen.
    explanation_de: Gewisse Baumarten vertragen Hitze und Trockenheit schlecht. Die Förster setzen daher
