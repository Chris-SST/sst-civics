    question_de: Wer kann auf Bundesebene abstimmen und wählen?
    options_de:
      a: Schweizer Staatsangehörige ab 20 Jahren
      b: Alle Personen mit einer Niederlassungsbewilligung (Ausweis C) ab 18 Jahren
      c: Schweizer Staatsangehörige ab 18 Jahren
      d: Alle in der Schweiz wohnhaften Personen ab 16 Jahren
    explanation_de: Auf Ebene des Bundes können die Schweizer und Schweizerinnen ab ihrem 18. Geburtstag
      abstimmen und wählen. Ausländerinnen und Ausländer haben dieses Recht auf Bundesebene nicht, nicht
      einmal mit einer Niederlassungsbewilligung (Ausweis C). Schweizer und Schweizerinnen, die im Ausland
      leben, können ebenfalls daran teilnehmen, sofern sie sich im Stimmregister eintragen lassen.
