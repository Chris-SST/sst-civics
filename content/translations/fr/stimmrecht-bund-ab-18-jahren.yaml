id: stimmrecht-bund-ab-18-jahren
lang: fr
source_version: 2
question: Qui peut voter et élire au niveau fédéral ?
options:
  a: Les ressortissants suisses à partir de 20 ans
  b: Toutes les personnes titulaires d'une autorisation d'établissement (Niederlassungsbewilligung) (permis
    C) à partir de 18 ans
  c: Les ressortissants suisses à partir de 18 ans
  d: Toutes les personnes domiciliées en Suisse à partir de 16 ans
explanation: Au niveau de la Confédération, les Suisses et les Suissesses peuvent voter et élire dès leur
  18e anniversaire. Les étrangères et les étrangers n'ont pas ce droit au niveau fédéral, pas même avec
  une autorisation d'établissement (permis C). Les Suisses et les Suissesses qui vivent à l'étranger peuvent
  aussi y participer, à condition de se faire inscrire au registre des électeurs.
