id: familienzulage-fuer-eltern
lang: fr
source_version: 1
question: Quelle prestation de l'État les parents reçoivent-ils en Suisse lorsqu'ils exercent une activité
  salariée ou indépendante et ont des enfants ?
options:
  a: La rente d'invalidité
  b: L'indemnité de chômage
  c: La prestation complémentaire à l'assurance-vieillesse et survivants (AHV)
  d: L'allocation familiale
explanation: Les allocations familiales aident les familles à assumer une partie des coûts liés aux enfants.
  Elles comprennent les allocations pour enfant et les allocations de formation. Les personnes exerçant
  une activité indépendante peuvent aussi les recevoir.
