    question_de: Welche staatliche Leistung erhalten Eltern in der Schweiz, wenn sie einer unselbstständigen
      oder selbstständigen Erwerbstätigkeit nachgehen und Kinder haben?
    options_de:
      a: Die Invalidenrente
      b: Die Arbeitslosenentschädigung
      c: Die Ergänzungsleistung zur Alters- und Hinterlassenenversicherung (AHV)
      d: Die Familienzulage
    explanation_de: Die Familienzulagen helfen den Familien, einen Teil der Kosten zu tragen, die mit
      den Kindern verbunden sind. Sie umfassen die Kinderzulagen und die Ausbildungszulagen. Auch Personen,
      die eine selbstständige Erwerbstätigkeit ausüben, können sie erhalten.
