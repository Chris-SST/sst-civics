    question_de: Was umfasst gemäss der Bundesverfassung die Glaubens- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und gemäss diesen zu leben
      b: Ausschliesslich die Zugehörigkeit zu einer anerkannten Landeskirche
      c: Die Pflicht, den Glauben seiner Eltern beizubehalten
      d: Das Recht, andere zu zwingen, den eigenen Glauben anzunehmen
    explanation_de: Jede Person hat das Recht, ihre Religion und ihre weltanschauliche Überzeugung frei
      zu wählen und gemäss diesen zu leben. Man kann auch die Religion wechseln oder keine haben. Niemand
      kann gezwungen werden, sich einem Glauben anzuschliessen.
