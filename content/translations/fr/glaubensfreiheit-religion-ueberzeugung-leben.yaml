id: glaubensfreiheit-religion-ueberzeugung-leben
lang: fr
source_version: 1
question: Selon la Constitution fédérale, que comprend la liberté de conscience et de croyance ?
options:
  a: Le droit d'avoir une foi et une conviction et de vivre conformément à celles-ci
  b: Uniquement l'appartenance à une Église nationale reconnue
  c: L'obligation de conserver la foi de ses parents
  d: Le droit d'obliger les autres à adopter sa propre foi
explanation: Toute personne a le droit de choisir librement sa religion et sa conviction philosophique
  et de vivre conformément à celles-ci. On peut aussi changer de religion ou ne pas en avoir. Nul ne peut
  être contraint d'adhérer à une croyance.
