id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: fr
source_version: 1
question: Depuis quand l'égalité entre l'homme et la femme figure-t-elle dans la Constitution fédérale
  suisse ?
options:
  a: Depuis 1999
  b: Depuis 1971
  c: Depuis 1981
  d: Depuis 1848
explanation: En 1981, l'article sur l'égalité a été inscrit dans la Constitution fédérale. Il oblige l'État
  à garantir l'égalité dans la famille, la formation et le travail. Le droit de vote des femmes existait
  déjà depuis 1971.
