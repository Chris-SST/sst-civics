question: Que symbolise le personnage légendaire de Guillaume Tell, originaire de la Suisse centrale ?
options:
  a: La résistance contre les dirigeants étrangers
  b: La neutralité de la Suisse en temps de guerre
  c: L'introduction de la Réforme
  d: La fondation de la première banque suisse
explanation: La légende raconte l'histoire d'un homme qui se défend contre l'oppression exercée par des
  baillis étrangers. Guillaume Tell est donc considéré comme un symbole de liberté. Il n'est pas prouvé
  qu'il ait réellement existé.
