question: Entre qui la guerre du Sonderbund a-t-elle été menée en Suisse en 1847 ?
options:
  a: Entre les cantons germanophones et les cantons francophones
  b: Entre les forces libérales et les cantons catholiques
  c: Entre les cantons urbains et les cantons ruraux au sujet des impôts
  d: Entre la Suisse et la France
explanation: Plusieurs cantons catholiques et conservateurs s'étaient unis au sein du Sonderbund. Les
  forces libérales voulaient une Confédération plus forte. La courte guerre se termina par la victoire
  du camp libéral et ouvrit la voie à l'État fédéral de 1848.
