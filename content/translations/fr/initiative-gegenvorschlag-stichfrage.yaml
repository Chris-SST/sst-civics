id: initiative-gegenvorschlag-stichfrage
lang: fr
source_version: 1
question: Il est voté en même temps sur une initiative populaire (Volksinitiative) et sur un contre-projet
  direct de l'Assemblée fédérale (Bundesversammlung). À quoi sert alors la question subsidiaire ?
options:
  a: Elle décide si le vote doit être répété
  b: Elle décide si l'initiative est valable
  c: Elle décide quel projet s'applique si les deux sont acceptés
  d: Elle décide si les cantons peuvent participer au vote
explanation: Les citoyens ayant le droit de vote peuvent accepter aussi bien l'initiative que le contre-projet.
  Avec la question subsidiaire, ils indiquent lequel des deux projets doit entrer en vigueur si les deux
  sont acceptés. Ainsi, aucune voix en faveur d'un changement n'est perdue.
