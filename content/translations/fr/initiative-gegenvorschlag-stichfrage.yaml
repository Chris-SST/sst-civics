    source_version: 1
    question_de: Es wird gleichzeitig über eine Volksinitiative und über einen direkten Gegenentwurf der
      Bundesversammlung abgestimmt. Wozu dient dann die Stichfrage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Initiative gültig ist
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Kantone an der Abstimmung teilnehmen können
    explanation_de: Die stimmberechtigten Bürgerinnen und Bürger können sowohl die Initiative als auch
      den Gegenentwurf annehmen. Mit der Stichfrage geben sie an, welche der beiden Vorlagen in Kraft
      treten soll, wenn beide angenommen werden. So geht keine Stimme zugunsten einer Änderung verloren.
