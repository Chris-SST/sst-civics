question: Quelle branche économique était la plus importante au début de l'industrialisation de la Suisse
  ?
options:
  a: L'industrie horlogère
  b: L'industrie pharmaceutique
  c: L'industrie textile
  d: L'industrie des machines
explanation: Au début de l'industrialisation, l'industrie textile a marqué l'économie suisse, par exemple
  avec les filatures, les tissages et les broderies. Un exemple bien connu est celui des broderies de
  Saint-Gall, très recherchées dans le monde entier. D'autres branches ne sont devenues aussi importantes
  que plus tard.
