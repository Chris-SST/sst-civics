id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: fr
source_version: 1
question: Comment les personnes ayant le droit de vote en Suisse influencent-elles directement la législation
  de la Confédération ?
options:
  a: Elles votent dans les urnes sur des initiatives et des référendums.
  b: Elles élisent les juges qui décident des nouvelles lois.
  c: Elles nomment les conseillers fédéraux qui adoptent les nouvelles lois.
  d: Elles adoptent elles-mêmes les lois à l'Assemblée fédérale (Bundesversammlung).
explanation: Les personnes ayant le droit de vote participent aux votations populaires sur des initiatives
  et des référendums et y prennent part à la décision. Ainsi, elles contribuent directement à la législation
  entre les élections. C'est une caractéristique de la démocratie directe.
