    question_de: Wie beeinflussen die Stimmberechtigten in der Schweiz die Gesetzgebung des Bundes direkt?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über neue Gesetze entscheiden.
      c: Sie ernennen die Bundesräte, die die neuen Gesetze erlassen.
      d: Sie erlassen die Gesetze selbst in der Bundesversammlung.
    explanation_de: Die Stimmberechtigten nehmen an Volksabstimmungen über Initiativen und Referenden
      teil und wirken dabei an der Entscheidung mit. So tragen sie zwischen den Wahlen direkt zur Gesetzgebung
      bei. Dies ist ein Merkmal der direkten Demokratie.
