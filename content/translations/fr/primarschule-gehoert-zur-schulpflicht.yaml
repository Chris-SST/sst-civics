question: Lequel de ces niveaux fait partie de la scolarité obligatoire en Suisse ?
options:
  a: La haute école
  b: L'école primaire
  c: Le groupe de jeu
  d: L'école professionnelle
explanation: 'Dans le canton de Zurich, la scolarité obligatoire dure onze ans : l''école enfantine, l''école
  primaire et le degré secondaire I. Le groupe de jeu pour les jeunes enfants est facultatif. On ne fréquente
  l''école professionnelle et la haute école qu''après la scolarité obligatoire.'
