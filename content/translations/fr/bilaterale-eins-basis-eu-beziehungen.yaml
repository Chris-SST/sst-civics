    question_de: Welche Verträge, die das Volk im Jahr 2000 angenommen hat, bilden die Grundlage der heutigen
      Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen I
      b: Der EWR-Vertrag
      c: Der Schengen-Vertrag allein
      d: Der Beitrittsvertrag zur EU
    explanation_de: Die Stimmberechtigten haben die Bilateralen I im Jahr 2000 angenommen. Sie regeln
      den Zugang zu bestimmten Bereichen des Binnenmarkts, zum Beispiel den freien Personenverkehr und
      den Landverkehr. Das Volk hatte den EWR 1992 nicht gutgeheissen.
