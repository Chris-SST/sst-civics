id: bilaterale-eins-basis-eu-beziehungen
lang: fr
source_version: 1
question: Quels traités, acceptés par le peuple en 2000, constituent la base des relations actuelles de
  la Suisse avec l'UE ?
options:
  a: Les Bilatérales I
  b: Le traité sur l'EEE
  c: Le traité de Schengen seul
  d: Le traité d'adhésion à l'UE
explanation: Le corps électoral a accepté les Bilatérales I en 2000. Elles règlent l'accès à certains
  domaines du marché intérieur, par exemple la libre circulation des personnes et les transports terrestres.
  Le peuple n'avait pas approuvé l'EEE en 1992.
