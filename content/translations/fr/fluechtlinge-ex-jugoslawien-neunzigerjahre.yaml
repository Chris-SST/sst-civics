question: Pour quelle raison de nombreuses personnes originaires de l'ex-Yougoslavie ont-elles cherché
  refuge en Suisse dans les années 1990 ?
options:
  a: Elles voulaient étudier dans des hautes écoles suisses.
  b: Elles fuyaient une grande catastrophe naturelle.
  c: Elles fuyaient la guerre dans leur pays d'origine.
  d: Elles avaient été recrutées par des entreprises suisses comme saisonniers.
explanation: L'éclatement de la Yougoslavie a entraîné des guerres dans les années 1990. C'est pourquoi
  de nombreuses personnes ont cherché une protection en Suisse. Une partie d'entre elles est restée et
  vit aujourd'hui ici.
