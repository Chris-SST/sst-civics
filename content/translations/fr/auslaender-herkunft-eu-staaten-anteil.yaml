lang: fr
source_version: 1
question: De quelle région provient la majeure partie des étrangères et étrangers qui résident en Suisse
  ?
options:
  a: D'États d'Asie, environ deux tiers
  b: D'États d'Afrique, environ la moitié
  c: D'États de l'Union européenne, environ deux tiers
  d: D'États d'Amérique, environ un tiers
explanation: Environ 66 % de la population étrangère résidante provient d'États de l'UE, soit environ
  deux tiers. Le reste vient d'autres États européens et du reste du monde. Ce chiffre peut évoluer légèrement
  avec le temps.
