question: Pour quoi la Suisse s'engage-t-elle au sein de l'Organisation pour la sécurité et la coopération
  en Europe (OSCE) ?
options:
  a: Pour la paix et la sécurité en Europe, par exemple en Europe de l'Est et en Asie centrale
  b: Pour la répartition de subventions en Europe occidentale
  c: Pour l'introduction d'une monnaie commune
  d: Pour la baisse des droits de douane dans le commerce mondial
explanation: La Suisse est membre fondateur de l'OSCE et s'en sert pour promouvoir la paix et la sécurité
  en Europe. L'OSCE est active avec des missions sur le terrain, en particulier en Europe de l'Est et
  du Sud-Est ainsi qu'en Asie centrale. En 2026, la Suisse assure la présidence de l'OSCE.
