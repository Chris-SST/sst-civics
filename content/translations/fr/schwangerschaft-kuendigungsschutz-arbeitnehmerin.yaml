    question_de: Was sieht das Gesetz in der Schweiz für schwangere Arbeitnehmerinnen im Falle einer Kündigung
      vor?
    options_de:
      a: Sie geniessen nur in Unternehmen, die einem Gesamtarbeitsvertrag unterstellt sind, einen Schutz
        vor Kündigung.
      b: Sie geniessen während der Schwangerschaft einen gesetzlichen Kündigungsschutz.
      c: Sie müssen ihre Schwangerschaft dem Arbeitgeber sofort mitteilen, andernfalls erlischt der Schutz.
      d: Sie können jederzeit und ohne jegliche Einschränkung entlassen werden.
    explanation_de: Das Gesetz schützt Frauen während der Schwangerschaft vor einer Kündigung durch den
      Arbeitgeber. Dieser Schutz gilt unabhängig vom Unternehmen. Er soll die Sicherheit der Frauen in
      dieser Zeit gewährleisten.
