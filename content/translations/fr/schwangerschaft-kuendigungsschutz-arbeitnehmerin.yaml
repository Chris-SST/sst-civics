id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: fr
source_version: 1
question: Que prévoit la loi en Suisse pour les travailleuses enceintes en cas de licenciement ?
options:
  a: Elles ne bénéficient d'une protection contre le licenciement que dans les entreprises soumises à
    une convention collective de travail
  b: Elles bénéficient d'une protection légale contre le licenciement pendant la grossesse
  c: Elles doivent annoncer immédiatement leur grossesse à l'employeur, faute de quoi la protection s'éteint
  d: Elles peuvent être licenciées à tout moment, sans aucune restriction
explanation: La loi protège les femmes contre un licenciement par l'employeur pendant la grossesse. Cette
  protection s'applique indépendamment de l'entreprise. Elle vise à garantir la sécurité des femmes durant
  cette période.
