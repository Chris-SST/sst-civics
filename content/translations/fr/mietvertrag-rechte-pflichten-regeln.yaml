id: mietvertrag-rechte-pflichten-regeln
lang: fr
source_version: 1
question: Que est-ce qui est fixé dans un contrat de bail ?
options:
  a: Les droits des voisins dans l'immeuble
  b: Le montant des impôts des locataires
  c: Les obligations de la commune (Gemeinde) envers les locataires
  d: Les droits et les obligations des bailleurs et des locataires
explanation: Le contrat de bail règle les relations entre la personne qui loue son bien et la personne
  qui le prend en location. Cela comprend par exemple le loyer et la durée du bail. Le Code des obligations
  contient les règles légales à ce sujet.
