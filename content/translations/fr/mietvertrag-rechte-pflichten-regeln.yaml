    question_de: Was ist in einem Mietvertrag festgelegt?
    options_de:
      a: Die Rechte der Nachbarn im Gebäude
      b: Die Höhe der Steuern der Mieter
      c: Die Pflichten der Gemeinde gegenüber den Mietern
      d: Die Rechte und Pflichten der Vermieter und der Mieter
    explanation_de: Der Mietvertrag regelt die Beziehungen zwischen der Person, die ihr Gut vermietet,
      und der Person, die es mietet. Das umfasst zum Beispiel den Mietzins und die Dauer des Mietverhältnisses.
      Das Obligationenrecht enthält die gesetzlichen Regeln dazu.
