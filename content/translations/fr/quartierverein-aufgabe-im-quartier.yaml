id: quartierverein-aufgabe-im-quartier
lang: fr
source_version: 1
question: Quelle est une tâche typique d'une association de quartier dans une commune (Gemeinde) ou une
  ville du canton de Zurich ?
options:
  a: Elle défend les préoccupations des habitants du quartier auprès des autorités et encourage la vie
    en commun.
  b: Elle tient le contrôle des habitants pour le quartier.
  c: Elle prélève des impôts auprès des habitants du quartier.
  d: Elle autorise les demandes de permis de construire dans le quartier.
explanation: Une association de quartier est un regroupement volontaire d'habitants. Elle transmet les
  préoccupations du quartier aux autorités et organise des manifestations qui renforcent la vie en commun.
  Les tâches relevant de la puissance publique, comme les impôts, les permis de construire ou le contrôle
  des habitants, appartiennent à la commune.
