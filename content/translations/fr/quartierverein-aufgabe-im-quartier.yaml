    question_de: Welches ist eine typische Aufgabe eines Quartiervereins in einer Gemeinde oder einer
      Stadt im Kanton Zürich?
    options_de:
      a: Er vertritt die Anliegen der Bewohner des Quartiers gegenüber den Behörden und fördert das Zusammenleben.
      b: Er führt die Einwohnerkontrolle für das Quartier.
      c: Er erhebt Steuern bei den Bewohnern des Quartiers.
      d: Er bewilligt die Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Bewohnern. Er übermittelt
      die Anliegen des Quartiers an die Behörden und organisiert Veranstaltungen, die das Zusammenleben
      stärken. Die hoheitlichen Aufgaben, wie die Steuern, die Baubewilligungen oder die Einwohnerkontrolle,
      gehören zur Gemeinde.
