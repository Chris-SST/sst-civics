    question_de: Wer meldet die geplante Heirat beim Zivilstandsamt an?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Die Brautleute gemeinsam
      c: Die Einwohnerkontrolle der Wohngemeinde, automatisch
      d: Die Eltern der zukünftigen Braut oder des zukünftigen Bräutigams
    explanation_de: Die Brautleute reichen gemeinsam beim Zivilstandsamt das Gesuch um Eröffnung des Vorbereitungsverfahrens
      der Eheschliessung ein. Andere Personen können dies nicht an ihrer Stelle tun. Anschliessend prüft
      das Amt, ob die Voraussetzungen für die Eheschliessung erfüllt sind.
