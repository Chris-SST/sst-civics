id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: fr
source_version: 1
question: Qui annonce le mariage prévu à l'office de l'état civil ?
options:
  a: Les témoins, au nom du couple
  b: Les futurs époux ensemble
  c: Le contrôle des habitants de la commune de domicile, automatiquement
  d: Les parents de la future épouse ou du futur époux
explanation: Les futurs époux déposent ensemble auprès de l'office de l'état civil la demande d'ouverture
  de la procédure préparatoire du mariage. D'autres personnes ne peuvent pas le faire à leur place. Ensuite,
  l'office vérifie si les conditions du mariage sont remplies.
