id: referendum-gegen-parlamentsbeschluss
lang: fr
source_version: 1
question: Contre quelles décisions un référendum au niveau de la Confédération est-il dirigé ?
options:
  a: Contre les lois adoptées par le Conseil national (Nationalrat) et le Conseil des États (Ständerat)
  b: Contre les décisions prises par la Chancellerie fédérale (Bundeskanzlei)
  c: Contre les jugements rendus par le Tribunal fédéral (Bundesgericht)
  d: Contre les ordonnances édictées par certaines communes (Gemeinden)
explanation: Un référendum est dirigé contre les lois que le Parlement a adoptées. Le Parlement se compose
  du Conseil national et du Conseil des États. Les jugements des tribunaux et les décisions de l'administration
  ne peuvent pas être contestés par un référendum.
