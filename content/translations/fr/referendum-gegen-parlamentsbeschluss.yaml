    question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Ebene des Bundes?
    options_de:
      a: Gegen die Gesetze, die vom Nationalrat und vom Ständerat verabschiedet wurden
      b: Gegen die Entscheide der Bundeskanzlei
      c: Gegen die Urteile des Bundesgerichts
      d: Gegen die Verordnungen, die von einigen Gemeinden erlassen wurden
    explanation_de: Ein Referendum richtet sich gegen die Gesetze, die das Parlament verabschiedet hat.
      Das Parlament besteht aus dem Nationalrat und dem Ständerat. Die Urteile der Gerichte und die Entscheide
      der Verwaltung können nicht durch ein Referendum angefochten werden.
