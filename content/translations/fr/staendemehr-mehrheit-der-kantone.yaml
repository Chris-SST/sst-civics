id: staendemehr-mehrheit-der-kantone
lang: fr
source_version: 1
question: Que signifie le terme «majorité des cantons (Ständemehr)» lors des votations fédérales ?
options:
  a: La majorité des cantons doit approuver le projet.
  b: La majorité des communes (Gemeinden) doit approuver le projet.
  c: La majorité des partis doit approuver le projet.
  d: La majorité des membres du Conseil des États (Ständerat) doit être présente.
explanation: La majorité des cantons exige que la majorité des cantons approuve un projet. La voix d'un
  canton compte alors selon le résultat du vote dans ce canton. Pour les modifications de la Constitution,
  il faut, en plus de la majorité du peuple (Volksmehr), également la majorité des cantons.
