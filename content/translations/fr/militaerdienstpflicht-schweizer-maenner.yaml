    question_de: Wer ist in der Schweiz zur Leistung des Militärdienstes oder des Ersatzdienstes verpflichtet?
    options_de:
      a: Alle Einwohnerinnen und Einwohner ab dem Alter von 18 Jahren
      b: Die Männer mit Schweizer Bürgerrecht
      c: Alle Männer, die in der Schweiz wohnen
      d: Nur die Frauen mit Schweizer Bürgerrecht
    explanation_de: Gemäss der Bundesverfassung ist jeder Schweizer männlichen Geschlechts verpflichtet,
      Militärdienst zu leisten. Wer dies nicht mit seinem Gewissen vereinbaren kann, leistet einen zivilen
      Ersatzdienst. Die Ausländer sind nicht dienstpflichtig.
