id: militaerdienstpflicht-schweizer-maenner
lang: fr
source_version: 1
question: Qui est soumis en Suisse à l'obligation d'accomplir le service militaire ou le service de remplacement
  ?
options:
  a: Toutes les habitantes et tous les habitants dès l'âge de 18 ans
  b: Les hommes possédant le droit de cité suisse (Bürgerrecht)
  c: Tous les hommes qui habitent en Suisse
  d: Uniquement les femmes possédant le droit de cité suisse
explanation: Selon la Constitution fédérale, tout Suisse de sexe masculin est tenu d'accomplir le service
  militaire. Celui qui ne peut pas concilier cela avec sa conscience effectue un service civil de remplacement.
  Les étrangers ne sont pas soumis à l'obligation de servir.
