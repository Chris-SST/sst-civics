id: petition-ohne-stimmrecht-zuerich
lang: fr
source_version: 1
question: Quelle possibilité politique les étrangères et les étrangers qui n'ont pas le droit de vote
  ont-ils dans le canton de Zurich ?
options:
  a: Ils peuvent voter aux urnes sur des objets cantonaux.
  b: Ils peuvent élire les membres du Conseil cantonal (Kantonsrat).
  c: Ils peuvent s'adresser aux autorités par une pétition.
  d: Ils peuvent déposer une initiative populaire (Volksinitiative) dans le canton.
explanation: Le droit de pétition est ouvert à toutes les personnes, y compris à celles qui n'ont pas
  le droit de vote. Elles peuvent ainsi communiquer par écrit aux autorités des préoccupations, des souhaits
  ou des critiques. Seules les personnes ayant le droit de vote peuvent voter, élire et signer des initiatives.
