    question_de: Welche politische Möglichkeit haben Ausländerinnen und Ausländer, die nicht stimmberechtigt
      sind, im Kanton Zürich?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können die Mitglieder des Kantonsrats wählen.
      c: Sie können sich mit einer Petition an die Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen Personen offen, auch denjenigen, die nicht stimmberechtigt
      sind. Sie können den Behörden somit schriftlich Anliegen, Wünsche oder Kritik mitteilen. Nur stimmberechtigte
      Personen können abstimmen, wählen und Initiativen unterschreiben.
