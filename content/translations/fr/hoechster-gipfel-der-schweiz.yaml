question: Comment s'appelle le plus haut sommet de Suisse ?
options:
  a: Piz Bernina
  b: Cervin
  c: Pointe Dufour
  d: Jungfrau
explanation: La pointe Dufour, dans le massif du Mont Rose en Valais, est avec environ 4634 mètres le
  plus haut sommet de Suisse. Le Cervin est plus connu, mais moins élevé. Le Piz Bernina, dans les Grisons,
  est le plus haut sommet des Alpes orientales.
