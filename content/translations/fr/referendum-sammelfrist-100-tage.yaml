id: referendum-sammelfrist-100-tage
lang: fr
source_version: 1
question: De combien de temps les comités référendaires disposent-ils pour récolter les signatures en
  vue d'un référendum facultatif contre une loi fédérale ?
options:
  a: 60 jours
  b: 18 mois
  c: 100 jours
  d: 30 jours
explanation: Le délai est de 100 jours à compter de la publication officielle de l'acte. Les 18 mois s'appliquent
  en revanche à la récolte des signatures pour une initiative populaire (Volksinitiative).
