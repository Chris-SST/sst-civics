question: Qui finance et organise l'école primaire dans le canton de Zurich ?
options:
  a: Uniquement les paroisses (Kirchgemeinden)
  b: Uniquement les parents des élèves
  c: Uniquement la Confédération
  d: Le canton et les communes (Gemeinden) ensemble
explanation: L'école obligatoire (Volksschule) dans le canton de Zurich est une tâche commune du canton
  et des communes (Gemeinden). Le canton fixe les bases, les communes gèrent les écoles sur place.
