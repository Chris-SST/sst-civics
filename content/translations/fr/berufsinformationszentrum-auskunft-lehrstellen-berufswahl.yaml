question: Où peut-on obtenir des renseignements sur les places d'apprentissage, le choix d'une profession
  et le travail ?
options:
  a: Dans un centre d'information sur les professions
  b: À l'office de l'état civil
  c: À l'école enfantine
  d: À l'office des poursuites
explanation: Le centre d'information sur les professions (BIZ) informe et conseille sur les places d'apprentissage,
  le choix d'une profession, la formation continue et le travail. Son offre est ouverte aux jeunes et
  aux adultes. Les autres services ont d'autres tâches.
