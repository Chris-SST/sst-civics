id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: fr
source_version: 1
question: Une femme s'installe en Suisse et souhaite choisir elle-même sa religion. Elle envisage aussi
  de n'appartenir à aucune religion. Que lui garantit la Constitution fédérale à cet égard ?
options:
  a: Elle ne peut appartenir qu'à une religion reconnue de droit public dans le canton.
  b: Elle peut choisir librement sa religion, la pratiquer ou n'appartenir à aucune religion.
  c: Elle peut choisir sa religion à titre privé, mais ne peut la pratiquer nulle part avec d'autres personnes.
  d: Elle doit se décider auprès de la commune (Gemeinde) pour une religion reconnue.
explanation: La liberté de conscience et de croyance est garantie à l'article 15 de la Constitution fédérale.
  Chaque personne peut choisir librement sa religion, la pratiquer seule ou avec d'autres, ou n'appartenir
  à aucune religion. Nul ne peut être contraint d'adhérer à une communauté religieuse.
