question: Dans quelle région de la Suisse vit la majorité de la population ?
options:
  a: Dans les Alpes
  b: Au Tessin
  c: Sur le Plateau
  d: Dans le Jura
explanation: Le Plateau se situe entre le Jura et les Alpes. C'est là que se trouvent la plupart des grandes
  villes et que vit la plus grande partie de la population. Les Alpes couvrent certes une grande superficie,
  mais elles sont peu peuplées.
