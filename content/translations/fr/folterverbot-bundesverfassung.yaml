id: folterverbot-bundesverfassung
lang: fr
source_version: 1
question: Que dit la Constitution fédérale au sujet de la torture ?
options:
  a: La torture est interdite uniquement à l'égard des délinquants.
  b: La torture est autorisée pour la police en situation d'urgence.
  c: La torture est autorisée si un tribunal y consent.
  d: Nul ne peut être soumis à la torture.
explanation: L'article 10 de la Constitution fédérale interdit la torture et tout autre traitement cruel,
  inhumain ou dégradant. Cette interdiction s'applique à toutes les personnes sans exception. L'État non
  plus ne peut faire aucune exception.
