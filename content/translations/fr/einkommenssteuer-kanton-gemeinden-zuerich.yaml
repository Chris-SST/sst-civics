question: Quel impôt important le canton de Zurich et les communes (Gemeinden) prélèvent-ils sur le salaire
  et sur les autres revenus des personnes ?
options:
  a: L'impôt sur le revenu
  b: L'impôt sur les successions
  c: L'impôt sur les chiens
  d: L'impôt sur les véhicules à moteur
explanation: L'impôt sur le revenu est l'un des impôts les plus importants du canton et des communes.
  Il est prélevé sur le revenu des personnes physiques. Les autres impôts sont moins importants ou portent
  sur autre chose.
