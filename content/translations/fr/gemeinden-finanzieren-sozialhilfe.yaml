id: gemeinden-finanzieren-sozialhilfe
lang: fr
source_version: 1
question: Qui finance, dans le canton de Zurich, l'aide sociale destinée aux personnes en situation de
  détresse ?
options:
  a: Les Églises seules
  b: La Banque nationale suisse
  c: Les associations d'employeurs
  d: Les communes (Gemeinden)
explanation: Dans le canton de Zurich, les communes sont responsables de l'aide sociale et en supportent
  les coûts. Cela peut représenter une lourde charge pour les petites communes. C'est pourquoi la péréquation
  financière existe.
