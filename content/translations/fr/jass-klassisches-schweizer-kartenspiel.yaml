question: Quel jeu de cartes est considéré en Suisse comme le jeu de cartes traditionnel du pays ?
options:
  a: Le bridge
  b: Le jass
  c: Le poker
  d: Le rami
explanation: Le jass est considéré comme le jeu de cartes typiquement suisse. On y joue le plus souvent
  à quatre, en deux équipes, souvent avec des cartes françaises ou des cartes suisses alémaniques. On
  y joue dans de nombreuses familles et dans de nombreux cafés-restaurants.
