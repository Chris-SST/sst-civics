id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: fr
source_version: 1
question: Où devez-vous vous annoncer lorsque vous déménagez dans une autre commune (Gemeinde) zurichoise
  ?
options:
  a: Auprès du tribunal de district
  b: Auprès de l'Office fédéral de la statistique
  c: Auprès de la police cantonale
  d: Auprès du contrôle des habitants de la nouvelle commune de domicile
explanation: L'annonce se fait auprès du contrôle des habitants, aussi appelé bureau des habitants. Il
  tient le registre des habitantes et des habitants de la commune.
