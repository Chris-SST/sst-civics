    question_de: Wo müssen Sie sich anmelden, wenn Sie in eine andere Zürcher Gemeinde umziehen?
    options_de:
      a: Beim Bezirksgericht
      b: Beim Bundesamt für Statistik
      c: Bei der Kantonspolizei
      d: Bei der Einwohnerkontrolle der neuen Wohngemeinde
    explanation_de: Die Anmeldung erfolgt bei der Einwohnerkontrolle, auch Einwohneramt genannt. Sie führt
      das Register der Einwohnerinnen und Einwohner der Gemeinde.
