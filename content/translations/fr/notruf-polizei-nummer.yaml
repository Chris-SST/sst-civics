id: notruf-polizei-nummer
lang: fr
source_version: 1
question: Quel numéro de téléphone compose-t-on en Suisse lorsqu'on a besoin de la police en cas d'urgence
  ?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: On joint la police dans toute la Suisse au numéro 117. Les pompiers ont le 118, les services
  sanitaires (ambulances) le 144. Le 143 est le numéro de La Main Tendue, destiné aux personnes en situation
  de crise.
