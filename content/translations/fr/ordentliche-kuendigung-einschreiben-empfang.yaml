id: ordentliche-kuendigung-einschreiben-empfang
lang: fr
source_version: 1
question: Comment une résiliation ordinaire d'un contrat de travail devrait-elle être remise afin de pouvoir
  prouver sa réception ?
options:
  a: Par une communication à l'administration communale (Gemeindeverwaltung)
  b: Par lettre recommandée, ou l'autre partie confirme la réception par écrit
  c: Par simple courriel sans confirmation
  d: Oralement, lors d'un entretien en tête-à-tête
explanation: Une lettre recommandée ou un accusé de réception écrit permet de prouver que la résiliation
  est bien arrivée. C'est important, car les délais de résiliation courent à partir de la réception.
