    question_de: Wie sollte eine ordentliche Kündigung eines Arbeitsvertrags übergeben werden, um ihren
      Empfang nachweisen zu können?
    options_de:
      a: Durch eine Mitteilung an die Gemeindeverwaltung
      b: Per Einschreiben, oder die andere Partei bestätigt den Empfang schriftlich
      c: Per einfacher E-Mail ohne Bestätigung
      d: Mündlich, bei einem persönlichen Gespräch unter vier Augen
    explanation_de: Ein Einschreiben oder eine schriftliche Empfangsbestätigung ermöglicht es nachzuweisen,
      dass die Kündigung tatsächlich angekommen ist. Das ist wichtig, denn die Kündigungsfristen laufen
      ab dem Empfang.
