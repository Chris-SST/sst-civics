id: arbeitszeugnis-bedeutung
lang: fr
source_version: 1
question: Qu'est-ce qu'un certificat de travail ?
options:
  a: Une attestation du médecin certifiant que l'on ne peut pas travailler
  b: Un document de l'employeur qui évalue les prestations et le comportement de la personne employée
  c: L'autorisation de l'office des migrations de travailler en Suisse
  d: Le certificat de salaire annuel pour la déclaration d'impôt
explanation: Un certificat de travail est établi par l'employeur. Il décrit la nature et la durée du travail
  et évalue les prestations et le comportement. Les employés peuvent le demander à tout moment.
