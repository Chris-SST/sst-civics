id: krankenversicherung-obligatorisch-einwohner
lang: fr
source_version: 1
question: Qui doit souscrire une assurance-maladie en Suisse ?
options:
  a: Uniquement les personnes ayant le droit de cité (Bürgerrecht) suisse
  b: Toutes les personnes qui habitent en Suisse
  c: Uniquement les personnes de moins de 65 ans
  d: Uniquement les personnes exerçant une activité lucrative
explanation: L'assurance obligatoire des soins s'applique à toutes les personnes domiciliées en Suisse.
  Le droit de cité, l'exercice d'une activité lucrative et l'âge n'ont aucune importance. L'assurance
  doit être souscrite dans un délai de trois mois après l'arrivée en Suisse.
