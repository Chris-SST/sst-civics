id: volksinitiative-unterschriften-sammelfrist
lang: fr
source_version: 1
question: De combien de signatures une initiative populaire (Volksinitiative) fédérale a-t-elle besoin,
  et pendant combien de temps peut-on les récolter ?
options:
  a: 100 000 signatures en 100 jours
  b: 50 000 signatures en 100 jours
  c: 50 000 signatures en 18 mois
  d: 100 000 signatures en 18 mois
explanation: Une initiative populaire fédérale nécessite 100 000 signatures valables dans un délai de
  18 mois. Le référendum facultatif, en revanche, nécessite 50 000 signatures en 100 jours.
