question: Comment s'appelle le parlement du canton de Zurich ?
options:
  a: Grand Conseil
  b: Landrat
  c: conseil communal (Gemeinderat)
  d: Conseil cantonal (Kantonsrat)
explanation: Le parlement du canton de Zurich s'appelle Conseil cantonal. D'autres cantons utilisent d'autres
  appellations, par exemple Grand Conseil ou Landrat. Le conseil communal est en revanche une autorité
  au niveau de la commune (Gemeinde).
