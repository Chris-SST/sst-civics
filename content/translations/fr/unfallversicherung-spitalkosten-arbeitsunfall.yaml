id: unfallversicherung-spitalkosten-arbeitsunfall
lang: fr
source_version: 1
question: Une employée a un grave accident au travail et doit être hospitalisée. Quelle assurance prend
  en charge les frais d'hôpital ?
options:
  a: L'assurance-chômage
  b: L'assurance-accidents
  c: Le régime des allocations pour perte de gain
  d: L'assurance-vieillesse et survivants
explanation: L'assurance-accidents obligatoire paie les frais de guérison en cas d'accident professionnel,
  par exemple les frais d'hôpital. Les employés y sont assurés par l'intermédiaire de leur employeur.
  Les autres assurances mentionnées couvrent d'autres risques.
