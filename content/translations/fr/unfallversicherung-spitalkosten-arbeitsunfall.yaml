    question_de: Eine Angestellte hat einen schweren Unfall bei der Arbeit und muss ins Spital eingeliefert
      werden. Welche Versicherung übernimmt die Spitalkosten?
    options_de:
      a: Die Arbeitslosenversicherung
      b: Die Unfallversicherung
      c: Die Erwerbsersatzordnung
      d: Die Alters- und Hinterlassenenversicherung
