id: gewaltmonopol-des-staates
lang: fr
source_version: 2
question: Qui a, en principe, le droit d'user de la force physique en Suisse ?
options:
  a: Les entreprises de sécurité privées mandatées par des associations
  b: Toute personne qui se sent menacée
  c: Uniquement l'État
  d: Chaque commune (Gemeinde) avec ses propres milices citoyennes
explanation: 'En Suisse, l''État détient le monopole de la force : en principe, lui seul peut recourir
  à la force physique, par exemple par l''intermédiaire de la police ou de l''armée. La légitime défense
  constitue une exception : une personne attaquée de manière illicite peut se défendre de façon proportionnée,
  mais le simple sentiment d''être menacé ne suffit pas.'
