    question_de: Wer hat in der Schweiz grundsätzlich das Recht, körperliche Gewalt anzuwenden?
    options_de:
      a: Die privaten Sicherheitsunternehmen, die von Vereinen beauftragt werden
      b: Jede Person, die sich bedroht fühlt
      c: Ausschliesslich der Staat
      d: Jede Gemeinde mit ihren eigenen Bürgermilizen
    explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich kann nur er körperliche
      Gewalt anwenden, zum Beispiel durch die Polizei oder die Armee. Die Notwehr stellt eine Ausnahme
      dar: Eine Person, die widerrechtlich angegriffen wird, kann sich verhältnismässig verteidigen, aber
      das blosse Gefühl, bedroht zu sein, genügt nicht.'
