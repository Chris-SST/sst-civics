id: parteien-vertreten-interessen-bevoelkerung
lang: fr
source_version: 1
question: Quel est le rôle des partis politiques dans une démocratie ?
options:
  a: Ils rendent la justice dans les litiges
  b: Ils représentent les différents intérêts de la population
  c: Ils organisent les votations fédérales
  d: Ils font appliquer les lois au quotidien
explanation: Les partis rassemblent les différents intérêts et opinions de la population et les font entrer
  dans la politique. Faire appliquer les lois relève des autorités, rendre la justice relève des tribunaux.
