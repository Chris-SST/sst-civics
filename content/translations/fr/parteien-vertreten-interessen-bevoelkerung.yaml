    question_de: Welche Rolle haben die politischen Parteien in einer Demokratie?
    options_de:
      a: Sie sprechen in Streitfällen Recht.
      b: Sie vertreten die verschiedenen Interessen der Bevölkerung.
      c: Sie organisieren die eidgenössischen Abstimmungen.
      d: Sie sorgen im Alltag für die Anwendung der Gesetze.
    explanation_de: Die Parteien bündeln die verschiedenen Interessen und Meinungen der Bevölkerung und
      bringen sie in die Politik ein. Die Anwendung der Gesetze ist Sache der Behörden, die Rechtsprechung
      ist Sache der Gerichte.
