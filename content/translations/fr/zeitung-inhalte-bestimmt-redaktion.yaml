id: zeitung-inhalte-bestimmt-redaktion
lang: fr
source_version: 1
question: Qui décide, en Suisse, des contenus qui sont publiés dans un journal ?
options:
  a: Le Tribunal fédéral (Bundesgericht)
  b: La commune (Gemeinde) dans laquelle paraît le journal
  c: La rédaction du journal
  d: Le Conseil fédéral (Bundesrat)
explanation: La liberté des médias protège les journaux contre toute influence de l'État. La rédaction
  décide elle-même de ce qu'elle publie. La Constitution fédérale interdit la censure.
