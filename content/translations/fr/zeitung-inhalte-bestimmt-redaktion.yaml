    question_de: Wer entscheidet in der Schweiz über die Inhalte, die in einer Zeitung veröffentlicht
      werden?
    options_de:
      a: Das Bundesgericht
      b: Die Gemeinde, in der die Zeitung erscheint
      c: Die Redaktion der Zeitung
      d: Der Bundesrat
    explanation_de: Die Medienfreiheit schützt die Zeitungen vor jeglichem Einfluss des Staates. Die Redaktion
      entscheidet selbst darüber, was sie veröffentlicht. Die Bundesverfassung verbietet die Zensur.
