    question_de: Was erhalten die Stimmberechtigten vor einer eidgenössischen Abstimmung mit dem Abstimmungsmaterial,
      um sich über die Abstimmungsvorlagen informieren zu können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Eine Stellungnahme des Bundesgerichts
      c: Ein Gutachten ihres eigenen Kantons
      d: Die Wahlliste aller Parteien
    explanation_de: Der Bundesrat erklärt in den Erläuterungen, die oft als Abstimmungsbüchlein bezeichnet
      werden, worum es bei jeder Vorlage geht. Man findet dort auch die Argumente des Initiativ- oder
      Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments. So kann sich jeder
      seine eigene Meinung bilden.
