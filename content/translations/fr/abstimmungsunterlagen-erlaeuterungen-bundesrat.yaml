id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: fr
source_version: 1
question: Que reçoivent les personnes ayant le droit de vote avant une votation fédérale, avec le matériel
  de vote, afin de pouvoir s'informer sur les objets soumis au vote ?
options:
  a: Les explications du Conseil fédéral (Bundesrat)
  b: Une prise de position du Tribunal fédéral (Bundesgericht)
  c: Une expertise de leur propre canton
  d: La liste électorale de tous les partis
explanation: Le Conseil fédéral explique dans les explications, souvent appelées brochure de votation,
  de quoi il s'agit pour chaque objet. On y trouve aussi les arguments du comité d'initiative ou de référendum,
  ainsi que la recommandation du Conseil fédéral et du Parlement. Ainsi, chacun peut se forger sa propre
  opinion.
