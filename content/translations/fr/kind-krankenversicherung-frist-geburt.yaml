id: kind-krankenversicherung-frist-geburt
lang: fr
source_version: 1
question: Dans quel délai à compter de la naissance un enfant domicilié en Suisse doit-il être couvert
  par une assurance-maladie ?
options:
  a: dans un délai de 12 mois
  b: dans un délai de 3 mois
  c: dans un délai de 14 jours
  d: dans un délai de 6 mois
explanation: Les parents doivent souscrire une assurance-maladie pour leur enfant dans les trois mois
  qui suivent la naissance. Si ce délai est respecté, la couverture d'assurance prend effet rétroactivement
  dès la naissance.
