lang: fr
source_version: 1
question: Comment les personnes ayant le droit de vote participent-elles à la vie politique de leur commune
  (Gemeinde) lors des scrutins ?
options:
  a: Elles dirigent les séances du conseil communal (Gemeinderat)
  b: Elles mettent en œuvre les décisions de la commune
  c: Elles votent lors des élections et des votations
  d: Elles édictent elles-mêmes les lois du canton
explanation: Lors des scrutins, les personnes ayant le droit de vote se prononcent sur des objets soumis
  au vote et élisent les autorités. La mise en œuvre des décisions incombe aux autorités et à l'administration.
