    question_de: Wie beteiligen sich die Stimmberechtigten bei Abstimmungen und Wahlen am politischen
      Leben ihrer Gemeinde?
    options_de:
      a: Sie leiten die Sitzungen des Gemeinderats
      b: Sie setzen die Beschlüsse der Gemeinde um
      c: Sie stimmen bei den Wahlen und Abstimmungen ab
      d: Sie erlassen selbst die Gesetze des Kantons
    explanation_de: Bei Urnengängen äussern sich die Stimmberechtigten zu Vorlagen, die zur Abstimmung
      gebracht werden, und wählen die Behörden. Die Umsetzung der Beschlüsse obliegt den Behörden und
      der Verwaltung.
