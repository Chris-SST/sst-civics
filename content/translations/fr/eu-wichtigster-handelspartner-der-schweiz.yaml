lang: fr
source_version: 1
question: Avec quel espace économique la Suisse réalise-t-elle globalement le plus d'échanges commerciaux
  ?
options:
  a: Avec les États du Proche-Orient
  b: Avec les États asiatiques
  c: Avec l'Union européenne
  d: Avec les États-Unis d'Amérique
explanation: L'Union européenne est le principal partenaire commercial de la Suisse. Une grande partie
  des importations et des exportations passe par les États de l'UE. C'est pourquoi les relations avec
  l'UE sont très importantes pour l'économie suisse.
