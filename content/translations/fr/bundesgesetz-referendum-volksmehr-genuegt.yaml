id: bundesgesetz-referendum-volksmehr-genuegt
lang: fr
source_version: 1
question: Un référendum facultatif a été demandé contre une nouvelle loi fédérale. Que faut-il pour que
  la loi soit acceptée lors de la votation populaire ?
options:
  a: La majorité des votants dans toute la Suisse
  b: Une majorité des deux tiers des votants
  c: La majorité des cantons seule
  d: La majorité des votants et la majorité des cantons
explanation: Lors d'un référendum facultatif contre une loi fédérale, seule la majorité du peuple (Volksmehr)
  compte, c'est-à-dire la majorité des suffrages valables dans toute la Suisse. La majorité des cantons
  (Ständemehr) n'est requise en plus que pour les modifications de la Constitution fédérale et pour certains
  traités internationaux.
