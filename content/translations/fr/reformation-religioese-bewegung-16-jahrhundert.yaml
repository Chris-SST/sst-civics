lang: fr
source_version: 1
question: Quel grand mouvement religieux a marqué l'Europe, ainsi que la Suisse, au XVIe siècle ?
options:
  a: La Réforme
  b: Les Lumières
  c: La Régénération
  d: La République helvétique
explanation: La Réforme a divisé l'Église en Europe au XVIe siècle. En Suisse, Huldrych Zwingli à Zurich
  et Jean Calvin à Genève ont notamment joué un rôle important. Les autres termes désignent des évolutions
  plus tardives.
