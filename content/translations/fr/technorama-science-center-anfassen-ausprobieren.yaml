question: Dans quelle institution du canton de Zurich les visiteuses et visiteurs peuvent-ils toucher
  et essayer eux-mêmes des phénomènes scientifiques et techniques ?
options:
  a: À l'Opéra de Zurich
  b: Au Technorama de Winterthour
  c: Au Musée national suisse de Zurich
  d: Au Kunsthaus de Zurich
explanation: Le Technorama de Winterthour est un centre scientifique. Les visiteurs y expérimentent eux-mêmes
  sur les objets exposés. Le Kunsthaus, le Musée national et l'Opéra présentent de l'art, de l'histoire
  et des spectacles.
