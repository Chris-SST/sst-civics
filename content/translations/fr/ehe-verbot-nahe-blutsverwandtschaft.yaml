id: ehe-verbot-nahe-blutsverwandtschaft
lang: fr
source_version: 1
question: Qui n'a pas le droit de se marier en Suisse ?
options:
  a: Les personnes qui ont déjà été divorcées
  b: Les personnes originaires de différents cantons
  c: Les personnes qui sont proches parents par le sang
  d: Les personnes qui habitent dans des communes (Gemeinden) différentes
explanation: Le mariage entre proches parents par le sang est interdit, par exemple entre frères et sœurs
  ou entre parents et enfants. En revanche, l'origine, le lieu de domicile et un divorce antérieur ne
  constituent pas un empêchement au mariage.
