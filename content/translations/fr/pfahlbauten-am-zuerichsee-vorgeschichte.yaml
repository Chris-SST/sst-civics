id: pfahlbauten-am-zuerichsee-vorgeschichte
lang: fr
source_version: 1
question: Comment les habitats préhistoriques au bord du lac de Zurich étaient-ils construits ?
options:
  a: Sous forme de grottes dans la roche
  b: Sous forme de palafittes, c'est-à-dire de maisons sur pilotis
  c: Sous forme de maisons en briques dans des villages
  d: Sous forme de châteaux forts sur des rochers
explanation: Sur les rives du lac de Zurich se dressaient à l'époque préhistorique des palafittes, c'est-à-dire
  des maisons sur pilotis. Leurs vestiges se trouvent aujourd'hui encore sous l'eau et sont étudiés par
  des archéologues subaquatiques.
