question: Quelle est la mission de l'association des locataires ?
options:
  a: Elle défend les intérêts des propriétaires immobiliers
  b: Elle fixe les loyers de tous les logements
  c: Elle loue des logements pour le compte du canton
  d: Elle défend les intérêts des locataires
explanation: L'association des locataires est une organisation qui s'engage pour les intérêts des locataires.
  Elle conseille ses membres, par exemple pour des questions relatives au droit du bail. Les intérêts
  des propriétaires immobiliers sont défendus par d'autres associations.
