question: Qu'est-ce qu'Economiesuisse ?
options:
  a: Une caisse de chômage de la Confédération
  b: L'Office fédéral de l'économie
  c: La fédération faîtière de l'économie, qui défend les intérêts des entreprises
  d: Un syndicat pour les employés du commerce de détail
explanation: Economiesuisse est la fédération faîtière de l'économie suisse et représente les intérêts
  des entreprises. Ce n'est ni un organisme étatique ni un syndicat.
