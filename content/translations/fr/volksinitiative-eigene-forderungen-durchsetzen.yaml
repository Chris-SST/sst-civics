id: volksinitiative-eigene-forderungen-durchsetzen
lang: fr
source_version: 1
question: À quoi sert une initiative populaire (Volksinitiative) aux titulaires du droit de vote ?
options:
  a: Elle leur permet de modifier un arrêt du Tribunal fédéral (Bundesgericht).
  b: Elle leur permet de mettre leurs propres revendications à l'agenda politique.
  c: Elle leur permet de fixer la date des prochaines élections.
  d: Elle leur permet d'empêcher l'adoption d'une loi du Parlement.
explanation: Avec une initiative populaire, les titulaires du droit de vote peuvent proposer une modification
  de la Constitution fédérale. Si elle aboutit, elle est soumise au vote. Ils peuvent ainsi faire aboutir
  leurs propres demandes, même contre la volonté du Parlement, si le peuple et les cantons l'acceptent.
