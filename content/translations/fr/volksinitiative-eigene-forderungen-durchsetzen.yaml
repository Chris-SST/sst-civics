    question_de: Wozu dient eine Volksinitiative den Stimmberechtigten?
    options_de:
      a: Sie ermöglicht es ihnen, ein Urteil des Bundesgerichts zu ändern.
      b: Sie ermöglicht es ihnen, ihre eigenen Forderungen auf die politische Agenda zu setzen.
      c: Sie ermöglicht es ihnen, das Datum der nächsten Wahlen festzulegen.
      d: Sie ermöglicht es ihnen, die Annahme eines Gesetzes des Parlaments zu verhindern.
    explanation_de: Mit einer Volksinitiative können die Stimmberechtigten eine Änderung der Bundesverfassung
      vorschlagen. Kommt sie zustande, wird sie zur Abstimmung vorgelegt. So können sie ihre eigenen Anliegen
      durchsetzen, auch gegen den Willen des Parlaments, wenn das Volk und die Kantone sie annehmen.
