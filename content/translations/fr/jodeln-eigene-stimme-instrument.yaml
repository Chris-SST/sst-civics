id: jodeln-eigene-stimme-instrument
lang: fr
source_version: 1
question: Quel est l'instrument utilisé pour le yodel ?
options:
  a: Le cor des Alpes
  b: La propre voix
  c: Le Schwyzerörgeli
  d: L'accordéon
explanation: Dans le yodel, on chante sans paroles, le plus souvent avec de simples syllabes, et l'on
  passe rapidement de la voix de poitrine à la voix de tête. La voix elle-même est l'instrument. Le yodel
  fait partie des traditions populaires de la Suisse et il est souvent associé au cor des Alpes ou au
  Schwyzerörgeli.
