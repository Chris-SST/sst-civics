    question_de: Welches ist das Instrument, das für das Jodeln verwendet wird?
    options_de:
      a: Das Alphorn
      b: Die eigene Stimme
      c: Das Schwyzerörgeli
      d: Das Akkordeon
    explanation_de: Beim Jodeln singt man ohne Text, meist mit einfachen Silben, und man wechselt schnell
      von der Bruststimme zur Kopfstimme. Die Stimme selbst ist das Instrument. Das Jodeln gehört zu den
      Volkstraditionen der Schweiz und wird oft mit dem Alphorn oder dem Schwyzerörgeli verbunden.
