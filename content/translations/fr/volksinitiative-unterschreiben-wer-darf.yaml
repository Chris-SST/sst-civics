id: volksinitiative-unterschreiben-wer-darf
lang: fr
source_version: 2
question: Qui a le droit de signer une initiative populaire (Volksinitiative) fédérale ?
options:
  a: Toutes les personnes de 16 ans et plus domiciliées en Suisse
  b: Toutes les personnes de 18 ans et plus titulaires d'une autorisation d'établissement (permis C) C
  c: Uniquement les membres d'un parti politique âgés de 18 ans et plus
  d: Les citoyennes et citoyens suisses de 18 ans et plus
explanation: Peut signer une initiative populaire fédérale toute personne qui a le droit de vote au niveau
  fédéral. Il s'agit des Suissesses et des Suisses de 18 ans et plus, y compris ceux qui vivent à l'étranger,
  s'ils sont inscrits au registre des électeurs. Sont exclues uniquement les personnes qui, en raison
  d'une incapacité durable de discernement, sont sous curatelle de portée générale ou sont représentées
  par une personne mandatée par un mandat pour cause d'inaptitude ; les étrangères et les étrangers n'ont
  pas de droits politiques au niveau fédéral, pas même avec un permis C.
