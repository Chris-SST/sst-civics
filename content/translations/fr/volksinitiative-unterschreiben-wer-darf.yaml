    question_de: Wer darf eine eidgenössische Volksinitiative unterschreiben?
    options_de:
      a: Alle Personen ab 16 Jahren, die in der Schweiz wohnhaft sind
      b: Alle Personen ab 18 Jahren, die eine Niederlassungsbewilligung (Ausweis C) C besitzen
      c: Nur Mitglieder einer politischen Partei ab 18 Jahren
      d: Die Schweizer Bürgerinnen und Bürger ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative kann jede Person unterschreiben, die auf Bundesebene
      stimmberechtigt ist. Es handelt sich um die Schweizerinnen und Schweizer ab 18 Jahren, einschliesslich
      derjenigen, die im Ausland leben, sofern sie im Stimmregister eingetragen sind. Ausgeschlossen sind
      nur Personen, die wegen dauernder Urteilsunfähigkeit unter umfassender Beistandschaft stehen oder
      durch eine Person, die mit einem Vorsorgeauftrag beauftragt wurde, vertreten werden; Ausländerinnen
      und Ausländer haben auf Bundesebene keine politischen Rechte, nicht einmal mit einem Ausweis C.
