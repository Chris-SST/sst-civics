id: geldpolitik-zustaendigkeit-bund
lang: fr
source_version: 1
question: Qui est responsable de la politique monétaire en Suisse ?
options:
  a: La Confédération
  b: Les communes (Gemeinden)
  c: Les banques cantonales
  d: Les cantons ensemble
explanation: Selon la Constitution fédérale, la politique monétaire et la politique en matière de monnaie
  relèvent de la Confédération. Elle a le droit d'émettre des pièces de monnaie et des billets de banque.
  La Banque nationale suisse mène la politique monétaire pour le compte de la Confédération et est indépendante
  dans ce cadre.
