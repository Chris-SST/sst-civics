    explanation_de: Gemäss der Bundesverfassung fallen die Geldpolitik und die Währungspolitik in die
      Zuständigkeit des Bundes. Er hat das Recht, Münzen und Banknoten auszugeben. Die Schweizerische
      Nationalbank führt die Geldpolitik im Auftrag des Bundes und ist dabei unabhängig.
