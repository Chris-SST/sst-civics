    question_de: Welche Behörde kann Personen festnehmen, die verdächtigt werden, eine Straftat begangen
      zu haben?
    options_de:
      a: Die Schulbehörde
      b: Die Polizei
      c: Das Parlament
      d: Die Steuerverwaltung
    explanation_de: Die Polizei kann Personen, die einer Straftat verdächtigt werden, unter den vom Gesetz
      vorgesehenen Bedingungen festnehmen. Danach ist es Sache eines Gerichts, zu entscheiden, ob eine
      Person schuldig ist. Die Schulbehörde, das Parlament und die Steuerverwaltung haben diese Befugnis
      nicht.
