id: polizei-befugnis-festnahme-straftaeter
lang: fr
source_version: 2
question: Quelle autorité peut procéder à l'arrestation de personnes soupçonnées d'avoir commis une infraction
  ?
options:
  a: L'autorité scolaire
  b: La police
  c: Le parlement
  d: L'administration fiscale
explanation: La police peut arrêter les personnes soupçonnées d'une infraction, aux conditions prévues
  par la loi. Il appartient ensuite à un tribunal de décider si une personne est coupable. L'autorité
  scolaire, le parlement et l'administration fiscale n'ont pas ce pouvoir.
