id: bundesgesetz-referendum-volksabstimmung
lang: fr
source_version: 1
question: Que vaut-il pour une loi fédérale que les deux chambres du Parlement ont adoptée ?
options:
  a: Les ayants droit de vote peuvent exiger une votation populaire à ce sujet au moyen d'un référendum.
  b: Le Conseil fédéral (Bundesrat) doit ensuite encore la soumettre au Tribunal fédéral (Bundesgericht)
    pour approbation.
  c: Elle entre toujours immédiatement en vigueur, sans que le peuple puisse se prononcer.
  d: Les gouvernements des cantons doivent d'abord l'approuver un par un.
explanation: Après la décision des deux chambres, les lois fédérales sont soumises au référendum facultatif.
  Si le référendum aboutit, les ayants droit de vote décident de la loi dans les urnes.
