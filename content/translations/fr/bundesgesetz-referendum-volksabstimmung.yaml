    question_de: Was gilt für ein Bundesgesetz, das die beiden Kammern des Parlaments angenommen haben?
    options_de:
      a: Die Stimmberechtigten können mittels eines Referendums eine Volksabstimmung darüber verlangen.
      b: Der Bundesrat muss es anschliessend noch dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass sich das Volk dazu äussern kann.
      d: Die Regierungen der Kantone müssen es zuerst einzeln genehmigen.
    explanation_de: Nach dem Beschluss der beiden Kammern unterstehen die Bundesgesetze dem fakultativen
      Referendum. Kommt das Referendum zustande, entscheiden die Stimmberechtigten an der Urne über das
      Gesetz.
