    question_de: Wer zählt bei Abstimmungen und Wahlen in einer Zürcher Gemeinde die abgegebenen Stimmen
      aus?
    options_de:
      a: Die Sozialbehörde
      b: Das Wahlbüro
      c: Die Gemeindeschreiberin allein
      d: Die Staatsanwaltschaft
    explanation_de: Das Wahlbüro ermittelt bei Abstimmungen und Wahlen die Ergebnisse der Gemeinde. Es
      setzt sich aus mehreren Personen zusammen, damit die Auszählung korrekt und nachprüfbar abläuft.
