id: stimmenauszaehlung-urnengang-wahlbuero
lang: fr
source_version: 1
question: Qui dépouille les suffrages exprimés lors des scrutins dans une commune (Gemeinde) zurichoise
  ?
options:
  a: L'autorité d'aide sociale
  b: Le bureau électoral
  c: La secrétaire communale seule
  d: Le ministère public
explanation: Le bureau électoral établit les résultats de la commune lors des votations et des élections.
  Il se compose de plusieurs personnes afin que le dépouillement se déroule de manière correcte et vérifiable.
