    question_de: Was bedeutet der Grundsatz der Gewaltenteilung in der Schweiz?
    options_de:
      a: Der Bund, die Kantone und die Gemeinden teilen sich die Steuereinnahmen.
      b: Die Regierung, das Parlament und die Gerichte teilen sich die Macht im Staat.
      c: Die Macht im Staat liegt allein beim Bundesrat.
      d: Das Volk und die Medien teilen sich die Macht im Staat.
    explanation_de: Im Rahmen der Gewaltenteilung übernehmen die Exekutive (die Regierung), die Legislative
      (das Parlament) und die Judikative (die Gerichte) unterschiedliche Aufgaben. So kann keine Instanz
      allein zu viel Macht innehaben. Die staatlichen Gewalten kontrollieren sich gegenseitig.
