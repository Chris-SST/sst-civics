question: Que signifie le principe de la séparation des pouvoirs en Suisse ?
options:
  a: La Confédération, les cantons et les communes (Gemeinden) se répartissent les recettes fiscales.
  b: Le gouvernement, le Parlement et les tribunaux se partagent le pouvoir de l'État.
  c: Le pouvoir dans l'État appartient uniquement au Conseil fédéral (Bundesrat).
  d: Le peuple et les médias se partagent le pouvoir de l'État.
explanation: Dans le cadre de la séparation des pouvoirs, l'exécutif (le gouvernement), le législatif
  (le Parlement) et le judiciaire (les tribunaux) assument des tâches différentes. Ainsi, aucune instance
  ne peut détenir seule trop de pouvoir. Les pouvoirs de l'État se contrôlent mutuellement.
