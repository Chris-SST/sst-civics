id: fakultatives-referendum-unterschriften-frist
lang: fr
source_version: 1
question: Combien de signatures faut-il pour qu'un référendum facultatif contre une loi fédérale aboutisse,
  et dans quel délai ?
options:
  a: 50 000 signatures dans un délai de 18 mois
  b: 50 000 signatures dans un délai de 100 jours
  c: 100 000 signatures dans un délai de 30 jours
  d: 100 000 signatures dans un délai de 100 jours
explanation: Pour un référendum facultatif, il faut 50 000 signatures valables dans un délai de 100 jours
  après la publication de la loi dans la Feuille fédérale (Bundesblatt). Si le référendum aboutit, le
  peuple vote sur la loi.
