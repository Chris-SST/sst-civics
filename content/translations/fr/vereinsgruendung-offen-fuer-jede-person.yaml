question: Qui a le droit de fonder une association en Suisse ?
options:
  a: Uniquement les personnes domiciliées dans la commune (Gemeinde)
  b: Toute personne
  c: Uniquement les ressortissants suisses
  d: Uniquement les personnes titulaires d'une autorisation d'établissement (permis C) (Niederlassungsbewilligung)
explanation: En Suisse, la fondation d'une association est ouverte à toute personne. La liberté d'association
  est garantie par la Constitution fédérale. La nationalité ou le statut de séjour n'ont aucune importance
  à cet égard.
