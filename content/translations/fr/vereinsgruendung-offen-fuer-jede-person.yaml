    question_de: Wer darf in der Schweiz einen Verein gründen?
    options_de:
      a: Nur die in der Gemeinde wohnhaften Personen
      b: Jede Person
      c: Nur Schweizer Staatsangehörige
      d: Nur Personen mit einer Niederlassungsbewilligung (Ausweis C)
    explanation_de: In der Schweiz steht die Gründung eines Vereins jeder Person offen. Die Vereinigungsfreiheit
      wird durch die Bundesverfassung garantiert. Die Staatsangehörigkeit oder der Aufenthaltsstatus spielen
      dabei keine Rolle.
