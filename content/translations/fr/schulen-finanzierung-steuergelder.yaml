id: schulen-finanzierung-steuergelder
lang: fr
source_version: 2
question: Comment les écoles publiques en Suisse sont-elles principalement financées ?
options:
  a: Par les frais de scolarité que les parents paient chaque mois
  b: Par les recettes fiscales du canton et des communes (Gemeinden)
  c: Par les recettes de la Poste et des CFF
  d: Par les contributions des caisses-maladie (Krankenkassen)
explanation: Selon la Constitution fédérale, l'école publique obligatoire est gratuite. Elle est financée
  par les recettes fiscales, principalement celles des cantons et des communes.
