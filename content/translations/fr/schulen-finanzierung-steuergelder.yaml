    question_de: Wie werden die öffentlichen Schulen in der Schweiz hauptsächlich finanziert?
    options_de:
      a: Durch das Schulgeld, das die Eltern jeden Monat bezahlen
      b: Durch die Steuereinnahmen des Kantons und der Gemeinden
      c: Durch die Einnahmen der Post und der SBB
      d: Durch die Beiträge der Krankenkassen
    explanation_de: Gemäss der Bundesverfassung ist der obligatorische öffentliche Schulunterricht unentgeltlich.
      Er wird durch Steuereinnahmen finanziert, hauptsächlich durch jene der Kantone und der Gemeinden.
