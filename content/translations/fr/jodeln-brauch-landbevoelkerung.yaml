question: Quelle coutume traditionnelle de la population rurale suisse est une manière de chanter dans
  laquelle la voix passe rapidement de la voix de poitrine à la voix de tête ?
options:
  a: Le cor des Alpes (Alphornblasen)
  b: Le yodel (Jodeln)
  c: Le hornussen (Hornussen)
  d: Le lancer de drapeau (Fahnenschwingen)
explanation: Dans le yodel, la voix passe rapidement de la voix de poitrine à la voix de tête. Le yodel
  est une coutume traditionnelle de la population rurale suisse. Le yodel naturel se passe de paroles,
  mais de nombreux chants de yodel ont un texte.
