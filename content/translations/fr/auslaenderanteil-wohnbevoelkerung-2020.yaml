question: Quelle était approximativement la proportion d'étrangères et d'étrangers dans la population
  résidante permanente de la Suisse en 2020 ?
options:
  a: environ trois cinquièmes
  b: environ un dixième
  c: environ la moitié
  d: environ un quart
explanation: En 2020, environ un quart de la population résidante permanente n'avait pas de passeport
  suisse. À la fin de 2020, cela représentait environ 2,2 millions de personnes sur 8,7 millions, soit
  environ 25 pour cent. En comparaison avec d'autres pays d'Europe, cette proportion est élevée.
