question: Quelle organisation humanitaire bien connue a été fondée à Genève en 1863 ?
options:
  a: Les Nations Unies (ONU)
  b: L'Organisation mondiale de la santé (OMS)
  c: Le Programme alimentaire mondial (PAM)
  d: Le Comité international de la Croix-Rouge (CICR)
explanation: Le CICR a été créé à Genève en 1863, notamment à l'initiative de Henry Dunant. Il incarne
  la tradition humanitaire de la Suisse. Les autres organisations ont été fondées plus tard.
