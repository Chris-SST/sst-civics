question: Qui sont les acteurs centraux de la fête de printemps zurichoise du Sechseläuten ?
options:
  a: Les classes scolaires zurichoises
  b: Les corporations zurichoises
  c: Les présidences de commune (Gemeinde) du canton
  d: Les membres du Conseil cantonal (Kantonsrat)
explanation: Lors du Sechseläuten, les corporations défilent en costumes historiques à travers la ville.
  Le soir, elles brûlent le Böögg. Cet événement est une fête de printemps bien connue à Zurich.
