id: volksinitiative-doppeltes-mehr
lang: fr
source_version: 2
question: De quoi une initiative populaire (Volksinitiative) fédérale a-t-elle besoin pour être acceptée
  lors de la votation ?
options:
  a: Le oui des deux tiers des votants
  b: Le oui du Conseil fédéral (Bundesrat) et de la majorité des votants
  c: Le oui de la majorité des votants et de la majorité des cantons
  d: Seulement le oui de la majorité des votants
explanation: 'Une initiative populaire fédérale vise à modifier la Constitution fédérale. Elle requiert
  donc la double majorité : la majorité des votants (majorité du peuple, Volksmehr) et la majorité des
  cantons (majorité des cantons, Ständemehr) doivent dire oui. En revanche, pour une initiative cantonale
  dans le canton de Zurich, la majorité des votants suffit.'
