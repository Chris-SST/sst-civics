question: En quelle année l'assurance-vieillesse et survivants (AHV), l'assurance-retraite étatique pour
  la vieillesse et les survivants, a-t-elle été introduite ?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: L'assurance-vieillesse et survivants a commencé son activité en 1948, après que le peuple
  a accepté la loi en 1947. Elle constitue le premier pilier du système suisse des trois piliers. Elle
  garantit les moyens d'existence à la vieillesse et pour les survivants.
