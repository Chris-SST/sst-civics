    question_de: Wie oft pro Jahr finden in der Schweiz normalerweise eidgenössische Volksabstimmungen
      statt?
    options_de:
      a: Einmal
      b: Nur alle vier Jahre
      c: Bis zu viermal
      d: Jeden Monat
    explanation_de: Für eidgenössische Volksabstimmungen sind pro Jahr bis zu vier Abstimmungssonntage
      vorgesehen. An jedem Termin wird oft über mehrere Vorlagen gleichzeitig abgestimmt. Die Wahlen in
      den Nationalrat hingegen finden alle vier Jahre statt und sind keine Abstimmungen.
