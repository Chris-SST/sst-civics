id: eidgenoessische-abstimmungstermine-pro-jahr
lang: fr
source_version: 1
question: Combien de fois par an les votations populaires fédérales ont-elles normalement lieu en Suisse
  ?
options:
  a: Une fois
  b: Seulement tous les quatre ans
  c: Jusqu'à quatre fois
  d: Chaque mois
explanation: Pour les votations populaires fédérales, jusqu'à quatre dimanches de votation sont prévus
  par an. À chaque date, on vote souvent sur plusieurs objets en même temps. Les élections au Conseil
  national (Nationalrat), en revanche, ont lieu tous les quatre ans et ne sont pas des votations.
