id: krankenkasse-freie-wahl-versicherte
lang: fr
source_version: 1
question: Qui décide, en Suisse, auprès de quelle caisse-maladie (Krankenkasse) une personne conclut l'assurance
  de base ?
options:
  a: La commune de domicile détermine la caisse-maladie
  b: La personne assurée choisit elle-même sa caisse-maladie
  c: L'employeur détermine la caisse-maladie pour tous les employés
  d: Le canton de domicile attribue une caisse-maladie à chaque personne
explanation: En Suisse, le libre choix de la caisse-maladie s'applique. Les personnes assurées peuvent
  choisir parmi les caisses-maladie autorisées et changer de caisse sous certaines conditions.
