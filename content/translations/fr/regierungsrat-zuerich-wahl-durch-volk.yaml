id: regierungsrat-zuerich-wahl-durch-volk
lang: fr
source_version: 1
question: Qui détermine, dans le canton de Zurich, qui siège au Conseil d'État (Regierungsrat) ?
options:
  a: L'Assemblée fédérale (Bundesversammlung) élit les membres du Conseil d'État.
  b: Le Conseil cantonal (Kantonsrat) élit les membres parmi ses propres rangs.
  c: Les présidentes et présidents de commune (Gemeinde) élisent les membres.
  d: La population du canton ayant le droit de vote élit directement les membres.
explanation: Dans le canton de Zurich, le peuple élit directement le Conseil d'État aux urnes. Le Conseil
  cantonal est le parlement et n'élit pas le gouvernement. C'est ce qui distingue le canton de la Confédération,
  où l'Assemblée fédérale élit le Conseil fédéral (Bundesrat).
