id: bundesverwaltung-justiz-und-polizeidepartement
lang: fr
source_version: 1
question: Laquelle des entités suivantes fait partie de l'administration fédérale ?
options:
  a: Le Conseil national (Nationalrat)
  b: L'Assemblée fédérale (Bundesversammlung)
  c: Le Tribunal fédéral (Bundesgericht)
  d: Le Département de justice et police
explanation: L'administration fédérale est organisée en départements. Le Département de justice et police
  est l'un d'entre eux et fait partie de l'administration placée sous la direction du Conseil fédéral
  (Bundesrat). Le Conseil national et l'Assemblée fédérale font partie du Parlement, le Tribunal fédéral
  relève du pouvoir judiciaire.
