question: Quels noms figurent parmi les artistes de renommée mondiale ayant un lien avec la Suisse ?
options:
  a: Vincent van Gogh, Paul Cézanne et Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp et Pipilotti Rist
  c: Claude Monet, Edgar Degas et Auguste Renoir
  d: Pablo Picasso, Frida Kahlo et Salvador Dalí
explanation: Niki de Saint Phalle, Sophie Taeuber-Arp et Pipilotti Rist sont des artistes reconnues sur
  le plan international, qui sont liées à la Suisse. Les autres groupes citent des artistes célèbres sans
  ce lien avec la Suisse.
