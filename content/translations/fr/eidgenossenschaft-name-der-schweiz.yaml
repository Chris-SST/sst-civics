question: Quel nom est également utilisé pour la Suisse dans la Constitution fédérale ?
options:
  a: République fédérale
  b: Confédération (Eidgenossenschaft)
  c: Conféderation des cantons
  d: Royaume confédéral
explanation: Le nom officiel est «Confédération suisse» («Schweizerische Eidgenossenschaft»). Le mot Eidgenossenschaft
  désigne donc la Suisse dans son ensemble. Il rappelle les alliances scellées par un serment.
