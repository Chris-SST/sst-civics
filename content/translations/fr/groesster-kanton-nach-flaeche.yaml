question: Quel canton a la plus grande superficie de tous les cantons suisses ?
options:
  a: Tessin
  b: Valais
  c: Berne
  d: Grisons
explanation: Les Grisons sont le plus grand canton de Suisse par sa superficie. Il se situe entièrement
  dans les Alpes et compte de nombreuses vallées et montagnes. Le Valais, Berne et le Tessin sont aussi
