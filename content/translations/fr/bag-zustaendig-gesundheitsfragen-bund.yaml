question: Quelle autorité fédérale est compétente pour les questions de santé ?
options:
  a: L'Office fédéral de l'environnement (OFEV)
  b: Le Secrétariat d'État aux migrations (SEM)
  c: L'Office fédéral de la statistique (OFS)
  d: L'Office fédéral de la santé publique (OFSP)
explanation: L'Office fédéral de la santé publique (OFSP) est l'autorité fédérale compétente pour les
  questions de santé. Il surveille par exemple l'assurance-maladie sociale.
