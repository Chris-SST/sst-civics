id: strafgesetzbuch-haftstrafe-entscheid
lang: fr
source_version: 1
question: De quelle loi dépend le fait qu'une personne doive purger une peine de prison ?
options:
  a: Du Code civil
  b: Du Code des obligations
  c: Du droit du bail
  d: Du Code pénal
explanation: Le Code pénal détermine quels actes sont punissables et quelles peines peuvent être prononcées
  pour ceux-ci. Ces peines comprennent les peines pécuniaires et les peines privatives de liberté. Dans
  chaque cas particulier, c'est un tribunal qui décide de la peine.
