question: Quelle autorité est, au niveau fédéral, l'organe judiciaire suprême de la Suisse ?
options:
  a: La Chancellerie fédérale (Bundeskanzlei)
  b: Le Conseil fédéral (Bundesrat)
  c: L'Assemblée fédérale (Bundesversammlung)
  d: Le Tribunal fédéral (Bundesgericht)
explanation: La Constitution fédérale attribue le pouvoir judiciaire de la Confédération au Tribunal fédéral.
  Il est l'autorité judiciaire suprême de la Confédération. Le Conseil fédéral et l'Assemblée fédérale
  exercent respectivement le pouvoir exécutif et le pouvoir législatif.
