question: Quelle ville assume le rôle de capitale en Suisse ?
options:
  a: Berne
  b: Genève
  c: Lausanne
  d: Zurich
explanation: Berne est le siège du Conseil fédéral (Bundesrat) et de l'Assemblée fédérale (Bundesversammlung)
  et est désignée comme « ville fédérale ». La Constitution fédérale ne mentionne aucune capitale, mais
  Berne assume ce rôle. Zurich est la plus grande ville, Lausanne est le siège du Tribunal fédéral (Bundesgericht).
