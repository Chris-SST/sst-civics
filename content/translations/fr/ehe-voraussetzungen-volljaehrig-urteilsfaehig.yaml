id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: fr
source_version: 1
question: Quelles conditions les personnes doivent-elles remplir pour pouvoir se marier en Suisse ?
options:
  a: Elles doivent posséder le droit de cité suisse (Bürgerrecht) et être majeures
  b: Elles doivent être majeures et capables d'agir raisonnablement
  c: Elles doivent vivre ensemble depuis au moins cinq ans
  d: Elles doivent appartenir à la même religion
explanation: Peut se marier toute personne majeure et capable de discernement. Être capable de discernement
  signifie que l'on peut agir raisonnablement. La nationalité, la religion ou une certaine durée de vie
  commune ne sont pas des conditions requises.
