    question_de: Welche Voraussetzungen müssen Personen erfüllen, um in der Schweiz heiraten zu können?
    options_de:
      a: Sie müssen das Schweizer Bürgerrecht besitzen und volljährig sein
      b: Sie müssen volljährig und fähig sein, vernünftig zu handeln
      c: Sie müssen seit mindestens fünf Jahren zusammenleben
      d: Sie müssen derselben Religion angehören
    explanation_de: Heiraten kann jede volljährige und urteilsfähige Person. Urteilsfähig zu sein bedeutet,
      dass man vernünftig handeln kann. Die Staatsangehörigkeit, die Religion oder eine bestimmte Dauer
      des Zusammenlebens sind keine erforderlichen Voraussetzungen.
