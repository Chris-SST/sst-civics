id: parlament-zwei-kammern-bund
lang: fr
source_version: 1
question: De quelles deux chambres le Parlement suisse se compose-t-il au niveau fédéral ?
options:
  a: Du Conseil fédéral (Bundesrat) et du Conseil des États (Ständerat)
  b: Du Conseil fédéral et du Conseil national (Nationalrat)
  c: Du Conseil des États et du Tribunal fédéral (Bundesgericht)
  d: Du Conseil national et du Conseil des États
explanation: 'L''Assemblée fédérale (Bundesversammlung), le Parlement de la Confédération, se compose
  de deux chambres : le Conseil national et le Conseil des États. Le Conseil fédéral est le gouvernement
  et ne fait pas partie du Parlement.'
