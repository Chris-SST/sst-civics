id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: fr
source_version: 1
question: Dans quel cas les locataires doivent-ils permettre au bailleur d'accéder au logement ?
options:
  a: Jamais, le logement est toujours protégé
  b: Lorsqu'il existe un motif sérieux
  c: Uniquement si le bailleur l'exige, sans justification
  d: À tout moment et sans préavis
explanation: Les locataires doivent permettre l'accès lorsqu'il existe un motif sérieux, par exemple une
  réparation urgente. Toutefois, le bailleur doit annoncer sa visite en temps utile et tenir compte des
  locataires. Un accès sans motif n'est pas autorisé.
