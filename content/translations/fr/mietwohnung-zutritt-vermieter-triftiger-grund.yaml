    question_de: In welchem Fall müssen die Mieterinnen und Mieter dem Vermieter den Zutritt zur Wohnung
      gewähren?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein wichtiger Grund vorliegt
      c: Nur wenn der Vermieter es verlangt, ohne Begründung
      d: Jederzeit und ohne Vorankündigung
    explanation_de: Die Mieterinnen und Mieter müssen den Zutritt gewähren, wenn ein wichtiger Grund vorliegt,
      zum Beispiel eine dringende Reparatur. Der Vermieter muss jedoch seinen Besuch rechtzeitig ankündigen
      und auf die Mieterinnen und Mieter Rücksicht nehmen. Ein Zutritt ohne Grund ist nicht erlaubt.
