id: bundeshaus-bern-sitz-parlament
lang: fr
source_version: 1
question: Quel bâtiment de Berne est le lieu de réunion du Parlement suisse ?
options:
  a: Le Kornhaus
  b: L'Hôtel de Ville (Rathaus)
  c: Le Tribunal administratif fédéral
  d: Le Palais fédéral (Bundeshaus)
explanation: Le Parlement suisse siège au Palais fédéral (Bundeshaus) à Berne. C'est là que le Conseil
  national et le Conseil des États (Ständerat) se réunissent pour leurs sessions. L'Hôtel de Ville (Rathaus)
  est un bâtiment du canton de Berne ou de la ville, et non du Parlement de la Confédération.
