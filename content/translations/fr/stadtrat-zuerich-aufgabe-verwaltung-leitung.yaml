question: Quelle est la tâche du Conseil municipal (Stadtrat) de la ville de Zurich ?
options:
  a: Il dirige l'administration fiscale cantonale dans la ville.
  b: Il édicte les lois cantonales pour le territoire de la ville.
  c: Il rend la justice dans les litiges entre les habitantes et les habitants.
  d: Il pilote l'administration municipale et fixe les lignes directrices de l'action de la ville.
explanation: Le Conseil municipal est l'exécutif de la ville de Zurich. Il dirige l'administration municipale
  et détermine dans quelle direction la ville se développe. Les tribunaux rendent la justice, et les lois
  cantonales sont édictées par le Conseil cantonal (Kantonsrat).
