    question_de: Was ist die Aufgabe des Stadtrats der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die kantonalen Gesetze für das Gebiet der Stadt.
      c: Er spricht Recht bei Streitigkeiten zwischen den Einwohnerinnen und Einwohnern.
      d: Er steuert die städtische Verwaltung und legt die Leitlinien des Handelns der Stadt fest.
    explanation_de: Der Stadtrat ist die Exekutive der Stadt Zürich. Er leitet die städtische Verwaltung
      und bestimmt, in welche Richtung sich die Stadt entwickelt. Die Gerichte sprechen Recht, und die
      kantonalen Gesetze werden vom Kantonsrat erlassen.
