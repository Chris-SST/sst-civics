id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: fr
source_version: 1
question: Laquelle de ces tâches fait partie de la mission de la police ?
options:
  a: Poursuivre les infractions à la loi
  b: Organiser des votations populaires
  c: Adopter les lois du pays
  d: Prononcer des jugements contre les auteurs d'infractions
explanation: La police veille à la sécurité et à l'ordre public et poursuit les infractions à la loi.
  Elle élucide les infractions pénales et transmet les résultats. Les lois sont adoptées par le Parlement,
  les jugements sont rendus par les tribunaux.
