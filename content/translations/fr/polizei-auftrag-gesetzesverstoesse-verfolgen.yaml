    question_de: Welche dieser Aufgaben gehört zum Auftrag der Polizei?
    options_de:
      a: Gesetzesverstösse verfolgen
      b: Volksabstimmungen organisieren
      c: Die Gesetze des Landes erlassen
      d: Urteile gegen die Täter von Straftaten aussprechen
    explanation_de: Die Polizei sorgt für die Sicherheit und die öffentliche Ordnung und verfolgt Gesetzesverstösse.
