question: Qui décide, en règle générale, dans le canton de Zurich de la demande de permis de construire
  pour un nouvel immeuble d'habitation ?
options:
  a: Le Conseil d'État (Regierungsrat)
  b: L'autorité de construction de la commune (Gemeinde)
  c: Le tribunal de district
  d: L'Office fédéral du développement territorial
explanation: Les demandes de permis de construire pour des immeubles d'habitation se déposent auprès de
  la commune. L'autorité communale de construction examine la demande et délivre le permis de construire
  ou le refuse. Le canton n'intervient que dans des cas particuliers.
