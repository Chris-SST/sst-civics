    question_de: Wie geben die meisten Stimmberechtigten in der Schweiz heute ihre Stimme bei Abstimmungen
      und Wahlen ab?
    options_de:
      a: Sie geben sie am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie legen sie am Abstimmungssonntag persönlich in die Urne.
      c: Sie schicken sie per Post an die Gemeinde.
      d: Sie geben sie auf einer Internetseite des Bundes ab.
    explanation_de: Die Mehrheit der Stimmberechtigten stimmt brieflich ab, das heisst auf dem Postweg.
      Am Abstimmungssonntag an die Urne zu gehen, ist heute für die meisten von ihnen nicht mehr üblich.
