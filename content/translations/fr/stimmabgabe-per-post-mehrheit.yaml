id: stimmabgabe-per-post-mehrheit
lang: fr
source_version: 1
question: Comment la plupart des personnes ayant le droit de vote en Suisse expriment-elles aujourd'hui
  leur voix lors des votations et des élections ?
options:
  a: Elles l'expriment le dimanche de la votation à l'assemblée communale (Gemeindeversammlung).
  b: Elles la déposent personnellement dans l'urne le dimanche de la votation.
  c: Elles l'envoient par la poste à la commune (Gemeinde).
  d: Elles l'expriment sur un site internet de la Confédération.
explanation: La majorité des personnes ayant le droit de vote votent par correspondance, c'est-à-dire
  par voie postale. Se rendre aux urnes le dimanche de la votation n'est aujourd'hui plus habituel pour
  la plupart d'entre elles.
