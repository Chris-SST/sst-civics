id: soziale-sicherheit-bund-verantwortung
lang: fr
source_version: 1
question: Quel niveau de l'État est responsable, en Suisse, de la protection sociale de la population,
  par exemple au moyen de la prévoyance vieillesse ?
options:
  a: Les districts
  b: Seulement les communes (Gemeinden)
  c: La Confédération
  d: Seulement les cantons
explanation: La Constitution fédérale attribue à la Confédération d'importantes tâches en matière de sécurité
  sociale. Il s'agit par exemple de l'assurance-vieillesse et survivants (AVS) (AHV) et de l'assurance-invalidité.
  Ainsi, des bases uniformes s'appliquent à l'ensemble de la Suisse.
