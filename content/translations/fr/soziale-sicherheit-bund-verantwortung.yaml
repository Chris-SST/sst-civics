    question_de: Welche staatliche Ebene ist in der Schweiz für die soziale Absicherung der Bevölkerung
      zuständig, zum Beispiel mittels der Altersvorsorge?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Der Bund
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung weist dem Bund wichtige Aufgaben im Bereich der sozialen Sicherheit
      zu. Dazu gehören zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung.
      So gelten einheitliche Grundlagen für die ganze Schweiz.
