id: verbot-kinderarbeit-fabrik-schulunterricht
lang: fr
source_version: 1
question: Que devait avant tout garantir l'interdiction du travail des enfants dans les fabriques en 1877
  ?
options:
  a: Que les fabriques devaient payer des salaires plus bas
  b: Que les enfants puissent aller à l'école
  c: Que les enfants devaient aider plus tôt dans le ménage
  d: Que les fabriques fassent venir davantage de main-d'œuvre de l'étranger
explanation: La loi sur les fabriques de 1877 interdisait le travail des enfants en fabrique. Ils devaient
  suivre l'enseignement scolaire au lieu de travailler. La loi protégeait aussi la santé des travailleurs.
