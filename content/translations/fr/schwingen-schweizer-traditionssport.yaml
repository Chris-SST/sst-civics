question: Quel sport traditionnel en Suisse est une sorte de lutte ?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'Le Schwingen est une lutte entre deux personnes sur une aire circulaire recouverte de sciure
  et il est considéré comme un sport traditionnel suisse. Le Hornussen et le Steinstossen sont aussi d''anciens
  sports suisses, mais ce ne sont pas des luttes : au Hornussen, on frappe un petit disque pour l''envoyer
  loin dans les airs, au Steinstossen, on lance une pierre lourde. Le curling se joue sur la glace et
  vient à l''origine d''Écosse.'
