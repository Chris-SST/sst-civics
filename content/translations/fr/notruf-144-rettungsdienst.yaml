question: Quel numéro de téléphone compose-t-on en Suisse, en cas d'urgence médicale, pour appeler le
  service de secours ?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: Le 144 est le numéro d'urgence du service de secours en cas d'urgence médicale. Le 117 est
  celui de la police et le 118 celui des pompiers. Le 145 est le numéro de Tox Info Suisse en cas d'intoxication.
