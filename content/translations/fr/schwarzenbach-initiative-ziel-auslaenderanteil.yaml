question: Que voulait l'initiative Schwarzenbach, sur laquelle le peuple a voté en 1970 ?
options:
  a: Elle voulait faciliter la naturalisation pour tous les étrangers.
  b: Elle voulait interdire l'immigration uniquement en provenance d'Italie.
  c: Elle voulait limiter la proportion d'étrangers vivant en Suisse.
  d: Elle voulait introduire le droit de vote pour les étrangers.
explanation: L'initiative demandait de limiter la proportion d'étrangers en Suisse. Elle a été rejetée
  par le peuple en 1970. Elle montre à quel point l'immigration était alors débattue.
