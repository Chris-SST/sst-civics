question: Quel service délivre le permis de conduire pour voitures de tourisme dans le canton de Zurich
  ?
options:
  a: Le tribunal de district
  b: Le service des automobiles du canton
  c: La police municipale de la commune de domicile
  d: L'Office fédéral des routes
explanation: Dans le canton de Zurich, le service des automobiles (Strassenverkehrsamt) est compétent
  pour les permis de conduire. Il fait partie de la Direction de la sécurité. Les communes (Gemeinden)
  et la Confédération ne délivrent pas de permis de conduire.
