id: krankenversicherung-obligatorisch-alle-einwohner
lang: fr
source_version: 1
question: Qui doit avoir une assurance de base auprès d'une caisse-maladie (Krankenkasse) en Suisse ?
options:
  a: toutes les personnes qui vivent en Suisse
  b: uniquement les personnes à faible revenu
  c: uniquement les personnes ayant le droit de cité (Bürgerrecht) suisse
  d: uniquement les personnes qui exercent une activité lucrative
explanation: L'assurance-maladie est obligatoire pour toutes les personnes domiciliées en Suisse. Cela
  s'applique indépendamment de la nationalité, de l'âge ou de l'exercice d'une activité lucrative. Les
  caisses-maladie doivent accepter toutes les personnes dans l'assurance de base.
