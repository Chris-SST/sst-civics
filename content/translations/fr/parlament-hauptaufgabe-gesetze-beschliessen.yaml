id: parlament-hauptaufgabe-gesetze-beschliessen
lang: fr
source_version: 1
question: Quelle est la tâche la plus importante du Parlement fédéral ?
options:
  a: Diriger la police dans tout le pays
  b: Trancher les litiges entre des personnes
  c: Délibérer sur les lois et les adopter
  d: Faire appliquer les lois au quotidien
explanation: Le Parlement est le pouvoir législatif. Il délibère sur les lois de la Confédération et les
  adopte. Le gouvernement les met en œuvre, et les tribunaux statuent dans les litiges.
