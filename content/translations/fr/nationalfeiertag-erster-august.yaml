id: nationalfeiertag-erster-august
lang: fr
source_version: 1
question: À quelle date la Suisse célèbre-t-elle sa fête nationale ?
options:
  a: Le 12 septembre
  b: Le 1er août
  c: Le 11 novembre
  d: Le 1er mai
explanation: Le 1er août est la fête nationale de la Suisse. Cette date rappelle le Pacte fédéral de 1291.
  On la célèbre avec des feux, des feux d'artifice et des discours.
