id: romandie-welschland-bedeutung
lang: fr
source_version: 1
question: Que désigne le terme «Romandie» ou «Welschland» ?
options:
  a: La partie italophone de la Suisse
  b: La partie francophone de la Suisse
  c: La partie de la Suisse où l'on parle le romanche
  d: La partie germanophone de la Suisse
explanation: Le terme «Romandie» ou «Welschland» désigne les régions de la Suisse où l'on parle français.
  Les cantons de Genève et de Vaud en font par exemple partie. La partie italophone correspond surtout
  au Tessin.
