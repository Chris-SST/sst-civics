id: kantonsrat-mandat-durch-volkswahl
lang: fr
source_version: 1
question: Comment les membres du Conseil cantonal (Kantonsrat) zurichois obtiennent-ils leur mandat ?
options:
  a: Ils sont élus par le peuple.
  b: Ils sont désignés par les conseils communaux (Gemeinderäte).
  c: Ils sont nommés par le Conseil d'État (Regierungsrat).
  d: Ils sont désignés par le Conseil fédéral (Bundesrat).
explanation: Les membres du Conseil cantonal sont élus par les personnes ayant le droit de vote dans le
  canton, lors d'une élection populaire. Le parlement est donc désigné directement par le peuple. Ni le
  gouvernement ni la Confédération ne désignent les membres.
