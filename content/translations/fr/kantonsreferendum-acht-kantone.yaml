id: kantonsreferendum-acht-kantone
lang: fr
source_version: 1
question: Qui peut, en plus de 50 000 titulaires du droit de vote, demander également un référendum facultatif
  contre une loi fédérale ?
options:
  a: Huit cantons
  b: Trois grands partis ensemble
  c: Le Conseil fédéral (Bundesrat)
  d: Le Tribunal fédéral (Bundesgericht)
explanation: Selon la Constitution fédérale, huit cantons peuvent aussi demander une votation populaire
  sur une loi fédérale. On appelle cela le référendum des cantons (Kantonsreferendum). Il est rarement
  utilisé, mais il montre que les cantons disposent de droits de participation dans l'État fédéral.
