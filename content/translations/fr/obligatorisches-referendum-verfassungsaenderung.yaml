    question_de: Über welches Geschäft muss in der Schweiz immer abgestimmt werden, auch wenn keine Unterschriften
      gesammelt werden?
    options_de:
      a: Über jedes neue Bundesgesetz
      b: Über jede Änderung der Bundesverfassung
      c: Über jede Verordnung des Bundesrates
      d: Über jedes Budget des Bundes
    explanation_de: Jede Änderung der Bundesverfassung muss zwingend dem Volk und den Kantonen vorgelegt
      werden. Man nennt dies das obligatorische Referendum. Die Bundesgesetze unterstehen nur dem fakultativen
      Referendum.
