id: obligatorisches-referendum-verfassungsaenderung
lang: fr
source_version: 1
question: Sur quel objet faut-il toujours voter en Suisse, même si aucune signature n'est récoltée ?
options:
  a: Sur chaque nouvelle loi fédérale
  b: Sur chaque modification de la Constitution fédérale
  c: Sur chaque ordonnance du Conseil fédéral (Bundesrat)
  d: Sur chaque budget de la Confédération
explanation: Toute modification de la Constitution fédérale doit obligatoirement être soumise au peuple
  et aux cantons. On appelle cela le référendum obligatoire. Les lois fédérales sont soumises uniquement
  au référendum facultatif.
