question: Sur quoi reposent, pour l'essentiel, les relations entre la Suisse et l'Union européenne (UE)
  ?
options:
  a: Sur un ensemble d'accords bilatéraux
  b: Sur un gouvernement commun
  c: Sur l'adhésion de la Suisse à l'UE
  d: Sur une constitution commune
explanation: La Suisse n'est pas membre de l'UE. Ses relations sont réglées par de nombreux accords bilatéraux,
  c'est-à-dire des traités entre deux partenaires. Ils concernent par exemple le commerce et la libre
  circulation des personnes.
