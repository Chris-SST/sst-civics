id: volksinitiative-ziel-verfassungsaenderung
lang: fr
source_version: 2
question: Que peuvent exiger les ayants droit de vote au moyen d'une initiative populaire (Volksinitiative)
  fédérale ?
options:
  a: Que le Conseil fédéral (Bundesrat) soit révoqué
  b: Que la Constitution fédérale soit modifiée
  c: Qu'une loi fédérale existante soit directement abrogée
  d: Que la constitution cantonale soit modifiée
explanation: Au moyen d'une initiative populaire fédérale, les ayants droit de vote peuvent exiger une
  modification de la Constitution fédérale. Avec un référendum, en revanche, le peuple peut voter sur
  une nouvelle loi que le Parlement vient d'adopter. Une loi déjà existante ne peut pas être abrogée par
  ce moyen.
