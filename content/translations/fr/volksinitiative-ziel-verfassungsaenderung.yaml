    question_de: Was können die Stimmberechtigten mit einer eidgenössischen Volksinitiative verlangen?
    options_de:
      a: Dass der Bundesrat abgewählt wird
      b: Dass die Bundesverfassung geändert wird
      c: Dass ein bestehendes Bundesgesetz direkt aufgehoben wird
      d: Dass die Kantonsverfassung geändert wird
    explanation_de: Mit einer eidgenössischen Volksinitiative können die Stimmberechtigten eine Änderung
      der Bundesverfassung verlangen. Mit einem Referendum hingegen kann das Volk über ein neues Gesetz
      abstimmen, das das Parlament soeben verabschiedet hat. Ein bereits bestehendes Gesetz kann auf diesem
      Weg nicht aufgehoben werden.
