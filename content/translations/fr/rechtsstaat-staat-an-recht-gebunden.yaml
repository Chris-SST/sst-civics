id: rechtsstaat-staat-an-recht-gebunden
lang: fr
source_version: 2
question: Que s'applique-t-il aux autorités et au gouvernement dans un État de droit comme la Suisse ?
options:
  a: Ils peuvent choisir eux-mêmes les lois qu'ils respectent.
  b: Eux aussi doivent respecter le droit en vigueur.
  c: Ils sont au-dessus du droit en vigueur.
  d: Ils doivent seulement se conformer aux décisions des médias.
explanation: Dans un État de droit, ce n'est pas seulement la population qui doit respecter le droit,
  mais aussi l'État lui-même. Les autorités et le gouvernement ne peuvent agir que dans les limites permises
  par le droit. Ainsi, l'État de droit protège les personnes contre l'arbitraire.
