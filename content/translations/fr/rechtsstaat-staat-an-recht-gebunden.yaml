    question_de: Was gilt für die Behörden und die Regierung in einem Rechtsstaat wie der Schweiz?
    options_de:
      a: Sie können selbst wählen, welche Gesetze sie einhalten.
      b: Auch sie müssen das geltende Recht einhalten.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen sich nur nach den Entscheidungen der Medien richten.
    explanation_de: In einem Rechtsstaat muss nicht nur die Bevölkerung das Recht einhalten, sondern auch
      der Staat selbst. Die Behörden und die Regierung dürfen nur innerhalb der vom Recht erlaubten Grenzen
      handeln. So schützt der Rechtsstaat die Menschen vor Willkür.
