question: Quelles langues sont des langues nationales en Suisse ?
options:
  a: L'allemand, le français, le romanche et l'espagnol
  b: L'allemand, le français, l'italien et le romanche
  c: L'allemand, le français, l'italien et l'anglais
  d: L'allemand, le français et l'italien
explanation: La Constitution fédérale désigne l'allemand, le français, l'italien et le romanche comme
  langues nationales. L'anglais n'est pas une langue nationale, mais il est souvent utilisé comme langue
  de communication.
