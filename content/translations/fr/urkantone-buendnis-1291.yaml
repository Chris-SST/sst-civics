question: Quels trois territoires se sont alliés en 1291 et sont considérés comme le noyau de la future
  Confédération ?
options:
  a: Uri, Schwyz et Unterwald
  b: Glaris, Zoug et Uri
  c: Bâle, Schaffhouse et Appenzell
  d: Zurich, Berne et Lucerne
explanation: Uri, Schwyz et Unterwald ont conclu une alliance en 1291. Cette date est considérée comme
  l'origine de la Suisse et est célébrée le 1er août. Les autres lieux ne sont entrés dans la Confédération
  que plus tard.
