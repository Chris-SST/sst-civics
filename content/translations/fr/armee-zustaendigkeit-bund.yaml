id: armee-zustaendigkeit-bund
lang: fr
source_version: 1
question: Quel niveau de l'État est responsable de l'armée ?
options:
  a: Les cantons
  b: La Confédération
  c: Les districts
  d: Les communes (Gemeinden)
explanation: Les affaires militaires relèvent de la Confédération. Elle règle l'armée et ses tâches dans
  la Constitution fédérale et dans les lois fédérales. Les cantons participent à l'exécution, par exemple
  lors du recrutement.
