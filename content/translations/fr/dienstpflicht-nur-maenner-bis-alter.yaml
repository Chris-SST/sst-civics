id: dienstpflicht-nur-maenner-bis-alter
lang: fr
source_version: 1
question: Qui est tenu en Suisse d'accomplir le service militaire ou le service de remplacement jusqu'à
  un certain âge ?
options:
  a: Uniquement les hommes
  b: Les femmes et les hommes de la même manière
  c: Uniquement les personnes ayant une formation
  d: Uniquement les personnes qui exercent une fonction dans une commune (Gemeinde)
explanation: En Suisse, l'obligation de servir ne s'applique qu'aux hommes. Pour les femmes, le service
  militaire est volontaire. L'obligation dure jusqu'à un âge fixé par la loi.
