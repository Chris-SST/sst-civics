id: iv-kuerzel-invalidenversicherung
lang: fr
source_version: 1
question: Que signifie l'abréviation «IV» (assurance-invalidité (AI)) dans le système suisse d'assurances
  sociales ?
options:
  a: Inlandversicherung (assurance nationale)
  b: Invalidenversicherung (assurance-invalidité)
  c: Integrationsversicherung (assurance d'intégration)
  d: Individualversicherung (assurance individuelle)
explanation: IV signifie Invalidenversicherung, c'est-à-dire l'assurance-invalidité (AI). Elle fait partie
  du premier pilier de la prévoyance vieillesse et aide les personnes présentant des atteintes à la santé,
  par exemple par des mesures de réadaptation ou des rentes.
