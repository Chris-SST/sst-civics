id: erderwaermung-gletscher-schrumpfen
lang: fr
source_version: 1
question: Quel est l'effet du réchauffement climatique sur les glaciers des Alpes suisses ?
options:
  a: Les glaciers rétrécissent.
  b: Les glaciers se déplacent vers le nord.
  c: Les glaciers croissent plus rapidement.
  d: Les glaciers restent inchangés.
explanation: Lorsque les températures augmentent, il fond plus de glace que la neige n'en apporte. C'est
  pourquoi les glaciers suisses diminuent de taille. Cela a aussi des effets sur les eaux et sur le paysage
  dans les Alpes.
