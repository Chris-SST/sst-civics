question: Que s'est-il passé en 1798 en Suisse sous l'influence de Napoléon Bonaparte ?
options:
  a: Elle est devenue une partie de l'Empire allemand.
  b: Elle est devenue une monarchie avec son propre roi.
  c: Elle a été divisée durablement en deux États.
  d: Elle est devenue temporairement un État centralisé, la République helvétique.
explanation: En 1798, après l'invasion des troupes françaises, la République helvétique a été créée. C'était
  un État unitaire gouverné de manière centralisée, qui a remplacé temporairement l'ancienne Confédération.
  Les cantons n'avaient presque aucun droit propre.
