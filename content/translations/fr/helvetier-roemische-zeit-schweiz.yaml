id: helvetier-roemische-zeit-schweiz
lang: fr
source_version: 1
question: Quel peuple vivait sur le territoire de l'actuelle Suisse à l'époque des Romains ?
options:
  a: Les Huns
  b: Les Vikings
  c: Les Goths
  d: Les Helvètes
explanation: Les Helvètes étaient une tribu celte établie sur le Plateau suisse (Mittelland). Les Romains
  les ont soumis et le territoire est devenu une partie de l'Empire romain. Le nom latin Helvetia, qui
  désigne la Suisse, rappelle encore leur souvenir.
