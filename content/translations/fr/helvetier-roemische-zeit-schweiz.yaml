    question_de: Welches Volk lebte zur Zeit der Römer auf dem Gebiet der heutigen Schweiz?
    options_de:
      a: Die Hunnen
      b: Die Wikinger
      c: Die Goten
      d: Die Helvetier
    explanation_de: Die Helvetier waren ein keltischer Stamm, der sich im schweizerischen Mittelland niedergelassen
      hatte. Die Römer unterwarfen sie, und das Gebiet wurde ein Teil des Römischen Reiches. Der lateinische
      Name Helvetia, der die Schweiz bezeichnet, erinnert noch an sie.
