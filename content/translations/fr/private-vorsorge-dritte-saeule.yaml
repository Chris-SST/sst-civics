question: Qu'est-ce qui constitue le troisième pilier de la prévoyance vieillesse en Suisse ?
options:
  a: L'assurance-accidents obligatoire
  b: La prévoyance privée
  c: La caisse de pension de l'employeur
  d: Les prestations complémentaires
explanation: Le troisième pilier est la prévoyance privée, par exemple l'épargne liée. Elle est facultative
