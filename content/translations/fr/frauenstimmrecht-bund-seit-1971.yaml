id: frauenstimmrecht-bund-seit-1971
lang: fr
source_version: 1
question: Depuis quand les femmes peuvent-elles voter et participer aux votations en Suisse au niveau
  national ?
options:
  a: Depuis 1918
  b: Depuis 1848
  c: Depuis 1971
  d: Depuis 1991
explanation: Au niveau de la Confédération, le droit de vote des femmes a été introduit en 1971. Certains
  cantons et certaines communes (Gemeinden) le connaissaient plus tôt, d'autres ne l'ont introduit que
  plus tard. Le dernier canton à suivre a été Appenzell Rhodes-Intérieures, en 1990.
