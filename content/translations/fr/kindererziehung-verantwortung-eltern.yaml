id: kindererziehung-verantwortung-eltern
lang: fr
source_version: 1
question: Qui est principalement responsable de l'éducation des enfants en Suisse ?
options:
  a: La commune (Gemeinde)
  b: Les parents
  c: L'école
  d: Le canton
explanation: Selon le Code civil, les parents veillent au bien de l'enfant et dirigent son éducation.
  L'école complète cette tâche par l'instruction. L'État n'intervient que lorsque le bien de l'enfant
  est menacé.
