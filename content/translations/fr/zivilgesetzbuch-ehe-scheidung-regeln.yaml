    question_de: Welches Gesetz regelt unter anderem, wie eine Ehe geschlossen und dann durch die Scheidung
      aufgelöst wird?
    options_de:
      a: Das Zivilgesetzbuch
      b: Das Strafgesetzbuch
      c: Das Asylgesetz
      d: Das Bundesgerichtsgesetz
    explanation_de: Das Zivilgesetzbuch regelt das Personenrecht, das Familienrecht, das Erbrecht und
      das Sachenrecht. Die Eheschliessung und die Scheidung gehören ebenfalls dazu. Das Strafgesetzbuch
      hingegen behandelt die Straftaten und die Strafen.
