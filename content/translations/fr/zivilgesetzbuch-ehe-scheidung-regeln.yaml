id: zivilgesetzbuch-ehe-scheidung-regeln
lang: fr
source_version: 1
question: Quelle loi règle, entre autres, la manière dont un mariage est conclu puis dissous par le divorce
  ?
options:
  a: Le Code civil
  b: Le Code pénal
  c: La loi sur l'asile
  d: La loi sur le Tribunal fédéral
explanation: Le Code civil règle le droit des personnes, le droit de la famille, le droit successoral
  et les droits réels. La conclusion du mariage et le divorce en font également partie. Le Code pénal,
  en revanche, traite des infractions et des peines.
