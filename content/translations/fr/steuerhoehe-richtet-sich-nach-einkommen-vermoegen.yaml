question: De quoi dépend principalement le montant de l'impôt sur le revenu et sur la fortune qu'une personne
  paie dans le canton de Zurich ?
options:
  a: Du revenu et de la fortune imposables
  b: De la profession de la personne
  c: De la durée du domicile dans la commune (Gemeinde)
  d: Du nombre de fois où le droit de vote a été exercé
explanation: L'impôt est calculé sur le revenu et la fortune imposables. Celui qui gagne ou possède davantage
  paie en règle générale plus d'impôts.
