question: Quel âge de la retraite (aujourd'hui appelé «âge de référence») s'applique dans l'assurance-vieillesse
  et survivants (AHV) à partir de 2028 pour les femmes et les hommes ?
options:
  a: Femmes 64 ans, hommes 65 ans
  b: Femmes et hommes 65 ans
  c: Femmes et hommes 63 ans
  d: Femmes et hommes 67 ans
explanation: Depuis la réforme AVS 21, l'âge de la retraite s'appelle officiellement «âge de référence».
  À partir de 2025, il augmente chaque année de trois mois pour les femmes, jusqu'à atteindre 65 ans.
  À partir de 2028, les femmes et les hommes ont le même âge de référence de 65 ans.
