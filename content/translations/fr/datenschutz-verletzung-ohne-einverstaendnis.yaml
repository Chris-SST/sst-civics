id: datenschutz-verletzung-ohne-einverstaendnis
lang: fr
source_version: 1
question: Dans quel cas la protection des données est-elle violée ?
options:
  a: Des informations privées concernant une personne sont rendues publiques sans son consentement et
    sans base légale.
  b: Une autorité enregistre des données, comme l'exige une loi.
  c: Une personne communique volontairement sa propre adresse.
  d: Une personne autorise expressément la publication de sa photo.
explanation: La protection de la sphère privée comprend la protection contre l'utilisation abusive de
  données personnelles. Des informations privées ne peuvent être rendues publiques qu'avec le consentement
  de la personne concernée ou sur la base d'une loi. Si ni l'un ni l'autre n'existe, il y a violation.
