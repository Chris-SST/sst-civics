    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Informationen über eine Person werden ohne ihre Einwilligung und ohne gesetzliche Grundlage
        öffentlich gemacht.
      b: Eine Behörde erfasst Daten, wie es ein Gesetz verlangt.
      c: Eine Person teilt freiwillig ihre eigene Adresse mit.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz der Privatsphäre umfasst den Schutz vor missbräuchlicher Verwendung persönlicher
      Daten. Private Informationen dürfen nur mit der Einwilligung der betroffenen Person oder auf der
      Grundlage eines Gesetzes öffentlich gemacht werden. Wenn weder das eine noch das andere vorliegt,
      liegt eine Verletzung vor.
