question: Qui décide, dans le canton de Zurich, à quelle classe de l'école primaire un enfant est affecté
  ?
options:
  a: Le conseil scolaire (Schulpflege) ou la direction de l'école
  b: Le département de l'éducation de la Confédération
  c: L'assemblée communale (Gemeindeversammlung)
  d: Les parents de l'enfant
explanation: Le conseil scolaire ou la direction de l'école affecte les enfants aux classes. Les parents
  ne peuvent pas choisir librement la classe. L'école organise ainsi son fonctionnement et l'effectif
  des classes.
