id: gottfried-keller-zuercher-dichter
lang: fr
source_version: 2
question: Quel célèbre poète et écrivain était originaire de Zurich ?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller est né en 1819 à Zurich, a écrit par exemple « Henri le Vert » (« Der grüne
  Heinrich ») et a également travaillé comme secrétaire d'État (« Staatsschreiber ») du canton de Zurich.
  Robert Walser était originaire de Bienne, Friedrich Dürrenmatt de Konolfingen, dans le canton de Berne,
  et Jeremias Gotthelf a exercé comme pasteur dans le canton de Berne.
