question: Quel est le statut du français en Suisse ?
options:
  a: Le français n'est qu'une langue étrangère à l'école.
  b: Le français n'est qu'une langue de communication régionale.
  c: Le français est une langue nationale.
  d: Le français est une langue minoritaire sans statut officiel.
explanation: Le français est l'une des langues nationales de la Suisse. Il est parlé surtout en Suisse
  romande et c'est une langue officielle au niveau de la Confédération.
