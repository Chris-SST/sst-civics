question: Sur le territoire de laquelle de ces communes (Gemeinden) se trouve l'aéroport de Zurich ?
options:
  a: Winterthour
  b: Kloten
  c: Uster
  d: Dübendorf
explanation: L'aéroport de Zurich se trouve en grande partie sur le territoire de la ville de Kloten,
  dans le Unterland zurichois. C'est pourquoi beaucoup de personnes parlent aussi de l'« aéroport de Kloten
  ». À Dübendorf, il y a un autre aérodrome.
