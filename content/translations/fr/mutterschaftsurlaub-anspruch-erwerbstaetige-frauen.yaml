    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes Anspruch auf einen gesetzlichen Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Unternehmen mit mehr als 50 Angestellten arbeiten
      b: Jede erwerbstätige Frau, die ein Kind zur Welt bringt
      c: Nur verheiratete Frauen
      d: Nur Frauen mit schweizerischem Bürgerrecht
    explanation_de: Das Gesetz sieht für erwerbstätige Mütter einen Anspruch auf Mutterschaftsurlaub und
      auf eine Entschädigung vor. Die Grösse des Unternehmens, die Staatsangehörigkeit und der Zivilstand
      spielen dabei keine Rolle. Die Entschädigung wird durch die Erwerbsersatzordnung finanziert.
