question: Qui a droit, en Suisse, à un congé de maternité légal après la naissance d'un enfant ?
options:
  a: Uniquement les femmes qui travaillent dans une entreprise de plus de 50 employés
  b: Toute femme exerçant une activité lucrative qui met un enfant au monde
  c: Uniquement les femmes mariées
  d: Uniquement les femmes ayant le droit de cité (Bürgerrecht) suisse
explanation: La loi prévoit pour les mères exerçant une activité lucrative un droit au congé de maternité
  et à une allocation. La taille de l'entreprise, la nationalité et l'état civil n'ont aucune importance
  à cet égard. L'allocation est financée par le régime des allocations pour perte de gain.
