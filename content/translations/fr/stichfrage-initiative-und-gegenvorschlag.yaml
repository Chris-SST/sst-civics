    question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenentwurf gibt es
      eine Stichfrage. Wozu dient sie?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Kantone das Recht haben, an der Abstimmung teilzunehmen
      c: Sie entscheidet, welcher Text gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften noch einmal überprüft werden müssen
    explanation_de: Die Stimmberechtigten können sowohl der Initiative als auch dem Gegenentwurf zustimmen.
      Mit der Stichfrage geben sie an, welcher Text in Kraft treten soll, wenn beide angenommen werden.
      So können die Stimmen zwischen zwei ähnlichen Texten nicht verloren gehen.
