id: stichfrage-initiative-und-gegenvorschlag
lang: fr
source_version: 1
question: Lors d'une votation sur une initiative populaire (Volksinitiative) et un contre-projet direct,
  il y a une question subsidiaire. À quoi sert-elle ?
options:
  a: Elle décide si la votation doit être répétée
  b: Elle décide si les cantons ont le droit de participer au vote
  c: Elle décide quel texte s'applique si les deux sont acceptés
  d: Elle décide si les signatures doivent être vérifiées une nouvelle fois
explanation: Les personnes disposant du droit de vote peuvent approuver à la fois l'initiative et le contre-projet.
  Avec la question subsidiaire, elles indiquent quel texte doit entrer en vigueur si les deux sont acceptés.
  Ainsi, les voix ne peuvent pas se perdre entre deux textes similaires.
