id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: fr
source_version: 1
question: Que signifie le principe de collégialité au sein du Conseil fédéral (Bundesrat) ?
options:
  a: La présidente ou le président de la Confédération (Bundespräsident) décide seul.
  b: Les membres défendent de manière uniforme, à l'extérieur, les décisions du Conseil fédéral.
  c: Chaque membre décide dans son département sans se concerter avec les autres.
  d: Les membres peuvent exprimer publiquement leur opinion divergente.
explanation: Le Conseil fédéral décide en tant que collège. Même celui ou celle qui a défendu une autre
  opinion au sein du Conseil fédéral soutient la décision à l'extérieur. Ainsi, le gouvernement se présente
  de manière unie.
