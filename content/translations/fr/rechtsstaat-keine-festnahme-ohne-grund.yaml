id: rechtsstaat-keine-festnahme-ohne-grund
lang: fr
source_version: 1
question: Que prévaut-il dans un État de droit en matière d'arrestation et de détention ?
options:
  a: L'État ne peut arrêter ni placer en détention personne sans motif.
  b: L'État peut détenir des personnes à sa discrétion.
  c: Le gouvernement peut placer préventivement en détention ses détracteurs.
  d: Seuls les étrangers et les étrangères peuvent être arrêtés sans motif.
explanation: Dans un État de droit, l'action de l'État est soumise au droit. Une arrestation ou une détention
  requiert un motif légal. Cela protège la liberté des personnes contre l'arbitraire.
