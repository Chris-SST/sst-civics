    question_de: Was gilt in einem Rechtsstaat in Bezug auf Verhaftung und Haft?
    options_de:
      a: Der Staat darf niemanden ohne Grund verhaften oder in Haft nehmen.
      b: Der Staat darf Personen nach seinem Ermessen festhalten.
      c: Die Regierung darf ihre Kritiker vorbeugend in Haft nehmen.
      d: Nur Ausländer und Ausländerinnen dürfen ohne Grund verhaftet werden.
    explanation_de: In einem Rechtsstaat unterliegt das Handeln des Staates dem Recht. Eine Verhaftung
      oder eine Haft erfordert einen gesetzlichen Grund. Dies schützt die Freiheit der Personen vor Willkür.
