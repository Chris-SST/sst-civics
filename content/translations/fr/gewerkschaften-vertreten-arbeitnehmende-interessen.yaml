id: gewerkschaften-vertreten-arbeitnehmende-interessen
lang: fr
source_version: 1
question: Quels intérêts les syndicats défendent-ils ?
options:
  a: Les intérêts des employeurs
  b: Les intérêts des communes (Gemeinden)
  c: Les intérêts des banques
  d: Les intérêts des salariés
explanation: Les syndicats défendent les revendications des salariés, par exemple en matière de salaires
  et de conditions de travail. Ils négocient souvent avec les employeurs des conventions collectives de
  travail.
