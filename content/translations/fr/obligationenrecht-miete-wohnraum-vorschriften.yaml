id: obligationenrecht-miete-wohnraum-vorschriften
lang: fr
source_version: 2
question: Dans quelle loi les règles relatives à la location d'un logement sont-elles fixées ?
options:
  a: Dans le Code des obligations
  b: Dans la loi sur le travail
  c: Dans le Code pénal
  d: Dans la loi sur la circulation routière
explanation: Les règles relatives à la location de logements figurent dans le Code des obligations (CO).
  Il y est précisé, par exemple, ce qui s'applique au contrat de bail, quel peut être le montant du loyer
  et comment on peut résilier le bail. Le Code civil (CC), en revanche, règle surtout des thèmes tels
  que la famille, le mariage et la succession.
