    question_de: In welchem Gesetz sind die Regeln zur Miete einer Wohnung festgelegt?
    options_de:
      a: Im Obligationenrecht
      b: Im Arbeitsgesetz
      c: Im Strafgesetzbuch
      d: Im Strassenverkehrsgesetz
    explanation_de: Die Regeln zur Miete von Wohnungen stehen im Obligationenrecht (OR). Dort ist zum
      Beispiel festgehalten, was für den Mietvertrag gilt, wie hoch der Mietzins sein darf und wie man
      den Mietvertrag kündigen kann. Das Zivilgesetzbuch (ZGB) hingegen regelt vor allem Themen wie Familie,
      Ehe und Erbschaft.
