question: Quelle a été la conséquence de l'invasion des troupes françaises en Suisse en 1798 ?
options:
  a: Elle a fait de la Suisse une partie de la France
  b: Elle a renforcé le pouvoir des anciens cantons
  c: Elle a conduit à la fondation de l'État fédéral de 1848
  d: Elle a mis fin à l'ancien ordre de l'ancienne Confédération
explanation: Avec l'occupation par la France, l'ancienne Confédération s'est effondrée. La République
  helvétique, un État unitaire, l'a remplacée. L'État fédéral actuel n'a été créé qu'en 1848.
