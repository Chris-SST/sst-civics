    question_de: Was war die Folge des Einmarschs der französischen Truppen in der Schweiz im Jahr 1798?
    options_de:
      a: Er machte die Schweiz zu einem Teil Frankreichs
      b: Er stärkte die Macht der alten Kantone
      c: Er führte zur Gründung des Bundesstaates von 1848
