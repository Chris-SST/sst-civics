    question_de: Seit welchem Jahr dürfen Frauen in der Schweiz auf Bundesebene abstimmen und wählen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: Im Jahr 1971 haben die Schweizer Männer in einer Volksabstimmung das Frauenstimmrecht
      auf Bundesebene angenommen. Seither können Frauen auf nationaler Ebene abstimmen, wählen und sich
      wählen lassen. Die Kantone haben das Frauenstimmrecht zu unterschiedlichen Zeitpunkten eingeführt,
      einige schon vor 1971, und Appenzell Innerrhoden als letzter Kanton erst 1990.
