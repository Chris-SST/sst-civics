question: Depuis quelle année les femmes peuvent-elles voter et élire au niveau fédéral en Suisse ?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: En 1971, les hommes suisses ont accepté lors d'une votation populaire le droit de vote des
  femmes au niveau fédéral. Depuis lors, les femmes peuvent voter, élire et se faire élire au niveau national.
  Les cantons ont introduit le droit de vote des femmes à des moments différents, certains dès avant 1971,
  et Appenzell Rhodes-Intérieures, dernier canton, seulement en 1990.
