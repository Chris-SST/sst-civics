lang: fr
source_version: 1
question: Qui adopte la plupart des nouvelles lois fédérales ?
options:
  a: Le Tribunal fédéral (Bundesgericht)
  b: Le Conseil fédéral (Bundesrat) seul
  c: Les parlements cantonaux
  d: Le Conseil national (Nationalrat) et le Conseil des États (Ständerat)
explanation: La plupart des nouvelles lois fédérales sont adoptées par les deux chambres du Parlement.
  Le Conseil fédéral prépare les projets, mais il ne décide pas seul. Le peuple peut lancer un référendum
  contre une loi.
