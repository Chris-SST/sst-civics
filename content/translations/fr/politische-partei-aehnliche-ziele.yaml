id: politische-partei-aehnliche-ziele
lang: fr
source_version: 1
question: Qu'est-ce qui décrit le mieux un parti politique ?
options:
  a: Un tribunal qui statue sur des litiges politiques
  b: Un regroupement de personnes poursuivant des objectifs politiques similaires
  c: Un groupe de communes (Gemeinden) qui accomplissent des tâches en commun
  d: Une autorité qui organise les élections et les votations
explanation: Dans un parti, des personnes poursuivant des objectifs politiques similaires s'unissent.
  Lors des élections, les partis présentent des candidates et des candidats et se prononcent sur les objets
  soumis à votation. Ils ne sont pas des autorités étatiques.
