id: informationen-kommunale-angebote-finden
lang: fr
source_version: 2
question: Où trouve-t-on des informations sur les offres et les règles de sa propre commune (Gemeinde)
  ?
options:
  a: Dans la Feuille fédérale de la Confédération
  b: Dans le journal local ou sur le site Internet de la commune
  c: Auprès de l'ambassade du pays d'origine
  d: Auprès du Conseil fédéral (Bundesrat) à Berne
explanation: La commune informe sur ses offres et ses règles surtout dans le journal local et sur son
  site Internet. La Confédération et le Conseil fédéral sont compétents pour les questions nationales,
  et une ambassade étrangère n'est pas du tout compétente pour la commune. L'administration communale
  fournit aussi des renseignements.
