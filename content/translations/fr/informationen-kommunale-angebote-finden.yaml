    question_de: Wo findet man Informationen über die Angebote und Regeln der eigenen Gemeinde?
    options_de:
      a: Im Bundesblatt der Eidgenossenschaft
      b: In der lokalen Zeitung oder auf der Internetseite der Gemeinde
      c: Bei der Botschaft des Herkunftslandes
      d: Beim Bundesrat in Bern
    explanation_de: Die Gemeinde informiert über ihre Angebote und Regeln vor allem in der lokalen Zeitung
      und auf ihrer Internetseite. Der Bund und der Bundesrat sind für nationale Fragen zuständig, und
      eine ausländische Botschaft ist für die Gemeinde überhaupt nicht zuständig. Die Gemeindeverwaltung
      erteilt ebenfalls Auskünfte.
