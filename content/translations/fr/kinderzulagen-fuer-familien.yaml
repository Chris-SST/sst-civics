id: kinderzulagen-fuer-familien
lang: fr
source_version: 1
question: Quelle prestation de l'État les familles avec enfants reçoivent-elles en Suisse ?
options:
  a: Rente d'invalidité
  b: Allocations pour enfants
  c: Prime à l'accession à la propriété du logement
  d: Indemnité journalière de chômage
explanation: Les familles reçoivent des allocations pour enfants en contribution aux frais d'entretien
  des enfants. Elles font partie des allocations familiales, qui sont réglées dans la loi fédérale.
