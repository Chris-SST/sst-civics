id: regelmaessige-wahlen-vertreter-bestimmen
lang: fr
source_version: 1
question: Quelle est l'importance d'élections régulières dans une démocratie ?
options:
  a: La population décide elle-même qui la représente.
  b: Le gouvernement désigne lui-même ses successeurs.
  c: Les partis déterminent entre eux la représentation.
  d: Le tribunal décide qui reprend une fonction.
explanation: Lors des élections, les personnes ayant le droit de vote décident qui les représente au Parlement
  ou au gouvernement. Comme les élections ont lieu régulièrement, elles peuvent confirmer des personnes
  dans leur fonction ou les remplacer par d'autres. Ainsi, la population conserve une influence sur la
  politique.
