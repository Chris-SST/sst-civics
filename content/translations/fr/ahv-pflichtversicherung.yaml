id: ahv-pflichtversicherung
lang: fr
source_version: 1
question: Quelle affirmation concernant l'assurance-vieillesse et survivants (AHV) est correcte ?
options:
  a: L'assurance-vieillesse et survivants fait partie des assurances obligatoires.
  b: L'assurance-vieillesse et survivants est une assurance facultative pour les indépendants.
  c: L'assurance-vieillesse et survivants s'applique uniquement aux personnes titulaires d'un passeport
    suisse.
  d: L'assurance-vieillesse et survivants est une assurance privée des employeurs.
explanation: L'assurance-vieillesse et survivants est obligatoire. Toute personne qui habite ou travaille
  en Suisse y est en principe assurée et doit verser des cotisations.
