id: todesstrafe-verfassung-verboten
lang: fr
source_version: 1
question: Que prévoit la Constitution fédérale pour la peine de mort en Suisse ?
options:
  a: Elle n'est autorisée qu'en cas de meurtre.
  b: Elle n'est autorisée qu'en temps de guerre.
  c: Les cantons décident si elle s'applique.
  d: Elle est interdite.
explanation: La Constitution fédérale protège le droit à la vie à l'article 10. La peine de mort est expressément
  interdite, même pour les crimes graves.
