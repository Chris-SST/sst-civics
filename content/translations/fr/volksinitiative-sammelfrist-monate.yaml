id: volksinitiative-sammelfrist-monate
lang: fr
source_version: 1
question: De combien de temps les auteurs de l'initiative disposent-ils pour récolter les signatures nécessaires
  à une initiative populaire (Volksinitiative) fédérale ?
options:
  a: 6 mois
  b: 12 mois
  c: 18 mois
  d: 36 mois
explanation: Le délai de récolte est de 18 mois à compter de la publication dans la Feuille fédérale.
  Si les initiants ne parviennent pas à réunir les 100 000 signatures nécessaires dans ce délai, l'initiative
  n'aboutit pas.
