question: Qu'est-ce qui fait typiquement partie du carnaval suisse (Fasnacht) ?
options:
  a: Des cortèges dans lesquels les participants portent des masques
  b: La décoration de sapins sur la place du village
  c: Un feu d'artifice à minuit le 1er août
  d: L'allumage de grands cierges dans les églises
explanation: Pendant le carnaval, des groupes défilent dans les rues en cortèges et portent à cette occasion
  des masques et des costumes. Le carnaval de Bâle est un exemple connu de cette coutume.
