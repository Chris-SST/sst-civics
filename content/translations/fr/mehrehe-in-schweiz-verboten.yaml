    question_de: Was gilt in der Schweiz in Bezug auf die Ehe mit mehreren Partnern gleichzeitig?
    options_de:
      a: Sie ist erlaubt, wenn alle betroffenen Personen einverstanden sind
      b: Sie ist verboten
      c: Sie ist erlaubt, wenn sie religiös begründet ist
      d: Sie ist nur für Personen mit einem ausländischen Pass erlaubt
    explanation_de: Die Schweiz kennt nur die monogame Ehe. Eine Person, die bereits verheiratet ist oder
