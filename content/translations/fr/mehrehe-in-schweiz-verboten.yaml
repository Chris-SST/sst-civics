id: mehrehe-in-schweiz-verboten
lang: fr
source_version: 1
question: Que prévaut-il en Suisse concernant le mariage avec plusieurs partenaires en même temps ?
options:
  a: Il est autorisé si toutes les personnes concernées sont d'accord
  b: Il est interdit
  c: Il est autorisé s'il est justifié par des motifs religieux
  d: Il n'est autorisé que pour les personnes titulaires d'un passeport étranger
explanation: La Suisse ne connaît que le mariage monogame. Une personne déjà mariée ou vivant en partenariat
  enregistré ne peut pas conclure un autre mariage. Cela s'applique indépendamment de la religion ou de
  l'origine.
