question: Quelle est approximativement la distance entre le point le plus à l'est et le point le plus
  à l'ouest de la Suisse ?
options:
  a: Environ 250 kilomètres
  b: Environ 350 kilomètres
  c: Environ 550 kilomètres
  d: Environ 150 kilomètres
explanation: La Suisse mesure environ 350 kilomètres d'est en ouest. C'est donc un pays plutôt petit,
  qui est plus long d'est en ouest que du nord au sud.
