id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: fr
source_version: 2
question: Une employée estime que son licenciement est abusif et veut le contester. Quelle instance traite
  ce type de litiges relatifs au contrat de travail ?
options:
  a: L'Office régional de placement (ORP)
  b: Le Service des automobiles
  c: Le tribunal des prud'hommes
  d: L'Office des poursuites
explanation: Le tribunal des prud'hommes est compétent pour les litiges entre employeurs et employés.
  Cela comprend aussi les litiges portant sur un licenciement. L'ORP, en revanche, aide à la recherche
  d'un emploi.
