    question_de: Eine Angestellte ist der Ansicht, dass ihre Kündigung missbräuchlich ist, und möchte
      sie anfechten. Welche Instanz behandelt diese Art von Streitigkeiten im Zusammenhang mit dem Arbeitsvertrag?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungsamt
    explanation_de: Das Arbeitsgericht ist für Streitigkeiten zwischen Arbeitgebern und Angestellten zuständig.
      Dazu gehören auch Streitigkeiten über eine Kündigung. Das RAV hingegen hilft bei der Stellensuche.
