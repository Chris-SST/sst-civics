id: referendum-gesetz-verhindern
lang: fr
source_version: 1
question: Que peuvent obtenir les personnes ayant le droit de vote avec un référendum ?
options:
  a: Elles peuvent rédiger elles-mêmes une nouvelle loi et la mettre en vigueur.
  b: Elles peuvent empêcher une loi adoptée par le Parlement.
  c: Elles peuvent révoquer les membres du Conseil fédéral (Bundesrat).
  d: Elles peuvent dissoudre le Parlement et exiger de nouvelles élections.
explanation: Avec un référendum, les personnes ayant le droit de vote peuvent exiger qu'une loi adoptée
  par le Parlement soit soumise au vote. Si le peuple rejette la loi, celle-ci n'entre pas en vigueur.
