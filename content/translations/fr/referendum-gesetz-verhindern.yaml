    question_de: Was können stimmberechtigte Personen mit einem Referendum erreichen?
    options_de:
      a: Sie können selbst ein neues Gesetz verfassen und in Kraft setzen.
      b: Sie können ein vom Parlament beschlossenes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates abwählen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Mit einem Referendum können die stimmberechtigten Personen verlangen, dass ein vom
      Parlament beschlossenes Gesetz zur Abstimmung gebracht wird. Wenn das Volk das Gesetz ablehnt, tritt
      dieses nicht in Kraft.
