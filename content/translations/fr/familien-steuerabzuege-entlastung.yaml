id: familien-steuerabzuege-entlastung
lang: fr
source_version: 1
question: Comment les familles sont-elles allégées en matière d'impôts ?
options:
  a: Les familles ne paient pas d'impôts.
  b: Les familles peuvent faire valoir des déductions fiscales.
  c: Les familles n'ont pas à remplir de déclaration d'impôt.
  d: Les familles paient uniquement la taxe sur la valeur ajoutée.
explanation: Les familles peuvent par exemple faire valoir des déductions pour les enfants ou pour la
  garde des enfants. Le revenu imposable diminue ainsi, et l'impôt aussi.
