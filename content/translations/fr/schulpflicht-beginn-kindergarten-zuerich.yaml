id: schulpflicht-beginn-kindergarten-zuerich
lang: fr
source_version: 1
question: Par quoi commence la scolarité obligatoire d'un enfant dans le canton de Zurich ?
options:
  a: Par l'entrée à l'école secondaire
  b: Par l'entrée à l'école primaire
  c: Par l'entrée au groupe de jeu
  d: Par l'entrée à l'école enfantine
explanation: Dans le canton de Zurich, l'école enfantine fait partie de l'école obligatoire (Volksschule).
  La scolarité obligatoire commence donc dès l'entrée à l'école enfantine. Le groupe de jeu est facultatif.
