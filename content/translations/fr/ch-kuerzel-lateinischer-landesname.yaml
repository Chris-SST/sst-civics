id: ch-kuerzel-lateinischer-landesname
lang: fr
source_version: 1
question: Que signifie l'abréviation «CH» utilisée pour désigner la Suisse ?
options:
  a: Le nom français Confédération Helvétique
  b: Le terme «Cantons Helvétiques»
  c: Le nom latin Civitas Helvetica
  d: Le nom latin du pays Confoederatio Helvetica
explanation: CH est l'abréviation de Confoederatio Helvetica, le nom latin de la Suisse. Le latin est
  utilisé parce qu'il ne favorise aucune des quatre langues nationales. Cette abréviation figure par exemple
  sur les plaques d'immatriculation des véhicules et dans les adresses Internet.
