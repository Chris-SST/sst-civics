id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: fr
source_version: 1
question: Quel droit fondamental est protégé en Suisse par la Constitution fédérale ?
options:
  a: Le droit à un revenu versé par l'État
  b: Le droit à une voiture
  c: Le droit à un emploi
  d: La liberté de croyance et de conscience
explanation: La liberté de croyance et de conscience figure à l'article 15 de la Constitution fédérale.
  L'État ne peut contraindre personne à adhérer à une croyance. Il n'existe pas de droit fondamental à
  un emploi ou à un revenu.
