    question_de: Welches Grundrecht wird in der Schweiz durch die Bundesverfassung geschützt?
    options_de:
      a: Das Recht auf ein vom Staat bezahltes Einkommen
      b: Das Recht auf ein Auto
      c: Das Recht auf eine Arbeitsstelle
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit steht in Artikel 15 der Bundesverfassung. Der
      Staat kann niemanden zwingen, sich einem Glauben anzuschliessen. Es gibt kein Grundrecht auf eine
      Arbeitsstelle oder auf ein Einkommen.
