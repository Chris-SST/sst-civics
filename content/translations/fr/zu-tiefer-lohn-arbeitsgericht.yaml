    question_de: Eine Angestellte erhält einen ungerechtfertigt zu tiefen Lohn. An welche Instanz kann
      sie sich wenden?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Bundesamt für Statistik
      c: Das Arbeitsgericht
      d: Die Gemeindeversammlung
    explanation_de: Bei einem Streit aus dem Arbeitsverhältnis, zum Beispiel wegen eines zu tiefen Lohns,
