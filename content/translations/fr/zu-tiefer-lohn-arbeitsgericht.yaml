id: zu-tiefer-lohn-arbeitsgericht
lang: fr
source_version: 1
question: Une employée reçoit un salaire injustement trop bas. À quelle instance peut-elle s'adresser
  ?
options:
  a: L'Office régional de placement (ORP)
  b: L'Office fédéral de la statistique
  c: Le tribunal des prud'hommes
  d: L'assemblée communale (Gemeindeversammlung)
explanation: En cas de litige découlant des rapports de travail, par exemple en raison d'un salaire trop
  bas, le tribunal des prud'hommes est compétent. L'ORP aide à la recherche d'emploi et non pour les litiges
  salariaux.
