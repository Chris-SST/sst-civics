question: Que prévoit la loi pour les personnes qui vivent en Suisse en ce qui concerne l'assurance-maladie
  ?
options:
  a: Elles doivent s'assurer uniquement si elles travaillent en Suisse
  b: Elles ont l'obligation légale de conclure une assurance-maladie
  c: Elles doivent s'assurer uniquement si elles ont plus de 50 ans
  d: Elles peuvent décider librement si elles veulent s'assurer ou non
explanation: La loi sur l'assurance-maladie oblige toute personne domiciliée en Suisse à s'assurer contre
  la maladie. Il faut s'assurer dans les trois mois qui suivent la naissance ou l'établissement du domicile.
