id: beschimpfung-wegen-glauben-verboten
lang: fr
source_version: 1
question: Une personne insulte publiquement des gens en raison de leur religion ou de leur origine. Comment
  cela est-il réglementé en Suisse ?
options:
  a: C'est interdit uniquement dans les écoles et les entreprises.
  b: C'est interdit et peut être puni.
  c: C'est interdit uniquement si cela paraît dans le journal.
  d: C'est toujours protégé par la liberté d'expression.
explanation: Le Code pénal interdit le dénigrement public de personnes en raison de leur race, de leur
  appartenance ethnique, de leur religion ou de leur orientation sexuelle. La liberté d'expression n'est
  pas illimitée.
