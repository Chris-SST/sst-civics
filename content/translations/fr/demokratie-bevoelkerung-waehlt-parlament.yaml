    question_de: Welches der Rechte der Bevölkerung besteht in einer Demokratie wie der Schweiz?
    options_de:
      a: Sie bestimmt die Richterinnen und Richter des Bundesgerichts durch Losentscheid.
      b: Sie legt die Gesetze allein fest, ohne das Parlament.
      c: Sie bestimmt ihr Parlament durch Wahlen.
      d: Sie wählt die Armeeführung direkt.
    explanation_de: In einer Demokratie wählt die Bevölkerung ihre Vertreterinnen und Vertreter ins Parlament.
      Auf Ebene des Bundes sind dies der Nationalrat und der Ständerat. Das Parlament verabschiedet danach
      im Namen des Volkes die Bundesgesetze.
