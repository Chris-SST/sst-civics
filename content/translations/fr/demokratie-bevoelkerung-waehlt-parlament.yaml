id: demokratie-bevoelkerung-waehlt-parlament
lang: fr
source_version: 1
question: Parmi les droits de la population, lequel existe dans une démocratie comme la Suisse ?
options:
  a: Elle nomme par tirage au sort les juges du Tribunal fédéral (Bundesgericht).
  b: Elle fixe seule les lois, sans le Parlement.
  c: Elle détermine son Parlement par des élections.
  d: Elle élit directement le commandement de l'armée.
explanation: Dans une démocratie, la population élit ses représentantes et ses représentants au Parlement.
  Au niveau de la Confédération, il s'agit du Conseil national (Nationalrat) et du Conseil des États (Ständerat).
  Le Parlement adopte ensuite les lois fédérales au nom du peuple.
