id: universitaet-zuerich-traegerschaft-kanton
lang: fr
source_version: 1
question: Qui est responsable, dans le canton de Zurich, du fonctionnement et de la tutelle de l'Université
  de Zurich ?
options:
  a: La Confédération
  b: La ville de Zurich
  c: Le canton de Zurich
  d: Les conseils de district du canton
explanation: L'Université de Zurich est une haute école cantonale. Le canton de Zurich en assure la tutelle
  et le fonctionnement. La ville de Zurich et la Confédération n'en sont pas les principales responsables.
