    question_de: Was geschieht beim Morgestraich, dem Beginn der Basler Fasnacht?
    options_de:
      a: Der Stadtpräsident übergibt den Schlüssel der Stadt an die Fasnachtsgesellschaft.
      b: Die Gassen werden hell erleuchtet und ein Feuerwerk beginnt.
      c: Die Lichter der Gassen gehen aus, dann beginnen die Pfeifer und die Trommler zu spielen.
      d: Die Fasnächtler werfen Konfetti vom Turm des Münsters und läuten alle Kirchenglocken.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch um vier Uhr morgens. Die
      Lichter der Gassen werden dann gelöscht. Danach beginnt das Spiel der Pfeifen und der Trommeln.
