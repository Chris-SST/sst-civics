question: Que se passe-t-il lors du Morgestraich, le début du carnaval de Bâle (Basler Fasnacht) ?
options:
  a: Le maire remet la clé de la ville à la société du carnaval.
  b: Les ruelles sont brillamment éclairées et un feu d'artifice commence.
  c: Les lumières des ruelles s'éteignent, puis les fifres et les tambours commencent à jouer.
  d: Les carnavaliers lancent des confettis depuis la tour de la cathédrale et sonnent toutes les cloches
    des églises.
explanation: Le Morgestraich commence le lundi après le mercredi des Cendres, à quatre heures du matin.
  Les lumières des ruelles sont alors éteintes. Ensuite, le jeu des fifres et des tambours commence.
