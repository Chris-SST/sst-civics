question: Que signifie, selon la croyance populaire, le fait que la tête du Böögg brûle rapidement lors
  du Sechseläuten ?
options:
  a: L'été à venir sera pluvieux.
  b: L'hiver à venir sera particulièrement froid.
  c: L'été à venir sera beau.
  d: Les récoltes de l'automne seront mauvaises.
explanation: Le Böögg est un bonhomme de neige en effigie qui est brûlé à Zurich lors du Sechseläuten.
  Selon la croyance populaire, plus sa tête brûle ou explose rapidement, plus l'été à venir sera beau.
