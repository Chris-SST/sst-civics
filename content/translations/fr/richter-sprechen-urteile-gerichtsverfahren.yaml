id: richter-sprechen-urteile-gerichtsverfahren
lang: fr
source_version: 1
question: Qui prononce le jugement dans une procédure judiciaire ?
options:
  a: La juge ou le juge
  b: La policière ou le policier
  c: La présidente ou le président de la commune (Gemeinde)
  d: La procureure ou le procureur
explanation: Les juges décident de manière indépendante dans les procédures judiciaires et rendent le
  jugement. Le ministère public mène l'enquête et porte l'accusation. La police enquête, mais ne rend
  pas de jugement.
