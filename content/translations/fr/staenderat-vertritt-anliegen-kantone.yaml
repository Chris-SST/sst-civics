id: staenderat-vertritt-anliegen-kantone
lang: fr
source_version: 1
question: Quelle chambre du Parlement défend principalement les intérêts des cantons ?
options:
  a: Le Conseil fédéral (Bundesrat)
  b: Le Conseil national (Nationalrat)
  c: Le Conseil des États (Ständerat)
  d: Le Tribunal fédéral (Bundesgericht)
explanation: Le Conseil des États (Ständerat) représente avant tout les cantons. Chaque canton envoie
  des représentantes et des représentants dans cette chambre. Le Conseil national (Nationalrat), en revanche,
  représente le peuple.
