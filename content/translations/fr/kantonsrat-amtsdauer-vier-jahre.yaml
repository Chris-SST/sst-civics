id: kantonsrat-amtsdauer-vier-jahre
lang: fr
source_version: 1
question: Pour combien d'années les membres du Conseil cantonal (Kantonsrat) de Zurich sont-ils élus ?
options:
  a: Pour deux ans
  b: Pour trois ans
  c: Pour six ans
  d: Pour quatre ans
explanation: Les membres du Conseil cantonal de Zurich sont élus pour une législature de quatre ans. Ensuite,
  des élections de renouvellement général ont lieu. Les personnes ayant le droit de vote peuvent alors
  décider à nouveau qui siège au parlement.
