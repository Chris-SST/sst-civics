question: Quel événement de 1815 est important pour la neutralité de la Suisse ?
options:
  a: La Suisse a déclaré la guerre à tous ses États voisins.
  b: Les grandes puissances ont reconnu la neutralité perpétuelle de la Suisse.
  c: La Suisse a adhéré à la Société des Nations.
  d: La Suisse a organisé pour la première fois une votation populaire sur la neutralité.
explanation: Lors du Congrès de Vienne de 1815, les grandes puissances européennes ont reconnu la neutralité
  perpétuelle de la Suisse. Cela a donné à la neutralité une base internationale.
