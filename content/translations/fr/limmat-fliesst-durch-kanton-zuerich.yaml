id: limmat-fliesst-durch-kanton-zuerich
lang: fr
source_version: 1
question: Quelle rivière sort du lac de Zurich, traverse la ville de Zurich et poursuit ensuite son cours
  à travers le territoire du canton ?
options:
  a: La Thur
  b: La Birs
  c: La Reuss
  d: La Limmat
explanation: La Limmat prend naissance à l'exutoire du lac de Zurich et traverse la ville de Zurich ainsi
  que la vallée de la Limmat (Limmattal). Elle quitte ensuite le territoire du canton en direction de
  l'Argovie. La Reuss, la Thur et la Birs ne sortent pas du lac de Zurich.
