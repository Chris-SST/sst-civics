    question_de: Welcher Fluss tritt aus dem Zürichsee aus, durchquert die Stadt Zürich und setzt seinen
      Lauf dann durch das Gebiet des Kantons fort?
    options_de:
      a: Die Thur
      b: Die Birs
      c: Die Reuss
      d: Die Limmat
    explanation_de: Die Limmat entspringt am Abfluss des Zürichsees und durchquert die Stadt Zürich sowie
      das Limmattal. Danach verlässt sie das Gebiet des Kantons in Richtung Aargau. Die Reuss, die Thur
      und die Birs fliessen nicht aus dem Zürichsee.
