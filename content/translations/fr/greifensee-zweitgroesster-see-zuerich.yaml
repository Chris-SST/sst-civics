id: greifensee-zweitgroesster-see-zuerich
lang: fr
source_version: 1
question: Quel lac est, dans le canton de Zurich, le deuxième plus grand après le lac de Zurich ?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: Le Greifensee se situe entre Uster et Dübendorf et, après le lac de Zurich, c'est le deuxième
  plus grand lac du canton. Le Pfäffikersee est plus petit. Le Türlersee et le Katzensee sont encore nettement
  plus petits.
