question: Quelles chaînes de collines se trouvent sur les rives du lac de Zurich ?
options:
  a: Uetliberg, Albis et Pfannenstiel
  b: Lägern, Irchel et Kohlfirst
  c: Hörnli, Bachtel et Allmann
  d: Heitersberg, Gubrist et Randen
explanation: L'Uetliberg et l'Albis s'étendent le long de la rive gauche du lac de Zurich, tandis que
  le Pfannenstiel se trouve sur la rive droite. Les autres hauteurs sont plus éloignées du lac, par exemple
  dans le Unterland, dans le Weinland, dans l'Oberland zurichois ou dans d'autres cantons.
