question: Quelle figure symbolique est représentée sur la pièce de deux francs ?
options:
  a: Le Cervin
  b: Helvetia
  c: Guillaume Tell
  d: Un membre du Conseil fédéral (Bundesrat) suisse
explanation: Sur la pièce suisse de deux francs figure Helvetia, la figure symbolique féminine de la Confédération
  helvétique. Elle représente la Suisse en tant que nation. Helvetia apparaît aussi sur d'autres pièces
  de monnaie et sur des timbres-poste.
