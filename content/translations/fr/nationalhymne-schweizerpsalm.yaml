id: nationalhymne-schweizerpsalm
lang: fr
source_version: 1
question: Comment s'appelle l'hymne national de la Suisse ?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Cantique suisse
explanation: L'hymne national de la Suisse est le Cantique suisse. Le Conseil fédéral (Bundesrat) l'a
  déclaré définitivement hymne national en 1981. Auparavant, on chantait souvent «Rufst du, mein Vaterland».
