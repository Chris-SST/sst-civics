question: Quelle ville est le chef-lieu du canton de Zurich ?
options:
  a: Uster
  b: La ville de Zurich
  c: Winterthour
  d: Dübendorf
explanation: La ville de Zurich est le chef-lieu du canton et porte le même nom. Le Conseil cantonal (Kantonsrat)
  et le Conseil d'État (Regierungsrat) y siègent, entre autres. Winterthour est la deuxième plus grande
  ville du canton.
