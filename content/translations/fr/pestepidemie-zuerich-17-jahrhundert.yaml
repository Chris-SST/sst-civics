id: pestepidemie-zuerich-17-jahrhundert
lang: fr
source_version: 1
question: Quelle catastrophe a coûté la vie à près de la moitié de la population zurichoise au début du
  XVIIe siècle ?
options:
  a: Un incendie de la ville
  b: Une épidémie de peste
  c: Une inondation
  d: Une famine
explanation: Au début du XVIIe siècle, près de la moitié des habitants de Zurich sont morts de la peste.
  La peste était une maladie contagieuse qui s'est alors propagée à plusieurs reprises en Europe.
