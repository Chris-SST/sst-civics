id: auswanderung-19-jahrhundert-grund-not
lang: fr
source_version: 1
question: Au XIXe siècle, de nombreuses personnes ont quitté la Suisse et ont émigré, par exemple en Amérique.
  Quelle en était une raison importante ?
options:
  a: La misère et le manque de travail menaçaient leur existence.
  b: La Confédération leur interdisait de vivre en Suisse.
  c: La Suisse n'avait pas assez de place pour des usines.
  d: À l'étranger, il n'y avait pas d'impôts pour les nouveaux arrivants.
explanation: Au XIXe siècle, la Suisse était encore un pays d'émigration. Les famines, la pauvreté et
  le manque de travail ont poussé de nombreuses personnes à chercher une nouvelle vie à l'étranger. Ce
  n'est que plus tard que la Suisse est devenue un pays d'immigration.
