    question_de: Im 19. Jahrhundert haben viele Menschen die Schweiz verlassen und sind ausgewandert,
      zum Beispiel nach Amerika. Was war ein wichtiger Grund dafür?
    options_de:
      a: Not und Mangel an Arbeit bedrohten ihre Existenz.
      b: Der Bund verbot ihnen, in der Schweiz zu leben.
      c: Die Schweiz hatte nicht genug Platz für Fabriken.
      d: Im Ausland gab es keine Steuern für Neuankömmlinge.
    explanation_de: Im 19. Jahrhundert war die Schweiz noch ein Auswanderungsland. Hungersnöte, Armut
      und Mangel an Arbeit haben viele Menschen dazu gedrängt, im Ausland ein neues Leben zu suchen. Erst
      später ist die Schweiz zu einem Einwanderungsland geworden.
