question: Qui dirige directement une école publique (Volksschule) dans le canton de Zurich ?
options:
  a: Le Conseil cantonal (Kantonsrat)
  b: La direction de l'école
  c: Le conseil des parents
  d: Le Conseil d'État (Regierungsrat)
explanation: Chaque école publique du canton de Zurich dispose d'une direction d'école, qui dirige et
  organise le fonctionnement directement au sein de l'école. Le Conseil d'État et le Conseil cantonal
  travaillent au niveau du canton. Le conseil des parents fait valoir les préoccupations des parents,
  mais ne dirige pas l'école.
