    question_de: Wer leitet im Kanton Zürich direkt eine Volksschule?
    options_de:
      a: Der Kantonsrat
      b: Die Schulleitung
      c: Der Elternrat
      d: Der Regierungsrat
    explanation_de: Jede Volksschule im Kanton Zürich verfügt über eine Schulleitung, die den Betrieb
      direkt in der Schule leitet und organisiert. Der Regierungsrat und der Kantonsrat arbeiten auf der
      Ebene des Kantons. Der Elternrat vertritt die Anliegen der Eltern, leitet die Schule aber nicht.
