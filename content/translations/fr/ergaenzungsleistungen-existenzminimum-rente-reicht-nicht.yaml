question: Qui peut recevoir des prestations complémentaires en Suisse ?
options:
  a: Les personnes qui ont perdu leur emploi et qui perçoivent des indemnités de chômage
  b: Toutes les personnes de plus de 50 ans
  c: Les personnes dont la rente de l'assurance-vieillesse et survivants (AVS) (AHV) ou de l'assurance-invalidité
    (AI) (IV) ne couvre pas le minimum vital
  d: Toutes les personnes qui perçoivent l'aide sociale
explanation: Les prestations complémentaires aident les personnes dont la rente de l'AVS ou de l'AI et
  les autres revenus ne suffisent pas pour vivre. Elles constituent un droit légal et ne sont pas de l'aide
  sociale. Elles sont versées en plus de la rente.
