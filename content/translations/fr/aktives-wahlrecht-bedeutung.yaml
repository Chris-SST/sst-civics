id: aktives-wahlrecht-bedeutung
lang: fr
source_version: 3
question: Que signifie le droit de vote actif ?
options:
  a: Le droit de fonder un parti
  b: Le droit d'être soi-même élu à une fonction
  c: Le droit de déposer des interventions au Parlement
  d: Le droit de participer aux élections et aux votations et d'exprimer sa propre voix
explanation: Les personnes qui ont le droit de vote actif peuvent elles-mêmes voter lors des élections
  et des votations, par exemple lors de l'élection du Conseil national (Nationalrat) ou lors d'une votation
  populaire. Le droit d'être soi-même élu à une fonction s'appelle en revanche le droit de vote passif.
