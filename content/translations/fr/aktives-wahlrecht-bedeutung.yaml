    question_de: Was bedeutet das aktive Stimmrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht, selbst in ein Amt gewählt zu werden
      c: Das Recht, im Parlament Vorstösse einzureichen
      d: Das Recht, an den Wahlen und Abstimmungen teilzunehmen und seine eigene Stimme abzugeben
    explanation_de: Personen, die das aktive Stimmrecht haben, können bei Wahlen und Abstimmungen selbst
      abstimmen, zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht,
      selbst in ein Amt gewählt zu werden, heisst hingegen das passive Stimmrecht.
