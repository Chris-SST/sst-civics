question: Qu'est-ce qui a changé pour la Suisse avec la Constitution fédérale de 1848 ?
options:
  a: Elle est redevenue une confédération d'États lâche
  b: Elle est devenue une monarchie avec un roi
  c: Elle est devenue un État fédéral dans lequel les cantons restent autonomes
  d: Elle est devenue un État unitaire sans cantons
explanation: En 1848 est né l'État fédéral moderne, doté d'institutions communes. Les cantons ont toutefois
  conservé leurs propres tâches et leur propre qualité d'État. Cette répartition marque la Suisse jusqu'à
  aujourd'hui.
