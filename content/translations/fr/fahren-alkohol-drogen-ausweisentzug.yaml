id: fahren-alkohol-drogen-ausweisentzug
lang: fr
source_version: 1
question: Que risque une personne qui conduit une voiture en état d'ébriété ou sous l'influence de drogues
  ?
options:
  a: La perte du droit de vote
  b: L'expulsion de la commune de résidence
  c: La résiliation de l'assurance maladie
  d: Le retrait du permis de conduire
explanation: Une personne qui n'est pas en état de conduire met en danger les autres usagers de la route.
  C'est pourquoi l'autorité peut retirer le permis de conduire. Des amendes ou d'autres sanctions peuvent
  s'y ajouter.
