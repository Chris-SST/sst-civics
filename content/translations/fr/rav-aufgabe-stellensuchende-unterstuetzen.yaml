    question_de: Was ist die Aufgabe des Regionalen Arbeitsvermittlungszentrums (RAV)?
    options_de:
      a: Es kontrolliert die Löhne in den Unternehmen
      b: Es zahlt allen Einwohnern eine Rente aus
