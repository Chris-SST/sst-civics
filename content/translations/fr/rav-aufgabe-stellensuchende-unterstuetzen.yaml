question: Quelle est la mission de l'Office régional de placement (ORP) ?
options:
  a: Il contrôle les salaires dans les entreprises
  b: Il verse une rente à tous les habitants
  c: Il soutient les personnes en recherche d'emploi dans leurs démarches et leur propose des places de
    travail
  d: Il établit des certificats de travail pour les personnes en recherche d'emploi
explanation: L'ORP est le point de contact régional pour les personnes en recherche d'emploi. Il les conseille
  et leur propose des places de travail. Dans le canton de Zurich, il fait partie de l'Office du travail.
