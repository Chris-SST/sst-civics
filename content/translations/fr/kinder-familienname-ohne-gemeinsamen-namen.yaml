id: kinder-familienname-ohne-gemeinsamen-namen
lang: fr
source_version: 1
question: Deux époux n'ont pas choisi de nom de famille commun lors de leur mariage. Qui détermine alors
  le nom de leurs enfants communs ?
options:
  a: Les enfants reçoivent automatiquement le nom du père.
  b: L'office de l'état civil décide selon l'ordre alphabétique des noms.
  c: Les époux choisissent eux-mêmes le nom de leurs enfants.
  d: Les enfants reçoivent automatiquement le nom de la mère.
explanation: Si les époux n'ont pas choisi de nom de famille commun, ils doivent choisir eux-mêmes le
  nom des enfants. La loi ne le fixe pas automatiquement. Les règles figurent dans le Code civil suisse.
