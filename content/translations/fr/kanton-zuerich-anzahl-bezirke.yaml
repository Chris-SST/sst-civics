id: kanton-zuerich-anzahl-bezirke
lang: fr
source_version: 1
question: En combien de districts le canton de Zurich est-il divisé ?
options:
  a: En dix districts
  b: En douze districts
  c: En quatorze districts
  d: En huit districts
explanation: Le canton de Zurich est divisé en douze districts, par exemple Affoltern, Meilen, Winterthour
  et Zurich. Les districts sont des circonscriptions administratives et judiciaires situées entre le canton
  et les communes (Gemeinden).
