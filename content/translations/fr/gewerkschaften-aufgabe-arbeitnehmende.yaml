    question_de: Welche Rolle haben die Gewerkschaften in der Schweiz?
    options_de:
      a: Sie vertreten die Interessen der Arbeitnehmenden.
      b: Sie erteilen den Ausländerinnen und Ausländern die Arbeitsbewilligung.
      c: Sie legen die Steuersätze der Unternehmen fest.
      d: Sie vertreten die Interessen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Die Gewerkschaften sind Organisationen der Arbeitnehmenden. Sie vertreten deren Interessen,
      zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln oft Gesamtarbeitsverträge mit
      den Arbeitgebern aus. Die Arbeitsbewilligungen hingegen werden von den Behörden erteilt und nicht
      von den Gewerkschaften.
