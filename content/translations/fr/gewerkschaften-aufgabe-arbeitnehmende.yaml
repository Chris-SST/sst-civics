question: Quel est le rôle des syndicats en Suisse ?
options:
  a: Ils défendent les intérêts des travailleurs.
  b: Ils délivrent aux étrangères et aux étrangers l'autorisation de travailler.
  c: Ils fixent les taux d'imposition des entreprises.
  d: Ils représentent les intérêts des employeurs auprès de la Confédération.
explanation: Les syndicats sont des organisations de travailleurs. Ils défendent leurs intérêts, par exemple
  en matière de salaires et de conditions de travail, et négocient souvent des conventions collectives
  de travail avec les employeurs. Les autorisations de travail, en revanche, sont délivrées par les autorités,
  et non par les syndicats.
