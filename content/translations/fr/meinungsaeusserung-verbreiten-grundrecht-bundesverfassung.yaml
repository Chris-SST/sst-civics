id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: fr
source_version: 1
question: Quel droit fondamental garanti par la Constitution fédérale permet d'exprimer et de diffuser
  librement son opinion ?
options:
  a: La liberté d'opinion
  b: Le droit de vote
  c: La garantie de la propriété
  d: La liberté d'établissement
explanation: La liberté d'opinion permet d'exprimer et de diffuser librement son opinion. Elle est inscrite
  à l'article 16 de la Constitution fédérale. Le droit de vote concerne en revanche la participation aux
  élections et aux votations.
