id: nationalfeiertag-1-august-bundesweit
lang: fr
source_version: 1
question: Quel jour est un jour férié légal chômé dans toute la Suisse ?
options:
  a: Le 2 janvier (Berchtoldstag)
  b: Le lundi du carnaval (Fasnachtsmontag)
  c: Le Vendredi saint
  d: Le 1er août, la fête nationale
explanation: Le 1er août est la fête nationale et il est considéré comme jour férié dans tout le pays.
  La plupart des autres jours fériés, comme le Vendredi saint ou le Berchtoldstag, sont réglés par les
  cantons eux-mêmes et ne sont pas chômés partout.
