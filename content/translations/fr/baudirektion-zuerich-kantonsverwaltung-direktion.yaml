    question_de: Welche der folgenden Stellen ist eine Direktion der Verwaltung des Kantons Zürich?
    options_de:
      a: Die Direktion der Gemeinden (Gemeindedirektion)
      b: Die Direktion der öffentlichen Bauten (Baudirektion)
      c: Die Direktion der Stadt (Stadtdirektion)
      d: Die Direktion des Bundes (Bundesdirektion)
    explanation_de: Die Direktion der öffentlichen Bauten (Baudirektion) gehört zu den Direktionen der
      Verwaltung des Kantons Zürich. Die Kantonsverwaltung ist in mehrere Direktionen gegliedert, die
      jeweils von einem Mitglied des Regierungsrates geleitet werden.
