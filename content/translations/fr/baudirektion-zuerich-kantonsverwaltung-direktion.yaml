question: Lequel des services suivants est une direction de l'administration du canton de Zurich ?
options:
  a: La direction des communes (Gemeindedirektion)
  b: La direction des travaux publics (Baudirektion)
  c: La direction de la ville (Stadtdirektion)
  d: La direction de la Confédération (Bundesdirektion)
explanation: La direction des travaux publics (Baudirektion) fait partie des directions de l'administration
  du canton de Zurich. L'administration cantonale est divisée en plusieurs directions, dirigées chacune
  par un membre du Conseil d'État (Regierungsrat).
