id: schweiz-staatsform-demokratie
lang: fr
source_version: 1
question: Quelle est la forme d'État de la Suisse ?
options:
  a: C'est une dictature avec un parti unique.
  b: C'est une monarchie avec un roi élu.
  c: C'est un État démocratique.
  d: C'est un État gouverné par une famille noble.
explanation: La Suisse est une démocratie. La population participe aux décisions politiques par les élections
  et les votations. La Constitution fédérale établit cela comme fondement de l'État.
