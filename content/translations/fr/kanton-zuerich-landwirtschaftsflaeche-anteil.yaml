question: Quelle est approximativement la part de la superficie du canton de Zurich qui est utilisée à
  des fins agricoles ?
options:
  a: Environ 68 pour cent
  b: Environ 25 pour cent
  c: Environ 11 pour cent
  d: Environ 41 pour cent
explanation: Environ 41 pour cent de la superficie du canton de Zurich est consacrée à l'agriculture.
  Le reste est constitué surtout de forêts, de surfaces d'habitation et de plans d'eau.
