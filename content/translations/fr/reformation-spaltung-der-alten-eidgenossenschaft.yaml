question: Quelle a été la conséquence de la Réforme pour la Suisse ?
options:
  a: La Suisse était divisée sur le plan religieux en une partie réformée et une partie catholique.
  b: La Suisse est devenue une partie de l'Empire allemand.
  c: L'Église a perdu partout toute influence sur la politique.
  d: Tous les cantons de la Confédération sont devenus réformés.
explanation: Certains cantons ont adopté la Réforme, d'autres sont restés catholiques. Il en a résulté
  une opposition religieuse qui a longtemps pesé sur la Confédération. Des conflits ont également éclaté
  entre les confessions.
