id: alfred-escher-eth-eisenbahn-bank
lang: fr
source_version: 2
question: Pour quoi le politicien et entrepreneur zurichois Alfred Escher est-il connu ?
options:
  a: Il a dirigé les troupes suisses pendant la guerre du Sonderbund.
  b: Il a rédigé à lui seul la première Constitution fédérale.
  c: Il a fondé la Croix-Rouge à Genève.
  d: Il a soutenu l'EPF et la construction des chemins de fer, et il a fondé la banque qui est devenue
    le Credit Suisse.
explanation: Au XIXe siècle, Alfred Escher s'est engagé pour la création de l'École polytechnique fédérale
  de Zurich (ETH Zürich) et pour la construction de chemins de fer, en particulier la ligne du Gothard.
  En 1856, il a fondé la Schweizerische Kreditanstalt, qui est devenue plus tard le Credit Suisse. Cette
  banque a été reprise par UBS en 2023.
