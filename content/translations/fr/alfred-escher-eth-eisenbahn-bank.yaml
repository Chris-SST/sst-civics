    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er hat die Schweizer Truppen im Sonderbundskrieg angeführt.
      b: Er hat die erste Bundesverfassung allein verfasst.
      c: Er hat das Rote Kreuz in Genf gegründet.
      d: Er hat die ETH und den Eisenbahnbau unterstützt und die Bank gegründet, aus der die Credit Suisse
        geworden ist.
    explanation_de: Im 19. Jahrhundert setzte sich Alfred Escher für die Gründung der Eidgenössischen
      Technischen Hochschule Zürich (ETH Zürich) und für den Bau von Eisenbahnen ein, insbesondere der
      Gotthardlinie. 1856 gründete er die Schweizerische Kreditanstalt, die später zur Credit Suisse wurde.
      Diese Bank wurde 2023 von der UBS übernommen.
