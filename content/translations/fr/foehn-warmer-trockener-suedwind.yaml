question: Qu'est-ce que le foehn ?
options:
  a: Un vent froid et humide venant du nord
  b: Un vent froid venant de l'est en hiver
  c: Une forte pluie au printemps
  d: Un vent chaud et sec venant du sud
explanation: Le foehn est un vent descendant chaud et sec qui souffle dans les Alpes surtout depuis le
  sud. Il peut faire monter rapidement les températures et rendre la visibilité très bonne.
