    question_de: Was bietet die Gemeinde an, wenn das Einkommen und das Vermögen einer Person nicht zum
      Leben ausreichen?
    options_de:
      a: Die Sozialhilfe
      b: Eine Baubewilligung
      c: Eine Einbürgerung
      d: Ein Stipendium für die obligatorische Schule
    explanation_de: Wer seinen Lebensunterhalt nicht mit den eigenen Mitteln sichern kann, hat Anspruch
      auf Unterstützung durch die Sozialhilfe. Diese wird von der Gemeinde erbracht, in der die Person
      wohnt. Sie bildet das letzte Netz der sozialen Sicherheit.
