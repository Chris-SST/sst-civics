id: sozialhilfe-bei-ungenuegendem-einkommen
lang: fr
source_version: 1
question: Que propose la commune (Gemeinde) lorsque le revenu et la fortune d'une personne ne suffisent
  pas pour vivre ?
options:
  a: L'aide sociale
  b: Un permis de construire
  c: Une naturalisation
  d: Une bourse d'études de l'école obligatoire
explanation: Celui ou celle qui ne peut pas assurer son entretien avec ses propres moyens a droit à un
  soutien de l'aide sociale. Celle-ci est fournie par la commune dans laquelle la personne habite. Elle
  constitue le dernier filet de la sécurité sociale.
