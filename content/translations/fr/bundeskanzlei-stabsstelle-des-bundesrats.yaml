id: bundeskanzlei-stabsstelle-des-bundesrats
lang: fr
source_version: 1
question: Quelle est la tâche de la Chancellerie fédérale (Bundeskanzlei) pour le Conseil fédéral (Bundesrat)
  ?
options:
  a: Elle est l'état-major du Conseil fédéral.
  b: Elle examine les décisions du Conseil fédéral en tant que tribunal.
  c: Elle dirige le Département des finances.
  d: Elle élit les membres du Conseil fédéral.
explanation: La Chancellerie fédérale soutient le Conseil fédéral dans son travail, par exemple dans la
  préparation des séances. Elle est placée sous la direction de la chancelière ou du chancelier de la
  Confédération. Le Conseil fédéral est élu par l'Assemblée fédérale (Bundesversammlung).
