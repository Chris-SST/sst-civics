question: En quelle année le canton de Zurich a-t-il vu le jour sous sa forme actuelle ?
options:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
explanation: Le canton de Zurich a été créé sous sa forme actuelle en 1803 avec l'Acte de médiation. Le
  jubilé a été célébré en 2003 sous le titre « 200 ans du canton de Zurich ». C'est en 1848 que l'État
  fédéral actuel est né.
