    question_de: Wer vertritt eine kleine Zürcher Gemeinde nach aussen?
    options_de:
      a: die Gemeindepräsidentin oder der Gemeindepräsident
      b: die Bezirksrätin oder der Bezirksrat
      c: die Gemeindeschreiberin oder der Gemeindeschreiber
      d: die Schulleiterin oder der Schulleiter
    explanation_de: In den kleinen Zürcher Gemeinden vertritt die Gemeindepräsidentin oder der Gemeindepräsident
      die Gemeinde nach aussen. Sie oder er leitet den Gemeinderat. In der Stadt Zürich wird diese Rolle
      von der Stadtpräsidentin oder vom Stadtpräsidenten übernommen.
