lang: fr
source_version: 1
question: Qui représente vers l'extérieur une petite commune (Gemeinde) zurichoise ?
options:
  a: la présidente ou le président de la commune
  b: la conseillère ou le conseiller de district
  c: la secrétaire communale ou le secrétaire communal
  d: la directrice ou le directeur d'école
explanation: Dans les petites communes zurichoises, la présidente ou le président de la commune représente
  la commune vers l'extérieur. Elle ou il dirige le conseil communal (Gemeinderat). Dans la ville de Zurich,
  ce rôle est assumé par la présidente ou le président de la ville.
