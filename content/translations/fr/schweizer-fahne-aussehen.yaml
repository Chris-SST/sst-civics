question: À quoi ressemble le drapeau suisse ?
options:
  a: Une croix blanche isolée sur un carré rouge
  b: Une croix blanche sur fond rouge avec un blason au centre
  c: Une croix blanche qui s'étend jusqu'au bord du rectangle rouge
  d: Une croix rouge isolée sur un carré blanc
explanation: Le drapeau suisse est carré. Il montre une croix blanche sur fond rouge, dont les bras ne
  touchent pas le bord. Avec le drapeau du Vatican, c'est l'un des deux drapeaux nationaux carrés.
