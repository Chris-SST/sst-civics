    question_de: Wie sieht die Schweizer Flagge aus?
    options_de:
      a: Ein freistehendes weisses Kreuz auf einem roten Quadrat
      b: Ein weisses Kreuz auf rotem Grund mit einem Wappen in der Mitte
      c: Ein weisses Kreuz, das sich bis zum Rand des roten Rechtecks erstreckt
      d: Ein freistehendes rotes Kreuz auf einem weissen Quadrat
