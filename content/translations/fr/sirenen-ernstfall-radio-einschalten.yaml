    question_de: Im Notfall lassen die Sirenen den «Allgemeinen Alarm» ertönen (ein heulender, an- und
      abschwellender Ton). Was müssen Sie tun?
    options_de:
      a: Sofort das Haus verlassen
      b: Die Feuerwehr anrufen
      c: Radio hören und den Anweisungen der Behörden folgen
      d: Mit dem Auto wegfahren
    explanation_de: Beim Allgemeinen Alarm informieren die Behörden über das Radio darüber, was zu tun
