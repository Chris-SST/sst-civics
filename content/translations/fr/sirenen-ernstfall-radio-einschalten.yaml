id: sirenen-ernstfall-radio-einschalten
lang: fr
source_version: 2
question: En cas d'urgence, les sirènes font retentir l'« Alarme générale » (un son hurlant, montant et
  descendant). Que devez-vous faire ?
options:
  a: Quitter immédiatement la maison
  b: Appeler les pompiers
  c: Écouter la radio et suivre les instructions des autorités
  d: Partir en voiture
explanation: Lors de l'alarme générale, les autorités informent par la radio de ce qu'il faut faire. Des
  informations sont aussi disponibles dans l'application Alertswiss. Il faut suivre les instructions et
  ne pas appeler inutilement les numéros d'urgence, afin qu'ils restent libres pour les véritables urgences.
