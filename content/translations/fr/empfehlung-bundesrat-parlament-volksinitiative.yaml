id: empfehlung-bundesrat-parlament-volksinitiative
lang: fr
source_version: 1
question: Qui donne aux personnes ayant le droit de vote, avant le scrutin sur une initiative populaire
  (Volksinitiative) fédérale, une recommandation d'accepter ou de rejeter l'initiative ?
options:
  a: Le Conseil fédéral (Bundesrat) et le Parlement
  b: Les gouvernements cantonaux
  c: La Chancellerie fédérale (Bundeskanzlei) seule
  d: Le Tribunal fédéral (Bundesgericht)
explanation: Lorsqu'une initiative populaire a abouti, le Conseil fédéral et le Parlement prennent position
  à son sujet. Le Parlement recommande aux personnes ayant le droit de vote d'accepter ou de rejeter l'initiative.
  Cette recommandation figure aussi dans les explications du Conseil fédéral relatives au scrutin, que
  les personnes ayant le droit de vote reçoivent avant la votation.
