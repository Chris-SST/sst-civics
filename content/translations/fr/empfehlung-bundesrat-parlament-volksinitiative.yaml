    question_de: Wer gibt den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative
      eine Empfehlung, die Initiative anzunehmen oder abzulehnen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Kantonsregierungen
      c: Die Bundeskanzlei allein
      d: Das Bundesgericht
    explanation_de: Wenn eine Volksinitiative zustande gekommen ist, nehmen der Bundesrat und das Parlament
      dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten, die Initiative anzunehmen oder abzulehnen.
      Diese Empfehlung steht auch in den Erläuterungen des Bundesrates zur Abstimmung, die die Stimmberechtigten
      vor der Abstimmung erhalten.
