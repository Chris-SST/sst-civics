question: À quelle date tombe la fête nationale suisse, le jour férié national de la Suisse ?
options:
  a: Le 1er août
  b: Le 26 décembre
  c: Le 11 novembre
  d: Le 1er mai
explanation: La fête nationale de la Suisse a lieu le 1er août. On commémore à cette occasion le Pacte
  fédéral de 1291. Dans de nombreux endroits, les festivités comprennent des feux d'artifice, des feux
  de joie en altitude et des discours.
