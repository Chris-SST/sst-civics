    question_de: Die Schweiz ist in drei staatliche Ebenen gegliedert. Welche Ebene ist die höchste?
    options_de:
      a: Die Gemeinden
      b: Der Bund
      c: Die Kantone
      d: Die Bezirke
    explanation_de: Der Bund ist die höchste der drei staatlichen Ebenen. Danach folgen die Kantone, dann
      die Gemeinden. Die Bezirke bilden keine eigenständige staatliche Ebene; in einigen Kantonen sind
      sie nur Verwaltungseinheiten innerhalb des Kantons.
