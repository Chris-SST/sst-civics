question: La Suisse est organisée en trois niveaux étatiques. Quel niveau est le plus élevé ?
options:
  a: Les communes (Gemeinden)
  b: La Confédération
  c: Les cantons
  d: Les districts
explanation: La Confédération est le niveau le plus élevé des trois niveaux étatiques. Viennent ensuite
  les cantons, puis les communes. Les districts ne constituent pas un niveau étatique à part entière ;
  dans certains cantons, ce ne sont que des unités administratives au sein du canton.
