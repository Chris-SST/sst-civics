question: En quelles trois grandes régions paysagères la Suisse se divise-t-elle géographiquement ?
options:
  a: Le Jura, le Plateau et les Alpes
  b: Le Jura, le lac de Constance et les Alpes
  c: La Forêt-Noire, le Plateau et les Alpes
  d: Le Plateau, les Préalpes et le Tessin
explanation: Le Jura se situe au nord-ouest, et les Alpes occupent la plus grande partie de la superficie.
  Entre les deux se trouve le Plateau, où vit la majorité de la population.
