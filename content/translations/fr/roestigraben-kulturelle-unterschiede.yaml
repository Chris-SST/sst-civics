question: Que désigne-t-on en Suisse par le terme «Röstigraben» ?
options:
  a: Les Alpes comme ligne de séparation entre le nord et le sud
  b: Les différences entre la ville et la campagne
  c: La frontière entre la Suisse et l'Allemagne
  d: Les différences culturelles entre la Suisse alémanique et la Romandie
explanation: Le terme «Röstigraben» est une expression imagée. Il décrit les différences culturelles entre
  la Suisse alémanique et la Romandie, de langue française. Celles-ci se manifestent par exemple parfois
  lors des votations.
