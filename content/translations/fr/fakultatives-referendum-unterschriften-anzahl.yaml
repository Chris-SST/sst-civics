question: Combien de signatures faut-il pour un référendum facultatif contre une loi fédérale ?
options:
  a: 200 000 signatures
  b: 30 000 signatures
  c: 50 000 signatures
  d: 100 000 signatures
explanation: Pour un référendum facultatif, il faut 50 000 signatures valables de personnes ayant le droit
  de vote. Elles doivent être récoltées dans les 100 jours suivant la publication de la loi.
