id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: fr
source_version: 1
question: Parmi ces impôts, lequel le canton de Zurich et les communes (Gemeinden) prélèvent-ils sur le
  patrimoine d'une personne, par exemple sur les avoirs bancaires et les titres ?
options:
  a: L'impôt anticipé
  b: La taxe sur la valeur ajoutée
  c: L'impôt sur la fortune
  d: L'impôt sur les huiles minérales
explanation: Le canton et les communes imposent la fortune des personnes physiques. La taxe sur la valeur
  ajoutée, l'impôt anticipé et l'impôt sur les huiles minérales sont des impôts de la Confédération.
