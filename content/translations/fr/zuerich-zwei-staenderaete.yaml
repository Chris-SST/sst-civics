question: Combien de représentantes et représentants le canton de Zurich envoie-t-il au Conseil des États
  (Ständerat) ?
options:
  a: Une représentation
  b: Quatre représentations
  c: Six représentations
  d: Deux représentations
explanation: Le canton de Zurich est un canton entier et dispose de deux sièges au Conseil des États.
  Les conseillères et conseillers aux États sont élus par le corps électoral du canton. Seuls les demi-cantons
  ont chacun une seule représentation.
