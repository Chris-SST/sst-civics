id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: fr
source_version: 1
question: De quoi la Suisse est-elle composée en tant qu'État fédéral ?
options:
  a: De districts en tant qu'États membres
  b: De régions linguistiques en tant qu'États membres
  c: De cantons en tant qu'États membres
  d: De régions en tant qu'États membres
explanation: La Suisse est un État fédéral. Les cantons en sont les États membres et disposent de leur
  propre constitution, de leur propre parlement et de leur propre gouvernement. Les districts et les régions
  ne sont pas des États membres.
