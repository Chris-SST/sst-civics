id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: fr
source_version: 1
question: Qui décide définitivement, au niveau fédéral, lors d'une votation si une initiative populaire
  (Volksinitiative) ou un référendum est accepté ?
options:
  a: L'Assemblée fédérale (Bundesversammlung) réunie en séance commune des deux chambres
  b: Le Conseil fédéral (Bundesrat) après consultation des gouvernements cantonaux
  c: Le Tribunal fédéral (Bundesgericht) après un examen juridique du projet
  d: Les électeurs, qui votent aux urnes ou par correspondance
explanation: Pour les initiatives populaires et les référendums, les électeurs ont le dernier mot. Ils
  décident lors de la votation populaire aux urnes, qui est aussi possible par correspondance en Suisse.
  Le Conseil fédéral, le Parlement et le Tribunal fédéral ne peuvent pas remplacer le résultat.
