id: aussenbeziehungen-zustaendigkeit-bund
lang: fr
source_version: 1
question: Qui est en principe responsable, en Suisse, de gérer les relations avec les autres États ?
options:
  a: La Conférence des gouvernements cantonaux
  b: La Confédération
  c: Les cantons ensemble
  d: Les communes (Gemeinden) situées à la frontière
explanation: Selon la Constitution fédérale, la politique étrangère relève de la Confédération. Les cantons
  peuvent coopérer avec l'étranger dans leurs propres domaines de compétence, mais la responsabilité d'ensemble
  incombe à la Confédération.
