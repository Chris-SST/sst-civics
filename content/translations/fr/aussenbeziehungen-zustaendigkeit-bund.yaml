    question_de: Wer ist in der Schweiz grundsätzlich dafür zuständig, die Beziehungen zu den anderen
      Staaten zu führen?
    options_de:
      a: Die Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone gemeinsam
      d: Die Gemeinden, die an der Grenze liegen
    explanation_de: Nach der Bundesverfassung ist die Aussenpolitik Sache des Bundes. Die Kantone können
      in ihren eigenen Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, aber die Gesamtverantwortung
      liegt beim Bund.
