id: medien-vierte-staatsgewalt
lang: fr
source_version: 1
question: Les médias sont souvent désignés par une expression particulière qui décrit leur rôle dans l'État.
  De quelle expression s'agit-il ?
options:
  a: Deuxième pouvoir de l'État
  b: Pouvoir suprême de l'État
  c: Premier pouvoir de l'État
  d: Quatrième pouvoir de l'État
explanation: Les trois pouvoirs de l'État sont le pouvoir législatif, le pouvoir exécutif et le pouvoir
  judiciaire. Les médias n'en font pas partie, mais ils contrôlent la politique et informent la population.
  C'est pourquoi on les appelle souvent le quatrième pouvoir.
