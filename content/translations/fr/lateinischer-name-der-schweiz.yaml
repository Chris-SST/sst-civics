question: Comment s'appelle la Confédération suisse en latin ?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: En latin, la Suisse s'appelle Confoederatio Helvetica. C'est de là que vient l'abréviation
  CH, que l'on voit par exemple sur les plaques d'immatriculation des voitures et dans les adresses Internet
  (.ch). On utilise le nom latin parce qu'il est neutre et ne favorise aucune des quatre langues nationales.
