    question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz übertreten hat?
    options_de:
      a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
      b: Der Staat verfolgt und bestraft die Tat; Selbstjustiz ist verboten.
      c: Das Opfer kann die Strafe selbst festlegen und vollstrecken.
      d: Die Familie des Opfers kann den Täter oder die Täterin der Tat selbst bestrafen.
    explanation_de: In der Schweiz hat nur der Staat das Recht, Straftaten zu verfolgen und zu bestrafen.
      Die Polizei, die Staatsanwaltschaft und die Gerichte sind damit beauftragt. Wer sich selbst rächt,
      auch als Opfer oder als Familie des Opfers, kann sich dann selbst strafbar machen.
