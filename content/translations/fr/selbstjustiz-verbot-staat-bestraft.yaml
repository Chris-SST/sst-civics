question: Que prévaut-il en Suisse lorsque quelqu'un a enfreint une loi ?
options:
  a: Le voisinage décide collectivement de la sanction.
  b: L'État poursuit et sanctionne l'acte ; la justice privée est interdite.
  c: La victime peut elle-même fixer et exécuter la sanction.
  d: La famille de la victime peut elle-même punir l'auteur ou l'autrice de l'acte.
explanation: En Suisse, seul l'État a le droit de poursuivre et de punir les infractions. La police, le
  ministère public et les tribunaux en sont chargés. Celui qui se venge lui-même, même en tant que victime
  ou en tant que famille de la victime, peut alors se rendre lui-même punissable.
