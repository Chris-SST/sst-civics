question: À quelle grande région géographique de la Suisse le canton de Zurich appartient-il ?
options:
  a: Aux Alpes du Sud
  b: Au Jura
  c: au Plateau suisse
  d: Aux Alpes centrales
explanation: Le canton de Zurich appartient au Plateau suisse, c'est-à-dire à la zone plus plate située
  entre le Jura au nord-ouest et les Alpes au sud. Le Plateau suisse est la partie la plus densément peuplée
  de la Suisse.
