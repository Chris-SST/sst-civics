question: Comment appelle-t-on le gouvernement du canton de Zurich ?
options:
  a: Obergericht (tribunal supérieur)
  b: Conseil cantonal (Kantonsrat)
  c: Conseil fédéral (Bundesrat)
  d: Conseil d'État (Regierungsrat)
