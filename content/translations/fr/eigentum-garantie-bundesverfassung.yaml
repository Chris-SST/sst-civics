id: eigentum-garantie-bundesverfassung
lang: fr
source_version: 1
question: Quel droit fondamental protège en Suisse les maisons, les terrains et les autres biens patrimoniaux
  des particuliers ?
options:
  a: La garantie de la propriété
  b: La liberté de croyance et de conscience
  c: La liberté d'établissement
  d: La liberté de réunion
explanation: La Constitution fédérale garantit la propriété à l'article 26. L'État ne peut restreindre
  la propriété qu'à certaines conditions, par exemple avec une base légale et une pleine indemnité en
  cas d'expropriation.
