id: auslaender-kein-stimmrecht-national
lang: fr
source_version: 1
question: Les étrangères et les étrangers qui vivent en Suisse depuis des années peuvent-ils participer
  aux votations fédérales ?
options:
  a: Oui, mais seulement aux votations et non aux élections.
  b: Oui, s'ils ont une autorisation d'établissement (permis C) (Niederlassungsbewilligung).
  c: Oui, s'ils paient des impôts.
  d: Non, au niveau national, ils n'ont pas le droit de vote.
explanation: Le droit de vote au niveau national est lié au droit de cité (Bürgerrecht) suisse. Les étrangères
  et les étrangers ne peuvent l'exercer qu'après une naturalisation.
