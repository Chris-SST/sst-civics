    source_version: 1
    question_de: Können Ausländerinnen und Ausländer, die seit Jahren in der Schweiz leben, an eidgenössischen
      Abstimmungen teilnehmen?
    options_de:
      a: Ja, aber nur an Abstimmungen und nicht an Wahlen.
      b: Ja, wenn sie eine Niederlassungsbewilligung (Ausweis C) haben.
      c: Ja, wenn sie Steuern zahlen.
      d: Nein, auf nationaler Ebene haben sie kein Stimmrecht.
    explanation_de: Das Stimmrecht auf nationaler Ebene ist an das Schweizer Bürgerrecht gebunden. Ausländerinnen
      und Ausländer können es erst nach einer Einbürgerung ausüben.
