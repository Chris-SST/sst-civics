id: agrargesellschaft-zum-industrieland-19-jahrhundert
lang: fr
source_version: 1
question: Comment l'économie de la Suisse a-t-elle évolué au XIXe siècle ?
options:
  a: Elle vivait surtout du commerce avec les colonies.
  b: Elle est restée jusqu'en 1900 presque exclusivement un pays de paysans.
  c: Elle est passée d'un pays industriel à une société agricole.
  d: Elle est passée d'une société agricole à un pays industriel.
explanation: Au XIXe siècle, le travail s'est déplacé de l'agriculture vers les usines. De nouvelles voies
  de communication, comme le chemin de fer, ont soutenu ce changement. Ainsi, le pays agricole est devenu
  un pays industriel.
