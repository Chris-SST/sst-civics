question: Quelle invention a fortement marqué l'industrialisation en Suisse au XIXe siècle ?
options:
  a: L'avion
  b: La machine à vapeur
  c: L'ordinateur
  d: Le travail à la chaîne
explanation: Au XIXe siècle, la machine à vapeur est devenue importante en Suisse. Elle faisait fonctionner
  les machines dans les fabriques et, plus tard, aussi les chemins de fer, et de plus en plus de personnes
  travaillaient en fabrique. L'avion, le travail à la chaîne et l'ordinateur ne sont devenus importants
  qu'au XXe siècle.
