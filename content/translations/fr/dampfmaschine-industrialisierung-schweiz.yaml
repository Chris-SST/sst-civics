    question_de: Welche Erfindung hat die Industrialisierung in der Schweiz im 19. Jahrhundert stark geprägt?
    options_de:
      a: Das Flugzeug
      b: Die Dampfmaschine
      c: Der Computer
      d: Die Fliessbandarbeit
    explanation_de: Im 19. Jahrhundert wurde die Dampfmaschine in der Schweiz wichtig. Sie betrieb die
      Maschinen in den Fabriken und später auch die Eisenbahnen, und immer mehr Menschen arbeiteten in
      der Fabrik. Das Flugzeug, die Fliessbandarbeit und der Computer wurden erst im 20. Jahrhundert wichtig.
