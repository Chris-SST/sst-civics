id: stellenabsage-wegen-hautfarbe-geschlecht
lang: fr
source_version: 2
question: Une femme postule à un emploi. Sa candidature est refusée uniquement parce qu'elle est une femme.
  Quel droit fondamental est ainsi violé ?
options:
  a: La liberté d'établissement
  b: La liberté de réunion
  c: L'égalité devant la loi et l'interdiction de la discrimination
  d: La protection de la sphère privée
explanation: L'article 8 de la Constitution fédérale dispose que tous les êtres humains sont égaux devant
  la loi et que l'homme et la femme sont égaux en droits. Nul ne doit subir de discrimination, par exemple
  du fait de son origine, de sa race ou de son sexe. Celui qui refuse une candidate uniquement en raison
  de son sexe viole donc l'égalité devant la loi et l'interdiction de la discrimination.
