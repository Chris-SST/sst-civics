id: nutzungsplanung-ortsebene-gemeinden
lang: fr
source_version: 1
question: Qui planifie, dans le canton de Zurich, au niveau local, la manière dont le sol est utilisé,
  par exemple où se trouvent les zones d'habitation et les zones d'activités économiques ?
options:
  a: L'Assemblée fédérale (Bundesversammlung) suisse
  b: La police cantonale
  c: Les communes (Gemeinden)
  d: Les conseils de district seuls
explanation: Les communes établissent la planification de l'utilisation du sol pour leur territoire, par
  exemple le règlement sur les constructions et les zones. Ce faisant, elles respectent les prescriptions
  de la Confédération et du canton. Elles participent ainsi à décider de la manière dont la localité se
  développe.
