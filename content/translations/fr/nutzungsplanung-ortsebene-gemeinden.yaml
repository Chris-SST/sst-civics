    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie der Boden genutzt wird, zum Beispiel
      wo sich die Wohnzonen und die Wirtschaftszonen befinden?
    options_de:
      a: Die Schweizerische Bundesversammlung
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Die Bezirksräte allein
    explanation_de: Die Gemeinden erstellen die Planung der Bodennutzung für ihr Gebiet, zum Beispiel
      die Bau- und Zonenordnung. Dabei halten sie die Vorschriften des Bundes und des Kantons ein. So
      wirken sie mit, wie sich der Ort entwickelt.
