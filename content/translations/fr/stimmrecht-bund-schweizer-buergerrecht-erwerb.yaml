    question_de: Ab welchem Zeitpunkt erhält eine aus dem Ausland stammende Person das Stimm- und Wahlrecht
      auf Bundesebene?
    options_de:
      a: Sobald sie zehn Jahre in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (Ausweis C) erhält.
      c: Sobald sie in der Schweiz Steuern zahlt und arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht besitzt und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Bundesebene ist an das Schweizer Bürgerrecht gebunden.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Zahlen von Steuern genügen
      nicht, um es zu erhalten. Jede Person, die eingebürgert wird und volljährig ist, kann an den eidgenössischen
      Wahlen und Abstimmungen teilnehmen.
