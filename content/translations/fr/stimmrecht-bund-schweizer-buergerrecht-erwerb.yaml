question: À partir de quel moment une personne venue de l'étranger obtient-elle le droit de vote et d'éligibilité
  au niveau de la Confédération ?
options:
  a: Dès qu'elle a vécu pendant dix ans en Suisse.
  b: Dès qu'elle obtient une autorisation d'établissement (permis C).
  c: Dès qu'elle paie des impôts et travaille en Suisse.
  d: Dès qu'elle possède le droit de cité suisse (Bürgerrecht) et qu'elle est majeure.
explanation: Le droit de vote et d'éligibilité au niveau de la Confédération est lié au droit de cité
  suisse. Une autorisation d'établissement, une certaine durée de séjour ou le paiement d'impôts ne suffisent
  pas pour l'obtenir. Toute personne qui est naturalisée et qui est majeure peut participer aux élections
  et aux votations fédérales.
