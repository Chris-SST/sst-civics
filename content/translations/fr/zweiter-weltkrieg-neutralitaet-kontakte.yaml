question: Comment la Suisse s'est-elle comportée pendant la Seconde Guerre mondiale ?
options:
  a: Elle a rompu tous les contacts avec les parties au conflit et a complètement fermé ses frontières.
  b: Elle s'est alliée à l'Allemagne et lui a fourni des troupes.
  c: Elle est restée neutre et a entretenu des contacts politiques et économiques avec les parties au
    conflit.
  d: Elle a rejoint l'alliance des Alliés et a combattu à leurs côtés.
explanation: Pendant la Seconde Guerre mondiale, la Suisse n'est pas devenue partie au conflit. Elle a
  toutefois maintenu des contacts politiques et économiques avec les parties au conflit. Cette attitude
  fait encore l'objet de discussions historiques aujourd'hui.
