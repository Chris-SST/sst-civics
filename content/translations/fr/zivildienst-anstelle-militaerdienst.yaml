id: zivildienst-anstelle-militaerdienst
lang: fr
source_version: 3
question: Quel est le lien entre le service civil (Zivildienst) et le service militaire en Suisse ?
options:
  a: Seules les femmes peuvent accomplir le service civil.
  b: Les personnes qui accomplissent le service civil n'ont pas d'impôts à payer.
  c: Le service civil doit être accompli en plus du service militaire.
  d: Le service civil peut être accompli à la place du service militaire.
explanation: Le service civil est un service de remplacement civil du service militaire. Il est destiné
  aux personnes aptes au service militaire qui ne peuvent pas concilier le service militaire avec leur
  conscience. Pour cela, il faut déposer une demande, et le service civil dure plus longtemps que le service
  militaire.
