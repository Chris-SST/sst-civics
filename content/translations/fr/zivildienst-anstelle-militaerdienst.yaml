    question_de: Welcher Zusammenhang besteht in der Schweiz zwischen dem Zivildienst und dem Militärdienst?
    options_de:
      a: Nur Frauen können Zivildienst leisten.
      b: Personen, die Zivildienst leisten, müssen keine Steuern bezahlen.
      c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
      d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
    explanation_de: Der Zivildienst ist ein ziviler Ersatzdienst für den Militärdienst. Er ist für militärdiensttaugliche
      Personen bestimmt, die den Militärdienst nicht mit ihrem Gewissen vereinbaren können. Dazu muss
      ein Gesuch eingereicht werden, und der Zivildienst dauert länger als der Militärdienst.
