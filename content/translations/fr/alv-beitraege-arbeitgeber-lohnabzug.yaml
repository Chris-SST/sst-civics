id: alv-beitraege-arbeitgeber-lohnabzug
lang: fr
source_version: 1
question: Qui déduit du salaire les cotisations à l'assurance-chômage ?
options:
  a: La commune (Gemeinde) du lieu de domicile
  b: La travailleuse ou le travailleur lui-même, par versement
  c: L'Office régional de placement
  d: L'employeur
explanation: L'employeur déduit automatiquement les cotisations du salaire et les verse à l'organe compétent.
  Les travailleurs n'ont pas à s'en occuper eux-mêmes. L'employeur paie également une partie des cotisations.
