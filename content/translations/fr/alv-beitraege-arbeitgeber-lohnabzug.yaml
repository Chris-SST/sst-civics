    question_de: Wer zieht die Beiträge an die Arbeitslosenversicherung vom Lohn ab?
    options_de:
      a: Die Gemeinde des Wohnorts
      b: Die Arbeitnehmerin oder der Arbeitnehmer selbst, durch Einzahlung
      c: Das Regionale Arbeitsvermittlungszentrum
      d: Der Arbeitgeber
    explanation_de: Der Arbeitgeber zieht die Beiträge automatisch vom Lohn ab und überweist sie an die
