id: stimmrecht-bund-schweizer-buergerrecht
lang: fr
source_version: 1
question: Quelle est une condition pour avoir le droit de vote et d'éligibilité au niveau de la Confédération
  ?
options:
  a: Le droit de cité suisse (Bürgerrecht)
  b: L'appartenance à un parti politique
  c: Au moins dix ans de domicile en Suisse
  d: Une autorisation d'établissement (permis C) (Niederlassungsbewilligung C)
explanation: Au niveau de la Confédération, seules les personnes ayant le droit de cité suisse peuvent
  voter et élire. Les étrangères et les étrangers n'ont pas le droit de vote et d'éligibilité au niveau
  de la Confédération, même avec une autorisation d'établissement. L'appartenance à un parti n'est pas
  nécessaire.
