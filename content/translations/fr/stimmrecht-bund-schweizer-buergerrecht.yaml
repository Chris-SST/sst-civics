    question_de: Was ist eine Voraussetzung, um auf Bundesebene das Stimm- und Wahlrecht zu haben?
    options_de:
      a: Das Schweizer Bürgerrecht
      b: Die Zugehörigkeit zu einer politischen Partei
      c: Mindestens zehn Jahre Wohnsitz in der Schweiz
      d: Eine Niederlassungsbewilligung C
    explanation_de: Auf Bundesebene können nur Personen mit Schweizer Bürgerrecht abstimmen und wählen.
      Ausländerinnen und Ausländer haben auf Bundesebene kein Stimm- und Wahlrecht, auch nicht mit einer
      Niederlassungsbewilligung. Die Zugehörigkeit zu einer Partei ist nicht notwendig.
