question: Qui peut être élu au Conseil national (Nationalrat), au Conseil fédéral (Bundesrat) ou au Tribunal
  fédéral (Bundesgericht) ?
options:
  a: Uniquement les personnes qui ont terminé des études supérieures
  b: Uniquement les personnes qui vivent en Suisse depuis au moins dix ans
  c: Uniquement les personnes qui sont membres d'un parti politique
  d: Toutes les Suissesses et tous les Suisses ayant le droit de vote et âgés d'au moins 18 ans
explanation: Selon la Constitution fédérale, toutes les personnes ayant le droit de vote sont éligibles.
  Ont le droit de vote les Suissesses et les Suisses à partir de 18 ans. Il n'est pas nécessaire d'être
  membre d'un parti ni d'avoir une formation particulière.
