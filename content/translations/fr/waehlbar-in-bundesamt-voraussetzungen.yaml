    question_de: Wer kann in den Nationalrat, in den Bundesrat oder ins Bundesgericht gewählt werden?
    options_de:
      a: Nur Personen, die ein Hochschulstudium abgeschlossen haben
      b: Nur Personen, die seit mindestens zehn Jahren in der Schweiz leben
      c: Nur Personen, die Mitglied einer politischen Partei sind
      d: Alle Schweizerinnen und Schweizer, die stimmberechtigt und mindestens 18 Jahre alt sind
    explanation_de: Gemäss der Bundesverfassung sind alle stimmberechtigten Personen wählbar. Stimmberechtigt
      sind die Schweizerinnen und Schweizer ab 18 Jahren. Es ist weder nötig, Mitglied einer Partei zu
      sein, noch eine besondere Ausbildung zu haben.
