question: Comment le parlement de la ville de Zurich, le conseil communal (Gemeinderat), est-il constitué
  ?
options:
  a: Le Conseil d'État (Regierungsrat) du canton le nomme
  b: Le Conseil municipal (Stadtrat) désigne lui-même les membres
  c: Les partis tirent au sort les sièges entre eux
  d: La population l'élit directement aux urnes
explanation: Les citoyens ayant le droit de vote de la ville de Zurich élisent le conseil communal lors
  d'élections générales. Il est le parlement de la ville et remplace l'assemblée communale (Gemeindeversammlung).
