question: Contre quels risques le système suisse d'assurances sociales protège-t-il, entre autres ?
options:
  a: Contre les pertes sur les placements financiers privés
  b: Contre les dommages causés à la voiture et au mobilier de ménage par un vol
  c: Contre les conséquences de la maladie et de l'accident
  d: Contre les hausses de prix des loyers
explanation: Les assurances sociales protègent les personnes contre les conséquences financières de risques
  importants de la vie. La maladie et l'accident en font partie. L'assurance-maladie et l'assurance-accidents
  en sont des exemples.
