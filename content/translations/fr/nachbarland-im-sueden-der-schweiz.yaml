question: Quel pays se situe au sud de la Suisse et a une frontière commune avec elle ?
options:
  a: L'Espagne
  b: L'Italie
  c: La Slovénie
  d: La France
explanation: L'Italie est le voisin méridional de la Suisse. La frontière traverse notamment les Alpes
  ainsi que le Tessin et les Grisons. L'Espagne et la Slovénie n'ont pas de frontière avec la Suisse.
