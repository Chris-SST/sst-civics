id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: fr
source_version: 1
question: Quel droit fondamental protège la liberté de se forger sa propre opinion et de s'informer à
  partir de sources généralement accessibles ?
options:
  a: La liberté d'établissement
  b: La liberté d'opinion et d'information
  c: La liberté économique
  d: La liberté de réunion
explanation: La Constitution fédérale protège la liberté d'opinion et d'information à l'article 16. Toute
  personne a le droit de se procurer librement des informations auprès de sources généralement accessibles.
  C'est un fondement important de la démocratie.
