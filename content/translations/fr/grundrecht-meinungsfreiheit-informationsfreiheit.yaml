    question_de: Welches Grundrecht schützt die Freiheit, sich eine eigene Meinung zu bilden und sich
      aus allgemein zugänglichen Quellen zu informieren?
    options_de:
      a: Die Niederlassungsfreiheit
      b: Die Meinungs- und Informationsfreiheit
      c: Die Wirtschaftsfreiheit
      d: Die Versammlungsfreiheit
    explanation_de: Die Bundesverfassung schützt die Meinungs- und Informationsfreiheit in Artikel 16.
      Jede Person hat das Recht, Informationen aus allgemein zugänglichen Quellen frei zu beschaffen.
      Das ist eine wichtige Grundlage der Demokratie.
