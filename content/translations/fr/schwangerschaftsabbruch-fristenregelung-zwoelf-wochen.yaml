    question_de: Welche Regelung gilt in der Schweiz seit 2002 für den Schwangerschaftsabbruch während
      der ersten zwölf Wochen?
    options_de:
      a: Der Schwangerschaftsabbruch ist während dieses Zeitraums grundsätzlich verboten.
      b: Die Frau kann selbst über den Schwangerschaftsabbruch entscheiden.
      c: Der Ehemann oder der Partner muss dem Schwangerschaftsabbruch zustimmen.
      d: Ein Gericht muss den Schwangerschaftsabbruch bewilligen.
