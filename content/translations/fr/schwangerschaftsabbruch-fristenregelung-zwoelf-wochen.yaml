lang: fr
source_version: 1
question: Quelle réglementation s'applique en Suisse depuis 2002 à l'interruption de grossesse pendant
  les douze premières semaines ?
options:
  a: L'interruption de grossesse est en principe interdite pendant cette période.
  b: La femme peut décider elle-même de l'interruption de grossesse.
  c: Le mari ou le partenaire doit consentir à l'interruption de grossesse.
  d: Un tribunal doit autoriser l'interruption de grossesse.
explanation: Depuis 2002, c'est le régime dit du délai qui s'applique. Selon ce régime, la femme décide
  elle-même pendant les douze premières semaines de grossesse. Pour cela, elle doit faire valoir par écrit
  une situation de détresse.
