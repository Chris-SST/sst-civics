id: gleichberechtigung-frau-mann-bedeutung
lang: fr
source_version: 1
question: Que signifie, dans son principe, l'égalité des droits entre la femme et l'homme ?
options:
  a: Les femmes et les hommes ont, dans leur principe, les mêmes droits.
  b: Les femmes et les hommes ont, dans tous les domaines de la vie, les mêmes devoirs, mais des droits
    différents.
  c: Les femmes et les hommes gagnent exactement le même salaire dans chaque profession.
  d: Les femmes et les hommes doivent partager également toutes les tâches au sein de la famille.
explanation: L'égalité des droits signifie que les deux sexes possèdent, dans leur principe, les mêmes
  droits. Elle est inscrite dans la Constitution fédérale. Ce principe ne dit rien sur la manière dont
  les familles répartissent concrètement leurs tâches.
