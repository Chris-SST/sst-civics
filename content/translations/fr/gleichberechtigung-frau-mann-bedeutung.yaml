    question_de: Was bedeutet die Gleichberechtigung von Frau und Mann im Grundsatz?
    options_de:
      a: Frauen und Männer haben im Grundsatz die gleichen Rechte.
      b: Frauen und Männer haben in allen Lebensbereichen die gleichen Pflichten, aber unterschiedliche
        Rechte.
      c: Frauen und Männer verdienen in jedem Beruf genau den gleichen Lohn.
      d: Frauen und Männer müssen alle Aufgaben innerhalb der Familie gleichmässig aufteilen.
