id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: fr
source_version: 1
question: Laquelle des institutions suivantes fait partie des assurances sociales de la Suisse ?
options:
  a: L'assurance-invalidité (IV)
  b: L'assurance voyage
  c: L'assurance protection juridique
  d: L'assurance ménage
explanation: L'assurance-invalidité (AI) est une assurance sociale réglementée par l'État. Elle soutient
  les personnes qui ne peuvent pas travailler, ou seulement de manière limitée, en raison d'une maladie
  ou d'un accident. Les assurances ménage, voyage et protection juridique sont des assurances privées.
