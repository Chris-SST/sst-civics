id: bahnunternehmen-der-schweiz-erkennen
lang: fr
source_version: 1
question: Parmi les abréviations suivantes, lesquelles désignent toutes des entreprises ferroviaires de
  Suisse ?
options:
  a: SOB, SEM, BLS et SZU
  b: SBB, BLS, SOB et SZU
  c: SBB, SRF, SOB et SUVA
  d: BLS, SZU, SNB et SBB
explanation: SBB, BLS, SOB et SZU sont des entreprises ferroviaires qui exploitent des trains en Suisse.
  Les SBB sont la plus grande entreprise ; les autres sont de plus petites compagnies, souvent actives
  au niveau régional. Les autres abréviations désignent des organisations telles que la Banque nationale
  (SNB), le Secrétariat d'État aux migrations (SEM) ou l'assurance-accidents (SUVA).
