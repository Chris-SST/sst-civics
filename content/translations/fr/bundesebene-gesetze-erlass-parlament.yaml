question: Quelle autorité édicte les lois au niveau fédéral ?
options:
  a: L'Assemblée fédérale (Bundesversammlung), c'est-à-dire le Conseil national (Nationalrat) et le Conseil
    des États (Ständerat)
  b: La Banque nationale suisse
  c: La Chancellerie fédérale (Bundeskanzlei)
  d: La Conférence des gouvernements cantonaux
explanation: L'Assemblée fédérale est le Parlement de la Confédération et se compose du Conseil national
  et du Conseil des États. Elle est responsable de la législation. La Chancellerie fédérale, en revanche,
  soutient le Conseil fédéral (Bundesrat) en tant qu'état-major.
