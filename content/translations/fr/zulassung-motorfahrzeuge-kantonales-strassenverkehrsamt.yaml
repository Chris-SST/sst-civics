question: Qui admet un véhicule à moteur à la circulation routière dans le canton de Zurich et délivre
  à cet effet les plaques de contrôle ?
options:
  a: La police cantonale lors d'un contrôle routier
  b: Le service des automobiles du canton
  c: Le Touring Club Suisse
  d: L'administration communale (Gemeindeverwaltung) du lieu de domicile
explanation: L'admission des véhicules à moteur est une tâche du service cantonal des automobiles. Celui-ci
  délivre aussi les plaques de contrôle. La commune et la police ne sont pas compétentes en la matière.
