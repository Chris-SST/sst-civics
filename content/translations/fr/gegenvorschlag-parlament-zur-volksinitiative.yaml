    question_de: Was kann das Parlament einer eidgenössischen Volksinitiative entgegenstellen?
    options_de:
      a: Eine Verlängerung der Frist für die Unterschriftensammlung um ein zusätzliches Jahr
      b: Seinen eigenen Gegenentwurf, der ebenfalls zur Abstimmung gebracht wird
      c: Eine zweite Unterschriftensammlung in allen Kantonen
      d: Ein Verbot, die Initiative zur Abstimmung zu bringen
    explanation_de: Das Parlament kann einer Volksinitiative einen direkten Gegenentwurf entgegenstellen.
      Dieser übernimmt oft teilweise das Anliegen, geht aber weniger weit. Die Stimmberechtigten entscheiden
      dann am selben Tag über die Initiative und über den Gegenentwurf.
