id: gegenvorschlag-parlament-zur-volksinitiative
lang: fr
source_version: 1
question: Que peut opposer le Parlement à une initiative populaire (Volksinitiative) fédérale ?
options:
  a: Une prolongation du délai de récolte des signatures d'une année supplémentaire
  b: Son propre contre-projet, qui est lui aussi soumis au vote
  c: Une seconde récolte de signatures dans tous les cantons
  d: Une interdiction de soumettre l'initiative au vote
explanation: Le Parlement peut opposer un contre-projet direct à une initiative populaire. Celui-ci reprend
  souvent en partie la demande, mais va moins loin. Les titulaires du droit de vote se prononcent alors
  le même jour sur l'initiative et sur le contre-projet.
