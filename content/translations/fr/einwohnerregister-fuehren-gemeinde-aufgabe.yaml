lang: fr
source_version: 1
question: Laquelle des tâches suivantes le contrôle des habitants (Einwohneramt) remplit-il dans les communes
  (Gemeinden) zurichoises ?
options:
  a: Il rend des jugements pénaux.
  b: Il tient le registre des habitants de la commune.
  c: Il délivre des permis de construire pour les routes cantonales.
  d: Il fixe les lois fiscales.
explanation: La commune tient le registre des personnes qui y habitent. C'est là que vous annoncez votre
  arrivée, votre départ ou votre changement d'adresse lorsque vous déménagez. Les jugements pénaux, les
  lois fiscales et les routes cantonales ne relèvent pas de cette tâche.
