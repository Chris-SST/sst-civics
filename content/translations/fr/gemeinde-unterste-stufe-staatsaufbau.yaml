question: Quel niveau se situe tout en bas dans la structure de l'État à trois niveaux de la Suisse ?
options:
  a: La commune (Gemeinde)
  b: La région
  c: Le canton
  d: La Confédération
explanation: 'La Suisse est organisée en trois niveaux : la Confédération, les cantons et les communes.
  La commune est le niveau le plus bas et le plus proche des habitants. Elle accomplit elle-même de nombreuses
  tâches, par exemple l''école primaire, les permis de construire ou l''aide sociale.'
