id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: fr
source_version: 1
question: À quoi sert la déclaration d'impôt que les contribuables remplissent chaque année ?
options:
  a: Elle sert à l'enregistrement auprès du contrôle des habitants.
  b: Elle est la demande d'assurance maladie.
  c: Elle est l'inscription au service civil (Zivildienst).
  d: Elle présente aux autorités fiscales la situation financière du contribuable.
explanation: Avec la déclaration d'impôt, les contribuables indiquent leur revenu, leur fortune et leurs
  déductions. C'est sur cette base que l'autorité fiscale calcule l'impôt.
