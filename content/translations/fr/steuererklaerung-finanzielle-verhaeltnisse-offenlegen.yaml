    question_de: Wozu dient die Steuererklärung, die die Steuerpflichtigen jedes Jahr ausfüllen?
    options_de:
      a: Sie dient der Anmeldung bei der Einwohnerkontrolle.
      b: Sie ist der Antrag auf Krankenversicherung.
      c: Sie ist die Anmeldung für den Zivildienst.
      d: Sie legt den Steuerbehörden die finanzielle Situation der steuerpflichtigen Person dar.
    explanation_de: Mit der Steuererklärung geben die Steuerpflichtigen ihr Einkommen, ihr Vermögen und
      ihre Abzüge an. Auf dieser Grundlage berechnet die Steuerbehörde die Steuer.
