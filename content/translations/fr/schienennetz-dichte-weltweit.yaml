question: Pour quelle caractéristique le réseau ferroviaire suisse est-il connu au niveau international
  ?
options:
  a: C'est le réseau ferroviaire le plus dense du monde.
  b: C'est le seul réseau ferroviaire qui passe entièrement par des tunnels.
  c: C'est le plus long réseau ferroviaire d'Europe.
  d: C'est le plus ancien réseau ferroviaire du monde.
explanation: Sur une petite superficie, il y a de très nombreuses lignes de chemin de fer et gares. C'est
  pourquoi le réseau suisse est considéré comme le plus dense du monde. Toutefois, la densité ne dit rien
  de la longueur absolue.
