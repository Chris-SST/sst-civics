question: Pour quelle cause la politicienne zurichoise Emilie Lieberherr s'est-elle engagée ?
options:
  a: Pour la construction de l'aéroport de Zurich
  b: Pour l'adhésion de la Suisse à l'ONU
  c: Pour le droit de vote et d'éligibilité des femmes
  d: Pour la suppression de l'assemblée communale (Gemeindeversammlung)
explanation: Dans les années 1960, Emilie Lieberherr s'est battue pour le droit de vote et d'éligibilité
  des femmes. Au niveau de la Confédération, il a été introduit en 1971. Dans le canton de Zurich, il
  s'applique depuis 1970.
