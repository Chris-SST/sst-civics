    question_de: Wer trägt hauptsächlich die Verantwortung für die obligatorische öffentliche Schule in
      der Schweiz?
    options_de:
      a: Die Schulleitungen und die Eltern
      b: Der Bund allein
      c: Die Bezirke und die Kirchen
      d: Die Kantone und die Gemeinden
    explanation_de: Die öffentliche Schule (Volksschule) liegt in der Zuständigkeit der Kantone und der
      Gemeinden. Der Kanton legt den Rahmen fest, die Gemeinden führen die Schulen vor Ort. Der Bund spielt
      in der obligatorischen Schule nur eine kleine Rolle.
