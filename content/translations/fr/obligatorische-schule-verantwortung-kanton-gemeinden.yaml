id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: fr
source_version: 1
question: Qui porte principalement la responsabilité de l'école publique obligatoire en Suisse ?
options:
  a: Les directions d'école et les parents
  b: La Confédération seule
  c: Les districts et les Églises
  d: Les cantons et les communes (Gemeinden)
explanation: L'école publique (Volksschule) relève des cantons et des communes. Le canton fixe le cadre,
  les communes gèrent les écoles sur place. La Confédération ne joue qu'un petit rôle dans l'école obligatoire.
