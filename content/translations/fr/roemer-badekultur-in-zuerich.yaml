question: Quelle nouveauté les Romains ont-ils apportée à Zurich ?
options:
  a: L'imprimerie
  b: Les corporations (Zünfte)
  c: La culture des bains
  d: La Réforme
explanation: Les Romains ont introduit à Zurich la culture des bains, c'est-à-dire des bains publics sur
  le modèle romain. Les corporations, l'imprimerie et la Réforme n'appartiennent qu'au Moyen Âge et au
  début de l'époque moderne.
