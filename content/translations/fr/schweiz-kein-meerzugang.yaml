id: schweiz-kein-meerzugang
lang: fr
source_version: 2
question: Quelle affirmation sur la situation géographique de la Suisse est correcte ?
options:
  a: La Suisse n'a pas d'accès direct à la mer.
  b: La Suisse est bordée à l'ouest par l'océan Atlantique.
  c: La Suisse est bordée au sud par la mer Méditerranée.
  d: La Suisse est bordée au nord par la mer du Nord.
explanation: 'La Suisse est un pays enclavé : elle est entièrement entourée d''autres pays et n''a pas
  de côte maritime. Certes, des bateaux naviguent sur le Rhin de Bâle jusqu''à la mer du Nord, mais aucune
  mer ne borde directement la Suisse.'
