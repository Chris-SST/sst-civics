id: obligatorische-schulzeit-dauer-schweiz
lang: fr
source_version: 2
question: Combien d'années dure la scolarité obligatoire dans le canton de Zurich, si l'on compte l'école
  enfantine ?
options:
  a: Onze ans
  b: Dix ans
  c: Douze ans
  d: Neuf ans
explanation: 'Dans le canton de Zurich, tous les enfants suivent la scolarité obligatoire pendant onze
  ans : deux ans d''école enfantine, six ans d''école primaire et trois ans de secondaire I. La plupart
  des cantons ont uniformisé cette durée grâce au concordat HarmoS. Certains cantons n''y ont toutefois
  pas adhéré, et dans ceux-ci, une seule année d''école enfantine est parfois obligatoire.'
