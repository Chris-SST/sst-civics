question: Dans quelle localité suisse la réunion annuelle du Forum économique mondial (WEF) a-t-elle lieu
  régulièrement ?
options:
  a: À Davos
  b: À Lucerne
  c: À Montreux
  d: À Interlaken
explanation: Le Forum économique mondial se réunit régulièrement à Davos, dans le canton des Grisons.
  Des spécialistes de la politique et de l'économie s'y retrouvent. La Confédération soutient la sécurité
  de la réunion.
