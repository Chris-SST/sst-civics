question: En quelle année la Suisse est-elle devenue membre des Nations Unies (ONU) ?
options:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
explanation: La Suisse a adhéré à l'ONU en 2002, après l'approbation du peuple et des cantons. Elle a
  ainsi été l'un des derniers pays à y adhérer. Toutefois, de nombreuses organisations de l'ONU ont depuis
  longtemps leur siège à Genève.
