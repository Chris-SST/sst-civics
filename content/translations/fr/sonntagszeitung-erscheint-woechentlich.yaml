question: À quelle fréquence paraît un journal du dimanche en Suisse ?
options:
  a: Une fois par semaine
  b: Deux fois par semaine
  c: Une fois par mois
  d: Tous les jours
explanation: Un journal du dimanche paraît seulement une fois par semaine, le dimanche. Les quotidiens,
  en revanche, paraissent la plupart des jours de la semaine. La presse fait partie de la culture et de
  la formation de l'opinion dans le pays.
