question: Qui est considéré comme le fondateur de la Croix-Rouge à Genève ?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: Le Genevois Henry Dunant vit en 1859, après la bataille de Solferino, combien de blessés
  restaient sans secours. Il s'engagea donc pour qu'ils soient soignés, et la Croix-Rouge fut fondée à
  Genève en 1863. Pour cela, Dunant reçut en 1901, avec Frédéric Passy, le premier prix Nobel de la paix.
