    question_de: Wer gilt als Gründer des Roten Kreuzes in Genf?
    options_de:
      a: Alfred Escher
      b: Johann Heinrich Pestalozzi
      c: Huldrych Zwingli
      d: Henry Dunant
    explanation_de: Der Genfer Henry Dunant sah 1859 nach der Schlacht von Solferino, wie viele Verwundete
      ohne Hilfe blieben. Er setzte sich daher dafür ein, dass sie gepflegt wurden, und das Rote Kreuz
      wurde 1863 in Genf gegründet. Dafür erhielt Dunant 1901 zusammen mit Frédéric Passy den ersten Friedensnobelpreis.
