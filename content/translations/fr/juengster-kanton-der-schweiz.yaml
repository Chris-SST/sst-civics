question: Quel canton est le plus jeune canton de la Suisse ?
options:
  a: Jura
  b: Appenzell Rhodes-Extérieures
  c: Bâle-Campagne
  d: Neuchâtel
explanation: Le canton du Jura a été créé en 1979. Il s'est séparé du canton de Berne et est depuis lors
  le plus jeune des 26 cantons. La Constitution fédérale le mentionne parmi les cantons de la Confédération
  suisse.
