    question_de: Welche dieser Aufgaben gehört zu den zentralen Aufgaben des Bundes?
    options_de:
      a: Die Organisation der örtlichen Schulen
      b: Der Schutz des Landes im Inneren wie nach aussen
      c: Der Unterhalt und der Betrieb der Gemeindestrassen
      d: Die Führung der Einwohnerregister der Gemeinden
    explanation_de: Der Bund gewährleistet die Sicherheit des Landes gegenüber dem Ausland, zum Beispiel
      mit der Armee, sowie die innere Sicherheit. Die Schulen, die Gemeindestrassen und die Einwohnerregister
      fallen hingegen vor allem in die Zuständigkeit der Kantone und der Gemeinden.
