id: landesschutz-innen-aussen-bund
lang: fr
source_version: 1
question: Laquelle de ces tâches fait partie des tâches centrales de la Confédération ?
options:
  a: L'organisation des écoles locales
  b: La protection du pays à l'intérieur comme à l'extérieur
  c: L'entretien et l'exploitation des routes communales (Gemeindestrassen)
  d: La gestion des registres des habitants des communes
explanation: La Confédération assure la sécurité du pays vis-à-vis de l'extérieur, par exemple avec l'armée,
  ainsi que la sécurité intérieure. En revanche, les écoles, les routes communales et les registres des
  habitants relèvent avant tout de la compétence des cantons et des communes (Gemeinden).
