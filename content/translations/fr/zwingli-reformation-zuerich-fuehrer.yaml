question: Qui a dirigé la Réforme à Zurich dans les années 1520 ?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martin Luther
  d: Jean Calvin
explanation: Ulrich Zwingli était prêtre séculier (Leutpriester) au Grossmünster et a introduit la Réforme
