    question_de: Welche Institution bildet die erste Säule der Altersvorsorge in der Schweiz?
    options_de:
      a: Die private Säule 3a
      b: Die staatliche Alters- und Hinterlassenenversicherung (AHV)
      c: Die Pensionskasse
      d: Die Krankenkasse
    explanation_de: Die Alters- und Hinterlassenenversicherung ist die staatliche Versicherung und bildet
      die erste Säule. Die Pensionskasse ist die zweite Säule, während die private Versicherung die dritte
      Säule ist.
