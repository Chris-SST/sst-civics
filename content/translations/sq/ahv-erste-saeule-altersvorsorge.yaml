id: ahv-erste-saeule-altersvorsorge
lang: sq
source_version: 1
question: Cila institucion përbën shtyllën e parë të sigurimit për pleqëri në Zvicër?
options:
  a: Shtylla private 3a
  b: sigurimi shtetëror i pleqërisë dhe i të mbijetuarve (AHV)
  c: Arka e pensionit
  d: Arka e sigurimit shëndetësor (Krankenkasse)
explanation: Sigurimi i pleqërisë dhe i të mbijetuarve është sigurimi shtetëror dhe përbën shtyllën e
  parë. Arka e pensionit është shtylla e dytë, ndërsa sigurimi privat është shtylla e tretë.
