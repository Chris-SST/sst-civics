id: krankenkasse-freie-wahl-versicherte
lang: sq
source_version: 1
question: Kush vendos në Zvicër se te cila arkë e sigurimit shëndetësor (Krankenkasse) lidh një person
  sigurimin bazë?
options:
  a: Komuna e vendbanimit përcakton arkën e sigurimit shëndetësor
  b: Personi i siguruar e zgjedh vetë arkën e tij të sigurimit shëndetësor
  c: Punëdhënësi përcakton arkën e sigurimit shëndetësor për të gjithë punonjësit
  d: Kantoni i vendbanimit i cakton çdo personi një arkë sigurimi shëndetësor
explanation: Në Zvicër vlen zgjedhja e lirë e arkës së sigurimit shëndetësor. Të siguruarit mund të zgjedhin
  mes arkave të sigurimit shëndetësor të miratuara dhe, nën kushte të caktuara, mund ta ndërrojnë arkën.
