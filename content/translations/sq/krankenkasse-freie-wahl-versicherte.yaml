    source_version: 1
    question_de: Wer entscheidet in der Schweiz, bei welcher Krankenkasse eine Person die Grundversicherung
      abschliesst?
    options_de:
      a: Die Wohngemeinde bestimmt die Krankenkasse
      b: Die versicherte Person wählt ihre Krankenkasse selbst
      c: Der Arbeitgeber bestimmt die Krankenkasse für alle Mitarbeitenden
      d: Der Wohnkanton weist jeder Person eine Krankenkasse zu
    explanation_de: In der Schweiz gilt die freie Wahl der Krankenkasse. Die Versicherten können unter
      den zugelassenen Krankenkassen wählen und können unter bestimmten Bedingungen die Kasse wechseln.
