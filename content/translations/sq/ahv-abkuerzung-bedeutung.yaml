id: ahv-abkuerzung-bedeutung
lang: sq
source_version: 1
question: Çfarë do të thotë shkurtesa AHV?
options:
  a: Sigurimi i pleqërisë dhe i të mbijetuarve (Alters- und Hinterlassenenversicherung)
  b: Sigurimi zyrtar i ekonomisë familjare
  c: Ndihma e përgjithshme për të siguruarit
  d: Sigurimi i papunësisë dhe i shërimit
explanation: AHV do të thotë sigurimi i pleqërisë dhe i të mbijetuarve (Alters- und Hinterlassenenversicherung).
  Ai paguan pensione në moshën e pleqërisë dhe për të mbijetuarit, për shembull për të ve, të vejusha
  dhe jetimë.
