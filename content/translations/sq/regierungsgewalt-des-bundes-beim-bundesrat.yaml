id: regierungsgewalt-des-bundes-beim-bundesrat
lang: sq
source_version: 1
question: Cili autoritet ushtron pushtetin më të lartë qeverisës në nivel të Konfederatës?
options:
  a: Këshilli Federal (Bundesrat)
  b: Këshilli Kombëtar (Nationalrat)
  c: Kancelaria Federale (Bundeskanzlei)
  d: Gjykata Federale (Bundesgericht)
explanation: Sipas Kushtetutës Federale, Këshilli Federal është autoriteti më i lartë drejtues dhe ekzekutiv
  i Konfederatës. Parlamenti nxjerr ligjet, ndërsa Gjykata Federale zbaton drejtësinë.
