id: bundesparlament-wahl-alle-vier-jahre
lang: sq
source_version: 2
question: Në çfarë ritmi zgjedh populli përsëri Parlamentin federal?
options:
  a: Çdo tre vjet
  b: Çdo katër vjet
  c: Çdo gjashtë vjet
  d: Çdo dy vjet
explanation: Populli zgjedh Këshillin Kombëtar (Nationalrat) përsëri çdo katër vjet. Edhe anëtarët e Këshillit
  të Shteteve (Ständerat) zgjidhen sot në të gjitha kantonet për katër vjet. Si zgjidhet dhe pjesërisht
  edhe kur zgjidhet, e përcakton çdo kanton vetë.
