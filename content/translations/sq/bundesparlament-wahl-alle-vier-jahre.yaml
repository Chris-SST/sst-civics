    question_de: In welchem Rhythmus wählt das Volk das Bundesparlament wieder?
    options_de:
      a: Alle drei Jahre
      b: Alle vier Jahre
      c: Alle sechs Jahre
      d: Alle zwei Jahre
    explanation_de: Das Volk wählt den Nationalrat alle vier Jahre wieder. Auch die Mitglieder des Ständerats
      werden heute in allen Kantonen für vier Jahre gewählt. Wie sie gewählt werden und teilweise auch,
      wann sie gewählt werden, bestimmt jeder Kanton selbst.
