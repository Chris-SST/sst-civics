lang: sq
source_version: 1
question: Cila grua u zgjodh si gruaja e parë në Këshillin Federal (Bundesrat) të Zvicrës?
options:
  a: Elisabeth Kopp
  b: Doris Leuthard
  c: Ruth Dreifuss
  d: Micheline Calmy-Rey
explanation: Elisabeth Kopp u zgjodh në vitin 1984 si gruaja e parë në Këshillin Federal. Gratë e tjera
  të përmendura u bënë anëtare të Këshillit Federal vetëm më vonë.
