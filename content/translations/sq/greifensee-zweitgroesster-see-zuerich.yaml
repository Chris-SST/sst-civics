id: greifensee-zweitgroesster-see-zuerich
lang: sq
source_version: 1
question: Cili liqen në kantonin e Cyrihut është i dyti më i madh pas Liqenit të Cyrihut?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: Greifensee shtrihet midis Usterit dhe Dübendorfit dhe është, pas Liqenit të Cyrihut, liqeni
  i dytë më i madh në kanton. Pfäffikersee është më i vogël. Türlersee dhe Katzensee janë ende dukshëm
  më të vegjël.
