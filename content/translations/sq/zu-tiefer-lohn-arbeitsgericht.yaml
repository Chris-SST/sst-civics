id: zu-tiefer-lohn-arbeitsgericht
lang: sq
source_version: 1
question: Një punonjëse merr pa të drejtë një pagë shumë të ulët. Cilën instancë mund të thërrasë ajo?
options:
  a: Qendrën rajonale të ndërmjetësimit të punës (RAV)
  b: Zyrën federale të statistikës
  c: Gjykatën e punës
  d: Kuvendin i komunës (Gemeindeversammlung)
explanation: Në rast mosmarrëveshjesh që dalin nga marrëdhënia e punës, për shembull për shkak të një
  page shumë të ulët, kompetente është gjykata e punës. RAV ndihmon në kërkimin e një vendi pune dhe jo
  në mosmarrëveshjet për pagën.
