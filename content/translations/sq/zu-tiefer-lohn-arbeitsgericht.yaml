    question_de: Eine Angestellte erhält zu Unrecht einen sehr tiefen Lohn. Welche Instanz kann sie anrufen?
    options_de:
      a: Das regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Bundesamt für Statistik
      c: Das Arbeitsgericht
      d: Die Gemeindeversammlung
    explanation_de: Bei Streitigkeiten, die sich aus dem Arbeitsverhältnis ergeben, zum Beispiel wegen
      eines sehr tiefen Lohns, ist das Arbeitsgericht zuständig. Das RAV hilft bei der Stellensuche und
      nicht bei Streitigkeiten über den Lohn.
