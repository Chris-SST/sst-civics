question: Cila nga këto shkallë i përket shkollimit të detyrueshëm në Zvicër?
options:
  a: Shkolla e lartë (Hochschule)
  b: Shkolla fillore
  c: Grupi i lojërave (Spielgruppe)
  d: Shkolla profesionale (Berufsfachschule)
explanation: 'Në kantonin Zürich shkollimi i detyrueshëm zgjat njëmbëdhjetë vjet: kopshti, shkolla fillore
  dhe shkalla e mesme I. Grupi i lojërave për fëmijët e vegjël është vullnetar. Shkollën profesionale
  dhe shkollën e lartë i ndjek njeriu vetëm pas shkollimit të detyrueshëm.'
