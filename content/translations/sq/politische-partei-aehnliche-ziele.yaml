    question_de: Was beschreibt eine politische Partei am besten?
    options_de:
      a: Ein Gericht, das über politische Streitigkeiten entscheidet
      b: Ein Zusammenschluss von Personen mit ähnlichen politischen Zielen
      c: Eine Gruppe von Gemeinden, die gemeinsam Aufgaben erfüllen
      d: Eine Behörde, die die Wahlen und Abstimmungen organisiert
    explanation_de: In einer Partei schliessen sich Menschen zusammen, die ähnliche politische Ziele verfolgen.
      Die Parteien stellen Kandidaten für Wahlen auf und äussern ihre Haltung zu den Vorlagen, über die
      abgestimmt wird. Sie sind keine staatlichen Behörden.
