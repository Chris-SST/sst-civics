id: politische-partei-aehnliche-ziele
lang: sq
source_version: 1
question: Çfarë e përshkruan më mirë një parti politike?
options:
  a: Një gjykatë që vendos për mosmarrëveshje politike
  b: Një bashkim personash me qëllime politike të ngjashme
  c: Një grup komunash (Gemeinde) që kryejnë detyra së bashku
  d: Një autoritet që organizon zgjedhjet dhe votimet
explanation: Në një parti bashkohen njerëz që ndjekin qëllime politike të ngjashme. Partitë paraqesin
  kandidatë në zgjedhje dhe shprehin qëndrimin e tyre për projektet që votohen. Ato nuk janë autoritete
  shtetërore.
