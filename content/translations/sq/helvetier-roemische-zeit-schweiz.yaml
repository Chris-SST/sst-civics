id: helvetier-roemische-zeit-schweiz
lang: sq
source_version: 1
question: Cili popull banonte në kohën e romakëve në territorin e Zvicrës së sotme?
options:
  a: Hunët
  b: Vikingët
  c: Gotët
  d: Helvetët
explanation: Helvetët ishin një fis keltik në Mittelland, rrafshnaltën zvicerane. Romakët i nënshtruan
  dhe territori u bë pjesë e Perandorisë Romake. Emri latin Helvetia për Zvicrën i kujton ende ata.
