    question_de: Welches Volk wohnte zur Zeit der Römer auf dem Gebiet der heutigen Schweiz?
    options_de:
      a: Die Hunnen
      b: Die Wikinger
      c: Die Goten
      d: Die Helvetier
    explanation_de: Die Helvetier waren ein keltischer Stamm im Mittelland, der Schweizer Hochebene. Die
      Römer unterwarfen sie und das Gebiet wurde Teil des Römischen Reiches. Der lateinische Name Helvetia
      für die Schweiz erinnert noch heute an sie.
