    question_de: Wer meldet die geplante Eheschliessung beim Zivilstandsamt an?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Das Paar, das heiraten will, gemeinsam
      c: Das Einwohneramt der Wohnsitzgemeinde, automatisch
      d: Die Eltern der Braut oder des Bräutigams
    explanation_de: Das Paar, das heiraten will, reicht den Antrag auf Durchführung des Ehevorbereitungsverfahrens
      gemeinsam beim Zivilstandsamt ein. Andere Personen können dies nicht an ihrer Stelle tun. Danach
      prüft das Amt die Voraussetzungen für die Ehe.
