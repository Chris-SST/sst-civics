id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: sq
source_version: 1
question: Kush e paraqet martesën e planifikuar pranë zyrës së gjendjes civile (Zivilstandsamt)?
options:
  a: Ddëshmitarët e martesës në emër të çiftit
  b: Çifti që do të martohet, së bashku
  c: Zyra e banorëve të komunës së vendbanimit, automatikisht
  d: Prindërit e nuses ose të dhëndrrit
explanation: Çifti që do të martohet e paraqet kërkesën për kryerjen e procedurës përgatitore të martesës
  bashkërisht pranë zyrës së gjendjes civile. Persona të tjerë nuk mund ta bëjnë këtë në vend të tyre.
  Pas kësaj, zyra kontrollon kushtet e martesës.
