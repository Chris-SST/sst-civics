question: Me çfarë fillon në kantonin Zürich detyrimi shkollor i një fëmije?
options:
  a: Me hyrjen në shkollën sekondare
  b: Me hyrjen në shkollën fillore
  c: Me hyrjen në grupin e lojërave
  d: Me hyrjen në kopshtin e fëmijëve
explanation: Në kantonin Zürich kopshti i fëmijëve është pjesë e shkollës publike të detyrueshme. Prandaj
  detyrimi shkollor fillon që me hyrjen në kopshtin e fëmijëve. Grupi i lojërave është vullnetar.
