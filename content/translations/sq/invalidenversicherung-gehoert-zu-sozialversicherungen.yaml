id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: sq
source_version: 1
question: Cila nga institucionet e mëposhtme është pjesë e sigurimeve shoqërore të Zvicrës?
options:
  a: Sigurimi i invaliditetit (Invalidenversicherung)
  b: Sigurimi i udhëtimit
  c: Sigurimi i mbrojtjes juridike
  d: Sigurimi i pasurisë shtëpiake
explanation: Sigurimi i invaliditetit (IV) është një sigurim shoqëror i rregulluar nga shteti. Ai mbështet
  persona që, për shkak të sëmundjes ose aksidentit, nuk mund të punojnë ose mund të punojnë vetëm në
  masë të kufizuar. Sigurimet e pasurisë shtëpiake, të udhëtimit dhe të mbrojtjes juridike janë sigurime
  private.
