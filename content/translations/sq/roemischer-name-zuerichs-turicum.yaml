id: roemischer-name-zuerichs-turicum
lang: sq
source_version: 1
question: Cili ishte emri romak i Cyrihut (Zürich)?
options:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
explanation: 'Romakët e quanin vendbanimin dhe stacionin e tyre doganor në lumin Limmat Turicum. Nga ky
  emër u zhvillua më vonë emri Zürich. Emrat e tjerë i përkasin vendeve romake në Zvicrën e sotme: Windisch,
  Augst dhe Avenches.'
