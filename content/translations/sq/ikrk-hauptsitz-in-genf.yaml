id: ikrk-hauptsitz-in-genf
lang: sq
source_version: 1
question: Në cilin shtet ndodhet selia qendrore e Komitetit Ndërkombëtar të Kryqit të Kuq (KNKK)?
options:
  a: Në Holandë
  b: Në Zvicër
  c: Në Austri
  d: Në Belgjikë
explanation: KNKK-ja ka selinë qendrore në Gjenevë, në Zvicër. Ai u themelua në Gjenevë në vitin 1863
  dhe mbron viktimat e konflikteve të armatosura. Zvicra e mbështet punën e tij.
