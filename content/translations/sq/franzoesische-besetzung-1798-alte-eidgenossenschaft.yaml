    question_de: Was bewirkte der Einmarsch der französischen Truppen in die Schweiz im Jahr 1798?
    options_de:
      a: Er verwandelte die Schweiz in einen Teil Frankreichs
      b: Er stärkte die Macht der alten Orte
      c: Er führte zur Gründung des Bundesstaates von 1848
      d: Er setzte der alten Ordnung der alten Eidgenossenschaft ein Ende
    explanation_de: Mit der Besetzung durch Frankreich brach die alte Eidgenossenschaft zusammen. An ihre
      Stelle trat die Helvetische Republik als Einheitsstaat. Der heutige Bundesstaat wurde erst im Jahr
      1848 geschaffen.
