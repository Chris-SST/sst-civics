id: franzoesische-besetzung-1798-alte-eidgenossenschaft
lang: sq
source_version: 1
question: Çfarë shkaktoi hyrja e trupave franceze në Zvicër në vitin 1798?
options:
  a: E shndërroi Zvicrën në pjesë të Francës
  b: Forcoi pushtetin e kantoneve të vjetra (alte Orte)
  c: Çoi në themelimin e shtetit federal të vitit 1848
  d: I dha fund rendit të vjetër të Konfederatës së vjetër (Eidgenossenschaft)
explanation: Me pushtimin nga Franca u shemb Konfederata e vjetër (Eidgenossenschaft). Në vend të saj
  erdhi Republika Helvetike si shtet unitar. Shteti federal i sotëm u krijua vetëm në vitin 1848.
