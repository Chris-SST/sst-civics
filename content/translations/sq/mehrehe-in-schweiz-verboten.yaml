    question_de: Was gilt in der Schweiz für die Ehe mit mehreren Partnern oder Partnerinnen gleichzeitig?
    options_de:
      a: Sie ist erlaubt, wenn alle einverstanden sind
      b: Sie ist verboten
      c: Sie ist erlaubt, wenn sie mit religiösen Gründen gerechtfertigt wird
      d: Sie ist nur für Personen mit ausländischem Pass erlaubt
    explanation_de: Die Schweiz kennt nur die Ehe mit einem Ehegatten (Monogamie). Wer bereits verheiratet
      ist oder in eingetragener Partnerschaft lebt, kann keine weitere Ehe eingehen. Dies gilt unabhängig
      von der Religion oder der Herkunft.
