id: mehrehe-in-schweiz-verboten
lang: sq
source_version: 1
question: Çfarë vlen në Zvicër për martesën me disa partnerë ose partnere në të njëjtën kohë?
options:
  a: Është e lejuar nëse të gjithë pajtohen
  b: Është e ndaluar
  c: Është e lejuar nëse justifikohet me arsye fetare
  d: Është e lejuar vetëm për persona me pasaportë të huaj
explanation: Zvicra njeh vetëm martesën me një bashkëshort (monogaminë). Kush është tashmë i martuar ose
  jeton në partneritet të regjistruar, nuk mund të lidhë një martesë tjetër. Kjo vlen pavarësisht nga
  feja ose prejardhja.
