id: ordentliche-kuendigung-einschreiben-empfang
lang: sq
source_version: 1
question: Si duhet t'i dorëzohet një shkëputje e rregullt e marrëdhënies së punës (Kündigung), që të mund
  të provohet pranimi?
options:
  a: Përmes një njoftimi te administrata e komunës (Gemeinde)
  b: Me letër rekomande, ose pala tjetër e konfirmon pranimin me shkrim
  c: Me një e-mail të thjeshtë pa konfirmim
  d: Me gojë, në një bisedë mes katër syve
explanation: Me një letër rekomande ose me një konfirmim me shkrim të pranimit mund të provohet se shkëputja
  e marrëdhënies së punës ka arritur te marrësi. Kjo është e rëndësishme, sepse afatet e njoftimit fillojnë
  nga momenti i pranimit.
