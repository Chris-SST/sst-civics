    source_version: 1
    question_de: Wie muss eine ordentliche Kündigung des Arbeitsverhältnisses zugestellt werden, damit
      der Empfang bewiesen werden kann?
    options_de:
      a: Durch eine Mitteilung bei der Gemeindeverwaltung
      b: Mit eingeschriebenem Brief, oder die andere Partei bestätigt den Empfang schriftlich
      c: Mit einer einfachen E-Mail ohne Bestätigung
      d: Mündlich, in einem Gespräch unter vier Augen
    explanation_de: Mit einem eingeschriebenen Brief oder mit einer schriftlichen Bestätigung des Empfangs
      kann bewiesen werden, dass die Kündigung des Arbeitsverhältnisses beim Empfänger angekommen ist.
      Das ist wichtig, weil die Kündigungsfristen ab dem Zeitpunkt des Empfangs beginnen.
