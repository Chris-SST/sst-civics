id: sonntagszeitung-erscheint-woechentlich
lang: sq
source_version: 1
question: Sa shpesh del një gazetë e së dielës në Zvicër?
options:
  a: Një herë në javë
  b: Dy herë në javë
  c: Një herë në muaj
  d: Çdo ditë
explanation: Një gazetë e së dielës del vetëm një herë në javë, të dielën. Gazetat ditore, në të kundërt,
  dalin në pjesën më të madhe të ditëve të javës. Shtypi është pjesë e kulturës dhe e formimit të opinionit
  në vend.
