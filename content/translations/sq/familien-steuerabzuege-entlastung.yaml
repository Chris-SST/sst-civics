id: familien-steuerabzuege-entlastung
lang: sq
source_version: 1
question: Si lehtësohen familjet në lidhje me taksat?
options:
  a: Familjet nuk paguajnë taksa.
  b: Familjet mund të bëjnë zbritje në taksa.
  c: Familjet nuk duhet të plotësojnë deklaratë tatimore.
  d: Familjet paguajnë vetëm tatimin mbi vlerën e shtuar.
explanation: Familjet mund të bëjnë, për shembull, zbritje për fëmijët ose për kujdesin ndaj fëmijëve.
  Kështu ulet të ardhurat e tatueshme dhe, si rrjedhojë, edhe taksa.
