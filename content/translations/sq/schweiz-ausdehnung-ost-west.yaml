id: schweiz-ausdehnung-ost-west
lang: sq
source_version: 1
question: Sa është afërsisht largësia midis pikës më lindore dhe pikës më perëndimore të Zvicrës?
options:
  a: Rreth 250 kilometra
  b: Rreth 350 kilometra
  c: Rreth 550 kilometra
  d: Rreth 150 kilometra
explanation: Zvicra matet nga lindja në perëndim rreth 350 kilometra. Pra, është një vend mjaft i vogël,
  që është më i gjatë në drejtimin lindje-perëndim sesa nga veriu në jug.
