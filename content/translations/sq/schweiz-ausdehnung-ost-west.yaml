    question_de: Wie gross ist ungefähr die Entfernung zwischen dem östlichsten und dem westlichsten Punkt
      der Schweiz?
    options_de:
      a: Etwa 250 Kilometer
      b: Etwa 350 Kilometer
      c: Etwa 550 Kilometer
      d: Etwa 150 Kilometer
    explanation_de: Die Schweiz misst von Osten nach Westen etwa 350 Kilometer. Es ist also ein ziemlich
      kleines Land, das in Ost-West-Richtung länger ist als von Norden nach Süden.
