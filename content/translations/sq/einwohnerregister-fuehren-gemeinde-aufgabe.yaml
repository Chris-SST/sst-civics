    question_de: Welche der folgenden Aufgaben erfüllt das Einwohneramt in den Gemeinden des Kantons Zürich?
    options_de:
      a: Es erlässt Strafurteile.
      b: Es führt das Einwohnerregister der Gemeinde.
      c: Es erteilt Baubewilligungen für die Strassen des Kantons.
      d: Es legt die Steuergesetze fest.
    explanation_de: Die Gemeinde führt das Register der Personen, die in ihr wohnen. Dort meldet man sich
      an, meldet sich ab oder ändert die Adresse, wenn man den Wohnort wechselt. Strafurteile, Steuergesetze
      und die Strassen des Kantons gehören nicht zu dieser Aufgabe.
