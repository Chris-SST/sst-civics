id: einwohnerregister-fuehren-gemeinde-aufgabe
lang: sq
source_version: 1
question: Cilën nga detyrat e mëposhtme e kryen zyra e banorëve (Einwohneramt) në komunat (Gemeinde) e
  Zyrihut?
options:
  a: Ajo lëshon aktgjykime penale.
  b: Ajo mban regjistrin e banorëve të komunës.
  c: Ajo jep leje ndërtimi për rrugët e kantonit.
  d: Ajo përcakton ligjet tatimore.
explanation: Komuna mban regjistrin e personave që banojnë në të. Aty regjistroheni, çregjistroheni ose
  ndryshoni adresën kur ndërroni vendbanimin. Aktgjykimet penale, ligjet tatimore dhe rrugët e kantonit
  nuk janë pjesë e kësaj detyre.
