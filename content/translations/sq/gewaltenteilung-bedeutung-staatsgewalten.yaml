id: gewaltenteilung-bedeutung-staatsgewalten
lang: sq
source_version: 1
question: Çfarë do të thotë parimi i ndarjes së pushteteve (Gewaltenteilung) në Zvicër?
options:
  a: Konfederata, kantonet dhe komunat (Gemeinden) i ndajnë mes tyre të ardhurat nga taksat.
  b: Qeveria, parlamenti dhe gjykatat e ndajnë mes tyre pushtetin shtetëror.
  c: Pushteti në shtet i takon vetëm Këshillit Federal (Bundesrat).
  d: Populli dhe mediat e ndajnë mes tyre pushtetin shtetëror.
explanation: Në ndarjen e pushteteve, ekzekutivi (qeveria), legjislativi (parlamenti) dhe gjyqësori (gjykatat)
  kryejnë detyra të ndryshme. Kështu asnjë institucion nuk mund të ketë vetëm për vete shumë pushtet.
  Pushtetet shtetërore kontrollojnë njëra-tjetrën.
