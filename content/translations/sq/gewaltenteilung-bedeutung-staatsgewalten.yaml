    question_de: Was bedeutet das Prinzip der Gewaltenteilung in der Schweiz?
    options_de:
      a: Der Bund, die Kantone und die Gemeinden teilen die Steuereinnahmen untereinander auf.
      b: Die Regierung, das Parlament und die Gerichte teilen die Staatsgewalt untereinander auf.
      c: Die Macht im Staat steht allein dem Bundesrat zu.
      d: Das Volk und die Medien teilen die Staatsgewalt untereinander auf.
    explanation_de: Bei der Gewaltenteilung erfüllen die Exekutive (die Regierung), die Legislative (das
      Parlament) und die Judikative (die Gerichte) unterschiedliche Aufgaben. So kann keine Institution
      allein zu viel Macht haben. Die Staatsgewalten kontrollieren sich gegenseitig.
