    source_version: 3
    question_de: Ein Mitarbeiter oder eine Mitarbeiterin übt neben der Arbeit ein öffentliches Amt aus,
      zum Beispiel in der Schulbehörde der Gemeinde. Was gibt der Arbeitgeber dafür normalerweise?
    options_de:
      a: Einen Bonus auf den Lohn
      b: Eine Beförderung
      c: Bezahlte freie Zeit
      d: Nichts, für das Amt müssen Ferien genommen werden
    explanation_de: Wer ein öffentliches Amt ausübt, erhält dafür normalerweise vom Arbeitgeber bezahlte
      freie Zeit. Wie genau, hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von anderen Regelungen
      ab. Für ein solches Amt gibt es keinen Bonus und keine Beförderung, und normalerweise müssen dafür
      auch keine Ferien genommen werden.
