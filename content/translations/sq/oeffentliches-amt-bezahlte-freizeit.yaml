id: oeffentliches-amt-bezahlte-freizeit
lang: sq
source_version: 3
question: Një punonjëse ose një punonjës ushtron, përveç punës, një detyrë publike, për shembull në autoritetin
  shkollor të komunës (Gemeinde). Çfarë jep zakonisht punëdhënësi për këtë?
options:
  a: Një bonus në pagë
  b: Një ngritje në detyrë
  c: Kohë të lirë të paguar
  d: Asgjë, për detyrën duhet të merren pushime
explanation: Kush ushtron një detyrë publike merr zakonisht nga punëdhënësi kohë të lirë të paguar për
  këtë. Sa saktësisht, varet nga kontrata e punës, nga kontrata kolektive e punës ose nga rregullime të
  tjera. Për një detyrë të tillë nuk jepet bonus ose ngritje në detyrë, dhe zakonisht nuk duhet as të
  merren pushime për të.
