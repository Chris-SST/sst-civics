    model: claude-sonnet-5-5
    at: 2026-11-02
    source_version: 3
    question_de: Was bedeutet das aktive Wahlrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht, selbst in ein Amt gewählt zu werden
      c: Das Recht, im Parlament parlamentarische Initiativen einzureichen
      d: Das Recht, an Wahlen und Abstimmungen teilzunehmen und seine eigene Stimme abzugeben
    explanation_de: Wer das aktive Wahlrecht hat, kann bei Wahlen und Abstimmungen selbst seine Stimme
      abgeben, zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, selbst
      in ein Amt gewählt zu werden, nennt man hingegen passives Wahlrecht.
