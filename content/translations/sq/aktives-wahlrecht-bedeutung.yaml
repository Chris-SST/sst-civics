id: aktives-wahlrecht-bedeutung
lang: sq
source_version: 3
question: Çfarë do të thotë e drejta aktive e votës?
options:
  a: E drejta për të themeluar një parti
  b: E drejta për t'u zgjedhur vetë në një post
  c: E drejta për të paraqitur në parlament nisma parlamentare
  d: E drejta për të marrë pjesë në zgjedhje dhe votime dhe për të dhënë votën e vet
explanation: Kush ka të drejtën aktive të votës, mund ta japë vetë votën në zgjedhje dhe votime, për shembull
  gjatë zgjedhjes së Këshillit Kombëtar (Nationalrat) ose në një votim popullor. E drejta për t'u zgjedhur
  vetë në një post quhet, përkundrazi, e drejtë pasive e votës.
status: flagged
