question: Cili deklaratë për përbërjen e Këshillit Qeveritar (Regierungsrat) të Cyrihut është e saktë?
options:
  a: Ai përbëhet nga tre persona.
  b: Ai përbëhet nga shtatë persona.
  c: Ai përbëhet nga nëntë persona.
  d: Ai përbëhet nga pesë persona.
explanation: Këshilli Qeveritar i Cyrihut është një organ me shtatë persona. Ata drejtojnë së bashku kantonin
  dhe secili prej tyre udhëheq një drejtori.
