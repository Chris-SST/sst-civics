    question_de: Welcher traditionelle Sport in der Schweiz ist eine Art freier Kampf (Ringen)?
    options_de:
      a: Hornussen
      b: Schwingen
      c: Curling
      d: Steinstossen
    explanation_de: 'Schwingen ist ein Ringkampf zwischen zwei Personen auf einem runden Platz mit Sägemehl
      und gilt als traditioneller Schweizer Sport. Hornussen und Steinstossen sind ebenfalls alte Schweizer
      Sportarten, aber sie sind kein Ringen: Beim Hornussen wird eine kleine Scheibe geschlagen, die weit
      durch die Luft fliegt, während beim Steinstossen ein schwerer Stein geworfen wird. Curling wird
      auf dem Eis gespielt und hat seinen Ursprung in Schottland.'
