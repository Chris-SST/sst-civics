question: Cili sport tradicional në Zvicër është një lloj lufte e lirë (mundjeje)?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'Schwingen është një mundje midis dy personave në një fushë të rrumbullakët me tallash dhe
  konsiderohet sport tradicional zviceran. Hornussen dhe Steinstossen janë gjithashtu sporte të vjetra
  zvicerane, por nuk janë mundje: te Hornussen goditet një disk i vogël që fluturon larg nëpër ajër, ndërsa
  te Steinstossen hidhet një gur i rëndë. Curling luhet mbi akull dhe e ka origjinën nga Skocia.'
