    question_de: Was ist ein Ziel der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll unbebaute Landschaften schützen und den Boden sparsam nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis des Baulandes festlegen.
    explanation_de: Die Raumplanung legt fest, wo gebaut werden darf und wo nicht. Sie trennt das Baugebiet
      vom Nichtbaugebiet, damit die Landschaften und das Landwirtschaftsland geschützt werden. Da der
      Boden begrenzt ist, soll er sparsam genutzt werden, und anstatt neue Bauzonen zu schaffen, soll
      die Dichte der bestehenden Siedlungen weiter erhöht werden.
