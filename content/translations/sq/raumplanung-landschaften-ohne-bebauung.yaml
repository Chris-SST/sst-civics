id: raumplanung-landschaften-ohne-bebauung
lang: sq
source_version: 2
question: Cili është një objektiv i planifikimit hapësinor në Zvicër?
options:
  a: Ai duhet të mbrojë peizazhet e pandërtuara dhe ta përdorë tokën me kursim.
  b: Ai duhet t'i caktojë rregullisht nga e para kufijtë mes kantoneve.
  c: Ai duhet të krijojë sa më shumë zona të reja ndërtimi.
  d: Ai duhet të përcaktojë çmimin e tokës për ndërtim.
explanation: Planifikimi hapësinor përcakton se ku lejohet të ndërtohet dhe ku jo. Ai ndan zonën e ndërtimit
  nga zona jashtë ndërtimit, në mënyrë që peizazhet dhe toka bujqësore të mbrohen. Meqenëse toka është
  e kufizuar, ajo duhet të përdoret me kursim dhe, në vend që të krijohen zona të reja ndërtimi, duhet
  të shtohet më shumë dendësia e vendbanimeve ekzistuese.
