    question_de: Wer leitet die Primarschulen im Kanton Zürich?
    options_de:
      a: Die Bildungsdirektion des Kantons
      b: Der Bund
      c: Die Gemeinden
      d: Die Bezirke
    explanation_de: Im Kanton Zürich werden die Primarschulen von den Gemeinden geleitet. Diese sind,
      je nach Ort, politische Gemeinden oder besondere Schulgemeinden, und die gewählte Schulpflege ist
      die örtliche Schulbehörde. Der Kanton legt nur den Rahmen fest, zum Beispiel den Lehrplan, und beaufsichtigt
      die öffentliche Schule.
