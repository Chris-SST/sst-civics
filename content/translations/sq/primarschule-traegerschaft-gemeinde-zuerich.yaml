id: primarschule-traegerschaft-gemeinde-zuerich
lang: sq
source_version: 2
question: Kush i drejton shkollat e shkallës fillore (Primarstufe) në kantonin Zürich?
options:
  a: Drejtoria e Arsimit e kantonit
  b: Konfederata
  c: Komunat (Gemeinden)
  d: Rrethet
explanation: Në kantonin Zürich, shkollat fillore i drejtojnë komunat. Këto janë, sipas vendit, komunat
  politike ose komuna të veçanta shkollore, dhe Këshilli i zgjedhur i shkollës (Schulpflege) është autoriteti
  shkollor në vend. Kantoni përcakton vetëm kornizën, për shembull planprogramin mësimor, dhe mbikëqyr
  shkollën publike.
