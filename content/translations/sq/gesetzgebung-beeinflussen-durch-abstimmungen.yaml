id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: sq
source_version: 1
question: Si ndikojnë drejtpërdrejt qytetarët me të drejtë vote në Zvicër në legjislacionin e Konfederatës?
options:
  a: Ata votojnë në kutinë e votimit për nisma dhe referendume.
  b: Ata zgjedhin gjyqtarët që vendosin për ligjet e reja.
  c: Ata emërojnë anëtarët e Këshillit Federal, të cilët nxjerrin ligjet e reja.
  d: Ata vetë miratojnë ligjet në Kuvendin Federal (Bundesversammlung).
explanation: Qytetarët me të drejtë vote marrin pjesë në votime popullore për nisma dhe referendume dhe
  bashkëvendosin aty. Kështu ata bashkëveprojnë drejtpërdrejt në legjislacion mes zgjedhjeve. Kjo është
  një karakteristikë e demokracisë së drejtpërdrejtë.
