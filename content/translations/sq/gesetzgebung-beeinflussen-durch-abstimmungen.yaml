    question_de: Wie wirken stimmberechtigte Bürgerinnen und Bürger in der Schweiz direkt an der Gesetzgebung
      des Bundes mit?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über neue Gesetze entscheiden.
      c: Sie ernennen die Mitglieder des Bundesrates, die neue Gesetze erlassen.
      d: Sie verabschieden die Gesetze selbst in der Bundesversammlung.
    explanation_de: Die stimmberechtigten Bürgerinnen und Bürger nehmen an Volksabstimmungen über Initiativen
      und Referenden teil und entscheiden dort mit. So wirken sie zwischen den Wahlen direkt an der Gesetzgebung
      mit. Das ist ein Merkmal der direkten Demokratie.
