id: ahv-iv-sozialversicherungen-schweiz
lang: sq
source_version: 1
question: Cili pohim për sigurimet shoqërore të Zvicrës është i saktë?
options:
  a: AHV (sigurimi i pleqërisë dhe i të mbijetuarve) dhe IV (sigurimi i invaliditetit) bëjnë pjesë në
    sigurimet shoqërore të Zvicrës.
  b: AHV (sigurimi i pleqërisë dhe i të mbijetuarve) dhe IV (sigurimi i invaliditetit) administrohen vetëm
    nga komunat (Gemeinde).
  c: AHV (sigurimi i pleqërisë dhe i të mbijetuarve) dhe IV (sigurimi i invaliditetit) janë sigurime private
    pa bazë ligjore.
  d: AHV (sigurimi i pleqërisë dhe i të mbijetuarve) dhe IV (sigurimi i invaliditetit) janë menduar vetëm
    për punonjësit e vetëpunësuar.
explanation: AHV do të thotë sigurimi i pleqërisë dhe i të mbijetuarve (Alters- und Hinterlassenenversicherung),
  IV do të thotë sigurimi i invaliditetit (Invalidenversicherung). Të dyja rregullohen nga e drejta e
  Konfederatës dhe bëjnë pjesë në sistemin shtetëror të sigurimeve shoqërore.
