    question_de: Welche wichtige Steuer erheben der Kanton Zürich und die Gemeinden auf den Lohn und andere
      Einkünfte von Personen?
    options_de:
      a: Die Einkommenssteuer
      b: Die Erbschaftssteuer
      c: Die Hundesteuer
      d: Die Motorfahrzeugsteuer
    explanation_de: Die Einkommenssteuer ist eine der wichtigsten Steuern des Kantons und der Gemeinden.
      Sie wird auf das Einkommen natürlicher Personen erhoben. Die anderen Steuern sind weniger wichtig
      oder betreffen etwas anderes.
