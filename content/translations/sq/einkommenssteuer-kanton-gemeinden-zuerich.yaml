id: einkommenssteuer-kanton-gemeinden-zuerich
lang: sq
source_version: 1
question: Cilin tatim të rëndësishëm e vendosin kantoni i Cyrihut dhe komunat (Gemeinden) mbi pagën dhe
  të ardhurat e tjera të personave?
options:
  a: Tatimin mbi të ardhurat
  b: Tatimin mbi trashëgiminë
  c: Tatimin mbi qentë
  d: Tatimin mbi automjetet motorike
explanation: Tatimi mbi të ardhurat është një nga tatimet më të rëndësishme të kantonit dhe të komunave.
  Ai vendoset mbi të ardhurat e personave fizikë. Tatimet e tjera janë më pak të rëndësishme ose përfshijnë
  diçka tjetër.
