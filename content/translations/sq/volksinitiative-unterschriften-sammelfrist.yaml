id: volksinitiative-unterschriften-sammelfrist
lang: sq
source_version: 1
question: Sa nënshkrime i nevojiten një nisme popullore (Volksinitiative) federale dhe sa kohë mund të
  mblidhen ato?
options:
  a: 100 000 nënshkrime brenda 100 ditëve
  b: 50 000 nënshkrime brenda 100 ditëve
  c: 50 000 nënshkrime brenda 18 muajve
  d: 100 000 nënshkrime brenda 18 muajve
explanation: Një nismë popullore federale ka nevojë për 100 000 nënshkrime të vlefshme brenda 18 muajve.
  Ndërsa referendumi fakultativ ka nevojë për 50 000 nënshkrime brenda 100 ditëve.
