    question_de: Wie viele Unterschriften braucht eine eidgenössische Volksinitiative und wie lange können
      sie gesammelt werden?
    options_de:
      a: 100 000 Unterschriften innerhalb von 100 Tagen
      b: 50 000 Unterschriften innerhalb von 100 Tagen
      c: 50 000 Unterschriften innerhalb von 18 Monaten
      d: 100 000 Unterschriften innerhalb von 18 Monaten
    explanation_de: Eine eidgenössische Volksinitiative braucht 100 000 gültige Unterschriften innerhalb
      von 18 Monaten. Das fakultative Referendum hingegen braucht 50 000 Unterschriften innerhalb von
      100 Tagen.
