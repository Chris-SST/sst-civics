id: agrargesellschaft-zum-industrieland-19-jahrhundert
lang: sq
source_version: 1
question: Si ndryshoi Zvicra ekonomikisht në shekullin e 19-të?
options:
  a: Ajo jetonte kryesisht nga tregtia me kolonitë.
  b: Ajo mbeti deri në vitin 1900 pothuajse vetëm një vend fshatar bujqësor.
  c: Ajo u zhvillua nga një vend industrial në një shoqëri agrare.
  d: Ajo u zhvillua nga një shoqëri agrare në një vend industrial.
explanation: Në shekullin e 19-të puna kaloi nga bujqësia në fabrika. Rrugët e reja të komunikacionit,
  si hekurudha, e mbështetën këtë ndryshim. Kështu vendi bujqësor u bë vend industrial.
