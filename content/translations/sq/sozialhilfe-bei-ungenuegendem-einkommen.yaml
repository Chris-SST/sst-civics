    question_de: Was bietet die Gemeinde, wenn das Einkommen und das Vermögen einer Person nicht zum Leben
      ausreichen?
    options_de:
      a: Sozialhilfe
      b: Eine Baubewilligung
      c: Eine Einbürgerung
      d: Ein Stipendium der Volksschule
    explanation_de: Wer seinen Lebensunterhalt nicht mit eigenen Mitteln bestreiten kann, hat Anspruch
      auf Unterstützung durch die Sozialhilfe. Sie wird von der Gemeinde angeboten, in der die Person
      wohnt. Sie ist das letzte Netz der sozialen Sicherheit.
