id: sozialhilfe-bei-ungenuegendem-einkommen
lang: sq
source_version: 1
question: Çfarë ofron komuna (Gemeinde), kur të ardhurat dhe pasuria e një personi nuk mjaftojnë për jetesë?
options:
  a: Ndihmë sociale
  b: Një leje ndërtimi
  c: Një natyralizim
  d: Një bursë e shkollës publike (Volksschule)
explanation: Kush nuk mund ta paguajë vetë jetesën me mjetet e veta, ka të drejtë për mbështetje nga ndihma
  sociale. Ajo ofrohet nga komuna ku banon personi. Ajo është rrjeti i fundit i sigurisë sociale.
