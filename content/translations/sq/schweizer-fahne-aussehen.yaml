    question_de: Wie sieht die Schweizer Flagge aus?
    options_de:
      a: Ein weisses, freistehendes Kreuz (das die Ränder nicht berührt) auf einem roten Quadrat
      b: Ein weisses Kreuz auf rotem Hintergrund mit einem Wappen in der Mitte
      c: Ein weisses Kreuz, das sich bis zum Rand des roten Rechtecks erstreckt
      d: Ein rotes, freistehendes Kreuz (das die Ränder nicht berührt) auf einem weissen Quadrat
    explanation_de: Die Schweizer Flagge ist quadratisch. Sie zeigt ein weisses Kreuz auf rotem Hintergrund,
      dessen Arme die Ränder nicht berühren. Zusammen mit der Flagge des Vatikans ist sie eine der zwei
      quadratischen Nationalflaggen.
