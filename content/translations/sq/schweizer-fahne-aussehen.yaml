id: schweizer-fahne-aussehen
lang: sq
source_version: 1
question: Si duket flamuri zvicerian?
options:
  a: Një kryq i bardhë, i lirë (që nuk prek anët), mbi një katror të kuq
  b: Një kryq i bardhë mbi sfond të kuq me një stemë në mes
  c: Një kryq i bardhë që shtrihet deri në skajin e drejtkëndëshit të kuq
  d: Një kryq i kuq, i lirë (që nuk prek anët), mbi një katror të bardhë
explanation: Flamuri zvicerian është katror. Ai paraqet një kryq të bardhë mbi sfond të kuq, krahët e
  të cilit nuk i prekin skajet. Së bashku me flamurin e Vatikanit, është një nga dy flamujt kombëtarë
  katrorë.
