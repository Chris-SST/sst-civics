id: lateinischer-name-der-schweiz
lang: sq
source_version: 2
question: Si quhet Konfederata Zvicerane në latinisht?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: Në latinisht Zvicra quhet Confoederatio Helvetica. Prej këtu vjen shkurtesa CH, që shihet
  për shembull në targat e automjeteve dhe në adresat e internetit (.ch). Emri latin përdoret sepse është
  asnjanës dhe nuk i jep përparësi asnjërës nga katër gjuhët kombëtare.
