id: foehn-warmer-trockener-suedwind
lang: sq
source_version: 1
question: Çfarë është Föhn-i?
options:
  a: Një erë e ftohtë dhe e lagësht nga veriu
  b: Një erë e ftohtë nga lindja në dimër
  c: Një shi i fortë në pranverë
  d: Një erë e ngrohtë dhe e thatë nga drejtimi jugor
explanation: Föhn-i është një erë zbritëse e ngrohtë dhe e thatë, që në Alpe fryn kryesisht nga jugu.
  Ai mund t'i bëjë temperaturat të rriten shpejt dhe e bën pamjen shumë të qartë.
