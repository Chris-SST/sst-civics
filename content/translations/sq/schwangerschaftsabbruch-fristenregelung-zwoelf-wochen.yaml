    question_de: Welche Regelung gilt in der Schweiz seit dem Jahr 2002 für den Schwangerschaftsabbruch
      in den ersten zwölf Wochen?
    options_de:
      a: Der Schwangerschaftsabbruch in diesem Zeitraum ist grundsätzlich verboten.
      b: Die Frau kann selbst über den Schwangerschaftsabbruch entscheiden.
      c: Der Ehemann oder Partner muss dem Schwangerschaftsabbruch zustimmen.
      d: Ein Gericht muss den Schwangerschaftsabbruch genehmigen.
    explanation_de: Seit dem Jahr 2002 gilt die sogenannte Fristenregelung. Demnach entscheidet die Frau
      in den ersten zwölf Wochen der Schwangerschaft selbst. Dafür muss sie schriftlich geltend machen,
      dass sie sich in einer Notlage befindet.
