id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: sq
source_version: 1
question: Cili rregullim vlen në Zvicër që nga viti 2002 për ndërprerjen e shtatzënisë në dymbëdhjetë
  javët e para?
options:
  a: Ndërprerja e shtatzënisë në këtë periudhë është në parim e ndaluar.
  b: Gruaja mund të vendosë vetë për ndërprerjen e shtatzënisë.
  c: Bashkëshorti ose partneri duhet të japë pëlqimin për ndërprerjen e shtatzënisë.
  d: Një gjykatë duhet ta miratojë ndërprerjen e shtatzënisë.
explanation: Që nga viti 2002 vlen i ashtuquajturi rregullim i afatit. Sipas tij, gruaja vendos vetë në
  dymbëdhjetë javët e para të shtatzënisë. Për këtë ajo duhet të pretendojë me shkrim se ndodhet në një
  gjendje nevoje.
