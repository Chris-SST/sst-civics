question: Kush është përgjegjës në kantonin e Cyrihut për funksionimin dhe mbajtjen e Universitetit të
  Cyrihut?
options:
  a: Konfederata
  b: Qyteti i Cyrihut
  c: Kantoni i Cyrihut
  d: Këshillat e rrethit (Bezirksräte) të kantonit
explanation: Universiteti i Cyrihut është një universitet kantonal. Kantoni i Cyrihut e mban dhe e administron
  atë. Qyteti i Cyrihut dhe Konfederata nuk janë përgjegjës kryesorë për të.
