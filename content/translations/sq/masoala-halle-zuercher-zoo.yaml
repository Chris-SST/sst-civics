question: Cilës institucion në Zyrih i përket salla Masoala me pyllin tropikal nga Madagaskari?
options:
  a: Kopshtit Zoologjik të Zyrihut
  b: Kopshtit Botanik të Universitetit
  c: Muzeut të Historisë Natyrore
  d: Technorama-s
explanation: Salla Masoala është pjesë e Kopshtit Zoologjik të Zyrihut. Ajo paraqet një pyll tropikal,
