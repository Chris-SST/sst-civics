    question_de: Wo müssen Sie sich anmelden, wenn Sie in eine andere Gemeinde des Kantons Zürich umziehen?
    options_de:
      a: Beim Bezirksgericht
      b: Beim Bundesamt für Statistik der Eidgenossenschaft
      c: Bei der Kantonspolizei
      d: Bei der Einwohnerkontrolle der neuen Wohngemeinde
    explanation_de: Die Anmeldung erfolgt bei der Einwohnerkontrolle, die auch Einwohneramt genannt wird.
      Sie führt das Register der Einwohnerinnen und Einwohner der Gemeinde.
