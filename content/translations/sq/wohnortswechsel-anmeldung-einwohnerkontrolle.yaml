id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: sq
source_version: 1
question: Ku duhet të regjistroheni kur zhvendoseni në një tjetër komunë (Gemeinde) të kantonit të Cyrihut?
options:
  a: Në gjykatën e rrethit
  b: Në Zyrën Federale të Statistikës të Konfederatës
  c: Në policinë e kantonit
  d: Në kontrollin e banorëve të komunës së re të banimit
explanation: Regjistrimi bëhet në kontrollin e banorëve (Einwohnerkontrolle), që quhet edhe zyra e banorëve
  (Einwohneramt). Ai mban regjistrin e banoreve dhe banorëve të komunës.
