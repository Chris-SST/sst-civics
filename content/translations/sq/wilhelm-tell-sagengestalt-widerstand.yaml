id: wilhelm-tell-sagengestalt-widerstand
lang: sq
source_version: 1
question: Çfarë simbolizon figura legjendare e Wilhelm Tellit nga Zvicra Qendrore?
options:
  a: Rezistencën ndaj sundimtarëve të huaj
  b: Neutralitetin e Zvicrës në kohë lufte
  c: Futjen e Reformës
  d: Themelimin e bankës së parë zvicerane
explanation: Legjenda tregon për një burrë që i reziston shtypjes nga ana e administratorëve të huaj (Vögte).
  Prandaj Wilhelm Telli konsiderohet simbol i lirisë. Nuk është e provuar nëse ai ka jetuar vërtet.
