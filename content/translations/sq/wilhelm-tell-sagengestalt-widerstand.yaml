    question_de: Was symbolisiert die legendäre Figur des Wilhelm Tell aus der Zentralschweiz?
    options_de:
      a: Den Widerstand gegen fremde Herrscher
      b: Die Neutralität der Schweiz in Kriegszeiten
      c: Die Einführung der Reformation
      d: Die Gründung der ersten schweizerischen Bank
    explanation_de: Die Legende erzählt von einem Mann, der sich der Unterdrückung durch fremde Verwalter
      (Vögte) widersetzt. Deshalb gilt Wilhelm Tell als Symbol der Freiheit. Es ist nicht erwiesen, ob
      er wirklich gelebt hat.
