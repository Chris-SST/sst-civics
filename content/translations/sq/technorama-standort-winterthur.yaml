question: Në cilin qytet të kantonit të Cyrihut ndodhet Technorama, një muze për eksperimentim?
options:
  a: Në Uster
  b: Në Dübendorf
  c: Në Winterthur
  d: Në Cyrih
explanation: Technorama është qendra zvicerane e shkencës (Science Center) dhe ndodhet në Winterthur.
  Vizitorët mund të eksperimentojnë vetë atje dhe të provojnë fenomene natyrore.
