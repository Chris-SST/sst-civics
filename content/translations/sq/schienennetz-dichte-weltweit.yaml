id: schienennetz-dichte-weltweit
lang: sq
source_version: 1
question: Për çfarë është i njohur rrjeti hekurudhor zviceran në krahasim ndërkombëtar?
options:
  a: Është rrjeti hekurudhor më i dendur në botë.
  b: Është i vetmi rrjet hekurudhor që kalon tërësisht nëpër tunele.
  c: Është rrjeti hekurudhor më i gjatë në Evropë.
  d: Është rrjeti hekurudhor më i vjetër në botë.
explanation: Në një sipërfaqe të vogël ka shumë linja hekurudhore dhe shumë stacione. Prandaj rrjeti zviceran
  konsiderohet si më i denduri në botë. Por dendësia nuk tregon asgjë për gjatësinë absolute.
