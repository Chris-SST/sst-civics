    question_de: Wofür ist das Schweizer Eisenbahnnetz im internationalen Vergleich bekannt?
    options_de:
      a: Es ist das dichteste Eisenbahnnetz der Welt.
      b: Es ist das einzige Eisenbahnnetz, das vollständig durch Tunnel führt.
      c: Es ist das längste Eisenbahnnetz in Europa.
      d: Es ist das älteste Eisenbahnnetz der Welt.
    explanation_de: Auf einer kleinen Fläche gibt es viele Eisenbahnlinien und viele Bahnhöfe. Deshalb
      gilt das Schweizer Netz als das dichteste der Welt. Aber die Dichte sagt nichts über die absolute
      Länge aus.
