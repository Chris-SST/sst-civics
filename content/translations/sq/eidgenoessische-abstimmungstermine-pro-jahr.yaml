id: eidgenoessische-abstimmungstermine-pro-jahr
lang: sq
source_version: 1
question: Sa herë në vit zhvillohen zakonisht në Zvicër votime popullore federale?
options:
  a: Një herë
  b: Vetëm çdo katër vjet
  c: Deri në katër herë
  d: Çdo muaj
explanation: Për votimet popullore federale parashikohen deri në katër të diela votimi në vit. Në një
  afat shpesh votohet njëkohësisht për disa projekte. Çdo katër vjet zhvillohen, përkundrazi, zgjedhjet
  për në Këshillin Kombëtar (Nationalrat), të cilat nuk janë votime.
