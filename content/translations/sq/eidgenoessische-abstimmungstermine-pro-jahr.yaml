    question_de: Wie oft im Jahr finden in der Schweiz üblicherweise eidgenössische Volksabstimmungen
      statt?
    options_de:
      a: Einmal
      b: Nur alle vier Jahre
      c: Bis zu viermal
      d: Jeden Monat
    explanation_de: Für eidgenössische Volksabstimmungen sind bis zu vier Abstimmungssonntage im Jahr
      vorgesehen. An einem Termin wird oft gleichzeitig über mehrere Vorlagen abgestimmt. Alle vier Jahre
      finden hingegen die Wahlen für den Nationalrat statt, die keine Abstimmungen sind.
