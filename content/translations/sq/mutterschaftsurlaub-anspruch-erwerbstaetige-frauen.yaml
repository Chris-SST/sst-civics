id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
lang: sq
source_version: 1
question: Kush ka në Zvicër, pas lindjes së një fëmije, të drejtë ligjore për pushim lehonie?
options:
  a: Vetëm gratë që punojnë në një ndërmarrje me më shumë se 50 punonjës
  b: Çdo grua që punon dhe që lind një fëmijë
  c: Vetëm gratë që janë të martuara
  d: Vetëm gratë me shtetësi (Bürgerrecht) zvicerane
explanation: Ligji parashikon për nënat që punojnë të drejtën për pushim lehonie dhe për një kompensim.
  Madhësia e ndërmarrjes, shtetësia dhe gjendja civile nuk luajnë asnjë rol në këtë drejtim. Kompensimi
  financohet përmes regjimit të kompensimit të të ardhurave (Erwerbsersatzordnung).
