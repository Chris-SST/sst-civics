    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes einen gesetzlichen Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Unternehmen mit mehr als 50 Mitarbeitenden arbeiten
      b: Jede Frau, die erwerbstätig ist und ein Kind zur Welt bringt
      c: Nur Frauen, die verheiratet sind
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Das Gesetz sieht für erwerbstätige Mütter das Recht auf Mutterschaftsurlaub und auf
      eine Entschädigung vor. Die Grösse des Unternehmens, die Staatsangehörigkeit und der Zivilstand
      spielen dabei keine Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
