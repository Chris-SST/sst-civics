    question_de: Was wurde 1848 in der Schweiz geschaffen?
    options_de:
      a: Die Helvetische Republik mit einer Zentralregierung
      b: Der Bund der Staaten unter französischer Aufsicht
      c: Der moderne Bundesstaat mit einer neuen Verfassung
      d: Die Eidgenossenschaft der drei Gründerkantone
    explanation_de: Im Jahr 1848 gaben sich die Kantone eine Bundesverfassung und gründeten den modernen
      Bundesstaat. Er vereinte die gemeinsamen Aufgaben des Bundes mit der Autonomie der Kantone. Diese
      Verfassung ist die Grundlage der heutigen Schweiz.
