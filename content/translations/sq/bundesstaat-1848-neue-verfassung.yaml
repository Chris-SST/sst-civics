question: Çfarë u krijua në Zvicër në vitin 1848?
options:
  a: Republika Helvetike me një qeveri qendrore
  b: Lidhja e shteteve nën mbikëqyrjen franceze
  c: Shteti modern federal me një kushtetutë të re
  d: Konfederata e tre kantoneve themeluese
explanation: Në vitin 1848 kantonet i dhanë vetes një Kushtetutë Federale dhe themeluan shtetin modern
  federal. Ai bashkoi detyrat e përbashkëta të Konfederatës me autonominë e kantoneve. Kjo kushtetutë
  është baza e Zvicrës së sotme.
