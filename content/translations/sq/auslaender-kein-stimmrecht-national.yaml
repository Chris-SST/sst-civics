    question_de: Können Ausländer, die seit Jahren in der Schweiz leben, an eidgenössischen Abstimmungen
      teilnehmen?
    options_de:
      a: Ja, aber nur an Abstimmungen und nicht an Wahlen.
      b: Ja, wenn sie eine Niederlassungsbewilligung (Bewilligung C) haben.
      c: Ja, wenn sie Steuern zahlen.
      d: Nein, auf nationaler Ebene haben sie kein Stimmrecht.
    explanation_de: Das Stimmrecht auf nationaler Ebene ist an das Schweizer Bürgerrecht gebunden. Ausländer
      können es erst nach einer Einbürgerung ausüben.
