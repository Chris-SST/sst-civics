id: auslaender-kein-stimmrecht-national
lang: sq
source_version: 1
question: A mund të marrin pjesë të huajt që jetojnë prej vitesh në Zvicër në votimet federale?
options:
  a: Po, por vetëm në votime dhe jo në zgjedhje.
  b: Po, nëse kanë leje vendosjeje (leja C) (Niederlassungsbewilligung).
  c: Po, nëse paguajnë tatime.
  d: Jo, në nivel kombëtar nuk kanë të drejtë vote.
explanation: E drejta e votës në nivel kombëtar është e lidhur me shtetësinë (Bürgerrecht) zvicerane.
  Të huajt mund ta ushtrojnë atë vetëm pas një natyralizimi.
