id: ehe-verbot-nahe-blutsverwandtschaft
lang: sq
source_version: 1
question: Kush nuk lejohet të martohet në Zvicër?
options:
  a: Personat që janë divorcuar tashmë një herë
  b: Personat që vijnë nga kantone të ndryshme
  c: Personat që janë të afërm të ngushtë në gjak
  d: Personat që banojnë në komuna (Gemeinden) të ndryshme
explanation: Martesa mes të afërmve të ngushtë në gjak është e ndaluar, për shembull mes vëllezërve e
  motrave ose mes prindërve dhe fëmijëve. Prejardhja, vendbanimi dhe një divorc i mëparshëm, përkundrazi,
  nuk përbëjnë pengesë për martesë.
