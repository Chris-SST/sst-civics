id: wallis-gebirgskanton-alpen
lang: sq
source_version: 1
question: Cili nga këta kantone karakterizohet fort nga malet?
options:
  a: Basel-Stadt
  b: Wallis
  c: Thurgau
  d: Zhenevë
explanation: Në Wallis ndodhen shumë maja të larta alpine, mes tyre Dufourspitze, mali më i lartë i Zvicrës.
  Thurgau, Basel-Stadt dhe Zhenevë shtrihen më shumë në fushë ose buzë liqeneve dhe lumenjve.
