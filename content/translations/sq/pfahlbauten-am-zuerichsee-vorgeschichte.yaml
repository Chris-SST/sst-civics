id: pfahlbauten-am-zuerichsee-vorgeschichte
lang: sq
source_version: 1
question: Si ishin ndërtuar vendbanimet parahistorike në Liqenin e Cyrihut?
options:
  a: Si shpella në shkëmb
  b: Si ndërtesa mbi shtylla (Pfahlbauten), pra shtëpi mbi shtylla
  c: Si shtëpi prej tulle në fshatra
  d: Si kështjella mbi shkëmbinj
explanation: Në bregun e Liqenit të Cyrihut, në kohët parahistorike, kishte ndërtesa mbi shtylla, domethënë
  shtëpi mbi shtylla. Mbetjet e tyre ndodhen ende sot nën ujë dhe studiohen nga arkeologë nënujorë.
