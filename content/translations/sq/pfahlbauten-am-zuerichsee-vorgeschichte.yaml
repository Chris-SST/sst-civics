    question_de: Wie waren die prähistorischen Siedlungen am Zürichsee gebaut?
    options_de:
      a: Wie Höhlen im Fels
      b: Als Bauten auf Pfählen, also Häuser auf Pfählen
      c: Wie Backsteinhäuser in Dörfern
      d: Wie Burgen auf Felsen
    explanation_de: Am Ufer des Zürichsees gab es in prähistorischer Zeit Bauten auf Pfählen, das heisst
      Häuser auf Pfählen. Ihre Überreste befinden sich noch heute unter Wasser und werden von Unterwasserarchäologen
      untersucht.
