id: auslaender-herkunft-eu-staaten-anteil
lang: sq
source_version: 1
question: Nga vijnë shumica e të huajve që banojnë në Zvicër?
options:
  a: Nga shtetet e Azisë, rreth dy të tretat
  b: Nga shtetet e Afrikës, rreth gjysma
  c: Nga shtetet e Bashkimit Evropian, rreth dy të tretat
  d: Nga shtetet e Amerikës, rreth një e treta
explanation: Rreth 66 për qind e popullsisë së huaj rezidente vijnë nga shtetet e BE-së, pra afërsisht
  dy të tretat. Pjesa tjetër vjen nga shtete të tjera evropiane dhe nga pjesa tjetër e botës. Shifra mund
  të ndryshojë paksa me kalimin e kohës.
