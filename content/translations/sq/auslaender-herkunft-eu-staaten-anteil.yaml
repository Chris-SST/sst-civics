    question_de: Woher kommt die Mehrheit der Ausländer, die in der Schweiz wohnen?
    options_de:
      a: Aus den Staaten Asiens, etwa zwei Drittel
      b: Aus den Staaten Afrikas, etwa die Hälfte
      c: Aus den Staaten der Europäischen Union, etwa zwei Drittel
      d: Aus den Staaten Amerikas, etwa ein Drittel
    explanation_de: Etwa 66 Prozent der ausländischen Wohnbevölkerung kommen aus den Staaten der EU, also
      ungefähr zwei Drittel. Der Rest kommt aus anderen europäischen Staaten und aus dem Rest der Welt.
      Die Zahl kann sich im Laufe der Zeit leicht ändern.
