question: Si quhet qeveria e qytetit të Cyrihut (Zürich)?
options:
  a: Këshilli i Qytetit (Stadtrat)
  b: Këshilli i rrethit (Bezirksrat)
  c: Këshilli komunal (Gemeinderat)
  d: Parlamenti i qytetit (Stadtparlament)
explanation: Ekzekutivi i qytetit të Cyrihut quhet Këshilli i Qytetit. Këshilli komunal, në të kundërt,
  është parlamenti i qytetit.
