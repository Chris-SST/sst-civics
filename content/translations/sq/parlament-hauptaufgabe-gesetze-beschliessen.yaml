    question_de: Was ist die wichtigste Aufgabe des Parlaments der Eidgenossenschaft?
    options_de:
      a: Die Polizei im ganzen Land zu leiten
      b: In Streitfällen zwischen Personen zu entscheiden
      c: Die Gesetze zu prüfen und zu genehmigen
      d: Die Gesetze im Alltag anzuwenden
    explanation_de: Das Parlament ist die gesetzgebende Gewalt. Es prüft und genehmigt die Gesetze der
      Eidgenossenschaft. Die Regierung wendet sie an, und die Gerichte urteilen in Streitfällen.
