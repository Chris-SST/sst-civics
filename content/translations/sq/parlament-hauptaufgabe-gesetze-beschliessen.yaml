id: parlament-hauptaufgabe-gesetze-beschliessen
lang: sq
source_version: 1
question: Cila është detyra më e rëndësishme e Parlamentit të Konfederatës?
options:
  a: Të drejtojë policinë në të gjithë vendin
  b: Të vendosë në çështjet e mosmarrëveshjes mes personave
  c: Të shqyrtojë dhe të miratojë ligjet
  d: Të zbatojë ligjet në jetën e përditshme
explanation: Parlamenti është pushteti ligjvënës. Ai shqyrton dhe miraton ligjet e Konfederatës. Qeveria
  i zbaton ato, dhe gjykatat gjykojnë në rastet e mosmarrëveshjes.
