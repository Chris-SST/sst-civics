    question_de: Wofür ist Huldrych (Ulrich) Zwingli in der Geschichte Zürichs hauptsächlich bekannt?
    options_de:
      a: Er baute die erste Eisenbahn im Kanton.
      b: Er war der erste Bundespräsident der Schweiz.
      c: Er führte das Stimmrecht für Frauen ein.
      d: Er war der Anführer der Reformation in Zürich.
    explanation_de: Huldrych (Ulrich) Zwingli führte im 16. Jahrhundert die Reformation in Zürich an,
      und die Kirche Zürichs wurde reformiert. Die Eisenbahn, der Bundesstaat mit einem Bundespräsidenten
      und das Stimmrecht für Frauen kamen erst Jahrhunderte später.
