id: zwingli-bekannt-fuer-reformation
lang: sq
source_version: 2
question: Për çfarë njihet kryesisht Huldrych (Ulrich) Zwingli në historinë e Cyrihut?
options:
  a: Ai ndërtoi hekurudhën e parë në kanton.
  b: Ai ishte Presidenti i parë i Konfederatës (Bundespräsident) i Zvicrës.
  c: Ai prezantoi të drejtën e votës për gratë.
  d: Ai ishte udhëheqësi i Reformacionit në Cyrih.
explanation: Huldrych (Ulrich) Zwingli udhëhoqi Reformacionin në Cyrih në shekullin e 16-të, dhe kisha
  e Cyrihut u bë reformate. Hekurudha, shteti federal me një President të Konfederatës dhe e drejta e
  votës për gratë erdhën vetëm shekuj më vonë.
