id: militaerdienstpflicht-schweizer-maenner
lang: sq
source_version: 1
question: Kë e prek në Zvicër detyrimi për shërbim ushtarak ose për shërbim zëvendësues?
options:
  a: Të gjithë banorët dhe banoret nga mosha 18 vjeç
  b: Burrat me shtetësi (Bürgerrecht) zvicerane
  c: Të gjithë burrat që jetojnë në Zvicër
  d: Vetëm gratë me shtetësi zvicerane
explanation: Sipas Kushtetutës Federale, çdo burrë zviceran është i detyruar të kryejë shërbim ushtarak.
  Kush nuk mund ta pajtojë këtë me ndërgjegjen e tij, kryen shërbim zëvendësues civil (shërbim civil,
  Zivildienst). Të huajt nuk i nënshtrohen detyrimit për shërbim.
