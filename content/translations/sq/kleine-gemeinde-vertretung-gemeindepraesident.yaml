    question_de: Wer vertritt eine kleinere Gemeinde des Kantons Zürich nach aussen?
    options_de:
      a: die Gemeindepräsidentin oder der Gemeindepräsident
      b: das Mitglied des Bezirksrates
      c: die Gemeindeschreiberin oder der Gemeindeschreiber
      d: die Schulleiterin oder der Schulleiter
    explanation_de: In kleineren Gemeinden des Kantons Zürich vertritt die Gemeindepräsidentin oder der
      Gemeindepräsident die Gemeinde nach aussen. Sie oder er leitet den Gemeinderat. In der Stadt Zürich
      übernimmt die Stadtpräsidentin oder der Stadtpräsident diese Rolle.
