lang: sq
source_version: 1
question: Kush përfaqëson jashtë një komunë (Gemeinde) më të vogël të Cyrihut?
options:
  a: kryetarja ose kryetari i komunës
  b: anëtarja ose anëtari i këshillit të rrethit
  c: sekretarja ose sekretari i komunës
  d: drejtoresha ose drejtori i shkollës
explanation: Në komunat më të vogla të Cyrihut, kryetarja ose kryetari i komunës përfaqëson komunën jashtë.
  Ajo ose ai drejton këshillin komunal (Gemeinderat). Në qytetin e Cyrihut këtë rol e merr kryetarja ose
  kryetari i qytetit.
