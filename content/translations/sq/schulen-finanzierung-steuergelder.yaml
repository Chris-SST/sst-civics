id: schulen-finanzierung-steuergelder
lang: sq
source_version: 1
question: Nga çfarë paguhen kryesisht shkollat publike në Zvicër?
options:
  a: Nga tarifat shkollore që prindërit i paguajnë çdo muaj
  b: Nga paratë e taksave të kantonit dhe të komunave (Gemeinden)
  c: Nga të ardhurat e Postës dhe të SBB-së
  d: Nga kontributet e arkave të sigurimit shëndetësor (Krankenkassen)
explanation: Shkolla publike e detyrueshme është falas sipas Kushtetutës Federale. Ajo financohet nga
  paratë e taksave, kryesisht nga kantonet dhe komunat.
