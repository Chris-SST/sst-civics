    question_de: Wovon werden die öffentlichen Schulen in der Schweiz hauptsächlich bezahlt?
    options_de:
      a: Von den Schulgebühren, die die Eltern jeden Monat bezahlen
      b: Von den Steuergeldern des Kantons und der Gemeinden
      c: Von den Einnahmen der Post und der SBB
      d: Von den Beiträgen der Krankenkassen
    explanation_de: Die obligatorische öffentliche Schule ist gemäss der Bundesverfassung unentgeltlich.
      Sie wird aus Steuergeldern finanziert, hauptsächlich von den Kantonen und den Gemeinden.
