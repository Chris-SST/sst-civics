    question_de: Wer entscheidet auf Bundesebene in einer Abstimmung endgültig, ob eine Volksinitiative
      oder ein Referendum angenommen wird?
    options_de:
      a: Die Bundesversammlung in einer gemeinsamen Sitzung der beiden Räte
      b: Der Bundesrat nach Anhörung der Kantonsregierungen
      c: Das Bundesgericht nach einer juristischen Prüfung der Vorlage
      d: Die stimmberechtigten Bürgerinnen und Bürger, die an der Urne oder per Post abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die stimmberechtigten Bürgerinnen und Bürger
      das letzte Wort. Sie entscheiden in der Volksabstimmung an der Urne, was in der Schweiz auch per
      Post möglich ist. Der Bundesrat, das Parlament und das Bundesgericht können das Ergebnis nicht ersetzen.
