id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: sq
source_version: 1
question: Kush vendos përfundimisht në nivel federal, në një votim, nëse një nismë popullore (Volksinitiative)
  ose një referendum miratohet?
options:
  a: Kuvendi Federal (Bundesversammlung) në një seancë të përbashkët të të dy dhomave
  b: Këshilli Federal (Bundesrat) pas dëgjimit të qeverive të kantoneve
  c: Gjykata Federale (Bundesgericht) pas një shqyrtimi juridik të projektit
  d: Qytetarët me të drejtë vote, të cilët votojnë në kuti votimi ose me postë
explanation: Në rastin e nismave popullore dhe të referendumeve, fjalën e fundit e kanë qytetarët me të
  drejtë vote. Ata vendosin në votimin popullor në kutinë e votimit, që në Zvicër është i mundur edhe
  me postë. Këshilli Federal, parlamenti dhe Gjykata Federale nuk mund ta zëvendësojnë rezultatin.
