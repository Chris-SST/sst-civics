id: zivilgesetzbuch-ehe-scheidung-regeln
lang: sq
source_version: 1
question: Cili ligj rregullon, ndër të tjera, se si lidhet një martesë dhe si zgjidhet më pas me divorc?
options:
  a: Kodi Civil
  b: Kodi Penal
  c: Ligji për azilin
  d: Ligji për Gjykatën Federale (Bundesgericht)
explanation: Kodi Civil rregullon të drejtën e personave, të drejtën familjare, të drejtën e trashëgimisë
  dhe të drejtën e sendeve. Kjo përfshin edhe lidhjen e martesës dhe divorcin. Kodi Penal, përkundrazi,
  merret me veprat penale dhe dënimet.
