lang: sq
source_version: 1
question: Kush numëron votat e hedhura gjatë votimeve me urnë në një komunë (Gemeinde) të kantonit të
  Cyrihut?
options:
  a: Autoriteti i mirëqenies sociale
  b: Zyra zgjedhore
  c: Sekretarja e komunës vetëm
  d: Prokuroria publike
explanation: Zyra zgjedhore përcakton rezultatet e komunës gjatë votimeve dhe zgjedhjeve. Ajo përbëhet
  nga disa persona, në mënyrë që numërimi i votave të kryhet saktë dhe në mënyrë të gjurmueshme.
