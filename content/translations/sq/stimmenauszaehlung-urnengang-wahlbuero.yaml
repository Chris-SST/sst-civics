    question_de: Wer zählt die abgegebenen Stimmen bei Urnenabstimmungen in einer Gemeinde des Kantons
      Zürich?
    options_de:
      a: Die Sozialbehörde
      b: Das Wahlbüro
      c: Nur die Gemeindeschreiberin
      d: Die Staatsanwaltschaft
    explanation_de: Das Wahlbüro legt die Ergebnisse der Gemeinde bei Abstimmungen und Wahlen fest. Es
      besteht aus mehreren Personen, damit die Auszählung der Stimmen korrekt und nachvollziehbar durchgeführt
      wird.
