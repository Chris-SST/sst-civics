question: Në cilin vend të Zvicrës mbahet rregullisht takimi vjetor i Forumit Ekonomik Botëror (WEF)?
options:
  a: Në Davos
  b: Në Luzern
  c: Në Montreux
  d: Në Interlaken
explanation: Forumi Ekonomik Botëror takohet rregullisht në Davos, në kantonin Graubünden. Aty mblidhen
  ekspertë nga politika dhe ekonomia. Konfederata mbështet sigurinë e takimit.
