    question_de: Welche der folgenden Einheiten gehört zur Bundesverwaltung?
    options_de:
      a: Nationalrat
      b: Bundesversammlung
      c: Bundesgericht
      d: Departement für Justiz und Polizei
    explanation_de: Die Bundesverwaltung ist in Departemente gegliedert. Das Departement für Justiz und
      Polizei ist eines davon und gehört zur Verwaltung, die vom Bundesrat geleitet wird. Der Nationalrat
      und die Bundesversammlung gehören zum Parlament, während das Bundesgericht zur Justiz gehört.
