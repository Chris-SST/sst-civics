id: bundesverwaltung-justiz-und-polizeidepartement
lang: sq
source_version: 1
question: Cila nga njësitë e mëposhtme i përket administratës federale (Bundesverwaltung)?
options:
  a: Këshilli Kombëtar (Nationalrat)
  b: Kuvendi Federal (Bundesversammlung)
  c: Gjykata Federale (Bundesgericht)
  d: Departamenti i Drejtësisë dhe i Policisë
explanation: Administrata federale është e ndarë në departamente. Departamenti i Drejtësisë dhe i Policisë
  është një prej tyre dhe i përket administratës që drejtohet nga Këshilli Federal (Bundesrat). Këshilli
  Kombëtar dhe Kuvendi Federal i përkasin Parlamentit, ndërsa Gjykata Federale i përket gjyqësorit.
