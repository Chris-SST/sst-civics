question: Me cilën zonë ekonomike tregton Zvicra më shumë në total?
options:
  a: Me shtetet e Lindjes së Mesme
  b: Me shtetet aziatike
  c: Me Bashkimin Evropian
  d: Me Shtetet e Bashkuara të Amerikës
explanation: Bashkimi Evropian është partneri tregtar më i rëndësishëm i Zvicrës. Një pjesë e madhe e
  importeve dhe e eksporteve kalon nëpërmjet shteteve të BE-së. Prandaj marrëdhëniet me BE-në janë shumë
  të rëndësishme për ekonominë zvicerane.
