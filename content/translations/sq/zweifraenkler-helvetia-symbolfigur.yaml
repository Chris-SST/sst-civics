id: zweifraenkler-helvetia-symbolfigur
lang: sq
source_version: 1
question: Cila figurë simbolike është e paraqitur në monedhën dyfrangëshe (Zweifränkler)?
options:
  a: Matterhorni
  b: Helvetia
  c: Wilhelm Tell
  d: Një anëtar i Këshillit Federal (Bundesrat) zviceran
explanation: Në monedhën zvicerane dyfrangëshe shihet Helvetia, figura simbolike femërore e Konfederatës.
  Ajo përfaqëson Zvicrën si komb. Helvetia shfaqet edhe në monedha të tjera dhe në pulla postare.
