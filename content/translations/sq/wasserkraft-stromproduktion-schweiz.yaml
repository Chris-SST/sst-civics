id: wasserkraft-stromproduktion-schweiz
lang: sq
source_version: 1
question: Zvicra ka ujë në bollëk. Si përdoret ai për prodhimin e energjisë elektrike?
options:
  a: Në centralet me gaz
  b: Në rafineritë e naftës
  c: Në centralet hidroelektrike
  d: Në centralet me qymyr
explanation: Uji i lumenjve dhe i liqeneve artificiale vë në lëvizje turbinat në centralet hidroelektrike.
  Energjia ujore është në Zvicër një burim qendror vendas i energjisë elektrike.
