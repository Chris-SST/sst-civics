    question_de: Die Schweiz hat Wasser im Überfluss. Wie wird es zur Erzeugung von elektrischer Energie
      genutzt?
    options_de:
      a: In Gaskraftwerken
      b: In Erdölraffinerien
      c: In Wasserkraftwerken
      d: In Kohlekraftwerken
    explanation_de: Das Wasser der Flüsse und der Stauseen setzt in den Wasserkraftwerken die Turbinen
      in Bewegung. Die Wasserkraft ist in der Schweiz eine zentrale einheimische Quelle für elektrische
      Energie.
