id: bundesebene-gesetze-erlass-parlament
lang: sq
source_version: 1
question: Cili autoritet nnnxjerr ligjet në nivel federal?
options:
  a: Kuvendi Federal (Bundesversammlung), pra Këshilli Kombëtar (Nationalrat) dhe Këshilli i Shteteve
    (Ständerat)
  b: Banka Kombëtare Zvicerane
  c: Kancelaria Federale (Bundeskanzlei)
  d: Konferenca e qeverive kantonale
explanation: Kuvendi Federal është parlamenti i Konfederatës dhe përbëhet nga Këshilli Kombëtar dhe Këshilli
  i Shteteve. Ai është përgjegjës për legjislacionin. Kancelaria Federale, në të kundërt, mbështet Këshillin
  Federal (Bundesrat) si njësi shtabi.
