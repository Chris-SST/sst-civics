id: staendemehr-mehrheit-der-kantone
lang: sq
source_version: 1
question: Çfarë do të thotë termi «shumica e kantoneve» (Ständemehr) te votimet federale?
options:
  a: Shumica e kantoneve duhet të miratojë projektin.
  b: Shumica e komunave (Gemeinde) duhet të miratojë projektin.
  c: Shumica e partive duhet të miratojë projektin.
  d: Shumica e anëtarëve të Këshillit të Shteteve (Ständerat) duhet të jetë e pranishme.
explanation: Shumica e kantoneve kërkon që shumica e kantoneve të miratojë një projekt. Vota e një kantoni
  numërohet sipas rezultatit të votimit në atë kanton. Për ndryshimet e kushtetutës nevojitet, përveç
  shumicës së popullit (Volksmehr), edhe shumica e kantoneve.
