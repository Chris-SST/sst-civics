question: Sa përfaqësues dërgon kantoni i Zyrihut në Këshillin e Shteteve (Ständerat)?
options:
  a: Një përfaqësues
  b: Katër përfaqësues
  c: Gjashtë përfaqësues
  d: Dy përfaqësues
explanation: Kantoni i Zyrihut është kanton i plotë dhe ka dy vende në Këshillin e Shteteve. Anëtarët
  e Këshillit të Shteteve zgjidhen nga votuesit e kantonit. Vetëm gjysmëkantonet kanë nga një përfaqësues.
