id: empfehlung-bundesrat-parlament-volksinitiative
lang: sq
source_version: 1
question: Kush u jep qytetarëve me të drejtë vote, para votimit mbi një nismë popullore (Volksinitiative)
  federale, një rekomandim nëse duhet ta miratojnë apo ta refuzojnë nismën?
options:
  a: Këshilli Federal (Bundesrat) dhe Parlamenti
  b: Qeveritë e kantoneve
  c: Kancelaria Federale (Bundeskanzlei) vetëm
  d: Gjykata Federale (Bundesgericht)
explanation: Pasi një nismë popullore ka arritur të realizohet, Këshilli Federal dhe Parlamenti marrin
  qëndrim ndaj saj. Parlamenti u rekomandon qytetarëve me të drejtë vote miratimin ose refuzimin. Ky rekomandim
  gjendet edhe në broshurën shpjeguese të votimit, të cilën qytetarët me të drejtë vote e marrin para
  votimit.
