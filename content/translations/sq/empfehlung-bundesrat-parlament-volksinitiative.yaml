    question_de: Wer gab den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative
      eine Empfehlung, ob sie die Initiative annehmen oder ablehnen sollen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Kantonsregierungen
      c: Nur die Bundeskanzlei
      d: Das Bundesgericht
    explanation_de: Nachdem eine Volksinitiative zustande gekommen ist, nehmen der Bundesrat und das Parlament
      dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten die Annahme oder die Ablehnung. Diese
      Empfehlung steht auch in der erläuternden Abstimmungsbroschüre, die die Stimmberechtigten vor der
      Abstimmung erhalten.
