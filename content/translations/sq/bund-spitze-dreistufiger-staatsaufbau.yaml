id: bund-spitze-dreistufiger-staatsaufbau
lang: sq
source_version: 2
question: Zvicra është e ndërtuar mbi tre nivele shtetërore. Cili nivel është më i larti?
options:
  a: Komunat (Gemeinden)
  b: Konfederata
  c: Kantonet
  d: Rrethet
explanation: Konfederata është niveli më i lartë i tre niveleve shtetërore. Poshtë saj vijnë kantonet
  dhe pastaj komunat. Rrethet nuk janë nivel më vete shtetëror, por në disa kantone janë vetëm njësi administrative
  brenda kantonit.
