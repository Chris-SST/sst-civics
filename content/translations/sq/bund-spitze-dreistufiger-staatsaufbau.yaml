    question_de: Die Schweiz ist auf drei staatlichen Ebenen aufgebaut. Welche Ebene ist die höchste?
    options_de:
      a: Die Gemeinden
      b: Der Bund
      c: Die Kantone
      d: Die Bezirke
    explanation_de: Der Bund ist die höchste der drei staatlichen Ebenen. Darunter kommen die Kantone
      und dann die Gemeinden. Die Bezirke sind keine eigene staatliche Ebene, sondern in einigen Kantonen
      nur Verwaltungseinheiten innerhalb des Kantons.
