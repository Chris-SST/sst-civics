    question_de: Aus welchem Grund suchten in den 1990er Jahren viele Menschen aus dem ehemaligen Jugoslawien
      Zuflucht in der Schweiz?
    options_de:
      a: Sie wollten an Schweizer Universitäten studieren.
      b: Sie flohen vor einer grossen Naturkatastrophe.
      c: Sie flohen vor dem Krieg in ihrem Land.
      d: Sie wurden von Schweizer Firmen als Saisonarbeiter (Saisonniers) angeworben.
    explanation_de: Der Zerfall Jugoslawiens führte in den 1990er Jahren zu Kriegen. Deshalb suchten viele
      Menschen Schutz in der Schweiz. Ein Teil von ihnen ist geblieben und lebt heute hier.
