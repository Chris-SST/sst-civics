id: fluechtlinge-ex-jugoslawien-neunzigerjahre
lang: sq
source_version: 1
question: Për ç'arsye shumë njerëz nga ish-Jugosllavia kërkuan strehim në Zvicër në vitet 1990?
options:
  a: Ata donin të studionin në universitetet zvicerane.
  b: Ata ikën nga një fatkeqësi e madhe natyrore.
  c: Ata ikën nga lufta në vendin e tyre.
  d: Ata u rekrutuan nga firma zvicerane si punëtorë sezonalë (Saisonniers).
explanation: Shpërbërja e Jugosllavisë çoi në vitet 1990 në luftëra. Prandaj shumë njerëz kërkuan mbrojtje
  në Zvicër. Një pjesë e tyre ka mbetur dhe jeton sot këtu.
