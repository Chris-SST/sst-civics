id: aussenbeziehungen-zustaendigkeit-bund
lang: sq
source_version: 1
question: Kush është në Zvicër, në parim, përgjegjës për ta konfiguruar marrëdhëniet me shtetet e tjera?
options:
  a: Konferenca e qeverive kantonale
  b: Konfederata
  c: Kantonet së bashku
  d: Komunat (Gemeinden) në kufi
explanation: Sipas Kushtetutës Federale, politika e jashtme është çështje e Konfederatës. Kantonet mund
  të bashkëpunojnë me vendet e huaja në fushat e tyre të përgjegjësisë, por përgjegjësia e përgjithshme
  mbetet te Konfederata.
