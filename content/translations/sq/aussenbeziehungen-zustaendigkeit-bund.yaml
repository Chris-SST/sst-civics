    question_de: Wer ist in der Schweiz grundsätzlich dafür zuständig, die Beziehungen zu anderen Staaten
      zu gestalten?
    options_de:
      a: Die Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone gemeinsam
      d: Die Gemeinden an der Grenze
    explanation_de: Gemäss der Bundesverfassung ist die Aussenpolitik Sache des Bundes. Die Kantone können
      in ihren Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, aber die Gesamtverantwortung
      bleibt beim Bund.
