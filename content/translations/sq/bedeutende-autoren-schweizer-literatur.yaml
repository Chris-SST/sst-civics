question: Cilët dy shkrimtarë janë autorë të rëndësishëm të letërsisë zvicerane?
options:
  a: Günter Grass dhe Heinrich Böll
  b: Thomas Mann dhe Bertolt Brecht
  c: Johann Wolfgang von Goethe dhe Friedrich Schiller
  d: Max Frisch dhe Friedrich Dürrenmatt
explanation: Max Frisch dhe Friedrich Dürrenmatt janë dy shkrimtarë zviceranë shumë të rëndësishëm të
  shekullit të 20-të. Librat dhe pjesët e tyre teatrore njihen edhe jashtë vendit. Autorët në përgjigjet
  e tjera janë shkrimtarë nga Gjermania.
