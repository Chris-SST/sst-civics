question: Në cilin kanton flitet gjuha retoromane?
options:
  a: Në kantonin Fribourg
  b: Në kantonin Ticino
  c: Në kantonin Valais
  d: Në kantonin Graubünden
explanation: Gjuha retoromane është gjuha e katërt kombëtare e Zvicrës. Ajo flitet në kantonin Graubünden.
  Graubünden është i vetmi kanton trigjuhësh i Zvicrës.
