id: obligationenrecht-miete-wohnraum-vorschriften
lang: sq
source_version: 2
question: Në cilin ligj janë përcaktuar rregullat për qiranë e një banese?
options:
  a: Në Kodin e Detyrimeve (Obligationenrecht)
  b: Në Ligjin për punën (Arbeitsgesetz)
  c: Në Kodin Penal (Strafgesetzbuch)
  d: Në Ligjin për trafikun rrugor (Strassenverkehrsgesetz)
explanation: Rregullat për qiranë e banesave gjenden në Kodin e Detyrimeve (OR). Aty përcaktohet, për
  shembull, se çfarë vlen në kontratën e qirasë, sa i lartë mund të jetë çmimi i qirasë dhe si mund të
  ndërpritet kontrata. Kodi Civil (ZGB), në të kundërt, rregullon kryesisht tema si familja, martesa dhe
  trashëgimia.
