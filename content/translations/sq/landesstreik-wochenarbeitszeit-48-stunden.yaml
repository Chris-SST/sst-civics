id: landesstreik-wochenarbeitszeit-48-stunden
lang: sq
source_version: 1
question: Sa orë pune në javë ishin në fuqi në Zvicër pas grevës kombëtare të vitit 1918?
options:
  a: 48 orë
  b: 54 orë
  c: 60 orë
  d: 40 orë
explanation: Greva kombëtare e vitit 1918 ishte një grevë e përgjithshme e punëtorëve. Një nga kërkesat
  që u zbatuan pas saj ishte java me 48 orë pune. Më parë ishin të zakonshme orare pune dukshëm më të
  gjata.
