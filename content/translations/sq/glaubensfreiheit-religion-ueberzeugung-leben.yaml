    question_de: Was umfasst gemäss der Bundesverfassung die Glaubens- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und gemäss ihnen zu leben
      b: Nur die Mitgliedschaft in einer anerkannten Kantonalkirche
      c: Die Pflicht, den Glauben der Eltern beizubehalten
      d: Das Recht, andere zu zwingen, den eigenen Glauben anzunehmen
    explanation_de: Jede Person hat das Recht, ihre Religion und ihre weltanschauliche Überzeugung frei
      zu wählen und gemäss ihnen zu leben. Sie kann auch den Glauben wechseln oder keinen haben. Niemand
      darf gezwungen werden, einen Glauben zu haben.
