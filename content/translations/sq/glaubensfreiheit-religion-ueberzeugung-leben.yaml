id: glaubensfreiheit-religion-ueberzeugung-leben
lang: sq
source_version: 1
question: Çfarë përfshihet sipas Kushtetutës Federale në lirinë e besimit dhe të ndërgjegjes?
options:
  a: E drejta për të pasur një besim dhe një bindje dhe për të jetuar sipas tyre
  b: Vetëm anëtarësimi në një kishë kantonale të njohur
  c: Detyrimi për të ruajtur besimin e prindërve
  d: E drejta për t'i detyruar të tjerët të pranojnë besimin e vet
explanation: Çdo person ka të drejtë ta zgjedhë lirisht fenë dhe bindjen e vet botëkuptimore dhe të jetojë
  sipas tyre. Mund edhe ta ndërrojë besimin ose të mos ketë asnjë. Askush nuk lejohet të detyrohet të
  ketë një besim.
