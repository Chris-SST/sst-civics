    source_version: 1
    question_de: Was änderte sich für die Schweiz mit der Bundesverfassung von 1848?
    options_de:
      a: Sie kehrte wieder zu einem lockeren Bund von Staaten zurück
      b: Sie wurde eine Monarchie mit einem König
      c: Sie wurde ein Bundesstaat, in dem die Kantone unabhängig bleiben
      d: Sie wurde ein Einheitsstaat ohne Kantone
    explanation_de: Im Jahr 1848 entstand der moderne Bundesstaat mit gemeinsamen Institutionen. Die Kantone
      behielten jedoch eigene Aufgaben und eine eigene Staatsbürgerschaft. Diese Aufteilung prägt die
      Schweiz bis heute.
