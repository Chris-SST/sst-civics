id: bundesverfassung-1848-bundesstaat-kantone
lang: sq
source_version: 1
question: Çfarë ndryshoi për Zvicrën me Kushtetutën Federale të vitit 1848?
options:
  a: Ajo u kthye përsëri në një lidhje të lirshme shtetesh
  b: Ajo u bë monarki me një mbret
  c: Ajo u bë shtet federal, ku kantonet mbeten të pavarura
  d: Ajo u bë shtet unitar pa kantone
explanation: Në vitin 1848 lindi shteti modern federal me institucione të përbashkëta. Kantonet megjithatë
  ruajtën detyra të veta dhe një shtetësi të vetën. Ky ndarje karakterizon Zvicrën deri në ditët e sotme.
