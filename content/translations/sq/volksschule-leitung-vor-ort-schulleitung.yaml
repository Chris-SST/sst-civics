    question_de: Wer leitet eine Volksschule im Kanton Zürich direkt in der Schule selbst?
    options_de:
      a: Der Kantonsrat
      b: Die Schulleitung
      c: Der Elternrat
      d: Der Regierungsrat
    explanation_de: Jede Volksschule im Kanton Zürich hat eine Schulleitung, die den Betrieb direkt in
      der Schule selbst leitet und organisiert. Der Regierungsrat und der Kantonsrat arbeiten auf der
      Ebene des Kantons. Der Elternrat bringt die Anliegen der Eltern vor, leitet die Schule aber nicht.
