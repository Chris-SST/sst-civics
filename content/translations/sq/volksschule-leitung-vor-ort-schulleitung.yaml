id: volksschule-leitung-vor-ort-schulleitung
lang: sq
source_version: 2
question: Kush udhëheq drejtpërdrejt një shkollë publike (Volksschule) në kantonin e Cyrihut në vetë shkollën?
options:
  a: Këshilli Kantonal (Kantonsrat)
  b: Drejtimi i shkollës (Schulleitung)
  c: Këshilli i prindërve (Elternrat)
  d: Këshilli Qeveritar (Regierungsrat)
explanation: Çdo shkollë publike në kantonin e Cyrihut ka një drejtim shkolle, i cili e udhëheq dhe e
  organizon veprimtarinë drejtpërdrejt në vetë shkollën. Këshilli Qeveritar dhe Këshilli Kantonal punojnë
  në nivelin e kantonit. Këshilli i prindërve paraqet shqetësimet e prindërve, por nuk e udhëheq shkollën.
