    question_de: Eine Schweizer Bürgerin lebt dauerhaft im Ausland. Wie kann sie an den eidgenössischen
      Wahlen und Abstimmungen teilnehmen?
    options_de:
      a: Sie kann nur abstimmen, wenn sie zu diesem Zweck in die Schweiz reist.
      b: Sie kann nur an Wahlen teilnehmen, aber nicht an Abstimmungen.
      c: Sie kann von ihrem Wohnort im Ausland aus wählen und abstimmen, ohne in die Schweiz zu reisen.
      d: Sie verliert das Stimm- und Wahlrecht auf Ebene des Bundes.
    explanation_de: Auslandschweizer können auf Ebene des Bundes wählen und abstimmen, ohne zu diesem
      Zweck in die Schweiz zu reisen. Dafür müssen sie bei der zuständigen schweizerischen Vertretung
      im Ausland registriert sein und über diese die Eintragung ins Stimmregister beantragen. Die Wahl-
      und Abstimmungsunterlagen werden ihnen danach von ihrer Stimmgemeinde zugesandt.
