id: auslandschweizer-stimmrecht-vom-ausland
lang: sq
source_version: 2
question: Një shtetase zvicerane jeton përgjithmonë jashtë vendit. Si mund të marrë pjesë ajo në zgjedhjet
  dhe votimet federale?
options:
  a: Ajo mund të votojë vetëm nëse udhëton për këtë qëllim në Zvicër.
  b: Ajo mund të marrë pjesë vetëm në zgjedhje, por jo në votime.
  c: Ajo mund të zgjedhë dhe të votojë nga vendbanimi i saj jashtë vendit, pa udhëtuar në Zvicër.
  d: Ajo e humb të drejtën e votës dhe të zgjedhjes në nivel të Konfederatës.
explanation: Zviceranët që jetojnë jashtë vendit mund të zgjedhin dhe të votojnë në nivel të Konfederatës
  pa udhëtuar për këtë qëllim në Zvicër. Për këtë ata duhet të jenë të regjistruar pranë përfaqësisë kompetente
  zvicerane jashtë vendit dhe të kërkojnë përmes saj regjistrimin në regjistrin zgjedhor. Materialet e
  zgjedhjeve dhe të votimeve ua dërgon më pas komuna e tyre e votimit.
