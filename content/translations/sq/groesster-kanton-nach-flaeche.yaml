id: groesster-kanton-nach-flaeche
lang: sq
source_version: 1
question: Cili kanton ka sipërfaqen më të madhe nga të gjithë kantonet zvicerane?
options:
  a: Ticino
  b: Valais
  c: Berna
  d: Graubünden
explanation: Graubünden është kantoni më i madh i Zvicrës sipas sipërfaqes. Ai shtrihet tërësisht në Alpe
  dhe ka shumë lugina e male. Edhe Valais, Berna dhe Ticino janë të mëdhenj, por më të vegjël se Graubünden.
