id: franzoesisch-status-landessprache
lang: sq
source_version: 1
question: Çfarë statusi ka frëngjishtja në Zvicër?
options:
  a: Frëngjishtja është vetëm një gjuhë e huaj në shkollë.
  b: Frëngjishtja është vetëm një gjuhë komunikimi rajonale.
  c: Frëngjishtja është një gjuhë kombëtare.
  d: Frëngjishtja është një gjuhë e pakicës pa status zyrtar.
explanation: Frëngjishtja është një nga gjuhët kombëtare të Zvicrës. Ajo flitet kryesisht në Zvicrën perëndimore
  dhe në nivel të Konfederatës është gjuhë zyrtare.
