    question_de: Welche politische Möglichkeit haben Ausländer im Kanton Zürich, die kein Stimmrecht haben?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können Mitglieder des Kantonsrates wählen.
      c: Sie können sich mit einer Petition an die Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen Personen offen, auch Menschen ohne Stimmrecht. So können
      sie den Behörden Anliegen, Wünsche oder Kritik schriftlich mitteilen. Abstimmen, wählen und Initiativen
      unterschreiben können nur Personen mit Stimmrecht.
