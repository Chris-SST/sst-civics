id: petition-ohne-stimmrecht-zuerich
lang: sq
source_version: 1
question: Çfarë mundësie politike kanë të huajt në kantonin e Cyrihut që nuk kanë të drejtën e votës?
options:
  a: Ata mund të votojnë në kuti për projekte kantonale.
  b: Ata mund të zgjedhin anëtarë të Këshillit Kantonal (Kantonsrat).
  c: Ata mund t'u drejtohen autoriteteve me një peticion.
  d: Ata mund të paraqesin një nismë popullore (Volksinitiative) në kanton.
explanation: E drejta e peticionit është e hapur për të gjitha personat, edhe për njerëzit pa të drejtën
  e votës. Kështu ata mund t'u komunikojnë autoriteteve me shkrim shqetësime, dëshira ose kritika. Të
  votojnë, të zgjedhin dhe të nënshkruajnë nisma mund vetëm personat me të drejtë vote.
