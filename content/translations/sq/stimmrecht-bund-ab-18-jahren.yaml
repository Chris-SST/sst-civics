id: stimmrecht-bund-ab-18-jahren
lang: sq
source_version: 2
question: Kush ka të drejtë të votojë dhe të zgjedhë në nivel Konfederate?
options:
  a: Shtetasit zviceranë nga mosha 20 vjeç
  b: Të gjitha personat me leje vendosjeje (Niederlassungsbewilligung) (leja C) nga mosha 18 vjeç
  c: Shtetasit zviceranë nga mosha 18 vjeç
  d: Të gjitha personat me banim në Zvicër nga mosha 16 vjeç
explanation: Në Konfederatë, zviceranët dhe zviceranet kanë të drejtë të votojnë dhe të zgjedhin nga ditëlindja
  e 18-të. Të huajt nuk e kanë këtë të drejtë në nivel Konfederate, as me leje vendosjeje (leja C). Edhe
  zviceranët dhe zviceranet që jetojnë jashtë vendit mund të marrin pjesë, nëse regjistrohen në regjistrin
  zgjedhor.
