    question_de: Wer hat auf Bundesebene das Stimm- und Wahlrecht?
    options_de:
      a: Schweizer Staatsangehörige ab 20 Jahren
      b: Alle Personen mit Niederlassungsbewilligung (C-Bewilligung) ab 18 Jahren
      c: Schweizer Staatsangehörige ab 18 Jahren
      d: Alle in der Schweiz wohnhaften Personen ab 16 Jahren
    explanation_de: Auf Bundesebene haben Schweizerinnen und Schweizer ab dem 18. Geburtstag das Stimm-
      und Wahlrecht. Ausländerinnen und Ausländer haben dieses Recht auf Bundesebene nicht, auch nicht
      mit Niederlassungsbewilligung (C-Bewilligung). Auch im Ausland lebende Schweizerinnen und Schweizer
      können teilnehmen, wenn sie sich im Stimmregister eintragen lassen.
