id: rechtsstaat-keine-festnahme-ohne-grund
lang: sq
source_version: 1
question: Çfarë vlen në një shtet juridik (Rechtsstaat) për arrestimin dhe burgimin?
options:
  a: Shteti nuk lejohet të arrestojë dhe të burgosë askënd pa arsye.
  b: Shteti lejohet t'i mbajë personat të privuar nga liria sipas gjykimit të vet.
  c: Qeveria lejohet t'i marrë kritikët në paraburgim si masë paraprake.
  d: Vetëm të huajt (burra dhe gra) lejohen të arrestohen pa arsye.
explanation: Në një shtet juridik, veprimi i shtetit është i lidhur me ligjin. Një arrestim ose burgim
  kërkon një arsye ligjore. Kjo e mbron lirinë e njerëzve nga arbitrariteti.
