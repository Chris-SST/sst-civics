    question_de: Was gilt in einem Rechtsstaat für Verhaftung und Inhaftierung?
    options_de:
      a: Der Staat darf niemanden ohne Grund verhaften und einsperren.
      b: Der Staat darf Personen nach eigenem Ermessen ihrer Freiheit berauben.
      c: Die Regierung darf Kritiker vorsorglich in Untersuchungshaft nehmen.
      d: Nur Ausländer (Männer und Frauen) dürfen ohne Grund verhaftet werden.
    explanation_de: In einem Rechtsstaat ist das Handeln des Staates an das Gesetz gebunden. Eine Verhaftung
      oder Inhaftierung erfordert einen gesetzlichen Grund. Dies schützt die Freiheit der Menschen vor
      Willkür.
