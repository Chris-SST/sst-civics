id: arbeitsvertrag-inhalt-lohnhoehe
lang: sq
source_version: 1
question: Çfarë përcaktohet, ndër të tjera, në kontratën e punës midis punëdhënësit dhe punëmarrëses?
options:
  a: Shuma e pagës
  b: Shuma e pensionit të sigurimit të pleqërisë dhe të të mbijetuarve (AHV)
  c: Shuma e tatimit mbi vlerën e shtuar
  d: Shuma e primit të arkës së sigurimit shëndetësor (Krankenkasse)
explanation: Në kontratën e punës merren vesh kushtet më të rëndësishme të punës, për shembull veprimtaria,
  koha e punës dhe paga. Pensioni i sigurimit të pleqërisë dhe të të mbijetuarve, tatimi mbi vlerën e
  shtuar dhe primi i arkës së sigurimit shëndetësor nuk përcaktohen në kontratën e punës.
