id: emilie-lieberherr-frauenstimmrecht
lang: sq
source_version: 1
question: Për çfarë angazhohej politikania zyriheze Emilie Lieberherr?
options:
  a: Për ndërtimin e aeroportit të Zyrihut
  b: Për anëtarësimin e Zvicrës në OKB
  c: Për të drejtën e votës dhe të zgjedhjes së grave
  d: Për heqjen e kuvendit të komunës (Gemeindeversammlung)
explanation: Emilie Lieberherr luftoi në vitet 1960 për të drejtën e votës dhe të zgjedhjes së grave.
  Në nivel të Konfederatës u prezantua në vitin 1971. Në kantonin e Zyrihut vlen që nga viti 1970.
