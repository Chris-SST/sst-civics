id: bilaterale-eins-basis-eu-beziehungen
lang: sq
source_version: 1
question: Cilat marrëveshje, të miratuara nga populli në vitin 2000, përbëjnë bazën e marrëdhënieve të
  sotme të Zvicrës me BE-në?
options:
  a: Marrëveshjet dypalëshe I (Bilaterale I)
  b: Marrëveshja për EEA-në
  c: Marrëveshja e Shengenit vetëm
  d: Marrëveshja e anëtarësimit në BE
explanation: Populli votues miratoi Marrëveshjet dypalëshe I në vitin 2000. Ato rregullojnë qasjen në
  disa fusha të tregut të brendshëm, për shembull lirinë e lëvizjes së personave dhe transportin tokësor.
  Marrëveshjen për EEA-në populli nuk e miratoi në vitin 1992.
