    question_de: Welche Abkommen, die 2000 vom Volk angenommen wurden, bilden die Grundlage der heutigen
      Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen Abkommen I
      b: Das EWR-Abkommen
      c: Nur das Schengen-Abkommen
      d: Das EU-Beitrittsabkommen
    explanation_de: Das stimmberechtigte Volk hat die Bilateralen Abkommen I im Jahr 2000 angenommen.
      Sie regeln den Zugang in mehreren Bereichen des Binnenmarktes, zum Beispiel die Personenfreizügigkeit
      und den Landverkehr. Das EWR-Abkommen hat das Volk 1992 nicht angenommen.
