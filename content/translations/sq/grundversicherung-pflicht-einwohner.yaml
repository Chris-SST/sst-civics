    question_de: Für wen gilt in der Schweiz die obligatorische Grundversicherung für medizinische Behandlungen?
    options_de:
      a: Nur für Personen mit Schweizer Bürgerrecht
      b: Nur für Personen, die arbeiten und einen Lohn erhalten
      c: Nur für Personen mit niedrigem Einkommen
      d: Für alle Einwohner und Einwohnerinnen der Schweiz
    explanation_de: Die obligatorische Krankenversicherung gilt für alle Personen, die in der Schweiz
      leben. Die Staatsangehörigkeit, die berufliche Tätigkeit und das Einkommen spielen in dieser Hinsicht
      keine Rolle.
