id: grundversicherung-pflicht-einwohner
lang: sq
source_version: 1
question: Për kë vlen në Zvicër sigurimi themelor i detyrueshëm për trajtimet mjekësore?
options:
  a: Vetëm për personat me shtetësi zvicerane (Bürgerrecht)
  b: Vetëm për personat që punojnë dhe marrin pagë
  c: Vetëm për personat me të ardhura të ulëta
  d: Për të gjithë banorët dhe banoret e Zvicrës
explanation: Sigurimi i detyrueshëm shëndetësor vlen për të gjithë personat që jetojnë në Zvicër. Shtetësia,
  aktiviteti profesional dhe të ardhurat nuk kanë asnjë rëndësi në këtë drejtim.
