id: tessin-gesprochene-sprache
lang: sq
source_version: 1
question: Cila gjuhë flitet në kantonin Tiçino?
options:
  a: Retoromanisht
  b: Frëngjisht
  c: Italisht
  d: Gjermanisht
explanation: Në Tiçino, italishtja është gjuha e popullsisë dhe gjuha zyrtare e kantonit. Italishtja është
  një nga katër gjuhët kombëtare të Zvicrës. Ajo flitet edhe në disa pjesë të Graubündenit.
