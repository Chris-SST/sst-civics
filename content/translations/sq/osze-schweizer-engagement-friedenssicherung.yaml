id: osze-schweizer-engagement-friedenssicherung
lang: sq
source_version: 2
question: Për çfarë angazhohet Zvicra në Organizatën për Sigurinë dhe Bashkëpunimin në Evropë (OSBE)?
options:
  a: Për paqen dhe sigurinë në Evropë, për shembull në Evropën Lindore dhe në Azinë Qendrore
  b: Për shpërndarjen e fondeve mbështetëse në Evropën Perëndimore
  c: Për futjen e një monedhe të përbashkët
  d: Për uljen e tarifave doganore në tregtinë botërore
explanation: Zvicra është anëtare themeluese e OSBE-së dhe e shfrytëzon atë për të nxitur paqen dhe sigurinë
  në Evropë. OSBE-ja është aktive me misione në terren veçanërisht në Evropën Lindore dhe Juglindore dhe
  në Azinë Qendrore. Në vitin 2026 Zvicra ushtron kryesinë e OSBE-së.
