id: economiesuisse-wirtschaftsdachverband
lang: sq
source_version: 2
question: Çfarë është Economiesuisse?
options:
  a: Një arkë papunësie e Konfederatës
  b: Zyra Federale e Ekonomisë
  c: Organizata ombrellë e ekonomisë, që përfaqëson interesat e ndërmarrjeve
  d: Një sindikatë për të punësuarit në tregtinë me pakicë
explanation: Economiesuisse është organizata ombrellë e ekonomisë zvicerane dhe përfaqëson interesat e
  ndërmarrjeve. Ajo nuk është organ shtetëror dhe nuk është sindikatë.
