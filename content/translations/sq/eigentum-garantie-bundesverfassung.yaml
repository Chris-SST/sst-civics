    question_de: Welches Grundrecht schützt in der Schweiz die Häuser, das Land und das übrige Vermögen
      von Privatpersonen?
    options_de:
      a: Die Eigentumsgarantie
      b: Die Glaubens- und Gewissensfreiheit
      c: Die Niederlassungsfreiheit
      d: Die Versammlungsfreiheit
    explanation_de: Die Bundesverfassung garantiert das Eigentum in Artikel 26. Der Staat darf das Eigentum
      nur unter bestimmten Bedingungen einschränken, zum Beispiel auf gesetzlicher Grundlage und mit voller
      Entschädigung im Fall einer Enteignung.
