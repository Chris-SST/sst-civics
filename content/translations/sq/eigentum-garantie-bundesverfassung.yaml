id: eigentum-garantie-bundesverfassung
lang: sq
source_version: 1
question: Cila e drejtë themelore mbron në Zvicër shtëpitë, tokat dhe pasuritë e tjera të personave privatë?
options:
  a: Garancia e pronës
  b: Liria e besimit dhe e ndërgjegjes
  c: Liria e vendosjes
  d: Liria e tubimit
explanation: Kushtetuta Federale e garanton pronën në nenin 26. Shteti mund ta kufizojë pronën vetëm në
  kushte të caktuara, për shembull me bazë ligjore dhe me dëmshpërblim të plotë në rast shpronësimi.
