    question_de: Was gilt für Personen, die in der Schweiz wohnen, in Bezug auf die Krankenversicherung?
    options_de:
      a: Sie müssen nur versichert sein, wenn sie in der Schweiz arbeiten
      b: Sie sind gesetzlich verpflichtet, eine Krankenversicherung abzuschliessen
      c: Sie müssen nur versichert sein, wenn sie älter als 50 Jahre sind
      d: Sie können frei entscheiden, ob sie sich versichern wollen
    explanation_de: Das Krankenversicherungsgesetz verpflichtet jede Person mit Wohnsitz in der Schweiz,
      eine Krankenversicherung zu haben. Man muss sich innerhalb von drei Monaten nach der Geburt oder
      nach der Wohnsitznahme versichern.
