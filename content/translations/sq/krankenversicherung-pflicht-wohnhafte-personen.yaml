id: krankenversicherung-pflicht-wohnhafte-personen
lang: sq
source_version: 1
question: Çfarë vlen për personat që banojnë në Zvicër në lidhje me sigurimin shëndetësor?
options:
  a: Ata duhet të sigurohen vetëm nëse punojnë në Zvicër
  b: Ata janë të detyruar me ligj të lidhin një sigurim shëndetësor
  c: Ata duhet të sigurohen vetëm nëse janë më të vjetër se 50 vjeç
  d: Ata mund të vendosin lirisht nëse duan të sigurohen
explanation: Ligji për sigurimin shëndetësor e detyron çdo person me vendbanim në Zvicër të ketë sigurim
  shëndetësor. Duhet të sigurohet brenda tre muajve pas lindjes ose pas vendosjes së vendbanimit.
