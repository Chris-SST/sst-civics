id: frauenstimmrecht-bund-seit-1971
lang: sq
source_version: 1
question: Që nga kur lejohen gratë në Zvicër të zgjedhin dhe të votojnë në nivel kombëtar?
options:
  a: Që nga viti 1918
  b: Që nga viti 1848
  c: Që nga viti 1971
  d: Që nga viti 1991
explanation: Në nivel të Konfederatës, e drejta e votës për gratë u prezantua në vitin 1971. Disa kantone
  dhe komuna (Gemeinden) e njihnin më herët, ndërsa të tjerat e prezantuan vetëm më vonë. Si kantoni i
  fundit pasoi Appenzell Innerrhoden në vitin 1990.
