    question_de: Seit wann dürfen Frauen in der Schweiz auf nationaler Ebene wählen und abstimmen?
    options_de:
      a: Seit dem Jahr 1918
      b: Seit dem Jahr 1848
      c: Seit dem Jahr 1971
      d: Seit dem Jahr 1991
    explanation_de: Auf Ebene des Bundes wurde das Stimmrecht für Frauen im Jahr 1971 eingeführt. Einige
      Kantone und Gemeinden kannten es früher, während andere es erst später einführten. Als letzter Kanton
      folgte Appenzell Innerrhoden im Jahr 1990.
