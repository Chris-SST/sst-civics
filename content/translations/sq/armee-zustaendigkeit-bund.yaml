id: armee-zustaendigkeit-bund
lang: sq
source_version: 1
question: Cili nivel shtetëror është përgjegjës për ushtrinë?
options:
  a: Kantonet
  b: Konfederata
  c: Rrethet
  d: Komunat (Gemeinden)
explanation: Çështjet ushtarake janë në kompetencë të Konfederatës. Ajo rregullon ushtrinë dhe detyrat
  e saj në Kushtetutën Federale dhe në ligjet federale. Kantonet marrin pjesë në zbatim, për shembull
  në rekrutim.
