    question_de: Welche staatliche Ebene ist für die Armee zuständig?
    options_de:
      a: Die Kantone
      b: Der Bund
      c: Die Bezirke
      d: Die Gemeinden
    explanation_de: Militärische Angelegenheiten fallen in die Zuständigkeit des Bundes. Er regelt die
      Armee und ihre Aufgaben in der Bundesverfassung und in den Bundesgesetzen. Die Kantone beteiligen
      sich an der Umsetzung, zum Beispiel bei der Rekrutierung.
