id: grenzgaenger-definition-wohnort-arbeitsort
lang: sq
source_version: 2
question: Kush konsiderohet në Zvicër punëtor kufitar (Grenzgänger)?
options:
  a: Një person që punon në Zvicër, por ka vendbanimin jashtë vendit dhe kthehet rregullisht atje
  b: Një person që punon në doganë dhe kontrollon kufirin shtetëror
  c: Një person që kalon kufirin pa leje për të punuar këtu
  d: Një person që banon në një kanton dhe punon çdo ditë në një kanton tjetër
explanation: Punëtorët kufitarë e kanë vendin e punës në Zvicër, por banojnë në një vend tjetër. Ata kanë
  nevojë për një leje për punëtorë kufitarë dhe kthehen rregullisht, të paktën një herë në javë, në vendbanimin
  e tyre jashtë vendit. Ai që lëviz vetëm mes dy kantoneve nuk është punëtor kufitar.
