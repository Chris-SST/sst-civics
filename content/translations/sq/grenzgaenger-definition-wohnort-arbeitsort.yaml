    question_de: Wer gilt in der Schweiz als Grenzgänger?
    options_de:
      a: Eine Person, die in der Schweiz arbeitet, aber ihren Wohnsitz im Ausland hat und regelmässig
        dorthin zurückkehrt
      b: Eine Person, die beim Zoll arbeitet und die Staatsgrenze kontrolliert
      c: Eine Person, die die Grenze ohne Bewilligung überquert, um hier zu arbeiten
      d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
    explanation_de: Grenzgänger haben ihren Arbeitsort in der Schweiz, wohnen aber in einem anderen Land.
      Sie benötigen eine Grenzgängerbewilligung und kehren regelmässig, mindestens einmal pro Woche, an
      ihren Wohnsitz im Ausland zurück. Wer sich nur zwischen zwei Kantonen bewegt, ist kein Grenzgänger.
