id: gotthard-basistunnel-laengster-eisenbahntunnel
lang: sq
source_version: 1
question: Çfarë e dallon Tunelin Bazë të Gotardit në krahasim me tunelet e tjera në botë?
options:
  a: Është tuneli hekurudhor më i gjatë në botë.
  b: Është tuneli hekurudhor më i lartë në botë.
  c: Është tuneli rrugor më i gjatë në botë.
  d: Është tuneli hekurudhor më i vjetër në Evropë.
explanation: Tuneli Bazë i Gotardit është tuneli hekurudhor më i gjatë në botë. Ai lidh Zvicrën veriore
  me Ticinon dhe është pjesë e rëndësishme e boshtit veri-jug përmes Alpeve.
