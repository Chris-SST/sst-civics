    question_de: Welche überlieferte Tradition der Schweizer Landbevölkerung ist eine Art des Singens,
      bei der die Stimme schnell zwischen Bruststimme und Kopfstimme wechselt?
    options_de:
      a: Das Alphornblasen
      b: Das Jodeln
      c: Hornussen
      d: Das Fahnenschwingen
    explanation_de: Beim Jodeln wechselt die Stimme schnell zwischen Bruststimme und Kopfstimme. Das Jodeln
      ist eine überlieferte Tradition der Schweizer Landbevölkerung. Der Naturjodel braucht keine Worte,
      aber viele Jodellieder haben einen Text.
