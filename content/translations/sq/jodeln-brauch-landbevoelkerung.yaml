id: jodeln-brauch-landbevoelkerung
lang: sq
source_version: 2
question: Cila traditë e trashëguar e popullsisë rurale zvicerane është një mënyrë të kënduari, ku zëri
  ndërron shpejt midis zërit të gjoksit dhe zërit të kokës?
options:
  a: Fryrja e Alphorn-it
  b: Jodeli (Jodeln)
  c: Hornussen
  d: Tundja e flamurit
explanation: Në jodel zëri ndërron shpejt midis zërit të gjoksit dhe zërit të kokës. Jodeli është një
  traditë e trashëguar e popullsisë rurale zvicerane. Jodeli natyror nuk ka nevojë për fjalë, por shumë
  këngë jodeli kanë tekst.
