id: jass-klassisches-schweizer-kartenspiel
lang: sq
source_version: 1
question: Cila lojë me letra konsiderohet në Zvicër si loja klasike me letra e vendit?
options:
  a: Bridge
  b: Jass
  c: Poker
  d: Rommé
explanation: Jass konsiderohet si loja tipike zvicerane me letra. Zakonisht luhet në katër persona, në
  dy ekipe, shpesh me letra franceze ose me letra të Zvicrës gjermanishtfolëse. Luhet në shumë familje
  dhe në shumë bufe e restorante të thjeshta (Beizen).
