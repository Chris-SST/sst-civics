    question_de: Wer beschliesst die Mehrheit der neuen Bundesgesetze der Eidgenossenschaft?
    options_de:
      a: Das Bundesgericht
      b: Nur der Bundesrat
      c: Die Parlamente der Kantone
      d: Der Nationalrat und der Ständerat
    explanation_de: Die Mehrheit der neuen Bundesgesetze wird von beiden Kammern des Parlaments verabschiedet.
      Der Bundesrat bereitet die Entwürfe vor, entscheidet aber nicht allein. Gegen ein Gesetz kann das
      Volk ein Referendum ergreifen.
