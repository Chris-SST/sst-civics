id: neue-bundesgesetze-beschluss-kammern
lang: sq
source_version: 1
question: Kush miraton shumicën e ligjeve të reja federale të Konfederatës?
options:
  a: Gjykata Federale (Bundesgericht)
  b: Këshilli Federal (Bundesrat) vetëm
  c: Parlamentet e kantoneve
  d: Këshilli Kombëtar (Nationalrat) dhe Këshilli i Shteteve (Ständerat)
explanation: Shumica e ligjeve të reja federale miratohen nga të dyja dhomat e Parlamentit. Këshilli Federal
  përgatit projektet, por nuk vendos vetëm. Kundër një ligji populli mund të ngrejë një referendum.
