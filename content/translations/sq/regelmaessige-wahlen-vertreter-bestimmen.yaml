    question_de: Welche Bedeutung haben regelmässige Wahlen in einer Demokratie?
    options_de:
      a: Die Bevölkerung entscheidet selbst, wer sie vertritt.
      b: Die Regierung ernennt ihre Nachfolger selbst.
      c: Die Parteien legen die Vertretung unter sich fest.
      d: Das Gericht entscheidet, wer ein öffentliches Amt erhält.
    explanation_de: Bei Wahlen entscheiden die stimmberechtigten Bürgerinnen und Bürger, wer sie im Parlament
      oder in der Regierung vertritt. Da die Wahlen regelmässig stattfinden, können sie die Personen bestätigen
      oder durch andere ersetzen. So behält die Bevölkerung ihren Einfluss auf die Politik.
