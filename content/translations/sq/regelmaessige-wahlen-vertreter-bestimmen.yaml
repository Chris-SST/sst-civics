id: regelmaessige-wahlen-vertreter-bestimmen
lang: sq
source_version: 1
question: Çfarë rëndësie kanë zgjedhjet e rregullta në një demokraci?
options:
  a: Popullsia vendos vetë se kush e përfaqëson.
  b: Qeveria emëron vetë pasardhësit e saj.
  c: Partitë e përcaktojnë përfaqësimin mes tyre.
  d: Gjykata vendos se kush merr një detyrë publike.
explanation: Në zgjedhje, qytetarët me të drejtë vote vendosin se kush i përfaqëson ata në parlament ose
  në qeveri. Meqenëse zgjedhjet mbahen rregullisht, ata mund t'i konfirmojnë personat ose t'i zëvendësojnë
  me të tjerë. Kështu popullsia ruan ndikimin e saj mbi politikën.
