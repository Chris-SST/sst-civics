    question_de: Was wird in einem Mietvertrag festgelegt?
    options_de:
      a: Die Rechte der Nachbarn im Gebäude
      b: Die Höhe der Steuern der Mieter
      c: Die Pflichten der Gemeinde gegenüber den Mietern
      d: Die Rechte und Pflichten der Vermieter und der Mieter
    explanation_de: Der Mietvertrag regelt das Verhältnis zwischen der Person, die vermietet, und der
      Person, die mietet. Dazu gehören zum Beispiel der Mietzins und die Dauer der Miete. Das Obligationenrecht
      enthält die gesetzlichen Regeln dafür.
