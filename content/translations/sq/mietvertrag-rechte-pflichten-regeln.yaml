id: mietvertrag-rechte-pflichten-regeln
lang: sq
source_version: 1
question: Çfarë përcaktohet në një kontratë qiraje?
options:
  a: Të drejtat e fqinjëve në ndërtesë
  b: Lartësia e taksave të qiramarrësve
  c: Detyrimet e komunës (Gemeinde) ndaj qiramarrësve
  d: Të drejtat dhe detyrimet e qiradhënësve dhe të qiramarrësve
explanation: Kontrata e qirasë rregullon marrëdhënien mes personit që jep me qira dhe personit që merr
  me qira. Kjo përfshin, për shembull, qiranë dhe kohëzgjatjen e qirasë. Ligji i detyrimeve (Obligationenrecht)
  përmban rregullat ligjore për këtë.
