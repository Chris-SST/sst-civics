question: Në cilën datë e feston Zvicra festën e saj kombëtare?
options:
  a: Më 12 shtator
  b: Më 1 gusht
  c: Më 11 nëntor
  d: Më 1 maj
explanation: 1 gushti është festa kombëtare e Zvicrës. Ai kujton Letrën e Konfederatës të vitit 1291.
  E festojnë me zjarre, fishekzjarre dhe fjalime.
