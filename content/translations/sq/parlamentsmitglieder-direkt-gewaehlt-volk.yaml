id: parlamentsmitglieder-direkt-gewaehlt-volk
lang: sq
source_version: 2
question: Kush i zgjedh anëtarët e Këshillit Kombëtar (Nationalrat)?
options:
  a: Këshilli Federal (Bundesrat) i emëron ata.
  b: Partitë i caktojnë ata pa zgjedhje.
  c: Gjykata Federale (Bundesgericht) i përzgjedh ata.
  d: Qytetarët me të drejtë vote i zgjedhin ata drejtpërdrejt.
explanation: Anëtarët e Këshillit Kombëtar zgjidhen çdo katër vjet drejtpërdrejt nga qytetarët me të drejtë
  vote. Edhe anëtarët e Këshillit të Shteteve (Ständerat) sot në të gjitha kantonet i zgjedh populli,
  sipas rregullave të kantonit përkatës; në Appenzell Innerrhoden kjo ndodh në Landsgemeinde.
