id: einwohnerreichste-stadt-der-schweiz
lang: sq
source_version: 1
question: Cili qytet në Zvicër ka më shumë banorë?
options:
  a: Gjenevë
  b: Cyrih
  c: Bernë
  d: Bazel
explanation: Cyrihu është qyteti më i madh i Zvicrës. Berna është me të vërtetë qyteti i Konfederatës
  (Bundesstadt), por ka dukshëm më pak banorë. Edhe Gjeneva dhe Bazeli janë më të vegjël.
