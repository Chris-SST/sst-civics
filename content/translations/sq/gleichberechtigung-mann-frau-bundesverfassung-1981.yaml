    question_de: Seit wann ist die Gleichstellung von Mann und Frau in der Schweizerischen Bundesverfassung
      vorgesehen?
    options_de:
      a: Seit dem Jahr 1999
      b: Seit dem Jahr 1971
      c: Seit dem Jahr 1981
      d: Seit dem Jahr 1848
    explanation_de: Im Jahr 1981 wurde der Gleichstellungsartikel in die Bundesverfassung aufgenommen.
      Er verpflichtet den Staat, die Gleichstellung in der Familie, in der Bildung und bei der Arbeit
      zu gewährleisten. Das Stimmrecht für Frauen bestand seit dem Jahr 1971.
