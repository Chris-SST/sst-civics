id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: sq
source_version: 1
question: Që nga kur është e parashikuar barazia mes burrit dhe gruas në Kushtetutën Federale të Zvicrës?
options:
  a: Që nga viti 1999
  b: Që nga viti 1971
  c: Që nga viti 1981
  d: Që nga viti 1848
explanation: Në vitin 1981 neni për barazinë u përfshi në Kushtetutën Federale. Ai e detyron shtetin të
  sigurojë barazinë në familje, në arsim dhe në punë. E drejta e votës për gratë ekzistonte që nga viti
  1971.
