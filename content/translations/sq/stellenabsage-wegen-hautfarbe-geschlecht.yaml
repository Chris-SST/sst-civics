question: Një grua aplikon për një vend pune. Ajo refuzohet vetëm për shkak se është grua. Cila e drejtë
  themelore cenohet me këtë?
options:
  a: Liria e vendosjes
  b: Liria e tubimit
  c: Barazia para ligjit dhe ndalimi i diskriminimit
  d: Mbrojtja e jetës private
explanation: Neni 8 i Kushtetutës Federale thotë se të gjithë njerëzit janë të barabartë para ligjit dhe
  se gruaja dhe burri kanë të drejta të barabarta. Askush nuk duhet të diskriminohet, për shembull për
  shkak të origjinës, të racës ose të gjinisë. Kush e refuzon një kandidate vetëm për shkak të gjinisë
  së saj, cenon prandaj barazinë para ligjit dhe ndalimin e diskriminimit.
