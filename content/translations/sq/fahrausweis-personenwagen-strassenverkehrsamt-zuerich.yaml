id: fahrausweis-personenwagen-strassenverkehrsamt-zuerich
lang: sq
source_version: 1
question: Cili organ në kantonin Zürich lëshon lejen e drejtimit për automjete personale?
options:
  a: Gjykata e rrethit (Bezirksgericht)
  b: Zyra e qarkullimit rrugor e kantonit
  c: Policia e qytetit e komunës ku banoni
  d: Zyra Federale e Rrugëve
explanation: Në kantonin Zürich, për lejet e drejtimit është përgjegjëse Zyra e qarkullimit rrugor. Ajo
  i takon Drejtorisë së Sigurisë. Komunat (Gemeinden) dhe Konfederata nuk lëshojnë leje drejtimi.
