    question_de: Welche Behörde im Kanton Zürich stellt den Führerausweis für Personenwagen aus?
    options_de:
      a: Das Bezirksgericht
      b: Das Strassenverkehrsamt des Kantons
      c: Die Stadtpolizei der Wohngemeinde
