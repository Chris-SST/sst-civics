id: vereinsgruendung-offen-fuer-jede-person
lang: sq
source_version: 1
question: Kush mund të krijojë një shoqatë në Zvicër?
options:
  a: Vetëm personat që kanë vendbanimin në komunën (Gemeinde)
  b: Çdo person
  c: Vetëm shtetasit zviceranë
  d: Vetëm personat me leje vendosjeje (leja C) (Niederlassungsbewilligung)
explanation: Krijimi i një shoqate është i hapur për çdo person në Zvicër. Liria e shoqërimit është e
  garantuar në Kushtetutën Federale (Bundesverfassung). Shtetësia ose statusi i qëndrimit nuk luajnë asnjë
  rol në këtë drejtim.
