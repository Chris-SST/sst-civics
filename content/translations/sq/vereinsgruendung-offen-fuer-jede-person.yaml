    question_de: Wer kann in der Schweiz einen Verein gründen?
    options_de:
      a: Nur Personen, die in der Gemeinde wohnhaft sind
      b: Jede Person
      c: Nur Schweizer Staatsangehörige
      d: Nur Personen mit Niederlassungsbewilligung (Ausweis C)
    explanation_de: Die Gründung eines Vereins steht in der Schweiz jeder Person offen. Die Vereinigungsfreiheit
      ist in der Bundesverfassung garantiert. Die Staatsangehörigkeit oder der Aufenthaltsstatus spielen
      in dieser Hinsicht keine Rolle.
