    question_de: Was geschieht beim Morgestraich, dem Beginn der Basler Fasnacht?
    options_de:
      a: Der Stadtpräsident übergibt der Fasnachtsgesellschaft den Schlüssel der Stadt.
      b: Die Gassen werden hell beleuchtet und das Feuerwerk beginnt.
      c: Die Lichter in den Gassen gehen aus, dann beginnen die Piccolos und Trommeln zu spielen.
      d: Die Fasnächtler werfen Konfetti vom Münsterturm und läuten alle Kirchenglocken.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch, um vier Uhr morgens. Dann
      gehen die Lichter in den Gassen aus. Danach beginnt die Musik der Piccolos und Trommeln.
