id: basler-fasnacht-morgestraich-beginn
lang: sq
source_version: 1
question: Çfarë ndodh gjatë Morgestraich-it, fillimit të karnavalit të Bazelit (Basler Fasnacht)?
options:
  a: Kryetari i qytetit ia dorëzon çelësin e qytetit shoqërisë së karnavalit.
  b: Rrugicat ndriçohen fort dhe fillojnë zjarret artificiale.
  c: Dritat në rrugica fiken, pastaj fillojnë të bien fyelli dhe daullet.
  d: Karnavalistët hedhin konfeti nga kulla e Münsterit dhe i bien të gjitha këmbanave të kishave.
explanation: Morgestraich fillon të hënën pas të Mërkurës së Hirit, në orën katër të mëngjesit. Pastaj
  fiken dritat në rrugica. Pas kësaj fillon muzika e fyellit dhe e daulleve.
