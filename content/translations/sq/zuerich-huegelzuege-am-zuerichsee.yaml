id: zuerich-huegelzuege-am-zuerichsee
lang: sq
source_version: 2
question: Cilat vargje kodrinore shtrihen në brigjet e Liqenit të Zyrihut?
options:
  a: Uetliberg, Albis dhe Pfannenstiel
  b: Lägern, Irchel dhe Kohlfirst
  c: Hörnli, Bachtel dhe Allmann
  d: Heitersberg, Gubrist dhe Randen
explanation: Uetliberg dhe Albis shtrihen përgjatë bregut të majtë të Liqenit të Zyrihut, ndërsa Pfannenstiel
  ndodhet në bregun e djathtë. Ngritjet e tjera ndodhen më larg liqenit, për shembull në Unterland, në
  Weinland, në Zürcher Oberland ose në kantone të tjera.
