    question_de: Welche Hügelketten erstrecken sich an den Ufern des Zürichsees?
    options_de:
      a: Uetliberg, Albis und Pfannenstiel
      b: Lägern, Irchel und Kohlfirst
      c: Hörnli, Bachtel und Allmann
      d: Heitersberg, Gubrist und Randen
    explanation_de: Uetliberg und Albis erstrecken sich entlang des linken Ufers des Zürichsees, während
      sich der Pfannenstiel am rechten Ufer befindet. Die anderen Erhebungen befinden sich weiter vom
      See entfernt, zum Beispiel im Unterland, im Weinland, im Zürcher Oberland oder in anderen Kantonen.
