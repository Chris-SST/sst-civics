    question_de: Welche Staatsform hat die Schweiz?
    options_de:
      a: Sie ist eine Diktatur mit einer einzigen Partei.
      b: Sie ist eine Monarchie mit einem gewählten König.
      c: Sie ist ein demokratischer Staat.
      d: Sie ist ein Staat, der von einer adligen Familie regiert wird.
    explanation_de: Die Schweiz ist eine Demokratie. Die Bevölkerung nimmt durch Wahlen und Abstimmungen
      an den politischen Entscheidungen teil. Die Bundesverfassung sieht dies als Grundlage des Staates
      vor.
