id: schweiz-staatsform-demokratie
lang: sq
source_version: 1
question: Çfarë forme shtetërore ka Zvicra?
options:
  a: Ajo është një diktaturë me një parti të vetme.
  b: Ajo është një monarki me një mbret të zgjedhur.
  c: Ajo është një shtet demokratik.
  d: Ajo është një shtet që qeveriset nga një familje fisnike.
explanation: Zvicra është një demokraci. Popullata merr pjesë në vendimet politike përmes zgjedhjeve dhe
  votimeve. Kushtetuta Federale e parashikon këtë si themel të shtetit.
