    question_de: Für wie viele Jahre werden die Mitglieder des Zürcher Kantonsrats gewählt?
    options_de:
      a: Für zwei Jahre
      b: Für drei Jahre
      c: Für sechs Jahre
      d: Für vier Jahre
    explanation_de: Die Mitglieder des Zürcher Kantonsrats werden für eine Amtszeit von vier Jahren gewählt.
      Danach finden Wahlen zur Gesamterneuerung statt. Dann können die Wählerinnen und Wähler erneut entscheiden,
      wer im Parlament sitzt.
