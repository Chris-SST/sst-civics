id: kantonsrat-amtsdauer-vier-jahre
lang: sq
source_version: 1
question: Për sa vite zgjidhen anëtarët e Këshillit Kantonal të Cyrihut (Kantonsrat)?
options:
  a: Për dy vite
  b: Për tre vite
  c: Për gjashtë vite
  d: Për katër vite
explanation: Anëtarët e Këshillit Kantonal të Cyrihut zgjidhen për një mandat prej katër vitesh. Pas kësaj
  mbahen zgjedhje për rinovimin e plotë. Atëherë votuesit mund të vendosin përsëri se kush ulet në parlament.
