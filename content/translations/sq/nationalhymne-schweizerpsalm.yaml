id: nationalhymne-schweizerpsalm
lang: sq
source_version: 1
question: Si quhet himni kombëtar i Zvicrës?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Schweizerpsalm
explanation: Himni kombëtar i Zvicrës është Schweizerpsalm. Këshilli Federal (Bundesrat) e shpalli përfundimisht
  himn shtetëror në vitin 1981. Më parë këndohej shpesh «Rufst du, mein Vaterland».
