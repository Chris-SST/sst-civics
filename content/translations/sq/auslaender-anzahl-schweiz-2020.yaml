question: Sa persona pa pasaportë zvicerane banonin përafërsisht në mënyrë të përhershme në Zvicër në
  vitin 2020?
options:
  a: rreth 2,1 milionë
  b: rreth 0,8 milionë
  c: rreth 3,5 milionë
  d: rreth 1,4 milionë
explanation: Në fund të vitit 2020 jetonin në Zvicër rreth 2,1 milionë të huaj. Ata i përkasin popullsisë
  së përhershme rezidente. Shifrat publikohen nga Zyra Federale e Statistikës.
