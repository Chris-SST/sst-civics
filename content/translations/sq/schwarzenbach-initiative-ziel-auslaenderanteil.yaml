    question_de: Was verlangte die Schwarzenbach-Initiative, über die im Jahr 1970 abgestimmt wurde?
    options_de:
      a: Sie verlangte, dass die Einbürgerung für alle Ausländer erleichtert wird.
      b: Sie verlangte, dass nur die Migration aus Italien verboten wird.
      c: Sie verlangte, dass der Anteil der in der Schweiz lebenden Ausländer begrenzt wird.
      d: Sie verlangte, dass das Stimmrecht für Ausländer eingeführt wird.
    explanation_de: Die Initiative verlangte, dass der Anteil der Ausländer in der Schweiz begrenzt wird.
