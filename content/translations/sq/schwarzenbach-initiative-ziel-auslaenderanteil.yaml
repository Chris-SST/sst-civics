id: schwarzenbach-initiative-ziel-auslaenderanteil
lang: sq
source_version: 1
question: Çfarë kërkonte nisma Schwarzenbach, për të cilën u votua në vitin 1970?
options:
  a: Ajo kërkonte të lehtësohej natyralizimi për të gjithë të huajt.
  b: Ajo kërkonte të ndalohej migrimi vetëm nga Italia.
  c: Ajo kërkonte të kufizohej pjesa e të huajve që jetojnë në Zvicër.
  d: Ajo kërkonte të futej e drejta e votës për të huajt.
explanation: Nisma kërkonte të kufizohej pjesa e të huajve në Zvicër. Ajo u refuzua nga populli në vitin
  1970. Ajo tregon se sa shumë diskutohej atëherë migrimi.
