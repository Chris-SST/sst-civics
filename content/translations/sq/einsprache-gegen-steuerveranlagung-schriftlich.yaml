id: einsprache-gegen-steuerveranlagung-schriftlich
lang: sq
source_version: 1
question: Një person që paguan tatime nuk është dakord me vlerësimin e tatimit (Steuerveranlagung) të
  tij. Çfarë mund të bëjë ai?
options:
  a: Ai mund të kërkojë që të votohet në kuvendin i komunës (Gemeindeversammlung).
  b: Ai mund të refuzojë pagesën pa ndërmarrë asnjë hap tjetër.
  c: Ai mund të paraqesë me shkrim një kundërshtim (Einsprache) te autoriteti tatimor.
  d: Ai mund të paraqesë një nismë popullore (Volksinitiative) te Këshilli Federal (Bundesrat).
explanation: Kundër vlerësimit të tatimit ekziston mjeti juridik i kundërshtimit (Einsprache). Ai duhet
  të paraqitet me shkrim te autoriteti tatimor, dhe pikërisht brenda një afati.
