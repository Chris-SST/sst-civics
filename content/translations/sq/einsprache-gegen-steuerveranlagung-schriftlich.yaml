    source_version: 1
    question_de: Eine Person, die Steuern zahlt, ist mit ihrer Steuerveranlagung nicht einverstanden.
      Was kann sie tun?
    options_de:
      a: Sie kann verlangen, dass in der Gemeindeversammlung abgestimmt wird.
      b: Sie kann die Zahlung verweigern, ohne weitere Schritte zu unternehmen.
      c: Sie kann beim Steueramt schriftlich eine Einsprache einreichen.
      d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
    explanation_de: Gegen die Steuerveranlagung gibt es das Rechtsmittel der Einsprache. Sie muss schriftlich
      beim Steueramt eingereicht werden, und zwar innerhalb einer Frist.
