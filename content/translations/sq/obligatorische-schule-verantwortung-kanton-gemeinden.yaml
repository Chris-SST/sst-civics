id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: sq
source_version: 1
question: Kush mban kryesisht përgjegjësinë në Zvicër për shkollën publike të detyrueshme?
options:
  a: Drejtimet e shkollave dhe prindërit
  b: Vetëm Konfederata
  c: Rrethet dhe kishat
  d: Kantonet dhe komunat (Gemeinden)
explanation: Shkolla publike (Volksschule) është çështje e kantoneve dhe e komunave. Kantoni përcakton
  kornizën, ndërsa komunat drejtojnë shkollat në vend. Konfederata luan vetëm një rol të vogël në shkollën
  e detyrueshme.
