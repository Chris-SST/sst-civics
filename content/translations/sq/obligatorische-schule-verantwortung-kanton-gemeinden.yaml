    question_de: Wer trägt in der Schweiz hauptsächlich die Verantwortung für die obligatorische öffentliche
      Schule?
    options_de:
      a: Die Schulleitungen und die Eltern
      b: Nur der Bund
      c: Die Bezirke und die Kirchen
      d: Die Kantone und die Gemeinden
    explanation_de: Die Volksschule ist Sache der Kantone und der Gemeinden. Der Kanton legt den Rahmen
      fest, während die Gemeinden die Schulen vor Ort leiten. Der Bund spielt in der obligatorischen Schule
      nur eine kleine Rolle.
