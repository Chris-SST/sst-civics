id: mitwirkung-gemeinde-urnengang-stimmabgabe
lang: sq
source_version: 1
question: Si marrin pjesë politikisht në komunën (Gemeinde) e tyre votuesit me të drejtë vote gjatë votimeve
  me urnë?
options:
  a: Ata drejtojnë mbledhjet e këshillit komunal (Gemeinderat)
  b: Ata zbatojnë vendimet e komunës
  c: Ata japin votën e tyre në zgjedhje dhe në votime
  d: Ata nxjerrin vetë ligjet e kantonit
explanation: Gjatë votimeve me urnë, votuesit me të drejtë vote votojnë për projektet e paraqitura dhe
  zgjedhin autoritetet. Zbatimi i vendimeve është detyrë e autoriteteve dhe e administratës.
