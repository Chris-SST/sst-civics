    question_de: Wie nehmen die Stimmberechtigten bei Urnenabstimmungen politisch an ihrer Gemeinde teil?
    options_de:
      a: Sie leiten die Sitzungen des Gemeinderats
      b: Sie setzen die Beschlüsse der Gemeinde um
      c: Sie geben ihre Stimme bei Wahlen und Abstimmungen ab
      d: Sie erlassen selbst die Gesetze des Kantons
    explanation_de: Bei Urnenabstimmungen stimmen die Stimmberechtigten über die vorgelegten Vorlagen
      ab und wählen die Behörden. Die Umsetzung der Beschlüsse ist Aufgabe der Behörden und der Verwaltung.
