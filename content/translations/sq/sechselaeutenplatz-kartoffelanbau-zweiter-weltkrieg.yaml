id: sechselaeutenplatz-kartoffelanbau-zweiter-weltkrieg
lang: sq
source_version: 2
question: Cila nga këto bimë u kultivua në Sechseläutenplatz në Cyrih gjatë Luftës së Dytë Botërore?
options:
  a: Duhani
  b: Hardhia e rrushit
  c: Pambuku
  d: Patatet
explanation: Gjatë Luftës së Dytë Botërore në Zvicër kishte shumë pak ushqime. Prandaj, me «betejën e
  kultivimit» (Anbauschlacht) u mbollën edhe sipërfaqe në qendër të qyteteve, për shembull Sechseläutenplatz
  në Cyrih u mbollë me patate. Duhani, hardhia e rrushit dhe pambuku nuk u kultivuan atje.
