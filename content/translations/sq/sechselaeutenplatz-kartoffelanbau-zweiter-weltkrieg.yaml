    question_de: Welche dieser Pflanzen wurde während des Zweiten Weltkriegs auf dem Sechseläutenplatz
      in Zürich angebaut?
    options_de:
      a: Tabak
      b: Die Weinrebe
      c: Baumwolle
      d: Kartoffeln
    explanation_de: Während des Zweiten Weltkriegs gab es in der Schweiz sehr wenig Lebensmittel. Deshalb
      wurden mit der «Anbauschlacht» auch Flächen im Zentrum der Städte bepflanzt, zum Beispiel wurde
      der Sechseläutenplatz in Zürich mit Kartoffeln bepflanzt. Tabak, Weinrebe und Baumwolle wurden dort
      nicht angebaut.
