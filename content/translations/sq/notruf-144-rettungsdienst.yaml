id: notruf-144-rettungsdienst
lang: sq
source_version: 1
question: Cilin numër telefoni thirret në Zvicër në rast urgjence mjekësore për të thirrur shërbimin e
  shpëtimit?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: Numri 144 është numri i urgjencës për shërbimin e shpëtimit në raste urgjente mjekësore.
  Numri 117 vlen për policinë dhe 118 për zjarrfikësit. Numri 145 është numri i Tox Info Suisse në rast
  helmimi.
