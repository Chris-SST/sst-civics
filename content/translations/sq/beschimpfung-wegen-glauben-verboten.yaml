    question_de: Eine Person beleidigt öffentlich Menschen aufgrund ihres Glaubens oder ihrer Herkunft.
      Wie ist diese Angelegenheit in der Schweiz geregelt?
    options_de:
      a: Es ist nur in Schulen und in Unternehmen verboten.
      b: Es ist verboten und kann bestraft werden.
      c: Es ist nur verboten, wenn es in der Zeitung geschrieben wird.
      d: Es wird immer durch die Meinungsfreiheit geschützt.
    explanation_de: Das Strafgesetzbuch verbietet die öffentliche Herabwürdigung von Menschen aufgrund
      ihrer Rasse, Ethnie, Religion oder ihrer sexuellen Orientierung. Die Meinungsfreiheit ist nicht
      unbegrenzt.
