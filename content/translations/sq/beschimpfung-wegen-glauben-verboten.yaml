id: beschimpfung-wegen-glauben-verboten
lang: sq
source_version: 1
question: Një person fyen publikisht njerëz për shkak të besimit ose të origjinës së tyre. Si është rregulluar
  kjo çështje në Zvicër?
options:
  a: Ndalohet vetëm në shkolla dhe në ndërmarrje.
  b: Ndalohet dhe mund të ndëshkohet.
  c: Ndalohet vetëm nëse shkruhet në gazetë.
  d: Mbrohet gjithmonë nga liria e mendimit.
explanation: Kodi Penal ndalon poshtërimin publik të njerëzve për shkak të racës, etnisë, fesë ose orientimit
  të tyre seksual. Liria e mendimit nuk është e pakufizuar.
