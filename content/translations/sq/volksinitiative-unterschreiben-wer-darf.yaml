id: volksinitiative-unterschreiben-wer-darf
lang: sq
source_version: 2
question: Kush mund të nënshkruajë një nismë popullore (Volksinitiative) federale?
options:
  a: Të gjitha personat nga mosha 16 vjeç me vendbanim në Zvicër
  b: Të gjitha personat nga mosha 18 vjeç me leje vendosjeje (leja C) (Niederlassungsbewilligung)
  c: Vetëm anëtarët e një partie politike nga mosha 18 vjeç
  d: Qytetarët zviceranë dhe qytetaret zvicerane nga mosha 18 vjeç
explanation: Një nismë popullore federale mund ta nënshkruajë ai që ka të drejtë vote në nivel të Konfederatës.
  Këta janë zviceranët dhe zvicerankat nga mosha 18 vjeç, edhe ata që jetojnë jashtë vendit, nëse janë
  regjistruar në regjistrin zgjedhor. Përjashtohen vetëm personat që për shkak të paaftësisë së përhershme
  për gjykim janë nën kujdestari gjithëpërfshirëse ose përfaqësohen nga një person i caktuar me mandat
  kujdesi paraprak; të huajt nuk kanë të drejta politike në nivel të Konfederatës, as me lejen C.
