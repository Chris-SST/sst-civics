    question_de: Wer kann eine eidgenössische Volksinitiative unterschreiben?
    options_de:
      a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
      b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung (Bewilligung C)
      c: Nur Mitglieder einer politischen Partei ab 18 Jahren
      d: Schweizer Bürger und Schweizer Bürgerinnen ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative kann unterschreiben, wer auf Ebene des Bundes
      stimmberechtigt ist. Das sind die Schweizer und Schweizerinnen ab 18 Jahren, auch jene, die im Ausland
      leben, wenn sie im Stimmregister eingetragen sind. Ausgeschlossen sind nur Personen, die wegen dauernder
      Urteilsunfähigkeit unter umfassender Beistandschaft stehen oder durch eine von ihnen mit einem Vorsorgeauftrag
      beauftragte Person vertreten werden; Ausländer haben auf Ebene des Bundes keine politischen Rechte,
      auch nicht mit der Bewilligung C.
