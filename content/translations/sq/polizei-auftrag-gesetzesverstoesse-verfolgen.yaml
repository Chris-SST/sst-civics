    question_de: Welche Aufgabe gehört zum Auftrag der Polizei?
    options_de:
      a: Die Verfolgung von Gesetzesverstössen
      b: Die Durchführung von Volksabstimmungen
      c: Das Erlassen von Gesetzen für das Land
      d: Das Fällen von Gerichtsentscheiden gegen die Täter von Straftaten
    explanation_de: Die Polizei sorgt für Sicherheit und Ordnung und verfolgt Gesetzesverstösse. Sie ermittelt
      bei Straftaten und leitet die Ergebnisse weiter. Die Gesetze erlässt das Parlament, während die
      Gerichtsentscheide von den Gerichten getroffen werden.
