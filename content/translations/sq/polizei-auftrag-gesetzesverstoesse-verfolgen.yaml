id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: sq
source_version: 1
question: Cila detyrë bën pjesë në misionin e policisë?
options:
  a: Ndjekja e shkeljeve të ligjit
  b: Zhvillimi i votimeve popullore
  c: Nxjerrja e ligjeve për vendin
  d: Dhënia e vendimeve gjyqësore për kryerësit e veprave penale
explanation: Policia kujdeset për sigurinë dhe rendin dhe ndjek shkeljet e ligjit. Ajo heton veprat penale
  dhe i përcjell rezultatet më tej. Ligjet i nxjerr parlamenti, ndërsa vendimet gjyqësore i marrin gjykatat.
