    question_de: Worauf beruhen die Beziehungen zwischen der Schweiz und der Europäischen Union (EU) im
      Kern?
    options_de:
      a: Auf einem Paket bilateraler Abkommen
      b: Auf einer gemeinsamen Regierung
      c: Auf der Mitgliedschaft der Schweiz in der EU
      d: Auf einer gemeinsamen Verfassung
    explanation_de: Die Schweiz ist kein Mitglied der EU. Ihre Beziehungen werden durch viele bilaterale
      Abkommen geregelt, also Verträge zwischen zwei Partnern. Diese betreffen zum Beispiel den Handel
      und die Personenfreizügigkeit.
