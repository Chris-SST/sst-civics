id: beziehungen-schweiz-eu-bilaterale-abkommen
lang: sq
source_version: 1
question: Mbi çfarë bazohen në thelb marrëdhëniet mes Zvicrës dhe Bashkimit Evropian (BE)?
options:
  a: Në një paketë marrëveshjesh dypalëshe
  b: Në një qeveri të përbashkët
  c: Në anëtarësimin e Zvicrës në BE
  d: Në një kushtetutë të përbashkët
explanation: Zvicra nuk është anëtare e BE-së. Marrëdhëniet e saj rregullohen nga shumë marrëveshje dypalëshe,
  pra kontrata mes dy partnerëve. Ato lidhen, për shembull, me tregtinë dhe lëvizjen e personave.
