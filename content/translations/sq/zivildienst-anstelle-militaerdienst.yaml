id: zivildienst-anstelle-militaerdienst
lang: sq
source_version: 3
question: Si lidhen në Zvicër shërbimi civil (Zivildienst) dhe shërbimi ushtarak?
options:
  a: Shërbimin civil mund ta kryejnë vetëm gratë.
  b: Kush kryen shërbim civil, nuk duhet të paguajë taksa.
  c: Shërbimi civil duhet të kryhet përveç shërbimit ushtarak.
  d: Shërbimi civil mund të kryhet në vend të shërbimit ushtarak.
explanation: Shërbimi civil është një zëvendësim civil për shërbimin ushtarak. Ai është menduar për persona
  të aftë për shërbim ushtarak, të cilët nuk mund ta pajtojnë shërbimin ushtarak me ndërgjegjen e tyre.
  Për këtë duhet të paraqitet një kërkesë, dhe shërbimi civil zgjat më shumë se shërbimi ushtarak.
