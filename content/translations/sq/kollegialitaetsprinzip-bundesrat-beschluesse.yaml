    question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
    options_de:
      a: Der Bundespräsident oder die Bundespräsidentin entscheidet allein.
      b: Die Mitglieder vertreten die Entscheide des Bundesrates nach aussen einheitlich.
      c: Jedes Mitglied entscheidet in seinem eigenen Departement, ohne sich mit den anderen zu beraten.
      d: Die Mitglieder können ihre abweichende Meinung öffentlich äussern.
    explanation_de: Der Bundesrat entscheidet als Kollegium. Auch wer im Bundesrat eine andere Meinung
      vertreten hat, unterstützt den Entscheid nach aussen. So tritt die Regierung vor der Öffentlichkeit
      geeint auf.
