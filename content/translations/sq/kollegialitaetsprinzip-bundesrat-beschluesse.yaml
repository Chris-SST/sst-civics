id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: sq
source_version: 1
question: Çfarë do të thotë parimi i kolegjialitetit në Këshillin Federal (Bundesrat)?
options:
  a: Presidenti i Konfederatës (Bundespräsident) ose presidentja e Konfederatës vendos vetëm.
  b: Anëtarët i mbrojnë vendimet e Këshillit Federal jashtë në mënyrë të njëtrajtshme.
  c: Çdo anëtar vendos në departamentin e vet pa u konsultuar me të tjerët.
  d: Anëtarët mund ta shprehin publikisht mendimin e tyre të ndryshëm.
explanation: Këshilli Federal vendos si kolegj. Edhe ai që ka mbrojtur një mendim tjetër në Këshillin
  Federal, e mbështet vendimin jashtë. Kështu qeveria del para publikut e bashkuar.
