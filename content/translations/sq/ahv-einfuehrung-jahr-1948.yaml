id: ahv-einfuehrung-jahr-1948
lang: sq
source_version: 1
question: Në cilin vit u prezantua sigurimi i pleqërisë dhe i të mbijetuarve (AHV), sigurimi shtetëror
  i pensionit për pleqëri dhe për të mbijetuarit?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: Sigurimi i pleqërisë dhe i të mbijetuarve filloi veprimtarinë e tij në vitin 1948, pasi populli
  e kishte miratuar ligjin në vitin 1947. Ai përbën shtyllën e parë të sistemit zviceran me tri shtylla.
  Ai siguron ekzistencën në pleqëri dhe për të mbijetuarit.
