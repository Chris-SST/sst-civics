    question_de: In welchem Jahr wurde die Alters- und Hinterlassenenversicherung (AHV), die staatliche
      Rentenversicherung für das Alter und für die Hinterlassenen, eingeführt?
    options_de:
      a: '1975'
      b: '1918'
      c: '1930'
      d: '1948'
    explanation_de: Die Alters- und Hinterlassenenversicherung nahm ihre Tätigkeit im Jahr 1948 auf, nachdem
      das Volk das Gesetz im Jahr 1947 angenommen hatte. Sie bildet die erste Säule des Schweizer Systems
      mit drei Säulen. Sie sichert die Existenz im Alter und für die Hinterlassenen.
