question: Në cilin kanton ndodhet Kalaja e Kyburgut?
options:
  a: Në kantonin Aargau
  b: Në kantonin St. Gallen
  c: Në kantonin Zürich
  d: Në kantonin Thurgau
explanation: Kalaja e Kyburgut ndodhet në kantonin Zürich, në një kodër mbi lumin Töss. Ajo është një
  nga pasuritë kulturore të njohura të kantonit dhe është një muze.
