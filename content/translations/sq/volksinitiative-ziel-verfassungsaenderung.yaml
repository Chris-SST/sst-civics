id: volksinitiative-ziel-verfassungsaenderung
lang: sq
source_version: 2
question: Çfarë mund të kërkojnë të drejtë vote me një nismë popullore (Volksinitiative) federale?
options:
  a: Që Këshilli Federal (Bundesrat) të shkarkohet me votim
  b: Që Kushtetuta Federale të ndryshohet
  c: Që një ligj federal ekzistues të shfuqizohet drejtpërdrejt
  d: Që kushtetuta kantonale të ndryshohet
explanation: Me një nismë popullore federale, ata që kanë të drejtë vote mund të kërkojnë një ndryshim
  të Kushtetutës Federale. Me një referendum, në të kundërt, populli mund të votojë për një ligj të ri
  që Parlamenti sapo e ka miratuar. Një ligj që ekziston tashmë nuk mund të shfuqizohet me të.
