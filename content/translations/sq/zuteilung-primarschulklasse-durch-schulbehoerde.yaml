id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: sq
source_version: 2
question: Kush vendos në kantonin e Cyrihut se cilës klasë të shkollës fillore do t'i caktohet një fëmijë?
options:
  a: Bordi i shkollës (Schulpflege) ose drejtimi i shkollës
  b: Departamenti i arsimit i Konfederatës
  c: Kuvendi i komunës (Gemeindeversammlung)
  d: Prindërit e fëmijës
explanation: Bordi i shkollës ose drejtimi i shkollës i cakton fëmijët nëpër klasa. Prindërit nuk mund
  ta zgjedhin lirisht klasën. Në këtë mënyrë shkolla organizon punën e saj dhe madhësinë e klasave.
