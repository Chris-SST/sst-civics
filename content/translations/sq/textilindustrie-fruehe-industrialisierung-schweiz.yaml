id: textilindustrie-fruehe-industrialisierung-schweiz
lang: sq
source_version: 1
question: Cili degë e ekonomisë ishte më e rëndësishmja gjatë industrializimit të hershëm të Zvicrës?
options:
  a: Industria e orëve
  b: Industria farmaceutike
  c: Industria tekstile
  d: Industria e makinerive
explanation: Gjatë industrializimit të hershëm, industria tekstile e përcaktoi ekonominë zvicerane, për
  shembull me fabrika tjerrjeje, endjeje dhe qëndisjeje. Një shembull i njohur janë qëndisjet e St. Gallenit,
  të cilat kërkoheshin në mbarë botën. Degët e tjera u bënë kaq të rëndësishme vetëm më vonë.
