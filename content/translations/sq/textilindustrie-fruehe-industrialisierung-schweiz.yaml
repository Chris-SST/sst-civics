    question_de: Welcher Wirtschaftszweig war während der frühen Industrialisierung der Schweiz der wichtigste?
    options_de:
      a: Die Uhrenindustrie
      b: Die Pharmaindustrie
      c: Die Textilindustrie
      d: Die Maschinenindustrie
    explanation_de: Während der frühen Industrialisierung prägte die Textilindustrie die Schweizer Wirtschaft,
      zum Beispiel mit Spinnereien, Webereien und Stickereifabriken. Ein bekanntes Beispiel sind die St.
      Galler Stickereien, die auf der ganzen Welt gefragt waren. Die anderen Wirtschaftszweige wurden
      erst später so wichtig.
