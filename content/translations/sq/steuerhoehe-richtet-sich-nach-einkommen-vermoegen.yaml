id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
lang: sq
source_version: 1
question: Nga çfarë varet kryesisht sa tatim mbi të ardhurat dhe pasurinë paguan një person në kantonin
  e Cyrihut?
options:
  a: Nga të ardhurat dhe pasuria e tatueshme
  b: Nga profesioni i personit
  c: Nga kohëzgjatja e banimit në komunë (Gemeinde)
  d: Nga numri i herëve të ushtrimit të së drejtës së votës
explanation: Tatimi llogaritet mbi të ardhurat dhe pasurinë e tatueshme. Kush fiton ose zotëron më shumë,
  paguan zakonisht më shumë tatim.
