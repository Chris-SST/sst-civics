    question_de: Wovon hängt hauptsächlich ab, wie viel Steuern auf das Einkommen und das Vermögen eine
      Person im Kanton Zürich bezahlt?
    options_de:
      a: Vom steuerbaren Einkommen und Vermögen
      b: Vom Beruf der Person
      c: Von der Dauer des Wohnens in der Gemeinde
      d: Von der Anzahl der Ausübungen des Stimmrechts
    explanation_de: Die Steuer wird auf das steuerbare Einkommen und Vermögen berechnet. Wer mehr verdient
      oder besitzt, bezahlt in der Regel mehr Steuern.
