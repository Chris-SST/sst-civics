    question_de: Woraus besteht die Schweiz als Bundesstaat?
    options_de:
      a: Aus Bezirken als Gliedstaaten
      b: Aus Sprachgebieten als Gliedstaaten
      c: Aus Kantonen als Gliedstaaten
      d: Aus Regionen als Gliedstaaten
    explanation_de: Die Schweiz ist ein Bundesstaat. Die Kantone sind ihre Gliedstaaten und haben eine
      eigene Verfassung, ein eigenes Parlament und eine eigene Regierung. Bezirke und Regionen sind keine
      Gliedstaaten.
