id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: sq
source_version: 1
question: Nga çfarë përbëhet Zvicra si shtet federal?
options:
  a: Nga rrethe si shtete anëtare
  b: Nga zona gjuhësore si shtete anëtare
  c: Nga kantone si shtete anëtare
  d: Nga rajone si shtete anëtare
explanation: Zvicra është shtet federal. Kantonet janë shtetet e saj anëtare dhe kanë kushtetutë të vet,
  parlament të vet dhe qeveri të vet. Rrethet dhe rajonet nuk janë shtete anëtare.
