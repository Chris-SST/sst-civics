id: kanton-zuerich-heutige-form-1803
lang: sq
source_version: 1
question: Në cilin vit u krijua kantoni i Cyrihut në formën e tij të sotme?
options:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
explanation: Kantoni i Cyrihut u krijua në formën e tij të sotme në vitin 1803 me Aktin e Ndërmjetësimit.
  Përvjetori u festua në vitin 2003 si 200 vjet të kantonit të Cyrihut. Në vitin 1848 u krijua shteti
  federal i sotëm.
