    question_de: Welches Grundrecht, das von der Bundesverfassung garantiert wird, erlaubt es jemandem,
      seine Meinung frei zu äussern und sie zu verbreiten?
    options_de:
      a: Die Meinungsfreiheit
      b: Das Stimmrecht
      c: Die Eigentumsgarantie
      d: Die Niederlassungsfreiheit
    explanation_de: Die Meinungsfreiheit erlaubt es jemandem, seine Meinung frei zu äussern und sie zu
      verbreiten. Sie ist in Artikel 16 der Bundesverfassung festgelegt. Das Stimmrecht hingegen betrifft
      die Teilnahme an Wahlen und Abstimmungen.
