id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: sq
source_version: 1
question: Cila e drejtë themelore, e garantuar nga Kushtetuta Federale, e lejon që dikush ta shprehë lirisht
  mendimin e vet dhe ta përhapë atë?
options:
  a: Liria e mendimit
  b: E drejta e votës
  c: Garancia e pronës
  d: Liria e vendosjes
explanation: Liria e mendimit e lejon që dikush ta shprehë lirisht mendimin e vet dhe ta përhapë atë.
  Ajo është e përcaktuar në nenin 16 të Kushtetutës Federale. E drejta e votës, ndërkaq, ka të bëjë me
  pjesëmarrjen në zgjedhje dhe në votime.
