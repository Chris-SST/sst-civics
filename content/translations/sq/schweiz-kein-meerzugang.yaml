id: schweiz-kein-meerzugang
lang: sq
source_version: 2
question: Cila deklaratë për pozitën gjeografike të Zvicrës është e saktë?
options:
  a: Zvicra nuk ka dalje të drejtpërdrejtë në det.
  b: Zvicra kufizohet në perëndim me Oqeanin Atlantik.
  c: Zvicra kufizohet në jug me Detin Mesdhe.
  d: Zvicra kufizohet në veri me Detin e Veriut.
explanation: 'Zvicra është një vend pa dalje në det: ajo është e rrethuar tërësisht nga vende të tjera
  dhe nuk ka bregdet. Në Rhein lundrojnë ndonëse anije nga Basel deri në Detin e Veriut, por asnjë det
  nuk kufizohet drejtpërdrejt me Zvicrën.'
