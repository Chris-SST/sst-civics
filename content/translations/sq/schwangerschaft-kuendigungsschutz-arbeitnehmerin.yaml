id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: sq
source_version: 1
question: Çfarë vlen në Zvicër për punonjëset shtatzëna në rastin e shkarkimit nga puna?
options:
  a: Ato kanë mbrojtje nga shkarkimi vetëm në ndërmarrjet me kontratë kolektive pune
  b: Gjatë shtatzënisë ato gëzojnë mbrojtje ligjore nga shkarkimi
  c: Ato duhet t'ia njoftojnë menjëherë punëdhënësit shtatzëninë, përndryshe mbrojtja humbet
  d: Ato mund të shkarkohen në çdo kohë, pa asnjë kufizim
explanation: Ligji i mbron gratë gjatë shtatzënisë nga shkarkimi nga ana e punëdhënësit. Mbrojtja vlen
  pavarësisht nga ndërmarrja. Ajo synon t'i sigurojë gratë në këtë periudhë.
