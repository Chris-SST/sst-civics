    question_de: Was gilt in der Schweiz für schwangere Arbeitnehmerinnen im Falle einer Kündigung?
    options_de:
      a: Sie haben nur in Unternehmen mit einem Gesamtarbeitsvertrag Kündigungsschutz
      b: Während der Schwangerschaft geniessen sie gesetzlichen Kündigungsschutz
      c: Sie müssen dem Arbeitgeber die Schwangerschaft sofort mitteilen, sonst geht der Schutz verloren
      d: Sie können jederzeit ohne jegliche Einschränkung gekündigt werden
    explanation_de: Das Gesetz schützt Frauen während der Schwangerschaft vor der Kündigung durch den
      Arbeitgeber. Der Schutz gilt unabhängig vom Unternehmen. Er soll die Frauen in dieser Zeit absichern.
