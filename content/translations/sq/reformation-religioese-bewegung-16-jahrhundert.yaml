id: reformation-religioese-bewegung-16-jahrhundert
lang: sq
source_version: 1
question: Cila lëvizje e rëndësishme fetare la gjurmë në Evropë dhe edhe në Zvicër në shekullin e 16-të?
options:
  a: Reformacioni
  b: Iluminizmi
  c: Regjenerimi
  d: Helvetika
explanation: Reformacioni e ndau kishën në Evropë në shekullin e 16-të. Në Zvicër, për shembull, Huldrych
  Zwingli në Cyrih dhe Johannes Calvin në Gjenevë ishin të rëndësishëm. Konceptet e tjera përshkruajnë
  zhvillime të mëvonshme.
