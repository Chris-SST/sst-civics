id: frauenstimmrecht-national-1971
lang: sq
source_version: 2
question: Që nga cili vit lejojnë gratë në Zvicër të zgjedhin dhe të votojnë në nivel të Konfederatës?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: Në vitin 1971 burrat zviceranë miratuan në një votim popullor të drejtën e votës për gratë
  në nivel të Konfederatës. Që atëherë gratë mund të zgjedhin, të votojnë dhe të zgjidhen në nivel kombëtar.
  Kantonet e futën të drejtën e votës për gratë në kohë të ndryshme, disa që para vitit 1971, ndërsa Appenzell
  Innerrhoden, si kantoni i fundit, vetëm në vitin 1990.
