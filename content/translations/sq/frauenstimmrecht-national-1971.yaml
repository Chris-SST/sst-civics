    question_de: Seit welchem Jahr dürfen Frauen in der Schweiz auf Ebene des Bundes wählen und abstimmen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: Im Jahr 1971 nahmen die Schweizer Männer in einer Volksabstimmung das Stimmrecht für
      Frauen auf Ebene des Bundes an. Seither können Frauen auf nationaler Ebene wählen, abstimmen und
      gewählt werden. Die Kantone führten das Stimmrecht für Frauen zu unterschiedlichen Zeiten ein, einige
      schon vor 1971, während Appenzell Innerrhoden als letzter Kanton es erst im Jahr 1990 einführte.
