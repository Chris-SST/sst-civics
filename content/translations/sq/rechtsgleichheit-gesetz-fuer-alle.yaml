id: rechtsgleichheit-gesetz-fuer-alle
lang: sq
source_version: 1
question: Çfarë do të thotë parimi i barazisë përpara ligjit?
options:
  a: Të gjithë kantonet kanë të njëjtat ligje.
  b: Të gjithë personat kanë të njëjtat detyra politike.
  c: Të gjithë personat kanë të njëjtin të ardhur.
  d: Ligji vlen për të gjithë personat në mënyrë të barabartë.
explanation: Barazia përpara ligjit përmbahet në nenin 8 të Kushtetutës Federale. Të gjithë njerëzit janë
  të barabartë përpara ligjit dhe askush nuk lejohet, për shembull, të diskriminohet për shkak të prejardhjes
  ose gjinisë. Kjo nuk do të thotë se të gjithë zotërojnë po aq.
