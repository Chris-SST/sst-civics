    source_version: 1
    question_de: Was bedeutet der Grundsatz der Gleichheit vor dem Gesetz?
    options_de:
      a: Alle Kantone haben dieselben Gesetze.
      b: Alle Personen haben dieselben politischen Pflichten.
      c: Alle Personen haben dasselbe Einkommen.
      d: Das Gesetz gilt für alle Personen in gleicher Weise.
    explanation_de: Die Gleichheit vor dem Gesetz ist in Artikel 8 der Bundesverfassung enthalten. Alle
      Menschen sind vor dem Gesetz gleich und niemand darf zum Beispiel wegen der Herkunft oder des Geschlechts
      diskriminiert werden. Das bedeutet nicht, dass alle gleich viel besitzen.
