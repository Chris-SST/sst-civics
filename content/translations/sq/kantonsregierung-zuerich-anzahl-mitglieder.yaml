question: Sa anëtarë ka qeveria e kantonit të Cyrihut?
options:
  a: Pesë anëtarë
  b: Nëntë anëtarë
  c: Njëmbëdhjetë anëtarë
  d: Shtatë anëtarë
explanation: Qeveria e kantonit të Cyrihut përbëhet nga shtatë anëtarë. Çdo anëtar drejton, si rregull,
  një drejtori të administratës.
