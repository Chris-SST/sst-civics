id: gewaltmonopol-des-staates
lang: sq
source_version: 2
question: Kush ka të drejtë, në parim, të përdorë forcë fizike në Zvicër?
options:
  a: Firmat private të sigurisë me porosi të shoqatave
  b: Çdo person që ndihet i kërcënuar
  c: Vetëm shteti
  d: Çdo komunë (Gemeinde) me milici qytetare të veta
explanation: 'Në Zvicër shteti ka monopolin e dhunës: në parim vetëm ai ka të drejtë të përdorë forcë
  fizike, për shembull nëpërmjet policisë ose ushtrisë. Një përjashtim është vetëmbrojtja: kush sulmohet
  në mënyrë të kundraligjshme, ka të drejtë të mbrohet në mënyrë të përshtatshme, por vetëm ndjenja e
  të qenit i kërcënuar nuk mjafton për këtë.'
