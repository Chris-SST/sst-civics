    question_de: Wer hat in der Schweiz grundsätzlich das Recht, körperliche Gewalt anzuwenden?
    options_de:
      a: Private Sicherheitsfirmen im Auftrag von Vereinen
      b: Jede Person, die sich bedroht fühlt
      c: Nur der Staat
      d: Jede Gemeinde mit eigenen Bürgermilizen
    explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich hat nur er das Recht,
      körperliche Gewalt anzuwenden, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist
      die Selbstverteidigung: Wer widerrechtlich angegriffen wird, hat das Recht, sich angemessen zu verteidigen,
      aber das blosse Gefühl, bedroht zu sein, genügt dafür nicht.'
