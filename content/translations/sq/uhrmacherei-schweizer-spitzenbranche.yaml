question: Në cilin sektor ekonomik udhëheq Zvicra në nivel ndërkombëtar prej kohësh të gjata?
options:
  a: Industria tekstile
  b: Ndërtimi i anijeve
  c: Industria e automobilave
  d: Orëbërja
explanation: Orët zvicerane janë të njohura në mbarë botën për cilësinë e tyre. Orëbërja ka një traditë
  të gjatë në Zvicër dhe është edhe sot një degë e rëndësishme eksporti.
