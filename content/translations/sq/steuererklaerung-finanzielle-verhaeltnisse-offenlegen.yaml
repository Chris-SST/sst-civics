id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: sq
source_version: 1
question: Për çfarë shërben deklarata tatimore që tatimpaguesit e plotësojnë çdo vit?
options:
  a: Shërben për regjistrimin në zyrën e banorëve.
  b: Është kërkesa për një sigurim shëndetësor.
  c: Është regjistrimi për shërbimin civil (Zivildienst).
  d: Ajo i bën të ditura autoriteteve tatimore gjendjen financiare.
explanation: Me deklaratën tatimore, tatimpaguesit tregojnë të ardhurat, pasurinë dhe zbritjet. Mbi këtë
  bazë autoriteti tatimor llogarit tatimin.
