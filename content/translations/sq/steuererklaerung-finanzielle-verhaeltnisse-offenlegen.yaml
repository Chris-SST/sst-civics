    question_de: Wozu dient die Steuererklärung, die Steuerzahler jedes Jahr ausfüllen?
    options_de:
      a: Sie dient zur Anmeldung beim Einwohneramt.
      b: Sie ist der Antrag auf eine Krankenversicherung.
      c: Sie ist die Anmeldung für den Zivildienst.
      d: Sie macht den Steuerbehörden die finanzielle Lage bekannt.
