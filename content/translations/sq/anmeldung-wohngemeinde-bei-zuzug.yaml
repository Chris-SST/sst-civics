    question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
    options_de:
      a: Sie müssen sich in der Wohnsitzgemeinde anmelden.
      b: Sie müssen sich bei der Armee melden.
      c: Sie müssen sich beim Bundesrat melden.
      d: Sie müssen sich bei der Steuerverwaltung des Bundes melden.
    explanation_de: Wer an einen neuen Ort zieht, muss sich in der Wohnsitzgemeinde anmelden. Dies geschieht
      in der Regel beim Einwohnerkontrollamt. So ist die Gemeinde über ihre Einwohner informiert.
