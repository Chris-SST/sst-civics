id: anmeldung-wohngemeinde-bei-zuzug
lang: sq
source_version: 1
question: Çfarë duhet të bëjnë personat që vendosen në një komunë (Gemeinde)?
options:
  a: Ata duhet të regjistrohen në komunën e vendbanimit.
  b: Ata duhet të paraqiten në ushtri.
  c: Ata duhet të paraqiten te Këshilli Federal (Bundesrat).
  d: Ata duhet të paraqiten në administratën tatimore të Konfederatës.
explanation: Kushdo që lëviz në një vend të ri duhet të regjistrohet në komunën e vendbanimit. Kjo bëhet
  zakonisht në zyrën e kontrollit të banorëve. Kështu komuna është e informuar për banorët e saj.
