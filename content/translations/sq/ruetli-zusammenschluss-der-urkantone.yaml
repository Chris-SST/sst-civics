id: ruetli-zusammenschluss-der-urkantone
lang: sq
source_version: 1
question: Çfarë simbolizon Rütli-ja në historinë e Zvicrës?
options:
  a: Bashkimin e kantoneve themeluese
  b: Fitoren në betejën e Marignanos
  c: Fillimin e Reformës
  d: Themelimin e shtetit federal në vitin 1848
explanation: Sipas traditës, përfaqësues të kantoneve themeluese janë lidhur me besë në Rütli. Prandaj
  ai konsiderohet simbol i fillimeve të Konfederatës (Eidgenossenschaft). Livadhi ndodhet buzë Liqenit
  të Katër Kantoneve (Vierwaldstättersee).
