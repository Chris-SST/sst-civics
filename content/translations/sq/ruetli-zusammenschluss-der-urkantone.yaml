    question_de: Was symbolisiert das Rütli in der Geschichte der Schweiz?
    options_de:
      a: Den Zusammenschluss der Gründungskantone
      b: Den Sieg in der Schlacht von Marignano
      c: Den Beginn der Reformation
      d: Die Gründung des Bundesstaates im Jahr 1848
    explanation_de: Der Überlieferung nach haben sich Vertreter der Gründungskantone auf dem Rütli durch
      einen Treueschwur verbunden. Deshalb gilt es als Symbol der Anfänge der Eidgenossenschaft. Die Wiese
      liegt am Vierwaldstättersee.
