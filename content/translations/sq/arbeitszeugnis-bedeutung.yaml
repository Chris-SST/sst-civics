id: arbeitszeugnis-bedeutung
lang: sq
source_version: 1
question: Çfarë është një certifikatë pune (Arbeitszeugnis)?
options:
  a: Një vërtetim i mjekut ose i mjekes se personi nuk mund të punojë
  b: Një dokument i punëdhënësit që vlerëson performancën dhe sjelljen e personit të punësuar
  c: Leja e zyrës së migracionit për të punuar në Zvicër
  d: Vërtetimi vjetor i pagës për deklaratën tatimore
explanation: Certifikatën e punës e lëshon punëdhënësi. Ajo përshkruan llojin dhe kohëzgjatjen e punës
  dhe vlerëson performancën dhe sjelljen. Të punësuarit mund ta kërkojnë në çdo kohë.
