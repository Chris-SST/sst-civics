id: kinder-familienname-ohne-gemeinsamen-namen
lang: sq
source_version: 1
question: Dy bashkëshortë nuk kanë përcaktuar një mbiemër të përbashkët familjar gjatë martesës. Kush
  e përcakton atëherë mbiemrin e fëmijëve të tyre të përbashkët?
options:
  a: Fëmijët marrin automatikisht mbiemrin e babait.
  b: Zyra e gjendjes civile vendos sipas rendit alfabetik të mbiemrave.
  c: Bashkëshortët e zgjedhin vetë mbiemrin e fëmijëve të tyre.
  d: Fëmijët marrin automatikisht mbiemrin e nënës.
explanation: Nëse bashkëshortët nuk kanë përcaktuar një mbiemër të përbashkët familjar, ata duhet ta zgjedhin
  vetë mbiemrin e fëmijëve. Ligji nuk e përcakton automatikisht. Rregullat gjenden në Kodin Civil Zviceran.
