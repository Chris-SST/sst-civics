    question_de: Die beiden Ehegatten haben während der Ehe keinen gemeinsamen Familiennamen bestimmt.
      Wer bestimmt dann den Nachnamen ihrer gemeinsamen Kinder?
    options_de:
      a: Die Kinder erhalten automatisch den Nachnamen des Vaters.
      b: Das Zivilstandsamt entscheidet nach der alphabetischen Reihenfolge der Nachnamen.
      c: Die Ehegatten wählen den Nachnamen ihrer Kinder selbst.
      d: Die Kinder erhalten automatisch den Nachnamen der Mutter.
    explanation_de: Wenn die Ehegatten keinen gemeinsamen Familiennamen bestimmt haben, müssen sie den
      Nachnamen der Kinder selbst wählen. Das Gesetz bestimmt ihn nicht automatisch. Die Regeln finden
      sich im Schweizerischen Zivilgesetzbuch.
