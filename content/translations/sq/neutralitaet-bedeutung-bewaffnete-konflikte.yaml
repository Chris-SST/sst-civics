    question_de: Was bedeutet die Neutralität der Schweiz im Falle bewaffneter Konflikte zwischen anderen
      Staaten?
    options_de:
      a: Die Schweiz schickt Truppen zur Friedenssicherung in jedes Kriegsgebiet.
      b: Die Schweiz bricht alle Beziehungen zu den beteiligten Staaten ab.
      c: Die Schweiz ergreift für keine der Konfliktparteien Partei.
      d: Die Schweiz unterstützt immer die schwächere Partei.
    explanation_de: Neutralität bedeutet, dass die Schweiz für keine Kriegspartei Partei ergreift. So
      bleibt sie ausserhalb der Konflikte anderer Staaten. Das schliesst Gespräche und humanitäre Hilfe
      nicht aus.
