id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: sq
source_version: 1
question: Çfarë do të thotë asnjanësia e Zvicrës në rast konfliktesh të armatosura mes shteteve të tjera?
options:
  a: Zvicra dërgon trupa për ruajtjen e paqes në çdo zonë lufte.
  b: Zvicra ndërpret të gjitha marrëdhëniet me shtetet e përfshira.
  c: Zvicra nuk merr anën e asnjërës palë në konflikt.
  d: Zvicra mbështet gjithmonë palën më të dobët.
explanation: Asnjanësia do të thotë që Zvicra nuk merr anën e asnjë pale në luftë. Kështu ajo qëndron
  jashtë konflikteve të shteteve të tjera. Kjo nuk përjashton bisedimet dhe ndihmën humanitare.
