id: kantone-eigene-verwaltung-und-recht
lang: sq
source_version: 2
question: Çfarë përfshihet në detyrat e kantoneve?
options:
  a: Ata përcaktojnë politikën e jashtme dhe monedhën e Zvicrës.
  b: Ata nxjerrin ligjet për të gjithë vendin.
  c: Ata udhëheqin ushtrinë dhe përcaktojnë tarifat doganore.
  d: Ata drejtojnë administratën e tyre dhe nxjerrin të drejtën kantonale.
explanation: Çdo kanton ka qeverinë e vet, parlamentin e vet dhe administratën e vet. Ai bën ligjet e
  veta, që vlejnë vetëm në kanton, për shembull për shkollat ose policinë. Politika e jashtme, monedha,
  ushtria, tarifat doganore dhe ligjet për të gjithë Zvicrën janë çështje e Konfederatës.
