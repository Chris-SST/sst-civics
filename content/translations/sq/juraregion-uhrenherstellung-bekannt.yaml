question: Për çfarë është e njohur rajoni i Jurës në Zvicër nga ana ekonomike?
options:
  a: Për industrinë farmaceutike
  b: Për bankat e mëdha
  c: Për vreshtarinë në liqenin e Cyrihut
  d: Për prodhimin e orëve
explanation: Në harkun e Jurës kanë selinë dhe punishtet e tyre shumë firma të njohura orësh. Prandaj
  rajoni është një qendër e industrisë zvicerane të orëve.
