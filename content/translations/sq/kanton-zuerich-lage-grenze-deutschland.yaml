question: Ku ndodhet kantoni Zürich në Zvicër dhe me cilin shtet fqinj kufizohet?
options:
  a: Në perëndim të Zvicrës, kufizohet me Francën
  b: Në veri të Zvicrës, kufizohet me Gjermaninë
  c: Në lindje të Zvicrës, kufizohet me Austrinë
  d: Në jug të Zvicrës, kufizohet me Italinë
explanation: Kantoni Zürich ndodhet në veri të Zvicrës. Në veri, një pjesë e kufirit të tij përbën njëkohësisht
  kufirin shtetëror me Gjermaninë.
