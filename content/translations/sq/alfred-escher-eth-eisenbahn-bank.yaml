    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er führte die Schweizer Truppen im Sonderbundskrieg an.
      b: Er schrieb allein und vollständig die erste Bundesverfassung.
      c: Er gründete das Rote Kreuz in Genf.
      d: Er unterstützte die ETH und den Bau der Eisenbahnen und gründete die Bank, aus der die Credit
        Suisse wurde.
    explanation_de: Alfred Escher setzte sich im 19. Jahrhundert für die Gründung der ETH Zürich und für
      den Bau der Eisenbahnen ein, besonders der Gotthardbahn. Im Jahr 1856 gründete er die Schweizerische
      Kreditanstalt, die später zur Credit Suisse wurde. Diese Bank wurde im Jahr 2023 von der UBS übernommen.
