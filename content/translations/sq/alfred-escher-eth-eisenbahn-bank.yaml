id: alfred-escher-eth-eisenbahn-bank
lang: sq
source_version: 2
question: Për çfarë është i njohur politikani dhe sipërmarrësi zyrixhas Alfred Escher?
options:
  a: Ai udhëhoqi trupat zvicerane në Luftën e Sonderbundit.
  b: Ai e shkroi vetëm, plotësisht, Kushtetutën e parë Federale.
  c: Ai themeloi Kryqin e Kuq në Gjenevë.
  d: Ai mbështeti ETH-në dhe ndërtimin e hekurudhave dhe themeloi bankën nga e cila u bë Credit Suisse.
explanation: Alfred Escher u angazhua në shekullin e 19-të për themelimin e ETH-së së Cyrihut dhe për
  ndërtimin e hekurudhave, sidomos të hekurudhës së Gotthardit. Në vitin 1856 ai themeloi Kreditanstalt-in
  Zviceran (Schweizerische Kreditanstalt), që më vonë u bë Credit Suisse. Kjo bankë u pre në vitin 2023
  nga UBS.
