id: sonderbundskrieg-1847-konfliktparteien
lang: sq
source_version: 1
question: Mes cilëve u zhvillua në Zvicër lufta e Sonderbundit në vitin 1847?
options:
  a: Mes kantoneve gjermanishtfolëse dhe kantoneve frëngjishtfolëse
  b: Mes forcave liberale dhe kantoneve katolike
  c: Mes kantoneve të qyteteve dhe kantoneve rurale për shkak të taksave
  d: Mes Zvicrës dhe Francës
explanation: Në Sonderbund ishin bashkuar disa kantone katolike-konservatore. Forcat liberale donin një
  Konfederatë më të fortë. Lufta e shkurtër përfundoi me fitoren e anës liberale dhe hapi rrugën drejt
  shtetit federal të vitit 1848.
