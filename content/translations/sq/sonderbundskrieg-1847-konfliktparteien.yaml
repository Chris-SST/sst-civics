    question_de: Zwischen wem wurde in der Schweiz im Jahr 1847 der Sonderbundskrieg geführt?
    options_de:
      a: Zwischen den deutschsprachigen Kantonen und den französischsprachigen Kantonen
      b: Zwischen den liberalen Kräften und den katholischen Kantonen
      c: Zwischen den Städtekantonen und den ländlichen Kantonen wegen der Steuern
      d: Zwischen der Schweiz und Frankreich
    explanation_de: Im Sonderbund hatten sich mehrere katholisch-konservative Kantone zusammengeschlossen.
      Die liberalen Kräfte wollten einen stärkeren Bund. Der kurze Krieg endete mit dem Sieg der liberalen
      Seite und ebnete den Weg zum Bundesstaat von 1848.
