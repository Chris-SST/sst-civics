id: roemisches-amphitheater-avenches
lang: sq
source_version: 1
question: Në cilin qytet zviceran ndërtuan romakët një amfiteatër, mbetjet e të cilit janë ende të dukshme
  edhe sot?
options:
  a: Chur
  b: Thun
  c: Sion
  d: Avenches
explanation: Avenches në kohën romake quhej Aventicum dhe ishte një qytet i rëndësishëm. Amfiteatri atje
  është një dëshmi e njohur e periudhës romake në Zvicër. Qytetet e tjera nuk njihen për këtë ndërtim.
