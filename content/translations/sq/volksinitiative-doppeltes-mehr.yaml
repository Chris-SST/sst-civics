    question_de: Was braucht eine eidgenössische Volksinitiative, damit sie in der Abstimmung angenommen
      wird?
    options_de:
      a: Die «Ja»-Stimmen von zwei Dritteln der Stimmberechtigten
      b: Das «Ja» des Bundesrates und der Mehrheit der Stimmberechtigten
      c: Das «Ja» der Mehrheit der Stimmberechtigten und der Mehrheit der Kantone
      d: Nur das «Ja» der Mehrheit der Stimmberechtigten
    explanation_de: 'Eine eidgenössische Volksinitiative zielt darauf ab, die Bundesverfassung zu ändern.
      Deshalb braucht sie das doppelte Mehr: Die Mehrheit der Stimmberechtigten (Volksmehr) und die Mehrheit
      der Kantone (Ständemehr) müssen «Ja» sagen. Bei einer kantonalen Initiative im Kanton Zürich genügt
      dagegen die Mehrheit der Stimmberechtigten.'
