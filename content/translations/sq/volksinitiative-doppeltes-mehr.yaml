id: volksinitiative-doppeltes-mehr
lang: sq
source_version: 2
question: Çfarë i duhet një nismë popullore (Volksinitiative) federale që të miratohet në votim?
options:
  a: Votat "po" të dy të tretave të votuesve
  b: '"Po"-ja e Këshillit Federal (Bundesrat) dhe e shumicës së votuesve'
  c: '"Po"-ja e shumicës së votuesve dhe e shumicës së kantoneve'
  d: Vetëm "po"-ja e shumicës së votuesve
explanation: 'Një nismë popullore federale synon ta ndryshojë Kushtetutën Federale. Prandaj i duhet shumica
  e dyfishtë: shumica e votuesve (shumica e popullit (Volksmehr)) dhe shumica e kantoneve (shumica e kantoneve
  (Ständemehr)) duhet të thonë "po". Në rastin e një nisme kantonale në kantonin e Cyrihut, përkundrazi,
  mjafton shumica e votuesve.'
