    question_de: Welches Ereignis des Jahres 1815 ist für die Neutralität der Schweiz wichtig?
    options_de:
      a: Die Schweiz erklärte allen Nachbarstaaten den Krieg.
      b: Die Grossmächte anerkannten die dauernde Neutralität der Schweiz.
      c: Die Schweiz trat dem Völkerbund bei.
      d: Die Schweiz führte zum ersten Mal eine Volksabstimmung über die Neutralität durch.
    explanation_de: Am Wiener Kongress im Jahr 1815 anerkannten die europäischen Grossmächte die dauernde
      Neutralität der Schweiz. Dies gab der Neutralität eine internationale Grundlage.
