id: wiener-kongress-dauernde-neutralitaet-anerkennung
lang: sq
source_version: 1
question: Cili ngjarje e vitit 1815 është e rëndësishme për neutralitetin e Zvicrës?
options:
  a: Zvicra u shpalli luftë të gjitha shteteve fqinje.
  b: Fuqitë e mëdha njohën neutralitetin e përhershëm të Zvicrës.
  c: Zvicra iu bashkua Lidhjes së Kombeve.
  d: Zvicra zhvilloi për herë të parë një votim popullor mbi neutralitetin.
explanation: Në Kongresin e Vjenës në vitin 1815, fuqitë e mëdha evropiane njohën neutralitetin e përhershëm
  të Zvicrës. Kjo i dha neutralitetit një bazë ndërkombëtare.
