    question_de: Welche Stadt in der Schweiz übernimmt die Rolle der Hauptstadt des Landes?
    options_de:
      a: Bern
      b: Genf
      c: Lausanne
      d: Zürich
    explanation_de: Bern ist der Sitz des Bundesrates und der Bundesversammlung und wird «Bundesstadt»
      genannt. Die Bundesverfassung erwähnt keine Hauptstadt, aber Bern übernimmt diese Rolle. Zürich
      ist die grösste Stadt, Lausanne ist der Sitz des Bundesgerichts.
