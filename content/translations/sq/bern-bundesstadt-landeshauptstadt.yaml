id: bern-bundesstadt-landeshauptstadt
lang: sq
source_version: 1
question: Cili qytet në Zvicër merr rolin e kryeqytetit të vendit?
options:
  a: Bernë
  b: Gjenevë
  c: Lozanë
  d: Cyrih
explanation: Berna është selia e Këshillit Federal (Bundesrat) dhe e Kuvendit Federal (Bundesversammlung)
  dhe quhet «qytet federal». Kushtetuta Federale nuk përmend asnjë kryeqytet, por Berna e merr këtë rol.
  Cyrihu është qyteti më i madh, Lozana është selia e Gjykatës Federale (Bundesgericht).
