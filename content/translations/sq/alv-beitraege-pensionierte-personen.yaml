    source_version: 1
    question_de: Wer muss in der Schweiz keine Beiträge mehr für die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen, die ein unbefristetes Arbeitsverhältnis haben
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die in Teilzeit arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Pflicht, Beiträge für die Arbeitslosenversicherung zu bezahlen, endet mit dem
      Erreichen des Rentenalters der Alters- und Hinterlassenenversicherung (AHV). Wer pensioniert ist,
      bezahlt für einen allfälligen Lohn keine ALV-Beiträge mehr. Teilzeit- und Vollzeitangestellte hingegen
      bezahlen Beiträge.
