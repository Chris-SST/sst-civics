id: alv-beitraege-pensionierte-personen
lang: sq
source_version: 1
question: Kush nuk duhet më të paguajë kontribute në Zvicër për sigurimin kundër papunësisë (ALV)?
options:
  a: Personat që kanë një marrëdhënie pune pa afat
  b: Personat që kanë arritur moshën e rregullt të pensionit të sigurimit të pleqërisë dhe të të mbijetuarve
    (AHV)
  c: Personat që punojnë me kohë të pjesshme
  d: Personat që nuk kanë qenë kurrë të papunë në dy vitet e fundit
explanation: Detyrimi për të paguar kontribute për sigurimin kundër papunësisë përfundon me arritjen e
  moshës së pensionit të sigurimit të pleqërisë dhe të të mbijetuarve (AHV). Kush është në pension, nuk
  paguan më kontribute ALV për një pagë eventuale. Të punësuarit me kohë të pjesshme dhe me kohë të plotë,
  përkundrazi, paguajnë kontribute.
