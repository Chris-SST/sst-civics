    question_de: Was versteht man unter dem Begriff «Romandie» oder «Welschland»?
    options_de:
      a: Der italienischsprachige Teil der Schweiz
      b: Der französischsprachige Teil der Schweiz
      c: Der rätoromanischsprachige Teil der Schweiz
      d: Der deutschsprachige Teil der Schweiz
    explanation_de: Mit Romandie oder Welschland werden die Gebiete der Schweiz bezeichnet, in denen Französisch
      gesprochen wird. Dazu gehören zum Beispiel die Kantone Genf und Waadt. Der italienischsprachige
      Teil ist hauptsächlich das Tessin.
