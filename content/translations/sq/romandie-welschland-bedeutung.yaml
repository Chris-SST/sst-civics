id: romandie-welschland-bedeutung
lang: sq
source_version: 1
question: Çfarë nënkuptohet me termin «Romandie» ose «Welschland»?
options:
  a: Pjesa italishtfolëse e Zvicrës
  b: Pjesa frëngjishtfolëse e Zvicrës
  c: Pjesa retoromanishtfolëse e Zvicrës
  d: Pjesa gjermanishtfolëse e Zvicrës
explanation: Me Romandie ose Welschland quhen zonat e Zvicrës ku flitet frëngjisht. Këtu bëjnë pjesë,
  për shembull, kantonet Zhenevë dhe Vaud. Pjesa italishtfolëse është kryesisht Tiçino.
