    question_de: Welche Folgen hatte die Reformation für die Schweiz?
    options_de:
      a: Die Schweiz wurde in religiöser Hinsicht in einen protestantischen (reformierten) und einen katholischen
        Teil gespalten.
      b: Die Schweiz wurde Teil des Deutschen Reiches.
      c: Die Kirche verlor überall jeden Einfluss auf die Politik.
      d: Alle Orte der Eidgenossenschaft wurden protestantisch (reformiert).
    explanation_de: Einige Orte nahmen die Reformation an, während andere katholisch blieben. So entstand
      ein religiöser Gegensatz, der die Eidgenossenschaft lange belastete. Es gab auch Konflikte zwischen
      den Konfessionen.
