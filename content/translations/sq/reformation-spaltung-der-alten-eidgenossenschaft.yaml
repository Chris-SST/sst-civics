id: reformation-spaltung-der-alten-eidgenossenschaft
lang: sq
source_version: 1
question: Çfarë pasoje pati Reforma për Zvicrën?
options:
  a: Zvicra u nda në aspektin fetar në një pjesë protestante (reformuese) dhe një pjesë katolike.
  b: Zvicra u bë pjesë e Perandorisë Gjermane.
  c: Kisha humbi kudo çdo ndikim mbi politikën.
  d: Të gjitha vendet (Orte) e Konfederatës u bënë protestante (reformuese).
explanation: Disa vende e pranuan Reformën, ndërsa të tjerë mbetën katolikë. Kështu lindi një kontrast
  fetar, që e ngarkoi gjatë Konfederatën. Pati edhe konflikte mes konfesioneve.
