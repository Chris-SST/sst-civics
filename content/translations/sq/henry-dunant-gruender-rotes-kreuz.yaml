id: henry-dunant-gruender-rotes-kreuz
lang: sq
source_version: 2
question: Kush konsiderohet themeluesi i Kryqit të Kuq në Gjenevë?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: Gjenevasi Henry Dunant pa në vitin 1859, pas betejës së Solferinos, se shumë të plagosur
  mbetën pa ndihmë. Prandaj ai u angazhua për kujdesin ndaj tyre dhe në vitin 1863 u krijua në Gjenevë
  Kryqi i Kuq. Për këtë, Dunant mori në vitin 1901, së bashku me Frédéric Passy, çmimin e parë Nobel për
  Paqen.
