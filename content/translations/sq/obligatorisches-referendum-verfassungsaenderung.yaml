id: obligatorisches-referendum-verfassungsaenderung
lang: sq
source_version: 1
question: Për cilën projektpropozim duhet të votohet gjithmonë në Zvicër, edhe kur nuk mblidhen firma?
options:
  a: Për çdo ligj të ri federal
  b: Për çdo ndryshim të Kushtetutës Federale
  c: Për çdo urdhëresë të Këshillit Federal (Bundesrat)
  d: Për çdo buxhet të Konfederatës
explanation: Çdo ndryshim i Kushtetutës Federale duhet t'i paraqitet detyrimisht popullit dhe kantoneve.
  Kjo quhet referendum i detyrueshëm. Ligjet federale i nnënshtrohen vetëm referendumit fakultativ.
