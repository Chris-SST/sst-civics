id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: sq
source_version: 1
question: Parashikimi për pleqërinë në Zvicër bazohet në tri shtylla. Cila institucion përbën shtyllën
  e dytë?
options:
  a: Përfitimet plotësuese të sigurimit të pleqërisë dhe të të mbijetuarve (AHV)
  b: Sigurimi i pleqërisë dhe i të mbijetuarve (AHV) (sigurimi shtetëror i pensionit)
  c: Arka e pensioneve (parashikimi profesional)
  d: Llogaria private e kursimit me zbritje tatimore (shtylla 3a)
explanation: Arka e pensioneve i përket parashikimit profesional dhe përbën shtyllën e dytë. Ajo plotëson
  sigurimin e pleqërisë dhe të të mbijetuarve, në mënyrë që pensionistët dhe pensionistet të mund ta vazhdojnë
  standardin e tyre të zakonshëm të jetesës në një mënyrë të përshtatshme. Sigurimi i pleqërisë dhe i
  të mbijetuarve është shtylla e parë, parashikimi privat është shtylla e tretë.
