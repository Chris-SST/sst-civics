    question_de: Die Altersvorsorge in der Schweiz beruht auf drei Säulen. Welche Institution bildet die
      zweite Säule?
    options_de:
      a: Ergänzungsleistungen zur Alters- und Hinterlassenenversicherung (AHV)
      b: Alters- und Hinterlassenenversicherung (AHV) (staatliche Rentenversicherung)
      c: Pensionskasse (berufliche Vorsorge)
      d: Privates Sparkonto mit Steuerabzug (Säule 3a)
    explanation_de: Die Pensionskasse gehört zur beruflichen Vorsorge und bildet die zweite Säule. Sie
      ergänzt die Alters- und Hinterlassenenversicherung, damit die Rentnerinnen und Rentner ihren gewohnten
      Lebensstandard in angemessener Weise fortführen können. Die Alters- und Hinterlassenenversicherung
      ist die erste Säule, die private Vorsorge ist die dritte Säule.
