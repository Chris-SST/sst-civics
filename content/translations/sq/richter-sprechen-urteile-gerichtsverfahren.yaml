id: richter-sprechen-urteile-gerichtsverfahren
lang: sq
source_version: 1
question: Kush shqiptoi aktgjykimin në një procedurë gjyqësore?
options:
  a: Gjyqtarja ose gjyqtari
  b: Policja ose polici
  c: Kryetarja ose kryetari i komunës (Gemeinde)
  d: Prokurorja ose prokurori
explanation: Gjyqtaret dhe gjyqtarët vendosin në mënyrë të pavarur në procedurat gjyqësore dhe marrin
  aktgjykimin. Prokuroria zhvillon hetimin dhe ngre aktakuzën. Policia heton, por nuk shqipton aktgjykim.
