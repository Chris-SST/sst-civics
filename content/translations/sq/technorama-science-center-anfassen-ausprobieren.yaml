    question_de: In welcher Institution im Kanton Zürich können Besucher die naturwissenschaftlichen und
      technischen Phänomene selbst anfassen und ausprobieren?
    options_de:
      a: Im Opernhaus Zürich
      b: Im Technorama in Winterthur
      c: Im Landesmuseum Zürich
