id: technorama-science-center-anfassen-ausprobieren
lang: sq
source_version: 1
question: Në cilën institucion në kantonin e Cyrihut mund t'i prekin dhe t'i provojnë vetë vizitorët ddukuritë
  shkencore natyrore dhe teknike?
options:
  a: Në Operën e Cyrihut (Opernhaus Zürich)
  b: Në Technorama në Winterthur
  c: Në Muzeun Kombëtar të Cyrihut (Landesmuseum Zürich)
  d: Në Shtëpinë e Artit të Cyrihut (Kunsthaus Zürich)
explanation: Technorama në Winterthur është një qendër shkencore (Science Center). Vizitorët eksperimentojnë
  vetë në objektet e ekspozuara. Kunsthaus, Landesmuseum dhe Opernhaus shfaqin art, histori dhe shfaqje
  skenike.
