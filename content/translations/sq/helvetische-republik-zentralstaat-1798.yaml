    question_de: Was geschah im Jahr 1798 unter dem Einfluss von Napoleon Bonaparte mit der Schweiz?
    options_de:
      a: Sie wurde Teil des Deutschen Reiches.
      b: Sie wurde eine Monarchie mit einem eigenen König.
      c: Sie wurde für immer in zwei Staaten aufgeteilt.
      d: Sie wurde vorübergehend ein zentralisierter Staat, die Helvetische Republik.
    explanation_de: Im Jahr 1798, nach dem Einmarsch der französischen Truppen, entstand die Helvetische
      Republik. Sie war ein zentral regierter Einheitsstaat und ersetzte vorübergehend die alte Eidgenossenschaft.
      Die Kantone hatten nur wenige eigene Rechte.
