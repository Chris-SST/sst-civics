id: helvetische-republik-zentralstaat-1798
lang: sq
source_version: 1
question: Çfarë ndodhi me Zvicrën në vitin 1798 nën ndikimin e Napoleon Bonapartit?
options:
  a: Ajo u bë pjesë e Perandorisë Gjermane.
  b: Ajo u bë monarki me mbret të vet.
  c: Ajo u nda përgjithmonë në dy shtete.
  d: Ajo u bë përkohësisht shtet i centralizuar, Republika Helvetike.
explanation: Në vitin 1798, pas hyrjes së trupave franceze, lindi Republika Helvetike. Ajo ishte një shtet
  unitar i qeverisur në mënyrë të centralizuar dhe e zëvendësoi përkohësisht Konfederatën e vjetër. Kantonet
  kishin vetëm pak të drejta të veta.
