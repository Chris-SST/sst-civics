    question_de: Wie war die wirtschaftliche Lage der Schweiz in den Jahrzehnten nach dem Zweiten Weltkrieg,
      zum Beispiel in den 1960er Jahren?
    options_de:
      a: 'Die Lage verbesserte sich stetig: Es gab viel Arbeit und der Wohlstand vieler Menschen nahm
        zu.'
      b: Die Wirtschaft schrumpfte stark und viele Menschen blieben ohne Arbeit.
      c: Die Schweiz wurde Mitglied der Europäischen Union.
      d: Die Schweiz brauchte keine Arbeitskräfte mehr von aussen.
    explanation_de: Nach dem Zweiten Weltkrieg wuchs die Schweizer Wirtschaft kräftig. Es gab viel Arbeit
      und viele Menschen konnten sich mehr leisten. Deshalb holten die Unternehmen viele Arbeitskräfte
      aus dem Ausland, anfangs vor allem aus Italien.
