lang: sq
source_version: 2
question: Si ishte gjendja ekonomike e Zvicrës në dekadat pas Luftës së Dytë Botërore, për shembull në
  vitet 1960?
options:
  a: 'Gjendja po përmirësohej vazhdimisht: kishte shumë punë dhe mirëqenia e shumë njerëzve po rritej.'
  b: Ekonomia u tkurr fort dhe shumë njerëz mbetën pa punë.
  c: Zvicra u bë anëtare e Bashkimit Evropian.
  d: Zvicra nuk kishte më nevojë për fuqi punëtore nga jashtë.
explanation: Pas Luftës së Dytë Botërore ekonomia zvicerane u rrit fuqishëm. Kishte shumë punë dhe shumë
  njerëz mund t'i lejonin vetes më shumë. Prandaj kompanitë sollën shumë fuqi punëtore nga jashtë, në
  fillim kryesisht nga Italia.
