id: gemeinden-finanzieren-sozialhilfe
lang: sq
source_version: 1
question: Kush financon në kantonin e Cyrihut ndihmën sociale për njerëzit që gjenden në nevojë?
options:
  a: Vetëm kishat
  b: Banka Kombëtare Zvicerane
  c: Shoqatat e punëdhënësve
  d: Komunat (Gemeinden)
explanation: Në kantonin e Cyrihut, komunat (Gemeinden) janë përgjegjëse për ndihmën sociale dhe i mbulojnë
  kostot e saj. Kjo mund t'i rëndojë shumë komunat më të vogla. Prandaj ekziston barazimi financiar (Finanzausgleich).
