id: stadtzuericher-parlament-direkt-gewaehlt
lang: sq
source_version: 1
question: Si zgjidhet parlamenti i qytetit të Cyrihut, këshilli komunal (Gemeinderat)?
options:
  a: E emëron Këshilli Qeveritar (Regierungsrat) i kantonit
  b: Këshilli i Qytetit (Stadtrat) i përcakton vetë anëtarët
  c: Partitë i shortojnë vendet mes tyre
  d: Popullsia e zgjedh drejtpërdrejt me votim në kuti
explanation: Qytetarët me të drejtë vote të qytetit të Cyrihut e zgjedhin këshillin komunal në zgjedhje
  të përgjithshme. Ai është parlamenti i qytetit dhe zëvendëson kuvendin e komunës (Gemeindeversammlung).
