    question_de: Wie wird das Parlament der Stadt Zürich, der Gemeinderat, gewählt?
    options_de:
      a: Der Regierungsrat des Kantons ernennt es
      b: Der Stadtrat bestimmt die Mitglieder selbst
      c: Die Parteien losen die Sitze untereinander aus
      d: Die Bevölkerung wählt es direkt an der Urne
    explanation_de: Die stimmberechtigten Bürgerinnen und Bürger der Stadt Zürich wählen den Gemeinderat
      in allgemeinen Wahlen. Er ist das Parlament der Stadt und ersetzt die Gemeindeversammlung.
