    question_de: Wer kann in den Nationalrat, in den Bundesrat oder in das Bundesgericht gewählt werden?
    options_de:
      a: Nur wer eine Hochschule abgeschlossen hat
      b: Nur wer seit mindestens zehn Jahren in der Schweiz lebt
      c: Nur wer Mitglied einer politischen Partei ist
      d: Alle stimmberechtigten Schweizer Staatsangehörigen ab 18 Jahren
    explanation_de: Gemäss der Bundesverfassung können alle stimmberechtigten Personen gewählt werden.
      Stimmberechtigt sind Schweizer Staatsangehörige ab 18 Jahren. Eine Parteimitgliedschaft wird nicht
      verlangt, ebenso wenig eine bestimmte Ausbildung.
