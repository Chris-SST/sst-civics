id: waehlbar-in-bundesamt-voraussetzungen
lang: sq
source_version: 2
question: Kush mund të zgjidhet në Këshillin Kombëtar (Nationalrat), në Këshillin Federal (Bundesrat)
  ose në Gjykatën Federale (Bundesgericht)?
options:
  a: Vetëm ai që ka përfunduar një shkollë të lartë
  b: Vetëm ai që jeton në Zvicër prej të paktën dhjetë vitesh
  c: Vetëm ai që është anëtar i një partie politike
  d: Të gjithë shtetasit zviceranë me të drejtë vote, nga mosha 18 vjeç
explanation: Sipas Kushtetutës Federale, të gjithë personat me të drejtë vote mund të zgjidhen. Me të
  drejtë vote janë shtetasit zviceranë nga mosha 18 vjeç. Nuk kërkohet anëtarësim në parti dhe as një
  arsim i caktuar.
