question: Në shekullin e 19-të shumë njerëz e lanë Zvicrën dhe emigruan, për shembull, në Amerikë. Cila
  ishte një arsye e rëndësishme për këtë?
options:
  a: Nevoja dhe mungesa e punës e kërcënonin ekzistencën e tyre.
  b: Konfederata ua ndaloi të jetonin në Zvicër.
  c: Zvicra kishte shumë pak hapësirë për fabrika.
  d: Jashtë vendit nuk kishte taksa për të ardhurit e rinj.
explanation: Në shekullin e 19-të Zvicra ishte ende një vend emigrimi. Uria, varfëria dhe mungesa e punës
  i shtynë shumë njerëz të kërkonin një jetë të re jashtë vendit. Vetëm më vonë Zvicra u bë vend imigrimi.
