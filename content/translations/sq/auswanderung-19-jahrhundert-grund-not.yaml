    question_de: Im 19. Jahrhundert verliessen viele Menschen die Schweiz und wanderten zum Beispiel nach
      Amerika aus. Was war ein wichtiger Grund dafür?
    options_de:
      a: Not und Mangel an Arbeit bedrohten ihre Existenz.
      b: Der Bund verbot ihnen, in der Schweiz zu leben.
      c: Die Schweiz hatte sehr wenig Platz für Fabriken.
      d: Im Ausland gab es keine Steuern für Neuankömmlinge.
    explanation_de: Im 19. Jahrhundert war die Schweiz noch ein Auswanderungsland. Hunger, Armut und Mangel
      an Arbeit trieben viele Menschen dazu, ein neues Leben im Ausland zu suchen. Erst später wurde die
      Schweiz zu einem Einwanderungsland.
