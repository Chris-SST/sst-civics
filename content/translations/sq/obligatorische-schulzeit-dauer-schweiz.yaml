    question_de: Wie viele Jahre dauert die obligatorische Schule im Kanton Zürich, wenn auch der Kindergarten
      mitgerechnet wird?
    options_de:
      a: Elf Jahre
      b: Zehn Jahre
      c: Zwölf Jahre
      d: Neun Jahre
    explanation_de: 'Im Kanton Zürich besuchen alle Kinder die obligatorische Schule elf Jahre lang: zwei
      Jahre Kindergarten, sechs Jahre Primarschule (Primarschule) und drei Jahre Sekundarstufe I. Die
      meisten Kantone haben diese Dauer durch das HarmoS-Konkordat vereinheitlicht. Einige Kantone sind
      dem jedoch nicht beigetreten, und dort ist in manchen Fällen nur ein Jahr Kindergarten obligatorisch.'
