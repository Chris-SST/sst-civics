id: obligatorische-schulzeit-dauer-schweiz
lang: sq
source_version: 3
question: Sa vjet zgjat shkolla e detyrueshme në kantonin Cyrih, nëse llogaritet edhe kopshti?
options:
  a: Njëmbëdhjetë vjet
  b: Dhjetë vjet
  c: Dymbëdhjetë vjet
  d: Nëntë vjet
explanation: 'Në kantonin Cyrih të gjithë fëmijët ndjekin shkollën e detyrueshme për njëmbëdhjetë vjet:
  dy vjet kopsht, gjashtë vjet shkollë fillore (Primarschule) dhe tre vjet shkallë sekondare I. Shumica
  e kantoneve e kanë unifikuar këtë kohëzgjatje përmes konkordatit HarmoS. Disa kantone, megjithatë, nuk
  iu bashkuan, dhe atje në disa raste është i detyrueshëm vetëm një vit kopsht.'
