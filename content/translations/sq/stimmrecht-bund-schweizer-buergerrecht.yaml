id: stimmrecht-bund-schweizer-buergerrecht
lang: sq
source_version: 1
question: Cila është një kusht për të drejtën e votës dhe të zgjedhjes në nivel të Konfederatës?
options:
  a: Shtetësia (Bürgerrecht) zvicerane
  b: Anëtarësimi në një parti politike
  c: Të paktën dhjetë vjet banim në Zvicër
  d: Një leje vendosjeje (leja C) (Niederlassungsbewilligung)
explanation: Në nivel të Konfederatës mund të zgjedhin dhe të votojnë vetëm personat me shtetësi zvicerane.
  Të huajt nuk kanë të drejtën e votës dhe të zgjedhjes në nivel të Konfederatës, as me një leje vendosjeje.
  Anëtarësimi në parti nuk është i nevojshëm.
