id: anzahl-politische-gemeinden-ende-2021
lang: sq
source_version: 1
question: Sa komuna politike (Gemeinde) kishte afërsisht në Zvicër në fund të vitit 2021?
options:
  a: Rreth 1200
  b: Rreth 800
  c: Rreth 2200
  d: Rreth 4200
explanation: Në fund të vitit 2021 Zvicra numëronte rreth 2200 komuna politike. Numri i tyre bie ngadalë,
  sepse komunat bashkohen vazhdimisht me njëra-tjetrën. Prandaj gjendja e çastit është e rëndësishme.
