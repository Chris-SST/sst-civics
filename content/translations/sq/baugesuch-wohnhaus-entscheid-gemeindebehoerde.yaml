    question_de: Wer entscheidet im Kanton Zürich in der Regel über das Baubewilligungsgesuch für ein
      neues Wohnhaus?
    options_de:
      a: Der Regierungsrat
      b: Die Baubehörde der Gemeinde
      c: Das Bezirksgericht
      d: Das Bundesamt für Raumentwicklung
    explanation_de: Baugesuche für Wohnhäuser werden bei der Gemeinde eingereicht. Die kommunale Baubehörde
      prüft das Gesuch und erteilt entweder die Baubewilligung oder lehnt sie ab. Der Kanton ist nur in
      besonderen Fällen beteiligt.
