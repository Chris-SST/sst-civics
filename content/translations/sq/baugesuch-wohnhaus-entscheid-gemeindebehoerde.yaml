id: baugesuch-wohnhaus-entscheid-gemeindebehoerde
lang: sq
source_version: 1
question: Kush vendos në kantonin e Cyrihut, si rregull, për kërkesën për leje ndërtimi të një shtëpie
  të re banimi?
options:
  a: Këshilli Qeveritar (Regierungsrat)
  b: Autoriteti i ndërtimit i komunës (Gemeinde)
  c: Gjykata e rrethit
  d: Zyra Federale për Zhvillim Hapësinor
explanation: Kërkesat për leje ndërtimi për shtëpi banimi dorëzohen në komunë. Autoriteti komunal i ndërtimit
  e shqyrton kërkesën dhe ose e jep lejen e ndërtimit, ose e refuzon atë. Kantoni përfshihet vetëm në
  raste të veçanta.
