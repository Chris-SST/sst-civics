id: krankenversicherung-obligatorisch-einwohner
lang: sq
source_version: 1
question: Kush duhet të lidhë një sigurim shëndetësor në Zvicër?
options:
  a: Vetëm personat me shtetësi (Bürgerrecht) zvicerane
  b: Të gjithë personat që banojnë në Zvicër
  c: Vetëm personat nën 65 vjeç
  d: Vetëm personat që punojnë
explanation: Sigurimi i detyrueshëm shëndetësor (Krankenpflegeversicherung) vlen për të gjithë personat
  me vendbanim në Zvicër. Shtetësia, puna dhe mosha nuk kanë rëndësi. Sigurimi duhet të lidhet brenda
  tre muajve pas ardhjes në Zvicër.
