id: volksinitiative-sammelfrist-monate
lang: sq
source_version: 1
question: Sa kohë kanë nismëtarët në dispozicion për të mbledhur nënshkrimet për një nismë popullore (Volksinitiative)
  federale?
options:
  a: 6 muaj
  b: 12 muaj
  c: 18 muaj
  d: 36 muaj
explanation: Afati i mbledhjes është 18 muaj nga publikimi në Fletën Federale (Bundesblatt). Nëse ata
  nuk arrijnë të mbledhin brenda kësaj kohe 100 000 nënshkrimet e nevojshme, nisma nuk realizohet.
