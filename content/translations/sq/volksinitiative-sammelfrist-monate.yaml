    question_de: Wie viel Zeit haben die Initianten zur Verfügung, um die Unterschriften für eine eidgenössische
      Volksinitiative zu sammeln?
    options_de:
      a: 6 Monate
      b: 12 Monate
      c: 18 Monate
      d: 36 Monate
    explanation_de: Die Sammelfrist beträgt 18 Monate ab der Veröffentlichung im Bundesblatt. Wenn es
      ihnen nicht gelingt, innerhalb dieser Zeit die erforderlichen 100 000 Unterschriften zu sammeln,
      kommt die Initiative nicht zustande.
