id: stichfrage-initiative-und-gegenvorschlag
lang: sq
source_version: 1
question: Në një votim mbi një nismë popullore (Volksinitiative) dhe një kundërpropozim të drejtpërdrejtë
  ka një pyetje vendimtare. Për çfarë shërben ajo?
options:
  a: Ajo vendos nëse votimi duhet të përsëritet
  b: Ajo vendos nëse kantonet lejohen fare të votojnë bashkë
  c: Ajo vendos se cili projekt vlen, nëse pranohen të dyja
  d: Ajo vendos nëse nënshkrimet duhet të kontrollohen edhe një herë
explanation: Qytetarët me të drejtë vote mund t'i miratojnë si nismën, ashtu edhe kundërpropozimin. Me
  pyetjen vendimtare ata tregojnë se cili projekt duhet të hyjë në fuqi, nëse pranohen të dyja. Kështu
  votat nuk mund të humbasin midis dy projekteve të ngjashme.
