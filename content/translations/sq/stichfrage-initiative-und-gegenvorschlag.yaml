    source_version: 1
    question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenentwurf gibt es
      eine Stichfrage. Wozu dient sie?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Kantone überhaupt gemeinsam abstimmen dürfen
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften noch einmal überprüft werden müssen
    explanation_de: Die stimmberechtigten Bürger können sowohl die Initiative als auch den Gegenentwurf
      annehmen. Mit der Stichfrage geben sie an, welche Vorlage in Kraft treten soll, wenn beide angenommen
      werden. So können die Stimmen nicht zwischen zwei ähnlichen Vorlagen verloren gehen.
