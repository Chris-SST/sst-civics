    source_version: 1
    question_de: Gegen ein neues Bundesgesetz wurde das fakultative Referendum ergriffen. Was ist nötig,
      damit das Gesetz in der Volksabstimmung angenommen wird?
    options_de:
      a: Die Mehrheit der Stimmenden in der ganzen Schweiz
      b: Eine Zweidrittelmehrheit der Stimmenden
      c: Nur die Mehrheit der Kantone
      d: Die Mehrheit der Stimmenden und die Mehrheit der Kantone
    explanation_de: Bei einem fakultativen Referendum gegen ein Bundesgesetz gilt nur das Volksmehr, also
      die Mehrheit der gültigen Stimmen in der ganzen Schweiz. Das Ständemehr (Mehrheit der Kantone) ist
      zusätzlich nur für Änderungen der Bundesverfassung und für einige Staatsverträge nötig.
