id: bundesgesetz-referendum-volksmehr-genuegt
lang: sq
source_version: 1
question: Kundër një ligji të ri federal është ngritur referendumi fakultativ. Çfarë nevojitet që ligji
  të miratohet në votimin popullor?
options:
  a: Shumica e votuesve në të gjithë Zvicrën
  b: Një shumicë prej dy të tretave e votuesve
  c: Shumica e kantoneve vetëm
  d: Shumica e votuesve dhe shumica e kantoneve
explanation: Në rastin e një referendumi fakultativ kundër një ligji federal vlen vetëm shumica e popullit
  (Volksmehr), pra shumica e votave të vlefshme në të gjithë Zvicrën. Shumica e kantoneve (Ständemehr)
  nevojitet shtesë vetëm për ndryshimet e Kushtetutës Federale dhe për disa traktate shtetërore.
