id: nachbarland-im-sueden-der-schweiz
lang: sq
source_version: 1
question: Cili shtet ndodhet në jug të Zvicrës dhe kufizohet me të?
options:
  a: Spanja
  b: Italia
  c: Sllovenia
  d: Franca
explanation: Italia është fqinji jugor i Zvicrës. Kufiri kalon, ndër të tjera, nëpër Alpet dhe përmes
  Tiçinos (Tessin) dhe Graubündenit. Spanja dhe Sllovenia nuk kufizohen me Zvicrën.
