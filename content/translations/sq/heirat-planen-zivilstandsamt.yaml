id: heirat-planen-zivilstandsamt
lang: sq
source_version: 1
question: Në cilën zyrë drejtohen çiftet që dëshirojnë të martohen?
options:
  a: Te Bordi i shkollës (Schulpflege)
  b: Te Zyra e gjendjes civile
  c: Te Zyra e tatimeve
  d: Te Zyra e përmbarimit
explanation: Zyra e gjendjes civile përgatit dhe kryen martesën. Ajo regjistron zyrtarisht edhe ngjarje
  të tjera, si lindjet dhe vdekjet.
