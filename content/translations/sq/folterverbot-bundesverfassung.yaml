id: folterverbot-bundesverfassung
lang: sq
source_version: 1
question: Çfarë thotë Kushtetuta Federale për torturën?
options:
  a: Tortura është e ndaluar vetëm për autorët e veprave penale.
  b: Tortura është e lejuar për policinë në raste urgjence.
  c: Tortura është e lejuar nëse e miraton një gjykatë.
  d: Askush nuk mund të torturohet.
explanation: Neni 10 i Kushtetutës Federale ndalon torturën dhe çdo lloj tjetër trajtimi mizor, çnjerëzor
  ose poshtërues. Ky ndalim vlen për të gjithë njerëzit pa përjashtim. Edhe shteti nuk mund të bëjë përjashtime.
