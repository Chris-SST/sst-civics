    question_de: Was sagt die Bundesverfassung über die Folter?
    options_de:
      a: Die Folter ist nur für die Täter von Straftaten verboten.
      b: Die Folter ist für die Polizei in dringenden Fällen erlaubt.
      c: Die Folter ist erlaubt, wenn ein Gericht sie genehmigt.
      d: Niemand darf gefoltert werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet die Folter und jede andere Art grausamer,
      unmenschlicher oder erniedrigender Behandlung. Dieses Verbot gilt für alle Menschen ohne Ausnahme.
      Auch der Staat kann keine Ausnahmen machen.
