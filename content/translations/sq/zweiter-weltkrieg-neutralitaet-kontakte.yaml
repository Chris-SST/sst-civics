    question_de: Wie verhielt sich die Schweiz während des Zweiten Weltkriegs?
    options_de:
      a: Sie brach alle Kontakte zu den Kriegsparteien ab und schloss die Grenzen vollständig.
      b: Sie schloss sich Deutschland an und lieferte ihm Truppen.
      c: Sie blieb neutral und unterhielt politische und wirtschaftliche Kontakte zu den Kriegsparteien.
      d: Sie schloss sich dem Bündnis der Alliierten an und kämpfte gemeinsam mit ihnen.
    explanation_de: Die Schweiz wurde während des Zweiten Weltkriegs keine Kriegspartei. Dennoch unterhielt
      sie politische und wirtschaftliche Kontakte zu den Kriegsparteien. Diese Haltung wird historisch
      bis heute diskutiert.
