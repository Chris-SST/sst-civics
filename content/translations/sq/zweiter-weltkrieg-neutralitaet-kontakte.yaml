id: zweiter-weltkrieg-neutralitaet-kontakte
lang: sq
source_version: 1
question: Si u sjell Zvicra gjatë Luftës së Dytë Botërore?
options:
  a: Ajo ndërpreu të gjitha kontaktet me palët në luftë dhe mbylli plotësisht kufijtë.
  b: Ajo iu bashkua Gjermanisë dhe i furnizoi asaj trupa.
  c: Ajo mbeti neutrale dhe mbajti kontakte politike dhe ekonomike me palët në luftë.
  d: Ajo iu bashkua aleancës së Aleatëve dhe luftoi së bashku me ta.
explanation: Zvicra nuk u bë palë në luftë gjatë Luftës së Dytë Botërore. Megjithatë, ajo ruajti kontakte
  politike dhe ekonomike me palët në luftë. Ky qëndrim diskutohet historikisht edhe sot e kësaj dite.
