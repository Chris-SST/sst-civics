id: wo-wohnt-die-mehrheit-der-bevoelkerung
lang: sq
source_version: 2
question: Në cilën zonë të Zvicrës jeton shumica e popullsisë?
options:
  a: Në Alpe
  b: Në Tiçino
  c: Në Mittelland (rrafshnalta zvicerane)
  d: Në Jura
explanation: Mittelland ndodhet mes Jurasë dhe Alpeve. Aty ndodhen shumica e qyteteve të mëdha dhe aty
  jeton pjesa më e madhe e popullsisë. Alpet mbulojnë, është e vërtetë, një sipërfaqe të madhe, por janë
  të populluara vetëm pak.
