id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: sq
source_version: 1
question: Cila e drejtë themelore mbrohet në Zvicër nga Kushtetuta Federale?
options:
  a: E drejta për një të ardhur nga shteti
  b: E drejta për një makinë
  c: E drejta për një vend pune
  d: Liria e besimit dhe e ndërgjegjes
explanation: Liria e besimit dhe e ndërgjegjes përcaktohet në nenin 15 të Kushtetutës Federale. Shteti
  nuk mund ta detyrojë askënd të ketë një besim. E drejta për një vend pune ose për një të ardhur nuk
  ekziston si e drejtë themelore.
