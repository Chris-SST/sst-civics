    question_de: Welches Grundrecht wird in der Schweiz von der Bundesverfassung geschützt?
    options_de:
      a: Das Recht auf ein Einkommen vom Staat
      b: Das Recht auf ein Auto
      c: Das Recht auf einen Arbeitsplatz
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung festgelegt.
      Der Staat kann niemanden zwingen, einen Glauben zu haben. Das Recht auf einen Arbeitsplatz oder
      auf ein Einkommen existiert nicht als Grundrecht.
