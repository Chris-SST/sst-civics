    question_de: Welche dieser Steuern erheben der Kanton Zürich und die Gemeinden auf das Vermögen einer
      Person, zum Beispiel auf Bankguthaben und Wertpapiere?
    options_de:
      a: Verrechnungssteuer
      b: Mehrwertsteuer
      c: Vermögenssteuer
      d: Mineralölsteuer
    explanation_de: Der Kanton und die Gemeinden besteuern das Vermögen natürlicher Personen. Die Mehrwertsteuer,
      die Verrechnungssteuer und die Mineralölsteuer sind Steuern des Bundes.
