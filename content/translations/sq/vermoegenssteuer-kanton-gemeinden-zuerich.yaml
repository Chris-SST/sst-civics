id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: sq
source_version: 1
question: Cilat nga këto tatime vendosin kantoni i Cyrihut dhe komunat (Gemeinde) mbi pasurinë e një personi,
  për shembull mbi depozitat bankare dhe letrat me vlerë?
options:
  a: Tatimi parandalues
  b: Tatimi mbi vlerën e shtuar
  c: Tatimi mbi pasurinë
  d: Tatimi mbi vajrat minerale
explanation: Kantoni dhe komunat tatojnë pasurinë e personave fizikë. Tatimi mbi vlerën e shtuar, tatimi
  parandalues dhe tatimi mbi vajrat minerale janë tatime të Konfederatës.
