id: pfaeffikersee-im-kanton-zuerich
lang: sq
source_version: 1
question: Në cilin kanton ndodhet Pfäffikersee?
options:
  a: Kantoni Thurgau
  b: Kantoni St. Gallen
  c: Kantoni Zürich
  d: Kantoni Zug
explanation: Pfäffikersee ndodhet në Zürcher Oberland (Zürcher Oberland) dhe i përket territorit të kantonit
  të Zürichut. Ai është një nga liqenet më të mëdha në kanton. Kantonet e tjera të përmendura kufizohen
  pjesërisht me Zürichun, por nuk e përfshijnë liqenin.
