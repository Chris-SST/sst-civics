    question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz verletzt hat?
    options_de:
      a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
      b: Der Staat verfolgt und bestraft die Tat strafrechtlich; Privatjustiz ist verboten.
      c: Die geschädigte Person hat das Recht, die Strafe selbst festzulegen und sie zu vollziehen.
      d: Die Familie des Opfers hat das Recht, den Täter oder die Täterin selbst zu bestrafen.
    explanation_de: In der Schweiz hat nur der Staat das Recht, Straftaten strafrechtlich zu verfolgen
      und zu bestrafen. Dafür sind die Polizei, die Staatsanwaltschaft und die Gerichte zuständig. Wer
      sich selbst rächt, auch als Opfer oder als Familie des Opfers, kann sich durch diese Handlung selbst
      strafbar machen.
