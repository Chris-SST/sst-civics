id: selbstjustiz-verbot-staat-bestraft
lang: sq
source_version: 2
question: Çfarë vlen në Zvicër kur dikush ka shkelur një ligj?
options:
  a: Lagjja vendos së bashku për dënimin.
  b: Shteti ndjek penalisht dhe dënon veprën; drejtësia private është e ndaluar.
  c: E dëmtuara ka të drejtë ta caktojë vetë dënimin dhe ta zbatojë atë.
  d: Familja e viktimës ka të drejtë ta dënojë vetë autorin ose autoren e veprës.
explanation: Në Zvicër vetëm shteti ka të drejtën t'i ndjekë penalisht dhe t'i dënojë veprat penale. Për
  këtë janë përgjegjëse policia, prokuroria dhe gjykatat. Kush merr hak vetë, edhe si viktimë ose si familje
  e viktimës, mund të bëhet vetë i dënueshëm me këtë veprim.
