id: krankenversicherung-obligatorisch-alle-einwohner
lang: sq
source_version: 1
question: Kush duhet të ketë në Zvicër një sigurim bazë pranë një arke të sigurimit shëndetësor (Krankenkasse)?
options:
  a: të gjitha personat që jetojnë në Zvicër
  b: vetëm personat me të ardhura të ulëta
  c: vetëm personat me shtetësi (Bürgerrecht) zvicerane
  d: vetëm personat që kanë punë
explanation: Sigurimi shëndetësor është i detyrueshëm për të gjitha personat me vendbanim në Zvicër. Kjo
  vlen pavarësisht nga shtetësia, mosha apo fakti nëse personi punon. Arkat e sigurimit shëndetësor duhet
  t'i pranojnë të gjitha personat në sigurimin bazë.
