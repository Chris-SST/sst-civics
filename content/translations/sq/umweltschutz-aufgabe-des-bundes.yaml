id: umweltschutz-aufgabe-des-bundes
lang: sq
source_version: 1
question: Cili nivel në Zvicër është përgjegjës për mbrojtjen e mjedisit dhe për nxjerrjen e rregulloreve
  në këtë fushë?
options:
  a: Konfederata
  b: Organizatat private
  c: Vetëm komunat (Gemeinden)
  d: Vetëm rrethet
explanation: Kushtetuta Federale ia ngarkon Konfederatës detyrën që të mbrojë njeriun dhe mjedisin nga
  ndikimet e dëmshme. Për këtë qëllim ajo nxjerr ligje, për shembull për mbrojtjen e ujërave dhe të natyrës.
  Kantonet zbatojnë shumë nga këto rregullore.
