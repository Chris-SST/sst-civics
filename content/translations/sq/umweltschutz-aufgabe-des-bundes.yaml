    question_de: Welche Ebene in der Schweiz ist für den Umweltschutz und für den Erlass von Vorschriften
      in diesem Bereich zuständig?
    options_de:
      a: Der Bund
      b: Private Organisationen
      c: Nur die Gemeinden
      d: Nur die Bezirke
    explanation_de: Die Bundesverfassung überträgt dem Bund die Aufgabe, den Menschen und die Umwelt vor
      schädlichen Einwirkungen zu schützen. Zu diesem Zweck erlässt er Gesetze, zum Beispiel zum Schutz
      der Gewässer und der Natur. Die Kantone setzen viele dieser Vorschriften um.
