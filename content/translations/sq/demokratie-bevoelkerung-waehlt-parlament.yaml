    question_de: Was gehört zu den Rechten der Bevölkerung in einer Demokratie wie der Schweiz?
    options_de:
      a: Sie ernennt die Richter des Bundesgerichts durch das Los.
      b: Sie legt die Gesetze allein fest, ohne das Parlament.
      c: Sie bestimmt ihr eigenes Parlament durch Wahlen.
      d: Sie wählt die Führung der Armee direkt.
    explanation_de: In einer Demokratie wählt die Bevölkerung ihre Vertreter ins Parlament. Auf Ebene
      des Bundes sind dies der Nationalrat und der Ständerat. Das Parlament erlässt dann die Gesetze des
      Bundes im Namen des Volkes.
