id: demokratie-bevoelkerung-waehlt-parlament
lang: sq
source_version: 1
question: Çfarë bën pjesë te të drejtat e popullsisë në një demokraci si Zvicra?
options:
  a: Ajo i emëron gjyqtarët e Gjykatës Federale (Bundesgericht) me short.
  b: Ajo përcakton ligjet vetëm, pa Parlamentin.
  c: Ajo e përcakton Parlamentin e vet përmes zgjedhjeve.
  d: Ajo zgjedh drejtpërdrejt udhëheqjen e ushtrisë.
explanation: Në demokraci, popullsia zgjedh përfaqësuesit e saj në Parlament. Në nivel të Konfederatës
  këta janë Këshilli Kombëtar (Nationalrat) dhe Këshilli i Shteteve (Ständerat). Parlamenti pastaj nxjerr
  ligjet e Konfederatës në emër të popullit.
