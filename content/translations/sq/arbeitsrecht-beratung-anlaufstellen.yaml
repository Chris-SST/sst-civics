id: arbeitsrecht-beratung-anlaufstellen
lang: sq
source_version: 1
question: Kush ndihmon me pyetjet rreth të drejtës së punës?
options:
  a: Bordi shkollor (Schulpflege) dhe komuna kishtare
  b: Avokatia, sindikatat dhe gjykatat e punës
  c: Ndërmarrjet e transportit publik dhe posta
  d: Zyrat e gjendjes civile dhe kontrolli i banorëve
explanation: Për pyetjet rreth të drejtës së punës ka disa vende ku mund të drejtoheni. Mes tyre janë
  avokatët dhe avokatet, sindikatat dhe gjykatat e punës. Zyrat e tjera janë përgjegjëse për detyra të
  tjera.
