    question_de: Wer hilft bei Fragen zum Arbeitsrecht?
    options_de:
      a: Die Schulpflege und die Kirchgemeinde
      b: Die Anwaltschaft, die Gewerkschaften und die Arbeitsgerichte
      c: Die öffentlichen Verkehrsbetriebe und die Post
      d: Die Zivilstandsämter und die Einwohnerkontrolle
    explanation_de: Bei Fragen zum Arbeitsrecht gibt es mehrere Stellen, an die Sie sich wenden können.
      Dazu gehören die Anwälte und Anwältinnen, die Gewerkschaften und die Arbeitsgerichte. Die anderen
      Stellen sind für andere Aufgaben zuständig.
