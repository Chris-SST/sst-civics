id: landessprachen-der-schweiz-aufzaehlung
lang: sq
source_version: 1
question: Cilat gjuhë janë gjuhë kombëtare në Zvicër?
options:
  a: Gjermanisht, frëngjisht, retoromanisht dhe spanjisht
  b: Gjermanisht, frëngjisht, italisht dhe retoromanisht
  c: Gjermanisht, frëngjisht, italisht dhe anglisht
  d: Gjermanisht, frëngjisht dhe italisht
explanation: Kushtetuta Federale (Bundesverfassung) përmend gjermanishten, frëngjishten, italishten dhe
  retoromanishten si gjuhë kombëtare. Anglishtja nuk është gjuhë kombëtare, por përdoret shpesh si gjuhë
  komunikimi.
