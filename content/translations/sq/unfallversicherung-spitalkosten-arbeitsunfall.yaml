    question_de: Eine Mitarbeiterin hat einen schweren Arbeitsunfall und muss ins Spital eingeliefert
      werden. Welche Versicherung deckt die Spitalkosten?
    options_de:
      a: Die Arbeitslosenversicherung
      b: Die Unfallversicherung
      c: Die Erwerbsersatzordnung
      d: Die Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt die Behandlungskosten bei Arbeitsunfällen,
      also zum Beispiel die Spitalkosten. Die Arbeitnehmer sind dagegen über den Arbeitgeber versichert.
      Die anderen genannten Versicherungen decken andere Risiken ab.
