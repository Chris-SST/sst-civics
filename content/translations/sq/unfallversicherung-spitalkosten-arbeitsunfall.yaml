id: unfallversicherung-spitalkosten-arbeitsunfall
lang: sq
source_version: 1
question: Një punonjëse ka një aksident të rëndë në punë dhe duhet të shtrohet në spital. Cili sigurim
  i mbulon shpenzimet e spitalit?
options:
  a: Sigurimi i papunësisë
  b: Sigurimi kundër aksidenteve
  c: Skema e kompensimit të të ardhurave (Erwerbsersatzordnung)
  d: Sigurimi i pleqërisë dhe i të mbijetuarve
explanation: Sigurimi i detyrueshëm kundër aksidenteve paguan shpenzimet e mjekimit në rast aksidentesh
  në punë, pra për shembull shpenzimet e spitalit. Punëmarrësit janë të siguruar kundër tyre nëpërmjet
  punëdhënësit. Sigurimet e tjera të përmendura mbulojnë risqe të tjera.
