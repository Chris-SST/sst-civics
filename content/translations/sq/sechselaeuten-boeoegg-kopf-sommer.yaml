    question_de: Was bedeutet es gemäss dem Volksglauben, wenn am Sechseläuten der Kopf des Bööggs schnell
      brennt?
    options_de:
      a: Der kommende Sommer wird regnerisch sein.
      b: Der kommende Winter wird besonders kalt sein.
      c: Der kommende Sommer wird schön sein.
      d: Die Herbsternte wird schlecht ausfallen.
    explanation_de: 'Der Böögg ist eine Schneefigur, die am Sechseläuten in Zürich verbrannt wird. Der
      Volksglaube besagt: Je schneller ihm der Kopf verbrennt oder explodiert, desto schöner wird der
      kommende Sommer.'
