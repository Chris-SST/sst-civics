id: sechselaeuten-boeoegg-kopf-sommer
lang: sq
source_version: 2
question: Çfarë nënkupton sipas besimit popullor, nëse në Sechseläuten koka e Bööggut digjet shpejt?
options:
  a: Vera që vjen do të jetë me shumë shi.
  b: Dimri që vjen do të jetë veçanërisht i ftohtë.
  c: Vera që vjen do të jetë e bukur.
  d: Të korrat e vjeshtës do të jenë të dobëta.
explanation: 'Böögg është një figurë dëbore që digjet në Sechseläuten në Zürich. Besimi popullor thotë:
  sa më shpejt që t''i digjet ose t''i shpërthejë koka, aq më e bukur do të jetë vera që vjen.'
