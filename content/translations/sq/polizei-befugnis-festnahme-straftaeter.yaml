    question_de: Welche Instanz hat das Recht, Personen zu verhaften, die verdächtigt werden, eine Straftat
      begangen zu haben?
    options_de:
      a: Die Schulbehörde
      b: Die Polizei
      c: Das Parlament
      d: Das Steueramt
    explanation_de: Die Polizei hat das Recht, Personen zu verhaften, die einer Straftat verdächtigt werden,
      unter den gesetzlich festgelegten Bedingungen. Ob jemand schuldig ist, entscheidet danach ein Gericht.
      Die Schulbehörde, das Parlament und das Steueramt haben diese Zuständigkeit nicht.
