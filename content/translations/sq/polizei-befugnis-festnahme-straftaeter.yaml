id: polizei-befugnis-festnahme-straftaeter
lang: sq
source_version: 2
question: Cila instancë ka të drejtë të arrestojë persona që dyshohen se kanë kryer një vepër penale?
options:
  a: Autoriteti shkollor
  b: Policia
  c: Parlamenti
  d: Zyra e tatimeve
explanation: Policia ka të drejtë të arrestojë persona që dyshohen për një vepër penale, nën kushtet e
  përcaktuara me ligj. Nëse dikush është fajtor, vendos më pas një gjykatë. Autoriteti shkollor, parlamenti
  dhe zyra e tatimeve nuk e kanë këtë kompetencë.
