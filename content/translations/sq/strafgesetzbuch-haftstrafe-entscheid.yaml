id: strafgesetzbuch-haftstrafe-entscheid
lang: sq
source_version: 1
question: Sipas cilit ligji varet nëse dikush duhet të vuajë një dënim me burg?
options:
  a: Sipas Kodit Civil
  b: Sipas Ligjit të Detyrimeve
  c: Sipas së drejtës së qirasë
  d: Sipas Kodit Penal
explanation: Kodi Penal përcakton se cilat vepra janë të dënueshme dhe cilat dënime janë të mundshme për
  to. Këtu përfshihen dënimet me gjobë dhe dënimet me heqje lirie. Për dënimin në çdo rast konkret vendos
  një gjykatë.
