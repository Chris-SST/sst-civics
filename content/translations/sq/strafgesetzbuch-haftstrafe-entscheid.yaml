    question_de: Nach welchem Gesetz richtet sich, ob jemand eine Gefängnisstrafe verbüssen muss?
    options_de:
      a: Nach dem Zivilgesetzbuch
      b: Nach dem Obligationenrecht
      c: Nach dem Mietrecht
      d: Nach dem Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch legt fest, welche Taten strafbar sind und welche Strafen dafür
      möglich sind. Dazu gehören Geldstrafen und Freiheitsstrafen. Über die Strafe in jedem konkreten
      Fall entscheidet ein Gericht.
