question: Si quhet qeveria e kantonit të Cyrihut?
options:
  a: Gjykata e Lartë (Obergericht)
  b: Këshilli Kantonal (Kantonsrat)
  c: Këshilli Federal (Bundesrat)
  d: Këshilli Qeveritar (Regierungsrat)
explanation: Qeveria e kantonit të Cyrihut quhet Këshilli Qeveritar (Regierungsrat). Këshilli Kantonal
  është parlamenti, ndërsa Gjykata e Lartë i përket pushtetit gjyqësor.
