id: kantonsrat-mandat-durch-volkswahl
lang: sq
source_version: 1
question: Si e marrin mandatin e tyre anëtarët e Këshillit Kantonal (Kantonsrat) të Cyrihut?
options:
  a: Ata zgjidhen nga populli.
  b: Ata caktohen nga këshillat e komunës (Gemeinde).
  c: Ata emërohen nga Këshilli Qeveritar (Regierungsrat).
  d: Ata vendosen në detyrë nga Këshilli Federal (Bundesrat).
explanation: Anëtarët e Këshillit Kantonal zgjidhen nga qytetarët me të drejtë vote të kantonit në një
  zgjedhje popullore. Parlamenti përcaktohet kështu drejtpërdrejt nga populli. As qeveria, as Konfederata
  nuk i vendos anëtarët në detyrë.
