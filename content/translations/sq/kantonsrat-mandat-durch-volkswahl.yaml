    question_de: Wie erhalten die Mitglieder des Kantonsrates von Zürich ihr Mandat?
    options_de:
      a: Sie werden vom Volk gewählt.
      b: Sie werden von den Gemeinderäten der Gemeinde bestimmt.
      c: Sie werden vom Regierungsrat ernannt.
      d: Sie werden vom Bundesrat in ihr Amt eingesetzt.
    explanation_de: Die Mitglieder des Kantonsrates werden von den stimmberechtigten Bürgerinnen und Bürgern
      des Kantons in einer Volkswahl gewählt. Das Parlament wird somit direkt vom Volk bestimmt. Weder
      die Regierung noch der Bund setzt die Mitglieder in ihr Amt ein.
