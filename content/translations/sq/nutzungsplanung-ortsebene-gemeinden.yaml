id: nutzungsplanung-ortsebene-gemeinden
lang: sq
source_version: 1
question: Kush planifikon në kantonin e Cyrihut, në nivel vendor, se si përdoret toka, për shembull ku
  ndodhen zonat e banimit dhe zonat e tregtisë e të zejtarisë?
options:
  a: Kuvendi Federal (Bundesversammlung) i Zvicrës
  b: Policia kantonale
  c: Komunat (Gemeinden)
  d: Vetëm këshillat e rrethit
explanation: Komunat nxjerrin planifikimin e përdorimit të tokës për territorin e tyre, për shembull rregulloren
  e ndërtimit dhe të zonave. Gjatë kësaj ato respektojnë udhëzimet e Konfederatës dhe të kantonit. Kështu
  ato bashkëvendosin se si zhvillohet vendi.
