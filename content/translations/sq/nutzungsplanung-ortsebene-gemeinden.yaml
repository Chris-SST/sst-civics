    reason: gleiche Bedeutung; «Gewerbe- und Handwerkszonen» ist nur eine leicht erweiterte Wiedergabe
      von «Gewerbezonen», sonst identisch.
    model: claude-sonnet-5-5
    at: *id001
    source_version: 1
    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie der Boden genutzt wird, zum Beispiel
      wo sich die Wohnzonen und die Gewerbe- und Handwerkszonen befinden?
    options_de:
      a: Die Bundesversammlung der Schweiz
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Nur die Bezirksräte
    explanation_de: Die Gemeinden erlassen die Nutzungsplanung für ihr Gebiet, zum Beispiel die Bau- und
      Zonenordnung. Dabei halten sie sich an die Vorgaben des Bundes und des Kantons. So bestimmen sie
      mit, wie sich der Ort entwickelt.
