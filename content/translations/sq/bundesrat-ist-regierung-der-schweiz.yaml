    question_de: Welche Rolle hat der Bundesrat in der Schweiz?
    options_de:
      a: Er ist die Regierung der Schweiz.
      b: Er ist das höchste Gericht des Landes.
      c: Er ist das Parlament der Eidgenossenschaft.
      d: Er ist die Vertretung der Kantone.
    explanation_de: Der Bundesrat ist das oberste leitende und ausführende Organ der Eidgenossenschaft,
      also die Regierung. Er hat sieben Mitglieder. Das Parlament und das Bundesgericht sind andere Gewalten.
