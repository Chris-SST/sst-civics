id: bundesrat-ist-regierung-der-schweiz
lang: sq
source_version: 1
question: Çfarë roli ka Këshilli Federal (Bundesrat) në Zvicër?
options:
  a: Ai është qeveria e Zvicrës.
  b: Ai është gjykata më e lartë e vendit.
  c: Ai është parlamenti i Konfederatës.
  d: Ai është përfaqësimi i kantoneve.
explanation: Këshilli Federal është organi më i lartë drejtues dhe ekzekutiv i Konfederatës, pra qeveria.
  Ai ka shtatë anëtarë. Parlamenti dhe Gjykata Federale (Bundesgericht) janë pushtete të tjera.
