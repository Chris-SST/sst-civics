id: urnengang-bund-immer-sonntag
lang: sq
source_version: 1
question: Në cilën ditë të javës mbahen në Zvicër votimet dhe zgjedhjet federale?
options:
  a: Gjithmonë të dielën
  b: Gjithmonë të shtunën
  c: Gjithmonë të premten
  d: Në një ditë të javës që çdo kanton e zgjedh vetë
explanation: Votimet në nivel të Konfederatës mbahen gjithmonë të dielën. Kështu mund të marrin pjesë
  sa më shumë persona me të drejtë vote, dhe data është e njëjtë për të gjithë.
