    question_de: Welche Ebene befindet sich ganz unten in der dreistufigen staatlichen Struktur der Schweiz?
    options_de:
      a: Die Gemeinde
      b: Die Region
      c: Der Kanton
      d: Der Bund
    explanation_de: 'Die Schweiz ist in drei Ebenen aufgebaut: Bund, Kantone und Gemeinden. Die Gemeinde
      ist die unterste und den Menschen am nächsten stehende Ebene. Sie erfüllt selbst viele Aufgaben,
      zum Beispiel die Primarschule, Baubewilligungen oder die Sozialhilfe.'
