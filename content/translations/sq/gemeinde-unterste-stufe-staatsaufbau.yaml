lang: sq
source_version: 2
question: Cili nivel gjendet në fund të poshtë në strukturën shtetërore trenivelëshe të Zvicrës?
options:
  a: Komuna (Gemeinde)
  b: Regjioni
  c: Kantoni
  d: Konfederata
explanation: 'Zvicra është e ndërtuar në tre nivele: Konfederata, kantonet dhe komunat. Komuna është niveli
  më i ulët dhe më afër njerëzve. Ajo kryen vetë shumë detyra, për shembull shkollën fillore, lejet e
  ndërtimit ose ndihmën sociale.'
