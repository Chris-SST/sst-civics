    question_de: Welche Aufgabe haben politische Parteien in der Demokratie?
    options_de:
      a: Sie urteilen in Streitfällen
      b: Sie vertreten die unterschiedlichen Interessen der Bevölkerung
      c: Sie führen die eidgenössischen Abstimmungen durch
      d: Sie setzen die Gesetze im Alltag um
    explanation_de: Die Parteien bündeln die unterschiedlichen Interessen und Meinungen der Bevölkerung
      und bringen sie in die Politik ein. Die Umsetzung der Gesetze ist Sache der Behörden, das Urteilen
      hingegen ist Sache der Gerichte.
