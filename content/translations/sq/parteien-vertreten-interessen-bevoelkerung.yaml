id: parteien-vertreten-interessen-bevoelkerung
lang: sq
source_version: 1
question: Çfarë detyre kanë partitë politike në demokraci?
options:
  a: Ato gjykojnë në raste mosmarrëveshjesh
  b: Ato përfaqësojnë interesat e ndryshme të popullsisë
  c: Ato zhvillojnë votimet federale
  d: Ato zbatojnë ligjet në jetën e përditshme
explanation: Partitë bashkojnë interesat dhe mendimet e ndryshme të popullsisë dhe i çojnë ato në politikë.
  Zbatimi i ligjeve është çështje e autoriteteve, ndërsa gjykimi është çështje e gjykatave.
