id: gottfried-keller-zuercher-dichter
lang: sq
source_version: 2
question: Cili poet dhe shkrimtar i njohur kishte origjinë nga Zyrihu?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller lindi në Zyrih në vitin 1819, shkroi për shembull «Der grüne Heinrich» dhe
  punoi gjithashtu si sekretar shtetëror i kantonit të Zyrihut. Robert Walser ishte nga Biel, Friedrich
  Dürrenmatt nga Konolfingen në kantonin e Bernës, ndërsa Jeremias Gotthelf veproi si prift në kantonin
  e Bernës.
