    question_de: Welcher bekannte Dichter und Schriftsteller stammte aus Zürich?
    options_de:
      a: Robert Walser
      b: Gottfried Keller
      c: Friedrich Dürrenmatt
      d: Jeremias Gotthelf
    explanation_de: Gottfried Keller wurde 1819 in Zürich geboren, schrieb zum Beispiel «Der grüne Heinrich»
