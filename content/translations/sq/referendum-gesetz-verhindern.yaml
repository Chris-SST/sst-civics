id: referendum-gesetz-verhindern
lang: sq
source_version: 1
question: Çfarë mund të arrijnë qytetarët me të drejtë vote me një referendum?
options:
  a: Ata mund të shkruajnë vetë një ligj të ri dhe ta vënë në fuqi.
  b: Ata mund të pengojnë një ligj të miratuar nga parlamenti.
  c: Ata mund t'i shkarkojnë anëtarët e Këshillit Federal (Bundesrat) me votë.
  d: Ata mund ta shpërndajnë parlamentin dhe të kërkojnë zgjedhje të reja.
explanation: Me një referendum, qytetarët me të drejtë vote mund të kërkojnë që një ligj i miratuar nga
  parlamenti të vihet në votim. Nëse populli e refuzon ligjin, ai nuk hyn në fuqi.
