    question_de: Was können stimmberechtigte Bürgerinnen und Bürger mit einem Referendum erreichen?
    options_de:
      a: Sie können selbst ein neues Gesetz schreiben und es in Kraft setzen.
      b: Sie können ein vom Parlament verabschiedetes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates per Abstimmung absetzen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Mit einem Referendum können stimmberechtigte Bürgerinnen und Bürger verlangen, dass
      ein vom Parlament verabschiedetes Gesetz zur Abstimmung gebracht wird. Wenn das Volk das Gesetz
      ablehnt, tritt es nicht in Kraft.
