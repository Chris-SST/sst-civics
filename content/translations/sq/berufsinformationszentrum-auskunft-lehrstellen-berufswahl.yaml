lang: sq
source_version: 1
question: Ku mund të merren informacione për vendet e praktikës profesionale, zgjedhjen e profesionit
  dhe punën?
options:
  a: Në Qendrën e Informimit Profesional
  b: Në Zyrën e Gjendjes Civile
  c: Në kopsht
  d: Në Zyrën e Përmbarimit
explanation: Qendra e Informimit Profesional (BIZ) jep informacione dhe këshillim për vendet e praktikës
  profesionale, zgjedhjen e profesionit, formimin e mëtejshëm dhe punën. Shërbimi është i hapur për të
  rinjtë dhe për të rriturit. Zyrat e tjera kanë detyra të tjera.
