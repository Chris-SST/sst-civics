id: staenderat-vertritt-anliegen-kantone
lang: sq
source_version: 1
question: Cila dhomë e Parlamentit përfaqëson kryesisht interesat e kantoneve?
options:
  a: Këshilli Federal (Bundesrat)
  b: Këshilli Kombëtar (Nationalrat)
  c: Këshilli i Shteteve (Ständerat)
  d: Gjykata Federale (Bundesgericht)
explanation: Këshilli i Shteteve përfaqëson para së gjithash kantonet. Çdo kanton dërgon përfaqësuese
  dhe përfaqësues në këtë dhomë. Këshilli Kombëtar, në të kundërt, përfaqëson popullin.
