id: steuerpflicht-wohnhafte-personen-schweiz
lang: sq
source_version: 1
question: Kush është në princip i detyruar të paguajë tatime në Zvicër?
options:
  a: Personat që banojnë në Zvicër
  b: Vetëm personat që drejtojnë një ndërmarrje
  c: Vetëm personat me shtetësi (Bürgerrecht) zvicerane
  d: Vetëm personat që kanë të drejtën e votës
explanation: Detyrimi tatimor lidhet me vendbanimin dhe jo me shtetësinë. Edhe të huajt, meshkuj dhe femra,
  që banojnë në Zvicër, paguajnë tatime. E drejta e votës nuk luan asnjë rol në këtë drejtim.
