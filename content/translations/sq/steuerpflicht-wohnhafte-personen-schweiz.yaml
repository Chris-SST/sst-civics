    question_de: Wer ist grundsätzlich verpflichtet, in der Schweiz Steuern zu bezahlen?
    options_de:
      a: Personen, die in der Schweiz wohnen
      b: Nur Personen, die ein Unternehmen führen
      c: Nur Personen mit Schweizer Bürgerrecht
      d: Nur Personen, die das Stimmrecht haben
    explanation_de: Die Steuerpflicht knüpft an den Wohnsitz an und nicht an die Staatsangehörigkeit.
      Auch Ausländer, Männer und Frauen, die in der Schweiz wohnen, bezahlen Steuern. Das Stimmrecht spielt
      in dieser Hinsicht keine Rolle.
