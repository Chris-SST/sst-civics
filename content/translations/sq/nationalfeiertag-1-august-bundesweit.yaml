id: nationalfeiertag-1-august-bundesweit
lang: sq
source_version: 1
question: Cila ditë është me ligj një festë pa punë në të gjithë Zvicrën?
options:
  a: 2 janari (Berchtoldstag)
  b: E hëna e karnavalit (Fasnachtsmontag)
  c: E premtja e Madhe
  d: 1 gushti, Festa Kombëtare
explanation: 1 gushti është Festa Kombëtare dhe konsiderohet festë në të gjithë vendin. Shumicën e festave
  të tjera, si E premtja e Madhe ose Berchtoldstag, e rregullojnë vetë kantonet dhe ato nuk janë kudo
  ditë pa punë.
