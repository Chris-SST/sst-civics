id: verbot-kinderarbeit-fabrik-schulunterricht
lang: sq
source_version: 1
question: Çfarë duhej të garantonte para së gjithash ndalimi i punës së fëmijëve në fabrika i vitit 1877?
options:
  a: Që fabrikat të paguanin më pak rrogë
  b: Që fëmijët të mund të ndiqnin shkollën
  c: Që fëmijët të duhej të ndihmonin më herët në punët e shtëpisë
  d: Që fabrikat të sillnin më shumë fuqi punëtore nga jashtë vendit
explanation: Ligji për fabrikat i vitit 1877 e ndaloi punën në fabrika për fëmijët. Ata duhej të ndiqnin
  mësimin në shkollë në vend që të punonin. Ligji mbrojti gjithashtu shëndetin e punëtorëve.
