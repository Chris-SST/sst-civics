    question_de: Was sollte das Verbot der Kinderarbeit in Fabriken von 1877 vor allem gewährleisten?
    options_de:
      a: Dass die Fabriken weniger Lohn zahlten
      b: Dass die Kinder die Schule besuchen konnten
      c: Dass die Kinder früher im Haushalt helfen mussten
      d: Dass die Fabriken mehr Arbeitskräfte aus dem Ausland brachten
    explanation_de: Das Fabrikgesetz von 1877 verbot die Fabrikarbeit für Kinder. Sie sollten den Unterricht
      in der Schule besuchen, anstatt zu arbeiten. Das Gesetz schützte auch die Gesundheit der Arbeiter.
