id: rav-aufgabe-stellensuchende-unterstuetzen
lang: sq
source_version: 1
question: Cila është detyra e Qendrës Rajonale të Ndërmjetësimit të Punës (RAV)?
options:
  a: Ajo kontrollon pagat në ndërmarrje
  b: Ajo i paguan pension të gjithë banorëve
  c: Ajo mbështet punëkërkuesit në kërkimin e punës dhe ndërmjetëson vende pune
  d: Ajo lëshon certifikata pune për punëkërkuesit
explanation: RAV është pika rajonale e kontaktit për punëkërkuesit. Ajo i këshillon ata dhe u ndërmjetëson
  vende pune. Në kantonin e Cyrihut ajo i përket Zyrës së Punës.
