    question_de: Was ist die Aufgabe des Regionalen Arbeitsvermittlungszentrums (RAV)?
    options_de:
      a: Es kontrolliert die Löhne in den Unternehmen
      b: Es zahlt allen Einwohnern eine Rente aus
      c: Es unterstützt Stellensuchende bei der Stellensuche und vermittelt Arbeitsstellen
      d: Es stellt Stellensuchenden Arbeitszeugnisse aus
    explanation_de: Das RAV ist die regionale Anlaufstelle für Stellensuchende. Es berät sie und vermittelt
      ihnen Arbeitsstellen. Im Kanton Zürich gehört es zum Amt für Arbeit.
