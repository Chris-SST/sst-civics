id: pensionsalter-frauen-maenner-65
lang: sq
source_version: 3
question: Cila moshë pensioni (sot e quajtur «moshë referimi») vlen në sigurimin e pleqërisë dhe të të
  mbijetuarve (AHV) nga viti 2028 për gratë dhe burrat?
options:
  a: Gratë 64 vjeç, burrat 65 vjeç
  b: Gratë dhe burrat 65 vjeç
  c: Gratë dhe burrat 63 vjeç
  d: Gratë dhe burrat 67 vjeç
explanation: Që nga reforma AHV 21, mosha e pensionit quhet zyrtarisht «moshë referimi». Nga viti 2025
  ajo rritet për gratë çdo vit me tre muaj, derisa të arrijë 65 vjeç. Nga viti 2028 gratë dhe burrat kanë
  të njëjtën moshë referimi prej 65 vjetësh.
