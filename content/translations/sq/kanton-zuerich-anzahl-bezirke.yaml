id: kanton-zuerich-anzahl-bezirke
lang: sq
source_version: 1
question: Në sa rrethe është ndarë kantoni i Zürichut?
options:
  a: Në dhjetë rrethe
  b: Në dymbëdhjetë rrethe
  c: Në katërmbëdhjetë rrethe
  d: Në tetë rrethe
explanation: Kantoni i Zürichut është ndarë në dymbëdhjetë rrethe, për shembull Affoltern, Meilen, Winterthur
  dhe Zürich. Rrethet janë rrethe administrative dhe gjyqësore ndërmjet kantonit dhe komunave (Gemeinden).
