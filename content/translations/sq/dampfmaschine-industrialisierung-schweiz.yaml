    question_de: Welche Erfindung hat die Industrialisierung in der Schweiz im 19. Jahrhundert stark beeinflusst?
    options_de:
      a: Das Flugzeug
      b: Die Dampfmaschine
      c: Der Computer
      d: Das Fliessband
    explanation_de: Im 19. Jahrhundert wurde die Dampfmaschine in der Schweiz wichtig. Sie setzte die
      Maschinen in den Fabriken und später auch die Züge in Bewegung, und immer mehr Menschen arbeiteten
      in Fabriken. Das Flugzeug, das Fliessband und der Computer wurden erst im 20. Jahrhundert wichtig.
