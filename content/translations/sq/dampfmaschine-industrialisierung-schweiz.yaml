id: dampfmaschine-industrialisierung-schweiz
lang: sq
source_version: 2
question: Cila shpikje e ka ndikuar fuqishëm industrializimin në Zvicër në shekullin e 19-të?
options:
  a: Aeroplani
  b: Makina me avull
  c: Kompjuteri
  d: Linja e montimit
explanation: Në shekullin e 19-të, makina me avull u bë e rëndësishme në Zvicër. Ajo vinte në lëvizje
  makinat në fabrika dhe më vonë edhe trenat, dhe gjithnjë e më shumë njerëz punonin në fabrika. Aeroplani,
  linja e montimit dhe kompjuteri u bënë të rëndësishëm vetëm në shekullin e 20-të.
