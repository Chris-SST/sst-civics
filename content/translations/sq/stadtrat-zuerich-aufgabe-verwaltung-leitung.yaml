    question_de: Was ist die Aufgabe des Stadtrats der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die kantonalen Gesetze für das Gebiet der Stadt.
      c: Er spricht Recht in Streitigkeiten zwischen Einwohnern und Einwohnerinnen.
      d: Er leitet die Stadtverwaltung und legt die Grundrichtlinien für das Handeln der Stadt fest.
    explanation_de: Der Stadtrat ist die Exekutive der Stadt Zürich. Er leitet die Stadtverwaltung und
      bestimmt die Richtung, in die sich die Stadt entwickelt. Das Recht sprechen die Gerichte, während
      die kantonalen Gesetze vom Kantonsrat erlassen werden.
