id: stadtrat-zuerich-aufgabe-verwaltung-leitung
lang: sq
source_version: 1
question: Cila është detyra e Këshillit të Qytetit (Stadtrat) të qytetit të Cyrihut?
options:
  a: Ai drejton administratën kantonale të tatimeve në qytet.
  b: Ai nxjerr ligjet kantonale për territorin e qytetit.
  c: Ai vendos drejtësi në mosmarrëveshjet mes banorëve dhe banoreve.
  d: Ai drejton administratën e qytetit dhe përcakton udhëzimet themelore për veprimin e qytetit.
explanation: Këshilli i Qytetit është ekzekutivi i qytetit të Cyrihut. Ai drejton administratën e qytetit
  dhe përcakton drejtimin në të cilin zhvillohet qyteti. Drejtësinë e vendosin gjykatat, ndërsa ligjet
  kantonale i nxjerr Këshilli Kantonal (Kantonsrat).
