id: geografische-gliederung-der-schweiz
lang: sq
source_version: 1
question: Në cilat tri hapësira të mëdha peizazhi ndahet Zvicra nga ana gjeografike?
options:
  a: Jura, Mittelland (Rrafshnalta Qendrore) dhe Alpet
  b: Jura, Liqeni i Konstancës dhe Alpet
  c: Pylli i Zi, Mittelland (Rrafshnalta Qendrore) dhe Alpet
  d: Mittelland (Rrafshnalta Qendrore), Parealpet dhe Tiçino
explanation: Jura ndodhet në veriperëndim, ndërsa Alpet zënë pjesën më të madhe të sipërfaqes. Në mes
  tyre shtrihet Mittelland (Rrafshnalta Qendrore), ku jeton pjesa më e madhe e njerëzve.
