id: zeitung-inhalte-bestimmt-redaktion
lang: sq
source_version: 1
question: Kush vendos në Zvicër se çfarë përmbajtjesh botohen në një gazetë?
options:
  a: Gjykata Federale (Bundesgericht)
  b: Komuna (Gemeinde) ku del gazeta
  c: Redaksia e gazetës
  d: Këshilli Federal (Bundesrat)
explanation: Liria e medias i mbron gazetat nga ndikimi i shtetit. Redaksia vendos vetë se çfarë boton.
  Kushtetuta Federale e ndalon censurën.
