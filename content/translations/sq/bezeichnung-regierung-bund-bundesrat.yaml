id: bezeichnung-regierung-bund-bundesrat
lang: sq
source_version: 1
question: Si quhet qeveria e Zvicrës në nivel federal?
options:
  a: Kuvendi Federal (Bundesversammlung)
  b: Këshilli Federal (Bundesrat)
  c: Kancelaria Federale (Bundeskanzlei)
  d: Gjykata Federale (Bundesgericht)
explanation: Qeveria e Konfederatës quhet Këshilli Federal. Kuvendi Federal është parlamenti, Gjykata
  Federale është gjykata më e lartë. Kancelaria Federale e mbështet Këshillin Federal.
