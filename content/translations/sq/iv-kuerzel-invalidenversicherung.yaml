id: iv-kuerzel-invalidenversicherung
lang: sq
source_version: 1
question: Çfarë do të thotë shkurtesa «IV» (sigurimi i invaliditetit) në sistemin zviceran të sigurimeve
  shoqërore?
options:
  a: Sigurimi i brendshëm (Inlandversicherung)
  b: Sigurimi i invaliditetit (Invalidenversicherung)
  c: Sigurimi i integrimit (Integrationsversicherung)
  d: Sigurimi individual (Individualversicherung)
explanation: IV do të thotë sigurimi i invaliditetit (Invalidenversicherung). Ai bën pjesë në shtyllën
  e parë të parashikimit për pleqëri dhe u ndihmon personave me kufizime shëndetësore, për shembull me
  masa riintegrimi ose me pensione.
