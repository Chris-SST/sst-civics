id: parlament-zwei-kammern-bund
lang: sq
source_version: 1
question: Nga cilat dy dhoma përbëhet Parlamenti zvicerian në nivel federal (Konfederata)?
options:
  a: Nga Këshilli Federal (Bundesrat) dhe Këshilli i Shteteve (Ständerat)
  b: Nga Këshilli Federal (Bundesrat) dhe Këshilli Kombëtar (Nationalrat)
  c: Nga Këshilli i Shteteve (Ständerat) dhe Gjykata Federale (Bundesgericht)
  d: Nga Këshilli Kombëtar (Nationalrat) dhe Këshilli i Shteteve (Ständerat)
explanation: 'Kuvendi Federal (Bundesversammlung), parlamenti i Konfederatës, përbëhet nga dy dhoma: Këshilli
  Kombëtar (Nationalrat) dhe Këshilli i Shteteve (Ständerat). Këshilli Federal (Bundesrat) është qeveria
  dhe nuk i përket parlamentit.'
