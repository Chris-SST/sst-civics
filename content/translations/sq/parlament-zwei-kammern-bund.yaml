    question_de: Aus welchen zwei Kammern besteht das Schweizer Parlament auf Bundesebene (Konfederata)?
    options_de:
      a: Aus dem Bundesrat und dem Ständerat
      b: Aus dem Bundesrat und dem Nationalrat
      c: Aus dem Ständerat und dem Bundesgericht
      d: Aus dem Nationalrat und dem Ständerat
    explanation_de: 'Die Bundesversammlung, das Parlament der Eidgenossenschaft, besteht aus zwei Kammern:
      dem Nationalrat und dem Ständerat. Der Bundesrat ist die Regierung und gehört nicht zum Parlament.'
