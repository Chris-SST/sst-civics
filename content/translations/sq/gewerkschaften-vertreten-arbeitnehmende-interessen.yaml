id: gewerkschaften-vertreten-arbeitnehmende-interessen
lang: sq
source_version: 1
question: Interesat e kujt i përfaqësojnë sindikatat?
options:
  a: Interesat e punëdhënësve
  b: Interesat e komunave (Gemeinde)
  c: Interesat e bankave
  d: Interesat e punëmarrësve
explanation: Sindikatat angazhohen për kërkesat e punëmarrësve, për shembull për pagat dhe kushtet e punës.
  Ato negociojnë shpesh me punëdhënësit për kontratat kolektive të punës.
