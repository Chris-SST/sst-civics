question: Cilat janë tri qytetet më të mëdha sipas numrit të banorëve në kantonin e Cyrihut?
options:
  a: Cyrihu, Uster dhe Wetzikon
  b: Cyrihu, Dietikon dhe Winterthur
  c: Cyrihu, Winterthur dhe Uster
  d: Cyrihu, Winterthur dhe Dübendorf
explanation: Cyrihu është qyteti më i madh me një diferencë të madhe, pas tij vijnë Winterthur dhe Uster.
  Dübendorf, Dietikon dhe Wetzikon janë gjithashtu qytete mjaft të mëdha, por kanë më pak banorë se Uster.
