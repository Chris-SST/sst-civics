id: erderwaermung-gletscher-schrumpfen
lang: sq
source_version: 1
question: Çfarë shkakton ngrohja globale te akullnajat në Alpet zvicerane?
options:
  a: Akullnajat tkurren.
  b: Akullnajat zhvendosen drejt veriut.
  c: Akullnajat rriten më shpejt.
  d: Akullnajat mbeten të pandryshuara.
explanation: Kur temperaturat rriten, shkrihet më shumë akull sesa shtohet me borën e re. Për këtë arsye
  akullnajat zvicerane bëhen më të vogla. Kjo ndikon edhe në ujërat dhe në peizazhin e Alpeve.
