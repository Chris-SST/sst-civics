    question_de: Was bewirkt die globale Erwärmung bei den Gletschern in den Schweizer Alpen?
    options_de:
      a: Die Gletscher schrumpfen.
      b: Die Gletscher verschieben sich nach Norden.
      c: Die Gletscher wachsen schneller.
      d: Die Gletscher bleiben unverändert.
    explanation_de: Wenn die Temperaturen steigen, schmilzt mehr Eis, als durch den neuen Schnee hinzukommt.
      Aus diesem Grund werden die Schweizer Gletscher kleiner. Dies wirkt sich auch auf die Gewässer und
      auf die Landschaft der Alpen aus.
