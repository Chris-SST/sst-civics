question: Çfarë kanë të përbashkët Simplon, Gotthard dhe Grosser St. Bernhard?
options:
  a: Ata janë kantone në Alpe.
  b: Ata janë lumenj që derdhen në det.
  c: Ata janë liqene në Mittelland.
  d: Ata janë kalime përtej Alpeve.
explanation: Simplon, Gotthard dhe Grosser St. Bernhard janë qafa të njohura malore që kalojnë përtej
  Alpeve. Ato lidhin anën veriore të Alpeve me anën jugore të Alpeve.
