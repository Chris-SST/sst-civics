id: pestepidemie-zuerich-17-jahrhundert
lang: sq
source_version: 1
question: Cila katastrofë në fillim të shekullit të 17-të i kushtoi jetën gati gjysmës së popullsisë së
  Cyrihut?
options:
  a: Një zjarr i qytetit
  b: Një epidemi e murtajës
  c: Një përmbytje
  d: Një zi buke
explanation: Në fillim të shekullit të 17-të, gati gjysma e banorëve të Cyrihut vdiq nga murtaja. Murtaja
  ishte një sëmundjengjitëse, e cila në atë kohë u përhap disa herë në Evropë.
