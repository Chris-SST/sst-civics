    question_de: Wie reagieren die Waldbewirtschafter in der Schweiz auf den Anstieg der Temperaturen?
    options_de:
      a: Sie pflanzen mehr andere Baumarten.
      b: Sie pflanzen nur Bäume, die schon immer dort waren.
      c: Sie verzichten vollständig auf die Pflege des Waldes.
      d: Sie roden die Wälder in den tiefen Lagen.
    explanation_de: Einige Baumarten vertragen die Hitze und die Trockenheit schlecht. Deshalb setzen
      die Waldbewirtschafter auf andere Arten, die besser an das wärmere Klima angepasst sind. So soll
      dem Wald seine Stabilität erhalten bleiben.
