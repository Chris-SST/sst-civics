id: forstleute-andere-baumarten-pflanzen
lang: sq
source_version: 1
question: Si reagojnë pyjepunuesit në Zvicër ndaj rritjes së temperaturave?
options:
  a: Ata mbjellin më shumë lloje të tjera pemësh.
  b: Ata mbjellin vetëm pemë që kanë qenë gjithmonë atje.
  c: Ata heqin dorë tërësisht nga kujdesi për pyllin.
  d: Ata shpyllëzojnë pyjet në zonat e ulëta.
explanation: Disa lloje pemësh e durojnë keq të nxehtit dhe thatësirën. Prandaj pyjepunuesit mbështeten
  te lloje të tjera, që janë përshtatur më mirë me klimën më të ngrohtë. Kështu pyllit duhet t'i mbetet
  qëndrueshmëria.
