id: todesstrafe-verfassung-verboten
lang: sq
source_version: 1
question: Çfarë vlen në Zvicër sipas Kushtetutës Federale për dënimin me vdekje?
options:
  a: Ai lejohet vetëm në rast vrasjeje.
  b: Ai lejohet vetëm në kohë lufte.
  c: Kantonet vendosin nëse ai vlen.
  d: Ai është i ndaluar.
explanation: Kushtetuta Federale mbron të drejtën për jetën në nenin 10. Dënimi me vdekje është i ndaluar
  shprehimisht, edhe për krime të rënda.
