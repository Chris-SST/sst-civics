question: Sa kantone ka Zvicra dhe sa prej tyre janë gjysmëkantone?
options:
  a: 26 kantone, prej tyre 6 gjysmëkantone
  b: 26 kantone, prej tyre 3 gjysmëkantone
  c: 23 kantone, prej tyre 6 gjysmëkantone
  d: 20 kantone, prej tyre 6 gjysmëkantone
explanation: 'Zvicra ka 26 kantone. Gjashtë prej tyre janë gjysmëkantone: Obwalden, Nidwalden, Basel-Stadt,
  Basel-Landschaft, Appenzell Ausserrhoden dhe Appenzell Innerrhoden. Ata kanë në Këshillin e Shteteve
  (Ständerat) nga një votë në vend të dy.'
