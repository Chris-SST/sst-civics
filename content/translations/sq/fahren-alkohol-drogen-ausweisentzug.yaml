id: fahren-alkohol-drogen-ausweisentzug
lang: sq
source_version: 1
question: Çfarë rrezikon një person që drejton makinë nën ndikimin e alkoolit ose të drogës?
options:
  a: Humbjen e të drejtës së votës
  b: Dëbimin nga komuna e banimit
  c: Heqjen e sigurimit shëndetësor
  d: Heqjen e lejes së drejtimit
explanation: Kush nuk është në gjendje të drejtojë mjet, vë në rrezik të tjerët në trafikun rrugor. Prandaj
  autoriteti mund të heqë lejen e drejtimit. Mund të shtohen edhe gjoba ose dënime të tjera.
