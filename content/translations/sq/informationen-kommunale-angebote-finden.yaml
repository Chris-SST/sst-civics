id: informationen-kommunale-angebote-finden
lang: sq
source_version: 2
question: Ku mund të gjenden informacione për ofertat dhe rregullat e komunës (Gemeinde) tuaj?
options:
  a: Në Fletoren Federale (Bundesblatt) të Konfederatës
  b: Në gazetën lokale ose në faqen e internetit të komunës
  c: Në ambasadën e vendit të origjinës
  d: Te Këshilli Federal (Bundesrat) në Bernë
explanation: Komuna informon për ofertat dhe rregullat e saj kryesisht në gazetën lokale dhe në faqen
  e saj të internetit. Konfederata dhe Këshilli Federal janë përgjegjës për çështjet kombëtare, ndërsa
  një ambasadë e huaj nuk është aspak përgjegjëse për komunën. Edhe administrata e komunës jep informacion.
