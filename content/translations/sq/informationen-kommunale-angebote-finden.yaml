    question_de: Wo können Informationen über die Angebote und Regeln Ihrer Gemeinde gefunden werden?
    options_de:
      a: Im Bundesblatt des Bundes
      b: In der lokalen Zeitung oder auf der Website der Gemeinde
      c: In der Botschaft des Herkunftslandes
      d: Beim Bundesrat in Bern
    explanation_de: Die Gemeinde informiert über ihre Angebote und Regeln hauptsächlich in der lokalen
      Zeitung und auf ihrer Website. Der Bund und der Bundesrat sind für nationale Angelegenheiten zuständig,
      während eine ausländische Botschaft überhaupt nicht für die Gemeinde zuständig ist. Auch die Gemeindeverwaltung
      gibt Informationen.
