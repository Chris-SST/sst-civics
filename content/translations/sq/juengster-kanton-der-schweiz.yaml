id: juengster-kanton-der-schweiz
lang: sq
source_version: 1
question: Cili kanton është kantoni më i ri i Zvicrës?
options:
  a: Jura
  b: Appenzell Ausserrhoden
  c: Basel-Landschaft
  d: Neuenburg
explanation: Kantoni Jura u themelua në vitin 1979. Ai u shkëput nga kantoni Bern dhe që atëherë është
  më i riu ndër 26 kantonet. Kushtetuta Federale e përmend atë among kantoneve të Konfederatës Zvicerane.
