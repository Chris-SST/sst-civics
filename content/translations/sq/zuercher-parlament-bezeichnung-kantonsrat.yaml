id: zuercher-parlament-bezeichnung-kantonsrat
lang: sq
source_version: 1
question: Si quhet parlamenti i kantonit të Cyrihut?
options:
  a: Grosser Rat
  b: Landrat
  c: Këshilli komunal (Gemeinderat)
  d: Këshilli Kantonal (Kantonsrat)
explanation: Parlamenti i kantonit të Cyrihut quhet Këshilli Kantonal. Kantonet e tjera përdorin emërtime
  të tjera, për shembull Grosser Rat ose Landrat. Këshilli komunal, në të kundërt, është një autoritet
  në nivel komune (Gemeinde).
