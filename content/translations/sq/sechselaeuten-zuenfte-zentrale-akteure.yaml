    question_de: Wer nimmt als zentraler Akteur am Zürcher Frühlingsfest Sechseläuten teil?
    options_de:
      a: Die Schulklassen von Zürich
      b: Die Zünfte von Zürich
      c: Die Gemeindepräsidenten des Kantons
      d: Die Mitglieder des Kantonsrats
    explanation_de: Während des Sechseläutens marschieren die Zünfte in historischen Kostümen durch die
      Stadt. Am Abend verbrennen sie den Böögg. Dieser Anlass ist ein bekanntes Frühlingsfest in Zürich.
