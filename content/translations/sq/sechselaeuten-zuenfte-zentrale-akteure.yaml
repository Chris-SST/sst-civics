lang: sq
source_version: 1
question: Kush merr pjesë si aktor qendror në festën pranverore të Cyrihut, Sechseläuten?
options:
  a: Klasat shkollore të Cyrihut
  b: Esnafet e Cyrihut (Zünfte)
  c: Kryetarët e komunave (Gemeinde) të kantonit
  d: Anëtarët e Këshillit Kantonal (Kantonsrat)
explanation: Gjatë Sechseläuten-it, esnafet (Zünfte) marshojnë nëpër qytet me kostume historike. Në mbrëmje
  ata djegin Böögg-un. Ky event është një festë e njohur pranverore në Cyrih.
