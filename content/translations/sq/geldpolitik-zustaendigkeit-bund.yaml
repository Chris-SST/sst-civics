    question_de: Wer ist in der Schweiz für die Geldpolitik zuständig?
    options_de:
      a: Der Bund
      b: Die Gemeinden
      c: Die Kantonalbanken
      d: Die Kantone gemeinsam
    explanation_de: Gemäss der Bundesverfassung ist die Geld- und Währungspolitik Sache des Bundes. Er
      hat das Recht, Münzen und Banknoten auszugeben. Die Schweizerische Nationalbank setzt die Geldpolitik
      im Auftrag des Bundes um und ist dabei unabhängig.
