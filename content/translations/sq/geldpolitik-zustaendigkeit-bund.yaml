id: geldpolitik-zustaendigkeit-bund
lang: sq
source_version: 1
question: Kush është përgjegjës në Zvicër për politikën monetare?
options:
  a: Konfederata
  b: Komunat (Gemeinden)
  c: Bankat kantonale
  d: Kantonet së bashku
explanation: Sipas Kushtetutës Federale, politika monetare dhe e valutës është çështje e Konfederatës.
  Ajo ka të drejtën të nxjerrë monedha dhe kartëmonedha. Banka Kombëtare Zvicerane e zbaton politikën
  monetare me porosi të Konfederatës dhe është e pavarur gjatë kësaj.
