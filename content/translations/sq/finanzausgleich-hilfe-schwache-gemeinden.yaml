    question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden im Kanton Zürich?
    options_de:
      a: Er senkt die Steuern in allen Gemeinden im gleichen Ausmass.
      b: Er bezahlt den Gemeinden die Kosten der Gemeindeversammlungen.
      c: Er hilft Gemeinden mit schwacher Finanzkraft oder mit hohen Sozialkosten belasteten Gemeinden,
        ihre Aufgaben zu erfüllen.
      d: Er verteilt das Geld des Bundes gleichmässig auf alle Einwohner und Einwohnerinnen.
    explanation_de: Die Gemeinden haben sehr unterschiedliche finanzielle Möglichkeiten. Der Finanzausgleich
      mildert diese Unterschiede teilweise. So können auch Gemeinden mit wenig Steuerkraft oder mit hohen
      Sozialkosten ihre Aufgaben erfüllen.
