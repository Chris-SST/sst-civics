id: finanzausgleich-hilfe-schwache-gemeinden
lang: sq
source_version: 1
question: Për çfarë shërben barazimi financiar (Finanzausgleich) mes komunave (Gemeinde) në kantonin e
  Cyrihut?
options:
  a: Ai i ul taksat në të gjitha komunat në të njëjtën shkallë.
  b: Ai u paguan komunave kostot e kuvendeve të komunës (Gemeindeversammlung).
  c: Ai i ndihmon komunat me fuqi të dobët financiare ose të ngarkuara nga kostot e larta sociale që t'i
    përmbushin detyrat e tyre.
  d: Ai shpërndan paratë e Konfederatës në mënyrë të barabartë te të gjithë banorët dhe banoret.
explanation: Komunat kanë mundësi financiare shumë të ndryshme. Barazimi financiar i zbut pjesërisht këto
  dallime. Kështu edhe komunat me pak fuqi tatimore ose me kosto të larta sociale mund t'i përmbushin
  detyrat e tyre.
