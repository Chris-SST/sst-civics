question: Në cilën datë bie Festa Kombëtare e Konfederatës Zvicerane, festa kombëtare e Zvicrës?
options:
  a: 1 gushti
  b: 26 dhjetori
  c: 11 nëntori
  d: 1 maji
explanation: Festa kombëtare e Zvicrës është më 1 gusht. Me këtë rast përkujtohet Letra e Konfederatës
  e vitit 1291. Në shumë vende festimet përfshijnë fishekzjarre, zjarre në lartësi dhe fjalime.
