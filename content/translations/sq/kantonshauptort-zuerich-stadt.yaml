id: kantonshauptort-zuerich-stadt
lang: sq
source_version: 1
question: Cili qytet është qendra administrative e kantonit të Cyrihut?
options:
  a: Uster
  b: Qyteti i Cyrihut
  c: Winterthur
  d: Dübendorf
explanation: Qyteti i Cyrihut është qendra administrative e kantonit dhe ka të njëjtin emër. Aty ndodhen,
  ndër të tjera, Këshilli Kantonal (Kantonsrat) dhe Këshilli Qeveritar (Regierungsrat). Winterthur është
  qyteti i dytë më i madh i kantonit.
