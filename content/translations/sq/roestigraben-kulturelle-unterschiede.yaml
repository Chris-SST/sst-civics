    question_de: Was versteht man in der Schweiz unter dem Begriff «Röstigraben»?
    options_de:
      a: Die Alpen als Trennlinie zwischen dem Norden und dem Süden
      b: Unterschiede zwischen Stadt und Land
      c: Die Grenze zwischen der Schweiz und Deutschland
      d: Kulturelle Unterschiede zwischen der deutschsprachigen Schweiz und der Romandie
    explanation_de: Der Begriff «Röstigraben» ist ein bildlicher Ausdruck. Er beschreibt die kulturellen
      Unterschiede zwischen der deutschsprachigen Schweiz und der französischsprachigen Romandie. Diese
      Unterschiede zeigen sich manchmal zum Beispiel bei Abstimmungen.
