id: roestigraben-kulturelle-unterschiede
lang: sq
source_version: 1
question: Çfarë nënkuptohet në Zvicër me termin «Röstigraben»?
options:
  a: Alpet si vijë ndarëse midis veriut dhe jugut
  b: Ndryshimet midis qytetit dhe fshatit
  c: Kufiri midis Zvicrës dhe Gjermanisë
  d: Ndryshimet kulturore midis Zvicrës gjermanofone dhe Romandisë
explanation: Termi «Röstigraben» është një shprehje figurative. Ai përshkruan ndryshimet kulturore midis
  Zvicrës gjermanofone dhe Romandisë frankofone. Këto ndryshime shfaqen ndonjëherë, për shembull, në votime.
