id: gegenvorschlag-parlament-zur-volksinitiative
lang: sq
source_version: 1
question: Çfarë mund t'i kundërvërë Parlamenti një nisme popullore (Volksinitiative) federale?
options:
  a: Një zgjatje të afatit të mbledhjes së nënshkrimeve me edhe një vit
  b: Një kundërpropozim të vetin, mbi të cilin votohet gjithashtu
  c: Një mbledhje të dytë nënshkrimesh në të gjithë kantonet
  d: Një ndalim për ta çuar nismën në votim
explanation: Parlamenti mund t'i kundërvërë një nisme popullore një kundërpropozim të drejtpërdrejtë.
  Ky shpesh e merr në konsideratë pjesërisht kërkesën, por shkon më pak larg. Shtetasit me të drejtë vote
  votojnë pastaj në të njëjtën ditë mbi nismën dhe mbi kundërpropozimin.
