    question_de: Was kann das Parlament einer eidgenössischen Volksinitiative entgegenstellen?
    options_de:
      a: Eine Verlängerung der Frist für die Sammlung der Unterschriften um ein weiteres Jahr
      b: Einen eigenen Gegenvorschlag, über den ebenfalls abgestimmt wird
      c: Eine zweite Unterschriftensammlung in allen Kantonen
      d: Ein Verbot, die Initiative zur Abstimmung zu bringen
    explanation_de: Das Parlament kann einer Volksinitiative einen direkten Gegenvorschlag entgegenstellen.
      Dieser berücksichtigt das Anliegen oft teilweise, geht aber weniger weit. Die stimmberechtigten
      Bürgerinnen und Bürger stimmen dann am selben Tag über die Initiative und über den Gegenvorschlag
      ab.
