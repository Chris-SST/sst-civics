id: stimmrecht-bund-ab-18-geburtstag
lang: sq
source_version: 1
question: Nga çfarë moshe mund të votojnë dhe të zgjedhin shtetasit zviceranë në nivel federal?
options:
  a: Nga ditëlindja e 20-të
  b: Nga ditëlindja e 21-të
  c: Nga ditëlindja e 16-të
  d: Nga ditëlindja e 18-të
explanation: E drejta e votës dhe e zgjedhjes në nivel të Konfederatës fillon me moshën madhore, pra me
  ditëlindjen e 18-të. Kjo moshë vlen në të njëjtën mënyrë për zgjedhjet dhe për votimet e Konfederatës.
