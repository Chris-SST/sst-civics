    question_de: Ab welchem Alter können Schweizer Staatsangehörige auf Bundesebene abstimmen und wählen?
    options_de:
      a: Ab dem 20. Geburtstag
      b: Ab dem 21. Geburtstag
      c: Ab dem 16. Geburtstag
      d: Ab dem 18. Geburtstag
    explanation_de: Das Stimm- und Wahlrecht auf Ebene des Bundes beginnt mit der Volljährigkeit, also
      mit dem 18. Geburtstag. Dieses Alter gilt gleichermassen für die Wahlen und für die Abstimmungen
      des Bundes.
