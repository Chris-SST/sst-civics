question: Cilat tri territore u aleuan në vitin 1291 dhe konsiderohen si bërthama e Konfederatës së mëvonshme
  zvicerane (Eidgenossenschaft)?
options:
  a: Uri, Schwyz dhe Unterwalden
  b: Glarus, Zug dhe Uri
  c: Basel, Schaffhausen dhe Appenzell
  d: Zürich, Bern dhe Luzern
explanation: Uri, Schwyz dhe Unterwalden lidhën në vitin 1291 një Konfederatë. Kjo datë konsiderohet si
  origjina e Zvicrës dhe festohet më 1 gusht. Vendet e tjera iu bashkuan Konfederatës vetëm më vonë.
