id: stimmabgabe-per-post-mehrheit
lang: sq
source_version: 1
question: Si e japin sot shumica e qytetarëve me të drejtë vote në Zvicër votën e tyre në votime dhe zgjedhje?
options:
  a: Ata e japin të dielën e votimit në kuvendin i komunës (Gemeindeversammlung).
  b: Ata e hedhin personalisht në urnë të dielën e votimit.
  c: Ata e dërgojnë me postë në komunë (Gemeinde).
  d: Ata e japin përmes një faqeje interneti të Konfederatës.
explanation: Shumica e qytetarëve me të drejtë vote votojnë me shkrim, pra me postë. Shkuarja te urna
  të dielën e votimit sot nuk është më e zakonshme për shumicën.
