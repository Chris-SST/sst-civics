    question_de: Wie geben heute die meisten stimmberechtigten Bürgerinnen und Bürger in der Schweiz ihre
      Stimme bei Abstimmungen und Wahlen ab?
    options_de:
      a: Sie geben sie am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie werfen sie am Abstimmungssonntag persönlich in die Urne.
      c: Sie schicken sie per Post an die Gemeinde.
      d: Sie geben sie über eine Webseite des Bundes ab.
    explanation_de: Die meisten stimmberechtigten Bürgerinnen und Bürger stimmen schriftlich, also per
      Post. Der Gang zur Urne am Abstimmungssonntag ist heute für die Mehrheit nicht mehr üblich.
