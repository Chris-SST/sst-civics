id: soziale-sicherheit-bund-verantwortung
lang: sq
source_version: 1
question: Cili nivel shtetëror në Zvicër mbart përgjegjësinë për ta siguruar shoqërisht popullsinë, për
  shembull përmes parashikimit për pleqëri?
options:
  a: Rrethet
  b: Vetëm komunat (Gemeinden)
  c: Konfederata
  d: Vetëm kantonet
explanation: Kushtetuta Federale i cakton Konfederatës detyra të rëndësishme të sigurisë shoqërore. Këtu
  përfshihen, për shembull, sigurimi i pleqërisë dhe i të mbijetuarve (AHV) dhe sigurimi i invaliditetit.
  Kështu, për të gjithë Zvicrën vlejnë baza të njëjta.
