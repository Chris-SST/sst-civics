    question_de: Welche staatliche Ebene in der Schweiz trägt die Verantwortung dafür, die Bevölkerung
      sozial abzusichern, zum Beispiel durch die Altersvorsorge?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Der Bund
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung weist dem Bund wichtige Aufgaben der sozialen Sicherheit zu.
      Dazu gehören zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung.
      So gelten für die ganze Schweiz die gleichen Grundlagen.
