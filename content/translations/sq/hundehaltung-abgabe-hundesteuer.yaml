id: hundehaltung-abgabe-hundesteuer
lang: sq
source_version: 2
question: Çfarë vlen në kantonin Zürich për personat që mbajnë një qen?
options:
  a: Ata duhet t'i paguajnë çdo vit komunës (Gemeinde) një taksë për qenin.
  b: Ata duhet të paguajnë vetëm një herë, gjatë blerjes së qenit, një tarifë te Konfederata.
  c: Ata duhet të bëjnë çdo vit me qenin një provim te kantoni.
  d: Ata duhet të paguajnë një taksë vetëm nëse fitojnë para me qenin.
explanation: Kushdo që mban një qen në kantonin Zürich, paguan çdo vit një taksë për qenin, të ashtuquajturën
  taksë për qentë (Hundesteuer). Paratë shkojnë te komuna e vendbanimit, jo te Konfederata. Taksa nuk
  është e njëhershme dhe vlen edhe për qentë që mbahen vetëm privatisht.
