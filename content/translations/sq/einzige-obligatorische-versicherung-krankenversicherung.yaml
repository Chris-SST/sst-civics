id: einzige-obligatorische-versicherung-krankenversicherung
lang: sq
source_version: 1
question: Cila nga sigurimet e mëposhtme është e detyrueshme me ligj në Zvicër për të gjithë banorët dhe
  banoret?
options:
  a: Sigurimi i mbrojtjes juridike
  b: Sigurimi shëndetësor
  c: Sigurimi i udhëtimit
  d: Sigurimi i pasurisë së shtëpisë
explanation: Sigurimi shëndetësor është i detyrueshëm për të gjitha personat me vendbanim në Zvicër. Sigurimet
  e pasurisë së shtëpisë, të mbrojtjes juridike dhe të udhëtimit janë vullnetare.
