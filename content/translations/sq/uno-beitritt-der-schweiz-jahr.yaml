question: Në cilin vit u bë Zvicra anëtare e Kombeve të Bashkuara (OKB)?
options:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
explanation: Zvicra iu bashkua OKB-së në vitin 2002, pasi populli dhe kantonet e kishin miratuar anëtarësimin.
  Kështu ajo ishte një nga vendet e fundit që u anëtarësuan. Megjithatë, shumë organizata të OKB-së kanë
  qëndër në Gjenevë që prej kohësh.
