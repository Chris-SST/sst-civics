    question_de: Welche Voraussetzungen müssen Personen erfüllen, damit sie in der Schweiz heiraten können?
    options_de:
      a: Sie müssen das Schweizer Bürgerrecht haben und volljährig sein
      b: Sie müssen volljährig sein und vernunftgemäss handeln können
      c: Sie müssen mindestens fünf Jahre zusammenleben
      d: Sie müssen derselben Religion angehören
    explanation_de: Heiraten kann, wer volljährig und urteilsfähig ist. Urteilsfähig bedeutet, dass die
      Person vernunftgemäss handeln kann. Die Staatsangehörigkeit, die Religion oder eine bestimmte Dauer
      des Zusammenlebens sind keine Voraussetzung.
