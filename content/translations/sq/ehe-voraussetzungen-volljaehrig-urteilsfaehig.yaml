id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: sq
source_version: 1
question: Cilat kushte duhet të plotësojnë personat që të mund të martohen në Zvicër?
options:
  a: Ata duhet të kenë shtetësinë zvicerane (Bürgerrecht) dhe të jenë madhorë
  b: Ata duhet të jenë madhorë dhe të jenë në gjendje të veprojnë me arsye
  c: Ata duhet të jetojnë së bashku për të paktën pesë vjet
  d: Ata duhet t'i përkasin së njëjtës fe
explanation: Mund të martohet ai që është madhor dhe i aftë për të gjykuar. I aftë për të gjykuar do të
  thotë që person mund të veprojë me arsye. Shtetësia, feja ose një kohëzgjatje e caktuar e jetesës së
  përbashkët nuk janë kusht.
