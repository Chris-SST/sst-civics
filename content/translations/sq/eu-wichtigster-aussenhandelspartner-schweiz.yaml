question: Cili është partneri më i rëndësishëm i tregtisë së jashtme për ekonominë zvicerane?
options:
  a: Kina
  b: Japonia
  c: Bashkimi Evropian
  d: Shtetet e Bashkuara të Amerikës
explanation: Pjesa më e madhe e tregtisë së Zvicrës me jashtë zhvillohet me vendet e Bashkimit Evropian.
  Prandaj Zvicra është e lidhur me BE-në nëpërmjet marrëveshjeve të ndryshme.
