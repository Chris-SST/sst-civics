    question_de: Wer bestimmt im Kanton Zürich, wer im Regierungsrat sitzt?
    options_de:
      a: Die Bundesversammlung wählt die Mitglieder des Regierungsrates.
      b: Der Kantonsrat wählt die Mitglieder aus den eigenen Reihen.
      c: Die Gemeindepräsidenten und Gemeindepräsidentinnen wählen die Mitglieder.
      d: Die stimmberechtigte Bevölkerung des Kantons wählt die Mitglieder direkt.
    explanation_de: Im Kanton Zürich wählt das Volk den Regierungsrat direkt an der Urne. Der Kantonsrat
      ist das Parlament und wählt die Regierung nicht. Dies unterscheidet den Kanton vom Bund, wo die
      Bundesversammlung den Bundesrat wählt.
