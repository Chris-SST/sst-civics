id: regierungsrat-zuerich-wahl-durch-volk
lang: sq
source_version: 1
question: Kush përcakton në kantonin Zürich se kush ulet në Këshillin Qeveritar (Regierungsrat)?
options:
  a: Kuvendi Federal (Bundesversammlung) zgjedh anëtarët e Këshillit Qeveritar.
  b: Këshilli Kantonal (Kantonsrat) zgjedh anëtarët nga radhët e veta.
  c: Presidentët dhe presidentet e komunave (Gemeinde) zgjedhin anëtarët.
  d: Popullsia e kantonit me të drejtë vote i zgjedh anëtarët drejtpërdrejt.
explanation: Në kantonin Zürich populli e zgjedh drejtpërdrejt Këshillin Qeveritar me votim në kuti. Këshilli
  Kantonal është parlamenti dhe nuk e zgjedh qeverinë. Kjo e dallon kantonin nga Konfederata, ku Kuvendi
  Federal zgjedh Këshillin Federal (Bundesrat).
