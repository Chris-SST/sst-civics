    explanation_de: Beim Jodeln wird ohne Worte gesungen, meistens nur mit Silben, und es wird schnell
      zwischen Bruststimme und Kopfstimme gewechselt. Die Stimme selbst ist das Instrument. Das Jodeln
      gehört zu den Traditionen der Schweiz und wird oft mit dem Alphorn oder mit dem Schwyzerörgeli verbunden.
