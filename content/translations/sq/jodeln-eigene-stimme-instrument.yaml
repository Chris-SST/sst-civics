id: jodeln-eigene-stimme-instrument
lang: sq
source_version: 1
question: Çfarë shërben si instrument gjatë jodlimit?
options:
  a: Alphorni (Alphorn)
  b: Zëri i vet
  c: Schwyzerörgeli (harmonika e vogël zvicerane)
  d: Harmonika me dorë (Handorgel)
explanation: Gjatë jodlimit këndohet pa fjalë, zakonisht vetëm me rrokje, dhe kalohet shpejt mes zërit
  të gjoksit dhe zërit të kokës. Vetë zëri është instrumenti. Jodlimi është pjesë e traditave të Zvicrës
  dhe shpesh lidhet me alphornin ose me Schwyzerörgelin.
