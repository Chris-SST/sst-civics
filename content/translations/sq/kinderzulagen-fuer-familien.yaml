id: kinderzulagen-fuer-familien
lang: sq
source_version: 1
question: Cilin përfitim shtetëror e marrin familjet me fëmijë në Zvicër?
options:
  a: Pensioni i invaliditetit
  b: Shtesat për fëmijë
  c: Premia për pronësi banese
  d: Dieta ditore e papunësisë
explanation: Familjet marrin shtesa për fëmijë si kontribut për kostot e mbajtjes së fëmijëve. Ato bëjnë
  pjesë te shtesat familjare, të cilat rregullohen në ligjin e Konfederatës.
