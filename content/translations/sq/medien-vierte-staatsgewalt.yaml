    source_version: 1
    question_de: Die Medien werden oft mit einem besonderen Ausdruck bezeichnet, der ihre Rolle im Staat
      beschreibt. Welcher Ausdruck ist das?
    options_de:
      a: Zweite Staatsgewalt
      b: Oberste Staatsgewalt
      c: Erste Staatsgewalt
      d: Vierte Staatsgewalt
    explanation_de: Die drei Staatsgewalten sind die Legislative, die Exekutive und die Judikative. Die
      Medien gehören nicht dazu, aber sie kontrollieren die Politik und informieren die Bevölkerung. Deshalb
      werden sie oft die vierte Staatsgewalt genannt.
