id: medien-vierte-staatsgewalt
lang: sq
source_version: 1
question: Mediat shpesh quhen me një shprehje të veçantë që përshkruan rolin e tyre në shtet. Cila është
  kjo shprehje?
options:
  a: Pushteti i dytë shtetëror
  b: Pushteti suprem shtetëror
  c: Pushteti i parë shtetëror
  d: Pushteti i katërt shtetëror
explanation: Tre pushtetet shtetërore janë legjislativi, ekzekutivi dhe gjyqësori. Mediat nuk bëjnë pjesë
  në to, por ato kontrollojnë politikën dhe informojnë popullatën. Prandaj ato quhen shpesh pushteti i
  katërt shtetëror.
