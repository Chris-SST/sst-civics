    question_de: In welchen Fluss mündet die Sihl mitten in der Stadt Zürich?
    options_de:
      a: In die Töss
      b: In die Limmat
      c: In die Glatt
      d: In die Aare
    explanation_de: Die Sihl fliesst durch Zürich und mündet beim Platzspitz in die Limmat. Glatt und
