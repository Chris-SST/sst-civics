id: sihl-muendung-in-limmat
lang: sq
source_version: 1
question: Në cilin lumë derdhet Sihl-i në mes të qytetit të Cyrihut?
options:
  a: Në Töss
  b: Në Limmat
  c: Në Glatt
  d: Në Aare
explanation: Sihl-i rrjedh nëpër Cyrih dhe derdhet në Limmat te Platzspitz. Glatt dhe Töss janë lumenj
  të tjerë të Cyrihut, që derdhen në Rhein. Aare e merr Limmatin vetëm më tej, në kantonin Aargau.
