id: kanton-zuerich-nachbarkanton-thurgau
lang: sq
source_version: 1
question: Cili nga kantonet e mëposhtme kufizohet drejtpërdrejt me kantonin e Cyrihut?
options:
  a: Graubünden
  b: Thurgau
  c: Uri
  d: Vaud
explanation: Kantoni i Thurgaut shtrihet në verilindje të kantonit të Cyrihut dhe kufizohet drejtpërdrejt
  me të. Graubünden, Vaud dhe Uri nuk kanë kufi të përbashkët me Cyrihun.
