id: kind-krankenversicherung-frist-geburt
lang: sq
source_version: 1
question: Brenda çfarë afati nga lindja duhet të ekzistojë një sigurim shëndetësor për një fëmijë që banon
  në Zvicër?
options:
  a: brenda 12 muajve
  b: brenda 3 muajve
  c: brenda 14 ditëve
  d: brenda 6 muajve
explanation: Për një fëmijë, prindërit duhet të lidhin një sigurim shëndetësor brenda tre muajve pas lindjes.
  Nëse afati respektohet, mbulimi i sigurimit vlen me efekt prapaveprues që nga lindja.
