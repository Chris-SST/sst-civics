    question_de: Innerhalb welcher Frist ab der Geburt muss für ein Kind, das in der Schweiz wohnt, eine
      Krankenversicherung bestehen?
    options_de:
      a: innerhalb von 12 Monaten
      b: innerhalb von 3 Monaten
      c: innerhalb von 14 Tagen
      d: innerhalb von 6 Monaten
    explanation_de: Für ein Kind müssen die Eltern innerhalb von drei Monaten nach der Geburt eine Krankenversicherung
      abschliessen. Wenn die Frist eingehalten wird, gilt der Versicherungsschutz rückwirkend ab der Geburt.
