    question_de: Was ist typisch für die Schweizer Fasnacht?
    options_de:
      a: Umzüge, bei denen die Teilnehmenden Masken tragen
      b: Das Schmücken von grünen Bäumen (Tannen) auf dem Dorfplatz
      c: Das Feuerwerk um Mitternacht am 1. August
      d: Das Anzünden grosser Kerzen in den Kirchen
    explanation_de: Während der Fasnacht ziehen Gruppen in Umzügen durch die Strassen und tragen Masken
      und Kostüme. Die Basler Fasnacht ist ein bekanntes Beispiel für diese Tradition.
