id: fasnacht-umzuege-mit-masken
lang: sq
source_version: 1
question: Çfarë është tipike për Fasnachtin zviceran?
options:
  a: Parada në të cilat pjesëmarrësit mbajnë maska
  b: Zbukurimi i pemëve të gjelbra (bredhave) në sheshin e fshatit
  c: Fishekzjarret në mesnatë më 1 gusht
  d: Ndezja e qirinjve të mëdhenj në kisha
explanation: Gjatë Fasnachtit, grupe kalojnë nëpër rrugë në parada dhe mbajnë maska e kostume. Fasnachti
  i Bazelit është një shembull i njohur i kësaj tradite.
