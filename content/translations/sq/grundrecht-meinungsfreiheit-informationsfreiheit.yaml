id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: sq
source_version: 1
question: Cila e drejtë themelore mbron lirinë për të formuar një mendim të vetin dhe për t'u informuar
  nga burime të përgjithshme të aksesueshme?
options:
  a: Liria e vendosjes
  b: Liria e mendimit dhe e informimit
  c: Liria ekonomike
  d: Liria e tubimit
explanation: Kushtetuta Federale mbron lirinë e mendimit dhe të informimit në nenin 16. Çdo person ka
  të drejtë t'i marrë lirisht informacionet nga burime të përgjithshme të aksesueshme. Kjo është një themel
  i rëndësishëm i demokracisë.
