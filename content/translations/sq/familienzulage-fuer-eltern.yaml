    question_de: Welche staatliche Leistung erhalten Eltern in der Schweiz, wenn sie angestellt sind oder
      selbstständig erwerbend arbeiten und Kinder haben?
    options_de:
      a: Die Invalidenrente
      b: Die Arbeitslosenentschädigung
      c: Die Ergänzungsleistung zur Alters- und Hinterlassenenversicherung (AHV)
      d: Die Familienzulagen
    explanation_de: Die Familienzulagen helfen den Familien, einen Teil der Ausgaben für die Kinder zu
      decken. Sie bestehen aus den Kinderzulagen und den Ausbildungszulagen. Auch Selbstständigerwerbende
      können sie erhalten.
