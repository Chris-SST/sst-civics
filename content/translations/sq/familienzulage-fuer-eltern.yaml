id: familienzulage-fuer-eltern
lang: sq
source_version: 1
question: Çfarë shërbimi shtetëror marrin prindërit në Zvicër, nëse janë të punësuar ose punojnë si të
  vetëpunësuar dhe kanë fëmijë?
options:
  a: Pensioni i invaliditetit
  b: Kompensimi i papunësisë
  c: Prestacioni plotësues për sigurimin i pleqërisë dhe i të mbijetuarve (AHV)
  d: Shtesa familjare
explanation: Shtesat familjare i ndihmojnë familjet të mbulojnë një pjesë të shpenzimeve për fëmijët.
  Ato përbëhen nga shtesat për fëmijë dhe shtesat për formim. Edhe të vetëpunësuarit mund t'i marrin ato.
