id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: sq
source_version: 1
question: Një punonjëse e konsideron shkarkimin e saj të pabazuar dhe dëshiron të veprojë kundër tij.
  Cili organ merret me konflikte të tilla që dalin nga marrëdhënia e punës?
options:
  a: Qendra rajonale e ndërmjetësimit të punës (RAV)
  b: Zyra e qarkullimit rrugor
  c: Gjykata e punës
  d: Zyra e përmbarimit
explanation: Gjykata e punës është kompetente për konfliktet midis punëdhënësve dhe punëmarrësve. Kjo
  përfshin edhe mosmarrëveshjen për një shkarkim. RAV-i, në të kundërt, ndihmon në kërkimin e punës.
