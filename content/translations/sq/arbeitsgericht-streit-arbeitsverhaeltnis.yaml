    source_version: 1
    question_de: Eine Angestellte hält ihre Kündigung für unbegründet und möchte dagegen vorgehen. Welches
      Organ befasst sich mit solchen Konflikten, die aus dem Arbeitsverhältnis entstehen?
    options_de:
      a: Das regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungsamt
    explanation_de: Das Arbeitsgericht ist für Konflikte zwischen Arbeitgebern und Arbeitnehmern zuständig.
      Dies umfasst auch den Streit über eine Kündigung. Das RAV hingegen hilft bei der Arbeitssuche.
