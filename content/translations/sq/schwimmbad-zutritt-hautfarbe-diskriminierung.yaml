id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: sq
source_version: 1
question: Një pishinë publike i refuzon një personi hyrjen për shkak të ngjyrës së lëkurës. Cili parim
  i Kushtetutës Federale cenohet me këtë?
options:
  a: Liria ekonomike
  b: Ndalimi i diskriminimit
  c: E drejta e votës
  d: E drejta për martesë dhe familje
explanation: Kushtetuta Federale në nenin 8 ndalon diskriminimin, për shembull për shkak të prejardhjes
  ose racës. Prandaj askush nuk duhet të trajtohet më keq se të tjerët.
