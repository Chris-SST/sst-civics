id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
lang: sq
source_version: 1
question: Kush mund të marrë në Zvicër përfitime plotësuese (Ergänzungsleistungen)?
options:
  a: Personat që e kanë humbur punën dhe marrin dëmshpërblim papunësie
  b: Të gjithë personat që janë mbi 50 vjeç
  c: Personat, pensioni i të cilëve nga sigurimi i pleqërisë dhe i të mbijetuarve (AHV) ose nga sigurimi
    i invaliditetit (IV) nuk e mbulon minimumin jetik
  d: Të gjithë personat që marrin ndihmë sociale
explanation: Përfitimet plotësuese ndihmojnë personat, për të cilët pensioni i sigurimit të pleqërisë
  dhe i të mbijetuarve ose i sigurimit të invaliditetit dhe të ardhurat e tjera nuk mjaftojnë për të jetuar.
  Ato janë e drejtë ligjore dhe nuk janë ndihmë sociale. Ato paguhen përveç pensionit.
