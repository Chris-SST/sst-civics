    question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
    options_de:
      a: Personen, die ihre Arbeit verloren haben und eine Arbeitslosenentschädigung erhalten
      b: Alle Personen, die über 50 Jahre alt sind
      c: Personen, deren Rente aus der Alters- und Hinterlassenenversicherung (AHV) oder aus der Invalidenversicherung
        (IV) das Existenzminimum nicht deckt
      d: Alle Personen, die Sozialhilfe erhalten
    explanation_de: Ergänzungsleistungen helfen Personen, für die die Rente der Alters- und Hinterlassenenversicherung
      oder der Invalidenversicherung und das übrige Einkommen nicht zum Leben ausreichen. Sie sind ein
      gesetzlicher Anspruch und keine Sozialhilfe. Sie werden zusätzlich zur Rente bezahlt.
