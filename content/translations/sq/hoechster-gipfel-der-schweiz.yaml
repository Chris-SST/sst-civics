id: hoechster-gipfel-der-schweiz
lang: sq
source_version: 2
question: Si quhet maja më e lartë malore e Zvicrës?
options:
  a: Piz Bernina
  b: Matterhorn
  c: Dufourspitze
  d: Jungfrau
explanation: Dufourspitze në masivin Monte Rosa në kantonin e Valais (Wallis) është maja më e lartë e
  Zvicrës, me rreth 4634 metra. Matterhorn është më i njohur, por më i ulët. Piz Bernina në kantonin e
  Graubünden është maja më e lartë e Alpeve Lindore.
