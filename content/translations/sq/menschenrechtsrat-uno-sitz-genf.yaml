id: menschenrechtsrat-uno-sitz-genf
lang: sq
source_version: 1
question: Në cilin qytet zvicerian ka selinë Këshilli i të Drejtave të Njeriut i Kombeve të Bashkuara
  (OKB)?
options:
  a: Lozanë
  b: Gjenevë
  c: Bernë
  d: Bazel
explanation: Këshilli i të Drejtave të Njeriut i OKB-së mbledhet në Gjenevë. Gjeneva, krahas Nju Jorkut,
  është një nga vendndodhjet më të rëndësishme të OKB-së dhe selia e shumë organizatave ndërkombëtare.
