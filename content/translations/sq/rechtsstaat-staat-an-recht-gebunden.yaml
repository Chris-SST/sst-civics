id: rechtsstaat-staat-an-recht-gebunden
lang: sq
source_version: 2
question: Çfarë vlen në një shtet juridik si Zvicra për autoritetet dhe për qeverinë?
options:
  a: Ato mund të zgjedhin vetë cilat ligje t'i zbatojnë.
  b: Edhe ato duhet t'i përmbahen të drejtës në fuqi.
  c: Ato qëndrojnë mbi të drejtën në fuqi.
  d: Ato duhet të orientohen vetëm sipas vendimeve të medias.
explanation: Në një shtet juridik nuk duhet t'i përmbahet të drejtës vetëm popullsia, por edhe vetë shteti.
  Autoritetet dhe qeveria mund të veprojnë vetëm ashtu siç e lejon e drejta. Kështu shteti juridik i mbron
  njerëzit nga arbitrariteti.
