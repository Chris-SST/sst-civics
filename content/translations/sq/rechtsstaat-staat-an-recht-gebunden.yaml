    question_de: Was gilt in einem Rechtsstaat wie der Schweiz für die Behörden und für die Regierung?
    options_de:
      a: Sie können selbst wählen, welche Gesetze sie anwenden.
      b: Auch sie müssen sich an das geltende Recht halten.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen sich nur nach den Entscheidungen der Medien richten.
    explanation_de: In einem Rechtsstaat muss nicht nur die Bevölkerung sich an das Recht halten, sondern
      auch der Staat selbst. Die Behörden und die Regierung können nur so handeln, wie das Recht es erlaubt.
      So schützt der Rechtsstaat die Menschen vor Willkür.
