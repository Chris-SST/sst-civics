    question_de: Eine Frau lässt sich in der Schweiz nieder und möchte ihre Religion selbst wählen. Sie
      denkt auch daran, keiner Religion anzugehören. Was garantiert ihr die Bundesverfassung in dieser
      Hinsicht?
    options_de:
      a: Sie kann nur einer Religion angehören, die im Kanton öffentlich-rechtlich anerkannt ist.
      b: Sie kann ihre Religion frei wählen, sie ausüben oder keiner Religion angehören.
      c: Sie kann ihre Religion privat wählen, aber sie nirgends zusammen mit anderen ausüben.
      d: Sie muss bei der Gemeinde über eine anerkannte Religion entscheiden.
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung garantiert.
      Jede Person kann ihre Religion frei wählen, sie allein oder zusammen mit anderen ausüben oder keiner
      Religion angehören. Niemand kann gezwungen werden, sich einer Religionsgemeinschaft anzuschliessen.
