id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: sq
source_version: 1
question: Një grua vendoset në Zvicër dhe dëshiron ta zgjedhë vetë fenë e saj. Ajo mendon edhe të mos
  i përkasë asnjë feje. Çfarë i garanton asaj Kushtetuta Federale në këtë drejtim?
options:
  a: Ajo mund t'i përkasë vetëm një feje që është e njohur publikisht-juridikisht në kanton.
  b: Ajo mund ta zgjedhë lirisht fenë e saj, ta praktikojë atë ose të mos i përkasë asnjë feje.
  c: Ajo mund ta zgjedhë fenë e saj privatisht, por nuk mund ta praktikojë askund së bashku me të tjerë.
  d: Ajo duhet të vendosë pranë komunës (Gemeinde) për një fe të njohur.
explanation: Liria e besimit dhe e ndërgjegjes është e garantuar në nenin 15 të Kushtetutës Federale.
  Çdo person mund ta zgjedhë lirisht fenë e tij, ta praktikojë atë vetëm ose së bashku me të tjerë, ose
  të mos i përkasë asnjë feje. Askush nuk mund të detyrohet t'i bashkohet një bashkësie fetare.
