    question_de: Was gilt für ein Bundesgesetz, das von beiden Kammern des Parlaments verabschiedet wurde?
    options_de:
      a: Die stimmberechtigten Bürger können mit einem Referendum verlangen, dass darüber eine Volksabstimmung
        abgehalten wird.
      b: Der Bundesrat muss es danach auch dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass das Volk die Möglichkeit hat, Einfluss zu nehmen.
      d: Die Regierungen der Kantone müssen es zuvor jede einzeln genehmigen.
    explanation_de: Nach dem Beschluss beider Kammern unterliegen die Bundesgesetze dem fakultativen Referendum.
      Wenn es zustande kommt, entscheiden die stimmberechtigten Bürger mit ihrer Stimme an der Urne über
      das Gesetz.
