id: bundesgesetz-referendum-volksabstimmung
lang: sq
source_version: 1
question: Çfarë vlen për një ligj federal që e kanë miratuar të dyja dhomat e Parlamentit?
options:
  a: Qytetarët me të drejtë vote mund të kërkojnë me një referendum që të mbahet një votim popullor për
    të.
  b: Këshilli Federal (Bundesrat) duhet ta paraqesë pastaj edhe te Gjykata Federale (Bundesgericht) për
    miratim.
  c: Ai hyn gjithmonë menjëherë në fuqi, pa pasur mundësi populli të ndikojë.
  d: Qeveritë e kantoneve duhet ta miratojnë më parë secila veç e veç.
explanation: Pas vendimit të të dyja dhomave, ligjet federale i nënshtrohen referendumit fakultativ. Nëse
  ai realizohet, qytetarët me të drejtë vote vendosin për ligjin me votë në kuti.
