    question_de: Auf Rechnungen und Einzahlungsscheinen steht oft die Abkürzung «MWST». Was bedeutet sie?
    options_de:
      a: Die Steuer auf gemieteten Wohnungen (Mietwohnungssteuer)
      b: Die militärische Schutzsteuer (Militärwehrsteuer)
      c: Die Steuer auf Motorfahrzeuge (Motorwagensteuer)
      d: Die Steuer auf den Mehrwert (Mehrwertsteuer)
    explanation_de: MWST bedeutet Steuer auf den Mehrwert (Mehrwertsteuer). Sie wird auf den grössten
      Teil der Waren und Dienstleistungen angewendet und ist im Preis inbegriffen. Sie ist eine wichtige
      Einnahmequelle für den Bund.
