id: abkuerzung-mwst-bedeutung
lang: sq
source_version: 1
question: Në fatura dhe në kuponë pagese shpesh shkruhet shkurtesa «MWST». Çfarë nënkupton ajo?
options:
  a: Tatimin mbi banesat me qira (Mietwohnungssteuer)
  b: Tatimin ushtarak mbi mbrojtjen (Militärwehrsteuer)
  c: Tatimin mbi automjetet me motor (Motorwagensteuer)
  d: Tatimin mbi vlerën e shtuar (Mehrwertsteuer)
explanation: MWST do të thotë tatim mbi vlerën e shtuar (Mehrwertsteuer). Ai zbatohet për pjesën më të
  madhe të mallrave dhe shërbimeve dhe është i përfshirë në çmim. Ai është një burim i rëndësishëm të
  ardhurash për Konfederatën.
