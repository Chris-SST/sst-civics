id: wappen-kanton-zuerich-weiss-blau
lang: sq
source_version: 2
question: Cilat ngjyra ka stema e kantonit të Cyrihut?
options:
  a: E kuqe dhe e bardhë
  b: E gjelbër dhe e bardhë
  c: E bardhë dhe blu
  d: Blu dhe e verdhë
explanation: Stema e Cyrihut është e ndarë tërthor (në diagonale) në të bardhë dhe blu. Në heraldikë,
  e bardha quhet «argjend». Të njëjtat ngjyra i ka edhe flamuri i kantonit.
