id: gewerkschaften-aufgabe-arbeitnehmende
lang: sq
source_version: 2
question: Cila është detyra e sindikatave në Zvicër?
options:
  a: Ato angazhohen për interesat e punëmarrësve.
  b: Ato u japin të huajve lejen për të punuar.
  c: Ato përcaktojnë normat e tatimit për ndërmarrjet.
  d: Ato përfaqësojnë interesat e punëdhënësve përpara Konfederatës.
explanation: Sindikatat janë organizata të punëmarrësve. Ato përfaqësojnë interesat e tyre, për shembull
  në lidhje me pagat dhe kushtet e punës, dhe shpesh negociojnë me punëdhënësit kontrata kolektive pune.
  Lejet e punës, përkundrazi, i lëshojnë autoritetet, jo sindikatat.
