    question_de: Was ist die Aufgabe der Gewerkschaften in der Schweiz?
    options_de:
      a: Sie setzen sich für die Interessen der Arbeitnehmer ein.
      b: Sie geben Ausländern die Erlaubnis zu arbeiten.
      c: Sie legen die Steuersätze für die Unternehmen fest.
      d: Sie vertreten die Interessen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Gewerkschaften sind Organisationen der Arbeitnehmer. Sie vertreten deren Interessen,
      zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln oft mit den Arbeitgebern Gesamtarbeitsverträge
      aus. Arbeitsbewilligungen hingegen werden von den Behörden erteilt, nicht von den Gewerkschaften.
