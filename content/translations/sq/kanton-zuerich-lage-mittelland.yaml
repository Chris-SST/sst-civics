lang: sq
source_version: 2
question: Cilës zonë të madhe peizazhi të Zvicrës i përket kantoni i Cyrihut?
options:
  a: Alpeve Jugore
  b: Jurasë
  c: Pllajës Qendrore (Mittelland)
  d: Alpeve Qendrore
explanation: Kantoni i Cyrihut i përket Pllajës Qendrore (Mittelland), pra zonës më të rrafshët midis
  Jurasë në veriperëndim dhe Alpeve në jug. Pllaja Qendrore është pjesa më e populluar e Zvicrës.
