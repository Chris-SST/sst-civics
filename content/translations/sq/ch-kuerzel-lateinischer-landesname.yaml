    question_de: Wofür steht das Länderkürzel «CH» für die Schweiz?
    options_de:
      a: Für den französischen Namen Confédération Helvétique
      b: Für die Wortgruppe «Cantons Helvétiques»
      c: Für den lateinischen Namen Civitas Helvetica
      d: Für den lateinischen Namen des Landes Confoederatio Helvetica
    explanation_de: CH ist die Kurzform von Confoederatio Helvetica, dem lateinischen Namen der Schweiz.
      Latein wird verwendet, weil es keine der vier Landessprachen bevorzugt. Das Kürzel findet sich zum
      Beispiel auf Autokennzeichen und in Internetadressen.
