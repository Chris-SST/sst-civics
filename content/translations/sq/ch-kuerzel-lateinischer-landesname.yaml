id: ch-kuerzel-lateinischer-landesname
lang: sq
source_version: 1
question: Për çfarë qëndron shkurtesa e vendit «CH» për Zvicrën?
options:
  a: Për emrin francez Confédération Helvétique
  b: Për togfjalëshin «Cantons Helvétiques»
  c: Për emrin latin Civitas Helvetica
  d: Për emrin latin të vendit Confoederatio Helvetica
explanation: CH është forma e shkurtër e Confoederatio Helvetica, emrit latin të Zvicrës. Latinishtja
  përdoret sepse nuk favorizon asnjë nga katër gjuhët kombëtare. Shkurtesa gjendet, për shembull, në targat
  e makinave dhe në adresat e internetit.
