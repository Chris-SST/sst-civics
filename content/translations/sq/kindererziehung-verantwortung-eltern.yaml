    question_de: Wer ist in der Schweiz hauptsächlich für die Erziehung der Kinder verantwortlich?
    options_de:
      a: Die Gemeinde
      b: Die Eltern
      c: Die Schule
      d: Der Kanton
    explanation_de: Gemäss dem Zivilgesetzbuch sorgen die Eltern für das Wohl des Kindes und leiten seine
      Erziehung. Die Schule ergänzt diese Aufgabe mit der Bildung. Der Staat greift nur ein, wenn das
      Wohl des Kindes gefährdet ist.
