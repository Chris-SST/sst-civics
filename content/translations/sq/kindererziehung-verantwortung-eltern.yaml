id: kindererziehung-verantwortung-eltern
lang: sq
source_version: 1
question: Kush është kryesisht përgjegjës për edukimin e fëmijëve në Zvicër?
options:
  a: Komuna (Gemeinde)
  b: Prindërit
  c: Shkolla
  d: Kantoni
explanation: Sipas Kodit Civil, prindërit kujdesen për mirëqenien e fëmijës dhe drejtojnë edukimin e tij.
  Shkolla e plotëson këtë detyrë me arsimimin. Shteti ndërhyn vetëm kur rrezikohet mirëqenia e fëmijës.
