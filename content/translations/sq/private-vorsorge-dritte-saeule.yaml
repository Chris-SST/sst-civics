question: Çfarë përbën në Zvicër shtyllën e tretë të sigurimit për pleqëri?
options:
  a: Sigurimi i detyrueshëm kundër aksidenteve
  b: Parashikimi privat
  c: Arka e pensioneve e punëdhënësit
  d: Përfitimet plotësuese
explanation: Shtylla e tretë është parashikimi privat, për shembull kursimi i lidhur. Ai është vullnetar
