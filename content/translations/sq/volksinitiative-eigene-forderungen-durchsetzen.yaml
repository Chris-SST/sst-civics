    question_de: Wozu dient die Volksinitiative den Stimmberechtigten?
    options_de:
      a: Mit ihr können sie einen Entscheid des Bundesgerichts ändern.
      b: Mit ihr können sie ihre eigenen Anliegen auf die politische Agenda setzen.
      c: Mit ihr können sie das Datum der nächsten Wahlen festlegen.
      d: Mit ihr können sie ein vom Parlament verabschiedetes Gesetz verhindern.
    explanation_de: Mit einer Volksinitiative können die Stimmberechtigten eine Änderung der Bundesverfassung
      vorschlagen. Wenn die Initiative zustande kommt, wird darüber abgestimmt. So können sie ihre eigenen
      Anliegen auch gegen den Willen des Parlaments umsetzen, wenn das Volk und die Kantone sie annehmen.
