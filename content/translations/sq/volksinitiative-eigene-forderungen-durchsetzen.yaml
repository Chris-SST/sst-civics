id: volksinitiative-eigene-forderungen-durchsetzen
lang: sq
source_version: 1
question: Për çfarë u shërben nisma popullore (Volksinitiative) personave me të drejtë vote?
options:
  a: Me anë të saj ata mund të ndryshojnë një vendim të Gjykatës Federale (Bundesgericht).
  b: Me anë të saj ata mund t'i vendosin kërkesat e veta në axhendën politike.
  c: Me anë të saj ata mund të caktojnë datën e zgjedhjeve të ardhshme.
  d: Me anë të saj ata mund të pengojnë një ligj të miratuar nga parlamenti.
explanation: Me një nismë popullore, personat me të drejtë vote mund të propozojnë një ndryshim të Kushtetutës
  Federale. Nëse nisma realizohet, mbi të votohet. Kështu ata mund t'i zbatojnë kërkesat e veta edhe kundër
  dëshirës së parlamentit, nëse populli dhe kantonet e miratojnë.
