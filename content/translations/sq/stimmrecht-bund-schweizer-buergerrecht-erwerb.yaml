id: stimmrecht-bund-schweizer-buergerrecht-erwerb
lang: sq
source_version: 1
question: Nga cili moment një person nga jashtë vendit merr të drejtën e votës dhe të zgjedhjes në nivel
  të Konfederatës?
options:
  a: Sapo ka jetuar dhjetë vjet në Zvicër.
  b: Sapo merr një leje vendosjeje (leja C).
  c: Sapo paguan taksa dhe punon në Zvicër.
  d: Sapo ka shtetësinë zvicerane (Bürgerrecht) dhe është madhor.
explanation: E drejta e votës dhe e zgjedhjes në nivel të Konfederatës është e lidhur me shtetësinë zvicerane.
  Një leje vendosjeje (Niederlassungsbewilligung), një kohëzgjatje e caktuar qëndrimi ose pagesa e taksave
  nuk mjaftojnë për këtë. Kush merr shtetësinë dhe është madhor, mund të marrë pjesë në zgjedhjet dhe
  votimet federale.
