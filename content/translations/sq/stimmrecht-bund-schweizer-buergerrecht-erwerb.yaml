    question_de: Ab welchem Zeitpunkt erhält eine Person aus dem Ausland das Stimm- und Wahlrecht auf
      Ebene des Bundes?
    options_de:
      a: Sobald sie zehn Jahre in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (Bewilligung C) erhält.
      c: Sobald sie Steuern zahlt und in der Schweiz arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht hat und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Ebene des Bundes ist an das Schweizer Bürgerrecht gebunden.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Zahlen von Steuern genügen
      dafür nicht. Wer das Bürgerrecht erhält und volljährig ist, kann an den eidgenössischen Wahlen und
      Abstimmungen teilnehmen.
