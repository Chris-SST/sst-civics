question: Cili emër përdoret gjithashtu në Kushtetutën Federale për Zvicrën?
options:
  a: Republika Federale
  b: Eidgenossenschaft (Besëlidhja)
  c: Konfederata e kantoneve
  d: Mbretëria Federale (Eidgenössisches Königreich)
explanation: Emri zyrtar është «Schweizerische Eidgenossenschaft» (Besëlidhja Zvicerane). Fjala Eidgenossenschaft
  përfaqëson pra Zvicrën në tërësi. Ajo kujton aleancat që u vulosën me një be.
