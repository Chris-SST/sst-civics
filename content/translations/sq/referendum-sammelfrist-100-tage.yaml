id: referendum-sammelfrist-100-tage
lang: sq
source_version: 1
question: Sa kohë kanë komitetet e referendumit për të mbledhur nënshkrimet për një referendum fakultativ
  kundër një ligji të Konfederatës?
options:
  a: 60 ditë
  b: 18 muaj
  c: 100 ditë
  d: 30 ditë
explanation: Afati është 100 ditë nga publikimi zyrtar i aktit. Ndërkohë, 18 muajt vlejnë për mbledhjen
  e nënshkrimeve për një nismë popullore (Volksinitiative).
