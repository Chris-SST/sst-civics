    question_de: Wie viel Zeit haben die Referendumskomitees, um die Unterschriften für ein fakultatives
      Referendum gegen ein Bundesgesetz zu sammeln?
    options_de:
      a: 60 Tage
      b: 18 Monate
      c: 100 Tage
