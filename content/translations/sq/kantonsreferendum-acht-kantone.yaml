    question_de: Wer kann ausser 50'000 stimmberechtigten Bürgerinnen und Bürgern ebenfalls ein fakultatives
      Referendum gegen ein Bundesgesetz verlangen?
    options_de:
      a: Acht Kantone
      b: Drei grosse Parteien zusammen
      c: Der Bundesrat
      d: Das Bundesgericht
    explanation_de: Gemäss der Bundesverfassung können auch acht Kantone eine Volksabstimmung über ein
      Bundesgesetz verlangen. Dies wird Kantonsreferendum genannt. Es wird selten genutzt, zeigt aber,
      dass die Kantone im Bundesstaat Mitwirkungsrechte haben.
