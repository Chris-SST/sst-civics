id: kantonsreferendum-acht-kantone
lang: sq
source_version: 1
question: Kush mund të kërkojë, përveç 50'000 shtetasve me të drejtë vote, gjithashtu një referendum fakultativ
  kundër një ligji federal?
options:
  a: Tetë kantone
  b: Tri parti të mëdha së bashku
  c: Këshilli Federal (Bundesrat)
  d: Gjykata Federale (Bundesgericht)
explanation: Sipas Kushtetutës Federale, edhe tetë kantone mund të kërkojnë një votim popullor mbi një
  ligj federal. Kjo quhet referendum i kantoneve. Përdoret rrallë, por tregon se kantonet kanë të drejta
  pjesëmarrjeje në shtetin federal.
