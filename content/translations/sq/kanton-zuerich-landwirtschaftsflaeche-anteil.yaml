id: kanton-zuerich-landwirtschaftsflaeche-anteil
lang: sq
source_version: 1
question: Sa është përafërsisht pjesa e sipërfaqes së kantonit të Cyrihut që përdoret për bujqësi?
options:
  a: Rreth 68 për qind
  b: Rreth 25 për qind
  c: Rreth 11 për qind
  d: Rreth 41 për qind
explanation: Rreth 41 për qind e sipërfaqes së kantonit të Cyrihut shërben për bujqësi. Pjesa tjetër përbëhet
  kryesisht nga pyje, zona banimi dhe trupa ujorë.
