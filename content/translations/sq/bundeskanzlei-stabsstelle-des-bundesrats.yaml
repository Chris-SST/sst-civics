    question_de: Welche Aufgabe hat die Bundeskanzlei für den Bundesrat?
    options_de:
      a: Sie ist die Stabsstruktur des Bundesrates.
      b: Sie prüft die Entscheidungen des Bundesrates als Gericht.
      c: Sie leitet das Finanzdepartement.
      d: Sie wählt die Mitglieder des Bundesrates.
    explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der
      Vorbereitung der Sitzungen. Sie wird von der Bundeskanzlerin oder dem Bundeskanzler geleitet. Der
      Bundesrat wird von der Bundesversammlung gewählt.
