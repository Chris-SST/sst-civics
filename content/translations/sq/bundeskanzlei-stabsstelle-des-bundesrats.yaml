id: bundeskanzlei-stabsstelle-des-bundesrats
lang: sq
source_version: 1
question: Çfarë detyre ka Kancelaria Federale (Bundeskanzlei) për Këshillin Federal (Bundesrat)?
options:
  a: Ajo është struktura e shtabit e Këshillit Federal.
  b: Ajo shqyrton vendimet e Këshillit Federal si gjykatë.
  c: Ajo drejton Departamentin e Financave.
  d: Ajo zgjedh anëtarët e Këshillit Federal.
explanation: Kancelaria Federale mbështet Këshillin Federal në punën e tij, për shembull në përgatitjen
  e seancave. Ajo drejtohet nga kancelarja federale ose kancelari federal. Këshilli Federal zgjidhet nga
  Kuvendi Federal (Bundesversammlung).
