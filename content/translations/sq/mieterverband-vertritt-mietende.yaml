    question_de: Was ist die Aufgabe des Mieterverbands?
    options_de:
      a: Er vertritt die Interessen der Hauseigentümer
      b: Er legt die Mieten für alle Wohnungen fest
      c: Er vermietet im Auftrag des Kantons Wohnungen
      d: Er vertritt die Interessen der Mieter
    explanation_de: Der Mieterverband ist eine Organisation, die sich für die Interessen der Mieter einsetzt.
      Er berät seine Mitglieder, zum Beispiel bei Fragen zum Mietrecht. Die Interessen der Hauseigentümer
      vertreten andere Verbände.
