id: mieterverband-vertritt-mietende
lang: sq
source_version: 1
question: Cila është detyra e Shoqatës së Qiramarrësve?
options:
  a: Ajo përfaqëson interesat e pronarëve të shtëpive
  b: Ajo përcakton qiratë për të gjitha banesat
  c: Ajo jep banesa me qira me porosi të kantonit
  d: Ajo përfaqëson interesat e qiramarrësve
explanation: Shoqata e Qiramarrësve është një organizatë që angazhohet për interesat e qiramarrësve. Ajo
  këshillon anëtarët e saj, për shembull, për pyetje rreth së drejtës së qirasë. Interesat e pronarëve
  të shtëpive i përfaqësojnë shoqata të tjera.
