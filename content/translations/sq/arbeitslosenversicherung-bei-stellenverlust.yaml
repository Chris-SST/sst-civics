id: arbeitslosenversicherung-bei-stellenverlust
lang: sq
source_version: 1
question: Cili sigurim shoqëror ndërhyn kur një person humb vendin e punës?
options:
  a: Sigurimi i invaliditetit
  b: Sigurimi i pleqërisë dhe i të mbijetuarve
  c: Sigurimi i papunësisë
  d: Sigurimi kundër aksidenteve
explanation: Sigurimi i papunësisë paguan, nën kushte të caktuara, një kompensim kur dikush humb vendin
  e punës. Ai ndihmon gjithashtu në kërkimin e një pune të re.
