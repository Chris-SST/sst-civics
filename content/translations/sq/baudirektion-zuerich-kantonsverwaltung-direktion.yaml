    question_de: Welche der folgenden Institutionen ist eine Direktion der Verwaltung des Kantons Zürich?
    options_de:
      a: Die Gemeindedirektion
      b: Die Baudirektion
      c: Die Stadtdirektion
      d: Die Direktion des Bundes
    explanation_de: Die Baudirektion ist eine der Direktionen der Verwaltung des Kantons Zürich. Die Kantonsverwaltung
      ist in mehrere Direktionen aufgeteilt, von denen jede von einem Mitglied des Regierungsrates geleitet
      wird.
