id: baudirektion-zuerich-kantonsverwaltung-direktion
lang: sq
source_version: 1
question: Cila nga institucionet e mëposhtme është një drejtori e administratës së kantonit të Cyrihut?
options:
  a: Drejtoria e komunës (Gemeinde)
  b: Drejtoria e ndërtimit
  c: Drejtoria e qytetit
  d: Drejtoria e Konfederatës
explanation: Drejtoria e ndërtimit është një nga drejtoritë e administratës së kantonit të Cyrihut. Administrata
  e kantonit është e ndarë në disa drejtori, secila prej të cilave udhëhiqet nga një anëtar i Këshillit
  Qeveritar (Regierungsrat).
