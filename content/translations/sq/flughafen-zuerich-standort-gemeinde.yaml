id: flughafen-zuerich-standort-gemeinde
lang: sq
source_version: 2
question: Në territorin e cilës nga këto komuna (Gemeinde) ndodhet aeroporti i Zyrihut?
options:
  a: Winterthur
  b: Kloten
  c: Uster
  d: Dübendorf
explanation: Aeroporti i Zyrihut ndodhet kryesisht në territorin e qytetit Kloten në Zürcher Unterland.
  Prandaj shumë njerëz e quajnë edhe «aeroporti i Klotenit». Në Dübendorf ka një fushë tjetër ajrore.
