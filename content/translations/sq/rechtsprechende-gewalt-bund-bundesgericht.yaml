question: Cili autoritet është në nivel federal organi më i lartë gjyqësor i Zvicrës?
options:
  a: Kancelaria Federale (Bundeskanzlei)
  b: Këshilli Federal (Bundesrat)
  c: Kuvendi Federal (Bundesversammlung)
  d: Gjykata Federale (Bundesgericht)
explanation: Kushtetuta Federale ia ka caktuar pushtetin gjyqësor të Konfederatës Gjykatës Federale. Ajo
  është autoriteti më i lartë gjyqësor i Konfederatës. Këshilli Federal dhe Kuvendi Federal ushtrojnë
  përkatësisht pushtetin ekzekutiv dhe pushtetin legjislativ.
