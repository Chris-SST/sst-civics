id: dienstpflicht-nur-maenner-bis-alter
lang: sq
source_version: 1
question: Kush është i detyruar në Zvicër të kryejë shërbim ushtarak ose shërbim zëvendësues deri në një
  moshë të caktuar?
options:
  a: Vetëm meshkujt
  b: Gratë dhe meshkujt në mënyrë të barabartë
  c: Vetëm personat me arsim ose formim profesional
  d: Vetëm personat që kanë një detyrë zyrtare në një komunë (Gemeinde)
explanation: Detyrimi për shërbim vlen në Zvicër vetëm për meshkujt. Për gratë shërbimi ushtarak është
  vullnetar. Detyrimi zgjat deri në një moshë të përcaktuar me ligj.
