    question_de: Wer ist in der Schweiz verpflichtet, bis zu einem bestimmten Alter Militärdienst oder
      Ersatzdienst zu leisten?
    options_de:
      a: Nur die Männer
      b: Frauen und Männer gleichermassen
      c: Nur Personen mit Schul- oder Berufsbildung
      d: Nur Personen, die in einer Gemeinde ein Amt ausüben
    explanation_de: Die Dienstpflicht gilt in der Schweiz nur für die Männer. Für die Frauen ist der Militärdienst
      freiwillig. Die Pflicht dauert bis zu einem gesetzlich festgelegten Alter.
