    question_de: Welche Behörde des Bundes ist für Gesundheitsfragen zuständig?
    options_de:
      a: Bundesamt für Umwelt (BAFU)
      b: Staatssekretariat für Migration (SEM)
      c: Bundesamt für Statistik (BFS)
      d: Bundesamt für Gesundheit (BAG)
    explanation_de: Das Bundesamt für Gesundheit (BAG) ist die zuständige Behörde des Bundes für Gesundheitsfragen.
      Es beaufsichtigt zum Beispiel die soziale Krankenversicherung.
