id: bag-zustaendig-gesundheitsfragen-bund
lang: sq
source_version: 1
question: Cila autoritet e Konfederatës është përgjegjëse për çështjet e shëndetësisë?
options:
  a: Zyra Federale për Mjedisin (BAFU)
  b: Sekretariati i Shtetit për Migracionin (SEM)
  c: Zyra Federale e Statistikës (BFS)
  d: Zyra Federale e Shëndetësisë Publike (BAG)
explanation: Zyra Federale e Shëndetësisë Publike (BAG) është autoriteti përgjegjës i Konfederatës për
  çështjet e shëndetësisë. Ajo mbikëqyr, për shembull, sigurimin shoqëror shëndetësor.
