    question_de: Welche Telefonnummer wird in der Schweiz angerufen, wenn im Notfall die Polizei benötigt
      wird?
    options_de:
      a: '143'
      b: '118'
      c: '144'
      d: '117'
    explanation_de: Die Polizei kann in der ganzen Schweiz unter der Nummer 117 erreicht werden. Die Feuerwehr
      hat die Nummer 118, der Rettungsdienst (der schnellen medizinischen Hilfe) hat die Nummer 144. Die
      Nummer 143 ist die Nummer der «Dargebotenen Hand» (Die ausgestreckte Hand) für Personen, die sich
      in einer Krise befinden.
