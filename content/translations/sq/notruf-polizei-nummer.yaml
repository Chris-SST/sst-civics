id: notruf-polizei-nummer
lang: sq
source_version: 1
question: Cilin numër telefoni thirret në Zvicër kur në rast urgjence nevojitet policia?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: Policia mund të arrihet në të gjithë Zvicrën në numrin 117. Zjarrfikësit kanë numrin 118,
  shërbimi i ndihmës së shpejtë mjekësore ka numrin 144. Numri 143 është numri i «Dargebotene Hand» (Dora
  e shtrirë) për personat që ndodhen në krizë.
