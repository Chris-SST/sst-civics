id: primarschule-finanzierung-kanton-gemeinde
lang: sq
source_version: 1
question: Kush e financon dhe e organizon shkollën fillore (Primarschule) në kantonin e Cyrihut?
options:
  a: Vetëm famullitë kishtare (Kirchgemeinden)
  b: Vetëm prindërit e nxënësve
  c: Vetëm Konfederata
  d: Kantoni dhe komunat (Gemeinden) së bashku
explanation: Shkolla publike (Volksschule) në kantonin e Cyrihut është një detyrë e përbashkët e kantonit
  dhe e komunave. Kantoni përcakton bazat, ndërsa komunat i drejtojnë shkollat në vend.
