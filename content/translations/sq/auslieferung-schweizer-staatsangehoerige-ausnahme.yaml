id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: sq
source_version: 2
question: Çfarë vlen në parim për ekstradimin e shtetasve zviceranë jashtë vendit?
options:
  a: Ata ekstradohen me kërkesë të çdo shteti.
  b: Ata nuk ekstradohen në një shtet tjetër kundër dëshirës së tyre. Megjithatë, ata mund t'i dorëzohen
    një gjykate ndërkombëtare.
  c: Ata ekstradohen vetëm në shtetet fqinje të Zvicrës.
  d: Ata ekstradohen nëse Këshilli Federal (Bundesrat) e dëshiron këtë në rastin konkret.
explanation: Sipas nenit 25 të Kushtetutës Federale, shtetasit zviceranë nuk mund të dëbohen. Ata mund
  të ekstradohen në një shtet tjetër vetëm nëse vetë janë dakord. Një gjykatë ndërkombëtare, për shembull
  Gjykata Penale Ndërkombëtare, nuk është autoritet i huaj, prandaj një ligj i Konfederatës lejon që shtetasit
  zviceranë t'i dorëzohen asaj për një procedim.
