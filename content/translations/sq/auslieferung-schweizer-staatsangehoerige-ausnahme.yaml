    question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Bürgern ins Ausland?
    options_de:
      a: Sie werden auf Ersuchen jedes Staates ausgeliefert.
      b: Sie werden gegen ihren Willen nicht an einen anderen Staat ausgeliefert. Sie können jedoch einem
        internationalen Gericht übergeben werden.
      c: Sie werden nur an die Nachbarstaaten der Schweiz ausgeliefert.
      d: Sie werden ausgeliefert, wenn der Bundesrat dies im konkreten Fall wünscht.
    explanation_de: Gemäss Artikel 25 der Bundesverfassung dürfen Schweizer Staatsangehörige nicht ausgewiesen
      werden. Sie können nur dann an einen anderen Staat ausgeliefert werden, wenn sie selbst damit einverstanden
      sind. Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine ausländische
      Behörde, daher erlaubt ein Gesetz des Bundes, dass Schweizer Staatsangehörige ihm für ein Verfahren
      übergeben werden.
