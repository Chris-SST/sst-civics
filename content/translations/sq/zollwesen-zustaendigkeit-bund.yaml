id: zollwesen-zustaendigkeit-bund
lang: sq
source_version: 1
question: Kush kujdeset në Zvicër për shërbimin doganor?
options:
  a: Konfederata
  b: Komunat (Gemeinden) në kufi
  c: Kantonet në të cilat shtrihen kufijtë
  d: Kantonet dhe Konfederata, secila për gjysmën
explanation: Sipas Kushtetutës Federale, shërbimi doganor është çështje e Konfederatës. Ajo rregullon
  tarifat doganore dhe kontrollin e qarkullimit të mallrave përtej kufirit. Kantonet dhe komunat nuk kanë
  për këtë kompetencë të veçantë.
