    question_de: Wer ist in der Schweiz für das Zollwesen zuständig?
    options_de:
      a: Der Bund
      b: Die Gemeinden an der Grenze
      c: Die Kantone, in denen die Grenzen verlaufen
      d: Die Kantone und der Bund, je zur Hälfte
    explanation_de: Gemäss der Bundesverfassung ist das Zollwesen Sache des Bundes. Er regelt die Zolltarife
      und die Kontrolle des Warenverkehrs über die Grenze. Die Kantone und die Gemeinden haben dafür keine
      besondere Zuständigkeit.
