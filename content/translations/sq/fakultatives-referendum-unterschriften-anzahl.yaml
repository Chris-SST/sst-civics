id: fakultatives-referendum-unterschriften-anzahl
lang: sq
source_version: 1
question: Sa nënshkrime nevojiten për një referendum fakultativ kundër një ligji të Konfederatës?
options:
  a: 200 000 nënshkrime
  b: 30 000 nënshkrime
  c: 50 000 nënshkrime
  d: 100 000 nënshkrime
explanation: Për një referendum fakultativ nevojiten 50 000 nënshkrime të vlefshme të personave me të
  drejtë vote. Ato duhet të mblidhen brenda 100 ditëve pas publikimit të ligjit.
