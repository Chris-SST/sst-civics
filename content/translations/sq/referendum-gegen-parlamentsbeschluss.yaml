    source_version: 1
    question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Bundesebene (Eidgenossenschaft)?
    options_de:
      a: Gegen Gesetze, die vom Nationalrat und vom Ständerat verabschiedet wurden
      b: Gegen Beschlüsse, die von der Bundeskanzlei gefasst wurden
      c: Gegen Gerichtsurteile, die vom Bundesgericht erlassen wurden
      d: Gegen Verordnungen, die von einzelnen Gemeinden erlassen wurden
    explanation_de: Ein Referendum richtet sich gegen Gesetze, die vom Parlament verabschiedet wurden.
      Das Parlament besteht aus dem Nationalrat und dem Ständerat. Gerichtsurteile und Beschlüsse der
      Verwaltung können nicht mit einem Referendum angefochten werden.
