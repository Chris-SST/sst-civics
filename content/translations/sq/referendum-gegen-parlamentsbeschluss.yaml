id: referendum-gegen-parlamentsbeschluss
lang: sq
source_version: 1
question: Kundër cilave vendime drejtohet një referendum në nivel federal (Konfederata)?
options:
  a: Kundër ligjeve që i kanë miratuar Këshilli Kombëtar (Nationalrat) dhe Këshilli i Shteteve (Ständerat)
  b: Kundër vendimeve që i ka marrë Kancelaria Federale (Bundeskanzlei)
  c: Kundër vendimeve gjyqësore që i ka dhënë Gjykata Federale (Bundesgericht)
  d: Kundër urdhëresave që i kanë nxjerrë komuna të veçanta (Gemeinde)
explanation: Një referendum drejtohet kundër ligjeve që i ka miratuar Parlamenti. Parlamenti përbëhet
  nga Këshilli Kombëtar dhe Këshilli i Shteteve. Vendimet gjyqësore dhe vendimet e administratës nuk mund
  të kundërshtohen me referendum.
