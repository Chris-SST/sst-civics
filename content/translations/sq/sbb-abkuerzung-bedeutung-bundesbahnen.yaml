id: sbb-abkuerzung-bedeutung-bundesbahnen
lang: sq
source_version: 1
question: Çfarë do të thotë shkurtesa «SBB», të cilën e shihni në trena dhe në stacionet e trenave në
  Zvicër?
options:
  a: Shoqëritë zvicerane të autobusëve
  b: Hekurudhat Federale Zvicerane (Schweizerische Bundesbahnen)
  c: Shoqëritë zvicerane të hekurudhave dhe të autobusëve
  d: Hekurudhat zvicerane malore
explanation: SBB do të thotë Hekurudhat Federale Zvicerane (Schweizerische Bundesbahnen). Ndërmarrja operon
  një pjesë të madhe të rrjetit hekurudhor zviceran dhe i përket Konfederatës (Bund). Përveç saj ka edhe
  ndërmarrje të tjera hekurudhore, për shembull BLS ose Hekurudha Retike (Rhätische Bahn).
