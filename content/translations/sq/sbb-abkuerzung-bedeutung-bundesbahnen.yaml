    question_de: Was bedeutet die Abkürzung «SBB», die Sie auf Zügen und an Bahnhöfen in der Schweiz sehen?
    options_de:
      a: Schweizerische Busgesellschaften
      b: Schweizerische Bundesbahnen
      c: Schweizerische Eisenbahn- und Busgesellschaften
      d: Schweizerische Bergbahnen
    explanation_de: SBB bedeutet Schweizerische Bundesbahnen. Das Unternehmen betreibt einen grossen Teil
      des schweizerischen Eisenbahnnetzes und gehört dem Bund. Ausser ihm gibt es auch andere Eisenbahnunternehmen,
      zum Beispiel die BLS oder die Rhätische Bahn.
