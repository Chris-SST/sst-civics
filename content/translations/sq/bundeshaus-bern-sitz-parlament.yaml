    question_de: Welches Gebäude in Bern ist der Sitzungsort des Schweizer Parlaments?
    options_de:
      a: Kornhaus
      b: Rathaus
      c: Bundesverwaltungsgericht
      d: Bundeshaus
    explanation_de: Das Schweizer Parlament tagt im Bundeshaus in Bern. Dort treffen sich der Nationalrat
      und der Ständerat zu ihren Sessionen. Das Rathaus ist ein Gebäude des Kantons Bern oder der Stadt,
      nicht des Parlaments der Eidgenossenschaft.
