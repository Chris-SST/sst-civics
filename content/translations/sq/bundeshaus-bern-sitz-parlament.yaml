id: bundeshaus-bern-sitz-parlament
lang: sq
source_version: 1
question: Cila ndërtesë në Bernë është vendi i mbledhjeve të Parlamentit të Zvicrës?
options:
  a: Kornhaus
  b: Rathaus (Bashkia)
  c: Gjykata Administrative e Konfederatës
  d: Bundeshaus (Pallati Federal)
explanation: Parlamenti i Zvicrës mblidhet në Bundeshaus në Bernë. Aty takohen Këshilli Kombëtar dhe Këshilli
  i Shteteve (Ständerat) për sesionet e tyre. Rathaus është një ndërtesë e kantonit të Bernës ose e qytetit,
  jo e parlamentit të Konfederatës.
