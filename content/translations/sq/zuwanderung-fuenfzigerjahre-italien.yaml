id: zuwanderung-fuenfzigerjahre-italien
lang: sq
source_version: 1
question: Nga cili vend vinte në vitet 1950 pjesa më e madhe e fuqisë punëtore që emigroi në Zvicër?
options:
  a: Nga Italia
  b: Nga Turqia
  c: Nga Portugalia
  d: Nga Spanja
explanation: Në vitet 1950 pjesa më e madhe e fuqisë punëtore të emigruar vinte nga Italia. Ekonomia kishte
  atëherë nevojë për shumë fuqi punëtore, për shembull në ndërtim dhe në industri. Më vonë erdhën edhe
  shumë njerëz nga vende të tjera.
