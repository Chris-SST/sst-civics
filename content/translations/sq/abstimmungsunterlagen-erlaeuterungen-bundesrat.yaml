id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: sq
source_version: 1
question: Çfarë marrin qytetarët me të drejtë vote përpara një votimi federal së bashku me materialin
  e votimit, që të mund të informohen për projektet?
options:
  a: Shpjegimet e Këshillit Federal (Bundesrat)
  b: Një mendim i Gjykatës Federale (Bundesgericht)
  c: Një ekspertizë e kantonit të vet
  d: Lista zgjedhore e të gjitha partive
explanation: Këshilli Federal shpjegon në shpjegimet, që shpesh quhen fletushka e votimit (Abstimmungsbüchlein),
  se për çfarë bëhet fjalë në çdo projekt. Aty gjenden edhe argumentet e komitetit të iniciativës ose
  të komitetit të referendumit, si dhe rekomandimi i Këshillit Federal dhe i Parlamentit. Kështu secili
  mund të formojë mendimin e vet.
