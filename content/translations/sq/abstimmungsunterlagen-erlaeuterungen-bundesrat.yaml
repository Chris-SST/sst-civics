    question_de: Was erhalten Stimmberechtigte vor einer eidgenössischen Abstimmung zusammen mit dem Abstimmungsmaterial,
      damit sie sich über die Vorlagen informieren können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Ein Gutachten des Bundesgerichts
      c: Ein Gutachten ihres eigenen Kantons
      d: Die Wahlliste aller Parteien
    explanation_de: Der Bundesrat erklärt in den Erläuterungen, die oft Abstimmungsbüchlein genannt werden,
      worum es bei jeder Vorlage geht. Dort finden sich auch die Argumente des Initiativkomitees oder
      des Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments. So kann sich jeder
      seine eigene Meinung bilden.
