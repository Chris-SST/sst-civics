    question_de: Wie hoch war ungefähr im Jahr 2020 der Anteil der Ausländer an der ständigen Wohnbevölkerung
      der Schweiz?
    options_de:
      a: rund drei Fünftel
      b: rund ein Zehntel
      c: rund die Hälfte
      d: rund ein Viertel
    explanation_de: Im Jahr 2020 hatte rund ein Viertel der ständigen Wohnbevölkerung keinen Schweizer
      Pass. Ende 2020 waren es rund 2,2 Millionen Personen von insgesamt 8,7 Millionen, also rund 25 Prozent.
      Verglichen mit anderen Ländern in Europa ist dieser Anteil hoch.
