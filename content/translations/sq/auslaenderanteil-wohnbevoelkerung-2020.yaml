id: auslaenderanteil-wohnbevoelkerung-2020
lang: sq
source_version: 2
question: Sa ishte përafërsisht në vitin 2020 pesha e të huajve në popullsinë e përhershme rezidente të
  Zvicrës?
options:
  a: rreth tre të pestat
  b: rreth një e dhjeta
  c: rreth gjysma
  d: rreth një e katërta
explanation: Në vitin 2020, rreth një e katërta e popullsisë së përhershme rezidente nuk kishte pasaportë
  zvicerane. Në fund të vitit 2020 ishin rreth 2,2 milionë persona nga 8,7 milionë gjithsej, pra rreth
  25 përqind. Krahasuar me vendet e tjera në Evropë, kjo pjesë është e lartë.
