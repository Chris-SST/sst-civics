id: quartierverein-aufgabe-im-quartier
lang: sq
source_version: 1
question: Cila është një detyrë tipike e një shoqate lagjeje (Quartierverein) në një komunë (Gemeinde)
  ose qytet të kantonit të Zürichut?
options:
  a: Ajo përfaqëson shqetësimet e banorëve të lagjes përpara autoriteteve dhe promovon bashkëjetesën.
  b: Ajo mban regjistrin e banorëve për lagjen.
  c: Ajo mbledh taksa nga banorët e lagjes.
  d: Ajo miraton kërkesat për leje ndërtimi në lagje.
explanation: Një shoqatë lagjeje është një bashkim vullnetar i banorëve. Ajo paraqet shqetësimet e lagjes
  te autoritetet dhe organizon ngjarje që forcojnë bashkëjetesën. Detyrat sovrane, si taksat, lejet e
  ndërtimit ose regjistri i banorëve, i përkasin komunës.
