    question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Gemeinde oder Stadt des
      Kantons Zürich?
    options_de:
      a: Er vertritt die Anliegen der Quartierbewohner gegenüber den Behörden und fördert das Zusammenleben.
      b: Er führt das Einwohnerregister für das Quartier.
      c: Er erhebt Steuern bei den Bewohnern des Quartiers.
      d: Er genehmigt die Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Bewohnern. Er bringt die
      Anliegen des Quartiers bei den Behörden vor und organisiert Veranstaltungen, die das Zusammenleben
      stärken. Hoheitliche Aufgaben wie Steuern, Baubewilligungen oder das Einwohnerregister gehören zur
      Gemeinde.
