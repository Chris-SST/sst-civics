    question_de: Wer lässt im Kanton Zürich ein Motorfahrzeug zum Strassenverkehr zu und gibt dafür die
      Kontrollschilder ab?
    options_de:
      a: Die Kantonspolizei bei einer Verkehrskontrolle
      b: Das kantonale Strassenverkehrsamt
      c: Touring Club Schweiz
      d: Die Gemeindeverwaltung (Gemeinde) am Wohnort
    explanation_de: Die Zulassung von Motorfahrzeugen zum Verkehr ist Aufgabe des kantonalen Strassenverkehrsamts.
