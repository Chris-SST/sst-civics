id: zulassung-motorfahrzeuge-kantonales-strassenverkehrsamt
lang: sq
source_version: 1
question: Kush e lejon në kantonin e Cyrihut një automjet me motor për qarkullim rrugor dhe për këtë qëllim
  jep targat e kontrollit?
options:
  a: Policia kantonale gjatë një kontrolli të qarkullimit
  b: Zyra kantonale e qarkullimit rrugor
  c: Touring Club Schweiz
  d: Administrata e komunës (Gemeinde) në vendbanim
explanation: Lejimi i automjeteve me motor për qarkullim është detyrë e zyrës kantonale të qarkullimit
  rrugor. Ajo jep edhe targat e kontrollit. Komuna dhe policia nuk janë përgjegjëse për këtë.
