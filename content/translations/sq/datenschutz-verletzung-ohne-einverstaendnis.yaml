id: datenschutz-verletzung-ohne-einverstaendnis
lang: sq
source_version: 1
question: Në cilin rast cenohet mbrojtja e të dhënave?
options:
  a: Të dhëna private për një person bëhen publike pa pëlqimin e tij dhe pa bazë ligjore.
  b: Një autoritet ruan të dhëna ashtu siç e kërkon një ligj.
  c: Një person jep vullnetarisht adresën e vet.
  d: Një person lejon shprehimisht publikimin e fotografisë së vet.
explanation: Mbrojtja e jetës private përfshin mbrojtjen nga keqpërdorimi i të dhënave personale. Informacionet
  private mund të bëhen publike vetëm me pëlqimin e personit ose në bazë të një ligji. Nëse mungojnë të
  dyja, ka një cenim.
