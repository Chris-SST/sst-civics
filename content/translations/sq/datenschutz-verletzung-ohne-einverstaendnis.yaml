    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Daten über eine Person werden ohne ihre Zustimmung und ohne gesetzliche Grundlage veröffentlicht.
      b: Eine Behörde speichert Daten so, wie es ein Gesetz verlangt.
      c: Eine Person gibt ihre Adresse freiwillig bekannt.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz des Privatlebens umfasst den Schutz vor dem Missbrauch persönlicher Daten.
      Private Informationen dürfen nur mit der Zustimmung der Person oder auf der Grundlage eines Gesetzes
      veröffentlicht werden. Fehlt beides, liegt eine Verletzung vor.
