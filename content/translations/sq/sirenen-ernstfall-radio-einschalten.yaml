id: sirenen-ernstfall-radio-einschalten
lang: sq
source_version: 2
question: Në rast emergjence dëgjohet «Alarmi i përgjithshëm» i sirenave (një ulërimë që ngrihet dhe zbret).
  Çfarë duhet të bëni?
options:
  a: Të largoheni menjëherë nga shtëpia
  b: Të telefononi zjarrfikësit
  c: Të dëgjoni radion dhe të ndiqni udhëzimet e autoriteteve
  d: Të largoheni me makinë
explanation: Gjatë Alarmit të përgjithshëm, autoritetet informojnë përmes radios se çfarë duhet bërë.
  Informacione ka edhe në aplikacionin Alertswiss. Duhet të ndiqen udhëzimet dhe numrat e urgjencës të
  mos thirren pa nevojë, që të mbeten të lirë për emergjenca të vërteta.
