    question_de: Wie viele Unterschriften sind nötig, damit ein fakultatives Referendum gegen ein Gesetz
      des Bundes zustande kommt, und innerhalb welcher Frist?
    options_de:
      a: 50 000 Unterschriften innerhalb von 18 Monaten
      b: 50 000 Unterschriften innerhalb von 100 Tagen
      c: 100 000 Unterschriften innerhalb von 30 Tagen
      d: 100 000 Unterschriften innerhalb von 100 Tagen
    explanation_de: Für ein fakultatives Referendum sind 50 000 gültige Unterschriften innerhalb von 100
      Tagen nach der Veröffentlichung des Gesetzes im Bundesblatt nötig. Wenn das Referendum zustande
      kommt, stimmt das Volk über das Gesetz ab.
