id: fakultatives-referendum-unterschriften-frist
lang: sq
source_version: 1
question: Sa nënshkrime nevojiten që një referendum fakultativ kundër një ligji të Konfederatës të realizohet,
  dhe brenda cilit afat?
options:
  a: 50 000 nënshkrime brenda 18 muajve
  b: 50 000 nënshkrime brenda 100 ditëve
  c: 100 000 nënshkrime brenda 30 ditëve
  d: 100 000 nënshkrime brenda 100 ditëve
explanation: Për një referendum fakultativ nevojiten 50 000 nënshkrime të vlefshme brenda 100 ditëve pas
  publikimit të ligjit në Fletën Federale (Bundesblatt). Nëse referendumi realizohet, populli voton për
  ligjin.
