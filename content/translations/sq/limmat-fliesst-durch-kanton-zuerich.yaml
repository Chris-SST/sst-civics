    question_de: Welcher Fluss fliesst aus dem Zürichsee durch die Stadt Zürich und weiter durch das Gebiet
      des Kantons?
    options_de:
      a: Thur
      b: Birs
      c: Reuss
      d: Limmat
    explanation_de: Die Limmat beginnt am Abfluss des Zürichsees und fliesst durch die Stadt Zürich und
      das Limmattal. Danach verlässt sie das Gebiet des Kantons in Richtung Aargau. Reuss, Thur und Birs
      fliessen nicht aus dem Zürichsee.
