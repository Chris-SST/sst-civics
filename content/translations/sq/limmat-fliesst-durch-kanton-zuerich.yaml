id: limmat-fliesst-durch-kanton-zuerich
lang: sq
source_version: 1
question: Cili lumë rrjedh nga Liqeni i Cyrihut përmes qytetit të Cyrihut dhe më tej përmes territorit
  të kantonit?
options:
  a: Thur
  b: Birs
  c: Reuss
  d: Limmat
explanation: Limmat fillon te shkarkimi i Liqenit të Cyrihut dhe kalon përmes qytetit të Cyrihut dhe luginës
  së Limmatit (Limmattal). Pas kësaj e lë territorin e kantonit në drejtim të Aargau-t. Reuss, Thur dhe
  Birs nuk rrjedhin nga Liqeni i Cyrihut.
