    source_version: 1
    question_de: Über eine Volksinitiative und einen direkten Gegenentwurf der Bundesversammlung wird
      gleichzeitig abgestimmt. Wozu dient hier die Stichfrage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Initiative gültig ist
      c: Sie entscheidet, welcher Vorschlag gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Kantone gemeinsam abstimmen dürfen
    explanation_de: Die stimmberechtigten Bürgerinnen und Bürger können sowohl der Initiative als auch
      dem Gegenentwurf zustimmen. Mit der Stichfrage geben sie an, welcher der beiden Vorschläge in Kraft
      treten soll, wenn beide angenommen werden. So geht keine Stimme für eine Änderung verloren.
