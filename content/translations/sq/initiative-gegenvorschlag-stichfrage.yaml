id: initiative-gegenvorschlag-stichfrage
lang: sq
source_version: 1
question: Për një nismë popullore (Volksinitiative) dhe një kundërpropozim të drejtpërdrejtë të Kuvendit
  Federal (Bundesversammlung) votohet në të njëjtën kohë. Për çfarë shërben këtu pyetja vendimtare?
options:
  a: Ajo vendos nëse votimi duhet përsëritur
  b: Ajo vendos nëse nisma është e vlefshme
  c: Ajo vendos se cili propozim vlen, nëse pranohen të dyja
  d: Ajo vendos nëse kantonet lejohen të votojnë bashkë
explanation: Qytetarët me të drejtë vote mund t'i miratojnë si nismën, ashtu edhe kundërpropozimin. Me
  pyetjen vendimtare ata tregojnë se cili nga dy propozimet duhet të hyjë në fuqi, nëse pranohen të dyja.
  Kështu nuk humbet asnjë votë për një ndryshim.
