    question_de: Gegen welche Risiken schützt unter anderem das System der Sozialversicherungen der Schweiz?
    options_de:
      a: Gegen Verluste bei privaten Finanzanlagen
      b: Gegen Schäden am Auto und am Hausrat, die durch Diebstahl verursacht wurden
      c: Gegen die Folgen von Krankheit und Unfall
      d: Gegen den Anstieg der Mietpreise
    explanation_de: Die Sozialversicherungen schützen die Menschen vor den finanziellen Folgen wichtiger
      Lebensrisiken. Dazu gehören Krankheit und Unfall. Die Krankenversicherung und die Unfallversicherung
      sind Beispiele.
