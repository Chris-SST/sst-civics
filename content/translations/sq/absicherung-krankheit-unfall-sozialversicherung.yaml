id: absicherung-krankheit-unfall-sozialversicherung
lang: sq
source_version: 1
question: Kundër cilave rreziqe mbron, ndër të tjera, sistemi i sigurimeve shoqërore të Zvicrës?
options:
  a: Kundër humbjeve në investimet private financiare
  b: Kundër dëmeve në makinë dhe në plaçkat e shtëpisë shkaktuar nga vjedhja
  c: Kundër pasojave të sëmundjes dhe të aksidentit
  d: Kundër rritjes së çmimeve të qirave
explanation: Sigurimet shoqërore i mbrojnë njerëzit nga pasojat financiare të rreziqeve të rëndësishme
  të jetës. Mes tyre përfshihen sëmundja dhe aksidenti. Sigurimi shëndetësor dhe sigurimi kundër aksidenteve
  janë shembuj.
