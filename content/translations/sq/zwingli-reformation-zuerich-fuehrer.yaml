question: Kush udhëhoqi Reformën në Cyrih në vitet 1520?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martin Luther
  d: Johannes Calvin
explanation: Ulrich Zwingli ishte prift famullie (Leutpriester) në Grossmünster dhe e prezantoi Reformën
  në Cyrih. Këshilli i qytetit e mbështeti në këtë. Calvini veproi në Gjenevë, Luteri në Gjermani.
