    question_de: In welchem Fall müssen die Mieter dem Vermieter den Zutritt zur Wohnung erlauben?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein berechtigter Grund besteht
      c: Nur wenn der Vermieter es verlangt, ohne Begründung
      d: Jederzeit und ohne vorherige Ankündigung
    explanation_de: Die Mieter müssen den Zutritt erlauben, wenn dafür ein berechtigter Grund besteht,
      zum Beispiel eine dringende Reparatur. Der Vermieter muss den Besuch rechtzeitig ankündigen und
      Rücksicht auf die Mieter nehmen. Der Zutritt ohne Grund ist nicht erlaubt.
