id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: sq
source_version: 1
question: Në cilin rast duhet që qiramarrësit t'i lejojnë qiradhënësit hyrjen në banesë?
options:
  a: Asnjëherë, banesa është gjithmonë e mbrojtur
  b: Kur ekziston një arsye e justifikuar
  c: Vetëm kur qiradhënësi e kërkon, pa arsyetim
  d: Në çdo kohë dhe pa njoftim paraprak
explanation: Qiramarrësit duhet ta lejojnë hyrjen kur për këtë ekziston një arsye e justifikuar, për shembull
  një riparim urgjent. Qiradhënësi duhet ta njoftojë vizitën me kohë dhe të tregojë konsideratë ndaj qiramarrësve.
  Hyrja pa arsye nuk lejohet.
