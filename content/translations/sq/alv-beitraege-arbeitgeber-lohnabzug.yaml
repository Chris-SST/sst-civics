id: alv-beitraege-arbeitgeber-lohnabzug
lang: sq
source_version: 1
question: Kush i zbret nga paga kontributet për sigurimin kundër papunësisë?
options:
  a: Komuna (Gemeinde) e vendbanimit
  b: Punëmarrësi ose punëmarrësja vetë përmes pagesës
  c: Qendra rajonale e ndërmjetësimit të punës
  d: Punëdhënësi
explanation: Punëdhënësi i zbret kontributet automatikisht nga paga dhe i transferon ato te organi kompetent.
  Punëmarrësit nuk duhet të merren vetë me këtë. Edhe punëdhënësi paguan një pjesë të kontributeve.
