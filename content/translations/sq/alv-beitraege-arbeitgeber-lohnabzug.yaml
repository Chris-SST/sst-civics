    question_de: Wer zieht die Beiträge für die Arbeitslosenversicherung vom Lohn ab?
    options_de:
      a: Die Wohngemeinde
      b: Der Arbeitnehmer oder die Arbeitnehmerin selbst durch Einzahlung
      c: Das regionale Arbeitsvermittlungszentrum
      d: Der Arbeitgeber
    explanation_de: Der Arbeitgeber zieht die Beiträge automatisch vom Lohn ab und überweist sie an die
      zuständige Stelle. Die Arbeitnehmenden müssen sich nicht selbst darum kümmern. Auch der Arbeitgeber
      bezahlt einen Teil der Beiträge.
