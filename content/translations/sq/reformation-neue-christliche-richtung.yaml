id: reformation-neue-christliche-richtung
lang: sq
source_version: 1
question: Cili drejtim i krishterimit lindi nga Reformacioni në shekullin e 16-të?
options:
  a: Krishterimi koptik
  b: Krishterimi romako-katolik
  c: Krishterimi ortodoks
  d: Krishterimi protestant
explanation: Reformacioni ishte një lëvizje ripërtëritjeje brenda Kishës së Mesjetës. Prej tij lindi krishterimi
  protestant. Në Cyrih veproi në këtë kontekst Huldrych Zwingli.
