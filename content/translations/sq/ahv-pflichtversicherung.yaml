id: ahv-pflichtversicherung
lang: sq
source_version: 1
question: Cila deklaratë për sigurimin e pleqërisë dhe të të mbijetuarve (AHV) është e saktë?
options:
  a: Sigurimi i pleqërisë dhe i të mbijetuarve bën pjesë among sigurimet e detyrueshme.
  b: Sigurimi i pleqërisë dhe i të mbijetuarve është një sigurim vullnetar për persona që punojnë në mënyrë
    të pavarur.
  c: Sigurimi i pleqërisë dhe i të mbijetuarve vlen vetëm për personat me pasaportë zvicerane.
  d: Sigurimi i pleqërisë dhe i të mbijetuarve është një sigurim privat i punëdhënësve.
explanation: Sigurimi i pleqërisë dhe i të mbijetuarve është i detyrueshëm. Kushdo që banon ose punon
  në Zvicër është në parim i siguruar dhe duhet të paguajë kontribute.
