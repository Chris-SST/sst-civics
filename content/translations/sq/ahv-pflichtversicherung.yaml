    question_de: Welche Aussage zur Alters- und Hinterlassenenversicherung (AHV) ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung gehört zu den obligatorischen Versicherungen.
      b: Die Alters- und Hinterlassenenversicherung ist eine freiwillige Versicherung für selbstständig
        erwerbende Personen.
      c: Die Alters- und Hinterlassenenversicherung gilt nur für Personen mit Schweizer Pass.
      d: Die Alters- und Hinterlassenenversicherung ist eine private Versicherung der Arbeitgeber.
