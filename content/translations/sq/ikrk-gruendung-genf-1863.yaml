id: ikrk-gruendung-genf-1863
lang: sq
source_version: 1
question: Cila organizatë e njohur humanitare u themelua në vitin 1863 në Gjenevë?
options:
  a: Kombet e Bashkuara (OKB)
  b: Organizata Botërore e Shëndetësisë (OBSH)
  c: Programi Botëror i Ushqimit (WFP)
  d: Komiteti Ndërkombëtar i Kryqit të Kuq (ICRC)
explanation: ICRC u krijua në vitin 1863 në Gjenevë, ndër të tjera me nismën e Henry Dunant. Ai përfaqëson
  traditën humanitare të Zvicrës. Organizatat e tjera u themeluan më vonë.
