id: region-basel-pharmaunternehmen-bekannt
lang: sq
source_version: 1
question: Cila rajon i Zvicrës është i njohur për kompanitë e mëdha farmaceutike që ndodhen aty?
options:
  a: Engadina
  b: Rajoni i Bazelit
  c: Tiçino
  d: Vallisi
explanation: Në rajonin e Bazelit kanë selinë qendrore disa kompani farmaceutike që veprojnë në mbarë
  botën. Industria farmaceutike është aty një degë e rëndësishme ekonomike dhe ka rëndësi për eksportin.
