id: bahnunternehmen-der-schweiz-erkennen
lang: sq
source_version: 2
question: Cilat nga shkurtesat e mëposhtme përfaqësojnë të gjitha ndërmarrje hekurudhore të Zvicrës?
options:
  a: SOB, SEM, BLS dhe SZU
  b: SBB, BLS, SOB dhe SZU
  c: SBB, SRF, SOB dhe SUVA
  d: BLS, SZU, SNB dhe SBB
explanation: SBB, BLS, SOB dhe SZU janë ndërmarrje hekurudhore që operojnë trena në Zvicër. SBB është
  ndërmarrja më e madhe, të tjerat janë hekurudha më të vogla, që shpesh qarkullojnë në nivel rajonal.
  Shkurtesat e tjera përfaqësojnë organizata si Banka Kombëtare (SNB), Sekretariati i Shtetit për Migracionin
  (SEM) ose sigurimi kundër aksidenteve (SUVA).
