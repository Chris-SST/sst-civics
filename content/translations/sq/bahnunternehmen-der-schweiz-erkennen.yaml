    question_de: Welche der folgenden Abkürzungen stehen alle für Eisenbahnunternehmen der Schweiz?
    options_de:
      a: SOB, SEM, BLS und SZU
      b: SBB, BLS, SOB und SZU
      c: SBB, SRF, SOB und SUVA
      d: BLS, SZU, SNB und SBB
    explanation_de: SBB, BLS, SOB und SZU sind Eisenbahnunternehmen, die Züge in der Schweiz betreiben.
      Die SBB ist das grösste Unternehmen, die anderen sind kleinere Bahnen, die oft auf regionaler Ebene
      verkehren. Die anderen Abkürzungen stehen für Organisationen wie die Nationalbank (SNB), das Staatssekretariat
      für Migration (SEM) oder die Unfallversicherung (SUVA).
