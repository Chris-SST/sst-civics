question: Cilat emra u përkasin artistëve të vlerësuar në mbarë botën me lidhje me Zvicrën?
options:
  a: Vincent van Gogh, Paul Cézanne dhe Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp dhe Pipilotti Rist
  c: Claude Monet, Edgar Degas dhe Auguste Renoir
  d: Pablo Picasso, Frida Kahlo dhe Salvador Dalí
explanation: Niki de Saint Phalle, Sophie Taeuber-Arp dhe Pipilotti Rist janë artiste të njohura ndërkombëtarisht,
  që lidhen me Zvicrën. Grupet e tjera përmendin artistë të njohur pa këtë lidhje me Zvicrën.
