question: Cilën sport e praktikojnë veçanërisht shumë njerëz në Zvicër gjatë dimrit?
options:
  a: Vaterpolo
  b: Skijimi
  c: Kanotazhi
  d: Volejbolli në plazh
explanation: Skijimi është shumë i dashur në Zvicër gjatë dimrit dhe shumë njerëz skijojnë në male. Shpesh
  edhe fëmijët mësojnë të skijojnë që herët, për shembull në një kamp skijimi të shkollës. Vaterpolo,
  kanotazhi dhe volejbolli në plazh, përkundrazi, janë sporte që praktikohen kryesisht në verë ose në
  ujë.
