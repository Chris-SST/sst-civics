id: landesschutz-innen-aussen-bund
lang: sq
source_version: 1
question: Cila detyrë bën pjesë në detyrat qendrore të Konfederatës?
options:
  a: Organizimi i shkollave vendore
  b: Mbrojtja e vendit nga brenda dhe nga jashtë
  c: Mirëmbajtja dhe funksionimi i rrugëve të komunës (Gemeinde)
  d: Administrimi i regjistrave të banorëve të komunave
explanation: Konfederata kujdeset për sigurinë e vendit nga jashtë, për shembull me ushtrinë, si dhe për
  sigurinë e brendshme. Shkollat, rrugët e komunës dhe regjistrat e banorëve, përkundrazi, janë kryesisht
  çështje e kantoneve dhe e komunave.
