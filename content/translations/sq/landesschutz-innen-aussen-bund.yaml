    question_de: Welche Aufgabe gehört zu den zentralen Aufgaben des Bundes?
    options_de:
      a: Organisation der örtlichen Schulen
      b: Verteidigung des Landes nach innen und nach aussen
      c: Unterhalt und Betrieb der Strassen der Gemeinde
      d: Verwaltung der Einwohnerregister der Gemeinden
    explanation_de: Der Bund sorgt für die Sicherheit des Landes nach aussen, zum Beispiel mit der Armee,
      sowie für die innere Sicherheit. Die Schulen, die Gemeindestrassen und die Einwohnerregister hingegen
      sind hauptsächlich Sache der Kantone und der Gemeinden.
