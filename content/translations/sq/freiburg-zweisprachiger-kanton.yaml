question: Cilat gjuhë flasin në kantonin dygjuhësh të Fribourgut?
options:
  a: Frëngjisht dhe retoromanisht
  b: Frëngjisht dhe italisht
  c: Frëngjisht dhe gjermanisht
  d: Gjermanisht dhe italisht
explanation: Fribourgu është një kanton dygjuhësh, ku flitet frëngjisht dhe gjermanisht. Ai ndodhet në
  kufirin midis Zvicrës gjermanishtfolëse dhe Zvicrës frëngjishtfolëse.
