    question_de: Was bedeutet die Gleichberechtigung von Frau und Mann im Grundsatz?
    options_de:
      a: Frauen und Männer haben im Grundsatz die gleichen Rechte.
      b: Frauen und Männer haben in jedem Lebensbereich die gleichen Pflichten, aber unterschiedliche
        Rechte.
      c: Frauen und Männer verdienen in jedem Beruf genau gleich viel wie einander.
      d: Frauen und Männer müssen alle Aufgaben in der Familie gleichmässig untereinander aufteilen.
    explanation_de: Die Gleichberechtigung bedeutet, dass beide Geschlechter im Grundsatz die gleichen
      Rechte haben. Sie ist in der Bundesverfassung festgelegt. Der Grundsatz sagt nichts darüber aus,
      wie die Familien ihre Aufgaben im Einzelnen aufteilen.
