id: gleichberechtigung-frau-mann-bedeutung
lang: sq
source_version: 1
question: Çfarë do të thotë, në parim, barazia në të drejta mes gruas dhe burrit?
options:
  a: Gratë dhe burrat kanë, në parim, të njëjtat të drejta.
  b: Gratë dhe burrat kanë në çdo fushë të jetës të njëjtat detyrime, por të drejta të ndryshme.
  c: Gratë dhe burrat fitojnë saktësisht aq sa njëri-tjetri në çdo profesion.
  d: Gratë dhe burrat duhet t'i ndajnë barabar të gjitha detyrat në familje.
explanation: Barazia në të drejta do të thotë që të dy gjinitë, në parim, kanë të njëjtat të drejta. Ajo
  është e përcaktuar në Kushtetutën Federale. Parimi nuk thotë asgjë se si i ndajnë familjet detyrat e
  tyre në veçanti.
