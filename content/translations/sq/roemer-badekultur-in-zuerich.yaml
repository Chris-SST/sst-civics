id: roemer-badekultur-in-zuerich
lang: sq
source_version: 1
question: Çfarë risie sollën romakët në Cyrih?
options:
  a: Shtypjen e librave
  b: Esnafet (Zünfte)
  c: Kulturën e banjave
  d: Reformacionin
explanation: Romakët sollën në Cyrih kulturën e banjave, pra banjat publike sipas modelit romak. Esnafet
  (Zünfte), shtypja e librave dhe reformacioni i përkasin vetëm Mesjetës dhe epokës së hershme moderne.
