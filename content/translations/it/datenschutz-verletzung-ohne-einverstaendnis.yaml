    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Informationen über eine Person werden ohne ihre Einwilligung und ohne gesetzliche Grundlage
        bekannt gemacht.
      b: Eine Behörde bewahrt Daten auf, wie es ein Gesetz verlangt.
      c: Eine Person gibt freiwillig ihre eigene Adresse an.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihrer Fotografie.
    explanation_de: Der Schutz der Privatsphäre umfasst den Schutz vor dem Missbrauch persönlicher Daten.
      Private Informationen dürfen nur mit der Einwilligung der Person oder aufgrund eines Gesetzes bekannt
      gemacht werden. Fehlen beide, liegt eine Verletzung vor.
