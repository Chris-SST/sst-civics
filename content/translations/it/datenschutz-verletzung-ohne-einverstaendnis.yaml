id: datenschutz-verletzung-ohne-einverstaendnis
lang: it
source_version: 1
question: In quale caso viene violata la protezione dei dati?
options:
  a: Informazioni private su una persona vengono rese note senza il suo consenso e senza una base legale.
  b: Un'autorità conserva dati come richiesto da una legge.
  c: Una persona fornisce volontariamente il proprio indirizzo.
  d: Una persona autorizza espressamente la pubblicazione della sua fotografia.
explanation: La protezione della sfera privata comprende la protezione contro l'abuso dei dati personali.
  Le informazioni private possono essere rese note solo con il consenso della persona o in base a una
  legge. Se mancano entrambi, si è in presenza di una violazione.
