    question_de: Eine Frau zieht in die Schweiz und möchte ihre Religion selbst wählen. Sie erwägt auch,
      keiner Religion anzugehören. Was garantiert ihr in diesem Zusammenhang die Bundesverfassung?
    options_de:
      a: Sie kann nur einer im Kanton öffentlich-rechtlich anerkannten Religion angehören.
      b: Sie kann ihre Religion frei wählen, sie ausüben oder keiner Religion angehören.
      c: Sie kann ihre Religion privat wählen, kann sie aber nirgendwo gemeinsam mit anderen ausüben.
      d: Sie muss bei der Gemeinde eine anerkannte Religion wählen.
    explanation_de: Die Glaubens- und Gewissensfreiheit ist durch Artikel 15 der Bundesverfassung garantiert.
      Jede Person kann ihre Religion frei wählen, sie allein oder zusammen mit anderen ausüben oder keiner
      Religion angehören. Niemand kann gezwungen werden, einer Religionsgemeinschaft anzugehören.
