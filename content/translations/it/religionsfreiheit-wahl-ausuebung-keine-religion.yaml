id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: it
source_version: 1
question: Una donna si trasferisce in Svizzera e desidera scegliere da sé la propria religione. Valuta
  anche di non appartenere ad alcuna religione. Che cosa le garantisce in questo contesto la Costituzione
  federale?
options:
  a: Può appartenere soltanto a una religione riconosciuta di diritto pubblico nel Cantone.
  b: Può scegliere liberamente la propria religione, praticarla oppure non appartenere ad alcuna religione.
  c: Può scegliere la propria religione in privato, ma non può praticarla in comune con altri in nessun
    luogo.
  d: Deve scegliere presso il Comune (Gemeinde) una religione riconosciuta.
explanation: La libertà di credo e di coscienza è garantita dall'articolo 15 della Costituzione federale.
  Ogni persona può scegliere liberamente la propria religione, praticarla da sola o insieme ad altri oppure
  non appartenere ad alcuna religione. Nessuno può essere costretto a far parte di una comunità religiosa.
