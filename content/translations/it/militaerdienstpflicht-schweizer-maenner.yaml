id: militaerdienstpflicht-schweizer-maenner
lang: it
source_version: 1
question: Su chi ricade in Svizzera l'obbligo di prestare servizio militare o servizio sostitutivo?
options:
  a: Su tutti gli abitanti a partire dai 18 anni
  b: Sugli uomini con cittadinanza (Bürgerrecht) svizzera
  c: Su tutti gli uomini che vivono in Svizzera
  d: Solo sulle donne con cittadinanza svizzera
explanation: Secondo la Costituzione federale, ogni uomo svizzero ha l'obbligo di prestare servizio militare.
  Chi non può conciliarlo con la propria coscienza presta un servizio sostitutivo civile. Gli stranieri
  non sono soggetti all'obbligo di servire.
