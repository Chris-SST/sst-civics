    question_de: Wen trifft in der Schweiz die Pflicht, Militärdienst oder Ersatzdienst zu leisten?
    options_de:
      a: Alle Einwohner ab 18 Jahren
      b: Männer mit schweizerischem Bürgerrecht
      c: Alle Männer, die in der Schweiz leben
      d: Nur Frauen mit schweizerischem Bürgerrecht
    explanation_de: Gemäss der Bundesverfassung ist jeder Schweizer Mann verpflichtet, Militärdienst zu
      leisten. Wer dies nicht mit seinem Gewissen vereinbaren kann, leistet einen zivilen Ersatzdienst.
      Ausländer unterliegen der Dienstpflicht nicht.
