id: mehrehe-in-schweiz-verboten
lang: it
source_version: 1
question: Che cosa vale in Svizzera per il matrimonio con più partner contemporaneamente?
options:
  a: È consentito se tutti sono d'accordo
  b: È vietato
  c: È consentito se ha una motivazione religiosa
  d: È consentito solo alle persone con passaporto straniero
explanation: La Svizzera conosce soltanto il matrimonio monogamico. Chi è già sposato o vive in un'unione
  domestica registrata non può contrarre un altro matrimonio. Ciò vale indipendentemente dalla religione
  o dalla provenienza.
