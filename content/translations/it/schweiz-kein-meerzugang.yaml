    question_de: Welche Aussage über die geografische Lage der Schweiz ist richtig?
    options_de:
      a: Die Schweiz hat keinen direkten Zugang zum Meer.
      b: Die Schweiz grenzt im Westen an den Atlantischen Ozean.
      c: Die Schweiz grenzt im Süden an das Mittelmeer.
      d: Die Schweiz grenzt im Norden an die Nordsee.
    explanation_de: 'Die Schweiz ist ein Land ohne Zugang zum Meer: Sie ist vollständig von anderen Ländern
      umgeben und hat keine Meeresküsten. Auf dem Rhein fahren die Schiffe zwar von Basel bis zur Nordsee,
      aber kein Meer grenzt direkt an die Schweiz.'
