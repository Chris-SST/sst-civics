id: schweiz-kein-meerzugang
lang: it
source_version: 2
question: Quale affermazione sulla posizione geografica della Svizzera è corretta?
options:
  a: La Svizzera non ha un accesso diretto al mare.
  b: La Svizzera confina a ovest con l'Oceano Atlantico.
  c: La Svizzera confina a sud con il Mar Mediterraneo.
  d: La Svizzera confina a nord con il Mare del Nord.
explanation: 'La Svizzera è un Paese senza sbocco sul mare: è interamente circondata da altri Paesi e
  non ha coste marittime. Sul Reno le navi viaggiano sì da Basilea fino al Mare del Nord, ma nessun mare
  confina direttamente con la Svizzera.'
