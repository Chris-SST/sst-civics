    question_de: Was verkörpert die legendäre Figur Wilhelm Tell, die aus der Zentralschweiz stammt?
    options_de:
      a: Den Widerstand gegen fremde Herrscher
      b: Die Neutralität der Schweiz im Krieg
      c: Die Einführung der Reformation
      d: Die Gründung der ersten Schweizer Bank
    explanation_de: Die Legende erzählt von einem Mann, der sich der Unterdrückung durch die fremden Vögte
      widersetzt. Deshalb gilt Wilhelm Tell als Symbol der Freiheit. Es ist nicht bewiesen, dass er wirklich
      gelebt hat.
