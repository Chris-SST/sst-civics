id: wilhelm-tell-sagengestalt-widerstand
lang: it
source_version: 1
question: Che cosa rappresenta il personaggio leggendario Guglielmo Tell, originario della Svizzera centrale?
options:
  a: La resistenza contro i dominatori stranieri
  b: La neutralità della Svizzera in guerra
  c: L'introduzione della Riforma
  d: La fondazione della prima banca svizzera
explanation: La leggenda racconta di un uomo che si oppone all'oppressione da parte dei balivi stranieri.
  Per questo Guglielmo Tell è considerato un simbolo di libertà. Non è provato che sia realmente vissuto.
