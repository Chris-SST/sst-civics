id: pfaeffikersee-im-kanton-zuerich
lang: it
source_version: 1
question: In quale Cantone si trova il Pfäffikersee?
options:
  a: Cantone di Turgovia
  b: Cantone di San Gallo
  c: Cantone di Zurigo
  d: Cantone di Zugo
explanation: Il Pfäffikersee si trova nell'Oberland zurighese e appartiene al territorio del Cantone di
  Zurigo. È uno dei laghi più grandi del Cantone. Gli altri Cantoni menzionati in parte confinano con
  Zurigo, ma non contengono il lago.
