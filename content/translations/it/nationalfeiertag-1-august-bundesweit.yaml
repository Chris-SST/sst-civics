id: nationalfeiertag-1-august-bundesweit
lang: it
source_version: 1
question: Quale giorno è per legge un giorno festivo non lavorativo in tutta la Svizzera?
options:
  a: Il 2 gennaio (Berchtoldstag)
  b: Il lunedì di Carnevale
  c: Il Venerdì Santo
  d: Il 1° agosto, la Festa nazionale
explanation: Il 1° agosto è la Festa nazionale ed è considerato giorno festivo in tutto il Paese. La maggior
  parte degli altri giorni festivi, come il Venerdì Santo o il Berchtoldstag, è disciplinata dai Cantoni
  stessi e non è ovunque un giorno libero.
