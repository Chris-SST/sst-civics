    question_de: Welcher Tag ist gesetzlich in der ganzen Schweiz ein arbeitsfreier Feiertag?
    options_de:
      a: Der 2. Januar (Berchtoldstag)
      b: Der Fasnachtsmontag
      c: Der Karfreitag
      d: Der 1. August, der Nationalfeiertag
    explanation_de: Der 1. August ist der Nationalfeiertag und gilt im ganzen Land als Feiertag. Die meisten
      anderen Feiertage, wie der Karfreitag oder der Berchtoldstag, werden von den Kantonen selbst geregelt
      und sind nicht überall ein freier Tag.
