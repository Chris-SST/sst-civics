id: helvetische-republik-zentralstaat-1798
lang: it
source_version: 1
question: Che cosa accadde nel 1798 alla Svizzera sotto l'influenza di Napoleone Bonaparte?
options:
  a: Diventò una parte del Sacro Romano Impero germanico.
  b: Diventò una monarchia con un proprio re.
  c: Fu divisa in modo permanente in due Stati.
  d: Diventò temporaneamente uno Stato centralizzato, la Repubblica Elvetica.
explanation: Nel 1798, dopo l'invasione delle truppe francesi, nacque la Repubblica Elvetica. Era uno
  Stato unitario governato in modo centralizzato e sostituì temporaneamente la vecchia Confederazione.
  I Cantoni avevano appena diritti propri.
