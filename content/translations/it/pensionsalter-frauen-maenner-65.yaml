id: pensionsalter-frauen-maenner-65
lang: it
source_version: 3
question: Quale età pensionabile (oggi chiamata «età di riferimento») vale nell'assicurazione vecchiaia
  e superstiti (AHV) a partire dal 2028 per le donne e per gli uomini?
options:
  a: Donne 64 anni, uomini 65 anni
  b: Donne e uomini 65 anni
  c: Donne e uomini 63 anni
  d: Donne e uomini 67 anni
explanation: Dopo la riforma AVS 21, l'età pensionabile si chiama ufficialmente «età di riferimento».
  Dal 2025 per le donne aumenta ogni anno di tre mesi, fino a raggiungere i 65 anni. Dal 2028 donne e
  uomini hanno la stessa età di riferimento di 65 anni.
