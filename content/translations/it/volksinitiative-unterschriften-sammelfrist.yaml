id: volksinitiative-unterschriften-sammelfrist
lang: it
source_version: 1
question: Di quante firme ha bisogno un'iniziativa popolare (Volksinitiative) federale e per quanto tempo
  si può raccogliere le firme?
options:
  a: 100 000 firme in 100 giorni
  b: 50 000 firme in 100 giorni
  c: 50 000 firme in 18 mesi
  d: 100 000 firme in 18 mesi
explanation: Un'iniziativa popolare federale necessita di 100 000 firme valide entro 18 mesi. Il referendum
  facoltativo, invece, necessita di 50 000 firme in 100 giorni.
