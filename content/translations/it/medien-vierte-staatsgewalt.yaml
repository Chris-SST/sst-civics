id: medien-vierte-staatsgewalt
lang: it
source_version: 1
question: I media vengono spesso designati con un'espressione particolare che descrive il loro ruolo nello
  Stato. Di quale espressione si tratta?
options:
  a: Secondo potere dello Stato
  b: Potere supremo dello Stato
  c: Primo potere dello Stato
  d: Quarto potere dello Stato
explanation: I tre poteri dello Stato sono il legislativo, l'esecutivo e il giudiziario. I media non ne
  fanno parte, ma controllano la politica e informano la popolazione. Per questo vengono spesso chiamati
  il quarto potere dello Stato.
