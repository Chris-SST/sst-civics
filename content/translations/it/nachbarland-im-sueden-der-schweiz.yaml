id: nachbarland-im-sueden-der-schweiz
lang: it
source_version: 1
question: Quale Paese si trova a sud della Svizzera e confina con essa?
options:
  a: Spagna
  b: Italia
  c: Slovenia
  d: Francia
explanation: L'Italia è il vicino meridionale della Svizzera. Il confine attraversa, tra l'altro, le Alpi
  e passa attraverso il Ticino e i Grigioni. La Spagna e la Slovenia non confinano con la Svizzera.
