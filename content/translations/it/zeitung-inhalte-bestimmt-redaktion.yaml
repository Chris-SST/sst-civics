id: zeitung-inhalte-bestimmt-redaktion
lang: it
source_version: 1
question: Chi decide in Svizzera quali contenuti vengono pubblicati in un giornale?
options:
  a: Il Tribunale federale (Bundesgericht)
  b: Il Comune (Gemeinde) in cui esce il giornale
  c: La redazione del giornale
  d: Il Consiglio federale (Bundesrat)
explanation: La libertà dei media protegge i giornali da ingerenze dello Stato. La redazione decide autonomamente
  che cosa pubblicare. La Costituzione federale vieta la censura.
