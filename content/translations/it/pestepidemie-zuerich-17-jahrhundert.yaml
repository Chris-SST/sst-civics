id: pestepidemie-zuerich-17-jahrhundert
lang: it
source_version: 1
question: Quale catastrofe costò la vita a quasi la metà della popolazione di Zurigo all'inizio del XVII
  secolo?
options:
  a: Un incendio della città
  b: Un'epidemia di peste
  c: Un'inondazione
  d: Una carestia
explanation: All'inizio del XVII secolo quasi la metà degli abitanti di Zurigo morì di peste. La peste
  era una malattia contagiosa che in quel periodo si diffuse più volte in Europa.
