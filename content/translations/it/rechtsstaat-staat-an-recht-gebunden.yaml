id: rechtsstaat-staat-an-recht-gebunden
lang: it
source_version: 2
question: Che cosa vale per le autorità e per il governo in uno Stato di diritto come la Svizzera?
options:
  a: Possono scegliere liberamente quali leggi rispettare.
  b: Anche loro devono attenersi al diritto in vigore.
  c: Si trovano al di sopra del diritto in vigore.
  d: Devono attenersi soltanto alle decisioni dei media.
explanation: In uno Stato di diritto non è solo la popolazione a dover rispettare il diritto, ma anche
  lo Stato stesso. Le autorità e il governo possono agire soltanto nei limiti consentiti dal diritto.
  In questo modo lo Stato di diritto protegge le persone dall'arbitrio.
