    question_de: Was gilt für die Behörden und für die Regierung in einem Rechtsstaat wie der Schweiz?
    options_de:
      a: Sie können frei wählen, welche Gesetze sie einhalten.
      b: Auch sie müssen sich an das geltende Recht halten.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen sich nur an die Entscheidungen der Medien halten.
    explanation_de: In einem Rechtsstaat muss nicht nur die Bevölkerung das Recht einhalten, sondern auch
      der Staat selbst. Die Behörden und die Regierung dürfen nur innerhalb der vom Recht erlaubten Grenzen
      handeln. Auf diese Weise schützt der Rechtsstaat die Menschen vor Willkür.
