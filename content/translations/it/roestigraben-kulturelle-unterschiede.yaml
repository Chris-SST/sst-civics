id: roestigraben-kulturelle-unterschiede
lang: it
source_version: 1
question: Che cosa si intende in Svizzera con il termine «Röstigraben»?
options:
  a: Le Alpi come linea di separazione tra nord e sud
  b: Le differenze tra città e campagna
  c: Il confine tra la Svizzera e la Germania
  d: Le differenze culturali tra la Svizzera tedesca e la Svizzera romanda
explanation: Il termine «Röstigraben» è un'espressione figurata. Descrive le differenze culturali tra
  la Svizzera tedesca e la Svizzera romanda, di lingua francese. Queste differenze si manifestano talvolta,
  per esempio, nelle votazioni.
