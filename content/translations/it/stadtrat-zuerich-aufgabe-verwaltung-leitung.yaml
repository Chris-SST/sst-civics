lang: it
source_version: 1
question: Quale compito ha il Municipio (Stadtrat) della città di Zurigo?
options:
  a: Dirige l'amministrazione fiscale cantonale in città.
  b: Emana le leggi cantonali per il territorio cittadino.
  c: Giudica le controversie tra gli abitanti.
  d: Guida l'amministrazione cittadina e stabilisce le linee direttive per l'azione della città.
explanation: Il Municipio è l'esecutivo della città di Zurigo. Dirige l'amministrazione cittadina e determina
  la direzione in cui la città si sviluppa. I tribunali giudicano e le leggi cantonali sono emanate dal
  Consiglio cantonale (Kantonsrat).
