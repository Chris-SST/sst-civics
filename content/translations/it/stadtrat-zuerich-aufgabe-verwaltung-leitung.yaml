    question_de: Welche Aufgabe hat der Stadtrat der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die kantonalen Gesetze für das Stadtgebiet.
      c: Er beurteilt die Streitigkeiten zwischen den Einwohnern.
      d: Er leitet die Stadtverwaltung und legt die Richtlinien für das Handeln der Stadt fest.
    explanation_de: Der Stadtrat ist die Exekutive der Stadt Zürich. Er leitet die Stadtverwaltung und
      bestimmt die Richtung, in die sich die Stadt entwickelt. Die Gerichte urteilen und die kantonalen
      Gesetze werden vom Kantonsrat erlassen.
