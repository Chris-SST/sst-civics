id: sbb-abkuerzung-bedeutung-bundesbahnen
lang: it
source_version: 1
question: Che cosa significa la sigla «SBB», che si vede sui treni e nelle stazioni in Svizzera?
options:
  a: Schweizer Busbetriebe (aziende svizzere di autobus)
  b: Schweizerische Bundesbahnen (ferrovie federali svizzere)
  c: Schweizerische Bahn- und Busbetriebe (aziende svizzere di ferrovie e autobus)
  d: Schweizer Bergbahnen (ferrovie di montagna svizzere)
explanation: SBB sta per Schweizerische Bundesbahnen, cioè «Ferrovie federali svizzere». L'azienda gestisce
  gran parte della rete ferroviaria svizzera e appartiene alla Confederazione. Oltre ad essa esistono
  altre aziende ferroviarie, ad esempio la BLS o la Ferrovia Retica.
