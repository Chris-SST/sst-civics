id: zuerich-huegelzuege-am-zuerichsee
lang: it
source_version: 2
question: Quali catene di colline si trovano sulle rive del lago di Zurigo?
options:
  a: Uetliberg, Albis e Pfannenstiel
  b: Lägern, Irchel e Kohlfirst
  c: Hörnli, Bachtel e Allmann
  d: Heitersberg, Gubrist e Randen
explanation: L'Uetliberg e l'Albis si estendono lungo la riva sinistra del lago di Zurigo, mentre il Pfannenstiel
  si trova sulla riva destra. Le altre alture si trovano più lontano dal lago, per esempio nel Unterland,
  nel Weinland, nell'Oberland zurighese o in altri Cantoni.
