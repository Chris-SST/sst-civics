    question_de: Was bedeutet die Neutralität der Schweiz bei bewaffneten Konflikten zwischen anderen
      Staaten?
    options_de:
      a: Die Schweiz entsendet Truppen zur Friedenssicherung in jedes Kriegsgebiet.
      b: Die Schweiz bricht alle Beziehungen zu den beteiligten Staaten ab.
      c: Die Schweiz ergreift für keine der Konfliktparteien Partei.
      d: Die Schweiz unterstützt immer die schwächere Seite.
