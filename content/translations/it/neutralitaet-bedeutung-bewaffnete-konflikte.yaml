id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: it
source_version: 1
question: Che cosa significa la neutralità della Svizzera in caso di conflitti armati tra altri Stati?
options:
  a: La Svizzera invia truppe per il mantenimento della pace in ogni zona di guerra.
  b: La Svizzera interrompe tutte le relazioni con gli Stati coinvolti.
  c: La Svizzera non prende le parti di nessuna delle parti in conflitto.
  d: La Svizzera sostiene sempre la parte più debole.
explanation: Neutralità significa che la Svizzera non si schiera dalla parte di nessuna parte in guerra.
  In questo modo rimane fuori dai conflitti di altri Stati. Ciò non esclude né i colloqui né l'aiuto umanitario.
