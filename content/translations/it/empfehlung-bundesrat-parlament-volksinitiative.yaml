id: empfehlung-bundesrat-parlament-volksinitiative
lang: it
source_version: 1
question: Chi raccomanda agli aventi diritto di voto, prima della votazione su un'iniziativa popolare
  (Volksinitiative) federale, se accettare o respingere l'iniziativa?
options:
  a: Il Consiglio federale (Bundesrat) e il Parlamento
  b: I governi cantonali
  c: La Cancelleria federale (Bundeskanzlei) da sola
  d: Il Tribunale federale (Bundesgericht)
explanation: Dopo che un'iniziativa popolare è riuscita, il Consiglio federale e il Parlamento prendono
  posizione al riguardo. Il Parlamento raccomanda agli aventi diritto di voto di accettarla o di respingerla.
  Questa raccomandazione figura anche nelle spiegazioni del voto, che gli aventi diritto di voto ricevono
  prima della votazione.
