lang: it
source_version: 1
question: Come si comportò la Svizzera durante la Seconda guerra mondiale?
options:
  a: Interruppe tutti i contatti con le parti in guerra e chiuse completamente le frontiere.
  b: Si alleò con la Germania e fornì truppe.
  c: Rimase neutrale e mantenne contatti politici ed economici con le parti in guerra.
  d: Aderì all'alleanza degli Alleati e combatté al loro fianco.
explanation: Durante la Seconda guerra mondiale la Svizzera non divenne parte in guerra. Mantenne però
  contatti politici ed economici con le parti in guerra. Dal punto di vista storico, questo atteggiamento
  è oggetto di discussione ancora oggi.
