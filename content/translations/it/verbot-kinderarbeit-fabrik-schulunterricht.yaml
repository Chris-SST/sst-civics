id: verbot-kinderarbeit-fabrik-schulunterricht
lang: it
source_version: 1
question: Che cosa doveva garantire soprattutto il divieto del lavoro minorile nelle fabbriche del 1877?
options:
  a: Che le fabbriche dovessero pagare salari più bassi
  b: Che i bambini potessero frequentare la scuola
  c: Che i bambini dovessero aiutare prima nelle faccende domestiche
  d: Che le fabbriche facessero venire più manodopera dall'estero
explanation: La legge sulle fabbriche del 1877 vietava il lavoro in fabbrica per i bambini. Essi dovevano
  frequentare la scuola invece di lavorare. La legge proteggeva anche la salute dei lavoratori.
