    source_version: 1
    question_de: Was sollte das Verbot der Kinderarbeit in den Fabriken von 1877 vor allem gewährleisten?
    options_de:
      a: Dass die Fabriken tiefere Löhne zahlen mussten
      b: Dass die Kinder die Schule besuchen konnten
      c: Dass die Kinder zuerst im Haushalt helfen mussten
      d: Dass die Fabriken mehr Arbeitskräfte aus dem Ausland kommen liessen
    explanation_de: Das Fabrikgesetz von 1877 verbot die Fabrikarbeit für Kinder. Sie mussten die Schule
      besuchen, anstatt zu arbeiten. Das Gesetz schützte auch die Gesundheit der Arbeiter.
