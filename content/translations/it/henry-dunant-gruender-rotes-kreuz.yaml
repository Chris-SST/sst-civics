question: Chi è considerato il fondatore della Croce Rossa a Ginevra?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: Il ginevrino Henry Dunant vide nel 1859, dopo la battaglia di Solferino, quanti feriti restavano
  senza aiuto. Si impegnò perciò per la loro cura e nel 1863 nacque a Ginevra la Croce Rossa. Per questo,
  nel 1901, Dunant ricevette insieme a Frédéric Passy il primo Premio Nobel per la pace.
