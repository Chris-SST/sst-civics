id: iv-kuerzel-invalidenversicherung
lang: it
source_version: 1
question: Che cosa significa l'abbreviazione «IV» nel sistema svizzero delle assicurazioni sociali?
options:
  a: Assicurazione nazionale (Inlandversicherung)
  b: Assicurazione per l'invalidità (Invalidenversicherung)
  c: Assicurazione per l'integrazione (Integrationsversicherung)
  d: Assicurazione individuale (Individualversicherung)
explanation: «IV» sta per assicurazione per l'invalidità (Invalidenversicherung, IV). Fa parte del primo
  pilastro della previdenza per la vecchiaia e aiuta le persone con limitazioni di salute, ad esempio
  con provvedimenti d'integrazione o rendite.
