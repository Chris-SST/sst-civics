    question_de: Zwei Ehegatten haben bei der Heirat keinen gemeinsamen Familiennamen bestimmt. Wer bestimmt
      dann den Namen ihrer gemeinsamen Kinder?
    options_de:
      a: Die Kinder erhalten automatisch den Nachnamen des Vaters.
      b: Das Zivilstandsamt entscheidet aufgrund der alphabetischen Reihenfolge der Nachnamen.
      c: Die Ehegatten wählen selbst den Nachnamen ihrer Kinder.
      d: Die Kinder erhalten automatisch den Nachnamen der Mutter.
    explanation_de: Wenn die Ehegatten keinen gemeinsamen Familiennamen bestimmt haben, müssen sie selbst
