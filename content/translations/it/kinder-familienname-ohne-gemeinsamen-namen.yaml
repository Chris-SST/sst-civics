id: kinder-familienname-ohne-gemeinsamen-namen
lang: it
source_version: 1
question: Due coniugi non hanno stabilito un cognome di famiglia comune al momento del matrimonio. Chi
  stabilisce allora il cognome dei loro figli comuni?
options:
  a: I figli ricevono automaticamente il cognome del padre.
  b: L'ufficio dello stato civile decide in base all'ordine alfabetico dei cognomi.
  c: I coniugi scelgono essi stessi il cognome dei loro figli.
  d: I figli ricevono automaticamente il cognome della madre.
explanation: Se i coniugi non hanno stabilito un cognome di famiglia comune, devono scegliere essi stessi
  il cognome dei figli. La legge non lo stabilisce automaticamente. Le norme si trovano nel Codice civile
  svizzero.
