id: regelmaessige-wahlen-vertreter-bestimmen
lang: it
source_version: 1
question: Quale importanza hanno le elezioni regolari in una democrazia?
options:
  a: La popolazione decide da sé chi la rappresenta.
  b: Il governo nomina da sé i propri successori.
  c: I partiti stabiliscono tra di loro la rappresentanza.
  d: Il tribunale decide chi assume una carica.
explanation: Nelle elezioni, gli aventi diritto di voto decidono chi li rappresenta in Parlamento o nel
  governo. Poiché le elezioni si svolgono regolarmente, possono confermare delle persone oppure sostituirle
  con altre. In questo modo la popolazione mantiene la propria influenza sulla politica.
