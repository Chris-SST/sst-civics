id: krankenversicherung-obligatorisch-einwohner
lang: it
source_version: 1
question: Chi deve stipulare un'assicurazione malattia in Svizzera?
options:
  a: Solo le persone con cittadinanza (Bürgerrecht) svizzera
  b: Tutte le persone che risiedono in Svizzera
  c: Solo le persone con meno di 65 anni
  d: Solo le persone che esercitano un'attività lucrativa
explanation: L'assicurazione obbligatoria delle cure medico-sanitarie vale per tutte le persone domiciliate
  in Svizzera. La cittadinanza, l'attività lucrativa e l'età non hanno alcuna importanza. L'assicurazione
  deve essere stipulata entro tre mesi dall'arrivo in Svizzera.
