id: primarschule-finanzierung-kanton-gemeinde
lang: it
source_version: 1
question: Chi finanzia e organizza la scuola elementare nel Cantone di Zurigo?
options:
  a: Solo le parrocchie (Kirchgemeinden)
  b: Solo i genitori degli alunni
  c: Solo la Confederazione
  d: Il Cantone e i Comuni (Gemeinden) insieme
explanation: La scuola dell'obbligo nel Cantone di Zurigo è un compito comune del Cantone e dei Comuni.
  Il Cantone stabilisce le basi, i Comuni gestiscono le scuole sul posto.
