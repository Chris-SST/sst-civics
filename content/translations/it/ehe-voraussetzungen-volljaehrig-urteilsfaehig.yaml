id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: it
source_version: 1
question: Quali requisiti devono soddisfare le persone per potersi sposare in Svizzera?
options:
  a: Devono possedere la cittadinanza (Bürgerrecht) svizzera ed essere maggiorenni
  b: Devono essere maggiorenni e capaci di agire in modo ragionevole
  c: Devono convivere da almeno cinque anni
  d: Devono appartenere alla stessa religione
explanation: Può sposarsi chi è maggiorenne e capace di discernimento. Capace di discernimento significa
  essere in grado di agire in modo ragionevole. La nazionalità, la religione o una determinata durata
  della convivenza non sono requisiti.
