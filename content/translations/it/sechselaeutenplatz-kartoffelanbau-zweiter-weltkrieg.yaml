lang: it
source_version: 2
question: Quale di queste piante fu coltivata durante la Seconda guerra mondiale sulla Sechseläutenplatz
  a Zurigo?
options:
  a: Tabacco
  b: Viti
  c: Cotone
  d: Patate
explanation: Durante la Seconda guerra mondiale in Svizzera c'erano troppo pochi generi alimentari. Per
  questo, con la «battaglia del raccolto» (Anbauschlacht), furono coltivate anche superfici in mezzo alle
  città, per esempio la Sechseläutenplatz a Zurigo, dove furono piantate patate. Tabacco, viti e cotone
  non vi furono coltivati.
