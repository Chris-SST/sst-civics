id: krankenkasse-freie-wahl-versicherte
lang: it
source_version: 1
question: Chi decide in Svizzera presso quale cassa malati (Krankenkasse) una persona stipula l'assicurazione
  di base?
options:
  a: Il comune di domicilio stabilisce la cassa malati
  b: La persona assicurata sceglie da sé la propria cassa malati
  c: Il datore di lavoro determina la cassa malati per tutti i dipendenti
  d: Il cantone di domicilio assegna una cassa malati a ogni persona
explanation: In Svizzera vige la libera scelta della cassa malati. Le persone assicurate possono scegliere
  tra le casse malati riconosciute e, a determinate condizioni, cambiare cassa.
