id: notruf-polizei-nummer
lang: it
source_version: 1
question: Quale numero di telefono si compone in Svizzera quando, in caso di emergenza, si ha bisogno
  della polizia?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: In tutta la Svizzera la polizia si raggiunge al numero 117. I pompieri hanno il 118, il servizio
  sanitario di soccorso il 144. Il 143 è il numero del Telefono Amico (Dargebotene Hand) per le persone
  in crisi.
