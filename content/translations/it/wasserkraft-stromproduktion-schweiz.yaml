id: wasserkraft-stromproduktion-schweiz
lang: it
source_version: 1
question: La Svizzera dispone di abbondanti risorse idriche. Come vengono utilizzate per la produzione
  di elettricità?
options:
  a: Nelle centrali a gas
  b: Nelle raffinerie di petrolio
  c: Nelle centrali idroelettriche
  d: Nelle centrali a carbone
explanation: L'acqua dei fiumi e dei bacini di accumulo aziona le turbine nelle centrali idroelettriche.
  In Svizzera la forza idrica è una fonte indigena fondamentale di elettricità.
