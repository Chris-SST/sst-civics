    question_de: Wie viele Jahre dauert im Kanton Zürich die obligatorische Schule, wenn man auch den
      Kindergarten mitzählt?
    options_de:
      a: Elf Jahre
      b: Zehn Jahre
      c: Zwölf Jahre
      d: Neun Jahre
    explanation_de: 'Im Kanton Zürich besuchen alle Kinder die Schule elf Jahre lang obligatorisch: zwei
      Jahre Kindergarten, sechs Jahre Primarschule und drei Jahre Sekundarstufe I. Die Mehrheit der Kantone
      hat diese Dauer mit dem HarmoS-Konkordat vereinheitlicht. Einige Kantone sind ihm jedoch nicht beigetreten,
      und in einigen von ihnen ist nur ein Jahr Kindergarten obligatorisch.'
