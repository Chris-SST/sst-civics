id: obligatorische-schulzeit-dauer-schweiz
lang: it
source_version: 2
question: Quanti anni dura nel Cantone di Zurigo la scuola dell'obbligo, se si conta anche la scuola dell'infanzia?
options:
  a: Undici anni
  b: Dieci anni
  c: Dodici anni
  d: Nove anni
explanation: 'Nel Cantone di Zurigo tutti i bambini frequentano la scuola per undici anni in modo obbligatorio:
  due anni di scuola dell''infanzia, sei anni di scuola elementare (Primarschule) e tre anni di scuola
  secondaria di primo grado. La maggior parte dei Cantoni ha uniformato questa durata con il Concordato
  HarmoS. Alcuni Cantoni, tuttavia, non vi hanno aderito e in alcuni di essi è obbligatorio solo un anno
  di scuola dell''infanzia.'
