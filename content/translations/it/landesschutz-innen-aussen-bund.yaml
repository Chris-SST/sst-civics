id: landesschutz-innen-aussen-bund
lang: it
source_version: 1
question: Quale compito rientra tra i compiti centrali della Confederazione?
options:
  a: L'organizzazione delle scuole locali
  b: La protezione del Paese verso l'interno e verso l'esterno
  c: La gestione delle strade del Comune (Gemeinde)
  d: L'amministrazione dei registri degli abitanti dei Comuni
explanation: La Confederazione provvede alla sicurezza del Paese verso l'esterno, ad esempio con l'esercito,
  e alla sicurezza interna. Le scuole, le strade comunali e i registri degli abitanti sono invece compiti
  che spettano soprattutto ai Cantoni e ai Comuni.
