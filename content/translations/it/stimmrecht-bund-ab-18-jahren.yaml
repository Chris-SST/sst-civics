id: stimmrecht-bund-ab-18-jahren
lang: it
source_version: 2
question: Chi può votare e eleggere a livello federale?
options:
  a: I cittadini svizzeri a partire dai 20 anni
  b: Tutte le persone con permesso di domicilio (Niederlassungsbewilligung, permesso C) a partire dai
    18 anni
  c: I cittadini svizzeri a partire dai 18 anni
  d: Tutte le persone domiciliate in Svizzera a partire dai 16 anni
explanation: Nella Confederazione, gli svizzeri e le svizzere possono votare e eleggere a partire dal
  18° compleanno. Gli stranieri e le straniere non hanno questo diritto a livello federale, nemmeno con
  un permesso di domicilio. Anche gli svizzeri e le svizzere che vivono all'estero possono partecipare,
  se si fanno iscrivere nel catalogo elettorale.
