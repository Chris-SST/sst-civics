    question_de: Wer darf auf Bundesebene abstimmen und wählen?
    options_de:
      a: Schweizer Bürgerinnen und Bürger ab 20 Jahren
      b: Alle Personen mit Niederlassungsbewilligung (Niederlassungsbewilligung, Bewilligung C) ab 18
        Jahren
      c: Schweizer Bürgerinnen und Bürger ab 18 Jahren
      d: Alle in der Schweiz wohnhaften Personen ab 16 Jahren
    explanation_de: Im Bund dürfen die Schweizer und Schweizerinnen ab dem 18. Geburtstag abstimmen und
      wählen. Ausländer und Ausländerinnen haben dieses Recht auf Bundesebene nicht, auch nicht mit einer
      Niederlassungsbewilligung. Auch die im Ausland lebenden Schweizer und Schweizerinnen können teilnehmen,
      wenn sie sich ins Wahlverzeichnis eintragen lassen.
