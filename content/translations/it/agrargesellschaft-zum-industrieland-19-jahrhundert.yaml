    question_de: Wie hat sich die Schweiz im 19. Jahrhundert wirtschaftlich verändert?
    options_de:
      a: Sie lebte vor allem vom Handel mit den Kolonien.
      b: Bis 1900 blieb sie fast ausschliesslich ein Bauernland.
      c: Sie wandelte sich von einem Industrieland zu einer Agrargesellschaft.
      d: Sie wandelte sich von einer Agrargesellschaft zu einem Industrieland.
    explanation_de: Im 19. Jahrhundert verlagerte sich die Arbeit von der Landwirtschaft in die Fabriken.
