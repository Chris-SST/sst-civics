id: agrargesellschaft-zum-industrieland-19-jahrhundert
lang: it
source_version: 1
question: Come è cambiata economicamente la Svizzera nel XIX secolo?
options:
  a: Viveva soprattutto del commercio con le colonie.
  b: Fino al 1900 è rimasta quasi esclusivamente un paese di contadini.
  c: Si è trasformata da paese industriale a società agraria.
  d: Si è trasformata da società agraria a paese industriale.
explanation: Nel XIX secolo il lavoro si spostò dall'agricoltura alle fabbriche. Nuove vie di comunicazione
  come la ferrovia sostennero questo cambiamento. Così il paese agricolo divenne un paese industriale.
