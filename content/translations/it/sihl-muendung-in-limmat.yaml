id: sihl-muendung-in-limmat
lang: it
source_version: 1
question: In quale fiume sfocia la Sihl in pieno centro della città di Zurigo?
options:
  a: Nella Töss
  b: Nella Limmat
  c: Nella Glatt
  d: Nell'Aare
explanation: La Sihl attraversa Zurigo e sfocia nella Limmat presso lo Platzspitz. La Glatt e la Töss
  sono altri fiumi zurighesi che sfociano nel Reno. L'Aare riceve la Limmat solo più a valle, nel Cantone
  Argovia.
