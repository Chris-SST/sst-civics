    question_de: Wer hat in der Schweiz von Gesetzes wegen nach der Geburt eines Kindes Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Unternehmen mit mehr als 50 Angestellten arbeiten
      b: Jede Frau, die eine Erwerbstätigkeit ausübt und ein Kind zur Welt bringt
      c: Nur verheiratete Frauen
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Das Gesetz sieht für Mütter, die eine Erwerbstätigkeit ausüben, den Anspruch auf Mutterschaftsurlaub
      und auf eine Entschädigung vor. Die Grösse des Unternehmens, die Staatsangehörigkeit und der Zivilstand
      spielen dabei keine Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
