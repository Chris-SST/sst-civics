id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
lang: it
source_version: 1
question: Chi ha diritto per legge, in Svizzera, al congedo di maternità dopo la nascita di un figlio?
options:
  a: Solo le donne che lavorano in un'azienda con più di 50 dipendenti
  b: Ogni donna che esercita un'attività lucrativa e mette al mondo un figlio
  c: Solo le donne sposate
  d: Solo le donne con cittadinanza (Bürgerrecht) svizzera
explanation: La legge prevede per le madri che esercitano un'attività lucrativa il diritto al congedo
  di maternità e a un'indennità. Le dimensioni dell'azienda, la nazionalità e lo stato civile non hanno
  alcuna importanza al riguardo. L'indennità è finanziata tramite l'indennità per perdita di guadagno
  (Erwerbsersatzordnung).
