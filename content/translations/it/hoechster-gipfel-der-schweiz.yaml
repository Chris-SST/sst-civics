id: hoechster-gipfel-der-schweiz
lang: it
source_version: 2
question: Come si chiama la vetta più alta della Svizzera?
options:
  a: Piz Bernina
  b: Cervino
  c: Punta Dufour
  d: Jungfrau
explanation: La Punta Dufour, nel massiccio del Monte Rosa, nel Vallese, con circa 4634 metri è la vetta
  più alta della Svizzera. Il Cervino è più famoso, ma più basso. Il Piz Bernina, nei Grigioni, è la vetta
  più alta delle Alpi orientali.
