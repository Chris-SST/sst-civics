id: kantonshauptort-zuerich-stadt
lang: it
source_version: 1
question: Quale città è il capoluogo del Cantone di Zurigo?
options:
  a: Uster
  b: La città di Zurigo
  c: Winterthur
  d: Dübendorf
explanation: La città di Zurigo è il capoluogo del Cantone e porta lo stesso nome. Qui hanno sede, tra
  l'altro, il Consiglio cantonale (Kantonsrat) e il Consiglio di Stato (Regierungsrat). Winterthur è la
  seconda città più grande del Cantone.
