id: schwarzenbach-initiative-ziel-auslaenderanteil
lang: it
source_version: 1
question: Che cosa voleva l'iniziativa Schwarzenbach, sulla quale si votò nel 1970?
options:
  a: Voleva facilitare la naturalizzazione per tutti gli stranieri.
  b: Voleva vietare l'immigrazione soltanto dall'Italia.
  c: Voleva limitare la quota di stranieri che vivono in Svizzera.
  d: Voleva introdurre il diritto di voto per gli stranieri.
explanation: L'iniziativa chiedeva di limitare la quota di stranieri in Svizzera. Nel 1970 fu respinta
  dal popolo. Mostra quanto fosse dibattuta, allora, l'immigrazione.
