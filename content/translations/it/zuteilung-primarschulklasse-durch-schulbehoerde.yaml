    question_de: Wer entscheidet im Kanton Zürich, welcher Klasse der Primarschule ein Kind zugeteilt
      wird?
    options_de:
      a: Die Schulpflege oder die Schulleitung
      b: Das Bildungsdepartement des Bundes
      c: Die Gemeindeversammlung
      d: Die Eltern des Kindes
    explanation_de: Die Schulpflege oder die Schulleitung teilt die Kinder den Klassen zu. Die Eltern
      können die Klasse nicht frei wählen. Auf diese Weise organisiert die Schule ihren Betrieb und die
      Grösse der Klassen.
