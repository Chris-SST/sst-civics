id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: it
source_version: 3
question: Chi decide, nel Cantone di Zurigo, a quale classe della scuola elementare viene assegnato un
  bambino?
options:
  a: La commissione scolastica (Schulpflege) o la direzione scolastica
  b: Il dipartimento dell'istruzione della Confederazione
  c: L'assemblea comunale (Gemeindeversammlung)
  d: I genitori del bambino
explanation: La commissione scolastica o la direzione scolastica assegna i bambini alle classi. I genitori
  non possono scegliere liberamente la classe. In questo modo la scuola organizza il proprio funzionamento
  e la dimensione delle classi.
