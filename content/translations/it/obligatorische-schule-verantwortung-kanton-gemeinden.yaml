id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: it
source_version: 1
question: Chi è il principale responsabile della scuola pubblica obbligatoria in Svizzera?
options:
  a: Le direzioni scolastiche e i genitori
  b: La Confederazione da sola
  c: I distretti e le Chiese
  d: I Cantoni e i Comuni (Gemeinden)
explanation: La scuola dell'obbligo pubblica è di competenza dei Cantoni e dei Comuni. Il Cantone stabilisce
  il quadro generale, mentre i Comuni gestiscono le scuole a livello locale. La Confederazione svolge
  un ruolo soltanto marginale nella scuola obbligatoria.
