    question_de: Wer ist hauptverantwortlich für die obligatorische öffentliche Schule in der Schweiz?
    options_de:
      a: Die Schulleitungen und die Eltern
      b: Der Bund allein
      c: Die Bezirke und die Kirchen
      d: Die Kantone und die Gemeinden
    explanation_de: Die öffentliche obligatorische Schule fällt in die Zuständigkeit der Kantone und der
