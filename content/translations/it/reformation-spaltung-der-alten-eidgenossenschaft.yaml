id: reformation-spaltung-der-alten-eidgenossenschaft
lang: it
source_version: 1
question: Quale conseguenza ebbe la Riforma per la Svizzera?
options:
  a: La Svizzera era divisa religiosamente in una parte riformata e una parte cattolica.
  b: La Svizzera divenne parte del Sacro Romano Impero germanico.
  c: La Chiesa perse ovunque qualsiasi influenza sulla politica.
  d: Tutti i luoghi della Confederazione divennero riformati.
explanation: Alcuni luoghi accolsero la Riforma, altri rimasero cattolici. Nacque così una contrapposizione
  religiosa che pesò a lungo sulla Confederazione. Ci furono anche conflitti tra le confessioni.
