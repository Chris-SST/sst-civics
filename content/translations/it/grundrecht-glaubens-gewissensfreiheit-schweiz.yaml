    question_de: Welches Grundrecht wird in der Schweiz durch die Bundesverfassung geschützt?
    options_de:
      a: Das Recht auf ein Einkommen vonseiten des Staates
      b: Das Recht auf ein Auto
      c: Das Recht auf einen Arbeitsplatz
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung verankert.
      Der Staat kann niemanden zwingen, einen bestimmten Glauben zu haben. Ein Recht auf einen Arbeitsplatz
      oder auf ein Einkommen besteht nicht als Grundrecht.
