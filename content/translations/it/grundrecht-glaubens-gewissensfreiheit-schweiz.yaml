id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: it
source_version: 1
question: Quale diritto fondamentale è protetto in Svizzera dalla Costituzione federale?
options:
  a: Il diritto a un reddito da parte dello Stato
  b: Il diritto a un'automobile
  c: Il diritto a un posto di lavoro
  d: La libertà di credo e di coscienza
explanation: La libertà di credo e di coscienza è sancita nell'articolo 15 della Costituzione federale.
  Lo Stato non può costringere nessuno ad avere una determinata fede. Un diritto a un posto di lavoro
  o a un reddito non esiste come diritto fondamentale.
