    question_de: In welchem Rhythmus erneuert das Volk das Bundesparlament?
    options_de:
      a: Alle drei Jahre
      b: Alle vier Jahre
      c: Alle sechs Jahre
      d: Alle zwei Jahre
    explanation_de: Das Volk erneuert den Nationalrat alle vier Jahre. Auch die Mitglieder des Ständerats
      werden heute in allen Kantonen für vier Jahre gewählt. Wie gewählt wird, und teilweise auch wann,
      legt jeder Kanton selbstständig fest.
