id: bundesparlament-wahl-alle-vier-jahre
lang: it
source_version: 2
question: Con quale cadenza il popolo rinnova il Parlamento federale?
options:
  a: Ogni tre anni
  b: Ogni quattro anni
  c: Ogni sei anni
  d: Ogni due anni
explanation: Il popolo rinnova il Consiglio nazionale (Nationalrat) ogni quattro anni. Anche i membri
  del Consiglio degli Stati (Ständerat) sono oggi eletti in tutti i Cantoni per quattro anni. Come si
  vota, e in parte anche quando, lo stabilisce ogni Cantone autonomamente.
