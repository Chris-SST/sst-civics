question: Che cos'è Economiesuisse?
options:
  a: Una cassa di disoccupazione della Confederazione
  b: L'Ufficio federale dell'economia
  c: L'organizzazione mantello dell'economia che rappresenta gli interessi delle imprese
  d: Un sindacato per i dipendenti del commercio al dettaglio
explanation: Economiesuisse è l'organizzazione mantello dell'economia svizzera e rappresenta gli interessi
