question: Da dove proviene la maggior parte degli stranieri e delle straniere residenti in Svizzera?
options:
  a: Da Stati dell'Asia, circa due terzi
  b: Da Stati dell'Africa, circa la metà
  c: Da Stati dell'Unione europea, circa due terzi
  d: Da Stati dell'America, circa un terzo
explanation: Circa il 66 per cento della popolazione residente straniera proviene da Stati dell'UE, ovvero
  circa due terzi. Il resto proviene da altri Stati europei e dal resto del mondo. Il dato può variare
  leggermente nel corso del tempo.
