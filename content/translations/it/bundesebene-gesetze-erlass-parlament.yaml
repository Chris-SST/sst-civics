id: bundesebene-gesetze-erlass-parlament
lang: it
source_version: 1
question: Quale autorità emana le leggi a livello federale?
options:
  a: L'Assemblea federale (Bundesversammlung), ovvero il Consiglio nazionale (Nationalrat) e il Consiglio
    degli Stati (Ständerat)
  b: La Banca nazionale svizzera
  c: La Cancelleria federale (Bundeskanzlei)
  d: La Conferenza dei governi cantonali
explanation: L'Assemblea federale è il Parlamento della Confederazione e si compone del Consiglio nazionale
  e del Consiglio degli Stati. È competente per la legislazione. La Cancelleria federale, invece, sostiene
  il Consiglio federale (Bundesrat) come organo di stato maggiore.
