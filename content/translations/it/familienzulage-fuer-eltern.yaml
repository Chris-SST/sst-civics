    question_de: Welche staatliche Leistung erhalten in der Schweiz Eltern, die angestellt sind oder selbstständig
      erwerbend arbeiten und Kinder haben?
    options_de:
      a: Die Invalidenrente
      b: Die Arbeitslosenentschädigung
      c: Die Ergänzungsleistung zur Alters- und Hinterlassenenversicherung (AHV)
      d: Die Familienzulage
    explanation_de: Die Familienzulagen helfen den Familien, einen Teil der Kosten für die Kinder zu tragen.
      Sie umfassen die Kinderzulagen und die Ausbildungszulagen. Auch selbstständig Erwerbende können
      sie erhalten.
