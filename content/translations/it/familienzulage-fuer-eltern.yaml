id: familienzulage-fuer-eltern
lang: it
source_version: 1
question: Quale prestazione statale ricevono in Svizzera i genitori che sono dipendenti o lavorano come
  indipendenti e hanno figli?
options:
  a: La rendita d'invalidità
  b: L'indennità di disoccupazione
  c: La prestazione complementare all'assicurazione vecchiaia e superstiti (AHV)
  d: L'assegno familiare
explanation: Gli assegni familiari aiutano le famiglie a sostenere una parte dei costi per i figli. Comprendono
  gli assegni per i figli e gli assegni di formazione. Anche i lavoratori indipendenti possono riceverli.
