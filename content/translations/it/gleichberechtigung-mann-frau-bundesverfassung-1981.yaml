id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: it
source_version: 1
question: Da quando la parità di diritti tra uomo e donna è sancita nella Costituzione federale svizzera?
options:
  a: Dal 1999
  b: Dal 1971
  c: Dal 1981
  d: Dal 1848
explanation: Nel 1981 l'articolo sulla parità dei sessi è stato inserito nella Costituzione federale.
  Esso obbliga lo Stato a garantire la parità nella famiglia, nella formazione e nel lavoro. Il diritto
  di voto alle donne esisteva già dal 1971.
