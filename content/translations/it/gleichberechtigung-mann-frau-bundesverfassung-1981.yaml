    question_de: Seit wann ist die Gleichberechtigung von Mann und Frau in der Schweizerischen Bundesverfassung
      verankert?
    options_de:
      a: Seit 1999
      b: Seit 1971
      c: Seit 1981
      d: Seit 1848
    explanation_de: Im Jahr 1981 wurde der Artikel über die Gleichstellung der Geschlechter in die Bundesverfassung
      aufgenommen. Er verpflichtet den Staat, die Gleichstellung in der Familie, in der Ausbildung und
      bei der Arbeit zu gewährleisten. Das Stimmrecht für Frauen bestand bereits seit 1971.
