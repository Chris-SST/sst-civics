id: demokratie-bevoelkerung-waehlt-parlament
lang: it
source_version: 1
question: Quali diritti spettano alla popolazione in una democrazia come la Svizzera?
options:
  a: Nomina i giudici del Tribunale federale (Bundesgericht) tramite sorteggio.
  b: Stabilisce le leggi da sola, senza il Parlamento.
  c: Determina il proprio Parlamento attraverso le elezioni.
  d: Elegge direttamente i vertici dell'esercito.
explanation: In una democrazia la popolazione elegge i propri rappresentanti in Parlamento. A livello
  federale si tratta del Consiglio nazionale (Nationalrat) e del Consiglio degli Stati (Ständerat). Il
  Parlamento emana poi le leggi federali a nome del popolo.
