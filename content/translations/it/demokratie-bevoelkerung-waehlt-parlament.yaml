    question_de: Welche Rechte stehen der Bevölkerung in einer Demokratie wie der Schweiz zu?
    options_de:
      a: Sie ernennt die Richter des Bundesgerichts durch Losentscheid.
      b: Sie legt die Gesetze allein fest, ohne das Parlament.
      c: Sie bestimmt ihr eigenes Parlament durch Wahlen.
      d: Sie wählt die Spitzen der Armee direkt.
    explanation_de: In einer Demokratie wählt die Bevölkerung ihre Vertreter ins Parlament. Auf Bundesebene
      sind dies der Nationalrat und der Ständerat. Das Parlament erlässt dann im Namen des Volkes die
      Bundesgesetze.
