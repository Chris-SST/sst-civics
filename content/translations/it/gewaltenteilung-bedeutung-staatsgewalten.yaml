id: gewaltenteilung-bedeutung-staatsgewalten
lang: it
source_version: 1
question: Che cosa significa il principio della separazione dei poteri in Svizzera?
options:
  a: La Confederazione, i Cantoni e i Comuni (Gemeinden) si ripartiscono le entrate fiscali.
  b: Governo, Parlamento e tribunali si dividono il potere dello Stato.
  c: Il potere nello Stato spetta unicamente al Consiglio federale (Bundesrat).
  d: Il popolo e i media si dividono il potere dello Stato.
explanation: Con la separazione dei poteri, l'esecutivo (Governo), il legislativo (Parlamento) e il giudiziario
  (tribunali) svolgono compiti diversi. In questo modo nessun organo può avere da solo troppo potere.
  I poteri dello Stato si controllano a vicenda.
