    question_de: Was bedeutet das Prinzip der Gewaltenteilung in der Schweiz?
    options_de:
      a: Der Bund, die Kantone und die Gemeinden teilen sich die Steuereinnahmen.
      b: Regierung, Parlament und Gerichte teilen sich die Macht des Staates.
      c: Die Macht im Staat liegt allein beim Bundesrat.
      d: Das Volk und die Medien teilen sich die Macht des Staates.
    explanation_de: Mit der Gewaltenteilung erfüllen die Exekutive (Regierung), die Legislative (Parlament)
      und die Judikative (Gerichte) unterschiedliche Aufgaben. Auf diese Weise kann kein Organ allein
      zu viel Macht haben. Die Gewalten des Staates kontrollieren sich gegenseitig.
