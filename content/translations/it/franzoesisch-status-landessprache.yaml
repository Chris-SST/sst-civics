question: Che status ha il francese in Svizzera?
options:
  a: Il francese è solo una lingua straniera a scuola.
  b: Il francese è solo una lingua veicolare regionale.
  c: Il francese è una lingua nazionale.
  d: Il francese è una lingua minoritaria senza status ufficiale.
explanation: Il francese è una delle lingue nazionali della Svizzera. Viene parlato soprattutto nella
  Svizzera occidentale ed è una lingua ufficiale a livello di Confederazione.
