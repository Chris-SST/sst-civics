question: Quante persone senza passaporto svizzero vivevano stabilmente in Svizzera nel 2020, approssimativamente?
options:
  a: circa 2,1 milioni
  b: circa 0,8 milioni
  c: circa 3,5 milioni
  d: circa 1,4 milioni
explanation: Alla fine del 2020 vivevano in Svizzera circa 2,1 milioni di straniere e stranieri. Fanno
  parte della popolazione residente permanente. I dati sono pubblicati dall'Ufficio federale di statistica.
