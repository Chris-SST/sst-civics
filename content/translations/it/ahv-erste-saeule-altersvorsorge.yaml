id: ahv-erste-saeule-altersvorsorge
lang: it
source_version: 1
question: Quale istituzione costituisce il primo pilastro della previdenza per la vecchiaia in Svizzera?
options:
  a: Il pilastro privato 3a
  b: L'assicurazione vecchiaia e superstiti (AHV) statale
  c: La cassa pensioni
  d: La cassa malati (Krankenkasse)
explanation: L'assicurazione vecchiaia e superstiti è la previdenza statale e costituisce il primo pilastro.
  La cassa pensioni è il secondo pilastro, la previdenza privata il terzo pilastro.
