id: eigentum-garantie-bundesverfassung
lang: it
source_version: 1
question: Quale diritto fondamentale protegge in Svizzera le case, i terreni e altri beni patrimoniali
  di persone private?
options:
  a: La garanzia della proprietà
  b: La libertà di credo e di coscienza
  c: La libertà di domicilio
  d: La libertà di riunione
explanation: La Costituzione federale garantisce la proprietà nell'articolo 26. Lo Stato può limitare
  la proprietà solo a determinate condizioni, ad esempio con una base legale e con un'indennità piena
  in caso di espropriazione.
