id: informationen-kommunale-angebote-finden
lang: it
source_version: 2
question: Dove si trovano informazioni sulle offerte e sulle regole del proprio Comune (Gemeinde)?
options:
  a: Nel Foglio federale della Confederazione
  b: Nel giornale locale o sul sito web del Comune
  c: Presso l'ambasciata del Paese d'origine
  d: Presso il Consiglio federale (Bundesrat) a Berna
explanation: Il Comune informa sulle proprie offerte e regole soprattutto tramite il giornale locale e
  il proprio sito web su Internet. La Confederazione e il Consiglio federale sono competenti per i temi
  nazionali, mentre un'ambasciata straniera non lo è affatto per il Comune. Anche l'amministrazione comunale
  fornisce informazioni.
