    question_de: Wo findet man Informationen über die Angebote und die Regeln der eigenen Gemeinde?
    options_de:
      a: Im Bundesblatt der Eidgenossenschaft
      b: In der Lokalzeitung oder auf der Website der Gemeinde
      c: Bei der Botschaft des Herkunftslandes
      d: Beim Bundesrat in Bern
    explanation_de: Die Gemeinde informiert über ihre Angebote und Regeln vor allem über die Lokalzeitung
      und ihre eigene Website im Internet. Die Eidgenossenschaft und der Bundesrat sind für nationale
      Themen zuständig, während eine ausländische Botschaft für die Gemeinde überhaupt nicht zuständig
      ist. Auch die Gemeindeverwaltung gibt Auskunft.
