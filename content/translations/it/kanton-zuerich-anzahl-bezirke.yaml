id: kanton-zuerich-anzahl-bezirke
lang: it
source_version: 1
question: In quanti distretti è suddiviso il Cantone di Zurigo?
options:
  a: In dieci distretti
  b: In dodici distretti
  c: In quattordici distretti
  d: In otto distretti
explanation: Il Cantone di Zurigo è suddiviso in dodici distretti, ad esempio Affoltern, Meilen, Winterthur
  e Zurigo. I distretti sono circoscrizioni amministrative e giudiziarie situate tra il Cantone e i Comuni
  (Gemeinden).
