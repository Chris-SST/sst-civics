id: bern-bundesstadt-landeshauptstadt
lang: it
source_version: 1
question: Quale città svolge il ruolo di capitale in Svizzera?
options:
  a: Berna
  b: Ginevra
  c: Losanna
  d: Zurigo
explanation: Berna è la sede del Consiglio federale (Bundesrat) e dell'Assemblea federale (Bundesversammlung)
  ed è denominata «città federale». La Costituzione federale non menziona alcuna capitale, ma Berna svolge
  questo ruolo. Zurigo è la città più grande, Losanna è la sede del Tribunale federale (Bundesgericht).
