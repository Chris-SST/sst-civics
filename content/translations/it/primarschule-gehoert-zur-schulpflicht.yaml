id: primarschule-gehoert-zur-schulpflicht
lang: it
source_version: 2
question: Quale di questi livelli fa parte della scuola dell'obbligo in Svizzera?
options:
  a: La scuola universitaria
  b: La scuola primaria
  c: Il gruppo di gioco
  d: La scuola professionale
explanation: 'Nel Cantone Zurigo la scuola dell''obbligo dura undici anni: scuola dell''infanzia, scuola
  primaria e scuola secondaria di primo grado. Il gruppo di gioco per i bambini piccoli è facoltativo.
  La scuola professionale e la scuola universitaria si frequentano solo dopo la scuola dell''obbligo.'
