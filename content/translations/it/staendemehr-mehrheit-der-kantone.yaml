id: staendemehr-mehrheit-der-kantone
lang: it
source_version: 1
question: Che cosa significa il termine «maggioranza dei Cantoni (Ständemehr)» nelle votazioni federali?
options:
  a: La maggioranza dei Cantoni deve approvare il progetto.
  b: La maggioranza dei Comuni (Gemeinden) deve approvare il progetto.
  c: La maggioranza dei partiti deve approvare il progetto.
  d: La maggioranza dei membri del Consiglio degli Stati (Ständerat) deve essere presente.
explanation: La maggioranza dei Cantoni richiede che la maggioranza dei Cantoni approvi un progetto. Il
  voto di un Cantone conta secondo il risultato della votazione in quel Cantone. Per le modifiche della
  Costituzione, oltre alla maggioranza del popolo (Volksmehr) è necessaria anche la maggioranza dei Cantoni.
