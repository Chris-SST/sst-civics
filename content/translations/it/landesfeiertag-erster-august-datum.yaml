id: landesfeiertag-erster-august-datum
lang: it
source_version: 1
question: In quale data cade la Festa nazionale svizzera, il giorno di festa nazionale della Svizzera?
options:
  a: Il 1° agosto
  b: Il 26 dicembre
  c: L'11 novembre
  d: Il 1° maggio
explanation: La festa nazionale della Svizzera si celebra il 1° agosto. In quest'occasione si ricorda
  il Patto federale del 1291. Tra i festeggiamenti, in molti luoghi, ci sono fuochi d'artificio, falò
  sulle alture e discorsi.
