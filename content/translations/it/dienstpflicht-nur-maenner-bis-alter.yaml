id: dienstpflicht-nur-maenner-bis-alter
lang: it
source_version: 1
question: Chi in Svizzera è tenuto a prestare il servizio militare o il servizio civile sostitutivo fino
  a una determinata età?
options:
  a: Solo gli uomini
  b: Donne e uomini in egual misura
  c: Solo le persone con una formazione
  d: Solo le persone che ricoprono una carica in un Comune (Gemeinde)
explanation: In Svizzera l'obbligo di prestare servizio vale solo per gli uomini. Per le donne il servizio
  militare è volontario. L'obbligo dura fino a un'età stabilita dalla legge.
