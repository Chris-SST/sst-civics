question: Quale invenzione ha influenzato fortemente l'industrializzazione in Svizzera nel XIX secolo?
options:
  a: L'aeroplano
  b: La macchina a vapore
  c: Il computer
  d: La catena di montaggio
explanation: Nel XIX secolo la macchina a vapore divenne importante in Svizzera. Azionava le macchine
  nelle fabbriche e più tardi anche le ferrovie, e sempre più persone lavoravano nelle fabbriche. L'aeroplano,
  la catena di montaggio e il computer divennero importanti solo nel XX secolo.
