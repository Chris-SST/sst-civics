id: gegenvorschlag-parlament-zur-volksinitiative
lang: it
source_version: 1
question: Che cosa può contrapporre il Parlamento a un'iniziativa popolare (Volksinitiative) federale?
options:
  a: Una proroga del termine per la raccolta delle firme di un ulteriore anno
  b: Un proprio controprogetto, che viene sottoposto anch'esso a votazione
  c: Una seconda raccolta di firme in tutti i Cantoni
  d: Un divieto di sottoporre l'iniziativa a votazione
explanation: Il Parlamento può contrapporre a un'iniziativa popolare un controprogetto diretto. Quest'ultimo
  recepisce spesso in parte la richiesta, ma si spinge meno lontano. Gli aventi diritto di voto votano
  quindi nello stesso giorno sull'iniziativa e sul controprogetto.
