    question_de: Was kann das Parlament einer eidgenössischen Volksinitiative entgegenstellen?
    options_de:
      a: Eine Verlängerung der Frist für das Sammeln der Unterschriften um ein weiteres Jahr
      b: Einen eigenen Gegenentwurf, der ebenfalls zur Abstimmung gebracht wird
      c: Ein zweites Sammeln von Unterschriften in allen Kantonen
      d: Ein Verbot, die Initiative zur Abstimmung zu bringen
    explanation_de: Das Parlament kann einer Volksinitiative einen direkten Gegenentwurf entgegenstellen.
      Dieser übernimmt oft teilweise die Forderung, geht aber weniger weit. Die Stimmberechtigten stimmen
      also am selben Tag über die Initiative und den Gegenentwurf ab.
