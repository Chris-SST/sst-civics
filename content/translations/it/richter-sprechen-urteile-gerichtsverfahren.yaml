id: richter-sprechen-urteile-gerichtsverfahren
lang: it
source_version: 1
question: Chi pronuncia la sentenza in un procedimento giudiziario?
options:
  a: La giudice o il giudice
  b: La poliziotta o il poliziotto
  c: La presidente o il presidente del Comune (Gemeinde)
  d: La procuratrice pubblica o il procuratore pubblico
explanation: Le giudici e i giudici decidono in modo indipendente nei procedimenti giudiziari ed emettono
  la sentenza. La procura conduce l'indagine e promuove l'accusa. La polizia svolge accertamenti, ma non
  emette sentenze.
