    question_de: Wer spricht in einem Gerichtsverfahren das Urteil aus?
    options_de:
      a: Die Richterin oder der Richter
      b: Die Polizistin oder der Polizist
      c: Die Gemeindepräsidentin oder der Gemeindepräsident
      d: Die Staatsanwältin oder der Staatsanwalt
    explanation_de: Die Richterinnen und Richter entscheiden in Gerichtsverfahren unabhängig und fällen
      das Urteil. Die Staatsanwaltschaft führt die Untersuchung und erhebt die Anklage. Die Polizei führt
      Abklärungen durch, fällt aber keine Urteile.
