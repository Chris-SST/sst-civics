id: regierungsrat-zuerich-zusammensetzung-personen
lang: it
source_version: 1
question: Quale affermazione sulla composizione del Consiglio di Stato (Regierungsrat) zurighese è corretta?
options:
  a: È composto da tre persone.
  b: È composto da sette persone.
  c: È composto da nove persone.
  d: È composto da cinque persone.
explanation: Il Consiglio di Stato zurighese è un organo composto da sette persone. Esse dirigono insieme
  il Cantone e ciascuna è a capo di una Direzione.
