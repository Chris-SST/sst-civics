    question_de: Welcher Fluss tritt aus dem Zürichsee aus, durchquert die Stadt Zürich und fliesst dann
      weiter durch das Gebiet des Kantons?
    options_de:
      a: Die Thur
      b: Die Birs
      c: Die Reuss
      d: Die Limmat
    explanation_de: Die Limmat entspringt dem Ausfluss des Zürichsees und durchquert die Stadt Zürich
      und das Limmattal. Dann verlässt sie das Gebiet des Kantons in Richtung Aargau. Die Reuss, die Thur
      und die Birs treten nicht aus dem Zürichsee aus.
