id: limmat-fliesst-durch-kanton-zuerich
lang: it
source_version: 2
question: Quale fiume esce dal lago di Zurigo, attraversa la città di Zurigo e prosegue poi attraverso
  il territorio del Cantone?
options:
  a: La Thur
  b: La Birs
  c: La Reuss
  d: La Limmat
explanation: La Limmat nasce dallo sbocco del lago di Zurigo e attraversa la città di Zurigo e la valle
  della Limmat (Limmattal). Lascia poi il territorio del Cantone in direzione dell'Argovia. La Reuss,
  la Thur e la Birs non escono dal lago di Zurigo.
