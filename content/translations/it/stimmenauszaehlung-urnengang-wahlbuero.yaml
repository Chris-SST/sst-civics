    question_de: Wer zählt bei Abstimmungen in einer Zürcher Gemeinde die in die Urnen eingelegten Stimmzettel?
    options_de:
      a: Die Sozialbehörde
      b: Das Wahlbüro
      c: Die Gemeindeschreiberin allein
      d: Die Staatsanwaltschaft
    explanation_de: Das Wahlbüro ermittelt die Ergebnisse der Gemeinde bei Abstimmungen und Wahlen. Es
      besteht aus mehreren Personen, damit die Auszählung korrekt und überprüfbar erfolgt.
