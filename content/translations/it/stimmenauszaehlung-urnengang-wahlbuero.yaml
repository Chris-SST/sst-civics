id: stimmenauszaehlung-urnengang-wahlbuero
lang: it
source_version: 1
question: Chi conta le schede deposte nelle urne in un Comune (Gemeinde) zurighese in occasione delle
  votazioni?
options:
  a: L'autorità sociale
  b: L'ufficio elettorale
  c: La segretaria comunale da sola
  d: La procura
explanation: L'ufficio elettorale determina i risultati del Comune nelle votazioni e nelle elezioni. È
  composto da più persone, affinché lo spoglio avvenga in modo corretto e verificabile.
