question: Quali nomi appartengono ad artisti di fama mondiale con un legame con la Svizzera?
options:
  a: Vincent van Gogh, Paul Cézanne e Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp e Pipilotti Rist
  c: Claude Monet, Edgar Degas e Auguste Renoir
  d: Pablo Picasso, Frida Kahlo e Salvador Dalí
explanation: Niki de Saint Phalle, Sophie Taeuber-Arp e Pipilotti Rist sono artiste riconosciute a livello
  internazionale, legate alla Svizzera. Gli altri gruppi citano artisti noti senza questo legame con la
  Svizzera.
