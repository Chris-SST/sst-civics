id: gottfried-keller-zuercher-dichter
lang: it
source_version: 2
question: Quale noto poeta e scrittore era originario di Zurigo?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller nacque a Zurigo nel 1819, scrisse ad esempio «Enrico il Verde» («Der grüne
  Heinrich») e lavorò anche come cancelliere del Cantone di Zurigo. Robert Walser era originario di Bienne,
  Friedrich Dürrenmatt di Konolfingen, nel Cantone di Berna, e Jeremias Gotthelf operò come pastore nel
  Cantone di Berna.
