id: bund-spitze-dreistufiger-staatsaufbau
lang: it
source_version: 2
question: La Svizzera è strutturata in tre livelli statali. Quale livello è il più alto?
options:
  a: I Comuni (Gemeinden)
  b: La Confederazione
  c: I Cantoni
  d: I distretti
explanation: La Confederazione è il più alto dei tre livelli statali. Al di sotto vengono i Cantoni e
  poi i Comuni. I distretti non sono un livello statale a sé stante, ma in alcuni Cantoni sono soltanto
  unità amministrative all'interno del Cantone.
