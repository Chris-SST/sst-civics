    question_de: Wie wird das Parlament der Stadt Zürich, der Gemeinderat, gebildet?
    options_de:
      a: Er wird vom Regierungsrat des Kantons ernannt
      b: Der Stadtrat bestimmt die Mitglieder selbst
      c: Die Parteien verteilen die Sitze untereinander durch Losentscheid
      d: Die Bevölkerung wählt ihn direkt an der Urne
    explanation_de: Die Stimmberechtigten der Stadt Zürich wählen den Gemeinderat in allgemeinen Wahlen.
      Er ist das Parlament der Stadt und ersetzt die Gemeindeversammlung.
