id: stadtzuericher-parlament-direkt-gewaehlt
lang: it
source_version: 1
question: Come viene costituito il Parlamento della città di Zurigo, il consiglio comunale (Gemeinderat)?
options:
  a: Lo nomina il Consiglio di Stato (Regierungsrat) del Cantone
  b: Il Municipio (Stadtrat) designa da sé i membri
  c: I partiti si spartiscono i seggi tra loro mediante sorteggio
  d: La popolazione lo elegge direttamente alle urne
explanation: Gli aventi diritto di voto della città di Zurigo eleggono il consiglio comunale in elezioni
  generali. Esso è il Parlamento della città e sostituisce l'assemblea comunale (Gemeindeversammlung).
