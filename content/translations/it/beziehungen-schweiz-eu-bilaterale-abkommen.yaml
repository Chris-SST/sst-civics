id: beziehungen-schweiz-eu-bilaterale-abkommen
lang: it
source_version: 1
question: Su che cosa si basano, in sostanza, le relazioni tra la Svizzera e l'Unione europea (UE)?
options:
  a: Su un pacchetto di accordi bilaterali
  b: Su un governo comune
  c: Sull'adesione della Svizzera all'UE
  d: Su una costituzione comune
explanation: La Svizzera non è membro dell'UE. Le sue relazioni sono disciplinate da numerosi accordi
  bilaterali, cioè trattati tra due partner. Riguardano, ad esempio, il commercio e la libera circolazione
  delle persone.
