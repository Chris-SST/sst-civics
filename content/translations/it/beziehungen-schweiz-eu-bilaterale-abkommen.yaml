    question_de: Worauf beruhen die Beziehungen zwischen der Schweiz und der Europäischen Union (EU) im
      Wesentlichen?
    options_de:
      a: Auf einem Paket bilateraler Abkommen
      b: Auf einer gemeinsamen Regierung
      c: Auf dem Beitritt der Schweiz zur EU
      d: Auf einer gemeinsamen Verfassung
    explanation_de: Die Schweiz ist kein Mitglied der EU. Ihre Beziehungen werden durch zahlreiche bilaterale
      Abkommen geregelt, das heisst durch Verträge zwischen zwei Partnern. Sie betreffen zum Beispiel
      den Handel und die Personenfreizügigkeit.
