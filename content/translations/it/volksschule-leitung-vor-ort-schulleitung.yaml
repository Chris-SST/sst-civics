id: volksschule-leitung-vor-ort-schulleitung
lang: it
source_version: 2
question: Chi dirige direttamente una scuola dell'obbligo (Volksschule) nel Cantone di Zurigo?
options:
  a: Il Consiglio cantonale (Kantonsrat)
  b: La direzione scolastica
  c: Il consiglio dei genitori
  d: Il Consiglio di Stato (Regierungsrat)
explanation: Ogni scuola dell'obbligo nel Cantone di Zurigo ha una direzione scolastica, che gestisce
  e organizza il funzionamento direttamente nella scuola. Il Consiglio di Stato e il Consiglio cantonale
  operano a livello del Cantone. Il consiglio dei genitori porta le richieste dei genitori, ma non dirige
  la scuola.
