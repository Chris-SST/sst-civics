question: Con quale frequenza esce un giornale domenicale in Svizzera?
options:
  a: Una volta alla settimana
  b: Due volte alla settimana
  c: Una volta al mese
  d: Ogni giorno
explanation: Un giornale domenicale esce solo una volta alla settimana, la domenica. I quotidiani, invece,
  escono nella maggior parte dei giorni della settimana. La stampa fa parte della cultura e della formazione
  dell'opinione pubblica nel Paese.
