id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: it
source_version: 1
question: Dove deve registrarsi se si trasferisce in un altro Comune (Gemeinde) del Cantone di Zurigo?
options:
  a: Presso il tribunale distrettuale
  b: Presso l'Ufficio federale di statistica
  c: Presso la polizia cantonale
  d: Presso il controllo abitanti del nuovo Comune di domicilio
explanation: La registrazione avviene presso il controllo abitanti, chiamato anche ufficio di controllo
  degli abitanti. Esso tiene il registro degli abitanti del Comune.
