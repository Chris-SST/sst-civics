id: armee-zustaendigkeit-bund
lang: it
source_version: 1
question: Quale livello dello Stato è competente per l'esercito?
options:
  a: I Cantoni
  b: La Confederazione
  c: I distretti
  d: I Comuni (Gemeinden)
explanation: Il settore militare è di competenza della Confederazione. Essa disciplina l'esercito e i
  suoi compiti nella Costituzione federale e nelle leggi federali. I Cantoni collaborano all'esecuzione,
  ad esempio nel reclutamento.
