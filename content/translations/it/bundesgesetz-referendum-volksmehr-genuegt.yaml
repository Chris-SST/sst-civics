id: bundesgesetz-referendum-volksmehr-genuegt
lang: it
source_version: 1
question: È stato lanciato il referendum facoltativo contro una nuova legge federale. Che cosa serve affinché
  la legge sia accettata nella votazione popolare?
options:
  a: La maggioranza dei votanti in tutta la Svizzera
  b: Una maggioranza di due terzi dei votanti
  c: La maggioranza dei Cantoni da sola
  d: La maggioranza dei votanti e la maggioranza dei Cantoni
explanation: In caso di referendum facoltativo contro una legge federale conta solo la maggioranza del
  popolo (Volksmehr), cioè la maggioranza dei voti validi in tutta la Svizzera. La maggioranza dei Cantoni
  (Ständemehr) è richiesta in aggiunta soltanto per le modifiche della Costituzione federale e per determinati
  trattati internazionali.
