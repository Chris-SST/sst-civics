    question_de: Was ist eine Voraussetzung für das Stimm- und Wahlrecht auf Bundesebene?
    options_de:
      a: Das Schweizer Bürgerrecht
      b: Die Zugehörigkeit zu einer politischen Partei
      c: Mindestens zehn Jahre Wohnsitz in der Schweiz
      d: Eine Niederlassungsbewilligung C
    explanation_de: Auf Bundesebene dürfen nur Personen mit Schweizer Bürgerrecht abstimmen und wählen.
      Ausländerinnen und Ausländer haben auf Bundesebene kein Stimm- und Wahlrecht, auch nicht mit einer
      Niederlassungsbewilligung. Es ist nicht nötig, Mitglied einer Partei zu sein.
