id: stimmrecht-bund-schweizer-buergerrecht
lang: it
source_version: 1
question: Qual è un requisito per il diritto di voto e di eleggibilità a livello federale?
options:
  a: La cittadinanza (Bürgerrecht) svizzera
  b: L'appartenenza a un partito politico
  c: Almeno dieci anni di domicilio in Svizzera
  d: Un permesso di domicilio (permesso C) (Niederlassungsbewilligung) C
explanation: A livello federale possono votare ed eleggere solo le persone con la cittadinanza svizzera.
  Le straniere e gli stranieri non hanno il diritto di voto e di elezione a livello federale, nemmeno
  con un permesso di domicilio. Non è necessario essere membri di un partito.
