id: schienennetz-dichte-weltweit
lang: it
source_version: 1
question: Per che cosa è nota la rete ferroviaria svizzera nel confronto internazionale?
options:
  a: È la rete ferroviaria più fitta del mondo.
  b: È l'unica rete ferroviaria che passa interamente attraverso gallerie.
  c: È la rete ferroviaria più lunga d'Europa.
  d: È la rete ferroviaria più antica del mondo.
explanation: Su una superficie ridotta ci sono moltissime linee ferroviarie e stazioni. Per questo la
  rete svizzera è considerata la più densa del mondo. La densità, tuttavia, non dice nulla sulla lunghezza
  assoluta.
