id: parlament-hauptaufgabe-gesetze-beschliessen
lang: it
source_version: 1
question: Qual è il compito più importante del Parlamento federale?
options:
  a: Dirigere la polizia in tutto il Paese
  b: Decidere nelle controversie tra persone
  c: Discutere e approvare le leggi
  d: Far applicare le leggi nella vita quotidiana
explanation: Il Parlamento è il potere legislativo. Esso discute e adotta le leggi federali. Il Governo
  le attua e i tribunali giudicano nelle controversie.
