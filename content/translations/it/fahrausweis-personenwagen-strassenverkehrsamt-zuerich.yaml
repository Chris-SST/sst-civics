id: fahrausweis-personenwagen-strassenverkehrsamt-zuerich
lang: it
source_version: 1
question: Quale ufficio rilascia nel Cantone di Zurigo la licenza di condurre per autovetture?
options:
  a: Il tribunale di distretto
  b: L'Ufficio della circolazione stradale del Cantone
  c: La polizia municipale del Comune (Gemeinde) di domicilio
  d: L'Ufficio federale delle strade
explanation: Nel Cantone di Zurigo l'Ufficio della circolazione stradale è competente per il rilascio
  delle licenze di condurre. Fa parte della Direzione della sicurezza. I Comuni e la Confederazione non
  rilasciano licenze di condurre.
