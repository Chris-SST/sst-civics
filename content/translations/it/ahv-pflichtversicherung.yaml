id: ahv-pflichtversicherung
lang: it
source_version: 1
question: Quale affermazione sull'assicurazione vecchiaia e superstiti (AHV) è corretta?
options:
  a: L'assicurazione vecchiaia e superstiti fa parte delle assicurazioni obbligatorie.
  b: L'assicurazione vecchiaia e superstiti è un'assicurazione facoltativa per i lavoratori indipendenti.
  c: L'assicurazione vecchiaia e superstiti vale solo per le persone con passaporto svizzero.
  d: L'assicurazione vecchiaia e superstiti è un'assicurazione privata dei datori di lavoro.
explanation: L'assicurazione vecchiaia e superstiti è obbligatoria. Chi abita o lavora in Svizzera è in
  linea di principio assicurato e deve pagare i contributi.
