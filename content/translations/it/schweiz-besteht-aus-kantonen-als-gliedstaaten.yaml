id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: it
source_version: 1
question: Da che cosa è composta la Svizzera come Stato federale?
options:
  a: Da distretti come Stati membri
  b: Da regioni linguistiche come Stati membri
  c: Da Cantoni come Stati membri
  d: Da regioni come Stati membri
explanation: La Svizzera è uno Stato federale. I Cantoni sono i suoi Stati membri e hanno una propria
  costituzione, un proprio parlamento e un proprio governo. I distretti e le regioni non sono Stati membri.
