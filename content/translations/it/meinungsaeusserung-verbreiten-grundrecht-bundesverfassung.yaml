id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: it
source_version: 1
question: Quale diritto fondamentale garantito dalla Costituzione federale permette di esprimere e diffondere
  liberamente la propria opinione?
options:
  a: La libertà di opinione
  b: Il diritto di voto
  c: La garanzia della proprietà
  d: La libertà di domicilio
explanation: La libertà di opinione permette di esprimere e diffondere liberamente la propria opinione.
  È sancita all'articolo 16 della Costituzione federale. Il diritto di voto, invece, riguarda la partecipazione
  alle elezioni e alle votazioni.
