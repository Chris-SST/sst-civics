    question_de: Welches in der Bundesverfassung garantierte Grundrecht erlaubt es, die eigene Meinung
      frei zu äussern und zu verbreiten?
    options_de:
      a: Die Meinungsfreiheit
      b: Das Stimmrecht
      c: Die Eigentumsgarantie
      d: Die Niederlassungsfreiheit
