id: todesstrafe-verfassung-verboten
lang: it
source_version: 1
question: Che cosa vale in Svizzera per la pena di morte secondo la Costituzione federale?
options:
  a: È ammessa solo in caso di omicidio.
  b: È ammessa solo in tempo di guerra.
  c: I Cantoni decidono se è in vigore.
  d: È vietata.
explanation: La Costituzione federale tutela il diritto alla vita all'articolo 10. La pena di morte è
  espressamente vietata, anche per i reati gravi.
