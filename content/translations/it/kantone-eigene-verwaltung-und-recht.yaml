id: kantone-eigene-verwaltung-und-recht
lang: it
source_version: 2
question: Quale delle seguenti è un compito dei Cantoni?
options:
  a: Determinano la politica estera e la moneta della Svizzera.
  b: Emanano le leggi per tutto il Paese.
  c: Dirigono l'esercito e stabiliscono i dazi doganali.
  d: Gestiscono la propria amministrazione ed emanano il diritto cantonale.
explanation: Ogni Cantone ha un proprio governo, un proprio parlamento e una propria amministrazione.
  Emana proprie leggi, che valgono solo nel Cantone, ad esempio per le scuole o la polizia. La politica
  estera, la moneta, l'esercito, i dazi doganali e le leggi per tutta la Svizzera sono di competenza della
  Confederazione.
