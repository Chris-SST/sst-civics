    question_de: Was erhalten die Stimmberechtigten zusammen mit dem Stimmmaterial vor einer eidgenössischen
      Abstimmung, um sich über die Abstimmungsvorlagen informieren zu können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Eine Stellungnahme des Bundesgerichts
      c: Ein Gutachten des eigenen Kantons
      d: Die Wahlliste aller Parteien
    explanation_de: In den Erläuterungen, oft Abstimmungsbüchlein genannt, legt der Bundesrat dar, worum
      es bei jeder Abstimmungsvorlage geht. Darin finden sich auch die Argumente des Initiativkomitees
      oder des Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments. So kann sich
      jede und jeder eine eigene Meinung bilden.
