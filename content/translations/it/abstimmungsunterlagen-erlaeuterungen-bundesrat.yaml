id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: it
source_version: 1
question: Che cosa ricevono gli aventi diritto di voto, insieme al materiale di voto, prima di una votazione
  federale per potersi informare sugli oggetti in votazione?
options:
  a: Le spiegazioni del Consiglio federale (Bundesrat)
  b: Una presa di posizione del Tribunale federale (Bundesgericht)
  c: Una perizia del proprio Cantone
  d: La lista elettorale di tutti i partiti
explanation: Nelle spiegazioni, spesso chiamate opuscolo di voto, il Consiglio federale illustra di che
  cosa tratta ciascun oggetto in votazione. Vi si trovano anche gli argomenti del comitato d'iniziativa
  o del comitato referendario, nonché la raccomandazione del Consiglio federale e del Parlamento. In questo
  modo tutti possono formarsi una propria opinione.
