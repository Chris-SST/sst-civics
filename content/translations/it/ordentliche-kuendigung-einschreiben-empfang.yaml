    question_de: Wie sollte eine ordentliche Kündigung eines Arbeitsverhältnisses zugestellt werden, damit
      der Empfang nachgewiesen werden kann?
    options_de:
      a: Durch eine Mitteilung an die Gemeindeverwaltung
      b: Per Einschreiben, oder die andere Partei bestätigt den Empfang schriftlich
      c: Per einfache E-Mail ohne Bestätigung
      d: Mündlich, in einem Gespräch unter vier Augen
    explanation_de: Mit einem Einschreiben oder einer schriftlichen Empfangsbestätigung kann nachgewiesen
      werden, dass die Kündigung angekommen ist. Das ist wichtig, weil die Kündigungsfristen ab dem Empfang
      laufen.
