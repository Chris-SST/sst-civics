id: ordentliche-kuendigung-einschreiben-empfang
lang: it
source_version: 1
question: Come dovrebbe essere recapitata una disdetta ordinaria di un rapporto di lavoro, in modo da
  poterne dimostrare la ricezione?
options:
  a: Tramite una comunicazione all'amministrazione del Comune (Gemeinde)
  b: Per raccomandata, oppure l'altra parte conferma la ricezione per iscritto
  c: Per semplice e-mail senza conferma
  d: Oralmente, in un colloquio a quattr'occhi
explanation: Con una raccomandata o una conferma scritta di ricezione si può dimostrare che la disdetta
  è arrivata. Questo è importante perché i termini di disdetta decorrono dalla ricezione.
