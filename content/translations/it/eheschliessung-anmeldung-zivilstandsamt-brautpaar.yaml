    question_de: Wer meldet dem Zivilstandsamt die geplante Heirat an?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Die Verlobten gemeinsam
      c: Das Einwohnerkontrollamt der Wohngemeinde, automatisch
      d: Die Eltern der Braut oder des Bräutigams
    explanation_de: Die Verlobten reichen beim Zivilstandsamt gemeinsam das Gesuch um Einleitung des Vorbereitungsverfahrens
      der Eheschliessung ein. Andere Personen können dies nicht an ihrer Stelle tun. Anschliessend prüft
      das Amt die Voraussetzungen für die Eheschliessung.
