id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: it
source_version: 1
question: Chi annuncia all'ufficio dello stato civile il matrimonio previsto?
options:
  a: I testimoni di nozze a nome della coppia
  b: I fidanzati insieme
  c: L'ufficio controllo abitanti del comune di domicilio, automaticamente
  d: I genitori della sposa o dello sposo
explanation: I fidanzati presentano insieme all'ufficio dello stato civile la richiesta di avvio della
  procedura preparatoria del matrimonio. Altre persone non possono farlo al loro posto. In seguito l'ufficio
  verifica i requisiti per il matrimonio.
