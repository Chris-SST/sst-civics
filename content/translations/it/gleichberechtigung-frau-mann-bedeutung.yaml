id: gleichberechtigung-frau-mann-bedeutung
lang: it
source_version: 1
question: Che cosa significa in linea di principio la parità di diritti tra donna e uomo?
options:
  a: In linea di principio, donne e uomini hanno gli stessi diritti.
  b: In ogni ambito della vita, donne e uomini hanno gli stessi doveri, ma diritti diversi.
  c: In ogni professione, donne e uomini guadagnano esattamente lo stesso.
  d: Donne e uomini devono dividersi in parti uguali tutti i compiti in famiglia.
explanation: Parità di diritti significa che, in linea di principio, entrambi i sessi possiedono gli stessi
  diritti. Essa è sancita nella Costituzione federale. Il principio non dice nulla su come le famiglie
  ripartiscano i loro compiti nei dettagli.
