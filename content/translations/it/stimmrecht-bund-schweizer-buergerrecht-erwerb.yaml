id: stimmrecht-bund-schweizer-buergerrecht-erwerb
lang: it
source_version: 1
question: Da quale momento una persona proveniente dall'estero ottiene il diritto di voto e di eleggibilità
  a livello federale?
options:
  a: Non appena ha vissuto per dieci anni in Svizzera.
  b: Non appena ottiene un permesso di domicilio (Niederlassungsbewilligung) (permesso C).
  c: Non appena paga le imposte e lavora in Svizzera.
  d: Non appena ha la cittadinanza (Bürgerrecht) svizzera ed è maggiorenne.
explanation: Il diritto di voto e di elezione a livello federale è legato alla cittadinanza svizzera.
  Un permesso di domicilio, una determinata durata del soggiorno o il pagamento delle imposte non bastano
  a tal fine. Chi viene naturalizzato ed è maggiorenne può partecipare alle elezioni e alle votazioni
  federali.
