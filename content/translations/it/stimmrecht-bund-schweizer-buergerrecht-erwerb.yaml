    question_de: Ab welchem Zeitpunkt erhält eine Person aus dem Ausland auf Bundesebene das Stimm- und
      Wahlrecht?
    options_de:
      a: Sobald sie zehn Jahre in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (Niederlassungsbewilligung) (Bewilligung C) erhält.
      c: Sobald sie in der Schweiz Steuern zahlt und arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht (Bürgerrecht) hat und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Bundesebene ist an das Schweizer Bürgerrecht gebunden.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder die Zahlung von Steuern reichen
      dafür nicht aus. Wer eingebürgert wird und volljährig ist, kann an den eidgenössischen Wahlen und
      Abstimmungen teilnehmen.
