id: gewerkschaften-vertreten-arbeitnehmende-interessen
lang: it
source_version: 1
question: Quali interessi rappresentano i sindacati?
options:
  a: Gli interessi dei datori di lavoro
  b: Gli interessi dei Comuni (Gemeinde)
  c: Gli interessi delle banche
  d: Gli interessi dei lavoratori e delle lavoratrici
explanation: I sindacati si impegnano per le istanze dei lavoratori e delle lavoratrici, ad esempio in
  materia di salari e condizioni di lavoro. Spesso negoziano con i datori di lavoro i contratti collettivi
  di lavoro.
