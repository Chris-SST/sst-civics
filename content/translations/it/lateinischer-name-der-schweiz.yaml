id: lateinischer-name-der-schweiz
lang: it
source_version: 2
question: Come si chiama in latino la Confederazione Svizzera?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: In latino la Svizzera si chiama Confoederatio Helvetica. Da qui deriva l'abbreviazione CH,
  che si vede ad esempio sulle targhe automobilistiche e negli indirizzi Internet (.ch). Si usa il nome
  latino perché è neutrale e non privilegia nessuna delle quattro lingue nazionali.
