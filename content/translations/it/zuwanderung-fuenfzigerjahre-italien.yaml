id: zuwanderung-fuenfzigerjahre-italien
lang: it
source_version: 1
question: Da quale paese proveniva, negli anni Cinquanta, la maggior parte della manodopera immigrata
  in Svizzera?
options:
  a: Dall'Italia
  b: Dalla Turchia
  c: Dal Portogallo
  d: Dalla Spagna
explanation: Negli anni Cinquanta la maggior parte della manodopera immigrata proveniva dall'Italia. All'epoca
  l'economia aveva bisogno di molta manodopera, ad esempio nell'edilizia e nell'industria. In seguito
  sono arrivate anche molte persone da altri paesi.
