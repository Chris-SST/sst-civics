    question_de: Wer kann eine eidgenössische Volksinitiative unterzeichnen?
    options_de:
      a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
      b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung (Bewilligung C)
      c: Nur die Mitglieder einer politischen Partei ab 18 Jahren
      d: Die Schweizer Bürgerinnen und Bürger ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative kann unterzeichnen, wer auf Bundesebene stimmberechtigt
      ist. Dabei handelt es sich um die Schweizerinnen und Schweizer ab 18 Jahren, auch um jene, die im
      Ausland wohnen, wenn sie im Stimmregister eingetragen sind. Ausgeschlossen sind nur die Personen,
      die wegen dauernder Urteilsunfähigkeit unter umfassender Beistandschaft stehen oder durch eine mit
      einem Vorsorgeauftrag bezeichnete Person vertreten werden; die Ausländerinnen und Ausländer haben
      auf Bundesebene keine politischen Rechte, nicht einmal mit der Bewilligung C.
