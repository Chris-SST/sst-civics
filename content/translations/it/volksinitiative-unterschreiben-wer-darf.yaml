id: volksinitiative-unterschreiben-wer-darf
lang: it
source_version: 2
question: Chi può firmare un'iniziativa popolare (Volksinitiative) federale?
options:
  a: Tutte le persone a partire dai 16 anni con domicilio in Svizzera
  b: Tutte le persone a partire dai 18 anni con permesso di domicilio (permesso C) (Niederlassungsbewilligung)
  c: Solo i membri di un partito politico a partire dai 18 anni
  d: Le cittadine e i cittadini svizzeri a partire dai 18 anni
explanation: Può firmare un'iniziativa popolare federale chi ha diritto di voto a livello federale. Si
  tratta delle Svizzere e degli Svizzeri a partire dai 18 anni, anche di quelli residenti all'estero,
  se sono iscritti nel catalogo elettorale. Sono esclusi soltanto le persone che, a causa di incapacità
  di discernimento durevole, sono sotto curatela generale o sono rappresentate da una persona designata
  con mandato precauzionale; le straniere e gli stranieri non hanno diritti politici a livello federale,
  nemmeno con il permesso C.
