    question_de: Was besagt die Bundesverfassung über die Folter?
    options_de:
      a: Die Folter ist nur für Straftäter verboten.
      b: Die Folter ist der Polizei in Notsituationen erlaubt.
      c: Die Folter ist erlaubt, wenn ein Gericht einverstanden ist.
      d: Niemand darf gefoltert werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet die Folter und jede andere Art grausamer,
      unmenschlicher oder erniedrigender Behandlung. Dieses Verbot gilt für alle Personen ohne Ausnahme.
      Nicht einmal der Staat kann Ausnahmen machen.
