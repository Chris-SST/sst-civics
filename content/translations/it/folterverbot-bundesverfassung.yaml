id: folterverbot-bundesverfassung
lang: it
source_version: 1
question: Che cosa afferma la Costituzione federale sulla tortura?
options:
  a: La tortura è vietata solo per i autori di reati.
  b: La tortura è consentita alla polizia in situazioni di emergenza.
  c: La tortura è consentita se un tribunale è d'accordo.
  d: Nessuno può essere torturato.
explanation: L'articolo 10 della Costituzione federale vieta la tortura e qualsiasi altro tipo di trattamento
  crudele, inumano o degradante. Questo divieto vale per tutte le persone senza eccezione. Nemmeno lo
  Stato può fare eccezioni.
