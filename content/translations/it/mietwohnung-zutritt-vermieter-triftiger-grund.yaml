    question_de: In welchem Fall müssen die Mieter dem Vermieter den Zutritt zur Wohnung gewähren?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein triftiger Grund vorliegt
      c: Nur wenn der Vermieter es verlangt, ohne Begründung
      d: Jederzeit und ohne Vorankündigung
    explanation_de: Die Mieter müssen den Zutritt gewähren, wenn ein triftiger Grund vorliegt, zum Beispiel
      eine dringende Reparatur. Der Vermieter muss den Besuch jedoch rechtzeitig ankündigen und auf die
      Mieter Rücksicht nehmen. Der Zutritt ohne Grund ist nicht erlaubt.
