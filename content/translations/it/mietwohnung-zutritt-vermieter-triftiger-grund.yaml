id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: it
source_version: 1
question: In quale caso gli inquilini devono consentire al locatore l'accesso all'abitazione?
options:
  a: Mai, l'abitazione è sempre protetta
  b: Quando sussiste un motivo valido
  c: Solo se il locatore lo richiede, senza motivazione
  d: In qualsiasi momento e senza preavviso
explanation: Gli inquilini devono consentire l'accesso se sussiste un motivo valido, ad esempio una riparazione
  urgente. Il locatore deve però annunciare la visita per tempo e avere riguardo per gli inquilini. L'accesso
  senza motivo non è consentito.
