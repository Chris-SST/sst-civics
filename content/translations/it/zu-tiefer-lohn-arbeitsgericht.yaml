id: zu-tiefer-lohn-arbeitsgericht
lang: it
source_version: 1
question: Una lavoratrice riceve ingiustificatamente un salario troppo basso. A quale ufficio può rivolgersi?
options:
  a: Il Centro regionale di collocamento (RAV)
  b: L'Ufficio federale di statistica
  c: Il tribunale del lavoro
  d: L'assemblea comunale (Gemeindeversammlung)
explanation: In caso di controversie derivanti dal rapporto di lavoro, ad esempio a causa di un salario
  troppo basso, è competente il tribunale del lavoro. Il RAV aiuta nella ricerca di un impiego e non nelle
  controversie salariali.
