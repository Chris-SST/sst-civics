id: sonderbundskrieg-1847-konfliktparteien
lang: it
source_version: 1
question: Tra chi fu combattuta in Svizzera, nel 1847, la guerra del Sonderbund?
options:
  a: Tra i Cantoni di lingua tedesca e i Cantoni di lingua francese
  b: Tra le forze liberali e i Cantoni cattolici
  c: Tra Cantoni urbani e Cantoni rurali a causa delle imposte
  d: Tra la Svizzera e la Francia
explanation: Nel Sonderbund si erano uniti diversi Cantoni cattolico-conservatori. Le forze liberali volevano
  una Confederazione più forte. La breve guerra si concluse con la vittoria del fronte liberale e aprì
  la strada allo Stato federale del 1848.
