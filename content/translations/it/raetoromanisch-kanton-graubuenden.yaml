question: In quale Cantone si parla il romancio?
options:
  a: Nel Cantone di Friburgo
  b: Nel Cantone Ticino
  c: Nel Cantone Vallese
  d: Nel Cantone dei Grigioni
explanation: Il romancio è la quarta lingua nazionale della Svizzera. Si parla nel Cantone dei Grigioni.
