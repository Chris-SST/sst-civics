id: juengster-kanton-der-schweiz
lang: it
source_version: 1
question: Quale Cantone è il più giovane della Svizzera?
options:
  a: Giura
  b: Appenzello Esterno
  c: Basilea Campagna
  d: Neuchâtel
explanation: Il Cantone Giura è stato fondato nel 1979. Si è separato dal Cantone Berna e da allora è
  il più giovane dei 26 Cantoni. La Costituzione federale lo menziona tra i Cantoni della Confederazione
  Svizzera.
