id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: it
source_version: 1
question: Chi decide in via definitiva, a livello federale, in una votazione se un'iniziativa popolare
  (Volksinitiative) o un referendum viene accettato?
options:
  a: L'Assemblea federale (Bundesversammlung) in una seduta comune delle due Camere
  b: Il Consiglio federale (Bundesrat) dopo aver sentito i governi cantonali
  c: Il Tribunale federale (Bundesgericht) dopo un esame giuridico del progetto
  d: Gli aventi diritto di voto, che votano alle urne o per corrispondenza
explanation: Nelle iniziative popolari e nei referendum, gli aventi diritto di voto hanno l'ultima parola.
  Decidono nella votazione popolare alle urne, che in Svizzera è possibile anche per corrispondenza. Il
  Consiglio federale, il Parlamento e il Tribunale federale non possono sostituire il risultato.
