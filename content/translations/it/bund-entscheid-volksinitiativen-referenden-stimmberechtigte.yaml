    question_de: Wer entscheidet auf Bundesebene in einer Abstimmung endgültig, ob eine Volksinitiative
      oder ein Referendum angenommen wird?
    options_de:
      a: Die Bundesversammlung in einer gemeinsamen Sitzung der beiden Kammern
      b: Der Bundesrat nach Anhörung der Kantonsregierungen
      c: Das Bundesgericht nach einer rechtlichen Prüfung der Vorlage
      d: Die Stimmberechtigten, die an der Urne oder brieflich abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die Stimmberechtigten das letzte Wort. Sie
      entscheiden in der Volksabstimmung an der Urne, die in der Schweiz auch brieflich möglich ist. Der
      Bundesrat, das Parlament und das Bundesgericht können das Ergebnis nicht ersetzen.
