question: Come si chiama il governo del Cantone di Zurigo?
options:
  a: Tribunale superiore (Obergericht)
  b: Consiglio cantonale (Kantonsrat)
  c: Consiglio federale (Bundesrat)
  d: Consiglio di Stato (Regierungsrat)
explanation: Il governo del Cantone di Zurigo si chiama Consiglio di Stato. Il Consiglio cantonale è il
  parlamento, il Tribunale superiore appartiene al potere giudiziario.
