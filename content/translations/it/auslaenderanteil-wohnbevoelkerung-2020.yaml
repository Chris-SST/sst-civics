id: auslaenderanteil-wohnbevoelkerung-2020
lang: it
source_version: 2
question: Quanto era grande approssimativamente, nel 2020, la quota di stranieri e straniere sulla popolazione
  residente permanente della Svizzera?
options:
  a: circa tre quinti
  b: circa un decimo
  c: circa la metà
  d: circa un quarto
explanation: Nel 2020 circa un quarto della popolazione residente permanente non aveva il passaporto svizzero.
  Alla fine del 2020 erano circa 2,2 su 8,7 milioni di persone, cioè circa il 25 per cento. Rispetto ad
  altri Paesi in Europa, questa quota è elevata.
