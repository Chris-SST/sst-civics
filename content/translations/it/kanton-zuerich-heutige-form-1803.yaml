question: In quale anno è nato il Cantone di Zurigo nella sua forma attuale?
options:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
explanation: Il Cantone di Zurigo è stato creato nella sua forma attuale nel 1803 con l'Atto di Mediazione.
  Il giubileo è stato celebrato nel 2003 come 200 anni del Cantone di Zurigo. Nel 1848 è nato l'attuale
  Stato federale.
