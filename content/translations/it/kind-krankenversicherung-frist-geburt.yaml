id: kind-krankenversicherung-frist-geburt
lang: it
source_version: 1
question: Entro quale termine dalla nascita deve essere stipulata un'assicurazione malattie per un bambino
  domiciliato in Svizzera?
options:
  a: entro 12 mesi
  b: entro 3 mesi
  c: entro 14 giorni
  d: entro 6 mesi
explanation: I genitori devono stipulare un'assicurazione malattie per il bambino entro tre mesi dalla
  nascita. Se il termine viene rispettato, la copertura assicurativa vale con effetto retroattivo dalla
  nascita.
