id: frauenstimmrecht-national-1971
lang: it
source_version: 2
question: Da quale anno le donne in Svizzera possono votare ed eleggere a livello federale?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: Nel 1971 gli uomini svizzeri hanno approvato in una votazione popolare il diritto di voto
  delle donne a livello federale. Da allora le donne possono votare, partecipare alle votazioni ed essere
  elette a livello nazionale. I Cantoni hanno introdotto il diritto di voto delle donne in momenti diversi,
  alcuni già prima del 1971, mentre Appenzello Interno, ultimo Cantone, solo nel 1990.
