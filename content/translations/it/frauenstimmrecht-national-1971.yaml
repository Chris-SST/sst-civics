    question_de: Ab welchem Jahr können Frauen in der Schweiz auf Bundesebene abstimmen und wählen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: 1971 haben die Schweizer Männer in einer Volksabstimmung das Stimmrecht der Frauen
      auf Bundesebene angenommen. Seither können Frauen auf nationaler Ebene abstimmen, an den Abstimmungen
      teilnehmen und gewählt werden. Die Kantone haben das Frauenstimmrecht zu unterschiedlichen Zeitpunkten
      eingeführt, einige schon vor 1971, während Appenzell Innerrhoden als letzter Kanton es erst 1990
      einführte.
