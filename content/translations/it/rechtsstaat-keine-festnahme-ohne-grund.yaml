    question_de: Was gilt für die Verhaftung und die Haft in einem Rechtsstaat?
    options_de:
      a: Der Staat darf niemanden ohne Grund verhaften oder einsperren.
      b: Der Staat darf Personen nach eigenem Ermessen festhalten.
      c: Die Regierung darf Kritiker vorsorglich ins Gefängnis stecken.
      d: Nur Ausländer und Ausländerinnen dürfen ohne Grund verhaftet werden.
    explanation_de: In einem Rechtsstaat ist das Handeln des Staates an das Recht gebunden. Eine Verhaftung
      oder eine Haft erfordert einen im Gesetz vorgesehenen Grund. Dies schützt die Freiheit der Personen
      vor Willkür.
