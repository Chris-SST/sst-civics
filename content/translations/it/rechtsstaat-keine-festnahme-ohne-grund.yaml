id: rechtsstaat-keine-festnahme-ohne-grund
lang: it
source_version: 1
question: Che cosa vale per l'arresto e la detenzione in uno Stato di diritto?
options:
  a: Lo Stato non può arrestare né incarcerare nessuno senza un motivo.
  b: Lo Stato può trattenere le persone a propria discrezione.
  c: Il governo può mettere in carcere preventivamente i critici.
  d: Solo gli stranieri e le straniere possono essere arrestati senza motivo.
explanation: In uno Stato di diritto l'azione dello Stato è vincolata al diritto. Un arresto o una detenzione
  richiede un motivo previsto dalla legge. Ciò protegge la libertà delle persone dall'arbitrio.
