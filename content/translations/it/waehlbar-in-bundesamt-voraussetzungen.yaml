    question_de: Wer kann in den Nationalrat, in den Bundesrat oder in das Bundesgericht gewählt werden?
    options_de:
      a: Nur wer eine universitäre Ausbildung abgeschlossen hat
      b: Nur wer seit mindestens zehn Jahren in der Schweiz lebt
      c: Nur wer Mitglied einer politischen Partei ist
      d: Alle Schweizerinnen und Schweizer mit Stimmrecht ab 18 Jahren
    explanation_de: Gemäss der Bundesverfassung sind alle Personen mit Stimmrecht wählbar. Stimmberechtigt
      sind die Schweizerinnen und Schweizer ab 18 Jahren. Weder die Zugehörigkeit zu einer Partei noch
      eine bestimmte Ausbildung sind erforderlich.
