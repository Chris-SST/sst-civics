id: waehlbar-in-bundesamt-voraussetzungen
lang: it
source_version: 2
question: Chi può essere eletto nel Consiglio nazionale (Nationalrat), nel Consiglio federale (Bundesrat)
  o nel Tribunale federale (Bundesgericht)?
options:
  a: Solo chi ha concluso una formazione universitaria
  b: Solo chi vive in Svizzera da almeno dieci anni
  c: Solo chi è membro di un partito politico
  d: Tutti gli svizzeri e le svizzere con diritto di voto a partire dai 18 anni
explanation: Secondo la Costituzione federale, tutte le persone con diritto di voto sono eleggibili. Hanno
  diritto di voto gli svizzeri e le svizzere a partire dai 18 anni. Non sono necessarie né l'appartenenza
  a un partito né una determinata formazione.
