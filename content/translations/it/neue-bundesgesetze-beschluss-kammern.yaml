id: neue-bundesgesetze-beschluss-kammern
lang: it
source_version: 1
question: Chi decide la maggior parte delle nuove leggi federali?
options:
  a: Il Tribunale federale (Bundesgericht)
  b: Il Consiglio federale (Bundesrat) da solo
  c: I parlamenti cantonali
  d: Il Consiglio nazionale (Nationalrat) e il Consiglio degli Stati (Ständerat)
explanation: La maggior parte delle nuove leggi federali è adottata da entrambe le camere del Parlamento.
  Il Consiglio federale prepara i progetti, ma non decide da solo. Contro una legge il popolo può richiedere
  un referendum.
