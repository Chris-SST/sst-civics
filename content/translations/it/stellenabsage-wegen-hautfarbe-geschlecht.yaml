id: stellenabsage-wegen-hautfarbe-geschlecht
lang: it
source_version: 2
question: Una donna si candida per un posto di lavoro. Viene respinta soltanto perché è una donna. Quale
  diritto fondamentale viene così violato?
options:
  a: La libertà di domicilio
  b: La libertà di riunione
  c: La parità giuridica e il divieto di discriminazione
  d: La protezione della sfera privata
explanation: L'articolo 8 della Costituzione federale stabilisce che tutti gli esseri umani sono uguali
  davanti alla legge e che donna e uomo hanno gli stessi diritti. Nessuno può essere discriminato, ad
  esempio a causa dell'origine, della razza o del sesso. Chi respinge una candidata soltanto a causa del
  suo sesso viola quindi la parità giuridica e il divieto di discriminazione.
