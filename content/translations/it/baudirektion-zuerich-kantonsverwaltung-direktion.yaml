id: baudirektion-zuerich-kantonsverwaltung-direktion
lang: it
source_version: 1
question: Quale dei seguenti uffici è una direzione dell'amministrazione del Cantone di Zurigo?
options:
  a: La direzione del Comune (Gemeinde)
  b: La Direzione delle costruzioni
  c: La direzione della città
  d: La direzione della Confederazione
explanation: La Direzione delle costruzioni è una delle direzioni dell'amministrazione del Cantone di
  Zurigo. L'amministrazione cantonale è suddivisa in diverse direzioni, ciascuna delle quali è diretta
  da un membro del Consiglio di Stato (Regierungsrat).
