    question_de: Auf welche Weise beeinflussen die Stimmberechtigten in der Schweiz die Gesetzgebung des
      Bundes direkt?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über die neuen Gesetze entscheiden.
      c: Sie ernennen die Bundesräte, die die neuen Gesetze erlassen.
      d: Sie entscheiden die Gesetze selbst in der Bundesversammlung.
    explanation_de: Die Stimmberechtigten nehmen an den Volksabstimmungen über Initiativen und Referenden
      teil und beteiligen sich dabei an der Entscheidung. Auf diese Weise wirken sie zwischen einer Wahl
      und der nächsten direkt an der Gesetzgebung mit. Dies ist ein Merkmal der direkten Demokratie.
