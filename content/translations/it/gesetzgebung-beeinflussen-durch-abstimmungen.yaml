id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: it
source_version: 1
question: In che modo le persone con diritto di voto in Svizzera influenzano direttamente la legislazione
  della Confederazione?
options:
  a: Votano alle urne su iniziative e referendum.
  b: Eleggono i giudici che decidono sulle nuove leggi.
  c: Nominano i consiglieri federali che emanano le nuove leggi.
  d: Decidono loro stessi le leggi in seno all'Assemblea federale (Bundesversammlung).
explanation: Le persone con diritto di voto partecipano alle votazioni popolari su iniziative e referendum
  e vi prendono parte alla decisione. In questo modo, tra un'elezione e l'altra, collaborano direttamente
  alla legislazione. Questa è una caratteristica della democrazia diretta.
