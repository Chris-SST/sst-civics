id: gemeinden-finanzieren-sozialhilfe
lang: it
source_version: 1
question: Chi finanzia l'aiuto sociale per le persone in situazione di emergenza nel Cantone di Zurigo?
options:
  a: Le Chiese da sole
  b: La Banca nazionale svizzera
  c: Le associazioni dei datori di lavoro
  d: I Comuni (Gemeinden)
explanation: Nel Cantone di Zurigo i Comuni sono competenti per l'aiuto sociale e ne sostengono i costi.
  Ciò può gravare pesantemente sui Comuni più piccoli. Per questo motivo esiste la perequazione finanziaria.
