id: bahnunternehmen-der-schweiz-erkennen
lang: it
source_version: 2
question: Quali delle seguenti sigle designano tutte imprese ferroviarie della Svizzera?
options:
  a: SOB, SEM, BLS e SZU
  b: SBB, BLS, SOB e SZU
  c: SBB, SRF, SOB e SUVA
  d: BLS, SZU, SNB e SBB
explanation: SBB, BLS, SOB e SZU sono imprese ferroviarie che gestiscono treni in Svizzera. Le SBB sono
  la più grande impresa, le altre sono ferrovie più piccole, spesso attive a livello regionale. Le altre
  sigle designano organizzazioni come la Banca nazionale (SNB), la Segreteria di Stato della migrazione
  (SEM) o l'assicurazione contro gli infortuni (SUVA).
