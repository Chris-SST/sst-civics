id: wallis-gebirgskanton-alpen
lang: it
source_version: 1
question: Quale di questi Cantoni è fortemente caratterizzato dalla montagna?
options:
  a: Basilea Città
  b: Vallese
  c: Turgovia
  d: Ginevra
explanation: Nel Vallese si trovano molte alte cime alpine, tra cui la Punta Dufour, la montagna più alta
  della Svizzera. La Turgovia, Basilea Città e Ginevra si trovano piuttosto in pianura o presso laghi
  e fiumi.
