    question_de: Was können die Stimmberechtigten mit einem Referendum erreichen?
    options_de:
      a: Sie können persönlich ein neues Gesetz schreiben und in Kraft treten lassen.
      b: Sie können ein vom Parlament verabschiedetes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates abberufen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Mit einem Referendum können die Stimmberechtigten verlangen, dass ein vom Parlament
      verabschiedetes Gesetz zur Abstimmung vorgelegt wird. Lehnt das Volk das Gesetz ab, tritt es nicht
      in Kraft.
