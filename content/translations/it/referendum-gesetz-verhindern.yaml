id: referendum-gesetz-verhindern
lang: it
source_version: 1
question: Che cosa possono ottenere gli aventi diritto di voto con un referendum?
options:
  a: Possono scrivere personalmente una nuova legge e farla entrare in vigore.
  b: Possono impedire una legge approvata dal Parlamento.
  c: Possono revocare i membri del Consiglio federale (Bundesrat).
  d: Possono sciogliere il Parlamento e chiedere nuove elezioni.
explanation: Con un referendum gli aventi diritto di voto possono chiedere che una legge approvata dal
  Parlamento sia sottoposta a votazione. Se il popolo respinge la legge, questa non entra in vigore.
