id: vereinsgruendung-offen-fuer-jede-person
lang: it
source_version: 1
question: Chi può fondare un'associazione in Svizzera?
options:
  a: Solo le persone domiciliate nel Comune (Gemeinde)
  b: Ogni persona
  c: Solo i cittadini svizzeri
  d: Solo le persone con un permesso di domicilio (permesso C) (Niederlassungsbewilligung)
explanation: In Svizzera la fondazione di un'associazione è aperta a ogni persona. La libertà di associazione
  è garantita dalla Costituzione federale. La cittadinanza o lo statuto di dimora non hanno alcuna importanza
  al riguardo.
