question: Quale nota organizzazione umanitaria è stata fondata a Ginevra nel 1863?
options:
  a: Le Nazioni Unite (ONU)
  b: L'Organizzazione mondiale della sanità (OMS)
  c: Il Programma alimentare mondiale (PAM)
  d: Il Comitato internazionale della Croce Rossa (CICR)
explanation: Il CICR è nato a Ginevra nel 1863, tra l'altro su iniziativa di Henry Dunant. Rappresenta
  la tradizione umanitaria della Svizzera. Le altre organizzazioni sono state fondate più tardi.
