id: arbeitszeugnis-bedeutung
lang: it
source_version: 1
question: Che cos'è un certificato di lavoro?
options:
  a: Un certificato del medico che attesta che non si può lavorare
  b: Un documento del datore di lavoro che valuta le prestazioni e il comportamento della persona impiegata
  c: Il permesso dell'ufficio della migrazione per lavorare in Svizzera
  d: Il certificato di salario annuale per la dichiarazione d'imposta
explanation: Il certificato di lavoro viene rilasciato dal datore di lavoro. Descrive il tipo e la durata
  dell'attività e valuta le prestazioni e il comportamento. I dipendenti possono richiederlo in qualsiasi
  momento.
