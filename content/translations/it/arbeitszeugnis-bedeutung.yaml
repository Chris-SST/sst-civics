    question_de: Was ist ein Arbeitszeugnis?
    options_de:
      a: Ein ärztliches Zeugnis, das bescheinigt, dass man nicht arbeiten kann
      b: Ein Dokument des Arbeitgebers, das die Leistungen und das Verhalten der angestellten Person beurteilt
      c: Die Bewilligung des Migrationsamtes, in der Schweiz zu arbeiten
      d: Der jährliche Lohnausweis für die Steuererklärung
    explanation_de: Das Arbeitszeugnis wird vom Arbeitgeber ausgestellt. Es beschreibt die Art und die
      Dauer der Tätigkeit und beurteilt die Leistungen und das Verhalten. Die Angestellten können es jederzeit
      verlangen.
