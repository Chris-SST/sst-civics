id: mietvertrag-rechte-pflichten-regeln
lang: it
source_version: 1
question: Che cosa viene stabilito in un contratto di locazione?
options:
  a: I diritti dei vicini nello stabile
  b: L'ammontare delle imposte dei locatari
  c: Gli obblighi del Comune (Gemeinde) nei confronti dei locatari
  d: I diritti e gli obblighi dei locatori e dei locatari
explanation: Il contratto di locazione disciplina il rapporto tra la persona che dà in locazione e la
  persona che prende in locazione. Ne fanno parte, per esempio, la pigione e la durata della locazione.
  Il Codice delle obbligazioni contiene le relative norme di legge.
