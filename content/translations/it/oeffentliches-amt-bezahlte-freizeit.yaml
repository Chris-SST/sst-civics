id: oeffentliches-amt-bezahlte-freizeit
lang: it
source_version: 3
question: Una dipendente o un dipendente svolge, oltre al lavoro, una carica pubblica, ad esempio nell'autorità
  scolastica del Comune (Gemeinde). Che cosa concede normalmente il datore di lavoro per questo?
options:
  a: Un bonus sullo stipendio
  b: Una promozione
  c: Tempo libero retribuito
  d: Niente, per la carica si devono prendere le ferie
explanation: Chi svolge una carica pubblica riceve di regola dal datore di lavoro tempo libero retribuito.
  Quanto tempo esattamente dipende dal contratto di lavoro, dal contratto collettivo di lavoro o da altre
  disposizioni. Per una carica non sono previsti né un bonus né una promozione e normalmente non si devono
  nemmeno prendere le ferie.
