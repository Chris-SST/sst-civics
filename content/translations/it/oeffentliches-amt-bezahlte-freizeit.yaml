    source_version: 3
    question_de: Eine Angestellte oder ein Angestellter übt neben der Arbeit ein öffentliches Amt aus,
      zum Beispiel in der Schulbehörde der Gemeinde. Was gewährt der Arbeitgeber dafür normalerweise?
    options_de:
      a: Einen Bonus auf den Lohn
      b: Eine Beförderung
      c: Bezahlte Freizeit
      d: Nichts, für das Amt müssen Ferien genommen werden
    explanation_de: Wer ein öffentliches Amt ausübt, erhält in der Regel vom Arbeitgeber bezahlte Freizeit.
      Wie viel genau, hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von anderen Bestimmungen
      ab. Für ein Amt sind weder ein Bonus noch eine Beförderung vorgesehen und normalerweise müssen auch
      keine Ferien genommen werden.
