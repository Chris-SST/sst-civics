    question_de: Mit welchem Ereignis beginnt im Kanton Zürich die Schulpflicht eines Kindes?
    options_de:
      a: Mit dem Eintritt in die Sekundarschule
      b: Mit dem Eintritt in die Primarschule
      c: Mit dem Eintritt in die Spielgruppe
      d: Mit dem Eintritt in den Kindergarten
    explanation_de: Im Kanton Zürich ist der Kindergarten Teil der obligatorischen Schule (Volksschule).
      Die Schulpflicht beginnt somit bereits mit dem Eintritt in den Kindergarten. Die Spielgruppe ist
      freiwillig.
