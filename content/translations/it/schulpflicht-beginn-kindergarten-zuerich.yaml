id: schulpflicht-beginn-kindergarten-zuerich
lang: it
source_version: 1
question: Con quale evento inizia, nel Cantone di Zurigo, l'obbligo scolastico di un bambino?
options:
  a: Con l'ingresso nella scuola secondaria
  b: Con l'ingresso nella scuola elementare
  c: Con l'ingresso nel gruppo di gioco
  d: Con l'ingresso nella scuola dell'infanzia
explanation: Nel Cantone di Zurigo la scuola dell'infanzia fa parte della scuola dell'obbligo (Volksschule).
  L'obbligo scolastico inizia quindi già con l'ingresso nella scuola dell'infanzia. Il gruppo di gioco
  è facoltativo.
