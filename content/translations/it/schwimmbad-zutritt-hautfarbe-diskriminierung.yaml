id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: it
source_version: 1
question: Una piscina pubblica rifiuta l'ingresso a una persona a causa del colore della sua pelle. Quale
  principio della Costituzione federale viene così violato?
options:
  a: La libertà economica
  b: Il divieto di discriminazione
  c: Il diritto di voto
  d: Il diritto al matrimonio e alla famiglia
explanation: La Costituzione federale vieta all'articolo 8 la discriminazione, ad esempio a causa dell'origine
  o della razza. Per questo nessuno può essere trattato peggio degli altri.
