id: pfahlbauten-am-zuerichsee-vorgeschichte
lang: it
source_version: 1
question: Come erano costruiti gli insediamenti preistorici sul lago di Zurigo?
options:
  a: Come grotte nella roccia
  b: Come palafitte, cioè case su pali
  c: Come case di mattoni nei villaggi
  d: Come castelli sulle rocce
explanation: In epoca preistorica, sulle rive del lago di Zurigo sorgevano palafitte, cioè case su pali.
  Resti di queste costruzioni si trovano ancora oggi sott'acqua e vengono studiati da archeologi subacquei.
