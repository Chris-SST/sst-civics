    question_de: Wer entscheidet in der Regel im Kanton Zürich über das Baugesuch für ein neues Wohnhaus?
    options_de:
      a: Der Regierungsrat
      b: Die Baubehörde der Gemeinde
      c: Das Bezirksgericht
      d: Das Bundesamt für Raumentwicklung
    explanation_de: Baugesuche für Wohnhäuser werden bei der Gemeinde eingereicht. Die kommunale Baubehörde
