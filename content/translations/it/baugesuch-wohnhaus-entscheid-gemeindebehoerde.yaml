id: baugesuch-wohnhaus-entscheid-gemeindebehoerde
lang: it
source_version: 1
question: Chi decide, di regola, nel Cantone di Zurigo sulla domanda di costruzione per una nuova casa
  d'abitazione?
options:
  a: Il Consiglio di Stato (Regierungsrat)
  b: L'autorità edilizia del Comune (Gemeinde)
  c: Il tribunale distrettuale
  d: L'Ufficio federale dello sviluppo territoriale
explanation: Le domande di costruzione per case d'abitazione si presentano al Comune. L'autorità edilizia
  comunale esamina la domanda e rilascia il permesso di costruzione oppure lo nega. Il Cantone è coinvolto
  solo in casi particolari.
