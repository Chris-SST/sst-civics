id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: it
source_version: 1
question: Quale diritto fondamentale protegge la libertà di formarsi una propria opinione e di informarsi
  da fonti accessibili a tutti?
options:
  a: La libertà di domicilio
  b: La libertà di opinione e di informazione
  c: La libertà economica
  d: La libertà di riunione
explanation: La Costituzione federale protegge la libertà di opinione e di informazione all'articolo 16.
  Ogni persona può procurarsi liberamente informazioni da fonti accessibili a tutti. Questa è un'importante
  base della democrazia.
