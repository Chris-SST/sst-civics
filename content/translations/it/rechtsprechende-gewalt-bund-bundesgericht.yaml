    question_de: Welche Behörde ist auf Bundesebene das oberste rechtsprechende Organ der Schweiz?
    options_de:
      a: Die Bundeskanzlei
      b: Der Bundesrat
      c: Die Bundesversammlung
      d: Das Bundesgericht
    explanation_de: Die Bundesverfassung überträgt die richterliche Gewalt des Bundes dem Bundesgericht.
      Es ist die oberste rechtsprechende Behörde des Bundes. Der Bundesrat und die Bundesversammlung üben
      jeweils die vollziehende beziehungsweise die gesetzgebende Gewalt aus.
