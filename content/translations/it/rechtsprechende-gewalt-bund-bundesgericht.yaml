id: rechtsprechende-gewalt-bund-bundesgericht
lang: it
source_version: 1
question: Quale autorità è, a livello federale, l'organo giurisdizionale supremo della Svizzera?
options:
  a: La Cancelleria federale (Bundeskanzlei)
  b: Il Consiglio federale (Bundesrat)
  c: L'Assemblea federale (Bundesversammlung)
  d: Il Tribunale federale (Bundesgericht)
explanation: La Costituzione federale attribuisce il potere giudiziario della Confederazione al Tribunale
  federale. Esso è l'autorità giurisdizionale suprema della Confederazione. Il Consiglio federale e l'Assemblea
  federale esercitano rispettivamente il potere esecutivo e quello legislativo.
