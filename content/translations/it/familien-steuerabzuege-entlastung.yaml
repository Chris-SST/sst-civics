id: familien-steuerabzuege-entlastung
lang: it
source_version: 1
question: In che modo le famiglie vengono alleggerite dal punto di vista fiscale?
options:
  a: Le famiglie non pagano imposte.
  b: Le famiglie possono far valere deduzioni fiscali.
  c: Le famiglie non devono compilare la dichiarazione d'imposta.
  d: Le famiglie pagano soltanto l'imposta sul valore aggiunto.
explanation: Le famiglie possono far valere, ad esempio, deduzioni per i figli o per la custodia dei figli.
  In questo modo si riduce il reddito imponibile e, di conseguenza, anche l'imposta.
