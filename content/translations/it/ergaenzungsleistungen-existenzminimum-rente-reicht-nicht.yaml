id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
lang: it
source_version: 1
question: Chi può ricevere prestazioni complementari in Svizzera?
options:
  a: Le persone che hanno perso il lavoro e percepiscono indennità di disoccupazione
  b: Tutte le persone di età superiore a 50 anni
  c: Le persone la cui rendita dell'assicurazione vecchiaia e superstiti (AVS) (AHV) o dell'assicurazione
    per l'invalidità (AI) (IV) non copre il minimo vitale
  d: Tutte le persone che percepiscono l'aiuto sociale
explanation: Le prestazioni complementari aiutano le persone per le quali la rendita AVS o AI e il resto
  del reddito non bastano per vivere. Sono un diritto legale e non un aiuto sociale. Vengono versate in
  aggiunta alla rendita.
