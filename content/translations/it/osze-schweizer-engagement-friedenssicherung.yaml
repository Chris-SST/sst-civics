id: osze-schweizer-engagement-friedenssicherung
lang: it
source_version: 2
question: Per che cosa si impegna la Svizzera nell'Organizzazione per la sicurezza e la cooperazione in
  Europa (OSCE)?
options:
  a: Per la pace e la sicurezza in Europa, ad esempio nell'Europa orientale e in Asia centrale
  b: Per la distribuzione di fondi di sostegno nell'Europa occidentale
  c: Per l'introduzione di una moneta comune
  d: Per la riduzione dei dazi doganali nel commercio mondiale
explanation: La Svizzera è membro fondatore dell'OSCE e se ne serve per promuovere la pace e la sicurezza
  in Europa. L'OSCE è attiva con missioni sul campo in particolare nell'Europa orientale e sudorientale
  e in Asia centrale. Nel 2026 la Svizzera detiene la presidenza dell'OSCE.
