question: Quale novità portarono i Romani a Zurigo?
options:
  a: La stampa a caratteri mobili
  b: Le corporazioni
  c: La cultura dei bagni
  d: La Riforma
explanation: I Romani introdussero a Zurigo la cultura dei bagni, cioè i bagni pubblici sul modello romano.
