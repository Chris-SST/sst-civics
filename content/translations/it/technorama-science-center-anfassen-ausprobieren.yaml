question: In quale istituzione del Cantone di Zurigo i visitatori possono toccare con mano e provare personalmente
  fenomeni scientifici e tecnici?
options:
  a: Nell'Opernhaus Zürich (Teatro dell'Opera di Zurigo)
  b: Nel Technorama di Winterthur
  c: Nel Landesmuseum Zürich (Museo nazionale svizzero di Zurigo)
  d: Nel Kunsthaus Zürich (Museo d'arte di Zurigo)
explanation: Il Technorama di Winterthur è uno Science Center. I visitatori vi sperimentano personalmente
  con gli oggetti esposti. Il Kunsthaus, il Landesmuseum e l'Opernhaus presentano arte, storia e spettacoli.
