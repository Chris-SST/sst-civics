id: auswanderung-19-jahrhundert-grund-not
lang: it
source_version: 1
question: Nel XIX secolo molte persone lasciarono la Svizzera ed emigrarono, ad esempio, in America. Quale
  fu un motivo importante?
options:
  a: La miseria e la mancanza di lavoro minacciavano la loro esistenza.
  b: La Confederazione vietava loro di risiedere in Svizzera.
  c: La Svizzera non aveva abbastanza spazio per le fabbriche.
  d: All'estero non c'erano tasse per i nuovi arrivati.
explanation: Nel XIX secolo la Svizzera era ancora un Paese di emigrazione. Carestie, povertà e mancanza
  di lavoro spinsero molte persone a cercare una nuova vita all'estero. Solo più tardi la Svizzera divenne
  un Paese di immigrazione.
