id: geldpolitik-zustaendigkeit-bund
lang: it
source_version: 1
question: Chi è responsabile della politica monetaria in Svizzera?
options:
  a: La Confederazione
  b: I Comuni (Gemeinden)
  c: Le banche cantonali
  d: I Cantoni insieme
explanation: Secondo la Costituzione federale, la politica monetaria e valutaria è di competenza della
  Confederazione. Essa ha il diritto di emettere monete e banconote. La Banca nazionale svizzera attua
  la politica monetaria su mandato della Confederazione e lo fa in modo indipendente.
