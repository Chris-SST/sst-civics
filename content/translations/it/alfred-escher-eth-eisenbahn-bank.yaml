    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er führte die Schweizer Truppen im Sonderbundskrieg an.
      b: Er schrieb allein, vollständig, die erste Bundesverfassung.
      c: Er gründete in Genf das Rote Kreuz.
      d: Er förderte die Eidgenössische Technische Hochschule (ETH) und den Bau der Eisenbahnen und gründete
        die Bank, aus der die Credit Suisse hervorging.
    explanation_de: Im 19. Jahrhundert setzte sich Alfred Escher für die Gründung der Eidgenössischen
      Technischen Hochschule Zürich (ETH Zürich) und für den Bau von Eisenbahnen ein, insbesondere der
      Gotthardbahn. 1856 gründete er die Schweizerische Kreditanstalt, die spätere Credit Suisse. Im Jahr
      2023 wurde diese Bank von der UBS übernommen.
