id: alfred-escher-eth-eisenbahn-bank
lang: it
source_version: 2
question: Per che cosa è noto il politico e imprenditore zurighese Alfred Escher?
options:
  a: Guidò le truppe svizzere nella guerra del Sonderbund.
  b: Scrisse da solo, interamente, la prima Costituzione federale.
  c: Fondò a Ginevra la Croce Rossa.
  d: Promosse il Politecnico federale (ETH) e la costruzione delle ferrovie e fondò la banca da cui nacque
    il Credit Suisse.
explanation: Nel XIX secolo Alfred Escher si impegnò per la fondazione del Politecnico federale di Zurigo
  (ETH Zürich) e per la costruzione di ferrovie, in particolare della ferrovia del Gottardo. Nel 1856
  fondò la Schweizerische Kreditanstalt (Banca svizzera di credito), la futura Credit Suisse. Nel 2023
  questa banca è stata rilevata da UBS.
