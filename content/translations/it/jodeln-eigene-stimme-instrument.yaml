    question_de: Was dient beim Jodeln als Instrument?
    options_de:
      a: Das Alphorn
      b: Die eigene Stimme
      c: Das Schwyzerörgeli
      d: Das Akkordeon
    explanation_de: Beim Jodeln singt man ohne Worte, meist nur mit Silben, und wechselt schnell von der
      Bruststimme in die Kopfstimme. Die Stimme selbst ist das Instrument. Das Jodeln gehört zu den Volkstraditionen
      der Schweiz und wird oft mit dem Alphorn oder dem Schwyzerörgeli in Verbindung gebracht.
