id: jodeln-eigene-stimme-instrument
lang: it
source_version: 1
question: Che cosa funge da strumento nello jodel?
options:
  a: Il corno delle Alpi
  b: La propria voce
  c: Lo Schwyzerörgeli (piccola fisarmonica diatonica svizzera)
  d: La fisarmonica
explanation: Nello jodel si canta senza parole, per lo più solo con sillabe, passando rapidamente dalla
  voce di petto alla voce di testa. La voce stessa è lo strumento. Lo jodel fa parte delle tradizioni
  popolari della Svizzera e viene spesso associato al corno delle Alpi o allo Schwyzerörgeli.
