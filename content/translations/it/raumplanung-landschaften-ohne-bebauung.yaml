    question_de: Was ist eines der Ziele der Raumplanung in der Schweiz?
    options_de:
      a: Sie muss unbebaute Landschaften schützen und den Boden haushälterisch nutzen.
      b: Sie muss die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie muss möglichst viele neue Bauzonen schaffen.
      d: Sie muss den Preis des Baulands festlegen.
    explanation_de: Die Raumplanung legt fest, wo gebaut werden darf und wo nicht. Sie trennt die Bauzone
      von der Nichtbauzone, damit die Landschaften und das Landwirtschaftsland erhalten bleiben. Da der
      Boden knapp ist, muss man ihn haushälterisch nutzen und die bestehenden Siedlungen eher verdichten,
      anstatt neue Bauzonen zu schaffen.
