id: raumplanung-landschaften-ohne-bebauung
lang: it
source_version: 2
question: Qual è uno degli obiettivi della pianificazione del territorio in Svizzera?
options:
  a: Deve proteggere i paesaggi non edificati e utilizzare il suolo in modo parsimonioso.
  b: Deve ridefinire regolarmente i confini tra i Cantoni.
  c: Deve creare il maggior numero possibile di nuove zone edificabili.
  d: Deve stabilire il prezzo dei terreni edificabili.
explanation: La pianificazione del territorio stabilisce dove si può costruire e dove no. Separa la zona
  edificabile dalla zona non edificabile, affinché i paesaggi e i terreni agricoli vengano preservati.
  Poiché il suolo è scarso, bisogna utilizzarlo in modo parsimonioso e piuttosto densificare gli insediamenti
  esistenti, invece di creare nuove zone edificabili.
