id: abkuerzung-mwst-bedeutung
lang: it
source_version: 1
question: Su fatture e ricevute compare spesso l'abbreviazione «MWST». Che cosa significa?
options:
  a: Imposta sugli appartamenti in affitto (Mietwohnungssteuer)
  b: Imposta militare di difesa (Militärwehrsteuer)
  c: Imposta sugli autoveicoli (Motorwagensteuer)
  d: Imposta sul valore aggiunto (Mehrwertsteuer)
explanation: MWST significa Mehrwertsteuer, cioè imposta sul valore aggiunto. Viene riscossa sulla maggior
  parte dei beni e dei servizi ed è compresa nel prezzo. Rappresenta un'importante fonte di entrate della
  Confederazione.
