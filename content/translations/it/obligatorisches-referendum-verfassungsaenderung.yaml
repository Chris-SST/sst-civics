id: obligatorisches-referendum-verfassungsaenderung
lang: it
source_version: 1
question: Su quale oggetto in Svizzera si deve sempre votare, anche se non vengono raccolte firme?
options:
  a: Su ogni nuova legge federale
  b: Su ogni modifica della Costituzione federale
  c: Su ogni ordinanza del Consiglio federale (Bundesrat)
  d: Su ogni preventivo della Confederazione
explanation: Ogni modifica della Costituzione federale deve essere obbligatoriamente sottoposta al popolo
  e ai Cantoni. Questo si chiama referendum obbligatorio. Le leggi federali sottostanno soltanto al referendum
  facoltativo.
