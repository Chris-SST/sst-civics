    question_de: Über welchen Gegenstand muss in der Schweiz immer abgestimmt werden, auch wenn keine
      Unterschriften gesammelt werden?
    options_de:
      a: Über jedes neue Bundesgesetz
      b: Über jede Änderung der Bundesverfassung
      c: Über jede Verordnung des Bundesrates
      d: Über jeden Voranschlag der Eidgenossenschaft
    explanation_de: Jede Änderung der Bundesverfassung muss obligatorisch dem Volk und den Kantonen unterbreitet
      werden. Dies nennt man obligatorisches Referendum. Die Bundesgesetze unterstehen nur dem fakultativen
      Referendum.
