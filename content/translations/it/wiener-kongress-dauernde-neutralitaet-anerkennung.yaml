question: Quale evento del 1815 è importante per la neutralità della Svizzera?
options:
  a: La Svizzera dichiarò guerra a tutti gli Stati confinanti.
  b: Le grandi potenze riconobbero la neutralità perpetua della Svizzera.
  c: La Svizzera aderì alla Società delle Nazioni.
  d: La Svizzera tenne per la prima volta una votazione popolare sulla neutralità.
explanation: Al Congresso di Vienna del 1815 le grandi potenze europee riconobbero la neutralità perpetua
  della Svizzera. Ciò diede alla neutralità una base internazionale.
