id: parlamentsmitglieder-direkt-gewaehlt-volk
lang: it
source_version: 2
question: Chi elegge i membri del Consiglio nazionale (Nationalrat)?
options:
  a: Il Consiglio federale (Bundesrat) li nomina.
  b: I partiti li designano senza elezione.
  c: Il Tribunale federale (Bundesgericht) li sceglie.
  d: I cittadini e le cittadine aventi diritto di voto li eleggono direttamente.
explanation: I membri del Consiglio nazionale sono eletti ogni quattro anni direttamente dagli aventi
  diritto di voto. Oggi anche i membri del Consiglio degli Stati (Ständerat) sono eletti dal popolo in
  tutti i Cantoni, secondo le regole del rispettivo Cantone; in Appenzello Interno ciò avviene durante
  la Landsgemeinde.
