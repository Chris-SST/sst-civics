    question_de: Wer wählt die Mitglieder des Nationalrates?
    options_de:
      a: Der Bundesrat ernennt sie.
      b: Die Parteien bestimmen sie ohne Wahl.
      c: Das Bundesgericht wählt sie aus.
      d: Die stimmberechtigten Bürgerinnen und Bürger wählen sie direkt.
    explanation_de: Die Mitglieder des Nationalrates werden alle vier Jahre direkt von den Stimmberechtigten
      gewählt. Heute werden auch die Mitglieder des Ständerates in allen Kantonen vom Volk gewählt, nach
      den Regeln des jeweiligen Kantons; in Appenzell Innerrhoden geschieht dies an der Landsgemeinde.
