id: grundversicherung-pflicht-einwohner
lang: it
source_version: 1
question: Per chi vale in Svizzera l'assicurazione di base obbligatoria per le cure mediche?
options:
  a: Solo per le persone con cittadinanza (Bürgerrecht) svizzera
  b: Solo per le persone che esercitano un'attività lucrativa e percepiscono un salario
  c: Solo per le persone con un reddito basso
  d: Per tutti gli abitanti della Svizzera
explanation: L'assicurazione obbligatoria delle cure medico-sanitarie vale per tutte le persone che vivono
  in Svizzera. La cittadinanza, l'attività lucrativa e il reddito non hanno alcuna importanza al riguardo.
