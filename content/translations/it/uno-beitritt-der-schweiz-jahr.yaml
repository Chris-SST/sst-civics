id: uno-beitritt-der-schweiz-jahr
lang: it
source_version: 1
question: In quale anno la Svizzera è diventata membro delle Nazioni Unite (ONU)?
options:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
explanation: La Svizzera ha aderito all'ONU nel 2002, dopo che popolo e Cantoni avevano dato il loro assenso.
  È stata quindi uno degli ultimi Paesi ad aderire. Molte organizzazioni dell'ONU, tuttavia, hanno da
  tempo la loro sede a Ginevra.
