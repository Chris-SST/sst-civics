question: Qual è all'incirca la distanza tra il punto più orientale e il punto più occidentale della Svizzera?
options:
  a: Circa 250 chilometri
  b: Circa 350 chilometri
  c: Circa 550 chilometri
  d: Circa 150 chilometri
explanation: La Svizzera misura da est a ovest circa 350 chilometri. È quindi un Paese piuttosto piccolo,
  più lungo in direzione est-ovest che da nord a sud.
