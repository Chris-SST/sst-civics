id: alv-beitraege-arbeitgeber-lohnabzug
lang: it
source_version: 1
question: Chi trattiene dal salario i contributi all'assicurazione contro la disoccupazione?
options:
  a: Il Comune (Gemeinde) di domicilio
  b: La lavoratrice o il lavoratore stesso, tramite versamento
  c: L'Ufficio regionale di collocamento
  d: Il datore di lavoro
explanation: Il datore di lavoro trattiene automaticamente i contributi dal salario e li trasferisce all'organismo
  competente. I lavoratori non devono occuparsene personalmente. Anche il datore di lavoro versa una parte
  dei contributi.
