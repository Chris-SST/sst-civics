id: kantonsrat-amtsdauer-vier-jahre
lang: it
source_version: 1
question: Per quanti anni vengono eletti i membri del Consiglio cantonale (Kantonsrat) di Zurigo?
options:
  a: Per due anni
  b: Per tre anni
  c: Per sei anni
  d: Per quattro anni
explanation: I membri del Consiglio cantonale di Zurigo vengono eletti per una legislatura di quattro
  anni. Al termine hanno luogo le elezioni generali di rinnovo. Gli aventi diritto di voto possono allora
  decidere di nuovo chi siede in Parlamento.
