    question_de: Was gilt in der Schweiz, wenn eine Person ein Gesetz verletzt hat?
    options_de:
      a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
      b: Der Staat verfolgt und bestraft die Straftat; Selbstjustiz ist verboten.
      c: Das Opfer kann die Strafe selbst festlegen und vollziehen.
      d: Die Familie des Opfers kann die Täterin oder den Täter selbst bestrafen.
    explanation_de: In der Schweiz hat nur der Staat das Recht, Straftaten zu verfolgen und zu bestrafen.
      Dafür sind die Polizei, die Staatsanwaltschaft und die Gerichte zuständig. Wer sich selbst rächt,
      auch als Opfer oder als Familie des Opfers, kann sich seinerseits strafbar machen.
