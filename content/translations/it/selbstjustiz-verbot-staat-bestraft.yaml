id: selbstjustiz-verbot-staat-bestraft
lang: it
source_version: 2
question: Che cosa vale in Svizzera quando una persona ha violato una legge?
options:
  a: Il vicinato decide insieme sulla pena.
  b: Lo Stato persegue e punisce il reato; la giustizia fai da te è vietata.
  c: La vittima può stabilire e applicare da sé la pena.
  d: La famiglia della vittima può punire da sé l'autrice o l'autore del reato.
explanation: In Svizzera solo lo Stato ha il diritto di perseguire e punire i reati. Di ciò si occupano
  la polizia, il Ministero pubblico e i tribunali. Chi si vendica da sé, anche come vittima o come famiglia
  della vittima, può rendersi a sua volta punibile.
