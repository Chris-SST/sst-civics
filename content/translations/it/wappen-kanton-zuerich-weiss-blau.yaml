id: wappen-kanton-zuerich-weiss-blau
lang: it
source_version: 2
question: Quali colori ha lo stemma del Cantone di Zurigo?
options:
  a: Rosso e bianco
  b: Verde e bianco
  c: Bianco e blu
  d: Blu e giallo
explanation: Lo stemma zurighese è diviso diagonalmente in bianco e blu. Nell'araldica il bianco si chiama
  «argento». Gli stessi colori compaiono sulla bandiera del Cantone.
