id: groesster-kanton-nach-flaeche
lang: it
source_version: 1
question: Quale Cantone ha la superficie più grande di tutti i Cantoni svizzeri?
options:
  a: Ticino
  b: Vallese
  c: Berna
  d: Grigioni
explanation: I Grigioni sono il Cantone più grande della Svizzera per superficie. Si trovano interamente
  nelle Alpi e hanno molte valli e montagne. Anche il Vallese, Berna e il Ticino sono grandi, ma più piccoli
  dei Grigioni.
