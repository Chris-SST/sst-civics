    question_de: Wie sieht die Schweizer Fahne aus?
    options_de:
      a: Ein weisses Kreuz, das die Ränder nicht berührt, auf einem roten Quadrat
      b: Ein weisses Kreuz auf rotem Grund mit einem Wappen in der Mitte
      c: Ein weisses Kreuz, das bis zum Rand des roten Rechtecks reicht
      d: Ein rotes Kreuz, das die Ränder nicht berührt, auf einem weissen Quadrat
