question: Come si presenta la bandiera svizzera?
options:
  a: Una croce bianca, non toccante i bordi, su un quadrato rosso
  b: Una croce bianca su sfondo rosso con uno stemma al centro
  c: Una croce bianca che arriva fino al bordo del rettangolo rosso
  d: Una croce rossa, non toccante i bordi, su un quadrato bianco
explanation: La bandiera svizzera è quadrata. Mostra una croce bianca su sfondo rosso, i cui bracci non
  toccano il bordo. Insieme alla bandiera del Vaticano, è una delle due bandiere nazionali quadrate.
