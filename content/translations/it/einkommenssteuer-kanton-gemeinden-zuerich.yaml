id: einkommenssteuer-kanton-gemeinden-zuerich
lang: it
source_version: 1
question: Quale importante imposta riscuotono il Cantone di Zurigo e i Comuni (Gemeinden) sullo stipendio
  e sugli altri redditi delle persone?
options:
  a: L'imposta sul reddito
  b: L'imposta di successione
  c: L'imposta sui cani
  d: L'imposta sui veicoli a motore
explanation: L'imposta sul reddito è una delle imposte più importanti del Cantone e dei Comuni. Viene
  riscossa sul reddito delle persone fisiche. Le altre imposte sono meno importanti o riguardano qualcos'altro.
