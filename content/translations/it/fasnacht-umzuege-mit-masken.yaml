id: fasnacht-umzuege-mit-masken
lang: it
source_version: 1
question: Che cosa fa tipicamente parte del Carnevale svizzero (Fasnacht)?
options:
  a: Cortei in cui i partecipanti indossano maschere
  b: L'addobbo degli alberi di Natale sulla piazza del paese
  c: Fuochi d'artificio a mezzanotte il 1° agosto
  d: L'accensione di grandi candele nelle chiese
explanation: Durante il Carnevale (Fasnacht) gruppi di persone sfilano in corteo per le strade indossando
  maschere e costumi. Il Carnevale di Basilea è un esempio noto di questa usanza.
