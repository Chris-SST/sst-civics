    question_de: Was geschieht während des Morgestraichs, des Beginns der Basler Fasnacht?
    options_de:
      a: Der Stadtpräsident übergibt den Schlüssel der Stadt der Fasnachtsgesellschaft.
      b: Die Gassen werden taghell beleuchtet und es beginnt ein Feuerwerk.
      c: Die Lichter in den Gassen werden gelöscht, dann beginnen Pfeifen und Trommeln zu spielen.
      d: Die Fasnächtler werfen Konfetti vom Turm des Münsters und lassen alle Kirchenglocken läuten.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch, um vier Uhr morgens. Dann
      werden die Lichter in den Gassen gelöscht. Unmittelbar danach beginnen Pfeifen und Trommeln zu spielen.
