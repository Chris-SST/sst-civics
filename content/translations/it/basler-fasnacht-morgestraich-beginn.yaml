id: basler-fasnacht-morgestraich-beginn
lang: it
source_version: 1
question: Che cosa succede durante il Morgestraich, l'inizio del Carnevale di Basilea?
options:
  a: Il sindaco consegna la chiave della città alla società del Carnevale.
  b: I vicoli vengono illuminati a giorno e inizia uno spettacolo di fuochi d'artificio.
  c: Le luci nei vicoli si spengono, poi iniziano a suonare pifferi e tamburi.
  d: I carnevalisti lanciano coriandoli dalla torre della cattedrale e fanno suonare tutte le campane
    delle chiese.
explanation: Il Morgestraich inizia il lunedì dopo il Mercoledì delle Ceneri, alle quattro del mattino.
  Allora le luci nei vicoli vengono spente. Subito dopo iniziano a suonare pifferi e tamburi.
