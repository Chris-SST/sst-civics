id: zuerich-zwei-staenderaete
lang: it
source_version: 1
question: Quanti rappresentanti e rappresentanti invia il Cantone di Zurigo al Consiglio degli Stati (Ständerat)?
options:
  a: Un rappresentante
  b: Quattro rappresentanti
  c: Sei rappresentanti
  d: Due rappresentanti
explanation: Il Cantone di Zurigo è un Cantone intero e ha due seggi nel Consiglio degli Stati. Le consigliere
  e i consiglieri agli Stati sono eletti dall'elettorato del Cantone. Solo i semicantoni hanno un solo
  rappresentante ciascuno.
