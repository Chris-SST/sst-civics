id: fakultatives-referendum-unterschriften-anzahl
lang: it
source_version: 1
question: Quante firme sono necessarie per un referendum facoltativo contro una legge federale?
options:
  a: 200 000 firme
  b: 30 000 firme
  c: 50 000 firme
  d: 100 000 firme
explanation: Per un referendum facoltativo sono necessarie 50 000 firme valide di persone con diritto
  di voto. Le firme devono essere raccolte entro 100 giorni dalla pubblicazione della legge.
