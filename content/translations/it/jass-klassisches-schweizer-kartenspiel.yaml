question: Quale gioco di carte è considerato in Svizzera il classico gioco di carte tradizionale?
options:
  a: Bridge
  b: Jass
  c: Poker
  d: Ramino
explanation: Lo Jass è considerato il tipico gioco di carte svizzero. Di solito si gioca in quattro, divisi
  in due squadre, spesso con carte francesi o svizzero-tedesche. Lo si gioca in molte famiglie e nelle
  osterie.
