    question_de: Wie heisst die Verfassung der Schweiz?
    options_de:
      a: Bundesgrundgesetz
      b: Bundesverfassung
      c: Bundesordnung der Schweiz
      d: Schweizerische Staatscharta
    explanation_de: Die Verfassung der Schweiz heisst Bundesverfassung, abgekürzt BV. Sie ist die oberste
