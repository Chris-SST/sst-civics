question: In quale Paese ha la sede principale il Comitato internazionale della Croce Rossa (CICR)?
options:
  a: Nei Paesi Bassi
  b: In Svizzera
  c: In Austria
  d: In Belgio
explanation: Il CICR ha la sede principale a Ginevra, in Svizzera. È stato fondato a Ginevra nel 1863
