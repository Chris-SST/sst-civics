lang: it
source_version: 1
question: Qual è all'incirca la quota della superficie del Cantone di Zurigo utilizzata a scopi agricoli?
options:
  a: Circa il 68 per cento
  b: Circa il 25 per cento
  c: Circa l'11 per cento
  d: Circa il 41 per cento
explanation: Circa il 41 per cento della superficie del Cantone di Zurigo è destinato all'agricoltura.
  Il resto è costituito soprattutto da bosco, superficie edificata e corsi e specchi d'acqua.
