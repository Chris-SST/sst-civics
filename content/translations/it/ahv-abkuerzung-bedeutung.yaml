id: ahv-abkuerzung-bedeutung
lang: it
source_version: 1
question: Che cosa significa l'abbreviazione AHV?
options:
  a: Assicurazione vecchiaia e superstiti
  b: Assicurazione ufficiale dell'economia domestica
  c: Aiuto generale per gli assicurati
  d: Assicurazione contro la disoccupazione e per le cure mediche
explanation: AHV significa assicurazione vecchiaia e superstiti (AVS). Versa rendite per la vecchiaia
