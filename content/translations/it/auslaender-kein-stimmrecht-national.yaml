    question_de: Dürfen Ausländerinnen und Ausländer, die seit Jahren in der Schweiz leben, an eidgenössischen
      Abstimmungen teilnehmen?
    options_de:
      a: Ja, aber nur an den Abstimmungen und nicht an den Wahlen.
      b: Ja, wenn sie eine Niederlassungsbewilligung haben (Niederlassungsbewilligung C).
      c: Ja, wenn sie Steuern zahlen.
      d: Nein, auf nationaler Ebene haben sie kein Stimmrecht.
    explanation_de: Das Stimmrecht auf nationaler Ebene ist an das Schweizer Bürgerrecht gebunden. Ausländerinnen
