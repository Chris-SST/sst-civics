id: auslaender-kein-stimmrecht-national
lang: it
source_version: 1
question: Gli stranieri che vivono in Svizzera da anni possono partecipare alle votazioni federali?
options:
  a: Sì, ma solo alle votazioni e non alle elezioni.
  b: Sì, se hanno un permesso di domicilio (permesso C) (Niederlassungsbewilligung).
  c: Sì, se pagano le imposte.
  d: No, a livello nazionale non hanno il diritto di voto.
explanation: Il diritto di voto a livello nazionale è legato alla cittadinanza (Bürgerrecht) svizzera.
  Gli stranieri possono esercitarlo solo dopo una naturalizzazione.
