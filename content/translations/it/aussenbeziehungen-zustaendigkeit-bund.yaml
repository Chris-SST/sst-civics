    question_de: Wer ist in der Schweiz grundsätzlich für die Pflege der Beziehungen zu anderen Staaten
      zuständig?
    options_de:
      a: Die Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone zusammen
      d: Die Gemeinden an der Grenze
    explanation_de: Gemäss der Bundesverfassung fällt die Aussenpolitik in die Zuständigkeit des Bundes.
      Die Kantone können in ihren Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, aber die Gesamtverantwortung
      liegt beim Bund.
