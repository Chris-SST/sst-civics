id: aussenbeziehungen-zustaendigkeit-bund
lang: it
source_version: 1
question: Chi è in linea di principio competente in Svizzera per gestire le relazioni con gli altri Stati?
options:
  a: La Conferenza dei governi cantonali
  b: La Confederazione
  c: I Cantoni insieme
  d: I Comuni (Gemeinden) al confine
explanation: Secondo la Costituzione federale, la politica estera è di competenza della Confederazione.
  I Cantoni possono collaborare con l'estero nei loro ambiti di competenza, ma la responsabilità generale
  spetta alla Confederazione.
