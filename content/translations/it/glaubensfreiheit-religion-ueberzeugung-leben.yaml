id: glaubensfreiheit-religion-ueberzeugung-leben
lang: it
source_version: 1
question: Che cosa comprende, secondo la Costituzione federale, la libertà di credo e di coscienza?
options:
  a: Il diritto di avere una fede e una convinzione e di vivere in base a esse
  b: Solo l'appartenenza a una Chiesa nazionale riconosciuta
  c: L'obbligo di mantenere la fede dei genitori
  d: Il diritto di obbligare altri ad abbracciare la propria fede
explanation: Ogni persona può scegliere liberamente la propria religione e la propria convinzione filosofica
  e vivere in base a esse. Si può anche cambiare fede o non averne alcuna. Nessuno può essere costretto
  ad abbracciare una fede.
