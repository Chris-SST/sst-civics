    question_de: Was umfasst gemäss der Bundesverfassung die Glaubens- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und danach zu leben
      b: Nur die Zugehörigkeit zu einer anerkannten Landeskirche
      c: Die Pflicht, den Glauben der Eltern beizubehalten
      d: Das Recht, andere zu zwingen, den eigenen Glauben anzunehmen
