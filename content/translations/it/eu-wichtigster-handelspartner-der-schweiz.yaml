id: eu-wichtigster-handelspartner-der-schweiz
lang: it
source_version: 1
question: Con quale area economica la Svizzera ha complessivamente il maggior volume di scambi commerciali?
options:
  a: Con gli Stati del Vicino Oriente
  b: Con gli Stati asiatici
  c: Con l'Unione europea
  d: Con gli Stati Uniti d'America
explanation: L'Unione europea è il principale partner commerciale della Svizzera. Una grande parte delle
  importazioni e delle esportazioni passa attraverso gli Stati dell'UE. Per questo le relazioni con l'UE
  sono molto importanti per l'economia svizzera.
