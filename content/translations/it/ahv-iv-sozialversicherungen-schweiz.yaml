id: ahv-iv-sozialversicherungen-schweiz
lang: it
source_version: 1
question: Quale affermazione sulle assicurazioni sociali della Svizzera è corretta?
options:
  a: L'assicurazione vecchiaia e superstiti (AHV) e l'assicurazione per l'invalidità (IV) fanno parte
    delle assicurazioni sociali della Svizzera.
  b: L'AVS e l'AI sono gestite soltanto dai Comuni (Gemeinden).
  c: L'AVS e l'AI sono assicurazioni private senza base legale.
  d: L'AVS e l'AI sono pensate solo per i lavoratori indipendenti.
explanation: AVS sta per assicurazione vecchiaia e superstiti, AI per assicurazione per l'invalidità.
  Entrambe sono disciplinate dal diritto federale e fanno parte del sistema statale delle assicurazioni
  sociali.
