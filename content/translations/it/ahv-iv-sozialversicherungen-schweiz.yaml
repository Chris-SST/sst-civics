    question_de: Welche Aussage über die Sozialversicherungen der Schweiz ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung (IV) gehören zu
        den Sozialversicherungen der Schweiz.
      b: Die AHV und die IV werden nur von den Gemeinden geführt.
      c: Die AHV und die IV sind private Versicherungen ohne gesetzliche Grundlage.
      d: Die AHV und die IV sind nur für Selbstständigerwerbende gedacht.
    explanation_de: AHV steht für Alters- und Hinterlassenenversicherung, IV für Invalidenversicherung.
      Beide sind im Bundesrecht geregelt und gehören zum staatlichen System der Sozialversicherungen.
