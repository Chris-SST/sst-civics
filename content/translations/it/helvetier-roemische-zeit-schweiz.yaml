id: helvetier-roemische-zeit-schweiz
lang: it
source_version: 1
question: Quale popolo abitava, al tempo dei Romani, il territorio dell'odierna Svizzera?
options:
  a: Gli Unni
  b: I Vichinghi
  c: I Goti
  d: Gli Elvezi
explanation: Gli Elvezi erano una tribù celtica dell'Altopiano svizzero. I Romani li sottomisero e il
  territorio divenne parte dell'Impero romano. Il nome latino Helvetia, con cui si designa la Svizzera,
  ricorda ancora oggi questo popolo.
