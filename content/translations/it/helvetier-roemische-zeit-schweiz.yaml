    question_de: Welches Volk bewohnte zur Zeit der Römer das Gebiet der heutigen Schweiz?
    options_de:
      a: Die Hunnen
      b: Die Wikinger
      c: Die Goten
      d: Die Helvetier
    explanation_de: Die Helvetier waren ein keltischer Stamm des Schweizer Mittellandes. Die Römer unterwarfen
      sie und das Gebiet wurde Teil des Römischen Reiches. Der lateinische Name Helvetia, mit dem die
      Schweiz bezeichnet wird, erinnert noch heute an dieses Volk.
