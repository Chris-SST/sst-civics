id: flughafen-zuerich-standort-gemeinde
lang: it
source_version: 2
question: Sul territorio di quale di questi Comuni (Gemeinden) si trova l'aeroporto di Zurigo?
options:
  a: Winterthur
  b: Kloten
  c: Uster
  d: Dübendorf
explanation: L'aeroporto di Zurigo si trova in gran parte sul territorio della città di Kloten, nel Zürcher
  Unterland. Per questo molte persone parlano anche di «aeroporto di Kloten». A Dübendorf si trova un
  altro aerodromo.
