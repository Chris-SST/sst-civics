question: Che cosa cambiò per la Svizzera con la Costituzione federale del 1848?
options:
  a: Tornò a essere una semplice confederazione di Stati
  b: Diventò una monarchia con un re
  c: Diventò uno Stato federale in cui i Cantoni restano autonomi
  d: Diventò uno Stato unitario senza Cantoni
explanation: Nel 1848 nacque il moderno Stato federale con istituzioni comuni. I Cantoni mantennero però
  compiti propri e una propria statualità. Questa ripartizione caratterizza la Svizzera ancora oggi.
