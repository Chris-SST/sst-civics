id: kleine-gemeinde-vertretung-gemeindepraesident
lang: it
source_version: 1
question: Chi rappresenta all'esterno un piccolo Comune (Gemeinde) zurighese?
options:
  a: la presidente o il presidente del Comune
  b: la consigliera distrettuale o il consigliere distrettuale
  c: la segretaria comunale o il segretario comunale
  d: la direttrice scolastica o il direttore scolastico
explanation: Nei piccoli Comuni zurighesi il Comune è rappresentato all'esterno dalla presidente o dal
  presidente del Comune. Questa persona dirige il consiglio comunale (Gemeinderat). Nella città di Zurigo
  questo ruolo è svolto dalla presidente o dal presidente della città.
