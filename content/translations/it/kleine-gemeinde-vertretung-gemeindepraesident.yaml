    question_de: Wer vertritt eine kleine Zürcher Gemeinde nach aussen?
    options_de:
      a: die Gemeindepräsidentin oder der Gemeindepräsident
      b: die Bezirksrätin oder der Bezirksrat
      c: die Gemeindeschreiberin oder der Gemeindeschreiber
      d: die Schulleiterin oder der Schulleiter
    explanation_de: In kleinen Zürcher Gemeinden wird die Gemeinde nach aussen von der Gemeindepräsidentin
      oder dem Gemeindepräsidenten vertreten. Diese Person leitet den Gemeinderat. In der Stadt Zürich
      wird diese Rolle von der Stadtpräsidentin oder dem Stadtpräsidenten ausgeübt.
