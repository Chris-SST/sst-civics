    question_de: Wie ging es der Wirtschaft der Schweiz in den Jahrzehnten nach dem Zweiten Weltkrieg,
      zum Beispiel in den Sechzigerjahren?
    options_de:
      a: 'Es ging immer besser: Es gab viel Arbeit und der Wohlstand vieler Menschen nahm zu.'
      b: Die Wirtschaft schrumpfte stark und viele Menschen verloren ihre Arbeit.
      c: Die Schweiz ist Mitglied der Europäischen Union geworden.
      d: Die Schweiz brauchte keine Arbeitskräfte mehr aus dem Ausland.
    explanation_de: Nach dem Zweiten Weltkrieg ist die Schweizer Wirtschaft stark gewachsen. Es gab viel
      Arbeit und viele Menschen konnten sich mehr leisten. Deshalb haben die Unternehmen viele Arbeitskräfte
      aus dem Ausland kommen lassen, vor allem am Anfang aus Italien.
