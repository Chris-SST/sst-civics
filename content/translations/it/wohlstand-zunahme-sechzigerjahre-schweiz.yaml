question: Come andava l'economia della Svizzera nei decenni successivi alla Seconda guerra mondiale, ad
  esempio negli anni Sessanta?
options:
  a: 'Andava sempre meglio: c''era molto lavoro e il benessere di molte persone aumentava.'
  b: L'economia si contraeva fortemente e molte persone perdevano il lavoro.
  c: La Svizzera è diventata membro dell'Unione europea.
  d: La Svizzera non aveva più bisogno di manodopera dall'estero.
explanation: Dopo la Seconda guerra mondiale l'economia svizzera è cresciuta fortemente. C'era molto lavoro
  e molte persone potevano permettersi di più. Per questo le aziende hanno fatto venire molta manodopera
  dall'estero, soprattutto all'inizio dall'Italia.
