id: foehn-warmer-trockener-suedwind
lang: it
source_version: 1
question: Che cos'è il favonio (Föhn)?
options:
  a: Un vento freddo e umido proveniente da nord
  b: Un vento freddo proveniente da est in inverno
  c: Una pioggia forte in primavera
  d: Un vento caldo e secco proveniente da sud
explanation: Il favonio (Föhn) è un vento discendente caldo e secco che nelle Alpi soffia soprattutto
  da sud. Può far salire rapidamente le temperature e rendere la visibilità molto nitida.
