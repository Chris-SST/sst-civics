id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: it
source_version: 2
question: Che cosa vale in linea di principio per l'estradizione di cittadini svizzeri all'estero?
options:
  a: Vengono estradati su richiesta di qualsiasi Stato.
  b: Non vengono estradati a un altro Stato contro la loro volontà. Possono però essere consegnati a un
    tribunale internazionale.
  c: Vengono estradati soltanto agli Stati confinanti con la Svizzera.
  d: Vengono estradati se il Consiglio federale (Bundesrat) lo vuole nel singolo caso.
explanation: Secondo l'articolo 25 della Costituzione federale, gli Svizzeri non possono essere espulsi.
  Possono essere estradati a un altro Stato soltanto se vi acconsentono essi stessi. Un tribunale internazionale,
  ad esempio la Corte penale internazionale, non è un'autorità straniera; per questo una legge federale
  consente di consegnare cittadini svizzeri a tale tribunale per un procedimento.
