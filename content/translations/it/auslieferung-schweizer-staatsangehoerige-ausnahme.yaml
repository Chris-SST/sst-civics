    question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Bürgerinnen und Bürgern ins
      Ausland?
    options_de:
      a: Sie werden auf Ersuchen jedes beliebigen Staates ausgeliefert.
      b: Sie werden gegen ihren Willen nicht an einen anderen Staat ausgeliefert. Sie können aber einem
        internationalen Gericht überstellt werden.
      c: Sie werden nur an Staaten ausgeliefert, die an die Schweiz grenzen.
      d: Sie werden ausgeliefert, wenn der Bundesrat es im Einzelfall will.
    explanation_de: Gemäss Artikel 25 der Bundesverfassung dürfen Schweizerinnen und Schweizer nicht ausgewiesen
      werden. Sie dürfen nur dann an einen anderen Staat ausgeliefert werden, wenn sie selbst zustimmen.
      Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine ausländische
      Behörde; deshalb erlaubt ein Bundesgesetz, Schweizer Bürgerinnen und Bürger für ein Verfahren an
      dieses Gericht zu überstellen.
