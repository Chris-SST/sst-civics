    question_de: Die Altersvorsorge in der Schweiz beruht auf drei Säulen. Welche Institution bildet die
      zweite Säule?
    options_de:
      a: Die Ergänzungsleistungen zur Alters- und Hinterlassenenversicherung (AHV)
      b: Die AHV (staatliche Altersversicherung)
      c: Die Pensionskasse (berufliche Vorsorge)
      d: Das private Sparkonto mit Steuerabzug (Säule 3a)
    explanation_de: Die Pensionskasse gehört zur beruflichen Vorsorge und bildet die zweite Säule. Sie
      ergänzt die AHV, damit pensionierte Personen ihren gewohnten Lebensstandard in angemessener Weise
      beibehalten können. Die AHV ist die erste Säule, die private Vorsorge ist die dritte.
