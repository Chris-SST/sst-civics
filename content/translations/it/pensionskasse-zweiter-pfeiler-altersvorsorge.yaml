id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: it
source_version: 1
question: La previdenza per la vecchiaia in Svizzera si basa su tre pilastri. Quale istituzione costituisce
  il secondo pilastro?
options:
  a: Le prestazioni complementari all'assicurazione vecchiaia e superstiti (AHV)
  b: L'AVS (assicurazione statale per la vecchiaia)
  c: La cassa pensione (previdenza professionale)
  d: Il conto di risparmio privato con deduzione fiscale (pilastro 3a)
explanation: La cassa pensione fa parte della previdenza professionale e costituisce il secondo pilastro.
  Integra l'AVS, affinché le persone in pensione possano mantenere in modo adeguato il loro tenore di
  vita abituale. L'AVS è il primo pilastro, la previdenza privata è il terzo.
