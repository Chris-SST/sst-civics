id: roemischer-name-zuerichs-turicum
lang: it
source_version: 1
question: Qual era il nome romano di Zurigo?
options:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
explanation: 'I Romani chiamavano Turicum il loro insediamento e posto doganale sulla Limmat. Da questo
  nome si sviluppò in seguito il nome Zurigo. Gli altri nomi appartengono a località romane nell''attuale
  Svizzera: Windisch, Augst e Avenches.'
