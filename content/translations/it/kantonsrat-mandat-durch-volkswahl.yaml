id: kantonsrat-mandat-durch-volkswahl
lang: it
source_version: 1
question: Come ottengono il loro mandato i membri del Consiglio cantonale (Kantonsrat) di Zurigo?
options:
  a: Sono eletti dal popolo.
  b: Sono designati dai consigli comunali (Gemeinderäte).
  c: Sono nominati dal Consiglio di Stato (Regierungsrat).
  d: Sono insediati dal Consiglio federale (Bundesrat).
explanation: I membri del Consiglio cantonale sono eletti dagli aventi diritto di voto del Cantone in
  un'elezione popolare. Il parlamento è quindi designato direttamente dal popolo. Né il governo né la
  Confederazione insediano i membri.
