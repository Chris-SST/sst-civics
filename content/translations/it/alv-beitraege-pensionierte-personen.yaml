id: alv-beitraege-pensionierte-personen
lang: it
source_version: 1
question: Chi in Svizzera non deve più pagare i contributi all'assicurazione contro la disoccupazione
  (AD)?
options:
  a: Le persone con un rapporto di lavoro a tempo indeterminato
  b: Le persone che hanno raggiunto l'età ordinaria di pensionamento dell'assicurazione vecchiaia e superstiti
    (AHV)
  c: Le persone che lavorano a tempo parziale
  d: Le persone che negli ultimi due anni non sono mai state disoccupate
explanation: L'obbligo di pagare i contributi all'assicurazione contro la disoccupazione termina al raggiungimento
  dell'età di pensionamento dell'AHV. Chi è pensionato non paga più contributi AD sull'eventuale salario.
  I dipendenti a tempo parziale e a tempo pieno pagano invece i contributi.
