id: auslandschweizer-stimmrecht-vom-ausland
lang: it
source_version: 2
question: Una cittadina svizzera vive stabilmente all'estero. Come può partecipare alle elezioni e alle
  votazioni federali?
options:
  a: Può votare soltanto se si reca in Svizzera a tale scopo.
  b: Può partecipare soltanto alle elezioni, ma non alle votazioni.
  c: Può eleggere e votare dal suo luogo di residenza all'estero, senza recarsi in Svizzera.
  d: Perde il diritto di voto e di elezione a livello di Confederazione.
explanation: Gli svizzeri all'estero possono eleggere e votare a livello federale senza recarsi in Svizzera.
  A tal fine devono essere registrati presso la rappresentanza svizzera competente all'estero e chiedere
  tramite quest'ultima l'iscrizione nel registro elettorale. Il materiale per le elezioni e le votazioni
  viene poi inviato loro dal loro comune di voto.
