id: zulassung-motorfahrzeuge-kantonales-strassenverkehrsamt
lang: it
source_version: 1
question: Chi ammette un veicolo a motore alla circolazione stradale nel Cantone di Zurigo e rilascia
  a tal fine le targhe di controllo?
options:
  a: La polizia cantonale durante un controllo del traffico
  b: L'Ufficio della circolazione stradale del Cantone
  c: Il Touring Club Svizzero
  d: L'amministrazione del Comune (Gemeinde) del luogo di domicilio
explanation: L'ammissione dei veicoli a motore è un compito dell'Ufficio cantonale della circolazione
  stradale. Anche le targhe di controllo vengono rilasciate da questo ufficio. Il Comune e la polizia
  non sono competenti in materia.
