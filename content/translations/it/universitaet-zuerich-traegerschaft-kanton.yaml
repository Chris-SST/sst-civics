id: universitaet-zuerich-traegerschaft-kanton
lang: it
source_version: 1
question: Chi è responsabile, nel Cantone di Zurigo, della gestione e dell'ente responsabile dell'Università
  di Zurigo?
options:
  a: La Confederazione
  b: La città di Zurigo
  c: Il Cantone di Zurigo
  d: I consigli distrettuali del Cantone
explanation: L'Università di Zurigo è un'università cantonale. Il Cantone di Zurigo ne è l'ente responsabile
  e la gestisce. La città di Zurigo e la Confederazione non ne sono i principali responsabili.
