id: bundesrat-ist-regierung-der-schweiz
lang: it
source_version: 1
question: Quale ruolo ha il Consiglio federale (Bundesrat) in Svizzera?
options:
  a: È il governo della Svizzera.
  b: È il tribunale supremo del Paese.
  c: È il Parlamento della Confederazione.
  d: È la rappresentanza dei Cantoni.
explanation: Il Consiglio federale è la suprema autorità direttiva ed esecutiva della Confederazione,
  ovvero il governo. Ha sette membri. Il Parlamento e il Tribunale federale (Bundesgericht) sono altri
  poteri.
