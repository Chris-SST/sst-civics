    question_de: Welche Rolle hat der Bundesrat in der Schweiz?
    options_de:
      a: Er ist die Regierung der Schweiz.
      b: Er ist das oberste Gericht des Landes.
      c: Er ist das Parlament der Eidgenossenschaft.
      d: Er ist die Vertretung der Kantone.
    explanation_de: Der Bundesrat ist die oberste leitende und vollziehende Behörde der Eidgenossenschaft,
