id: wef-findet-in-davos-statt
lang: it
source_version: 1
question: In quale località svizzera si svolge regolarmente l'incontro annuale del Forum economico mondiale
  (WEF)?
options:
  a: A Davos
  b: A Lucerna
  c: A Montreux
  d: A Interlaken
explanation: Il Forum economico mondiale si riunisce regolarmente a Davos, nel Cantone dei Grigioni. Lì
  si incontrano esperti di politica e di economia. La Confederazione sostiene la sicurezza dell'incontro.
