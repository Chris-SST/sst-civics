id: stimmrecht-bund-ab-18-geburtstag
lang: it
source_version: 1
question: A partire da quale età gli svizzeri e le svizzere possono votare ed eleggere a livello federale?
options:
  a: Dal 20° compleanno
  b: Dal 21° compleanno
  c: Dal 16° compleanno
  d: Dal 18° compleanno
explanation: Il diritto di voto e di eleggibilità attiva a livello della Confederazione inizia con la
  maggiore età, cioè con il 18° compleanno. Questa età vale in egual misura per le elezioni e per le votazioni
  della Confederazione.
