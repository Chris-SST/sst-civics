id: zivilgesetzbuch-ehe-scheidung-regeln
lang: it
source_version: 1
question: Quale legge disciplina, tra l'altro, come si celebra un matrimonio e come lo si scioglie con
  il divorzio?
options:
  a: Il Codice civile
  b: Il Codice penale
  c: La legge sull'asilo
  d: La legge sul Tribunale federale (Bundesgerichtsgesetz)
explanation: Il Codice civile disciplina il diritto delle persone, il diritto di famiglia, il diritto
  successorio e i diritti reali. Ne fanno parte anche la celebrazione del matrimonio e il divorzio. Il
  Codice penale, invece, si occupa dei reati e delle pene.
