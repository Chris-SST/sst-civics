    question_de: Wie reagieren die Förster in der Schweiz auf den Anstieg der Temperaturen?
    options_de:
      a: Sie pflanzen immer häufiger andere Baumarten.
      b: Sie pflanzen nur Bäume, die an diesem Ort schon immer vorhanden waren.
      c: Sie verzichten vollständig auf die Pflege des Waldes.
