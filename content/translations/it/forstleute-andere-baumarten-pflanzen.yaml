id: forstleute-andere-baumarten-pflanzen
lang: it
source_version: 1
question: Come reagiscono i forestali in Svizzera all'aumento delle temperature?
options:
  a: Piantano sempre più spesso altre specie di alberi.
  b: Piantano soltanto alberi che sono sempre stati presenti in quel luogo.
  c: Rinunciano completamente alla cura del bosco.
  d: Disboscano le foreste a bassa quota.
explanation: Alcune specie di alberi sopportano male il caldo e la siccità. Per questo i forestali puntano
  su altre specie, più adatte al clima più caldo. In questo modo il bosco dovrebbe rimanere stabile.
