    question_de: Wer muss in der Schweiz eine Grundversicherung bei einer Krankenkasse haben?
    options_de:
      a: alle Personen, die in der Schweiz leben
      b: nur Personen mit einem tiefen Einkommen
      c: nur Personen mit dem Schweizer Bürgerrecht
      d: nur Personen, die einer Erwerbstätigkeit nachgehen
    explanation_de: Die Krankenversicherung ist für alle Personen mit Wohnsitz in der Schweiz obligatorisch.
      Dies gilt unabhängig von der Staatsangehörigkeit, vom Alter oder davon, ob eine Erwerbstätigkeit
      ausgeübt wird. Die Krankenkassen müssen alle Personen in die Grundversicherung aufnehmen.
