id: krankenversicherung-obligatorisch-alle-einwohner
lang: it
source_version: 1
question: Chi deve avere in Svizzera un'assicurazione di base presso una cassa malati (Krankenkasse)?
options:
  a: tutte le persone che vivono in Svizzera
  b: solo le persone con un reddito basso
  c: solo le persone con la cittadinanza (Bürgerrecht) svizzera
  d: solo le persone che esercitano un'attività lucrativa
explanation: L'assicurazione malattia è obbligatoria per tutte le persone domiciliate in Svizzera. Ciò
  vale indipendentemente dalla nazionalità, dall'età o dall'esercizio di un'attività lucrativa. Le casse
  malati devono accogliere nell'assicurazione di base tutte le persone.
