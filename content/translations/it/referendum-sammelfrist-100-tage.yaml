id: referendum-sammelfrist-100-tage
lang: it
source_version: 1
question: Di quanto tempo dispongono i comitati referendari per raccogliere le firme per un referendum
  facoltativo contro una legge federale?
options:
  a: 60 giorni
  b: 18 mesi
  c: 100 giorni
  d: 30 giorni
explanation: Il termine è di 100 giorni dalla pubblicazione ufficiale dell'atto. I 18 mesi valgono invece
  per la raccolta delle firme per un'iniziativa popolare (Volksinitiative).
