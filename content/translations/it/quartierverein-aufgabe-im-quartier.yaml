    question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Gemeinde oder in einer Stadt
      des Kantons Zürich?
    options_de:
      a: Er vertritt die Anliegen der Bevölkerung des Quartiers gegenüber den Behörden und fördert das
        Zusammenleben.
      b: Er führt die Einwohnerkontrolle für das Quartier.
      c: Er erhebt die Steuern bei den Einwohnern des Quartiers.
      d: Er bewilligt die Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Einwohnern. Er bringt
      die Anliegen des Quartiers vor die Behörden und organisiert Veranstaltungen, die das Zusammenleben
      stärken. Die Aufgaben der öffentlichen Hand, wie die Steuern, die Baubewilligungen oder die Einwohnerkontrolle,
      obliegen der Gemeinde.
