id: quartierverein-aufgabe-im-quartier
lang: it
source_version: 1
question: Qual è un compito tipico di un'associazione di quartiere (Quartierverein) in un Comune (Gemeinde)
  o in una città del Cantone di Zurigo?
options:
  a: Rappresenta le istanze della popolazione del quartiere nei confronti delle autorità e promuove la
    convivenza.
  b: Tiene il controllo degli abitanti per il quartiere.
  c: Riscuote le imposte dagli abitanti del quartiere.
  d: Autorizza le domande di costruzione nel quartiere.
explanation: Un'associazione di quartiere è un'unione volontaria di abitanti. Porta le istanze del quartiere
  davanti alle autorità e organizza eventi che rafforzano la convivenza. I compiti di autorità pubblica,
  come le imposte, i permessi di costruzione o il controllo degli abitanti, spettano al Comune.
