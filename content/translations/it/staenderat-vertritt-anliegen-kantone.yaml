id: staenderat-vertritt-anliegen-kantone
lang: it
source_version: 1
question: Quale camera del Parlamento rappresenta principalmente gli interessi dei Cantoni?
options:
  a: Il Consiglio federale (Bundesrat)
  b: Il Consiglio nazionale (Nationalrat)
  c: Il Consiglio degli Stati (Ständerat)
  d: Il Tribunale federale (Bundesgericht)
explanation: Il Consiglio degli Stati rappresenta soprattutto i Cantoni. Ogni Cantone invia i propri rappresentanti
  e le proprie rappresentanti in questa camera. Il Consiglio nazionale, invece, rappresenta il popolo.
