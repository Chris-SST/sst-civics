    source_version: 1
    question_de: Eine steuerpflichtige Person ist mit ihrer Veranlagung nicht einverstanden. Was kann
      sie tun?
    options_de:
      a: Sie kann die Gemeindeversammlung abstimmen lassen.
      b: Sie kann sich weigern zu zahlen, ohne weitere Schritte zu unternehmen.
      c: Sie kann bei der Steuerbehörde schriftlich Einsprache erheben.
      d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
    explanation_de: Gegen die Veranlagung besteht das Rechtsmittel der Einsprache. Diese muss schriftlich
      bei der Steuerbehörde eingereicht werden, und zwar innerhalb einer Frist.
