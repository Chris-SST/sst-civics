id: einsprache-gegen-steuerveranlagung-schriftlich
lang: it
source_version: 1
question: Una persona soggetta a imposizione non è d'accordo con la propria tassazione. Che cosa può fare?
options:
  a: Può far votare l'assemblea comunale (Gemeindeversammlung).
  b: Può rifiutarsi di pagare senza intraprendere ulteriori passi.
  c: Può presentare reclamo per iscritto all'autorità fiscale.
  d: Può presentare un'iniziativa popolare (Volksinitiative) al Consiglio federale (Bundesrat).
explanation: Contro la tassazione esiste il mezzo di ricorso del reclamo. Questo deve essere presentato
  per iscritto all'autorità fiscale, e precisamente entro un termine.
