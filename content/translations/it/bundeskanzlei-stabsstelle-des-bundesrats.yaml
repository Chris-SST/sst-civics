    question_de: Welche Aufgabe erfüllt die Bundeskanzlei für den Bundesrat?
    options_de:
      a: Sie ist der Stab des Bundesrates.
      b: Sie prüft als Gericht die Entscheide des Bundesrates.
      c: Sie leitet das Finanzdepartement.
      d: Sie wählt die Mitglieder des Bundesrates.
    explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der
      Vorbereitung der Sitzungen. Sie untersteht der Leitung der Bundeskanzlerin oder des Bundeskanzlers.
      Der Bundesrat wird von der Bundesversammlung gewählt.
