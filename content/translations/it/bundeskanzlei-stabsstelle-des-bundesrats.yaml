id: bundeskanzlei-stabsstelle-des-bundesrats
lang: it
source_version: 1
question: Quale compito svolge la Cancelleria federale (Bundeskanzlei) per il Consiglio federale (Bundesrat)?
options:
  a: È lo stato maggiore del Consiglio federale.
  b: Esamina come tribunale le decisioni del Consiglio federale.
  c: Dirige il Dipartimento delle finanze.
  d: Elegge i membri del Consiglio federale.
explanation: La Cancelleria federale sostiene il Consiglio federale nel suo lavoro, ad esempio nella preparazione
  delle sedute. È posta sotto la direzione della cancelliera o del cancelliere della Confederazione. Il
  Consiglio federale è eletto dall'Assemblea federale (Bundesversammlung).
