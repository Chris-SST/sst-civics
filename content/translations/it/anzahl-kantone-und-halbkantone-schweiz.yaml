question: Quanti Cantoni ha la Svizzera e quanti di questi sono semicantoni?
options:
  a: 26 Cantoni, di cui 6 semicantoni
  b: 26 Cantoni, di cui 3 semicantoni
  c: 23 Cantoni, di cui 6 semicantoni
  d: 20 Cantoni, di cui 6 semicantoni
explanation: 'La Svizzera ha 26 Cantoni. Sei di questi sono semicantoni: Obvaldo, Nidvaldo, Basilea Città,
  Basilea Campagna, Appenzello Esterno e Appenzello Interno. Nel Consiglio degli Stati (Ständerat) hanno
  un voto ciascuno anziché due.'
