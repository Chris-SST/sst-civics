id: initiative-gegenvorschlag-stichfrage
lang: it
source_version: 1
question: Si vota contemporaneamente su un'iniziativa popolare (Volksinitiative) e su un controprogetto
  diretto dell'Assemblea federale (Bundesversammlung). A cosa serve in questo caso la domanda risolutiva?
options:
  a: Decide se la votazione deve essere ripetuta
  b: Decide se l'iniziativa è valida
  c: Decide quale progetto è applicabile se entrambi vengono accettati
  d: Decide se i Cantoni possono partecipare al voto
explanation: Gli aventi diritto di voto possono approvare sia l'iniziativa sia il controprogetto. Con
  la domanda risolutiva indicano quale dei due progetti deve entrare in vigore, nel caso in cui entrambi
  vengano accettati. In questo modo nessun voto a favore di una modifica va perso.
