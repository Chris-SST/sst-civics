    question_de: Es wird gleichzeitig über eine Volksinitiative und über einen direkten Gegenentwurf der
      Bundesversammlung abgestimmt. Wozu dient in diesem Fall die Stichfrage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Initiative gültig ist
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Kantone an der Abstimmung teilnehmen dürfen
    explanation_de: Die Stimmberechtigten können sowohl der Initiative als auch dem Gegenentwurf zustimmen.
      Mit der Stichfrage geben sie an, welche der beiden Vorlagen in Kraft treten soll, falls beide angenommen
      werden. Auf diese Weise geht keine Stimme für eine Änderung verloren.
