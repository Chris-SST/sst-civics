id: regierungsgewalt-des-bundes-beim-bundesrat
lang: it
source_version: 1
question: Quale autorità esercita il potere governativo supremo a livello federale?
options:
  a: Il Consiglio federale (Bundesrat)
  b: Il Consiglio nazionale (Nationalrat)
  c: La Cancelleria federale (Bundeskanzlei)
  d: Il Tribunale federale (Bundesgericht)
explanation: Secondo la Costituzione federale, il Consiglio federale è la suprema autorità direttiva ed
  esecutiva della Confederazione. Il Parlamento emana le leggi, il Tribunale federale amministra la giustizia.
