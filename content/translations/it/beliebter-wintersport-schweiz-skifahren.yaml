question: Quale sport praticano in inverno moltissime persone in Svizzera?
options:
  a: Pallanuoto
  b: Sci
  c: Canottaggio
  d: Beach volley
explanation: Lo sci è molto popolare in Svizzera in inverno e molte persone sciano in montagna. Spesso
  già i bambini imparano a sciare, per esempio in un campo scolastico invernale. La pallanuoto, il canottaggio
  e il beach volley sono invece sport che si praticano soprattutto in estate o in acqua.
