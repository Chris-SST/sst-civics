    question_de: Welche Abkommen, die vom Volk im Jahr 2000 angenommen wurden, bilden die Grundlage der
      aktuellen Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen I
      b: Das EWR-Abkommen
      c: Nur das Schengen-Abkommen
      d: Der Beitrittsvertrag zur EU
    explanation_de: Die Stimmberechtigten nahmen die Bilateralen I im Jahr 2000 an. Sie regeln den Zugang
      zu bestimmten Bereichen des Binnenmarkts, zum Beispiel die Personenfreizügigkeit und den Landverkehr.
      Das Volk hatte den EWR 1992 nicht angenommen.
