id: bilaterale-eins-basis-eu-beziehungen
lang: it
source_version: 1
question: Quali accordi, approvati dal popolo nel 2000, costituiscono la base delle attuali relazioni
  della Svizzera con l'UE?
options:
  a: I Bilaterali I
  b: L'accordo SEE
  c: Il solo accordo di Schengen
  d: Il trattato di adesione all'UE
explanation: Il corpo elettorale approvò i Bilaterali I nel 2000. Essi disciplinano l'accesso a determinati
  settori del mercato interno, ad esempio la libera circolazione delle persone e i trasporti terrestri.
  Il popolo non aveva approvato il SEE nel 1992.
