    question_de: Wer darf in der Schweiz grundsätzlich körperliche Gewalt anwenden?
    options_de:
      a: Private Sicherheitsfirmen im Auftrag von Vereinen
      b: Jede Person, die sich bedroht fühlt
      c: Nur der Staat
      d: Jede Gemeinde mit eigenen Bürgerwehren
    explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich darf nur der Staat
      körperliche Gewalt anwenden, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist die
      Notwehr: Wer rechtswidrig angegriffen wird, kann sich angemessen verteidigen, aber das blosse Gefühl,
      bedroht zu sein, genügt nicht.'
