id: gewaltmonopol-des-staates
lang: it
source_version: 2
question: Chi può, in linea di principio, usare la violenza fisica in Svizzera?
options:
  a: Le società di sicurezza private su incarico di associazioni
  b: Ogni persona che si sente minacciata
  c: Solo lo Stato
  d: Ogni Comune (Gemeinde) con proprie milizie civiche
explanation: 'In Svizzera lo Stato detiene il monopolio della forza: in linea di principio solo lo Stato
  può usare la violenza fisica, ad esempio tramite la polizia o l''esercito. Un''eccezione è la legittima
  difesa: chi viene aggredito illegalmente può difendersi in modo adeguato, ma il semplice sentimento
  di essere minacciati non basta.'
