    question_de: Welche Aufgabe haben die politischen Parteien in der Demokratie?
    options_de:
      a: Sie beurteilen die Streitigkeiten
      b: Sie vertreten die verschiedenen Interessen der Bevölkerung
      c: Sie führen die eidgenössischen Abstimmungen durch
      d: Sie sorgen dafür, dass die Gesetze im Alltag angewendet werden
    explanation_de: Die Parteien bündeln die verschiedenen Interessen und die verschiedenen Meinungen
      der Bevölkerung und bringen sie in die Politik ein. Die Gesetze anwenden zu lassen ist Aufgabe der
      Behörden, während Recht zu sprechen Aufgabe der Gerichte ist.
