id: parteien-vertreten-interessen-bevoelkerung
lang: it
source_version: 1
question: Quale compito hanno i partiti politici nella democrazia?
options:
  a: Giudicano le controversie
  b: Rappresentano i diversi interessi della popolazione
  c: Svolgono le votazioni federali
  d: Fanno applicare le leggi nella vita quotidiana
explanation: I partiti raccolgono i diversi interessi e le diverse opinioni della popolazione e li portano
  nella politica. Far applicare le leggi è compito delle autorità, mentre rendere giustizia è compito
  dei tribunali.
