    question_de: Welche Aufgabe gehört zum Auftrag der Polizei?
    options_de:
      a: Rechtsverletzungen verfolgen
      b: Die Volksabstimmungen durchführen
      c: Die Gesetze für das Land erlassen
      d: Gerichtsurteile gegen die Urheber von Straftaten aussprechen
    explanation_de: Die Polizei gewährleistet die Sicherheit und Ordnung und verfolgt die Rechtsverletzungen.
