id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: it
source_version: 1
question: Quale compito rientra nel mandato della polizia?
options:
  a: Perseguire le violazioni della legge
  b: Svolgere le votazioni popolari
  c: Emanare le leggi per il Paese
  d: Pronunciare sentenze giudiziarie contro i autori di reati
explanation: La polizia garantisce la sicurezza e l'ordine e persegue le violazioni della legge. Chiarisce
  i reati e trasmette i risultati. Le leggi sono emanate dal Parlamento, le sentenze sono pronunciate
  dai tribunali.
