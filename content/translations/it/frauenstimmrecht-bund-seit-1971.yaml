id: frauenstimmrecht-bund-seit-1971
lang: it
source_version: 1
question: Da quando le donne in Svizzera possono votare ed eleggere a livello nazionale?
options:
  a: Dal 1918
  b: Dal 1848
  c: Dal 1971
  d: Dal 1991
explanation: A livello di Confederazione il diritto di voto alle donne è stato introdotto nel 1971. Alcuni
  Cantoni e Comuni (Gemeinden) lo conoscevano già prima, mentre altri lo introdussero solo più tardi.
  L'ultimo Cantone a seguire fu Appenzello Interno nel 1990.
