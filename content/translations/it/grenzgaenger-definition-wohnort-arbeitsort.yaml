id: grenzgaenger-definition-wohnort-arbeitsort
lang: it
source_version: 2
question: Chi è considerato frontaliere o frontaliera in Svizzera?
options:
  a: Una persona che lavora in Svizzera, ma ha il proprio domicilio all'estero e vi fa ritorno regolarmente
  b: Una persona che lavora alla dogana e controlla il confine nazionale
  c: Una persona che attraversa il confine senza permesso per lavorare qui
  d: Una persona che abita in un Cantone e lavora ogni giorno in un altro Cantone
explanation: I frontalieri e le frontaliere hanno il proprio posto di lavoro in Svizzera, ma abitano in
  un altro Paese. Hanno bisogno di un permesso per frontalieri e tornano regolarmente, almeno una volta
  alla settimana, al proprio luogo di domicilio all'estero. Chi fa il pendolare solo tra due Cantoni non
  è un frontaliere.
