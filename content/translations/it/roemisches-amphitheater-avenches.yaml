id: roemisches-amphitheater-avenches
lang: it
source_version: 1
question: In quale città svizzera i Romani costruirono un anfiteatro i cui resti sono ancora visibili
  oggi?
options:
  a: Coira
  b: Thun
  c: Sion
  d: Avenches
explanation: In epoca romana Avenches si chiamava Aventicum ed era una città importante. L'anfiteatro
  che si trova lì è una nota testimonianza dell'epoca romana in Svizzera. Le altre città non sono conosciute
  per questa costruzione.
