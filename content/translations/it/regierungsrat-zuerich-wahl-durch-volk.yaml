id: regierungsrat-zuerich-wahl-durch-volk
lang: it
source_version: 1
question: Chi determina, nel Cantone di Zurigo, chi siede nel Consiglio di Stato (Regierungsrat)?
options:
  a: L'Assemblea federale (Bundesversammlung) elegge i membri del Consiglio di Stato.
  b: Il Consiglio cantonale (Kantonsrat) elegge i membri tra i propri ranghi.
  c: I presidenti e le presidentesse dei Comuni (Gemeinde) eleggono i membri.
  d: La popolazione avente diritto di voto del Cantone elegge direttamente i membri.
explanation: Nel Cantone di Zurigo il popolo elegge direttamente il Consiglio di Stato alle urne. Il Consiglio
  cantonale è il parlamento e non elegge il governo. Questo distingue il Cantone dalla Confederazione,
  dove l'Assemblea federale elegge il Consiglio federale (Bundesrat).
