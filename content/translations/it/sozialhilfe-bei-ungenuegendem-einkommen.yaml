id: sozialhilfe-bei-ungenuegendem-einkommen
lang: it
source_version: 1
question: Che cosa offre il Comune (Gemeinde) se il reddito e il patrimonio di una persona non bastano
  per vivere?
options:
  a: L'aiuto sociale
  b: Un permesso di costruzione
  c: Una naturalizzazione
  d: Una borsa di studio della scuola dell'obbligo
explanation: Chi non può pagare il proprio sostentamento con mezzi propri ha diritto a un sostegno tramite
  l'aiuto sociale. Questo è fornito dal Comune in cui la persona risiede. È l'ultima rete della sicurezza
  sociale.
