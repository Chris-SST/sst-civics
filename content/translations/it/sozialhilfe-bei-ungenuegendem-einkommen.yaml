    question_de: Was bietet die Gemeinde, wenn das Einkommen und das Vermögen einer Person nicht zum Leben
      ausreichen?
    options_de:
      a: Die Sozialhilfe
      b: Eine Baubewilligung
      c: Eine Einbürgerung
      d: Ein Stipendium der obligatorischen Schule
    explanation_de: Wer seinen Lebensunterhalt nicht mit eigenen Mitteln bezahlen kann, hat Anspruch auf
      Unterstützung durch die Sozialhilfe. Diese wird von der Gemeinde erbracht, in der die Person wohnt.
      Sie ist das letzte Netz der sozialen Sicherheit.
