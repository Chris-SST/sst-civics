id: polizei-befugnis-festnahme-straftaeter
lang: it
source_version: 2
question: Quale autorità può arrestare le persone sospettate di aver commesso un reato?
options:
  a: L'autorità scolastica
  b: La polizia
  c: Il Parlamento
  d: L'ufficio delle imposte
explanation: La polizia può arrestare le persone sospettate di un reato alle condizioni previste dalla
  legge. Se una persona sia colpevole lo decide poi un tribunale. L'autorità scolastica, il Parlamento
  e l'ufficio delle imposte non hanno questa facoltà.
