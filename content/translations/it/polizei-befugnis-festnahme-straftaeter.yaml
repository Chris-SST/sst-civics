    question_de: Welche Behörde kann Personen festnehmen, die verdächtigt werden, eine Straftat begangen
      zu haben?
    options_de:
      a: Die Schulbehörde
      b: Die Polizei
      c: Das Parlament
      d: Das Steueramt
    explanation_de: Die Polizei kann Personen, die einer Straftat verdächtigt werden, unter den vom Gesetz
      vorgesehenen Bedingungen festnehmen. Ob eine Person schuldig ist, entscheidet danach ein Gericht.
      Die Schulbehörde, das Parlament und das Steueramt haben diese Befugnis nicht.
