id: arbeitsvertrag-inhalt-lohnhoehe
lang: it
source_version: 1
question: Che cosa viene stabilito, tra l'altro, nel contratto di lavoro tra datore di lavoro e lavoratrice?
options:
  a: L'importo del salario
  b: L'importo della rendita dell'assicurazione vecchiaia e superstiti (AHV)
  c: L'importo dell'imposta sul valore aggiunto
  d: L'importo del premio della cassa malati (Krankenkasse)
explanation: Nel contratto di lavoro vengono concordate le condizioni più importanti del lavoro, per esempio
  l'attività, l'orario di lavoro e il salario. La rendita AVS, l'imposta sul valore aggiunto e il premio
  della cassa malati non sono determinati nel contratto di lavoro.
