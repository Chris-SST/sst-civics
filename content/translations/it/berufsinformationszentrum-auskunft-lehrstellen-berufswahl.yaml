question: Dove si ottengono informazioni su posti di tirocinio, scelta della professione e lavoro?
options:
  a: Nel Centro d'informazione professionale
  b: All'Ufficio dello stato civile
  c: Nella scuola dell'infanzia
  d: All'Ufficio di esecuzione
explanation: Il Centro d'informazione professionale (BIZ) fornisce informazioni e consulenza su posti
  di tirocinio, scelta della professione, formazione continua e lavoro. L'offerta è aperta a giovani e
  adulti. Gli altri uffici e servizi hanno compiti diversi.
