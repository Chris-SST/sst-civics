question: Chi sono i protagonisti principali del Sechseläuten, la festa di primavera di Zurigo?
options:
  a: Le classi scolastiche di Zurigo
  b: Le corporazioni di Zurigo
  c: I presidenti dei comuni (Gemeinde) del Cantone
  d: I membri del Consiglio cantonale (Kantonsrat)
explanation: Durante il Sechseläuten le corporazioni sfilano per la città in costumi storici. Alla sera
