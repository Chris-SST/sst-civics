id: notruf-144-rettungsdienst
lang: it
source_version: 1
question: Quale numero di telefono si compone in Svizzera in caso di emergenza medica per chiamare il
  servizio di soccorso?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: Il numero 144 è il numero di emergenza del servizio di soccorso per le emergenze mediche.
  Il 117 è il numero della polizia e il 118 quello dei pompieri. Il 145 è il numero di Tox Info Suisse
  in caso di intossicazioni.
