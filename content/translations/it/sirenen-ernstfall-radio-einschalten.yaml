    question_de: Im Notfall ertönt der «Allgemeine Alarm» der Sirenen (ein heulender Ton, der auf- und
      abschwillt). Was muss man tun?
    options_de:
      a: Das Haus sofort verlassen
      b: Die Feuerwehr anrufen
      c: Das Radio hören und den Anweisungen der Behörden folgen
      d: Sich mit dem Auto entfernen
    explanation_de: Bei einem Allgemeinen Alarm informieren die Behörden über das Radio darüber, was zu
