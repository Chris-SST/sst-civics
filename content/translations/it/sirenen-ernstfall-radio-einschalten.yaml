id: sirenen-ernstfall-radio-einschalten
lang: it
source_version: 2
question: In caso di emergenza suona l'«Allarme generale» delle sirene (un suono ululante che sale e scende).
  Che cosa deve fare?
options:
  a: Lasciare subito la casa
  b: Chiamare i vigili del fuoco
  c: Ascoltare la radio e seguire le istruzioni delle autorità
  d: Allontanarsi in automobile
explanation: In caso di Allarme generale, le autorità informano tramite la radio su che cosa si deve fare.
  Le informazioni sono disponibili anche nell'app Alertswiss. Si devono seguire le istruzioni e non chiamare
  inutilmente i numeri di emergenza, in modo che rimangano liberi per le vere emergenze.
