    question_de: Welche der folgenden Aufgaben erfüllt in den Zürcher Gemeinden das Einwohneramt?
    options_de:
      a: Es fällt Strafurteile.
      b: Es führt das Einwohnerregister der Gemeinde.
      c: Es erteilt Baubewilligungen für die Kantonsstrassen.
      d: Es legt die Steuergesetze fest.
    explanation_de: Die Gemeinde führt das Register der Personen, die dort wohnen. Dort meldet man sich
      an, meldet man den Wegzug oder teilt die Adressänderung mit, wenn ihr umzieht. Strafurteile, Steuergesetze
      und Kantonsstrassen gehören nicht zu dieser Aufgabe.
