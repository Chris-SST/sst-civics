id: einwohnerregister-fuehren-gemeinde-aufgabe
lang: it
source_version: 1
question: Quale dei seguenti compiti svolge, nei Comuni (Gemeinde) zurighesi, l'ufficio controllo abitanti
  (Einwohneramt)?
options:
  a: Emette sentenze penali.
  b: Tiene il registro degli abitanti del Comune.
  c: Rilascia permessi di costruzione per le strade cantonali.
  d: Stabilisce le leggi fiscali.
explanation: Il Comune tiene il registro delle persone che vi abitano. Lì Lei si annuncia, si annuncia
  la partenza o comunica il cambiamento di indirizzo quando traslocate. Le sentenze penali, le leggi fiscali
  e le strade cantonali non rientrano in questo compito.
