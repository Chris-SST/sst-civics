id: gemeinde-unterste-stufe-staatsaufbau
lang: it
source_version: 2
question: Quale livello si trova in fondo alla struttura statale a tre livelli della Svizzera?
options:
  a: Il Comune (Gemeinde)
  b: La regione
  c: Il Cantone
  d: La Confederazione
explanation: 'La Svizzera è strutturata su tre livelli: Confederazione, Cantoni e Comuni. Il Comune è
  il livello più basso e il più vicino alle persone. Svolge autonomamente molti compiti, per esempio la
  scuola elementare, le licenze edilizie o l''aiuto sociale.'
