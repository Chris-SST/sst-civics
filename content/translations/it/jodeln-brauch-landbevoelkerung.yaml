id: jodeln-brauch-landbevoelkerung
lang: it
source_version: 2
question: Quale tradizione tramandata della popolazione rurale svizzera è un modo di cantare in cui la
  voce passa rapidamente dalla voce di petto alla voce di testa?
options:
  a: Suonare il corno delle Alpi
  b: Jodel (canto jodel)
  c: Hornussen
  d: Lancio della bandiera
explanation: Nello jodel la voce passa rapidamente dalla voce di petto alla voce di testa. Lo jodel è
  una tradizione tramandata della popolazione rurale svizzera. Lo jodel naturale non ha parole, ma molti
  canti jodel hanno un testo.
