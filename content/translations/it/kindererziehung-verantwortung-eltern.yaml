id: kindererziehung-verantwortung-eltern
lang: it
source_version: 1
question: Chi è il principale responsabile dell'educazione dei figli in Svizzera?
options:
  a: Il Comune (Gemeinde)
  b: I genitori
  c: La scuola
  d: Il Cantone
explanation: Secondo il Codice civile, i genitori provvedono al bene del figlio e ne dirigono l'educazione.
  La scuola integra questo compito con l'istruzione. Lo Stato interviene solo quando il bene del figlio
  è in pericolo.
