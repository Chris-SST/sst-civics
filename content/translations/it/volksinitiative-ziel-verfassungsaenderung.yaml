id: volksinitiative-ziel-verfassungsaenderung
lang: it
source_version: 2
question: Che cosa possono chiedere gli aventi diritto di voto con un'iniziativa popolare (Volksinitiative)
  federale?
options:
  a: Che il Consiglio federale (Bundesrat) non sia rieletto
  b: Che la Costituzione federale sia modificata
  c: Che una legge federale esistente sia abrogata direttamente
  d: Che la costituzione cantonale sia modificata
explanation: Con un'iniziativa popolare federale gli aventi diritto di voto possono chiedere una modifica
  della Costituzione federale. Con un referendum, invece, il popolo può votare su una nuova legge che
  il Parlamento ha appena approvato. Con il referendum non si può abrogare una legge già esistente.
