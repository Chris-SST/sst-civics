id: parlament-zwei-kammern-bund
lang: it
source_version: 1
question: Da quali due camere è composto il Parlamento svizzero a livello federale?
options:
  a: Dal Consiglio federale (Bundesrat) e dal Consiglio degli Stati (Ständerat)
  b: Dal Consiglio federale (Bundesrat) e dal Consiglio nazionale (Nationalrat)
  c: Dal Consiglio degli Stati (Ständerat) e dal Tribunale federale (Bundesgericht)
  d: Dal Consiglio nazionale (Nationalrat) e dal Consiglio degli Stati (Ständerat)
explanation: 'L''Assemblea federale (Bundesversammlung), il Parlamento della Confederazione, è composta
  da due camere: il Consiglio nazionale e il Consiglio degli Stati. Il Consiglio federale è il Governo
  e non fa parte del Parlamento.'
