id: nationalhymne-schweizerpsalm
lang: it
source_version: 1
question: Come si chiama l'inno nazionale della Svizzera?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Salmo svizzero
explanation: L'inno nazionale della Svizzera è il Salmo svizzero. Il Consiglio federale (Bundesrat) lo
  ha dichiarato definitivamente inno nazionale nel 1981. In precedenza veniva spesso cantato «Rufst du,
  mein Vaterland».
