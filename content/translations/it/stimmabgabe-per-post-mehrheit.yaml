    question_de: Wie geben heute in der Schweiz die meisten Stimmberechtigten ihre Stimme bei Abstimmungen
      und Wahlen ab?
    options_de:
      a: Sie geben sie am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie legen sie am Abstimmungssonntag persönlich in die Urne.
      c: Sie schicken sie per Post an die Gemeinde.
      d: Sie geben sie über eine Internetseite des Bundes ab.
    explanation_de: Die meisten Stimmberechtigten stimmen brieflich ab, das heisst auf dem Postweg. Am
      Abstimmungssonntag an die Urne zu gehen, ist heute für die Mehrheit nicht mehr üblich.
