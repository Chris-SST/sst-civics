id: stimmabgabe-per-post-mehrheit
lang: it
source_version: 1
question: Come esprimono oggi il proprio voto in Svizzera la maggior parte degli aventi diritto di voto
  nelle votazioni e nelle elezioni?
options:
  a: Lo esprimono la domenica della votazione nell'assemblea comunale (Gemeindeversammlung).
  b: Lo depositano personalmente nell'urna la domenica della votazione.
  c: Lo inviano per posta al Comune (Gemeinde).
  d: Lo esprimono tramite un sito internet della Confederazione.
explanation: La maggior parte degli aventi diritto di voto vota per corrispondenza, cioè per via postale.
  Recarsi alle urne la domenica della votazione oggi non è più usuale per la maggioranza.
