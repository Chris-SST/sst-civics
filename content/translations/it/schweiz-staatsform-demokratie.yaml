id: schweiz-staatsform-demokratie
lang: it
source_version: 1
question: Che forma di Stato ha la Svizzera?
options:
  a: È una dittatura con un solo partito.
  b: È una monarchia con un re eletto.
  c: È uno Stato democratico.
  d: È uno Stato governato da una famiglia nobile.
explanation: La Svizzera è una democrazia. La popolazione partecipa alle decisioni politiche attraverso
  le elezioni e le votazioni. La Costituzione federale sancisce questo principio come fondamento dello
  Stato.
