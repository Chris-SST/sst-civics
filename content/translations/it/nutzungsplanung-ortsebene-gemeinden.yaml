    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie der Boden genutzt wird, zum Beispiel
      wo sich die Wohnzonen und die Gewerbe- oder Handelszonen befinden?
    options_de:
      a: Die Schweizerische Bundesversammlung
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Einzig die Bezirksräte
    explanation_de: Die Gemeinden erlassen die Nutzungsplanung für ihr eigenes Gebiet, zum Beispiel die
      Bau- und Zonenordnung. Dabei halten sie die Vorgaben des Bundes und des Kantons ein. Auf diese Weise
      tragen sie dazu bei, mitzuentscheiden, wie sich der Ort entwickelt.
