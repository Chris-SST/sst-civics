id: nutzungsplanung-ortsebene-gemeinden
lang: it
source_version: 1
question: Chi pianifica nel Cantone di Zurigo, a livello locale, come viene utilizzato il suolo, ad esempio
  dove si trovano le zone residenziali e le zone artigianali o commerciali?
options:
  a: L'Assemblea federale svizzera (Bundesversammlung)
  b: La polizia cantonale
  c: I Comuni (Gemeinden)
  d: I soli consigli distrettuali
explanation: I Comuni emanano la pianificazione dell'utilizzazione per il proprio territorio, ad esempio
  il regolamento edilizio e delle zone. In questo, rispettano le disposizioni della Confederazione e del
  Cantone. In questo modo contribuiscono a decidere come si sviluppa la località.
