    question_de: Welche staatliche Ebene in der Schweiz ist dafür verantwortlich, die soziale Sicherheit
      der Bevölkerung zu gewährleisten, zum Beispiel durch die Altersvorsorge?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Der Bund
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung überträgt dem Bund wichtige Aufgaben im Bereich der sozialen
