id: soziale-sicherheit-bund-verantwortung
lang: it
source_version: 1
question: Quale livello dello Stato in Svizzera ha la responsabilità di garantire la sicurezza sociale
  della popolazione, ad esempio mediante la previdenza per la vecchiaia?
options:
  a: I distretti
  b: Solo i Comuni (Gemeinden)
  c: La Confederazione
  d: Solo i Cantoni
explanation: La Costituzione federale attribuisce alla Confederazione importanti compiti in materia di
  sicurezza sociale. Ne fanno parte, ad esempio, l'assicurazione vecchiaia e superstiti (AVS) (Alters-
  und Hinterlassenenversicherung, AHV) e l'assicurazione per l'invalidità. In questo modo vigono basi
  uniformi per tutta la Svizzera.
