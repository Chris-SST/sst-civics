id: bezeichnung-regierung-bund-bundesrat
lang: it
source_version: 1
question: Come si chiama il governo della Svizzera a livello federale?
options:
  a: Assemblea federale (Bundesversammlung)
  b: Consiglio federale (Bundesrat)
  c: Cancelleria federale (Bundeskanzlei)
  d: Tribunale federale (Bundesgericht)
explanation: Il governo della Confederazione si chiama Consiglio federale. L'Assemblea federale è il Parlamento,
  il Tribunale federale è il tribunale supremo. La Cancelleria federale assiste il Consiglio federale.
