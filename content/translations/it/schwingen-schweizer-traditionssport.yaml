    question_de: Welcher traditionelle Sport in der Schweiz ist eine Art Ringkampf?
    options_de:
      a: Hornussen
      b: Schwingen
      c: Curling
      d: Steinstossen
    explanation_de: 'Das Schwingen ist ein Kampf zwischen zwei Personen auf einer runden, mit Sägemehl
      bestreuten Fläche und gilt als traditioneller Schweizer Sport. Auch das Hornussen und das Steinstossen
