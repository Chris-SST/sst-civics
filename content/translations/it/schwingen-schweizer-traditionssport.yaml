question: Quale sport tradizionale in Svizzera è una specie di lotta?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'Lo Schwingen è una lotta tra due persone su un''area rotonda cosparsa di segatura ed è considerato
  uno sport tradizionale svizzero. Anche l''Hornussen e lo Steinstossen sono antichi sport svizzeri, ma
  non sono lotte: nell''Hornussen si colpisce un piccolo disco facendolo volare lontano nell''aria, nello
  Steinstossen si lancia una pietra pesante. Il curling si gioca sul ghiaccio e ha origine in Scozia.'
