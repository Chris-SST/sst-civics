    question_de: Wie oft im Jahr finden in der Schweiz normalerweise eidgenössische Volksabstimmungen
      statt?
    options_de:
      a: Einmal
      b: Nur alle vier Jahre
      c: Bis zu viermal
      d: Jeden Monat
    explanation_de: Für eidgenössische Volksabstimmungen sind bis zu vier Abstimmungssonntage pro Jahr
      vorgesehen. An einem einzelnen Datum wird oft über mehrere Vorlagen gleichzeitig abgestimmt. Alle
      vier Jahre hingegen finden die Wahlen des Nationalrats statt, die keine Abstimmungen sind.
