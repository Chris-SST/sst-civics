id: eidgenoessische-abstimmungstermine-pro-jahr
lang: it
source_version: 1
question: Quante volte all'anno si tengono normalmente in Svizzera le votazioni popolari federali?
options:
  a: Una volta
  b: Solo ogni quattro anni
  c: Fino a quattro volte
  d: Ogni mese
explanation: Per le votazioni popolari federali sono previste fino a quattro domeniche di votazione all'anno.
  In una singola data si vota spesso su più oggetti contemporaneamente. Ogni quattro anni, invece, si
  tengono le elezioni del Consiglio nazionale (Nationalrat), che non sono votazioni.
