    question_de: Wozu dient die Steuererklärung, die die Steuerpflichtigen jedes Jahr ausfüllen?
    options_de:
      a: Sie dient der Anmeldung beim Einwohnerkontrollamt.
      b: Sie ist der Antrag auf eine Krankenversicherung.
      c: Sie ist die Anmeldung für den Zivildienst.
      d: Sie dient dazu, den Steuerbehörden die eigenen finanziellen Verhältnisse bekannt zu geben.
    explanation_de: Mit der Steuererklärung geben die Steuerpflichtigen Einkommen, Vermögen und Abzüge
      an. Auf dieser Grundlage berechnet die Steuerbehörde die Steuer.
