id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: it
source_version: 1
question: A cosa serve la dichiarazione d'imposta che i contribuenti compilano ogni anno?
options:
  a: Serve per la registrazione presso l'ufficio controllo abitanti.
  b: È la richiesta di un'assicurazione malattia.
  c: È l'iscrizione al servizio civile (Zivildienst).
  d: Serve a rendere note alle autorità fiscali le proprie condizioni finanziarie.
explanation: Con la dichiarazione d'imposta i contribuenti indicano reddito, patrimonio e deduzioni. Su
  questa base l'autorità fiscale calcola l'imposta.
