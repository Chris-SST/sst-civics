question: Quale settore economico era il più importante all'inizio dell'industrializzazione della Svizzera?
options:
  a: L'industria orologiera
  b: L'industria farmaceutica
  c: L'industria tessile
  d: L'industria meccanica
explanation: All'inizio dell'industrializzazione l'industria tessile ha caratterizzato l'economia svizzera,
  ad esempio con filature, tessiture e ricami. Un esempio noto sono i ricami di San Gallo, che erano molto
  richiesti in tutto il mondo. Gli altri settori sono diventati così importanti solo più tardi.
