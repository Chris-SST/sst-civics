id: absicherung-krankheit-unfall-sozialversicherung
lang: it
source_version: 1
question: Da quali rischi protegge, tra l'altro, il sistema delle assicurazioni sociali della Svizzera?
options:
  a: Dalle perdite negli investimenti finanziari privati
  b: Dai danni all'automobile e alle suppellettili domestiche causati da furto
  c: Dalle conseguenze di malattia e infortunio
  d: Dagli aumenti dei prezzi degli affitti
explanation: Le assicurazioni sociali proteggono le persone dalle conseguenze finanziarie di importanti
  rischi della vita. Tra questi rientrano la malattia e l'infortunio. L'assicurazione malattie e l'assicurazione
  contro gli infortuni ne sono esempi.
