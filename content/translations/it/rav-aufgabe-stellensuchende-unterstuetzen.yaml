id: rav-aufgabe-stellensuchende-unterstuetzen
lang: it
source_version: 1
question: Quale compito ha l'Ufficio regionale di collocamento (URC)?
options:
  a: Controlla i salari nelle aziende
  b: Versa una rendita a tutti gli abitanti
  c: Sostiene le persone in cerca di impiego nella ricerca di lavoro e media posti di lavoro
  d: Rilascia certificati di lavoro alle persone in cerca di impiego
explanation: L'URC è il punto di contatto regionale per le persone in cerca di impiego. Le consiglia e
  media loro posti di lavoro. Nel Cantone di Zurigo fa parte dell'Ufficio del lavoro.
