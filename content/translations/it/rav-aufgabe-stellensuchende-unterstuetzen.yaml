    question_de: Welche Aufgabe hat das Regionale Arbeitsvermittlungszentrum (RAV)?
    options_de:
      a: Es kontrolliert die Löhne in den Unternehmen
      b: Es zahlt allen Einwohnerinnen und Einwohnern eine Rente aus
      c: Es unterstützt Stellensuchende bei der Arbeitssuche und vermittelt Arbeitsstellen
      d: Es stellt Stellensuchenden Arbeitszeugnisse aus
    explanation_de: Das RAV ist die regionale Anlaufstelle für Stellensuchende. Es berät sie und vermittelt
      ihnen Arbeitsstellen. Im Kanton Zürich ist es Teil des Amtes für Arbeit.
