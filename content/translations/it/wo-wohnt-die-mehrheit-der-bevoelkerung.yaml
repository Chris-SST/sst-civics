id: wo-wohnt-die-mehrheit-der-bevoelkerung
lang: it
source_version: 2
question: In quale zona della Svizzera vive la maggioranza della popolazione?
options:
  a: Nelle Alpi
  b: In Ticino
  c: Nell'Altopiano
  d: Nel Giura
explanation: L'Altopiano si trova tra il Giura e le Alpi. Qui si trovano la maggior parte delle grandi
  città e vive la maggior parte della popolazione. Le Alpi coprono sì una vasta superficie, ma sono poco
  popolate.
