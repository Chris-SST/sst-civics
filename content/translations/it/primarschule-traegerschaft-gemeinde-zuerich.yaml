id: primarschule-traegerschaft-gemeinde-zuerich
lang: it
source_version: 2
question: Chi gestisce le scuole del livello primario nel Cantone di Zurigo?
options:
  a: La Direzione dell'istruzione del Cantone
  b: La Confederazione
  c: I Comuni (Gemeinden)
  d: I distretti
explanation: Nel Cantone di Zurigo sono i Comuni a gestire le scuole primarie. A seconda della località,
  si tratta dei Comuni politici o di appositi Comuni scolastici, e la Pflege scolastica eletta (Schulpflege)
  è l'autorità scolastica locale. Il Cantone si limita a stabilire il quadro generale, ad esempio il piano
  di studio, e vigila sulla scuola dell'obbligo.
