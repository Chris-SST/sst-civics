id: bundeshaus-bern-sitz-parlament
lang: it
source_version: 1
question: Quale edificio di Berna è la sede delle sedute del Parlamento svizzero?
options:
  a: Il Kornhaus
  b: Il municipio (Rathaus)
  c: Il Tribunale amministrativo federale
  d: Il Palazzo federale (Bundeshaus)
explanation: Il Parlamento svizzero si riunisce nel Palazzo federale (Bundeshaus) a Berna. Qui il Consiglio
  nazionale e il Consiglio degli Stati (Ständerat) si incontrano per le loro sessioni. Il Rathaus è un
  edificio del Cantone di Berna o della città, non del Parlamento della Confederazione.
