    question_de: Welche politische Möglichkeit haben im Kanton Zürich Ausländerinnen und Ausländer, die
      kein Stimmrecht haben?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können die Mitglieder des Kantonsrats wählen.
      c: Sie können sich mit einer Petition an die Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen Personen offen, auch jenen ohne Stimmrecht. Auf diese
      Weise können sie den Behörden schriftlich Anliegen, Wünsche oder Kritik mitteilen. Nur Personen
      mit Stimmrecht können abstimmen, wählen und Initiativen unterzeichnen.
