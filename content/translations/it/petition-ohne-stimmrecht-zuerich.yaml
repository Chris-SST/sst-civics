id: petition-ohne-stimmrecht-zuerich
lang: it
source_version: 1
question: Quale possibilità politica hanno nel Cantone di Zurigo gli stranieri e le straniere che non
  hanno il diritto di voto?
options:
  a: Possono votare alle urne su oggetti cantonali.
  b: Possono eleggere i membri del Consiglio cantonale (Kantonsrat).
  c: Possono rivolgersi alle autorità con una petizione.
  d: Possono presentare un'iniziativa popolare (Volksinitiative) nel Cantone.
explanation: Il diritto di petizione è aperto a tutte le persone, anche a quelle senza diritto di voto.
  In questo modo possono comunicare alle autorità per iscritto richieste, desideri o critiche. Solo le
  persone con diritto di voto possono votare, eleggere e firmare iniziative.
