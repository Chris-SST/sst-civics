id: volksinitiative-sammelfrist-monate
lang: it
source_version: 1
question: Di quanto tempo dispongono i promotori dell'iniziativa per raccogliere le firme per un'iniziativa
  popolare (Volksinitiative) federale?
options:
  a: 6 mesi
  b: 12 mesi
  c: 18 mesi
  d: 36 mesi
explanation: Il termine per la raccolta delle firme è di 18 mesi dalla pubblicazione nel Foglio federale.
  Se in questo periodo non riescono a raccogliere le 100 000 firme necessarie, l'iniziativa non riesce.
