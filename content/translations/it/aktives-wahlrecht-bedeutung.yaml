    question_de: Was bedeutet aktives Stimmrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht, in ein Amt gewählt zu werden
      c: Das Recht, im Parlament parlamentarische Vorstösse einzureichen
      d: Das Recht, an den Wahlen und Abstimmungen teilzunehmen und seine Stimme abzugeben
    explanation_de: Wer das aktive Stimmrecht hat, kann bei Wahlen und Abstimmungen persönlich seine Stimme
      abgeben, zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, in
      ein Amt gewählt zu werden, heisst hingegen passives Stimmrecht.
