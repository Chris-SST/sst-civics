id: aktives-wahlrecht-bedeutung
lang: it
source_version: 3
question: Che cosa significa diritto di voto attivo?
options:
  a: Il diritto di fondare un partito
  b: Il diritto di essere eletti a una carica
  c: Il diritto di presentare interventi parlamentari in Parlamento
  d: Il diritto di partecipare alle elezioni e alle votazioni ed esprimere il proprio voto
explanation: Chi ha il diritto di voto attivo può esprimere personalmente il proprio voto nelle elezioni
  e nelle votazioni, ad esempio nell'elezione del Consiglio nazionale (Nationalrat) o in una votazione
  popolare. Il diritto di essere eletti a una carica si chiama invece diritto di voto passivo.
