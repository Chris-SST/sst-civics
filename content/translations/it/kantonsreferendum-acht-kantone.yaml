    question_de: Wer kann ein fakultatives Referendum gegen ein Bundesgesetz verlangen, neben 50'000 Stimmberechtigten?
    options_de:
      a: Acht Kantone
      b: Drei grosse Parteien zusammen
      c: Der Bundesrat
      d: Das Bundesgericht
    explanation_de: Gemäss der Bundesverfassung können auch acht Kantone eine Volksabstimmung über ein
