id: kantonsreferendum-acht-kantone
lang: it
source_version: 1
question: Chi può chiedere un referendum facoltativo contro una legge federale, oltre a 50'000 aventi
  diritto di voto?
options:
  a: Otto Cantoni
  b: Tre grandi partiti insieme
  c: Il Consiglio federale (Bundesrat)
  d: Il Tribunale federale (Bundesgericht)
explanation: Secondo la Costituzione federale, anche otto Cantoni possono chiedere una votazione popolare
  su una legge federale. Questo si chiama referendum dei Cantoni. Viene utilizzato raramente, ma dimostra
  che i Cantoni hanno diritti di partecipazione nello Stato federale.
