    question_de: Wozu dient eine Volksinitiative den Stimmberechtigten?
    options_de:
      a: Damit können sie ein Urteil des Bundesgerichts ändern.
      b: Damit können sie ihre eigenen Anliegen auf die politische Agenda bringen.
      c: Damit können sie das Datum der nächsten Wahlen festlegen.
      d: Damit können sie ein Gesetz des Parlaments verhindern.
    explanation_de: Mit einer Volksinitiative können die Stimmberechtigten eine Änderung der Bundesverfassung
      vorschlagen. Wenn die Initiative zustande kommt, wird sie zur Abstimmung gebracht. Auf diese Weise
      können sie ihre Anliegen auch gegen den Willen des Parlaments geltend machen, wenn Volk und Stände
      zustimmen.
