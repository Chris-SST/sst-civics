id: volksinitiative-eigene-forderungen-durchsetzen
lang: it
source_version: 1
question: A cosa serve un'iniziativa popolare (Volksinitiative) agli aventi diritto di voto?
options:
  a: Con essa possono modificare una sentenza del Tribunale federale (Bundesgericht).
  b: Con essa possono portare le proprie richieste sull'agenda politica.
  c: Con essa possono stabilire la data delle prossime elezioni.
  d: Con essa possono impedire una legge del Parlamento.
explanation: Con un'iniziativa popolare gli aventi diritto di voto possono proporre una modifica della
  Costituzione federale. Se l'iniziativa riesce, viene messa in votazione. In questo modo possono far
  valere le proprie istanze anche contro la volontà del Parlamento, se Popolo e Cantoni approvano.
