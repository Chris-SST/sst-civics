    question_de: Welche der folgenden Einrichtungen gehört zur Bundesverwaltung?
    options_de:
      a: Der Nationalrat
      b: Die Bundesversammlung
      c: Das Bundesgericht
      d: Das Departement für Justiz und Polizei
    explanation_de: Die Bundesverwaltung ist in Departemente gegliedert. Das Departement für Justiz und
      Polizei ist eines davon und gehört unter der Leitung des Bundesrates zur Verwaltung. Der Nationalrat
      und die Bundesversammlung gehören zum Parlament, das Bundesgericht gehört zur richterlichen Gewalt.
