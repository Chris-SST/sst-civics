id: bundesverwaltung-justiz-und-polizeidepartement
lang: it
source_version: 1
question: Quale delle seguenti entità fa parte dell'amministrazione federale?
options:
  a: Il Consiglio nazionale (Nationalrat)
  b: L'Assemblea federale (Bundesversammlung)
  c: Il Tribunale federale (Bundesgericht)
  d: Il Dipartimento di giustizia e polizia
explanation: L'amministrazione federale è suddivisa in dipartimenti. Il Dipartimento di giustizia e polizia
  è uno di questi e fa parte dell'amministrazione sotto la direzione del Consiglio federale (Bundesrat).
  Il Consiglio nazionale e l'Assemblea federale fanno parte del Parlamento, il Tribunale federale appartiene
  al potere giudiziario.
