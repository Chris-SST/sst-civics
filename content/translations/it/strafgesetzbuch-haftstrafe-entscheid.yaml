id: strafgesetzbuch-haftstrafe-entscheid
lang: it
source_version: 1
question: Da quale legge dipende se una persona deve scontare una pena detentiva?
options:
  a: Dal Codice civile
  b: Dal Codice delle obbligazioni
  c: Dal diritto di locazione
  d: Dal Codice penale
explanation: Il Codice penale stabilisce quali azioni sono punibili e quali pene sono previste per esse.
  Tra queste rientrano le pene pecuniarie e le pene detentive. La pena nel singolo caso è decisa da un
  tribunale.
