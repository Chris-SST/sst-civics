    question_de: Von welchem Gesetz hängt es ab, ob eine Person eine Freiheitsstrafe verbüssen muss?
    options_de:
      a: Vom Zivilgesetzbuch
      b: Vom Obligationenrecht
      c: Vom Mietrecht
      d: Vom Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch legt fest, welche Handlungen strafbar sind und welche Strafen
