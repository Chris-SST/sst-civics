id: umweltschutz-aufgabe-des-bundes
lang: it
source_version: 1
question: Quale livello è competente in Svizzera per proteggere l'ambiente ed emanare le relative disposizioni?
options:
  a: La Confederazione
  b: Le organizzazioni private
  c: Soltanto i Comuni (Gemeinden)
  d: Soltanto i distretti
explanation: La Costituzione federale incarica la Confederazione di proteggere l'essere umano e l'ambiente
  dagli effetti dannosi. A tal fine la Confederazione emana leggi, ad esempio sulla protezione delle acque
  e della natura. I Cantoni attuano molte di queste disposizioni.
