    question_de: Welche Ebene ist in der Schweiz zuständig, die Umwelt zu schützen und die entsprechenden
      Vorschriften zu erlassen?
    options_de:
      a: Der Bund
      b: Die privaten Organisationen
      c: Nur die Gemeinden
      d: Nur die Bezirke
    explanation_de: Die Bundesverfassung beauftragt den Bund, den Menschen und die Umwelt vor schädlichen
      Einwirkungen zu schützen. Zu diesem Zweck erlässt der Bund Gesetze, zum Beispiel zum Schutz der
      Gewässer und der Natur. Die Kantone setzen viele dieser Vorschriften um.
