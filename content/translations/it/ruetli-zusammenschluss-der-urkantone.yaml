id: ruetli-zusammenschluss-der-urkantone
lang: it
source_version: 1
question: Che cosa rappresenta il Grütli nella storia svizzera?
options:
  a: L'unione dei Cantoni primitivi
  b: La vittoria nella battaglia di Marignano
  c: L'inizio della Riforma
  d: La fondazione dello Stato federale nel 1848
explanation: Secondo la tradizione, sul Grütli i rappresentanti dei Cantoni primitivi avrebbero stretto
  un'alleanza. Per questo è considerato un simbolo delle origini della Confederazione. Il prato si trova
  sul Lago dei Quattro Cantoni.
