id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: it
source_version: 1
question: Quale di queste imposte riscuotono il Cantone Zurigo e i Comuni (Gemeinden) sul patrimonio di
  una persona, ad esempio sugli averi bancari e sui titoli?
options:
  a: L'imposta preventiva
  b: L'imposta sul valore aggiunto
  c: L'imposta sulla sostanza
  d: L'imposta sugli oli minerali
explanation: Il Cantone e i Comuni tassano la sostanza delle persone fisiche. L'imposta sul valore aggiunto,
  l'imposta preventiva e l'imposta sugli oli minerali sono imposte della Confederazione.
