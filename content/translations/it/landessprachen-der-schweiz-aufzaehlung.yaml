id: landessprachen-der-schweiz-aufzaehlung
lang: it
source_version: 1
question: Quali lingue sono lingue nazionali in Svizzera?
options:
  a: Tedesco, francese, romancio e spagnolo
  b: Tedesco, francese, italiano e romancio
  c: Tedesco, francese, italiano e inglese
  d: Tedesco, francese e italiano
explanation: La Costituzione federale indica il tedesco, il francese, l'italiano e il romancio come lingue
  nazionali. L'inglese non è una lingua nazionale, ma viene spesso utilizzato come lingua di comunicazione.
