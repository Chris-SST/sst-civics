id: zuercher-parlament-bezeichnung-kantonsrat
lang: it
source_version: 1
question: Come si chiama il parlamento del Cantone di Zurigo?
options:
  a: Gran Consiglio
  b: Landrat
  c: Consiglio comunale (Gemeinderat)
  d: Consiglio cantonale (Kantonsrat)
explanation: Il parlamento del Cantone di Zurigo si chiama Consiglio cantonale. Altri Cantoni utilizzano
  denominazioni diverse, ad esempio Gran Consiglio o Landrat. Il consiglio comunale è invece un'autorità
  a livello di Comune (Gemeinde).
