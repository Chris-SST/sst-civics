id: arbeitslosenversicherung-bei-stellenverlust
lang: it
source_version: 1
question: Quale assicurazione sociale interviene quando una persona perde il posto di lavoro?
options:
  a: L'assicurazione per l'invalidità
  b: L'assicurazione per la vecchiaia e per i superstiti
  c: L'assicurazione contro la disoccupazione
  d: L'assicurazione contro gli infortuni
explanation: L'assicurazione contro la disoccupazione versa, a determinate condizioni, un'indennità quando
  una persona perde il posto di lavoro. Aiuta inoltre a cercare un nuovo lavoro.
