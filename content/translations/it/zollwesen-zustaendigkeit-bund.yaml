id: zollwesen-zustaendigkeit-bund
lang: it
source_version: 1
question: Chi si occupa in Svizzera del settore doganale?
options:
  a: La Confederazione
  b: I Comuni (Gemeinden) situati al confine
  c: I Cantoni in cui si trovano i confini
  d: I Cantoni e la Confederazione, ciascuno per metà
explanation: Secondo la Costituzione federale, il settore doganale è di competenza della Confederazione.
  Essa disciplina i dazi e il controllo del traffico di merci attraverso il confine. I Cantoni e i Comuni
  non hanno in questo ambito alcuna competenza propria.
