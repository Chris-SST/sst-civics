id: fahren-alkohol-drogen-ausweisentzug
lang: it
source_version: 1
question: Che cosa rischia una persona che guida un'automobile in stato di ebbrezza o sotto l'effetto
  di stupefacenti?
options:
  a: La perdita del diritto di voto
  b: L'espulsione dal comune di domicilio
  c: La revoca dell'assicurazione malattia
  d: La revoca della licenza di condurre
explanation: Chi non è in grado di guidare mette in pericolo gli altri nella circolazione stradale. Per
  questo l'autorità può revocare la licenza di condurre. A ciò possono aggiungersi anche multe o altre
  pene.
