id: einzige-obligatorische-versicherung-krankenversicherung
lang: it
source_version: 1
question: Quale delle seguenti assicurazioni è obbligatoria per legge in Svizzera per tutti gli abitanti?
options:
  a: L'assicurazione di protezione giuridica
  b: L'assicurazione malattie
  c: L'assicurazione di viaggio
  d: L'assicurazione di economia domestica
explanation: L'assicurazione malattie è obbligatoria per tutte le persone domiciliate in Svizzera. Le
  assicurazioni di economia domestica, di protezione giuridica e di viaggio sono facoltative.
