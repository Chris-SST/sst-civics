question: Quale importante movimento religioso ha segnato nel XVI secolo l'Europa e anche la Svizzera?
options:
  a: La Riforma
  b: L'Illuminismo
  c: La Rigenerazione
  d: La Repubblica elvetica
explanation: Nel XVI secolo la Riforma ha diviso la Chiesa in Europa. In Svizzera furono importanti, ad
