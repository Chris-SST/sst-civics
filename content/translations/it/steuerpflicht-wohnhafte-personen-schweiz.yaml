id: steuerpflicht-wohnhafte-personen-schweiz
lang: it
source_version: 1
question: Chi in Svizzera è in linea di principio tenuto a pagare le imposte?
options:
  a: Le persone che risiedono in Svizzera
  b: Solo le persone che gestiscono un'impresa
  c: Solo le persone con cittadinanza (Bürgerrecht) svizzera
  d: Solo le persone che hanno il diritto di voto
explanation: L'obbligo fiscale dipende dal domicilio e non dalla cittadinanza. Anche le straniere e gli
  stranieri che risiedono in Svizzera pagano le imposte. Il diritto di voto non ha alcun ruolo in questo
  contesto.
