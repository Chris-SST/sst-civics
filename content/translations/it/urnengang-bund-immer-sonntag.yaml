id: urnengang-bund-immer-sonntag
lang: it
source_version: 1
question: In quale giorno della settimana si svolgono in Svizzera le votazioni e le elezioni federali?
options:
  a: Sempre di domenica
  b: Sempre di sabato
  c: Sempre di venerdì
  d: In un giorno della settimana che ogni Cantone sceglie autonomamente
explanation: Gli appuntamenti alle urne a livello di Confederazione si svolgono sempre di domenica. In
  questo modo può partecipare il maggior numero possibile di aventi diritto di voto e la data è la stessa
  per tutti.
