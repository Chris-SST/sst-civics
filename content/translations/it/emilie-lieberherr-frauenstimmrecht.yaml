id: emilie-lieberherr-frauenstimmrecht
lang: it
source_version: 1
question: Per che cosa si impegnò la politica zurighese Emilie Lieberherr?
options:
  a: Per la costruzione dell'aeroporto di Zurigo
  b: Per l'adesione della Svizzera all'ONU
  c: Per il diritto di voto e di eleggibilità delle donne
  d: Per l'abolizione dell'assemblea comunale (Gemeindeversammlung)
explanation: Negli anni Sessanta Emilie Lieberherr lottò per il diritto di voto e di eleggibilità delle
  donne. A livello di Confederazione fu introdotto nel 1971. Nel Cantone di Zurigo vale dal 1970.
