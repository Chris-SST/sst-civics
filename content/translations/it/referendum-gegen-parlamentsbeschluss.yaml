id: referendum-gegen-parlamentsbeschluss
lang: it
source_version: 1
question: Contro quali decisioni è diretto un referendum a livello federale?
options:
  a: Contro le leggi approvate dal Consiglio nazionale (Nationalrat) e dal Consiglio degli Stati (Ständerat)
  b: Contro le decisioni prese dalla Cancelleria federale (Bundeskanzlei)
  c: Contro le sentenze emesse dal Tribunale federale (Bundesgericht)
  d: Contro le ordinanze emanate dai singoli Comuni (Gemeinden)
explanation: Un referendum è diretto contro le leggi approvate dal Parlamento. Il Parlamento è composto
  dal Consiglio nazionale e dal Consiglio degli Stati. Le sentenze dei tribunali e le decisioni dell'amministrazione
  non possono essere impugnate con un referendum.
