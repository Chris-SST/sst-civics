    question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Bundesebene?
    options_de:
      a: Gegen die Gesetze, die vom Nationalrat und vom Ständerat verabschiedet wurden
      b: Gegen die Entscheide der Bundeskanzlei
      c: Gegen die Urteile des Bundesgerichts
      d: Gegen die Verordnungen, die von den einzelnen Gemeinden erlassen wurden
    explanation_de: Ein Referendum richtet sich gegen die vom Parlament verabschiedeten Gesetze. Das Parlament
      besteht aus dem Nationalrat und dem Ständerat. Die Urteile der Gerichte und die Entscheide der Verwaltung
      können nicht mit einem Referendum angefochten werden.
