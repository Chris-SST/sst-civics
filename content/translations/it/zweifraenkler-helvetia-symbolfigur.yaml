question: Quale figura simbolica è raffigurata sulla moneta da due franchi?
options:
  a: Il Cervino
  b: Helvetia
  c: Guglielmo Tell
  d: Un membro del Consiglio federale (Bundesrat) svizzero
explanation: Sulla moneta svizzera da due franchi è raffigurata Helvetia, la figura simbolica femminile
