    source_version: 1
    question_de: Eine Arbeitnehmerin hält ihre Kündigung für unbegründet und will sich dagegen wehren.
      Welche Behörde behandelt diese Streitigkeiten aus dem Arbeitsverhältnis?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungsamt
    explanation_de: Das Arbeitsgericht ist für die Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern
      zuständig. Dazu gehört auch die Streitigkeit über eine Kündigung. Das RAV hingegen bietet Hilfe
      bei der Stellensuche.
