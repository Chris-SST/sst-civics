id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: it
source_version: 1
question: Una lavoratrice ritiene che il proprio licenziamento sia infondato e vuole opporvisi. Quale
  autorità tratta queste controversie derivanti dal rapporto di lavoro?
options:
  a: L'Ufficio regionale di collocamento (URC)
  b: L'Ufficio della circolazione
  c: Il Tribunale del lavoro
  d: L'Ufficio di esecuzione
explanation: Il Tribunale del lavoro è competente per le controversie tra datori di lavoro e lavoratori.
  Ne fa parte anche la controversia relativa a un licenziamento. L'URC, invece, offre aiuto nella ricerca
  di un impiego.
