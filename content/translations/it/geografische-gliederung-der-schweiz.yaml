question: In quali tre grandi regioni paesaggistiche si suddivide geograficamente la Svizzera?
options:
  a: Giura, Altopiano e Alpi
  b: Giura, Lago di Costanza e Alpi
  c: Foresta Nera, Altopiano e Alpi
  d: Altopiano, Prealpi e Ticino
explanation: Il Giura si trova a nord-ovest, le Alpi occupano la maggior parte della superficie. Tra di
  essi si trova l'Altopiano, dove vive la maggior parte della popolazione.
