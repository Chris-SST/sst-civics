id: ehe-verbot-nahe-blutsverwandtschaft
lang: it
source_version: 1
question: Chi in Svizzera non può sposarsi?
options:
  a: Le persone che sono già state divorziate
  b: Le persone originarie di Cantoni diversi
  c: Le persone che sono strettamente legate da vincoli di sangue
  d: Le persone che abitano in Comuni (Gemeinde) diversi
explanation: Il matrimonio tra consanguinei stretti è vietato, ad esempio tra fratelli e sorelle o tra
  genitori e figli. L'origine, il luogo di domicilio e un precedente divorzio, invece, non costituiscono
  un impedimento al matrimonio.
