    question_de: Wer darf in der Schweiz nicht heiraten?
    options_de:
      a: Personen, die bereits geschieden waren
      b: Personen, die aus verschiedenen Kantonen stammen
      c: Personen, die eng blutsverwandt sind
      d: Personen, die in verschiedenen Gemeinden wohnen
    explanation_de: Die Ehe zwischen nahen Blutsverwandten ist verboten, zum Beispiel zwischen Brüdern
      und Schwestern oder zwischen Eltern und Kindern. Die Herkunft, der Wohnort und eine frühere Scheidung
      stellen hingegen kein Ehehindernis dar.
