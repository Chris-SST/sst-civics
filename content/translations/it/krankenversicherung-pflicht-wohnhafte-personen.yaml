id: krankenversicherung-pflicht-wohnhafte-personen
lang: it
source_version: 1
question: Che cosa vale per le persone che vivono in Svizzera per quanto riguarda l'assicurazione malattie?
options:
  a: Devono assicurarsi soltanto se lavorano in Svizzera
  b: Sono obbligate per legge a stipulare un'assicurazione malattie
  c: Devono assicurarsi soltanto se hanno più di 50 anni
  d: Possono decidere liberamente se assicurarsi o meno
explanation: La legge sull'assicurazione malattie obbliga ogni persona domiciliata in Svizzera ad avere
  un'assicurazione malattie. Ci si deve assicurare entro tre mesi dalla nascita o dalla presa di domicilio.
