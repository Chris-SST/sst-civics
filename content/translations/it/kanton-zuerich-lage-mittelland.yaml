id: kanton-zuerich-lage-mittelland
lang: it
source_version: 2
question: A quale grande regione paesaggistica della Svizzera appartiene il Cantone di Zurigo?
options:
  a: Alle Alpi meridionali
  b: Al Giura
  c: All'Altopiano
  d: Alle Alpi centrali
explanation: Il Cantone di Zurigo appartiene all'Altopiano, ossia alla zona più pianeggiante situata tra
  il Giura a nord-ovest e le Alpi a sud. L'Altopiano è la parte più densamente popolata della Svizzera.
