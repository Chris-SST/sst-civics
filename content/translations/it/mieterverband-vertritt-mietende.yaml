id: mieterverband-vertritt-mietende
lang: it
source_version: 1
question: Quale compito ha l'associazione degli inquilini?
options:
  a: Rappresenta gli interessi dei proprietari di immobili
  b: Stabilisce le pigioni per tutti gli appartamenti
  c: Affitta appartamenti su incarico del Cantone
  d: Rappresenta gli interessi degli inquilini
explanation: L'associazione degli inquilini è un'organizzazione che si impegna per gli interessi degli
  inquilini. Offre ai suoi membri una consulenza, ad esempio su questioni di diritto di locazione. Gli
  interessi dei proprietari di immobili sono rappresentati da altre associazioni.
