id: sechselaeuten-boeoegg-kopf-sommer
lang: it
source_version: 2
question: Secondo la credenza popolare, che cosa significa se al Sechseläuten la testa del Böögg brucia
  rapidamente?
options:
  a: La prossima estate sarà piovosa.
  b: Il prossimo inverno sarà particolarmente freddo.
  c: La prossima estate sarà bella.
  d: Il raccolto in autunno sarà scarso.
explanation: Il Böögg è un pupazzo di neve che viene bruciato a Zurigo durante il Sechseläuten. Secondo
  la credenza popolare, più rapidamente la sua testa brucia o esplode, più bella sarà la prossima estate.
