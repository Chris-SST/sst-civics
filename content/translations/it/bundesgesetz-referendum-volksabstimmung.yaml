id: bundesgesetz-referendum-volksabstimmung
lang: it
source_version: 1
question: Che cosa vale per una legge federale approvata da entrambe le Camere del Parlamento?
options:
  a: Gli aventi diritto di voto possono chiedere una votazione popolare in merito mediante un referendum.
  b: Il Consiglio federale (Bundesrat) deve poi sottoporla ancora al Tribunale federale (Bundesgericht)
    per l'approvazione.
  c: Entra sempre in vigore immediatamente, senza che il popolo possa esprimersi.
  d: I governi dei Cantoni devono prima approvarla singolarmente.
explanation: Dopo la decisione di entrambe le Camere, le leggi federali sono soggette al referendum facoltativo.
  Se il referendum riesce, gli aventi diritto di voto decidono alle urne sulla legge.
