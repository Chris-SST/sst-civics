    question_de: Was gilt für ein Bundesgesetz, das von beiden Räten des Parlaments verabschiedet wurde?
    options_de:
      a: Die Stimmberechtigten können mittels eines Referendums eine Volksabstimmung darüber verlangen.
      b: Der Bundesrat muss es danach noch dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass sich das Volk äussern kann.
      d: Die Regierungen der Kantone müssen es zuvor einzeln genehmigen.
    explanation_de: Nach dem Beschluss beider Räte unterliegen die Bundesgesetze dem fakultativen Referendum.
      Kommt das Referendum zustande, entscheiden die Stimmberechtigten an der Urne über das Gesetz.
