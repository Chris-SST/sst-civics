id: obligationenrecht-miete-wohnraum-vorschriften
lang: it
source_version: 2
question: In quale legge sono stabilite le regole per la locazione di un appartamento?
options:
  a: Nel Codice delle obbligazioni
  b: Nella legge sul lavoro
  c: Nel Codice penale
  d: Nella legge sulla circolazione stradale
explanation: Le regole sulla locazione di appartamenti si trovano nel Codice delle obbligazioni (CO).
  Vi è indicato, ad esempio, che cosa vale nel contratto di locazione, quanto può essere elevata la pigione
  e come si può dare la disdetta. Il Codice civile (CC) disciplina invece soprattutto temi come la famiglia,
  il matrimonio e l'eredità.
