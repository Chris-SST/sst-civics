id: beschimpfung-wegen-glauben-verboten
lang: it
source_version: 1
question: Una persona insulta pubblicamente alcune persone a causa della loro fede o della loro origine.
  Come è disciplinata questa situazione in Svizzera?
options:
  a: È vietato soltanto nelle scuole e nelle aziende.
  b: È vietato e può essere punito.
  c: È vietato soltanto se viene riportato sul giornale.
  d: È sempre protetto dalla libertà di opinione.
explanation: Il Codice penale vieta la denigrazione pubblica di persone a causa della loro razza, etnia,
  religione o orientamento sessuale. La libertà di opinione non è illimitata.
