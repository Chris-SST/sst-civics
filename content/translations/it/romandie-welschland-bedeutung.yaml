id: romandie-welschland-bedeutung
lang: it
source_version: 1
question: Che cosa si intende con il termine «Romandia» o «Svizzera romanda»?
options:
  a: La parte della Svizzera di lingua italiana
  b: La parte della Svizzera di lingua francese
  c: La parte della Svizzera di lingua romancia
  d: La parte della Svizzera di lingua tedesca
explanation: Con Romandia o Svizzera romanda si indicano le regioni della Svizzera in cui si parla francese.
  Ne fanno parte, per esempio, i Cantoni Ginevra e Vaud. La parte di lingua italiana è soprattutto il
  Ticino.
