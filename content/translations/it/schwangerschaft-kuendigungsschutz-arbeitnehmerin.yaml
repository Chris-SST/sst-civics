id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: it
source_version: 1
question: Cosa vale per le lavoratrici incinte in Svizzera in caso di disdetta?
options:
  a: Hanno una protezione contro la disdetta solo nelle aziende con un contratto collettivo di lavoro
  b: Durante la gravidanza godono della protezione legale contro la disdetta
  c: Devono comunicare subito la gravidanza al datore di lavoro, altrimenti la protezione decade
  d: Possono essere licenziate in qualsiasi momento senza alcuna restrizione
explanation: La legge protegge le donne durante la gravidanza dalla disdetta da parte del datore di lavoro.
  La protezione vale indipendentemente dall'azienda. Serve a tutelare le donne in questo periodo.
