id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: it
source_version: 1
question: Quale regolamentazione vige in Svizzera dal 2002 per l'interruzione di gravidanza nelle prime
  dodici settimane?
options:
  a: In questo periodo l'interruzione è in linea di principio vietata.
  b: La donna può decidere autonomamente sull'interruzione.
  c: Il marito o il partner deve acconsentire all'interruzione.
  d: Un tribunale deve autorizzare l'interruzione.
explanation: Dal 2002 vige la cosiddetta regolamentazione dei termini. In base a essa, nelle prime dodici
  settimane di gravidanza è la donna a decidere autonomamente. A tal fine deve far valere per iscritto
  una situazione di emergenza.
