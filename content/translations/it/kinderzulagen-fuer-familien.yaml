id: kinderzulagen-fuer-familien
lang: it
source_version: 1
question: Quale prestazione statale ricevono le famiglie con figli in Svizzera?
options:
  a: Rendita d'invalidità
  b: Assegni per i figli
  c: Premio per la proprietà abitativa
  d: Indennità giornaliera di disoccupazione
explanation: Le famiglie ricevono gli assegni per i figli come contributo alle spese per il mantenimento
  dei figli. Essi fanno parte degli assegni familiari, che sono disciplinati nella legge federale.
