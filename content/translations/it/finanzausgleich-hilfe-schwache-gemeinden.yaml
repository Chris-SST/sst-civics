    question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden im Kanton Zürich?
    options_de:
      a: Er senkt die Steuern in allen Gemeinden auf denselben Satz.
      b: Er bezahlt den Gemeinden die Kosten der Gemeindeversammlungen.
      c: Er hilft finanziell schwachen oder durch hohe Sozialkosten belasteten Gemeinden, ihre Aufgaben
        zu erfüllen.
      d: Er verteilt das Geld des Bundes gleichmässig an alle Einwohnerinnen und Einwohner.
