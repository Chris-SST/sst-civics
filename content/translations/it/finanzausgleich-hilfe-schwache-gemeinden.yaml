id: finanzausgleich-hilfe-schwache-gemeinden
lang: it
source_version: 1
question: A cosa serve la perequazione finanziaria tra i Comuni (Gemeinden) nel Cantone di Zurigo?
options:
  a: Riduce le imposte in tutti i Comuni alla stessa aliquota.
  b: Paga ai Comuni i costi delle assemblee comunali (Gemeindeversammlungen).
  c: Aiuta i Comuni finanziariamente deboli o gravati da elevati costi sociali ad adempiere i loro compiti.
  d: Distribuisce in modo uniforme il denaro della Confederazione a tutti gli abitanti.
explanation: I Comuni hanno possibilità finanziarie molto diverse. La perequazione finanziaria compensa
  in parte queste differenze. In questo modo anche i Comuni con poca capacità fiscale o con elevati costi
  sociali possono adempiere i loro compiti.
