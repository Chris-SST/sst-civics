id: anmeldung-wohngemeinde-bei-zuzug
lang: it
source_version: 1
question: Che cosa devono fare le persone che si stabiliscono in un Comune (Gemeinde)?
options:
  a: Devono annunciarsi presso il Comune di domicilio.
  b: Devono presentarsi presso l'esercito.
  c: Devono presentarsi presso il Consiglio federale (Bundesrat).
  d: Devono presentarsi presso l'amministrazione delle imposte della Confederazione.
explanation: Chi si trasferisce in un nuovo luogo deve registrarsi presso il Comune di domicilio. Di norma
  ciò avviene presso il controllo degli abitanti. In questo modo il Comune è informato sui propri abitanti.
