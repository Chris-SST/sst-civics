question: Chi guidò la Riforma a Zurigo negli anni 1520?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martin Lutero
  d: Giovanni Calvino
explanation: Ulrich Zwingli era predicatore popolare (Leutpriester) presso il Grossmünster e introdusse
  la Riforma a Zurigo. Il Consiglio della città lo sostenne in questa impresa. Calvino operò a Ginevra,
  Lutero in Germania.
