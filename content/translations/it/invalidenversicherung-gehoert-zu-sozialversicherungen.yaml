id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: it
source_version: 1
question: Quale delle seguenti istituzioni fa parte delle assicurazioni sociali della Svizzera?
options:
  a: L'assicurazione per l'invalidità (AI)
  b: L'assicurazione di viaggio
  c: L'assicurazione di protezione giuridica
  d: L'assicurazione di economia domestica
explanation: L'assicurazione per l'invalidità (AI) (Invalidenversicherung, IV) è un'assicurazione sociale
  disciplinata dallo Stato. Sostiene le persone che a causa di malattia o infortunio non possono lavorare
  o possono farlo solo in misura limitata. Le assicurazioni di economia domestica, di viaggio e di protezione
  giuridica sono assicurazioni private.
