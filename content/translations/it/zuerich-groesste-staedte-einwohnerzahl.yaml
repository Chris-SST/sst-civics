id: zuerich-groesste-staedte-einwohnerzahl
lang: it
source_version: 1
question: Quali sono, per numero di abitanti, le tre città più grandi del Cantone di Zurigo?
options:
  a: Zurigo, Uster e Wetzikon
  b: Zurigo, Dietikon e Winterthur
  c: Zurigo, Winterthur e Uster
  d: Zurigo, Winterthur e Dübendorf
explanation: Zurigo è di gran lunga la città più grande, seguita da Winterthur e Uster. Anche Dübendorf,
  Dietikon e Wetzikon sono città piuttosto grandi, ma hanno meno abitanti di Uster.
