    question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
    options_de:
      a: Die Bundespräsidentin oder der Bundespräsident entscheidet allein.
      b: Die Mitglieder vertreten die Entscheide des Bundesrates nach aussen einheitlich.
      c: Jedes Mitglied entscheidet in seinem eigenen Departement, ohne die anderen zu konsultieren.
      d: Die Mitglieder dürfen ihre abweichende Meinung öffentlich äussern.
    explanation_de: Der Bundesrat entscheidet als Kollegium. Auch wer innerhalb des Bundesrates eine andere
      Meinung vertreten hat, vertritt den Entscheid nach aussen. Auf diese Weise tritt die Regierung geeint
      auf.
