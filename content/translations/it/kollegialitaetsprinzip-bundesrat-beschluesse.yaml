id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: it
source_version: 1
question: Che cosa significa il principio di collegialità nel Consiglio federale (Bundesrat)?
options:
  a: La presidente o il presidente della Confederazione (Bundespräsidentin/Bundespräsident) decide da
    solo.
  b: I membri difendono in modo unitario verso l'esterno le decisioni del Consiglio federale.
  c: Ogni membro decide nel proprio dipartimento senza consultare gli altri.
  d: I membri possono esprimere pubblicamente la loro opinione divergente.
explanation: Il Consiglio federale decide come collegio. Anche chi in seno al Consiglio federale ha sostenuto
  un'opinione diversa difende la decisione verso l'esterno. In questo modo il governo si presenta in modo
  unito.
