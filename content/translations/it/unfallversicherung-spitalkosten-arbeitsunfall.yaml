    question_de: Eine Arbeitnehmerin hat einen schweren Unfall bei der Arbeit und muss ins Spital eingeliefert
      werden. Welche Versicherung übernimmt die Kosten des Spitals?
    options_de:
      a: Die Arbeitslosenversicherung
      b: Die Unfallversicherung
      c: Die Erwerbsersatzordnung
      d: Die Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt die Heilungskosten bei Berufsunfällen,
      also zum Beispiel die Kosten des Spitals. Die Arbeitnehmer sind über den Arbeitgeber versichert.
      Die anderen genannten Versicherungen decken andere Risiken ab.
