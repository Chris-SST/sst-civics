id: unfallversicherung-spitalkosten-arbeitsunfall
lang: it
source_version: 1
question: Una lavoratrice ha un grave infortunio sul lavoro e deve essere ricoverata in ospedale. Quale
  assicurazione si assume i costi dell'ospedale?
options:
  a: L'assicurazione contro la disoccupazione
  b: L'assicurazione contro gli infortuni
  c: L'indennità per perdita di guadagno
  d: L'assicurazione per la vecchiaia e per i superstiti
explanation: L'assicurazione obbligatoria contro gli infortuni paga le spese di cura in caso di infortuni
  professionali, quindi ad esempio i costi dell'ospedale. I lavoratori sono assicurati tramite il datore
  di lavoro. Le altre assicurazioni menzionate coprono altri rischi.
