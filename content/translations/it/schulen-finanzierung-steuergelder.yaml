    question_de: Woher stammt hauptsächlich die Finanzierung der öffentlichen Schulen in der Schweiz?
    options_de:
      a: Aus dem Schulgeld, das die Eltern jeden Monat bezahlen
      b: Aus den Steuern des Kantons und der Gemeinden
      c: Aus den Einnahmen der Post und der SBB
      d: Aus den Beiträgen der Krankenkassen
    explanation_de: Die obligatorische öffentliche Schule ist gemäss der Bundesverfassung unentgeltlich.
      Sie wird mit Steuern finanziert, vor allem der Kantone und der Gemeinden.
