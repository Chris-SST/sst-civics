id: schulen-finanzierung-steuergelder
lang: it
source_version: 2
question: Da dove proviene principalmente il finanziamento delle scuole pubbliche in Svizzera?
options:
  a: Dalle tasse scolastiche che i genitori pagano ogni mese
  b: Dalle imposte del Cantone e dei Comuni (Gemeinden)
  c: Dai ricavi della Posta e delle FFS
  d: Dai contributi delle casse malati (Krankenkassen)
explanation: La scuola pubblica obbligatoria è gratuita secondo la Costituzione federale. È finanziata
  con le imposte, soprattutto dei Cantoni e dei Comuni.
