    question_de: Auf welche Weise beteiligen sich die Stimmberechtigten in ihrer Gemeinde politisch an
      den Urnenabstimmungen?
    options_de:
      a: Sie führen den Vorsitz bei den Sitzungen des Gemeinderats
      b: Sie setzen die Beschlüsse der Gemeinde um
      c: Sie geben ihre Stimme bei den Wahlen und Abstimmungen ab
      d: Sie erlassen direkt die Gesetze des Kantons
    explanation_de: An der Urne äussern sich die Stimmberechtigten zu Vorlagen, die zur Abstimmung unterbreitet
      werden, und wählen die Behörden. Die Umsetzung der Beschlüsse ist Aufgabe der Behörden und der Verwaltung.
