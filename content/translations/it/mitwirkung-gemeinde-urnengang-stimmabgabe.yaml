id: mitwirkung-gemeinde-urnengang-stimmabgabe
lang: it
source_version: 1
question: In che modo le persone con diritto di voto partecipano politicamente nel loro Comune (Gemeinde)
  alle votazioni alle urne?
options:
  a: Presiedono le sedute del consiglio comunale (Gemeinderat)
  b: Attuano le decisioni del Comune
  c: Esprimono il loro voto nelle elezioni e nelle votazioni
  d: Emanano direttamente le leggi del Cantone
explanation: Alle urne le persone con diritto di voto si pronunciano su progetti sottoposti a votazione
  ed eleggono le autorità. L'attuazione delle decisioni è compito delle autorità e dell'amministrazione.
