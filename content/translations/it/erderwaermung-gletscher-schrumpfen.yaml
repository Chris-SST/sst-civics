id: erderwaermung-gletscher-schrumpfen
lang: it
source_version: 1
question: Che effetto ha il riscaldamento globale sui ghiacciai delle Alpi svizzere?
options:
  a: I ghiacciai si riducono.
  b: I ghiacciai si spostano verso nord.
  c: I ghiacciai crescono più velocemente.
  d: I ghiacciai rimangono invariati.
explanation: Con l'aumento delle temperature si scioglie più ghiaccio di quanto ne venga rimpiazzato dalla
  neve. Per questo i ghiacciai svizzeri diventano più piccoli. Ciò influisce anche sulle acque e sul paesaggio
  nelle Alpi.
