question: Quale regione della Svizzera è nota per le grandi aziende farmaceutiche che vi hanno sede?
options:
  a: L'Engadina
  b: La regione di Basilea
  c: Il Ticino
  d: Il Vallese
explanation: Nella regione di Basilea hanno la loro sede principale diverse aziende farmaceutiche attive
  a livello mondiale. L'industria farmaceutica è lì un importante settore economico ed è significativa
  per l'esportazione.
