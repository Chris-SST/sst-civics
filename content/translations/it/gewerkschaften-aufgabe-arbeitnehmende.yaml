    question_de: Welche Aufgabe haben die Gewerkschaften in der Schweiz?
    options_de:
      a: Sie setzen sich für die Anliegen der Arbeitnehmer und Arbeitnehmerinnen ein.
      b: Sie erteilen Ausländerinnen und Ausländern die Arbeitsbewilligung.
      c: Sie legen die Steuersätze für die Unternehmen fest.
      d: Sie vertreten die Anliegen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Die Gewerkschaften sind Organisationen der Arbeitnehmer und Arbeitnehmerinnen. Sie
      vertreten deren Interessen, zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln
      oft Gesamtarbeitsverträge mit den Arbeitgebern aus. Die Arbeitsbewilligungen hingegen werden von
      den Behörden erteilt, nicht von den Gewerkschaften.
