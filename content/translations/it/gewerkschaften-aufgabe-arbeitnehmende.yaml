id: gewerkschaften-aufgabe-arbeitnehmende
lang: it
source_version: 2
question: Quale compito hanno i sindacati in Svizzera?
options:
  a: Si impegnano per le istanze dei lavoratori e delle lavoratrici.
  b: Rilasciano alle straniere e agli stranieri il permesso di lavoro.
  c: Stabiliscono le aliquote fiscali per le imprese.
  d: Rappresentano le istanze dei datori di lavoro nei confronti della Confederazione.
explanation: I sindacati sono organizzazioni dei lavoratori e delle lavoratrici. Rappresentano i loro
  interessi, ad esempio in materia di salari e condizioni di lavoro, e spesso negoziano contratti collettivi
  di lavoro con i datori di lavoro. I permessi di lavoro, invece, sono rilasciati dalle autorità, non
  dai sindacati.
