id: arbeitsrecht-beratung-anlaufstellen
lang: it
source_version: 1
question: Chi può aiutare in caso di domande sul diritto del lavoro?
options:
  a: La commissione scolastica (Schulpflege) e la parrocchia
  b: Gli avvocati, i sindacati e i tribunali del lavoro
  c: Le aziende di trasporto pubblico e la Posta
  d: Gli uffici dello stato civile e il controllo degli abitanti
explanation: In caso di domande sul diritto del lavoro ci sono diversi punti di riferimento. Tra questi
  vi sono gli avvocati e le avvocate, i sindacati e i tribunali del lavoro. Gli altri servizi sono competenti
  per altri compiti.
