    source_version: 1
    question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenentwurf ist eine
      Stichfrage vorgesehen. Wozu dient sie?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Kantone an der Abstimmung teilnehmen können
      c: Sie entscheidet, welche Vorlage gültig ist, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften noch einmal überprüft werden müssen
    explanation_de: Die Stimmberechtigten können sowohl die Initiative als auch den Gegenentwurf annehmen.
      Mit der Stichfrage geben sie an, welche Vorlage in Kraft treten soll, falls beide angenommen werden.
      Auf diese Weise gehen die Stimmen zwischen zwei ähnlichen Vorlagen nicht verloren.
