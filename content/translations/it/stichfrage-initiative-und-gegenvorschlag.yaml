id: stichfrage-initiative-und-gegenvorschlag
lang: it
source_version: 1
question: In una votazione su un'iniziativa popolare (Volksinitiative) e un controprogetto diretto è prevista
  una domanda risolutiva. A che cosa serve?
options:
  a: Decide se la votazione deve essere ripetuta
  b: Decide se i Cantoni possono partecipare al voto
  c: Decide quale progetto è valido se entrambi vengono accettati
  d: Decide se le firme devono essere verificate ancora una volta
explanation: Gli aventi diritto di voto possono approvare sia l'iniziativa sia il controprogetto. Con
  la domanda risolutiva indicano quale progetto deve entrare in vigore nel caso in cui entrambi vengano
  accettati. In questo modo i voti non vanno persi tra due progetti simili.
