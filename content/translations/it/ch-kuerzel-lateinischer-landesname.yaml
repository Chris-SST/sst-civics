id: ch-kuerzel-lateinischer-landesname
lang: it
source_version: 1
question: Che cosa significa la sigla del Paese «CH» per la Svizzera?
options:
  a: Sta per il nome francese Confédération Helvétique
  b: Sta per il termine «Cantons Helvétiques»
  c: Sta per il nome latino Civitas Helvetica
  d: Sta per il nome latino del Paese Confoederatio Helvetica
explanation: CH è l'abbreviazione di Confoederatio Helvetica, il nome latino della Svizzera. Si usa il
  latino perché non favorisce nessuna delle quattro lingue nazionali. La sigla compare, per esempio, sulle
  targhe automobilistiche e negli indirizzi Internet.
