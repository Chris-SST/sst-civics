id: hundehaltung-abgabe-hundesteuer
lang: it
source_version: 2
question: Che cosa vale nel Cantone di Zurigo per le persone che possiedono un cane?
options:
  a: Devono pagare ogni anno una tassa sui cani al Comune (Gemeinde).
  b: Devono pagare una tassa alla Confederazione solo una volta, al momento dell'acquisto del cane.
  c: Devono sostenere ogni anno un esame con il cane presso il Cantone.
  d: Devono pagare una tassa solo se con il cane guadagnano denaro.
explanation: Chi possiede un cane nel Cantone di Zurigo paga ogni anno una tassa per il cane, la cosiddetta
  imposta sui cani (Hundesteuer). Il denaro va al Comune di residenza, non alla Confederazione. La tassa
  non è unica e vale anche per i cani che si tengono solo a titolo privato.
