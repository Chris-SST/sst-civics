id: franzoesische-besetzung-1798-alte-eidgenossenschaft
lang: it
source_version: 1
question: Quale fu l'effetto dell'ingresso delle truppe francesi in Svizzera nel 1798?
options:
  a: Fece della Svizzera una parte della Francia
  b: Rafforzò il potere dei vecchi Cantoni
  c: Portò alla fondazione dello Stato federale del 1848
  d: Pose fine al vecchio ordinamento della Confederazione
explanation: Con l'occupazione da parte della Francia, la vecchia Confederazione crollò. Al suo posto
  subentrò la Repubblica elvetica come Stato unitario. L'attuale Stato federale nacque solo nel 1848.
