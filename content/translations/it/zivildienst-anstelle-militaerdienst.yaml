    question_de: Welches Verhältnis besteht in der Schweiz zwischen dem Zivildienst und dem Militärdienst?
    options_de:
      a: Der Zivildienst kann nur von Frauen geleistet werden.
      b: Wer Zivildienst leistet, muss keine Steuern bezahlen.
      c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
      d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
    explanation_de: Der Zivildienst ist ein ziviler Ersatz für den Militärdienst. Er ist gedacht für Personen,
      die für den Militärdienst tauglich sind und den Militärdienst nicht mit ihrem Gewissen vereinbaren
      können. Dafür muss ein Gesuch eingereicht werden, und der Zivildienst dauert länger als der Militärdienst.
