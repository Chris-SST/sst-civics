id: zivildienst-anstelle-militaerdienst
lang: it
source_version: 3
question: Che rapporto c'è in Svizzera tra servizio civile (Zivildienst) e servizio militare?
options:
  a: Il servizio civile può essere prestato solo dalle donne.
  b: Chi presta servizio civile non deve pagare le imposte.
  c: Il servizio civile deve essere prestato in aggiunta al servizio militare.
  d: Il servizio civile può essere prestato al posto del servizio militare.
explanation: Il servizio civile è un sostituto civile del servizio militare. È pensato per le persone
  idonee al servizio militare che non riescono a conciliare il servizio militare con la propria coscienza.
  Per questo occorre presentare una domanda, e il servizio civile dura più a lungo del servizio militare.
