id: urkantone-buendnis-1291
lang: it
source_version: 1
question: Quali tre territori si allearono nel 1291 e sono considerati il nucleo della futura Confederazione?
options:
  a: Uri, Svitto e Untervaldo
  b: Glarona, Zugo e Uri
  c: Basilea, Sciaffusa e Appenzello
  d: Zurigo, Berna e Lucerna
explanation: Uri, Svitto e Untervaldo conclusero una Confederazione nel 1291. Questa data è considerata
  l'origine della Svizzera e viene celebrata il 1° agosto. Gli altri luoghi si unirono alla Confederazione
  solo più tardi.
