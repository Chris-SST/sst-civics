id: bundesstaat-1848-neue-verfassung
lang: it
source_version: 1
question: Che cosa nacque in Svizzera nel 1848?
options:
  a: La Repubblica elvetica con un governo centrale
  b: La Confederazione di Stati sotto sorveglianza francese
  c: Lo Stato federale moderno con una nuova costituzione
  d: La Confederazione dei tre Cantoni primitivi
explanation: Nel 1848 i Cantoni si diedero una Costituzione federale e fondarono lo Stato federale moderno.
  Questo univa compiti comuni della Confederazione con l'autonomia dei Cantoni. Questa costituzione è
  la base della Svizzera di oggi.
