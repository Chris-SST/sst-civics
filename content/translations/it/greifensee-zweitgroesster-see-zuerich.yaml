id: greifensee-zweitgroesster-see-zuerich
lang: it
source_version: 1
question: Qual è, nel Cantone di Zurigo, il secondo lago più grande dopo il lago di Zurigo?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: Il Greifensee si trova tra Uster e Dübendorf ed è, dopo il lago di Zurigo, il secondo lago
  più grande del Cantone. Il Pfäffikersee è più piccolo. Il Türlersee e il Katzensee sono ancora nettamente
  più piccoli.
