id: zwingli-bekannt-fuer-reformation
lang: it
source_version: 2
question: Per che cosa è conosciuto soprattutto Huldrych (Ulrich) Zwingli nella storia di Zurigo?
options:
  a: Costruì la prima ferrovia del Cantone.
  b: Fu il primo presidente della Confederazione (Bundespräsident) della Svizzera.
  c: Introdusse il diritto di voto alle donne.
  d: Fu il capo della Riforma a Zurigo.
explanation: Huldrych (Ulrich) Zwingli guidò la Riforma a Zurigo nel XVI secolo e la Chiesa zurighese
  divenne riformata. La ferrovia, lo Stato federale con un presidente della Confederazione e il diritto
  di voto alle donne arrivarono solo secoli dopo.
