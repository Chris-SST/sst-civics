id: volksinitiative-doppeltes-mehr
lang: it
source_version: 2
question: Che cosa serve affinché un'iniziativa popolare federale (Volksinitiative) venga accettata in
  votazione?
options:
  a: Il sì dei due terzi dei votanti
  b: Il sì del Consiglio federale (Bundesrat) e della maggioranza dei votanti
  c: Il sì della maggioranza dei votanti e della maggioranza dei Cantoni
  d: Solo il sì della maggioranza dei votanti
explanation: 'Un''iniziativa popolare federale vuole modificare la Costituzione federale. Per questo richiede
  la doppia maggioranza: la maggioranza dei votanti (maggioranza del popolo, Volksmehr) e la maggioranza
  dei Cantoni (maggioranza dei Cantoni, Ständemehr) devono dire sì. Per un''iniziativa cantonale nel Cantone
  di Zurigo, invece, è sufficiente la maggioranza dei votanti.'
