    question_de: Was braucht es, damit eine eidgenössische Volksinitiative in der Abstimmung angenommen
      wird?
    options_de:
      a: Das Ja von zwei Dritteln der Stimmenden
      b: Das Ja des Bundesrates und der Mehrheit der Stimmenden
      c: Das Ja der Mehrheit der Stimmenden und der Mehrheit der Kantone
      d: Nur das Ja der Mehrheit der Stimmenden
    explanation_de: 'Eine eidgenössische Volksinitiative will die Bundesverfassung ändern. Dafür braucht
      es das doppelte Mehr: Die Mehrheit der Stimmenden (Volksmehr) und die Mehrheit der Kantone (Ständemehr)
      müssen Ja sagen. Bei einer kantonalen Initiative im Kanton Zürich hingegen genügt die Mehrheit der
      Stimmenden.'
