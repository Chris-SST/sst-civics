id: politische-partei-aehnliche-ziele
lang: it
source_version: 1
question: Che cosa descrive meglio un partito politico?
options:
  a: Un tribunale che decide su controversie politiche
  b: Un'associazione di persone con obiettivi politici simili
  c: Un gruppo di Comuni (Gemeinden) che svolgono compiti insieme
  d: Un'autorità che organizza elezioni e votazioni
explanation: In un partito si uniscono persone che perseguono obiettivi politici simili. Alle elezioni
  i partiti presentano candidate e candidati e si esprimono sugli oggetti in votazione. I partiti non
  sono autorità statali.
