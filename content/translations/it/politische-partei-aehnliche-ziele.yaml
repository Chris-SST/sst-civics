    question_de: Was beschreibt eine politische Partei am besten?
    options_de:
      a: Ein Gericht, das über politische Streitigkeiten entscheidet
      b: Ein Zusammenschluss von Personen mit ähnlichen politischen Zielen
      c: Eine Gruppe von Gemeinden, die gemeinsam Aufgaben erfüllen
      d: Eine Behörde, die Wahlen und Abstimmungen organisiert
    explanation_de: In einer Partei schliessen sich Personen zusammen, die ähnliche politische Ziele verfolgen.
      Bei Wahlen stellen die Parteien Kandidatinnen und Kandidaten auf und äussern sich zu den Abstimmungsvorlagen.
      Parteien sind keine staatlichen Behörden.
