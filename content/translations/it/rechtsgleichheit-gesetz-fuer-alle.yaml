    question_de: Was bedeutet der Grundsatz der Rechtsgleichheit?
    options_de:
      a: Alle Kantone haben die gleichen Gesetze.
      b: Alle Personen haben die gleichen politischen Ämter.
      c: Alle Personen haben das gleiche Einkommen.
      d: Das Gesetz gilt für alle Personen auf die gleiche Weise.
    explanation_de: Die Rechtsgleichheit ist in Artikel 8 der Bundesverfassung verankert. Alle Menschen
      sind vor dem Gesetz gleich und niemand darf diskriminiert werden, zum Beispiel wegen der Herkunft
      oder des Geschlechts. Das bedeutet nicht, dass alle die gleiche Menge an Gütern besitzen.
