id: rechtsgleichheit-gesetz-fuer-alle
lang: it
source_version: 1
question: Che cosa significa il principio dell'uguaglianza giuridica?
options:
  a: Tutti i Cantoni hanno le stesse leggi.
  b: Tutte le persone hanno le stesse cariche politiche.
  c: Tutte le persone hanno lo stesso reddito.
  d: La legge si applica a tutte le persone allo stesso modo.
explanation: L'uguaglianza giuridica è sancita all'articolo 8 della Costituzione federale. Tutti gli esseri
  umani sono uguali davanti alla legge e nessuno può essere discriminato, ad esempio a causa dell'origine
  o del sesso. Ciò non significa che tutti possiedano la stessa quantità di beni.
