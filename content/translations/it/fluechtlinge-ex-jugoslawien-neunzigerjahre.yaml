id: fluechtlinge-ex-jugoslawien-neunzigerjahre
lang: it
source_version: 1
question: Per quale motivo negli anni Novanta molte persone provenienti dall'ex Jugoslavia hanno cercato
  accoglienza in Svizzera?
options:
  a: Volevano studiare presso le università svizzere.
  b: Fuggivano da una grande catastrofe naturale.
  c: Fuggivano dalla guerra nel loro Paese d'origine.
  d: Erano state reclutate da aziende svizzere come stagionali.
explanation: La dissoluzione della Jugoslavia ha portato a guerre negli anni Novanta. Per questo molte
  persone hanno cercato protezione in Svizzera. Una parte di loro è rimasta e oggi vive qui.
