id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
lang: it
source_version: 1
question: Da che cosa dipende principalmente l'importo dell'imposta sul reddito e sulla sostanza che una
  persona paga nel Cantone di Zurigo?
options:
  a: Dal reddito e dalla sostanza imponibili
  b: Dalla professione della persona
  c: Dalla durata del domicilio nel Comune (Gemeinde)
  d: Dal numero di volte in cui si è esercitato il diritto di voto
explanation: L'imposta viene calcolata sul reddito e sulla sostanza imponibili. Chi guadagna o possiede
  di più paga, di regola, più imposte.
