    question_de: Wovon hängt hauptsächlich die Höhe der Einkommens- und Vermögenssteuer ab, die eine Person
      im Kanton Zürich bezahlt?
    options_de:
      a: Vom steuerbaren Einkommen und Vermögen
      b: Vom Beruf der Person
      c: Von der Dauer des Wohnsitzes in der Gemeinde
      d: Von der Anzahl der Male, in denen das Stimmrecht ausgeübt wurde
    explanation_de: Die Steuer wird auf dem steuerbaren Einkommen und Vermögen berechnet. Wer mehr verdient
      oder besitzt, bezahlt in der Regel mehr Steuern.
