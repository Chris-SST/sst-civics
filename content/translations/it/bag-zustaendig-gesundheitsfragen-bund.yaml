id: bag-zustaendig-gesundheitsfragen-bund
lang: it
source_version: 1
question: Quale autorità federale è competente per le questioni di sanità?
options:
  a: L'Ufficio federale dell'ambiente (UFAM)
  b: La Segreteria di Stato della migrazione (SEM)
  c: L'Ufficio federale di statistica (UST)
  d: L'Ufficio federale della sanità pubblica (UFSP)
explanation: L'Ufficio federale della sanità pubblica (UFSP) è l'autorità federale competente per le questioni
  di sanità. Esso vigila, per esempio, sull'assicurazione malattie sociale.
