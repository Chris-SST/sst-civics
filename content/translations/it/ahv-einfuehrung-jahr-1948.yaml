id: ahv-einfuehrung-jahr-1948
lang: it
source_version: 1
question: In quale anno è stata introdotta l'assicurazione vecchiaia e superstiti (AHV), l'assicurazione
  pensionistica statale per la vecchiaia e per i superstiti?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: L'assicurazione vecchiaia e superstiti ha iniziato la sua attività nel 1948, dopo che il
  popolo aveva approvato la legge nel 1947. Costituisce il primo pilastro del sistema svizzero dei tre
  pilastri. Garantisce il sostentamento nella vecchiaia e per i superstiti.
