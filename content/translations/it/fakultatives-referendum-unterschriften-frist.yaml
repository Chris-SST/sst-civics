id: fakultatives-referendum-unterschriften-frist
lang: it
source_version: 1
question: Quante firme sono necessarie affinché un referendum facoltativo contro una legge federale riesca,
  e entro quale termine?
options:
  a: 50 000 firme entro 18 mesi
  b: 50 000 firme entro 100 giorni
  c: 100 000 firme entro 30 giorni
  d: 100 000 firme entro 100 giorni
explanation: Per un referendum facoltativo occorrono 50 000 firme valide entro 100 giorni dalla pubblicazione
  della legge nel Foglio federale. Se il referendum riesce, il popolo vota sulla legge.
