question: İş hukuku ile ilgili sorularda kim yardımcı olur?
options:
  a: Okul kurulu (Schulpflege) ve kilise cemaati
  b: Avukatlık, sendikalar ve iş mahkemeleri
  c: Ulaşım işletmeleri ve postane
  d: Nüfus kayıt daireleri ve ikamet kayıt dairesi
