    question_de: Wer hilft bei Fragen zum Arbeitsrecht?
    options_de:
      a: Die Schulpflege und die Kirchgemeinde
      b: Anwaltschaft, Gewerkschaften und Arbeitsgerichte
      c: Verkehrsbetriebe und Poststelle
      d: Zivilstandsämter und das Einwohnermeldeamt
