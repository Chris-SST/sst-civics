id: ehe-verbot-nahe-blutsverwandtschaft
lang: tr
source_version: 1
question: İsviçre'de kimler evlenemez?
options:
  a: Daha önce boşanmış olan kişiler
  b: Farklı kantonlardan gelen kişiler
  c: Yakın kan bağı olan kişiler
  d: Farklı belediyelerde (Gemeinde) oturan kişiler
explanation: Yakın kan bağı olan kişiler arasındaki evlilik yasaktır, örneğin kardeşler arasında veya
  anne babalar ile çocuklar arasında. Buna karşılık kökeni, ikamet yeri ve önceki bir boşanma evliliğe
  engel değildir.
