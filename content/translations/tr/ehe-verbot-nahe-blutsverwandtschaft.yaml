    question_de: Wer darf in der Schweiz nicht heiraten?
    options_de:
      a: Personen, die zuvor geschieden wurden
      b: Personen aus verschiedenen Kantonen
      c: Personen, die nahe blutsverwandt sind
      d: Personen, die in verschiedenen Gemeinden wohnen
    explanation_de: Die Ehe zwischen nahe blutsverwandten Personen ist verboten, zum Beispiel zwischen
      Geschwistern oder zwischen Eltern und Kindern. Dagegen sind die Herkunft, der Wohnort und eine frühere
      Scheidung kein Hindernis für die Ehe.
