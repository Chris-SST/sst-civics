id: wappen-kanton-zuerich-weiss-blau
lang: tr
source_version: 2
question: Zürih kantonunun armasında hangi renkler vardır?
options:
  a: Kırmızı ve beyaz
  b: Yeşil ve beyaz
  c: Beyaz ve mavi
  d: Mavi ve sarı
explanation: Zürih arması çapraz olarak beyaz ve mavi şeklinde bölünmüştür. Armacılıkta beyaza «gümüş»
  denir. Aynı renkler kantonun bayrağında da görülür.
