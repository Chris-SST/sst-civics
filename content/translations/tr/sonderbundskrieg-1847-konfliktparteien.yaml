question: 1847'de İsviçre'de Sonderbund Savaşı kimler arasında yapıldı?
options:
  a: Almanca konuşulan kantonlar ile Fransızca konuşulan kantonlar arasında
  b: Liberal güçler ile Katolik kantonlar arasında
  c: Vergiler konusunda şehir kantonları ile kırsal kantonlar arasında
  d: İsviçre ile Fransa arasında
explanation: Sonderbund içinde birkaç Katolik-muhafazakâr kanton bir araya gelmişti. Liberal güçler daha
  güçlü bir Konfederasyon istiyordu. Kısa süren savaş, liberal tarafın zaferiyle sona erdi ve 1848 federal
  devletine giden yolu açtı.
