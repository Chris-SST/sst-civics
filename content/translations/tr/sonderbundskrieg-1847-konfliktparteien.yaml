    question_de: Zwischen wem wurde 1847 in der Schweiz der Sonderbundskrieg geführt?
    options_de:
      a: Zwischen den deutschsprachigen Kantonen und den französischsprachigen Kantonen
      b: Zwischen den liberalen Kräften und den katholischen Kantonen
      c: Zwischen den Stadtkantonen und den Landkantonen wegen der Steuern
      d: Zwischen der Schweiz und Frankreich
    explanation_de: Im Sonderbund hatten sich mehrere katholisch-konservative Kantone zusammengeschlossen.
      Die liberalen Kräfte wollten eine stärkere Eidgenossenschaft. Der kurze Krieg endete mit dem Sieg
      der liberalen Seite und ebnete den Weg zum Bundesstaat von 1848.
