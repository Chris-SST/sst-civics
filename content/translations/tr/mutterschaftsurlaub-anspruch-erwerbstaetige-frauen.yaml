id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
lang: tr
source_version: 1
question: İsviçre'de bir çocuğun doğumundan sonra kimin doğum izni (Mutterschaftsurlaub) hakkı kanunen
  vardır?
options:
  a: Yalnızca 50'den fazla çalışanı olan bir işletmede çalışan kadınlar
  b: Çocuk doğuran her çalışan kadın
  c: Yalnızca evli olan kadınlar
  d: Yalnızca İsviçre vatandaşlığı (Bürgerrecht) olan kadınlar
explanation: Kanun, çalışan anneler için doğum izni hakkı ve bir ödenek öngörmektedir. İşletmenin büyüklüğü,
  vatandaşlık ve medeni durum bu konuda rol oynamaz. Ödenek, gelir kaybı tazminat sistemi (Erwerbsersatzordnung)
  aracılığıyla finanse edilir.
