    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes gesetzlich Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die in einem Betrieb mit mehr als 50 Angestellten arbeiten
      b: Jede berufstätige Frau, die ein Kind zur Welt bringt
      c: Nur verheiratete Frauen
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Das Gesetz sieht für berufstätige Mütter einen Anspruch auf Mutterschaftsurlaub und
      eine Entschädigung vor. Die Grösse des Betriebs, die Staatsangehörigkeit und der Zivilstand spielen
      dabei keine Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
