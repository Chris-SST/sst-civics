    question_de: Welche der folgenden Aussagen gilt in der Schweiz für schwangere Arbeitnehmerinnen in
      Bezug auf die Kündigung kündigung?
    options_de:
      a: Sie haben nur in Betrieben mit einem Gesamtarbeitsvertrag Kündigungsschutz
      b: Sie geniessen während der Schwangerschaft den gesetzlichen Kündigungsschutz
      c: Sie müssen ihre Schwangerschaft dem Arbeitgeber sofort mitteilen, sonst endet der Schutz
      d: Sie können jederzeit und ohne jede Einschränkung entlassen werden
    explanation_de: Das Gesetz schützt Frauen während der Schwangerschaft vor einer Kündigung durch den
      Arbeitgeber. Dieser Schutz gilt unabhängig vom Arbeitsplatz. Er soll gewährleisten, dass Frauen
      in dieser Zeit abgesichert sind.
