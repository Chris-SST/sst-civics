id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
lang: tr
source_version: 1
question: İsviçre'de hamile kadın çalışanlar için işten çıkarma (fesih) konusunda aşağıdakilerden hangisi
  geçerlidir?
options:
  a: Yalnızca toplu iş sözleşmesi bulunan işyerlerinde fesih korumasına sahiptirler
  b: Hamilelik süresince yasal fesih korumasından yararlanırlar
  c: Hamileliklerini işverene hemen bildirmek zorundadırlar, aksi takdirde koruma sona erer
  d: Herhangi bir zamanda, hiçbir kısıtlama olmaksızın işten çıkarılabilirler
explanation: Kanun, kadınları hamilelik süresince işveren tarafından işten çıkarılmaya karşı korur. Bu
  koruma işyerinden bağımsız olarak geçerlidir. Kadınların bu dönemde güvence altında olmasını amaçlar.
