id: initiative-gegenvorschlag-stichfrage
lang: tr
source_version: 1
question: Bir halk girişimi (Volksinitiative) ve Federal Meclis (Bundesversammlung) tarafından hazırlanan
  doğrudan bir karşı öneri hakkında aynı anda oylama yapılır. Bu durumda nihai karar sorusu (Stichfrage)
  ne işe yarar?
options:
  a: Oylamanın tekrarlanıp tekrarlanmayacağına karar verir
  b: Girişimin geçerli olup olmadığına karar verir
  c: Her ikisi de kabul edilirse hangi tasarının geçerli olacağına karar verir
  d: Kantonların oylamaya katılıp katılamayacağına karar verir
explanation: Oy hakkına sahip kişiler hem girişime hem de karşı öneriye evet diyebilir. Nihai karar sorusuyla,
  her ikisi de kabul edilirse bu iki tasarıdan hangisinin yürürlüğe girmesi gerektiğini belirtirler. Böylece
  bir değişiklik lehine verilen hiçbir oy boşa gitmez.
