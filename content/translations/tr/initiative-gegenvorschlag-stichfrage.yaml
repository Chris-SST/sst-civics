    source_version: 1
    question_de: Über eine Volksinitiative und einen von der Bundesversammlung ausgearbeiteten direkten
      Gegenentwurf wird gleichzeitig abgestimmt. Wozu dient in diesem Fall die Stichfrage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt wird oder nicht
      b: Sie entscheidet, ob die Initiative gültig ist oder nicht
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Kantone an der Abstimmung teilnehmen können oder nicht
    explanation_de: Die Stimmberechtigten können sowohl der Initiative als auch dem Gegenentwurf mit Ja
      zustimmen. Mit der Stichfrage geben sie an, welche dieser beiden Vorlagen in Kraft treten soll,
      wenn beide angenommen werden. So geht keine zugunsten einer Änderung abgegebene Stimme verloren.
