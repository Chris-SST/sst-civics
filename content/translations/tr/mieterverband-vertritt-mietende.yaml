id: mieterverband-vertritt-mietende
lang: tr
source_version: 1
question: Kiracılar Birliği'nin (Mieterverband) görevi nedir?
options:
  a: Ev sahiplerinin çıkarlarını temsil eder
  b: Tüm konutların kira bedellerini belirler
  c: Kantonun adına konutları kiraya verir
  d: Kiracıların çıkarlarını temsil eder
explanation: Kiracılar Birliği, kiracıların çıkarlarını savunan bir kuruluştur. Üyelerine örneğin kira
  hukuku konusundaki sorularda danışmanlık yapar. Ev sahiplerinin çıkarlarını ise başka birlikler temsil
  eder.
