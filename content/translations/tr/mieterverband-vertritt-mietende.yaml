    question_de: Was ist die Aufgabe des Mieterverbands?
    options_de:
      a: Er vertritt die Interessen der Vermieter
      b: Er legt die Mietzinse aller Wohnungen fest
      c: Er vermietet Wohnungen im Namen des Kantons
      d: Er vertritt die Interessen der Mieter
    explanation_de: Der Mieterverband ist eine Organisation, die die Interessen der Mieter verteidigt.
      Er berät seine Mitglieder zum Beispiel bei Fragen zum Mietrecht. Die Interessen der Vermieter werden
      hingegen von anderen Verbänden vertreten.
