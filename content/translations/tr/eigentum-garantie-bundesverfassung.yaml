id: eigentum-garantie-bundesverfassung
lang: tr
source_version: 1
question: İsviçre'de özel kişilerin evlerini, arazilerini ve diğer mal varlıklarını hangi temel hak korur?
options:
  a: Mülkiyet güvencesi
  b: İnanç ve vicdan özgürlüğü
  c: İskân özgürlüğü (yerleşme özgürlüğü)
  d: Toplanma özgürlüğü
explanation: Federal Anayasa (Bundesverfassung), mülkiyeti 26. maddede güvence altına alır. Devlet mülkiyeti
  yalnızca belirli koşullar altında sınırlandırabilir; örneğin kamulaştırma durumunda yasal bir dayanak
  ve tam tazminat gereklidir.
