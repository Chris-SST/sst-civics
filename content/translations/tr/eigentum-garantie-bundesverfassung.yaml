    source_version: 1
    question_de: Welches Grundrecht schützt in der Schweiz die Häuser, das Land und das übrige Vermögen
      von Privatpersonen?
    options_de:
      a: Eigentumsgarantie
      b: Glaubens- und Gewissensfreiheit
      c: Niederlassungsfreiheit
      d: Versammlungsfreiheit
    explanation_de: Die Bundesverfassung gewährleistet das Eigentum in Artikel 26. Der Staat darf das
      Eigentum nur unter bestimmten Bedingungen einschränken; zum Beispiel sind im Fall einer Enteignung
      eine gesetzliche Grundlage und volle Entschädigung erforderlich.
