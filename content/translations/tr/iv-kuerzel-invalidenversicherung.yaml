id: iv-kuerzel-invalidenversicherung
lang: tr
source_version: 1
question: İsviçre sosyal sigorta sisteminde «IV» kısaltması neyi ifade eder?
options:
  a: Inlandversicherung (iç sigorta)
  b: Invalidenversicherung (malullük sigortası)
  c: Integrationsversicherung (entegrasyon sigortası)
  d: Individualversicherung (bireysel sigorta)
explanation: IV, malullük sigortası (Invalidenversicherung) anlamına gelir. Yaşlılık güvencesinin birinci
  sütununa dahildir ve sağlık sorunları nedeniyle kısıtlılığı olan kişilere, örneğin topluma ve çalışma
  hayatına yeniden uyum önlemleriyle veya aylıklarla yardımcı olur.
