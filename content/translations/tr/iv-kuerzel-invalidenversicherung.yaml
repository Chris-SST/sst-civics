    question_de: Was bedeutet die Abkürzung «IV» im schweizerischen Sozialversicherungssystem?
    options_de:
      a: Inlandversicherung (Inlandsversicherung)
      b: Invalidenversicherung (Versicherung bei Erwerbsunfähigkeit)
      c: Integrationsversicherung (Integrationsversicherung)
      d: Individualversicherung (individuelle Versicherung)
    explanation_de: IV bedeutet Invalidenversicherung (Invalidenversicherung). Sie gehört zur ersten Säule
      der Altersvorsorge und hilft Personen, die aufgrund gesundheitlicher Probleme eingeschränkt sind,
      zum Beispiel mit Massnahmen zur Wiedereingliederung in die Gesellschaft und ins Arbeitsleben oder
      mit Renten.
