    source_version: 1
    question_de: Was wird im Arbeitsvertrag zwischen dem Arbeitgeber und der Arbeitnehmerin unter anderem
      festgelegt?
    options_de:
      a: Die Höhe des Lohns
      b: Die Höhe der Rente der Alters- und Hinterlassenenversicherung (AHV)
      c: Der Satz der Mehrwertsteuer
      d: Die Höhe der Prämie der Krankenkasse
    explanation_de: Im Arbeitsvertrag werden die wichtigsten Bedingungen der Arbeit vereinbart; zum Beispiel
      die Aufgabe, die Arbeitszeit und der Lohn. Die Rente der Alters- und Hinterlassenenversicherung,
      die Mehrwertsteuer und die Prämie der Krankenkasse werden nicht im Arbeitsvertrag festgelegt.
