id: arbeitsvertrag-inhalt-lohnhoehe
lang: tr
source_version: 1
question: İşveren ile çalışan (kadın) arasındaki iş sözleşmesinde, diğer hususların yanı sıra, aşağıdakilerden
  hangisi belirlenir?
options:
  a: Maaşın tutarı
  b: Yaşlılık ve dul-yetim sigortası (AHV) aylığının tutarı
  c: Katma değer vergisinin oranı
  d: Sağlık sigortası şirketi (Krankenkasse) primi tutarı
explanation: İş sözleşmesinde işin en önemli koşulları kararlaştırılır; örneğin görev, çalışma süresi
  ve maaş. Yaşlılık ve dul-yetim sigortası aylığı, katma değer vergisi ve sağlık sigortası şirketi primi
  iş sözleşmesinde belirlenmez.
