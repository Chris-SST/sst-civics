id: parlament-zwei-kammern-bund
lang: tr
source_version: 1
question: İsviçre Parlamentosu Konfederasyon düzeyinde hangi iki meclisten oluşur?
options:
  a: Federal Konsey (Bundesrat) ve Kantonlar Konseyi (Ständerat)'nden
  b: Federal Konsey ve Ulusal Konsey (Nationalrat)'den
  c: Kantonlar Konseyi ve Federal Mahkeme (Bundesgericht)'den
  d: Ulusal Konsey ve Kantonlar Konseyi'nden
explanation: 'Konfederasyonun parlamentosu olan Federal Meclis (Bundesversammlung), iki meclisten oluşur:
  Ulusal Konsey ve Kantonlar Konseyi. Federal Konsey hükümettir ve parlamentoya ait değildir.'
