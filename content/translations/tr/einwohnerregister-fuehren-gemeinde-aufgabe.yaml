id: einwohnerregister-fuehren-gemeinde-aufgabe
lang: tr
source_version: 1
question: Aşağıdaki görevlerden hangisini Zürih belediyelerinde (Gemeinde) nüfus müdürlüğü (Einwohneramt)
  yerine getirir?
options:
  a: Ceza mahkûmiyeti kararları verir.
  b: Belediyenin nüfus kayıt defterini tutar.
  c: Kanton yolları için inşaat ruhsatı verir.
  d: Vergi kanunlarını belirler.
explanation: Belediye, orada ikamet eden kişilerin kaydını tutar. Taşındığınızda kaydınızı orada yaptırır,
  sildirir veya adres değişikliğini bildirirsiniz. Ceza mahkûmiyeti kararları, vergi kanunları ve kanton
  yolları bu görevin kapsamına girmez.
