    question_de: Welche der folgenden Aufgaben erfüllt das Einwohneramt in den Gemeinden des Kantons Zürich?
    options_de:
      a: Es fällt Strafurteile.
      b: Es führt das Einwohnerregister der Gemeinde.
      c: Es erteilt Baubewilligungen für Kantonsstrassen.
      d: Es legt die Steuergesetze fest.
    explanation_de: Die Gemeinde führt das Register der Personen, die dort wohnen. Wenn man umzieht, meldet
      man sich dort an, ab oder teilt eine Adressänderung mit. Strafurteile, Steuergesetze und Kantonsstrassen
      fallen nicht in den Bereich dieser Aufgabe.
