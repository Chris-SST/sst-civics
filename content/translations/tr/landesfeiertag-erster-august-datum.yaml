question: İsviçre Federal Bayramı, yani İsviçre'nin ulusal bayramı hangi tarihe denk gelir?
options:
  a: 1 Ağustos
  b: 26 Aralık
  c: 11 Kasım
  d: 1 Mayıs
explanation: İsviçre'nin ulusal bayramı 1 Ağustos'tur. Bu günde 1291 tarihli Konfederasyon Andlaşması
  (Bundesbrief) anılır. Birçok yerde kutlamalara havai fişekler, tepe ateşleri ve konuşmalar eşlik eder.
