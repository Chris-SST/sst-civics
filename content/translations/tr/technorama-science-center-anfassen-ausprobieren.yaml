id: technorama-science-center-anfassen-ausprobieren
lang: tr
source_version: 1
question: Zürich kantonunda ziyaretçiler hangi kurumda doğa bilimleri ve teknikle ilgili olguları kendi
  elleriyle tutup deneyebilir?
options:
  a: Zürih Opera Binası'nda (Opernhaus Zürich)
  b: Winterthur'daki Technorama'da
  c: Zürih Ulusal Müzesi'nde (Landesmuseum Zürich)
  d: Zürih Sanat Müzesi'nde (Kunsthaus Zürich)
explanation: Winterthur'daki Technorama bir bilim merkezidir. Ziyaretçiler orada sergilenen nesneler üzerinde
  kendileri deney yapar. Sanat Müzesi (Kunsthaus), Ulusal Müze (Landesmuseum) ve Opera Binası (Opernhaus)
  ise sanatı, tarihi ve sahne gösterilerini sunar.
