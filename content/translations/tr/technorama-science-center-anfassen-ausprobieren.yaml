    question_de: In welcher Einrichtung im Kanton Zürich können Besucher Phänomene der Naturwissenschaften
      und der Technik selbst mit den eigenen Händen anfassen und ausprobieren?
    options_de:
      a: Im Opernhaus Zürich
      b: Im Technorama in Winterthur
      c: Im Landesmuseum Zürich
      d: Im Kunsthaus Zürich
    explanation_de: Das Technorama in Winterthur ist ein Science Center. Die Besucher führen dort selbst
      Experimente an den ausgestellten Objekten durch. Das Kunsthaus, das Landesmuseum und das Opernhaus
      hingegen bieten Kunst, Geschichte und Bühnenaufführungen.
