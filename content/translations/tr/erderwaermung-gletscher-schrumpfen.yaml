question: Küresel ısınma, İsviçre Alpleri'ndeki buzullar üzerinde nasıl bir etki yaratır?
options:
  a: Buzullar küçülür.
  b: Buzullar kuzeye doğru kayar.
  c: Buzullar daha hızlı büyür.
  d: Buzullar değişmeden kalır.
explanation: Sıcaklıklar yükseldiğinde, kar yağışıyla yenilenenden daha fazla buz erir. Bu nedenle İsviçre
  buzulları küçülür. Bu durum, Alpler'deki sular ile doğayı ve manzarayı da etkiler.
