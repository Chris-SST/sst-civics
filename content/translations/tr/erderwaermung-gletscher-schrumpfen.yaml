    question_de: Welchen Einfluss hat die globale Erwärmung auf die Gletscher in den Schweizer Alpen?
    options_de:
      a: Die Gletscher schrumpfen.
      b: Die Gletscher verschieben sich nach Norden.
      c: Die Gletscher wachsen schneller.
      d: Die Gletscher bleiben unverändert.
    explanation_de: Wenn die Temperaturen steigen, schmilzt mehr Eis, als durch Schneefall erneuert wird.
      Deshalb schrumpfen die Schweizer Gletscher. Dieser Zustand beeinflusst auch die Gewässer in den
      Alpen sowie die Natur und die Landschaft.
