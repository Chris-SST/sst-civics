id: mietwohnung-zutritt-vermieter-triftiger-grund
lang: tr
source_version: 1
question: Hangi durumda kiracılar, kiraya veren tarafa daireye giriş izni vermek zorundadır?
options:
  a: Hiçbir zaman, daire her zaman korunmaktadır
  b: Haklı bir neden olduğunda
  c: Yalnızca kiraya veren talep ettiğinde, gerekçe göstermeksizin
  d: Her zaman ve önceden haber vermeksizin
explanation: Kiracılar, bunun için haklı bir neden bulunduğunda, örneğin acil bir onarım söz konusu olduğunda,
  giriş izni vermek zorundadır. Ancak kiraya veren taraf ziyaretini zamanında bildirmek ve kiracıları
  gözetmek zorundadır. Nedensiz giriş yapılmasına izin verilmez.
