    source_version: 1
    question_de: In welchem Fall müssen Mieterinnen und Mieter der vermietenden Partei den Zutritt zur
      Wohnung gewähren?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein berechtigter Grund vorliegt
      c: Nur wenn die vermietende Partei es verlangt, ohne Angabe von Gründen
      d: Immer und ohne vorherige Ankündigung
    explanation_de: Mieterinnen und Mieter müssen den Zutritt gewähren, wenn dafür ein berechtigter Grund
      vorliegt, zum Beispiel wenn es um eine dringende Reparatur geht. Die vermietende Partei muss ihren
      Besuch jedoch rechtzeitig ankündigen und auf die Mieterinnen und Mieter Rücksicht nehmen. Ein Zutritt
      ohne Grund ist nicht erlaubt.
