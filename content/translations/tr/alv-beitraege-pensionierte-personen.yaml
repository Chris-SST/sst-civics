    question_de: Wer muss in der Schweiz keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen, die mit einem unbefristeten Arbeitsvertrag arbeiten
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die teilzeitlich arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Beitragspflicht für die Arbeitslosenversicherung endet, wenn das Rentenalter der
      Alters- und Hinterlassenenversicherung (AHV) erreicht wird. Eine Person, die in Rente geht, bezahlt
      auf ihrem Lohn, falls vorhanden, keine ALV-Beiträge mehr. Teilzeit- und Vollzeitbeschäftigte hingegen
      bezahlen Beiträge.
