id: alv-beitraege-pensionierte-personen
lang: tr
source_version: 1
question: İsviçre'de kimler artık işsizlik sigortasına (ALV) prim ödemek zorunda değildir?
options:
  a: Süresiz bir iş sözleşmesiyle çalışan kişiler
  b: Olağan yaşlılık ve dul-yetim sigortası (AHV) emeklilik yaşına ulaşmış kişiler
  c: Yarı zamanlı çalışan kişiler
  d: Son iki yıl içinde hiç işsiz kalmamış kişiler
explanation: İşsizlik sigortası için prim ödeme yükümlülüğü, yaşlılık ve dul-yetim sigortası (AHV) emeklilik
  yaşına ulaşıldığında sona erer. Emekli olan kişi, varsa maaşı üzerinden artık ALV primi ödemez. Buna
  karşılık yarı zamanlı ve tam zamanlı çalışanlar prim öder.
