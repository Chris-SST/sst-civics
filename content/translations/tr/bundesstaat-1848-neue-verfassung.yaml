id: bundesstaat-1848-neue-verfassung
lang: tr
source_version: 1
question: İsviçre'de 1848 yılında ne ortaya çıktı?
options:
  a: Merkezi bir hükümete sahip Helvetik Cumhuriyeti
  b: Fransız gözetimi altındaki devletler topluluğu
  c: Yeni bir anayasaya sahip modern federal devlet
  d: Üç kurucu kantonun Konfederasyonu
explanation: 1848'de kantonlar kendilerine bir Federal Anayasa verdi ve modern federal devleti kurdu.
  Bu devlet, Konfederasyonun ortak görevlerini kantonların özerkliğiyle birleştirdi. Bu anayasa, bugünkü
  İsviçre'nin temelidir.
