    question_de: Was entstand 1848 in der Schweiz?
    options_de:
      a: Die Helvetische Republik mit einer Zentralregierung
      b: Ein Staatenbund unter französischer Aufsicht
      c: Ein moderner Bundesstaat mit einer neuen Verfassung
      d: Die Eidgenossenschaft der drei Gründerkantone
    explanation_de: 1848 gaben sich die Kantone eine Bundesverfassung und gründeten den modernen Bundesstaat.
      Dieser Staat verband die gemeinsamen Aufgaben der Eidgenossenschaft mit der Autonomie der Kantone.
      Diese Verfassung ist die Grundlage der heutigen Schweiz.
