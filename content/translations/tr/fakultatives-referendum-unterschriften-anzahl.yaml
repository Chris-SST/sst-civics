id: fakultatives-referendum-unterschriften-anzahl
lang: tr
source_version: 1
question: Konfederasyon yasasına karşı isteğe bağlı bir referandum için kaç imza gerekir?
options:
  a: 200.000 imza
  b: 30.000 imza
  c: 50.000 imza
  d: 100.000 imza
explanation: İsteğe bağlı bir referandum için oy hakkı olan kişilerden 50.000 geçerli imza gerekir. Bu
  imzaların, yasanın yayımlanmasından sonraki 100 gün içinde toplanması gerekir.
