    question_de: Wie viele Unterschriften sind für ein fakultatives Referendum gegen ein Bundesgesetz
      erforderlich?
    options_de:
      a: 200.000 Unterschriften
      b: 30.000 Unterschriften
      c: 50.000 Unterschriften
