question: Zürich kantonunun merkezi (Hauptort) hangi şehirdir?
options:
  a: Uster
  b: Zürich şehri
  c: Winterthur
  d: Dübendorf
explanation: Zürich şehri kantonun merkezidir ve kantonla aynı adı taşır. Kanton Konseyi (Kantonsrat)
  ve Hükümet Konseyi (Regierungsrat) başta olmak üzere birçok kurum orada bulunur. Winterthur, kantonun
  en büyük ikinci şehridir.
