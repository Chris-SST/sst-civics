    question_de: Wofür ist das Schweizer Eisenbahnnetz im internationalen Vergleich bekannt?
    options_de:
      a: Es ist das weltweit am dichtesten geknüpfte, am intensivsten ausgebaute Eisenbahnnetz.
      b: Es ist das einzige Eisenbahnnetz, das vollständig durch Tunnel führt.
      c: Es ist das längste Eisenbahnnetz Europas.
      d: Es ist das älteste Eisenbahnnetz der Welt.
    explanation_de: Auf einer kleinen Fläche gibt es sehr viele Eisenbahnlinien und Bahnhöfe. Deshalb
      gilt das Schweizer Netz als das dichteste Netz der Welt. Die Dichte sagt jedoch nichts über die
      absolute Länge aus.
