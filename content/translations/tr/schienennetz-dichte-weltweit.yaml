id: schienennetz-dichte-weltweit
lang: tr
source_version: 1
question: İsviçre demiryolu ağı uluslararası karşılaştırmada neyle tanınır?
options:
  a: Dünyada en sık örülmüş, en yoğun biçimde geliştirilmiş demiryolu ağıdır.
  b: Tamamen tünellerden geçen tek demiryolu ağıdır.
  c: Avrupa'nın en uzun demiryolu ağıdır.
  d: Dünyanın en eski demiryolu ağıdır.
explanation: Küçük bir alanda çok sayıda demiryolu hattı ve tren istasyonu bulunmaktadır. Bu nedenle İsviçre
  ağı dünyanın en yoğun ağı olarak kabul edilir. Ancak yoğunluk, mutlak uzunluk hakkında bir şey söylemez.
