    question_de: In der Schweiz beruht die Altersvorsorge auf drei Säulen. Welche Institution bildet die
      zweite Säule?
    options_de:
      a: Ergänzungsleistungen zur Alters- und Hinterlassenenversicherung (AHV)
      b: Alters- und Hinterlassenenversicherung (AHV) (staatliche Rentenversicherung)
      c: Pensionskasse (berufliche Altersvorsorge)
      d: Privates Sparkonto mit Steuerabzug (Säule 3a)
    explanation_de: Die Pensionskasse gehört zur beruflichen Altersvorsorge und bildet die zweite Säule.
      Sie ergänzt die Alters- und Hinterlassenenversicherung (AHV), damit Personen, die in Rente gehen,
      ihren gewohnten Lebensstandard in angemessenem Rahmen weiterführen können. Die Alters- und Hinterlassenenversicherung
      ist die erste Säule, die private Altersvorsorge hingegen die dritte Säule.
