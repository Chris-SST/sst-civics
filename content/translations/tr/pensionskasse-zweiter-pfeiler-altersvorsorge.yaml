id: pensionskasse-zweiter-pfeiler-altersvorsorge
lang: tr
source_version: 1
question: İsviçre'de yaşlılık güvencesi üç sütuna dayanır. İkinci sütunu hangi kurum oluşturur?
options:
  a: Yaşlılık ve dul-yetim sigortasına (AHV) ek yardımlar
  b: Yaşlılık ve dul-yetim sigortası (AHV) (devlet emeklilik sigortası)
  c: Emeklilik sandığı (mesleki yaşlılık güvencesi)
  d: Vergi indirimi sağlayan özel tasarruf hesabı (3a sütunu)
explanation: Emeklilik sandığı mesleki yaşlılık güvencesine aittir ve ikinci sütunu oluşturur. Emekli
  olan kişilerin alışkın oldukları yaşam standardını makul ölçüde sürdürebilmeleri için yaşlılık ve dul-yetim
  sigortasını (AHV) tamamlar. Yaşlılık ve dul-yetim sigortası birinci sütundur, özel yaşlılık güvencesi
  ise üçüncü sütundur.
