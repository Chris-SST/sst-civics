    question_de: Wer muss in der Schweiz bei einer Krankenkasse eine Grundversicherung haben?
    options_de:
      a: Alle Personen, die in der Schweiz leben
      b: nur Personen mit niedrigem Einkommen
      c: nur Personen mit Schweizer Bürgerrecht
      d: nur erwerbstätige Personen
    explanation_de: Die Krankenversicherung ist für alle Personen, die in der Schweiz wohnhaft sind, obligatorisch.
      Dies gilt unabhängig von der Staatsangehörigkeit, vom Alter oder davon, ob man arbeitet oder nicht.
      Die Krankenkassen müssen alle Personen in die Grundversicherung aufnehmen.
