id: krankenversicherung-obligatorisch-alle-einwohner
lang: tr
source_version: 1
question: İsviçre'de kimlerin sağlık sigortası şirketi (Krankenkasse) nezdinde temel sigortası olmak zorundadır?
options:
  a: İsviçre'de yaşayan tüm kişiler
  b: yalnızca düşük gelirli kişiler
  c: yalnızca İsviçre vatandaşlığına (Bürgerrecht) sahip kişiler
  d: yalnızca çalışan kişiler
explanation: Sağlık sigortası, İsviçre'de ikamet eden tüm kişiler için zorunludur. Bu durum uyruğa, yaşa
  veya çalışıp çalışmamaya bakılmaksızın geçerlidir. Sağlık sigortası şirketleri tüm kişileri temel sigortaya
  kabul etmek zorundadır.
