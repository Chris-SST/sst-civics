    question_de: Wie beginnt die Schulpflicht eines Kindes im Kanton Zürich?
    options_de:
      a: Mit dem Eintritt in die Sekundarschule
      b: Mit dem Eintritt in die Primarschule
      c: Mit dem Eintritt in die Spielgruppe
      d: Mit dem Eintritt in den Kindergarten
    explanation_de: Im Kanton Zürich ist der Kindergarten ein Teil der obligatorischen Volksschule. Deshalb
      beginnt die Schulpflicht mit dem Eintritt in den Kindergarten. Die Spielgruppe hingegen ist freiwillig.
