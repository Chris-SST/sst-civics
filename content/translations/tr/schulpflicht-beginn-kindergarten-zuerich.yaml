id: schulpflicht-beginn-kindergarten-zuerich
lang: tr
source_version: 1
question: Zürich kantonunda bir çocuğun okul zorunluluğu nasıl başlar?
options:
  a: Ortaokula (Sekundarschule) girişle
  b: İlkokula (Primarschule) girişle
  c: Oyun grubuna (Spielgruppe) girişle
  d: Anaokuluna (Kindergarten) girişle
explanation: Zürich kantonunda anaokulu, zorunlu halk okulunun (Volksschule) bir parçasıdır. Bu nedenle
  okul zorunluluğu, anaokuluna girişle birlikte başlar. Oyun grubu ise isteğe bağlıdır.
