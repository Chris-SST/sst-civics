    question_de: Wie gross ist ungefähr der Anteil der Fläche des Kantons Zürich, der landwirtschaftlich
      genutzt wird?
    options_de:
      a: Ungefähr 68 Prozent
      b: Ungefähr 25 Prozent
      c: Ungefähr 11 Prozent
