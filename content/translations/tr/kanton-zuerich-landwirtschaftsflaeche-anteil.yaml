question: Zürich kantonunun yüzölçümünün yaklaşık ne kadarlık bölümü tarım amaçlı kullanılmaktadır?
options:
  a: Yaklaşık yüzde 68
  b: Yaklaşık yüzde 25
  c: Yaklaşık yüzde 11
  d: Yaklaşık yüzde 41
explanation: Zürich kantonunun yüzölçümünün yaklaşık yüzde 41'i tarım için kullanılmaktadır. Geri kalan
  kısım çoğunlukla ormanlardan, yerleşim alanlarından ve su alanlarından oluşmaktadır.
