lang: tr
source_version: 1
question: Zürich Hükümet Konseyi'nin (Regierungsrat) bileşimiyle ilgili hangi ifade doğrudur?
options:
  a: Üç kişiden oluşur.
  b: Yedi kişiden oluşur.
  c: Dokuz kişiden oluşur.
  d: Beş kişiden oluşur.
explanation: Zürich Hükümet Konseyi yedi kişiden oluşan bir kuruldur. Üyeleri kantonu birlikte yönetir
  ve her biri bir müdürlüğün (Direktion) başında yer alır.
