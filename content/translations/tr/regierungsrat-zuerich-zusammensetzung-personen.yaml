    question_de: Welche Aussage über die Zusammensetzung des Zürcher Regierungsrates ist richtig?
    options_de:
      a: Er besteht aus drei Personen.
      b: Er besteht aus sieben Personen.
      c: Er besteht aus neun Personen.
      d: Er besteht aus fünf Personen.
    explanation_de: Der Zürcher Regierungsrat ist ein Gremium aus sieben Personen. Seine Mitglieder leiten
      den Kanton gemeinsam und jedes von ihnen steht an der Spitze einer Direktion.
