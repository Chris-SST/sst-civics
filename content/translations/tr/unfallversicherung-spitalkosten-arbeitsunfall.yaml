    source_version: 1
    question_de: Ein Arbeitnehmer erleidet am Arbeitsplatz einen schweren Unfall und muss ins Spital eingeliefert
      werden. Welche Versicherung übernimmt die Spitalkosten?
    options_de:
      a: Arbeitslosenversicherung
      b: Unfallversicherung
      c: Erwerbsersatzordnung
      d: Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt bei Arbeitsunfällen die Behandlungskosten,
      also zum Beispiel die Spitalkosten. Arbeitnehmende sind über den Arbeitgeber bei dieser Versicherung
      versichert. Die anderen genannten Versicherungen decken andere Risiken ab.
