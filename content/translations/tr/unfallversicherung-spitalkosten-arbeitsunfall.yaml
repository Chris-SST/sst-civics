id: unfallversicherung-spitalkosten-arbeitsunfall
lang: tr
source_version: 1
question: Bir çalışan iş yerinde ağır bir kaza geçiriyor ve hastaneye yatırılması gerekiyor. Hastane masraflarını
  hangi sigorta karşılar?
options:
  a: İşsizlik sigortası
  b: Kaza sigortası
  c: Gelir kaybı tazminat sistemi (Erwerbsersatzordnung)
  d: Yaşlılık ve Hayat Boyu Hayatta Kalanlar Sigortası
explanation: Zorunlu kaza sigortası, iş kazalarında tedavi masraflarını, yani örneğin hastane masraflarını
  öder. Çalışanlar işveren aracılığıyla bu sigortaya sahiptir. Belirtilen diğer sigortalar başka riskleri
  kapsar.
