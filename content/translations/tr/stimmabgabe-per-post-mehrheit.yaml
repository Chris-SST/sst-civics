    question_de: Wie geben die meisten Stimmberechtigten in der Schweiz heute bei Abstimmungen und Wahlen
      ihre Stimme ab?
    options_de:
      a: Sie geben ihre Stimme am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie werfen ihre Stimme am Abstimmungssonntag persönlich in die Urne.
      c: Sie senden ihre Stimme auf dem Postweg an die Gemeinde.
      d: Sie geben ihre Stimme über eine Internetseite der Eidgenossenschaft ab.
    explanation_de: Die Mehrheit der Stimmberechtigten stimmt brieflich, das heisst auf dem Postweg, ab.
      Der Gang an die Urne am Abstimmungssonntag ist heute für die meisten Leute nicht mehr üblich.
