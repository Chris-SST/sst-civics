id: stimmabgabe-per-post-mehrheit
lang: tr
source_version: 1
question: İsviçre'de seçmenlerin çoğu bugün oylamalarda ve seçimlerde oylarını nasıl kullanıyor?
options:
  a: Oylarını oylama pazarı günü belediye halk toplantısında (Gemeindeversammlung) kullanırlar.
  b: Oylarını oylama pazarı günü bizzat sandığa atarlar.
  c: Oylarını posta yoluyla belediyeye (Gemeinde) gönderirler.
  d: Oylarını Konfederasyonun bir internet sitesi üzerinden kullanırlar.
explanation: Seçmenlerin çoğunluğu mektupla, yani posta yoluyla oy kullanır. Oylama pazarı günü sandığa
  gitmek bugün çoğu kişi için artık yaygın değildir.
