question: Gotthard Base Tüneli dünya çapında karşılaştırıldığında neyiyle öne çıkar?
options:
  a: Dünyanın en uzun demiryolu tünelidir.
  b: Dünyanın en yüksek rakımda bulunan demiryolu tünelidir.
  c: Dünyanın en uzun karayolu tünelidir.
  d: Avrupa'nın en eski demiryolu tünelidir.
explanation: Gotthard Base Tüneli dünyanın en uzun demiryolu tünelidir. Kuzey İsviçre'yi Ticino ile birbirine
  bağlar ve Alpler'den geçen kuzey-güney ekseninin önemli bir parçasıdır.
