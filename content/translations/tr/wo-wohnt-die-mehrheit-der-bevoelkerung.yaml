id: wo-wohnt-die-mehrheit-der-bevoelkerung
lang: tr
source_version: 2
question: İsviçre'nin hangi bölgesinde nüfusun çoğunluğu yaşamaktadır?
options:
  a: Alplerde
  b: Ticino'da
  c: Mittelland'da (Orta Bölge)
  d: Jura'da
explanation: Mittelland (Orta Bölge), Jura ile Alpler arasında yer alır. Büyük şehirlerin çoğu burada
  bulunur ve nüfusun büyük bölümü burada yaşar. Alpler geniş bir alanı kaplasa da nüfus yoğunluğu çok
  düşüktür.
