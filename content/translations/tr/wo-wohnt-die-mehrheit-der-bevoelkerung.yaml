    question_de: In welcher Region der Schweiz lebt die Mehrheit der Bevölkerung?
    options_de:
      a: In den Alpen
      b: Im Tessin
      c: Im Mittelland
      d: Im Jura
    explanation_de: Das Mittelland liegt zwischen dem Jura und den Alpen. Die meisten grossen Städte befinden
      sich hier, und der grösste Teil der Bevölkerung lebt hier. Obwohl die Alpen eine grosse Fläche einnehmen,
      ist die Bevölkerungsdichte sehr gering.
