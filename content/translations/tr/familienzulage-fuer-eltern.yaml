    question_de: Welche Leistung erhalten Eltern, die in der Schweiz erwerbstätig sind oder als Selbständigerwerbende
      ein Einkommen erzielen und Kinder haben, vom Staat?
    options_de:
      a: Invalidenrente
      b: Arbeitslosenentschädigung
      c: Zusatzleistung zur Alters- und Hinterlassenenversicherung (AHV)
      d: Familienzulage
    explanation_de: Familienzulagen helfen Familien, einen Teil der Ausgaben für Kinder zu decken. Sie
      bestehen aus der Kinderzulage und der Ausbildungszulage. Auch Selbständigerwerbende können diese
      Zulagen erhalten.
