id: familienzulage-fuer-eltern
lang: tr
source_version: 1
question: İsviçre'de çalışan veya serbest meslek sahibi olarak gelir elde eden ve çocuğu olan ebeveynler
  devletten hangi yardımı alır?
options:
  a: Malullük aylığı
  b: İşsizlik tazminatı
  c: Yaşlılık ve dul-yetim sigortasına (AHV) ek yardım
  d: Aile ödeneği
explanation: Aile ödenekleri, ailelerin çocuklarla ilgili giderlerin bir kısmını karşılamasına yardımcı
  olur. Çocuk ödeneği ve eğitim ödeneğinden oluşurlar. Serbest meslek sahipleri de bu ödenekleri alabilir.
