id: volksinitiative-ziel-verfassungsaenderung
lang: tr
source_version: 2
question: Seçmenler, federal düzeydeki bir halk girişimi (Volksinitiative) ile ne talep edebilir?
options:
  a: Federal Konsey'in (Bundesrat) görevden alınmasını
  b: Federal Anayasa'nın değiştirilmesini
  c: Yürürlükteki bir federal yasanın doğrudan kaldırılmasını
  d: kanton anayasasının değiştirilmesini
explanation: Seçmenler, federal düzeydeki bir halk girişimi ile Federal Anayasa'nın değiştirilmesini talep
  edebilir. Buna karşılık bir referandum ile halk, parlamentonun yeni kabul ettiği bir yasa hakkında oy
  kullanabilir. Yürürlükte olan bir yasa bununla kaldırılamaz.
