    question_de: Was können die Stimmberechtigten mit einer Volksinitiative auf Bundesebene verlangen?
    options_de:
      a: die Absetzung des Bundesrates
      b: die Änderung der Bundesverfassung
      c: die direkte Aufhebung eines geltenden Bundesgesetzes
      d: die Änderung der Kantonsverfassung
    explanation_de: Die Stimmberechtigten können mit einer Volksinitiative auf Bundesebene die Änderung
      der Bundesverfassung verlangen. Mit einem Referendum hingegen kann das Volk über ein vom Parlament
      neu verabschiedetes Gesetz abstimmen. Ein geltendes Gesetz kann dadurch nicht aufgehoben werden.
