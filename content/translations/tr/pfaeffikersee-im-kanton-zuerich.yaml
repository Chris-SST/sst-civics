id: pfaeffikersee-im-kanton-zuerich
lang: tr
source_version: 1
question: Pfäffikersee hangi kantonda yer alır?
options:
  a: Thurgau kantonu
  b: St. Gallen kantonu
  c: Zürih kantonu
  d: Zug kantonu
explanation: Pfäffikersee, Zürcher Oberland bölgesinde yer alır ve Zürih kantonunun topraklarına aittir.
  Kantondaki daha büyük göllerden biridir. Adı geçen diğer kantonların bazıları Zürih ile komşudur, ancak
  gölü kendi sınırları içinde barındırmaz.
