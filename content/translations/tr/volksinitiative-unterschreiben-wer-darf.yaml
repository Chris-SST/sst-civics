id: volksinitiative-unterschreiben-wer-darf
lang: tr
source_version: 2
question: Federal bir halk girişimini (Volksinitiative) kimler imzalayabilir?
options:
  a: İsviçre'de ikamet eden 16 yaşını doldurmuş tüm kişiler
  b: C yerleşim iznine (yerleşim izni, Niederlassungsbewilligung) sahip 18 yaşını doldurmuş tüm kişiler
  c: Yalnızca bir siyasi partinin 18 yaşını doldurmuş üyeleri
  d: 18 yaşını doldurmuş İsviçre vatandaşları
explanation: Federal bir halk girişimini, Konfederasyon düzeyinde oy hakkı bulunan kişiler imzalayabilir.
  Bunlar, 18 yaşını doldurmuş İsviçreli kadınlar ve erkeklerdir; yurt dışında yaşayanlar da seçmen kütüğüne
  kayıtlıysa imzalayabilir. Yalnızca sürekli ayırt etme gücünden yoksun olmaları nedeniyle kapsamlı vesayet
  altında bulunan veya bir vekalet görevlisi (vorsorgebeauftragte Person) tarafından temsil edilen kişiler
  hariç tutulur; yabancıların Konfederasyon düzeyinde siyasi hakları yoktur, C izni olsa bile.
