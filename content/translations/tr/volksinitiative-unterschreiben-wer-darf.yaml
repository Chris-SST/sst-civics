    question_de: Wer kann eine eidgenössische Volksinitiative unterzeichnen?
    options_de:
      a: Alle Personen ab 16 Jahren, die in der Schweiz wohnhaft sind
      b: Alle Personen ab 18 Jahren mit einer Niederlassungsbewilligung C
      c: Nur die Mitglieder einer politischen Partei ab 18 Jahren
      d: Schweizer Staatsangehörige ab 18 Jahren
    explanation_de: Eine eidgenössische Volksinitiative können die Personen unterzeichnen, die auf Ebene
      der Eidgenossenschaft stimmberechtigt sind. Das sind Schweizerinnen und Schweizer ab 18 Jahren;
      auch im Ausland lebende Personen können unterzeichnen, wenn sie im Stimmregister eingetragen sind.
      Ausgeschlossen sind nur Personen, die wegen dauernder Urteilsunfähigkeit unter umfassender Beistandschaft
      stehen oder durch eine vorsorgebeauftragte Person vertreten werden; Ausländer haben auf Ebene der
      Eidgenossenschaft keine politischen Rechte, auch nicht mit einer C-Bewilligung.
