question: 1863 yılında Cenevre'de kurulan tanınmış insani yardım kuruluşu hangisidir?
options:
  a: Birleşmiş Milletler (BM)
  b: Dünya Sağlık Örgütü (DSÖ)
  c: Dünya Gıda Programı (WFP)
  d: Uluslararası Kızılhaç Komitesi (ICRC)
explanation: ICRC, 1863 yılında Cenevre'de, başka etkenlerin yanı sıra Henry Dunant'ın önerisi üzerine
