    question_de: 'Wie wird im Kanton Zürich bestimmt, wer die Mitglieder des Regierungsrates bestimmt?
      Mit anderen Worten: Wer entscheidet im Kanton Zürich darüber, wer im Regierungsrat sitzen wird?'
    options_de:
      a: Die Bundesversammlung wählt die Mitglieder des Regierungsrates.
      b: Der Kantonsrat wählt die Mitglieder aus seiner eigenen Mitte.
      c: Die Gemeindepräsidenten wählen die Mitglieder.
      d: Die stimmberechtigte Bevölkerung des Kantons wählt die Mitglieder direkt.
    explanation_de: Im Kanton Zürich wählt das Volk den Regierungsrat an der Urne direkt. Der Kantonsrat
      ist das Parlament und wählt die Regierung nicht. Dies unterscheidet den Kanton vom Bund, wo die
      Bundesversammlung die Mitglieder des Bundesrates wählt.
