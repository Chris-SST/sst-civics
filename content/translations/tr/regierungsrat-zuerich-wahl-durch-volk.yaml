id: regierungsrat-zuerich-wahl-durch-volk
lang: tr
source_version: 1
question: 'Zürich kantonunda Hükümet Konseyi (Regierungsrat) üyelerini kimin belirlediği nasıl belirlenir?
  Başka bir deyişle: Zürich kantonunda Hükümet Konseyi''nde kimin yer alacağına kim karar verir?'
options:
  a: Federal Meclis (Bundesversammlung), Hükümet Konseyi üyelerini seçer.
  b: Kanton Konseyi (Kantonsrat), üyeleri kendi içinden seçer.
  c: Belediye (Gemeinde) başkanları üyeleri seçer.
  d: Kantonun oy hakkına sahip nüfusu üyeleri doğrudan seçer.
explanation: Zürich kantonunda halk, Hükümet Konseyi'ni sandıkta doğrudan seçer. Kanton Konseyi parlamentodur
  ve hükümeti seçmez. Bu durum kantonu, Federal Meclis'in Federal Konsey (Bundesrat) üyelerini seçtiği
  Konfederasyon'dan ayırır.
