    question_de: Wer wird in der Schweiz von der obligatorischen Grundversicherung für medizinische Behandlungen
      erfasst?
    options_de:
      a: Nur Personen mit dem Schweizer Bürgerrecht
      b: Nur lohnabhängig erwerbstätige Personen
      c: Nur Personen mit niedrigem Einkommen
      d: Alle Personen, die in der Schweiz leben
    explanation_de: Die obligatorische Krankenversicherung gilt für alle Personen, die in der Schweiz
      ihren Wohnsitz haben. Staatsbürgerschaft, Erwerbsstatus und Einkommen spielen dabei keine Rolle.
