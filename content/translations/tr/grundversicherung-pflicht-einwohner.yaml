id: grundversicherung-pflicht-einwohner
lang: tr
source_version: 1
question: İsviçre'de tıbbi tedaviler için zorunlu temel sigorta kimleri kapsar?
options:
  a: Yalnızca İsviçre vatandaşlığına (Bürgerrecht) sahip kişileri
  b: Yalnızca maaşlı çalışan kişileri
  c: Yalnızca düşük gelirli kişileri
  d: İsviçre'de yaşayan tüm kişileri
explanation: Zorunlu sağlık sigortası, İsviçre'de ikamet eden tüm kişiler için geçerlidir. Vatandaşlık,
  çalışma durumu ve gelir bu konuda hiçbir rol oynamaz.
