id: ahv-abkuerzung-bedeutung
lang: tr
source_version: 1
question: AHV kısaltması neyi ifade eder?
options:
  a: Yaşlılık ve dul-yetim sigortası (Alters- und Hinterlassenenversicherung)
  b: Resmî hane sigortası (Amtliche Haushaltsversicherung)
  c: Sigortalılar için genel yardım (Allgemeine Hilfe für Versicherte)
  d: İşsizlik ve tedavi sigortası (Arbeitslosen- und Heilungsversicherung)
explanation: AHV, yaşlılık ve dul-yetim sigortası (AHV) anlamına gelir. Yaşlılıkta ve geride kalanlara,
  örneğin dul kadınlara, dul erkeklere ve yetimlere gelir öder.
