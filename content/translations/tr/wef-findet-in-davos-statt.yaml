question: Dünya Ekonomik Forumu'nun (WEF) yıllık toplantısı düzenli olarak İsviçre'nin hangi yerleşim
  yerinde yapılır?
options:
  a: Davos'ta
  b: Luzern'de
  c: Montreux'de
  d: Interlaken'de
explanation: Dünya Ekonomik Forumu düzenli olarak Graubünden kantonundaki Davos'ta toplanır. Burada siyaset
  ve ekonomi alanlarından uzmanlar bir araya gelir. Konfederasyon, toplantının güvenliğini destekler.
