id: demokratie-bevoelkerung-waehlt-parlament
lang: tr
source_version: 1
question: Türkiye gibi değil, İsviçre gibi bir demokraside halkın haklarına ne dahildir?
options:
  a: Federal Mahkeme (Bundesgericht) hakimlerini kura ile atar.
  b: Yasaları parlamento olmadan tek başına belirler.
  c: Parlamentosunu seçimlerle belirler.
  d: Ordu komutanlığını doğrudan seçer.
explanation: Demokraside halk, temsilcilerini parlamentoya seçer. Konfederasyon düzeyinde bunlar Ulusal
  Konsey (Nationalrat) ile Kantonlar Konseyi'dir (Ständerat). Parlamento daha sonra halk adına federal
  yasaları çıkarır.
