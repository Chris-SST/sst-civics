    question_de: Was gehört in einer Demokratie wie der Schweiz, nicht wie der Türkei, zu den Rechten
      des Volkes?
    options_de:
      a: Es ernennt die Richter des Bundesgerichts per Los.
      b: Es bestimmt die Gesetze allein, ohne Parlament.
      c: Es bestimmt sein Parlament durch Wahlen.
      d: Es wählt die Armeeführung direkt.
    explanation_de: In der Demokratie wählt das Volk seine Vertreter ins Parlament. Auf Ebene der Eidgenossenschaft
      sind dies der Nationalrat und der Rat der Kantone (Ständerat). Das Parlament erlässt danach im Namen
      des Volkes die Bundesgesetze.
