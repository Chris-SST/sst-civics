id: bundesparlament-wahl-alle-vier-jahre
lang: tr
source_version: 2
question: Halk, federal parlamentoyu hangi aralıklarla yeniden seçer?
options:
  a: Üç yılda bir
  b: Dört yılda bir
  c: Altı yılda bir
  d: İki yılda bir
explanation: Halk, Ulusal Konsey'i (Nationalrat) dört yılda bir yeniden seçer. Kantonlar Konseyi'nin (Ständerat)
  üyeleri de bugün tüm kantonlarda dört yıllığına seçilir. Seçimin nasıl yapılacağını ve kısmen ne zaman
  yapılacağını her kanton kendisi belirler.
