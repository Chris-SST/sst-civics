    question_de: In welchen Abständen wählt das Volk das eidgenössische Parlament neu?
    options_de:
      a: Alle drei Jahre
      b: Alle vier Jahre
      c: Alle sechs Jahre
      d: Alle zwei Jahre
    explanation_de: Das Volk wählt den Nationalrat alle vier Jahre neu. Die Mitglieder des Ständerats
      werden heute ebenfalls in allen Kantonen für vier Jahre gewählt. Wie die Wahl durchgeführt wird
      und teilweise wann sie stattfindet, bestimmt jeder Kanton selbst.
