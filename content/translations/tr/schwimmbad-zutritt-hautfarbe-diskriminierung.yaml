    question_de: Ein öffentliches Schwimmbad verweigert einer Person wegen ihrer Hautfarbe den Zutritt
      zum Bad. Gegen welchen Grundsatz der Bundesverfassung verstösst dies?
    options_de:
      a: Wirtschaftsfreiheit
      b: Diskriminierungsverbot
      c: Stimmrecht
      d: Recht auf Ehe und Familie
    explanation_de: Die Bundesverfassung verbietet in Artikel 8 die Diskriminierung, zum Beispiel wegen
      der Herkunft oder der Rasse. Deshalb darf niemand schlechter behandelt werden.
