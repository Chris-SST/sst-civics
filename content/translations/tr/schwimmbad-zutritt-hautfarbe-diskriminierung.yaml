id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: tr
source_version: 1
question: Bir kamu yüzme havuzu, bir kişinin cilt rengi nedeniyle havuza girişini reddetmektedir. Bu durum
  Federal Anayasa'nın hangi ilkesini ihlal eder?
options:
  a: Ekonomik özgürlük
  b: Ayrımcılık yasağı
  c: Oy hakkı
  d: Evlilik ve aile hakkı
explanation: Federal Anayasa 8. maddesinde, örneğin kökeni veya ırkı nedeniyle ayrımcılığı yasaklar. Bu
  nedenle hiç kimseye daha kötü davranılamaz.
