    question_de: Wie oft im Jahr finden in der Schweiz normalerweise eidgenössische Volksabstimmungen
      statt?
    options_de:
      a: Einmal
      b: Nur alle vier Jahre
      c: Höchstens viermal
      d: Jeden Monat
    explanation_de: Für eidgenössische Volksabstimmungen sind pro Jahr höchstens vier Abstimmungstermine
      vorgesehen. An einem Abstimmungstag wird meistens gleichzeitig über mehrere Vorlagen abgestimmt.
      Die Wahlen des Nationalrats hingegen finden alle vier Jahre statt; das sind keine Abstimmungen.
