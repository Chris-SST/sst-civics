id: eidgenoessische-abstimmungstermine-pro-jahr
lang: tr
source_version: 1
question: İsviçre'de federal halk oylamaları normalde yılda kaç kez yapılır?
options:
  a: Bir kez
  b: Yalnızca dört yılda bir
  c: En fazla dört kez
  d: Her ay
explanation: Federal halk oylamaları için yılda en fazla dört oylama pazarı öngörülmüştür. Bir oylama
  gününde çoğu zaman aynı anda birden fazla tasarı hakkında oy verilir. Buna karşın Ulusal Konsey (Nationalrat)
  seçimleri dört yılda bir yapılır; bunlar oylama değildir.
