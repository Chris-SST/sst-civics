    question_de: Wer entscheidet im Kanton Zürich in der Regel über ein Baugesuch für eine neue Wohnung?
    options_de:
      a: Der Regierungsrat
      b: Die Baubehörde der Gemeinde
      c: Das Bezirksgericht
      d: Das Bundesamt für Raumentwicklung des Bundes
    explanation_de: Baugesuche für Wohnungen werden bei der Gemeinde eingereicht. Die Baubehörde der Gemeinde
      prüft das Gesuch und erteilt die Baubewilligung oder lehnt sie ab. Der Kanton wird nur in besonderen
      Fällen in das Verfahren einbezogen.
