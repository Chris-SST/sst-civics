id: baugesuch-wohnhaus-entscheid-gemeindebehoerde
lang: tr
source_version: 1
question: Zürich kantonunda, yeni bir konut için yapılan inşaat başvurusuna kural olarak kim karar verir?
options:
  a: Hükümet Konseyi (Regierungsrat)
  b: Belediyenin (Gemeinde) inşaat makamı
  c: İlçe mahkemesi
  d: Konfederasyonun Mekânsal Gelişim Federal Dairesi
explanation: Konutlar için inşaat başvuruları belediyeye (Gemeinde) yapılır. Belediyenin inşaat makamı
  başvuruyu inceler ve inşaat ruhsatını verir ya da reddeder. Kanton yalnızca özel durumlarda sürece dahil
  olur.
