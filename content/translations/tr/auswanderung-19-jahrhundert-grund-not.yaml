question: 19. yüzyılda birçok insan İsviçre'yi terk etti ve örneğin Amerika'ya göç etti. Bunun önemli
  bir nedeni neydi?
options:
  a: Yoksulluk ve iş eksikliği geçimlerini tehdit ediyordu.
  b: Konfederasyon, İsviçre'de yaşamalarını yasaklamıştı.
  c: İsviçre'de fabrikalar için yeterli yer yoktu.
  d: Yurt dışında yeni gelenlerden vergi alınmıyordu.
explanation: 19. yüzyılda İsviçre henüz bir göç veren ülkeydi. Kıtlıklar, yoksulluk ve iş eksikliği birçok
  insanı yurt dışında yeni bir hayat aramaya itti. İsviçre ancak daha sonra göç alan bir ülke haline geldi.
