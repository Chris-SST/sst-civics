    question_de: Im 19. Jahrhundert verliessen viele Menschen die Schweiz und wanderten zum Beispiel nach
      Amerika aus. Was war ein wichtiger Grund dafür?
    options_de:
      a: Armut und Arbeitsmangel bedrohten ihre Existenz.
      b: Die Eidgenossenschaft hatte ihnen verboten, in der Schweiz zu leben.
      c: In der Schweiz gab es nicht genug Platz für Fabriken.
      d: Im Ausland wurden von Neuankömmlingen keine Steuern erhoben.
    explanation_de: Im 19. Jahrhundert war die Schweiz noch ein Auswanderungsland. Hungersnöte, Armut
      und Arbeitsmangel drängten viele Menschen dazu, im Ausland ein neues Leben zu suchen. Erst später
      wurde die Schweiz zu einem Einwanderungsland.
