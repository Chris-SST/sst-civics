id: bezeichnung-regierung-bund-bundesrat
lang: tr
source_version: 1
question: İsviçre'nin federal düzeydeki hükümetinin adı nedir?
options:
  a: Federal Meclis (Bundesversammlung)
  b: Federal Konsey (Bundesrat)
  c: Federal Kançılarya (Bundeskanzlei)
  d: Federal Mahkeme (Bundesgericht)
explanation: Konfederasyonun hükümetinin adı Federal Konsey'dir (Bundesrat). Federal Meclis (Bundesversammlung)
  parlamentodur, Federal Mahkeme (Bundesgericht) ise en yüksek mahkemedir. Federal Kançılarya (Bundeskanzlei)
  Federal Konsey'e destek verir.
