id: bundesebene-gesetze-erlass-parlament
lang: tr
source_version: 1
question: Konfederasyon düzeyinde yasaları hangi makam çıkarır?
options:
  a: Federal Meclis (Bundesversammlung), yani Ulusal Konsey (Nationalrat) ve Kantonlar Konseyi (Ständerat)
  b: İsviçre Ulusal Bankası
  c: Federal Kançılarya (Bundeskanzlei)
  d: Kanton hükümetleri konferansı
explanation: Federal Meclis, Konfederasyonun parlamentosudur ve Ulusal Konsey ile Kantonlar Konseyi'nden
  oluşur. Yasama görevi Federal Meclis'e aittir. Federal Kançılarya ise buna karşılık, bir kurmay birimi
  olarak Federal Konsey'e (Bundesrat) destek verir.
