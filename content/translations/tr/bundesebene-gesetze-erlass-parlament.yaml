    question_de: Welche Behörde erlässt auf Ebene der Eidgenossenschaft die Gesetze?
    options_de:
      a: Die Bundesversammlung, also der Nationalrat und der Ständerat
      b: Die Schweizerische Nationalbank
      c: Die Bundeskanzlei
      d: Die Konferenz der Kantonsregierungen
    explanation_de: Die Bundesversammlung ist das Parlament der Eidgenossenschaft und besteht aus dem
      Nationalrat und dem Ständerat. Die Gesetzgebungsaufgabe gehört zur Bundesversammlung. Die Bundeskanzlei
      hingegen unterstützt als Stabsstelle den Bundesrat.
