    question_de: Seit welchem Jahr können Frauen auf Ebene des Bundes (der Konfederation) wählen und an
      Abstimmungen teilnehmen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: Im Jahr 1971 nahmen die Schweizer Männer in einer Volksabstimmung das Stimmrecht der
      Frauen auf Bundesebene an. Seit diesem Datum können Frauen auf nationaler Ebene bei Wahlen wählen,
      an Abstimmungen teilnehmen und gewählt werden. Die Kantone führten das Stimmrecht der Frauen zu
      unterschiedlichen Zeitpunkten ein; einige vor 1971, Appenzell Innerrhoden als letzter Kanton erst
      1990.
