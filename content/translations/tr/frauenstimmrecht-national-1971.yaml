id: frauenstimmrecht-national-1971
lang: tr
source_version: 2
question: İsviçre'de kadınlar hangi yıldan beri Konfederasyon düzeyinde oy kullanabilir ve oylamalara
  katılabilir?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: 1971 yılında İsviçreli erkekler, bir halk oylamasında Konfederasyon düzeyinde kadınların
  oy hakkını kabul etti. O tarihten beri kadınlar ulusal düzeyde seçimlerde oy kullanabilir, oylamalara
  katılabilir ve seçilebilir. Kantonlar kadınların oy hakkını farklı zamanlarda getirdi; bazıları 1971'den
  önce, Appenzell Innerrhoden ise son kanton olarak ancak 1990'da getirdi.
