question: Zürih'in Roma dönemindeki adı neydi?
options:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
explanation: 'Romalılar, Limmat Nehri kıyısındaki yerleşimlerine ve gümrük istasyonlarına Turicum adını
  verdi. Zürih adı daha sonra bu addan gelişti. Diğer adlar, bugünkü İsviçre''de bulunan Roma dönemi yerleşimlerine
  aittir: Windisch, Augst ve Avenches.'
