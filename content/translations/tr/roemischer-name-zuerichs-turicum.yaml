    question_de: Wie hiess Zürich in der Römerzeit?
    options_de:
      a: Turicum
      b: Augusta Raurica
      c: Vindonissa
      d: Aventicum
    explanation_de: 'Die Römer gaben ihrer Siedlung und Zollstation am Ufer der Limmat den Namen Turicum.
      Der Name Zürich entwickelte sich später aus diesem Namen. Die anderen Namen gehören zu römerzeitlichen
      Siedlungen in der heutigen Schweiz: Windisch, Augst und Avenches.'
