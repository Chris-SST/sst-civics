    question_de: Wer muss in der Schweiz eine Krankenversicherung abschliessen?
    options_de:
      a: Nur Personen mit Schweizer Bürgerrecht
      b: Alle Personen, die in der Schweiz wohnen
      c: Nur Personen unter 65 Jahren
      d: Nur Erwerbstätige
    explanation_de: Die obligatorische Krankenversicherung umfasst alle Personen, die ihren Wohnsitz in
      der Schweiz haben. Das Bürgerrecht, der Erwerbsstatus und das Alter spielen dabei keine Rolle. Die
      Versicherung muss innerhalb von drei Monaten nach dem Umzug in die Schweiz abgeschlossen werden.
