id: krankenversicherung-obligatorisch-einwohner
lang: tr
source_version: 1
question: İsviçre'de kimlerin sağlık sigortası yaptırması gerekir?
options:
  a: Yalnızca İsviçre vatandaşlığına (Bürgerrecht) sahip kişiler
  b: İsviçre'de ikamet eden tüm kişiler
  c: Yalnızca 65 yaşın altındaki kişiler
  d: Yalnızca çalışanlar
explanation: Zorunlu sağlık sigortası, İsviçre'de ikametgâhı olan tüm kişileri kapsar. Vatandaşlık, çalışma
  durumu ve yaş bu konuda rol oynamaz. Sigorta, İsviçre'ye taşınmanın ardından üç ay içinde yaptırılmalıdır.
