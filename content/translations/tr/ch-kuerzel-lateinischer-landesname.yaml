    question_de: Wofür steht das Länderkürzel «CH» der Schweiz?
    options_de:
      a: Für den französischen Namen Confédération Helvétique
      b: Für den Ausdruck «Cantons Helvétiques»
      c: Für den lateinischen Namen Civitas Helvetica
      d: Für Confoederatio Helvetica, den lateinischen Landesnamen
    explanation_de: CH ist die Abkürzung für Confoederatio Helvetica, den lateinischen Namen der Schweiz.
      Latein wird verwendet, weil es keine der vier Landessprachen gegenüber den anderen bevorzugt. Diese
      Abkürzung findet sich zum Beispiel auf Fahrzeugkennzeichen und in Internetadressen.
