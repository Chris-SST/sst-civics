id: ch-kuerzel-lateinischer-landesname
lang: tr
source_version: 1
question: İsviçre'nin ülke kısaltması olan «CH» neyi ifade eder?
options:
  a: Fransızca Confédération Helvétique adını
  b: «Cantons Helvétiques» ifadesini
  c: Latince Civitas Helvetica adını
  d: Latince ülke adı olan Confoederatio Helvetica'yı
explanation: CH, İsviçre'nin Latince adı olan Confoederatio Helvetica'nın kısaltmasıdır. Latince kullanılır,
  çünkü dört ulusal dilden hiçbirini diğerlerine tercih etmez. Bu kısaltma örneğin araç plakalarında ve
  internet adreslerinde yer alır.
