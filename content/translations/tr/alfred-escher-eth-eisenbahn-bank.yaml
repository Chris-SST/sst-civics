    question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
    options_de:
      a: Er befehligte im Sonderbundskrieg die Schweizer Truppen.
      b: Er schrieb allein die erste Bundesverfassung.
      c: Er gründete in Genf das Rote Kreuz.
      d: Er förderte die ETH und den Eisenbahnbau und gründete die Bank, die sich später zur Credit Suisse
        wandelte.
    explanation_de: Alfred Escher setzte sich im 19. Jahrhundert für die Gründung der ETH Zürich und den
      Bau der Eisenbahnen ein, insbesondere der Gotthardbahn. 1856 gründete er die Schweizerische Kreditanstalt,
      die später den Namen Credit Suisse annahm. Diese Bank wurde 2023 von der UBS übernommen.
