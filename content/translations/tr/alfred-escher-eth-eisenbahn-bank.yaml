id: alfred-escher-eth-eisenbahn-bank
lang: tr
source_version: 2
question: Zürihli siyasetçi ve girişimci Alfred Escher neyle tanınır?
options:
  a: Sonderbund Savaşı'nda İsviçre birliklerine komuta etti.
  b: İlk Federal Anayasa'yı tek başına yazdı.
  c: Cenevre'de Kızılhaç'ı kurdu.
  d: ETH'yi ve demiryolu yapımını destekledi ve sonradan Credit Suisse'e dönüşen bankayı kurdu.
explanation: Alfred Escher, 19. yüzyılda ETH Zürih'in kurulması ve özellikle Gotthard demiryolu olmak
  üzere demiryollarının yapımı için çaba gösterdi. 1856'da, daha sonra Credit Suisse adını alacak olan
  İsviçre Kredi Kurumu'nu (Schweizerische Kreditanstalt) kurdu. Bu banka 2023'te UBS tarafından devralındı.
