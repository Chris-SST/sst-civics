id: schulen-finanzierung-steuergelder
lang: tr
source_version: 1
question: İsviçre'de devlet okulları esas olarak neyle finanse edilir?
options:
  a: Velilerin her ay ödediği okul harçlarıyla
  b: kanton ve belediyelerin (Gemeinden) vergi gelirleriyle
  c: Posta ve SBB'nin gelirleriyle
  d: sağlık sigortası şirketlerinin (Krankenkassen) katkılarıyla
explanation: Zorunlu devlet okulu, Federal Anayasa'ya (Bundesverfassung) göre ücretsizdir. Okul, özellikle
  kantonlar ve belediyeler tarafından olmak üzere vergi gelirleriyle finanse edilir.
