    question_de: Womit werden öffentliche Schulen in der Schweiz hauptsächlich finanziert?
    options_de:
      a: Mit den Schulgebühren, die die Eltern jeden Monat bezahlen
      b: Mit den Steuereinnahmen der Kantone und Gemeinden
      c: Mit den Einnahmen der Post und der SBB
      d: Mit den Beiträgen der Krankenkassen
    explanation_de: Die obligatorische öffentliche Schule ist gemäss der Bundesverfassung unentgeltlich.
      Die Schule wird durch Steuereinnahmen finanziert, insbesondere durch die Kantone und Gemeinden.
