    question_de: Welches durch die Bundesverfassung gewährleistete Grundrecht ermöglicht es einer Person,
      ihre eigene Meinung frei zu äussern und zu verbreiten?
    options_de:
      a: Meinungsäusserungsfreiheit
      b: Stimmrecht
      c: Eigentumsgarantie
      d: Niederlassungsfreiheit
    explanation_de: Die Meinungsäusserungsfreiheit ermöglicht es einer Person, ihre eigene Meinung frei
      zu äussern und zu verbreiten. Diese Freiheit ist in Artikel 16 der Bundesverfassung enthalten. Das
      Stimmrecht hingegen betrifft die Teilnahme an Wahlen und Abstimmungen.
