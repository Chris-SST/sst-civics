id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: tr
source_version: 1
question: Federal Anayasa tarafından güvence altına alınan hangi temel hak, kişinin kendi görüşünü özgürce
  ifade etmesine ve yaymasına olanak tanır?
options:
  a: Düşünceyi ifade özgürlüğü
  b: Oy hakkı
  c: Mülkiyet güvencesi
  d: Yerleşme özgürlüğü
explanation: Düşünceyi ifade özgürlüğü, kişinin kendi düşüncesini özgürce ifade etmesine ve yaymasına
  olanak tanır. Bu özgürlük, Federal Anayasa'nın 16. maddesinde yer almaktadır. Oy hakkı ise buna karşılık
  seçimlere ve oylamalara katılımla ilgilidir.
