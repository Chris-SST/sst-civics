id: auslaenderanteil-wohnbevoelkerung-2020
lang: tr
source_version: 2
question: 2020 yılında yabancıların İsviçre'nin daimi yerleşik nüfusu içindeki oranı yaklaşık olarak ne
  kadardı?
options:
  a: yaklaşık beşte üç
  b: yaklaşık onda bir
  c: yaklaşık yarısı
  d: yaklaşık dörtte bir
explanation: 2020 yılında daimi yerleşik nüfusun yaklaşık dörtte biri İsviçre pasaportuna sahip değildi.
  2020 sonunda 8,7 milyon kişiden yaklaşık 2,2 milyonu yabancıydı, yani yaklaşık yüzde 25. Avrupa'daki
  diğer ülkelerle karşılaştırıldığında bu oran yüksektir.
