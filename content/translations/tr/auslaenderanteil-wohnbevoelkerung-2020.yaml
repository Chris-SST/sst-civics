    question_de: Wie hoch war im Jahr 2020 ungefähr der Anteil der Ausländer an der ständigen Wohnbevölkerung
      der Schweiz?
    options_de:
      a: ungefähr drei Fünftel
      b: ungefähr ein Zehntel
      c: ungefähr die Hälfte
      d: ungefähr ein Viertel
    explanation_de: Im Jahr 2020 besass ungefähr ein Viertel der ständigen Wohnbevölkerung keinen Schweizer
      Pass. Ende 2020 waren von 8,7 Millionen Personen ungefähr 2,2 Millionen Ausländer, also ungefähr
      25 Prozent. Im Vergleich zu anderen Ländern in Europa ist dieser Anteil hoch.
