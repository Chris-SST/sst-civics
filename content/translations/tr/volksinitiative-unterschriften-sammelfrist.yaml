id: volksinitiative-unterschriften-sammelfrist
lang: tr
source_version: 1
question: Federal düzeydeki bir halk girişimi (Volksinitiative) için kaç imza gerekir ve bu imzaları toplamak
  için ne kadar süre tanınır?
options:
  a: 100 gün içinde 100.000 imza
  b: 100 gün içinde 50.000 imza
  c: 18 ay içinde 50.000 imza
  d: 18 ay içinde 100.000 imza
explanation: Federal düzeydeki bir halk girişimi için 18 ay içinde 100.000 geçerli imza gerekir. İhtiyari
  referandum için ise buna karşılık 100 gün içinde 50.000 imza gerekir.
