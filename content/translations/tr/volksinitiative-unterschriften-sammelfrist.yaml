    source_version: 1
    question_de: Wie viele Unterschriften sind für eine Volksinitiative auf Bundesebene erforderlich und
      wie viel Zeit wird zum Sammeln dieser Unterschriften gewährt?
    options_de:
      a: 100.000 Unterschriften innerhalb von 100 Tagen
      b: 50.000 Unterschriften innerhalb von 100 Tagen
      c: 50.000 Unterschriften innerhalb von 18 Monaten
      d: 100.000 Unterschriften innerhalb von 18 Monaten
    explanation_de: Für eine Volksinitiative auf Bundesebene sind 100.000 gültige Unterschriften innerhalb
      von 18 Monaten erforderlich. Für das fakultative Referendum hingegen sind 50.000 Unterschriften
      innerhalb von 100 Tagen erforderlich.
