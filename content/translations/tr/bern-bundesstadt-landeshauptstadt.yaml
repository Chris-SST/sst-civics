    question_de: Welche Stadt übernimmt in der Schweiz die Rolle der Hauptstadt?
    options_de:
      a: Bern
      b: Genf
      c: Lausanne
      d: Zürich
    explanation_de: Bern ist der Sitz des Bundesrates und der Bundesversammlung und wird als «Bundesstadt»
      (Stadt der Eidgenossenschaft) bezeichnet. Die Bundesverfassung nennt keine Stadt als Hauptstadt,
      aber Bern übernimmt diese Rolle. Zürich ist die grösste Stadt, Lausanne hingegen ist der Sitz des
      Bundesgerichts.
