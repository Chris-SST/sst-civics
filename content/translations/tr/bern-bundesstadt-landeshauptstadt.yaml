id: bern-bundesstadt-landeshauptstadt
lang: tr
source_version: 1
question: İsviçre'de başkent rolünü hangi şehir üstlenmektedir?
options:
  a: Bern
  b: Cenevre
  c: Lozan
  d: Zürih
explanation: Bern, Federal Konsey (Bundesrat) ile Federal Meclis (Bundesversammlung) merkezidir ve «Bundesstadt»
  (Konfederasyon şehri) olarak adlandırılır. Federal Anayasa hiçbir şehri başkent olarak belirtmez, ancak
  Bern bu rolü üstlenir. Zürih en büyük şehirdir, Lozan ise Federal Mahkeme (Bundesgericht) merkezidir.
