    question_de: Wen betrifft in der Schweiz die Militärdienstpflicht oder die Ersatzdienstpflicht?
    options_de:
      a: Alle Einwohner ab 18 Jahren
      b: Männer mit Schweizer Bürgerrecht
      c: Alle Männer, die in der Schweiz leben
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Gemäss der Bundesverfassung ist jeder Schweizer Mann verpflichtet, Militärdienst zu
      leisten. Wer dies nicht mit seinem Gewissen vereinbaren kann, leistet zivilen Ersatzdienst. Ausländer
      sind nicht dienstpflichtig.
