id: militaerdienstpflicht-schweizer-maenner
lang: tr
source_version: 1
question: İsviçre'de askerlik hizmeti veya yedek hizmet yükümlülüğü kimleri kapsar?
options:
  a: 18 yaşından itibaren tüm sakinler
  b: İsviçre vatandaşlığına (Bürgerrecht) sahip erkekler
  c: İsviçre'de yaşayan tüm erkekler
  d: Yalnızca İsviçre vatandaşlığına sahip kadınlar
explanation: Federal Anayasa'ya (Bundesverfassung) göre her İsviçreli erkek askerlik hizmeti yapmakla
  yükümlüdür. Bunu vicdanıyla bağdaştıramayan kişi, sivil yedek hizmet yapar. Yabancılar hizmet yükümlüsü
  değildir.
