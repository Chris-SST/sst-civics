id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
lang: tr
source_version: 1
question: Vergi mükelleflerinin her yıl doldurduğu vergi beyannamesi ne işe yarar?
options:
  a: Nüfus ve ikamet dairesine (Einwohneramt) kayıt için kullanılır.
  b: Sağlık sigortası başvurusudur.
  c: Sivil hizmet (Zivildienst) için yapılan kayıttır.
  d: Vergi makamlarına karşı mali durumu açıklar.
explanation: Vergi mükellefleri vergi beyannamesi ile gelirlerini, servetlerini ve indirimlerini bildirir.
  Vergi makamı vergiyi bu esasa göre hesaplar.
