    question_de: Eine Schweizer Bürgerin lebt dauerhaft im Ausland. Wie kann sie an eidgenössischen Wahlen
      und Abstimmungen teilnehmen?
    options_de:
      a: Sie kann nur abstimmen, wenn sie ausschliesslich zum Abstimmen in die Schweiz reist.
      b: Sie kann nur an den Wahlen teilnehmen, aber nicht an den Abstimmungen.
      c: Sie kann, ohne in die Schweiz zu reisen, von ihrem Wohnort im Ausland aus an den Wahlen und Abstimmungen
        abstimmen.
      d: Sie verliert das Stimmrecht und das Wahlrecht auf Ebene der Eidgenossenschaft.
    explanation_de: Im Ausland lebende Schweizer Bürger können, ohne in die Schweiz reisen zu müssen,
      auf Ebene der Eidgenossenschaft an Wahlen und Abstimmungen teilnehmen. Dafür müssen sie bei der
      zuständigen Schweizer Vertretung im Ausland registriert sein und sich über diese Vertretung für
      die Eintragung ins Stimmregister anmelden. Die Wahl- und Abstimmungsunterlagen werden ihnen danach
      von den Stimmgemeinden zugesandt.
