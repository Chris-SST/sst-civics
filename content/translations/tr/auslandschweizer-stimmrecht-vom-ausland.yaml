id: auslandschweizer-stimmrecht-vom-ausland
lang: tr
source_version: 2
question: Bir İsviçreli kadın vatandaş sürekli olarak yurt dışında yaşamaktadır. Federal seçimlere ve
  oylamalara nasıl katılabilir?
options:
  a: Yalnızca oy kullanmak için İsviçre'ye seyahat ederse oy kullanabilir.
  b: Yalnızca seçimlere katılabilir, ancak oylamalara katılamaz.
  c: İsviçre'ye seyahat etmeden, yurt dışındaki ikamet yerinden seçimlerde ve oylamalarda oy kullanabilir.
  d: Konfederasyon düzeyindeki oy hakkını ve seçme hakkını kaybeder.
explanation: Yurt dışında yaşayan İsviçreli vatandaşlar, İsviçre'ye seyahat etmek zorunda kalmadan Konfederasyon
  düzeyinde seçimlerde ve oylamalarda oy kullanabilir. Bunun için yurt dışındaki yetkili İsviçre temsilciliğine
  kayıtlı olmaları ve bu temsilcilik aracılığıyla oy kütüğüne kaydedilmek için başvurmaları gerekir. Seçim
  ve oylama belgelerini daha sonra oy kullanma belediyeleri onlara gönderir.
