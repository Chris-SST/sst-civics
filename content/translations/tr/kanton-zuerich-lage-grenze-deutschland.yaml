question: Zürich kantonu İsviçre'nin neresinde yer alır ve hangi komşu ülkeyle sınır komşusudur?
options:
  a: İsviçre'nin batısında, Fransa ile sınır komşusudur
  b: İsviçre'nin kuzeyinde, Almanya ile sınır komşusudur
  c: İsviçre'nin doğusunda, Avusturya ile sınır komşusudur
  d: İsviçre'nin güneyinde, İtalya ile sınır komşusudur
explanation: Zürich kantonu İsviçre'nin kuzeyinde yer alır. Kuzeyde sınırının bir kısmı aynı zamanda Almanya
  ile olan ülke sınırını oluşturur.
