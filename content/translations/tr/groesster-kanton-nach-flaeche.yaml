id: groesster-kanton-nach-flaeche
lang: tr
source_version: 1
question: İsviçre kantonları arasında hangi kantonun yüzölçümü en büyüktür?
options:
  a: Ticino
  b: Valais
  c: Bern
  d: Graubünden
explanation: Graubünden, yüzölçümü bakımından İsviçre'nin en büyük kantonudur. Tamamen Alpler'de yer alır
  ve çok sayıda vadi ile dağa sahiptir. Valais, Bern ve Ticino da büyüktür, ancak Graubünden'den daha
  küçüktür.
