    question_de: Wer entscheidet im Kanton Zürich, in welche Primarschulklasse ein Kind eingeteilt wird?
    options_de:
      a: Die Schulpflege oder die Schulleitung
      b: Das Bildungsdepartement der Eidgenossenschaft
      c: Die Gemeindeversammlung
      d: Die Eltern des Kindes
    explanation_de: Die Schulpflege oder die Schulleitung teilt die Kinder den Klassen zu. Die Eltern
      können die Klasse nicht frei wählen. Auf diese Weise regelt die Schule ihren Betrieb und die Klassengrössen.
