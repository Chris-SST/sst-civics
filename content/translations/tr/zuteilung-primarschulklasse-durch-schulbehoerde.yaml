id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: tr
source_version: 3
question: Zürich kantonunda bir çocuğun hangi ilkokul sınıfına yerleştirileceğine kim karar verir?
options:
  a: Okul kurulu (Schulpflege) veya okul yönetimi
  b: Konfederasyonun eğitim departmanı
  c: Belediye halk toplantısı (Gemeindeversammlung)
  d: Çocuğun ebeveynleri
explanation: Okul kurulu veya okul yönetimi çocukları sınıflara yerleştirir. Ebeveynler sınıfı serbestçe
  seçemez. Okul bu şekilde işleyişini ve sınıf büyüklüklerini düzenler.
