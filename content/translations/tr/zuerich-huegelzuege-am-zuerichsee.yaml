id: zuerich-huegelzuege-am-zuerichsee
lang: tr
source_version: 2
question: Zürich Gölü'nün kıyısında hangi tepe sıraları bulunur?
options:
  a: Uetliberg, Albis ve Pfannenstiel
  b: Lägern, Irchel ve Kohlfirst
  c: Hörnli, Bachtel ve Allmann
  d: Heitersberg, Gubrist ve Randen
explanation: Uetliberg ve Albis, Zürich Gölü'nün sol kıyısı boyunca uzanır; Pfannenstiel ise sağ kıyıda
  yer alır. Diğer yükseltiler gölden daha uzaktadır; örneğin Unterland'da, Weinland'da, Zürcher Oberland'da
  veya başka kantonlarda bulunur.
