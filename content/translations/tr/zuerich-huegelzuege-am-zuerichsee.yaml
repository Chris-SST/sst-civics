    question_de: Welche Hügelzüge befinden sich am Ufer des Zürichsees?
    options_de:
      a: Uetliberg, Albis und Pfannenstiel
      b: Lägern, Irchel und Kohlfirst
      c: Hörnli, Bachtel und Allmann
      d: Heitersberg, Gubrist und Randen
    explanation_de: Uetliberg und Albis erstrecken sich entlang des linken Ufers des Zürichsees; der Pfannenstiel
