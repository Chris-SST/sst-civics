id: rechtsgleichheit-gesetz-fuer-alle
lang: tr
source_version: 1
question: Hukuki eşitlik ilkesi ne anlama gelir?
options:
  a: Tüm kantonlar aynı yasalara sahiptir.
  b: Tüm kişiler aynı siyasi görevlere sahiptir.
  c: Tüm kişiler aynı gelire sahiptir.
  d: Yasa tüm kişiler için eşit şekilde geçerlidir.
explanation: Hukuki eşitlik, Federal Anayasa'nın (Bundesverfassung) 8. maddesinde yer alır. Tüm insanlar
  yasa önünde eşittir ve hiç kimse örneğin kökeni veya cinsiyeti nedeniyle ayrımcılığa uğratılamaz. Bu,
  herkesin aynı miktarda mal varlığına sahip olduğu anlamına gelmez.
