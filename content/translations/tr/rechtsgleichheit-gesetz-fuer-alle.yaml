    model: claude-sonnet-5-5
    at: 2026-11-02
    source_version: 1
    question_de: Was bedeutet der Grundsatz der Rechtsgleichheit?
    options_de:
      a: Alle Kantone haben dieselben Gesetze.
      b: Alle Personen haben dieselben politischen Aufgaben.
      c: Alle Personen haben dasselbe Einkommen.
      d: Das Gesetz gilt für alle Personen gleichermassen.
    explanation_de: Die Rechtsgleichheit ist in Artikel 8 der Bundesverfassung verankert. Alle Menschen
      sind vor dem Gesetz gleich, und niemand darf zum Beispiel wegen der Herkunft oder des Geschlechts
      diskriminiert werden. Das bedeutet nicht, dass alle gleich viel Vermögen haben.
