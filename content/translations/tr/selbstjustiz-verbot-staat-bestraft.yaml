    question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz verletzt?
    options_de:
      a: Über die Strafe entscheiden die Bewohner des Quartiers gemeinsam.
      b: Der Staat untersucht die Tat und bestraft den Täter; Selbstjustiz ist verboten.
      c: Das Opfer kann die Strafe selbst bestimmen und vollziehen.
      d: Die Familie des Opfers kann den Täter selbst bestrafen.
    explanation_de: In der Schweiz liegt das Recht, Straftaten zu untersuchen und zu bestrafen, allein
      beim Staat. Dafür sind die Polizei, die Staatsanwaltschaft und die Gerichte zuständig. Wer auf eigene
      Faust Rache nimmt, auch wenn er das Opfer oder die Familie des Opfers ist, kann sich deshalb selbst
      strafbar gemacht haben.
