id: selbstjustiz-verbot-staat-bestraft
lang: tr
source_version: 2
question: İsviçre'de biri bir yasayı çiğnediğinde ne geçerlidir?
options:
  a: Cezaya mahalle sakinleri birlikte karar verir.
  b: Devlet fiili soruşturur ve cezalandırır; kendi hakkını kendi eliyle almak yasaktır.
  c: Mağdur, cezayı kendisi belirleyebilir ve uygulayabilir.
  d: Mağdurun ailesi, faili kendisi cezalandırabilir.
explanation: İsviçre'de suçları soruşturma ve cezalandırma hakkı yalnızca devlete aittir. Bunun için polis,
  savcılık ve mahkemeler yetkilidir. Kendi başına intikam alan kişi, mağdur veya mağdurun ailesi olsa
  bile, bu nedenle kendisi de suç işlemiş olabilir.
