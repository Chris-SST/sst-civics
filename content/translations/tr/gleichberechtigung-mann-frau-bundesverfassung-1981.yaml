id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: tr
source_version: 1
question: Kadın ve erkek eşitliği İsviçre Federal Anayasası'nda ne zamandan beri yer almaktadır?
options:
  a: 1999'dan beri
  b: 1971'den beri
  c: 1981'den beri
  d: 1848'den beri
explanation: Eşitlik maddesi 1981'de Federal Anayasa'ya eklendi. Bu madde, devleti aile, eğitim ve çalışma
  hayatında eşitliği güvence altına almakla yükümlü kılar. Kadınların oy hakkı ise 1971'den beri mevcuttu.
