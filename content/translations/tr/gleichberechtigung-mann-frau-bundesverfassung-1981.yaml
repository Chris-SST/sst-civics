    question_de: Seit wann ist die Gleichstellung von Frau und Mann in der Schweizerischen Bundesverfassung
      verankert?
    options_de:
      a: Seit 1999
      b: Seit 1971
      c: Seit 1981
      d: Seit 1848
    explanation_de: Der Gleichstellungsartikel wurde 1981 in die Bundesverfassung aufgenommen. Dieser
      Artikel verpflichtet den Staat, die Gleichstellung in Familie, Ausbildung und Arbeitsleben zu gewährleisten.
      Das Stimmrecht der Frauen bestand hingegen bereits seit 1971.
