id: zivildienst-anstelle-militaerdienst
lang: tr
source_version: 3
question: İsviçre'de sivil hizmet (Zivildienst) ile askerlik hizmeti birbiriyle nasıl bağlantılıdır?
options:
  a: Sivil hizmeti yalnızca kadınlar yapabilir.
  b: Sivil hizmet yapan kişi vergi ödemek zorunda değildir.
  c: Sivil hizmet, askerlik hizmetine ek olarak yapılmak zorundadır.
  d: Sivil hizmet, askerlik hizmeti yerine yapılabilir.
explanation: Sivil hizmet, askerlik hizmetinin sivil bir alternatifidir. Askerlik hizmetine elverişli
  olup da askerlik hizmetini vicdanıyla bağdaştıramayan kişiler için öngörülmüştür. Bunun için bir başvuru
  yapılması gerekir ve sivil hizmet, askerlik hizmetinden daha uzun sürer.
