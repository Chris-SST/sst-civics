    question_de: Wie hängen der Zivildienst und der Militärdienst in der Schweiz miteinander zusammen?
    options_de:
      a: Den Zivildienst können nur Frauen leisten.
      b: Wer Zivildienst leistet, muss keine Steuern zahlen.
      c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
      d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
    explanation_de: Der Zivildienst ist eine zivile Alternative zum Militärdienst. Er ist für Personen
      vorgesehen, die tauglich für den Militärdienst sind, den Militärdienst aber nicht mit ihrem Gewissen
      vereinbaren können. Dafür muss ein Gesuch gestellt werden, und der Zivildienst dauert länger als
      der Militärdienst.
