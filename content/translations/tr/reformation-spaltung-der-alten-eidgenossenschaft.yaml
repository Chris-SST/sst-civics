    question_de: Was war das Ergebnis der Reformbewegung (Reformation) für die Schweiz?
    options_de:
      a: 'Die Schweiz wurde in religiöser Hinsicht in zwei Lager gespalten: reformiert (protestantisch)
        und katholisch.'
      b: Die Schweiz wurde ein Teil des Deutschen Reiches.
      c: Die Kirche verlor überall ihren gesamten Einfluss auf die Politik.
      d: Alle Orte der Eidgenossenschaft (Schweizerische Konföderation) wurden reformiert.
    explanation_de: Einige Orte nahmen die Reformation an, andere blieben katholisch. So entstand ein
      religiöser Gegensatz, der die Eidgenossenschaft lange herausforderte. Zwischen den Konfessionen
      kam es auch zu Konflikten.
