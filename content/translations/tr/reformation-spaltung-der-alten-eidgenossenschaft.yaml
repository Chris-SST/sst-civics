id: reformation-spaltung-der-alten-eidgenossenschaft
lang: tr
source_version: 1
question: Reform hareketinin (Reformasyon) İsviçre için sonucu ne oldu?
options:
  a: İsviçre dinî bakımdan Reform kiliseli (Protestan) ve Katolik olmak üzere iki kesime bölündü.
  b: İsviçre, Alman İmparatorluğu'nun bir parçası oldu.
  c: Kilise her yerde siyaset üzerindeki bütün etkisini kaybetti.
  d: Eidgenossenschaft'ın (İsviçre Konfederasyonu) bütün yerleri Reform kiliseli oldu.
explanation: Bazı yerler Reformasyon'u kabul etti, diğerleri Katolik kaldı. Böylece Konfederasyon'u uzun
  süre zorlayan dinî bir karşıtlık ortaya çıktı. Mezhepler arasında çatışmalar da yaşandı.
