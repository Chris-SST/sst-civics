    question_de: Was wird beim Jodeln als Instrument verwendet?
    options_de:
      a: Alphorn
      b: Die eigene Stimme der Person
      c: Schwyzerörgeli
      d: Handorgel
    explanation_de: Beim Jodeln wird ohne Wörter gesungen, meistens nur mit Silben, und es wird schnell
      zwischen Bruststimme und Kopfstimme gewechselt. Das Instrument ist die Stimme selbst. Das Jodeln
      ist ein Element der Traditionen der Schweiz und wird oft zusammen mit dem Alphorn oder dem Schwyzerörgeli
      erwähnt.
