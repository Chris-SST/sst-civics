id: jodeln-eigene-stimme-instrument
lang: tr
source_version: 1
question: Yodel söylerken enstrüman olarak ne kullanılır?
options:
  a: Alphorn (alp borusu)
  b: Kişinin kendi sesi
  c: Schwyzerörgeli (İsviçre tipi küçük akordeon)
  d: Handorgel (el org akordeonu)
explanation: Yodel söylerken sözcükler olmadan, çoğunlukla yalnızca hecelerle şarkı söylenir ve göğüs
  sesi ile baş sesi arasında hızlıca geçiş yapılır. Enstrüman, sesin kendisidir. Yodel, İsviçre'nin geleneklerine
  ait bir unsurdur ve çoğu zaman Alphorn veya Schwyzerörgeli ile birlikte anılır.
