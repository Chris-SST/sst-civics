id: sbb-abkuerzung-bedeutung-bundesbahnen
lang: tr
source_version: 1
question: İsviçre'de trenlerde ve tren istasyonlarında görülen «SBB» kısaltması neyi ifade eder?
options:
  a: İsviçre Otobüs İşletmeleri
  b: İsviçre Federal Demiryolları
  c: İsviçre Demiryolu ve Otobüs İşletmeleri
  d: İsviçre Dağ Demiryolları
explanation: SBB, İsviçre Federal Demiryolları (Schweizerische Bundesbahnen) anlamına gelir. Şirket, İsviçre
  demiryolu ağının büyük bir bölümünü işletir ve Konfederasyon'a aittir. Bunun yanında BLS veya Rhätische
  Bahn gibi başka demiryolu şirketleri de vardır.
