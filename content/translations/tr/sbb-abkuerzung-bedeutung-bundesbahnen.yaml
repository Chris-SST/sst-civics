    question_de: Was bedeutet die Abkürzung «SBB», die man in der Schweiz auf Zügen und in Bahnhöfen sieht?
    options_de:
      a: Schweizerische Busbetriebe
      b: Schweizerische Bundesbahnen
      c: Schweizerische Bahn- und Busbetriebe
      d: Schweizerische Bergbahnen
    explanation_de: SBB steht für Schweizerische Bundesbahnen (Schweizerische Bundesbahnen). Das Unternehmen
      betreibt einen grossen Teil des Schweizer Eisenbahnnetzes und gehört der Eidgenossenschaft. Daneben
      gibt es weitere Bahnunternehmen wie die BLS oder die Rhätische Bahn.
