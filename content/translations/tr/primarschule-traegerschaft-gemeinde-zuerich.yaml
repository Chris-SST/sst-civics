    question_de: Wer betreibt im Kanton Zürich die Schulen auf der Primarstufe?
    options_de:
      a: Die Bildungsdirektion des Kantons
      b: Der Bund
      c: Die Gemeinden
      d: Die Bezirke
    explanation_de: Im Kanton Zürich werden die Primarschulen von den Gemeinden betrieben. Dies sind je
      nach Ort politische Gemeinden oder separate Schulgemeinden, und die gewählte Schulpflege ist die
      lokale Schulbehörde. Der Kanton legt nur den Rahmen fest, wie zum Beispiel den Lehrplan, und beaufsichtigt
      die staatlichen Schulen (Volksschule).
