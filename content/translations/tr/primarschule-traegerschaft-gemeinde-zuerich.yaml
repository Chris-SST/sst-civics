id: primarschule-traegerschaft-gemeinde-zuerich
lang: tr
source_version: 2
question: Zürich kantonunda ilkokul kademesindeki okulları kim işletir?
options:
  a: Kantonun Eğitim Müdürlüğü (Bildungsdirektion)
  b: Konfederasyon
  c: Belediyeler (Gemeinden)
  d: İlçeler
explanation: Zürich kantonunda ilkokulları belediyeler işletir. Bunlar, yerine göre siyasi belediyeler
  ya da ayrı okul belediyeleridir ve seçilmiş okul kurulu (Schulpflege) yerel okul makamıdır. Kanton yalnızca
  müfredat gibi çerçeveyi belirler ve devlet okullarını (Volksschule) denetler.
