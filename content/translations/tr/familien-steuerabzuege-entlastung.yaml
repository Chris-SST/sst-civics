    question_de: Wie werden Familien bei den Steuern entlastet?
    options_de:
      a: Familien zahlen keine Steuern.
      b: Familien können bei den Steuern einen Abzug geltend machen.
      c: Familien müssen keine Steuererklärung ausfüllen.
      d: Familien zahlen nur die Mehrwertsteuer.
    explanation_de: Familien können zum Beispiel für Kinder oder für die Kinderbetreuung einen Abzug geltend
      machen. Dadurch verringert sich das steuerpflichtige Einkommen und somit sinkt auch die Steuer.
