id: familien-steuerabzuege-entlastung
lang: tr
source_version: 1
question: Aileler vergilerde nasıl rahatlatılır?
options:
  a: Aileler vergi ödemez.
  b: Aileler vergilerde indirim talep edebilir.
  c: Aileler vergi beyannamesi doldurmak zorunda değildir.
  d: Aileler yalnızca katma değer vergisini öder.
explanation: Aileler, örneğin çocuklar için veya çocuk bakımı için indirim talep edebilir. Bu sayede vergiye
  tabi gelir azalır ve böylece vergi de düşer.
