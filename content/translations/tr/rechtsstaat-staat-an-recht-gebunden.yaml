id: rechtsstaat-staat-an-recht-gebunden
lang: tr
source_version: 2
question: İsviçre gibi bir hukuk devletinde makamlar ve hükümet için ne geçerlidir?
options:
  a: Hangi yasalara uyacaklarını kendileri seçebilirler.
  b: Onlar da yürürlükteki hukuka uymak zorundadır.
  c: Yürürlükteki hukukun üzerinde yer alırlar.
  d: Yalnızca medyanın kararlarına göre hareket etmek zorundadırlar.
explanation: Bir hukuk devletinde yalnızca halkın değil, devletin kendisinin de hukuka uyması gerekir.
  Makamlar ve hükümet yalnızca hukukun izin verdiği şekilde hareket edebilir. Hukuk devleti, insanları
  böylece keyfîlikten korur.
