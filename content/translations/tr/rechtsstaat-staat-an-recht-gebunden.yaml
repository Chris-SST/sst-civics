    question_de: Was gilt in einem Rechtsstaat wie der Schweiz für die Behörden und die Regierung?
    options_de:
      a: Sie können selbst wählen, welche Gesetze sie befolgen.
      b: Auch sie müssen das geltende Recht befolgen.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen nur nach den Entscheidungen der Medien handeln.
    explanation_de: In einem Rechtsstaat muss nicht nur das Volk, sondern auch der Staat selbst das Recht
      befolgen. Die Behörden und die Regierung können nur so handeln, wie es das Recht erlaubt. Der Rechtsstaat
      schützt die Menschen so vor Willkür.
