    question_de: Wer verkündet in einem Gerichtsverfahren das Urteil?
    options_de:
      a: Die Richterin oder der Richter
      b: Die Polizistin oder der Polizist
      c: Die Gemeindepräsidentin oder der Gemeindepräsident
      d: Die Staatsanwältin oder der Staatsanwalt
    explanation_de: Richterinnen und Richter entscheiden in Gerichtsverfahren unabhängig und fällen das
      Urteil. Die Staatsanwaltschaft führt die Untersuchung und erhebt Anklage. Die Polizei führt Ermittlungen
      durch, fällt aber kein Urteil.
