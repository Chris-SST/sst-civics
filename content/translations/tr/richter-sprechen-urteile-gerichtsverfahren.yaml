id: richter-sprechen-urteile-gerichtsverfahren
lang: tr
source_version: 1
question: Bir yargılama sürecinde hükmü kim açıklar?
options:
  a: Kadın veya erkek hâkim
  b: Kadın veya erkek polis memuru
  c: Belediye (Gemeinde) başkanı (kadın veya erkek)
  d: Kadın veya erkek savcı
explanation: Hâkimler yargılama süreçlerinde bağımsız olarak karar verir ve hükmü verir. Savcılık soruşturmayı
  yürütür ve iddianame düzenler. Polis araştırma yapar, ancak hüküm vermez.
