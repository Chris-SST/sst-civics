    question_de: Welche Aussage zur Alters- und Hinterlassenenversicherung (AHV) ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung gehört zu den obligatorischen Versicherungen.
      b: Die Alters- und Hinterlassenenversicherung ist eine freiwillige Versicherung für Selbstständigerwerbende.
      c: Die Alters- und Hinterlassenenversicherung gilt nur für Personen mit einem Schweizer Pass.
      d: Die Alters- und Hinterlassenenversicherung ist eine private Versicherung der Arbeitgeber.
    explanation_de: Die Alters- und Hinterlassenenversicherung ist obligatorisch. Alle Personen, die in
      der Schweiz wohnen oder arbeiten, sind grundsätzlich versichert und müssen Beiträge bezahlen.
