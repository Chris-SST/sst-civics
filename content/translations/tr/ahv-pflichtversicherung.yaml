id: ahv-pflichtversicherung
lang: tr
source_version: 1
question: Yaşlılık ve dul-yetim sigortası (AHV) ile ilgili hangi ifade doğrudur?
options:
  a: Yaşlılık ve dul-yetim sigortası zorunlu sigortalar arasında yer alır.
  b: Yaşlılık ve dul-yetim sigortası, serbest çalışanlar için isteğe bağlı bir sigortadır.
  c: Yaşlılık ve dul-yetim sigortası yalnızca İsviçre pasaportuna sahip kişiler için geçerlidir.
  d: Yaşlılık ve dul-yetim sigortası, işverenlerin özel bir sigortasıdır.
explanation: Yaşlılık ve dul-yetim sigortası zorunludur. İsviçre'de ikamet eden veya çalışan herkes esas
  olarak sigortalıdır ve prim ödemek zorundadır.
