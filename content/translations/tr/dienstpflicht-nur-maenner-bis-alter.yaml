id: dienstpflicht-nur-maenner-bis-alter
lang: tr
source_version: 1
question: İsviçre'de belirli bir yaşa kadar askerlik hizmeti veya yedek hizmet (alternatif hizmet) yapmakla
  yükümlü olan kimdir?
options:
  a: Yalnızca erkekler
  b: Kadınlar ve erkekler eşit ölçüde
  c: Yalnızca eğitim görmüş kişiler
  d: Yalnızca bir belediyede (Gemeinde) görevi olan kişiler
explanation: İsviçre'de hizmet yükümlülüğü yalnızca erkekler için geçerlidir. Kadınlar için askerlik hizmeti
  gönüllüdür. Yükümlülük, yasayla belirlenmiş bir yaşa kadar sürer.
