    source_version: 1
    question_de: Wer ist in der Schweiz bis zu einem bestimmten Alter verpflichtet, Militärdienst oder
      Ersatzdienst (Alternativdienst) zu leisten?
    options_de:
      a: Nur Männer
      b: Frauen und Männer im gleichen Mass
      c: Nur Personen, die eine Ausbildung genossen haben
      d: Nur Personen, die in einer Gemeinde ein Amt haben
    explanation_de: In der Schweiz gilt die Dienstpflicht nur für Männer. Für Frauen ist der Militärdienst
      freiwillig. Die Verpflichtung dauert bis zu einem gesetzlich festgelegten Alter.
