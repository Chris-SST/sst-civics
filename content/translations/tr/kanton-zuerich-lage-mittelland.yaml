question: Zürich kantonu İsviçre'nin hangi büyük coğrafi bölgesine aittir?
options:
  a: Güney Alpler'e
  b: Jura'ya
  c: Orta Bölge'ye (Mittelland)
  d: Orta Alpler'e
explanation: Zürich kantonu, Kuzeybatıdaki Jura ile güneydeki Alpler arasında yer alan daha düz bölge
  olan Orta Bölge'ye (Mittelland) aittir. Orta Bölge, İsviçre'nin en yoğun nüfuslu kesimidir.
