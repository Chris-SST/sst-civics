    question_de: Wer kann in den Nationalrat, in den Bundesrat oder in das Bundesgericht gewählt werden?
    options_de:
      a: Nur diejenigen, die ihre Hochschulausbildung abgeschlossen haben
      b: Nur diejenigen, die seit mindestens zehn Jahren in der Schweiz leben
      c: Nur diejenigen, die Mitglied einer politischen Partei sind
      d: Alle Schweizer Bürgerinnen und Bürger, die das 18. Lebensjahr vollendet haben und stimmberechtigt
        sind
    explanation_de: Gemäss der Bundesverfassung kann jede Person gewählt werden, die stimmberechtigt ist.
      Schweizer Bürgerinnen und Bürger, die das 18. Lebensjahr vollendet haben, sind stimmberechtigt.
      Eine Parteimitgliedschaft oder eine bestimmte Ausbildung ist nicht erforderlich.
