id: waehlbar-in-bundesamt-voraussetzungen
lang: tr
source_version: 2
question: Ulusal Konsey'e (Nationalrat), Federal Konsey'e (Bundesrat) veya Federal Mahkeme'ye (Bundesgericht)
  kimler seçilebilir?
options:
  a: Yalnızca yükseköğrenimini tamamlamış olanlar
  b: Yalnızca en az on yıldır İsviçre'de yaşayanlar
  c: Yalnızca bir siyasi partinin üyesi olanlar
  d: 18 yaşını doldurmuş, oy hakkına sahip tüm İsviçre vatandaşları
explanation: Federal Anayasa'ya göre oy hakkına sahip olan herkes seçilebilir. 18 yaşını doldurmuş İsviçre
  vatandaşları oy hakkına sahiptir. Partiye üyelik veya belirli bir eğitim gerekmez.
