question: Bir kişi işini kaybettiğinde hangi sosyal sigorta devreye girer?
options:
  a: Malullük sigortası
  b: Yaşlılık ve ölüm (hayatta kalanlar) sigortası
  c: İşsizlik sigortası
  d: Kaza sigortası
explanation: İşsizlik sigortası, belirli koşullar altında bir kişi işini kaybettiğinde tazminat öder.
  Ayrıca yeni bir iş aranmasında da yardımcı olur.
