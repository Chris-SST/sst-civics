    question_de: Welche der folgenden Voraussetzungen gilt für das Stimm- und Wahlrecht (Wahl- und Wählbarkeitsrecht)
      auf Ebene des Bundes?
    options_de:
      a: Das Schweizer Bürgerrecht
      b: Die Mitgliedschaft in einer politischen Partei
      c: Mindestens zehn Jahre in der Schweiz gewohnt zu haben
      d: Die Niederlassungsbewilligung C
    explanation_de: Auf Ebene des Bundes können nur Personen mit Schweizer Bürgerrecht abstimmen und an
      Wahlen teilnehmen. Ausländer haben auf Ebene des Bundes kein Stimm- und Wahlrecht; dieses Recht
      wird auch dann nicht gewährt, wenn eine Niederlassungsbewilligung (C-Bewilligung) vorhanden ist.
      Es ist nicht erforderlich, Mitglied einer Partei zu sein.
