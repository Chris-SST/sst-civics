id: stimmrecht-bund-schweizer-buergerrecht
lang: tr
source_version: 1
question: Konfederasyon düzeyinde oy hakkı ve seçilme/seçme hakkı için aşağıdakilerden hangisi bir şarttır?
options:
  a: İsviçre vatandaşlığı (Bürgerrecht)
  b: Bir siyasi partiye üyelik
  c: İsviçre'de en az on yıl ikamet etmiş olmak
  d: C yerleşim izni (Niederlassungsbewilligung)
explanation: Konfederasyon düzeyinde yalnızca İsviçre vatandaşlığına sahip kişiler oy kullanabilir ve
  seçime katılabilir. Yabancıların Konfederasyon düzeyinde oy ve seçme hakkı yoktur; yerleşim izni (C
  izni) olsa bile bu hak tanınmaz. Bir partiye üye olmak gerekli değildir.
