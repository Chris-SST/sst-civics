    question_de: Welcher Fluss fliesst aus dem Zürichsee, durchquert die Stadt Zürich und fliesst weiter
      auf dem Gebiet des Kantons?
    options_de:
      a: Thur
      b: Birs
      c: Reuss
      d: Limmat
    explanation_de: Die Limmat beginnt am Ausfluss des Zürichsees und durchquert die Stadt Zürich und
      das Limmattal (Limmattal) der Länge nach. Danach verlässt sie das Kantonsgebiet in Richtung Aargau.
      Reuss, Thur und Birs fliessen nicht aus dem Zürichsee.
