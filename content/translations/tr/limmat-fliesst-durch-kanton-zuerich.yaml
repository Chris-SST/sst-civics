id: limmat-fliesst-durch-kanton-zuerich
lang: tr
source_version: 1
question: Hangi nehir Zürich Gölü'nden çıkar, Zürich şehrinin içinden geçer ve kanton topraklarında akmaya
  devam eder?
options:
  a: Thur
  b: Birs
  c: Reuss
  d: Limmat
explanation: Limmat, Zürich Gölü'nün çıkışında başlar ve Zürich şehrini ile Limmat Vadisi'ni (Limmattal)
  boydan boya geçer. Ardından Aargau yönünde kanton topraklarından ayrılır. Reuss, Thur ve Birs Zürich
  Gölü'nden çıkmaz.
