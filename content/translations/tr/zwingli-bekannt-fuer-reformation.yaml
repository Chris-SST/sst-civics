    question_de: Wofür ist Huldrych (Ulrich) Zwingli in Zürich am bekanntesten?
    options_de:
      a: Er baute die erste Eisenbahn im Kanton.
      b: Er wurde der erste Bundespräsident der Schweiz.
      c: Er führte das Stimmrecht für Frauen ein.
      d: Er war der Anführer der Reformationsbewegung in Zürich.
    explanation_de: Huldrych (Ulrich) Zwingli führte im 16. Jahrhundert die Reformationsbewegung in Zürich
      an, und die Zürcher Kirche wurde zur reformierten (protestantischen) Kirche. Die Eisenbahn, der
      Bundesstaat mit einem Bundespräsidenten und das Stimmrecht für Frauen entstanden erst Jahrhunderte
      später.
