id: zwingli-bekannt-fuer-reformation
lang: tr
source_version: 2
question: Huldrych (Ulrich) Zwingli, Zürih tarihinde en çok hangi özelliğiyle tanınır?
options:
  a: Kanton'daki ilk demiryolunu inşa etti.
  b: İsviçre'nin ilk Konfederasyon Başkanı (Bundespräsident) oldu.
  c: Kadınlara oy hakkını getirdi.
  d: Zürih'te Reform hareketinin önderiydi.
explanation: Huldrych (Ulrich) Zwingli, 16. yüzyılda Zürih'te Reform hareketine önderlik etti ve Zürih
  kilisesi reformcu (Protestan) kilise haline geldi. Demiryolu, bir Konfederasyon Başkanı bulunan federal
  devlet ve kadınlara oy hakkı ise ancak yüzyıllar sonra ortaya çıktı.
