question: Zürich kantonunda nüfusa göre en büyük üç şehir hangileridir?
options:
  a: Zürich, Uster ve Wetzikon
  b: Zürich, Dietikon ve Winterthur
  c: Zürich, Winterthur ve Uster
  d: Zürich, Winterthur ve Dübendorf
