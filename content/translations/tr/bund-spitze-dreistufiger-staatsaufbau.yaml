id: bund-spitze-dreistufiger-staatsaufbau
lang: tr
source_version: 2
question: İsviçre üç devlet kademesinden oluşmaktadır. Bunlardan hangisi en üst kademedir?
options:
  a: Belediyeler (Gemeinden)
  b: Konfederasyon
  c: Kantonlar
  d: İlçeler
explanation: Konfederasyon, üç devlet kademesinin en üstte olanıdır. Onun altında kantonlar, ardından
  belediyeler gelir. İlçeler ayrı bir devlet kademesi değildir; yalnızca bazı kantonlarda kanton içindeki
  idari birimlerdir.
