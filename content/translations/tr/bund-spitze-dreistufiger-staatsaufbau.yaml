    question_de: Die Schweiz besteht aus drei Staatsebenen. Welche davon ist die oberste Ebene?
    options_de:
      a: Gemeinden
      b: Konföderation
      c: Kantone
      d: Bezirke
    explanation_de: Die Konföderation ist die oberste der drei Staatsebenen. Unter ihr kommen die Kantone,
      danach die Gemeinden. Die Bezirke sind keine eigene Staatsebene; sie sind nur in einigen Kantonen
      Verwaltungseinheiten innerhalb des Kantons.
