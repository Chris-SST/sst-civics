question: İki dilli Fribourg kantonunda hangi diller konuşulur?
options:
  a: Fransızca ve Romanşça
  b: Fransızca ve İtalyanca
  c: Fransızca ve Almanca
  d: Almanca ve İtalyanca
explanation: Fribourg, Fransızca ve Almancanın konuşulduğu iki dilli bir kantondur. Kanton, Almanca konuşulan
  İsviçre ile Fransızca konuşulan İsviçre arasındaki sınırda yer alır.
