id: politische-partei-aehnliche-ziele
lang: tr
source_version: 1
question: Siyasi bir partiyi en iyi hangisi tanımlar?
options:
  a: Siyasi uyuşmazlıklar hakkında karar veren bir mahkeme
  b: Benzer siyasi hedefleri olan kişilerin bir araya gelmesi
  c: Görevleri birlikte yerine getiren belediyeler (Gemeinde) grubu
  d: Seçimleri ve oylamaları gerçekleştiren bir makam
explanation: Bir partide, benzer siyasi hedefleri izleyen insanlar bir araya gelir. Partiler seçimlerde
  adaylar gösterir ve oylamaya sunulan tasarılar hakkında görüş bildirir. Partiler devlet makamları değildir.
