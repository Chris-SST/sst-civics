    question_de: Was beschreibt eine politische Partei am besten?
    options_de:
      a: Ein Gericht, das über politische Streitigkeiten entscheidet
      b: Der Zusammenschluss von Personen mit ähnlichen politischen Zielen
      c: Eine Gruppe von Gemeinden, die Aufgaben gemeinsam erfüllen
      d: Eine Behörde, die Wahlen und Abstimmungen durchführt
    explanation_de: In einer Partei kommen Menschen zusammen, die ähnliche politische Ziele verfolgen.
      Parteien stellen bei Wahlen Kandidaten auf und äussern sich zu den Vorlagen, die zur Abstimmung
      gebracht werden. Parteien sind keine staatlichen Behörden.
