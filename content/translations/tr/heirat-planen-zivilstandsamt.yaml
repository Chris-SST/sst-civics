id: heirat-planen-zivilstandsamt
lang: tr
source_version: 1
question: Evlenmek isteyen çiftler hangi makama başvurur?
options:
  a: Okul kuruluna (Schulpflege)
  b: Nüfus idaresine (Zivilstandsamt)
  c: Vergi dairesine
  d: İcra ve iflas dairesine
explanation: Nüfus idaresi (Zivilstandsamt) evliliğin hazırlıklarını yapar ve nikâhı gerçekleştirir. Ayrıca
  doğum ve ölüm gibi diğer olayları da resmen kayıt altına alır.
