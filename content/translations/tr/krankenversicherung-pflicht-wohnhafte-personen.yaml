id: krankenversicherung-pflicht-wohnhafte-personen
lang: tr
source_version: 1
question: İsviçre'de ikamet eden kişiler için sağlık sigortası açısından ne geçerlidir?
options:
  a: Yalnızca İsviçre'de çalışıyorlarsa sigortalanmak zorundadırlar
  b: Yasal olarak bir sağlık sigortası yaptırmakla yükümlüdürler
  c: Yalnızca 50 yaşından büyükseler sigortalanmak zorundadırlar
  d: Sigortalanıp sigortalanmamaya serbestçe karar verebilirler
explanation: Sağlık Sigortası Kanunu, İsviçre'de ikametgâhı olan her kişiyi sağlık sigortası yaptırmakla
  yükümlü kılar. Kişinin, doğumdan veya ikametgâhın İsviçre'ye taşınmasından itibaren üç ay içinde sigortalanması
  gerekir.
