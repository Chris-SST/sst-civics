    question_de: Was gilt für Personen, die in der Schweiz wohnen, in Bezug auf die Krankenversicherung?
    options_de:
      a: Sie müssen nur versichert sein, wenn sie in der Schweiz arbeiten
      b: Sie sind gesetzlich verpflichtet, eine Krankenversicherung abzuschliessen
      c: Sie müssen nur versichert sein, wenn sie älter als 50 Jahre sind
      d: Sie können frei entscheiden, ob sie sich versichern oder nicht
    explanation_de: Das Krankenversicherungsgesetz verpflichtet jede Person, die ihren Wohnsitz in der
      Schweiz hat, eine Krankenversicherung abzuschliessen. Die Person muss sich innerhalb von drei Monaten
      ab der Geburt oder ab der Verlegung des Wohnsitzes in die Schweiz versichern.
