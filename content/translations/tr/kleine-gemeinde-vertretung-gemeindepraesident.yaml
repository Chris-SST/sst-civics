    question_de: Wer vertritt eine kleine Zürcher Gemeinde nach aussen?
    options_de:
      a: die Gemeindepräsidentin oder der Gemeindepräsident
      b: die Bezirksrätin oder der Bezirksrat
      c: die Gemeindeschreiberin oder der Gemeindeschreiber
      d: die Schulleiterin oder der Schulleiter
    explanation_de: In kleinen Zürcher Gemeinden vertritt die Gemeindepräsidentin oder der Gemeindepräsident
      die Gemeinde nach aussen. Die Gemeindepräsidentin oder der Gemeindepräsident führt den Vorsitz im
      Gemeinderat. In der Stadt Zürich übernimmt diese Aufgabe die Stadtpräsidentin oder der Stadtpräsident.
