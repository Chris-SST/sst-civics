id: kleine-gemeinde-vertretung-gemeindepraesident
lang: tr
source_version: 1
question: Küçük bir Zürih belediyesini (Gemeinde) dışarıya karşı kim temsil eder?
options:
  a: belediye başkanı (Gemeindepräsidentin veya Gemeindepräsident)
  b: ilçe konseyi üyesi (Bezirksrätin veya Bezirksrat)
  c: belediye yazı işleri müdürü (Gemeindeschreiberin veya Gemeindeschreiber)
  d: okul müdürü (Schulleiterin veya Schulleiter)
explanation: Küçük Zürih belediyelerinde belediye başkanı, belediyeyi dışarıya karşı temsil eder. Belediye
  başkanı, belediye konseyine (Gemeinderat) başkanlık eder. Zürih şehrinde bu görevi şehir başkanı (Stadtpräsidentin
  veya Stadtpräsident) üstlenir.
