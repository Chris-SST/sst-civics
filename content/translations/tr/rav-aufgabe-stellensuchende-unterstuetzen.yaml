lang: tr
source_version: 1
question: Bölgesel İş Bulma Merkezi'nin (RAV) görevi nedir?
options:
  a: İşletmelerdeki ücretleri denetler
  b: Tüm sakinlere emekli maaşı öder
  c: İş arayanlara iş aramada destek olur ve iş bulma aracılığı yapar
  d: İş arayanlar için çalışma belgesi düzenler
explanation: RAV, iş arayanlar için bölgesel başvuru merkezidir. Onlara danışmanlık sağlar ve iş bulma
  aracılığı yapar. Zürih kantonunda Çalışma Dairesi'ne (Amt für Arbeit) bağlıdır.
