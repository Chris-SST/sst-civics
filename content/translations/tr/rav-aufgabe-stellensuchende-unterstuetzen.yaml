    question_de: Was ist die Aufgabe des Regionalen Arbeitsvermittlungszentrums (RAV)?
    options_de:
      a: Es kontrolliert die Löhne in den Betrieben
      b: Es zahlt allen Einwohnern eine Rente
      c: Es unterstützt Stellensuchende bei der Stellensuche und vermittelt Arbeit
      d: Es stellt für Stellensuchende eine Arbeitsbescheinigung aus
    explanation_de: Das RAV ist die regionale Anlaufstelle für Stellensuchende. Es berät sie und vermittelt
      Arbeit. Im Kanton Zürich ist es dem Amt für Arbeit unterstellt.
