id: staendemehr-mehrheit-der-kantone
lang: tr
source_version: 1
question: Federal oylamalarda «kantonlar çoğunluğu» (Ständemehr) terimi ne anlama gelir?
options:
  a: Tasarının kabul edilmesi için kantonların çoğunluğunun onay vermesi gerekir.
  b: Tasarının kabul edilmesi için belediyelerin (Gemeinde) çoğunluğunun onay vermesi gerekir.
  c: Tasarının kabul edilmesi için partilerin çoğunluğunun onay vermesi gerekir.
  d: Kantonlar Konseyi (Ständerat) üyelerinin çoğunluğunun hazır bulunması gerekir.
explanation: Kantonlar çoğunluğu, bir tasarının kabul edilmesi için kantonların çoğunluğunun onay vermesini
  gerektirir. Bir kantonun oyu, o kantonda yapılan oylamanın sonucuna göre sayılır. Anayasa değişikliklerinde
  halk çoğunluğunun (Volksmehr) yanı sıra kantonlar çoğunluğu da gerekir.
