    question_de: Was bedeutet der Begriff «Ständemehr» bei eidgenössischen Abstimmungen?
    options_de:
      a: Damit eine Vorlage angenommen wird, muss die Mehrheit der Kantone zustimmen.
      b: Damit eine Vorlage angenommen wird, muss die Mehrheit der Gemeinden zustimmen.
      c: Damit eine Vorlage angenommen wird, muss die Mehrheit der Parteien zustimmen.
      d: Die Mehrheit der Mitglieder des Ständerats muss anwesend sein.
    explanation_de: Das Ständemehr erfordert, dass die Mehrheit der Kantone einer Vorlage zustimmt. Die
      Stimme eines Kantons wird nach dem Ergebnis der im Kanton durchgeführten Abstimmung gezählt. Bei
      Verfassungsänderungen ist neben dem Volksmehr auch das Ständemehr erforderlich.
