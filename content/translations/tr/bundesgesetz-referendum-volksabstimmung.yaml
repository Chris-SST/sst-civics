    question_de: Was gilt für ein Bundesgesetz, dem beide Kammern des Parlaments zugestimmt haben?
    options_de:
      a: Die Stimmberechtigten können mit einem Referendum eine Volksabstimmung über dieses Gesetz verlangen.
      b: Der Bundesrat muss das Gesetz danach zusätzlich dem Bundesgericht zur Genehmigung vorlegen.
      c: Das Gesetz tritt immer sofort in Kraft und das Volk kann nicht mitreden.
      d: Die Kantonsregierungen müssen das Gesetz zuerst einzeln genehmigen.
    explanation_de: Nachdem beide Kammern entschieden haben, unterliegen Bundesgesetze dem fakultativen
      Referendum. Wenn das Referendum zustande kommt, entscheiden die Stimmberechtigten an der Urne über
      das Gesetz.
