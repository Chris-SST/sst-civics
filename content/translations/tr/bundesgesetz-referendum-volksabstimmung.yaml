id: bundesgesetz-referendum-volksabstimmung
lang: tr
source_version: 1
question: Parlamentonun her iki kamarasının da kabul ettiği bir federal kanun için ne geçerlidir?
options:
  a: Oy hakkına sahip olanlar, bir referandumla bu kanun hakkında halk oylaması talep edebilir.
  b: Federal Konsey (Bundesrat) bundan sonra kanunu onaylanması için ayrıca Federal Mahkeme'ye (Bundesgericht)
    sunmak zorundadır.
  c: Kanun her zaman hemen yürürlüğe girer ve halk söz sahibi olamaz.
  d: Kanton hükümetlerinin kanunu önce tek tek onaylaması gerekir.
explanation: Her iki kamara da karar verdikten sonra federal kanunlar isteğe bağlı referanduma tabidir.
  Referandum gerçekleşirse, oy hakkına sahip olanlar kanun hakkında sandıkta karar verir.
