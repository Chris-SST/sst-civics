    question_de: Was gilt in einem Rechtsstaat für Gewahrsam und Haft?
    options_de:
      a: Der Staat darf niemanden ohne Grund in Gewahrsam nehmen und verhaften.
      b: Der Staat darf Personen nach eigenem Ermessen festhalten.
      c: Die Regierung darf Kritiker vorsorglich verhaften.
      d: Nur Ausländer dürfen ohne Grund in Gewahrsam genommen werden.
    explanation_de: In einem Rechtsstaat ist das Handeln des Staates an das Recht gebunden. Für Gewahrsam
      oder Haft ist ein gesetzlicher Grund erforderlich. Dies schützt die Freiheit der Menschen vor Willkür.
