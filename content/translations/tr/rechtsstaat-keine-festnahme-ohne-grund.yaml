id: rechtsstaat-keine-festnahme-ohne-grund
lang: tr
source_version: 1
question: Bir hukuk devletinde gözaltı ve tutukluluk için ne geçerlidir?
options:
  a: Devlet, hiç kimseyi sebepsiz yere gözaltına alamaz ve tutuklayamaz.
  b: Devlet, kişileri kendi takdirine göre alıkoyabilir.
  c: Hükümet, eleştirenleri önlem olarak tutuklayabilir.
  d: Sadece yabancılar sebepsiz yere gözaltına alınabilir.
explanation: Bir hukuk devletinde devletin eylemleri hukuka bağlıdır. Gözaltı veya tutukluluk için yasal
  bir sebep gerekir. Bu, insanların özgürlüğünü keyfîliğe karşı korur.
