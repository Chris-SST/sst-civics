id: empfehlung-bundesrat-parlament-volksinitiative
lang: tr
source_version: 1
question: Federal düzeydeki bir halk girişimi (Volksinitiative) oylamasından önce, oy hakkı olan kişilere
  girişimi kabul etmeleri veya reddetmeleri yönünde kim tavsiyede bulunur?
options:
  a: Federal Konsey (Bundesrat) ve Parlamento
  b: Kanton hükümetleri
  c: Yalnızca Federal Kançılarya (Bundeskanzlei)
  d: Federal Mahkeme (Bundesgericht)
explanation: Bir halk girişimi geçerli biçimde oluştuktan sonra Federal Konsey ve Parlamento bu konuda
  görüş bildirir. Parlamento, oy hakkı olan kişilere girişimin kabul edilmesini veya reddedilmesini tavsiye
  eder. Bu tavsiye, oy hakkı olan kişilerin oylamadan önce aldığı oylama açıklama broşüründe (Abstimmungserläuterungen)
  de yer alır.
