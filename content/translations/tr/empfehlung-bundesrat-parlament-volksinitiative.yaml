    source_version: 1
    question_de: Wer empfiehlt den Stimmberechtigten vor einer Abstimmung über eine Volksinitiative auf
      Bundesebene, die Initiative anzunehmen oder abzulehnen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Kantonsregierungen
      c: Nur die Bundeskanzlei
      d: Das Bundesgericht
    explanation_de: Nachdem eine Volksinitiative gültig zustande gekommen ist, nehmen der Bundesrat und
      das Parlament dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten, die Initiative anzunehmen
      oder abzulehnen. Diese Empfehlung ist auch in den Abstimmungserläuterungen (Abstimmungsbüchlein)
      enthalten, die die Stimmberechtigten vor der Abstimmung erhalten.
