id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: tr
source_version: 1
question: Hangi temel hak, kişinin kendi görüşünü oluşturma ve herkesin erişebileceği kaynaklardan bilgi
  edinme özgürlüğünü korur?
options:
  a: Yerleşme özgürlüğü
  b: Görüş ve bilgi edinme özgürlüğü
  c: Ekonomik özgürlük
  d: Toplanma özgürlüğü
explanation: Federal Anayasa, görüş ve bilgi edinme özgürlüğünü 16. maddede korur. Herkes, herkesin erişebileceği
  kaynaklardan bilgileri özgürce edinebilir. Bu, demokrasinin önemli bir temelidir.
