    question_de: Welches Grundrecht schützt die Freiheit, sich eine eigene Meinung zu bilden und sich
      aus allgemein zugänglichen Quellen zu informieren?
    options_de:
      a: Niederlassungsfreiheit
      b: Meinungs- und Informationsfreiheit
      c: Wirtschaftsfreiheit
      d: Versammlungsfreiheit
    explanation_de: Die Bundesverfassung schützt die Meinungs- und Informationsfreiheit in Artikel 16.
      Jede Person kann sich frei aus allgemein zugänglichen Quellen Informationen beschaffen. Dies ist
      eine wichtige Grundlage der Demokratie.
