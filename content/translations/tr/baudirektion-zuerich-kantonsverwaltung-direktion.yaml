id: baudirektion-zuerich-kantonsverwaltung-direktion
lang: tr
source_version: 1
question: Aşağıdaki kurumlardan hangisi Zürih kantonu idaresinin bir müdürlüğüdür (Direktion)?
options:
  a: Belediye (Gemeinde) Müdürlüğü
  b: İnşaat Müdürlüğü
  c: Şehir Müdürlüğü
  d: Konfederasyon Müdürlüğü
explanation: İnşaat Müdürlüğü, Zürih kantonu idaresinin müdürlükleri arasında yer alır. Kanton idaresi,
  her biri Hükümet Konseyi (Regierungsrat) üyelerinden biri tarafından yönetilen birkaç müdürlüğe ayrılmıştır.
