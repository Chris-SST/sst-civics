    question_de: Welche der folgenden Einrichtungen ist eine Direktion der Verwaltung des Kantons Zürich?
    options_de:
      a: Direktion der Gemeinden
      b: Baudirektion
      c: Stadtdirektion
      d: Direktion der Eidgenossenschaft
    explanation_de: Die Baudirektion gehört zu den Direktionen der Verwaltung des Kantons Zürich. Die
      Kantonsverwaltung ist in mehrere Direktionen unterteilt, die jeweils von einem der Mitglieder des
      Regierungsrats geleitet werden.
