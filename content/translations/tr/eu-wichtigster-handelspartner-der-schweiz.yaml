id: eu-wichtigster-handelspartner-der-schweiz
lang: tr
source_version: 1
question: İsviçre toplamda hangi ekonomik bölgeyle en çok ticaret yapmaktadır?
options:
  a: Orta Doğu ülkeleriyle
  b: Asya ülkeleriyle
  c: Avrupa Birliği ile
  d: Amerika Birleşik Devletleri ile
explanation: Avrupa Birliği, İsviçre'nin en önemli ticaret ortağıdır. İthalat ve ihracatın büyük bir bölümü
  AB ülkeleri üzerinden gerçekleşir. Bu nedenle AB ile olan ilişkiler İsviçre ekonomisi için çok önemlidir.
