    question_de: Mit welchem Wirtschaftsraum treibt die Schweiz insgesamt am meisten Handel?
    options_de:
      a: Mit den Ländern des Nahen Ostens
      b: Mit den asiatischen Ländern
      c: Mit der Europäischen Union
      d: Mit den Vereinigten Staaten von Amerika
    explanation_de: Die Europäische Union ist der wichtigste Handelspartner der Schweiz. Ein grosser Teil
      der Importe und Exporte läuft über die EU-Länder. Deshalb sind die Beziehungen zur EU für die Schweizer
      Wirtschaft sehr wichtig.
