id: sihl-muendung-in-limmat
lang: tr
source_version: 1
question: Sihl nehri Zürich şehrinin tam ortasında hangi nehre karışır?
options:
  a: Töss nehrine
  b: Limmat nehrine
  c: Glatt nehrine
  d: Aare nehrine
explanation: Sihl nehri Zürich'ten geçer ve Platzspitz'te Limmat nehrine karışır. Glatt ve Töss, Rhein
  nehrine karışan diğer Zürich nehirleridir. Aare nehri ise Limmat'ı ancak daha aşağıda, Aargau kantonunda
  alır.
