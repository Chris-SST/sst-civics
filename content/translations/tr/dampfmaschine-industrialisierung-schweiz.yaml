question: 19. yüzyılda hangi buluş İsviçre'de sanayileşmeyi güçlü biçimde şekillendirmiştir?
options:
  a: Uçak
  b: Buhar makinesi
  c: Bilgisayar
  d: Montaj hattı (bant sistemi)
explanation: 19. yüzyılda buhar makinesi İsviçre'de önem kazandı. Fabrikalardaki makineleri ve daha sonra
  demiryollarını da çalıştırdı ve giderek daha fazla insan fabrikalarda çalıştı. Uçak, montaj hattı ve
  bilgisayar ise ancak 20. yüzyılda önem kazandı.
