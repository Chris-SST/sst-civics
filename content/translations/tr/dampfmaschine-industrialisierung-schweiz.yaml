    question_de: Welche Erfindung hat die Industrialisierung in der Schweiz im 19. Jahrhundert stark geprägt?
    options_de:
      a: Flugzeug
      b: Dampfmaschine
      c: Computer
      d: Fliessband (Bandsystem)
    explanation_de: Im 19. Jahrhundert gewann die Dampfmaschine in der Schweiz an Bedeutung. Sie trieb
