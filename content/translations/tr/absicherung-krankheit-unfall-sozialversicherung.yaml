id: absicherung-krankheit-unfall-sozialversicherung
lang: tr
source_version: 1
question: İsviçre'nin sosyal sigorta sistemi, diğer risklerin yanı sıra hangi risklere karşı güvence sağlar?
options:
  a: Özel para yatırımlarındaki kayıplara karşı
  b: Hırsızlık nedeniyle araba ve ev eşyasında meydana gelen zararlara karşı
  c: Hastalık ve kaza sonuçlarına karşı
  d: Kira bedellerindeki fiyat artışlarına karşı
explanation: Sosyal sigortalar, insanları önemli yaşam risklerinin mali sonuçlarına karşı korur. Hastalık
  ve kaza da bunlara dahildir. Sağlık sigortası ve kaza sigortası bunlara örnektir.
