    question_de: Gegen welche Risiken bietet das Sozialversicherungssystem der Schweiz unter anderem Schutz?
    options_de:
      a: Gegen Verluste bei privaten Geldanlagen
      b: Gegen Schäden an Auto und Hausrat durch Diebstahl
      c: Gegen die Folgen von Krankheit und Unfall
      d: Gegen Preiserhöhungen bei den Mietpreisen
    explanation_de: Die Sozialversicherungen schützen die Menschen vor den finanziellen Folgen wichtiger
      Lebensrisiken. Krankheit und Unfall gehören ebenfalls dazu. Die Krankenversicherung und die Unfallversicherung
      sind Beispiele dafür.
