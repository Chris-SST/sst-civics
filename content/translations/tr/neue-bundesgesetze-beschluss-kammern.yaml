question: Yeni federal yasaların çoğuna kim karar verir?
options:
  a: Federal Mahkeme (Bundesgericht)
  b: Yalnızca Federal Konsey (Bundesrat)
  c: Kanton parlamentoları
  d: Ulusal Konsey (Nationalrat) ve Kantonlar Konseyi (Ständerat)
explanation: Yeni federal yasaların çoğuna parlamentonun her iki meclisi karar verir. Federal Konsey taslakları
  hazırlar, ancak tek başına karar vermez. Halk, bir yasaya karşı referandum başlatabilir.
