id: gewaltenteilung-bedeutung-staatsgewalten
lang: tr
source_version: 1
question: İsviçre'de kuvvetler ayrılığı ilkesi ne anlama gelir?
options:
  a: Konfederasyon, kantonlar ve belediyeler (Gemeinden) vergi gelirlerini kendi aralarında paylaşır.
  b: Hükümet, parlamento ve mahkemeler devlet gücünü paylaşır.
  c: Devletteki güç yalnızca Federal Konsey'de (Bundesrat) bulunur.
  d: Halk ve medya devlet gücünü paylaşır.
explanation: Kuvvetler ayrılığında yürütme (hükümet), yasama (parlamento) ve yargı (mahkemeler) farklı
  görevleri üstlenir. Böylece hiçbir kurum tek başına çok fazla güce sahip olamaz. Devlet güçleri birbirlerini
  karşılıklı olarak denetler.
