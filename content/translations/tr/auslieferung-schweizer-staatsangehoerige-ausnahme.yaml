    question_de: Welche Regel gilt grundsätzlich für die Auslieferung von Schweizer Bürgerinnen und Bürgern
      ins Ausland?
    options_de:
      a: Sie werden auf Antrag irgendeines Staates ausgeliefert.
      b: Sie werden gegen ihren Willen nicht an einen anderen Staat ausgeliefert. Sie können jedoch an
        ein internationales Gericht überstellt werden.
      c: Sie werden nur an die Nachbarstaaten der Schweiz ausgeliefert.
      d: Sie werden ausgeliefert, wenn der Bundesrat dies im konkreten Fall will.
    explanation_de: Gemäss Artikel 25 der Bundesverfassung dürfen Schweizer Bürgerinnen und Bürger nicht
      aus der Schweiz ausgewiesen werden. Sie dürfen nur dann an einen anderen Staat ausgeliefert werden,
      wenn sie selbst einwilligen. Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof,
      ist keine ausländische Behörde; deshalb erlaubt ein Bundesgesetz, Schweizer Bürgerinnen und Bürger
      für ein Verfahren dorthin zu überstellen.
