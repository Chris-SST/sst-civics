id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: tr
source_version: 2
question: İsviçre vatandaşlarının yurt dışına iadesi konusunda esas olarak hangi kural geçerlidir?
options:
  a: Herhangi bir devletin talebi üzerine iade edilirler.
  b: İradelerine aykırı olarak başka bir devlete iade edilmezler. Ancak uluslararası bir mahkemeye teslim
    edilebilirler.
  c: Yalnızca İsviçre'nin komşu devletlerine iade edilirler.
  d: Federal Konsey (Bundesrat) bunu somut olayda isterse iade edilirler.
explanation: Federal Anayasa'nın 25. maddesine göre İsviçre vatandaşları sınır dışı edilemez. Başka bir
  devlete ancak kendileri razı olursa iade edilebilirler. Uluslararası bir mahkeme, örneğin Uluslararası
  Ceza Mahkemesi, yabancı bir makam değildir; bu nedenle bir Konfederasyon kanunu, İsviçre vatandaşlarının
  bir yargılama için oraya teslim edilmesine izin verir.
