    question_de: Welche Staatsebene übernimmt in der Schweiz die Verantwortung dafür, die Bevölkerung
      sozial abzusichern, zum Beispiel durch die Altersversicherung?
    options_de:
      a: Die Bezirke
      b: Nur die Gemeinden
      c: Die Konföderation
      d: Nur die Kantone
    explanation_de: Die Bundesverfassung überträgt dem Bund wichtige Aufgaben im Bereich der sozialen
      Sicherheit. Dazu gehören zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) sowie die
      Invalidenversicherung. So gelten für die ganze Schweiz einheitliche Grundsätze.
