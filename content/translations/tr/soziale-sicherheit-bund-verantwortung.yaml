id: soziale-sicherheit-bund-verantwortung
lang: tr
source_version: 1
question: İsviçre'de, örneğin yaşlılık sigortası gibi yollarla nüfusun sosyal açıdan güvence altına alınması
  sorumluluğunu hangi devlet kademesi üstlenir?
options:
  a: İlçeler
  b: Yalnızca belediyeler (Gemeinden)
  c: Konfederasyon
  d: Yalnızca kantonlar
explanation: Federal Anayasa, sosyal güvenliğe ilişkin önemli görevleri Konfederasyona verir. Bunlara
  örneğin yaşlılık ve dul-yetim sigortası (AHV) ile malullük sigortası dahildir. Böylece tüm İsviçre için
  tek tip temel ilkeler geçerlidir.
