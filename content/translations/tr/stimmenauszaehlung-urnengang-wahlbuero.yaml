    question_de: Wer zählt in einer Gemeinde im Kanton Zürich die an der Urne abgegebenen Stimmen?
    options_de:
      a: Die Sozialbehörde
      b: Das Wahlbüro
      c: Die Gemeindeschreiberin allein
      d: Die Staatsanwaltschaft
    explanation_de: Das Wahlbüro ermittelt bei Abstimmungen und Wahlen die Ergebnisse der Gemeinde. Es
      besteht aus mehreren Personen, damit die Auszählung korrekt und nachvollziehbar erfolgt.
