question: Zürich kantonundaki bir belediyede (Gemeinde) sandık oylamalarında verilen oyları kim sayar?
options:
  a: Sosyal yardım kurulu
  b: Seçim bürosu
  c: Belediye yazmanı (kadın) tek başına
  d: Cumhuriyet savcılığı
explanation: Seçim bürosu, oylamalarda ve seçimlerde belediyenin sonuçlarını belirler. Sayımın doğru ve
  izlenebilir biçimde yapılması için birkaç kişiden oluşur.
