question: Aşağıdakilerden hangi isimler, İsviçre ile bağlantısı olan ve dünya çapında saygı gören sanatçılara
  aittir?
options:
  a: Vincent van Gogh, Paul Cézanne ve Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp ve Pipilotti Rist
  c: Claude Monet, Edgar Degas ve Auguste Renoir
  d: Pablo Picasso, Frida Kahlo ve Salvador Dalí
explanation: Niki de Saint Phalle, Sophie Taeuber-Arp ve Pipilotti Rist, İsviçre ile bağlantısı olan,
  uluslararası alanda tanınan kadın sanatçılardır. Diğer gruplarda ise İsviçre ile bu bağlantısı olmayan
  tanınmış sanatçıların isimleri yer almaktadır.
