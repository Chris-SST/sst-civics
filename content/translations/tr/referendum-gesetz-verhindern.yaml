    question_de: Was können Stimmberechtigte mit einem Referendum erreichen?
    options_de:
      a: Sie können ein neues Gesetz selbst schreiben und in Kraft setzen.
      b: Sie können ein vom Parlament angenommenes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates absetzen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
    explanation_de: Stimmberechtigte können mit einem Referendum verlangen, dass über ein vom Parlament
      angenommenes Gesetz abgestimmt wird. Wenn das Volk das Gesetz ablehnt, tritt das Gesetz nicht in
      Kraft.
