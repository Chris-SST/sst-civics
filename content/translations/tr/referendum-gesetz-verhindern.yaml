id: referendum-gesetz-verhindern
lang: tr
source_version: 1
question: Oy hakkı olan kişiler bir referandum ile ne elde edebilir?
options:
  a: Yeni bir yasayı kendileri yazıp yürürlüğe koyabilirler.
  b: Parlamento tarafından kabul edilmiş bir yasayı engelleyebilirler.
  c: Federal Konsey (Bundesrat) üyelerini görevden alabilirler.
  d: Parlamentoyu feshedip yeni seçim talep edebilirler.
explanation: Oy hakkı olan kişiler bir referandum ile, Parlamento tarafından kabul edilmiş bir yasa hakkında
  oylama yapılmasını talep edebilir. Halk yasayı reddederse, yasa yürürlüğe girmez.
