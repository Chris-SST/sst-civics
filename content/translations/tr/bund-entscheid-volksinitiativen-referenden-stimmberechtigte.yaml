    question_de: Wer entscheidet bei einer Abstimmung auf Ebene der Eidgenossenschaft letztlich darüber,
      ob eine Volksinitiative oder ein Referendum angenommen wird?
    options_de:
      a: Die Bundesversammlung in der gemeinsamen Sitzung beider Räte
      b: Der Bundesrat nach Anhörung der Kantonsregierungen
      c: Das Bundesgericht nach der rechtlichen Prüfung der Vorlage
      d: Die Stimmberechtigten, die an der Urne oder auf dem Postweg abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die Stimmberechtigten das letzte Wort. Sie
      entscheiden in der Volksabstimmung (an der Urne); in der Schweiz ist es auch möglich, auf dem Postweg
      abzustimmen. Der Bundesrat, das Parlament und das Bundesgericht können das Ergebnis nicht ersetzen.
