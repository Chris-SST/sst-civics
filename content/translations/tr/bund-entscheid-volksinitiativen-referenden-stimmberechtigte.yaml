id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
lang: tr
source_version: 1
question: Konfederasyon düzeyinde bir oylamada, bir halk girişiminin (Volksinitiative) veya bir referandumun
  kabul edilip edilmeyeceğine nihai olarak kim karar verir?
options:
  a: Her iki meclisin ortak oturumunda Federal Meclis (Bundesversammlung)
  b: Kanton hükümetlerinin görüşü alındıktan sonra Federal Konsey (Bundesrat)
  c: Tasarının hukuki incelemesinden sonra Federal Mahkeme (Bundesgericht)
  d: Sandıkta veya posta yoluyla oy kullanan oy hakkı sahipleri
explanation: Halk girişimlerinde ve referandumlarda son söz oy hakkı sahiplerine aittir. Bunlar, halk
  oylamasında (sandıkta) karar verir; İsviçre'de posta yoluyla oy kullanmak da mümkündür. Federal Konsey,
  Parlamento ve Federal Mahkeme sonucun yerine geçemez.
