id: bundesverwaltung-justiz-und-polizeidepartement
lang: tr
source_version: 1
question: Aşağıdaki birimlerden hangisi Konfederasyon idaresine aittir?
options:
  a: Ulusal Konsey (Nationalrat)
  b: Federal Meclis (Bundesversammlung)
  c: Federal Mahkeme (Bundesgericht)
  d: Adalet ve Polis Departmanı
explanation: Konfederasyon idaresi departmanlara ayrılmıştır. Adalet ve Polis Departmanı bunlardan biridir
  ve Federal Konsey (Bundesrat) yönetimindeki idareye aittir. Ulusal Konsey ve Federal Meclis parlamentoya,
  Federal Mahkeme ise yargıya aittir.
