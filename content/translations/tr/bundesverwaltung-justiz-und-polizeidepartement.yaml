    question_de: Welche der folgenden Einheiten gehört zur Verwaltung der Eidgenossenschaft?
    options_de:
      a: Nationalrat
      b: Bundesversammlung
      c: Bundesgericht
      d: Departement für Justiz und Polizei
    explanation_de: Die Verwaltung der Eidgenossenschaft ist in Departemente unterteilt. Das Departement
      für Justiz und Polizei ist eines davon und gehört zur Verwaltung unter der Leitung des Bundesrates.
      Der Nationalrat und die Bundesversammlung gehören zum Parlament, das Bundesgericht hingegen zur
      Justiz.
