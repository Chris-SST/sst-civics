id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
lang: tr
source_version: 1
question: İsviçre'de tamamlayıcı yardımları kimler alabilir?
options:
  a: İşini kaybetmiş ve işsizlik ödeneği alan kişiler
  b: 50 yaşından büyük tüm kişiler
  c: yaşlılık ve dul-yetim sigortası (AHV) veya malullük sigortası (IV) aylığı asgari geçim düzeyini karşılamayan
    kişiler
  d: Sosyal yardım alan tüm kişiler
explanation: Tamamlayıcı yardımlar, yaşlılık ve dul-yetim sigortası (AHV) veya malullük sigortası (IV)
  aylığı ile diğer gelirleri geçinmeye yetmeyen kişilere yardımcı olur. Bunlar yasal bir haktır ve sosyal
  yardım değildir. Aylığa ek olarak ödenirler.
