    question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
    options_de:
      a: Personen, die ihre Arbeit verloren haben und Arbeitslosenentschädigung erhalten
      b: Alle Personen über 50 Jahren
      c: Personen, deren Rente der Alters- und Hinterlassenenversicherung (AHV) oder der Invalidenversicherung
        (IV) das Existenzminimum nicht deckt
      d: Alle Personen, die Sozialhilfe erhalten
    explanation_de: Ergänzungsleistungen helfen Personen, deren Rente der Alters- und Hinterlassenenversicherung
      (AHV) oder der Invalidenversicherung (IV) und deren übriges Einkommen zum Leben nicht ausreichen.
      Diese sind ein gesetzlicher Anspruch und keine Sozialhilfe. Sie werden zusätzlich zur Rente ausgezahlt.
