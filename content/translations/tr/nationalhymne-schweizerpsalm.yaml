question: İsviçre'nin ulusal marşının adı nedir?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Schweizerpsalm
explanation: İsviçre'nin ulusal marşı Schweizerpsalm'dır. Federal Konsey (Bundesrat) onu 1981'de kesin
  olarak ulusal marş ilan etmiştir. Daha önce çoğunlukla «Rufst du, mein Vaterland» söylenirdi.
