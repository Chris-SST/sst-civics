question: Zürich kantonu ve belediyeleri (Gemeinde), kişilerin maaşı ve diğer gelirleri üzerinden hangi
  önemli vergiyi alır?
options:
  a: Gelir vergisi
  b: Miras vergisi
  c: Köpek vergisi
  d: Motorlu taşıt vergisi
explanation: Gelir vergisi, kanton ve belediyelerin en önemli vergilerinden biridir. Gerçek kişilerin
  geliri üzerinden alınır. Diğer vergiler daha az önemlidir veya başka bir şeyi kapsar.
