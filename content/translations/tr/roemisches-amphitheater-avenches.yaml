question: Romalılar İsviçre'nin hangi kentinde bir amfitiyatro inşa etmiştir ve bu amfitiyatronun kalıntıları
  bugün hâlâ görülebilmektedir?
options:
  a: Chur
  b: Thun
  c: Sitten (Sion)
  d: Avenches
explanation: Avenches, Roma döneminde Aventicum olarak adlandırılıyordu ve önemli bir kentti. Oradaki
  amfitiyatro, İsviçre'deki Roma döneminin tanınmış bir tanığıdır. Diğer kentler bu yapıyla tanınmaz.
