    question_de: Gegen welche Beschlüsse wird auf Bundesebene ein Referendum ergriffen?
    options_de:
      a: Gegen Gesetze, die vom Nationalrat und vom Ständerat angenommen wurden
      b: Gegen Beschlüsse der Bundeskanzlei
      c: Gegen Urteile des Bundesgerichts
      d: Gegen Verordnungen, die von einzelnen Gemeinden erlassen wurden
    explanation_de: Ein Referendum wird gegen Gesetze ergriffen, die vom Parlament angenommen wurden.
      Das Parlament besteht aus dem Nationalrat und dem Ständerat. Gerichtsurteile und Verwaltungsentscheide
      können nicht per Referendum angefochten werden.
