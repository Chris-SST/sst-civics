id: referendum-gegen-parlamentsbeschluss
lang: tr
source_version: 1
question: Federal düzeyde bir referandum hangi kararlara karşı yapılır?
options:
  a: Ulusal Konsey (Nationalrat) ile Kantonlar Konseyi (Ständerat) tarafından kabul edilen yasalara karşı
  b: Federal Kançılarya (Bundeskanzlei) tarafından alınan kararlara karşı
  c: Federal Mahkeme (Bundesgericht) tarafından verilen hükümlere karşı
  d: Münferit belediyeler (Gemeinde) tarafından çıkarılan yönetmeliklere karşı
explanation: Bir referandum, parlamentonun kabul ettiği yasalara karşı yapılır. Parlamento, Ulusal Konsey
  ve Kantonlar Konseyi'nden oluşur. Mahkeme hükümleri ve idari kararlar referandum yoluyla itiraz edilemez.
