    question_de: Welche Bedeutung haben regelmässige Wahlen in einer Demokratie?
    options_de:
      a: Das Volk bestimmt selbst, wer es vertreten wird.
      b: Die Regierung ernennt ihren Nachfolger selbst.
      c: Die Parteien bestimmen die Vertretung untereinander.
      d: Das Gericht bestimmt, wer ein Amt übernimmt.
    explanation_de: Bei Wahlen entscheiden die Stimmberechtigten, wer sie im Parlament oder in der Regierung
      vertreten wird. Weil die Wahlen regelmässig stattfinden, können sie diese Personen in ihren Ämtern
      bestätigen oder an ihrer Stelle andere wählen. So behält das Volk seinen Einfluss auf die Politik.
