id: regelmaessige-wahlen-vertreter-bestimmen
lang: tr
source_version: 1
question: Bir demokraside düzenli seçimlerin önemi nedir?
options:
  a: Halk, kendisini kimin temsil edeceğini kendisi belirler.
  b: Hükümet, halefini kendisi atar.
  c: Partiler temsilciliği kendi aralarında belirler.
  d: Mahkeme, kimin bir göreve geleceğini belirler.
explanation: Seçimlerde oy hakkına sahip kişiler, parlamentoda veya hükümette kimin kendilerini temsil
  edeceğine karar verir. Seçimler düzenli olarak yapıldığı için, bu kişileri görevlerinde onaylayabilir
  veya yerlerine başkalarını seçebilirler. Böylece halk, siyaset üzerindeki etkisini korur.
