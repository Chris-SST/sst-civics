question: Yaşlılık ve dul-yetim sigortasında (AHV) 2028'den itibaren kadınlar ve erkekler için hangi emeklilik
  yaşı (bugün «referans yaş» olarak adlandırılmaktadır) geçerlidir?
options:
  a: Kadınlar 64 yaş, erkekler 65 yaş
  b: Kadınlar ve erkekler 65 yaş
  c: Kadınlar ve erkekler 63 yaş
  d: Kadınlar ve erkekler 67 yaş
explanation: 'AHV 21 reformundan bu yana emeklilik yaşı resmî olarak «referans yaş» olarak adlandırılmaktadır.
  Kadınlar için bu yaş 2025''ten itibaren her yıl üç ay artar ve 65 yaşa ulaşır. 2028''den itibaren kadınların
  ve erkeklerin referans yaşı aynıdır: 65 yaş.'
