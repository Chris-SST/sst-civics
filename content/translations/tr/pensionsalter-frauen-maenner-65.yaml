    question_de: Welches Rentenalter (heute «Referenzalter» genannt) gilt in der Alters- und Hinterlassenenversicherung
      (AHV) ab 2028 für Frauen und Männer?
    options_de:
      a: Frauen 64 Jahre, Männer 65 Jahre
      b: Frauen und Männer 65 Jahre
      c: Frauen und Männer 63 Jahre
      d: Frauen und Männer 67 Jahre
    explanation_de: 'Seit der AHV-21-Reform wird das Rentenalter offiziell «Referenzalter» genannt. Für
      Frauen steigt dieses Alter ab 2025 jedes Jahr um drei Monate und erreicht 65 Jahre. Ab 2028 ist
      das Referenzalter von Frauen und Männern gleich: 65 Jahre.'
