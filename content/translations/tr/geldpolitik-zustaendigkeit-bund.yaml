    question_de: Wer ist in der Schweiz für die Geldpolitik verantwortlich?
    options_de:
      a: Die Eidgenossenschaft
      b: Die Gemeinden
      c: Die Kantonalbanken
      d: Die Kantone gemeinsam
    explanation_de: Die Geld- und Währungspolitik ist gemäss der Bundesverfassung Aufgabe der Eidgenossenschaft.
      Die Eidgenossenschaft hat das Recht, Münzen und Banknoten zu prägen bzw. zu drucken. Die Schweizerische
      Nationalbank führt die Geldpolitik im Namen der Eidgenossenschaft durch und ist dabei unabhängig.
