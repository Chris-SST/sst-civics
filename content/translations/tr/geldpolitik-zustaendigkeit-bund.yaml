id: geldpolitik-zustaendigkeit-bund
lang: tr
source_version: 1
question: İsviçre'de para politikasından kim sorumludur?
options:
  a: Konfederasyon
  b: Belediyeler (Gemeinden)
  c: Kanton bankaları
  d: Kantonlar ortaklaşa
explanation: Para ve döviz politikası, Federal Anayasa'ya göre Konfederasyonun görevidir. Konfederasyon,
  madeni para ve banknot basma hakkına sahiptir. İsviçre Ulusal Bankası, para politikasını Konfederasyon
  adına yürütür ve bunu yaparken bağımsızdır.
