    question_de: Welche dieser Pflanzen wurde während des Zweiten Weltkriegs auf dem Sechseläutenplatz
      in Zürich angebaut?
    options_de:
      a: Tabak
      b: Weinrebe (Weinberg)
      c: Baumwolle
      d: Kartoffel
    explanation_de: Während des Zweiten Weltkriegs gab es in der Schweiz nicht genügend Nahrungsmittel.
      Deshalb wurde im Rahmen der «Anbauschlacht» (Mobilisierung des Anbaus) auch auf Flächen mitten in
      den Städten angepflanzt; zum Beispiel wurden auf dem Sechseläutenplatz in Zürich Kartoffeln gepflanzt.
      Dort wurden weder Tabak, noch Weinrebe, noch Baumwolle angebaut.
