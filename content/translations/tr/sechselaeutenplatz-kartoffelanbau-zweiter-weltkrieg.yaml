id: sechselaeutenplatz-kartoffelanbau-zweiter-weltkrieg
lang: tr
source_version: 2
question: Bu bitkilerden hangisi İkinci Dünya Savaşı sırasında Zürih'teki Sechseläutenplatz'ta yetiştirilmiştir?
options:
  a: Tütün
  b: Asma (üzüm bağı)
  c: Pamuk
  d: Patates
explanation: İkinci Dünya Savaşı sırasında İsviçre'de yeterli gıda yoktu. Bu nedenle «Anbauschlacht» (tarım
  seferberliği) kapsamında şehirlerin tam ortasındaki alanlarda da ekim yapıldı; örneğin Zürih'teki Sechseläutenplatz'a
  patates ekildi. Orada tütün, asma ve pamuk yetiştirilmedi.
