id: primarschule-finanzierung-kanton-gemeinde
lang: tr
source_version: 1
question: Zürich kantonunda ilkokulu kim finanse eder ve organize eder?
options:
  a: Yalnızca kilise belediyeleri (Kirchgemeinden)
  b: Yalnızca okul çağındaki çocukların ebeveynleri
  c: Yalnızca Konfederasyon
  d: Kanton ve belediyeler birlikte
explanation: Zürich kantonunda devlet okulu (Volksschule), kanton ile belediyelerin (Gemeinden) ortak
  görevidir. Kanton temel esasları belirler, belediyeler ise okulları yerinde yönetir.
