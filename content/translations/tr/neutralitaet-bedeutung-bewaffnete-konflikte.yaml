id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: tr
source_version: 1
question: İsviçre'nin tarafsızlığı, diğer devletler arasındaki silahlı çatışmalarda ne anlama gelir?
options:
  a: İsviçre, barışın korunması için her savaş bölgesine asker gönderir.
  b: İsviçre, çatışmaya taraf olan devletlerle tüm ilişkilerini keser.
  c: İsviçre, çatışan taraflardan hiçbirinin yanında yer almaz.
  d: İsviçre her zaman daha zayıf tarafı destekler.
explanation: Tarafsızlık, İsviçre'nin savaşan taraflardan birinin yanında yer almaması demektir. Böylece
  İsviçre, diğer devletlerin çatışmalarının dışında kalır. Bu, görüşmeleri ve insani yardımı engellemez.
