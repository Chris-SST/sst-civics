    question_de: Was bedeutet die Neutralität der Schweiz bei bewaffneten Konflikten zwischen anderen
      Staaten?
    options_de:
      a: Die Schweiz schickt zur Wahrung des Friedens Soldaten in jedes Kriegsgebiet.
      b: Die Schweiz bricht alle ihre Beziehungen zu den am Konflikt beteiligten Staaten ab.
      c: Die Schweiz stellt sich auf die Seite keiner der Konfliktparteien.
      d: Die Schweiz unterstützt immer die schwächere Seite.
    explanation_de: Neutralität bedeutet, dass die Schweiz sich nicht auf die Seite einer der Kriegsparteien
      stellt. So bleibt die Schweiz aus den Konflikten anderer Staaten heraus. Dies verhindert weder Verhandlungen
      noch humanitäre Hilfe.
