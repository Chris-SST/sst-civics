    explanation_de: 'Schwingen ist ein Ringkampf zwischen zwei Personen in einem runden, mit Sägemehl
      bedeckten Bereich und gilt als der traditionelle Sport der Schweiz. Hornussen und Steinstossen sind
      ebenfalls alte Schweizer Sportarten, aber kein Ringen: Beim Hornussen wird eine kleine Scheibe weit
      durch die Luft geschleudert, beim Steinstossen hingegen wird ein schwerer Stein geworfen. Curling
      wird auf Eis gespielt und stammt ursprünglich aus Schottland.'
