question: İsviçre'de geleneksel sporlardan hangisi bir tür güreştir?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'Schwingen, talaşla kaplı yuvarlak bir alanda iki kişi arasında yapılan bir güreştir ve İsviçre''nin
  geleneksel sporu olarak kabul edilir. Hornussen ve Steinstossen de eski İsviçre sporlarıdır, ancak güreş
  değildir: Hornussen''de küçük bir disk havada uzağa fırlatılır, Steinstossen''de ise ağır bir taş atılır.
  Curling buz üzerinde oynanır ve aslen İskoçya''dan gelir.'
