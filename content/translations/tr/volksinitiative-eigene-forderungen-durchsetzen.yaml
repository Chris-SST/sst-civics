id: volksinitiative-eigene-forderungen-durchsetzen
lang: tr
source_version: 1
question: Bir halk girişimi (Volksinitiative) oy hakkına sahip kişilere ne işe yarar?
options:
  a: Bununla Federal Mahkeme'nin (Bundesgericht) bir kararını değiştirebilirler.
  b: Bununla kendi taleplerini siyasi gündeme taşıyabilirler.
  c: Bununla bir sonraki seçimlerin tarihini belirleyebilirler.
  d: Bununla parlamentonun bir yasasını engelleyebilirler.
explanation: Bir halk girişimi ile oy hakkına sahip kişiler, Federal Anayasa'da bir değişiklik önerebilir.
  Girişim gerekli koşulları sağlarsa, bu konuda oylama yapılır. Böylece halk ve kantonlar kabul ederse,
  kendi taleplerini parlamentonun iradesine karşı bile hayata geçirebilirler.
