    question_de: Wozu dient eine Volksinitiative den Stimmberechtigten?
    options_de:
      a: Damit können sie einen Entscheid des Bundesgerichts ändern.
      b: Damit können sie ihre eigenen Forderungen auf die politische Agenda bringen.
      c: Damit können sie das Datum der nächsten Wahlen bestimmen.
      d: Damit können sie ein Gesetz des Parlaments verhindern.
    explanation_de: Mit einer Volksinitiative können die Stimmberechtigten eine Änderung der Bundesverfassung
      vorschlagen. Wenn die Initiative die erforderlichen Bedingungen erfüllt, wird darüber abgestimmt.
      Wenn das Volk und die Kantone sie so annehmen, können sie ihre eigenen Forderungen sogar gegen den
      Willen des Parlaments verwirklichen.
