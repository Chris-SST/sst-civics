id: wasserkraft-stromproduktion-schweiz
lang: tr
source_version: 1
question: İsviçre'de su bol miktarda bulunmaktadır. Bu su elektrik üretimi için nasıl kullanılır?
options:
  a: Doğal gaz santrallerinde
  b: Petrol rafinerilerinde
  c: Hidroelektrik santrallerinde
  d: Kömür santrallerinde
explanation: Nehirlerden ve barajlardaki göllerden gelen su, hidroelektrik santrallerinde türbinleri döndürür.
  Su gücü, İsviçre'de elektrik için yerli ve temel bir kaynaktır.
