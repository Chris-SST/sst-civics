    question_de: In der Schweiz ist Wasser reichlich vorhanden. Wie wird dieses Wasser zur Stromerzeugung
      genutzt?
    options_de:
      a: In Erdgaskraftwerken
      b: In Erdölraffinerien
      c: In Wasserkraftwerken
      d: In Kohlekraftwerken
    explanation_de: Das Wasser aus den Flüssen und aus den Seen in den Staudämmen treibt in den Wasserkraftwerken
      die Turbinen an. Die Wasserkraft ist in der Schweiz eine einheimische und grundlegende Quelle für
      Strom.
