id: textilindustrie-fruehe-industrialisierung-schweiz
lang: tr
source_version: 1
question: İsviçre'nin erken sanayileşme döneminde hangi ekonomi sektörü en önemli sektördü?
options:
  a: Saat sanayii
  b: İlaç sanayii
  c: Tekstil sanayii
  d: Makine sanayii
explanation: Erken sanayileşme döneminde İsviçre ekonomisine tekstil sanayii damgasını vurdu; örneğin
  iplik fabrikaları, dokuma atölyeleri ve nakış işletmeleri bu sektörün parçasıydı. Bilinen bir örnek,
  dünya çapında çok aranan St. Gallen nakışlarıdır. Diğer sektörler ancak daha sonra bu kadar önemli hale
  geldi.
