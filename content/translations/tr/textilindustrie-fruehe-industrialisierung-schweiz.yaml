    question_de: Welcher Wirtschaftssektor war in der Zeit der frühen Industrialisierung der Schweiz der
      wichtigste Sektor?
    options_de:
      a: Uhrenindustrie
      b: Pharmaindustrie
      c: Textilindustrie
      d: Maschinenindustrie
    explanation_de: In der Zeit der frühen Industrialisierung prägte die Textilindustrie die Schweizer
      Wirtschaft; zum Beispiel gehörten Spinnereien, Webereien und Stickereibetriebe zu diesem Sektor.
      Ein bekanntes Beispiel sind die weltweit sehr gefragten St. Galler Stickereien. Andere Sektoren
      wurden erst später so wichtig.
