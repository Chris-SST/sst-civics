    question_de: Welche Aussage zur geografischen Lage der Schweiz ist richtig?
    options_de:
      a: Die Schweiz hat keinen direkten Zugang zum Meer.
      b: Die Schweiz grenzt im Westen an den Atlantischen Ozean.
      c: Die Schweiz grenzt im Süden an das Mittelmeer.
      d: Die Schweiz grenzt im Norden an die Nordsee.
    explanation_de: 'Die Schweiz ist ein Land ohne Meeresküste: Sie ist ringsum von anderen Ländern umgeben
      und hat keine Meeresküste. Auch wenn Schiffe auf dem Rhein von Basel bis zur Nordsee fahren können,
      bildet kein Meer eine direkte Grenze zur Schweiz.'
