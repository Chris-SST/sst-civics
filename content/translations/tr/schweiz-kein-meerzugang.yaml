id: schweiz-kein-meerzugang
lang: tr
source_version: 2
question: İsviçre'nin coğrafi konumuyla ilgili hangi ifade doğrudur?
options:
  a: İsviçre'nin denize doğrudan erişimi yoktur.
  b: İsviçre'nin batısında Atlas Okyanusu ile sınırı vardır.
  c: İsviçre'nin güneyinde Akdeniz ile sınırı vardır.
  d: İsviçre'nin kuzeyinde Kuzey Denizi ile sınırı vardır.
explanation: 'İsviçre denize kıyısı olmayan bir ülkedir: Her yanı başka ülkelerle çevrilidir ve deniz
  kıyısı yoktur. Ren Nehri üzerinde gemiler Basel''den Kuzey Denizi''ne kadar gidebilse de hiçbir deniz
  İsviçre ile doğrudan sınır oluşturmaz.'
