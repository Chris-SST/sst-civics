question: İsviçre'de ormancılar artan sıcaklıklara nasıl tepki veriyor?
options:
  a: Giderek daha fazla başka ağaç türü dikiyorlar.
  b: Yalnızca orada her zaman bulunmuş olan ağaçları dikiyorlar.
  c: Ormanın bakımından tamamen vazgeçiyorlar.
  d: Alçak rakımlardaki ormanları kesip temizliyorlar.
explanation: Bazı ağaç türleri sıcağa ve kuraklığa iyi dayanamaz. Bu nedenle ormancılar, daha sıcak iklime
  daha iyi uyum sağlayan diğer türlere yönelir. Böylece ormanın dengeli ve sağlam kalması amaçlanır.
