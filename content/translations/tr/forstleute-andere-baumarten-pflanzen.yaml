    question_de: Wie reagieren Försterinnen und Förster in der Schweiz auf die steigenden Temperaturen?
    options_de:
      a: Sie pflanzen immer mehr andere Baumarten.
      b: Sie pflanzen nur die Bäume, die schon immer dort vorhanden waren.
      c: Sie verzichten vollständig auf die Pflege des Waldes.
      d: Sie holzen die Wälder in tiefen Lagen ab und räumen sie.
    explanation_de: Einige Baumarten vertragen Hitze und Trockenheit nicht gut. Deshalb wenden sich die
      Förster anderen Arten zu, die sich besser an das wärmere Klima anpassen. Dadurch soll der Wald ausgeglichen
      und widerstandsfähig bleiben.
