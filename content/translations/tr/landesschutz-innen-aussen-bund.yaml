id: landesschutz-innen-aussen-bund
lang: tr
source_version: 1
question: Aşağıdakilerden hangisi Konfederasyonun temel görevleri arasında yer alır?
options:
  a: Yerel okulların organizasyonu
  b: Ülkenin içeriden ve dışarıdan korunması
  c: Belediye (Gemeinde) yollarının işletilmesi
  d: Belediyelerin nüfus kayıtlarının yönetimi
explanation: Konfederasyon, örneğin ordu aracılığıyla ülkenin dış güvenliğini ve iç güvenliğini sağlar.
  Okullar, belediye yolları ve nüfus kayıtları ise daha çok kantonların ve belediyelerin sorumluluğundadır.
