    question_de: Welche der folgenden Aufgaben gehört zu den Kernaufgaben des Bundes?
    options_de:
      a: Die Organisation der lokalen Schulen
      b: Der Schutz des Landes nach innen und nach aussen
      c: Der Betrieb der Gemeindestrassen
      d: Die Verwaltung der Einwohnerregister der Gemeinden
    explanation_de: Der Bund gewährleistet, zum Beispiel durch die Armee, die äussere und die innere Sicherheit
      des Landes. Schulen, Gemeindestrassen und Einwohnerregister liegen hingegen eher in der Verantwortung
      der Kantone und der Gemeinden.
