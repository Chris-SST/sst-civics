id: gegenvorschlag-parlament-zur-volksinitiative
lang: tr
source_version: 1
question: Parlamento, federal düzeydeki bir halk girişimine (Volksinitiative) karşı ne ortaya koyabilir?
options:
  a: Imza toplama süresinin bir yıl daha uzatılması
  b: Kendi karşı önerisi; bu öneri hakkında da oylama yapılır
  c: Tüm kantonlarda ikinci bir imza toplama
  d: Girişimin oylamaya sunulmasının yasaklanması
explanation: Parlamento, bir halk girişimine karşı doğrudan bir karşı öneri ortaya koyabilir. Bu öneri,
  çoğu zaman talebi kısmen kabul eder ancak o kadar ileri gitmez. Oy hakkına sahip kişiler daha sonra
  girişim ve karşı öneri hakkında aynı gün oy kullanır.
