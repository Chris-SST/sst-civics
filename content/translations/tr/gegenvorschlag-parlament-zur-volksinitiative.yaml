    question_de: Was kann das Parlament einer Volksinitiative auf Bundesebene entgegensetzen?
    options_de:
      a: Eine Verlängerung der Unterschriftensammlungsfrist um ein weiteres Jahr
      b: Einen eigenen Gegenvorschlag; über diesen Vorschlag wird ebenfalls abgestimmt
      c: Eine zweite Unterschriftensammlung in allen Kantonen
      d: Das Verbot, die Initiative zur Abstimmung zu bringen
    explanation_de: Das Parlament kann einer Volksinitiative direkt einen Gegenvorschlag entgegensetzen.
      Dieser Vorschlag nimmt die Forderung oft teilweise auf, geht aber nicht so weit. Die Stimmberechtigten
      stimmen dann am selben Tag über die Initiative und den Gegenvorschlag ab.
