id: gewaltmonopol-des-staates
lang: tr
source_version: 2
question: İsviçre'de prensip olarak kimler fiziksel güç kullanabilir?
options:
  a: Derneklerin görevlendirdiği özel güvenlik şirketleri
  b: Kendini tehdit altında hisseden herkes
  c: Yalnızca devlet
  d: Kendi yurttaş milislerine sahip her belediye (Gemeinde)
explanation: 'İsviçre''de şiddet tekeli devlete aittir: Prensip olarak yalnızca devlet fiziksel güç kullanabilir,
  örneğin polis veya ordu aracılığıyla. Bir istisna meşru müdafaadır: Hukuka aykırı biçimde saldırıya
  uğrayan kişi kendini orantılı bir şekilde savunabilir, ancak yalnızca tehdit altında hissetmek bunun
  için yeterli değildir.'
