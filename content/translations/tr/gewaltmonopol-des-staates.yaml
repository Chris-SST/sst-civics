    question_de: Wer darf in der Schweiz grundsätzlich physische Gewalt anwenden?
    options_de:
      a: Private Sicherheitsfirmen, die von Vereinen beauftragt werden
      b: Jeder, der sich bedroht fühlt
      c: Nur der Staat
      d: Jede Gemeinde, die über eigene Bürgermilizen verfügt
    explanation_de: 'In der Schweiz liegt das Gewaltmonopol beim Staat: Grundsätzlich darf nur der Staat
      physische Gewalt anwenden, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist die
      Notwehr: Wer rechtswidrig angegriffen wird, darf sich verhältnismässig verteidigen, aber sich nur
      bedroht zu fühlen, reicht dafür nicht aus.'
