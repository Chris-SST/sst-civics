lang: tr
source_version: 1
question: 1990'lı yıllarda eski Yugoslavya'dan pek çok insan hangi nedenle İsviçre'ye sığınmak istedi?
options:
  a: İsviçre'deki yükseköğretim kurumlarında okumak istiyorlardı.
  b: Büyük bir doğal afetten kaçtılar.
  c: Ülkelerindeki savaştan kaçtılar.
  d: İsviçreli şirketler tarafından mevsimlik işçi (Saisonnier) olarak işe alındılar.
explanation: Yugoslavya'nın dağılması 1990'lı yıllarda savaşlara yol açtı. Bu nedenle pek çok insan İsviçre'de
  korunma aradı. Bunların bir kısmı kaldı ve bugün burada yaşıyor.
