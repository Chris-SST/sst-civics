question: «Romandie» veya «Welschland» terimiyle ne kastedilmektedir?
options:
  a: İsviçre'nin İtalyanca konuşulan bölümü
  b: İsviçre'nin Fransızca konuşulan bölümü
  c: İsviçre'nin Romanşça konuşulan bölümü
  d: İsviçre'nin Almanca konuşulan bölümü
explanation: Romandie veya Welschland, İsviçre'de Fransızca konuşulan bölgeleri ifade eder. Bunlara örneğin
  Cenevre ve Vaud kantonları dahildir. İtalyanca konuşulan bölüm ise başta Ticino'dur.
