question: Zürih kantonunda Zürih Üniversitesi'nin işletilmesinden ve sorumluluğunun (kurucu kuruluş olmasının)
  üstlenilmesinden kim sorumludur?
options:
  a: Konfederasyon
  b: Zürih şehri
  c: Zürih kantonu
  d: Kantonun ilçe konseyleri
explanation: Zürih Üniversitesi bir kanton yüksekokuludur. Zürih kantonu üniversitenin kurucu kuruluşudur
  ve onu işletir. Zürih şehri ile Konfederasyon bu konuda esas sorumlu değildir.
