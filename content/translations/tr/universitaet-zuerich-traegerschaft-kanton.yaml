    question_de: Wer ist im Kanton Zürich für den Betrieb der Universität Zürich und die Übernahme der
      Verantwortung (als Trägerschaft) zuständig?
    options_de:
      a: Die Eidgenossenschaft
      b: Die Stadt Zürich
      c: Der Kanton Zürich
      d: Die Bezirksräte des Kantons
    explanation_de: Die Universität Zürich ist eine kantonale Hochschule. Der Kanton Zürich ist die Trägerschaft
      der Universität und betreibt sie. Die Stadt Zürich und die Eidgenossenschaft sind hierfür nicht
      hauptverantwortlich.
