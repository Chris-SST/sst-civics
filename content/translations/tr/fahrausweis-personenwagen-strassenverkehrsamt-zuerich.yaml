id: fahrausweis-personenwagen-strassenverkehrsamt-zuerich
lang: tr
source_version: 1
question: Zürih kantonunda binek otomobiller için sürücü belgesini hangi makam verir?
options:
  a: İlçe mahkemesi
  b: Kantonun karayolu trafik dairesi (Strassenverkehrsamt)
  c: İkamet edilen belediyenin (Gemeinde) şehir polisi
  d: Federal Yol İdaresi
explanation: Zürih kantonunda sürücü belgelerinden karayolu trafik dairesi sorumludur. Bu daire Güvenlik
  Müdürlüğü'ne bağlıdır. Belediyeler (Gemeinden) ve Konfederasyon sürücü belgesi vermez.
