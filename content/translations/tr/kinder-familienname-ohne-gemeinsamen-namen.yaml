id: kinder-familienname-ohne-gemeinsamen-namen
lang: tr
source_version: 1
question: İki eş evlilik sırasında ortak bir aile adı belirlememiştir. Bu durumda ortak çocuklarının soyadını
  kim belirler?
options:
  a: Çocuklar otomatik olarak babanın soyadını alır.
  b: Nüfus müdürlüğü (Zivilstandsamt), soyadlarının alfabetik sırasına göre karar verir.
  c: Eşler çocuklarının soyadını kendileri seçer.
  d: Çocuklar otomatik olarak annenin soyadını alır.
explanation: Eşler ortak bir aile adı belirlememişse, çocukların soyadını kendileri seçmek zorundadır.
  Kanun bunu otomatik olarak belirlemez. Kurallar İsviçre Medeni Kanunu'nda yer almaktadır.
