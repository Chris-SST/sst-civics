    question_de: Die beiden Ehegatten haben bei der Heirat keinen gemeinsamen Familiennamen bestimmt.
      Wer bestimmt in diesem Fall den Familiennamen ihrer gemeinsamen Kinder?
    options_de:
      a: Die Kinder erhalten automatisch den Familiennamen des Vaters.
      b: Das Zivilstandsamt entscheidet nach der alphabetischen Reihenfolge der Familiennamen.
      c: Die Ehegatten wählen den Familiennamen ihrer Kinder selbst.
      d: Die Kinder erhalten automatisch den Familiennamen der Mutter.
    explanation_de: Wenn die Ehegatten keinen gemeinsamen Familiennamen bestimmt haben, müssen sie den
      Familiennamen der Kinder selbst wählen. Das Gesetz bestimmt dies nicht automatisch. Die Regeln stehen
      im Schweizerischen Zivilgesetzbuch.
