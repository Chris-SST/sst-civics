    question_de: Welche Aufgabe übernimmt die Bundeskanzlei für den Bundesrat?
    options_de:
      a: Sie ist die Stabsstelle des Bundesrates.
      b: Sie überprüft als Gericht die Entscheide des Bundesrates.
      c: Sie leitet das Finanzdepartement.
      d: Sie wählt die Mitglieder des Bundesrates.
    explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der
      Vorbereitung der Sitzungen. Die Bundeskanzlei steht unter der Leitung des Bundeskanzlers. Der Bundesrat
      wird von der Bundesversammlung gewählt.
