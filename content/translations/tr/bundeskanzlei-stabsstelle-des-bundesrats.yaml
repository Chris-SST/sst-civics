id: bundeskanzlei-stabsstelle-des-bundesrats
lang: tr
source_version: 1
question: Federal Kançılarya (Bundeskanzlei), Federal Konsey (Bundesrat) için hangi görevi üstlenir?
options:
  a: Federal Konsey'in kurmay birimidir.
  b: Mahkeme olarak Federal Konsey kararlarını denetler.
  c: Maliye Departmanı'nı yönetir.
  d: Federal Konsey üyelerini seçer.
explanation: Federal Kançılarya, Federal Konsey'e çalışmalarında destek olur; örneğin toplantıların hazırlanmasında.
  Federal Kançılarya, Federal Şansölye'nin yönetimi altındadır. Federal Konsey, Federal Meclis (Bundesversammlung)
  tarafından seçilir.
