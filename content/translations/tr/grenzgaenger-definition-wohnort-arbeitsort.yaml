    question_de: Wer gilt in der Schweiz als Grenzgänger?
    options_de:
      a: Eine Person, die in der Schweiz arbeitet, aber ihren Wohnsitz im Ausland hat und regelmässig
        dorthin zurückkehrt
      b: Eine Person, die beim Zoll arbeitet und die Landesgrenze kontrolliert
      c: Eine Person, die ohne Bewilligung die Grenze überquert, um hier zu arbeiten
      d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
    explanation_de: Grenzgänger haben ihren Arbeitsplatz in der Schweiz, wohnen aber in einem anderen
      Land. Sie müssen eine Grenzgängerbewilligung erhalten und kehren regelmässig, mindestens einmal
      pro Woche, an ihren Wohnort im Ausland zurück. Eine Person, die nur zwischen zwei Kantonen pendelt,
      ist kein Grenzgänger.
