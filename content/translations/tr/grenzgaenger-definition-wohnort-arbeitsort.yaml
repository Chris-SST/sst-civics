id: grenzgaenger-definition-wohnort-arbeitsort
lang: tr
source_version: 2
question: İsviçre'de kimler sınır işçisi (Grenzgänger) olarak kabul edilir?
options:
  a: İsviçre'de çalışan, ancak ikametgâhı yurt dışında olan ve düzenli olarak oraya dönen kişi
  b: Gümrükte çalışan ve ülke sınırını denetleyen kişi
  c: Burada çalışmak için izinsiz olarak sınırı geçen kişi
  d: Bir kantonda oturan ve her gün başka bir kantonda çalışan kişi
explanation: Sınır işçilerinin iş yeri İsviçre'dedir, ancak başka bir ülkede otururlar. Sınır işçisi izni
  almaları gerekir ve düzenli olarak, en az haftada bir kez, yurt dışındaki ikamet yerlerine dönerler.
  Yalnızca iki kanton arasında gidip gelen kişi sınır işçisi değildir.
