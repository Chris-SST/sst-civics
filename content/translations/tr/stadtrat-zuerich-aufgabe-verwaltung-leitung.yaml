id: stadtrat-zuerich-aufgabe-verwaltung-leitung
lang: tr
source_version: 1
question: Zürich Şehri'nin Şehir Konseyi (Stadtrat) hangi görevi yerine getirir?
options:
  a: Şehirdeki kanton vergi idaresini yönetir.
  b: Şehir bölgesi için kantonun yasalarını çıkarır.
  c: Sakinler arasındaki uyuşmazlıklarda hüküm verir.
  d: Şehir idaresini yönlendirir ve şehrin eylemlerine ilişkin ana ilkeleri belirler.
explanation: Şehir Konseyi, Zürich Şehri'nin yürütme organıdır. Şehir idaresini yönetir ve şehrin hangi
  yönde gelişeceğini belirler. Hüküm vermek mahkemelerin işidir, kanton yasalarını ise Kanton Konseyi
  (Kantonsrat) çıkarır.
