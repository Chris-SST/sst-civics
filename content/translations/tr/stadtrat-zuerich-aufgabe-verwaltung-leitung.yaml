    question_de: Welche Aufgabe erfüllt der Stadtrat der Stadt Zürich?
    options_de:
      a: Er leitet die kantonale Steuerverwaltung in der Stadt.
      b: Er erlässt die Gesetze des Kantons für das Stadtgebiet.
      c: Er urteilt bei Streitigkeiten zwischen Einwohnern.
      d: Er leitet die Stadtverwaltung und legt die Grundsätze für das Handeln der Stadt fest.
    explanation_de: Der Stadtrat ist das Exekutivorgan der Stadt Zürich. Er leitet die Stadtverwaltung
      und bestimmt, in welche Richtung sich die Stadt entwickelt. Urteilen ist Sache der Gerichte, die
      Gesetze des Kantons erlässt der Kantonsrat.
