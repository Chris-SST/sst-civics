    question_de: Welche politische Möglichkeit haben Ausländerinnen und Ausländer, die im Kanton Zürich
      kein Stimmrecht haben?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können die Mitglieder des Kantonsrats wählen.
      c: Sie können sich mit einer Petition an die zuständigen Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen offen, auch Personen ohne Stimmrecht. Auf diesem Weg
      können sie den zuständigen Behörden ihre Forderungen, Wünsche oder Kritik schriftlich übermitteln.
      Das Recht, abzustimmen, zu wählen und Initiativen zu unterzeichnen, steht nur Personen mit Stimmrecht
      zu.
