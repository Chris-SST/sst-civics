id: petition-ohne-stimmrecht-zuerich
lang: tr
source_version: 1
question: Zürich kantonunda oy hakkı olmayan yabancıların hangi siyasi imkânı vardır?
options:
  a: Sandıkta kantona ait düzenlemeler hakkında oy kullanabilirler.
  b: Kanton Konseyi (Kantonsrat) üyelerini seçebilirler.
  c: Dilekçe ile yetkili makamlara başvurabilirler.
  d: Kantonda bir halk girişimi (Volksinitiative) sunabilirler.
explanation: Dilekçe hakkı, oy hakkı olmayan kişiler de dahil olmak üzere herkese açıktır. Bu yolla yetkili
  makamlara taleplerini, isteklerini veya eleştirilerini yazılı olarak iletebilirler. Oy kullanma, seçim
  yapma ve girişimleri imzalama hakkı yalnızca oy hakkına sahip kişilere aittir.
