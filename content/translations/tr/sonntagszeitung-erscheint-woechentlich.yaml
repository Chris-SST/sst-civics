id: sonntagszeitung-erscheint-woechentlich
lang: tr
source_version: 1
question: İsviçre'de bir pazar gazetesi ne sıklıkla çıkar?
options:
  a: Haftada bir kez
  b: Haftada iki kez
  c: Ayda bir kez
  d: Her gün
explanation: Pazar gazetesi yalnızca haftada bir kez, pazar günü çıkar. Günlük gazeteler ise haftanın
  çoğu günü çıkar. Basın, ülkenin kültürünün ve kamuoyu oluşumunun bir parçasıdır.
