id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: tr
source_version: 1
question: İsviçre'de Federal Anayasa tarafından hangi temel hak güvence altına alınmıştır?
options:
  a: Devletten gelir elde etme hakkı
  b: Araba sahibi olma hakkı
  c: Bir iş yerine sahip olma hakkı
  d: İnanç ve vicdan özgürlüğü
explanation: İnanç ve vicdan özgürlüğü, Federal Anayasa'nın 15. maddesinde yer alır. Devlet hiç kimseyi
  bir inanca zorlayamaz. Temel hak olarak bir iş yeri veya gelir hakkı bulunmamaktadır.
