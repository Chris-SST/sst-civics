    question_de: Welches Grundrecht wird in der Schweiz durch die Bundesverfassung gewährleistet?
    options_de:
      a: Das Recht, vom Staat ein Einkommen zu beziehen
      b: Das Recht, ein Auto zu besitzen
      c: Das Recht, einen Arbeitsplatz zu haben
      d: Die Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung enthalten.
      Der Staat kann niemanden zu einem Glauben zwingen. Als Grundrecht gibt es kein Recht auf einen Arbeitsplatz
      oder auf ein Einkommen.
