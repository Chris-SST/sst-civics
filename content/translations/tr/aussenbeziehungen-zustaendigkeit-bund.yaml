id: aussenbeziehungen-zustaendigkeit-bund
lang: tr
source_version: 1
question: İsviçre'de diğer devletlerle ilişkileri düzenlemekten esas olarak kim sorumludur?
options:
  a: Kanton Hükümetleri Konferansı
  b: Konfederasyon
  c: Kantonlar birlikte
  d: Sınırdaki belediyeler (Gemeinden)
explanation: Federal Anayasa'ya (Bundesverfassung) göre dış politika Konfederasyonun görevidir. Kantonlar
  kendi yetki alanlarında yabancı ülkelerle iş birliği yapabilir, ancak genel sorumluluk Konfederasyondadır.
