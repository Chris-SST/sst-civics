    source_version: 1
    question_de: Wer ist in der Schweiz hauptsächlich für die Regelung der Beziehungen zu anderen Staaten
      zuständig?
    options_de:
      a: Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone gemeinsam
      d: Die Grenzgemeinden
    explanation_de: Gemäss der Bundesverfassung ist die Aussenpolitik Aufgabe des Bundes. Die Kantone
      können in ihren eigenen Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, aber die Gesamtverantwortung
      liegt beim Bund.
