id: bundesgesetz-referendum-volksmehr-genuegt
lang: tr
source_version: 1
question: Yeni bir federal yasaya karşı isteğe bağlı referandum başlatıldı. Yasanın halk oylamasında kabul
  edilmesi için ne gerekir?
options:
  a: Tüm İsviçre genelinde oy verenlerin çoğunluğu
  b: Oy verenlerin üçte iki çoğunluğu
  c: Yalnızca kantonların çoğunluğu
  d: Oy verenlerin çoğunluğu ve kantonların çoğunluğu
explanation: Bir federal yasaya karşı yapılan isteğe bağlı referandumda yalnızca halk çoğunluğu (Volksmehr)
  yeterlidir; yani tüm İsviçre genelinde geçerli oyların çoğunluğu. Kantonlar çoğunluğu (Ständemehr),
  yani kantonların çoğunluğu, ek olarak yalnızca Federal Anayasa değişikliklerinde ve bazı devletlerarası
  antlaşmalarda gerekir.
