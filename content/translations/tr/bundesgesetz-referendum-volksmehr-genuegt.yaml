    question_de: Gegen ein neues Bundesgesetz wurde ein fakultatives Referendum ergriffen. Was ist erforderlich,
      damit das Gesetz in der Volksabstimmung angenommen wird?
    options_de:
      a: Die Mehrheit der Stimmenden in der ganzen Schweiz
      b: Eine Zweidrittelmehrheit der Stimmenden
      c: Nur die Mehrheit der Kantone
      d: Die Mehrheit der Stimmenden und die Mehrheit der Kantone
    explanation_de: Beim fakultativen Referendum gegen ein Bundesgesetz genügt nur das Volksmehr; das
      heisst die Mehrheit der gültigen Stimmen in der ganzen Schweiz. Das Ständemehr, das heisst die Mehrheit
      der Kantone, ist zusätzlich nur bei Änderungen der Bundesverfassung und bei einigen zwischenstaatlichen
      Verträgen erforderlich.
