    question_de: Was ist die Staatsform der Schweiz?
    options_de:
      a: Sie ist eine Diktatur mit nur einer Partei.
      b: Sie ist eine Monarchie mit einem gewählten König.
      c: Sie ist ein demokratischer Staat.
      d: Sie ist ein Staat, der von einer adligen Familie regiert wird.
    explanation_de: Die Schweiz ist eine Demokratie. Das Volk beteiligt sich durch Wahlen und Abstimmungen
      an den politischen Entscheidungen. Die Bundesverfassung legt dies als Grundlage des Staates fest.
