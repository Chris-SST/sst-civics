id: schweiz-staatsform-demokratie
lang: tr
source_version: 1
question: İsviçre'nin devlet biçimi nedir?
options:
  a: Tek partili bir diktatörlüktür.
  b: Seçilmiş bir kralın bulunduğu bir monarşidir.
  c: Demokratik bir devlettir.
  d: Bir soylu aile tarafından yönetilen bir devlettir.
explanation: İsviçre bir demokrasidir. Halk, seçimler ve oylamalar yoluyla siyasi kararlara katılır. Federal
  Anayasa (Bundesverfassung) bunu devletin temeli olarak belirler.
