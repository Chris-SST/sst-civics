id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
lang: tr
source_version: 1
question: Planlanan evliliği nüfus (medeni durum) dairesine kim bildirir?
options:
  a: Tanıklar, çiftin adına
  b: Evlenecek çift birlikte
  c: Oturulan belediyenin ikamet kayıt dairesi otomatik olarak
  d: Gelinin veya damadın anne babası
explanation: Evlenecek çift, evlilik hazırlık usulünün yürütülmesi için başvuruyu birlikte medeni durum
  dairesine yapar. Başka kişiler bunu çiftin yerine yapamaz. Ardından daire, evliliğin şartlarını inceler.
