    question_de: Wer meldet die geplante Eheschliessung beim Zivilstandsamt an?
    options_de:
      a: Die Trauzeugen im Namen des Paares
      b: Das heiratswillige Paar gemeinsam
      c: Das Einwohnerkontrollamt der Wohngemeinde automatisch
      d: Die Eltern der Braut oder des Bräutigams
    explanation_de: Das heiratswillige Paar stellt den Antrag auf Durchführung des Ehevorbereitungsverfahrens
      gemeinsam beim Zivilstandsamt. Andere Personen können dies nicht anstelle des Paares tun. Anschliessend
      prüft das Amt die Voraussetzungen der Ehe.
