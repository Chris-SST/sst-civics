question: İsviçre'nin ekonomik durumu İkinci Dünya Savaşı'ndan sonraki on yıllarda, örneğin 1960'lı yıllarda
  nasıldı?
options:
  a: 'Durumu giderek daha iyi oldu: Çok iş vardı ve birçok insanın refah düzeyi yükseldi.'
  b: Ekonomi büyük ölçüde küçüldü ve birçok insan işsiz kaldı.
  c: İsviçre Avrupa Birliği'nin üyesi oldu.
  d: İsviçre'nin artık yurt dışından işgücüne ihtiyacı kalmadı.
explanation: İkinci Dünya Savaşı'ndan sonra İsviçre ekonomisi güçlü bir şekilde büyüdü. Çok iş vardı ve
  birçok insan daha fazlasını karşılayabiliyordu. Bu nedenle firmalar yurt dışından, ilk başta özellikle
  İtalya'dan, çok sayıda işgücü getirdi.
