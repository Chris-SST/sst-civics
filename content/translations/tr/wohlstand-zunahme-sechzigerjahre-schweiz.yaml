    question_de: Wie war die wirtschaftliche Lage der Schweiz in den Jahrzehnten nach dem Zweiten Weltkrieg,
      zum Beispiel in den 1960er-Jahren?
    options_de:
      a: 'Ihre Lage wurde immer besser: Es gab viel Arbeit und der Wohlstand vieler Menschen stieg.'
      b: Die Wirtschaft schrumpfte stark und viele Menschen wurden arbeitslos.
      c: Die Schweiz wurde Mitglied der Europäischen Union.
      d: Die Schweiz brauchte keine Arbeitskräfte mehr aus dem Ausland.
    explanation_de: Nach dem Zweiten Weltkrieg wuchs die Schweizer Wirtschaft stark. Es gab viel Arbeit
      und viele Menschen konnten sich mehr leisten. Deshalb holten die Firmen viele Arbeitskräfte aus
      dem Ausland, zuerst vor allem aus Italien.
