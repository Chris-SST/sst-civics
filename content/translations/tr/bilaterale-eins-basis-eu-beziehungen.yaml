    question_de: Welche Abkommen, die 2000 vom Volk angenommen wurden, bilden die Grundlage der heutigen
      Beziehungen der Schweiz zur EU?
    options_de:
      a: Bilaterale Abkommen I
      b: EWR-Abkommen
      c: Das Schengen-Abkommen allein
      d: Das Beitrittsabkommen zur EU
    explanation_de: Die Stimmberechtigten haben die Bilateralen Abkommen I im Jahr 2000 angenommen. Diese
      Abkommen regeln den Zugang zu bestimmten Bereichen des Binnenmarktes, zum Beispiel die Personenfreizügigkeit
      und den Landverkehr. Das Volk hatte dem EWR 1992 nicht zugestimmt.
