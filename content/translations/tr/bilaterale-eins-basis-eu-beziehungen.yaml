id: bilaterale-eins-basis-eu-beziehungen
lang: tr
source_version: 1
question: Halk tarafından 2000 yılında kabul edilen hangi anlaşmalar, İsviçre'nin AB ile bugünkü ilişkilerinin
  temelini oluşturmaktadır?
options:
  a: İkili Anlaşmalar I (Bilaterale I)
  b: AEA Anlaşması (EWR-Vertrag)
  c: Tek başına Schengen Anlaşması
  d: AB'ye Katılım Anlaşması
explanation: Seçmenler İkili Anlaşmalar I'i 2000 yılında kabul etti. Bu anlaşmalar, iç pazarın belirli
  alanlarına erişimi düzenlemektedir; örneğin kişilerin serbest dolaşımı ve kara taşımacılığı. Halk, AEA'ya
  1992'de onay vermemişti.
