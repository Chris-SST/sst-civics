id: stimmrecht-bund-schweizer-buergerrecht-erwerb
lang: tr
source_version: 1
question: Yurt dışından gelen bir kişi Konfederasyon düzeyinde oy hakkını ve seçilme ile seçme hakkını
  hangi andan itibaren kazanır?
options:
  a: İsviçre'de on yıl boyunca yaşadığı andan itibaren.
  b: Yerleşim izni (C izni) (Niederlassungsbewilligung) aldığı andan itibaren.
  c: İsviçre'de vergi ödediği ve çalıştığı andan itibaren.
  d: İsviçre vatandaşlığına (Bürgerrecht) sahip olduğu ve reşit olduğu andan itibaren.
explanation: Konfederasyon düzeyinde oy hakkı ve seçme ve seçilme hakkı, İsviçre vatandaşlığına bağlıdır.
  Yerleşim izni, belirli bir oturma süresi veya vergi ödemek bunun için yeterli değildir. Vatandaşlığa
  alınan ve reşit olan kişi, federal seçimlere ve oylamalara katılabilir.
