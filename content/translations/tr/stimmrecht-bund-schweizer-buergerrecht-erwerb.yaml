    question_de: Ab welchem Zeitpunkt erlangt eine aus dem Ausland kommende Person auf Ebene der Eidgenossenschaft
      das Stimmrecht sowie das Recht, gewählt zu werden und zu wählen?
    options_de:
      a: Ab dem Zeitpunkt, in dem sie zehn Jahre lang in der Schweiz gelebt hat.
      b: Ab dem Zeitpunkt, in dem sie die Niederlassungsbewilligung (Niederlassungsbewilligung, C-Bewilligung)
        erhalten hat.
      c: Ab dem Zeitpunkt, in dem sie in der Schweiz Steuern zahlt und arbeitet.
      d: Ab dem Zeitpunkt, in dem sie das Schweizer Bürgerrecht besitzt und volljährig ist.
    explanation_de: Das Stimmrecht sowie das Wahl- und Wählbarkeitsrecht auf Ebene der Eidgenossenschaft
      sind an das Schweizer Bürgerrecht gebunden. Die Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer
      oder das Zahlen von Steuern reichen dafür nicht aus. Eine eingebürgerte und volljährige Person kann
      an den eidgenössischen Wahlen und Abstimmungen teilnehmen.
