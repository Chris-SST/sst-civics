id: gemeinden-finanzieren-sozialhilfe
lang: tr
source_version: 1
question: Zürich kantonunda zor durumdaki insanlara yönelik sosyal yardımı kim finanse eder?
options:
  a: Yalnızca kiliseler
  b: İsviçre Ulusal Bankası
  c: İşveren birlikleri
  d: Belediyeler (Gemeinden)
explanation: Zürich kantonunda sosyal yardımdan belediyeler sorumludur ve bunun maliyetlerini de onlar
  karşılar. Bu durum küçük belediyeleri ciddi ölçüde zorlayabilir. Bu nedenle mali denkleştirme sistemi
  vardır.
