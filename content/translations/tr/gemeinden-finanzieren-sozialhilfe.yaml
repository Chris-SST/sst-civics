    question_de: Wer finanziert im Kanton Zürich die Sozialhilfe für Menschen in Not?
    options_de:
      a: Nur die Kirchen
      b: Die Schweizerische Nationalbank
      c: Die Arbeitgeberverbände
      d: Die Gemeinden
    explanation_de: Im Kanton Zürich sind die Gemeinden für die Sozialhilfe zuständig und tragen auch
      deren Kosten. Dies kann kleine Gemeinden erheblich belasten. Deshalb gibt es ein System des Finanzausgleichs.
