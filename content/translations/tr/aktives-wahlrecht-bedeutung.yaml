id: aktives-wahlrecht-bedeutung
lang: tr
source_version: 3
question: Aktif seçme hakkı ne anlama gelir?
options:
  a: Bir parti kurma hakkı
  b: Kişinin kendisinin bir göreve seçilme hakkı
  c: Parlamentoda önergeler sunma hakkı
  d: Seçimlere ve oylamalara katılma ve kendi oyunu kullanma hakkı
explanation: Aktif seçme hakkına sahip olan kişi, örneğin Ulusal Konsey (Nationalrat) seçiminde veya bir
  halk oylamasında olduğu gibi, seçimlerde ve oylamalarda kendi oyunu kullanabilir. Kişinin kendisinin
  bir göreve seçilme hakkına ise buna karşılık pasif seçme hakkı denir.
