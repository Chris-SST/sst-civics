    question_de: Was bedeutet aktives Wahlrecht?
    options_de:
      a: Das Recht, eine Partei zu gründen
      b: Das Recht einer Person, selbst in ein Amt gewählt zu werden
      c: Das Recht, im Parlament Anträge zu stellen
      d: Das Recht, an Wahlen und Abstimmungen teilzunehmen und seine eigene Stimme abzugeben
    explanation_de: Eine Person, die das aktive Wahlrecht besitzt, kann bei Wahlen und Abstimmungen ihre
      eigene Stimme abgeben, wie zum Beispiel bei der Nationalratswahl oder bei einer Volksabstimmung.
      Das Recht einer Person, selbst in ein Amt gewählt zu werden, nennt man dagegen passives Wahlrecht.
