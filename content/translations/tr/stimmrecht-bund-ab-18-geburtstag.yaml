    question_de: Ab welchem Alter können Schweizer Staatsbürger auf Bundesebene abstimmen und an Wahlen
      teilnehmen?
    options_de:
      a: Ab dem 20. Geburtstag
      b: Ab dem 21. Geburtstag
      c: Ab dem 16. Geburtstag
      d: Ab dem 18. Geburtstag
    explanation_de: Das Stimm- und Wahlrecht auf Ebene der Eidgenossenschaft beginnt mit der Volljährigkeit,
