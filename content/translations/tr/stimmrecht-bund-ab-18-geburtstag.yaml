id: stimmrecht-bund-ab-18-geburtstag
lang: tr
source_version: 1
question: İsviçre vatandaşları federal düzeyde kaç yaşından itibaren oy kullanabilir ve seçimlere katılabilir?
options:
  a: 20. doğum gününden itibaren
  b: 21. doğum gününden itibaren
  c: 16. doğum gününden itibaren
  d: 18. doğum gününden itibaren
explanation: Konfederasyon düzeyinde oy hakkı ve seçme hakkı, reşit olmayla, yani 18. doğum günüyle başlar.
  Bu yaş sınırı, Konfederasyonun seçimleri ve oylamaları için aynı şekilde geçerlidir.
