    question_de: Wo können Sie Informationen über die Dienstleistungen und Regeln Ihrer eigenen Gemeinde
      finden?
    options_de:
      a: Im Amtsblatt der Eidgenossenschaft (Bundesblatt)
      b: In der lokalen Zeitung oder auf der Internetseite der Gemeinde
      c: In der Botschaft des Landes, aus dem Sie kommen
      d: Im Bundesrat in Bern
    explanation_de: Die Gemeinde informiert über ihre Dienstleistungen und Regeln insbesondere in der
      lokalen Zeitung und auf ihrer Website im Internet. Die Eidgenossenschaft und der Bundesrat sind
      für nationale Angelegenheiten zuständig; eine ausländische Botschaft ist hingegen in keiner Weise
      für die Gemeinde zuständig. Auch die Gemeindeverwaltung gibt Auskunft.
