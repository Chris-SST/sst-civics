question: Kendi belediyenizin (Gemeinde) hizmetleri ve kuralları hakkında bilgiyi nerede bulabilirsiniz?
options:
  a: Eidgenossenschaft'ın Resmî Gazetesi'nde (Bundesblatt)
  b: Yerel gazetede veya belediyenin internet sitesinde
  c: Geldiğiniz ülkenin büyükelçiliğinde
  d: Bern'deki Federal Konsey'de (Bundesrat)
explanation: Belediye, hizmetleri ve kuralları hakkında özellikle yerel gazetede ve internetteki web sitesinde
  bilgi verir. Konfederasyon ve Federal Konsey ulusal konulardan sorumludur; yabancı bir büyükelçilik
  ise belediyeden hiçbir şekilde sorumlu değildir. Belediye idaresi de bilgi verir.
