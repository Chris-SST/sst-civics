id: obligatorische-schule-verantwortung-kanton-gemeinden
lang: tr
source_version: 1
question: İsviçre'de zorunlu devlet okulunun sorumluluğunu esas olarak kim taşır?
options:
  a: Okul yönetimleri ve veliler
  b: Yalnızca Konfederasyon
  c: İlçeler ve kiliseler
  d: Kantonlar ve belediyeler (Gemeinde)
explanation: Halk okulu (Volksschule) kantonların ve belediyelerin işidir. Kanton çerçeveyi belirler,
  belediyeler okulları yerinde yönetir. Konfederasyon zorunlu okulda yalnızca küçük bir rol oynar.
