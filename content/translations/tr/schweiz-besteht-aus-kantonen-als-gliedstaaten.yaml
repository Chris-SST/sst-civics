id: schweiz-besteht-aus-kantonen-als-gliedstaaten
lang: tr
source_version: 1
question: İsviçre bir federal devlet olarak nelerden oluşur?
options:
  a: Üye devletler olarak ilçelerden
  b: Üye devletler olarak dil bölgelerinden
  c: Üye devletler olarak kantonlardan
  d: Üye devletler olarak bölgelerden
explanation: İsviçre bir federal devlettir. Kantonlar onun üye devletleridir ve kendilerine ait bir anayasaya,
  kendilerine ait bir parlamentoya ve kendilerine ait bir hükümete sahiptir. İlçeler ve bölgeler üye devlet
  değildir.
