id: medien-vierte-staatsgewalt
lang: tr
source_version: 1
question: Medya, devlet içindeki rolünü anlatan özel bir ifadeyle sık sık anılır. Bu ifade hangisidir?
options:
  a: İkinci devlet gücü
  b: En yüksek devlet gücü
  c: Birinci devlet gücü
  d: Dördüncü devlet gücü
explanation: Üç devlet gücü yasama, yürütme ve yargıdır. Medya bunların arasında yer almaz, ancak siyaseti
  denetler ve halkı bilgilendirir. Bu nedenle medyaya sıklıkla dördüncü devlet gücü denir.
