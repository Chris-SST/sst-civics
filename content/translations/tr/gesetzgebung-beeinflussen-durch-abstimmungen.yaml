id: gesetzgebung-beeinflussen-durch-abstimmungen
lang: tr
source_version: 1
question: İsviçre'de oy hakkı olan vatandaşlar Konfederasyon'un yasama sürecini doğrudan nasıl etkiler?
options:
  a: Sandıkta girişimler ve referandumlar hakkında oy kullanırlar.
  b: Yeni yasalara karar veren yargıçları seçerler.
  c: Yeni yasaları çıkaran Federal Konsey üyelerini atarlar.
  d: Yasalara Federal Meclis (Bundesversammlung) toplantısında bizzat karar verirler.
explanation: Oy hakkı olan vatandaşlar girişimler ve referandumlar hakkında yapılan halk oylamalarına
  katılır ve orada karar sürecine katkıda bulunur. Böylece seçimler arasındaki dönemde de yasama sürecine
  doğrudan katılırlar. Bu, doğrudan demokrasinin bir özelliğidir.
