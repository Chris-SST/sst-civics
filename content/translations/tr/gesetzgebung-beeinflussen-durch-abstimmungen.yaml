    question_de: Wie beeinflussen stimmberechtigte Bürgerinnen und Bürger in der Schweiz den Gesetzgebungsprozess
      des Bundes direkt?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über neue Gesetze entscheiden.
      c: Sie ernennen die Mitglieder des Bundesrates, die die neuen Gesetze erlassen.
      d: Sie entscheiden in der Sitzung der Bundesversammlung persönlich über die Gesetze.
    explanation_de: Stimmberechtigte Bürgerinnen und Bürger nehmen an Volksabstimmungen über Initiativen
      und Referenden teil und tragen dort zum Entscheidungsprozess bei. So beteiligen sie sich auch in
      der Zeit zwischen den Wahlen direkt am Gesetzgebungsprozess. Dies ist ein Merkmal der direkten Demokratie.
