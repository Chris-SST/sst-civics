    question_de: Wer lässt im Kanton Zürich ein Motorfahrzeug zum Strassenverkehr zu und wer gibt dafür
      die Kontrollschilder ab?
    options_de:
      a: Die Kantonspolizei während der Verkehrskontrolle
      b: Das Strassenverkehrsamt des Kantons
      c: Der Touring Club der Schweiz
      d: Die Verwaltung der Wohnortsgemeinde (Gemeinde)
    explanation_de: Die Zulassung von Motorfahrzeugen zum Verkehr ist Aufgabe des Strassenverkehrsamts
      des Kantons. Dieses Amt gibt auch die Kontrollschilder ab. Die Gemeinde und die Polizei sind dafür
      nicht zuständig.
