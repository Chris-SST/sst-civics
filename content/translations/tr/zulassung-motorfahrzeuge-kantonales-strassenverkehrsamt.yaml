id: zulassung-motorfahrzeuge-kantonales-strassenverkehrsamt
lang: tr
source_version: 1
question: Zürih kantonunda bir motorlu aracı karayolu trafiğine kim kabul eder ve bunun için plakaları
  kim verir?
options:
  a: Trafik kontrolü sırasında kanton polisi
  b: Kantonun karayolu trafik dairesi (Strassenverkehrsamt)
  c: İsviçre Touring Kulübü
  d: İkamet yerindeki belediye (Gemeinde) idaresi
explanation: Motorlu araçların trafiğe kabulü, kantonun karayolu trafik dairesinin görevidir. Plakaları
  da bu daire verir. Belediye ve polis bu konuda yetkili değildir.
