question: Zürihli siyasetçi Emilie Lieberherr hangi konuda mücadele etti?
options:
  a: Zürih Havalimanı'nın inşası için
  b: İsviçre'nin BM'ye katılması için
  c: Kadınların oy ve seçilme hakkı için
  d: belediye halk toplantısının (Gemeindeversammlung) kaldırılması için
explanation: Emilie Lieberherr 1960'lı yıllarda kadınların oy ve seçilme hakkı için mücadele etti. Konfederasyon
  düzeyinde bu hak 1971'de getirildi. Zürih kantonunda ise 1970'ten beri geçerlidir.
