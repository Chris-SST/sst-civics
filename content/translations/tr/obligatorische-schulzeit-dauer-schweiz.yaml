id: obligatorische-schulzeit-dauer-schweiz
lang: tr
source_version: 2
question: Zürich kantonunda anaokulu da sayıldığında zorunlu eğitim süresi kaç yıldır?
options:
  a: On bir yıl
  b: On yıl
  c: On iki yıl
  d: Dokuz yıl
explanation: 'Zürich kantonunda tüm çocuklar on bir yıl boyunca zorunlu olarak okula gider: iki yıl anaokulu,
  altı yıl ilkokul (Primarschule) ve üç yıl ortaokul (Sekundarstufe I). Çoğu kanton bu süreyi HarmoS Konkordatosu
  ile birleştirmiştir. Ancak bazı kantonlar konkordatoya katılmamıştır ve oralarda anaokulu kısmen yalnızca
  bir yıl zorunludur.'
