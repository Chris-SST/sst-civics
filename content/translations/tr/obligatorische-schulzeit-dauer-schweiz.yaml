    question_de: Wie viele Jahre dauert die Schulpflicht im Kanton Zürich, wenn der Kindergarten mitgezählt
      wird?
    options_de:
      a: Elf Jahre
      b: Zehn Jahre
      c: Zwölf Jahre
      d: Neun Jahre
    explanation_de: 'Im Kanton Zürich gehen alle Kinder während elf Jahren obligatorisch zur Schule: zwei
      Jahre Kindergarten, sechs Jahre Primarschule (Primarschule) und drei Jahre Sekundarstufe (Sekundarstufe
      I). Die meisten Kantone haben diese Dauer mit dem HarmoS-Konkordat vereinheitlicht. Einige Kantone
      sind dem Konkordat jedoch nicht beigetreten, und dort ist der Kindergarten teilweise nur ein Jahr
      obligatorisch.'
