question: İsviçre'de kaç kanton vardır ve bunların kaçı yarım kantondur?
options:
  a: 26 kanton, bunların 6'sı yarım kanton
  b: 26 kanton, bunların 3'ü yarım kanton
  c: 23 kanton, bunların 6'sı yarım kanton
  d: 20 kanton, bunların 6'sı yarım kanton
explanation: 'İsviçre''de 26 kanton vardır. Bunların altısı yarım kantondur: Obwalden, Nidwalden, Basel-Stadt,
  Basel-Landschaft, Appenzell Ausserrhoden ve Appenzell Innerrhoden. Bu kantonların Kantonlar Konseyi''nde
  (Ständerat) iki yerine birer oyu vardır.'
