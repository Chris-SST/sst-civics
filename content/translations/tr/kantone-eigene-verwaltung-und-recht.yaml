id: kantone-eigene-verwaltung-und-recht
lang: tr
source_version: 2
question: Aşağıdakilerden hangisi kantonların görevleri arasındadır?
options:
  a: İsviçre'nin dış politikasını ve para birimini belirlerler.
  b: Tüm ülke için geçerli yasaları çıkarırlar.
  c: Orduyu yönetirler ve gümrük vergilerini belirlerler.
  d: Kendi idarelerini yönetirler ve kantonal hukuku çıkarırlar.
explanation: Her kantonun kendi hükümeti, kendi parlamentosu ve kendi idaresi vardır. Kanton, yalnızca
  kendi sınırları içinde geçerli olan kendi yasalarını çıkarır; örneğin okullar veya polis için. Dış politika,
  para birimi, ordu, gümrük vergileri ve tüm İsviçre için geçerli yasalar Konfederasyon'un işidir.
