    source_version: 1
    question_de: Wie muss die ordentliche Kündigung eines Arbeitsverhältnisses mitgeteilt werden, damit
      der Empfang nachgewiesen werden kann?
    options_de:
      a: Durch eine Mitteilung an die Gemeindeverwaltung
      b: Per eingeschriebenen Brief oder durch schriftliche Empfangsbestätigung der Gegenpartei
      c: Durch eine einfache E-Mail ohne Bestätigung
      d: Mündlich in einem persönlichen Gespräch unter vier Augen
    explanation_de: Mit einem eingeschriebenen Brief oder einer schriftlichen Empfangsbestätigung kann
      nachgewiesen werden, dass die Kündigung die Gegenpartei erreicht hat. Das ist wichtig, weil die
      Kündigungsfristen ab dem Zeitpunkt des Empfangs der Mitteilung zu laufen beginnen.
