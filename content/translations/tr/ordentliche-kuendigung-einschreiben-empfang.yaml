id: ordentliche-kuendigung-einschreiben-empfang
lang: tr
source_version: 1
question: Bir iş ilişkisinin olağan feshi, alındığının kanıtlanabilmesi için nasıl tebliğ edilmelidir?
options:
  a: Belediye (Gemeinde) idaresine yapılan bir bildirim yoluyla
  b: Taahhütlü posta ile veya karşı tarafın alındığını yazılı olarak onaylaması yoluyla
  c: Onay alınmayan basit bir e-posta ile
  d: Baş başa yapılan bir görüşmede sözlü olarak
explanation: Taahhütlü posta veya yazılı bir alındı onayı ile fesih bildiriminin karşı tarafa ulaştığı
  kanıtlanabilir. Bu önemlidir, çünkü fesih süreleri bildirimin alındığı andan itibaren işlemeye başlar.
