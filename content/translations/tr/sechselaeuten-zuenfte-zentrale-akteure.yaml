question: Zürih'in bahar bayramı Sechseläuten'de merkezi rolü kimler üstlenir?
options:
  a: Zürih okul sınıfları
  b: Zürih loncaları (Zünfte)
  c: Kantonun belediye (Gemeinde) başkanlıkları
  d: Kanton Konseyi (Kantonsrat) üyeleri
explanation: Sechseläuten sırasında loncalar tarihî kostümlerle kentin içinden geçer. Akşam Böögg'ü yakarlar.
  Bu etkinlik, Zürih'te tanınmış bir bahar bayramıdır.
