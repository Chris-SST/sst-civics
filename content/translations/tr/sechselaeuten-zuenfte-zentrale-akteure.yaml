    question_de: Wer übernimmt die zentrale Rolle am Zürcher Frühlingsfest Sechseläuten?
    options_de:
      a: Zürcher Schulklassen
      b: Die Zürcher Zünfte
      c: Die Gemeindepräsidien des Kantons
      d: Die Mitglieder des Kantonsrats
    explanation_de: Während des Sechseläutens ziehen die Zünfte in historischen Kostümen durch die Stadt.
      Am Abend verbrennen sie den Böögg. Dieser Anlass ist ein bekanntes Frühlingsfest in Zürich.
