    source_version: 1
    question_de: Wie viele Unterschriften sind erforderlich, damit ein fakultatives Referendum gegen ein
      Bundesgesetz zustande kommt, und innerhalb welcher Frist müssen diese Unterschriften gesammelt werden?
    options_de:
      a: 50 000 Unterschriften innerhalb von 18 Monaten
      b: 50 000 Unterschriften innerhalb von 100 Tagen
      c: 100 000 Unterschriften innerhalb von 30 Tagen
      d: 100 000 Unterschriften innerhalb von 100 Tagen
    explanation_de: Für ein fakultatives Referendum sind 50 000 gültige Unterschriften innerhalb von 100
      Tagen ab der Veröffentlichung des Gesetzes im Bundesblatt erforderlich. Kommt das Referendum zustande,
      stimmt das Volk über das Gesetz ab.
