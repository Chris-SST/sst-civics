id: fakultatives-referendum-unterschriften-frist
lang: tr
source_version: 1
question: Konfederasyon yasasına karşı isteğe bağlı bir referandumun gerçekleşmesi için kaç imza gerekir
  ve bu imzalar hangi süre içinde toplanmalıdır?
options:
  a: 18 ay içinde 50 000 imza
  b: 100 gün içinde 50 000 imza
  c: 30 gün içinde 100 000 imza
  d: 100 gün içinde 100 000 imza
explanation: İsteğe bağlı bir referandum için, yasanın Federal Gazete'de (Bundesblatt) yayımlanmasından
  itibaren 100 gün içinde 50 000 geçerli imza gerekir. Referandum gerçekleşirse halk yasa hakkında oy
  kullanır.
