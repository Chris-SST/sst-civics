    question_de: Welche Institution bildet in der Schweiz die erste Säule der Altersvorsorge?
    options_de:
      a: Die private Säule 3a
      b: Die staatliche Alters- und Hinterlassenenversicherung (AHV)
      c: Die Pensionskasse
      d: Die Krankenversicherungsgesellschaft (Krankenkasse)
    explanation_de: Die Alters- und Hinterlassenenversicherung (AHV) ist die vom Staat bereitgestellte
      Vorsorge und bildet die erste Säule. Die Pensionskasse ist die zweite Säule, die private Vorsorge
      ist die dritte Säule.
