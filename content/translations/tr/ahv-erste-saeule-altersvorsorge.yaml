question: İsviçre'de yaşlılık güvencesinin birinci ayağını hangi kurum oluşturur?
options:
  a: Özel 3a sütunu
  b: Devlete ait yaşlılık ve dul-yetim sigortası (AHV)
  c: Emeklilik sandığı (Pensionskasse)
  d: Sağlık sigortası şirketi (Krankenkasse)
explanation: Yaşlılık ve dul-yetim sigortası (AHV) devletin sağladığı güvencedir ve birinci sütunu oluşturur.
  Emeklilik sandığı ikinci sütundur, özel güvence ise üçüncü sütundur.
