id: tessin-gesprochene-sprache
lang: tr
source_version: 1
question: Ticino kantonunda hangi dil konuşulur?
options:
  a: Romanşça
  b: Fransızca
  c: İtalyanca
  d: Almanca
explanation: Ticino'da İtalyanca, halkın dilidir ve aynı zamanda kantonun resmî dilidir. İtalyanca, İsviçre'nin
  dört ulusal dilinden biridir. Graubünden'in bazı bölgelerinde de konuşulur.
