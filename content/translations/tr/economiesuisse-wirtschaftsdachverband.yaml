question: Economiesuisse nedir?
options:
  a: Konfederasyonun bir işsizlik sigortası kasası
  b: Federal Ekonomi Dairesi
  c: Şirketlerin taleplerini temsil eden ekonomi çatı kuruluşu
  d: Perakende sektöründeki çalışanlar için bir sendika
explanation: Economiesuisse, İsviçre ekonomisinin çatı kuruluşudur ve şirketlerin çıkarlarını temsil eder.
