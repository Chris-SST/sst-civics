id: bundesrat-ist-regierung-der-schweiz
lang: tr
source_version: 1
question: İsviçre'de Federal Konsey (Bundesrat) hangi role sahiptir?
options:
  a: İsviçre'nin hükümetidir.
  b: Ülkenin en yüksek mahkemesidir.
  c: Konfederasyonun parlamentosudur.
  d: Kantonların temsilcisidir.
explanation: Federal Konsey, Konfederasyonun en üst düzeydeki yönetici ve yürütücü makamıdır, yani hükümettir.
  Yedi üyesi vardır. Parlamento ve Federal Mahkeme (Bundesgericht) başka erklerdir.
