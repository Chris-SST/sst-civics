id: obligatorisches-referendum-verfassungsaenderung
lang: tr
source_version: 1
question: İsviçre'de imza toplanmasa bile hangi tasarı hakkında her zaman oylama yapılması gerekir?
options:
  a: Her yeni federal yasa hakkında
  b: Federal Anayasa'nın her değişikliği hakkında
  c: Federal Konsey (Bundesrat) tarafından çıkarılan her yönetmelik hakkında
  d: Konfederasyonun her bütçesi hakkında
explanation: Federal Anayasa'nın her değişikliği zorunlu olarak halkın ve kantonların oyuna sunulmalıdır.
  Buna zorunlu referandum denir. Federal yasalar yalnızca isteğe bağlı referanduma tabidir.
status: approved
