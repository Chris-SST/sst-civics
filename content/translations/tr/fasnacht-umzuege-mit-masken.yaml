id: fasnacht-umzuege-mit-masken
lang: tr
source_version: 1
question: İsviçre Fasnacht'ına (karnaval) tipik olarak ne ait olur?
options:
  a: Katılımcıların maske taktığı geçit törenleri
  b: Köy meydanında köknar ağaçlarının süslenmesi
  c: 1 Ağustos'ta gece yarısı havai fişek gösterisi
  d: Kiliselerde büyük mumların yakılması
explanation: Fasnacht sırasında gruplar geçit törenleriyle sokaklarda yürür ve bu sırada maske ve kostüm
  giyer. Basel Fasnacht'ı bu geleneğin bilinen bir örneğidir.
