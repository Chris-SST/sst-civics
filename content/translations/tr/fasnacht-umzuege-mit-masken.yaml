    question_de: Was gehört typischerweise zur Schweizer Fasnacht (Karneval)?
    options_de:
      a: Umzüge, bei denen die Teilnehmenden Masken tragen
      b: Das Schmücken von Tannenbäumen auf dem Dorfplatz
      c: Ein Feuerwerk um Mitternacht am 1. August
      d: Das Anzünden grosser Kerzen in Kirchen
    explanation_de: Während der Fasnacht ziehen Gruppen in Umzügen durch die Strassen und tragen dabei
      Masken und Kostüme. Die Basler Fasnacht ist ein bekanntes Beispiel für diese Tradition.
