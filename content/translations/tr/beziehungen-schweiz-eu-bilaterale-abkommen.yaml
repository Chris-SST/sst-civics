lang: tr
source_version: 1
question: İsviçre ile Avrupa Birliği (AB) arasındaki ilişkiler esas olarak neye dayanmaktadır?
options:
  a: İkili anlaşmalardan oluşan bir pakete
  b: Ortak bir hükümete
  c: İsviçre'nin AB üyeliğine
  d: Ortak bir anayasaya
explanation: İsviçre, AB üyesi değildir. İsviçre'nin AB ile ilişkilerini birçok ikili anlaşma düzenler;
  bunlar iki taraf arasında yapılan sözleşmelerdir. Bu anlaşmalar örneğin ticareti ve kişilerin serbest
  dolaşımını kapsar.
