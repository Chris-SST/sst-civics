    question_de: Worauf beruhen die Beziehungen zwischen der Schweiz und der Europäischen Union (EU) hauptsächlich?
    options_de:
      a: Auf einem Paket aus bilateralen Abkommen
      b: Auf einer gemeinsamen Regierung
      c: Auf der EU-Mitgliedschaft der Schweiz
      d: Auf einer gemeinsamen Verfassung
    explanation_de: Die Schweiz ist kein EU-Mitglied. Die Beziehungen der Schweiz zur EU werden durch
      viele bilaterale Abkommen geregelt; das sind Verträge, die zwischen zwei Parteien geschlossen werden.
      Diese Abkommen umfassen zum Beispiel den Handel und die Personenfreizügigkeit.
