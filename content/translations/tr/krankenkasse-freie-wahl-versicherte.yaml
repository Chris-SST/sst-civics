id: krankenkasse-freie-wahl-versicherte
lang: tr
source_version: 1
question: İsviçre'de bir kişinin temel sigortasını hangi sağlık sigortası şirketinde (Krankenkasse) yaptıracağına
  kim karar verir?
options:
  a: Oturduğu belediye sağlık sigortası şirketini belirler
  b: Sigortalı kişi sağlık sigortası şirketini kendisi seçer
  c: İşveren tüm çalışanlar için sağlık sigortası şirketini belirler
  d: Oturduğu kanton her kişiye bir sağlık sigortası şirketi atar
explanation: İsviçre'de sağlık sigortası şirketini serbestçe seçme hakkı geçerlidir. Sigortalılar, yetkili
  sağlık sigortası şirketleri arasından seçim yapabilir ve belirli koşullar altında sigortalarını başka
  bir şirkete geçirebilir.
