    source_version: 1
    question_de: Wer entscheidet in der Schweiz, bei welcher Krankenkasse eine Person ihre Grundversicherung
      abschliesst?
    options_de:
      a: Die Wohngemeinde bestimmt die Krankenkasse
      b: Die versicherte Person wählt die Krankenkasse selbst
      c: Der Arbeitgeber bestimmt die Krankenkasse für alle Angestellten
      d: Der Wohnkanton weist jeder Person eine Krankenkasse zu
    explanation_de: In der Schweiz gilt die freie Wahl der Krankenkasse. Die Versicherten können unter
      den zugelassenen Krankenkassen auswählen und unter bestimmten Bedingungen ihre Versicherung zu einer
      anderen Kasse wechseln.
