id: nachbarland-im-sueden-der-schweiz
lang: tr
source_version: 1
question: Hangi ülke İsviçre'nin güneyinde yer alır ve İsviçre ile sınır komşusudur?
options:
  a: İspanya
  b: İtalya
  c: Slovenya
  d: Fransa
explanation: İtalya, İsviçre'nin güneydeki komşusudur. Sınır, diğer yerlerin yanı sıra Alpler boyunca
  ve Ticino ile Graubünden üzerinden geçer. İspanya ve Slovenya İsviçre ile sınır komşusu değildir.
