    question_de: Welche Voraussetzungen müssen Personen erfüllen, um in der Schweiz heiraten zu können?
    options_de:
      a: Sie müssen das Schweizer Bürgerrecht besitzen und volljährig sein
      b: Sie müssen volljährig sein und die Fähigkeit besitzen, vernünftig zu handeln
      c: Sie müssen seit mindestens fünf Jahren zusammenleben
      d: Sie müssen derselben Religion angehören
    explanation_de: Wer volljährig und urteilsfähig ist, kann heiraten. Urteilsfähig zu sein bedeutet,
      dass die Person vernünftig handeln kann. Staatsangehörigkeit, Religion oder ein bestimmter Zeitraum
      des Zusammenlebens sind keine Voraussetzung.
