id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
lang: tr
source_version: 1
question: İsviçre'de evlenebilmek için kişilerin hangi koşulları yerine getirmesi gerekir?
options:
  a: İsviçre vatandaşlığına (Bürgerrecht) sahip olmaları ve reşit olmaları gerekir
  b: Reşit olmaları ve makul biçimde davranabilme yeteneğine sahip olmaları gerekir
  c: En az beş yıldır birlikte yaşıyor olmaları gerekir
  d: Aynı dine mensup olmaları gerekir
explanation: Reşit olan ve ayırt etme gücüne sahip olan kişi evlenebilir. Ayırt etme gücüne sahip olmak,
  kişinin makul biçimde davranabilmesi demektir. Uyrukluk, din ya da belirli bir süre birlikte yaşamak
  bir koşul değildir.
