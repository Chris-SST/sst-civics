id: mehrehe-in-schweiz-verboten
lang: tr
source_version: 1
question: İsviçre'de aynı anda birden fazla eşle evlilik konusunda ne geçerlidir?
options:
  a: Herkes onay verirse serbesttir
  b: Yasaktır
  c: Dini bir gerekçeye dayanıyorsa serbesttir
  d: Yalnızca yabancı pasaportu olan kişiler için serbesttir
explanation: İsviçre yalnızca tek eşli evliliği tanır. Zaten evli olan veya kayıtlı birliktelik içinde
  yaşayan kişi, bir evlilik daha yapamaz. Bu, din veya kökenden bağımsız olarak geçerlidir.
