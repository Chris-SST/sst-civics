    source_version: 1
    question_de: Was gilt in der Schweiz bezüglich der Ehe mit mehreren Ehepartnern gleichzeitig?
    options_de:
      a: Sie ist erlaubt, wenn alle zustimmen
      b: Sie ist verboten
      c: Sie ist erlaubt, wenn sie auf einer religiösen Begründung beruht
      d: Sie ist nur für Personen mit einem ausländischen Pass erlaubt
    explanation_de: Die Schweiz anerkennt nur die Einehe. Eine Person, die bereits verheiratet ist oder
      in einer eingetragenen Partnerschaft lebt, kann keine weitere Ehe eingehen. Dies gilt unabhängig
      von Religion oder Herkunft.
