id: bahnunternehmen-der-schweiz-erkennen
lang: tr
source_version: 2
question: Aşağıdaki kısaltmaların hangisinde yer alan tüm kısaltmalar İsviçre'deki demiryolu şirketlerini
  ifade etmektedir?
options:
  a: SOB, SEM, BLS ve SZU
  b: SBB, BLS, SOB ve SZU
  c: SBB, SRF, SOB ve SUVA
  d: BLS, SZU, SNB ve SBB
explanation: SBB, BLS, SOB ve SZU, İsviçre'de tren işleten demiryolu şirketleridir. SBB en büyük şirkettir;
  diğerleri ise çoğunlukla bölgesel olarak hizmet veren daha küçük demiryollarıdır. Diğer kısaltmalar,
  Merkez Bankası (SNB), Göç Devlet Sekreterliği (SEM) veya kaza sigortası (SUVA) gibi kuruluşları ifade
  etmektedir.
