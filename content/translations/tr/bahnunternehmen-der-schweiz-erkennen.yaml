    question_de: In welcher der folgenden Abkürzungsreihen stehen alle Abkürzungen für Eisenbahnunternehmen
      in der Schweiz?
    options_de:
      a: SOB, SEM, BLS und SZU
      b: SBB, BLS, SOB und SZU
      c: SBB, SRF, SOB und SUVA
      d: BLS, SZU, SNB und SBB
    explanation_de: SBB, BLS, SOB und SZU sind Eisenbahnunternehmen, die in der Schweiz Züge betreiben.
      Die SBB ist das grösste Unternehmen; die anderen sind kleinere Bahnen, die meist regional verkehren.
      Die anderen Abkürzungen stehen für Institutionen wie die Zentralbank (SNB), das Staatssekretariat
      für Migration (SEM) oder die Unfallversicherung (SUVA).
