id: verbot-kinderarbeit-fabrik-schulunterricht
lang: tr
source_version: 1
question: 1877'de fabrikalarda çocuk işçiliğinin yasaklanması her şeyden önce neyi güvence altına almayı
  amaçlıyordu?
options:
  a: Fabrikaların daha az ücret ödemek zorunda kalmasını
  b: Çocukların okula gidebilmesini
  c: Çocukların evde daha erken yaşta yardım etmek zorunda kalmasını
  d: Fabrikaların yurt dışından daha fazla işgücü getirmesini
explanation: 1877 tarihli Fabrika Yasası, çocukların fabrikada çalışmasını yasakladı. Çocuklar çalışmak
  yerine okulda eğitim görecekti. Yasa aynı zamanda çalışanların sağlığını da koruyordu.
