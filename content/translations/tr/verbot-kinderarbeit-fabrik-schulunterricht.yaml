    question_de: Was sollte das Verbot der Kinderarbeit in Fabriken im Jahr 1877 vor allem sicherstellen?
    options_de:
      a: Dass die Fabriken weniger Lohn zahlen müssen
      b: Dass die Kinder zur Schule gehen können
      c: Dass die Kinder zu Hause in jüngerem Alter helfen müssen
      d: Dass die Fabriken mehr Arbeitskräfte aus dem Ausland holen
    explanation_de: Das Fabrikgesetz von 1877 verbot die Arbeit von Kindern in der Fabrik. Die Kinder
      sollten statt zu arbeiten in der Schule unterrichtet werden. Das Gesetz schützte gleichzeitig auch
      die Gesundheit der Arbeitenden.
