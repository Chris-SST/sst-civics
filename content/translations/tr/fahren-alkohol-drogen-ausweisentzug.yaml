id: fahren-alkohol-drogen-ausweisentzug
lang: tr
source_version: 1
question: Alkollü veya uyuşturucu etkisi altında araç kullanan bir kişi neyi riske atar?
options:
  a: Oy hakkını kaybetmeyi
  b: İkamet ettiği belediyeden çıkarılmayı
  c: Sağlık sigortasının iptal edilmesini
  d: Ehliyetinin geri alınmasını
explanation: Araç kullanma yeteneğini yitirmiş olan kişi, trafikte başkalarını tehlikeye atar. Bu nedenle
  yetkili makam ehliyeti geri alabilir. Buna ek olarak para cezaları veya başka cezalar da verilebilir.
