id: todesstrafe-verfassung-verboten
lang: tr
source_version: 1
question: İsviçre'de Federal Anayasa'ya göre ölüm cezası için ne geçerlidir?
options:
  a: Yalnızca cinayet durumunda izin verilir.
  b: Yalnızca savaş zamanında izin verilir.
  c: Geçerli olup olmayacağına kantonlar karar verir.
  d: Yasaktır.
explanation: Federal Anayasa, 10. maddesinde yaşam hakkını korur. Ölüm cezası, ağır suçlar için bile açıkça
  yasaklanmıştır.
