id: einzige-obligatorische-versicherung-krankenversicherung
lang: tr
source_version: 1
question: Aşağıdaki sigortalardan hangisi İsviçre'de tüm sakinler için yasal olarak zorunludur?
options:
  a: Hukuki koruma sigortası
  b: Sağlık sigortası
  c: Seyahat sigortası
  d: Ev eşyası sigortası
explanation: Sağlık sigortası, İsviçre'de ikamet eden tüm kişiler için zorunludur. Ev eşyası, hukuki koruma
  ve seyahat sigortaları ise isteğe bağlıdır.
