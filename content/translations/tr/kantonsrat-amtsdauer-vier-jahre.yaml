id: kantonsrat-amtsdauer-vier-jahre
lang: tr
source_version: 1
question: Zürich Kanton Konseyi (Kantonsrat) üyeleri kaç yıllığına seçilir?
options:
  a: İki yıllığına
  b: Üç yıllığına
  c: Altı yıllığına
  d: Dört yıllığına
explanation: Zürich Kanton Konseyi üyeleri dört yıllık bir görev süresi için seçilir. Ardından genel yenileme
  seçimleri yapılır. Oy hakkına sahip kişiler, parlamentoda kimin yer alacağına o zaman yeniden karar
  verebilir.
