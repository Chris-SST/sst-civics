    question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden im Kanton Zürich?
    options_de:
      a: Er senkt die Steuern in allen Gemeinden auf denselben Satz.
      b: Er bezahlt den Gemeinden die Kosten, die für die Gemeindeversammlungen anfallen.
      c: Er hilft finanziell schwachen Gemeinden oder Gemeinden, die unter der Last hoher Sozialausgaben
        stehen, ihre Aufgaben zu erfüllen.
      d: Er verteilt das Geld des Bundes gleichmässig an alle Einwohnerinnen und Einwohner.
    explanation_de: Die finanziellen Möglichkeiten der Gemeinden sind sehr unterschiedlich. Der Finanzausgleich
      gleicht diese Unterschiede teilweise aus. So können auch Gemeinden mit geringer Steuerkraft oder
      hohen Sozialausgaben ihre Aufgaben erfüllen.
