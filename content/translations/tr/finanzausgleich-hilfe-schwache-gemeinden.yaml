id: finanzausgleich-hilfe-schwache-gemeinden
lang: tr
source_version: 1
question: Zürich kantonundaki belediyeler (Gemeinden) arasındaki mali denkleştirme (Finanzausgleich) ne
  işe yarar?
options:
  a: Tüm belediyelerde vergileri aynı orana düşürür.
  b: Belediyelere belediye halk toplantıları (Gemeindeversammlungen) için oluşan giderleri öder.
  c: Mali açıdan zayıf olan veya yüksek sosyal giderlerin yükü altındaki belediyelerin görevlerini yerine
    getirmelerine yardımcı olur.
  d: Konfederasyonun parasını tüm sakinlere eşit şekilde dağıtır.
explanation: Belediyelerin mali olanakları birbirinden çok farklıdır. Mali denkleştirme bu farkları kısmen
  giderir. Böylece vergi gücü az olan veya sosyal giderleri yüksek olan belediyeler de görevlerini yerine
  getirebilir.
