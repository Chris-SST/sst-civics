question: Sağlık konularından hangi Konfederasyon makamı sorumludur?
options:
  a: Federal Çevre Dairesi (BAFU)
  b: Göç Devlet Sekreterliği (SEM)
  c: Federal İstatistik Dairesi (BFS)
  d: Federal Halk Sağlığı Dairesi (BAG)
explanation: Federal Halk Sağlığı Dairesi (BAG), sağlık konularından sorumlu Konfederasyon makamıdır.
