id: sirenen-ernstfall-radio-einschalten
lang: tr
source_version: 2
question: Acil durumda sirenlerden «Genel Alarm» sesi duyulur (alçalıp yükselen bir uğultu sesi). Ne yapmalısınız?
options:
  a: Hemen evi terk etmek
  b: İtfaiyeyi aramak
  c: Radyo dinlemek ve yetkililerin talimatlarına uymak
  d: Arabayla uzaklaşmak
explanation: Genel Alarm durumunda yetkililer, ne yapılması gerektiği konusunda radyo aracılığıyla bilgi
  verir. Bilgiler Alertswiss uygulamasında da bulunur. Talimatlara uymalı ve acil durum numaralarını gereksiz
  yere aramamalısınız; böylece bu numaralar gerçek acil durumlar için boş kalır.
