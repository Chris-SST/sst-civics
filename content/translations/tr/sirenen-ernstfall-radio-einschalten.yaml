    question_de: Im Notfall ertönt aus den Sirenen das Signal «Allgemeiner Alarm» (ein auf- und abschwellender
      Heulton). Was müssen Sie tun?
    options_de:
      a: Sofort das Haus verlassen
      b: Die Feuerwehr anrufen
      c: Radio hören und den Anweisungen der Behörden folgen
      d: Mit dem Auto wegfahren
    explanation_de: Im Fall eines Allgemeinen Alarms informieren die Behörden per Radio darüber, was zu
      tun ist. Die Informationen sind auch in der Alertswiss-App zu finden. Sie müssen den Anweisungen
      folgen und dürfen die Notrufnummern nicht unnötig anrufen; so bleiben diese Nummern für echte Notfälle
      frei.
