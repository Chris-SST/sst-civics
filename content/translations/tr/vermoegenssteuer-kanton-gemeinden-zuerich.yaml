id: vermoegenssteuer-kanton-gemeinden-zuerich
lang: tr
source_version: 1
question: Zürich kantonu ve belediyeler (Gemeinde), bir kişinin sahip olduğu varlıklar üzerinden, örneğin
  banka mevduatları ve değerli kağıtlar üzerinden, bu vergilerden hangisini alır?
options:
  a: Stopaj vergisi (Verrechnungssteuer)
  b: Katma değer vergisi
  c: Servet vergisi
  d: Akaryakıt vergisi (mineral yağ vergisi)
explanation: Kanton ve belediyeler, gerçek kişilerin servetini vergilendirir. Katma değer vergisi, stopaj
  vergisi ve mineral yağ vergisi Konfederasyon vergileridir.
