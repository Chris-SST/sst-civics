id: kanton-zuerich-nachbarkanton-thurgau
lang: tr
source_version: 1
question: Aşağıdaki kantonlardan hangisi doğrudan Zürih kantonu ile sınırdaştır?
options:
  a: Graubünden
  b: Thurgau
  c: Uri
  d: Vaud
explanation: Thurgau kantonu, Zürih kantonunun kuzeydoğusunda yer alır ve doğrudan onunla sınırdaştır.
  Graubünden, Vaud ve Uri kantonlarının Zürih ile ortak sınırı yoktur.
