    question_de: Welches Ereignis im Jahr 1815 ist für die Neutralität der Schweiz von Bedeutung?
    options_de:
      a: Die Schweiz erklärte allen Nachbarstaaten den Krieg.
      b: Die Grossmächte erkannten die dauernde Neutralität der Schweiz an.
      c: Die Schweiz trat dem Völkerbund bei.
      d: Die Schweiz hielt zum ersten Mal eine Volksabstimmung über die Neutralität ab.
    explanation_de: Am Wiener Kongress von 1815 erkannten die Grossmächte Europas die dauernde Neutralität
      der Schweiz an. Dies verlieh der Neutralität eine internationale Grundlage.
