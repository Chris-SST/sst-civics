question: 1815 yılında gerçekleşen hangi olay İsviçre'nin tarafsızlığı açısından önemlidir?
options:
  a: İsviçre tüm komşu devletlere savaş ilan etti.
  b: Büyük güçler İsviçre'nin kalıcı tarafsızlığını tanıdı.
  c: İsviçre Milletler Cemiyeti'ne katıldı.
  d: İsviçre ilk kez tarafsızlık konusunda bir halk oylaması yaptı.
explanation: 1815'teki Viyana Kongresi'nde Avrupa'nın büyük güçleri İsviçre'nin kalıcı tarafsızlığını
  tanıdı. Bu, tarafsızlığa uluslararası bir temel kazandırdı.
