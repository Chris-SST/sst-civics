id: rechtsprechende-gewalt-bund-bundesgericht
lang: tr
source_version: 1
question: İsviçre'de Konfederasyon düzeyinde en yüksek yargı organı hangi makamdır?
options:
  a: Federal Kançılarya (Bundeskanzlei)
  b: Federal Konsey (Bundesrat)
  c: Federal Meclis (Bundesversammlung)
  d: Federal Mahkeme (Bundesgericht)
explanation: Federal Anayasa, Konfederasyonun yargı yetkisini Federal Mahkeme'ye verir. Federal Mahkeme,
  Konfederasyonun en yüksek yargı makamıdır. Federal Konsey ve Federal Meclis ise sırasıyla yürütme ve
  yasama yetkisini kullanır.
