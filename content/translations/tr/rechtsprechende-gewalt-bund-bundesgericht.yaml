    question_de: Welche Behörde ist in der Schweiz auf Ebene des Bundes das oberste Rechtsprechungsorgan?
    options_de:
      a: Bundeskanzlei
      b: Bundesrat
      c: Bundesversammlung
      d: Bundesgericht
    explanation_de: Die Bundesverfassung überträgt die richterliche Gewalt des Bundes dem Bundesgericht.
      Das Bundesgericht ist die oberste richterliche Behörde des Bundes. Der Bundesrat und die Bundesversammlung
      üben hingegen jeweils die vollziehende bzw. die gesetzgebende Gewalt aus.
