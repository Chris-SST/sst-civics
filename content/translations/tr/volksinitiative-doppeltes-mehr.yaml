    question_de: Was braucht eine eidgenössische Volksinitiative, um in der Abstimmung angenommen zu werden?
    options_de:
      a: Zwei Drittel der Stimmenden müssen Ja sagen
      b: Ja-Stimmen des Bundesrates und der Mehrheit der Stimmenden
      c: Ja-Stimmen der Mehrheit der Stimmenden und der Mehrheit der Kantone
      d: Nur die Ja-Stimmen der Mehrheit der Stimmenden
    explanation_de: 'Eine eidgenössische Volksinitiative will die Bundesverfassung ändern. Deshalb braucht
      sie das doppelte Mehr: Die Mehrheit der Stimmenden (Volksmehr) und die Mehrheit der Kantone (Ständemehr)
      müssen Ja sagen. Bei einer Kantonsinitiative im Kanton Zürich hingegen genügt die Mehrheit der Stimmenden.'
