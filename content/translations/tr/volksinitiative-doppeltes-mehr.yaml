id: volksinitiative-doppeltes-mehr
lang: tr
source_version: 2
question: Federal bir halk girişimi (Volksinitiative) oylamada kabul edilmek için neye ihtiyaç duyar?
options:
  a: Oy kullananların üçte ikisinin evet oyu
  b: Federal Konsey'in (Bundesrat) ve oy kullananların çoğunluğunun evet oyu
  c: Oy kullananların çoğunluğunun ve kantonların çoğunluğunun evet oyu
  d: Yalnızca oy kullananların çoğunluğunun evet oyu
explanation: 'Federal bir halk girişimi (Volksinitiative) Federal Anayasa''yı (Bundesverfassung) değiştirmek
  ister. Bu nedenle çifte çoğunluğa ihtiyaç duyar: Oy kullananların çoğunluğu (halk çoğunluğu (Volksmehr))
  ile kantonların çoğunluğu (kantonlar çoğunluğu (Ständemehr)) evet demelidir. Buna karşılık Zürich kantonundaki
  bir kanton girişiminde oy kullananların çoğunluğu yeterlidir.'
