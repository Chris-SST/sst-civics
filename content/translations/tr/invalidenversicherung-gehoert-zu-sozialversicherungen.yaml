id: invalidenversicherung-gehoert-zu-sozialversicherungen
lang: tr
source_version: 1
question: Aşağıdaki kurumlardan hangisi İsviçre'deki sosyal sigortalar arasında yer alır?
options:
  a: Malullük sigortası (Invalidenversicherung)
  b: Seyahat sigortası
  c: Hukuki koruma sigortası
  d: Ev eşyası sigortası
explanation: Malullük sigortası (IV), devlet tarafından düzenlenen bir sosyal sigortadır. Hastalık veya
  kaza nedeniyle çalışamayan ya da yalnızca sınırlı ölçüde çalışabilen kişileri destekler. Ev eşyası sigortaları,
  seyahat sigortaları ve hukuki koruma sigortaları özel sigortalardır.
