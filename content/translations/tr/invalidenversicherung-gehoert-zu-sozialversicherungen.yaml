    question_de: Welche der folgenden Einrichtungen gehört in der Schweiz zu den Sozialversicherungen?
    options_de:
      a: Invalidenversicherung
      b: Reiseversicherung
      c: Rechtsschutzversicherung
      d: Hausratversicherung
    explanation_de: Die Invalidenversicherung (IV) ist eine vom Staat geregelte Sozialversicherung. Sie
      unterstützt Personen, die wegen Krankheit oder Unfall nicht arbeiten können oder nur in begrenztem
      Mass arbeiten können. Hausratversicherungen, Reiseversicherungen und Rechtsschutzversicherungen
      sind private Versicherungen.
