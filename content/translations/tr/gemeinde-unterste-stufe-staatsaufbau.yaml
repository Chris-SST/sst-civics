    question_de: Welche Ebene befindet sich in der dreistufigen Staatsstruktur der Schweiz ganz unten?
    options_de:
      a: Gemeinde
      b: Bezirk
      c: Kanton
      d: Eidgenossenschaft
    explanation_de: 'Die Schweiz ist dreistufig aufgebaut: Eidgenossenschaft, Kantone und Gemeinden. Die
      Gemeinde ist die unterste Ebene und die Ebene, die den Menschen am nächsten ist. Sie erfüllt viele
      Aufgaben selbst; zum Beispiel die Primarschule, Baubewilligungen oder die Sozialhilfe.'
