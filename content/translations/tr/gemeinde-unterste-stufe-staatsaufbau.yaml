id: gemeinde-unterste-stufe-staatsaufbau
lang: tr
source_version: 2
question: İsviçre'nin üç kademeli devlet yapısında en altta hangi kademe yer alır?
options:
  a: Belediye (Gemeinde)
  b: Bölge
  c: Kanton
  d: Konfederasyon
explanation: 'İsviçre üç kademeli olarak yapılanmıştır: Konfederasyon, kantonlar ve belediyeler. Belediye
  en alt kademedir ve insanlara en yakın olan kademedir. Birçok görevi kendisi yerine getirir; örneğin
  ilkokul, inşaat ruhsatları veya sosyal yardım.'
