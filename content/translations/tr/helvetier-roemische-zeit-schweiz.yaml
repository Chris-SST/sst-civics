id: helvetier-roemische-zeit-schweiz
lang: tr
source_version: 1
question: Romalılar döneminde bugünkü İsviçre topraklarında hangi halk yaşıyordu?
options:
  a: Hunlar
  b: Vikingler
  c: Gotlar
  d: Helvetler
explanation: Helvetler, İsviçre Platosu'nda (Mittelland) yaşayan bir Kelt kabilesiydi. Romalılar onları
  egemenlikleri altına aldı ve bölge Roma İmparatorluğu'nun bir parçası oldu. İsviçre için kullanılan
  Latince Helvetia adı hâlâ onları hatırlatmaktadır.
