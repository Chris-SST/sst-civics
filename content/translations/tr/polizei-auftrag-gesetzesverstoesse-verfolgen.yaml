id: polizei-auftrag-gesetzesverstoesse-verfolgen
lang: tr
source_version: 1
question: Aşağıdakilerden hangisi polisin görevleri arasında yer alır?
options:
  a: Yasa ihlallerinin takibini yapmak
  b: Halk oylaması düzenlemek
  c: Ülke için yasalar çıkarmak
  d: Suçlular hakkında mahkeme kararları vermek
explanation: Polis, güvenlik ve düzeni sağlar ve yasa ihlallerinin takibini yapar. Suçları aydınlatır
  ve sonuçları ilgili makamlara iletir. Yasaları parlamento çıkarır, kararları mahkemeler verir.
