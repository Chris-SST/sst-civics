question: Uluslararası Kızılhaç Komitesi'nin (ICRC/IKRK) merkezi hangi ülkededir?
options:
  a: Hollanda'da
  b: İsviçre'de
  c: Avusturya'da
  d: Belçika'da
explanation: Uluslararası Kızılhaç Komitesi'nin merkezi İsviçre'de, Cenevre'dedir. Komite 1863 yılında
  Cenevre'de kurulmuştur ve silahlı çatışmaların mağdurlarını korur. İsviçre, komitenin çalışmalarını
  destekler.
