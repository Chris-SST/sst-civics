question: 1970 yılında oylanan Schwarzenbach girişimi neyi istiyordu?
options:
  a: Tüm yabancılar için vatandaşlığa kabulü kolaylaştırmak istiyordu.
  b: Yalnızca İtalya'dan göçü yasaklamak istiyordu.
  c: İsviçre'de yaşayan yabancıların oranını sınırlamak istiyordu.
  d: Yabancılar için oy hakkını getirmek istiyordu.
explanation: Girişim, İsviçre'deki yabancıların oranının sınırlanmasını talep ediyordu. 1970'te halk tarafından
  reddedildi. O dönemde göçün ne kadar yoğun tartışıldığını gösteriyor.
