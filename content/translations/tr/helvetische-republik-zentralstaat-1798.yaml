id: helvetische-republik-zentralstaat-1798
lang: tr
source_version: 1
question: 1798'de Napolyon Bonapart'ın etkisi altında İsviçre'ye ne oldu?
options:
  a: Alman İmparatorluğu'nun bir parçası oldu.
  b: Kendi kralı olan bir monarşi oldu.
  c: Kalıcı olarak iki devlete bölündü.
  d: Geçici olarak merkezi bir devlet, yani Helvetik Cumhuriyeti oldu.
explanation: 1798'de Fransız birliklerinin işgalinden sonra Helvetik Cumhuriyeti kuruldu. Merkezden yönetilen
  üniter bir devletti ve eski Eidgenossenschaft'ın (Eski İsviçre Konfederasyonu) yerini geçici olarak
  aldı. Kantonların kendilerine ait neredeyse hiçbir hakkı yoktu.
