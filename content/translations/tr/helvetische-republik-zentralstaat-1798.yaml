    question_de: Was geschah 1798 unter dem Einfluss von Napoleon Bonaparte mit der Schweiz?
    options_de:
      a: Sie wurde ein Teil des Deutschen Reiches.
      b: Sie wurde eine Monarchie mit einem eigenen König.
      c: Sie wurde dauerhaft in zwei Staaten geteilt.
      d: Sie wurde vorübergehend ein zentraler Staat, nämlich die Helvetische Republik.
    explanation_de: 1798 wurde nach der Besetzung durch französische Truppen die Helvetische Republik
      gegründet. Sie war ein zentral regierter Einheitsstaat und ersetzte vorübergehend die alte Eidgenossenschaft
      (die Alte Schweizerische Konföderation). Die Kantone hatten fast keine eigenen Rechte.
