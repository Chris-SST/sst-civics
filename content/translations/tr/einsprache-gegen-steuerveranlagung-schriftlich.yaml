id: einsprache-gegen-steuerveranlagung-schriftlich
lang: tr
source_version: 1
question: Vergi mükellefi bir kişi vergi tarhiyatını kabul etmiyor. Ne yapabilir?
options:
  a: Belediye halk toplantısında (Gemeindeversammlung) oylama yaptırabilir.
  b: Başka hiçbir işlem yapmadan ödemeyi reddedebilir.
  c: Vergi dairesine yazılı olarak itiraz edebilir.
  d: Federal Konsey'e (Bundesrat) bir halk girişimi (Volksinitiative) sunabilir.
explanation: Vergi tarhiyatına karşı itiraz yolu mevcuttur. İtiraz, vergi dairesine yazılı olarak ve belirli
  bir süre içinde yapılmalıdır.
