    question_de: Eine steuerpflichtige Person akzeptiert die Steuerveranlagung nicht. Was kann sie tun?
    options_de:
      a: Sie kann an der Gemeindeversammlung eine Abstimmung durchführen lassen.
      b: Sie kann die Zahlung verweigern, ohne eine weitere Handlung vorzunehmen.
      c: Sie kann beim Steueramt schriftlich Einsprache erheben.
      d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
    explanation_de: Gegen die Steuerveranlagung gibt es einen Einspracheweg. Die Einsprache muss schriftlich
      beim Steueramt und innerhalb einer bestimmten Frist erfolgen.
