question: İsviçre Konfederasyonu Latince'de ne diye adlandırılır?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: İsviçre'nin Latince adı Confoederatio Helvetica'dır. CH kısaltması buradan gelir; bu kısaltmayı
  örneğin araç plakalarında ve internet adreslerinde (.ch) görürsünüz. Latince ad kullanılır, çünkü tarafsızdır
  ve dört ulusal dilden hiçbirine öncelik vermez.
