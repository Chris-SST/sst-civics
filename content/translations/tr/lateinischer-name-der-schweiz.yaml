    question_de: Wie wird die Schweizerische Eidgenossenschaft auf Latein genannt?
    options_de:
      a: Helvetia Unita
      b: Res Publica Helvetica
      c: Confoederatio Helvetica
      d: Respublica Alpina
    explanation_de: Der lateinische Name der Schweiz ist Confoederatio Helvetica. Das Kürzel CH stammt
      daher; dieses Kürzel sieht man zum Beispiel auf Fahrzeugkennzeichen und in Internetadressen (.ch).
      Der lateinische Name wird verwendet, weil er neutral ist und keiner der vier Landessprachen den
      Vorrang gibt.
