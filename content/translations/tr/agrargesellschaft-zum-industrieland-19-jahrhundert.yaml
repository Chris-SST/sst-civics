question: İsviçre 19. yüzyılda ekonomik açıdan nasıl değişti?
options:
  a: Ağırlıklı olarak sömürgelerle yapılan ticaretle geçiniyordu.
  b: 1900'e kadar neredeyse yalnızca bir çiftçi ülkesi olarak kaldı.
  c: Bir sanayi ülkesinden tarım toplumuna dönüştü.
  d: Bir tarım toplumundan sanayi ülkesine dönüştü.
explanation: 19. yüzyılda iş gücü tarımdan fabrikalara kaydı. Demiryolu gibi yeni ulaşım yolları bu değişimi
  destekledi. Böylece tarım ülkesi bir sanayi ülkesine dönüştü.
