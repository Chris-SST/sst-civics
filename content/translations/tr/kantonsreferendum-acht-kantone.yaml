id: kantonsreferendum-acht-kantone
lang: tr
source_version: 1
question: 50.000 oy hakkına sahip kişinin yanı sıra, bir federal yasaya karşı isteğe bağlı referandum
  talebinde bir başka kim bulunabilir?
options:
  a: Sekiz kanton
  b: Üç büyük parti birlikte
  c: Federal Konsey (Bundesrat)
  d: Federal Mahkeme (Bundesgericht)
explanation: Federal Anayasa'ya göre sekiz kanton da bir federal yasa hakkında halk oylaması talep edebilir.
  Buna kanton referandumu denir. Nadiren kullanılır, ancak kantonların federal devlet içinde söz hakkına
  sahip olduğunu gösterir.
