    question_de: Wie viel Zeit haben die Referendumskomitees, um Unterschriften für ein fakultatives Referendum
      gegen ein Bundesgesetz zu sammeln?
    options_de:
      a: 60 Tage
      b: 18 Monate
      c: 100 Tage
      d: 30 Tage
    explanation_de: Die Frist beträgt 100 Tage ab der amtlichen Veröffentlichung des Erlasses. 18 Monate
      gelten hingegen für die Unterschriftensammlung bei einer Volksinitiative.
