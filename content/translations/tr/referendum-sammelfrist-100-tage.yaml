id: referendum-sammelfrist-100-tage
lang: tr
source_version: 1
question: Konfederasyon yasasına karşı isteğe bağlı bir referandum için imzaları toplamak üzere referandum
  komitelerinin ne kadar süresi vardır?
options:
  a: 60 gün
  b: 18 ay
  c: 100 gün
  d: 30 gün
explanation: Süre, düzenlemenin resmî olarak yayımlanmasından itibaren 100 gündür. 18 ay ise buna karşılık
  bir halk girişimi (Volksinitiative) için imza toplamada geçerlidir.
