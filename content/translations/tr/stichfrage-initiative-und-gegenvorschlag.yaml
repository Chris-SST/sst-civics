id: stichfrage-initiative-und-gegenvorschlag
lang: tr
source_version: 1
question: Bir halk girişimi (Volksinitiative) ve doğrudan karşı öneri hakkında yapılan oylamada bir belirleyici
  soru bulunur. Bu sorunun amacı nedir?
options:
  a: Oylamanın tekrarlanıp tekrarlanmayacağına karar verir
  b: Kantonların oylamaya hiç katılıp katılamayacağına karar verir
  c: İkisi de kabul edilirse hangi tasarının geçerli olacağına karar verir
  d: İmzaların bir kez daha kontrol edilip edilmeyeceğine karar verir
explanation: Oy hakkı olan kişiler hem girişime hem de karşı öneriye evet diyebilir. Belirleyici soru
  ile, ikisi de kabul edilirse hangi tasarının yürürlüğe girmesini istediklerini belirtirler. Böylece
  birbirine benzeyen iki tasarı arasında oylar kaybolmaz.
