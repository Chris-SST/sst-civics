    question_de: Bei der Abstimmung über eine Volksinitiative und einen direkten Gegenvorschlag gibt es
      eine Stichfrage. Was ist der Zweck dieser Frage?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt wird oder nicht
      b: Sie entscheidet, ob die Kantone überhaupt an der Abstimmung teilnehmen können oder nicht
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften noch einmal überprüft werden oder nicht
    explanation_de: Die Stimmberechtigten können sowohl zur Initiative als auch zum Gegenvorschlag Ja
      sagen. Mit der Stichfrage geben sie an, welche Vorlage sie in Kraft treten lassen möchten, wenn
      beide angenommen werden. So gehen die Stimmen zwischen zwei einander ähnlichen Vorlagen nicht verloren.
