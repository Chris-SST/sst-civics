    question_de: Was bedeutet die Gleichstellung von Frau und Mann grundsätzlich?
    options_de:
      a: Frauen und Männer haben grundsätzlich die gleichen Rechte.
      b: Frauen und Männer haben in allen Lebensbereichen die gleichen Pflichten, aber unterschiedliche
        Rechte.
      c: Frauen und Männer verdienen in jedem Beruf genau gleich viel.
      d: Frauen und Männer müssen alle Aufgaben in der Familie gleichmässig aufteilen.
    explanation_de: Gleichberechtigung bedeutet, dass beide Geschlechter grundsätzlich die gleichen Rechte
      haben. Dieser Grundsatz ist in der Bundesverfassung verankert. Der Grundsatz sagt nichts darüber
      aus, wie die Familien ihre Aufgaben im Einzelnen aufteilen.
