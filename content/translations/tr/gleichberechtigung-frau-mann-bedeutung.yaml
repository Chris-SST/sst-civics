id: gleichberechtigung-frau-mann-bedeutung
lang: tr
source_version: 1
question: Kadın ve erkek eşitliği ilke olarak ne anlama gelir?
options:
  a: Kadınlar ve erkekler ilke olarak aynı haklara sahiptir.
  b: Kadınlar ve erkekler yaşamın her alanında aynı yükümlülüklere, ancak farklı haklara sahiptir.
  c: Kadınlar ve erkekler her meslekte tam olarak aynı kazancı elde eder.
  d: Kadınlar ve erkekler ailedeki tüm görevleri eşit olarak paylaşmak zorundadır.
explanation: Eşit haklılık, her iki cinsiyetin de ilke olarak aynı haklara sahip olduğu anlamına gelir.
  Bu ilke Federal Anayasa'da (Bundesverfassung) güvence altına alınmıştır. İlke, ailelerin görevlerini
  ayrıntılı olarak nasıl paylaşacakları konusunda hiçbir şey söylemez.
