id: anmeldung-wohngemeinde-bei-zuzug
lang: tr
source_version: 1
question: Bir belediyeye (Gemeinde) yerleşen kişiler ne yapmak zorundadır?
options:
  a: İkamet ettikleri belediyeye kayıt yaptırmak zorundadırlar.
  b: Orduya başvurmak zorundadırlar.
  c: Federal Konsey'e (Bundesrat) başvurmak zorundadırlar.
  d: Konfederasyonun vergi idaresine başvurmak zorundadırlar.
explanation: Yeni bir yere taşınan kişi, ikamet ettiği belediyeye kayıt yaptırmak zorundadır. Bu işlem
  genellikle nüfus kayıt dairesinde (Einwohnerkontrolle) yapılır. Böylece belediye, sakinleri hakkında
  bilgi sahibi olur.
