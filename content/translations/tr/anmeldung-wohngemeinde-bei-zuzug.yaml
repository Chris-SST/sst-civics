    question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
    options_de:
      a: Sie müssen sich bei der Gemeinde, in der sie wohnen, anmelden.
      b: Sie müssen sich bei der Armee melden.
      c: Sie müssen sich an den Bundesrat wenden.
      d: Sie müssen sich an die Steuerverwaltung der Eidgenossenschaft wenden.
    explanation_de: Wer an einen neuen Ort zieht, muss sich bei der Gemeinde, in der er wohnt, anmelden.
      Dieser Vorgang wird in der Regel beim Einwohnerkontrolle-Amt (Einwohnerkontrolle) durchgeführt.
      So hat die Gemeinde Informationen über ihre Einwohner.
