id: hundehaltung-abgabe-hundesteuer
lang: tr
source_version: 3
question: Zürich kantonunda köpek besleyen kişiler için ne geçerlidir?
options:
  a: Her yıl belediyeye (Gemeinde) köpek vergisi ödemek zorundadırlar.
  b: Yalnızca köpeği satın alırken bir kez Konfederasyona harç ödemek zorundadırlar.
  c: Köpekle birlikte her yıl kantonda bir sınava girmek zorundadırlar.
  d: Yalnızca köpekle para kazandıkları takdirde vergi ödemek zorundadırlar.
explanation: Zürich kantonunda köpek besleyen kişi, her yıl köpek için bir vergi öder; buna köpek vergisi
  (Hundesteuer) denir. Bu para Konfederasyona değil, ikamet edilen belediyeye gider. Bu vergi tek seferlik
  değildir ve köpeği yalnızca özel olarak besleyenler için de geçerlidir.
