    question_de: Was gilt für Personen, die im Kanton Zürich einen Hund halten?
    options_de:
      a: Sie müssen jedes Jahr der Gemeinde eine Hundesteuer bezahlen.
      b: Sie müssen nur beim Kauf des Hundes einmalig eine Gebühr an den Bund bezahlen.
      c: Sie müssen mit dem Hund jedes Jahr im Kanton eine Prüfung ablegen.
      d: Sie müssen nur dann Steuern bezahlen, wenn sie mit dem Hund Geld verdienen.
    explanation_de: Eine Person, die im Kanton Zürich einen Hund hält, bezahlt jedes Jahr eine Steuer
      für den Hund; diese heisst Hundesteuer. Dieses Geld geht nicht an den Bund, sondern an die Wohngemeinde.
      Diese Steuer ist nicht einmalig und gilt auch für diejenigen, die den Hund nur privat halten.
