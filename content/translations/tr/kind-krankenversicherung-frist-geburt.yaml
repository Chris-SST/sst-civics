id: kind-krankenversicherung-frist-geburt
lang: tr
source_version: 1
question: İsviçre'de ikamet eden bir çocuk için doğumdan itibaren hangi süre içinde sağlık sigortası yaptırılmış
  olması gerekir?
options:
  a: 12 ay içinde
  b: 3 ay içinde
  c: 14 gün içinde
  d: 6 ay içinde
explanation: Ebeveynlerin, çocuk için doğumdan sonraki üç ay içinde bir sağlık sigortası yaptırması gerekir.
  Süreye uyulursa sigorta koruması geriye dönük olarak doğumdan itibaren geçerlidir.
