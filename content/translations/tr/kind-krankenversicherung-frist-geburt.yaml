    question_de: Innerhalb welcher Frist ab der Geburt muss für ein in der Schweiz wohnhaftes Kind eine
      Krankenversicherung abgeschlossen worden sein?
    options_de:
      a: Innerhalb von 12 Monaten
      b: Innerhalb von 3 Monaten
      c: Innerhalb von 14 Tagen
      d: Innerhalb von 6 Monaten
    explanation_de: Die Eltern müssen für das Kind innerhalb von drei Monaten nach der Geburt eine Krankenversicherung
      abschliessen. Wird die Frist eingehalten, gilt der Versicherungsschutz rückwirkend ab der Geburt.
