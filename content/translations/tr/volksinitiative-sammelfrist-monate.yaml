    at: *id001
    source_version: 1
    question_de: Wie viel Zeit haben die Initianten, um für eine eidgenössische Volksinitiative Unterschriften
      zu sammeln?
    options_de:
      a: 6 Monate
      b: 12 Monate
      c: 18 Monate
      d: 36 Monate
    explanation_de: Die Frist für die Unterschriftensammlung beträgt 18 Monate ab dem Datum der Veröffentlichung
      im Bundesblatt. Wenn die Initianten innerhalb dieser Frist die erforderlichen 100 000 Unterschriften
      nicht sammeln können, kommt die Initiative nicht zustande.
