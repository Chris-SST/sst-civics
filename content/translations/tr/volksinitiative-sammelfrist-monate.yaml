id: volksinitiative-sammelfrist-monate
lang: tr
source_version: 1
question: Girişim sahiplerinin federal bir halk girişimi (Volksinitiative) için imza toplamak üzere ne
  kadar süresi vardır?
options:
  a: 6 ay
  b: 12 ay
  c: 18 ay
  d: 36 ay
explanation: İmza toplama süresi, Federal Gazete'de (Bundesblatt) yayımlanma tarihinden itibaren 18 aydır.
  Girişim sahipleri bu süre içinde gerekli 100.000 imzayı toplayamazsa girişim gerçekleşmez.
status: approved
