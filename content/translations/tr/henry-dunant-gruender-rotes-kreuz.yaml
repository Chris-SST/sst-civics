    question_de: Wer gilt als Gründer des Roten Kreuzes in Genf?
    options_de:
      a: Alfred Escher
      b: Johann Heinrich Pestalozzi
      c: Huldrych Zwingli
      d: Henry Dunant
    explanation_de: Der Genfer Henry Dunant sah 1859 nach der Schlacht von Solferino, dass viele Verwundete
      ohne Hilfe zurückgeblieben waren. Deshalb setzte er sich für ihre Pflege ein, und 1863 wurde in
      Genf das Rote Kreuz gegründet. Dafür erhielt Dunant 1901 zusammen mit Frédéric Passy den ersten
      Friedensnobelpreis.
