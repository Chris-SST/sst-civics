question: Cenevre'deki Kızılhaç'ın kurucusu kim sayılır?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: Cenevreli Henry Dunant, 1859'da Solferino Savaşı'ndan sonra birçok yaralının yardım görmeden
  kaldığını gördü. Bu nedenle onların bakımı için çaba gösterdi ve 1863'te Cenevre'de Kızılhaç kuruldu.
  Bunun için Dunant, 1901'de Frédéric Passy ile birlikte ilk Nobel Barış Ödülü'nü aldı.
