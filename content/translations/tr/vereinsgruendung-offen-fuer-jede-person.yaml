    question_de: Wer kann in der Schweiz einen Verein gründen?
    options_de:
      a: Nur Personen, die in der Gemeinde wohnhaft sind
      b: Jede Person
      c: Nur Schweizer Staatsbürger
      d: Nur Personen mit einer Niederlassungsbewilligung (C-Bewilligung)
    explanation_de: Die Gründung eines Vereins steht in der Schweiz jeder Person offen. Die Vereinigungsfreiheit
      ist durch die Bundesverfassung gewährleistet. Die Staatsbürgerschaft oder der Aufenthaltsstatus
      spielt dafür keine Rolle.
