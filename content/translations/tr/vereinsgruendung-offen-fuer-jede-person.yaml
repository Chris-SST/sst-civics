id: vereinsgruendung-offen-fuer-jede-person
lang: tr
source_version: 1
question: İsviçre'de kimler dernek kurabilir?
options:
  a: Yalnızca belediyede (Gemeinde) ikamet eden kişiler
  b: Her kişi
  c: Yalnızca İsviçre vatandaşları
  d: Yalnızca yerleşim izni (C izni) (Niederlassungsbewilligung) sahibi kişiler
explanation: İsviçre'de dernek kurmak her kişiye açıktır. Dernek kurma özgürlüğü Federal Anayasa (Bundesverfassung)
  ile güvence altına alınmıştır. Vatandaşlık veya oturum statüsü bunun için önemli değildir.
