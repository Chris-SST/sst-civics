id: nutzungsplanung-ortsebene-gemeinden
lang: tr
source_version: 1
question: Zürich kantonunda yerel düzeyde, arazinin nasıl kullanılacağını, örneğin konut bölgelerinin
  ve ticaret bölgelerinin nerede yer alacağını kim planlar?
options:
  a: İsviçre Federal Meclis (Bundesversammlung)
  b: Kanton polisi
  c: Belediyeler (Gemeinden)
  d: Yalnızca ilçe konseyleri
explanation: Belediyeler, kendi alanları için arazi kullanım planlamasını, örneğin inşaat ve bölge düzenlemesini
  çıkarır. Bunu yaparken Konfederasyon'un ve kantonun getirdiği kurallara uyarlar. Böylece yerleşim yerinin
  nasıl gelişeceğinin belirlenmesine katkıda bulunurlar.
