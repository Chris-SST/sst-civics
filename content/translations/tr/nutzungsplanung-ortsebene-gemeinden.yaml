    source_version: 1
    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie das Land genutzt werden soll, zum Beispiel
      wo Wohnzonen und Gewerbezonen liegen sollen?
    options_de:
      a: Die Schweizerische Bundesversammlung
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Nur die Bezirksräte
    explanation_de: Die Gemeinden erlassen für ihr Gebiet die Landnutzungsplanung, zum Beispiel die Bau-
      und Zonenordnung. Dabei halten sie sich an die Vorschriften des Bundes und des Kantons. So tragen
      sie dazu bei, zu bestimmen, wie sich der Siedlungsraum entwickeln wird.
