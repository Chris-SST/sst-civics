id: datenschutz-verletzung-ohne-einverstaendnis
lang: tr
source_version: 1
question: Hangi durumda veri koruma ihlal edilmiş olur?
options:
  a: Bir kişiye ait özel bilgiler, kişinin rızası olmadan ve yasal bir dayanak bulunmadan açıklanır.
  b: Bir makam, bir yasanın gerektirdiği şekilde verileri kaydeder.
  c: Bir kişi kendi adresini gönüllü olarak verir.
  d: Bir kişi, fotoğrafının yayımlanmasına açıkça izin verir.
explanation: Özel hayatın gizliliğinin korunması, kişisel verilerin kötüye kullanılmasına karşı korunmayı
  da kapsar. Özel bilgiler yalnızca ilgili kişinin rızasıyla veya bir yasaya dayanarak açıklanabilir.
  İkisi de yoksa bir ihlal söz konusudur.
