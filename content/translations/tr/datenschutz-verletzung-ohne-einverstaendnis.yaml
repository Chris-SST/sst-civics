    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Informationen, die einer Person gehören, werden ohne die Einwilligung der Person und
        ohne dass eine gesetzliche Grundlage vorhanden ist, offengelegt.
      b: Eine Behörde erfasst Daten so, wie es ein Gesetz verlangt.
      c: Eine Person gibt ihre eigene Adresse freiwillig an.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz der Privatsphäre umfasst auch den Schutz vor dem Missbrauch persönlicher
      Daten. Private Informationen dürfen nur mit der Einwilligung der betroffenen Person oder aufgrund
      eines Gesetzes offengelegt werden. Fehlt beides, liegt eine Verletzung vor.
