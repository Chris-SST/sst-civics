    source_version: 2
    question_de: Ein Arbeitnehmer hält die Kündigung seines Arbeitsvertrags für ungerechtfertigt und möchte
      dagegen vorgehen. Welche Instanz befasst sich mit solchen Streitigkeiten aus dem Arbeitsverhältnis?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungs- und Konkursamt
    explanation_de: Das Arbeitsgericht ist für Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern
      zuständig. Auch ein Streit, der wegen einer Kündigung entsteht, gehört dazu. Das RAV hingegen hilft
      bei der Stellensuche.
