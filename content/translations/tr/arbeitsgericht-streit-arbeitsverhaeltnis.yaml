id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: tr
source_version: 2
question: Bir çalışan, iş sözleşmesinin feshini haksız buluyor ve buna karşı harekete geçmek istiyor.
  İş ilişkisinden doğan bu tür uyuşmazlıklarla hangi kurum ilgilenir?
options:
  a: Bölgesel İş Bulma Merkezi (RAV)
  b: Karayolu Trafik Dairesi
  c: İş Mahkemesi
  d: İcra ve İflas Dairesi
explanation: İş Mahkemesi, işverenler ile çalışanlar arasındaki uyuşmazlıklara bakmakla görevlidir. Bir
  fesih nedeniyle çıkan anlaşmazlık da buna dahildir. RAV ise buna karşılık iş aramada yardımcı olur.
