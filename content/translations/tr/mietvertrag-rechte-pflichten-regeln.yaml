id: mietvertrag-rechte-pflichten-regeln
lang: tr
source_version: 1
question: Bir kira sözleşmesinde neler belirlenir?
options:
  a: Binadaki komşuların hakları
  b: Kiracıların vergilerinin tutarı
  c: Belediyenin (Gemeinde) kiracılara karşı yükümlülükleri
  d: Kiraya verenlerin ve kiracıların hak ve yükümlülükleri
explanation: Kira sözleşmesi, kiraya veren kişi ile kiracı arasındaki ilişkiyi düzenler. Buna örneğin
  kira bedeli ve kira süresi dahildir. Borçlar Kanunu (Obligationenrecht) bu konudaki yasal kuralları
  içerir.
