id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
lang: tr
source_version: 1
question: Zürich kantonunda bir kişinin ne kadar gelir ve servet vergisi ödeyeceği esas olarak neye bağlıdır?
options:
  a: Vergiye tabi gelire ve servete
  b: Kişinin mesleğine
  c: Belediye (Gemeinde) içindeki ikamet süresine
  d: Oy hakkının kullanılma sayısına
explanation: Vergi, vergiye tabi gelir ve servet üzerinden hesaplanır. Daha fazla kazanan veya daha fazla
  mal varlığına sahip olan kişi, kural olarak daha fazla vergi öder.
