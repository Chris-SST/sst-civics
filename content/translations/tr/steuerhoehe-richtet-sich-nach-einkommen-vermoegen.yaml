    question_de: Wovon hängt es im Kanton Zürich hauptsächlich ab, wie viel Einkommens- und Vermögenssteuer
      eine Person bezahlt?
    options_de:
      a: Vom steuerbaren Einkommen und Vermögen
      b: Vom Beruf der Person
      c: Von der Dauer des Wohnsitzes in der Gemeinde
      d: Von der Anzahl der Ausübungen des Stimmrechts
    explanation_de: Die Steuer wird auf dem steuerbaren Einkommen und Vermögen berechnet. Eine Person,
      die mehr verdient oder mehr Vermögen besitzt, bezahlt in der Regel mehr Steuern.
