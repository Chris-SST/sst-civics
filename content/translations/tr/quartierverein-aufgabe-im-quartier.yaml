    question_de: Was ist die typische Aufgabe eines Quartiervereins in einer Gemeinde oder Stadt im Kanton
      Zürich?
    options_de:
      a: Er vertritt die Anliegen der Quartierbewohner gegenüber den Behörden und fördert das Zusammenleben.
      b: Er führt die Einwohnerkontrolle für das Quartier.
      c: Er erhebt Steuern von den Bewohnern des Quartiers.
      d: Er erteilt die Bewilligung für Baugesuche im Quartier.
    explanation_de: Der Quartierverein ist ein Verein, der durch den freiwilligen Zusammenschluss von
      Bewohnern entsteht. Er leitet die Anliegen des Quartiers an die Behörden weiter und organisiert
      Veranstaltungen, die das Zusammenleben stärken. Aufgaben, die auf öffentlicher Gewalt beruhen, wie
      Steuern, Baubewilligungen oder Einwohnerkontrolle, gehören zur Gemeinde.
