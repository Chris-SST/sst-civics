id: quartierverein-aufgabe-im-quartier
lang: tr
source_version: 1
question: Zürich kantonundaki bir belediyede (Gemeinde) veya şehirde bir mahalle derneğinin (Quartierverein)
  tipik görevi nedir?
options:
  a: Mahalle sakinlerinin taleplerini yetkililer nezdinde temsil eder ve birlikte yaşamayı destekler.
  b: Mahalle için nüfus kayıt işlemlerini (Einwohnerkontrolle) yürütür.
  c: Mahallenin sakinlerinden vergi toplar.
  d: Mahalledeki inşaat başvurularına izin verir.
explanation: Mahalle derneği, sakinlerin gönüllü olarak bir araya gelmesiyle oluşan bir birliktir. Mahallenin
  taleplerini yetkililere iletir ve birlikte yaşamayı güçlendiren etkinlikler düzenler. Vergi, inşaat
  ruhsatı veya nüfus kayıt işlemleri gibi kamu gücüne dayanan görevler belediyeye aittir.
