    question_de: Wer ist in der Schweiz grundsätzlich steuerpflichtig?
    options_de:
      a: Personen, die in der Schweiz wohnen
      b: Nur Personen, die ein Unternehmen führen
      c: Nur Personen, die das Schweizer Bürgerrecht besitzen
      d: Nur Personen, die das Stimmrecht haben
    explanation_de: Die Steuerpflicht hängt vom Wohnort ab, nicht von der Staatsangehörigkeit. Auch in
      der Schweiz wohnhafte Ausländer zahlen Steuern. Das Stimmrecht spielt dabei keine Rolle.
