id: steuerpflicht-wohnhafte-personen-schweiz
lang: tr
source_version: 1
question: İsviçre'de prensip olarak kimler vergi ödemekle yükümlüdür?
options:
  a: İsviçre'de ikamet eden kişiler
  b: Yalnızca bir işletme yöneten kişiler
  c: Yalnızca İsviçre vatandaşlığına (Bürgerrecht) sahip kişiler
  d: Yalnızca oy hakkına sahip kişiler
explanation: Vergi yükümlülüğü ikamet yerine bağlıdır, vatandaşlığa bağlı değildir. İsviçre'de ikamet
  eden yabancılar da vergi öder. Oy hakkının bu konuda hiçbir önemi yoktur.
