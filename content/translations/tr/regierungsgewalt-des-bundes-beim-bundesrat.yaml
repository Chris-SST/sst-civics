question: Konfederasyon düzeyinde en yüksek hükümet yetkisini hangi makam kullanır?
options:
  a: Federal Konsey (Bundesrat)
  b: Ulusal Konsey (Nationalrat)
  c: Federal Kançılarya (Bundeskanzlei)
  d: Federal Mahkeme (Bundesgericht)
explanation: Federal Anayasa'ya göre Federal Konsey, Konfederasyonun en yüksek yönetici ve yürütücü makamıdır.
  Parlamento yasaları yapar, Federal Mahkeme ise yargılama yapar.
