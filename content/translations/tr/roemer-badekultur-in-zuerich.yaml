id: roemer-badekultur-in-zuerich
lang: tr
source_version: 1
question: Romalılar Zürih'e hangi yeniliği getirdi?
options:
  a: Matbaayı
  b: Loncaları (Zünfte)
  c: Hamam kültürünü
  d: Reform hareketini
explanation: Romalılar Zürih'e hamam kültürünü, yani Roma örneğine göre yapılmış kamusal hamamları getirdi.
  Loncalar, matbaa ve Reform hareketi ise ancak Orta Çağ'a ve erken Yeni Çağ'a aittir.
