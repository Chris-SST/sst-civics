id: nationalfeiertag-1-august-bundesweit
lang: tr
source_version: 1
question: Hangi gün İsviçre'nin tamamında yasal olarak işin tatil edildiği resmi bir tatil günüdür?
options:
  a: 2 Ocak (Berchtoldstag)
  b: Fasnachtsmontag (Karnaval Pazartesisi)
  c: Kutsal Cuma (Karfreitag)
  d: Ulusal bayram olan 1 Ağustos
explanation: 1 Ağustos ulusal bayramdır ve ülkenin tamamında resmi tatil günü sayılır. Kutsal Cuma veya
  Berchtoldstag gibi diğer tatil günlerinin çoğunu kantonlar kendileri düzenler ve bu günler her yerde
  tatil değildir.
