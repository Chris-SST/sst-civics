    question_de: Welcher Tag ist ein offizieller Feiertag, an dem in der gesamten Schweiz gesetzlich die
      Arbeit ruht?
    options_de:
      a: 2. Januar (Berchtoldstag)
      b: Fasnachtsmontag (Karnevalsmontag)
      c: Karfreitag (Karfreitag)
      d: 1. August, der Nationalfeiertag
    explanation_de: Der 1. August ist der Nationalfeiertag und gilt im ganzen Land als offizieller Feiertag.
      Die meisten anderen Feiertage wie der Karfreitag oder der Berchtoldstag regeln die Kantone selbst,
      und diese Tage sind nicht überall frei.
