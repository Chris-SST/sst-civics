    question_de: Was ist ein Arbeitszeugnis?
    options_de:
      a: Die Bestätigung des Arztes, die belegt, dass die Person nicht arbeiten kann
      b: Das Dokument des Arbeitgebers, das die Leistung und das Verhalten der Arbeitnehmerin oder des
        Arbeitnehmers beurteilt
      c: Die Arbeitsbewilligung des Migrationsamtes in der Schweiz
      d: Der jährliche Lohnausweis für die Steuererklärung
    explanation_de: Das Arbeitszeugnis wird vom Arbeitgeber ausgestellt. Es beschreibt die Art und die
      Dauer der ausgeübten Arbeit und beurteilt die Leistung und das Verhalten. Arbeitnehmende können
      es jederzeit verlangen.
