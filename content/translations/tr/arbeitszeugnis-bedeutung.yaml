id: arbeitszeugnis-bedeutung
lang: tr
source_version: 1
question: İş referans yazısı (Arbeitszeugnis) nedir?
options:
  a: Doktorun, kişinin çalışamayacağını belgeleyen onayı
  b: İşverenin, çalışanın performansını ve davranışlarını değerlendiren belgesi
  c: Göç dairesinin İsviçre'de çalışma izni
  d: Vergi beyannamesi için yıllık maaş belgesi
explanation: İş referans yazısını (Arbeitszeugnis) işveren düzenler. Yapılan işin türünü ve süresini açıklar,
  performansı ve davranışları değerlendirir. Çalışanlar bunu istedikleri zaman talep edebilir.
