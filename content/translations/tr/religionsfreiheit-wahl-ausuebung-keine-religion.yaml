id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: tr
source_version: 1
question: Bir kadın İsviçre'ye taşınıyor ve dinini kendisi seçmek istiyor. Hiçbir dine mensup olmamayı
  da düşünüyor. Federal Anayasa bu konuda ona neyi güvence altına alır?
options:
  a: Yalnızca kantonda kamu hukuku kapsamında tanınmış bir dine mensup olabilir.
  b: Dinini özgürce seçebilir, uygulayabilir veya hiçbir dine mensup olmayabilir.
  c: Dinini özel olarak seçebilir, ancak hiçbir yerde başkalarıyla birlikte uygulayamaz.
  d: Tanınmış bir din konusunda belediye (Gemeinde) nezdinde karar vermek zorundadır.
explanation: İnanç ve vicdan özgürlüğü, Federal Anayasa'nın 15. maddesinde güvence altına alınmıştır.
  Herkes dinini özgürce seçebilir, tek başına veya başkalarıyla birlikte uygulayabilir ya da hiçbir dine
  mensup olmayabilir. Hiç kimse bir dini topluluğa mensup olmaya zorlanamaz.
