    question_de: Eine Frau zieht in die Schweiz und möchte ihre Religion selbst wählen. Sie erwägt auch,
      keiner Religion anzugehören. Was garantiert ihr die Bundesverfassung in dieser Hinsicht?
    options_de:
      a: Sie kann nur einer im Kanton öffentlich-rechtlich anerkannten Religion angehören.
      b: Sie kann ihre Religion frei wählen, ausüben oder keiner Religion angehören.
      c: Sie kann ihre Religion privat wählen, aber sie nirgendwo gemeinsam mit anderen ausüben.
      d: Sie muss sich bei der Gemeinde für eine anerkannte Religion entscheiden.
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung garantiert.
      Jede Person kann ihre Religion frei wählen, allein oder zusammen mit anderen ausüben oder keiner
      Religion angehören. Niemand kann gezwungen werden, einer Religionsgemeinschaft anzugehören.
