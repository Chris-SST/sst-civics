question: Hangi ülke İsviçre'nin batısında yer alır ve İsviçre ile sınır komşusudur?
options:
  a: Almanya
  b: İtalya
  c: Fransa
  d: Avusturya
explanation: İsviçre, batıda ve kuzeybatıda Fransa ile komşudur. Almanya kuzeyde, Avusturya ve Lihtenştayn
  doğuda, İtalya ise güneyde yer alır.
