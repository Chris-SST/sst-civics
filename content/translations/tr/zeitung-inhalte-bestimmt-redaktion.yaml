id: zeitung-inhalte-bestimmt-redaktion
lang: tr
source_version: 1
question: İsviçre'de bir gazetede hangi içeriklerin yayımlanacağına kim karar verir?
options:
  a: Federal Mahkeme (Bundesgericht)
  b: Gazetenin yayımlandığı belediye (Gemeinde)
  c: Gazetenin yayın kurulu
  d: Federal Konsey (Bundesrat)
explanation: Medya özgürlüğü gazeteleri devletin etkisinden korur. Yayın kurulu neyi yayımlayacağına kendisi
  karar verir. Federal Anayasa sansürü yasaklar.
