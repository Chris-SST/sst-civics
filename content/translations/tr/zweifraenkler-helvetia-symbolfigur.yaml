id: zweifraenkler-helvetia-symbolfigur
lang: tr
source_version: 1
question: İki franklık madeni parada hangi simge figür yer almaktadır?
options:
  a: Matterhorn
  b: Helvetia
  c: Wilhelm Tell
  d: Bir İsviçre Federal Konsey (Bundesrat) üyesi
explanation: İsviçre'nin iki franklık madeni parasında, Konfederasyonun (Eidgenossenschaft) kadın simge
  figürü olan Helvetia görülür. Helvetia, ulus olarak İsviçre'yi temsil eder. Helvetia ayrıca diğer madeni
  paralarda ve pullarda da yer alır.
