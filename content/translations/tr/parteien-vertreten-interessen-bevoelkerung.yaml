id: parteien-vertreten-interessen-bevoelkerung
lang: tr
source_version: 1
question: Demokraside siyasi partilerin görevi nedir?
options:
  a: Uyuşmazlık durumlarında hüküm verirler
  b: Halkın farklı çıkarlarını temsil ederler
  c: Federal oylamaları gerçekleştirirler
  d: Yasaları günlük yaşamda uygularlar
explanation: Partiler, halkın farklı çıkarlarını ve görüşlerini bir araya getirir ve bunları siyasete
  taşır. Yasaların uygulanması makamların, hüküm verilmesi ise mahkemelerin işidir.
