    question_de: Was ist die Aufgabe der politischen Parteien in der Demokratie?
    options_de:
      a: Sie fällen in Streitfällen Urteile
      b: Sie vertreten die unterschiedlichen Interessen der Bevölkerung
      c: Sie führen eidgenössische Abstimmungen durch
      d: Sie setzen die Gesetze im Alltag um
    explanation_de: Die Parteien bringen die unterschiedlichen Interessen und Meinungen der Bevölkerung
      zusammen und tragen sie in die Politik. Die Umsetzung der Gesetze ist Aufgabe der Behörden, das
      Fällen von Urteilen Aufgabe der Gerichte.
