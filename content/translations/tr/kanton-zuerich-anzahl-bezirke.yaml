question: Zürih kantonu kaç ilçeye ayrılmıştır?
options:
  a: On ilçeye
  b: On iki ilçeye
  c: On dört ilçeye
  d: Sekiz ilçeye
explanation: Zürih kantonu on iki ilçeye ayrılmıştır; örneğin Affoltern, Meilen, Winterthur ve Zürih.
  İlçeler, kanton ile belediyeler (Gemeinden) arasında yer alan idari ve adli ilçelerdir.
