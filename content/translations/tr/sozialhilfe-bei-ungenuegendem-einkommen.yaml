id: sozialhilfe-bei-ungenuegendem-einkommen
lang: tr
source_version: 1
question: Bir kişinin geliri ve malvarlığı geçinmeye yetmediğinde belediye (Gemeinde) ne sunar?
options:
  a: Sosyal yardım
  b: Bir inşaat ruhsatı
  c: Bir vatandaşlığa kabul
  d: Bir ilkokul bursu
explanation: Geçimini kendi imkânlarıyla sağlayamayan kişi, sosyal yardımdan destek alma hakkına sahiptir.
  Bu yardım, kişinin ikamet ettiği belediye tarafından verilir. Sosyal yardım, sosyal güvenliğin son ağıdır.
