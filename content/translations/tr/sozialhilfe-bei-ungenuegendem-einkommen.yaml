    question_de: Was bietet die Gemeinde einer Person an, wenn deren Einkommen und Vermögen zum Lebensunterhalt
      nicht ausreichen?
    options_de:
      a: Sozialhilfe
      b: Eine Baubewilligung
      c: Eine Einbürgerung
      d: Ein Stipendium für die Primarschule
    explanation_de: Eine Person, die ihren Lebensunterhalt nicht mit ihren eigenen Mitteln bestreiten
      kann, hat das Recht, Unterstützung aus der Sozialhilfe zu erhalten. Diese Hilfe wird von der Gemeinde
      geleistet, in der die Person wohnt. Die Sozialhilfe ist das letzte Netz der sozialen Sicherheit.
