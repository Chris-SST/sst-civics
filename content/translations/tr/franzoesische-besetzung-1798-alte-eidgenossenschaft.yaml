    question_de: Was war die Folge des Einmarsches französischer Truppen in die Schweiz im Jahr 1798?
    options_de:
      a: Er machte die Schweiz zu einem Teil Frankreichs
      b: Er festigte die Macht der alten Kantone
      c: Er führte zur Gründung des Bundesstaates von 1848
      d: Er beendete die Ordnung der alten Eidgenossenschaft
    explanation_de: Mit der Besetzung durch Frankreich brach die alte Eidgenossenschaft zusammen. An ihrer
      Stelle wurde die Helvetische Republik als Einheitsstaat gegründet. Der heutige Bundesstaat entstand
      erst 1848.
