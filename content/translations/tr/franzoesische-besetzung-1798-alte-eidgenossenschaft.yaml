id: franzoesische-besetzung-1798-alte-eidgenossenschaft
lang: tr
source_version: 1
question: 1798 yılında Fransız birliklerinin İsviçre'ye girmesinin sonucu ne oldu?
options:
  a: İsviçre'yi Fransa'nın bir parçası haline getirdi
  b: Eski kantonların gücünü pekiştirdi
  c: 1848 federal devletinin kurulmasına yol açtı
  d: Eski Eidgenossenschaft (Yemin Birliği) düzenine son verdi
explanation: Fransa'nın işgaliyle eski Eidgenossenschaft (Yemin Birliği) çöktü. Onun yerine üniter devlet
  olarak Helvetik Cumhuriyet kuruldu. Bugünkü federal devlet ancak 1848'de ortaya çıktı.
