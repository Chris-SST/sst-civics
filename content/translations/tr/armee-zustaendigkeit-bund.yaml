    question_de: Welche staatliche Ebene ist für die Armee zuständig?
    options_de:
      a: Die Kantone
      b: Der Bund
      c: Die Bezirke
      d: Die Gemeinden
    explanation_de: Das Militärwesen ist Aufgabe des Bundes. Der Bund regelt die Armee und ihre Aufgaben
      in der Bundesverfassung und in den Bundesgesetzen. Die Kantone wirken beim Vollzug mit, zum Beispiel
      bei der Rekrutierung.
