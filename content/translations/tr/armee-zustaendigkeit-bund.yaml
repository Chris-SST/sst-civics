id: armee-zustaendigkeit-bund
lang: tr
source_version: 1
question: Ordudan hangi devlet kademesi sorumludur?
options:
  a: Kantonlar
  b: Konfederasyon
  c: İlçeler
  d: Belediyeler (Gemeinden)
explanation: Askerlik işleri Konfederasyonun görevidir. Konfederasyon, orduyu ve görevlerini Federal Anayasa'da
  ve federal yasalarda düzenler. Kantonlar, örneğin askere alma gibi uygulama işlerine katkıda bulunur.
