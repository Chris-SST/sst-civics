id: primarschule-gehoert-zur-schulpflicht
lang: tr
source_version: 2
question: İsviçre'de bu kademelerden hangisi zorunlu eğitim süresine dahildir?
options:
  a: Yüksekokul
  b: İlkokul (Primarschule)
  c: Oyun grubu
  d: Meslek okulu
explanation: 'Zürich kantonunda zorunlu eğitim süresi on bir yıldır: anaokulu, ilkokul ve ortaokul kademesi
  I. Küçük çocuklar için oyun grubu isteğe bağlıdır. Meslek okuluna ve yüksekokula ancak zorunlu eğitim
  süresinden sonra devam edilir.'
