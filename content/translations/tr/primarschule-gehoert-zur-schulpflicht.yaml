    question_de: Welche dieser Stufen gehört in der Schweiz zur obligatorischen Schulzeit?
    options_de:
      a: Hochschule
      b: Primarschule
      c: Spielgruppe
      d: Berufsschule
    explanation_de: 'Im Kanton Zürich beträgt die obligatorische Schulzeit elf Jahre: Kindergarten, Primarschule
