id: abkuerzung-mwst-bedeutung
lang: tr
source_version: 1
question: Faturalarda ve makbuzlarda sıklıkla «MWST» kısaltması yer alır. Bu kısaltma ne anlama gelir?
options:
  a: Kiralık konut vergisi anlamına gelir (Mietwohnungssteuer)
  b: Askerlik muafiyet vergisi anlamına gelir (Militärwehrsteuer)
  c: Motorlu taşıt vergisi anlamına gelir (Motorwagensteuer)
  d: Katma değer vergisi anlamına gelir (Mehrwertsteuer)
explanation: MWST, Mehrwertsteuer, yani katma değer vergisi anlamına gelir. Bu vergi çoğu mal ve hizmetten
  alınır ve fiyata dahildir. Konfederasyonun önemli bir gelir kaynağıdır.
