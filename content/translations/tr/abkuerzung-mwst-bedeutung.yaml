    question_de: Auf Rechnungen und Quittungen steht häufig die Abkürzung «MWST». Was bedeutet diese Abkürzung?
    options_de:
      a: Sie steht für Mietwohnungssteuer
      b: Sie steht für Militärwehrsteuer
      c: Sie steht für Motorwagensteuer
      d: Sie steht für Mehrwertsteuer
    explanation_de: MWST steht für Mehrwertsteuer, das heisst für die Steuer auf dem Mehrwert. Diese Steuer
      wird auf die meisten Waren und Dienstleistungen erhoben und ist im Preis inbegriffen. Sie ist eine
      wichtige Einnahmequelle des Bundes.
