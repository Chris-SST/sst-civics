id: eidgenossenschaft-name-der-schweiz
lang: tr
source_version: 1
question: Federal Anayasa'da İsviçre için ayrıca hangi ad kullanılmaktadır?
options:
  a: Federal Cumhuriyet (Bundesrepublik)
  b: Eidgenossenschaft (Yemin Birliği)
  c: Kantonlar Konfederasyonu
  d: Federal Krallık (Eidgenössisches Königreich)
explanation: Resmî ad «İsviçre Yemin Birliği» (Schweizerische Eidgenossenschaft) şeklindedir. Dolayısıyla
  Eidgenossenschaft sözcüğü, bir bütün olarak İsviçre'yi ifade eder. Bu sözcük, bir yeminle mühürlenen
  Konfederasyonları (Bünde) hatırlatır.
