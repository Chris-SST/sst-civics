question: İsviçre'de ikamet eden yabancıların çoğu nereden gelmektedir?
options:
  a: Asya ülkelerinden, yaklaşık üçte ikisi
  b: Afrika ülkelerinden, yaklaşık yarısı
  c: Avrupa Birliği ülkelerinden, yaklaşık üçte ikisi
  d: Amerika kıtasındaki ülkelerden, yaklaşık üçte biri
explanation: Yabancı yerleşik nüfusun yaklaşık yüzde 66'sı AB ülkelerinden gelmektedir, yani yaklaşık
  üçte ikisi. Geri kalanı diğer Avrupa ülkelerinden ve dünyanın geri kalanından gelmektedir. Bu oran zaman
  içinde hafifçe değişebilir.
