    question_de: Woher kommen die meisten in der Schweiz wohnhaften Ausländer?
    options_de:
      a: Aus asiatischen Ländern, etwa zwei Drittel
      b: Aus afrikanischen Ländern, etwa die Hälfte
      c: Aus Ländern der Europäischen Union, etwa zwei Drittel
      d: Aus Ländern des amerikanischen Kontinents, etwa ein Drittel
    explanation_de: Etwa 66 Prozent der ausländischen Wohnbevölkerung stammen aus EU-Ländern, also etwa
      zwei Drittel. Der Rest stammt aus anderen europäischen Ländern und dem Rest der Welt. Dieser Anteil
      kann sich im Laufe der Zeit leicht ändern.
