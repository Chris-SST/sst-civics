id: folterverbot-bundesverfassung
lang: tr
source_version: 1
question: Federal Anayasa işkence hakkında ne söylüyor?
options:
  a: İşkence yalnızca suçlulara karşı yasaktır.
  b: İşkence, acil durumlarda polis için serbesttir.
  c: Bir mahkeme onay verirse işkence serbesttir.
  d: Hiç kimseye işkence yapılamaz.
explanation: Federal Anayasa'nın 10. maddesi, işkenceyi ve diğer her türlü acımasız, insanlık dışı veya
  aşağılayıcı muameleyi yasaklar. Bu yasak istisnasız tüm insanlar için geçerlidir. Devlet de istisna
  yapamaz.
