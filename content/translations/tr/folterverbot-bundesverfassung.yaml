    question_de: Was sagt die Bundesverfassung über Folter?
    options_de:
      a: Folter ist nur gegenüber Straftätern verboten.
      b: Folter ist für die Polizei in Notfällen erlaubt.
      c: Wenn ein Gericht die Zustimmung erteilt, ist Folter erlaubt.
      d: Niemand darf gefoltert werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet Folter und jede andere Form grausamer, unmenschlicher
      oder erniedrigender Behandlung. Dieses Verbot gilt ausnahmslos für alle Menschen. Auch der Staat
      kann keine Ausnahme machen.
