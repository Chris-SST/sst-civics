id: staenderat-vertritt-anliegen-kantone
lang: tr
source_version: 1
question: Parlamentonun hangi meclisi esas olarak kantonların çıkarlarını temsil eder?
options:
  a: Federal Konsey (Bundesrat)
  b: Ulusal Konsey (Nationalrat)
  c: Kantonlar Konseyi (Ständerat)
  d: Federal Mahkeme (Bundesgericht)
explanation: Kantonlar Konseyi esas olarak kantonları temsil eder. Her kanton bu meclise temsilciler gönderir.
  Ulusal Konsey ise buna karşılık halkı temsil eder.
