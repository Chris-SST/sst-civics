id: mitwirkung-gemeinde-urnengang-stimmabgabe
lang: tr
source_version: 1
question: Seçmenler, sandık başına gidilen oylamalarda belediyelerinde (Gemeinde) siyasi olarak nasıl
  söz sahibi olur?
options:
  a: Belediye konseyinin (Gemeinderat) toplantılarına başkanlık ederler
  b: Belediyenin kararlarını uygularlar
  c: Seçimlerde ve oylamalarda oylarını kullanırlar
  d: Kantonun yasalarını kendileri çıkarırlar
explanation: Sandık başına gidilen oylamalarda seçmenler, sunulan tasarılar hakkında oy verir ve makamları
  seçer. Kararların uygulanması makamların ve idarenin görevidir.
