    question_de: Wie haben die Stimmberechtigten bei Urnenabstimmungen politisch in ihrer Gemeinde ein
      Mitspracherecht?
    options_de:
      a: Sie führen den Vorsitz bei den Sitzungen des Gemeinderats
      b: Sie setzen die Beschlüsse der Gemeinde um
      c: Sie geben bei Wahlen und Abstimmungen ihre Stimme ab
      d: Sie erlassen die Gesetze des Kantons selbst
    explanation_de: Bei Urnenabstimmungen stimmen die Stimmberechtigten über die vorgelegten Vorlagen
      ab und wählen die Behörden. Die Umsetzung der Beschlüsse ist die Aufgabe der Behörden und der Verwaltung.
