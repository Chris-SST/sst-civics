    question_de: Welche Telefonnummer wird in der Schweiz in einem Notfall angerufen, wenn man die Polizei
      braucht?
    options_de:
      a: '143'
      b: '118'
      c: '144'
      d: '117'
    explanation_de: Die Polizei ist in der ganzen Schweiz unter der Telefonnummer 117 erreichbar. Die
      Nummer der Feuerwehr ist 118, die Nummer der Sanitätsteams (Ambulanz) ist 144. 143 ist die Nummer
      der Organisation «Dargebotene Hand» (Ausgestreckte Hand), die für Menschen in Krisen da ist.
