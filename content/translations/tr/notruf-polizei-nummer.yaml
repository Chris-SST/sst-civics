id: notruf-polizei-nummer
lang: tr
source_version: 1
question: İsviçre'de acil bir durumda polise ihtiyaç duyulduğunda hangi telefon numarası aranır?
options:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
explanation: Polise İsviçre'nin her yerinde 117 numaralı telefondan ulaşılır. İtfaiyenin numarası 118,
  sağlık ekiplerinin (ambulans) numarası ise 144'tür. 143, krizdeki insanlar için hizmet veren "Dargebotene
  Hand" (Uzatılmış El) kuruluşunun numarasıdır.
