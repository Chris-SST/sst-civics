question: İsviçre'nin hangi bölgesi, orada yerleşik büyük ilaç şirketleriyle tanınır?
options:
  a: Engadin
  b: Basel bölgesi
  c: Ticino
  d: Valais
explanation: Basel bölgesinde dünya çapında faaliyet gösteren birçok ilaç şirketinin genel merkezi bulunmaktadır.
  İlaç sanayisi orada önemli bir ekonomi koludur ve ihracat açısından büyük önem taşır.
