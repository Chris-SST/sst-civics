id: parlament-hauptaufgabe-gesetze-beschliessen
lang: tr
source_version: 1
question: Konfederasyon Parlamentosu'nun en önemli görevi nedir?
options:
  a: Ülke genelinde polisi yönetmek
  b: Kişiler arasındaki uyuşmazlıklara karar vermek
  c: Kanunları görüşmek ve kabul etmek
  d: Kanunları günlük yaşamda uygulamak
explanation: Parlamento yasama gücüdür. Konfederasyon kanunlarını görüşür ve karara bağlar. Hükümet bunları
  uygular, mahkemeler ise uyuşmazlıklarda karar verir.
