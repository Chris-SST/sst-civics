    question_de: Was ist die wichtigste Aufgabe des Parlaments der Eidgenossenschaft?
    options_de:
      a: Die Polizei im ganzen Land leiten
      b: Über Streitigkeiten zwischen Personen entscheiden
      c: Gesetze beraten und verabschieden
      d: Gesetze im Alltag anwenden
    explanation_de: Das Parlament ist die gesetzgebende Gewalt. Es berät die Gesetze der Eidgenossenschaft
      und beschliesst sie. Die Regierung setzt sie um, die Gerichte entscheiden bei Streitigkeiten.
