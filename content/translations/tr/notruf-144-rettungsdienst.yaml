question: İsviçre'de tıbbi bir acil durumda ambulans hizmetini çağırmak için hangi telefon numarası aranır?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: 144 numarası, tıbbi acil durumlarda ambulans hizmeti için acil çağrı numarasıdır. 117 polis
  için, 118 ise itfaiye için geçerlidir. 145, zehirlenme durumlarında Tox Info Suisse'in numarasıdır.
