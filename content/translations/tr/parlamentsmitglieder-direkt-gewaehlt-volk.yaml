    question_de: Wer wählt die Mitglieder des Nationalrats?
    options_de:
      a: Der Bundesrat ernennt sie.
      b: Die Parteien bestimmen sie ohne Wahl.
      c: Das Bundesgericht wählt sie.
      d: Die stimmberechtigten Bürgerinnen und Bürger wählen sie direkt.
    explanation_de: Die Mitglieder des Nationalrats werden alle vier Jahre von den stimmberechtigten Personen
      direkt gewählt. Die Mitglieder des Ständerats (Ständerat) wählt heute in allen Kantonen ebenfalls
      das Volk; dies geschieht nach den Regeln des jeweiligen Kantons. In Appenzell Innerrhoden findet
      diese Wahl an der Landsgemeinde unter freiem Himmel statt.
