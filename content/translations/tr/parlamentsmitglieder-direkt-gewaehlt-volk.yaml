id: parlamentsmitglieder-direkt-gewaehlt-volk
lang: tr
source_version: 2
question: Ulusal Konsey (Nationalrat) üyelerini kim seçer?
options:
  a: Onları Federal Konsey (Bundesrat) atar.
  b: Onları seçim yapılmaksızın partiler belirler.
  c: Onları Federal Mahkeme (Bundesgericht) seçer.
  d: Oy kullanma hakkına sahip vatandaşlar onları doğrudan seçer.
explanation: Ulusal Konsey üyeleri her dört yılda bir oy hakkına sahip kişiler tarafından doğrudan seçilir.
  Kantonlar Konseyi (Ständerat) üyelerini de bugün tüm kantonlarda halk seçer; bu, ilgili kantonun kurallarına
  göre yapılır. Appenzell Innerrhoden'de bu seçim açık hava halk meclisinde (Landsgemeinde) gerçekleşir.
