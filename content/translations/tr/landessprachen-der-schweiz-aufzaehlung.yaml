id: landessprachen-der-schweiz-aufzaehlung
lang: tr
source_version: 1
question: İsviçre'de hangi diller ulusal dildir?
options:
  a: Almanca, Fransızca, Romanşça ve İspanyolca
  b: Almanca, Fransızca, İtalyanca ve Romanşça
  c: Almanca, Fransızca, İtalyanca ve İngilizce
  d: Almanca, Fransızca ve İtalyanca
explanation: Federal Anayasa (Bundesverfassung), Almanca, Fransızca, İtalyanca ve Romanşça dillerini ulusal
  dil olarak belirtir. İngilizce ulusal dil değildir, ancak çoğu zaman anlaşma dili olarak kullanılır.
