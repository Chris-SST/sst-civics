    question_de: Ein Arbeitnehmer übt neben seiner Arbeit ein öffentliches Amt aus, zum Beispiel in der
      Schulpflege der Gemeinde. Was gibt der Arbeitgeber dafür normalerweise?
    options_de:
      a: Eine zusätzliche Prämie zum Lohn
      b: Eine Beförderung
      c: Bezahlte Freizeit
      d: Nichts, für das Amt muss man Jahresurlaub nehmen
    explanation_de: Einer Person, die ein öffentliches Amt ausübt, gibt der Arbeitgeber dafür in der Regel
      bezahlte Freizeit. Wie viel das genau ist, hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder
      von anderen Regelungen ab. Für ein Amt wird keine Prämie und keine Beförderung gegeben, und normalerweise
      muss man dafür auch keinen Jahresurlaub nehmen.
