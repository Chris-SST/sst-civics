id: oeffentliches-amt-bezahlte-freizeit
lang: tr
source_version: 3
question: Bir çalışan, işinin yanı sıra örneğin belediyenin (Gemeinde) okul kurulunda olduğu gibi kamusal
  bir görev yürütmektedir. İşveren bunun için normalde ne verir?
options:
  a: Maaşa ek bir prim
  b: Terfi
  c: Ücretli izin süresi
  d: Hiçbir şey, görev için yıllık izin kullanmak gerekir
explanation: Kamusal bir görev yürüten kişiye işveren bunun için kural olarak ücretli izin süresi verir.
  Bunun tam olarak ne kadar olduğu iş sözleşmesine, toplu iş sözleşmesine veya diğer düzenlemelere bağlıdır.
  Bir görev için prim ya da terfi verilmez ve normalde bunun için yıllık izin kullanmak da gerekmez.
