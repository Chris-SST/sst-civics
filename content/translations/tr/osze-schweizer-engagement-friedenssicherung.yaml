id: osze-schweizer-engagement-friedenssicherung
lang: tr
source_version: 2
question: İsviçre, Avrupa Güvenlik ve İşbirliği Teşkilatı'nda (AGİT) ne için çaba göstermektedir?
options:
  a: Avrupa'da barış ve güvenlik için, örneğin Doğu Avrupa'da ve Orta Asya'da
  b: Batı Avrupa'da destek fonlarının dağıtımı için
  c: Ortak bir para biriminin getirilmesi için
  d: Dünya ticaretinde gümrük vergilerinin düşürülmesi için
explanation: İsviçre, AGİT'in kurucu üyesidir ve AGİT'ten Avrupa'da barışı ve güvenliği desteklemek için
  yararlanır. AGİT, saha misyonlarıyla özellikle Doğu ve Güneydoğu Avrupa'da ve Orta Asya'da faaliyet
  göstermektedir. İsviçre, 2026 yılında AGİT'in dönem başkanlığını yürütmektedir.
