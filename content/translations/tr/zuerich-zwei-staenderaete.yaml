id: zuerich-zwei-staenderaete
lang: tr
source_version: 1
question: Zürih kantonu, Kantonlar Konseyi'ne (Ständerat) kaç temsilci gönderir?
options:
  a: Bir temsilci
  b: Dört temsilci
  c: Altı temsilci
  d: İki temsilci
explanation: Zürih kantonu tam kantondur ve Kantonlar Konseyi'nde iki sandalyesi vardır. Kantonlar Konseyi
  üyeleri, kantonun oy hakkına sahip halkı tarafından seçilir. Yalnızca yarım kantonların birer temsilcisi
  vardır.
