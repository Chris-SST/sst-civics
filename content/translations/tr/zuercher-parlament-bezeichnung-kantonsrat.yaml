question: Zürih kantonunun parlamentosunun adı nedir?
options:
  a: Grosser Rat
  b: Landrat
  c: belediye konseyi (Gemeinderat)
  d: Kanton Konseyi (Kantonsrat)
explanation: Zürih kantonunun parlamentosunun adı Kanton Konseyi'dir (Kantonsrat). Diğer kantonlar farklı
  adlar kullanır, örneğin Grosser Rat veya Landrat. Belediye konseyi ise belediye (Gemeinde) düzeyinde
  bir makamdır.
