question: İsviçre'nin en genç kantonu hangi kantondur?
options:
  a: Jura
  b: Appenzell Ausserrhoden
  c: Basel-Landschaft
  d: Neuenburg
explanation: Jura kantonu 1979'da kurulmuştur. Bern kantonundan ayrılmıştır ve o zamandan beri 26 kantonun
