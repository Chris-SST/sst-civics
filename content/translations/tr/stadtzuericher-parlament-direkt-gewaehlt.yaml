question: Zürih şehrinin parlamentosu olan belediye konseyi (Gemeinderat) nasıl oluşturulur?
options:
  a: Kantonun Hükümet Konseyi (Regierungsrat) onu atar
  b: Şehir Konseyi (Stadtrat) üyeleri kendisi belirler
  c: Partiler koltukları aralarında kura ile paylaşır
  d: Halk onu sandıkta doğrudan seçer
explanation: Zürih şehrinin oy hakkına sahip kişileri, belediye konseyini genel seçimlerle seçer. Belediye
  konseyi şehrin parlamentosudur ve belediye halk toplantısının (Gemeindeversammlung) yerini alır.
