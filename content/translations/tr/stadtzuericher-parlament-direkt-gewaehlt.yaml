    question_de: Wie wird der Gemeinderat, das Parlament der Stadt Zürich, gebildet?
    options_de:
      a: Der Regierungsrat des Kantons ernennt ihn
      b: Die Mitglieder des Stadtrats bestimmen ihn selbst
      c: Die Parteien verteilen die Sitze unter sich per Los
      d: Das Volk wählt ihn direkt an der Urne
    explanation_de: Die Stimmberechtigten der Stadt Zürich wählen den Gemeinderat in allgemeinen Wahlen.
      Der Gemeinderat ist das Parlament der Stadt und ersetzt die Gemeindeversammlung.
