    question_de: In welchem Jahr wurde die Alters- und Hinterlassenenversicherung (AHV), also die staatliche
      Rentenversicherung für das Alter und für Hinterbliebene, gegründet?
    options_de:
      a: '1975'
      b: '1918'
      c: '1930'
      d: '1948'
    explanation_de: Die Alters- und Hinterlassenenversicherung nahm ihre Tätigkeit 1948 auf, nachdem das
      Volk das Gesetz 1947 angenommen hatte. Sie bildet die erste Säule des Drei-Säulen-Systems in der
      Schweiz. Sie bietet im Alter und für Hinterbliebene eine Existenzsicherung.
