question: Yaşlılık ve dul-yetim sigortası (AHV), yani yaşlılık ve geride kalanlar için devlet emeklilik
  sigortası, hangi yıl kurulmuştur?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: Yaşlılık ve dul-yetim sigortası, halk yasayı 1947'de kabul ettikten sonra 1948'de faaliyete
  başlamıştır. İsviçre'deki üç sütunlu sistemin birinci sütununu oluşturur. Yaşlılık döneminde ve geride
  kalanlar için geçim güvencesi sağlar.
