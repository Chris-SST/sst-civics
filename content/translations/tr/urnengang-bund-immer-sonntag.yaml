id: urnengang-bund-immer-sonntag
lang: tr
source_version: 1
question: İsviçre'de federal oylamalar ve seçimler haftanın hangi gününde yapılır?
options:
  a: Her zaman bir pazar günü
  b: Her zaman bir cumartesi günü
  c: Her zaman bir cuma günü
  d: Her kantonun kendisinin seçtiği bir hafta günü
explanation: Konfederasyon düzeyindeki sandık başı oylamaları her zaman pazar günü yapılır. Böylece mümkün
  olduğunca çok oy hakkı sahibi katılabilir ve tarih herkes için aynıdır.
