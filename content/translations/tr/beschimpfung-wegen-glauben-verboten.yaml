    question_de: Eine Person beleidigt Menschen öffentlich wegen ihres Glaubens oder ihrer Abstammung.
      Wie ist dies in der Schweiz geregelt?
    options_de:
      a: Es ist nur in Schulen und an Arbeitsplätzen verboten.
      b: Es ist verboten und strafbar.
      c: Es ist nur verboten, wenn es in der Zeitung veröffentlicht wird.
      d: Es ist wegen der Meinungsfreiheit immer geschützt.
    explanation_de: Das Strafgesetzbuch verbietet die öffentliche Herabsetzung von Menschen wegen ihrer
      Rasse, ihrer ethnischen Herkunft, ihrer Religion oder ihrer sexuellen Orientierung. Die Meinungsfreiheit
      ist nicht unbegrenzt.
