question: Bir kişi, insanlara inançları veya soy kökenleri nedeniyle alenen hakaret ediyor. İsviçre'de
  bu durum nasıl düzenlenmiştir?
options:
  a: Yalnızca okullarda ve iş yerlerinde yasaktır.
  b: Yasaktır ve cezalandırılabilir.
  c: Yalnızca gazetede yayımlanırsa yasaktır.
  d: İfade özgürlüğü nedeniyle her zaman korunur.
explanation: Ceza Kanunu, insanların ırkları, etnik kökenleri, dinleri veya cinsel yönelimleri nedeniyle
  alenen aşağılanmasını yasaklar. İfade özgürlüğü sınırsız değildir.
