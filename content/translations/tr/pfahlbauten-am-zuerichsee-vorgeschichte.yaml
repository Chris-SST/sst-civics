    question_de: Wie waren die prähistorischen Siedlungen am Zürichsee gebaut worden?
    options_de:
      a: Als Höhlen in den Felsen
      b: Als Pfahlbauten, das heisst als auf Pfählen errichtete Häuser
      c: Als aus Backstein gebaute Häuser in Dörfern
      d: Als Burgen auf Felsen
