question: Zürih Gölü'ndeki tarih öncesi yerleşimler nasıl inşa edilmişti?
options:
  a: Kayalıklardaki mağaralar olarak
  b: Kazıklı yapılar, yani kazıklar üzerine kurulmuş evler olarak
  c: Köylerde tuğladan yapılmış evler olarak
  d: Kayalıklar üzerindeki şatolar olarak
explanation: Tarih öncesi dönemde Zürih Gölü'nün kıyısında kazıklı yapılar, yani kazıklar üzerine kurulmuş
  evler bulunuyordu. Bunların kalıntıları bugün hâlâ suyun altında yer almaktadır ve sualtı arkeologları
  tarafından incelenmektedir.
