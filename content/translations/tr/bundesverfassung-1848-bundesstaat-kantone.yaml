    question_de: Was änderte sich für die Schweiz mit der Bundesverfassung von 1848?
    options_de:
      a: Sie wurde wieder zu einem losen Staatenbund
      b: Sie wurde zu einer Monarchie mit einem König an der Spitze
      c: Sie wurde zu einem Bundesstaat, in dem die Kantone unabhängig blieben
      d: Sie wurde zu einem Einheitsstaat, in dem es keine Kantone gab
    explanation_de: 1848 entstand der moderne Bundesstaat mit gemeinsamen Institutionen. Die Kantone behielten
      jedoch ihre eigenen Aufgaben und ihre eigene Staatlichkeit. Diese Aufgabenteilung hat die Schweiz
      bis heute geprägt.
