id: bundesverfassung-1848-bundesstaat-kantone
lang: tr
source_version: 1
question: 1848 Federal Anayasa ile İsviçre için ne değişti?
options:
  a: Yeniden gevşek bir devletler birliği (Staatenbund) haline geldi
  b: Bir kralın başında olduğu bir monarşi haline geldi
  c: Kantonların bağımsız kaldığı bir federal devlet (Bundesstaat) haline geldi
  d: Kantonların bulunmadığı üniter bir devlet haline geldi
explanation: 1848'de ortak kurumlara sahip modern federal devlet (Bundesstaat) ortaya çıktı. Ancak kantonlar
  kendi görevlerini ve kendi devlet niteliklerini korudu. Bu görev paylaşımı İsviçre'yi bugüne kadar şekillendirmiştir.
