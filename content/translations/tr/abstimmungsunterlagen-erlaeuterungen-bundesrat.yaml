id: abstimmungsunterlagen-erlaeuterungen-bundesrat
lang: tr
source_version: 1
question: Federal bir oylamadan önce oy hakkı olan kişiler, oylanacak konular hakkında bilgi edinebilmeleri
  için oy materyaliyle birlikte ne alır?
options:
  a: Federal Konsey'in (Bundesrat) açıklamaları
  b: Federal Mahkeme'nin (Bundesgericht) bir görüş bildirimi
  c: Kişinin kendi kantonunun bir bilirkişi raporu
  d: Tüm partilerin seçim listesi
explanation: Federal Konsey, genellikle oylama kitapçığı olarak adlandırılan açıklamalarda her bir konunun
  ne ile ilgili olduğunu açıklar. Bu kitapçıkta ayrıca girişim veya referandum komitesinin argümanları
  ile Federal Konsey'in ve Parlamento'nun tavsiyesi de yer alır. Böylece herkes kendi fikrini oluşturabilir.
