    question_de: Was erhalten Stimmberechtigte vor einer eidgenössischen Abstimmung zusammen mit dem Abstimmungsmaterial,
      damit sie sich über die Abstimmungsgegenstände informieren können?
    options_de:
      a: Die Erläuterungen des Bundesrates
      b: Eine Stellungnahme des Bundesgerichts
      c: Ein Gutachten des eigenen Kantons der Person
      d: Die Wahlliste aller Parteien
    explanation_de: Der Bundesrat erklärt in den Erläuterungen, die allgemein als Abstimmungsbüchlein
      bezeichnet werden, worum es bei jedem Gegenstand geht. In diesem Büchlein finden sich auch die Argumente
      des Initiativ- oder Referendumskomitees sowie die Empfehlung des Bundesrates und des Parlaments.
      So kann sich jeder seine eigene Meinung bilden.
