    question_de: Was ist die Aufgabe der Gewerkschaften in der Schweiz?
    options_de:
      a: Sie verteidigen die Forderungen und Interessen der Arbeitnehmenden.
      b: Sie erteilen Ausländern Arbeitsbewilligungen.
      c: Sie legen die Steuersätze für Unternehmen fest.
      d: Sie vertreten die Forderungen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Gewerkschaften sind Organisationen der Arbeitnehmenden. Sie vertreten die Interessen
      der Arbeitnehmenden zum Beispiel bei Themen wie Löhnen und Arbeitsbedingungen und verhandeln oft
      mit den Arbeitgebern Gesamtarbeitsverträge. Arbeitsbewilligungen hingegen erteilen nicht die Gewerkschaften,
      sondern die zuständigen Behörden.
