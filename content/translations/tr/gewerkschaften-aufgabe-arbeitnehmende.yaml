id: gewerkschaften-aufgabe-arbeitnehmende
lang: tr
source_version: 2
question: İsviçre'de sendikaların görevi nedir?
options:
  a: Çalışanların taleplerini ve çıkarlarını savunurlar.
  b: Yabancılara çalışma izni verirler.
  c: Şirketler için vergi oranlarını belirlerler.
  d: İşverenlerin taleplerini Konfederasyon nezdinde temsil ederler.
explanation: Sendikalar çalışanların örgütleridir. Örneğin ücretler ve çalışma koşulları gibi konularda
  çalışanların çıkarlarını temsil ederler ve çoğu zaman işverenlerle toplu iş sözleşmeleri müzakere ederler.
  Çalışma izinlerini ise sendikalar değil, yetkili makamlar verir.
