    question_de: Wer kann auf Bundesebene abstimmen und wählen?
    options_de:
      a: Schweizer Staatsbürger ab 20 Jahren
      b: Alle Personen mit einer Niederlassungsbewilligung (Ausweis C) ab 18 Jahren
      c: Schweizer Staatsbürger ab 18 Jahren
      d: Alle in der Schweiz wohnhaften Personen ab 16 Jahren
    explanation_de: Auf Bundesebene können Schweizerinnen und Schweizer ab ihrem 18. Geburtstag abstimmen
      und wählen. Ausländer haben dieses Recht auf Bundesebene nicht, auch nicht mit einer Niederlassungsbewilligung
      (Ausweis C). Auch im Ausland lebende Schweizer Staatsbürger können teilnehmen, wenn sie sich ins
      Stimmregister eintragen lassen.
