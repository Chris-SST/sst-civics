id: stimmrecht-bund-ab-18-jahren
lang: tr
source_version: 2
question: Konfederasyon düzeyinde kimler oy kullanabilir ve seçim yapabilir?
options:
  a: 20 yaşından itibaren İsviçre vatandaşları
  b: 18 yaşından itibaren yerleşim izni (Niederlassungsbewilligung) (C izni) sahibi tüm kişiler
  c: 18 yaşından itibaren İsviçre vatandaşları
  d: 16 yaşından itibaren İsviçre'de ikamet eden tüm kişiler
explanation: Konfederasyonda İsviçreli kadınlar ve erkekler 18. doğum gününden itibaren oy kullanabilir
  ve seçimlerde oy verebilir. Yabancılar, yerleşim izni (C izni) olsa bile Konfederasyon düzeyinde bu
  hakka sahip değildir. Yurt dışında yaşayan İsviçre vatandaşları da seçmen kütüğüne kaydolmaları halinde
  katılabilir.
