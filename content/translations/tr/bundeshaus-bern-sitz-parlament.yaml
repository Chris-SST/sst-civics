    question_de: Welches Gebäude in Bern ist der Tagungsort des Schweizer Parlaments?
    options_de:
      a: Kornhaus
      b: Rathaus
      c: Bundesverwaltungsgericht
      d: Bundeshaus
    explanation_de: Das Schweizer Parlament tagt im Bundeshaus in Bern. Der Nationalrat und der Ständerat
      kommen dort während der Sessionen zusammen. Das Rathaus ist ein Gebäude, das zum Kanton Bern bzw.
      zur Stadt gehört; es gehört nicht zum Parlament der Eidgenossenschaft.
