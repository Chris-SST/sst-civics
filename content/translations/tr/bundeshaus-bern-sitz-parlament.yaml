id: bundeshaus-bern-sitz-parlament
lang: tr
source_version: 1
question: Bern'de bulunan hangi bina İsviçre Parlamentosu'nun toplantı yeridir?
options:
  a: Kornhaus (Tahıl Ambarı)
  b: Belediye Sarayı (Rathaus)
  c: Federal İdari Mahkeme
  d: Federal Saray (Bundeshaus)
explanation: İsviçre Parlamentosu, Bern'deki Federal Saray'da (Bundeshaus) toplanır. Millet Konseyi ile
  Kantonlar Konseyi (Ständerat) oturum dönemlerinde orada bir araya gelir. Belediye Sarayı, Bern kantonuna
  ya da şehre ait bir binadır; Konfederasyon Parlamentosuna ait değildir.
