id: polizei-befugnis-festnahme-straftaeter
lang: tr
source_version: 2
question: Hangi makam, bir suç işlediğinden şüphelenilen kişileri gözaltına alabilir?
options:
  a: Okul makamı
  b: Polis
  c: Parlamento
  d: Vergi dairesi
explanation: Polis, bir suç işlediğinden şüphelenilen kişileri yasal koşullar çerçevesinde gözaltına alabilir.
  Kişinin suçlu olup olmadığına bundan sonra bir mahkeme karar verir. Okul makamı, parlamento ve vergi
  dairesi bu yetkiye sahip değildir.
