    question_de: Welche Behörde kann Personen festnehmen, die verdächtigt werden, eine Straftat begangen
      zu haben?
    options_de:
      a: Die Schulbehörde
      b: Die Polizei
      c: Das Parlament
      d: Das Steueramt
    explanation_de: Die Polizei kann Personen, die verdächtigt werden, eine Straftat begangen zu haben,
      im Rahmen der gesetzlichen Voraussetzungen festnehmen. Ob die Person schuldig ist, entscheidet danach
      ein Gericht. Die Schulbehörde, das Parlament und das Steueramt haben diese Befugnis nicht.
