id: obligationenrecht-miete-wohnraum-vorschriften
lang: tr
source_version: 2
question: Bir dairenin kiralanmasına ilişkin kurallar hangi kanunda yer almaktadır?
options:
  a: Borçlar Hukuku'nda (Obligationenrecht)
  b: İş Kanunu'nda (Arbeitsgesetz)
  c: Ceza Kanunu'nda (Strafgesetzbuch)
  d: Karayolu Trafik Kanunu'nda (Strassenverkehrsgesetz)
explanation: Dairelerin kiralanmasına ilişkin kurallar Borçlar Hukuku'nda (OR) yer almaktadır. Orada örneğin
  kira sözleşmesinde nelerin geçerli olduğu, kira bedelinin ne kadar yüksek olabileceği ve sözleşmenin
  nasıl feshedilebileceği belirtilir. Medeni Kanun (ZGB) ise buna karşılık daha çok aile, evlilik ve miras
  gibi konuları düzenler.
