    question_de: In welchem Gesetz stehen die Regeln zur Vermietung einer Wohnung?
    options_de:
      a: Im Obligationenrecht
      b: Im Arbeitsgesetz
      c: Im Strafgesetzbuch
      d: Im Strassenverkehrsgesetz
    explanation_de: Die Regeln zur Vermietung von Wohnungen stehen im Obligationenrecht (OR). Dort wird
      zum Beispiel festgelegt, was im Mietvertrag gilt, wie hoch der Mietzins sein darf und wie der Vertrag
      gekündigt werden kann. Das Zivilgesetzbuch (ZGB) hingegen regelt eher Themen wie Familie, Ehe und
      Erbschaft.
