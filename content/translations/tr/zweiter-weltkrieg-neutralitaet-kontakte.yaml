id: zweiter-weltkrieg-neutralitaet-kontakte
lang: tr
source_version: 1
question: İsviçre İkinci Dünya Savaşı'nda nasıl bir tutum sergiledi?
options:
  a: Savaşan taraflarla tüm bağlantılarını kesti ve sınırları tamamen kapattı.
  b: Almanya'ya katıldı ve asker gönderdi.
  c: Tarafsız kaldı ve savaşan taraflarla siyasi ve ekonomik ilişkilerini sürdürdü.
  d: Müttefiklerin ittifakına katıldı ve savaştı.
explanation: İsviçre, İkinci Dünya Savaşı'nda savaşan taraf olmadı. Ancak savaşan taraflarla siyasi ve
  ekonomik ilişkilerini sürdürdü. Bu tutum, tarihsel açıdan bugüne kadar tartışılmaktadır.
