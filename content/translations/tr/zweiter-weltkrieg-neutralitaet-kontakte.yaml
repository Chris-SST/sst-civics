    question_de: Welche Haltung nahm die Schweiz im Zweiten Weltkrieg ein?
    options_de:
      a: Sie brach alle Verbindungen zu den kriegführenden Parteien ab und schloss die Grenzen vollständig.
      b: Sie schloss sich Deutschland an und schickte Soldaten.
      c: Sie blieb neutral und pflegte weiterhin politische und wirtschaftliche Beziehungen zu den kriegführenden
        Parteien.
      d: Sie trat dem Bündnis der Alliierten bei und kämpfte.
    explanation_de: Die Schweiz war im Zweiten Weltkrieg keine kriegführende Partei. Sie pflegte jedoch
      weiterhin politische und wirtschaftliche Beziehungen zu den kriegführenden Parteien. Diese Haltung
      wird aus historischer Sicht bis heute diskutiert.
