question: İsviçre'de kışın özellikle çok sayıda insan hangi sporu yapar?
options:
  a: Sutopu
  b: Kayak
  c: Kürek sporu
  d: Plaj voleybolu
explanation: Kayak, İsviçre'de kışın çok sevilir ve birçok kişi dağlarda kayak yapar. Çocuklar çoğu zaman
  daha küçük yaşta kayak yapmayı öğrenir, örneğin okulun düzenlediği bir kayak kampında. Sutopu, kürek
  sporu ve plaj voleybolu ise daha çok yazın veya suda yapılan spor dallarıdır.
