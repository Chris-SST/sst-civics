    question_de: Welchen Sport betreiben in der Schweiz im Winter besonders viele Menschen?
    options_de:
      a: Wasserball
      b: Skifahren
      c: Rudern
      d: Beachvolleyball
    explanation_de: Skifahren ist in der Schweiz im Winter sehr beliebt und viele Menschen fahren in den
      Bergen Ski. Kinder lernen oft in jüngeren Jahren Skifahren, zum Beispiel in einem von der Schule
      organisierten Skilager. Wasserball, Rudern und Beachvolleyball sind hingegen eher Sportarten, die
      im Sommer oder im Wasser betrieben werden.
