id: franzoesisch-status-landessprache
lang: tr
source_version: 1
question: İsviçre'de Fransızcanın statüsü nedir?
options:
  a: Fransızca, okulda yalnızca bir yabancı dildir.
  b: Fransızca, yalnızca bölgesel bir iletişim dilidir.
  c: Fransızca, bir ulusal dildir.
  d: Fransızca, resmî statüsü olmayan bir azınlık dilidir.
explanation: Fransızca, İsviçre'nin ulusal dillerinden biridir. Özellikle İsviçre'nin batısında (Romandiya)
  konuşulur ve Konfederasyon düzeyinde resmî bir dildir.
