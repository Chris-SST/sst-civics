    question_de: Welcher der traditionellen Bräuche der Schweizer Landbevölkerung ist eine Gesangsart,
      bei der die Stimme schnell zwischen Bruststimme und Kopfstimme wechselt?
    options_de:
      a: Alphorn spielen
      b: Jodeln
      c: Hornussen spielen
      d: Fahnenschwingen
    explanation_de: Beim Jodeln wechselt die Stimme schnell zwischen Bruststimme und Kopfstimme. Das Jodeln
      ist einer der traditionellen Bräuche der Schweizer Landbevölkerung. Der Naturjodel wird ohne Text
      vorgetragen, aber viele Jodellieder haben Texte.
