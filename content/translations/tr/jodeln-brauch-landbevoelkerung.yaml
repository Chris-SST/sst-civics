question: İsviçre kırsal kesiminin geleneksel göreneklerinden hangisi, sesin göğüs sesi ile baş sesi arasında
  hızla değiştiği bir şarkı söyleme biçimidir?
options:
  a: Alp borusu çalmak
  b: Yodel söylemek
  c: Hornussen oynamak
  d: Bayrak sallamak
explanation: Yodel söylerken ses, göğüs sesi ile baş sesi arasında hızla değişir. Yodel, İsviçre kırsal
  kesiminin geleneksel göreneklerinden biridir. Doğal yodel sözsüz icra edilir, ancak birçok yodel şarkısının
  sözleri vardır.
