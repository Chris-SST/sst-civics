question: Zürich kantonu bugünkü biçimiyle hangi yılda ortaya çıktı?
options:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
explanation: Zürich kantonu bugünkü biçimiyle 1803 yılında Mediation Yasası (Mediationsakte) ile oluşturuldu.
