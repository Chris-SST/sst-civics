    question_de: Welcher der folgenden berühmten Dichter und Schriftsteller stammt aus Zürich?
    options_de:
      a: Robert Walser
      b: Gottfried Keller
      c: Friedrich Dürrenmatt
      d: Jeremias Gotthelf
    explanation_de: Gottfried Keller wurde 1819 in Zürich geboren, schrieb zum Beispiel das Werk «Der
      grüne Heinrich» und arbeitete zugleich als Staatsschreiber des Kantons Zürich. Robert Walser war
      aus Biel, Friedrich Dürrenmatt stammte aus Konolfingen im Kanton Bern, und Jeremias Gotthelf wirkte
      im Kanton Bern als Pfarrer.
