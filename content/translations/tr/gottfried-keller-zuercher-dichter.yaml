id: gottfried-keller-zuercher-dichter
lang: tr
source_version: 2
question: Aşağıdaki ünlü şairlerden ve yazarlardan hangisi Zürih'ten gelmektedir?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller 1819'da Zürih'te dünyaya geldi, örneğin «Der grüne Heinrich» (Yeşil Heinrich)
  adlı eseri yazdı ve aynı zamanda Zürih kantonunun devlet yazmanı (Staatsschreiber) olarak çalıştı. Robert
  Walser Biel'liydi, Friedrich Dürrenmatt Bern kantonundaki Konolfingen'denti ve Jeremias Gotthelf Bern
  kantonunda papaz olarak görev yaptı.
