    source_version: 1
    question_de: Einer Arbeitnehmerin wird zu Unrecht ein sehr niedriger Lohn bezahlt. An welche Stelle
      kann sie sich wenden?
    options_de:
      a: Regionales Arbeitsvermittlungszentrum (RAV)
      b: Bundesamt für Statistik
      c: Arbeitsgericht
      d: Gemeindeversammlung
    explanation_de: Bei Streitigkeiten aus dem Arbeitsverhältnis, zum Beispiel wegen eines zu niedrigen
      Lohns, ist das Arbeitsgericht zuständig. Das RAV hilft bei der Stellensuche, nicht bei Lohnstreitigkeiten.
