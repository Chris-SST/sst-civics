id: zu-tiefer-lohn-arbeitsgericht
lang: tr
source_version: 1
question: Bir kadın çalışana haksız yere çok düşük maaş ödeniyor. Hangi kuruma başvurabilir?
options:
  a: Bölgesel İş Bulma Merkezi (RAV)
  b: Konfederasyon İstatistik Dairesi
  c: İş mahkemesi
  d: Belediye halk toplantısı (Gemeindeversammlung)
explanation: İş ilişkisinden kaynaklanan uyuşmazlıklarda, örneğin çok düşük maaş nedeniyle, iş mahkemesi
  yetkilidir. RAV iş aramada yardımcı olur, maaş uyuşmazlıklarında yardımcı olmaz.
