id: kantonsrat-mandat-durch-volkswahl
lang: tr
source_version: 1
question: Zürih Kanton Konseyi (Kantonsrat) üyeleri görevlerine nasıl gelir?
options:
  a: Halk tarafından seçilirler.
  b: Belediye (Gemeinde) meclisleri tarafından belirlenirler.
  c: Hükümet Konseyi (Regierungsrat) tarafından atanırlar.
  d: Federal Konsey (Bundesrat) tarafından görevlendirilirler.
explanation: Kanton Konseyi üyeleri, kantonun oy hakkına sahip kişileri tarafından halk seçimiyle seçilir.
  Parlamento bu şekilde doğrudan halk tarafından belirlenir. Ne hükümet ne de Konfederasyon üyeleri göreve
  getirir.
