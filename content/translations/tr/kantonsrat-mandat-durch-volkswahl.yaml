    source_version: 1
    question_de: Wie kommen die Mitglieder des Zürcher Kantonsrats (Kantonsrat) in ihr Amt?
    options_de:
      a: Sie werden vom Volk gewählt.
      b: Sie werden von den Gemeinderäten der Gemeinden bestimmt.
      c: Sie werden vom Regierungsrat ernannt.
      d: Sie werden vom Bundesrat beauftragt.
    explanation_de: Die Mitglieder des Kantonsrats werden von den stimmberechtigten Personen des Kantons
      in einer Volkswahl gewählt. Das Parlament wird auf diese Weise direkt vom Volk bestimmt. Weder die
      Regierung noch die Mitglieder der Eidgenossenschaft setzen sie in ihr Amt ein.
