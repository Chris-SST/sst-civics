id: volksschule-leitung-vor-ort-schulleitung
lang: tr
source_version: 2
question: Zürich kantonunda bir ilkokul (Volksschule) doğrudan okulda kim tarafından yönetilir?
options:
  a: Kanton Konseyi (Kantonsrat)
  b: Okul yönetimi
  c: Veli konseyi
  d: Hükümet Konseyi (Regierungsrat)
explanation: Zürich kantonundaki her ilkokulun (Volksschule), okulun işleyişini doğrudan okulda yöneten
  ve düzenleyen bir okul yönetimi vardır. Hükümet Konseyi ve Kanton Konseyi kanton düzeyinde çalışır.
  Veli konseyi velilerin taleplerini iletir, ancak okulu yönetmez.
