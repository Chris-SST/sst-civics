    question_de: Von wem wird eine Primarschule (Volksschule) im Kanton Zürich direkt vor Ort in der Schule
      geleitet?
    options_de:
      a: Kantonsrat
      b: Schulleitung
      c: Elternrat
      d: Regierungsrat
    explanation_de: Jede Primarschule (Volksschule) im Kanton Zürich hat eine Schulleitung, die den Betrieb
      der Schule direkt vor Ort leitet und regelt. Der Regierungsrat und der Kantonsrat arbeiten auf kantonaler
      Ebene. Der Elternrat übermittelt die Anliegen der Eltern, leitet die Schule aber nicht.
