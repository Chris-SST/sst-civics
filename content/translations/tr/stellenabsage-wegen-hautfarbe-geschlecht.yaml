    question_de: Eine Frau bewirbt sich um eine Stelle. Sie wird nur deshalb abgelehnt, weil sie eine
      Frau ist. Welches Grundrecht verletzt dieser Vorgang?
    options_de:
      a: Niederlassungsfreiheit
      b: Versammlungsfreiheit
      c: Rechtsgleichheit und Diskriminierungsverbot
      d: Schutz des Privatlebens
    explanation_de: Artikel 8 der Bundesverfassung besagt, dass alle Menschen vor dem Gesetz gleich sind
      und dass Frau und Mann gleiche Rechte haben. Niemand darf zum Beispiel wegen der Herkunft, der Rasse
      oder des Geschlechts diskriminiert werden. Deshalb verletzt jemand, der eine Bewerberin nur wegen
      ihres Geschlechts ablehnt, die Rechtsgleichheit und das Diskriminierungsverbot.
