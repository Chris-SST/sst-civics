id: stellenabsage-wegen-hautfarbe-geschlecht
lang: tr
source_version: 2
question: Bir kadın bir iş için başvuruyor. Yalnızca kadın olduğu için reddediliyor. Bu durum hangi temel
  hakkı ihlal etmektedir?
options:
  a: İskân özgürlüğü
  b: Toplanma özgürlüğü
  c: Hukuk önünde eşitlik ve ayrımcılık yasağı
  d: Özel hayatın korunması
explanation: Federal Anayasa'nın 8. maddesi, bütün insanların kanun önünde eşit olduğunu ve kadın ile
  erkeğin eşit haklara sahip olduğunu belirtir. Hiç kimse, örneğin kökeni, ırkı veya cinsiyeti nedeniyle
  ayrımcılığa uğratılamaz. Bu nedenle bir kadın başvurucuyu yalnızca cinsiyeti yüzünden reddeden kişi,
  hukuk önünde eşitliği ve ayrımcılık yasağını ihlal eder.
