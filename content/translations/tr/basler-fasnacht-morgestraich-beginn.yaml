id: basler-fasnacht-morgestraich-beginn
lang: tr
source_version: 1
question: Basel Karnavalı'nın başlangıcı olan Morgestraich sırasında ne olur?
options:
  a: Belediye başkanı şehrin anahtarını karnaval derneğine teslim eder.
  b: Sokaklar parlak şekilde aydınlatılır ve bir havai fişek gösterisi başlar.
  c: Sokaklardaki ışıklar söner, ardından fifreler ve davullar çalmaya başlar.
  d: Karnaval katılımcıları Münster Kulesi'nden konfeti atar ve tüm kilise çanlarını çalar.
explanation: Morgestraich, Kül Çarşambası'nı izleyen Pazartesi günü sabah saat dörtte başlar. Ardından
  sokaklardaki ışıklar söndürülür. Sonra fifre ve davul müziği başlar.
