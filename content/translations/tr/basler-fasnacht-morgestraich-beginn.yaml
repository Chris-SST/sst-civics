    question_de: Was passiert während des Morgestraichs, dem Beginn der Basler Fasnacht?
    options_de:
      a: Der Bürgermeister übergibt den Schlüssel der Stadt an die Fasnachtsgesellschaft.
      b: Die Strassen werden hell beleuchtet und ein Feuerwerk beginnt.
      c: Die Lichter in den Strassen gehen aus, danach beginnen die Pfeifen und Trommeln zu spielen.
      d: Die Fasnachtsteilnehmer werfen vom Münsterturm Konfetti und läuten alle Kirchenglocken.
    explanation_de: Der Morgestraich beginnt am Montag nach dem Aschermittwoch um vier Uhr morgens. Danach
      werden die Lichter in den Strassen gelöscht. Dann beginnt die Pfeifen- und Trommelmusik.
