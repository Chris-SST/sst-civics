id: alv-beitraege-arbeitgeber-lohnabzug
lang: tr
source_version: 1
question: İşsizlik sigortasına ödenen primleri maaştan kim keser?
options:
  a: İkamet yerindeki belediye (Gemeinde)
  b: Çalışanın kendisi, ödeme yaparak
  c: Bölgesel İş Bulma Merkezi
  d: İşveren
explanation: İşveren primleri maaştan otomatik olarak keser ve yetkili kuruma aktarır. Çalışanların bununla
  kendilerinin ilgilenmesi gerekmez. İşveren de primlerin bir kısmını öder.
