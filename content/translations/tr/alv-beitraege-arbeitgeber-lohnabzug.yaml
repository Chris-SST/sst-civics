    question_de: Wer zieht die für die Arbeitslosenversicherung bezahlten Prämien vom Lohn ab?
    options_de:
      a: Die Gemeinde am Wohnort
      b: Der Arbeitnehmer selbst, durch Zahlung
      c: Das Regionale Arbeitsvermittlungszentrum
      d: Der Arbeitgeber
    explanation_de: Der Arbeitgeber zieht die Prämien automatisch vom Lohn ab und überweist sie an die
      zuständige Stelle. Die Arbeitnehmenden müssen sich nicht selbst darum kümmern. Der Arbeitgeber bezahlt
      auch einen Teil der Prämien.
