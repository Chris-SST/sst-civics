    question_de: Wer ist in der Schweiz hauptsächlich für die Bildung und Erziehung der Kinder verantwortlich?
    options_de:
      a: Die Gemeinde
      b: Die Eltern
      c: Die Schule
      d: Der Kanton
    explanation_de: Gemäss dem Zivilgesetzbuch wahren die Eltern das Wohl des Kindes und leiten dessen
      Erziehung. Die Schule ergänzt diese Aufgabe durch den Unterricht. Der Staat greift nur ein, wenn
      das Wohl des Kindes gefährdet ist.
