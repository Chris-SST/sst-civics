id: kindererziehung-verantwortung-eltern
lang: tr
source_version: 1
question: İsviçre'de çocukların eğitiminden ve yetiştirilmesinden esas olarak kim sorumludur?
options:
  a: Belediye (Gemeinde)
  b: Ebeveynler
  c: Okul
  d: Kanton
explanation: Medeni Kanun'a göre ebeveynler çocuğun iyiliğini gözetir ve çocuğun yetiştirilmesini yönetir.
  Okul, öğretimle bu görevi tamamlar. Devlet yalnızca çocuğun iyiliği tehlikedeyse müdahale eder.
