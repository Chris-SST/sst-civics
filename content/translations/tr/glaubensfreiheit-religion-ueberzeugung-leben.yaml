    verdict: same
    reason: gleiche Bedeutung; «Landeskirche» und «Kantonskirche» bezeichnen hier dieselbe kantonal anerkannte
      Kirche, die übrigen Unterschiede sind nur sprachlich.
    model: claude-sonnet-5-5
    at: *id001
    source_version: 1
    question_de: Was gehört gemäss der Bundesverfassung zur Glaubens- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und entsprechend zu leben
      b: Nur die Mitgliedschaft in einer anerkannten Kantonskirche
      c: Die Pflicht, den Glauben der Eltern fortzuführen
      d: Das Recht, andere zu seinem eigenen Glauben zu zwingen
    explanation_de: Jede Person kann ihre Religion und ihre auf einer Weltanschauung beruhende Überzeugung
      frei wählen und entsprechend leben. Es ist auch möglich, den Glauben zu wechseln oder keinen Glauben
      zu haben. Niemand kann zu einem Glauben gezwungen werden.
