id: glaubensfreiheit-religion-ueberzeugung-leben
lang: tr
source_version: 1
question: Federal Anayasa'ya göre inanç ve vicdan özgürlüğüne neler dahildir?
options:
  a: Bir inanca ve bir kanaate sahip olma ve buna göre yaşama hakkı
  b: Yalnızca tanınmış bir kanton kilisesine üyelik
  c: Anne babanın inancını sürdürme yükümlülüğü
  d: Başkalarını kendi inancına zorlama hakkı
explanation: Herkes dinini ve dünya görüşüne dayalı kanaatini özgürce seçebilir ve buna göre yaşayabilir.
  İnanç değiştirmek ya da hiçbir inanca sahip olmamak da mümkündür. Hiç kimse bir inanca zorlanamaz.
