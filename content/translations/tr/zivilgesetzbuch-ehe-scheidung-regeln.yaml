    question_de: Welches Gesetz regelt auch, wie eine Ehe geschlossen wird und wie man sich scheiden lässt?
    options_de:
      a: Zivilgesetzbuch
      b: Strafgesetz
      c: Asylgesetz
      d: Bundesgerichtsgesetz
    explanation_de: Das Zivilgesetzbuch regelt das Personenrecht, das Familienrecht, das Erbrecht und
      das Sachenrecht. Eheschliessung und Scheidung gehören ebenfalls dazu. Das Strafgesetz hingegen befasst
      sich mit Straftaten und Strafen.
