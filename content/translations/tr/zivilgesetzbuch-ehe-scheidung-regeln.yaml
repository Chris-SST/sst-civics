id: zivilgesetzbuch-ehe-scheidung-regeln
lang: tr
source_version: 1
question: Hangi kanun, evliliğin nasıl kurulacağını ve nasıl boşanılacağını da düzenler?
options:
  a: Medeni Kanun (Zivilgesetzbuch)
  b: Ceza Kanunu
  c: İltica Kanunu
  d: Federal Mahkeme (Bundesgericht) Kanunu
explanation: Medeni Kanun; kişiler hukukunu, aile hukukunu, miras hukukunu ve eşya hukukunu düzenler.
  Evlenme ve boşanma da bunlara dahildir. Ceza Kanunu ise buna karşılık suçlar ve cezalarla ilgilenir.
