    source_version: 1
    question_de: Können Ausländerinnen und Ausländer, die seit einigen Jahren in der Schweiz leben, an
      eidgenössischen Abstimmungen teilnehmen?
    options_de:
      a: Ja, aber sie können nur an Abstimmungen teilnehmen, nicht an Wahlen.
      b: Ja, wenn sie eine Niederlassungsbewilligung (Ausweis C) haben.
      c: Ja, wenn sie Steuern zahlen.
      d: Nein, sie haben auf nationaler Ebene kein Stimmrecht.
    explanation_de: Das Stimm- und Wahlrecht auf nationaler Ebene ist an das Schweizer Bürgerrecht gebunden.
      Ausländerinnen und Ausländer können dieses Recht erst ausüben, nachdem sie eingebürgert wurden.
