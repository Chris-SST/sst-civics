id: auslaender-kein-stimmrecht-national
lang: tr
source_version: 1
question: Birkaç yıldır İsviçre'de yaşayan yabancılar federal oylamalara katılabilir mi?
options:
  a: Evet, ancak yalnızca oylamalara katılabilirler, seçimlere katılamazlar.
  b: Evet, yerleşim izni (C izni) (Niederlassungsbewilligung) varsa.
  c: Evet, vergi ödüyorlarsa.
  d: Hayır, ulusal düzeyde oy hakkına sahip değillerdir.
explanation: Ulusal düzeydeki oy hakkı, İsviçre vatandaşlığına (Bürgerrecht) bağlıdır. Yabancılar bu hakkı
  ancak vatandaşlığa kabul edildikten sonra kullanabilir.
