id: wallis-gebirgskanton-alpen
lang: tr
source_version: 1
question: Bu kantonlardan hangisi büyük ölçüde dağlarla şekillenmiştir?
options:
  a: Basel-Stadt
  b: Valais (Wallis)
  c: Thurgau
  d: Cenevre
explanation: Valais'de (Wallis) birçok yüksek Alp zirvesi bulunur; bunlar arasında İsviçre'nin en yüksek
  dağı olan Dufourspitze de yer alır. Thurgau, Basel-Stadt ve Cenevre ise daha çok ovalık bölgede ya da
  göllerin ve nehirlerin kıyısında yer alır.
