    question_de: Welche Aussage über die Sozialversicherungen der Schweiz ist richtig?
    options_de:
      a: Die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung (IV) gehören zu
        den Sozialversicherungen der Schweiz.
      b: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung werden ausschliesslich
        von den Gemeinden durchgeführt.
      c: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung sind private Versicherungen
        ohne gesetzliche Grundlage.
      d: Die Alters- und Hinterlassenenversicherung und die Invalidenversicherung sind ausschliesslich
        für Selbstständigerwerbende vorgesehen.
    explanation_de: Die Alters- und Hinterlassenenversicherung (AHV) bedeutet Alters- und Hinterlassenenversicherung;
      die Invalidenversicherung (IV) bedeutet Invalidenversicherung. Beide sind im Recht der Eidgenossenschaft
      geregelt und sind Teil des staatlichen Sozialversicherungssystems.
