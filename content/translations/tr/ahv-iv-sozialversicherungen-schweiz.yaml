id: ahv-iv-sozialversicherungen-schweiz
lang: tr
source_version: 1
question: İsviçre'nin sosyal sigortalarıyla ilgili hangi ifade doğrudur?
options:
  a: Yaşlılık ve dul-yetim sigortası (AHV) ile malullük sigortası (IV), İsviçre'nin sosyal sigortaları
    arasında yer alır.
  b: Yaşlılık ve dul-yetim sigortası ile malullük sigortası yalnızca belediyeler (Gemeinde) tarafından
    yürütülür.
  c: Yaşlılık ve dul-yetim sigortası ile malullük sigortası, yasal dayanağı olmayan özel sigortalardır.
  d: Yaşlılık ve dul-yetim sigortası ile malullük sigortası yalnızca serbest meslek sahipleri için öngörülmüştür.
explanation: Yaşlılık ve dul-yetim sigortası (AHV), Alters- und Hinterlassenenversicherung anlamına gelir;
  malullük sigortası (IV) ise Invalidenversicherung anlamına gelir. Her ikisi de Konfederasyon hukukunda
  düzenlenmiştir ve devletin sosyal sigorta sisteminin parçasıdır.
