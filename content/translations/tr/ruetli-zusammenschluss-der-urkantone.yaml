id: ruetli-zusammenschluss-der-urkantone
lang: tr
source_version: 1
question: Rütli, İsviçre tarihinde neyi simgelemektedir?
options:
  a: İlk kantonların birleşmesini
  b: Marignano Savaşı'ndaki zaferi
  c: Reform hareketinin başlangıcını
  d: 1848'de federal devletin kurulmasını
explanation: Rivayete göre ilk kantonların temsilcileri Rütli'de ittifak kurmuştur. Bu nedenle Rütli,
  İsviçre Konfederasyonu'nun (Eidgenossenschaft) başlangıcının simgesi olarak kabul edilir. Çayır, Vierwaldstättersee
  (Dört Kanton Gölü) kıyısında yer almaktadır.
