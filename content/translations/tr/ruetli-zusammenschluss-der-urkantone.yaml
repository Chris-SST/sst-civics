    question_de: Was symbolisiert das Rütli in der Geschichte der Schweiz?
    options_de:
      a: Die Vereinigung der ersten Kantone
      b: Den Sieg in der Schlacht von Marignano
      c: Den Beginn der Reformationsbewegung
      d: Die Gründung des Bundesstaates im Jahr 1848
    explanation_de: Der Überlieferung nach schlossen die Vertreter der ersten Kantone auf dem Rütli ein
      Bündnis. Deshalb gilt das Rütli als Symbol für den Beginn der Eidgenossenschaft. Die Wiese liegt
      am Ufer des Vierwaldstättersees (See der vier Waldstätten).
