    question_de: Welche Regelung gilt in der Schweiz seit 2002 für den Schwangerschaftsabbruch in den
      ersten zwölf Wochen?
    options_de:
      a: Der Schwangerschaftsabbruch ist in dieser Zeit grundsätzlich verboten.
      b: Die Frau kann selbst über den Schwangerschaftsabbruch entscheiden.
      c: Der Ehepartner oder Partner muss dem Schwangerschaftsabbruch zustimmen.
      d: Ein Gericht muss den Schwangerschaftsabbruch bewilligen.
    explanation_de: Seit 2002 gilt die sogenannte Fristenregelung. Demnach entscheidet die Frau in den
      ersten zwölf Wochen der Schwangerschaft selbst. Dafür muss sie schriftlich erklären, dass sie sich
      in einer Notlage befindet.
