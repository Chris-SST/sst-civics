id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: tr
source_version: 1
question: İsviçre'de 2002'den beri ilk on iki haftada gebeliğin sonlandırılması için hangi düzenleme geçerlidir?
options:
  a: Bu süre içinde gebeliğin sonlandırılması esas olarak yasaktır.
  b: Kadın, gebeliğin sonlandırılmasına kendisi karar verebilir.
  c: Eş veya partner, gebeliğin sonlandırılmasına onay vermek zorundadır.
  d: Gebeliğin sonlandırılmasına bir mahkeme izin vermek zorundadır.
explanation: 2002'den beri sözde süre çözümü (Fristenregelung) geçerlidir. Buna göre kadın, gebeliğin
  ilk on iki haftasında kendisi karar verir. Bunun için yazılı olarak bir sıkıntı durumu içinde olduğunu
  beyan etmesi gerekir.
