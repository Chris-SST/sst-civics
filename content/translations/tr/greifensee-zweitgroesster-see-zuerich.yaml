id: greifensee-zweitgroesster-see-zuerich
lang: tr
source_version: 1
question: Zürih kantonunda Zürih Gölü'nden sonra en büyük ikinci göl hangisidir?
options:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
explanation: Greifensee, Uster ile Dübendorf arasında yer alır ve kantondaki Zürih Gölü'nden sonra en
  büyük ikinci göldür. Pfäffikersee daha küçüktür. Türlersee ve Katzensee ise belirgin biçimde daha da
  küçüktür.
