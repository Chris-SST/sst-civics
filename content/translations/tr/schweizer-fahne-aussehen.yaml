question: İsviçre bayrağı nasıl görünür?
options:
  a: Kırmızı kare zemin üzerinde beyaz, serbest duran bir haç
  b: Kırmızı zemin üzerinde, ortasında bir arma bulunan beyaz bir haç
  c: Kırmızı dikdörtgenin kenarına kadar uzanan beyaz bir haç
  d: Beyaz kare zemin üzerinde kırmızı, serbest duran bir haç
explanation: İsviçre bayrağı karedir. Kırmızı zemin üzerinde, kolları kenarlara değmeyen beyaz bir haç
  gösterir. Vatikan bayrağının yanı sıra, kare biçimli iki ulusal bayraktan biridir.
