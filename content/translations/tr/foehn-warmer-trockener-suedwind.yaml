id: foehn-warmer-trockener-suedwind
lang: tr
source_version: 1
question: Föhn nedir?
options:
  a: Kuzeyden esen soğuk ve nemli bir rüzgâr
  b: Kışın doğudan esen soğuk bir rüzgâr
  c: İlkbaharda yağan şiddetli bir yağmur
  d: Güney yönünden esen sıcak ve kuru bir rüzgâr
explanation: Föhn, Alpler'de özellikle güneyden esen sıcak ve kuru bir alçalan rüzgârdır. Sıcaklıkların
  hızla yükselmesine neden olabilir ve görüş mesafesini çok açık hâle getirebilir.
