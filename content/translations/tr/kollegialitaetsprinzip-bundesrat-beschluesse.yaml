id: kollegialitaetsprinzip-bundesrat-beschluesse
lang: tr
source_version: 1
question: Federal Konsey (Bundesrat) içinde ortaklık ilkesi (Kollegialitätsprinzip) ne anlama gelir?
options:
  a: Konfederasyon Başkanı (Bundespräsident) tek başına karar verir.
  b: Üyeler, Federal Konsey'in kararlarını dışarıya karşı tek ses olarak savunur.
  c: Her üye, kendi bakanlığında diğer üyelerle görüşmeden karar verir.
  d: Üyeler, farklı görüşlerini kamuoyu önünde savunabilir.
explanation: Federal Konsey, kurul olarak karar verir. Federal Konsey içinde farklı bir görüşü savunmuş
  olan kişi bile kararı dışarıya karşı birlikte destekler. Böylece hükümet birlik içinde hareket eder.
