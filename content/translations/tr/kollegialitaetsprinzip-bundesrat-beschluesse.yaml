    question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
    options_de:
      a: Der Bundespräsident entscheidet allein.
      b: Die Mitglieder vertreten die Beschlüsse des Bundesrates nach aussen mit einer Stimme.
      c: Jedes Mitglied entscheidet in seinem eigenen Departement, ohne sich mit den anderen Mitgliedern
        zu besprechen.
      d: Die Mitglieder dürfen ihre unterschiedlichen Ansichten öffentlich vertreten.
    explanation_de: Der Bundesrat entscheidet als Kollegium. Auch wer im Bundesrat eine andere Meinung
      vertreten hat, unterstützt den Beschluss nach aussen gemeinsam. So handelt die Regierung geschlossen.
