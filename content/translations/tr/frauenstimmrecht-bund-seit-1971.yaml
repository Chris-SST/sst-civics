id: frauenstimmrecht-bund-seit-1971
lang: tr
source_version: 1
question: Kadınlar İsviçre'de ulusal düzeyde ne zamandan beri seçme ve oy kullanma hakkına sahiptir?
options:
  a: 1918'den beri
  b: 1848'den beri
  c: 1971'den beri
  d: 1991'den beri
explanation: Konfederasyon düzeyinde kadınların oy hakkı 1971'de getirildi. Bazı kantonlar ve belediyeler
  (Gemeinden) bu hakkı daha erken tanımıştı, diğerleri ise ancak daha sonra getirdi. En son kanton olarak
  1990'da Appenzell Innerrhoden izledi.
