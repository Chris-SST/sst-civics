id: zollwesen-zustaendigkeit-bund
lang: tr
source_version: 1
question: İsviçre'de gümrük işlerini kim yürütür?
options:
  a: Konfederasyon
  b: Sınırdaki belediyeler (Gemeinden)
  c: Sınırların bulunduğu kantonlar
  d: Kantonlar ve Konfederasyon yarı yarıya
explanation: Federal Anayasa'ya göre gümrük işleri Konfederasyonun görevidir. Konfederasyon, gümrük vergilerini
  ve sınır ötesi mal trafiğinde yapılan kontrolü düzenler. Kantonların ve belediyelerin bu konuda kendilerine
  ait bir yetkisi yoktur.
