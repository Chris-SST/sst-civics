    question_de: Wer führt in der Schweiz die Zollangelegenheiten?
    options_de:
      a: Der Bund
      b: Die Gemeinden an der Grenze
      c: Die Kantone, in denen die Grenzen liegen
      d: Die Kantone und der Bund je zur Hälfte
    explanation_de: Gemäss der Bundesverfassung sind die Zollangelegenheiten Aufgabe des Bundes. Der Bund
      regelt die Zölle und die Kontrolle im grenzüberschreitenden Warenverkehr. Die Kantone und die Gemeinden
      haben in diesem Bereich keine eigene Zuständigkeit.
