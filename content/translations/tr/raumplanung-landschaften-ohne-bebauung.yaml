id: raumplanung-landschaften-ohne-bebauung
lang: tr
source_version: 2
question: İsviçre'de mekânsal planlamanın hedeflerinden biri nedir?
options:
  a: Yapılaşmamış doğal alanları korumalı ve araziyi tutumlu kullanmalıdır.
  b: Kantonlar arasındaki sınırları düzenli olarak yeniden belirlemelidir.
  c: Mümkün olduğunca çok yeni imar bölgesi (Bauzone) oluşturmalıdır.
  d: İnşaat arazisinin fiyatını belirlemelidir.
explanation: Mekânsal planlama, nerede inşaat yapılabileceğini ve nerede yapılamayacağını belirler. Yapılaşmaya
  açık alanları yapılaşmaya kapalı alanlardan ayırır; böylece doğal alanlar ve tarım arazileri korunur.
  Arazi sınırlı olduğu için tutumlu kullanılmalı ve yeni imar bölgeleri oluşturmak yerine mevcut yerleşim
  alanları daha yoğun hale getirilmelidir.
