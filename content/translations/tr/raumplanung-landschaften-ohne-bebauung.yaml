    question_de: Was ist eines der Ziele der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll unbebaute natürliche Flächen schützen und den Boden haushälterisch nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis des Baulands festlegen.
    explanation_de: Die Raumplanung bestimmt, wo gebaut werden darf und wo nicht. Sie trennt die für die
      Bebauung offenen Gebiete von den für die Bebauung geschlossenen Gebieten; so werden natürliche Flächen
      und landwirtschaftliche Flächen geschützt. Da der Boden begrenzt ist, muss er haushälterisch genutzt
      werden, und anstatt neue Bauzonen zu schaffen, sollen die bestehenden Siedlungsgebiete dichter gemacht
      werden.
