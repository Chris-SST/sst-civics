    question_de: Nach welchem Gesetz wird bestimmt, ob eine Person eine Freiheitsstrafe verbüssen wird?
    options_de:
      a: Nach dem Zivilgesetzbuch
      b: Nach dem Obligationenrecht
      c: Nach dem Mietrecht
      d: Nach dem Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch bestimmt, welche Handlungen eine Straftat darstellen und welche
      Strafen dafür verhängt werden können. Dazu gehören Geldstrafen und freiheitsentziehende Strafen.
      Über die im konkreten Fall zu verhängende Strafe entscheidet ein Gericht.
