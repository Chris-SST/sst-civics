id: strafgesetzbuch-haftstrafe-entscheid
lang: tr
source_version: 1
question: Bir kişinin hapis cezası çekip çekmeyeceği hangi kanuna göre belirlenir?
options:
  a: Medeni Kanun'a göre
  b: Borçlar Hukuku'na göre
  c: Kira Hukuku'na göre
  d: Ceza Kanunu'na göre
explanation: Ceza Kanunu, hangi fiillerin suç oluşturduğunu ve bunlar için hangi cezaların verilebileceğini
  belirler. Bunlar arasında para cezaları ve özgürlüğü bağlayıcı cezalar yer alır. Somut olayda verilecek
  cezaya ise bir mahkeme karar verir.
