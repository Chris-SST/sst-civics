id: wohnortswechsel-anmeldung-einwohnerkontrolle
lang: tr
source_version: 1
question: Başka bir Zürih belediyesine (Gemeinde) taşındığınızda nerede kayıt yaptırmanız gerekir?
options:
  a: İlçe mahkemesinde
  b: Konfederasyon İstatistik Dairesi'nde
  c: Kanton polisinde
  d: Yeni ikamet edilen belediyenin nüfus kayıt dairesinde (Einwohnerkontrolle)
explanation: Kayıt, Einwohnerkontrolle'de yapılır; buraya Einwohneramt da denir. Burası belediyenin sakinlerine
  ait sicili tutar.
