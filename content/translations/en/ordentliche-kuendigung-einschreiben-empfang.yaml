    question_de: Wie soll eine ordentliche Kündigung eines Arbeitsverhältnisses zugestellt werden, damit
      der Empfang nachgewiesen werden kann?
    options_de:
      a: Durch Meldung an die Gemeindeverwaltung
      b: Per eingeschriebenen Brief, oder die andere Partei bestätigt den Empfang schriftlich
      c: Per gewöhnliche E-Mail ohne Bestätigung
      d: Mündlich in einem privaten Gespräch
