    question_de: Wer gibt den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative
      eine Empfehlung ab, ob sie die Initiative annehmen oder ablehnen sollen?
    options_de:
      a: Der Bundesrat und das Parlament
      b: Die Kantonsregierungen
      c: Die Bundeskanzlei allein
      d: Das Bundesgericht
    explanation_de: Sobald eine Volksinitiative formell eingereicht und für gültig erklärt wurde, nehmen
      der Bundesrat und das Parlament dazu Stellung. Das Parlament empfiehlt den Stimmberechtigten, sie
      anzunehmen oder abzulehnen. Diese Empfehlung ist auch in den Abstimmungserläuterungen enthalten,
      die die Stimmberechtigten vor der Abstimmung erhalten.
