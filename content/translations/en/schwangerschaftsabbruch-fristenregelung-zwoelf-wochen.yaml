id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
lang: en
source_version: 1
question: Which rule has applied in Switzerland since 2002 to the termination of pregnancy in the first
  twelve weeks?
options:
  a: In principle, termination is prohibited during this period.
  b: The woman can decide for herself about the termination.
  c: The husband or partner must consent to the termination.
  d: A court must authorise the termination.
explanation: Since 2002, the so-called time-limit rule (Fristenregelung) has applied. Under it, the woman
  decides for herself during the first twelve weeks of pregnancy. To do so, she must state in writing
  that she is in a situation of distress.
