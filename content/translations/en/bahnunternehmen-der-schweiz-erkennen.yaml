question: Which of the following abbreviations all stand for railway companies in Switzerland?
options:
  a: SOB, SEM, BLS and SZU
  b: SBB, BLS, SOB and SZU
  c: SBB, SRF, SOB and SUVA
  d: BLS, SZU, SNB and SBB
explanation: SBB, BLS, SOB and SZU are railway companies that operate trains in Switzerland. The SBB is
  the largest company; the others are smaller railways that often operate regionally. The other abbreviations
  stand for organisations such as the National Bank (SNB), the State Secretariat for Migration (SEM) or
  the accident insurance (SUVA).
