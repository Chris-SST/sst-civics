id: stimmrecht-bund-ab-18-jahren
lang: en
source_version: 2
question: Who is allowed to vote in elections and referendums at federal level?
options:
  a: Swiss nationals aged 20 or over
  b: All persons with a settlement permit (C permit) (Niederlassungsbewilligung) aged 18 or over
  c: Swiss nationals aged 18 or over
  d: All persons resident in Switzerland aged 16 or over
explanation: In the Confederation, Swiss men and women may vote and elect from their 18th birthday. Foreign
  nationals do not have this right at federal level, even with a settlement permit. Swiss citizens living
  abroad may also take part if they have themselves entered in the electoral register.
