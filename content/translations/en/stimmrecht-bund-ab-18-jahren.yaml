question: Who has the right to vote and to stand for election at federal level?
options:
  a: Swiss citizens who are 20 years old
  b: All persons with a settlement permit (C permit) (Niederlassungsbewilligung) aged 18 or over
  c: Swiss citizens who are 18 years old
  d: All persons resident in Switzerland aged 16 or over
explanation: At federal level, Swiss citizens have the right to vote and to vote in elections from the
  completed age of 18. Nationality is just as necessary as age. Residence in Switzerland does not matter.
