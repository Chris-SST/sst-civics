    question_de: Wer darf auf Bundesebene an Wahlen und Abstimmungen teilnehmen?
    options_de:
      a: Schweizer Staatsangehörige ab 20 Jahren
      b: Alle Personen mit einer Niederlassungsbewilligung (Niederlassungsbewilligung C) ab 18 Jahren
      c: Schweizer Staatsangehörige ab 18 Jahren
      d: Alle in der Schweiz wohnhaften Personen ab 16 Jahren
    explanation_de: Im Bund dürfen Schweizer Männer und Frauen ab ihrem 18. Geburtstag abstimmen und wählen.
      Ausländische Staatsangehörige haben dieses Recht auf Bundesebene nicht, auch nicht mit einer Niederlassungsbewilligung.
      Auch im Ausland lebende Schweizer Bürgerinnen und Bürger können teilnehmen, wenn sie sich selbst
      ins Stimmregister eintragen lassen.
