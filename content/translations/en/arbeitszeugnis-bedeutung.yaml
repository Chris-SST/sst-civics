    question_de: Was ist ein Arbeitszeugnis?
    options_de:
      a: Eine Bestätigung von einem Arzt, dass eine Person nicht arbeiten kann
      b: Ein Dokument des Arbeitgebers, das die Leistung und das Verhalten des Arbeitnehmers beurteilt
      c: Die Bewilligung des Migrationsamts, in der Schweiz zu arbeiten
      d: Der jährliche Lohnausweis für die Steuererklärung
    explanation_de: Ein Arbeitszeugnis wird vom Arbeitgeber ausgestellt. Es beschreibt die Art und Dauer
      der Arbeit und beurteilt Leistung und Verhalten. Arbeitnehmende können es jederzeit verlangen.
