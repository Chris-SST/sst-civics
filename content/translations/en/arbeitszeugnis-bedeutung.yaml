id: arbeitszeugnis-bedeutung
lang: en
source_version: 1
question: What is an employment reference (Arbeitszeugnis)?
options:
  a: A confirmation from a doctor that a person cannot work
  b: A document from the employer that assesses the performance and conduct of the employee
  c: The permit from the migration office to work in Switzerland
  d: The annual salary statement for the tax return
explanation: An employment reference (Arbeitszeugnis) is issued by the employer. It describes the type
  and duration of the work and assesses performance and conduct. Employees can request it at any time.
