    question_de: Wer in der Schweiz muss keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
    options_de:
      a: Personen in einem unbefristeten Arbeitsverhältnis
      b: Personen, die das ordentliche Rentenalter der Alters- und Hinterlassenenversicherung (AHV) erreicht
        haben
      c: Personen, die Teilzeit arbeiten
      d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
    explanation_de: Die Beitragspflicht zur Arbeitslosenversicherung endet, wenn eine Person das AHV-Rentenalter
      erreicht. Wer pensioniert ist, bezahlt auf einem allfälligen Lohn keine ALV-Beiträge mehr. Teilzeit-
      und Vollzeitangestellte bezahlen hingegen Beiträge.
