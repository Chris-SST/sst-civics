    question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Zürcher Gemeinde oder Stadt?
    options_de:
      a: Er vertritt die Anliegen der Anwohnerinnen und Anwohner gegenüber den Behörden und fördert das
        Gemeinschaftsleben.
      b: Er führt das Einwohnerkontrollamt für das Quartier.
      c: Er erhebt Steuern bei den Einwohnerinnen und Einwohnern des Quartiers.
      d: Er genehmigt Baugesuche im Quartier.
    explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Anwohnerinnen und Anwohnern.
      Er bringt die Anliegen des Quartiers bei den Behörden vor und organisiert Veranstaltungen, die das
      Gemeinschaftsleben stärken. Hoheitliche Aufgaben wie Steuern, Baubewilligungen oder die Einwohnerkontrolle
      gehören zur Gemeinde.
