    question_de: Welche Rolle haben die Gewerkschaften in der Schweiz?
    options_de:
      a: Sie setzen sich für die Anliegen der Arbeitnehmenden ein.
      b: Sie erteilen Ausländerinnen und Ausländern die Erlaubnis zu arbeiten.
      c: Sie legen die Steuersätze für Unternehmen fest.
      d: Sie vertreten die Anliegen der Arbeitgeber gegenüber dem Bund.
    explanation_de: Gewerkschaften sind Organisationen von Arbeitnehmenden. Sie vertreten die Interessen
      der Arbeitnehmenden, zum Beispiel in Bezug auf Löhne und Arbeitsbedingungen, und handeln oft Gesamtarbeitsverträge
      mit den Arbeitgebern aus. Arbeitsbewilligungen hingegen werden von den Behörden erteilt, nicht von
      den Gewerkschaften.
