question: What is the role of trade unions in Switzerland?
options:
  a: They stand up for the concerns of employees.
  b: They grant foreign nationals permission to work.
  c: They set the tax rates for companies.
  d: They represent the concerns of employers towards the Confederation.
explanation: Trade unions are organisations of employees. They represent employees' interests, for example
  regarding wages and working conditions, and they often negotiate collective labour agreements with employers.
  Work permits, on the other hand, are issued by the authorities, not by trade unions.
