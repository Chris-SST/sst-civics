    question_de: Was bedeutet der Begriff «Ständemehr» (Mehrheit der Kantone) bei eidgenössischen Abstimmungen?
    options_de:
      a: Die Mehrheit der Kantone muss der Vorlage zustimmen.
      b: Die Mehrheit der Gemeinden muss der Vorlage zustimmen.
      c: Die Mehrheit der Parteien muss der Vorlage zustimmen.
      d: Die Mehrheit der Mitglieder des Ständerates muss anwesend sein.
    explanation_de: Das Ständemehr verlangt, dass eine Mehrheit der Kantone einer Vorlage zustimmt. Die
      Stimme eines Kantons wird durch das Ergebnis der Volksabstimmung in diesem Kanton bestimmt. Bei
      Änderungen der Verfassung wird zusätzlich zum Volksmehr die Mehrheit der Kantone benötigt.
