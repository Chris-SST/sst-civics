id: volksinitiative-doppeltes-mehr
lang: en
source_version: 2
question: What does a federal popular initiative (Volksinitiative) need in order to be accepted in the
  vote?
options:
  a: The yes vote of two thirds of those voting
  b: The yes vote of the Federal Council (Bundesrat) and the majority of those voting
  c: The yes vote of the majority of those voting and the majority of the cantons
  d: Only the yes vote of the majority of those voting
explanation: 'A federal popular initiative aims to amend the Federal Constitution. It therefore requires
  a double majority: the majority of those voting (popular majority (Volksmehr)) and the majority of the
  cantons (majority of the cantons (Ständemehr)) must vote yes. By contrast, for a cantonal initiative
  in the canton of Zürich, the majority of those voting is sufficient.'
