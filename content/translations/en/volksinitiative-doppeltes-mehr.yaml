    question_de: Was braucht eine eidgenössische Volksinitiative, um in der Abstimmung angenommen zu werden?
    options_de:
      a: Das Ja von zwei Dritteln der Stimmenden
      b: Das Ja des Bundesrates und der Mehrheit der Stimmenden
      c: Das Ja der Mehrheit der Stimmenden und der Mehrheit der Kantone
      d: Nur das Ja der Mehrheit der Stimmenden
    explanation_de: 'Eine eidgenössische Volksinitiative zielt darauf ab, die Bundesverfassung zu ändern.
      Sie erfordert daher ein doppeltes Mehr: Die Mehrheit der Stimmenden (Volksmehr) und die Mehrheit
      der Kantone (Ständemehr) müssen mit Ja stimmen. Dagegen genügt bei einer kantonalen Initiative im
      Kanton Zürich die Mehrheit der Stimmenden.'
