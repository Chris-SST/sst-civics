    question_de: Was gilt bei Verhaftung und Haft in einem Rechtsstaat?
    options_de:
      a: Der Staat darf niemanden ohne Grund verhaften und einsperren.
      b: Der Staat darf Personen nach eigenem Ermessen festhalten.
      c: Die Regierung darf Kritiker vorsorglich in Gewahrsam nehmen.
      d: Nur Ausländer dürfen ohne Grund verhaftet werden.
    explanation_de: In einem Rechtsstaat ist das staatliche Handeln an das Gesetz gebunden. Eine Verhaftung
      oder Haft erfordert einen gesetzlichen Grund. Dies schützt die Freiheit der Menschen vor willkürlicher
      Behandlung.
