id: roemisches-amphitheater-avenches
lang: en
source_version: 1
question: In which Swiss town did the Romans build an amphitheatre whose remains can still be seen today?
options:
  a: Chur
  b: Thun
  c: Sion
  d: Avenches
explanation: In Roman times, Avenches was called Aventicum and was an important town. The amphitheatre
  there is a well-known testimony to the Roman era in Switzerland. The other towns are not known for this
  structure.
