      a: Die Kinder erhalten automatisch den Namen des Vaters.
      b: Das Zivilstandsamt entscheidet nach der alphabetischen Reihenfolge der Namen.
      c: Die Ehegatten wählen den Namen ihrer Kinder selbst.
