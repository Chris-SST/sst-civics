    question_de: Welche dieser Pflanzen wurde während des Zweiten Weltkriegs auf dem Sechseläutenplatz
      in Zürich angebaut?
    options_de:
      a: Tabak
      b: Reben
      c: Baumwolle
      d: Kartoffeln
    explanation_de: Während des Zweiten Weltkriegs hatte die Schweiz nicht genug Nahrungsmittel. Aus diesem
      Grund führte die «Anbauschlacht» (die «Schlacht des Pflugs», eine nationale Kampagne zum Anbau von
      mehr Nahrungsmitteln) dazu, dass auch Land mitten in Dörfern und Städten bepflanzt wurde, zum Beispiel
      der Sechseläutenplatz in Zürich, der mit Kartoffeln bepflanzt wurde. Tabak, Reben und Baumwolle
      wurden dort nicht angebaut.
