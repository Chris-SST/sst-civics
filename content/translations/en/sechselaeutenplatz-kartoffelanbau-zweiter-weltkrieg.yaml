question: Which of these plants was grown on the Sechseläutenplatz in Zurich during the Second World War?
options:
  a: Tobacco
  b: Grapevines
  c: Cotton
  d: Potatoes
explanation: During the Second World War, Switzerland did not have enough food. For this reason, the "Anbauschlacht"
  (the "Battle of the Plough", a national campaign to grow more food) led to land in the middle of towns
  and cities being planted as well, for example the Sechseläutenplatz in Zurich, which was planted with
  potatoes. Tobacco, grapevines and cotton were not grown there.
