question: Which well-known humanitarian organisation was founded in Geneva in 1863?
options:
  a: The United Nations (UN)
  b: The World Health Organization (WHO)
  c: The World Food Programme (WFP)
  d: The International Committee of the Red Cross (ICRC)
explanation: The ICRC was established in Geneva in 1863, partly on the initiative of Henry Dunant. It
  represents Switzerland's humanitarian tradition. The other organisations were founded later.
