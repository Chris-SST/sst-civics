question: Between whom was the Sonderbund War fought in Switzerland in 1847?
options:
  a: Between the German-speaking and the French-speaking cantons
  b: Between the liberal forces and the Catholic cantons
  c: Between urban and rural cantons over taxes
  d: Between Switzerland and France
explanation: Several Catholic-conservative cantons had joined together in the Sonderbund (Separate League).
  The liberal forces wanted a stronger Confederation. The short war ended with the victory of the liberal
  side and paved the way for the federal state of 1848.
