question: In which law are the rules for renting a flat set out?
options:
  a: In the Code of Obligations
  b: In the Employment Act
  c: In the Criminal Code
  d: In the Road Traffic Act
explanation: The rules on the rental of flats are set out in the Code of Obligations (OR). It states,
  for example, what applies in a tenancy agreement, how high the rent may be and how to give notice of
  termination. The Civil Code (ZGB), by contrast, mainly governs matters such as family, marriage and
  inheritance.
