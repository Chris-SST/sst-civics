    question_de: In welchem Gesetz sind die Regeln für die Miete einer Wohnung festgelegt?
    options_de:
      a: Im Obligationenrecht
      b: Im Arbeitsgesetz
      c: Im Strafgesetzbuch
      d: Im Strassenverkehrsgesetz
    explanation_de: Die Regeln zur Miete von Wohnungen sind im Obligationenrecht (OR) festgelegt. Es besagt
      zum Beispiel, was in einem Mietvertrag gilt, wie hoch der Mietzins sein darf und wie man kündigt.
      Das Zivilgesetzbuch (ZGB) hingegen regelt hauptsächlich Angelegenheiten wie Familie, Ehe und Erbschaft.
