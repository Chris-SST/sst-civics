id: glaubensfreiheit-religion-ueberzeugung-leben
lang: en
source_version: 1
question: According to the Federal Constitution, what is part of freedom of religion and conscience?
options:
  a: The right to hold a belief and a conviction and to live according to it
  b: Only membership of a recognised cantonal church
  c: The obligation to keep the faith of one's parents
  d: The right to oblige others to adopt one's own faith
explanation: Every person may freely choose their religion and their philosophical conviction and live
  according to it. One may also change one's faith or have none. No one may be forced to adopt a faith.
