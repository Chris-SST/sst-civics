    question_de: Was gehört gemäss der Bundesverfassung zur Religions- und Gewissensfreiheit?
    options_de:
      a: Das Recht, einen Glauben und eine Überzeugung zu haben und danach zu leben
      b: Nur die Mitgliedschaft in einer anerkannten kantonalen Kirche
      c: Die Pflicht, den Glauben der eigenen Eltern beizubehalten
      d: Das Recht, andere zu verpflichten, den eigenen Glauben anzunehmen
    explanation_de: Jede Person darf ihre Religion und ihre weltanschauliche Überzeugung frei wählen und
      danach leben. Man darf auch seinen Glauben wechseln oder keinen haben. Niemand darf gezwungen werden,
      einen Glauben anzunehmen.
