question: Where can you find information about the services and rules of your own commune (Gemeinde)?
options:
  a: In the Federal Gazette (Bundesblatt) of the Confederation
  b: In the local newspaper or on the website of the commune
  c: At the embassy of your country of origin
  d: At the Federal Council (Bundesrat) in Bern
explanation: The commune provides information about its services and rules mainly in the local newspaper
  and on its website on the internet. The Confederation and the Federal Council are responsible for national
  matters, and a foreign embassy is not responsible for the commune at all. The municipal administration
  also provides information.
