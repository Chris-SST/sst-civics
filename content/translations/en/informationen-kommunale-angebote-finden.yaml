    question_de: Wo kann man sich über die Dienstleistungen und Regeln der eigenen Gemeinde informieren?
    options_de:
      a: Im Bundesblatt des Bundes
      b: In der lokalen Zeitung oder auf der Website der Gemeinde
      c: Bei der Botschaft des Herkunftslandes
      d: Beim Bundesrat in Bern
    explanation_de: Die Gemeinde informiert hauptsächlich in der lokalen Zeitung und auf ihrer Website
      im Internet über ihre Dienstleistungen und Regeln. Der Bund und der Bundesrat sind für nationale
      Angelegenheiten zuständig, und eine ausländische Botschaft ist für die Gemeinde überhaupt nicht
      zuständig. Auch die Gemeindeverwaltung gibt Auskunft.
