question: Which people settled in the area of present-day Switzerland at the time of the Romans?
options:
  a: The Huns
  b: The Vikings
  c: The Goths
  d: The Helvetii
explanation: The Helvetii were a Celtic tribe in the Mittelland (the Swiss Plateau). The Romans subjugated
  them and the territory became part of the Roman Empire. The Latin name Helvetia for Switzerland still
  recalls them.
