    question_de: Eine Frau zieht in die Schweiz und möchte ihre Religion selbst wählen. Sie erwägt auch,
      überhaupt keiner Religion anzugehören. Was garantiert ihr die Bundesverfassung in dieser Hinsicht?
    options_de:
      a: Sie darf nur einer Religion angehören, die im Kanton öffentlich-rechtlich offiziell anerkannt
        ist.
      b: Sie darf ihre Religion frei wählen, sie ausüben oder keiner Religion angehören.
      c: Sie darf ihre Religion privat wählen, darf sie aber nirgends gemeinsam mit anderen ausüben.
      d: Sie muss sich bei der Gemeinde für eine anerkannte Religion entscheiden.
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung garantiert.
      Jede Person darf ihre Religion frei wählen, sie allein oder mit anderen ausüben oder keiner Religion
      angehören. Niemand darf gezwungen werden, einer Religionsgemeinschaft beizutreten.
