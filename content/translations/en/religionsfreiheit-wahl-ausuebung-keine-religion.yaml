id: religionsfreiheit-wahl-ausuebung-keine-religion
lang: en
source_version: 1
question: A woman is moving to Switzerland and wants to choose her religion herself. She is also considering
  not belonging to any religion at all. What does the Federal Constitution guarantee her in this regard?
options:
  a: She may only belong to a religion that is officially recognised under public law in the canton.
  b: She may freely choose her religion, practise it, or not belong to any religion.
  c: She may choose her religion in private, but may not practise it together with others anywhere.
  d: She must decide on a recognised religion at the commune (Gemeinde).
explanation: Freedom of belief and conscience is guaranteed in Article 15 of the Federal Constitution.
  Every person may freely choose their religion, practise it alone or with others, or not belong to any
  religion. No one may be forced to join a religious community.
