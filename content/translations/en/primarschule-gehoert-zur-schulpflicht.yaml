question: Which of these stages is part of compulsory schooling in Switzerland?
options:
  a: University (Hochschule)
  b: Primary school
  c: Playgroup
  d: Vocational school
explanation: 'In the canton of Zurich, compulsory schooling lasts eleven years: kindergarten, primary
  school and lower secondary level. Playgroup for young children is voluntary. Vocational school and university
  are attended only after compulsory schooling.'
