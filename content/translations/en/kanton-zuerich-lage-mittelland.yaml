question: Which of Switzerland's major landscape regions does the canton of Zurich belong to?
options:
  a: The Southern Alps
  b: The Jura
  c: The Central Plateau (Mittelland)
  d: The Central Alps
explanation: The canton of Zurich belongs to the Central Plateau, that is, the flatter area between the
  Jura in the north-west and the Alps in the south. The Central Plateau is the most densely populated
  part of Switzerland.
