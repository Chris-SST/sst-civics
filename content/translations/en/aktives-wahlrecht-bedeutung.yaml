id: aktives-wahlrecht-bedeutung
lang: en
source_version: 3
question: What does the active right to vote mean?
options:
  a: The right to found a political party
  b: The right to be elected to an office yourself
  c: The right to submit parliamentary proposals in Parliament
  d: The right to take part in elections and votes and to cast your own vote
explanation: Anyone who has the active right to vote may cast their own vote in elections and votes, for
  example in the election of the National Council (Nationalrat) or in a popular vote. The right to be
  elected to an office yourself, on the other hand, is called the passive right to vote.
