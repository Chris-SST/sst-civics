    question_de: Was bedeutet das aktive Wahlrecht?
    options_de:
      a: Das Recht, eine politische Partei zu gründen
      b: Das Recht, selbst in ein Amt gewählt zu werden
      c: Das Recht, im Parlament parlamentarische Vorstösse einzureichen
      d: Das Recht, an Wahlen und Abstimmungen teilzunehmen und die eigene Stimme abzugeben
    explanation_de: Wer das aktive Wahlrecht hat, darf bei Wahlen und Abstimmungen die eigene Stimme abgeben,
      zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, selbst in
      ein Amt gewählt zu werden, nennt man dagegen das passive Wahlrecht.
