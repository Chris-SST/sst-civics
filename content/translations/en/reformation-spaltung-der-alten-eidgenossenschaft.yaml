question: What consequence did the Reformation have for Switzerland?
options:
  a: Switzerland was religiously divided into a Reformed part and a Catholic part.
  b: Switzerland became part of the German Empire.
  c: The Church lost all influence on politics everywhere.
  d: All the cantons of the Confederation became Reformed.
explanation: Some cantons adopted the Reformation, while others remained Catholic. This created a religious
  divide that placed a strain on the Confederation for a long time. There were also conflicts between
  the denominations.
