question: What happens at the Morgestraich, the start of the Basel Fasnacht carnival?
options:
  a: The mayor hands over the key to the city to the carnival society.
  b: The streets are brightly lit and a firework display begins.
  c: The lights in the streets go out, then piccolos and drums begin to play.
  d: The carnival participants throw confetti from the Minster tower and ring all the church bells.
explanation: The Morgestraich begins on the Monday after Ash Wednesday at four o'clock in the morning.
  The lights in the streets are then put out. After that, the playing of piccolos and drums begins.
