    question_de: Die Altersvorsorge in der Schweiz beruht auf drei Säulen. Welche Institution bildet die
      zweite Säule?
    options_de:
      a: Ergänzungsleistungen zur Alters- und Hinterlassenenversicherung (AHV)
      b: Die AHV (staatliche Rentenversicherung)
      c: Die Pensionskasse (berufliche Vorsorge)
      d: Das private Sparkonto mit Steuerabzug (Säule 3a)
    explanation_de: Die Pensionskasse ist Teil der beruflichen Vorsorge und bildet die zweite Säule. Sie
      ergänzt die AHV, damit Rentnerinnen und Rentner ihren gewohnten Lebensstandard in angemessener Weise
      weiterführen können. Die AHV ist die erste Säule und die private Vorsorge ist die dritte Säule.
