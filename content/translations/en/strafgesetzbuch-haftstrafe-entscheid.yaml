    question_de: Nach welchem Gesetz wird bestimmt, ob jemand eine Gefängnisstrafe absitzen muss?
    options_de:
      a: Nach dem Zivilgesetzbuch
      b: Nach dem Obligationenrecht
      c: Nach dem Mietrecht
      d: Nach dem Strafgesetzbuch
    explanation_de: Das Strafgesetzbuch legt fest, welche Handlungen strafbar sind und welche Strafen
      dafür möglich sind. Dazu gehören Geldstrafen und Freiheitsstrafen. Ein Gericht entscheidet im Einzelfall
      über die Strafe.
