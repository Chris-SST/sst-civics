question: Switzerland is structured on three levels of state. Which level is the highest?
options:
  a: The communes (Gemeinden)
  b: The Confederation
  c: The cantons
  d: The districts
explanation: The Confederation is the highest of the three levels of state. Below it come the cantons
  and then the communes. Districts are not a level of state in their own right, but in some cantons are
  merely administrative units within the canton.
