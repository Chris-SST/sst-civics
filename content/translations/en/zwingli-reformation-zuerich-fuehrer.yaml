question: Who led the Reformation in Zurich in the 1520s?
options:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martin Luther
  d: John Calvin
explanation: Ulrich Zwingli was the people's priest at the Grossmünster and introduced the Reformation
  in Zurich. The city council supported him in this. Calvin worked in Geneva, Luther in Germany.
