question: Which Christian denomination emerged from the Reformation in the 16th century?
options:
  a: Coptic Christianity
  b: Roman Catholic Christianity
  c: Orthodox Christianity
  d: Protestant Christianity
explanation: The Reformation was a movement for renewal within the Church of the Middle Ages. Protestant
  Christianity emerged from it. In Zurich, Huldrych Zwingli was active in this movement.
