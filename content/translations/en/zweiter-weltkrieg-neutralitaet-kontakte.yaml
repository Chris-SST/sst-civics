    question_de: Wie verhielt sich die Schweiz während des Zweiten Weltkriegs?
    options_de:
      a: Sie brach alle Kontakte zu den Kriegsparteien ab und schloss ihre Grenzen vollständig.
      b: Sie schloss sich Deutschland an und stellte Truppen zur Verfügung.
      c: Sie blieb neutral und pflegte politische und wirtschaftliche Kontakte zu den Kriegsparteien.
      d: Sie schloss sich dem Bündnis der Alliierten an und kämpfte an deren Seite.
    explanation_de: Die Schweiz wurde während des Zweiten Weltkriegs nicht zur Kriegspartei. Sie unterhielt
      jedoch politische und wirtschaftliche Kontakte zu den Kriegsparteien. Diese Haltung wird von Historikern
      bis heute diskutiert.
