question: How did Switzerland behave during the Second World War?
options:
  a: It broke off all contact with the warring parties and closed its borders completely.
  b: It joined Germany and supplied troops.
  c: It remained neutral and maintained political and economic contacts with the warring parties.
  d: It joined the Allied alliance and fought alongside them.
explanation: Switzerland did not become a party to the war during the Second World War. However, it maintained
  political and economic contacts with the warring parties. This stance is still debated by historians
  today.
