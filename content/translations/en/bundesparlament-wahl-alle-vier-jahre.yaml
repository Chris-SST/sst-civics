id: bundesparlament-wahl-alle-vier-jahre
lang: en
source_version: 2
question: How often do the people elect the federal parliament anew?
options:
  a: Every three years
  b: Every four years
  c: Every six years
  d: Every two years
explanation: The people elect the National Council (Nationalrat) anew every four years. The members of
  the Council of States are also now elected for four years in all cantons. How they are elected, and
  in some cases also when, is determined by each canton itself.
