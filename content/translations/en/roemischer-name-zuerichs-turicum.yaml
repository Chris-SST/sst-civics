question: What was the Roman name for Zurich?
options:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
explanation: 'The Romans called their settlement and customs station on the Limmat Turicum. The name Zurich
  later developed from this. The other names belong to Roman places in present-day Switzerland: Windisch,
  Augst and Avenches.'
