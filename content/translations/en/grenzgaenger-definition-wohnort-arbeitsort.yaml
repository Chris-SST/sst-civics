    question_de: Wer gilt in der Schweiz als Grenzgänger?
    options_de:
      a: Eine Person, die in der Schweiz arbeitet, aber im Ausland wohnt und regelmässig dorthin zurückkehrt
      b: Eine Person, die für den Zoll arbeitet und die Landesgrenze kontrolliert
      c: Eine Person, die die Grenze ohne Bewilligung überquert, um hier zu arbeiten
      d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
    explanation_de: Grenzgänger arbeiten in der Schweiz, wohnen aber in einem anderen Land. Sie benötigen
      eine Grenzgängerbewilligung und kehren regelmässig, mindestens einmal pro Woche, an ihren Wohnort
      im Ausland zurück. Wer nur zwischen zwei Kantonen pendelt, ist kein Grenzgänger.
