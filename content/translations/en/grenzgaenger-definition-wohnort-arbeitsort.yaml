question: Who is considered a cross-border commuter in Switzerland?
options:
  a: A person who works in Switzerland but lives abroad and returns there regularly
  b: A person who works for customs and checks the national border
  c: A person who crosses the border without a permit in order to work here
  d: A person who lives in one canton and works in a different canton every day
explanation: Cross-border commuters work in Switzerland but live in another country. They need a cross-border
  commuter permit and return regularly, at least once a week, to their place of residence abroad. Anyone
  who only commutes between two cantons is not a cross-border commuter.
