question: What applies in Switzerland when someone has broken the law?
options:
  a: The neighbourhood decides together on the punishment.
  b: The state prosecutes and punishes the offence; taking the law into one's own hands is prohibited.
  c: The victim may determine and carry out the punishment themselves.
  d: The victim's family may punish the offender themselves.
explanation: In Switzerland, only the state has the right to prosecute and punish criminal offences. The
  police, the public prosecutor's office and the courts are responsible for this. Anyone who takes revenge
  themselves, including as a victim or as the victim's family, may thereby commit a criminal offence themselves.
