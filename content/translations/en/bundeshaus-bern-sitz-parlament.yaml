question: Which building in Bern is the meeting place of the Swiss Parliament?
options:
  a: The Kornhaus
  b: The Rathaus
  c: The Federal Administrative Court
  d: The Bundeshaus
explanation: The Swiss Parliament meets in the Bundeshaus in Bern. This is where the National Council
  and the Council of States (Ständerat) meet for their sessions. The Rathaus is a building of the canton
  of Bern or of the city, not of the federal Parliament.
