    question_de: Wer darf eine eidgenössische Volksinitiative unterschreiben?
    options_de:
      a: Alle Personen ab 16 Jahren, die in der Schweiz wohnhaft sind
      b: Alle Personen ab 18 Jahren mit einer Niederlassungsbewilligung (Ausweis C)
      c: Nur Mitglieder einer politischen Partei ab 18 Jahren
      d: Schweizer Bürgerinnen und Bürger ab 18 Jahren
    explanation_de: Wer auf Bundesebene stimmberechtigt ist, darf eine eidgenössische Volksinitiative
      unterschreiben. Das sind Schweizer Männer und Frauen ab 18 Jahren, einschliesslich der im Ausland
      lebenden, sofern sie im Stimmregister eingetragen sind. Ausgeschlossen sind nur jene Personen, die
      wegen dauernder Urteilsunfähigkeit unter umfassender Beistandschaft stehen oder durch eine vorsorgebeauftragte
      Person vertreten werden; Ausländerinnen und Ausländer haben auf Bundesebene keine politischen Rechte,
      auch nicht mit Ausweis C.
