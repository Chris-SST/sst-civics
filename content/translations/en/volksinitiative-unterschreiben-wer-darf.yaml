id: volksinitiative-unterschreiben-wer-darf
lang: en
source_version: 2
question: Who may sign a federal popular initiative (Volksinitiative)?
options:
  a: All persons aged 16 or over who are resident in Switzerland
  b: All persons aged 18 or over with a settlement permit (C permit)
  c: Only members of a political party aged 18 or over
  d: Swiss citizens aged 18 or over
explanation: Anyone who is entitled to vote at Confederation level may sign a federal popular initiative.
  These are Swiss men and women aged 18 or over, including those living abroad, provided they are entered
  in the electoral register. The only people excluded are those who, owing to permanent incapacity of
  judgement, are under a comprehensive deputyship or are represented by a person appointed under a power
  of attorney for incapacity; foreign nationals have no political rights at Confederation level, not even
  with a C permit.
