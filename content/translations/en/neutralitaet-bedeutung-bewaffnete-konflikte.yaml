id: neutralitaet-bedeutung-bewaffnete-konflikte
lang: en
source_version: 1
question: What does Switzerland's neutrality mean in the event of armed conflicts between other states?
options:
  a: Switzerland sends troops to every war zone to maintain peace.
  b: Switzerland breaks off all relations with the states involved.
  c: Switzerland does not take sides with any of the parties to the conflict.
  d: Switzerland always supports the weaker side.
explanation: Neutrality means that Switzerland does not side with any party to a war. As a result, it
  stays out of the conflicts of other states. This does not rule out talks and humanitarian aid.
