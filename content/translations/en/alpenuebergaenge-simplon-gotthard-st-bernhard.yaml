question: What do the Simplon, the Gotthard and the Great St Bernard have in common?
options:
  a: They are cantons in the Alps.
  b: They are rivers that flow into the sea.
  c: They are lakes in the Central Plateau (Mittelland).
  d: They are crossings over the Alps.
explanation: The Simplon, the Gotthard and the Great St Bernard are well-known passes that lead across
  the Alps. They connect the northern side of the Alps with the southern side of the Alps.
