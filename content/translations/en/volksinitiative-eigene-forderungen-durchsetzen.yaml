    question_de: Wozu dient die Volksinitiative den Stimmberechtigten?
    options_de:
      a: Sie können damit einen Entscheid des Bundesgerichts ändern.
      b: Sie können damit ihre eigenen Forderungen auf die politische Agenda setzen.
      c: Sie können damit das Datum der nächsten Wahlen festlegen.
      d: Sie können damit ein vom Parlament verabschiedetes Gesetz verhindern.
    explanation_de: Mit einer Volksinitiative können die Stimmberechtigten eine Änderung der Bundesverfassung
      vorschlagen. Kommt sie zustande, wird darüber abgestimmt. Auf diese Weise können sie ihre eigenen
      Anliegen auch gegen den Willen des Parlaments durchsetzen, wenn Volk und Kantone zustimmen.
