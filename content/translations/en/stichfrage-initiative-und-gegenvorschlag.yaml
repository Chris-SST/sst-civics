    question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenentwurf gibt es
      eine Stichfrage. Welchen Zweck hat sie?
    options_de:
      a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
      b: Sie entscheidet, ob die Kantone überhaupt abstimmen dürfen
      c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
      d: Sie entscheidet, ob die Unterschriften nochmals geprüft werden
    explanation_de: Die Stimmberechtigten können sowohl die Initiative als auch den Gegenentwurf annehmen.
      Mit der Stichfrage geben sie an, welche Vorlage in Kraft treten soll, wenn beide angenommen werden.
      So können zwischen zwei ähnlichen Vorlagen keine Stimmen verloren gehen.
