id: auslandschweizer-stimmrecht-vom-ausland
lang: en
source_version: 2
question: A Swiss woman lives permanently abroad. How can she take part in federal elections and referendums?
options:
  a: She may only vote if she travels to Switzerland to do so.
  b: She may only take part in elections, but not in referendums.
  c: She can vote in elections and referendums from her place of residence abroad, without travelling
    to Switzerland.
  d: She loses the right to vote and to stand in elections at Confederation level.
explanation: Swiss citizens living abroad may vote in elections and referendums at federal level without
  having to travel to Switzerland. To do so, they must be registered with the competent Swiss representation
  abroad and apply through it to be entered in the electoral register. Their municipality of voting then
  sends them the election and voting materials.
