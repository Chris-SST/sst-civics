    question_de: Eine Schweizerin lebt dauerhaft im Ausland. Wie kann sie an eidgenössischen Wahlen und
      Abstimmungen teilnehmen?
    options_de:
      a: Sie darf nur abstimmen, wenn sie dafür in die Schweiz reist.
      b: Sie darf nur an Wahlen teilnehmen, aber nicht an Abstimmungen.
      c: Sie kann von ihrem Wohnort im Ausland aus an Wahlen und Abstimmungen teilnehmen, ohne in die
        Schweiz zu reisen.
      d: Sie verliert das Stimm- und Wahlrecht auf Ebene des Bundes.
    explanation_de: Auslandschweizerinnen und Auslandschweizer dürfen auf Bundesebene an Wahlen und Abstimmungen
      teilnehmen, ohne in die Schweiz reisen zu müssen. Dazu müssen sie bei der zuständigen Schweizer
      Vertretung im Ausland angemeldet sein und sich über diese ins Stimmregister eintragen lassen. Ihre
      Stimmgemeinde schickt ihnen dann die Wahl- und Abstimmungsunterlagen zu.
