    question_de: Wie beteiligen sich Stimmberechtigte politisch in ihrer Gemeinde, wenn Abstimmungen stattfinden?
    options_de:
      a: Sie leiten die Sitzungen des Gemeinderats.
      b: Sie setzen die Beschlüsse der Gemeinde um.
