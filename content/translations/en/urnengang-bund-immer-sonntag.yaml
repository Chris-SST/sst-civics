id: urnengang-bund-immer-sonntag
lang: en
source_version: 1
question: On which day of the week do federal votes and elections take place in Switzerland?
options:
  a: Always on a Sunday
  b: Always on a Saturday
  c: Always on a Friday
  d: On a weekday that each canton chooses for itself
explanation: Votes and elections at Confederation level always take place on a Sunday. This allows as
  many eligible voters as possible to take part, and the date is the same for everyone.
