question: Which event of 1815 is important for Swiss neutrality?
options:
  a: Switzerland declared war on all its neighbouring states.
  b: The Great Powers recognised the permanent neutrality of Switzerland.
  c: Switzerland joined the League of Nations.
  d: Switzerland held a popular vote on neutrality for the first time.
explanation: At the Congress of Vienna in 1815, the European Great Powers recognised the permanent neutrality
  of Switzerland. This gave neutrality an international basis.
