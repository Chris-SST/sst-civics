    question_de: Welches Ereignis des Jahres 1815 ist für die Schweizer Neutralität wichtig?
    options_de:
      a: Die Schweiz erklärte allen ihren Nachbarstaaten den Krieg.
      b: Die Grossmächte anerkannten die dauernde Neutralität der Schweiz.
