question: Who can be elected to the National Council (Nationalrat), the Federal Council (Bundesrat) or
  the Federal Supreme Court (Bundesgericht)?
options:
  a: Only those who have completed a university degree
  b: Only those who have lived in Switzerland for at least ten years
  c: Only those who are members of a political party
  d: All Swiss citizens aged 18 or over who have the right to vote
explanation: According to the Federal Constitution, all persons entitled to vote are eligible for election.
  Swiss citizens aged 18 or over are entitled to vote. Party membership or a particular education is not
  required.
