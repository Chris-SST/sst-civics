question: Into which three major landscape regions is Switzerland geographically divided?
options:
  a: The Jura, the Central Plateau (Mittelland) and the Alps
  b: The Jura, Lake Constance and the Alps
  c: The Black Forest, the Central Plateau and the Alps
  d: The Central Plateau, the Pre-Alps and Ticino
explanation: The Jura lies in the north-west, and the Alps take up the largest part of the area. Between
  them lies the Central Plateau, where most people live.
