    question_de: Wie nehmen die Stimmberechtigten in der Schweiz direkten Einfluss auf die Gesetzgebung
      des Bundes?
    options_de:
      a: Sie stimmen an der Urne über Initiativen und Referenden ab.
      b: Sie wählen die Richter, die über neue Gesetze entscheiden.
      c: Sie ernennen die Mitglieder des Bundesrates, die neue Gesetze erlassen.
      d: Sie entscheiden selbst in der Bundesversammlung über die Gesetze.
    explanation_de: Die Stimmberechtigten nehmen an Volksabstimmungen über Initiativen und Referenden
      teil und haben dort ein Mitspracherecht bei der Entscheidung. Auf diese Weise wirken sie zwischen
      den Wahlen direkt an der Gesetzgebung mit. Dies ist ein Merkmal der direkten Demokratie.
