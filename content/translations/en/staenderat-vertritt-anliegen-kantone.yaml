question: Which chamber of Parliament mainly represents the interests of the cantons?
options:
  a: The Federal Council (Bundesrat)
  b: The National Council (Nationalrat)
  c: The Council of States (Ständerat)
  d: The Federal Supreme Court (Bundesgericht)
explanation: The Council of States represents mainly the cantons. Each canton sends representatives to
  this chamber. The National Council, by contrast, represents the people.
