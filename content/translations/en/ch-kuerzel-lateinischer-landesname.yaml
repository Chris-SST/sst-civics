question: What does Switzerland's country abbreviation «CH» stand for?
options:
  a: For the French name Confédération Helvétique
  b: For the term «Cantons Helvétiques»
  c: For the Latin name Civitas Helvetica
  d: For the Latin name of the country, Confoederatio Helvetica
explanation: CH is the short form of Confoederatio Helvetica, the Latin name of Switzerland. Latin is
  used because it does not favour any of the four national languages. The abbreviation appears, for example,
  on vehicle number plates and in internet addresses.
