question: Which symbolic figure is shown on the two-franc coin?
options:
  a: The Matterhorn
  b: Helvetia
  c: William Tell
  d: A Swiss Federal Council (Bundesrat) member
explanation: The Swiss two-franc coin shows Helvetia, the female symbolic figure of the Swiss Confederation.
  She stands for Switzerland as a nation. Helvetia also appears on other coins and on postage stamps.
