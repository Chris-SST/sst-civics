question: What is meant by the term «Romandie» or «Welschland»?
options:
  a: The Italian-speaking part of Switzerland
  b: The French-speaking part of Switzerland
  c: The Romansh-speaking part of Switzerland
  d: The German-speaking part of Switzerland
explanation: Romandie or Welschland refers to the areas of Switzerland where French is spoken. These include,
  for example, the cantons of Geneva and Vaud. The Italian-speaking part is mainly Ticino.
