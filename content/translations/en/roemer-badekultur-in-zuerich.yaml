id: roemer-badekultur-in-zuerich
lang: en
source_version: 1
question: What innovation did the Romans bring to Zurich?
options:
  a: Book printing
  b: The guilds
  c: Bathing culture
  d: The Reformation
explanation: The Romans introduced bathing culture to Zurich, that is, public baths modelled on Roman
  examples. Guilds, book printing and the Reformation belong only to the Middle Ages and the early modern
  period.
