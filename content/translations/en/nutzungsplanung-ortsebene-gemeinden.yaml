    question_de: Wer plant im Kanton Zürich auf lokaler Ebene, wie das Land genutzt wird, zum Beispiel
      wo sich Wohnzonen und Gewerbezonen befinden?
    options_de:
      a: Die Bundesversammlung
      b: Die Kantonspolizei
      c: Die Gemeinden
      d: Die Bezirksräte allein
    explanation_de: Die Gemeinden erlassen die Raumplanung für ihr Gebiet, zum Beispiel die Bau- und Zonenordnung.
