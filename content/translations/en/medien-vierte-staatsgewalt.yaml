id: medien-vierte-staatsgewalt
lang: en
source_version: 1
question: The media are often described by a special term that expresses their role in the state. What
  is this term?
options:
  a: Second branch of state power
  b: Supreme branch of state power
  c: First branch of state power
  d: Fourth branch of state power
explanation: The three branches of state power are the legislature, the executive and the judiciary. The
  media are not part of them, but they monitor politics and inform the population. That is why they are
  often called the fourth branch of state power.
