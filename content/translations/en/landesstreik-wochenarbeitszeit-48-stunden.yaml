question: What was the working week in Switzerland after the national strike of 1918?
options:
  a: 48 hours
  b: 54 hours
  c: 60 hours
  d: 40 hours
explanation: The national strike of 1918 was a general strike by the workers. One of the demands that
  were implemented afterwards was the 48-hour week. Before that, significantly longer working hours were
  common.
