    question_de: Was ist der Grundsatz bei der Auslieferung von Schweizer Staatsangehörigen ins Ausland?
    options_de:
      a: Sie werden auf Ersuchen jedes Staates ausgeliefert.
      b: Sie werden nicht gegen ihren Willen an einen anderen Staat ausgeliefert. Sie können jedoch an
        ein internationales Gericht überstellt werden.
      c: Sie werden nur an Staaten ausgeliefert, die an die Schweiz grenzen.
      d: Sie werden ausgeliefert, wenn der Bundesrat dies im Einzelfall wünscht.
    explanation_de: Nach Artikel 25 der Bundesverfassung dürfen Schweizer Bürgerinnen und Bürger nicht
      ausgewiesen werden. Sie dürfen nur dann an einen anderen Staat ausgeliefert werden, wenn sie selbst
      zustimmen. Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine
      ausländische Behörde, daher erlaubt ein Bundesgesetz, Schweizer Staatsangehörige für Verfahren an
      dieses zu überstellen.
