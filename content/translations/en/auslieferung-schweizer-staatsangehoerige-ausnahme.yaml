id: auslieferung-schweizer-staatsangehoerige-ausnahme
lang: en
source_version: 2
question: What is the basic rule on the extradition of Swiss nationals abroad?
options:
  a: They are extradited at the request of any state.
  b: They are not extradited to another state against their will. However, they can be surrendered to
    an international court.
  c: They are extradited only to states bordering Switzerland.
  d: They are extradited if the Federal Council (Bundesrat) so wishes in an individual case.
explanation: Under Article 25 of the Federal Constitution, Swiss citizens may not be expelled. They may
  be extradited to another state only if they themselves consent. An international court, for example
  the International Criminal Court, is not a foreign authority, so a federal act permits Swiss nationals
  to be surrendered to it for proceedings.
