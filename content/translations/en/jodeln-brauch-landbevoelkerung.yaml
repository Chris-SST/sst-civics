question: Which traditional custom of the Swiss rural population is a form of singing without words, in
  which the voice switches rapidly between chest voice and head voice?
options:
  a: Alphorn blowing
  b: Yodelling
  c: Silvesterchlausen
  d: Flag throwing
explanation: Yodelling is one of the traditional customs of the Swiss rural population. It is typically
  characterised by switching between chest voice and head voice. There are yodelling clubs and yodelling
  festivals throughout the country.
