question: Which traditional custom of the Swiss rural population is a way of singing in which the voice
  switches rapidly between chest voice and head voice?
options:
  a: Alphorn blowing
  b: Yodelling
  c: Hornussen
  d: Flag swinging
explanation: In yodelling, the voice switches rapidly between chest voice and head voice. Yodelling is
  a traditional custom of the Swiss rural population. The natural yodel (Naturjodel) does without words,
  but many yodel songs do have lyrics.
