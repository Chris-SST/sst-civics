question: Which disaster claimed the lives of almost half of the population of Zurich in the early 17th
  century?
options:
  a: A city fire
  b: A plague epidemic
  c: A flood
  d: A famine
explanation: In the early 17th century, almost half of the inhabitants of Zurich died of the plague. The
  plague was an infectious disease that spread several times through Europe at that time.
