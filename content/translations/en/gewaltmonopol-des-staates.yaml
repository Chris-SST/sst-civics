    question_de: Wer darf in der Schweiz grundsätzlich physische Gewalt anwenden?
    options_de:
      a: Private Sicherheitsfirmen, die im Auftrag von Verbänden handeln
      b: Jede Person, die sich bedroht fühlt
      c: Nur der Staat
      d: Jede Gemeinde mit eigenen Bürgerwehren
    explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich darf nur der Staat
      physische Gewalt anwenden, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist die
      Notwehr: Eine Person, die rechtswidrig angegriffen wird, darf sich verhältnismässig verteidigen,
      aber das blosse Gefühl, bedroht zu sein, reicht dafür nicht aus.'
