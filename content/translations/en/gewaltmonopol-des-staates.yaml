id: gewaltmonopol-des-staates
lang: en
source_version: 2
question: Who is, in principle, permitted to use physical force in Switzerland?
options:
  a: Private security firms acting on behalf of associations
  b: Any person who feels threatened
  c: Only the state
  d: Every commune (Gemeinde) with its own vigilante groups
explanation: 'In Switzerland, the state has a monopoly on the use of force: in principle, only the state
  may use physical force, for example through the police or the army. One exception is self-defence: a
  person who is unlawfully attacked may defend themselves proportionately, but the mere feeling of being
  threatened is not sufficient for this.'
