id: zivildienst-anstelle-militaerdienst
lang: en
source_version: 3
question: How are civilian service (Zivildienst) and military service related in Switzerland?
options:
  a: Only women can perform civilian service.
  b: Anyone who performs civilian service does not have to pay taxes.
  c: Civilian service must be performed in addition to military service.
  d: Civilian service can be performed instead of military service.
explanation: Civilian service is a civilian alternative to military service. It is intended for people
  who are fit for military service but cannot reconcile military service with their conscience. To do
  this, you must submit an application, and civilian service lasts longer than military service.
