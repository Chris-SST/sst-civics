question: What retirement age (today called the "reference age") applies in the old-age and survivors'
  insurance (OASI) (AHV) from 2028 for women and men?
options:
  a: Women 64 years, men 65 years
  b: Women and men 65 years
  c: Women and men 63 years
  d: Women and men 67 years
explanation: Since the AHV 21 reform, the retirement age has officially been called the "reference age".
  From 2025, it rises for women by three months each year until it reaches 65 years. From 2028, women
  and men have the same reference age of 65 years.
