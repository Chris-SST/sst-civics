    question_de: Welche Voraussetzungen müssen Personen erfüllen, um in der Schweiz heiraten zu dürfen?
    options_de:
      a: Sie müssen das Schweizer Bürgerrecht besitzen und volljährig sein
      b: Sie müssen volljährig und fähig sein, vernunftgemäss zu handeln
      c: Sie müssen seit mindestens fünf Jahren zusammenleben
      d: Sie müssen derselben Religion angehören
    explanation_de: Wer volljährig und urteilsfähig ist, darf heiraten. Urteilsfähig zu sein bedeutet,
      vernunftgemäss handeln zu können. Staatsangehörigkeit, Religion oder eine bestimmte Dauer des Zusammenlebens
      sind keine Voraussetzungen.
