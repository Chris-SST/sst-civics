question: What did the Zurich politician Emilie Lieberherr campaign for?
options:
  a: For the construction of Zurich Airport
  b: For Switzerland's accession to the UN
  c: For women's right to vote and to stand for election
  d: For the abolition of the communal assembly (Gemeindeversammlung)
explanation: In the 1960s, Emilie Lieberherr campaigned for women's right to vote and to stand for election.
  At Confederation level, it was introduced in 1971. In the canton of Zurich, it has applied since 1970.
