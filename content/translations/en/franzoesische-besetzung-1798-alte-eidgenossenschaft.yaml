question: What was the effect of the invasion of Switzerland by French troops in 1798?
options:
  a: It made Switzerland part of France
  b: It strengthened the power of the old cantons
  c: It led to the founding of the federal state of 1848
  d: It ended the old order of the Old Swiss Confederacy
explanation: With the French occupation, the old Swiss Confederacy collapsed. It was replaced by the Helvetic
  Republic as a unitary state. The present-day federal state did not come into being until 1848.
