id: frauenstimmrecht-national-1971
lang: en
source_version: 1
question: In which year did women in Switzerland obtain the right to vote and to stand for election at
  national level?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: In 1971, men voted in a referendum in favour of women's right to vote at Confederation level.
  Since then, women have been able to vote and take part in ballots nationally. In some cantons, it came
  later at cantonal level as well.
