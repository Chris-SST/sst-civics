id: frauenstimmrecht-national-1971
lang: en
source_version: 2
question: Since which year have women in Switzerland been allowed to vote and to take part in popular
  votes at federal level?
options:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
explanation: In 1971, Swiss men approved women's right to vote at federal level in a popular vote. Since
  then, women have been allowed to vote, to take part in popular votes and to stand for election at national
  level. The cantons introduced women's right to vote at different times, some of them before 1971, with
  Appenzell Innerrhoden as the last canton only in 1990.
