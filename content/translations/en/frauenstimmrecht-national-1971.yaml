    question_de: Seit welchem Jahr dürfen Frauen in der Schweiz auf Bundesebene wählen und an Volksabstimmungen
      teilnehmen?
    options_de:
      a: '1959'
      b: '1991'
      c: '1948'
      d: '1971'
    explanation_de: 1971 haben die Schweizer Männer in einer Volksabstimmung das Frauenstimmrecht auf
      Bundesebene angenommen. Seither dürfen Frauen auf nationaler Ebene wählen, an Volksabstimmungen
      teilnehmen und sich zur Wahl stellen. Die Kantone haben das Frauenstimmrecht zu unterschiedlichen
      Zeitpunkten eingeführt, einige davon vor 1971, wobei Appenzell Innerrhoden als letzter Kanton erst
      1990.
