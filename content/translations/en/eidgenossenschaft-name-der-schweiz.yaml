question: Which name is also used for Switzerland in the Federal Constitution?
options:
  a: Federal Republic
  b: Eidgenossenschaft
  c: Confederation of the cantons
  d: Federal Kingdom
explanation: The official name is "Swiss Confederation" (Schweizerische Eidgenossenschaft). The word Eidgenossenschaft
  therefore stands for Switzerland as a whole. It recalls the alliances that were sealed by an oath.
