question: What is the name of the highest mountain peak in Switzerland?
options:
  a: Piz Bernina
  b: Matterhorn
  c: Dufourspitze
  d: Jungfrau
explanation: At around 4,634 metres, the Dufourspitze in the Monte Rosa massif in the canton of Valais
  is the highest peak in Switzerland. The Matterhorn is better known, but lower. The Piz Bernina in Graubünden
  is the highest peak in the Eastern Alps.
