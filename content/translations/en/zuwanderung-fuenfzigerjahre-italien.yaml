question: From which country did most of the workers who immigrated to Switzerland in the 1950s come?
options:
  a: From Italy
  b: From Turkey
  c: From Portugal
  d: From Spain
explanation: In the 1950s, most immigrant workers came from Italy. At that time, the economy needed many
  workers, for example in construction and in industry. Later, many people from other countries also came.
