question: Which of the following cantons borders the canton of Zürich directly?
options:
  a: Graubünden
  b: Thurgau
  c: Uri
  d: Vaud
explanation: The canton of Thurgau lies to the north-east of the canton of Zürich and borders it directly.
  Graubünden, Vaud and Uri do not share a border with Zürich.
