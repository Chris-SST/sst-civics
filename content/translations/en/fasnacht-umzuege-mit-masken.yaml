question: What is typically part of the Swiss Fasnacht (carnival)?
options:
  a: Parades in which the participants wear masks
  b: Decorating fir trees on the village square
  c: Fireworks at midnight on 1 August
  d: Lighting large candles in churches
explanation: During Fasnacht, groups walk through the streets in parades, wearing masks and costumes.
  The Basel Fasnacht is a well-known example of this custom.
