id: obligatorische-schulzeit-dauer-schweiz
lang: en
source_version: 3
question: How many years does compulsory schooling last in the canton of Zurich, if kindergarten is included?
options:
  a: Eleven years
  b: Ten years
  c: Twelve years
  d: Nine years
explanation: 'In the canton of Zurich, all children attend school on a compulsory basis for eleven years:
  two years of kindergarten, six years of primary school and three years of lower secondary school (Sekundarstufe
  I). Most cantons have standardised this duration through the HarmoS Concordat. However, some cantons
  have not joined, and in some of them only one year of kindergarten is compulsory.'
