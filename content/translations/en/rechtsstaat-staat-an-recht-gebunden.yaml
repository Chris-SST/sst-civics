id: rechtsstaat-staat-an-recht-gebunden
lang: en
source_version: 2
question: What applies to the authorities and the government in a state governed by the rule of law such
  as Switzerland?
options:
  a: They may choose for themselves which laws they obey.
  b: They too must comply with the law in force.
  c: They stand above the law in force.
  d: They only have to follow the decisions of the media.
explanation: In a state governed by the rule of law, it is not only the population that must comply with
  the law, but also the state itself. The authorities and the government may only act as the law permits.
  In this way, the rule of law protects people from arbitrary treatment.
