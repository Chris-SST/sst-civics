    question_de: Was gilt für die Behörden und die Regierung in einem Rechtsstaat wie der Schweiz?
    options_de:
      a: Sie dürfen selbst wählen, welche Gesetze sie befolgen.
      b: Auch sie müssen sich an das geltende Recht halten.
      c: Sie stehen über dem geltenden Recht.
      d: Sie müssen nur den Entscheidungen der Medien folgen.
