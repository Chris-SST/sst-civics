id: rechtsstaat-staat-an-recht-gebunden
lang: en
source_version: 1
question: What applies to the authorities and the government in a state governed by the rule of law such
  as Switzerland?
options:
  a: In an emergency, they may act without a legal basis.
  b: They are themselves bound by the law in force.
  c: They stand above the law in force.
  d: They are bound only by decisions of the media.
explanation: 'The Federal Constitution states: the law is the basis and the limit of all state action.
  This also applies to the authorities and the government. In this way, arbitrary action is prevented.'
