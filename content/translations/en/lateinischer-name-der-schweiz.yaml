id: lateinischer-name-der-schweiz
lang: en
source_version: 2
question: What is the Swiss Confederation called in Latin?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: In Latin, Switzerland is called Confoederatio Helvetica. The abbreviation CH comes from this
  and can be seen, for example, on vehicle number plates and in internet addresses (.ch). The Latin name
  is used because it is neutral and does not favour any of the four national languages.
