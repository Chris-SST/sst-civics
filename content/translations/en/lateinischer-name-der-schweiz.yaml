question: What is the official Latin name of the Swiss Confederation?
options:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
explanation: The Latin name is Confoederatio Helvetica. The abbreviation CH comes from it, and can be
  found, for example, on car number plates and in internet addresses. The name is used because it is the
  same in all national languages.
