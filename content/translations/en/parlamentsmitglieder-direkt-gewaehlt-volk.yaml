question: Who elects the members of the National Council (Nationalrat)?
options:
  a: The Federal Council (Bundesrat) appoints them.
  b: The parties decide on them without an election.
  c: The Federal Supreme Court (Bundesgericht) selects them.
  d: The citizens entitled to vote elect them directly.
explanation: The members of the National Council are elected directly by the citizens entitled to vote
  every four years. The members of the Council of States (Ständerat) are also elected by the people today
  in all cantons, according to the rules of the respective canton; in Appenzell Innerrhoden, this takes
  place at the Landsgemeinde.
