    question_de: Wer wählt die Mitglieder des Nationalrats?
    options_de:
      a: Der Bundesrat ernennt sie.
      b: Die Parteien bestimmen sie ohne Wahl.
      c: Das Bundesgericht wählt sie aus.
      d: Die stimmberechtigten Bürgerinnen und Bürger wählen sie direkt.
    explanation_de: Die Mitglieder des Nationalrats werden alle vier Jahre direkt von den stimmberechtigten
      Bürgerinnen und Bürgern gewählt. Auch die Mitglieder des Ständerats werden heute in allen Kantonen
      vom Volk gewählt, nach den Regeln des jeweiligen Kantons; in Appenzell Innerrhoden findet dies an
      der Landsgemeinde statt.
