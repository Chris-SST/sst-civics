question: Who determines the members of the National Council (Nationalrat)?
options:
  a: The Federal Council (Bundesrat) appoints them.
  b: The parties determine them without an election.
  c: The Federal Supreme Court (Bundesgericht) selects them.
  d: Citizens who are entitled to vote elect them directly.
explanation: The members of the National Council are elected directly by the people, every four years.
  The members of the Council of States (Ständerat) are also elected by the people in almost all cantons.
