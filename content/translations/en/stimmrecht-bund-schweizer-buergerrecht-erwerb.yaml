    question_de: Ab wann erhält eine Person aus dem Ausland das Stimm- und Wahlrecht auf Bundesebene?
    options_de:
      a: Sobald sie seit zehn Jahren in der Schweiz gelebt hat.
      b: Sobald sie eine Niederlassungsbewilligung (C-Bewilligung) erhält.
      c: Sobald sie in der Schweiz Steuern zahlt und arbeitet.
      d: Sobald sie das Schweizer Bürgerrecht besitzt und volljährig ist.
    explanation_de: Das Stimm- und Wahlrecht auf Bundesebene ist an das Schweizer Bürgerrecht geknüpft.
      Eine Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Bezahlen von Steuern genügen
      nicht. Wer eingebürgert und volljährig ist, darf an eidgenössischen Wahlen und Abstimmungen teilnehmen.
