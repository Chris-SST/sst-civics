    question_de: Was sagt die Bundesverfassung über die Folter?
    options_de:
      a: Folter ist nur bei Straftätern verboten.
      b: Folter ist für die Polizei in Notfällen erlaubt.
      c: Folter ist erlaubt, wenn ein Gericht zustimmt.
      d: Niemand darf gefoltert werden.
    explanation_de: Artikel 10 der Bundesverfassung verbietet die Folter und jede andere Form grausamer,
      unmenschlicher oder erniedrigender Behandlung. Dieses Verbot gilt für alle Menschen ohne Ausnahme.
      Auch der Staat darf keine Ausnahmen machen.
