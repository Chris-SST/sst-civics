id: rechtsgleichheit-gesetz-fuer-alle
lang: en
source_version: 1
question: What does the principle of equality before the law mean?
options:
  a: All cantons have the same laws.
  b: All people hold the same political offices.
  c: All people have the same income.
  d: The law applies equally to all people.
explanation: Equality before the law is set out in Article 8 of the Federal Constitution. All people are
  equal before the law, and nobody may be discriminated against, for example, because of origin or sex.
  It does not mean that everyone owns the same amount.
