    question_de: Was gilt im Kanton Zürich für Personen, die einen Hund halten?
    options_de:
      a: Sie müssen der Gemeinde jährlich eine Hundeabgabe bezahlen.
      b: Sie müssen beim Kauf des Hundes nur einmalig eine Gebühr an den Bund bezahlen.
      c: Sie müssen jedes Jahr beim Kanton mit dem Hund eine Prüfung ablegen.
      d: Sie müssen nur dann eine Abgabe bezahlen, wenn sie mit dem Hund Geld verdienen.
    explanation_de: Wer im Kanton Zürich einen Hund hält, bezahlt jedes Jahr eine Abgabe für den Hund,
      die sogenannte Hundesteuer. Das Geld geht an die Wohngemeinde, nicht an den Bund. Die Abgabe ist
      keine einmalige Zahlung und gilt auch für Hunde, die rein als private Haustiere gehalten werden.
