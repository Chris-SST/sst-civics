question: What applies in the canton of Zürich to people who keep a dog?
options:
  a: They must pay an annual dog levy to the commune (Gemeinde).
  b: They only have to pay a one-off fee to the Confederation when they buy the dog.
  c: They must take a test with the dog every year at the canton.
  d: They only have to pay a levy if they earn money with the dog.
explanation: Anyone who keeps a dog in the canton of Zürich pays a levy for the dog every year, the so-called
  dog tax. The money goes to the commune of residence, not to the Confederation. The levy is not a one-off
  payment and also applies to dogs that are kept purely as private pets.
