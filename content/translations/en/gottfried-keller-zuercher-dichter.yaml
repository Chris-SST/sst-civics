question: Who was a well-known poet and writer from Zurich?
options:
  a: Max Frisch
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller was born in Zurich in 1819 and wrote, among other works, "Der grüne Heinrich"
  (Green Henry). He was also State Clerk of the canton of Zurich. Gotthelf lived in the canton of Bern.
