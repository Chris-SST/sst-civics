question: Which well-known poet and writer came from Zurich?
options:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
explanation: Gottfried Keller was born in Zurich in 1819, wrote, for example, "Der grüne Heinrich" (Green
  Henry) and also worked as State Clerk of the canton of Zurich. Robert Walser came from Biel, Friedrich
  Dürrenmatt from Konolfingen in the canton of Bern, and Jeremias Gotthelf worked as a pastor in the canton
  of Bern.
