question: Which level is at the very bottom of Switzerland's three-tier state structure?
options:
  a: The commune (Gemeinde)
  b: The region
  c: The canton
  d: The Confederation
explanation: 'Switzerland is organised in three tiers: the Confederation, the cantons and the communes.
  The commune is the lowest tier and the closest to the people. It carries out many tasks itself, for
  example primary school, building permits or social assistance.'
