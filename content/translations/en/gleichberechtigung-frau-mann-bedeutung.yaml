id: gleichberechtigung-frau-mann-bedeutung
lang: en
source_version: 1
question: What does equal rights for women and men mean in principle?
options:
  a: In principle, women and men have the same rights.
  b: In every area of life, women and men have the same duties but different rights.
  c: Women and men earn exactly the same amount in every occupation.
  d: Women and men must share all tasks in the family equally.
explanation: Equal rights means that, in principle, both sexes have the same rights. This is enshrined
  in the Federal Constitution. The principle says nothing about how families divide up their tasks in
  detail.
