question: Who is regarded as the founder of the Red Cross in Geneva?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
explanation: In 1859, after the Battle of Solferino, Henry Dunant, a native of Geneva, saw how many wounded
  soldiers were left without help. He therefore campaigned for their care, and in 1863 the Red Cross was
  founded in Geneva. For this, Dunant received the first Nobel Peace Prize in 1901, together with Frédéric
  Passy.
