question: Which person founded the Red Cross in Geneva?
options:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Guillaume-Henri Dufour
  d: Henry Dunant
explanation: Henry Dunant from Geneva campaigned for the care of the wounded after the Battle of Solferino
  in 1859. This led to the founding of the Red Cross, which stands for Switzerland's humanitarian tradition.
  In 1901, Dunant received the first Nobel Peace Prize.
