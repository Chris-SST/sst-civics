question: Which telephone number do you dial in Switzerland in a medical emergency to call the ambulance
  service?
options:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
explanation: The number 144 is the emergency number for the ambulance service in medical emergencies.
  117 is for the police and 118 for the fire brigade. 145 is the number for Tox Info Suisse in cases of
  poisoning.
