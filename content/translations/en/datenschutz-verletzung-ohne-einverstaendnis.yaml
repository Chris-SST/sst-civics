    question_de: In welchem Fall wird der Datenschutz verletzt?
    options_de:
      a: Private Angaben über eine Person werden ohne deren Einwilligung und ohne gesetzliche Grundlage
        bekannt gegeben.
      b: Eine Behörde speichert Daten, wie es das Gesetz verlangt.
      c: Eine Person gibt freiwillig ihre eigene Adresse an.
      d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
    explanation_de: Der Schutz der Privatsphäre umfasst den Schutz vor dem Missbrauch persönlicher Daten.
      Private Informationen dürfen nur mit der Einwilligung der Person oder aufgrund eines Gesetzes bekannt
      gegeben werden. Ist keines von beiden vorhanden, liegt eine Verletzung vor.
