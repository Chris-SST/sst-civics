question: What colours are in the coat of arms of the canton of Zurich?
options:
  a: Red and white
  b: Green and white
  c: White and blue
  d: Blue and yellow
explanation: The Zurich coat of arms is divided diagonally into white and blue. In heraldry, the white
  is called "silver". The flag of the canton shows the same colours.
