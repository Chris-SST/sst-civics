id: limmat-fliesst-durch-kanton-zuerich
lang: en
source_version: 2
question: Which river flows out of Lake Zurich, through the city of Zurich and on through the territory
  of the canton?
options:
  a: The Thur
  b: The Birs
  c: The Reuss
  d: The Limmat
explanation: The Limmat begins at the outflow of Lake Zurich and crosses the city of Zurich and the Limmat
  Valley. It then leaves the territory of the canton towards Aargau. The Reuss, Thur and Birs do not flow
  out of Lake Zurich.
