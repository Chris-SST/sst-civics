    question_de: Welche Rolle hat die Bundeskanzlei für den Bundesrat?
    options_de:
      a: Sie ist die allgemeine Stabsstelle des Bundesrates.
      b: Sie überprüft als Gericht Entscheide des Bundesrates.
      c: Sie leitet das Eidgenössische Finanzdepartement.
      d: Sie wählt die Mitglieder des Bundesrates.
    explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der
      Vorbereitung seiner Sitzungen. Sie wird vom Bundeskanzler beziehungsweise von der Bundeskanzlerin
      geleitet. Der Bundesrat wird von der Bundesversammlung gewählt.
