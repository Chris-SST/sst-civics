id: regierungsgewalt-des-bundes-beim-bundesrat
lang: en
source_version: 1
question: Which authority exercises supreme governmental power at federal level?
options:
  a: The Federal Council (Bundesrat)
  b: The National Council (Nationalrat)
  c: The Federal Chancellery (Bundeskanzlei)
  d: The Federal Supreme Court (Bundesgericht)
explanation: According to the Federal Constitution, the Federal Council is the supreme governing and executive
  authority of the Confederation. Parliament makes the laws, the Federal Supreme Court administers justice.
