    question_de: Welche Bedeutung haben regelmässige Wahlen in einer Demokratie?
    options_de:
      a: Die Bevölkerung entscheidet selbst, wer sie vertritt.
      b: Die Regierung bestimmt ihre eigenen Nachfolger.
      c: Die Parteien entscheiden untereinander, wer das Volk vertreten wird.
      d: Das Gericht entscheidet, wer ein Amt antritt.
    explanation_de: Bei Wahlen entscheiden die Stimmberechtigten, wer sie im Parlament oder in der Regierung
      vertritt. Weil Wahlen regelmässig stattfinden, können die Wählerinnen und Wähler Personen im Amt
      bestätigen oder durch andere ersetzen. Auf diese Weise behält die Bevölkerung Einfluss auf die Politik.
