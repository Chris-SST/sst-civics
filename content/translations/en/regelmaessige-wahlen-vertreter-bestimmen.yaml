id: regelmaessige-wahlen-vertreter-bestimmen
lang: en
source_version: 1
question: What is the significance of regular elections in a democracy?
options:
  a: The population itself decides who represents it.
  b: The government appoints its own successors.
  c: The parties decide among themselves who will represent the people.
  d: The court decides who takes up an office.
explanation: In elections, those entitled to vote decide who represents them in parliament or government.
  Because elections take place regularly, voters can confirm people in office or replace them with others.
  In this way, the population retains influence over politics.
