    question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
    options_de:
      a: Sie müssen sich bei der Gemeinde anmelden, in der sie wohnen.
      b: Sie müssen sich bei der Armee melden.
      c: Sie müssen sich beim Bundesrat melden.
      d: Sie müssen sich bei der Steuerverwaltung des Bundes melden.
    explanation_de: Wer an einen neuen Ort zieht, muss sich bei der Gemeinde anmelden, in der er wohnt.
      Dies geschieht in der Regel beim Einwohneramt. Auf diese Weise ist die Gemeinde über ihre Einwohnerinnen
      und Einwohner informiert.
