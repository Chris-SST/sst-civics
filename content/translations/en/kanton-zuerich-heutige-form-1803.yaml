question: In which year did the canton of Zurich come into being in its present form?
options:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
explanation: The canton of Zurich was created in its present form in 1803 with the Act of Mediation. The
  anniversary was celebrated in 2003 as 200 years of the canton of Zurich. In 1848, the present federal
  state was established.
