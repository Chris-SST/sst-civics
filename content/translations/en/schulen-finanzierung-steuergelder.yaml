question: What are public schools in Switzerland mainly paid for from?
options:
  a: From the school fees that parents pay every month
  b: From the tax revenue of the canton and the communes (Gemeinden)
  c: From the revenue of the Post Office and the SBB
  d: From the contributions of the health insurers (Krankenkassen)
explanation: Under the Federal Constitution, compulsory public schooling is free of charge. It is financed
  from tax revenue, mainly from the cantons and communes.
