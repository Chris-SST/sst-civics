question: Which important religious movement shaped Europe, and also Switzerland, in the 16th century?
options:
  a: The Reformation
  b: The Enlightenment
  c: The Regeneration
  d: The Helvetic Republic
explanation: In the 16th century, the Reformation split the Church in Europe. In Switzerland, for example,
  Huldrych Zwingli in Zurich and John Calvin in Geneva were important. The other terms refer to later
  developments.
