    question_de: Was können Stimmberechtigte mit einer eidgenössischen Volksinitiative verlangen?
    options_de:
      a: Dass der Bundesrat abgewählt wird
      b: Dass die Bundesverfassung geändert wird
      c: Dass ein bestehendes Bundesgesetz direkt aufgehoben wird
      d: Dass die Kantonsverfassung geändert wird
    explanation_de: Mit einer eidgenössischen Volksinitiative können Stimmberechtigte eine Änderung der
      Bundesverfassung verlangen. Mit einem Referendum hingegen kann das Volk über ein neues Gesetz abstimmen,
