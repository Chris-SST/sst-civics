id: volksinitiative-ziel-verfassungsaenderung
lang: en
source_version: 2
question: What can citizens entitled to vote demand with a federal popular initiative (Volksinitiative)?
options:
  a: That the Federal Council (Bundesrat) be voted out of office
  b: That the Federal Constitution be amended
  c: That an existing federal act be directly repealed
  d: That the cantonal constitution be amended
explanation: With a federal popular initiative, citizens entitled to vote can demand an amendment to the
  Federal Constitution. With a referendum, by contrast, the people can vote on a new law that Parliament
  has just adopted. An existing law cannot be abolished in this way.
