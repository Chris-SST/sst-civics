question: Which sport do particularly many people do in Switzerland in winter?
options:
  a: Water polo
  b: Skiing
  c: Rowing
  d: Beach volleyball
explanation: Skiing is very popular in Switzerland in winter, and many people go skiing in the mountains.
  Children often learn to ski at an early age, for example at a school ski camp. Water polo, rowing and
  beach volleyball, on the other hand, are sports that are done mainly in summer or in the water.
