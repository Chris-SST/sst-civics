question: Which statement about the geographical location of Switzerland is correct?
options:
  a: Switzerland has no direct access to the sea.
  b: Switzerland borders the Atlantic Ocean in the west.
  c: Switzerland borders the Mediterranean Sea in the south.
  d: Switzerland borders the North Sea in the north.
explanation: 'Switzerland is a landlocked country: it is entirely surrounded by other countries and has
  no sea coast. Ships do sail on the Rhine from Basel to the North Sea, but no sea borders Switzerland
  directly.'
