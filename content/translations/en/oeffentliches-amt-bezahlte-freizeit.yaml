id: oeffentliches-amt-bezahlte-freizeit
lang: en
source_version: 3
question: An employee holds a public office alongside their work, for example on the school board of the
  commune (Gemeinde). What does the employer normally provide for this?
options:
  a: A bonus on top of their salary
  b: A promotion
  c: Paid time off
  d: Nothing; you have to take holiday for the office
explanation: Employees who hold a public office generally receive paid time off from their employer for
  this. Exactly how much depends on the employment contract, the collective labour agreement or other
  regulations. There is no bonus or promotion for holding an office, and normally you do not have to take
  holiday for it either.
