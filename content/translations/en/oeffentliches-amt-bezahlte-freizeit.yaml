    question_de: Eine Angestellte oder ein Angestellter übt neben der Arbeit ein öffentliches Amt aus,
      zum Beispiel in der Schulpflege der Gemeinde. Was gewährt der Arbeitgeber dafür normalerweise?
    options_de:
      a: Einen Bonus zusätzlich zum Lohn
      b: Eine Beförderung
      c: Bezahlte Freistellung
      d: Nichts; man muss für das Amt Ferien nehmen
    explanation_de: Angestellte, die ein öffentliches Amt ausüben, erhalten dafür von ihrem Arbeitgeber
      in der Regel bezahlte Freistellung. Wie viel genau, hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag
      oder von anderen Regelungen ab. Für die Ausübung eines Amtes gibt es weder einen Bonus noch eine
      Beförderung, und normalerweise muss man dafür auch keine Ferien nehmen.
