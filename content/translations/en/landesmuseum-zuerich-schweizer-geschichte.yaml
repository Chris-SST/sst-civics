question: What is exhibited in the Swiss National Museum in Zurich (Landesmuseum Zürich)?
options:
  a: The history of Switzerland
  b: The history of the railway
  c: Natural history and wildlife of the Alps
  d: Modern art from all over the world
explanation: The Swiss National Museum in Zurich shows Swiss history and cultural history. It is part
  of the Swiss National Museum group. It is located next to Zurich main railway station.
