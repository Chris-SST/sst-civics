question: According to popular belief, what does it mean if the Böögg's head burns quickly at the Sechseläuten?
options:
  a: The coming summer will be rainy.
  b: The coming winter will be particularly cold.
  c: The coming summer will be fine.
  d: The harvest in autumn will be poor.
explanation: 'The Böögg is a snowman figure that is burnt at the Sechseläuten in Zurich. Popular belief
  says: the faster its head burns or explodes, the finer the coming summer will be.'
