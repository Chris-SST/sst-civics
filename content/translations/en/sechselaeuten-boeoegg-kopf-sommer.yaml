id: sechselaeuten-boeoegg-kopf-sommer
lang: en
source_version: 1
question: According to popular belief, what does it say about the summer if the head of the Böögg burns
  quickly at Sechseläuten?
options:
  a: The following summer will be rainy.
  b: The following winter will be cold.
  c: The following autumn will begin early.
  d: The following summer will be fine.
explanation: According to popular belief, the faster the head of the Böögg explodes or burns, the better
  the summer will be. The Böögg is a snowman figure that is burned at Sechseläuten.
