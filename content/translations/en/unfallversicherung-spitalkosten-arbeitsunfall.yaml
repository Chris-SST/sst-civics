    question_de: Ein Arbeitnehmer hat bei der Arbeit einen schweren Unfall und muss ins Spital. Welche
      Versicherung übernimmt die Spitalkosten?
    options_de:
      a: Arbeitslosenversicherung
      b: Unfallversicherung
      c: Erwerbsersatzordnung
      d: Alters- und Hinterlassenenversicherung
    explanation_de: Die obligatorische Unfallversicherung bezahlt bei Berufsunfällen die Behandlungskosten,
      zum Beispiel die Spitalkosten. Arbeitnehmer sind dagegen über ihren Arbeitgeber versichert. Die
      anderen genannten Versicherungen decken andere Risiken ab.
