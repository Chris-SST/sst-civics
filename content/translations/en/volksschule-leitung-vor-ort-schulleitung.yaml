question: Who directly manages a public primary and lower secondary school (Volksschule) in the canton
  of Zurich at the school itself?
options:
  a: The Cantonal Council (Kantonsrat)
  b: The school management
  c: The parents' council
  d: The Executive Council (Regierungsrat)
explanation: Every public primary and lower secondary school in the canton of Zurich has a school management,
  which runs and organises the day-to-day operation directly at the school. The Executive Council and
  the Cantonal Council work at cantonal level. The parents' council raises parents' concerns, but does
  not manage the school.
