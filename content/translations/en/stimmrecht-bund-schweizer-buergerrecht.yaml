    question_de: Was ist eine Voraussetzung für das Stimm- und Wahlrecht auf Bundesebene?
    options_de:
      a: Das Schweizer Bürgerrecht
      b: Die Mitgliedschaft in einer politischen Partei
      c: Mindestens zehn Jahre Wohnsitz in der Schweiz
      d: Eine Niederlassungsbewilligung (Ausweis C)
    explanation_de: Auf Bundesebene dürfen nur Personen mit Schweizer Bürgerrecht abstimmen und wählen.
      Ausländerinnen und Ausländer haben auf Bundesebene kein Stimmrecht, auch nicht mit einer Niederlassungsbewilligung.
      Die Mitgliedschaft in einer Partei ist nicht notwendig.
