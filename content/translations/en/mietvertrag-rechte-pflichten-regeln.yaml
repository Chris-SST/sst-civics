    question_de: Was wird in einem Mietvertrag festgehalten?
    options_de:
      a: Die Rechte der Nachbarn in der Liegenschaft
      b: Die Höhe der Steuern, die von den Mieterinnen und Mietern bezahlt werden
      c: Die Pflichten der Gemeinde gegenüber den Mieterinnen und Mietern
      d: Die Rechte und Pflichten der Vermieter und der Mieter
    explanation_de: Der Mietvertrag regelt das Verhältnis zwischen der Person, die die Liegenschaft vermietet,
      und der Person, die sie mietet. Dazu gehören zum Beispiel der Mietzins und die Dauer des Mietverhältnisses.
      Das Obligationenrecht enthält dazu die gesetzlichen Regeln.
