id: schwarzenbach-initiative-ziel-auslaenderanteil
lang: en
source_version: 1
question: What did the Schwarzenbach initiative, which was put to a vote in 1970, want?
options:
  a: It wanted to make naturalisation easier for all foreigners.
  b: It wanted to ban immigration only from Italy.
  c: It wanted to limit the proportion of foreigners living in Switzerland.
  d: It wanted to introduce the right to vote for foreigners.
explanation: The initiative demanded that the proportion of foreigners in Switzerland be limited. It was
  rejected by the people in 1970. It shows how intensely immigration was being debated at the time.
