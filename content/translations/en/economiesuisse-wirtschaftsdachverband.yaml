question: What is Economiesuisse?
options:
  a: An unemployment insurance fund of the Confederation
  b: The Federal Office for Economic Affairs
  c: The umbrella business association that represents the interests of companies
  d: A trade union for employees in the retail sector
explanation: Economiesuisse is the umbrella association of Swiss business and represents the interests
  of companies. It is not a government body and not a trade union.
