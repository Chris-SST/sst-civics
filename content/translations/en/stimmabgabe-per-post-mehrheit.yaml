    question_de: Wie geben die meisten Stimmberechtigten in der Schweiz heute ihre Stimme bei Abstimmungen
      und Wahlen ab?
    options_de:
      a: Sie geben sie am Abstimmungssonntag an der Gemeindeversammlung ab.
      b: Sie werfen sie am Abstimmungssonntag persönlich in die Urne.
      c: Sie schicken sie per Post an die Gemeinde.
      d: Sie geben sie über eine Website des Bundes ab.
    explanation_de: Die Mehrheit der Stimmberechtigten stimmt brieflich ab, das heisst per Post. Der Gang
      zur Urne am Abstimmungssonntag ist für die meisten Menschen heute nicht mehr üblich.
