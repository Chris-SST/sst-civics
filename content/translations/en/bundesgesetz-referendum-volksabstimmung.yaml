    question_de: Was gilt für ein Bundesgesetz, dem beide Räte des Parlaments zugestimmt haben?
    options_de:
      a: Die stimmberechtigten Bürgerinnen und Bürger können mittels Referendum eine Volksabstimmung darüber
        verlangen.
      b: Der Bundesrat muss es danach noch dem Bundesgericht zur Genehmigung vorlegen.
      c: Es tritt immer sofort in Kraft, ohne dass das Volk etwas dazu zu sagen hat.
      d: Die Kantonsregierungen müssen ihm zuerst einzeln zustimmen.
    explanation_de: Nachdem beide Räte zugestimmt haben, unterliegen Bundesgesetze dem fakultativen Referendum.
      Kommt ein Referendum erfolgreich zustande, entscheiden die stimmberechtigten Bürgerinnen und Bürger
      an der Urne über das Gesetz.
