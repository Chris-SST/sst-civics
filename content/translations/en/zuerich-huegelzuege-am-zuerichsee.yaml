id: zuerich-huegelzuege-am-zuerichsee
lang: en
source_version: 2
question: Which ranges of hills lie on the shore of Lake Zurich?
options:
  a: Uetliberg, Albis and Pfannenstiel
  b: Lägern, Irchel and Kohlfirst
  c: Hörnli, Bachtel and Allmann
  d: Heitersberg, Gubrist and Randen
explanation: The Uetliberg and the Albis extend along the left shore of Lake Zurich, while the Pfannenstiel
  lies on the right shore. The other hills lie further away from the lake, for example in the Unterland,
  in the Weinland, in the Zürcher Oberland or in other cantons.
