    question_de: Welches durch die Bundesverfassung garantierte Grundrecht erlaubt es Ihnen, Ihre eigenen
      Ansichten frei zu äussern und zu verbreiten?
    options_de:
      a: Die Meinungsfreiheit
      b: Das Stimmrecht
      c: Die Eigentumsgarantie
      d: Die Niederlassungsfreiheit
    explanation_de: Die Meinungsfreiheit erlaubt es Ihnen, Ihre eigene Meinung frei zu äussern und zu
      verbreiten. Sie ist in Artikel 16 der Bundesverfassung festgehalten. Das Stimmrecht hingegen betrifft
      die Teilnahme an Wahlen und Abstimmungen.
