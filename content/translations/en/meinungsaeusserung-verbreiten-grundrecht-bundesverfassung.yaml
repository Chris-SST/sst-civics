id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
lang: en
source_version: 1
question: Which fundamental right guaranteed by the Federal Constitution allows you to express and spread
  your own views freely?
options:
  a: Freedom of expression
  b: The right to vote
  c: The guarantee of property
  d: Freedom of settlement
explanation: Freedom of expression allows you to express and spread your own opinion freely. It is set
  out in Article 16 of the Federal Constitution. The right to vote, by contrast, concerns participation
  in elections and referendums.
