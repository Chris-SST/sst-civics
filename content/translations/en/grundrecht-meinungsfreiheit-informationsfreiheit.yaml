id: grundrecht-meinungsfreiheit-informationsfreiheit
lang: en
source_version: 1
question: Which fundamental right protects the freedom to form one's own opinion and to obtain information
  from generally accessible sources?
options:
  a: Freedom of settlement
  b: Freedom of opinion and information
  c: Economic freedom
  d: Freedom of assembly
explanation: The Federal Constitution protects freedom of opinion and information in Article 16. Every
  person may freely obtain information from generally accessible sources. This is an important foundation
  of democracy.
