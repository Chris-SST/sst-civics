    question_de: Wie werden Familien steuerlich entlastet?
    options_de:
      a: Familien zahlen keine Steuern.
      b: Familien können bei ihren Steuern Abzüge geltend machen.
      c: Familien müssen keine Steuererklärung ausfüllen.
      d: Familien zahlen nur Mehrwertsteuer.
    explanation_de: Zum Beispiel können Familien Abzüge für Kinder oder für die Kinderbetreuung geltend
