    question_de: Welche Verträge, die 2000 vom Volk angenommen wurden, bilden die Grundlage der aktuellen
      Beziehungen der Schweiz zur EU?
    options_de:
      a: Die Bilateralen I
      b: Das EWR-Abkommen
      c: Das Schengen-Abkommen allein
      d: Der Beitrittsvertrag zur EU
    explanation_de: Die Stimmberechtigten haben die Bilateralen I im Jahr 2000 angenommen. Sie regeln
