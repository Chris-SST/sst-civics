id: bilaterale-eins-basis-eu-beziehungen
lang: en
source_version: 1
question: Which treaties, approved by the people in 2000, form the basis of Switzerland's current relations
  with the EU?
options:
  a: The Bilaterals I
  b: The EEA Agreement
  c: The Schengen Agreement alone
  d: The treaty of accession to the EU
explanation: The electorate approved the Bilaterals I in 2000. They regulate access to certain areas of
  the single market, for example the free movement of persons and land transport. In 1992, the people
  had not approved the EEA.
