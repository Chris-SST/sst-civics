question: Which of the following is one of the responsibilities of the cantons?
options:
  a: They determine Switzerland's foreign policy and currency.
  b: They pass the laws for the whole country.
  c: They run the army and set customs duties.
  d: They run their own administration and enact cantonal law.
explanation: Each canton has its own government, its own parliament and its own administration. It makes
  its own laws, which apply only in the canton, for example for schools or the police. Foreign policy,
  currency, the army, customs duties and the laws for the whole of Switzerland are matters for the Confederation.
