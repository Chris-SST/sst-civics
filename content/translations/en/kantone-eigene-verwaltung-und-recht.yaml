    question_de: Welche der folgenden Aufgaben gehört zu den Aufgaben der Kantone?
    options_de:
      a: Sie bestimmen die Aussenpolitik und die Währung der Schweiz.
      b: Sie erlassen die Gesetze für das ganze Land.
      c: Sie führen die Armee und legen die Zölle fest.
      d: Sie führen ihre eigene Verwaltung und erlassen kantonales Recht.
    explanation_de: Jeder Kanton hat seine eigene Regierung, sein eigenes Parlament und seine eigene Verwaltung.
      Er macht seine eigenen Gesetze, die nur im Kanton gelten, zum Beispiel für die Schulen oder die
      Polizei. Aussenpolitik, Währung, die Armee, die Zölle und die Gesetze für die ganze Schweiz sind
      Sache des Bundes.
