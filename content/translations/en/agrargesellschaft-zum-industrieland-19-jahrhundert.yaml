question: How did Switzerland change economically in the 19th century?
options:
  a: It lived mainly from trade with colonies.
  b: It remained almost exclusively a farming country until 1900.
  c: It developed from an industrial country into an agrarian society.
  d: It developed from an agrarian society into an industrial country.
explanation: In the 19th century, work shifted from agriculture to factories. New transport routes such
  as the railway supported this change. In this way, the agrarian country became an industrial country.
