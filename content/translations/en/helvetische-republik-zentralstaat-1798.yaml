question: What happened to Switzerland in 1798 under the influence of Napoleon Bonaparte?
options:
  a: It became part of the German Empire.
  b: It became a monarchy with its own king.
  c: It was permanently divided into two states.
  d: It temporarily became a centralised state, the Helvetic Republic.
explanation: In 1798, after French troops invaded, the Helvetic Republic was established. It was a centrally
  governed unitary state and temporarily replaced the old Confederation. The cantons had hardly any rights
  of their own.
