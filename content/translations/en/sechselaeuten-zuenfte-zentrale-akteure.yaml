question: Who are the central participants in Zurich's spring festival, Sechseläuten?
options:
  a: Zurich school classes
  b: The Zurich guilds
  c: The presidents of the communes (Gemeinde) of the canton
  d: The members of the Cantonal Council (Kantonsrat)
explanation: At Sechseläuten, the guilds parade through the city in historical costumes. In the evening,
  they burn the Böögg. The event is a well-known spring festival in Zurich.
