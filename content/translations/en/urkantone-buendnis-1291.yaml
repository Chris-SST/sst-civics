question: Which three territories formed an alliance in 1291 and are regarded as the core of the later
  Swiss Confederation (Eidgenossenschaft)?
options:
  a: Uri, Schwyz and Unterwalden
  b: Glarus, Zug and Uri
  c: Basel, Schaffhausen and Appenzell
  d: Zurich, Bern and Lucerne
explanation: Uri, Schwyz and Unterwalden formed a Confederation in 1291. This date is regarded as the
  origin of Switzerland and is celebrated on 1 August. The other places only joined the Confederation
  later.
