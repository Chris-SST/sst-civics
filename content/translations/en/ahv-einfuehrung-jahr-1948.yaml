id: ahv-einfuehrung-jahr-1948
lang: en
source_version: 1
question: In which year was the old-age and survivors' insurance (OASI) (AHV), the state pension insurance
  for old age and survivors, introduced?
options:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
explanation: The OASI began operating in 1948, after the people had approved the law in 1947. It forms
  the first pillar of the Swiss three-pillar system. It secures a livelihood in old age and for survivors.
