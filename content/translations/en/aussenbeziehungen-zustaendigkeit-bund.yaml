    question_de: Wer ist in der Schweiz grundsätzlich für die Gestaltung der Beziehungen zu anderen Staaten
      zuständig?
    options_de:
      a: Die Konferenz der Kantonsregierungen
      b: Der Bund
      c: Die Kantone gemeinsam
      d: Die Gemeinden an der Grenze
    explanation_de: Nach der Bundesverfassung ist die Aussenpolitik Sache des Bundes. Die Kantone können
