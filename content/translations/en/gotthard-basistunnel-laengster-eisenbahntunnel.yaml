question: What distinguishes the Gotthard Base Tunnel in a worldwide comparison?
options:
  a: It is the longest railway tunnel in the world.
  b: It is the highest-lying railway tunnel in the world.
  c: It is the longest road tunnel in the world.
  d: It is the oldest railway tunnel in Europe.
explanation: The Gotthard Base Tunnel is the longest railway tunnel in the world. It connects northern
  Switzerland with Ticino and is an important part of the north-south axis through the Alps.
