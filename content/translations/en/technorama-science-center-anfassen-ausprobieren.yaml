question: In which institution in the canton of Zurich can visitors touch and try out scientific and technical
  phenomena for themselves?
options:
  a: At the Zurich Opera House
  b: At the Technorama in Winterthur
  c: At the Swiss National Museum in Zurich
  d: At the Kunsthaus Zurich
explanation: The Technorama in Winterthur is a science centre. Visitors experiment with the exhibits themselves
  there. The Kunsthaus, the National Museum and the Opera House show art, history and performances.
