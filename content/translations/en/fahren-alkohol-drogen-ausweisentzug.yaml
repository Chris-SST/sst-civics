question: What does a person risk who drives a car while under the influence of alcohol or drugs?
options:
  a: Loss of the right to vote
  b: Expulsion from their municipality of residence
  c: Withdrawal of their health insurance
  d: Withdrawal of their driving licence
explanation: Anyone who is unfit to drive endangers others on the road. For this reason, the authorities
  can withdraw the driving licence. Fines or further penalties may also be imposed.
