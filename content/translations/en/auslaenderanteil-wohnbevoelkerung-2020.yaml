question: Approximately what proportion of the permanent resident population of Switzerland did foreign
  nationals make up in 2020?
options:
  a: about three fifths
  b: about one tenth
  c: about half
  d: about a quarter
explanation: In 2020, around a quarter of the permanent resident population did not hold a Swiss passport.
  At the end of 2020, this was around 2.2 million out of 8.7 million people, so about 25 per cent. Compared
  with other countries in Europe, this proportion is high.
