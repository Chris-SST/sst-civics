question: In which country does the International Committee of the Red Cross (ICRC) have its headquarters?
options:
  a: In the Netherlands
  b: In Switzerland
  c: In Austria
  d: In Belgium
explanation: The ICRC has its headquarters in Geneva, in Switzerland. It was founded in Geneva in 1863
