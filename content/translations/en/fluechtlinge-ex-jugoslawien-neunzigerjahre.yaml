question: Why did many people from the former Yugoslavia seek refuge in Switzerland in the 1990s?
options:
  a: They wanted to study at Swiss universities.
  b: They were fleeing a major natural disaster.
  c: They were fleeing the war in their home country.
  d: They were recruited by Swiss companies as seasonal workers.
explanation: The break-up of Yugoslavia led to wars in the 1990s. As a result, many people sought protection
  in Switzerland. Some of them stayed and live here today.
