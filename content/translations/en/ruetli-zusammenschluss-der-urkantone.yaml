question: What does the Rütli stand for in Swiss history?
options:
  a: The union of the original cantons
  b: The victory in the Battle of Marignano
  c: The beginning of the Reformation
  d: The founding of the federal state in 1848
explanation: According to tradition, representatives of the original cantons are said to have formed an
  alliance on the Rütli. It is therefore regarded as a symbol of the beginnings of the Swiss Confederacy.
  The meadow is located on Lake Lucerne.
