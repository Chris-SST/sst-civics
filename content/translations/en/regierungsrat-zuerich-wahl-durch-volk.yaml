    question_de: Wer entscheidet im Kanton Zürich, wer im Regierungsrat sitzt?
    options_de:
      a: Die Bundesversammlung wählt die Mitglieder des Regierungsrates.
      b: Der Kantonsrat wählt die Mitglieder aus seinen eigenen Reihen.
      c: Die Gemeindepräsidenten wählen die Mitglieder.
      d: Die stimmberechtigte Bevölkerung des Kantons wählt die Mitglieder direkt.
