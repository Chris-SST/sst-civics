    question_de: Welches ist eines der Rechte der Bevölkerung in einer Demokratie wie der Schweiz?
    options_de:
      a: Sie bestimmt die Richterinnen und Richter des Bundesgerichts durch das Los.
      b: Sie entscheidet allein über die Gesetze, ohne das Parlament.
