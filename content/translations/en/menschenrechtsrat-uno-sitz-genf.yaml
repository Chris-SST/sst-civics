question: In which Swiss city is the seat of the United Nations (UN) Human Rights Council?
options:
  a: Lausanne
  b: Geneva
  c: Bern
  d: Basel
explanation: The UN Human Rights Council meets in Geneva. Alongside New York, Geneva is one of the most
  important UN locations and is the seat of many international organisations.
