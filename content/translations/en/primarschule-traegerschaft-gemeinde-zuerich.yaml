question: Who runs primary schools in the canton of Zürich?
options:
  a: The canton's Education Department
  b: The Confederation
  c: The communes (Gemeinden)
  d: The districts
explanation: In the canton of Zürich, the communes run the primary schools. Depending on the location,
  these are either the political communes or separate school communes, and the elected school board (Schulpflege)
  is the local school authority. The canton only sets the framework, for example the curriculum, and supervises
  the public school system (Volksschule).
