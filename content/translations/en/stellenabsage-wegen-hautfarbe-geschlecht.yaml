id: stellenabsage-wegen-hautfarbe-geschlecht
lang: en
source_version: 2
question: A woman applies for a job. She is rejected only because she is a woman. Which fundamental right
  is violated as a result?
options:
  a: Freedom of settlement
  b: Freedom of assembly
  c: Equality before the law and the prohibition of discrimination
  d: Protection of privacy
explanation: Article 8 of the Federal Constitution states that all people are equal before the law and
  that women and men have equal rights. No one may be discriminated against, for example because of origin,
  race or sex. Anyone who rejects a female applicant only because of her sex therefore violates equality
  before the law and the prohibition of discrimination.
