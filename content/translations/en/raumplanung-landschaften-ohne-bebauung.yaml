id: raumplanung-landschaften-ohne-bebauung
lang: en
source_version: 2
question: What is one aim of spatial planning in Switzerland?
options:
  a: It is meant to protect undeveloped landscapes and to use land sparingly.
  b: It is meant to redefine the borders between the cantons on a regular basis.
  c: It is meant to create as many new building zones as possible.
  d: It is meant to determine the price of building land.
explanation: Spatial planning determines where building is permitted and where it is not. It separates
  built-up areas from areas where building is not allowed, so that landscapes and farmland are protected.
  Because land is scarce, it should be used sparingly, and existing settlements should preferably be made
  denser rather than creating new building zones.
