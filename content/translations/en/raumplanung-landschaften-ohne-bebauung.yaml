id: raumplanung-landschaften-ohne-bebauung
lang: en
source_version: 1
question: What is one of the aims of spatial planning in Switzerland?
options:
  a: It is meant to preserve landscapes without buildings.
  b: It is meant to redraw the canton boundaries regularly.
  c: It is meant to release as much land as possible for new buildings.
  d: It is meant to set the prices for building land.
explanation: Spatial planning regulates how land is used. It is meant to organise settlements, agriculture
  and nature in a balanced way and to protect undeveloped landscapes. Land is scarce and should be used
  sparingly.
