    question_de: Was ist ein Ziel der Raumplanung in der Schweiz?
    options_de:
      a: Sie soll unbebaute Landschaften schützen und den Boden sparsam nutzen.
      b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
      c: Sie soll möglichst viele neue Bauzonen schaffen.
      d: Sie soll den Preis von Bauland bestimmen.
    explanation_de: Die Raumplanung legt fest, wo gebaut werden darf und wo nicht. Sie trennt überbaute
      Gebiete von Gebieten, in denen nicht gebaut werden darf, damit Landschaften und Landwirtschaftsland
      geschützt werden. Weil der Boden knapp ist, soll er sparsam genutzt werden, und bestehende Siedlungen
      sollen vorzugsweise verdichtet werden, anstatt neue Bauzonen zu schaffen.
