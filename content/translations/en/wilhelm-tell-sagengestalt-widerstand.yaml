question: What does the legendary figure William Tell from Central Switzerland stand for?
options:
  a: Resistance to foreign rulers
  b: The neutrality of Switzerland in war
  c: The introduction of the Reformation
  d: The founding of the first Swiss bank
explanation: The legend tells of a man who defends himself against oppression by foreign bailiffs. William
  Tell is therefore regarded as a symbol of freedom. Whether he really lived has not been proven.
