id: gleichberechtigung-mann-frau-bundesverfassung-1981
lang: en
source_version: 1
question: Since when has equality between men and women been enshrined in the Swiss Federal Constitution?
options:
  a: Since 1999
  b: Since 1971
  c: Since 1981
  d: Since 1848
explanation: In 1981, the equality article was added to the Federal Constitution. It obliges the state
  to ensure equality in the family, in education and at work. Women's right to vote had already existed
  since 1971.
