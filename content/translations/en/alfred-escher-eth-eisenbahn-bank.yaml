question: What is the Zurich politician and entrepreneur Alfred Escher known for?
options:
  a: He led the Swiss troops in the Sonderbund War.
  b: He wrote the first Federal Constitution entirely on his own.
  c: He founded the Red Cross in Geneva.
  d: He promoted the ETH and the construction of the railways, and founded the bank that became Credit
    Suisse.
explanation: In the 19th century, Alfred Escher campaigned for the founding of ETH Zurich and for the
  construction of railways, above all the Gotthard railway. In 1856 he founded the Schweizerische Kreditanstalt
  (Swiss Credit Institution), which later became Credit Suisse. This bank was taken over by UBS in 2023.
