    question_de: Wer hat auf Bundesebene bei einer Abstimmung über die Annahme einer Volksinitiative oder
      eines Referendums das letzte Wort?
    options_de:
      a: Die Bundesversammlung in einer gemeinsamen Sitzung beider Kammern
      b: Der Bundesrat nach Anhörung der Kantonsregierungen
      c: Das Bundesgericht nach einer rechtlichen Prüfung der Vorlage
      d: Die stimmberechtigten Bürgerinnen und Bürger, die an der Urne oder auf dem Postweg abstimmen
    explanation_de: Bei Volksinitiativen und Referenden haben die stimmberechtigten Bürgerinnen und Bürger
      das letzte Wort. Sie entscheiden in der Volksabstimmung an der Urne, was in der Schweiz auch auf
      dem Postweg möglich ist. Der Bundesrat, das Parlament und das Bundesgericht können das Ergebnis
      nicht ersetzen.
