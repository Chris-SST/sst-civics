id: beschimpfung-wegen-glauben-verboten
lang: en
source_version: 1
question: A person publicly insults people because of their faith or their descent. How is this regulated
  in Switzerland?
options:
  a: It is prohibited only in schools and workplaces.
  b: It is prohibited and can be punished.
  c: It is prohibited only if it appears in the newspaper.
  d: It is always protected by freedom of expression.
explanation: The Criminal Code prohibits the public denigration of people because of their race, ethnicity,
  religion or sexual orientation. Freedom of expression is not unlimited.
