question: Which invention had a strong influence on industrialisation in Switzerland in the 19th century?
options:
  a: The aeroplane
  b: The steam engine
  c: The computer
  d: The assembly line
explanation: In the 19th century, the steam engine became important in Switzerland. It powered machines
  in factories and later also railways, and more and more people worked in factories. The aeroplane, the
  assembly line and the computer only became important in the 20th century.
