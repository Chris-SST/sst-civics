    question_de: Was können Stimmberechtigte mit einem Referendum erreichen?
    options_de:
      a: Sie können selbst ein neues Gesetz schreiben und in Kraft setzen.
      b: Sie können ein vom Parlament beschlossenes Gesetz verhindern.
      c: Sie können die Mitglieder des Bundesrates aus dem Amt entfernen.
      d: Sie können das Parlament auflösen und Neuwahlen verlangen.
