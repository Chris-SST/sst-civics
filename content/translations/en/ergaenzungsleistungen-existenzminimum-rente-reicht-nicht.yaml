    question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
    options_de:
      a: Menschen, die ihre Arbeit verloren haben und Arbeitslosenentschädigung erhalten
      b: Alle Menschen über 50 Jahre
      c: Menschen, deren Rente der Alters- und Hinterlassenenversicherung (AHV) oder der Invalidenversicherung
        (IV) die minimalen Lebenshaltungskosten nicht deckt
      d: Alle Menschen, die Sozialhilfe erhalten
    explanation_de: Ergänzungsleistungen helfen Menschen, deren Rente der Alters- und Hinterlassenenversicherung
      (AHV) oder der Invalidenversicherung (IV) und deren übriges Einkommen zum Leben nicht ausreichen.
      Sie sind ein gesetzlicher Anspruch und keine Sozialhilfe. Sie werden zusätzlich zur Rente ausbezahlt.
