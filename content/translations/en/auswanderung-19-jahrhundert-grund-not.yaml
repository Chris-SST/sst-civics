lang: en
source_version: 1
question: In the 19th century, many people left Switzerland and emigrated, for example, to America. What
  was an important reason for this?
options:
  a: Hardship and a lack of work threatened their livelihood.
  b: The Confederation banned them from living in Switzerland.
  c: Switzerland had too little space for factories.
  d: Abroad, there were no taxes for new arrivals.
explanation: In the 19th century, Switzerland was still a country of emigration. Famines, poverty and
  a lack of work drove many people to seek a new life abroad. Only later did Switzerland become a country
  of immigration.
