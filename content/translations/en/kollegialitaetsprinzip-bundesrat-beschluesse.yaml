    question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
    options_de:
      a: Der Bundespräsident entscheidet allein.
      b: Die Mitglieder vertreten die Entscheide des Bundesrates gegen aussen einheitlich.
      c: Jedes Mitglied entscheidet in seinem eigenen Departement, ohne die anderen zu konsultieren.
      d: Die Mitglieder dürfen ihre abweichende Meinung öffentlich äussern.
    explanation_de: Der Bundesrat entscheidet als Kollegialbehörde. Auch ein Mitglied, das im Bundesrat
      eine andere Meinung vertreten hat, trägt den Entscheid nach aussen mit. Auf diese Weise tritt die
      Regierung geschlossen auf.
