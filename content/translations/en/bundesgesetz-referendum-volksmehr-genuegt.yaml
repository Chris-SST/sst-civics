    question_de: Gegen ein neues Bundesgesetz ist das fakultative Referendum ergriffen worden. Was ist
      erforderlich, damit das Gesetz in der Volksabstimmung angenommen wird?
    options_de:
      a: Eine Mehrheit der Stimmenden in der ganzen Schweiz
      b: Eine Zweidrittelmehrheit der Stimmenden
      c: Allein eine Mehrheit der Kantone
      d: Eine Mehrheit der Stimmenden und eine Mehrheit der Kantone
    explanation_de: Beim fakultativen Referendum gegen ein Bundesgesetz zählt nur das Volksmehr, das heisst
      die Mehrheit der gültigen Stimmen in der ganzen Schweiz. Das Ständemehr (die Mehrheit der Kantone)
      ist zusätzlich nur bei Änderungen der Bundesverfassung und bei bestimmten völkerrechtlichen Verträgen
      erforderlich.
