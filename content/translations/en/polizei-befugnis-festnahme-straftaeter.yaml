question: Which authority may arrest persons who are suspected of having committed a criminal offence?
options:
  a: The school authority
  b: The police
  c: The parliament
  d: The tax office
explanation: The police may arrest persons who are suspected of a criminal offence, subject to the conditions
  set out in law. Whether someone is guilty is then decided by a court. The school authority, the parliament
  and the tax office do not have this power.
