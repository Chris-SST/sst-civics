question: Which names belong to world-renowned artists with a connection to Switzerland?
options:
  a: Vincent van Gogh, Paul Cézanne and Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp and Pipilotti Rist
  c: Claude Monet, Edgar Degas and Auguste Renoir
  d: Pablo Picasso, Frida Kahlo and Salvador Dalí
explanation: Niki de Saint Phalle, Sophie Taeuber-Arp and Pipilotti Rist are internationally acclaimed
  artists who are connected to Switzerland. The other groups name well-known artists without this Swiss
  connection.
