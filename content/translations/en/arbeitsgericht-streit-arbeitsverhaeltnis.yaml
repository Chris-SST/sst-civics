    question_de: Eine Arbeitnehmerin hält ihre Kündigung für ungerechtfertigt und möchte sie anfechten.
      Welche Stelle behandelt solche Streitigkeiten aus dem Arbeitsverhältnis?
    options_de:
      a: Das Regionale Arbeitsvermittlungszentrum (RAV)
      b: Das Strassenverkehrsamt
      c: Das Arbeitsgericht
      d: Das Betreibungsamt
    explanation_de: Das Arbeitsgericht ist für Streitigkeiten zwischen Arbeitgebern und Arbeitnehmern
      zuständig. Dazu gehört auch ein Streit über eine Kündigung. Das RAV hingegen hilft bei der Stellensuche.
