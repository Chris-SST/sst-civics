id: arbeitsgericht-streit-arbeitsverhaeltnis
lang: en
source_version: 2
question: An employee considers her dismissal to be unjustified and wants to challenge it. Which body
  deals with such disputes arising from the employment relationship?
options:
  a: The Regional Employment Centre (RAV)
  b: The Road Traffic Office
  c: The Employment Tribunal
  d: The Debt Enforcement Office
explanation: The Employment Tribunal is responsible for disputes between employers and employees. This
  also includes a dispute over a dismissal. The RAV, by contrast, helps with the search for a job.
