question: In which region of Switzerland does the majority of the population live?
options:
  a: In the Alps
  b: In Ticino
  c: On the Central Plateau (Mittelland)
  d: In the Jura
explanation: The Central Plateau lies between the Jura and the Alps. Most of the large cities are located
  there, and the largest part of the population lives there. The Alps cover a large area, but are only
  sparsely populated.
