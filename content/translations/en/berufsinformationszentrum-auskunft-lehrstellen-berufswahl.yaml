question: Where can you obtain information about apprenticeships, choosing a career and work?
options:
  a: At the careers information centre (Berufsinformationszentrum)
  b: At the civil registry office
  c: At the kindergarten
  d: At the debt enforcement office
explanation: The careers information centre (BIZ) provides information and advice on apprenticeships,
  choosing a career, further training and work. The service is open to young people and adults. The other
