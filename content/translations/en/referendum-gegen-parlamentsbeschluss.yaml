    question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Bundesebene?
    options_de:
      a: Gegen Gesetze, die der Nationalrat und der Ständerat verabschiedet haben
      b: Gegen Beschlüsse, die die Bundeskanzlei gefasst hat
      c: Gegen Urteile, die das Bundesgericht gefällt hat
      d: Gegen Verordnungen, die einzelne Gemeinden erlassen haben
    explanation_de: Ein Referendum richtet sich gegen Gesetze, die das Parlament verabschiedet hat. Das
