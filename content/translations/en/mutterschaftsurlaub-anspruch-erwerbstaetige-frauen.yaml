    question_de: Wer hat in der Schweiz nach der Geburt eines Kindes einen gesetzlichen Anspruch auf Mutterschaftsurlaub?
    options_de:
      a: Nur Frauen, die für ein Unternehmen mit mehr als 50 Angestellten arbeiten
      b: Jede erwerbstätige Frau, die ein Kind zur Welt bringt
      c: Nur Frauen, die verheiratet sind
      d: Nur Frauen mit Schweizer Bürgerrecht
    explanation_de: Das Gesetz gibt erwerbstätigen Müttern einen Anspruch auf Mutterschaftsurlaub und
      eine Entschädigung. Die Grösse des Unternehmens, die Staatsangehörigkeit und der Zivilstand spielen
      dabei keine Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
