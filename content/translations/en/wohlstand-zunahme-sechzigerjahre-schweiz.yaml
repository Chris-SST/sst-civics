question: How was Switzerland doing economically in the decades after the Second World War, for example
  in the 1960s?
options:
  a: 'It was doing better and better: there was plenty of work and the prosperity of many people increased.'
  b: The economy shrank sharply and many people became unemployed.
  c: Switzerland became a member of the European Union.
  d: Switzerland no longer needed workers from abroad.
explanation: After the Second World War, the Swiss economy grew strongly. There was plenty of work, and
  many people could afford more. Companies therefore brought in many workers from abroad, at first mainly
  from Italy.
