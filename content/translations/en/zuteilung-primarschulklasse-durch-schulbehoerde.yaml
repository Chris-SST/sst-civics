id: zuteilung-primarschulklasse-durch-schulbehoerde
lang: en
source_version: 1
question: Who decides in the canton of Zürich which primary school class a child is assigned to?
options:
  a: The school board (Schulpflege) or the school management
  b: The Confederation's education department
  c: The communal assembly (Gemeindeversammlung)
  d: The child's parents
explanation: The school board or the school management assigns the children to the classes. Parents cannot
  freely choose the class. In this way, the school organises its operations and class sizes.
