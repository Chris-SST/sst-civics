id: militaerdienstpflicht-schweizer-maenner
lang: en
source_version: 1
question: Who in Switzerland is obliged to perform military service or alternative service?
options:
  a: All residents aged 18 and over
  b: Men with Swiss citizenship (Bürgerrecht)
  c: All men who live in Switzerland
  d: Only women with Swiss citizenship
explanation: Under the Federal Constitution, every Swiss man is obliged to perform military service. Anyone
  who cannot reconcile this with their conscience performs civilian alternative service. Foreigners are
  not subject to compulsory service.
