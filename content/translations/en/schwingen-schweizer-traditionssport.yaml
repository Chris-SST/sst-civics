question: Which sport is regarded in Switzerland as a traditional national sport in which two men wrestle
  each other wearing trousers made of Zwilch (a coarse linen fabric)?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: Schwingen is a form of wrestling and is regarded as a traditional Swiss sport. The bouts
  take place in a sawdust ring. Well known are the Schwingen festivals, for example the Federal Schwingen
  and Alpine Festival (Eidgenössisches Schwing- und Älplerfest).
