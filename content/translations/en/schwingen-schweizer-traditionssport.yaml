question: Which traditional sport in Switzerland is a type of wrestling?
options:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
explanation: 'Schwingen is a wrestling match between two people in a round ring covered with sawdust and
  is regarded as a traditional Swiss sport. Hornussen and Steinstossen are also old Swiss sports, but
  they are not wrestling: in Hornussen, a small disc is struck far through the air, and in Steinstossen,
  a heavy stone is thrown. Curling is played on ice and originally comes from Scotland.'
