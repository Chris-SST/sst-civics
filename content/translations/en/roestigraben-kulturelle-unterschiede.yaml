question: What is meant in Switzerland by the term «Röstigraben»?
options:
  a: The Alps as a dividing line between north and south
  b: The differences between town and country
  c: The border between Switzerland and Germany
  d: The cultural differences between German-speaking Switzerland and French-speaking Switzerland (Romandie)
explanation: The term «Röstigraben» is a figurative expression. It describes the cultural differences
  between German-speaking Switzerland and the French-speaking Romandie. These sometimes show themselves,
  for example, in votes.
