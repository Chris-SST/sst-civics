    question_de: Was wird unter anderem im Arbeitsvertrag zwischen Arbeitgeber und Arbeitnehmer festgelegt?
    options_de:
      a: Die Höhe des Lohns
      b: Die Höhe der AHV-Rente
      c: Die Höhe der Mehrwertsteuer
      d: Die Höhe der Krankenkassenprämie
    explanation_de: Der Arbeitsvertrag legt die wichtigsten Bedingungen der Arbeit fest, zum Beispiel
