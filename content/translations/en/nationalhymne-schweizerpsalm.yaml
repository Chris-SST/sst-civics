id: nationalhymne-schweizerpsalm
lang: en
source_version: 1
question: What is the name of the national anthem of Switzerland?
options:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Schweizerpsalm
explanation: The national anthem of Switzerland is the Schweizerpsalm. The Federal Council (Bundesrat)
  officially declared it the national anthem in 1981. Before that, "Rufst du, mein Vaterland" was often
  sung.
