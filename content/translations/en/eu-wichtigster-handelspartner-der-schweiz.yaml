question: With which economic area does Switzerland trade the most overall?
options:
  a: With the states of the Middle East
  b: With the Asian states
  c: With the European Union
  d: With the United States of America
explanation: The European Union is Switzerland's most important trading partner. A large share of imports
  and exports goes through the EU states. For this reason, relations with the EU are very important for
  the Swiss economy.
