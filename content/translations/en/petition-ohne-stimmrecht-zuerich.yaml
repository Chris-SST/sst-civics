    question_de: Welche politische Möglichkeit haben Ausländerinnen und Ausländer im Kanton Zürich, die
      kein Stimmrecht haben?
    options_de:
      a: Sie können an der Urne über kantonale Vorlagen abstimmen.
      b: Sie können die Mitglieder des Kantonsrats wählen.
      c: Sie können sich mittels einer Petition an die Behörden wenden.
      d: Sie können im Kanton eine Volksinitiative einreichen.
    explanation_de: Das Petitionsrecht steht allen offen, auch Personen ohne Stimmrecht. So können sie
      den Behörden Anliegen, Wünsche oder Kritik schriftlich mitteilen. Nur Stimmberechtigte dürfen abstimmen,
      wählen und Initiativen unterschreiben.
