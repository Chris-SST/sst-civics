question: What is Huldrych (Ulrich) Zwingli chiefly known for in the history of Zurich?
options:
  a: He built the first railway in the canton.
  b: He was the first President of the Swiss Confederation (Bundespräsident).
  c: He introduced women's right to vote.
  d: He was the leader of the Reformation in Zurich.
explanation: In the 16th century, Huldrych (Ulrich) Zwingli led the Reformation in Zurich, and the Zurich
  church became Reformed. The railway, the federal state with a President of the Swiss Confederation and
  women's right to vote came only centuries later.
