    question_de: Wofür ist Huldrych (Ulrich) Zwingli in der Geschichte Zürichs vor allem bekannt?
    options_de:
      a: Er baute die erste Eisenbahn im Kanton.
      b: Er war der erste Präsident der Schweizerischen Eidgenossenschaft (Bundespräsident).
      c: Er führte das Frauenstimmrecht ein.
      d: Er war der Anführer der Reformation in Zürich.
