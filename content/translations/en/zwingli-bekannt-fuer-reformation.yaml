question: What is Ulrich Zwingli primarily known for in the history of Zurich?
options:
  a: He built the first railway in the canton.
  b: He founded the University of Zurich.
  c: He introduced women's suffrage.
  d: He was the leader of the Reformation in Zurich.
explanation: Zwingli left a lasting mark on the Zurich Reformation and, with it, on the church and on
  life in the city. The Zurich church became the Reformed church. The other answers have nothing to do
  with him.
