question: How is the parliament of the city of Zurich, the Gemeinderat, constituted?
options:
  a: It is appointed by the Executive Council (Regierungsrat) of the canton
  b: The City Council (Stadtrat) determines the members itself
  c: The parties draw lots among themselves for the seats
  d: The population elects it directly at the ballot box
explanation: The citizens entitled to vote in the city of Zurich elect the communal council (Gemeinderat)
  in general elections. It is the city's parliament and replaces the communal assembly (Gemeindeversammlung).
