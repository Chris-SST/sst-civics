id: mehrehe-in-schweiz-verboten
lang: en
source_version: 1
question: What is the rule in Switzerland regarding marriage to several partners at the same time?
options:
  a: It is permitted if everyone agrees
  b: It is prohibited
  c: It is permitted if it is justified on religious grounds
  d: It is only permitted for people with a foreign passport
explanation: Switzerland recognises only monogamous marriage. Anyone who is already married or living
  in a registered partnership cannot enter into another marriage. This applies regardless of religion
  or origin.
