question: How were the prehistoric settlements on Lake Zurich built?
options:
  a: As caves in the rock
  b: As pile dwellings, that is, houses on stilts
  c: As brick houses in villages
  d: As castles on rocks
explanation: In prehistoric times, pile dwellings, that is, houses on stilts, stood on the shore of Lake
  Zurich. Remains of them still lie under water today and are studied by underwater archaeologists.
