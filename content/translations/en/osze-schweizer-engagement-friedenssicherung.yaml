question: What does Switzerland work for in the Organization for Security and Co-operation in Europe (OSCE)?
options:
  a: For peace and security in Europe, for example in Eastern Europe and Central Asia
  b: For the distribution of development funding in Western Europe
  c: For the introduction of a common currency
  d: For the reduction of customs duties in world trade
explanation: Switzerland is a founding member of the OSCE and uses it to promote peace and security in
  Europe. The OSCE is active with field missions, particularly in Eastern and South-Eastern Europe and
  in Central Asia. In 2026, Switzerland holds the chairmanship of the OSCE.
