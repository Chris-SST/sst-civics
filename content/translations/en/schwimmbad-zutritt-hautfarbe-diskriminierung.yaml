id: schwimmbad-zutritt-hautfarbe-diskriminierung
lang: en
source_version: 1
question: A public swimming pool refuses entry to a person because of their skin colour. Which principle
  of the Federal Constitution is violated as a result?
options:
  a: Economic freedom
  b: The prohibition of discrimination
  c: The right to vote
  d: The right to marry and to have a family
explanation: In Article 8, the Federal Constitution prohibits discrimination, for example on grounds of
  origin or race. No one may therefore be treated worse.
