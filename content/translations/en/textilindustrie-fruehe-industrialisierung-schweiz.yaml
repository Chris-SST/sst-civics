question: Which branch of the economy was the most important during the early industrialisation of Switzerland?
options:
  a: The watch industry
  b: The pharmaceutical industry
  c: The textile industry
  d: The mechanical engineering industry
explanation: During early industrialisation, the textile industry shaped the Swiss economy, for example
  with spinning mills, weaving mills and embroidery works. A well-known example is the St. Gallen embroidery,
  which was in demand all over the world. Other industries only became so important later.
