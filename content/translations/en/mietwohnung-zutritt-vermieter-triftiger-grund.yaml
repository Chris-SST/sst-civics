    question_de: In welchem Fall müssen Mieterinnen und Mieter dem Vermieter den Zugang zur Wohnung gewähren?
    options_de:
      a: Nie, die Wohnung ist immer geschützt
      b: Wenn ein triftiger Grund vorliegt
      c: Nur wenn der Vermieter es verlangt, ohne einen Grund anzugeben
      d: Jederzeit und ohne vorherige Ankündigung
    explanation_de: Mieterinnen und Mieter müssen den Zugang gewähren, wenn ein triftiger Grund dafür
