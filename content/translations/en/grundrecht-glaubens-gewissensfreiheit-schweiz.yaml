    question_de: Welches Grundrecht wird in der Schweiz durch die Bundesverfassung geschützt?
    options_de:
      a: Das Recht auf ein Einkommen vom Staat
      b: Das Recht auf ein Auto
      c: Das Recht auf eine Arbeitsstelle
      d: Glaubens- und Gewissensfreiheit
    explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung festgelegt.
      Der Staat darf niemanden zwingen, einen bestimmten Glauben zu haben. Es gibt kein Grundrecht auf
      eine Arbeitsstelle oder ein Einkommen.
