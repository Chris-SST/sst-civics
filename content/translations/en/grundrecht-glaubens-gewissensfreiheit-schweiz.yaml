id: grundrecht-glaubens-gewissensfreiheit-schweiz
lang: en
source_version: 1
question: Which fundamental right is protected by the Federal Constitution in Switzerland?
options:
  a: The right to an income from the state
  b: The right to a car
  c: The right to a job
  d: Freedom of belief and conscience
explanation: Freedom of belief and conscience is set out in Article 15 of the Federal Constitution. The
  state may not force anyone to hold a particular belief. There is no fundamental right to a job or an
  income.
