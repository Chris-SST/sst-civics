question: Which social insurance applies when a person loses their job?
options:
  a: Disability insurance
  b: Old-age and survivors' insurance
  c: Unemployment insurance
  d: Accident insurance
explanation: Unemployment insurance pays compensation under certain conditions when someone loses their
  job. It also helps with the search for new work.
