id: sirenen-ernstfall-radio-einschalten
lang: en
source_version: 2
question: In an emergency, the sirens sound the "General Alarm" (a rising and falling wailing tone). What
  should you do?
options:
  a: Leave the house immediately
  b: Call the fire brigade
  c: Listen to the radio and follow the instructions of the authorities
  d: Drive away in the car
explanation: When the General Alarm sounds, the authorities use the radio to inform people what to do.
  Information is also available in the Alertswiss app. You should follow the instructions and not call
  the emergency numbers unnecessarily, so that they remain free for genuine emergencies.
