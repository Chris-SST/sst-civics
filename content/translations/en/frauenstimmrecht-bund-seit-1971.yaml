id: frauenstimmrecht-bund-seit-1971
lang: en
source_version: 1
question: Since when have women in Switzerland been allowed to vote and to take part in ballots at national
  level?
options:
  a: Since 1918
  b: Since 1848
  c: Since 1971
  d: Since 1991
explanation: At Confederation level, women's right to vote was introduced in 1971. Some cantons and communes
  (Gemeinden) had it earlier, while others introduced it only later. The last canton to follow was Appenzell
  Innerrhoden in 1990.
