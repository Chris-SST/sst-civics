- key: zurich-test-four-weeks
  kind: article
  category: test
  publish_at: 2026-12-07T07:00:00+01:00
  title: 'Preparing for the Zurich knowledge test in four weeks: a study plan'
  brief: 'For Zurich applicants who have an invitation or expect one soon and want a realistic plan. Question answered:
    how do I prepare in four weeks, using the official material, and what do I do on the day. Angle: a week-by-week
    plan built on the structure of the test (50 questions drawn from 350, 70% federal, 20% cantonal, 10% communal),
    with how to use the free official brochure, the practice test and the six topic pages of this site. The plan
    itself is advice and may be written freely; every fact about the test must come from the sources. Do NOT repeat
    the knowledge-test guide page (format, registration, cost): link to it and to the topic pages instead. Do NOT
    quote or reproduce any question from the canton''s list; describe topics in general terms only. Cost of the
    test: say ''ask your commune'', the canton gives no amount. Say: your commune tells you where and when you take
    the test.'
  outline:
  - What the test looks like (and what it does not test)
  - 'Where the 350 questions come from: federal 70%, cantonal 20%, communal 10%'
  - 'Week 1: read the official brochure and map the five topic areas'
  - 'Week 2: federal level - democracy, history, geography'
  - 'Week 3: canton and communes of Zurich'
  - 'Week 4: practice test, weak spots, day-before checklist'
  - 'If you do not pass: retakes'
  - Who does not need to take it
  must_cover:
  - 'The Zurich knowledge test (GKT) draws 50 random questions from a catalogue of 350: 35 on the Confederation,
    10 on the canton, 5 on the communes; it is digital, done at a computer or tablet on site; 30 of 50 correct (60%)
    pass [Zurich naturalisation handbook, section 4.6.2.1]'
  - The canton makes the test available to the communes free of charge; a commune can run it itself or have an external
    institution run it [Zurich naturalisation handbook, section 4.6.2.1]
  - 'To prepare, the canton offers three options: a practice test, a brochure for naturalisation (76 pages, PDF)
    and the list of all questions; other books and apps are listed as extra help that does not need to be learned
    for the test [Canton of Zurich knowledge test page]'
  - The test must be passable at written A2 German, and the commune must point applicants to suitable preparation
    aids from which they can take the exam material [Zurich naturalisation handbook, section 4.6.2; BüV art. 2 para.
    2]
  - In the City of Zurich the test takes place at the Stadthaus, is free, and is taken after filing the application;
    invited applicants receive the learning brochure by post and get access to a learning app at the interview [City
    of Zurich basic knowledge page]
  - Communes may require the test before or during the procedure; passing is not a condition for filing; a failed
    test does not by itself replace a rejection decision [Zurich naturalisation handbook, section 4.6.2.2]
  - The test can in principle be repeated as often as needed with no waiting period; if first taken during the procedure,
    the commune may provisionally reject the application after repeated failure, but must allow at least one retake
    [Zurich naturalisation handbook, section 4.6.2.3]
  - No test is needed for people who attended compulsory school in Switzerland for at least 5 years including 3
    years of lower secondary, who completed upper-secondary education in Switzerland, or who are currently attending
    compulsory school or upper-secondary school in Switzerland [City of Zurich basic knowledge page]
  - All Zurich communes now use the cantonal test; in 2022, 45% still ran their own tests [Canton of Zurich study
    of 5 December 2025]
  - The federal Ordinance requires a canton that uses a test to make sure applicants can prepare with suitable aids
    or courses and can pass with the oral and written language skills required for naturalisation [BüV art. 2 para.
    2]
  sources:
  - title: 'Canton of Zurich: Knowledge test (German)'
    url: https://www.zh.ch/de/migration-integration/einbuergerung/grundkenntnistest.html
  - title: 'Canton of Zurich: Naturalisation handbook from 1 July 2023 (PDF, German)'
    url: https://www.zh.ch/content/dam/zhweb/bilder-dokumente/themen/migration-integration/einbuergerung/eo_handbuch_einbuergerungen_ab_01.07.2023.pdf
  - title: 'City of Zurich: Basic knowledge test (German)'
    url: https://www.stadt-zuerich.ch/de/lebenslagen/einwohner-services/einbuergerung/grundkenntnisse.html
