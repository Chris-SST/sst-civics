  title: 'Naturalisation in the canton of Bern: requirements, test and costs'
  brief: 'For foreign residents of the canton of Bern with a C permit. Angle: Bern is bilingual, so the language
    of proof is the language of your administrative district (German or French), the canton runs a written 90-minute
    test with a published overview, and the canton fee is listed per household type. Cover residence (2 years uninterrupted
    in the canton and in the commune), language, test, steps, fees. The canton portal does not state commune fees:
    say ''ask your commune'' and, as an example only, note that communes can add requirements (the municipality
    of Konolfingen''s June 2026 leaflet adds for instance a ten-year social-assistance look-back; present it as
    one commune''s rule, not canton law). Do NOT list or reproduce test questions; the portal links to practice
    tests, so mention that they exist. Do NOT repeat the federal rules in detail: link to the overview and calculator
    pages. Jura bernois and the French-speaking district: state only that the language of the administrative district
    applies; say ''ask your commune'' for which language proof is accepted.'
  outline:
  - 'How naturalisation works in Bern: commune, canton, Confederation'
  - Residence in Switzerland, canton and commune
  - Language of the administrative district and how to prove it
  - 'The written naturalisation test: content, length, who is exempt'
  - 'From application to decision: the steps'
  - 'Fees: canton, commune, Confederation'
  - Couples, children and dual citizenship
  - What communes may add
  must_cover:
  - The procedure has three levels (commune, canton, Confederation); each examines the application separately and
    grants its own approval [Canton of Bern, how-to-apply page]
  - Applicants must have lived in the canton of Bern for at least 2 years without interruption and in the commune
    for at least 2 years without interruption at filing; the federal rules (C permit, 10 years, 3 in the last 5)
    apply too [Canton of Bern residence page]
  - Both spouses must meet the residence requirements independently of each other [Canton of Bern residence page]
  - 'Language: A2 written and B1 oral in the language of the administrative district where the applicant lives;
    no certificate is needed for a mother tongue of that language, 5 years of compulsory school in it, or a vocational,
    Gymnasium or university qualification in it [Canton of Bern language page]'
  - Bern's integration page names German or French as the languages in which applicants must be able to communicate
    in writing and orally, and says communes may set further requirements [Canton of Bern integration page]
  - A written naturalisation test covers geography, history, democracy, the health system, work, and rights and
    duties of citizens in Switzerland and takes 90 minutes [Canton of Bern test page]
  - 'Exempt from the test: children under 16, people who attended compulsory school for at least 5 years under the
    Swiss curriculum, and people who completed upper-secondary or tertiary education in Switzerland; applicants
    pay for any course and for the test themselves, and keep the confirmation for the application [Canton of Bern
    test page]'
  - 'Steps: contact the home commune for forms; file the application with the commune; the commune checks it and
    invites the applicant to a personal interview; after the commune grants communal citizenship and the commune
    and canton fees are paid, the file goes to the canton and the Confederation [Canton of Bern, how-to-apply page]'
  - 'Canton fees: CHF 1,150 for an individual with or without minor children, CHF 1,725 for married couples or registered
    partners, CHF 575 for a minor naturalised without parents; the fee is also charged if the application is rejected;
    commune fees are set by the commune [Canton of Bern fees page]'
  - 'Federal fees: CHF 100 for an adult, CHF 150 for spouses applying together, CHF 50 for a minor; minor children
    included in a parent''s application pay no federal fee and the canton states that their inclusion is free of
    charge [Canton of Bern fees page; how-to-apply page]'
  - Switzerland allows dual citizenship; the embassy of the country of origin can say whether the former nationality
    is lost [Canton of Bern, how-to-apply page]
  - After a positive decision the commune informs the applicant and the person can apply for a Swiss passport and
    ID card [Canton of Bern, how-to-apply page]
