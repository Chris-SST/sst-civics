- key: language-b1-a2
  kind: article
  category: process
  publish_at: 2027-01-04T07:00:00+01:00
  title: 'B1 spoken, A2 written: what the language requirement really asks'
  brief: 'For applicants asking what the language level means in practice and which proof is accepted. Question
    answered: how are oral and written levels determined, what if my certificate shows different levels for reading
    and writing, and what does a canton add? Angle: the SEM''s own FAQ rules on how oral and written levels are
    read from a certificate, plus planning facts from the fide page (booking and result times) and the cantons that
    go beyond the federal minimum (St Gallen: B1 in speaking and writing). The existing language-certificates page
    already lists the exemptions, the SEM list and the fide passport: do NOT repeat them; link to it and focus on
    the practical reading of the rules, the cantonal differences and planning your timeline. Do not recommend a
    particular provider. The SEM list is updated every three months (next on 1 January 2027): tell readers to check
    the current edition and say which edition was consulted. Say: ask your commune which certificate it accepts
    if you are unsure.'
  outline:
  - 'What the federal rule says: B1 oral, A2 written'
  - Four ways to prove it
  - 'How the levels are read from a certificate: oral part, reading and writing, the lower level'
  - 'What does not count: course confirmations and placement tests'
  - Cantons that ask for more or set a language of their own
  - 'Planning: when to book, how long results take'
  - Hardship rules and where to ask
  must_cover:
  - 'Federal rule: at least B1 oral and at least A2 written in a national language [BüV art. 6 para. 1]'
  - The proof is considered given if the applicant has a national language as mother tongue (speaks and writes it),
    has attended compulsory school for at least 5 years in a national language, has completed upper-secondary or
    tertiary education in a national language, or has a language certificate based on a test that meets recognised
    quality standards [BüV art. 6 para. 2]
  - A confirmation of attending a language course is not enough, even if the course was attended regularly; a placement
    assessment is not enough either [SEM FAQ on the list of recognised language certificates, question 5]
  - For a certificate, the oral level is the level reached in the oral or 'speaking' part; the written level is
    the level in the written part or in 'reading' and 'writing'; if reading and writing differ, the lower level
    applies [SEM FAQ on the list, questions 9 and 10]
  - The SEM list of recognised certificates (edition 1 October 2026) is updated every three months, next on 1 January
    2027; a certificate counts as recognised if it was on the list when the application was filed [SEM list of recognised
    language certificates]
  - Authorities may recognise certificates not on the list if they meet the quality standards of the Ordinance,
    but are recommended to follow the SEM list; an authority can ask for a new assessment, especially when a certificate
    is old [SEM FAQ on the list, questions 3 and 4]
  - A fide language passport is issued only after a fide test, fide test edu, fide dossier procedure or an Examen
    da rumantsch; other recognised certificates cannot be converted into one [SEM FAQ on the list, question 13]
  - 'fide test: tasks at levels A1 to B1 from everyday situations in Switzerland, oral part 40 minutes and written
    part 60 minutes; whole test CHF 250, oral only CHF 170, written only CHF 120; registration at least 15 days
    before the exam; results and passport about 4 weeks after the test (6 weeks for exams between mid-December and
    mid-January) [fide test page]'
  - St Gallen asks for good German at B1 in both speaking and writing, which is above the federal A2 for writing
    [St Gallen leaflet, section 1.1; hallo.sg.ch information sheet]
  - Bern uses the language of the administrative district and asks A2 written and B1 oral; people with a mother
    tongue, 5 years of compulsory school or a Swiss qualification in that language need no certificate [Canton of
    Bern language page]
  - Zurich has its own Cantonal German Test (KDE) for naturalisation, at B1 oral and A2 written; telc, Goethe, ÖSD
    and fide certificates at that level also count [Canton of Zurich cantonal German test page]
  - Authorities must take personal circumstances into account (for example disability, serious illness, a pronounced
    learning, reading or writing difficulty) when assessing language and economic-participation criteria [BüV art.
    9]
  sources:
