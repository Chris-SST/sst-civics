- key: naturalisation-interview
  kind: article
  category: test
  publish_at: 2027-01-11T07:00:00+01:00
  title: 'The naturalisation interview: what you are asked and how to prepare'
  brief: 'For applicants invited to (or wondering about) the commune interview. Question answered: will there be
    one, what is it for, what are the rules protecting me (language, companion, record), and how should I prepare?
    Angle: builds on the existing Zurich interview guide page with additional sourced detail and a comparison with
    Aargau, Bern and Basel-Stadt, where the interview has a different role (in Basel the Bürgergemeinde''s interview
    has ''test character''). The existing page already covers the Zurich basics: do NOT repeat the page, add: the
    commune''s discretion, how many Zurich communes hold one (51% always in 2025 versus 71% in 2022) and the rise
    of motivation letters (41% versus 7%), the topics the handbook names, and practical preparation. Do NOT list
    or reproduce question lists or sample questions from any canton''s materials; describe topic areas only. Preparation
    advice (for example practising answers aloud) is advice, not fact. Say: ask your commune whether it holds an
    interview and what you should bring.'
  outline:
  - Do all communes hold an interview? The Zurich figures
  - 'What the interview is for: the four topics'
  - 'Your rights: language level, dialect or standard German, a companion, a record'
  - 'Examples from other cantons: Aargau, Bern, Basel-Stadt'
  - Motivation letters and other ways communes check integration
  - How to prepare
  - 'After the interview: what happens next'
  must_cover:
  - In the canton of Zurich the commune decides whether to hold an interview; it is most useful where participation
    in social and cultural life, contacts with Swiss people, respect for constitutional values or promoting family
    members' integration need closer checking; a commune may skip it if the documents suffice [Zurich naturalisation
    handbook, section 6.2.1]
  - If a Zurich commune holds an interview it must take the language requirements (A2 written, B1 oral) into account,
    applicants may choose standard German or dialect, any adult may bring a reference person, and the commune must
    keep a record [Zurich naturalisation handbook, section 6.2.1]
  - Zurich communes may not interview children under 12; applicants up to 16 must have an adult reference person
    present [Zurich naturalisation handbook, section 6.2.2]
  - According to the canton's 2025 study, 51% of Zurich communes always hold an interview (down from 71% in 2022);
    41% now ask for motivation letters (7% in 2022); only about 10% ask for references [Canton of Zurich study of
    5 December 2025]
  - Bülach normally holds no interview and does so only in individual cases, for instance with doubts about German
    or basic knowledge, or about social and cultural participation, contacts with Swiss people, constitutional values
    or family integration [City of Bülach guide]
  - Otelfingen holds an interview in principle only where needed (doubts about knowledge or integration) and the
    decision lies with the residents' registry [Otelfingen guide]
  - Familiarity with Swiss living conditions includes basic knowledge of geography, history, politics and society,
    taking part in social and cultural life, and contacts with Swiss people [BüV art. 2 para. 1]
  - 'Aargau: civic knowledge is tested before filing and, at commune level, again in the interview; the Gemeinderat
    holds the interview; applicants sign a declaration on respect for the values of the constitution [Aargau handbook,
    sections 8.2 and 8.3; Aargau leaflet, section 3]'
  - 'Bern: after checking the application is complete, the commune invites the applicant to a personal interview
    [Canton of Bern how-to-apply page]'
  - 'Basel-Stadt: the Bürgergemeinde''s interview with the naturalisation commission ''has test character'', is
    recorded, and ends with a recommendation to admit, reject or postpone [Bürgergemeinde Basel page]'
  sources:
