- key: canton-bs
  kind: canton
  category: cantons
  publish_at: 2026-12-17T07:00:00+01:00
  title: 'Naturalisation in Basel-Stadt: requirements, interview and costs'
  brief: 'For foreign residents of Basel, Riehen or Bettingen. Angle: Basel-Stadt is a city-canton where the cantonal
    Migration Office does the checks and the Bürgergemeinde (citizens'' community) invites the applicant to an interview
    that the Basel Bürgergemeinde itself describes as having ''test character''; the cantonal fee was abolished
    for applications filed from 1 July 2026. Cover the requirements list, language proof (accepted providers; course
    confirmations are not accepted), the digital application, the steps, and the fees per commune (Basel city CHF
    800/950, Riehen CHF 1,700, Bettingen CHF 1,400, plus federal). No written canton-wide knowledge test is described
    on the canton''s pages: say that familiarity is checked in the interviews and that the Bürgergemeinde offers
    courses; do not invent a test. Do NOT list interview questions. Do not repeat federal rules in detail: link
    to the overview. Fee table is dated: say ''checked on''.'
  outline:
  - 'Who handles what: Migration Office, Bürgergemeinde, Government Council'
  - Requirements in one list
  - 'Language proof: what is accepted and what is not'
  - 'Applying: digital via eKonto or by post'
  - The Bürgergemeinde interview
  - Fees from 1 July 2026 and who is exempt
  - How long it takes
  - Dual citizenship and hardship cases
  must_cover:
  - 'Requirements: C permit; 10 years of actual residence in Switzerland with 3 of the last 5 years before filing;
    2 years in the commune within Basel-Stadt immediately before registration [Canton of Basel-Stadt step-by-step
    page]'
  - 'Further requirements listed by the canton: no tax arrears in the last 5 years, no criminal-register entries
    or pending proceedings, no unpaid debt collections or loss certificates, no social assistance in the last 3
    years unless fully repaid, sufficient German, participation in economic life or education, respect for constitutional
    values, familiarity with institutions in commune, canton and Confederation, social and cultural participation
    and contacts with Swiss people [Canton of Basel-Stadt step-by-step page]'
  - 'Language: German at B1 oral and A2 written; accepted providers are telc, Goethe-Institut, ÖSD or fide; a course
    confirmation is not a certificate and continuing-education diplomas (CAS/DAS/MAS) are not accepted; proof without
    a certificate is accepted for 5 years of compulsory school, a secondary-level (vocational or Matura) or a tertiary
    qualification obtained in German in the German-speaking area [Canton of Basel-Stadt step-by-step page]'
  - Applications can be filed digitally via the eKonto since 2026, or by post; the canton estimates about one hour
    for the online form [Canton of Basel-Stadt step-by-step page]
  - The Migration Office examines the requirements, holds interviews with applicants and family members and writes
    the report; afterwards the responsible Bürgergemeinde invites the applicant to an interview; naturalisation
    takes effect with the Government Council's decision once the federal permit exists [Canton of Basel-Stadt step-by-step
    page]
  - The Bürgergemeinde's interview with its naturalisation commission has 'test character' and is recorded; the
    commission then asks the Bürgerrat to admit, reject or postpone; the Bürgergemeinde runs an information evening
    and offers a compact naturalisation course and a course called 'Fit für Basel' [Bürgergemeinde Basel page]
  - From 1 July 2026 the canton no longer charges a fee; Basel city commune fees are CHF 800 for individuals aged
    25 and over and CHF 950 for couples or individuals with children; Riehen CHF 1,700; Bettingen CHF 1,400; federal
    fees CHF 50 for under 18, CHF 100 for adults and CHF 150 for couples [Canton of Basel-Stadt step-by-step page;
    Bürgergemeinde Basel page]
  - No commune fee for people up to 25 or for people receiving supplementary benefits (EL) or premium reductions
    (IPV); those with social assistance may be exempt if their personal circumstances were recognised [Canton of
    Basel-Stadt step-by-step page]
  - The usual duration of the ordinary procedure is one and a half to two years [Canton of Basel-Stadt step-by-step
    page]
  - Switzerland allows dual citizenship; the embassy of the country of origin says whether the former nationality
    is lost [Canton of Basel-Stadt step-by-step page]
  - Years with a F permit count half; L, N, G and S years are not counted; years from age 8 to adulthood count double
    with at least 6 actual years [Canton of Basel-Stadt step-by-step page]
  - People who cannot meet the language or economic-participation requirement because of personal circumstances
    (for example a pronounced learning, reading or writing difficulty, unavoidable welfare dependence) should contact
    the Migration Office's naturalisation department directly [Canton of Basel-Stadt step-by-step page; BüV art.
    9]
  sources:
  - title: 'Canton of Basel-Stadt: Step by step - the way to ordinary naturalisation (German)'
    url: https://www.bs.ch/themen/persoenliches-und-wohnen/einbuergerungen/schritt-fuer-schritt-der-weg-zur-ordentlichen-einbuergerung-0
  - title: 'Bürgergemeinde der Stadt Basel: Naturalisation for foreign nationals (German)'
    url: https://bgbasel.ch/de/einbuergerungen/auslaenderinnen-auslaender.html
  - title: 'Bürgergemeinde Riehen: Naturalisation in Riehen (German)'
    url: https://www.buergergemeinde-riehen.ch/einbuergerung.html
  - title: 'SEM: Ordinary naturalisation (German)'
    url: https://www.sem.admin.ch/sem/de/home/integration-einbuergerung/schweizer-werden/ordentlich.html
