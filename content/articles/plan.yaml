- key: dual-citizenship
  kind: article
  category: after
  publish_at: 2026-11-23T07:00:00+01:00
  title: Can I keep my passport? Dual citizenship for the main nationalities in Switzerland
  brief: 'For applicants who worry about losing their current nationality. Question answered: does Switzerland make
    me give up my passport, and does my country take my nationality away when I become Swiss? Angle: one short section
    per country, stating ONLY what that country''s own government source says, with the source named in the text
    and the date of the source. Switzerland does not require you to give up your nationality; whether your home
    country removes it is for that country''s law, and Swiss authorities cannot tell you. Countries covered (those
    with a readable official source): Germany, Austria, France, Italy, Spain, Portugal, Turkey, Serbia, Kosovo.
    NOT covered: North Macedonia (no official page found that could be read), so say ''ask the embassy in Bern''.
    The article MUST say at the top that rules change, give the ''checked on'' date, and tell readers to confirm
    with their embassy or consulate before applying; never write ''you will keep your passport'', write ''the source
    says''. Do not give legal advice on military service beyond the one SEM sentence. Do not repeat the overview
    page. Note on sources: the Kosovo text is the 2013 law as enacted (a copy hosted on GLOBALCIT); a new draft
    law was before the Kosovo government in 2026, so flag it as possibly outdated. The Portuguese text is the consolidated
    Lei 37/81 (amended most recently by Lei Organica 1/2026) hosted by a Portuguese public-prosecution law database.'
  outline:
  - What Switzerland says (and what it cannot tell you)
  - 'How to read this article: rules change, always check'
  - Germany and Austria
  - France, Italy, Spain and Portugal
  - Turkey, Serbia and Kosovo
  - 'Other nationalities: how to ask your embassy or consulate'
  - Practical steps before you file
  must_cover:
  - Dual citizenship has been allowed in Switzerland without restriction since 1 January 1992; people naturalised
    in Switzerland do not have to give up their previous nationality; but the law of the country of origin may remove
    its nationality automatically on voluntary acquisition of another; Swiss authorities cannot give information
    on this and refer to the embassy or consulate [SEM dual citizens page]
  - Military service of dual citizens is generally performed in the state where the person lives at the time of
    conscription; someone who has served abroad is no longer called up in Switzerland [SEM dual citizens page]
  - 'Germany: since 27 June 2024 (Act on the Modernisation of Nationality Law) acquiring another nationality on
    application no longer causes loss of German nationality, for all nationalities worldwide; the retention-permit
    procedure no longer exists [German Federal Office of Administration, ''Modernisierung ... in Kraft getreten''
    and ''Beibehaltungsverfahren'' pages]'
  - 'Austria: Austrian citizenship is lost by law when a person acquires a foreign nationality on their own application,
    declaration or express consent, unless retention of Austrian citizenship was applied for and approved before
    the foreign nationality was acquired [oesterreich.gv.at, loss page]'
  - 'France: holding another nationality has in principle no effect on French nationality; France ended chapter
    I of the 1963 Council of Europe convention with effect from 5 March 2009, so voluntary acquisition of a nationality
    of a party state no longer causes automatic loss; an adult living abroad may choose to declare the loss of French
    nationality, at the latest within one year after acquiring the foreign nationality [French foreign ministry
    ''double nationalite'' page; Service-Public ''Perte volontaire'' page]'
  - 'Italy: since 16 August 1992 acquiring a foreign citizenship does not cause loss of Italian citizenship unless
    the person formally renounces it (Art. 11 of Law 91/1992), subject to international agreements [Italian foreign
    ministry citizenship page]'
  - 'Spain: Spaniards who are of age (emancipated), live abroad and voluntarily acquire another nationality lose
    Spanish nationality unless they declare within 3 years that they wish to keep it; acquiring the nationality
    of Ibero-American countries, Andorra, the Philippines, Equatorial Guinea or Portugal does not cause this loss
    (Switzerland is not among the listed countries) [Spanish Ministry of Justice, ''Como se pierde la nacionalidad''
    page]'
  - 'Portugal: the loss-of-nationality provision of the Nationality Act is Art. 8, which says persons who hold another
    nationality lose Portuguese nationality if they declare they do not want to be Portuguese; the consolidated
    text lists no loss of nationality on acquiring another nationality [Lei 37/81, art. 8, consolidated text]'
  - 'Turkey: the Citizenship Law lists loss of Turkish citizenship by renunciation, revocation or cancellation (art.
    24); art. 44 says that people who acquire another State''s citizenship may submit documents so that a note about
    multiple citizenship is added to their family registry [Turkish Citizenship Law No. 5901, art. 24 and 44]'
  - 'Serbia: no release from foreign citizenship is required for admission to Serbian citizenship, so dual citizenship
    is possible; the ministry''s page lists release (on application) and renunciation (adults born and living abroad,
    before age 25) as the ways Serbian citizenship ends [Serbian Ministry of Foreign Affairs citizenship page]'
  - 'Kosovo: Art. 3 of Law 04/L-215 says a Kosovo citizen may also hold the citizenship of one or more other states,
    and acquiring or holding another citizenship does not cause loss of Kosovo citizenship (text as enacted in 2013;
    check for newer law) [Law 04/L-215, art. 3]'
  sources:
  - title: 'SEM: Dual citizens (German)'
    url: https://www.sem.admin.ch/sem/de/home/integration-einbuergerung/schweizer-werden/doppelbuerger.html
  - title: 'Germany, Federal Office of Administration: Modernisation of nationality law in force (German)'
    url: https://www.bva.bund.de/DE/Services/Buerger/Ausweis-Dokumente-Recht/Staatsangehoerigkeit/_documents/Meldung/Meldung_Gesetzesaenderung_2024.html
  - title: 'Germany, Federal Office of Administration: Retention procedure abolished (German)'
    url: https://www.bva.bund.de/DE/Services/Buerger/Ausweis-Dokumente-Recht/Staatsangehoerigkeit/Beibehaltung/Beibehaltung_node.html
  - title: 'Austria, oesterreich.gv.at: Loss, withdrawal and renunciation of citizenship (German)'
    url: https://www.oesterreich.gv.at/de/themen/menschen_aus_anderen_staaten/staatsbuergerschaft/Verlust_Entziehung_Verzicht_Staatsbuergerschaft
  - title: 'France, Ministry for Europe and Foreign Affairs: More about dual nationality (French)'
    url: https://www.diplomatie.gouv.fr/fr/services-aux-francaises-et-aux-francais/preparer-son-expatriation/vie-administrative-et-elections/nationalite-francaise/en-savoir-plus-sur-la-double-nationalite
  - title: 'France, Service-Public: Voluntary loss of French nationality (French)'
    url: https://www.service-public.gouv.fr/particuliers/vosdroits/F35506/5?idFicheParent=F3073
  - title: 'Italy, Ministry of Foreign Affairs: Italian citizenship (Italian)'
    url: https://www.esteri.it/it/servizi-opportunita/italiani-all-estero/cittadinanza/
  - title: 'Spain, Ministry of Justice: How Spanish nationality is lost (Spanish)'
    url: https://www.mjusticia.gob.es/gl/ciudadania/nacionalidad/que-es-nacionalidad/como-pierde-nacionalidad
  - title: 'Portugal, Procuradoria-Geral Distrital de Lisboa: Nationality Act, Lei 37/81 as amended (Portuguese)'
    url: https://www.pgdlisboa.pt/leis/lei_mostra_articulado.php?nid=614&tabela=leis
