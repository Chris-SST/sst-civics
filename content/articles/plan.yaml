- key: years-counted
  kind: article
  category: eligibility
  publish_at: 2026-11-30T07:00:00+01:00
  title: 'How your years in Switzerland are counted: permits, ages 8 to 18 and time abroad'
  brief: 'For C-permit holders who are close to the residence requirement and are unsure which years count. Question
    answered: which permits count in full, half or not at all, how the years between 8 and 18 are doubled, and what
    a stay abroad does to the count. Angle: precise rules from the SEM handbook plus a table comparing the extra
    commune/canton periods of the five canton guides and Zurich. Do NOT repeat the calculator page or its rules
    list; link to it and add the cases it does not cover (time abroad, who has to be continuous, why the cantonal
    periods are counted differently). Explain clearly that federal doubling and the time-abroad rules apply only
    to the federal period, not to cantonal or communal periods. Cantonal and communal periods vary and change: cite
    each canton''s page, say ''checked on'' and tell readers to confirm with their commune. Say: check with your
    commune for the exact day you can file.'
  outline:
  - The federal rule in one paragraph
  - 'Which permits count: B, C, F, Ci and diplomatic cards; L, G, N, S and visas do not'
  - 'Ages 8 to 18: how doubling works and the six-year floor'
  - Continuous or not? The 10 years versus the 3-of-5 rule
  - 'Time abroad: six months, one year for work or study, deregistration'
  - Canton and commune periods side by side
  - 'Special cases: registered partners and spouses'
  - How to check your own count
  must_cover:
  - Ordinary naturalisation requires a C permit at filing and 10 years' residence in total, 3 of them within the
    last 5 years before filing [BüG art. 9 para. 1]
  - Time lived in Switzerland between the 8th and 18th birthdays counts double, but actual residence must be at
    least 6 years [BüG art. 9 para. 2]
  - Residence counts with a B or C permit in full and with a temporary admission permit (F) at half; a diplomatic
    legitimation card or comparable title (for example Ci) counts too [BüG art. 33 para. 1; SEM Handbuch chapter
    3, 311/1]
  - Stays with an L, G, N or S permit, with a tourist (Schengen) visa, or under a false identity are not counted
    [SEM Handbuch chapter 3, 311/1]
  - The SEM counts back from the filing date; the 10 years may contain gaps, but the 3 years within the last 5 must
    be spent in Switzerland without interruption [SEM Handbuch chapter 3, 311/2]
  - Short stays abroad with the intention to return do not interrupt residence; residence is deemed given up if
    the person deregisters with the authority or actually lives abroad for more than 6 months [BüG art. 33 para.
    2-3]
  - A stay abroad of at most one year on the employer's behalf or for education or further training counts as a
    short-term absence; a longer stay abroad is not counted towards the federal period [BüV art. 16; SEM Handbuch
    chapter 3, 311/3]
  - Cantons must set a minimum cantonal/communal residence of between 2 and 5 years [BüG art. 18 para. 1]
  - In Zurich, applicants must have lived in the same commune for the 2 years immediately before filing; applicants
    under 25 need only 2 years in the canton; the doubling and the time-abroad rules apply only to the federal period,
    not to the cantonal or communal ones [Zurich naturalisation handbook, section 3.4.1]
  - 'Aargau: 5 years in the canton and at least 3 years uninterrupted in the commune; Bern: 2 years uninterrupted
    in the canton and in the commune; St Gallen: the last 5 years uninterrupted in the canton and the commune, without
    double counting [Aargau leaflet; Canton of Bern residence page; St Gallen leaflet]'
  - A registered partner of a Swiss citizen needs 5 years' total residence, one of them immediately before filing,
    and 3 years in the partnership [BüG art. 10]
  - A C permit must be held at filing and throughout the procedure until the cantonal decision [SEM Handbuch chapter
    3, 311]
  sources:
