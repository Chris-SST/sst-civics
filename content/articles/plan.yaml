- key: integration-debts-welfare
  kind: article
  category: eligibility
  publish_at: 2026-12-14T07:00:00+01:00
  title: 'What ''successful integration'' means: debts, welfare and criminal record'
  brief: 'For applicants worried that a debt, a past welfare payment or a fine will block them. Question answered:
    which items in the file are real obstacles under federal rules, how far back they are checked, and what hardship
    rules exist. Angle: translate the Ordinance articles into plain examples (what a debt-collection entry or a
    sentence does to the file), clearly separated into federal rules (BüV) and what cantons add. Be precise about
    the look-back periods: social assistance 3 years; debt-collection register extract 5 years (SEM handbook); criminal-record
    thresholds as in the Ordinance. Do NOT give a list of ''what is allowed'' that is not in the sources, and do
    not promise outcomes: the authority decides each case. Cantons and communes differ: Basel says no tax arrears
    in 5 years; Aargau asks for social-assistance confirmation for the last 10 years. Present those as canton rules
    with their sources. Say: ask your commune whether a specific entry matters.'
  outline:
  - The five federal integration criteria in plain words
  - 'Debts and tax arrears: what is looked at and for how long'
  - 'Welfare: the 3-year rule and who is exempt'
  - 'Criminal record: what counts, probation periods, pending cases'
  - Respect for constitutional values
  - 'Hardship rules: illness, disability, working poverty, care duties'
  - What cantons add on top
  - What to do before you file
  must_cover:
  - 'Integration shows in: respect for public safety and order, respect for the values of the Federal Constitution,
    ability to communicate in a national language, participation in economic life or education, and supporting the
    integration of spouse and minor children; cantons may add criteria [BüG art. 12 para. 1 and 3]'
  - Someone who receives social assistance in the 3 years directly before filing or during the procedure does not
    meet the economic-participation criterion unless the assistance is fully repaid [BüV art. 7 para. 3]
  - Economic participation means covering living costs and maintenance obligations at filing and at naturalisation
    through income, assets or benefits to which one has a legal claim; being in education or training at filing
    or naturalisation also counts [BüV art. 7 para. 1-2]
  - The SEM may refuse the federal permit if tax arrears, debt collections or loss certificates appear in the debt-collection
    register extract of the last 5 years before filing; examples of failures include arrears on taxes, health insurance
    or fines, rent arrears, unpaid maintenance or accumulating debts [SEM Handbuch chapter 3, financial reputation
    section]
  - Public safety and order are not respected if a person wilfully fails to meet important public-law or private-law
    obligations, or repeatedly or substantially disregards laws and official orders [BüV art. 4 para. 1]
  - 'The criminal-record rule: entries such as an unconditional sentence, a conditional fine of more than 90 daily
    units, or a conditional prison sentence of more than 3 months mean the person is not considered integrated;
    a running probation period or unexecuted sanction also blocks integration; pending criminal proceedings suspend
    the procedure [BüV art. 4 para. 2, 3 and 5]'
  - Respect for constitutional values includes equality of men and women, freedom of belief and opinion, the rule
    of law and the duty of military or civilian service and of school attendance [BüV art. 5]
  - 'Hardship: authorities must take personal circumstances into account and may deviate from the language and economic-participation
    criteria for disability, serious or long illness, pronounced learning, reading or writing difficulty, working
    poverty, care duties, or welfare dependence caused by a first formal education in Switzerland [BüV art. 9; BüG
    art. 12 para. 2]'
  - 'Basel-Stadt: no tax arrears in the last 5 years; instalment payments of taxes are treated as arrears and open
    tax bills must be paid before filing; no unpaid debt collections or loss certificates; supplementary benefits
    (EL) and premium reductions do not count as social assistance [Canton of Basel-Stadt step-by-step page]'
  - 'Aargau: the confirmation of non-receipt or repayment of social assistance must cover the last 10 years [Aargau
    handbook, section 3.3.4]'
  - Applicants must report promptly any later change that could prevent naturalisation and must give complete and
    correct information [BüV art. 21]
  sources:
  - title: 'Fedlex: Citizenship Act (BüG, SR 141.0), consolidated version of 1 September 2023 (German)'
    url: https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2016/404/20230901/de/html/fedlex-data-admin-ch-eli-cc-2016-404-20230901-de-html-1.html
