- key: c-permit-vs-swiss-passport
  kind: article
  category: after
  publish_at: 2027-01-18T07:00:00+01:00
  title: 'C permit or Swiss passport: what changes when you naturalise'
  brief: 'For C-permit holders still deciding whether to apply. Question answered: what do I gain, what do I take
    on, and what can I lose with each status? Angle: a sober comparison grounded in the Constitution and the Foreign
    Nationals and Integration Act: the C permit is permanent but can lapse or be revoked; Swiss citizenship brings
    political rights, protection from expulsion and the right to enter, and (for men) the duty of military or civilian
    service. Include the safeguards (annulment within a time limit for false information, withdrawal only after
    a final conviction). Do NOT promise benefits that are not in the sources (consular protection, local voting
    rights for foreigners, tax or insurance effects): say ''these differ by canton or case; ask the authority''.
    Do not cover how to apply (see overview). Mention only that some cantons, for example St Gallen, give foreign
    residents no vote at all (source: canton information sheet). Tone: neutral, helps the reader decide; no pressure.'
  outline:
  - What a C permit gives you and what can end it
  - 'What Swiss citizenship adds: political rights'
  - 'Rights that depend on citizenship: staying, leaving, entering, no expulsion'
  - 'Duties: military or civilian service for men'
  - Dual citizenship and your other passport
  - 'Safeguards: annulment, withdrawal, release'
  - 'How to decide: a checklist of questions'
  must_cover:
  - The C permit is granted for an unlimited period and without conditions [AIG art. 34 para. 1]
  - A C permit can be revoked in listed cases, among them a serious breach of public safety and order, long-term
    and considerable dependence on social assistance, or fraudulently trying to obtain Swiss citizenship; it can
    also be revoked and replaced by a B permit if the integration criteria are not met [AIG art. 63 para. 1-2]
  - A permit lapses on deregistration abroad; a C permit lapses after 6 months abroad without deregistration, but
    on request it can be kept for 4 years [AIG art. 61]
  - Swiss citizens cannot be expelled from Switzerland and can be extradited only with their consent; they have
    the right to leave or enter Switzerland and to settle anywhere in the country [Federal Constitution art. 24-25]
  - 'All Swiss citizens over 18 have political rights in federal matters: they can vote in elections to the National
    Council and federal votes and launch or sign initiatives and referendum requests [Federal Constitution art.
    136]'
  - In the canton of St Gallen foreign residents may not vote or stand in elections; they may petition the authorities
    and take part in commissions and working groups of their commune [hallo.sg.ch information sheet]
  - Every Swiss man must do military service (civilian service as an alternative); a Swiss man who does neither
    pays a tax; service is voluntary for women [Federal Constitution art. 59]
  - Dual citizens usually serve in the state where they live at the time of conscription; someone who served abroad
    is no longer called up in Switzerland [SEM dual citizens page]
  - Switzerland has allowed dual citizenship without restriction since 1 January 1992; whether the other country
    removes its nationality depends on that country's law [SEM dual citizens page]
  - A person who is a citizen of a commune and of its canton is Swiss; Swiss citizenship is acquired when the cantonal
    naturalisation decision becomes final, and a passport and ID card can then be requested [Federal Constitution
    art. 37; BüG art. 14 para. 3; Canton of Bern how-to-apply page]
  - Naturalisation obtained through false information or concealed facts can be declared void within 2 years of
    the SEM learning the facts and at the latest within 8 years of acquisition [BüG art. 36 para. 1-2]
  - A Swiss citizen can be released from Swiss citizenship only if living abroad and holding, or being assured of,
    another nationality [BüG art. 37 para. 1]
