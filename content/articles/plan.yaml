- key: canton-ag
  kind: canton
  category: cantons
  publish_at: 2026-11-19T07:00:00+01:00
  title: 'Naturalisation in the canton of Aargau: requirements, test and costs'
  brief: 'For foreign residents of Aargau with a C permit who want to know what is different in Aargau. Angle: Aargau
    has a cantonal civics test with a published format and an official practice site, and the commune (not the canton)
    is the main gatekeeper, often via a vote in the communal assembly. Cover the residence rules (5 years in the
    canton, at least 3 years uninterrupted in the commune), the test (format, price, retakes), language, the commune
    and canton stages, fees and timing. Do NOT list or paraphrase test questions, and do not link to the practice
    site''s question list; say only that the canton publishes practice material and the commune tells you where
    and when. Do NOT explain federal rules in detail (10 years, C permit, years 8-18): link to the overview and
    calculator pages. Date every cost: the leaflet is dated 17 December 2024 and fees may have changed. The leaflet
    gives about 12 months for the cantonal stage; the canton page says about 10 months for canton and Confederation
    together on top of the commune: state both and say that the figures differ. Communes publish their own forms:
    say ''ask your commune'' for form, date of the test and the commune''s own steps.'
  outline:
  - 'How it works in Aargau: commune, canton, Confederation'
  - 'Residence: Confederation, canton and commune'
  - Language requirement and proof
  - 'The Aargau civics test: format, price, retakes'
  - 'The commune stage: publication, interview, assembly'
  - The canton stage and the final decision
  - Fees and timing
  - Practical tips and where to ask
  must_cover:
  - Someone becomes Swiss only if all three citizenships (federal, cantonal, communal) are granted; the three authorities
    decide independently, and if one rejects, the procedure ends [Canton of Aargau, ordinary naturalisation page]
  - Aargau requires 5 years' residence in the canton and at least 3 years of uninterrupted residence in the commune
    before filing; the federal rule of C permit plus 10 years' residence (3 in the last 5) also applies [Canton
    of Aargau page; Aargau leaflet section 1.1]
  - 'Language: German at B1 oral and A2 written [Aargau leaflet section 1.3]'
  - The civics test is run by the communes, costs CHF 50, must be passed before the application is filed, applies
    from age 16, can be repeated without limit with a 2-month wait between attempts [Aargau leaflet section 1.3]
  - The test has 45 questions on federal and cantonal level, 40 minutes, and counts as passed with three quarters
    correct, i.e. 34 questions; the certificate must not be older than 6 months; communes may not run their own
    tests [Aargau handbook sections 3.3 and 4.1]
  - The commune publishes the application in its official organ; the Gemeinderat checks the requirements and holds
    an interview; the decision on communal citizenship is taken by the communal assembly, the Einwohnerrat or the
    Gemeinderat depending on the commune [Aargau leaflet section 3]
  - At a communal assembly the vote is normally open; a quarter of those present can demand a secret ballot; a rejection
    needs a stated reason [Aargau handbook sections 12.4; BüG art. 16]
  - After the commune, the canton obtains the federal permit; the naturalisation commission of the Grand Council
    decides finally unless the Grand Council itself decides [Aargau leaflet section 3]
  - 'Fees according to the leaflet of 17 December 2024: commune CHF 1,500 for an individual, canton CHF 750, federal
    CHF 100 per individual or CHF 150 per couple; children included from age 10 pay half the commune and canton
    fees, under 10 pay none [Aargau leaflet section 4]'
  - 'Timing: the canton''s page says about 10 months for canton and Confederation together on top of the commune''s
    processing time; the leaflet gives about 12 months for the cantonal stage; communes differ [Canton of Aargau
    page; Aargau leaflet section 3]'
  - 'Documents: the civil-status extract must not be older than 6 months at filing; applicants must report changes
    such as criminal proceedings, social assistance, marriage, divorce or births at once; false information can
    lead to annulment [Aargau leaflet sections 2; BüG art. 36]'
  - Applications are submitted to the home commune (Gemeindekanzlei), which supplies the forms; contact for the
    canton is einbuergerungen@ag.ch [Canton of Aargau page]
