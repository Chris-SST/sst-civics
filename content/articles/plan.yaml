- key: canton-sg
  kind: canton
  category: cantons
  publish_at: 2027-01-21T07:00:00+01:00
  title: 'Naturalisation in the canton of St Gallen: requirements, steps and costs'
  brief: 'For foreign residents of St Gallen. Angle: St Gallen uses the maximum cantonal residence period allowed
    by federal law (5 years uninterrupted in the canton AND in the political commune, with no double counting) and
    asks for B1 German in both speaking and writing, above the federal A2 for writing; the commune''s naturalisation
    council (Einbürgerungsrat) is the first authority. Cover requirements, language, the special ''besondere Einbürgerung''
    for young people, the steps, what the canton says about tests, moving during the procedure, and cost. Honest
    gaps: there is no cantonal test described; the canton''s information sheet says only that some naturalisation
    authorities use a written or oral test on knowledge of Switzerland, so tell readers to ask their commune. Commune
    fees vary and the canton gives only ranges; say ''ask your commune''. The leaflet is dated 6 November 2023 and
    the information sheet 16 December 2024: say so and say ''checked on''. Do NOT repeat federal rules in detail:
    link to the overview and calculator pages.'
  outline:
  - 'Who handles what: Einbürgerungsrat, canton, Confederation'
  - 'Residence: 10 years in Switzerland and 5 years in canton and commune'
  - 'Language: B1 in speaking and writing'
  - 'Other requirements: finances, integration, local knowledge'
  - Steps from application to cantonal decision
  - 'The test: what the canton says and what it leaves to communes'
  - Moving during the procedure and the special route for young people
  - Fees and where to ask
  must_cover:
  - The canton distinguishes ordinary naturalisation in general ('Einbürgerung im Allgemeinen') and special naturalisation
    ('besondere Einbürgerung') [Canton of St Gallen naturalisation page]
  - 'Requirements: C permit; 10 years in Switzerland (ages 8 to 18 count double, minimum 6 actual years); and the
    last 5 years uninterrupted in the canton of St Gallen and in the political commune; the cantonal law does not
    allow counting the same years twice for canton and commune [St Gallen leaflet, section 1.1]'
  - 'Language: at least B1 in both speaking and writing, i.e. higher than the federal A2 for writing [St Gallen
    leaflet, section 1.1; hallo.sg.ch information sheet]'
  - 'Other criteria: respect for public safety and for the values of the Federal Constitution, with an express commitment;
    orderly financial circumstances; participation in economic life or education; promoting the integration of spouse
    and minor children; familiarity with Swiss and local conditions, including interest in public affairs and basic
    knowledge of the state structure and of geography, history, politics and society [St Gallen leaflet, section
    1.1]'
  - 'Special naturalisation: foreign and stateless young people can apply before their 20th birthday if they have
    lived at least 10 years in Switzerland, of which at least 5 in the political commune; federal double counting
    is not possible here [St Gallen leaflet, section 1.2]'
  - The home commune's naturalisation council (Einbürgerungsrat) gives the first advice and takes the application;
    only the residence commune can be the naturalisation commune; the council decides on communal citizenship, and
    for general naturalisation runs the public notice procedure [St Gallen leaflet, sections 2 and 3.1]
  - After communal citizenship is granted, the file goes to the cantonal Amt für Gemeinden und Bürgerrecht; once
    the SEM has issued the federal permit, the cantonal government decides on cantonal citizenship, which completes
    the procedure [St Gallen leaflet, section 3.2]
  - 'Moving to another commune or canton during the procedure: the council with the pending application stays responsible
    if it has published the naturalisation in the commune''s official publication organ; otherwise the application
    is declared moot [St Gallen leaflet, section 2]'
  - Changes of civil status (marriage, divorce, widowhood) or the birth of a child after communal citizenship was
    granted must be reported at once to the cantonal Amt für Gemeinden und Bürgerrecht [St Gallen leaflet, section
    7]
  - 'Fees: the canton can charge up to CHF 2,000 for cantonal citizenship; the Confederation charges CHF 50 to 150;
    fees follow the cost-coverage principle and communes also charge; the canton''s information sheet gives averages
    of CHF 500 to 1,000 per person for the commune [St Gallen leaflet, section 4; hallo.sg.ch information sheet]'
  - Some naturalisation authorities hold a written or oral test on knowledge of Switzerland; how long a procedure
    takes differs between communes [hallo.sg.ch information sheet]
  - Switzerland allows dual citizenship, but the former nationality may be lost automatically under the origin country's
    law; only the embassy or consulate can say [St Gallen leaflet, section 6]
  sources:
