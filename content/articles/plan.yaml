- key: seven-mistakes
  kind: article
  category: process
  publish_at: 2027-02-01T07:00:00+01:00
  title: Seven mistakes that delay a Swiss citizenship application
  brief: 'Evergreen checklist for people about to file. Angle: every ''mistake'' is a rule in the federal law, the
    Ordinance or an official cantonal source; the article is a rule-based checklist, NOT a list of statistics, and
    must not claim how often a mistake happens or by how many months it delays (no sources for that). For each mistake:
    the rule, why it matters, what to do instead, and the link to the deeper article. The seven: (1) filing before
    every condition is met; (2) letting residence lapse by deregistering or staying abroad; (3) leaving debts, tax
    arrears or collections open; (4) social assistance in the last three years; (5) criminal-record entries or pending
    proceedings; (6) a language proof that is not recognised; (7) not reporting changes or giving incomplete or
    false information (plus outdated documents). Do NOT repeat details already given in the deeper articles; keep
    each mistake to one short section. Say: ask your commune for the exact document list and dates.'
  outline:
  - 1. Filing too early
  - 2. Letting residence lapse
  - 3. Open debts and tax arrears
  - 4. Social assistance in the last three years
  - 5. Criminal-record entries and pending proceedings
  - 6. An unrecognised language proof
  - 7. Not reporting changes, incomplete information and outdated documents
  - A final pre-filing checklist
  must_cover:
  - The formal requirements must be met at the time of filing; an application cannot be filed before the 10 years
    of residence are complete [SEM FAQ, ordinary naturalisation section]
  - A C permit must be held at filing, throughout the procedure and until the cantonal decision [SEM Handbuch chapter
    3, 311]
  - Residence is deemed given up if the person deregisters or actually lives abroad for more than 6 months; a stay
    abroad of up to one year for the employer or education counts as a short absence [BüG art. 33 para. 3; BüV art.
    16]
  - A C permit lapses after 6 months abroad without deregistration (it can be kept for 4 years on request) [AIG
    art. 61 para. 2]
  - Tax arrears, debt collections and loss certificates in the last 5 years' register extract can lead the SEM to
    refuse the permit [SEM Handbuch chapter 3, financial reputation section]
  - Basel-Stadt treats instalment payments of taxes as arrears and wants open tax bills settled before filing [Canton
    of Basel-Stadt step-by-step page]
  - Social assistance in the 3 years before filing or during the procedure blocks the economic-participation criterion
    unless fully repaid [BüV art. 7 para. 3]
  - Pending criminal proceedings suspend the procedure; an unserved sanction or running probation period means integration
    cannot be assumed [BüV art. 4 para. 3 and 5]
  - A language-course confirmation or placement assessment is not accepted as proof; a continuing-education diploma
    (CAS/DAS/MAS) is not accepted in Basel-Stadt [SEM FAQ on the list of recognised language certificates, question
    5; Canton of Basel-Stadt step-by-step page]
  - Applicants must give complete and correct information and promptly report later changes (for example proceedings,
    social assistance, marriage, divorce, births); naturalisation obtained by false information or concealment can
    be declared void [BüV art. 21; Aargau leaflet, section 2; BüG art. 36]
  - 'Document age limits: in Aargau the civil-status extract may not be older than 6 months at filing and other
    documents not older than 3 months; in Basel-Stadt the civil-register extract may not be older than 3 months
    [Aargau leaflet, section 2; Canton of Basel-Stadt step-by-step page]'
  - The SEM may raise federal fees up to double for cases needing much more work [BüV art. 28 para. 1]
