- key: canton-lu
  kind: canton
  category: cantons
  publish_at: 2027-01-07T07:00:00+01:00
  title: 'Naturalisation in the canton of Lucerne: requirements, steps and costs'
  brief: 'For foreign residents of Lucerne with a C permit. Angle: in Lucerne almost everything is organised by
    the commune; the canton''s ''Abteilung Gemeinden'' only reviews the file after the commune has promised communal
    citizenship, and the canton and federal stages together take about four to six months. Cover the steps, the
    commune residence rule as worded by the canton, German-language requirements from the cantonal act, familiarity
    with local conditions, and fees (using the City of Lucerne''s leaflet as an example of a commune: CHF 500 flat
    for people over 25). Gaps to state honestly: the canton''s pages do not state a minimum cantonal residence period,
    a fixed cantonal test format or the fees of all communes; say ''ask your commune'' for each. The cantonal act
    used as a source is the version of 1 January 2018 and may have been amended since; say ''as of the version consulted''.
    The City of Lucerne leaflet is dated November 2026 and mentions an ''Einbürgerungskurs (Staatspolitik und Geografie)''
    as a possible extra cost; describe it as an example, not a rule for the whole canton. Do NOT repeat federal
    rules in detail; link to the overview and calculator pages.'
  outline:
  - 'How it works in Lucerne: commune first, then canton and Confederation'
  - 'Residence: federal rule and the commune period'
  - Language and familiarity with local conditions
  - Steps and the canton's review
  - 'Fees: the City of Lucerne as an example'
  - How long it takes
  - Moving during the procedure
  - 'After the decision: passport and ID'
  must_cover:
  - Ordinary naturalisation is the most common case in Lucerne; central requirements are 10 years of residence in
    Switzerland (with exceptions), a C permit, successful integration and familiarity with local living conditions
    [Canton of Lucerne, ordinary naturalisation page]
  - 'Steps: the applicant files with the commune; the commune examines the application and, if positive, assures
    communal citizenship; the Confederation grants the federal permit; the canton grants cantonal citizenship; only
    when all three agree does the applicant become Swiss [Canton of Lucerne, ordinary naturalisation page]'
  - After the commune's assurance the file goes to the cantonal Abteilung Gemeinden for review; shortly before naturalisation
    the applicant receives the form 'Beachten der Rechtsordnung'; the canton and federal stages together normally
    take about four to six months [Canton of Lucerne, ordinary naturalisation page and questions page]
  - 'Commune residence as worded by the canton: 3 years in the commune within the last 5 years before filing, and
    at least one year of uninterrupted residence in the commune immediately before naturalisation [Canton of Lucerne,
    questions page]'
  - 'Language: the cantonal act requires German at B1 oral and A2 written, shown by mother tongue, 5 years of compulsory
    school in German, upper-secondary or tertiary education in German, or a recognised test certificate (Goethe,
    telc, fide named by the City of Lucerne) [Cantonal Citizenship Act, para. 22; City of Lucerne leaflet]'
  - Familiarity with local conditions means basic knowledge of geographical, historical, political and social conditions
    in Confederation, canton and commune, taking part in local social and cultural life and contact with Swiss people
    [Cantonal Citizenship Act, para. 25]
  - 'The City of Lucerne leaflet lists as requirements: no entry in the federal criminal register, no debt collections,
    loss certificates or tax arrears, and no social assistance in the 3 years before filing or during the procedure
    [City of Lucerne leaflet]'
  - 'City of Lucerne fees: flat CHF 500 for people over 25, whether an individual, a couple or registered partners;
    none for minors or for young adults under 25 at filing; federal and cantonal fees add CHF 250 to 600; extra
    costs may arise for documents, the language proof and the ''Einbürgerungskurs (Staatspolitik und Geografie)'';
    the procedure takes about one and a half years [City of Lucerne leaflet]'
  - Other Lucerne communes charge their own fees; the canton tells applicants to ask their commune about cost and
    duration [Canton of Lucerne, questions page]
  - 'Moving during the procedure is possible only to a limited extent: canton and commune stay responsible if the
    examination needed for the assurance is complete [Canton of Lucerne, questions page; BüG art. 18 para. 2]'
  - For the passport or ID card after naturalisation, applicants contact the cantonal passport office [Canton of
    Lucerne, questions page]
  - Facilitated naturalisation (for example as the spouse of a Swiss citizen) is handled by the SEM, not by the
    commune [Canton of Lucerne, questions page]
  sources:
