- key: third-generation
  kind: article
  category: eligibility
  publish_at: 2027-01-25T07:00:00+01:00
  title: 'Third generation: the simplified route for grandchildren of immigrants'
  brief: 'For young people (and their parents) whose grandparents came to Switzerland and who were born here. Question
    answered: can I be naturalised by the facilitated third-generation route, what must the grandparent, the parent
    and I show, how do I prove it, and what is the deadline? Angle: the three-person test (grandparent, parent,
    applicant), the 25th-birthday deadline, what counts as proof, and what it costs. Facilitated naturalisation
    is decided by the SEM, not by the commune, so the cantonal residence periods and knowledge tests do not apply
    (the integration criteria of Art. 12 do). The overview page has one paragraph on the route: do NOT repeat it,
    add the three-level detail and the document types. Do NOT promise eligibility; for older applicants say ''a
    transitional rule once applied to people aged 26 to 35; check the SEM''. Say: check the SEM handbook and the
    form for the current document list.'
  outline:
  - Who the route is for
  - The grandparent condition
  - The parent condition
  - 'The applicant: born in Switzerland, C permit, five years of school'
  - 'The deadline: before your 25th birthday'
  - 'Proving grandparents'' residence: which documents work'
  - Integration criteria and who decides
  - Cost and how to apply
  must_cover:
  - 'The child of foreign parents can be naturalised on request if: at least one grandparent was born in Switzerland
    or it is made credible that the grandparent acquired a right of residence; at least one parent acquired a settlement
    permit, lived in Switzerland for at least 10 years and attended compulsory school in Switzerland for at least
    5 years; the applicant was born in Switzerland, holds a settlement permit and attended compulsory school in
    Switzerland for at least 5 years [BüG art. 24a para. 1; SEM third-generation page]'
  - The application must be filed before the 25th birthday; the SEM handbook says at the latest on the 25th birthday
    [BüG art. 24a para. 2; SEM Handbuch chapter 6, section 641]
  - Years of compulsory school in the SEM handbook include kindergarten [SEM Handbuch chapter 6, section 641]
  - 'The applicant must be successfully integrated: respect for public safety and order (for example no tax arrears,
    debt collections, loss certificates or criminal-record entries), respect for constitutional values, ability
    to communicate in a national language, participation in economic life or education (no social assistance in
    the last 3 years before filing unless fully repaid), supporting family integration; and no threat to Switzerland''s
    security [SEM third-generation page; BüG art. 20]'
  - 'Residence rights of the grandparent can be shown with: extracts from commune or canton residents'' registers,
    extracts from the SEM''s ZEMIS and its predecessor systems, extracts from migration systems of communes and
    cantons, extracts from the foreign ministry''s Ordipro, civil-status register extracts, and files of migration,
    school or tax authorities; as residence rights count residence or settlement permits, provisional admission,
    or an EDA legitimation card or a residence permit with gainful activity [BüV art. 15a and 15b; SEM Handbuch
    chapter 6, section 641/2]'
  - The SEM decides (after hearing the canton) and the canton prepares an enquiry report; the SEM normally decides
    within 12 months after receiving the cantonal report [BüG art. 25 para. 1; BüV art. 18 and art. 23 para. 2]
  - While living in Switzerland, the form is requested by email from the SEM (ch@sem.admin.ch) and returned by post
    with the documents on the SEM's list of required documents; the SEM provides forms for the commune (grandparents'
    residence), juvenile authority, social assistance, school and tax authorities and employer confirmation [SEM
    third-generation page]
  - 'Federal fee for facilitated naturalisation other than the spouse route: CHF 500 for adults and CHF 250 for
    minors at filing, plus up to CHF 400 for the cantonal enquiry [BüV art. 25 para. 1 let. c and para. 3 let. a]'
  - The naturalised person acquires the citizenship of the commune and canton of residence at the time of acquisition
    [BüG art. 24a para. 3]
  - Third-generation applicants over 25 cannot use this route; the ordinary route (C permit, 10 years, canton and
    commune periods) remains [BüG art. 9, art. 24a para. 2]
  sources:
