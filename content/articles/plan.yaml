- key: moving-canton-commune
  kind: article
  category: process
  publish_at: 2026-12-21T07:00:00+01:00
  title: Moving canton or commune during your naturalisation application
  brief: 'For applicants who may have to move (new job, rent increase) while their application is pending, or who
    are about to file and are thinking of moving first. Question answered: what happens to my application if I move,
    and how long must I live in the new commune or canton? Angle: the federal rule (the authorities stay responsible
    once the examination is finished) against what Zurich, St Gallen and Lucerne say in practice, plus the different
    residence periods that restart the clock (Aargau, Bern, Zurich, St Gallen). Link to the canton guides already
    published (Aargau, Bern, Basel-Stadt). Be clear that ''the examination is finished'' is the decisive moment
    and is decided by the authority, so applicants must ask their commune before moving and tell it at once. Federal
    doubling and time-abroad rules do not apply to cantonal/communal periods (Zurich handbook). Do NOT claim every
    canton works like Zurich; cite the canton named. Moving abroad: the C permit lapses after 6 months abroad without
    deregistration (4 years can be requested), and deregistering ends residence; keep this to two sentences. Say:
    ask your commune before you move.'
  outline:
  - 'The federal rule: who stays responsible if you move'
  - Why the date of the move decides everything
  - 'Zurich: moving before and after the commune''s checks'
  - 'St Gallen and Lucerne: what their authorities say'
  - 'How long you must live in the new place: periods by canton'
  - Moving abroad or deregistering
  - Spouses applying under the facilitated route
  - Checklist before you move
  must_cover:
  - Cantons must require minimum residence of 2 to 5 years [BüG art. 18 para. 1]
  - If the applicant moves to another commune or canton, the canton and commune where the application was filed
    stay responsible if they have conclusively examined the integration criteria and familiarity requirements (the
    examination needed for the commune's assurance) [BüG art. 18 para. 2; BüV art. 12]
  - 'Zurich: after the commune has completed its checks the applicant can move anywhere in Switzerland and the old
    commune stays responsible; if the move comes before the checks are completed, the new commune becomes responsible,
    the applicant does not yet meet the residence period there, and naturalisation is in principle impossible until
    the periods are met [Zurich naturalisation handbook, section 3.4.2]'
  - Zurich requires 2 years in the same commune immediately before filing; applicants under 25 need only 2 years
    in the canton of Zurich and can still be naturalised if they move within the canton before the checks end [Zurich
    naturalisation handbook, sections 3.4.1 and 3.4.2]
  - Federal doubling for ages 8 to 18 and the time-abroad rules apply only to the federal period, not to cantonal
    or communal ones [Zurich naturalisation handbook, section 3.4.1]
  - 'St Gallen: the council with the pending application stays responsible after a move into another commune or
    canton if it has already published the naturalisation in the commune''s official publication organ; otherwise
    it declares the application moot [St Gallen leaflet, section 2]'
  - 'Lucerne: a change of residence during the procedure is possible only to a limited extent: the canton and commune
    stay responsible if the examination required for the assurance is already complete [Canton of Lucerne, questions
    page]'
  - 'Residence periods that restart in a new place: Aargau 5 years in the canton and 3 years uninterrupted in the
    commune; Bern 2 years uninterrupted in canton and commune; Basel-Stadt 2 years in the commune; Zurich 2 years
    in the commune (2 in the canton if under 25); St Gallen the last 5 years uninterrupted in canton and commune
    [Aargau leaflet; Canton of Bern residence page; Canton of Basel-Stadt page; Zurich handbook; St Gallen leaflet]'
  - Residence in Switzerland is deemed given up on deregistration or after actually living abroad for more than
    6 months [BüG art. 33 para. 3]
  - A residence permit lapses on deregistration abroad; a C permit lapses after 6 months abroad without deregistration,
    but on request it can be kept for 4 years [AIG art. 61]
  - Applicants must promptly report later changes that could prevent naturalisation [BüV art. 21]
  - For spouses applying under the facilitated route, a move within Switzerland is allowed but usually needs extra
    enquiries that can lengthen the procedure [SEM FAQ]
