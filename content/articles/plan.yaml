- key: children-naturalisation
  kind: article
  category: eligibility
  publish_at: 2026-12-28T07:00:00+01:00
  title: 'Children and naturalisation: including them, and when they are assessed on their own'
  brief: 'For parents who want to naturalise and ask what happens to their children, and for teenagers or families
    whose children might apply separately. Question answered: are minor children included, from what age are they
    examined on their own, and what do they cost? Angle: the rule in Art. 30 BüG with the SEM''s practical details
    (custody, age 2, two years of residence, age 12). Cover fees using sourced examples (federal, Bern, Aargau).
    Link to the third-generation article for the route for grandchildren and to the Zurich interview rule (no interview
    with children under 12). Do NOT repeat the Zurich step-by-step guide. Cantonal rules on children vary (fees,
    whether a commune examines children aged 12 to 16): present Zurich, Aargau and Bern as examples. Say: ask your
    commune about the child''s part.'
  outline:
  - 'The basic rule: minor children are normally included'
  - When a child can be included (custody, living together, age and residence)
  - 'From age 12: the child''s own integration check; from 16: written declaration'
  - Children who apply alone
  - 'Children not included in the parent''s application: the 22nd-birthday rule'
  - 'Fees for children: federal and examples from cantons'
  - 'Stateless children and third generation: where to read more'
  must_cover:
  - Minor children are in principle included in the naturalisation of the applicant if they live with the applicant;
    for children from age 12 the integration and familiarity criteria are examined individually and in an age-appropriate
    way [BüG art. 30]
  - Inclusion is possible if the applicant has at least 50% of the childcare, regardless of the child's legal domicile;
    it is not possible if the child lives with and is mainly cared for by the other parent; infants up to age 2
    are included without further checks, older children if they have lived in Switzerland for at least 2 years [SEM
    Handbuch chapter 3, 311/41]
  - If the child has a different residence permit from the parent, extra checks are made [SEM Handbuch chapter 3,
    311/41]
  - Minor children can file only through their legal representative; from age 16 a child must also declare in writing
    that they want to become Swiss [BüG art. 31]
  - 'Zurich: children under 12 need not meet the material criteria and may not be given an interview; from age 12
    the commune may hold an interview, and up to age 16 an adult reference person must be present [Zurich naturalisation
    handbook, sections 1.1.3 and 6.2.2]'
  - A foreign child who was a minor at the time of a parent's application and was not included may apply for facilitated
    naturalisation before the 22nd birthday with 5 years' total residence, 3 of them immediately before filing [BüG
    art. 24]
  - A minor stateless child may apply for facilitated naturalisation with 5 years' total residence, one of them
    immediately before filing [BüG art. 23]
  - 'Federal fees: CHF 50 for a minor applying alone and no federal fee for minor children included in a parent''s
    application [BüV art. 25 para. 1 let. a and para. 2]'
  - 'Bern: including minor children living with the parent is free of charge; the canton fee for a minor naturalised
    without parents is CHF 575 [Canton of Bern how-to-apply and fees pages]'
  - 'Aargau: for included children, commune and canton charge nothing until age 10 and half the fee from age 10
    (leaflet of 17 December 2024) [Aargau leaflet, section 4]'
  - The federal permit can later be amended with regard to including children [BüG art. 13 para. 4]
  sources:
