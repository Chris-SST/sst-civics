- key: spouse-facilitated
  kind: article
  category: eligibility
  publish_at: 2026-11-16T07:00:00+01:00
  title: Married to a Swiss citizen? Facilitated naturalisation explained
  brief: 'For foreign spouses of Swiss citizens who live in Switzerland (a short section covers spouses living abroad)
    and are deciding between the facilitated and the ordinary route. Question answered: can I apply under the quicker
    route, what exactly must I show, who decides and what does it cost. Angle: this is a federal route handled by
    the SEM, so it works the same in every canton; there is no commune or cantonal vote and no minimum time in the
    commune. Explain the two time conditions (3 years in marital union, 5 years in Switzerland including the last
    year before filing) with a worked example, the cases where the route is excluded, and how registered partners
    differ (ordinary route with shorter residence, or conversion to marriage). Do NOT repeat what the overview guide
    page already says about the three levels of ordinary naturalisation or the general B1/A2 level; link to the
    overview and language-certificates pages instead. Do not state a typical total duration: the only sourced figures
    are the Ordinance''s targets of about 12 months for the cantonal report and about 12 months for the SEM afterwards,
    so give them as targets and note that the SEM FAQ says a move within Switzerland or abroad usually brings extra
    enquiries that can lengthen the procedure. Do not give a knowledge-test requirement for this route: Art. 20
    BüG does not list the ''familiar with Swiss living conditions'' criterion. Say: check the SEM leaflet and form
    for the current document list.'
  outline:
  - Who can use the facilitated route (and who cannot)
  - The two time conditions, with a worked example
  - What 'marital union' means in practice
  - Integration criteria that still apply (record, debts, language, welfare)
  - 'How to apply: form, documents, who decides, targets for timing'
  - Cost
  - Registered partners and spouses living abroad
  - Next steps and what to check with the SEM
  must_cover:
  - Foreign spouses of a Swiss citizen may apply for facilitated naturalisation if they have lived in marital union
    with the Swiss spouse for 3 years and have lived in Switzerland for 5 years in total, including the year immediately
    before filing [BüG art. 21 para. 1; SEM married-to-a-Swiss page]
  - The SEM decides on facilitated naturalisation (it hears the canton first); the application goes to the SEM,
    not to the commune [BüG art. 25 para. 1; SEM married-to-a-Swiss page]
  - The route is excluded if both spouses were foreign when they married and the Swiss spouse later became Swiss
    by ordinary naturalisation, or if the Swiss spouse has died by the time of filing [SEM married-to-a-Swiss page]
  - A marital union means a formal marriage plus a real, stable life together; living apart is accepted only for
    important reasons; the union must exist at filing and at the time of naturalisation [BüV art. 10]
  - 'The integration criteria of Art. 12 BüG apply: respect for public safety and order (the SEM names tax arrears,
    debt collections, loss certificates and criminal-record entries), respect for constitutional values, ability
    to communicate in a national language, participation in economic life or education, supporting family members''
    integration; plus no threat to Switzerland''s security [BüG art. 20 para. 1-2; SEM married-to-a-Swiss page]'
  - No social assistance in the last 3 years before filing, unless fully repaid [SEM married-to-a-Swiss page; BüV
    art. 7 para. 3]
  - 'Language proof at filing: at least A2 written and B1 oral in a national language [SEM married-to-a-Swiss page;
    BüV art. 6]'
  - Art. 20 BüG names the integration criteria of Art. 12 and the security condition for the facilitated route;
    it does not repeat the ordinary-route criterion of being familiar with Swiss living conditions (Art. 11 let.
    b) [BüG art. 11 and art. 20]
  - While living in Switzerland, the applicant requests the form by email from the SEM (ch@sem.admin.ch) and returns
    it completed by post; spouses abroad use the Swiss representation [SEM married-to-a-Swiss page; BüV art. 14-15]
  - 'Federal fee for a decision on naturalisation as a spouse: CHF 500, plus up to CHF 400 for the canton''s enquiry
    report; the SEM can raise fees up to double or reduce them by half in unusual cases [BüV art. 25 para. 1 let.
    b, para. 3 let. a, art. 28]'
  - 'Targets: the canton normally sends its report within 12 months and the SEM normally decides within 12 months
    after receiving it [BüV art. 22 and art. 23 para. 2]'
  - Registered partners of a Swiss citizen cannot use Art. 21; the ordinary route applies with 5 years' total residence
    (one of them immediately before filing) and 3 years in the partnership; since 1 July 2022 partners can convert
    the partnership into a marriage, and the partnership's duration then counts towards the marriage [BüG art. 10;
    Canton of Bern residence page]
