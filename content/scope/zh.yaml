- id: zh-120
  topic: gemeinde.leistungen
  section: Demokratie und Föderalismus
  fact_de: Die Auszählung der abgegebenen Stimmen bei Urnengängen übernimmt das Wahlbüro.
  fact_en: The electoral office carries out the counting of ballots cast in votes.
- id: zh-121
  topic: gemeinde.organisation.versammlung_parlament
  section: Demokratie und Föderalismus
