- id: zh-105
  topic: kanton.demokratie.regierungsrat
  section: Demokratie und Föderalismus
  fact_de: Der Zürcher Regierungsrat setzt sich aus sieben Personen zusammen.
  fact_en: The Zurich cantonal government consists of seven people.
- id: zh-106
  topic: kanton.demokratie.verfassung
