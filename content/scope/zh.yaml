- id: zh-125
  topic: gemeinde.organisation.gemeinderat_stadtrat
  section: Demokratie und Föderalismus
  fact_de: Kleinere Zürcher Gemeinden werden nach aussen von einer Gemeindepräsidentin oder einem Gemeindepräsidenten
