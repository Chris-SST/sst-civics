- id: zh-131
  topic: bund.sozial.gesundheit
  section: Sozialstaat und Zivilgesellschaft
  fact_de: Versicherte dürfen ihre Krankenkasse selbst auswählen.
  fact_en: Insured persons may choose their health insurer themselves.
- id: zh-132
  topic: bund.demokratie.wahlen
  section: Sozialstaat und Zivilgesellschaft
  fact_de: Ausländerinnen und Ausländer haben auf nationaler Ebene kein Stimmrecht.
  fact_en: Foreign nationals have no voting rights at the national level.
- id: zh-133
