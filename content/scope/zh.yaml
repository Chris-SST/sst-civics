  fact_en: Private savings form the third pillar of old-age provision.
- id: zh-140
  topic: bund.sozial.zivilgesellschaft
  section: Sozialstaat und Zivilgesellschaft
  fact_de: Amnesty International engagiert sich für den Schutz der Menschenrechte.
  fact_en: Amnesty International campaigns for the protection of human rights.
- id: zh-141
  topic: bund.sozial.wirtschaft_arbeit
  section: Sozialstaat und Zivilgesellschaft
