- id: zh-114
  topic: kanton.demokratie.kantonsrat
  section: Demokratie und Föderalismus
  fact_de: Die Kantonsratsmitglieder erhalten ihr Mandat durch eine Volkswahl.
  fact_en: Kantonsrat members obtain their seats through popular election.
- id: zh-115
  topic: gemeinde.organisation.versammlung_parlament
