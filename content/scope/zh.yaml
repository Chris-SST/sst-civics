  fact_de: Die Kantone kümmern sich hauptsächlich um ihre eigene Verwaltung und erlassen kantonales Recht.
  fact_en: Cantons mainly handle their own administration and enact cantonal legislation.
- id: zh-107
  topic: kanton.demokratie.kantonsrat
  section: Demokratie und Föderalismus
  fact_de: Die Zürcher Kantonsratsmitglieder werden für eine Amtsdauer von vier Jahren bestellt.
  fact_en: Members of the Zurich Kantonsrat are elected for a term of four years.
- id: zh-108
  topic: kanton.demokratie.regierungsrat
  section: Demokratie und Föderalismus
  fact_de: Die Zürcher Kantonsregierung trägt den Namen Regierungsrat.
  fact_en: The cantonal executive in Zurich is called the Regierungsrat.
- id: zh-109
  topic: kanton.demokratie.abstimmungen_wahlen
  section: Demokratie und Föderalismus
  fact_de: Zürich entsendet zwei Vertretungen in den Ständerat.
  fact_en: Zurich sends two representatives to the Council of States.
- id: zh-110
  topic: kanton.demokratie.kantonsrat
  section: Demokratie und Föderalismus
  fact_de: Das Zürcher Kantonsparlament trägt die Bezeichnung Kantonsrat.
  fact_en: The cantonal legislature of Zurich is called the Kantonsrat.
- id: zh-111
  topic: kanton.demokratie.regierungsrat
  section: Demokratie und Föderalismus
  fact_de: Die Regierungsratsmitglieder des Kantons Zürich werden direkt von der stimmberechtigten Bevölkerung
