canton: zh
basis: Fact checklist for the Zurich knowledge test, written in our own words from the official question
  catalogue of the canton of Zurich (zh.ch, 'Alle Fragen als Download', version of 15 May 2025), read
  on 2 November 2026 under D-063. No catalogue question, answer or wording is reproduced. One fact per
  catalogue question; 3 picture questions described in words.
source: https://www.zh.ch/de/migration-integration/einbuergerung/grundkenntnistest.html
facts:
- id: zh-001
  topic: bund.geschichte.weltkriege_neutralitaet
  section: Demokratie und Föderalismus
  fact_de: Neutralität bedeutet, dass die Schweiz bei bewaffneten Auseinandersetzungen zwischen anderen
    Staaten nicht Partei ergreift.
  fact_en: Neutrality means Switzerland takes no side in armed disputes between other countries.
- id: zh-002
  topic: bund.sozial.wirtschaft_arbeit
  section: Demokratie und Föderalismus
  fact_de: Grenzgänger sind Erwerbstätige, die ihre Stelle in der Schweiz haben, aber jenseits der Landesgrenze
    wohnen.
  fact_en: Cross-border commuters have a job in Switzerland but live in another country.
- id: zh-003
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Auf Latein heisst die Schweizerische Eidgenossenschaft Confoederatio Helvetica.
  fact_en: Confoederatio Helvetica is the Latin name of the Swiss Confederation.
- id: zh-004
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Zur Bundesverwaltung gehört unter anderem das Justiz- und Polizeidepartement.
  fact_en: The Justice and Police Department is one of the departments of the federal administration.
- id: zh-005
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Nach dem Kollegialitätsprinzip tragen alle Bundesratsmitglieder die gefassten Beschlüsse gegen
    aussen einheitlich mit.
  fact_en: Under the collegiality principle, all Federal Council members present its decisions publicly
    in a unified way.
- id: zh-006
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Mit einem Referendum können Stimmberechtigte ein vom Parlament beschlossenes Gesetz verhindern.
  fact_en: Through a referendum, voters can block a law that Parliament has passed.
- id: zh-007
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Die Bundeskanzlei steht dem Bundesrat als Stabsstelle zur Seite.
  fact_en: The Federal Chancellor serves as the Federal Council's staff office, assisting its work.
- id: zh-008
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Das Ständemehr verlangt, dass bei einer Vorlage die Mehrzahl der Kantone zustimmt.
  fact_en: The Ständemehr requires approval by most of the cantons.
- id: zh-009
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Auslandschweizer können von ihrem Wohnort im Ausland aus auf Bundesebene wählen und abstimmen,
    ohne anzureisen.
  fact_en: Swiss citizens abroad can vote and elect at federal level from where they live, without travelling
    to Switzerland.
- id: zh-010
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das Stimm- und Wahlrecht auf Bundesebene setzt das Schweizer Bürgerrecht voraus.
  fact_en: Voting and election rights at federal level require Swiss citizenship.
- id: zh-011
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Eine Partei vereint Personen, die ähnliche politische Ziele verfolgen.
  fact_en: A party is a group of people who pursue similar political goals.
- id: zh-012
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Die Geldpolitik liegt in der Zuständigkeit des Bundes, nicht der Kantone oder Gemeinden.
  fact_en: Monetary policy is handled by the Confederation, not by cantons or communes.
- id: zh-013
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Das Zollwesen wird vom Bund besorgt, nicht von Kantonen oder Gemeinden.
  fact_en: Customs is handled by the Confederation, not by cantons or communes.
- id: zh-014
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Zu den Grundrechten gehört die Freiheit, eine eigene Meinung zu äussern und sich zu informieren.
  fact_en: Freedom to express one's opinion and to obtain information is a fundamental right.
- id: zh-015
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Freiheit des Glaubens und des Gewissens ist in der Schweiz als Grundrecht geschützt.
  fact_en: Freedom of belief and conscience is protected as a fundamental right in Switzerland.
- id: zh-016
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Wer in der Schweiz wohnt, ist verpflichtet, Steuern zu entrichten.
  fact_en: Residents of Switzerland are obliged to pay taxes.
- id: zh-017
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Wer sich niederlässt, muss sich bei der Wohngemeinde registrieren.
  fact_en: Residents must register with the commune where they live.
- id: zh-018
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Alle Einwohnerinnen und Einwohner müssen eine Krankenversicherung abschliessen.
  fact_en: Health insurance is compulsory for all residents.
- id: zh-019
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Rechtsgleichheit heisst, dass das Gesetz für sämtliche Personen gleichermassen gilt.
  fact_en: Equality before the law means the law applies equally to everyone.
- id: zh-020
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Das Parlament besteht aus den zwei Kammern Nationalrat und Ständerat.
  fact_en: 'Parliament consists of two chambers: the Nationalrat and the Ständerat.'
- id: zh-021
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Die Schweiz ist ein demokratischer Staat.
  fact_en: Switzerland is a democratic state.
- id: zh-022
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: In einer Demokratie bestimmt die Bevölkerung durch Wahlen ihr Parlament.
  fact_en: In a democracy, the population elects its parliament.
- id: zh-023
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Regelmässige Wahlen ermöglichen es der Bevölkerung, ihre Vertreterinnen und Vertreter selbst
    zu bestimmen.
  fact_en: Regular elections let the people choose their own representatives.
- id: zh-024
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Die Verfassung der Schweiz trägt den Namen Bundesverfassung.
  fact_en: The Swiss constitution is called the Bundesverfassung (Federal Constitution).
- id: zh-025
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Der Bundesrat ist die Regierung der Schweiz.
  fact_en: The Federal Council is the government of Switzerland.
- id: zh-026
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Bundesgesetze werden von den beiden Kammern des Parlaments verabschiedet, und die Stimmberechtigten
    können per Referendum eine Volksabstimmung darüber verlangen.
  fact_en: Federal laws are passed by the two chambers of Parliament, and the electorate can demand a
    popular vote on them through a referendum.
- id: zh-027
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das Stimm- und Wahlrecht im Bund haben Schweizer Staatsangehörige, die das 18. Altersjahr erreicht
    haben.
  fact_en: At federal level, Swiss citizens who have reached the age of 18 hold the right to vote and
    elect.
- id: zh-028
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das Stimm- und Wahlrecht auf eidgenössischer Ebene beginnt mit dem 18. Geburtstag.
  fact_en: The right to vote and to elect at federal level begins on a Swiss citizen's 18th birthday.
- id: zh-029
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das aktive Wahlrecht ist das Recht, bei Wahlen und Abstimmungen seine Stimme abzugeben.
  fact_en: Active suffrage is the right to cast one's ballot in elections and votes.
- id: zh-030
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Wählbar in ein Bundesamt ist, wer die Schweizer Staatsangehörigkeit besitzt und mündig ist.
  fact_en: Anyone who holds Swiss citizenship and is of legal age can be elected to federal office.
- id: zh-031
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Die Stimmberechtigten beeinflussen die Gesetzgebung, indem sie an Volksabstimmungen über Initiativen
    und Referenden teilnehmen.
  fact_en: Citizens influence legislation by taking part in popular votes on initiatives and referendums.
- id: zh-032
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Ein Referendum richtet sich gegen Gesetze, die das Parlament, also National- und Ständerat,
    verabschiedet hat.
  fact_en: A referendum targets laws that Parliament, meaning both chambers, has adopted.
- id: zh-033
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Mit einer Volksinitiative können Stimmberechtigte eigene Forderungen auf die politische Agenda
    bringen und durchsetzen.
  fact_en: Through a popular initiative, voters can put their own demands on the political agenda and
    get them enacted.
- id: zh-034
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das Bundesparlament wird vom Volk im Vierjahresrhythmus neu gewählt.
  fact_en: The people elect the federal parliament anew every four years.
- id: zh-035
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Die Mitglieder des Bundesparlaments werden direkt von den wahlberechtigten Bürgerinnen und
    Bürgern bestimmt.
  fact_en: The members of the federal parliament are chosen directly by the citizens entitled to vote.
- id: zh-036
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Auf Bundesebene entscheiden die Stimmberechtigten an der Urne über Volksinitiativen und Referenden.
  fact_en: At federal level, eligible voters decide on popular initiatives and referendums.
- id: zh-037
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Das Bundesparlament hat vor allem die Aufgabe, Gesetze zu diskutieren und zu verabschieden.
  fact_en: The main task of the federal parliament is to debate and adopt laws.
- id: zh-038
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Die Vereinigte Bundesversammlung entsteht, wenn die Mitglieder beider Parlamentskammern gemeinsam
    tagen.
  fact_en: The United Federal Assembly is formed when the members of both parliamentary chambers meet
    together.
- id: zh-039
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Im Bundeshaus in Bern tagt das Schweizer Parlament.
  fact_en: The Swiss Parliament meets in the Federal Palace in Bern.
- id: zh-040
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Die Regierung der Schweiz auf Bundesebene trägt die Bezeichnung Bundesrat.
  fact_en: The Swiss government at federal level is called the Federal Council.
- id: zh-041
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Die sieben Bundesratsmitglieder werden von den beiden Parlamentskammern gemeinsam gewählt.
  fact_en: The seven Federal Councillors are elected jointly by the two chambers of Parliament.
- id: zh-042
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Parteien vertreten die unterschiedlichen Interessen der Bevölkerung.
  fact_en: Political parties represent the differing interests of the population.
- id: zh-043
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Eine eidgenössische Volksinitiative kommt zustande, wenn 100'000 gültige Unterschriften gesammelt
    werden.
  fact_en: A federal popular initiative requires 100,000 valid signatures.
- id: zh-044
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Der Ständerat ist die Parlamentskammer, die hauptsächlich die Anliegen der Kantone wahrnimmt.
  fact_en: The Council of States is the parliamentary chamber that chiefly represents the concerns of
    the cantons.
- id: zh-045
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Die beiden Parlamentskammern bestellen gemeinsam, in der Vereinigten Bundesversammlung, die
    Mitglieder von Bundesrat und Bundesgericht.
  fact_en: The two chambers jointly elect the members of the Federal Council and of the Federal Supreme
    Court.
- id: zh-046
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Üblicherweise finden pro Jahr vier eidgenössische Abstimmungstermine statt.
  fact_en: Federal voting days usually take place four times a year.
- id: zh-047
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Die meisten neuen Bundesgesetze werden von den beiden Kammern des Parlaments beschlossen.
  fact_en: Most new federal laws are decided by the two chambers of Parliament.
- id: zh-048
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Eine Volksinitiative gilt nur dann als angenommen, wenn sowohl die Mehrheit des Volks als auch
    die Mehrheit der Kantone zustimmt.
  fact_en: A popular initiative is accepted only if both a majority of the people and a majority of the
    cantons approve.
- id: zh-049
  topic: bund.demokratie.volksrechte
  section: Demokratie und Föderalismus
  fact_de: Mit einer Volksinitiative lässt sich der Text der Bundesverfassung ändern.
  fact_en: A popular initiative can be used to amend the text of the Federal Constitution.
- id: zh-050
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Die Mehrheit der Stimmberechtigten gibt ihre Stimme auf dem Postweg ab.
  fact_en: Most eligible voters cast their ballots by post.
- id: zh-051
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Urnengänge auf Bundesebene werden in der Schweiz stets an einem Sonntag abgehalten.
  fact_en: Federal elections and votes in Switzerland are always held on a Sunday.
- id: zh-052
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Der Bund trägt Verantwortung dafür, die Bevölkerung sozial abzusichern.
  fact_en: The Confederation is responsible for providing the population with social security.
- id: zh-053
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Zu den zentralen Aufgaben des Bundes gehört der Schutz des Landes nach innen und nach aussen.
  fact_en: One of the Confederation's central tasks is protecting the country both internally and externally.
- id: zh-054
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Der Bund ist dafür zuständig, die Umwelt zu schützen.
  fact_en: The Confederation is responsible for protecting the environment.
- id: zh-055
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Die Schweiz setzt sich aus Kantonen als Gliedstaaten zusammen.
  fact_en: Switzerland is composed of cantons as its constituent states.
- id: zh-056
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Insgesamt zählt die Schweiz 26 Kantone, von denen sechs Halbkantone sind.
  fact_en: Switzerland has 26 cantons in total, six of which are half-cantons.
- id: zh-057
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Ende 2021 existierten rund 2200 politische Gemeinden im Land.
  fact_en: In 2021 there were roughly 2,200 political communes in the country.
- id: zh-058
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Auf der untersten Stufe des dreistufigen Staatsaufbaus steht die Gemeinde.
  fact_en: The commune occupies the lowest rung of the three-tier state structure.
- id: zh-059
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Im dreistufigen Staatsaufbau steht der Bund an der Spitze.
  fact_en: In the three-tier state structure, the Confederation sits at the top.
- id: zh-060
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Die Beziehungen zum Ausland zu gestalten ist Sache des Bundes.
  fact_en: Shaping relations with other countries (foreign policy) is a matter for the Confederation.
- id: zh-061
  topic: bund.demokratie.foederalismus
  section: Demokratie und Föderalismus
  fact_de: Die Armee fällt in die Zuständigkeit des Bundes.
  fact_en: The armed forces fall under the responsibility of the Confederation.
- id: zh-062
  topic: bund.geografie.sprachen
  section: Demokratie und Föderalismus
  fact_de: 'Die Schweiz hat vier Landessprachen: Deutsch, Französisch, Italienisch und Rätoromanisch.'
  fact_en: 'Switzerland has four national languages: German, French, Italian and Romansh.'
- id: zh-063
  topic: bund.geografie.sprachen
  section: Demokratie und Föderalismus
  fact_de: Französisch hat im Land den Status einer Landessprache.
  fact_en: French holds the status of a national language in Switzerland.
- id: zh-064
  topic: bund.geografie.sprachen
  section: Demokratie und Föderalismus
  fact_de: Die Schweiz kennt vier Landessprachen.
  fact_en: Switzerland recognises four national languages.
- id: zh-065
  topic: bund.geografie.sprachen
  section: Demokratie und Föderalismus
  fact_de: Neben Deutsch, Französisch und Italienisch zählt Rätoromanisch zu den Landessprachen.
  fact_en: Besides German, French and Italian, Romansh is a national language.
- id: zh-066
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Nur der Staat, etwa durch Polizei und Armee, darf physische Gewalt anwenden.
  fact_en: Only the state, for example through police and army, may use physical force.
- id: zh-067
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Die rechtsprechende Gewalt des Bundes liegt beim Bundesgericht.
  fact_en: Judicial power at the federal level rests with the Federal Supreme Court.
- id: zh-068
  topic: bund.demokratie.parlament
  section: Demokratie und Föderalismus
  fact_de: Gesetze auf Bundesebene werden vom Parlament aus National- und Ständerat erlassen.
  fact_en: Federal legislative power lies with the parliament made up of the National Council and the
    Council of States.
- id: zh-069
  topic: bund.demokratie.bundesrat
  section: Demokratie und Föderalismus
  fact_de: Die Regierungsgewalt des Bundes liegt beim Bundesrat.
  fact_en: Executive power at the federal level lies with the Federal Council.
- id: zh-070
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Die Medien gelten oft als vierte Staatsgewalt.
  fact_en: The media are often regarded as the fourth power of the state.
- id: zh-071
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Richterinnen und Richter sprechen in Gerichtsverfahren Urteile aus.
  fact_en: Judges deliver verdicts in court proceedings.
- id: zh-072
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Es gehört zum Auftrag der Polizei, Gesetzesverstösse zu verfolgen.
  fact_en: It is part of the police's mandate to pursue violations of the law.
- id: zh-073
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Die Befugnis, Straftäter festzunehmen, liegt bei der Polizei.
  fact_en: The authority to arrest offenders lies with the police.
- id: zh-074
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: Gewaltenteilung heisst, dass sich Exekutive, Legislative und Judikative die staatliche Macht
    aufteilen.
  fact_en: Separation of powers means that the executive, legislative and judicial branches share state
    power among themselves.
- id: zh-075
  topic: bund.demokratie.staatsprinzipien
  section: Demokratie und Föderalismus
  fact_de: In einem Rechtsstaat ist auch die Staatsgewalt selbst an das geltende Recht gebunden.
  fact_en: In a state governed by the rule of law, the state itself is also bound by the law.
- id: zh-076
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Bundesverfassung schützt die Freiheit, einen Glauben und eine Überzeugung zu haben und
    danach zu leben.
  fact_en: The Federal Constitution protects the freedom to hold a faith and a personal conviction and
    to live accordingly.
- id: zh-077
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Freiheit, die eigene Ansicht frei zu äussern und zu verbreiten, gehört zu den von der Bundesverfassung
    gesicherten Grundrechten.
  fact_en: The freedom to express and spread one's views freely is among the fundamental rights secured
    by the Federal Constitution.
- id: zh-078
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Glaubens- und Gewissensfreiheit sichert jeder Person das Recht, ihre Religion frei zu wählen,
    auszuüben oder keiner anzugehören.
  fact_en: Freedom of belief and conscience secures everyone's right to choose and practise a religion
    or to follow none.
- id: zh-079
  topic: bund.geschichte.gesellschaftswandel
  section: Demokratie und Föderalismus
  fact_de: Gleichberechtigung von Frau und Mann bedeutet, dass beide Geschlechter im Grundsatz dieselben
    Rechte besitzen.
  fact_en: Equal rights for women and men means that both sexes in principle hold the same rights.
- id: zh-080
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Wer öffentlich unwahre Tatsachen über andere Personen verbreitet, handelt in der Schweiz rechtswidrig.
  fact_en: Publicly spreading untrue claims about other people is unlawful in Switzerland.
- id: zh-081
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Wird jemand wegen Hautfarbe oder Geschlecht bei der Stellenvergabe abgelehnt, verletzt dies
    das Gebot der Rechtsgleichheit und das Diskriminierungsverbot.
  fact_en: Rejecting a job applicant because of skin colour or sex violates the principle of legal equality
    and the ban on discrimination.
- id: zh-082
  topic: bund.demokratie.wahlen
  section: Demokratie und Föderalismus
  fact_de: Das Stimm- und Wahlrecht auf Bundesebene erhält man erst mit dem Schweizer Bürgerrecht.
  fact_en: The right to vote and elect at federal level is obtained only with Swiss citizenship.
- id: zh-083
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Datenschutz wird verletzt, wenn Privates über eine Person ohne gesetzliche Grundlage oder ohne
    ihr Einverständnis bekannt gemacht wird.
  fact_en: Data protection is violated when private information about a person is made public without
    legal basis or the person's consent.
- id: zh-084
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Bundesverfassung untersagt es, Menschen zu foltern.
  fact_en: The Federal Constitution prohibits torturing anyone.
- id: zh-085
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Bundesverfassung garantiert den Schutz des privaten Eigentums.
  fact_en: The Federal Constitution guarantees the protection of private property.
- id: zh-086
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Öffentliche Beschimpfungen von Menschen aufgrund ihrer Abstammung oder ihres Glaubens sind
    in der Schweiz untersagt.
  fact_en: Publicly insulting people because of their origin or faith is prohibited in Switzerland.
- id: zh-087
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Die Pflicht zum Militär- oder Zivilschutzdienst trifft in der Schweiz Männer mit Schweizer
    Bürgerrecht.
  fact_en: The duty to serve in the military or civil protection applies in Switzerland to men holding
    Swiss citizenship.
- id: zh-088
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Der Zutritt zu einem Schwimmbad darf nicht wegen der Hautfarbe verweigert werden, da dies das
    Diskriminierungsverbot verletzt.
  fact_en: Denying entry to a swimming pool because of skin colour breaches the ban on discrimination.
- id: zh-089
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Nur Männer sind verpflichtet, bis zu einem gewissen Alter Militärdienst oder Zivilschutz zu
    leisten.
  fact_en: Only men are obliged to perform military or civil protection service up to a certain age.
- id: zh-090
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: In einem Rechtsstaat darf der Staat niemanden ohne Grund festnehmen und inhaftieren.
  fact_en: In a state governed by the rule of law, the state may not arrest and imprison anyone without
    cause.
- id: zh-091
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Wer in der Schweiz ein Gesetz bricht, wird dafür vom Staat bestraft; Selbstjustiz ist nicht
    erlaubt.
  fact_en: In Switzerland, whoever breaks the law is punished by the state; taking revenge personally
    is not allowed.
- id: zh-092
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Die Bundesverfassung schliesst die Hinrichtung von Verurteilten als Sanktion aus.
  fact_en: The Federal Constitution rules out executing convicted offenders as a sanction.
- id: zh-093
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Das Obligationenrecht enthält die Vorschriften zur Miete von Wohnraum.
  fact_en: The Code of Obligations contains the rules on renting housing.
- id: zh-094
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Das Zivilgesetzbuch bestimmt unter anderem, wie eine Ehe geschlossen und wieder geschieden
    wird.
  fact_en: The Civil Code governs, among other things, how a marriage is entered into and dissolved.
- id: zh-095
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Ob eine Person eine Haftstrafe verbüssen muss, bestimmt sich nach dem Strafgesetzbuch.
  fact_en: Whether a person must serve a prison sentence is determined by the Criminal Code.
- id: zh-096
  topic: bund.demokratie.gerichte
  section: Demokratie und Föderalismus
  fact_de: Die Bundesversammlung wählt die Richterinnen und Richter des Bundesgerichts.
  fact_en: The Federal Assembly elects the judges of the Federal Supreme Court.
- id: zh-097
  topic: bund.demokratie.grundrechte
  section: Demokratie und Föderalismus
  fact_de: Schweizer Staatsangehörige werden grundsätzlich nicht ausgeliefert, ausser an internationale
    Gerichte für Verfahren dort.
  fact_en: Swiss nationals are in principle not extradited, except to international courts for proceedings
    there.
- id: zh-098
  topic: bund.sozial.pflichten
  section: Demokratie und Föderalismus
  fact_de: Wie viel Steuern eine Person zahlt, richtet sich nach ihrem steuerpflichtigen Einkommen und
    Vermögen.
  fact_en: The amount of tax a person pays depends on their taxable income and assets.
- id: zh-099
  topic: kanton.demokratie.regierungsrat
