  topic: kanton.demokratie.regierungsrat
  section: Demokratie und Föderalismus
  fact_de: Die Baudirektion ist eine der Direktionen der Zürcher Kantonsverwaltung.
  fact_en: The Baudirektion (building department) is one of the directorates of the Zurich cantonal administration.
- id: zh-101
  topic: kanton.demokratie.regierungsrat
  section: Demokratie und Föderalismus
  fact_de: Die städtische Regierung Zürichs trägt die Bezeichnung Stadtrat.
  fact_en: The governing executive body of the city of Zurich is called the Stadtrat.
- id: zh-102
  topic: kanton.sozial.bildung_gesundheit
  section: Demokratie und Föderalismus
  fact_de: Der Kanton Zürich ist für den Betrieb und die Trägerschaft der Universität zuständig.
  fact_en: The canton of Zurich is responsible for running and operating the university.
- id: zh-103
  topic: kanton.geografie.zuerich
  section: Demokratie und Föderalismus
  fact_de: Der Kanton Zürich ist in zwölf Bezirke gegliedert.
  fact_en: The canton of Zurich is divided into twelve districts.
- id: zh-104
  topic: kanton.demokratie.abstimmungen_wahlen
  section: Demokratie und Föderalismus
  fact_de: Ausländerinnen und Ausländer ohne Stimmrecht können sich im Kanton Zürich mit Eingaben an die
    Behörden, also Petitionen, politisch äussern.
  fact_en: Foreigners without voting rights in Zurich can take part politically by submitting petitions
