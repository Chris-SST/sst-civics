topic: kanton.geografie.zuerich
question_de: Welcher See ist im Kanton Zürich nach dem Zürichsee der zweitgrösste?
options_de:
  a: Greifensee
  b: Pfäffikersee
  c: Türlersee
  d: Katzensee
correct: a
explanation_de: Der Greifensee liegt zwischen Uster und Dübendorf und ist nach dem Zürichsee der zweitgrösste
  See im Kanton. Der Pfäffikersee ist kleiner. Türlersee und Katzensee sind noch deutlich kleiner.
