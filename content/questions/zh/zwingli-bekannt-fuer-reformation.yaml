id: zwingli-bekannt-fuer-reformation
version: 1
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Wofür ist Ulrich Zwingli in der Geschichte Zürichs vor allem bekannt?
options_de:
  a: Er baute die erste Eisenbahn im Kanton.
  b: Er gründete die Universität Zürich.
  c: Er führte das Frauenstimmrecht ein.
  d: Er war der Anführer der Reformation in Zürich.
correct: d
explanation_de: Zwingli prägte die Zürcher Reformation und damit die Kirche und das Leben in der Stadt
  nachhaltig. Die Zürcher Kirche wurde zur reformierten Kirche. Die anderen Antworten haben mit ihm nichts
  zu tun.
