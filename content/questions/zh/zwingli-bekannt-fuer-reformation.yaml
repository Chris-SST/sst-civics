topic: kanton.geschichte.zuerich
question_de: Wofür ist Huldrych (Ulrich) Zwingli in der Geschichte Zürichs vor allem bekannt?
options_de:
  a: Er baute die erste Eisenbahn im Kanton.
  b: Er war der erste Bundespräsident der Schweiz.
  c: Er führte das Frauenstimmrecht ein.
  d: Er war der Anführer der Reformation in Zürich.
correct: d
explanation_de: Huldrych (Ulrich) Zwingli führte im 16. Jahrhundert die Reformation in Zürich an, und
  die Zürcher Kirche wurde reformiert. Die Eisenbahn, der Bundesstaat mit einem Bundespräsidenten und
  das Frauenstimmrecht kamen erst Jahrhunderte später.
