id: sechselaeutenplatz-kartoffelanbau-zweiter-weltkrieg
version: 2
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Welche dieser Pflanzen wurde im Zweiten Weltkrieg auf dem Sechseläutenplatz in Zürich angebaut?
options_de:
  a: Tabak
  b: Reben
  c: Baumwolle
  d: Kartoffeln
correct: d
explanation_de: Im Zweiten Weltkrieg gab es in der Schweiz zu wenig Lebensmittel. Darum wurden mit der
  «Anbauschlacht» auch Flächen mitten in den Städten bepflanzt, zum Beispiel der Sechseläutenplatz in
  Zürich mit Kartoffeln. Tabak, Reben und Baumwolle wurden dort nicht angebaut.
