id: sechselaeutenplatz-kartoffelanbau-zweiter-weltkrieg
version: 1
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Was wurde im Zweiten Weltkrieg auf dem Sechseläutenplatz in Zürich angebaut?
options_de:
  a: Weizen
  b: Reben
  c: Mais
  d: Kartoffeln
correct: d
explanation_de: Im Zweiten Weltkrieg war die Versorgung mit Lebensmitteln knapp. Darum wurde auch mitten
  in der Stadt Zürich Land bepflanzt, unter anderem der Sechseläutenplatz mit Kartoffeln. Diese Anbauaktion
  gehörte zur Anbauschlacht, mit der die Schweiz ihre Ernährung sichern wollte.
