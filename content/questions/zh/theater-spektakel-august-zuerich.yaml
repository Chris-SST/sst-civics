question_de: Welche Veranstaltung zeigt im August in Zürich Bühnenkunst, Tanz und Musik aus aller Welt?
options_de:
  a: Das Sechseläuten
  b: Weltklasse Zürich
  c: Das Knabenschiessen
  d: Das Zürcher Theater Spektakel
correct: d
explanation_de: Das Zürcher Theater Spektakel ist ein internationales Festival der darstellenden Künste.
  Es findet jeweils im August statt und zeigt Produktionen aus vielen Ländern.
