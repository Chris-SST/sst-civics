canton: zh
topic: kanton.geografie.zuerich
question_de: Auf dem Gebiet welcher Gemeinde liegt der grösste Teil des Flughafens Zürich?
options_de:
  a: Winterthur
  b: Kloten
  c: Uster
  d: Dübendorf
correct: b
explanation_de: Der Flughafen Zürich liegt auf dem Gebiet der Gemeinde Kloten im Zürcher Unterland. Deshalb
  sagen viele Leute auch «Flughafen Kloten». Dübendorf hat einen anderen Flugplatz, der früher militärisch
  genutzt wurde.
