id: flughafen-zuerich-standort-gemeinde
version: 2
scope: zh
canton: zh
topic: kanton.geografie.zuerich
question_de: Auf dem Gebiet welcher dieser Gemeinden liegt der Flughafen Zürich?
options_de:
  a: Winterthur
  b: Kloten
  c: Uster
  d: Dübendorf
correct: b
explanation_de: Der Flughafen Zürich liegt grösstenteils auf dem Gebiet der Stadt Kloten im Zürcher Unterland.
  Deshalb sagen viele auch «Flughafen Kloten». In Dübendorf gibt es einen anderen Flugplatz.
