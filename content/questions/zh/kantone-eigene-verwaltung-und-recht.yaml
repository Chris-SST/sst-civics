id: kantone-eigene-verwaltung-und-recht
version: 2
scope: zh
canton: zh
topic: kanton.demokratie.verfassung
question_de: Was gehört zu den Aufgaben der Kantone?
options_de:
  a: Sie bestimmen die Aussenpolitik und die Währung der Schweiz.
  b: Sie erlassen die Gesetze für das ganze Land.
  c: Sie führen die Armee und bestimmen die Zölle.
  d: Sie führen ihre eigene Verwaltung und erlassen kantonales Recht.
correct: d
explanation_de: Jeder Kanton hat eine eigene Regierung, ein eigenes Parlament und eine eigene Verwaltung.
  Er macht eigene Gesetze, die nur im Kanton gelten, zum Beispiel für Schulen oder die Polizei. Aussenpolitik,
  Währung, Armee, Zölle und die Gesetze für die ganze Schweiz sind Sache des Bundes.
