id: kantone-eigene-verwaltung-und-recht
version: 1
scope: zh
canton: zh
topic: kanton.demokratie.verfassung
question_de: Welche Aufgabe haben die Kantone in der Schweiz hauptsächlich?
options_de:
  a: Sie bestimmen die Aussenpolitik und die Währung der Schweiz.
  b: Sie erlassen das Recht für das ganze Land und überwachen die Gemeinden nicht.
  c: Sie schliessen Verträge mit anderen Staaten ab und führen die Armee.
  d: Sie führen ihre eigene Verwaltung und erlassen kantonales Recht.
correct: d
explanation_de: Die Schweiz ist ein Bundesstaat. Die Kantone sind selbstständig, soweit ihre Souveränität
  nicht durch die Bundesverfassung beschränkt ist. Sie organisieren ihre Verwaltung und erlassen eigenes
  kantonales Recht, zum Beispiel ihre Kantonsverfassung und Gesetze.
