id: gemeinden-finanzieren-sozialhilfe
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer finanziert im Kanton Zürich die Sozialhilfe für Menschen in einer Notlage?
options_de:
  a: Die Kirchen allein
  b: Die Schweizerische Nationalbank
  c: Die Arbeitgeberverbände
  d: Die Gemeinden
correct: d
explanation_de: Im Kanton Zürich sind die Gemeinden für die Sozialhilfe zuständig und tragen deren Kosten.
  Das kann kleinere Gemeinden stark belasten. Darum gibt es den Finanzausgleich.
