question_de: Wie viele Mitglieder hat die Zürcher Kantonsregierung?
options_de:
  a: Fünf Mitglieder
  b: Neun Mitglieder
  c: Elf Mitglieder
  d: Sieben Mitglieder
correct: d
explanation_de: Die Kantonsregierung des Kantons Zürich besteht aus sieben Mitgliedern. Jedes Mitglied
  leitet in der Regel eine Direktion der Verwaltung.
