topic: kanton.sozial.bildung_gesundheit
question_de: Womit beginnt im Kanton Zürich die Schulpflicht eines Kindes?
options_de:
  a: Mit dem Eintritt in die Sekundarschule
  b: Mit dem Eintritt in die Primarschule
  c: Mit dem Eintritt in die Spielgruppe
  d: Mit dem Eintritt in den Kindergarten
correct: d
explanation_de: Im Kanton Zürich gehört der Kindergarten zur obligatorischen Volksschule. Die Schulpflicht
  beginnt deshalb schon mit dem Eintritt in den Kindergarten. Die Spielgruppe ist freiwillig.
