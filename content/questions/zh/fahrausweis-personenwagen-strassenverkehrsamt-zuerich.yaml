topic: kanton.sozial.steuern_leistungen
question_de: Welche Stelle erteilt im Kanton Zürich den Fahrausweis für Personenwagen?
options_de:
  a: Das Bezirksgericht
  b: Das Strassenverkehrsamt des Kantons
  c: Die Stadtpolizei der Wohngemeinde
  d: Das Bundesamt für Strassen
correct: b
explanation_de: Im Kanton Zürich ist das Strassenverkehrsamt für die Fahrausweise zuständig. Es gehört
  zur Sicherheitsdirektion. Die Gemeinden und der Bund stellen keine Fahrausweise aus.
