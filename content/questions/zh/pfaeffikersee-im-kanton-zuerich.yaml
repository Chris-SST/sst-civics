id: pfaeffikersee-im-kanton-zuerich
version: 1
scope: zh
canton: zh
topic: kanton.geografie.zuerich
question_de: In welchem Kanton liegt der Pfäffikersee?
options_de:
  a: Kanton Thurgau
  b: Kanton St. Gallen
  c: Kanton Zürich
  d: Kanton Zug
correct: c
explanation_de: Der Pfäffikersee liegt im Zürcher Oberland und gehört zum Kantonsgebiet von Zürich. Er
  ist einer der grösseren Seen im Kanton. Die anderen genannten Kantone grenzen teils an Zürich, enthalten
  den See aber nicht.
