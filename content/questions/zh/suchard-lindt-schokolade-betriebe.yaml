explanation_de: Philippe Suchard und Rudolph Lindt errichteten Betriebe zur Herstellung von Schokolade.
  Die Schokolade wurde so zu einem bekannten Schweizer Produkt. Die Industrie spielte auch in der Zürcher
  Wirtschaftsgeschichte eine wichtige Rolle.
