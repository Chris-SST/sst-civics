question_de: Wie lautete der römische Name von Zürich?
options_de:
  a: Turicum
  b: Augusta Raurica
  c: Vindonissa
  d: Aventicum
correct: a
explanation_de: 'Die Römer nannten ihre Siedlung und Zollstation an der Limmat Turicum. Daraus entwickelte
  sich später der Name Zürich. Die anderen Namen gehören zu römischen Orten in der heutigen Schweiz: Windisch,
  Augst und Avenches.'
