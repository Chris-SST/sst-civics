id: sechselaeuten-boeoegg-kopf-sommer
version: 1
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Was besagt der Volksglaube über den Sommer, wenn der Kopf des Bööggs am Sechseläuten rasch
  verbrennt?
options_de:
  a: Der folgende Sommer wird verregnet.
  b: Der folgende Winter wird kalt.
  c: Der folgende Herbst wird früh beginnen.
  d: Der folgende Sommer wird schön.
correct: d
explanation_de: 'Nach dem Volksglauben gilt: Je schneller der Kopf des Bööggs explodiert oder verbrennt,
  desto schöner wird der Sommer. Der Böögg ist eine Schneemann-Figur, die am Sechseläuten verbrannt wird.'
