topic: kanton.kultur.zuerich
question_de: Was bedeutet es laut Volksglauben, wenn am Sechseläuten der Kopf des Bööggs schnell verbrennt?
options_de:
  a: Der kommende Sommer wird verregnet.
  b: Der kommende Winter wird besonders kalt.
  c: Der kommende Sommer wird schön.
  d: Die Ernte im Herbst wird schlecht.
correct: c
explanation_de: 'Der Böögg ist eine Schneemann-Figur, die am Sechseläuten in Zürich verbrannt wird. Der
  Volksglaube sagt: Je schneller sein Kopf verbrennt oder explodiert, desto schöner wird der kommende
  Sommer.'
