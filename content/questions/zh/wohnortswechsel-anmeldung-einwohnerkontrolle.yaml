    reasoning: Wer innerhalb des Kantons Zürich umzieht, muss sich bei der Einwohnerkontrolle (Einwohneramt)
      der neuen Wohngemeinde anmelden, nicht bei Gericht, Bundesamt oder Kantonspolizei.
  source:
    verdict: supported
    note: Quelle 1 sagt, dass die Gemeinden die Einwohnerregister führen und dass sich Einwohnerinnen
      und Einwohner bei einem Umzug persönlich am Schalter der zuständigen Einwohnerdienste oder über
      eUmzugCH an- und abmelden. Das stützt Antwort d) und die Erklärung. Der Begriff «Einwohnerkontrolle»
      steht im Text nur im Zusammenhang mit der zugewiesenen Gemeinde, aber die Aussage ist eindeutig
      genug.
