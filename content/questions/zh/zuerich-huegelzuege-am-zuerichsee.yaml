topic: kanton.geografie.zuerich
question_de: Welche Hügelzüge liegen am Ufer des Zürichsees?
options_de:
  a: Uetliberg, Albis und Pfannenstiel
  b: Lägern, Irchel und Kohlfirst
  c: Hörnli, Bachtel und Allmann
  d: Heitersberg, Gubrist und Randen
correct: a
explanation_de: Der Uetliberg und der Albis ziehen sich dem linken Ufer des Zürichsees entlang, der Pfannenstiel
  liegt am rechten Ufer. Die anderen Erhebungen liegen weiter weg vom See, zum Beispiel im Unterland,
  im Weinland, im Zürcher Oberland oder in anderen Kantonen.
