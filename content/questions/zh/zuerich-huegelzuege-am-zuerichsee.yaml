topic: kanton.geografie.zuerich
question_de: Welche Hügelzüge säumen den Zürichsee?
options_de:
  a: Uetliberg, Albis und Pfannenstiel
  b: Lägern, Irchel und Höhronen
  c: Hörnli, Bachtel und Allmann
  d: Heitersberg, Üetliberg und Randen
correct: a
explanation_de: Der Uetliberg und der Albis liegen am linken Seeufer, der Pfannenstiel am rechten Seeufer.
  Lägern, Irchel, Bachtel und Hörnli sind andere Erhebungen im Kanton oder in der Region.
