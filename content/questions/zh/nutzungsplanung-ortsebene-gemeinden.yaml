id: nutzungsplanung-ortsebene-gemeinden
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer plant im Kanton Zürich auf Ortsebene, wie der Boden genutzt wird, zum Beispiel wo Wohnzonen
  und Gewerbezonen liegen?
options_de:
  a: Die Schweizerische Bundesversammlung
  b: Die Kantonspolizei
  c: Die Gemeinden
  d: Die Bezirksräte allein
correct: c
explanation_de: Die Gemeinden erlassen die Nutzungsplanung für ihr Gebiet, etwa die Bau- und Zonenordnung.
  Dabei beachten sie die Vorgaben von Bund und Kanton. So bestimmen sie mit, wie sich der Ort entwickelt.
