topic: kanton.geschichte.zuerich
question_de: Welche Katastrophe kostete im frühen 17. Jahrhundert fast die Hälfte der Zürcher Bevölkerung
  das Leben?
options_de:
  a: Ein Stadtbrand
  b: Eine Pestepidemie
  c: Eine Überschwemmung
  d: Eine Hungersnot
correct: b
explanation_de: Im frühen 17. Jahrhundert starb fast die Hälfte der Zürcher Einwohnerschaft an der Pest.
  Die Pest war eine ansteckende Krankheit, die sich damals in Europa mehrfach ausbreitete.
