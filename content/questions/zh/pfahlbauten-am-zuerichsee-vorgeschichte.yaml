id: pfahlbauten-am-zuerichsee-vorgeschichte
version: 1
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Wie waren die vorgeschichtlichen Siedlungen am Zürichsee gebaut?
options_de:
  a: Als Höhlen im Fels
  b: Als Pfahlbauten, also Häuser auf Pfählen
  c: Als Häuser aus Backstein in Dörfern
  d: Als Burgen auf Felsen
correct: b
explanation_de: Am Ufer des Zürichsees standen in vorgeschichtlicher Zeit Pfahlbauten, das heisst Häuser
  auf Pfählen. Reste davon liegen noch heute unter Wasser und werden von Unterwasserarchäologen untersucht.
