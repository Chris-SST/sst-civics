version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Welche der folgenden Aufgaben erfüllt in Zürcher Gemeinden das Einwohneramt?
options_de:
  a: Es stellt Strafurteile aus.
  b: Es führt das Einwohnerregister der Gemeinde.
  c: Es erteilt Baubewilligungen für Kantonsstrassen.
  d: Es legt die Steuergesetze fest.
correct: b
explanation_de: Die Gemeinde führt das Register der Personen, die bei ihr wohnen. Dort melden Sie sich
  an, ab oder um, wenn Sie umziehen. Strafurteile, Steuergesetze und Kantonsstrassen gehören nicht zu
  dieser Aufgabe.
