topic: kanton.demokratie.regierungsrat
question_de: Welche Aussage zur Zusammensetzung des Zürcher Regierungsrats stimmt?
options_de:
  a: Er setzt sich aus drei Personen zusammen.
  b: Er setzt sich aus sieben Personen zusammen.
  c: Er setzt sich aus neun Personen zusammen.
  d: Er setzt sich aus fünf Personen zusammen.
correct: b
explanation_de: Der Zürcher Regierungsrat ist ein Gremium aus sieben Personen. Sie leiten gemeinsam den
  Kanton und führen je eine Direktion.
