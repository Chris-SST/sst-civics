id: stimmenauszaehlung-urnengang-wahlbuero
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer zählt bei Urnengängen in einer Zürcher Gemeinde die abgegebenen Stimmen aus?
options_de:
  a: Die Sozialbehörde
  b: Das Wahlbüro
  c: Die Gemeindeschreiberin allein
  d: Die Staatsanwaltschaft
correct: b
explanation_de: Das Wahlbüro ermittelt bei Abstimmungen und Wahlen die Ergebnisse der Gemeinde. Es besteht
  aus mehreren Personen, damit die Auszählung korrekt und nachvollziehbar abläuft.
