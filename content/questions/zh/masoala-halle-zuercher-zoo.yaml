question_de: Zu welcher Einrichtung in Zürich gehört die Masoala-Halle mit dem Regenwald aus Madagaskar?
options_de:
  a: Zum Zürcher Zoo
  b: Zum Botanischen Garten der Universität
  c: Zum Naturhistorischen Museum
  d: Zum Technorama
correct: a
explanation_de: Die Masoala-Halle ist ein Teil des Zürcher Zoos. Sie zeigt einen Regenwald, wie er in
  Madagaskar wächst. Dort leben auch Tiere dieses Regenwaldes.
