topic: kanton.geografie.zuerich
question_de: Welche Stadt ist der Hauptort des Kantons Zürich?
options_de:
  a: Uster
  b: Die Stadt Zürich
  c: Winterthur
  d: Dübendorf
correct: b
explanation_de: Die Stadt Zürich ist der Hauptort des Kantons und trägt denselben Namen. Dort sind unter
  anderem der Kantonsrat und der Regierungsrat angesiedelt. Winterthur ist die zweitgrösste Stadt des
  Kantons.
