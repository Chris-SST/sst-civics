question_de: In welcher Institution im Kanton Zürich können Besucherinnen und Besucher naturwissenschaftliche
  und technische Phänomene selbst anfassen und ausprobieren?
options_de:
  a: Im Opernhaus Zürich
  b: Im Technorama in Winterthur
  c: Im Landesmuseum Zürich
  d: Im Kunsthaus Zürich
correct: b
explanation_de: Das Technorama in Winterthur ist ein Science Center. Die Besuchenden experimentieren dort
  selbst an den Exponaten. Kunsthaus, Landesmuseum und Opernhaus zeigen Kunst, Geschichte und Aufführungen.
