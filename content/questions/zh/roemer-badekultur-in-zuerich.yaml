id: roemer-badekultur-in-zuerich
version: 1
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Welche Neuerung brachten die Römer nach Zürich?
options_de:
  a: Den Buchdruck
  b: Die Zünfte
  c: Die Badekultur
  d: Die Reformation
correct: c
explanation_de: Die Römer führten in Zürich die Badekultur ein, also öffentliche Bäder nach römischem
  Vorbild. Zünfte, Buchdruck und Reformation gehören erst ins Mittelalter und in die frühe Neuzeit.
