topic: kanton.geschichte.zuerich
question_de: Wer führte in den 1520er-Jahren die Reformation in Zürich an?
options_de:
  a: Heinrich Bullinger
  b: Ulrich Zwingli
  c: Martin Luther
  d: Johannes Calvin
correct: b
explanation_de: Ulrich Zwingli war Leutpriester am Grossmünster und führte in Zürich die Reformation ein.
  Der Rat der Stadt unterstützte ihn dabei. Calvin wirkte in Genf, Luther in Deutschland.
