topic: kanton.sozial.bildung_gesundheit
question_de: Wer ist im Kanton Zürich für den Betrieb und die Trägerschaft der Universität Zürich zuständig?
options_de:
  a: Der Bund
  b: Die Stadt Zürich
  c: Der Kanton Zürich
  d: Die Bezirksräte des Kantons
correct: c
explanation_de: Die Universität Zürich ist eine kantonale Hochschule. Der Kanton Zürich trägt sie und
  betreibt sie. Die Stadt Zürich und der Bund sind dafür nicht hauptverantwortlich.
