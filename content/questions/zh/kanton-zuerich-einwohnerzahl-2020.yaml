question_de: Wie viele Einwohnerinnen und Einwohner zählte der Kanton Zürich im Jahr 2020 ungefähr?
options_de:
  a: Etwa 1,1 Millionen
  b: Etwa 2,2 Millionen
  c: Etwa 0,8 Millionen
  d: Etwa 1,5 Millionen
correct: d
explanation_de: Im Jahr 2020 lebten im Kanton Zürich ungefähr 1,5 Millionen Menschen. Er ist damit der
  bevölkerungsreichste Kanton der Schweiz.
