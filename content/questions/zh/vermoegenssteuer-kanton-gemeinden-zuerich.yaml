topic: kanton.sozial.steuern_leistungen
question_de: Welche dieser Steuern erheben der Kanton Zürich und die Gemeinden auf dem Besitz einer Person,
  zum Beispiel auf Bankguthaben und Wertschriften?
options_de:
  a: Die Verrechnungssteuer
  b: Die Mehrwertsteuer
  c: Die Vermögenssteuer
  d: Die Mineralölsteuer
correct: c
explanation_de: Kanton und Gemeinden besteuern das Vermögen der natürlichen Personen. Die Mehrwertsteuer,
  die Verrechnungssteuer und die Mineralölsteuer sind Bundessteuern.
