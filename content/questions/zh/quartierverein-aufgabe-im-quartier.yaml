id: quartierverein-aufgabe-im-quartier
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Was ist eine typische Aufgabe eines Quartiervereins in einer Zürcher Gemeinde oder Stadt?
options_de:
  a: Er vertritt die Anliegen der Quartierbevölkerung gegenüber den Behörden und fördert das Zusammenleben.
  b: Er führt die Einwohnerkontrolle für das Quartier.
  c: Er erhebt Steuern bei den Bewohnerinnen und Bewohnern des Quartiers.
  d: Er bewilligt Baugesuche im Quartier.
correct: a
explanation_de: Ein Quartierverein ist ein freiwilliger Zusammenschluss von Einwohnerinnen und Einwohnern.
  Er bringt Anliegen des Quartiers bei den Behörden ein und organisiert Anlässe, die das Zusammenleben
  stärken. Hoheitliche Aufgaben wie Steuern, Baubewilligungen oder Einwohnerkontrolle gehören der Gemeinde.
