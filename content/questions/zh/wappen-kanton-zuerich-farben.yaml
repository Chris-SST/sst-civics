id: wappen-kanton-zuerich-farben
version: 1
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Wie sieht das Wappen des Kantons Zürich aus?
options_de:
  a: Schräg geteilt, oben links weiss und unten rechts blau
  b: Senkrecht geteilt, links weiss und rechts blau
  c: Waagrecht geteilt, oben blau und unten weiss
  d: Schräg geteilt, oben links blau und unten rechts weiss
correct: a
explanation_de: Das Zürcher Wappen ist schräg geteilt. Oben links ist es weiss, unten rechts blau. Die
  Farben Blau und Weiss findet man auch auf den Zürcher Fahnen.
