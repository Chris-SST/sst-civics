    reasoning: Das Zürcher Wappen ist schräg (von oben links nach unten rechts) geteilt, wobei das obere
      linke Feld (heraldisch rechts) blau und das untere rechte Feld weiss ist.
  source:
    verdict: supported
    note: Quelle 2 nennt das Zürcher Wappen «von Silber und Blau schräg geteilt». Silber steht heraldisch
      für Weiss, und die Reihenfolge Silber–Blau entspricht «oben links weiss, unten rechts blau» (Antwort
      a). Die Orientierung «oben links» steht nicht ausdrücklich im Text. Die Aussage zu den Farben auf
      den Fahnen stützt der Hinweis auf die Banner ab 1315 ebenfalls. Quelle 1 sagt dazu nichts.
