question_de: Für welche Werte steht die Street Parade in Zürich?
options_de:
  a: Heimat, Glaube, Familie, Gemeinschaft und Treue
  b: Tradition, Ordnung, Fleiss, Sparsamkeit und Pünktlichkeit
  c: Sport, Gesundheit, Leistung, Wettkampf und Fairness
  d: Liebe, Frieden, Freiheit, Grosszügigkeit und Toleranz
correct: d
explanation_de: Die Street Parade ist ein grosser Technoumzug in Zürich. Sie versteht sich als Demonstration
  für Liebe, Frieden, Freiheit, Grosszügigkeit und Toleranz.
