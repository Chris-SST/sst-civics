topic: gemeinde.leistungen
question_de: Wer entscheidet im Kanton Zürich in der Regel über das Baugesuch für ein neues Wohnhaus?
options_de:
  a: Der Regierungsrat
  b: Die Baubehörde der Gemeinde
  c: Das Bezirksgericht
  d: Das Bundesamt für Raumentwicklung
correct: b
explanation_de: Baugesuche für Wohnhäuser reicht man bei der Gemeinde ein. Die kommunale Baubehörde prüft
  das Gesuch und erteilt die Baubewilligung oder lehnt sie ab. Der Kanton ist nur in besonderen Fällen
  beteiligt.
