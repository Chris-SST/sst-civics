id: hundehaltung-abgabe-hundesteuer
version: 3
scope: zh
canton: zh
topic: kanton.sozial.steuern_leistungen
question_de: Was gilt im Kanton Zürich für Personen, die einen Hund halten?
options_de:
  a: Sie müssen jedes Jahr eine Hundeabgabe an die Gemeinde bezahlen.
  b: Sie müssen nur beim Kauf des Hundes einmal eine Gebühr an den Bund bezahlen.
  c: Sie müssen mit dem Hund jedes Jahr beim Kanton eine Prüfung machen.
  d: Sie müssen nur dann eine Abgabe bezahlen, wenn sie mit dem Hund Geld verdienen.
correct: a
explanation_de: Wer im Kanton Zürich einen Hund hält, bezahlt jedes Jahr eine Abgabe für den Hund, die
  sogenannte Hundesteuer. Das Geld geht an die Wohngemeinde, nicht an den Bund. Die Abgabe ist nicht einmalig
  und gilt auch für Hunde, die man nur privat hält.
