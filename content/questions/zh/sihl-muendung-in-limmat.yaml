id: sihl-muendung-in-limmat
version: 1
scope: zh
canton: zh
topic: kanton.geografie.zuerich
question_de: In welchen Fluss mündet die Sihl mitten in der Stadt Zürich?
options_de:
  a: In die Töss
  b: In die Limmat
  c: In die Glatt
  d: In die Aare
correct: b
explanation_de: Die Sihl fliesst durch Zürich und mündet beim Platzspitz in die Limmat. Glatt und Töss
  sind andere Zürcher Flüsse, die in den Rhein münden. Die Aare nimmt die Limmat erst weiter unten im
  Kanton Aargau auf.
