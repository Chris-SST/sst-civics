id: kantonsrat-amtsdauer-vier-jahre
version: 1
scope: zh
canton: zh
topic: kanton.demokratie.kantonsrat
question_de: Für wie viele Jahre werden die Mitglieder des Zürcher Kantonsrats gewählt?
options_de:
  a: Für zwei Jahre
  b: Für drei Jahre
  c: Für sechs Jahre
  d: Für vier Jahre
correct: d
explanation_de: Die Mitglieder des Zürcher Kantonsrats werden für eine Amtsdauer von vier Jahren gewählt.
  Danach finden Gesamterneuerungswahlen statt. Die Stimmberechtigten können dann neu entscheiden, wer
  im Parlament sitzt.
