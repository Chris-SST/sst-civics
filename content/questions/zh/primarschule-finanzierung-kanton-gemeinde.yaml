id: primarschule-finanzierung-kanton-gemeinde
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer finanziert und organisiert im Kanton Zürich die Primarschule?
options_de:
  a: Nur die Kirchgemeinden
  b: Nur die Eltern der Schulkinder
  c: Nur der Bund
  d: Der Kanton und die Gemeinden gemeinsam
correct: d
explanation_de: Die Volksschule im Kanton Zürich ist eine gemeinsame Aufgabe von Kanton und Gemeinden.
  Der Kanton legt die Grundlagen fest, die Gemeinden führen die Schulen vor Ort.
