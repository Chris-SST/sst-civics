topic: gemeinde.organisation.versammlung_parlament
question_de: Wie wird das Parlament der Stadt Zürich, der Gemeinderat, bestellt?
options_de:
  a: Der Regierungsrat des Kantons ernennt es
  b: Der Stadtrat bestimmt die Mitglieder selbst
  c: Die Parteien losen die Sitze unter sich aus
  d: Die Bevölkerung wählt es direkt an der Urne
correct: d
explanation_de: Die Stimmberechtigten der Stadt Zürich wählen den Gemeinderat in allgemeinen Wahlen. Er
  ist das Parlament der Stadt und ersetzt die Gemeindeversammlung.
