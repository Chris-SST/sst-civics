id: obligatorische-schule-verantwortung-kanton-gemeinden
version: 1
scope: zh
canton: zh
topic: kanton.sozial.bildung_gesundheit
question_de: Wer trägt in der Schweiz hauptsächlich die Verantwortung für die öffentliche obligatorische
  Schule?
options_de:
  a: Die Schulleitungen und die Eltern
  b: Der Bund allein
  c: Die Bezirke und die Kirchen
  d: Die Kantone und die Gemeinden
correct: d
explanation_de: Die Volksschule ist Sache der Kantone und der Gemeinden. Der Kanton legt den Rahmen fest,
  die Gemeinden führen die Schulen vor Ort. Der Bund spielt bei der obligatorischen Schule nur eine kleine
  Rolle.
