id: emilie-lieberherr-frauenstimmrecht
version: 1
scope: zh
canton: zh
topic: kanton.geschichte.zuerich
question_de: Wofür setzte sich die Zürcher Politikerin Emilie Lieberherr ein?
options_de:
  a: Für den Bau des Zürcher Flughafens
  b: Für den Beitritt der Schweiz zur UNO
  c: Für das Stimm- und Wahlrecht der Frauen
  d: Für die Abschaffung der Gemeindeversammlung
correct: c
explanation_de: Emilie Lieberherr kämpfte in den 1960er-Jahren für das Stimm- und Wahlrecht der Frauen.
  Auf Bundesebene wurde es 1971 eingeführt. Im Kanton Zürich gilt es seit 1970.
