topic: kanton.geografie.zuerich
question_de: In welcher geografischen Grossregion der Schweiz liegt der Kanton Zürich?
options_de:
  a: In den Voralpen
  b: Im Jura
  c: Im Mittelland
  d: In den Zentralalpen
correct: c
explanation_de: Der Kanton Zürich liegt im Schweizer Mittelland, dem dicht besiedelten Gebiet zwischen
  Jura und Alpen. Dort leben die meisten Menschen der Schweiz.
