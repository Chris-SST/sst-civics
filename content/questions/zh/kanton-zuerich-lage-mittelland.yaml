topic: kanton.geografie.zuerich
question_de: Zu welchem grossen Landschaftsraum der Schweiz gehört der Kanton Zürich?
options_de:
  a: Zu den Südalpen
  b: Zum Jura
  c: Zum Mittelland
  d: Zu den Zentralalpen
correct: c
explanation_de: Der Kanton Zürich gehört zum Mittelland, also zum flacheren Gebiet zwischen dem Jura im
  Nordwesten und den Alpen im Süden. Das Mittelland ist der am dichtesten besiedelte Teil der Schweiz.
