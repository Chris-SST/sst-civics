id: volksschule-leitung-vor-ort-schulleitung
version: 2
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer leitet eine Volksschule im Kanton Zürich direkt an der Schule?
options_de:
  a: Der Kantonsrat
  b: Die Schulleitung
  c: Der Elternrat
  d: Der Regierungsrat
correct: b
explanation_de: Jede Volksschule im Kanton Zürich hat eine Schulleitung, die den Betrieb direkt an der
  Schule führt und organisiert. Regierungsrat und Kantonsrat arbeiten auf Ebene des Kantons. Der Elternrat
  bringt die Anliegen der Eltern ein, leitet die Schule aber nicht.
