id: volksschule-leitung-vor-ort-schulleitung
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer ist für die Leitung einer Zürcher Volksschule vor Ort verantwortlich?
options_de:
  a: Die Kantonspolizei
  b: Der Elternrat allein
  c: Das Statistische Amt
  d: Die Schulleitung
correct: d
explanation_de: Jede Schule hat eine Schulleitung, die den Schulbetrieb vor Ort leitet. Sie sorgt für
  die Organisation und die Qualität der Schule.
