question_de: In welcher Stadt im Kanton Zürich befindet sich das Technorama, ein Museum zum Experimentieren?
options_de:
  a: In Uster
  b: In Dübendorf
  c: In Winterthur
  d: In Zürich
correct: c
explanation_de: Das Technorama ist das Schweizer Science Center und steht in Winterthur. Besucherinnen
  und Besucher können dort selbst experimentieren und Naturphänomene ausprobieren.
