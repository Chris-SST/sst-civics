question_de: Wie gross ist ungefähr der Anteil der Kantonsfläche Zürichs, der landwirtschaftlich genutzt
  wird?
options_de:
  a: Rund 68 Prozent
  b: Rund 25 Prozent
  c: Rund 11 Prozent
  d: Rund 41 Prozent
correct: d
explanation_de: Rund 41 Prozent der Fläche des Kantons Zürich dienen der Landwirtschaft. Der Rest besteht
  vor allem aus Wald, Siedlungsfläche und Gewässern.
