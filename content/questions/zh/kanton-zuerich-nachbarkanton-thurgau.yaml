question_de: Welcher der folgenden Kantone grenzt direkt an den Kanton Zürich?
options_de:
  a: Graubünden
  b: Thurgau
  c: Uri
  d: Waadt
correct: b
explanation_de: Der Kanton Thurgau liegt im Nordosten des Kantons Zürich und grenzt direkt an ihn. Graubünden,
  Waadt und Uri haben keine gemeinsame Grenze mit Zürich.
