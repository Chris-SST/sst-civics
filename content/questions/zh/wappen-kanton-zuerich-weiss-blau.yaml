id: wappen-kanton-zuerich-weiss-blau
version: 2
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Welche Farben hat das Wappen des Kantons Zürich?
options_de:
  a: Rot und Weiss
  b: Grün und Weiss
  c: Weiss und Blau
  d: Blau und Gelb
correct: c
explanation_de: Das Zürcher Wappen ist schräg geteilt in Weiss und Blau. In der Wappenkunde heisst das
  Weiss «Silber». Die gleichen Farben zeigt die Fahne des Kantons.
