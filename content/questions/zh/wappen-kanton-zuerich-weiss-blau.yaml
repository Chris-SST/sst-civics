id: wappen-kanton-zuerich-weiss-blau
version: 1
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Welche Farben hat das Wappen des Kantons Zürich?
options_de:
  a: Rot und Weiss
  b: Grün und Weiss
  c: Weiss und Blau
  d: Blau und Gelb
correct: c
explanation_de: 'Das Zürcher Wappen ist schräg geteilt in Weiss und Blau. Die Linie läuft von oben links
  nach unten rechts: oben rechts ist das Feld weiss, unten links blau.'
