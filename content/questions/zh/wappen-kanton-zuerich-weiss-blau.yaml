    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Quelle beschreibt das Wappen heraldisch als «von Silber und Blau schräg geteilt».
        Die Erklärung könnte kurz ergänzen, dass Silber im Wappen als Weiss dargestellt wird, damit Lernende
        die beiden Begriffe zuordnen können.'
    - role: exam
      model: claude-opus-5-5
      verdict: fix
      issues:
      - 'Die Erklärung beschreibt die Lage der Felder in der Fachsprache der Wappenkunde, in der «rechts»
        und «links» aus Sicht des Schildträgers gelten. Lernende lesen die Angaben aber aus Sicht des
        Betrachters und stellen sich so ein gespiegeltes, also falsches Wappen vor. Tatsächlich ist für
        den Betrachter oben links weiss und unten rechts blau, und die Trennlinie läuft von unten links
        nach oben rechts. Vorschlag: «Das Zürcher Wappen ist schräg geteilt in Weiss und Blau. Von vorne
        gesehen ist das Feld oben links weiss und unten rechts blau.» Alternativ die Seitenangaben ganz
        weglassen.'
      - 'Klein: Die Tatsache aus der Themenliste («oben rechts weiss, unten links blau») ist nur im heraldischen
        Sinn richtig und für Lernende missverständlich. Sie sollte mit dem Hinweis «heraldisch» ergänzt
        oder aus Sicht des Betrachters formuliert werden («oben links weiss, unten rechts blau»).'
      - 'Klein: Die Reihenfolge der Farben ist uneinheitlich: Die Antwort lautet «Weiss und Blau», die
        Frage nach Farben ist aber neutral. Das ist unproblematisch. Die Antworten a) und b) könnten für
        Einheitlichkeit jedoch ebenfalls mit der helleren Farbe zuletzt oder alle alphabetisch geordnet
        werden.'
