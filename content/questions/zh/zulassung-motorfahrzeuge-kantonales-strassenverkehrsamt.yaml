canton: zh
topic: kanton.sozial.steuern_leistungen
question_de: Wer lässt im Kanton Zürich ein Motorfahrzeug zum Strassenverkehr zu und gibt dazu die Kontrollschilder
  ab?
options_de:
  a: Die Kantonspolizei bei einer Verkehrskontrolle
  b: Das Strassenverkehrsamt des Kantons
  c: Der Touring Club Schweiz
  d: Die Gemeindeverwaltung am Wohnort
correct: b
explanation_de: Die Zulassung von Motorfahrzeugen ist Aufgabe des kantonalen Strassenverkehrsamts. Es
  gibt auch die Kontrollschilder ab. Gemeinde und Polizei sind dafür nicht zuständig.
