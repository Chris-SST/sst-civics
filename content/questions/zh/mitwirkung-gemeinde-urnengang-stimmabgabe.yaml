    reasoning: Bei Urnengängen in der Gemeinde geben Stimmberechtigte ihre Stimme bei Wahlen und Abstimmungen
      ab, während Sitzungsleitung, Umsetzung der Beschlüsse und Kantonsgesetze nicht ihre Aufgabe an der
      Urne sind.
  source:
    verdict: supported
    note: Quelle 1 sagt, dass die Stimmberechtigten an der Urne über Sachgeschäfte beschliessen (Abstimmungen)
      und eine Urnenabstimmung nur Annehmen oder Ablehnen erlaubt. Der Gemeindevorstand, nicht die Stimmberechtigten,
      beruft die Gemeindeversammlung ein und leitet sie. Das Wählen von Behörden steht im Text nicht ausdrücklich,
      aber die Kernaussage zur Stimmabgabe an der Urne ist eindeutig gestützt.
