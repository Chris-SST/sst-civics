canton: zh
topic: gemeinde.organisation.versammlung_parlament
question_de: Wie wirken Stimmberechtigte in ihrer Gemeinde bei Urnengängen politisch mit?
options_de:
  a: Sie leiten die Sitzungen des Gemeinderats
  b: Sie setzen die Beschlüsse der Gemeinde um
  c: Sie geben ihre Stimme bei Wahlen und Abstimmungen ab
  d: Sie erlassen selbst die Gesetze des Kantons
correct: c
explanation_de: Bei Urnengängen stimmen die Stimmberechtigten über Vorlagen ab und wählen Behörden. Die
  Umsetzung der Beschlüsse ist Aufgabe der Behörden und der Verwaltung.
