question_de: Wie nennt man die Regierung des Kantons Zürich?
options_de:
  a: Obergericht
  b: Kantonsrat
  c: Bundesrat
  d: Regierungsrat
correct: d
explanation_de: Die Regierung des Kantons Zürich heisst Regierungsrat. Der Kantonsrat ist das Parlament,
  das Obergericht gehört zur Justiz.
