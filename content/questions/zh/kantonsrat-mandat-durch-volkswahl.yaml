id: kantonsrat-mandat-durch-volkswahl
version: 1
scope: zh
canton: zh
topic: kanton.demokratie.kantonsrat
question_de: Wie kommen die Mitglieder des Zürcher Kantonsrats zu ihrem Mandat?
options_de:
  a: Sie werden vom Volk gewählt.
  b: Sie werden von den Gemeinderäten bestimmt.
  c: Sie werden vom Regierungsrat ernannt.
  d: Sie werden vom Bundesrat eingesetzt.
correct: a
explanation_de: Die Kantonsratsmitglieder werden von den Stimmberechtigten des Kantons in einer Volkswahl
  gewählt. Das Parlament ist damit direkt vom Volk bestimmt. Weder die Regierung noch der Bund setzen
  die Mitglieder ein.
