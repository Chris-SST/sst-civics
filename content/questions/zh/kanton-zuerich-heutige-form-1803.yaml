question_de: In welchem Jahr entstand der Kanton Zürich in seiner heutigen Form?
options_de:
  a: '1291'
  b: '1519'
  c: '1848'
  d: '1803'
correct: d
explanation_de: Der Kanton Zürich wurde 1803 mit der Mediationsakte in seiner heutigen Form geschaffen.
  Das Jubiläum wurde 2003 als 200 Jahre Kanton Zürich gefeiert. 1848 entstand der heutige Bundesstaat.
