    reasoning: Der Kanton Zürich entstand in seiner heutigen Form 1803 mit der Mediationsakte Napoleons,
      als der Kanton als eigenständiger Stand der Eidgenossenschaft neu gebildet wurde, während 1848 die
      Bundesverfassung des Bundesstaats entstand; die Frage ist aber etwas unscharf, da Zürich schon 1351
      der Eidgenossenschaft beitrat.
