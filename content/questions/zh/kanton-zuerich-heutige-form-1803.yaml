    note: Die Medienmitteilung des Kantons Zürich sagt ausdrücklich, das Staatsgebiet habe 1803 seine
      heutige Form erhalten, nach der Mediationsakte Napoleons, und feiert 200 Jahre moderner Kanton Zürich
      im Jahr 2003. Die Aussage zu 1848 als Bundesstaat wird nur indirekt gestützt (Ausstellung «1803
      bis 1848 – von Napoleon zum Bundesstaat»).
