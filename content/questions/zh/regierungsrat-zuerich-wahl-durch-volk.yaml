topic: kanton.demokratie.regierungsrat
question_de: Wer bestimmt im Kanton Zürich, wer im Regierungsrat sitzt?
options_de:
  a: Die Bundesversammlung wählt die Mitglieder des Regierungsrats.
  b: Der Kantonsrat wählt die Mitglieder aus seinen eigenen Reihen.
  c: Die Gemeindepräsidentinnen und Gemeindepräsidenten wählen die Mitglieder.
  d: Die stimmberechtigte Bevölkerung des Kantons wählt die Mitglieder direkt.
correct: d
explanation_de: Im Kanton Zürich wählt das Volk den Regierungsrat direkt an der Urne. Der Kantonsrat ist
  das Parlament und wählt die Regierung nicht. Das unterscheidet den Kanton vom Bund, wo die Bundesversammlung
  den Bundesrat wählt.
