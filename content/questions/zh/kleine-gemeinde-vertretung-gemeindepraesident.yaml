id: kleine-gemeinde-vertretung-gemeindepraesident
version: 1
scope: zh
canton: zh
topic: gemeinde.organisation.gemeinderat_stadtrat
question_de: Wer vertritt eine kleinere Zürcher Gemeinde nach aussen?
options_de:
  a: die Gemeindepräsidentin oder der Gemeindepräsident
  b: die Bezirksrätin oder der Bezirksrat
  c: die Gemeindeschreiberin oder der Gemeindeschreiber
  d: die Schulleiterin oder der Schulleiter
correct: a
explanation_de: In kleineren Zürcher Gemeinden vertritt die Gemeindepräsidentin oder der Gemeindepräsident
  die Gemeinde nach aussen. Sie oder er leitet den Gemeinderat. In der Stadt Zürich übernimmt diese Rolle
  die Stadtpräsidentin oder der Stadtpräsident.
