  source:
    verdict: supported
    note: Quelle 1 (Broschüre, Seite zum Zürcher Gemeindewesen) nennt die Gemeindepräsidentin oder den
      Gemeindepräsidenten als höchste Repräsentantin bzw. höchsten Repräsentanten der Gemeinde und in
      grösseren Städten die Stadtpräsidentin bzw. den Stadtpräsidenten. Das stützt die Antwort und die
      Erklärung weitgehend; die Formulierung «nach aussen» und die Leitung des Gemeinderats stehen nicht
      wörtlich da. Quelle 2 ist für die Frage nicht relevant.
