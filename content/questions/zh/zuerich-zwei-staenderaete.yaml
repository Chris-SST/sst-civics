canton: zh
topic: kanton.demokratie.abstimmungen_wahlen
question_de: Wie viele Vertreterinnen und Vertreter entsendet der Kanton Zürich in den Ständerat?
options_de:
  a: Eine Vertretung
  b: Vier Vertretungen
  c: Sechs Vertretungen
  d: Zwei Vertretungen
correct: d
explanation_de: Der Kanton Zürich ist ein Vollkanton und hat zwei Sitze im Ständerat. Die Ständerätinnen
  und Ständeräte werden vom Stimmvolk des Kantons gewählt. Nur die Halbkantone haben je eine Vertretung.
