topic: gemeinde.organisation.gemeinderat_stadtrat
question_de: Welche Aufgabe hat der Stadtrat der Stadt Zürich?
options_de:
  a: Er führt die kantonale Steuerverwaltung in der Stadt.
  b: Er erlässt die kantonalen Gesetze für das Stadtgebiet.
  c: Er spricht Recht in Streitfällen zwischen Einwohnerinnen und Einwohnern.
  d: Er steuert die Stadtverwaltung und legt die Leitlinien für das Handeln der Stadt fest.
correct: d
explanation_de: Der Stadtrat ist die Exekutive der Stadt Zürich. Er leitet die Stadtverwaltung und bestimmt,
  in welche Richtung die Stadt sich entwickelt. Gerichte sprechen Recht, und kantonale Gesetze erlässt
  der Kantonsrat.
