    reasoning: Im Kanton Zürich sind die Gemeinden (politische Gemeinden bzw. Schulgemeinden) Träger der
      Volksschule und betreiben die Primarschulen, während der Kanton nur die Aufsicht und die Rahmenbedingungen
      festlegt.
  source:
    verdict: supported
    note: Quelle 2 sagt, dass Schulgemeinden die Volksschulaufgaben erfüllen und dass politische Gemeinden
      (Einheitsgemeinden) diese Aufgaben übernehmen, inklusive Schulpflege. Das stützt Antwort c. Dass
      der Kanton den Rahmen festlegt und die Aufsicht führt, steht dort nicht ausdrücklich, ist für die
      richtige Antwort aber nicht entscheidend. Quelle 1 behandelt Elternrechte und trägt dazu nichts
