version: 2
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer betreibt im Kanton Zürich die Schulen der Primarstufe?
options_de:
  a: Die Bildungsdirektion des Kantons
  b: Der Bund
  c: Die Gemeinden
  d: Die Bezirke
correct: c
explanation_de: Im Kanton Zürich betreiben die Gemeinden die Primarschulen. Das sind je nach Ort die politischen
  Gemeinden oder eigene Schulgemeinden, und die gewählte Schulpflege ist die Schulbehörde vor Ort. Der
  Kanton gibt nur den Rahmen vor, zum Beispiel den Lehrplan, und beaufsichtigt die Volksschule.
