id: primarschule-traegerschaft-gemeinde-zuerich
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wer betreibt im Kanton Zürich die Schulen der Primarstufe?
options_de:
  a: Die Bildungsdirektion des Kantons als Schulleitung jeder Schule
  b: Der Bund
  c: Die politische Gemeinde bzw. die Schulgemeinde vor Ort
  d: Die Bezirksverwaltung
correct: c
explanation_de: Die Primarschule ist im Kanton Zürich eine Aufgabe der Gemeinden. Sie führen die Schulen
  vor Ort und stellen die Schulbehörde. Der Kanton legt den Rahmen fest und beaufsichtigt die Volksschule.
