id: informationen-kommunale-angebote-finden
version: 2
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wo findet man Informationen über die Angebote und Regeln der eigenen Gemeinde?
options_de:
  a: Im Bundesblatt der Eidgenossenschaft
  b: In der Lokalzeitung oder auf der Website der Gemeinde
  c: Bei der Botschaft des Herkunftslandes
  d: Beim Bundesrat in Bern
correct: b
explanation_de: Die Gemeinde informiert über ihre Angebote und Regeln vor allem in der Lokalzeitung und
  auf ihrer Website im Internet. Bund und Bundesrat sind für nationale Themen zuständig, eine ausländische
  Botschaft gar nicht für die Gemeinde. Auch die Gemeindeverwaltung gibt Auskunft.
