id: informationen-kommunale-angebote-finden
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wo kann man sich über Angebote und Vorschriften der eigenen Gemeinde informieren?
options_de:
  a: Nur direkt beim Bundesrat in Bern
  b: Nur bei der Kantonspolizei am Schalter
  c: Nur an der Gemeindeversammlung, die einmal im Jahr stattfindet
  d: Über die Lokalzeitung oder das Internet, zum Beispiel die Website der Gemeinde
correct: d
explanation_de: Gemeinden informieren über ihre Angebote und Vorschriften in der Lokalzeitung, im amtlichen
  Publikationsorgan und auf ihrer Website. So finden Einwohnerinnen und Einwohner leicht, was für sie
  gilt. Die Gemeindeverwaltung gibt auf Anfrage ebenfalls Auskunft.
