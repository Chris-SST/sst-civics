topic: kanton.demokratie.kantonsrat
question_de: Wie heisst das Parlament des Kantons Zürich?
options_de:
  a: Grosser Rat
  b: Landrat
  c: Gemeinderat
  d: Kantonsrat
correct: d
explanation_de: Das Parlament des Kantons Zürich heisst Kantonsrat. Andere Kantone verwenden andere Bezeichnungen,
  zum Beispiel Grosser Rat oder Landrat. Der Gemeinderat ist dagegen eine Behörde auf Gemeindeebene.
