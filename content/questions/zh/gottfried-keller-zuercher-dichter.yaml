id: gottfried-keller-zuercher-dichter
version: 1
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Wer war ein bekannter Dichter und Schriftsteller aus Zürich?
options_de:
  a: Max Frisch
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
correct: b
explanation_de: Gottfried Keller wurde 1819 in Zürich geboren und schrieb unter anderem «Der grüne Heinrich».
  Er war auch Staatsschreiber des Kantons Zürich. Gotthelf lebte im Kanton Bern.
