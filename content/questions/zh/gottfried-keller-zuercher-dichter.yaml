topic: kanton.kultur.zuerich
question_de: Welcher bekannte Dichter und Schriftsteller stammte aus Zürich?
options_de:
  a: Robert Walser
  b: Gottfried Keller
  c: Friedrich Dürrenmatt
  d: Jeremias Gotthelf
correct: b
explanation_de: Gottfried Keller kam 1819 in Zürich zur Welt, schrieb zum Beispiel «Der grüne Heinrich»
  und arbeitete auch als Staatsschreiber des Kantons Zürich. Robert Walser stammte aus Biel, Friedrich
  Dürrenmatt aus Konolfingen im Kanton Bern, und Jeremias Gotthelf wirkte als Pfarrer im Kanton Bern.
