topic: kanton.demokratie.regierungsrat
question_de: Wie heisst die Regierung der Stadt Zürich?
options_de:
  a: Stadtrat
  b: Bezirksrat
  c: Gemeinderat
  d: Stadtparlament
correct: a
explanation_de: Die Exekutive der Stadt Zürich heisst Stadtrat. Der Gemeinderat ist dagegen das Parlament
  der Stadt.
