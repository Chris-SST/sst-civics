topic: kanton.geografie.zuerich
question_de: Welche drei Städte sind nach Einwohnerzahl die grössten im Kanton Zürich?
options_de:
  a: Zürich, Uster und Wetzikon
  b: Zürich, Dietikon und Winterthur
  c: Zürich, Winterthur und Uster
  d: Zürich, Winterthur und Dübendorf
correct: c
explanation_de: Zürich ist mit Abstand die grösste Stadt, danach folgen Winterthur und Uster. Dübendorf,
  Dietikon und Wetzikon sind ebenfalls grössere Städte, haben aber weniger Einwohnerinnen und Einwohner
  als Uster.
