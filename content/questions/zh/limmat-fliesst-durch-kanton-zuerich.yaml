id: limmat-fliesst-durch-kanton-zuerich
version: 2
scope: zh
canton: zh
topic: kanton.geografie.zuerich
question_de: Welcher Fluss fliesst aus dem Zürichsee durch die Stadt Zürich und weiter durch das Kantonsgebiet?
options_de:
  a: Die Thur
  b: Die Birs
  c: Die Reuss
  d: Die Limmat
correct: d
explanation_de: Die Limmat beginnt am Ausfluss des Zürichsees und durchquert die Stadt Zürich und das
  Limmattal. Sie verlässt danach das Kantonsgebiet Richtung Aargau. Reuss, Thur und Birs fliessen nicht
  aus dem Zürichsee.
