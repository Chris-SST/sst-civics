      verdict: approve
      issues:
      - 'Klein: Die falschen Antworten (Baubewilligung, Einbürgerung) sind sehr leicht auszuschliessen;
        als plausiblere Ablenker eignen sich zum Beispiel «Eine AHV-Rente» oder «Ein Steuererlass». Ergänzungsleistungen
        sollten nicht als Ablenker dienen, weil im Kanton Zürich die Gemeinden sie durchführen.'
      - 'Klein: «Ein Stipendium der Volksschule» ist eine ungewöhnliche Wendung, weil die Volksschule
        kostenlos ist und keine Stipendien vergibt; besser wäre zum Beispiel «Ein Stipendium für das Studium».'
    - role: second
