  source:
    verdict: supported
    note: Die Seite nennt Sozialhilfe als Leistung für Menschen in einer Notlage, die sie nicht aus eigener
      Kraft bewältigen können. Sie nennt auch die Gemeinden als zuständig für den Vollzug und verweist
      Betroffene an die Sozialen Dienste der Gemeinde. Die Formulierung «letztes Netz der sozialen Sicherheit»
      steht nicht wörtlich da, ist aber für die Antwort nicht entscheidend.
