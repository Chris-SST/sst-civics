      - 'Klein: Die Erklärung könnte nach der Quelle ergänzen, dass man sich an die Sozialen Dienste der
        Wohngemeinde wendet und dass die Sozialhilfe eine vorübergehende Hilfe ist, zum Beispiel: «Man
        wendet sich an die Sozialen Dienste der Gemeinde.»'
    - role: exam
