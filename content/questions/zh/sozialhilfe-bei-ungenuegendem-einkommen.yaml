id: sozialhilfe-bei-ungenuegendem-einkommen
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Was bietet die Gemeinde an, wenn das Einkommen und das Vermögen einer Person zum Leben nicht
  ausreichen?
options_de:
  a: Sozialhilfe
  b: Eine Baubewilligung
  c: Eine Einbürgerung
  d: Ein Stipendium der Volksschule
correct: a
explanation_de: Wer seinen Lebensunterhalt nicht aus eigenen Mitteln bezahlen kann, hat Anspruch auf Unterstützung
  durch die Sozialhilfe. Sie wird von der Gemeinde, in der die Person wohnt, geleistet. Sie ist das letzte
  Netz der sozialen Sicherheit.
