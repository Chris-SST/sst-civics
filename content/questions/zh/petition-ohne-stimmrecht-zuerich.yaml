id: petition-ohne-stimmrecht-zuerich
version: 1
scope: zh
canton: zh
topic: kanton.demokratie.abstimmungen_wahlen
question_de: Welche politische Möglichkeit haben Ausländerinnen und Ausländer im Kanton Zürich, die kein
  Stimmrecht haben?
options_de:
  a: Sie können an der Urne über kantonale Vorlagen abstimmen.
  b: Sie können Mitglieder des Kantonsrats wählen.
  c: Sie können sich mit einer Petition an die Behörden wenden.
  d: Sie können eine Volksinitiative im Kanton einreichen.
correct: c
explanation_de: Das Petitionsrecht steht allen Personen offen, auch Menschen ohne Stimmrecht. Sie können
  den Behörden so Anliegen, Wünsche oder Kritik schriftlich mitteilen. Abstimmen, wählen und Initiativen
  unterschreiben dürfen nur Stimmberechtigte.
