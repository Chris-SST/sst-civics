id: baudirektion-zuerich-kantonsverwaltung-direktion
version: 1
scope: zh
canton: zh
topic: kanton.demokratie.regierungsrat
question_de: Welche der folgenden Stellen ist eine Direktion der Zürcher Kantonsverwaltung?
options_de:
  a: Die Gemeindedirektion
  b: Die Baudirektion
  c: Die Stadtdirektion
  d: Die Bundesdirektion
correct: b
explanation_de: Die Baudirektion gehört zu den Direktionen der Zürcher Kantonsverwaltung. Die Kantonsverwaltung
  ist in mehrere Direktionen gegliedert, die je von einem Mitglied des Regierungsrats geführt werden.
