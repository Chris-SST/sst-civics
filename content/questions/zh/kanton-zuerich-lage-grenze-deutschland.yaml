topic: kanton.geografie.zuerich
question_de: Wo liegt der Kanton Zürich in der Schweiz, und an welches Nachbarland grenzt er?
options_de:
  a: Im Westen der Schweiz, er grenzt an Frankreich
  b: Im Norden der Schweiz, er grenzt an Deutschland
  c: Im Osten der Schweiz, er grenzt an Österreich
  d: Im Süden der Schweiz, er grenzt an Italien
correct: b
explanation_de: Der Kanton Zürich liegt im Norden der Schweiz. Im Norden bildet ein Teil seiner Grenze
  zugleich die Landesgrenze zu Deutschland.
