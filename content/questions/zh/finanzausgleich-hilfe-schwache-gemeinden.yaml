id: finanzausgleich-hilfe-schwache-gemeinden
version: 1
scope: zh
canton: zh
topic: gemeinde.leistungen
question_de: Wozu dient der Finanzausgleich zwischen den Gemeinden im Kanton Zürich?
options_de:
  a: Er senkt die Steuern in allen Gemeinden auf denselben Satz.
  b: Er bezahlt den Gemeinden die Kosten für Gemeindeversammlungen.
  c: Er hilft finanzschwachen oder durch hohe Sozialkosten belasteten Gemeinden, ihre Aufgaben zu erfüllen.
  d: Er verteilt das Geld des Bundes gleichmässig an alle Einwohnerinnen und Einwohner.
correct: c
explanation_de: Gemeinden haben sehr unterschiedliche finanzielle Möglichkeiten. Der Finanzausgleich gleicht
  diese Unterschiede teilweise aus. So können auch Gemeinden mit wenig Steuerkraft oder hohen Sozialkosten
  ihre Aufgaben erfüllen.
