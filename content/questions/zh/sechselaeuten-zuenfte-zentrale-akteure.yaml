id: sechselaeuten-zuenfte-zentrale-akteure
version: 1
scope: zh
canton: zh
topic: kanton.kultur.zuerich
question_de: Wer tritt beim Zürcher Frühlingsfest Sechseläuten als zentrale Akteure auf?
options_de:
  a: Die Zürcher Schulklassen
  b: Die Zürcher Zünfte
  c: Die Gemeindepräsidien des Kantons
  d: Die Mitglieder des Kantonsrats
correct: b
explanation_de: Beim Sechseläuten ziehen die Zünfte in historischen Kostümen durch die Stadt. Am Abend
  verbrennen sie den Böögg. Der Anlass ist ein bekanntes Frühlingsfest in Zürich.
