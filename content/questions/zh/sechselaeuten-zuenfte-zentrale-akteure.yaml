    reasoning: Beim Sechseläuten sind die Zürcher Zünfte die zentralen Akteure, denn sie veranstalten
      den Umzug und verbrennen den «Böögg» auf dem Sechseläutenplatz.
  source:
    verdict: supported
    note: Quelle 2 beschreibt, dass die 26 Zürcher Zünfte am Montag in einem Umzug durch die Innenstadt
      zum Sechseläutenplatz ziehen, wo der Böögg verbrannt wird. Das stützt die Antwort und die Erklärung
      (Frühlingsfest, Böögg). Quelle 1 erwähnt die Zünfte nur am Rand.
