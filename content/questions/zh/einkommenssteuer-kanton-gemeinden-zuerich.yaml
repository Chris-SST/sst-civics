topic: kanton.sozial.steuern_leistungen
question_de: Welche wichtige Steuer erheben der Kanton Zürich und die Gemeinden auf dem Lohn und anderen
  Einkünften von Personen?
options_de:
  a: Die Einkommenssteuer
  b: Die Erbschaftssteuer
  c: Die Hundesteuer
  d: Die Motorfahrzeugsteuer
correct: a
explanation_de: Die Einkommenssteuer ist eine der wichtigsten Steuern von Kanton und Gemeinden. Sie wird
  auf dem Einkommen der natürlichen Personen erhoben. Die anderen Steuern sind weniger bedeutend oder
  erfassen etwas anderes.
