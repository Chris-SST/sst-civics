question_de: Welcher Fluss fliesst durch die Stadt Winterthur?
options_de:
  a: Die Limmat
  b: Die Töss
  c: Die Sihl
  d: Die Glatt
correct: b
explanation_de: Die Töss fliesst durch Winterthur und mündet später in den Rhein. Die Sihl und die Limmat
  fliessen durch die Stadt Zürich, die Glatt durch das Glattal.
