    reasoning: Wer den Militärdienst mit seinem Gewissen nicht vereinbaren kann, darf nach Bundesverfassung
      und Zivildienstgesetz stattdessen den (länger dauernden) Zivildienst leisten.
  source:
    verdict: supported
    note: Quelle 1 zeigt, dass militärdienstpflichtige Personen, die den Militärdienst nicht mit dem Gewissen
      vereinbaren können, zum Zivildienst zugelassen werden und dann 1.5x so viele Diensttage wie im Militär
      leisten. Das stützt Antwort d) und die Erklärung (Zulassung nötig, längere Dauer). Dass der Zivildienst
      den Militärdienst ersetzt, steht nicht wörtlich da, ergibt sich aber eindeutig aus dem Text.
