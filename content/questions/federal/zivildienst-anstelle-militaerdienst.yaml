id: zivildienst-anstelle-militaerdienst
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Was gilt in der Schweiz für den Zivildienst im Verhältnis zum Militärdienst?
options_de:
  a: Der Zivildienst ist nur für Frauen möglich.
  b: Der Zivildienst ersetzt die Steuerpflicht.
  c: Der Zivildienst muss zusätzlich zum Militärdienst geleistet werden.
  d: Der Zivildienst kann anstelle des Militärdienstes geleistet werden.
correct: d
explanation_de: Der Zivildienst ist ein ziviler Ersatzdienst für Personen, die den Militärdienst nicht
  leisten wollen. Er ist auf Zulassung hin möglich und dauert länger als der Militärdienst.
