id: zivildienst-anstelle-militaerdienst
version: 2
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wie hängen in der Schweiz Zivildienst und Militärdienst zusammen?
options_de:
  a: Den Zivildienst können nur Frauen leisten.
  b: Wer Zivildienst leistet, muss keine Steuern bezahlen.
  c: Den Zivildienst muss man zusätzlich zum Militärdienst leisten.
  d: Den Zivildienst kann man statt des Militärdienstes leisten.
correct: d
explanation_de: Der Zivildienst ist ein ziviler Ersatz für den Militärdienst. Er ist für Personen gedacht,
  die militärdiensttauglich sind, den Dienst mit der Waffe aber nicht mit ihrem Gewissen vereinbaren können.
  Man muss ein Gesuch stellen, und der Zivildienst dauert länger als der Militärdienst.
