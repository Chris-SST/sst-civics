topic: bund.geschichte.gruendung
question_de: Wofür steht das Rütli in der Schweizer Geschichte?
options_de:
  a: Für den Zusammenschluss der Urkantone
  b: Für den Sieg in der Schlacht bei Marignano
  c: Für den Beginn der Reformation
  d: Für die Gründung des Bundesstaates 1848
correct: a
explanation_de: Auf dem Rütli sollen sich nach der Überlieferung Vertreter der Urkantone verbündet haben.
  Es gilt deshalb als Symbol für die Anfänge der Eidgenossenschaft. Die Wiese liegt am Vierwaldstättersee.
