topic: bund.kultur.feiertage_brauchtum
question_de: Wie sieht die Schweizer Fahne aus?
options_de:
  a: Ein weisses, freistehendes Kreuz auf rotem Quadrat
  b: Ein weisses Kreuz auf rotem Grund mit einem Wappen in der Mitte
  c: Ein weisses Kreuz, das bis an den Rand des roten Rechtecks reicht
  d: Ein rotes, freistehendes Kreuz auf weissem Quadrat
correct: a
explanation_de: Die Schweizer Fahne ist quadratisch. Sie zeigt ein weisses Kreuz auf rotem Grund, dessen
  Arme den Rand nicht berühren. Sie ist neben der Fahne des Vatikans eine der beiden quadratischen Landesflaggen.
