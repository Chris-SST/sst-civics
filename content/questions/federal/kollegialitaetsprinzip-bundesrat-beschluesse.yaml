id: kollegialitaetsprinzip-bundesrat-beschluesse
version: 1
scope: federal
canton: null
topic: bund.demokratie.bundesrat
question_de: Was bedeutet das Kollegialitätsprinzip im Bundesrat?
options_de:
  a: Die Bundespräsidentin oder der Bundespräsident entscheidet allein.
  b: Die Mitglieder vertreten die Beschlüsse des Bundesrats gegen aussen einheitlich.
  c: Jedes Mitglied entscheidet in seinem Departement ohne Absprache mit den anderen.
  d: Die Mitglieder dürfen ihre abweichende Meinung öffentlich vertreten.
correct: b
explanation_de: Der Bundesrat entscheidet als Kollegium. Auch wer im Bundesrat eine andere Meinung vertreten
  hat, trägt den Beschluss nach aussen mit. So tritt die Regierung geschlossen auf.
