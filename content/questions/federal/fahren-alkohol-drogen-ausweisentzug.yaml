id: fahren-alkohol-drogen-ausweisentzug
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Was riskiert eine Person, die alkoholisiert oder unter Drogeneinfluss ein Auto fährt?
options_de:
  a: Den Verlust des Stimmrechts
  b: Die Ausweisung aus der Wohngemeinde
  c: Den Entzug der Krankenversicherung
  d: Den Entzug des Führerausweises
correct: d
explanation_de: Wer fahrunfähig ist, gefährdet andere im Strassenverkehr. Deshalb kann die Behörde den
  Führerausweis entziehen. Dazu können auch Bussen oder weitere Strafen kommen.
