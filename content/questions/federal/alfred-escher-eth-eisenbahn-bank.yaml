question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
options_de:
  a: Er führte die Schweizer Truppen im Sonderbundskrieg.
  b: Er schrieb die erste Bundesverfassung allein.
  c: Er gründete das Rote Kreuz in Genf.
  d: Er war an ETH, Eisenbahnbau und der Gründung der Credit Suisse beteiligt.
correct: d
explanation_de: Alfred Escher förderte im 19. Jahrhundert die Gründung der ETH Zürich und den Bau der
  Eisenbahn, besonders der Gotthardbahn. Zudem gründete er die Schweizerische Kreditanstalt, die heutige
  Credit Suisse. Er gilt als Visionär der modernen Schweiz.
