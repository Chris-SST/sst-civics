question_de: Wofür ist der Zürcher Politiker und Unternehmer Alfred Escher bekannt?
options_de:
  a: Er führte die Schweizer Truppen im Sonderbundskrieg an.
  b: Er schrieb die erste Bundesverfassung ganz allein.
  c: Er gründete in Genf das Rote Kreuz.
  d: Er förderte die ETH und den Eisenbahnbau und gründete die Bank, aus der die Credit Suisse wurde.
correct: d
explanation_de: Alfred Escher setzte sich im 19. Jahrhundert für die Gründung der ETH Zürich und für den
  Bau von Eisenbahnen ein, vor allem für die Gotthardbahn. 1856 gründete er die Schweizerische Kreditanstalt,
  die spätere Credit Suisse. Diese Bank wurde 2023 von der UBS übernommen.
