id: alv-beitraege-arbeitgeber-lohnabzug
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wer zieht die Beiträge an die Arbeitslosenversicherung vom Lohn ab?
options_de:
  a: Die Gemeinde am Wohnort
  b: Die Arbeitnehmerin oder der Arbeitnehmer selbst per Einzahlung
  c: Das Regionale Arbeitsvermittlungszentrum
  d: Der Arbeitgeber
correct: d
explanation_de: Der Arbeitgeber zieht die Beiträge automatisch vom Lohn ab und überweist sie an die zuständige
  Stelle. Die Arbeitnehmenden müssen sich nicht selbst darum kümmern. Auch der Arbeitgeber zahlt einen
  Teil der Beiträge.
