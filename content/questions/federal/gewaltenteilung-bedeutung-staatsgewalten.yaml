id: gewaltenteilung-bedeutung-staatsgewalten
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Was bedeutet der Grundsatz der Gewaltenteilung in der Schweiz?
options_de:
  a: Bund, Kantone und Gemeinden teilen die Steuereinnahmen unter sich auf.
  b: Regierung, Parlament und Gerichte teilen sich die staatliche Macht.
  c: Die Macht im Staat liegt allein beim Bundesrat.
  d: Das Volk und die Medien teilen sich die staatliche Macht.
correct: b
explanation_de: Bei der Gewaltenteilung übernehmen die Exekutive (Regierung), die Legislative (Parlament)
  und die Judikative (Gerichte) unterschiedliche Aufgaben. So kann keine Stelle allein zu viel Macht haben.
  Die Staatsgewalten kontrollieren sich gegenseitig.
