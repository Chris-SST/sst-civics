id: obligatorische-schulzeit-dauer-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.bildung
question_de: Wie viele Jahre dauert die obligatorische Schulzeit in der Schweiz, also der gesetzlich vorgeschriebene
  Schulbesuch?
options_de:
  a: Elf Jahre
  b: Zehn Jahre
  c: Zwölf Jahre
  d: Neun Jahre
correct: a
explanation_de: Die obligatorische Schulzeit umfasst in der Schweiz elf Jahre. Sie beginnt mit dem Kindergarten
  (zwei Jahre) und schliesst die Primarschule und die Sekundarstufe I ein. Die Kantone regeln die Schule,
  aber die Dauer ist gesamtschweizerisch harmonisiert.
