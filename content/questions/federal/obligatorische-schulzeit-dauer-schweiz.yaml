topic: bund.sozial.bildung
question_de: Wie viele Jahre dauert im Kanton Zürich die obligatorische Schulzeit, wenn man den Kindergarten
  mitzählt?
options_de:
  a: Elf Jahre
  b: Zehn Jahre
  c: Zwölf Jahre
  d: Neun Jahre
correct: a
explanation_de: 'Im Kanton Zürich besuchen alle Kinder elf Jahre lang obligatorisch die Schule: zwei Jahre
  Kindergarten, sechs Jahre Primarschule und drei Jahre Sekundarstufe I. Die meisten Kantone haben diese
  Dauer mit dem HarmoS-Konkordat vereinheitlicht. Einige Kantone sind aber nicht beigetreten, und dort
  ist teilweise nur ein Jahr Kindergarten obligatorisch.'
