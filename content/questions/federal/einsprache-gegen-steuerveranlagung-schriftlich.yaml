id: einsprache-gegen-steuerveranlagung-schriftlich
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Eine steuerpflichtige Person ist mit ihrer Steuerveranlagung nicht einverstanden. Was kann
  sie tun?
options_de:
  a: Sie kann an der Gemeindeversammlung abstimmen lassen.
  b: Sie kann die Zahlung ohne weiteres Vorgehen verweigern.
  c: Sie kann schriftlich Einsprache bei der Steuerbehörde erheben.
  d: Sie kann beim Bundesrat eine Volksinitiative einreichen.
correct: c
explanation_de: Gegen die Veranlagung gibt es das Rechtsmittel der Einsprache. Sie muss schriftlich bei
  der Steuerbehörde erhoben werden, und zwar innerhalb einer Frist.
