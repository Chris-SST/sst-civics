question_de: Welches Unternehmen ist das grösste Zirkusunternehmen der Schweiz?
options_de:
  a: Zirkus Knie
  b: Circus Nock
  c: Circus Monti
  d: Zirkus Stey
correct: a
explanation_de: Der Zirkus Knie ist das grösste Zirkusunternehmen des Landes. Er tourt jedes Jahr mit
  seinem Zelt durch viele Schweizer Städte und Dörfer. Der Zirkus gehört zur Schweizer Kultur.
