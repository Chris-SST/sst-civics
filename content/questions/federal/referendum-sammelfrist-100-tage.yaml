id: referendum-sammelfrist-100-tage
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie viel Zeit haben die Referendumskomitees, um die Unterschriften für ein fakultatives Referendum
  gegen ein Bundesgesetz zu sammeln?
options_de:
  a: 60 Tage
  b: 18 Monate
  c: 100 Tage
  d: 30 Tage
correct: c
explanation_de: Die Frist beträgt 100 Tage ab der amtlichen Veröffentlichung des Erlasses. Die 18 Monate
  gelten dagegen für das Sammeln von Unterschriften für eine Volksinitiative.
