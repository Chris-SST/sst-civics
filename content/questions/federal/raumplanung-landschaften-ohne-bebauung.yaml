id: raumplanung-landschaften-ohne-bebauung
version: 2
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Was ist ein Ziel der Raumplanung in der Schweiz?
options_de:
  a: Sie soll unbebaute Landschaften schützen und den Boden sparsam nutzen.
  b: Sie soll die Grenzen zwischen den Kantonen regelmässig neu festlegen.
  c: Sie soll möglichst viele neue Bauzonen schaffen.
  d: Sie soll den Preis für Bauland bestimmen.
correct: a
explanation_de: Die Raumplanung bestimmt, wo gebaut werden darf und wo nicht. Sie trennt Baugebiet von
  Nichtbaugebiet, damit Landschaften und Kulturland geschont werden. Weil der Boden knapp ist, soll man
  sparsam damit umgehen und eher bestehende Siedlungen verdichten, statt neue Bauzonen zu schaffen.
