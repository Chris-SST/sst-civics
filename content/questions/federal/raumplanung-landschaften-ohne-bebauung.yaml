id: raumplanung-landschaften-ohne-bebauung
version: 1
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Welches Ziel hat die Raumplanung in der Schweiz unter anderem?
options_de:
  a: Sie soll Landschaften ohne Bebauung erhalten.
  b: Sie soll die Kantonsgrenzen regelmässig neu ziehen.
  c: Sie soll möglichst viel Land für Neubauten freigeben.
  d: Sie soll die Preise für Bauland festlegen.
correct: a
explanation_de: Die Raumplanung regelt, wie der Boden genutzt wird. Sie soll Siedlungen, Landwirtschaft
  und Natur ausgewogen ordnen und unbebaute Landschaften schützen. Das Land ist knapp und soll haushälterisch
  genutzt werden.
