    reasoning: Die Raumplanung soll nach Art. 75 der Bundesverfassung und dem Raumplanungsgesetz den Boden
      haushälterisch nutzen und die natürlichen Lebensgrundlagen wie unbebaute Landschaften schützen,
      während die anderen Antworten nicht zu ihren Zielen gehören.
  source:
    verdict: supported
    note: 'Quelle 1 nennt als Hauptzweck die nachhaltige Nutzung des Bodens: weniger überbauen, um die
      Landschaft zu schonen, und den Boden haushälterisch nutzen. Quelle 2 nennt den Schutz der Landschaft
      als zentrale Aufgabe und das Ziel, die Zersiedelung zu stoppen sowie Natur- und Kulturlandschaften
      zu erhalten. Das stützt Antwort a und die Erklärung. Die anderen Antworten werden durch die Texte
