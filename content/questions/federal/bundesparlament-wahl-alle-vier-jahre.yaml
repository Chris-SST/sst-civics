id: bundesparlament-wahl-alle-vier-jahre
version: 2
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: In welchem Rhythmus wählt das Volk das Bundesparlament neu?
options_de:
  a: Alle drei Jahre
  b: Alle vier Jahre
  c: Alle sechs Jahre
  d: Alle zwei Jahre
correct: b
explanation_de: Das Volk wählt den Nationalrat alle vier Jahre neu. Auch die Mitglieder des Ständerats
  werden heute in allen Kantonen für vier Jahre gewählt. Wie gewählt wird und teilweise auch wann, bestimmt
  jeder Kanton selbst.
