id: bundesparlament-wahl-alle-vier-jahre
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: In welchem Rhythmus wählt das Volk das Bundesparlament neu?
options_de:
  a: Alle drei Jahre
  b: Alle vier Jahre
  c: Alle sechs Jahre
  d: Alle zwei Jahre
correct: b
explanation_de: Der Nationalrat wird alle vier Jahre vom Volk neu gewählt. Auch der Ständerat wird in
  den meisten Kantonen im selben Rhythmus gewählt, die Kantone regeln das selbst.
