    reasoning: Der Nationalrat wird vom Volk alle vier Jahre neu gewählt (Gesamterneuerungswahlen), und
      auch die Ständeratsmitglieder werden in den meisten Kantonen gleichzeitig für vier Jahre gewählt.
  source:
    verdict: supported
    note: 'Quelle 1 (Bundesverfassung) sagt zum Nationalrat: «Alle vier Jahre findet eine Gesamterneuerung
      statt», und die Abgeordneten werden vom Volk direkt gewählt. Dass der Ständerat von den Kantonen
      geregelt wird, steht dort ebenfalls («Die Wahl in den Ständerat wird vom Kanton geregelt»). Quelle
      2 ist für die Frage nicht relevant.'
