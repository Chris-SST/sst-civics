id: schwimmbad-zutritt-hautfarbe-diskriminierung
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Ein öffentliches Schwimmbad verweigert einer Person den Eintritt wegen ihrer Hautfarbe. Welcher
  Grundsatz der Bundesverfassung wird dadurch verletzt?
options_de:
  a: Die Wirtschaftsfreiheit
  b: Das Diskriminierungsverbot
  c: Das Stimmrecht
  d: Das Recht auf Ehe und Familie
correct: b
explanation_de: Die Bundesverfassung verbietet in Artikel 8 die Diskriminierung, zum Beispiel wegen der
  Herkunft oder der Rasse. Niemand darf deshalb schlechter behandelt werden.
