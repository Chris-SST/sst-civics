topic: bund.geschichte.gruendung
question_de: Wofür steht die Sagengestalt Wilhelm Tell aus der Innerschweiz?
options_de:
  a: Für den Widerstand gegen fremde Herrscher
  b: Für die Neutralität der Schweiz im Krieg
  c: Für die Einführung der Reformation
  d: Für die Gründung der ersten Schweizer Bank
correct: a
explanation_de: Die Sage erzählt von einem Mann, der sich gegen die Unterdrückung durch fremde Vögte wehrt.
  Wilhelm Tell gilt deshalb als Symbol für Freiheit. Ob er wirklich gelebt hat, ist nicht belegt.
