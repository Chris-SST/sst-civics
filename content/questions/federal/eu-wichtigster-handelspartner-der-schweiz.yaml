id: eu-wichtigster-handelspartner-der-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Mit welchem Wirtschaftsraum treibt die Schweiz insgesamt am meisten Handel?
options_de:
  a: Mit den Staaten des Nahen Ostens
  b: Mit den asiatischen Staaten
  c: Mit der Europäischen Union
  d: Mit den Vereinigten Staaten von Amerika
correct: c
explanation_de: Die Europäische Union ist der wichtigste Handelspartner der Schweiz. Ein grosser Teil
  der Importe und Exporte läuft über die EU-Staaten. Deshalb sind die Beziehungen zur EU für die Schweizer
  Wirtschaft sehr wichtig.
