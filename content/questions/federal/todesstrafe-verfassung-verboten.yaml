id: todesstrafe-verfassung-verboten
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was gilt in der Schweiz nach der Bundesverfassung für die Todesstrafe?
options_de:
  a: Sie ist nur bei Mord erlaubt.
  b: Sie ist nur im Krieg erlaubt.
  c: Die Kantone entscheiden, ob sie gilt.
  d: Sie ist verboten.
correct: d
explanation_de: Die Bundesverfassung schützt das Recht auf Leben in Artikel 10. Die Todesstrafe ist ausdrücklich
  verboten, auch für schwere Verbrechen.
