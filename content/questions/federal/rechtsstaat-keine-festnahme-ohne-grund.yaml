    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: «nach eigenem Ermessen» in Antwort b) ist ein Fachausdruck, und Behörden haben im Rahmen
        des Gesetzes tatsächlich Ermessen; besser wäre «nach Belieben, auch ohne gesetzlichen Grund».'
      - 'Klein: Antwort d) ist sehr offensichtlich falsch und hilft beim Üben wenig; sie könnte durch
        eine plausiblere Ablenkung ersetzt werden, etwa «Die Polizei darf jemanden ohne Grund festnehmen,
        wenn sie ihn verdächtig findet».'
    - role: second
