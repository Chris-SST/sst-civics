id: rechtsstaat-keine-festnahme-ohne-grund
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Was gilt in einem Rechtsstaat für Festnahme und Haft?
options_de:
  a: Der Staat darf niemanden ohne Grund festnehmen und inhaftieren.
  b: Der Staat darf Personen nach eigenem Ermessen festhalten.
  c: Die Regierung darf Kritiker vorsorglich in Haft nehmen.
  d: Nur Ausländerinnen und Ausländer dürfen ohne Grund festgenommen werden.
correct: a
explanation_de: In einem Rechtsstaat ist staatliches Handeln an das Recht gebunden. Eine Festnahme oder
  Haft braucht einen gesetzlichen Grund. Das schützt die Freiheit der Menschen vor Willkür.
