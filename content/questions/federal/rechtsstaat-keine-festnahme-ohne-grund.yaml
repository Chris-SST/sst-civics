      issues:
      - 'Klein: Die Erklärung könnte die Quelle nennen, etwa mit dem Satz «Das steht in Artikel 31 der
        Bundesverfassung: Die Freiheit darf nur in den vom Gesetz vorgesehenen Fällen entzogen werden.»'
      - 'Klein: Antwort d) ist wenig plausibel; besser wäre zum Beispiel «Die Polizei darf jede Person
