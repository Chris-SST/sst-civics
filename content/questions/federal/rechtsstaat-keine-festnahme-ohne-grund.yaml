    reasoning: In einem Rechtsstaat darf der Staat niemanden willkürlich festnehmen oder inhaftieren,
      sondern nur bei gesetzlichem Grund und unter den Voraussetzungen der Verfassung (Art. 9 und 31 BV).
  source:
