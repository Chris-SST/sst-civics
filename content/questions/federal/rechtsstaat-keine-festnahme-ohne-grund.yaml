      - 'Klein: Die Falschantworten b) und c) sind inhaltlich sehr ähnlich (Willkür der Behörden), könnten
        aber mit einer anderen Variante, etwa «Nur bei Verdacht auf ein Verbrechen», abwechslungsreicher
