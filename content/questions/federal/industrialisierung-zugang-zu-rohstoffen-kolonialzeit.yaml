topic: bund.geschichte.bundesstaat
question_de: Die Schweiz besitzt nur wenige eigene Rohstoffe. Was trug in der Kolonialzeit dazu bei, dass
  sie sich zu einem Industrieland entwickelte?
options_de:
  a: Ein Verbot jeder Einfuhr von Waren
  b: Die Herrschaft über eigene Kolonien in Übersee
  c: Der Zugang zu Rohstoffen aus dem Welthandel
  d: Grosse eigene Vorkommen an Kohle und Eisenerz
correct: c
explanation_de: Die Schweiz kam über den Welthandel an Rohstoffe, zum Beispiel Baumwolle, und verarbeitete
  sie in ihren Fabriken. So entstanden Industrien wie die Textil- und Stickereiindustrie. Eigene Kohle-
  oder Erzvorkommen hatte das Land kaum.
