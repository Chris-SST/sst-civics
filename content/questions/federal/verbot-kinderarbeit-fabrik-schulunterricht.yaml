canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Was sollte das Verbot der Kinderarbeit in Fabriken von 1877 vor allem sichern?
options_de:
  a: Dass Fabriken weniger Lohn zahlen mussten
  b: Dass Kinder die Schule besuchen konnten
  c: Dass Kinder früher im Haushalt helfen mussten
  d: Dass Fabriken mehr Arbeitskräfte aus dem Ausland holten
correct: b
explanation_de: Das Fabrikgesetz von 1877 verbot die Fabrikarbeit für Kinder. Sie sollten Schulunterricht
  besuchen statt zu arbeiten. Das Gesetz schützte auch die Gesundheit der Arbeitenden.
