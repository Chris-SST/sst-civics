topic: bund.demokratie.foederalismus
question_de: Wie viele politische Gemeinden gab es in der Schweiz Ende 2021 ungefähr?
options_de:
  a: Rund 1200
  b: Rund 800
  c: Rund 2200
  d: Rund 4200
correct: c
explanation_de: Ende 2021 zählte die Schweiz rund 2200 politische Gemeinden. Ihre Zahl sinkt langsam,
  weil sich immer wieder Gemeinden zusammenschliessen. Darum ist der Stand wichtig.
