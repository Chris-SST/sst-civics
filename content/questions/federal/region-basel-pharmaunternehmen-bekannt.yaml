    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung würde mehr helfen, wenn sie Roche und Novartis als Beispiele nennt, etwa:
        «Zum Beispiel haben Roche und Novartis ihren Hauptsitz in Basel.»'
      - 'Klein: Im Wallis gibt es mit Lonza in Visp einen grossen Pharma- und Chemiestandort; als falsche
        Antwort wäre eine Region ohne jeden Bezug zur Pharmaindustrie eindeutiger, zum Beispiel «Das Berner
        Oberland».'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Formulierung «durch grosse dort ansässige Pharmaunternehmen bekannt» ist für Niveau
        B1 etwas schwerfällig; einfacher wäre «In welcher Region der Schweiz haben grosse Pharmaunternehmen
        ihren Hauptsitz?».'
      - 'Klein: Im Wallis gibt es mit Lonza in Visp einen grossen Pharma-Produktionsstandort; als Ablenker
        ist das Wallis noch vertretbar, weil Lonza ihren Hauptsitz in Basel hat, doch das Wallis könnte
        durch eine eindeutig falsche Region wie «Das Berner Oberland» ersetzt werden.'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung könnte konkrete Beispiele nennen (z. B. Roche und Novartis in Basel), das
        würde das Verstehen und Merken erleichtern.'
      - 'Klein: Die Quelle 1 nennt Basel nur als eine von mehreren Regionen (neben Zürich, Zug und Genferseeregion);
        die Aussage «Basel ist bekannt für Pharma» ist aber allgemein bekanntes, sicheres Wissen, und
        die falschen Antworten sind klar falsch.'
