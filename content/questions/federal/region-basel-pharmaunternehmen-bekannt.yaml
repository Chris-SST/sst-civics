    reasoning: Die Region Basel ist mit Unternehmen wie Novartis und Roche das Zentrum der Schweizer Pharmaindustrie.
  source:
    verdict: supported
    note: Quelle 1 nennt Roche und Novartis als Pharmakonzerne und sagt, dass sich die Firmen der Branche
      auf die Regionen Basel, Zürich, Zug und die Genferseeregion konzentrieren. Basel ist damit als Pharmastandort
      belegt, und die Bedeutung für den Export steht ebenfalls dort. Die Hauptsitze in Basel nennt die
      Quelle nicht ausdrücklich, und Engadin, Tessin und Wallis kommen nicht vor.
