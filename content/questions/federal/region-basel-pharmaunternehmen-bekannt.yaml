id: region-basel-pharmaunternehmen-bekannt
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Welche Region der Schweiz ist durch grosse dort ansässige Pharmaunternehmen bekannt?
options_de:
  a: Das Engadin
  b: Die Region Basel
  c: Das Tessin
  d: Das Wallis
correct: b
explanation_de: In der Region Basel haben mehrere weltweit tätige Pharmaunternehmen ihren Hauptsitz. Die
  Pharmaindustrie ist dort ein wichtiger Wirtschaftszweig und für den Export bedeutend.
