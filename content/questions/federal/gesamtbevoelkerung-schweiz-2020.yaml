question_de: Wie gross war die Gesamtbevölkerung der Schweiz im Jahr 2020 ungefähr?
options_de:
  a: etwa 6,2 Millionen
  b: etwa 8,6 Millionen
  c: etwa 10,1 Millionen
  d: etwa 7,4 Millionen
correct: b
explanation_de: Im Jahr 2020 lebten in der Schweiz rund 8,6 Millionen Menschen. Die Bevölkerung ist in
  den letzten Jahrzehnten stark gewachsen. Aktuelle Zahlen veröffentlicht das Bundesamt für Statistik.
