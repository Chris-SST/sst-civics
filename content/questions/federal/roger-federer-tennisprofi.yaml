question_de: Für welche Sportart ist der Schweizer Roger Federer weltberühmt?
options_de:
  a: Eishockey
  b: Fussball
  c: Skirennen
  d: Tennis
correct: d
explanation_de: Roger Federer ist ein berühmter Schweizer Tennisprofi. Er gewann viele grosse Turniere
  und gilt als einer der erfolgreichsten Spieler der Geschichte. Tennis ist eine der Sportarten, in denen
  die Schweiz international bekannte Persönlichkeiten hat.
