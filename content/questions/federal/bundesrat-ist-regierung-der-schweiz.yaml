id: bundesrat-ist-regierung-der-schweiz
version: 1
scope: federal
canton: null
topic: bund.demokratie.bundesrat
question_de: Welche Rolle hat der Bundesrat in der Schweiz?
options_de:
  a: Er ist die Regierung der Schweiz.
  b: Er ist das oberste Gericht des Landes.
  c: Er ist das Parlament des Bundes.
  d: Er ist die Vertretung der Kantone.
correct: a
explanation_de: Der Bundesrat ist die oberste leitende und vollziehende Behörde des Bundes, also die Regierung.
  Er hat sieben Mitglieder. Das Parlament und das Bundesgericht sind andere Gewalten.
