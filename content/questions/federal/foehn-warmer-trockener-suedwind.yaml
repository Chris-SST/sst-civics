topic: bund.geografie.landschaft
question_de: Was ist der Föhn?
options_de:
  a: Ein kalter, feuchter Wind aus Norden
  b: Ein kalter Wind aus dem Osten im Winter
  c: Ein starker Regen im Frühling
  d: Ein warmer, trockener Wind aus südlicher Richtung
correct: d
explanation_de: Der Föhn ist ein warmer, trockener Fallwind, der in den Alpen vor allem aus Süden weht.
  Er kann die Temperaturen rasch ansteigen lassen und die Sicht sehr klar machen.
