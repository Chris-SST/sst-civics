canton: null
topic: bund.geschichte.gruendung
question_de: Welches Volk siedelte zur Zeit der Römer im Gebiet der heutigen Schweiz?
options_de:
  a: Die Hunnen
  b: Die Wikinger
  c: Die Goten
  d: Die Helvetier
correct: d
explanation_de: Die Helvetier waren ein keltischer Stamm im Mittelland. Die Römer unterwarfen sie und
  das Gebiet wurde Teil des Römischen Reichs. Der lateinische Name Helvetia für die Schweiz erinnert noch
  an sie.
