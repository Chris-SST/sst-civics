question_de: In welcher Grossregion der Schweiz wohnt die Mehrheit der Bevölkerung?
options_de:
  a: In den Alpen
  b: Im Tessin
  c: Im Mittelland
  d: Im Jura
correct: c
explanation_de: Im Mittelland zwischen Jura und Alpen liegen die meisten grossen Städte. Dort lebt der
  grösste Teil der Bevölkerung. Die Alpen sind zwar gross, aber dünn besiedelt.
