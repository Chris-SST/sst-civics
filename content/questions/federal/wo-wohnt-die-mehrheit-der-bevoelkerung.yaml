question_de: In welchem Gebiet der Schweiz wohnt die Mehrheit der Bevölkerung?
options_de:
  a: In den Alpen
  b: Im Tessin
  c: Im Mittelland
  d: Im Jura
correct: c
explanation_de: Das Mittelland liegt zwischen dem Jura und den Alpen. Dort befinden sich die meisten grossen
  Städte, und dort lebt der grösste Teil der Bevölkerung. Die Alpen bedecken zwar eine grosse Fläche,
  sind aber nur dünn besiedelt.
