topic: bund.geografie.landschaft
question_de: Welcher dieser Kantone ist stark vom Gebirge geprägt?
options_de:
  a: Basel-Stadt
  b: Wallis
  c: Thurgau
  d: Genf
correct: b
explanation_de: Im Wallis liegen viele hohe Alpengipfel, darunter die Dufourspitze, der höchste Berg der
  Schweiz. Thurgau, Basel-Stadt und Genf liegen eher im Flachland oder an Seen und Flüssen.
