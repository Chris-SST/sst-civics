id: zollwesen-zustaendigkeit-bund
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Wer besorgt in der Schweiz das Zollwesen?
options_de:
  a: Der Bund
  b: Die Gemeinden an der Grenze
  c: Die Kantone, in denen die Grenzen liegen
  d: Die Kantone und der Bund je zur Hälfte
correct: a
explanation_de: Das Zollwesen ist nach der Bundesverfassung Sache des Bundes. Er regelt die Zölle und
  die Kontrolle beim Warenverkehr über die Grenze. Kantone und Gemeinden haben dafür keine eigene Zuständigkeit.
