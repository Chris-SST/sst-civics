    option: b
    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Bei Fragen zum Arbeitsrecht helfen Anwältinnen und Anwälte, Gewerkschaften und die Arbeitsgerichte
      weiter, während die anderen genannten Stellen dafür nicht zuständig sind.
  source:
    verdict: supported
    note: 'Quelle 1 (Broschüre zum Grundkenntnistest) sagt ausdrücklich: Bei Fragen und Streitigkeiten
      zum Arbeitsvertrag können sich Arbeitnehmende an Anwältinnen und Anwälte, Gewerkschaften und Arbeitsgerichte
      wenden. Die Aufgaben von Zivilstandsamt und Einwohnerkontrolle werden ebenfalls anders beschrieben
      (Heirat, Umzug).'
    at: *id001
    model: claude-sonnet-5-5
    version: 1
  panel:
    verdict: approve
    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung sagt nur, dass die anderen Stellen für andere Aufgaben zuständig sind; besser
        kurz ergänzen, dass Gewerkschaften sich für die Rechte von Arbeitnehmenden einsetzen und die Arbeitsgerichte
        im Kanton Zürich eine unentgeltliche Rechtsauskunft anbieten.'
      - 'Klein: Die richtige Antwort ist leicht zu erraten, weil nur sie das Wort «Arbeit» enthält und
        als einzige drei Stellen nennt; man könnte eine falsche Antwort mit einem ähnlich klingenden Amt
        ergänzen, zum Beispiel «Das Steueramt und die AHV-Ausgleichskasse».'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die falschen Antworten (Verkehrsbetriebe und Post, Schulpflege und Kirchgemeinde) sind
        sehr leicht als falsch zu erkennen; plausibler wären etwa «Das Steueramt und die Gemeindekanzlei».'
      - 'Klein: «Die Anwaltschaft» ist für Lernende auf Niveau B1 eher schwer verständlich; in der Antwort
        könnte man stattdessen «Anwältinnen und Anwälte» schreiben, wie in der Erklärung.'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Frage ist sehr allgemein formuliert; genauer wäre «Wer hilft bei Streitigkeiten aus
        dem Arbeitsvertrag weiter?», da die Broschüre die Stellen im Zusammenhang mit Fragen und Streitigkeiten
        zum Arbeitsvertrag nennt.'
      - 'Klein: Die Erklärung wiederholt nur die Antwort; ein Hinweis, dass Gewerkschaften die Interessen
        der Arbeitnehmenden vertreten und Arbeitsgerichte bei Streitigkeiten entscheiden, würde das Verstehen
        verbessern.'
    round: 1
    at: &id002 2026-11-02
