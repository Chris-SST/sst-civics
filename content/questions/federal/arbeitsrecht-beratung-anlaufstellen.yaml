topic: bund.sozial.wirtschaft_arbeit
question_de: Wer hilft bei Fragen zum Arbeitsrecht weiter?
options_de:
  a: Die Schulpflege und die Kirchgemeinde
  b: Die Anwaltschaft, Gewerkschaften und Arbeitsgerichte
  c: Die Verkehrsbetriebe und die Post
  d: Die Zivilstandsämter und die Einwohnerkontrolle
correct: b
explanation_de: Bei Fragen zum Arbeitsrecht gibt es mehrere Anlaufstellen. Dazu gehören Anwältinnen und
  Anwälte, Gewerkschaften und die Arbeitsgerichte. Die anderen Stellen sind für andere Aufgaben zuständig.
