id: schweiz-besteht-aus-kantonen-als-gliedstaaten
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Woraus setzt sich die Schweiz als Bundesstaat zusammen?
options_de:
  a: Aus Bezirken als Gliedstaaten
  b: Aus Sprachgebieten als Gliedstaaten
  c: Aus Kantonen als Gliedstaaten
  d: Aus Regionen als Gliedstaaten
correct: c
explanation_de: Die Schweiz ist ein Bundesstaat. Die Kantone sind ihre Gliedstaaten und haben eine eigene
  Verfassung, ein eigenes Parlament und eine eigene Regierung. Bezirke und Regionen sind keine Gliedstaaten.
