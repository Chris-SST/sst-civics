id: initiative-gegenvorschlag-stichfrage
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Über eine Volksinitiative und einen direkten Gegenvorschlag der Bundesversammlung wird gleichzeitig
  abgestimmt. Wozu dient dabei die Stichfrage?
options_de:
  a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
  b: Sie entscheidet, ob die Initiative gültig ist
  c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
  d: Sie entscheidet, ob die Kantone mitstimmen dürfen
correct: c
explanation_de: Die Stimmberechtigten können sowohl der Initiative als auch dem Gegenvorschlag zustimmen.
  Mit der Stichfrage geben sie an, welche der beiden Vorlagen in Kraft treten soll, falls beide angenommen
  werden. So geht keine Stimme für eine Änderung verloren.
