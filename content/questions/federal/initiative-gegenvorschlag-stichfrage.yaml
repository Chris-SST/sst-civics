    reasoning: Gemäss Art. 139b der Bundesverfassung bestimmt die Stichfrage, welche der beiden Vorlagen
      in Kraft tritt, wenn sowohl die Volksinitiative als auch der direkte Gegenvorschlag von Volk und
      Ständen angenommen werden.
  source:
    verdict: supported
    note: Quelle 2 (Art. 139b BV) hält fest, dass die Stimmberechtigten beiden Vorlagen zustimmen und
      in der Stichfrage angeben können, welcher Vorlage sie den Vorrang geben, falls beide angenommen
      werden. Quelle 1 behandelt die Stichfrage nicht.
