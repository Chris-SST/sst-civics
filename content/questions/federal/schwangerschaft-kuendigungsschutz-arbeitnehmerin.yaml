    reasoning: Nach Art. 336c OR darf der Arbeitgeber während der Schwangerschaft und in den 16 Wochen
      nach der Niederkunft nicht kündigen (nach Ablauf der Probezeit), und dieser Schutz gilt unabhängig
      von einem Gesamtarbeitsvertrag und ohne sofortige Meldepflicht.
  source:
    verdict: supported
    note: Quelle 1 (Obligationenrecht) nennt eine Kündigung während der Schwangerschaft und in den 16
      Wochen nach der Niederkunft als missbräuchlich und regelt, dass sie während der Sperrfrist nichtig
      ist. Das stützt Antwort b; die Seite nennt weder eine Beschränkung auf Betriebe mit GAV noch eine
      Meldepflicht.
