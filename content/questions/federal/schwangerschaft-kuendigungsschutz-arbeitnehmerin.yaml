id: schwangerschaft-kuendigungsschutz-arbeitnehmerin
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Was gilt für schwangere Arbeitnehmerinnen in der Schweiz bei der Kündigung?
options_de:
  a: Sie haben nur in Betrieben mit Gesamtarbeitsvertrag Kündigungsschutz
  b: Sie geniessen während der Schwangerschaft gesetzlichen Kündigungsschutz
  c: Sie müssen ihre Schwangerschaft dem Arbeitgeber sofort melden, sonst verfällt der Schutz
  d: Sie können jederzeit ohne Einschränkung gekündigt werden
correct: b
explanation_de: Das Gesetz schützt Frauen während der Schwangerschaft vor einer Kündigung durch den Arbeitgeber.
  Der Schutz gilt unabhängig vom Betrieb. Er soll die Frauen in dieser Zeit absichern.
