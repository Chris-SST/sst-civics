topic: bund.kultur.feiertage_brauchtum
question_de: Welche Namen gehören zu weltweit angesehenen Kunstschaffenden mit Bezug zur Schweiz?
options_de:
  a: Vincent van Gogh, Paul Cézanne und Henri Matisse
  b: Niki de Saint Phalle, Sophie Taeuber-Arp und Pipilotti Rist
  c: Claude Monet, Edgar Degas und Auguste Renoir
  d: Pablo Picasso, Frida Kahlo und Salvador Dalí
correct: b
explanation_de: Niki de Saint Phalle, Sophie Taeuber-Arp und Pipilotti Rist sind international anerkannte
  Künstlerinnen, die mit der Schweiz verbunden sind. Die anderen Gruppen nennen bekannte Künstler ohne
  diesen Schweizer Bezug.
