id: familien-steuerabzuege-entlastung
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wie werden Familien bei den Steuern entlastet?
options_de:
  a: Familien zahlen keine Steuern.
  b: Familien können bei den Steuern Abzüge geltend machen.
  c: Familien müssen keine Steuererklärung ausfüllen.
  d: Familien zahlen nur die Mehrwertsteuer.
correct: b
explanation_de: Familien können zum Beispiel Abzüge für Kinder oder für die Kinderbetreuung geltend machen.
  Dadurch sinkt das steuerbare Einkommen und damit die Steuer.
sources:
