    reasoning: Familien werden steuerlich entlastet, indem sie bei den Steuern Abzüge wie den Kinderabzug
      oder den Abzug für Kinderbetreuungskosten geltend machen können, während die anderen Aussagen falsch
      sind.
  source:
    verdict: supported
    note: Quelle 1 (DBG) nennt Abzüge für Kinder (6800 Franken pro Kind) und den Zweiverdienerabzug für
      Ehegatten, Quelle 2 (Kanton Zürich) nennt den Abzug für fremdbetreute Kinder und den Kinderabzug.
      Damit können Familien Abzüge geltend machen; die Antworten a, c und d widersprechen den Quellen,
      denn alle Personen ab 18 müssen eine Steuererklärung ausfüllen (Quelle 3).
