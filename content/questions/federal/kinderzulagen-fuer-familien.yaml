    at: 2026-11-02
    version: 1
    reasoning: Kinderzulagen (Kinder- und Ausbildungszulagen) sind die Leistung, die Familien mit Kindern
      in der Schweiz erhalten, während die übrigen Antworten andere Risiken oder Zwecke betreffen.
  source:
    verdict: supported
    note: Die BSV-Seite nennt die Kinderzulage als Teil des Familienzulagensystems mit einem Mindestbetrag
      von 215 Franken pro Monat. Zudem hält sie fest, dass Familienzulagen für den Unterhalt des Kindes
      verwendet werden müssen. Das Bundesgesetz wird im Text nicht ausdrücklich genannt, die Kernaussage
      der Erklärung ist aber gedeckt.
