id: kinderzulagen-fuer-familien
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche staatliche Leistung erhalten Familien mit Kindern in der Schweiz?
options_de:
  a: Invalidenrente
  b: Kinderzulagen
  c: Wohneigentumsprämie
  d: Arbeitslosentaggeld
correct: b
explanation_de: Familien erhalten Kinderzulagen als Beitrag an die Kosten für den Unterhalt der Kinder.
  Sie gehören zu den Familienzulagen, die im Bundesgesetz geregelt sind.
