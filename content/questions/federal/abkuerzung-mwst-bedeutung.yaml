version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Auf Rechnungen und Quittungen steht oft die Abkürzung «MWST». Wofür steht sie?
options_de:
  a: Für die Mietwohnungssteuer
  b: Für die Militärwehrsteuer
  c: Für die Motorwagensteuer
  d: Für die Mehrwertsteuer
correct: d
explanation_de: MWST bedeutet Mehrwertsteuer. Sie wird auf den meisten Waren und Dienstleistungen erhoben
  und ist im Preis enthalten. Sie ist eine wichtige Einnahmequelle des Bundes.
