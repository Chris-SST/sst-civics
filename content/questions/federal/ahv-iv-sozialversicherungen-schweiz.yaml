id: ahv-iv-sozialversicherungen-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche Aussage über die Sozialversicherungen der Schweiz stimmt?
options_de:
  a: AHV und IV gehören zu den Sozialversicherungen der Schweiz.
  b: AHV und IV werden nur von den Gemeinden geführt.
  c: AHV und IV sind private Versicherungen ohne gesetzliche Grundlage.
  d: AHV und IV sind nur für Selbstständige gedacht.
correct: a
explanation_de: AHV steht für Alters- und Hinterlassenenversicherung, IV für Invalidenversicherung. Beide
  sind im Bundesrecht geregelt und gehören zum staatlichen Sozialversicherungssystem.
