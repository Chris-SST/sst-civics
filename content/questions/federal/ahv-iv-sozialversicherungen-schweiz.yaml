    reasoning: Die AHV (Alters- und Hinterlassenenversicherung) und die IV (Invalidenversicherung) sind
      gesetzlich geregelte, obligatorische Sozialversicherungen des Bundes und gelten für die gesamte
      Bevölkerung, nicht nur für Selbstständige oder private Versicherte.
  source:
    verdict: supported
    note: Quelle 2 nennt AHV und IV als staatliche Vorsorge (1. Säule), deren Beiträge und Leistungen
      das Gesetz vorschreibt. Quelle 1 beschreibt die AHV als Teil des schweizerischen Sozialversicherungssystems,
      das auf dem AHV-Gesetz beruht und vom BSV beaufsichtigt wird. Das stützt Antwort a und widerlegt
      b, c und d.
