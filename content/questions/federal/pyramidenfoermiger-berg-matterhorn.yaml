topic: bund.geografie.landschaft
question_de: Welcher Schweizer Berg ist für seine markante Pyramidenform bekannt?
options_de:
  a: Eiger
  b: Matterhorn
  c: Pilatus
  d: Säntis
correct: b
explanation_de: Das Matterhorn bei Zermatt im Wallis hat eine steile, pyramidenförmige Spitze. Es gehört
  zu den bekanntesten Bergen der Schweiz. Eiger, Säntis und Pilatus sehen anders aus.
