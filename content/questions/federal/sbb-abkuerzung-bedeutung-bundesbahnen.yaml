canton: null
topic: bund.alltag
question_de: Wofür steht die Abkürzung «SBB», die man auf Zügen und Bahnhöfen in der Schweiz sieht?
options_de:
  a: Schweizer Busbetriebe
  b: Schweizerische Bundesbahnen
  c: Schweizerische Bahn- und Busbetriebe
  d: Schweizer Bergbahnen
correct: b
explanation_de: SBB steht für Schweizerische Bundesbahnen. Das Unternehmen betreibt einen grossen Teil
  des Schweizer Bahnnetzes und gehört dem Bund. Daneben gibt es weitere Bahnunternehmen, zum Beispiel
  die BLS oder die Rhätische Bahn.
