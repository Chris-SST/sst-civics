topic: bund.geschichte.weltkriege_neutralitaet
question_de: Welche Wochenarbeitszeit galt in der Schweiz nach dem Landesstreik von 1918?
options_de:
  a: 48 Stunden
  b: 54 Stunden
  c: 60 Stunden
  d: 40 Stunden
correct: a
explanation_de: Der Landesstreik von 1918 war ein Generalstreik der Arbeiterschaft. Eine der Forderungen,
  die danach umgesetzt wurden, war die 48-Stunden-Woche. Davor waren deutlich längere Arbeitszeiten üblich.
