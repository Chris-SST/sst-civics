id: parteien-vertreten-interessen-bevoelkerung
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Welche Aufgabe haben politische Parteien in der Demokratie?
options_de:
  a: Sie sprechen Recht in Streitfällen
  b: Sie vertreten die unterschiedlichen Interessen der Bevölkerung
  c: Sie führen die eidgenössischen Abstimmungen durch
  d: Sie setzen die Gesetze im Alltag durch
correct: b
explanation_de: Parteien bündeln die verschiedenen Interessen und Meinungen der Bevölkerung und bringen
  sie in die Politik ein. Gesetze durchsetzen ist Sache der Behörden, Recht sprechen Sache der Gerichte.
