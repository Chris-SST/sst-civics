id: ergaenzungsleistungen-existenzminimum-rente-reicht-nicht
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wer kann in der Schweiz Ergänzungsleistungen erhalten?
options_de:
  a: Personen, die ihre Stelle verloren haben und Arbeitslosentaggelder beziehen
  b: Alle Personen, die älter als 50 Jahre sind
  c: Personen, deren AHV- oder IV-Rente das Existenzminimum nicht deckt
  d: Alle Personen, die Sozialhilfe beziehen
correct: c
explanation_de: Ergänzungsleistungen helfen Personen, bei denen die AHV- oder IV-Rente und das übrige
  Einkommen nicht zum Leben reichen. Sie sind ein Rechtsanspruch und keine Sozialhilfe. Sie werden zur
  Rente hinzu ausbezahlt.
