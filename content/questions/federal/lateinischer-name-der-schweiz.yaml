id: lateinischer-name-der-schweiz
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Wie lautet der offizielle lateinische Name der Schweizerischen Eidgenossenschaft?
options_de:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
correct: c
explanation_de: Der lateinische Name lautet Confoederatio Helvetica. Davon stammt das Kürzel CH, das man
  zum Beispiel auf Autokennzeichen und bei Internetadressen findet. Der Name wird verwendet, weil er in
  allen Landessprachen gleich ist.
