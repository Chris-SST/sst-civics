id: lateinischer-name-der-schweiz
version: 2
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Wie heisst die Schweizerische Eidgenossenschaft auf Latein?
options_de:
  a: Helvetia Unita
  b: Res Publica Helvetica
  c: Confoederatio Helvetica
  d: Respublica Alpina
correct: c
explanation_de: Auf Latein heisst die Schweiz Confoederatio Helvetica. Davon kommt die Abkürzung CH, die
  man zum Beispiel auf Autokennzeichen und bei Internetadressen (.ch) sieht. Man braucht den lateinischen
  Namen, weil er neutral ist und keine der vier Landessprachen bevorzugt.
