id: demokratie-bevoelkerung-waehlt-parlament
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Was gehört in einer Demokratie wie der Schweiz zu den Rechten der Bevölkerung?
options_de:
  a: Sie ernennt die Richter des Bundesgerichts durch das Los.
  b: Sie bestimmt die Gesetze allein, ohne das Parlament.
  c: Sie bestimmt ihr Parlament durch Wahlen.
  d: Sie wählt die Armeeführung direkt.
correct: c
explanation_de: In der Demokratie wählt die Bevölkerung ihre Vertreterinnen und Vertreter ins Parlament.
  Auf Bundesebene sind dies der Nationalrat und der Ständerat. Das Parlament erlässt dann im Namen des
  Volkes die Bundesgesetze.
