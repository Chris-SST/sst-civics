id: volksinitiative-sammelfrist-monate
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie lange haben die Initiantinnen und Initianten Zeit, um die Unterschriften für eine eidgenössische
  Volksinitiative zu sammeln?
options_de:
  a: 6 Monate
  b: 12 Monate
  c: 18 Monate
  d: 36 Monate
correct: c
explanation_de: Die Sammelfrist beträgt 18 Monate ab der Veröffentlichung im Bundesblatt. Schaffen sie
  die nötigen 100 000 Unterschriften in dieser Zeit nicht, kommt die Initiative nicht zustande.
