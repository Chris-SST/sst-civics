status: in_review
difficulty: 2
checks:
  independent_answer:
    option: c
    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Für eine eidgenössische Volksinitiative müssen innert 18 Monaten seit der Veröffentlichung
      im Bundesblatt 100'000 gültige Unterschriften gesammelt werden (Art. 139 BV, Art. 71 BPR).
  source:
    verdict: supported
    note: Quelle 1 nennt ausdrücklich 18 Monate für 100 000 gültige Unterschriften. Der Beginn der Frist
      ab Veröffentlichung im Bundesblatt wird auf der Seite nicht erwähnt, ändert aber nichts an der richtigen
      Antwort.
