    reasoning: Das öffentliche Verbreiten unwahrer Tatsachen über eine Person verletzt deren Ehre und
      Ruf und kann als üble Nachrede oder Verleumdung (Art. 173 ff. StGB) sowie als Persönlichkeitsverletzung
      (Art. 28 ZGB) rechtswidrig sein, unabhängig vom Amt oder vom Medium.
  source:
    verdict: unclear
    note: Quelle 1 sagt nur, dass man seine Meinung "im Rahmen des Gesetzes" mitteilen darf, und äussert
      sich nicht zu unwahren Tatsachen, Ehre oder Ruf. Der Auszug aus dem Strafgesetzbuch (Quelle 2) enthält
      nur Fragmente, etwa zum Rückzug unwahrer Äusserungen, aber keinen vollständigen Artikel zu Ehrverletzung
      oder Verleumdung. Die Antwort ist daher nicht eindeutig belegt.
