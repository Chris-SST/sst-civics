id: unwahre-behauptungen-ueber-andere-verbreiten
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Person verbreitet öffentlich unwahre Tatsachen über eine andere Person. Wie ist das
  in der Schweiz zu beurteilen?
options_de:
  a: Es ist rechtswidrig, weil es die Ehre und den Ruf der Person verletzt.
  b: Es ist erlaubt, solange die Person kein Amt hat.
  c: Es ist erlaubt, wenn es nur im Internet geschieht.
  d: Es ist von der Meinungsfreiheit gedeckt und immer erlaubt.
correct: a
explanation_de: Die Meinungsfreiheit schützt nicht das Verbreiten unwahrer Tatsachen über andere. Wer
  das tut, verletzt deren Persönlichkeit und kann rechtlich belangt werden. Das gilt auch im Internet.
