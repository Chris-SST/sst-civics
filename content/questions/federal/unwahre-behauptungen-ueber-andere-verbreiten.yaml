id: unwahre-behauptungen-ueber-andere-verbreiten
version: 2
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Person verbreitet wider besseres Wissen unwahre Tatsachen über jemanden, die geeignet
  sind, seinen Ruf zu schädigen. Ist das in der Schweiz erlaubt?
options_de:
  a: Nein, das ist als Verleumdung strafbar.
  b: Ja, solange die betroffene Person kein öffentliches Amt hat.
  c: Ja, wenn es nur im Internet geschieht.
  d: Ja, das ist durch die Meinungsfreiheit immer gedeckt.
correct: a
explanation_de: Die Meinungsfreiheit erlaubt es nicht, bewusst Unwahres über andere zu verbreiten, das
  ihrem Ruf schadet. Das Strafgesetzbuch bestraft das als Verleumdung, wenn die betroffene Person es verlangt.
  Das gilt auch im Internet.
