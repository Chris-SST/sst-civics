question_de: Wessen Interessen vertreten die Gewerkschaften?
options_de:
  a: Die Interessen der Arbeitgeber
  b: Die Interessen der Gemeinden
  c: Die Interessen der Banken
  d: Die Interessen der Arbeitnehmenden
correct: d
explanation_de: Gewerkschaften setzen sich für die Anliegen der Arbeitnehmenden ein, zum Beispiel bei
  Löhnen und Arbeitsbedingungen. Sie verhandeln oft mit den Arbeitgebern über Gesamtarbeitsverträge.
