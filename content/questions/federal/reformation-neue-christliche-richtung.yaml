question_de: Welche christliche Richtung entstand aus der Reformation im 16. Jahrhundert?
options_de:
  a: Das koptische Christentum
  b: Das römisch-katholische Christentum
  c: Das orthodoxe Christentum
  d: Das protestantische Christentum
correct: d
explanation_de: Die Reformation war eine Erneuerungsbewegung innerhalb der Kirche des Mittelalters. Aus
  ihr ging das protestantische Christentum hervor. In Zürich wirkte dabei Huldrych Zwingli.
