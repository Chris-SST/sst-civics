question_de: Wer gilt als Gründer des Roten Kreuzes in Genf?
options_de:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Huldrych Zwingli
  d: Henry Dunant
correct: d
explanation_de: Der Genfer Henry Dunant sah 1859 nach der Schlacht von Solferino, wie viele Verwundete
  ohne Hilfe blieben. Er setzte sich darum für ihre Pflege ein, und 1863 entstand in Genf das Rote Kreuz.
  Dafür erhielt Dunant 1901 zusammen mit Frédéric Passy den ersten Friedensnobelpreis.
