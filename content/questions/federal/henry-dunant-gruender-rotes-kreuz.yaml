topic: bund.geschichte.bundesstaat
question_de: Welche Person gründete das Rote Kreuz in Genf?
options_de:
  a: Alfred Escher
  b: Johann Heinrich Pestalozzi
  c: Guillaume-Henri Dufour
  d: Henry Dunant
correct: d
explanation_de: Henry Dunant aus Genf setzte sich nach der Schlacht von Solferino 1859 für die Pflege
  von Verwundeten ein. Daraus entstand das Rote Kreuz, das für die humanitäre Tradition der Schweiz steht.
  Dunant erhielt 1901 den ersten Friedensnobelpreis.
