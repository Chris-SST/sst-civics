      - 'Klein: Die Themenliste enthält keine Tatsache (keine). Die Frage prüft aber ein Detail des Abstimmungsverfahrens,
        das für den Test eher fein ist. Das ist vertretbar, sollte aber dem Umfang des Tests entsprechen.'
