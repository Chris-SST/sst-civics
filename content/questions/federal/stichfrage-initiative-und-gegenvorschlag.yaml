      - 'Klein: Die Antwort b) ist wenig plausibel, weil die Kantone als Stände bei Verfassungsänderungen
        immer mitstimmen; besser wäre ein glaubwürdigerer Ablenker, etwa «Sie entscheidet, ob die Initiative
        zurückgezogen wird».'
