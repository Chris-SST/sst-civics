id: stichfrage-initiative-und-gegenvorschlag
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Bei einer Abstimmung über eine Volksinitiative und einen direkten Gegenvorschlag gibt es
  eine Stichfrage. Wozu dient sie?
options_de:
  a: Sie entscheidet, ob die Abstimmung wiederholt werden muss
  b: Sie entscheidet, ob die Kantone überhaupt mitstimmen dürfen
  c: Sie entscheidet, welche Vorlage gilt, wenn beide angenommen werden
  d: Sie entscheidet, ob die Unterschriften noch einmal geprüft werden
correct: c
explanation_de: Die Stimmberechtigten dürfen sowohl der Initiative als auch dem Gegenvorschlag zustimmen.
  Mit der Stichfrage geben sie an, welche Vorlage in Kraft treten soll, falls beide angenommen werden.
  So können Stimmen nicht zwischen zwei ähnlichen Vorlagen verloren gehen.
