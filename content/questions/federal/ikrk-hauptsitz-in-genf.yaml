topic: bund.international
question_de: In welchem Land hat das Internationale Komitee vom Roten Kreuz (IKRK) seinen Hauptsitz?
options_de:
  a: In den Niederlanden
  b: In der Schweiz
  c: In Österreich
  d: In Belgien
correct: b
explanation_de: Das IKRK hat seinen Hauptsitz in Genf in der Schweiz. Es wurde 1863 in Genf gegründet
  und schützt Opfer von bewaffneten Konflikten. Die Schweiz unterstützt seine Arbeit.
