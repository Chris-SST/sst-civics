id: economiesuisse-wirtschaftsdachverband
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Was ist Economiesuisse?
options_de:
  a: Eine Arbeitslosenkasse des Bundes
  b: Das Bundesamt für Wirtschaft
  c: Der Wirtschaftsdachverband, der die Anliegen der Unternehmen vertritt
  d: Eine Gewerkschaft für Angestellte im Detailhandel
correct: c
explanation_de: Economiesuisse ist der Dachverband der Schweizer Wirtschaft und vertritt die Interessen
  der Unternehmen. Er ist keine staatliche Stelle und keine Gewerkschaft.
