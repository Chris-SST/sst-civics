id: neue-bundesgesetze-beschluss-kammern
version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Wer beschliesst die meisten neuen Bundesgesetze?
options_de:
  a: Das Bundesgericht
  b: Der Bundesrat allein
  c: Die Kantonsparlamente
  d: Der Nationalrat und der Ständerat
correct: d
explanation_de: Die meisten neuen Bundesgesetze werden von beiden Kammern des Parlaments beschlossen.
  Der Bundesrat bereitet Vorlagen vor, entscheidet aber nicht allein. Gegen ein Gesetz kann das Volk ein
  Referendum ergreifen.
