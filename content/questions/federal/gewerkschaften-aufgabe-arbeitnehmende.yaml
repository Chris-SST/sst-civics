topic: bund.sozial.wirtschaft_arbeit
question_de: Welche Aufgabe haben Gewerkschaften in der Schweiz?
options_de:
  a: Sie setzen sich für die Anliegen der Arbeitnehmenden ein.
  b: Sie zahlen Arbeitslosen das Taggeld aus.
  c: Sie legen die Steuersätze für Unternehmen fest.
  d: Sie vertreten die Anliegen der Arbeitgeber gegenüber dem Bund.
correct: a
explanation_de: Gewerkschaften sind Organisationen der Arbeitnehmenden. Sie vertreten deren Interessen,
  zum Beispiel bei Löhnen und Arbeitsbedingungen, und verhandeln oft Gesamtarbeitsverträge mit.
