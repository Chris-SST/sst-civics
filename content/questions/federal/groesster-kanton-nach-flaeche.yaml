question_de: Welcher Kanton hat die grösste Fläche aller Schweizer Kantone?
options_de:
  a: Tessin
  b: Wallis
  c: Bern
  d: Graubünden
correct: d
explanation_de: Graubünden ist flächenmässig der grösste Kanton der Schweiz. Er liegt ganz in den Alpen
  und hat viele Täler und Berge. Auch Wallis, Bern und Tessin sind gross, aber kleiner als Graubünden.
