id: fasnacht-umzuege-mit-masken
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Was gehört typischerweise zur Schweizer Fasnacht?
options_de:
  a: Umzüge, bei denen die Teilnehmenden Masken tragen
  b: Das Schmücken von Tannenbäumen auf dem Dorfplatz
  c: Feuerwerk um Mitternacht am 1. August
  d: Das Anzünden grosser Kerzen in Kirchen
correct: a
explanation_de: An der Fasnacht ziehen Gruppen in Umzügen durch die Strassen und tragen dabei Masken und
  Kostüme. Die Basler Fasnacht ist ein bekanntes Beispiel für diesen Brauch.
