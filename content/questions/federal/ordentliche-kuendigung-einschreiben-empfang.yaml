    reasoning: Eine Kündigung muss der Gegenseite zugehen, und den Empfang kann man am besten per Einschreiben
      oder durch schriftliche Empfangsbestätigung nachweisen, während die anderen Wege keinen verlässlichen
      Nachweis liefern.
