id: ordentliche-kuendigung-einschreiben-empfang
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Wie sollte eine ordentliche Kündigung eines Arbeitsverhältnisses zugestellt werden, damit
  man den Empfang nachweisen kann?
options_de:
  a: Über eine Mitteilung an die Gemeindeverwaltung
  b: Per Einschreiben, oder die andere Seite bestätigt den Empfang schriftlich
  c: Per einfacher E-Mail ohne Bestätigung
  d: Mündlich im Gespräch unter vier Augen
correct: b
explanation_de: Mit einem Einschreiben oder einer schriftlichen Empfangsbestätigung lässt sich beweisen,
  dass die Kündigung angekommen ist. Das ist wichtig, weil Kündigungsfristen ab dem Empfang laufen.
