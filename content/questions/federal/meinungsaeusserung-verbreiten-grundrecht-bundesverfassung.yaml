id: meinungsaeusserung-verbreiten-grundrecht-bundesverfassung
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Welches von der Bundesverfassung gesicherte Grundrecht erlaubt es, die eigene Ansicht frei
  zu äussern und zu verbreiten?
options_de:
  a: Die Meinungsfreiheit
  b: Das Stimmrecht
  c: Die Eigentumsgarantie
  d: Die Niederlassungsfreiheit
correct: a
explanation_de: Die Meinungsfreiheit erlaubt es, die eigene Meinung frei zu äussern und zu verbreiten.
  Sie ist in Artikel 16 der Bundesverfassung festgehalten. Das Stimmrecht betrifft dagegen die Teilnahme
  an Wahlen und Abstimmungen.
