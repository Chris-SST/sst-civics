id: grundversicherung-pflicht-einwohner
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Für wen gilt in der Schweiz die obligatorische Grundversicherung für medizinische Behandlungen?
options_de:
  a: Nur für Personen mit Schweizer Bürgerrecht
  b: Nur für Erwerbstätige mit einem Lohn
  c: Nur für Personen mit niedrigem Einkommen
  d: Für alle Einwohnerinnen und Einwohner der Schweiz
correct: d
explanation_de: Die obligatorische Krankenpflegeversicherung gilt für alle Personen, die in der Schweiz
  wohnen. Das Bürgerrecht, die Erwerbstätigkeit und das Einkommen spielen dafür keine Rolle.
