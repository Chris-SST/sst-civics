id: notruf-polizei-nummer
version: 1
scope: federal
canton: null
topic: bund.alltag
question_de: Welche Telefonnummer wählt man in der Schweiz, wenn man im Notfall die Polizei braucht?
options_de:
  a: '143'
  b: '118'
  c: '144'
  d: '117'
correct: d
explanation_de: Die Polizei erreicht man in der ganzen Schweiz unter der Nummer 117. Die Feuerwehr hat
  die 118, die Sanität die 144. Die 143 ist die Nummer der Dargebotenen Hand für Menschen in einer Krise.
