topic: bund.sozial.gesundheit
question_de: Welche Bundesbehörde ist für Gesundheitsfragen zuständig?
options_de:
  a: Das Bundesamt für Umwelt (BAFU)
  b: Das Staatssekretariat für Migration (SEM)
  c: Das Bundesamt für Statistik (BFS)
  d: Das Bundesamt für Gesundheit (BAG)
correct: d
explanation_de: Das Bundesamt für Gesundheit (BAG) ist die zuständige Bundesbehörde für Gesundheitsfragen.
  Es beaufsichtigt zum Beispiel die soziale Krankenversicherung.
