topic: bund.geografie.landschaft
question_de: Wie gross ist die Entfernung zwischen dem östlichsten und dem westlichsten Punkt der Schweiz
  ungefähr?
options_de:
  a: Rund 250 Kilometer
  b: Rund 350 Kilometer
  c: Rund 550 Kilometer
  d: Rund 150 Kilometer
correct: b
explanation_de: Die Schweiz misst von Osten nach Westen rund 350 Kilometer. Sie ist also ein eher kleines
  Land, das in Ost-West-Richtung länger ist als von Norden nach Süden.
