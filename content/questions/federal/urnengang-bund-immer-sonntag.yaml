topic: bund.demokratie.wahlen
question_de: An welchem Wochentag finden eidgenössische Abstimmungen und Wahlen in der Schweiz statt?
options_de:
  a: Immer an einem Sonntag
  b: Immer an einem Samstag
  c: Immer an einem Freitag
  d: An einem Wochentag, den jeder Kanton selbst wählt
correct: a
explanation_de: Urnengänge auf Bundesebene finden stets an einem Sonntag statt. So können möglichst viele
  Stimmberechtigte teilnehmen, und der Termin ist für alle gleich.
