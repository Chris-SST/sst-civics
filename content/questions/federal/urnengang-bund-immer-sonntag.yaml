    reasoning: Eidgenössische Abstimmungen und Wahlen finden in der Schweiz immer an einem Sonntag statt,
      wobei die brieflichen Stimmabgabe schon vorher möglich ist und der Bundesrat die Termine im Voraus
      festlegt.
  source:
    verdict: supported
    note: 'Quelle 3 (Zürcher Einbürgerungsbroschüre) sagt ausdrücklich: «Abstimmungen und Wahlen finden
      immer an einem Sonntag statt.» Quelle 1 spricht von «Abstimmungssonntagen» und Quelle 2 nennt für
      die Nationalratswahlen den zweitletzten Sonntag im Oktober, beides passt dazu. Die Aussage zur Teilnahme
      möglichst vieler Stimmberechtigter in der Erklärung ist aber in keiner Quelle belegt.'
