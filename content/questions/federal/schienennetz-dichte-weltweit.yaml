topic: bund.geografie.landschaft
question_de: Wofür ist das Schweizer Schienennetz im internationalen Vergleich bekannt?
options_de:
  a: Es ist das weltweit am engmaschigsten ausgebaute Schienennetz.
  b: Es ist das einzige Schienennetz, das vollständig durch Tunnel führt.
  c: Es ist das längste Schienennetz in Europa.
  d: Es ist das älteste Schienennetz der Welt.
correct: a
explanation_de: Auf einer kleinen Fläche gibt es sehr viele Bahnlinien und Bahnhöfe. Darum gilt das Schweizer
  Netz als das dichteste der Welt. Die Dichte sagt aber nichts über die absolute Länge aus.
