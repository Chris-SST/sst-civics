id: pensionsalter-frauen-maenner-65
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wie hoch ist das reguläre Rentenalter in der AHV für Frauen und Männer?
options_de:
  a: Für Frauen 64 Jahre, für Männer 65 Jahre
  b: Für Frauen und Männer 65 Jahre
  c: Für Frauen und Männer 63 Jahre
  d: Für Frauen und Männer 67 Jahre
correct: b
explanation_de: Das reguläre Rentenalter beträgt für Frauen und Männer gleichermassen 65 Jahre. Die frühere
  Differenz bei den Frauen wird schrittweise abgebaut. Danach gilt für beide Geschlechter dasselbe Referenzalter.
