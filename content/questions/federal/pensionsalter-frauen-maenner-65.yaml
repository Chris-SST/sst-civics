id: pensionsalter-frauen-maenner-65
version: 3
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welches Rentenalter (heute «Referenzalter» genannt) gilt in der AHV ab 2028 für Frauen und
  Männer?
options_de:
  a: Frauen 64 Jahre, Männer 65 Jahre
  b: Frauen und Männer 65 Jahre
  c: Frauen und Männer 63 Jahre
  d: Frauen und Männer 67 Jahre
correct: b
explanation_de: Seit der Reform AHV 21 heisst das Rentenalter offiziell «Referenzalter». Ab 2025 steigt
  es für Frauen jedes Jahr um drei Monate, bis es 65 Jahre erreicht. Ab 2028 haben Frauen und Männer das
  gleiche Referenzalter von 65 Jahren.
