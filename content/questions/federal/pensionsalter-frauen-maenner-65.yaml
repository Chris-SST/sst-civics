id: pensionsalter-frauen-maenner-65
version: 2
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welches AHV-Rentenalter gilt ab dem Jahr 2028 für Frauen und Männer?
options_de:
  a: Für Frauen 64 Jahre, für Männer 65 Jahre
  b: Für Frauen und Männer 65 Jahre
  c: Für Frauen und Männer 63 Jahre
  d: Für Frauen und Männer 67 Jahre
correct: b
explanation_de: Mit der Reform AHV 21 steigt das Rentenalter der Frauen von 2025 bis 2028 schrittweise
  von 64 auf 65 Jahre. Ab 2028 haben Frauen und Männer dasselbe Referenzalter von 65 Jahren.
