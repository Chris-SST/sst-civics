    reasoning: Mit der AHV-21-Reform wird das Referenzalter der Frauen schrittweise bis 2028 auf 65 Jahre
      angehoben und damit dem der Männer angeglichen, sodass ab 2028 für Frauen und Männer 65 Jahre gelten.
  source:
    verdict: supported
    note: Quelle 1 (BSV) nennt für Frauen und Männer das Referenzalter 65. Es wird für Frauen ab 2025
      schrittweise von 64 auf 65 angehoben, und ab 2028 (Jahrgang 1964 und jünger) gilt 65 Jahre. Quelle
      2 bestätigt die schrittweise Erhöhung bis 2028 auf 65 Jahre.
    at: *id001
    model: claude-sonnet-5-5
    version: 2
  panel:
    verdict: fix
    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Tatsache aus der Themenliste ist für 2026 ungenau, weil das Referenzalter der Frauen
        2026 erst 64 Jahre und 6 Monate beträgt; die Frage löst das gut mit «ab dem Jahr 2028», die Themenliste
        sollte aber ebenfalls «ab 2028» ergänzen.'
      - 'Klein: In der Erklärung könnte man kurz ergänzen, dass man die Rente ab 63 Jahren früher beziehen
        kann, dann aber mit Kürzung, damit Antwort c) nicht verwirrt.'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Tatsache aus der Themenliste ist 2026 noch ungenau, weil das Referenzalter der Frauen
        erst ab 2028 bei 65 Jahren liegt; die Frage löst das mit «ab dem Jahr 2028» richtig, die Themenliste
        sollte aber entsprechend ergänzt werden.'
      - 'Klein: Die Erklärung verwendet den Begriff «Referenzalter», die Frage aber «Rentenalter»; ein
        kurzer Hinweis wie «Referenzalter (früher Rentenalter)» würde den Zusammenhang klarer machen.'
      - 'Klein: Die Erklärung könnte konkret sagen, dass das Rentenalter der Frauen jedes Jahr um 3 Monate
        steigt; so wird das Wort «schrittweise» verständlicher.'
    - role: second
      model: claude-sonnet-5-5
      verdict: fix
      issues:
      - 'Die Erklärung sagt, das Rentenalter der Frauen steige «von 2025 bis 2028» von 64 auf 65 Jahre.
        Das ist ungenau: Die Erhöhung läuft über die Jahrgänge 1961 bis 1963 (2025: 64 Jahre 3 Monate,
        2026: 64 Jahre 6 Monate, 2027: 64 Jahre 9 Monate), und erst ab 2028 (Jahrgang 1964) gilt 65 Jahre.
        Vorschlag: «Seit 2025 steigt das Referenzalter der Frauen schrittweise um je 3 Monate pro Jahrgang;
        ab 2028 gilt für Frauen und Männer 65 Jahre.»'
      - 'Die Frage fragt nach dem «AHV-Rentenalter», die amtliche Quelle verwendet aber neu den Begriff
        «Referenzalter». Vorschlag: Begriff in Frage und Erklärung einmal erklären, z. B. «Welches AHV-Rentenalter
        (Referenzalter) gilt ab 2028 für Frauen und Männer?».'
      - 'Klein: Die Frage ist an das Jahr 2028 gebunden, obwohl die Themenliste nur das gleiche reguläre
        Pensionsalter von 65 Jahren für Frauen und Männer verlangt. Vorschlag: einfacher fragen, z. B.
        «Wie hoch ist das ordentliche Rentenalter (Referenzalter) für Frauen und Männer in der Schweiz?»
        und die Übergangsphase nur in der Erklärung erwähnen.'
      - 'Klein: Die amtliche Broschüre (Stand März 2023) nennt noch «Frauen 64, Männer 65 (bis 2028 schrittweise
        auf 65)». Das ist veraltet, aber die Antwort b) bleibt richtig; in der Erklärung kann man das
        kurz erwähnen, damit Lernende nicht verwirrt sind.'
    round: 2
    at: 2026-11-02
    version: 2
review:
  action: ai_panel
  note: 'Rewritten: Alle Beanstandungen sind berechtigt. Die Tatsache in der Themenliste ist für 2026
    ungenau: Wegen der Übergangszeit nach AHV 21 liegt das Referenzalter der Frauen 2026 bei 64 Jahren
    und 6 Monaten (Jahrgang 1962). Erst ab 2028 (Jahrgang 1964 und jünger) gilt für alle 65. Die Frage
    fragt deshalb nach dem Stand ab 2028. Damit ist Antwort a) eindeutig falsch. Die widersprüchliche
    Erklärung wurde neu geschrieben. Die Themenliste selbst kann hier nicht geändert werden. Sie sollte
    aber auf «65 Jahre für beide ab 2028» präzisiert werden.'
  at: 2026-11-02
