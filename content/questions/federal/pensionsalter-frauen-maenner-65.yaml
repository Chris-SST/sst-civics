    reasoning: Mit der AHV-21-Reform gilt seit 2024 für Frauen und Männer ein einheitliches Referenzalter
      von 65 Jahren, wobei das Rentenalter der Frauen schrittweise von 64 auf 65 Jahre angehoben wird
      (Übergangsphase bis 2028).
  source:
    verdict: supported
    note: Quelle 1 (BSV, AHV 21) nennt das Referenzalter für Frauen und Männer mit 65 Jahren und beschreibt
      die schrittweise Anhebung für Frauen von 64 auf 65 bis 2028. Das deckt Antwort b und die Erklärung.
      Die Zürcher Broschüre (Quelle 2) beschreibt noch den Zwischenstand mit 64 Jahren für Frauen und
      erwähnt die Erhöhung bis 2028.
