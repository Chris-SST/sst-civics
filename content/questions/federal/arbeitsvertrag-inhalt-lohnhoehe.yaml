id: arbeitsvertrag-inhalt-lohnhoehe
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Was wird unter anderem im Arbeitsvertrag zwischen Arbeitgeber und Arbeitnehmerin festgelegt?
options_de:
  a: Die Höhe des Lohns
  b: Die Höhe der AHV-Rente
  c: Die Höhe der Mehrwertsteuer
  d: Die Höhe der Krankenkassenprämie
correct: a
explanation_de: Im Arbeitsvertrag werden die wichtigsten Bedingungen der Arbeit vereinbart, zum Beispiel
  die Tätigkeit, die Arbeitszeit und der Lohn. AHV-Rente, Mehrwertsteuer und Krankenkassenprämie werden
  nicht im Arbeitsvertrag bestimmt.
