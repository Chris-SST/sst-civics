id: auslaender-kein-stimmrecht-national
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Dürfen Ausländerinnen und Ausländer, die seit Jahren in der Schweiz leben, an eidgenössischen
  Abstimmungen teilnehmen?
options_de:
  a: Ja, aber nur bei Abstimmungen und nicht bei Wahlen.
  b: Ja, wenn sie eine Niederlassungsbewilligung haben.
  c: Ja, wenn sie Steuern bezahlen.
  d: Nein, auf nationaler Ebene haben sie kein Stimmrecht.
correct: d
explanation_de: Das Stimmrecht auf nationaler Ebene ist an das Schweizer Bürgerrecht gebunden. Ausländerinnen
  und Ausländer können es erst nach einer Einbürgerung ausüben.
