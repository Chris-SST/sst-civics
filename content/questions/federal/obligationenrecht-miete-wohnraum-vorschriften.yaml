id: obligationenrecht-miete-wohnraum-vorschriften
version: 2
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: In welchem Gesetz sind die Regeln für die Miete einer Wohnung festgehalten?
options_de:
  a: Im Obligationenrecht
  b: Im Arbeitsgesetz
  c: Im Strafgesetzbuch
  d: Im Strassenverkehrsgesetz
correct: a
explanation_de: Die Regeln zur Miete von Wohnungen stehen im Obligationenrecht (OR). Dort steht zum Beispiel,
  was im Mietvertrag gilt, wie hoch der Mietzins sein darf und wie man kündigen kann. Das Zivilgesetzbuch
  (ZGB) regelt dagegen vor allem Themen wie Familie, Heirat und Erbe.
