id: obligationenrecht-miete-wohnraum-vorschriften
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: In welchem Gesetz stehen die Vorschriften zur Miete von Wohnraum?
options_de:
  a: Im Obligationenrecht
  b: In der Bundesverfassung allein
  c: Im Strafgesetzbuch
  d: Im Schweizerischen Strassenverkehrsgesetz
correct: a
explanation_de: Das Mietrecht ist im Obligationenrecht geregelt. Dort finden sich zum Beispiel Regeln
  zu Mietvertrag, Mietzins und Kündigung. Das Obligationenrecht ist der fünfte Teil des Zivilgesetzbuchs,
  aber ein eigenes Gesetz.
