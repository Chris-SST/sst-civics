id: empfehlung-bundesrat-parlament-volksinitiative
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wer gibt den Stimmberechtigten vor der Abstimmung über eine eidgenössische Volksinitiative
  eine Empfehlung ab, ob sie die Initiative annehmen oder ablehnen sollen?
options_de:
  a: Der Bundesrat und das Parlament
  b: Die Kantonsregierungen
  c: Die Bundeskanzlei allein
  d: Das Bundesgericht
correct: a
explanation_de: Nachdem eine Volksinitiative zustande gekommen ist, nehmen Bundesrat und Parlament dazu
  Stellung. Das Parlament empfiehlt den Stimmberechtigten die Annahme oder die Ablehnung. Diese Empfehlung
  steht auch in den Abstimmungserläuterungen, welche die Stimmberechtigten vor der Abstimmung erhalten.
