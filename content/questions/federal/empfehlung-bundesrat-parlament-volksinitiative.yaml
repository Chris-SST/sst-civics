    reasoning: Bei eidgenössischen Volksinitiativen geben die Bundesversammlung und der Bundesrat eine
      Abstimmungsempfehlung ab, die in den Abstimmungserläuterungen an die Stimmberechtigten veröffentlicht
      wird.
  source:
    verdict: supported
    note: 'Art. 139 Abs. 5 BV in Quelle 2 sagt ausdrücklich: «Die Bundesversammlung empfiehlt die Initiative
      zur Annahme oder zur Ablehnung.» Damit ist nur Antwort a) möglich. Die Rolle des Bundesrats und
      die Abstimmungserläuterungen erwähnt der vorliegende Text allerdings nicht.'
