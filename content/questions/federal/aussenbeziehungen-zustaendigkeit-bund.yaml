    reasoning: Nach Art. 54 der Bundesverfassung sind die auswärtigen Angelegenheiten Sache des Bundes,
      während die Kantone nur in ihren eigenen Zuständigkeitsbereichen begrenzt mit dem Ausland verkehren
      dürfen.
  source:
