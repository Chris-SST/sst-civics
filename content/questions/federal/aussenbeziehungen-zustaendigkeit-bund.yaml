id: aussenbeziehungen-zustaendigkeit-bund
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Wer ist in der Schweiz grundsätzlich dafür zuständig, die Beziehungen zu anderen Staaten
  zu gestalten?
options_de:
  a: Die Konferenz der Kantonsregierungen
  b: Der Bund
  c: Die Kantone gemeinsam
  d: Die Gemeinden an der Grenze
correct: b
explanation_de: Nach der Bundesverfassung ist die Aussenpolitik Sache des Bundes. Die Kantone können in
  ihren eigenen Zuständigkeitsbereichen mit dem Ausland zusammenarbeiten, die Gesamtverantwortung liegt
  aber beim Bund.
