id: grundrecht-glaubens-gewissensfreiheit-schweiz
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Welches Grundrecht ist in der Schweiz durch die Bundesverfassung geschützt?
options_de:
  a: Das Recht auf ein Einkommen vom Staat
  b: Das Recht auf ein Auto
  c: Das Recht auf eine Arbeitsstelle
  d: Die Freiheit des Glaubens und des Gewissens
correct: d
explanation_de: Die Glaubens- und Gewissensfreiheit steht in Artikel 15 der Bundesverfassung. Der Staat
  darf niemanden zu einem Glauben zwingen. Ein Recht auf Arbeitsstelle oder Einkommen gibt es als Grundrecht
  nicht.
