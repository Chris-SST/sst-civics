  source:
    verdict: supported
    note: 'Art. 15 BV in Quelle 1 lautet: «Die Glaubens- und Gewissensfreiheit ist gewährleistet» und
      niemand darf zu einer Religionsgemeinschaft oder religiösen Handlung gezwungen werden. Dass es kein
      Grundrecht auf Arbeitsstelle oder Einkommen gibt, sagt die Quelle nicht ausdrücklich; es folgt nur
