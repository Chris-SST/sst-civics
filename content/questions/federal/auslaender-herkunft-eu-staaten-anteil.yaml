canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Woher stammt der grösste Teil der in der Schweiz wohnhaften Ausländerinnen und Ausländer?
options_de:
  a: Aus Staaten Asiens, etwa zwei Drittel
  b: Aus Staaten Afrikas, etwa die Hälfte
  c: Aus Staaten der Europäischen Union, etwa zwei Drittel
  d: Aus Staaten Amerikas, etwa ein Drittel
correct: c
explanation_de: Etwa 66 Prozent der ausländischen Wohnbevölkerung stammen aus EU-Staaten, also rund zwei
  Drittel. Der Rest kommt aus anderen europäischen Staaten und aus der übrigen Welt. Die Zahl kann sich
  mit der Zeit leicht verändern.
