    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Verfassung (Art. 139 Abs. 5 BV) spricht von «Gegenentwurf»; die Erklärung könnte ergänzen,
        dass der direkte Gegenvorschlag auch Gegenentwurf heisst, damit die Lernenden beide Begriffe kennen.'
      - 'Klein: Antwort d) erinnert an die Ungültigerklärung einer Initiative (Art. 139 Abs. 3 BV), die
        das Parlament tatsächlich beschliessen kann; die Frage bleibt wegen «gegenüberstellen» eindeutig,
        doch ein anderer Ablenker wäre klarer, zum Beispiel «Eine Initiative des Bundesrats zum gleichen
        Thema».'
      - 'Klein: Es ist keine Tatsache aus der Themenliste angegeben, deshalb lässt sich der Umfang nicht
        prüfen; die passende Tatsache zum Gegenvorschlag sollte nachgetragen werden.'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Antwort d) ist nicht ganz eindeutig falsch, weil das Parlament eine Initiative in seltenen
        Fällen für ungültig erklären kann (z. B. wegen Verletzung der Einheit der Materie), und dann findet
        keine Abstimmung statt; besser wäre ein klar falscher Ablenker wie «Eine Änderung des Initiativtextes
        ohne Zustimmung des Initiativkomitees».'
      - 'Klein: Zur Frage ist keine Tatsache aus der Themenliste angegeben; bitte die passende Tatsache
        zu den Volksrechten (Volksinitiative, Gegenvorschlag) ergänzen, damit der Umfang geprüft werden
        kann.'
      - 'Klein: Die Frage und Antwort b) sprechen allgemein von «Gegenvorschlag», die Erklärung präzisiert
        auf den direkten Gegenvorschlag; man könnte in Antwort b) «direkten Gegenvorschlag» schreiben
        oder in der Erklärung kurz erwähnen, dass es auch indirekte Gegenvorschläge auf Gesetzesstufe
        gibt.'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die amtliche Bezeichnung in Art. 139 Abs. 5 BV ist «Gegenentwurf». Antwort b und die Erklärung
        sprechen von «Gegenvorschlag» bzw. «direkter Gegenvorschlag». Besser wäre «direkten Gegenentwurf»
        (Antwort: «Einen eigenen Gegenentwurf, über den ebenfalls abgestimmt wird»), allenfalls mit dem
        Hinweis, dass das Parlament auch einen indirekten Gegenvorschlag auf Gesetzesstufe machen kann,
        über den nicht gleichzeitig abgestimmt wird.'
      - 'Klein: Die Themenliste nennt keine Tatsache («keine»), daher lässt sich der Umfang nicht prüfen.
