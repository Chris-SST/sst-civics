    reasoning: Die Bundesversammlung kann einer Volksinitiative gemäss Art. 139 Abs. 5 und Art. 139b BV
      einen direkten Gegenentwurf gegenüberstellen, über den Volk und Stände gleichzeitig mit der Initiative
      abstimmen, wobei auch ein indirekter Gegenvorschlag auf Gesetzesstufe möglich ist.
  source:
    verdict: supported
    note: Quelle 2 (Art. 139 Abs. 5 BV) hält fest, dass die Bundesversammlung einer Initiative einen Gegenentwurf
      gegenüberstellen kann und die Stimmberechtigten gleichzeitig über Initiative und Gegenentwurf abstimmen.
      Dass der Gegenvorschlag weniger weit geht, steht nicht im Text; Quelle 1 behandelt den Gegenvorschlag
      nicht.
