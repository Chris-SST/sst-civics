id: gegenvorschlag-parlament-zur-volksinitiative
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was kann das Parlament einer eidgenössischen Volksinitiative gegenüberstellen?
options_de:
  a: Eine Verlängerung der Sammelfrist um ein weiteres Jahr
  b: Einen eigenen Gegenvorschlag, über den ebenfalls abgestimmt wird
  c: Eine zweite Unterschriftensammlung in allen Kantonen
  d: Ein Verbot, die Initiative zur Abstimmung zu bringen
correct: b
explanation_de: Das Parlament kann einer Volksinitiative einen direkten Gegenvorschlag gegenüberstellen.
  Dieser nimmt das Anliegen oft teilweise auf, geht aber weniger weit. Die Stimmberechtigten stimmen dann
  am gleichen Tag über die Initiative und den Gegenvorschlag ab.
