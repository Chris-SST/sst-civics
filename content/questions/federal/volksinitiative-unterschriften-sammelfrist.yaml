id: volksinitiative-unterschriften-sammelfrist
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie viele Unterschriften braucht eine eidgenössische Volksinitiative und wie lange darf man
  dafür sammeln?
options_de:
  a: 100 000 Unterschriften in 100 Tagen
  b: 50 000 Unterschriften in 100 Tagen
  c: 50 000 Unterschriften in 18 Monaten
  d: 100 000 Unterschriften in 18 Monaten
correct: d
explanation_de: Eine eidgenössische Volksinitiative braucht 100 000 gültige Unterschriften innerhalb von
  18 Monaten. Das fakultative Referendum braucht dagegen 50 000 Unterschriften in 100 Tagen.
