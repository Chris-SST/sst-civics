id: bern-bundesstadt-landeshauptstadt
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Welche Stadt übernimmt in der Schweiz die Rolle der Landeshauptstadt?
options_de:
  a: Bern
  b: Genf
  c: Lausanne
  d: Zürich
correct: a
explanation_de: Bern ist Sitz von Bundesrat und Bundesversammlung und wird als Bundesstadt bezeichnet.
  Die Bundesverfassung nennt keine Hauptstadt, Bern übernimmt aber diese Rolle. Zürich ist die grösste
  Stadt, Lausanne ist Sitz des Bundesgerichts.
