id: nationalhymne-schweizerpsalm
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Wie heisst die Nationalhymne der Schweiz?
options_de:
  a: Rufst du, mein Vaterland
  b: Lueget vo Bärg und Tal
  c: Vo Luzern gäg Weggis zue
  d: Schweizerpsalm
correct: d
explanation_de: Die Nationalhymne der Schweiz ist der Schweizerpsalm. Der Bundesrat hat ihn 1981 endgültig
  zur Landeshymne erklärt. Vorher wurde oft «Rufst du, mein Vaterland» gesungen.
