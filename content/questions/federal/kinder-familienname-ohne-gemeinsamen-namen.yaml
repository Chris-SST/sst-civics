id: kinder-familienname-ohne-gemeinsamen-namen
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Zwei Eheleute haben bei der Heirat keinen gemeinsamen Familiennamen bestimmt. Wer legt dann
  den Namen ihrer gemeinsamen Kinder fest?
options_de:
  a: Die Kinder erhalten automatisch den Namen des Vaters.
  b: Das Zivilstandsamt entscheidet nach dem Alphabet der Namen.
  c: Die Eheleute wählen den Namen ihrer Kinder selbst.
  d: Die Kinder erhalten automatisch den Namen der Mutter.
correct: c
explanation_de: Haben die Eheleute keinen gemeinsamen Familiennamen bestimmt, müssen sie den Namen der
  Kinder selbst wählen. Das Gesetz legt ihn nicht automatisch fest. Die Regeln stehen im Schweizerischen
  Zivilgesetzbuch.
