topic: bund.demokratie.foederalismus
question_de: Welche Aufgabe gehört zu den zentralen Aufgaben des Bundes?
options_de:
  a: Die Organisation der örtlichen Schulen
  b: Der Schutz des Landes nach innen und nach aussen
  c: Der Betrieb der Gemeindestrassen
  d: Die Verwaltung der Einwohnerregister der Gemeinden
correct: b
explanation_de: Der Bund sorgt für die Sicherheit des Landes nach aussen, zum Beispiel mit der Armee,
  und für die innere Sicherheit. Die Schulen, die Gemeindestrassen und die Einwohnerregister sind hingegen
  vor allem Sache der Kantone und Gemeinden.
