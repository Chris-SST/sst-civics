  source:
    verdict: supported
    note: Quelle 1 (Bundesverfassung) sagt in Art. 2, dass die Eidgenossenschaft die Unabhängigkeit und
      die Sicherheit des Landes wahrt. Die Armee und deren Einsatz sind Sache des Bundes, und die Armee
      unterstützt die zivilen Behörden bei der inneren Sicherheit. Zu Schulen, Gemeindestrassen und Einwohnerregistern
      äussert sich der Text nicht ausdrücklich. Er hält aber fest, dass die Kantone alle Rechte ausüben,
      die nicht dem Bund übertragen sind.
