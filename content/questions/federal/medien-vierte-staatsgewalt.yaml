id: medien-vierte-staatsgewalt
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Die Medien werden oft mit einem besonderen Ausdruck bezeichnet, der ihre Rolle im Staat beschreibt.
  Welcher Ausdruck ist das?
options_de:
  a: Zweite Staatsgewalt
  b: Oberste Staatsgewalt
  c: Erste Staatsgewalt
  d: Vierte Staatsgewalt
correct: d
explanation_de: Die drei staatlichen Gewalten sind Legislative, Exekutive und Judikative. Die Medien gehören
  nicht dazu, sie kontrollieren aber die Politik und informieren die Bevölkerung. Deshalb nennt man sie
  oft die vierte Staatsgewalt.
