topic: bund.geschichte.weltkriege_neutralitaet
question_de: Welches Ereignis von 1815 ist für die Neutralität der Schweiz wichtig?
options_de:
  a: Die Schweiz erklärte allen Nachbarstaaten den Krieg.
  b: Die Grossmächte anerkannten die dauernde Neutralität der Schweiz.
  c: Die Schweiz trat dem Völkerbund bei.
  d: Die Schweiz führte erstmals eine Volksabstimmung über die Neutralität durch.
correct: b
explanation_de: Am Wiener Kongress 1815 anerkannten die europäischen Grossmächte die dauernde Neutralität
  der Schweiz. Das gab der Neutralität eine internationale Grundlage.
