id: forstleute-andere-baumarten-pflanzen
version: 1
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Wie reagieren Forstleute in der Schweiz auf die steigenden Temperaturen?
options_de:
  a: Sie pflanzen vermehrt andere Baumarten an.
  b: Sie pflanzen nur noch Bäume, die schon immer dort standen.
  c: Sie verzichten ganz auf die Pflege des Waldes.
  d: Sie roden die Wälder in tiefen Lagen.
correct: a
explanation_de: Manche Baumarten vertragen Hitze und Trockenheit schlecht. Forstleute setzen deshalb auf
  andere Arten, die besser an das wärmere Klima angepasst sind. So soll der Wald stabil bleiben.
