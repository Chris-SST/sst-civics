id: volksinitiative-doppeltes-mehr
version: 2
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was braucht eine eidgenössische Volksinitiative, damit sie in der Abstimmung angenommen wird?
options_de:
  a: Das Ja von zwei Dritteln der Stimmenden
  b: Das Ja des Bundesrates und der Mehrheit der Stimmenden
  c: Das Ja der Mehrheit der Stimmenden und der Mehrheit der Kantone
  d: Nur das Ja der Mehrheit der Stimmenden
correct: c
explanation_de: 'Eine eidgenössische Volksinitiative will die Bundesverfassung ändern. Darum braucht sie
  das doppelte Mehr: Die Mehrheit der Stimmenden (Volksmehr) und die Mehrheit der Kantone (Ständemehr)
  müssen Ja sagen. Bei einer kantonalen Initiative im Kanton Zürich reicht dagegen die Mehrheit der Stimmenden.'
