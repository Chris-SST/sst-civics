id: volksinitiative-doppeltes-mehr
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was braucht eine Volksinitiative, damit sie in der Abstimmung angenommen wird?
options_de:
  a: Das Ja von zwei Dritteln der Stimmenden
  b: Das Ja des Bundesrates und der Mehrheit der Stimmenden
  c: Das Ja der Mehrheit der Stimmenden und der Mehrheit der Kantone
  d: Nur das Ja der Mehrheit der Stimmenden
correct: c
explanation_de: 'Eine Volksinitiative verlangt eine Änderung der Bundesverfassung. Deshalb braucht es
  das doppelte Mehr: die Mehrheit der Stimmenden und die Mehrheit der Kantone (Ständemehr).'
