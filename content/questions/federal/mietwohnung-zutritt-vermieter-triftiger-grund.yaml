topic: bund.sozial.zivilgesellschaft
question_de: In welchem Fall müssen Mietende der Vermieterseite den Zutritt zur Wohnung gewähren?
options_de:
  a: Nie, die Wohnung ist immer geschützt
  b: Wenn ein triftiger Grund vorliegt
  c: Nur wenn der Vermieter es verlangt, ohne Begründung
  d: Jederzeit und ohne Voranmeldung
correct: b
explanation_de: Mietende müssen den Zutritt gewähren, wenn dafür ein triftiger Grund besteht, zum Beispiel
  eine dringende Reparatur. Die Vermieterseite muss den Besuch aber rechtzeitig ankündigen und auf die
  Mietenden Rücksicht nehmen. Ein Zutritt ohne Grund ist nicht erlaubt.
