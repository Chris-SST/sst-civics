question_de: Wie heisst der höchste Berggipfel der Schweiz?
options_de:
  a: Piz Bernina
  b: Matterhorn
  c: Dufourspitze
  d: Jungfrau
correct: c
explanation_de: Die Dufourspitze im Monte-Rosa-Massiv im Wallis ist mit rund 4634 Metern der höchste Gipfel
  der Schweiz. Das Matterhorn ist bekannter, aber niedriger. Der Piz Bernina in Graubünden ist der höchste
  Gipfel der Ostalpen.
