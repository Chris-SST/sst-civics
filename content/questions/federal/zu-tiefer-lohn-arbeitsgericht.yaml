id: zu-tiefer-lohn-arbeitsgericht
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Eine Arbeitnehmerin erhält ungerechtfertigt einen zu tiefen Lohn. Welche Stelle kann sie
  anrufen?
options_de:
  a: Das Regionale Arbeitsvermittlungszentrum (RAV)
  b: Das Bundesamt für Statistik
  c: Das Arbeitsgericht
  d: Die Gemeindeversammlung
correct: c
explanation_de: Bei Streitigkeiten aus dem Arbeitsverhältnis, zum Beispiel wegen eines zu tiefen Lohns,
  ist das Arbeitsgericht zuständig. Das RAV hilft bei der Stellensuche und nicht bei Lohnstreitigkeiten.
