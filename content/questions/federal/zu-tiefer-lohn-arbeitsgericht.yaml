    option: c
    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Bei ungerechtfertigt zu tiefem Lohn kann sich die Arbeitnehmerin an das Arbeitsgericht
      (bzw. die zuständige Schlichtungsbehörde und das Gericht) wenden, während RAV, Bundesamt für Statistik
      und Gemeindeversammlung dafür nicht zuständig sind.
  source:
    verdict: supported
    note: Quelle 2 verweist bei privatrechtlichen Themen wie ausbleibenden Lohnzahlungen an die unentgeltliche
      Rechtsauskunft des Bezirks- oder Arbeitsgerichts. Quelle 1 bestätigt, dass das RAV bei der Stellensuche
      hilft, nicht bei Lohnstreitigkeiten. Dass das Arbeitsgericht für Streitigkeiten wegen zu tiefen
      Lohns zuständig ist, sagt keine Quelle wörtlich, es folgt aber eindeutig aus Quelle 2.
