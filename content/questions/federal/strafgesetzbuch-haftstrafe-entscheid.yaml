id: strafgesetzbuch-haftstrafe-entscheid
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Nach welchem Gesetz richtet sich, ob jemand eine Haftstrafe verbüssen muss?
options_de:
  a: Nach dem Zivilgesetzbuch
  b: Nach dem Obligationenrecht
  c: Nach dem Mietrecht
  d: Nach dem Strafgesetzbuch
correct: d
explanation_de: Das Strafgesetzbuch legt fest, welche Taten strafbar sind und welche Strafen dafür möglich
  sind. Dazu gehören Geldstrafen und Freiheitsstrafen. Über die Strafe im Einzelfall entscheidet ein Gericht.
