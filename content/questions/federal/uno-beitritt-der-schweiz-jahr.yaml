question_de: In welchem Jahr wurde die Schweiz Mitglied der Vereinten Nationen (UNO)?
options_de:
  a: '2002'
  b: '1945'
  c: '1986'
  d: '2010'
correct: a
explanation_de: Die Schweiz trat 2002 der UNO bei, nachdem Volk und Stände zugestimmt hatten. Sie war
  damit eines der letzten Länder, die beitraten. Viele UNO-Organisationen haben aber schon lange einen
  Sitz in Genf.
