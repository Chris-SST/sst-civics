topic: bund.geschichte.weltkriege_neutralitaet
question_de: Was bedeutet die Neutralität der Schweiz bei bewaffneten Konflikten zwischen anderen Staaten?
options_de:
  a: Die Schweiz schickt Truppen zur Friedenssicherung in jedes Kriegsgebiet.
  b: Die Schweiz bricht alle Beziehungen zu den beteiligten Staaten ab.
  c: Die Schweiz ergreift nicht Partei für eine der Konfliktparteien.
  d: Die Schweiz unterstützt immer die schwächere Seite.
correct: c
explanation_de: Neutralität heisst, dass sich die Schweiz nicht auf die Seite einer Kriegspartei stellt.
  Sie bleibt dadurch aus den Konflikten anderer Staaten heraus. Das schliesst Gespräche und humanitäre
  Hilfe nicht aus.
