version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was können Stimmberechtigte mit einer eidgenössischen Volksinitiative verlangen?
options_de:
  a: Die Abwahl des Bundesrates
  b: Eine Änderung der Bundesverfassung
  c: Die Ablehnung eines bestehenden Bundesgesetzes
  d: Eine Änderung der Kantonsverfassung
correct: b
explanation_de: Mit einer Volksinitiative können Stimmberechtigte eine Änderung der Bundesverfassung verlangen.
  Die Ablehnung eines Gesetzes wäre dagegen Sache des Referendums.
