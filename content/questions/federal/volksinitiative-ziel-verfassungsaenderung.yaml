id: volksinitiative-ziel-verfassungsaenderung
version: 2
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was können die Stimmberechtigten mit einer eidgenössischen Volksinitiative verlangen?
options_de:
  a: Dass der Bundesrat abgewählt wird
  b: Dass die Bundesverfassung geändert wird
  c: Dass ein bestehendes Bundesgesetz direkt aufgehoben wird
  d: Dass die Kantonsverfassung geändert wird
correct: b
explanation_de: Mit einer eidgenössischen Volksinitiative können die Stimmberechtigten eine Änderung der
  Bundesverfassung verlangen. Mit einem Referendum kann das Volk dagegen über ein neues Gesetz abstimmen,
  das das Parlament gerade beschlossen hat. Ein schon bestehendes Gesetz lässt sich damit nicht abschaffen.
