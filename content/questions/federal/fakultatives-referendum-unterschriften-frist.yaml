id: fakultatives-referendum-unterschriften-frist
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie viele Unterschriften sind nötig, damit ein fakultatives Referendum gegen ein Bundesgesetz
  zustande kommt, und in welcher Frist?
options_de:
  a: 50 000 Unterschriften innerhalb von 18 Monaten
  b: 50 000 Unterschriften innerhalb von 100 Tagen
  c: 100 000 Unterschriften innerhalb von 30 Tagen
  d: 100 000 Unterschriften innerhalb von 100 Tagen
correct: b
explanation_de: Für ein fakultatives Referendum braucht es 50 000 gültige Unterschriften innerhalb von
  100 Tagen nach der Veröffentlichung des Gesetzes im Bundesblatt. Kommt es zustande, stimmt das Volk
  über das Gesetz ab.
