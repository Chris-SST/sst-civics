canton: null
topic: bund.demokratie.wahlen
question_de: Wie geben die meisten Stimmberechtigten in der Schweiz heute ihre Stimme bei Abstimmungen
  und Wahlen ab?
options_de:
  a: Sie geben sie am Abstimmungssonntag in der Gemeindeversammlung ab.
  b: Sie legen sie am Abstimmungssonntag persönlich in die Urne.
  c: Sie schicken sie per Post an die Gemeinde.
  d: Sie geben sie über eine Internetseite des Bundes ab.
correct: c
explanation_de: Die Mehrheit der Stimmberechtigten stimmt brieflich ab, also auf dem Postweg. Der Gang
  zur Urne am Abstimmungssonntag ist heute für die meisten nicht mehr üblich.
