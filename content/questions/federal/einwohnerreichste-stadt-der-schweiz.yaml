question_de: Welche Stadt hat in der Schweiz die meisten Einwohnerinnen und Einwohner?
options_de:
  a: Genf
  b: Zürich
  c: Bern
  d: Basel
correct: b
explanation_de: Zürich ist die grösste Stadt der Schweiz. Bern ist zwar die Bundesstadt, hat aber deutlich
  weniger Einwohnerinnen und Einwohner. Auch Genf und Basel sind kleiner.
