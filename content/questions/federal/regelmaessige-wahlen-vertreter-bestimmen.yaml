id: regelmaessige-wahlen-vertreter-bestimmen
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Welche Bedeutung haben regelmässige Wahlen in einer Demokratie?
options_de:
  a: Die Bevölkerung bestimmt selbst, wer sie vertritt.
  b: Die Regierung ernennt ihre Nachfolger selbst.
  c: Die Parteien legen die Vertretung unter sich fest.
  d: Das Gericht bestimmt, wer ein Amt übernimmt.
correct: a
explanation_de: Bei Wahlen entscheiden die Stimmberechtigten, wer sie in Parlament oder Regierung vertritt.
  Da die Wahlen regelmässig stattfinden, können sie Personen bestätigen oder durch andere ersetzen. So
  behält die Bevölkerung Einfluss auf die Politik.
