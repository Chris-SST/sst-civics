id: auslandschweizer-stimmrecht-vom-ausland
version: 2
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Eine Schweizer Bürgerin lebt dauerhaft im Ausland. Wie kann sie bei eidgenössischen Wahlen
  und Abstimmungen mitmachen?
options_de:
  a: Sie darf nur abstimmen, wenn sie dafür in die Schweiz reist.
  b: Sie darf nur an Wahlen teilnehmen, aber nicht an Abstimmungen.
  c: Sie kann von ihrem Wohnort im Ausland aus wählen und abstimmen, ohne in die Schweiz zu reisen.
  d: Sie verliert das Stimm- und Wahlrecht auf Bundesebene.
correct: c
explanation_de: Auslandschweizerinnen und Auslandschweizer dürfen auf Bundesebene wählen und abstimmen,
  ohne dafür in die Schweiz zu reisen. Dazu müssen sie bei der zuständigen Schweizer Vertretung im Ausland
  gemeldet sein und über diese die Eintragung ins Stimmregister beantragen. Die Wahl- und Abstimmungsunterlagen
  schickt ihnen dann ihre Stimmgemeinde zu.
