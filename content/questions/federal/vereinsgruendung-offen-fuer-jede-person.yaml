id: vereinsgruendung-offen-fuer-jede-person
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Wer darf in der Schweiz einen Verein gründen?
options_de:
  a: Nur Personen, die einen Wohnsitz in der Gemeinde haben
  b: Jede Person
  c: Nur Schweizer Staatsangehörige
  d: Nur Personen mit einer Niederlassungsbewilligung
correct: b
explanation_de: Die Gründung eines Vereins steht in der Schweiz jeder Person offen. Die Vereinsfreiheit
  ist in der Bundesverfassung garantiert. Staatsangehörigkeit oder Aufenthaltsstatus spielen dafür keine
  Rolle.
