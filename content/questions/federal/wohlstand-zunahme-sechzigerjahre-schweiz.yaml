    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: In den 1960er-Jahren erlebte die Schweiz einen starken Wirtschaftsaufschwung mit stark
      steigendem Wohlstand, während sie nie EU-Mitglied wurde, die Wirtschaft nicht schrumpfte und die
      Einwanderung (Gastarbeiter) hoch war.
  source:
    verdict: unclear
    note: Quelle 1 sagt nur allgemein, dass es der Schweiz nach dem Zweiten Weltkrieg wirtschaftlich immer
      besser ging und ab den 1950er-Jahren viele Arbeitskräfte aus Italien kamen. Quelle 2 beschreibt
      die Anwerbung von Arbeitskräften nach 1947. Beide nennen weder die 1960er-Jahre noch ausdrücklich
      einen stark steigenden Wohlstand, daher ist die Antwort nicht eindeutig belegt.
