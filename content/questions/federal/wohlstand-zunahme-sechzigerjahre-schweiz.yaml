id: wohlstand-zunahme-sechzigerjahre-schweiz
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Was war für die Schweiz in den 1960er-Jahren typisch?
options_de:
  a: Der Wohlstand vieler Menschen nahm stark zu.
  b: Die Wirtschaft schrumpfte stark und viele wurden arbeitslos.
  c: Die Schweiz wurde Mitglied der Europäischen Union.
  d: Die Einwanderung kam fast ganz zum Stillstand.
correct: a
explanation_de: In den 1960er-Jahren wuchs die Wirtschaft stark. Viele Menschen verdienten mehr und konnten
  sich mehr leisten. Dafür wurden auch viele Arbeitskräfte aus dem Ausland angeworben.
sources:
