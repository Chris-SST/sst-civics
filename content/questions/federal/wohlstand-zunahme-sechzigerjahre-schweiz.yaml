topic: bund.geschichte.gesellschaftswandel
question_de: Wie ging es der Schweiz wirtschaftlich in den Jahrzehnten nach dem Zweiten Weltkrieg, zum
  Beispiel in den 1960er-Jahren?
options_de:
  a: 'Es ging ihr immer besser: Es gab viel Arbeit und der Wohlstand vieler Menschen stieg.'
  b: Die Wirtschaft schrumpfte stark und viele Menschen wurden arbeitslos.
  c: Die Schweiz wurde Mitglied der Europäischen Union.
  d: Die Schweiz brauchte keine Arbeitskräfte aus dem Ausland mehr.
correct: a
explanation_de: Nach dem Zweiten Weltkrieg wuchs die Schweizer Wirtschaft stark. Es gab viel Arbeit, und
  viele Menschen konnten sich mehr leisten. Die Firmen holten deshalb viele Arbeitskräfte aus dem Ausland,
  zuerst vor allem aus Italien.
