question_de: In welches Meer fliesst das Wasser des Rheins am Ende?
options_de:
  a: In das Mittelmeer
  b: In das Schwarze Meer
  c: In die Nordsee
  d: In die Ostsee
correct: c
explanation_de: Der Rhein entspringt in den Schweizer Alpen und fliesst durch Deutschland und die Niederlande.
  Er mündet in die Nordsee.
