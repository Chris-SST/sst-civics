id: referendum-gesetz-verhindern
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was können Stimmberechtigte mit einem Referendum erreichen?
options_de:
  a: Sie können ein neues Gesetz selbst schreiben und in Kraft setzen.
  b: Sie können ein vom Parlament beschlossenes Gesetz verhindern.
  c: Sie können die Mitglieder des Bundesrates abwählen.
  d: Sie können das Parlament auflösen und Neuwahlen verlangen.
correct: b
explanation_de: Mit einem Referendum können Stimmberechtigte verlangen, dass über ein vom Parlament beschlossenes
  Gesetz abgestimmt wird. Lehnt das Volk das Gesetz ab, tritt es nicht in Kraft.
