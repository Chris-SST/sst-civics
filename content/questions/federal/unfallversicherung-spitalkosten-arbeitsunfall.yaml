    reasoning: Für Berufsunfälle von Arbeitnehmenden kommt die obligatorische Unfallversicherung (UVG)
      für die Heilbehandlungskosten und damit auch für die Spitalkosten auf.
  source:
    verdict: supported
    note: Quelle 2 (BAG) nennt die obligatorische Unfallversicherung für Arbeitnehmende mit Pflegeleistungen
      und Kostenvergütungen bei Berufsunfällen. Quelle 1 (BSV) bestätigt, dass die Unfallversicherung
      alle Arbeitnehmenden gegen Berufsunfälle versichert und medizinische Behandlungskosten abdeckt.
      Spitalkosten werden nicht wörtlich genannt, die Aussage ist aber eindeutig genug.
