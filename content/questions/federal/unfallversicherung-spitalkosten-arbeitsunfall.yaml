id: unfallversicherung-spitalkosten-arbeitsunfall
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Eine Arbeitnehmerin hat bei der Arbeit einen schweren Unfall und muss ins Spital. Welche
  Versicherung kommt für die Spitalkosten auf?
options_de:
  a: Die Arbeitslosenversicherung
  b: Die Unfallversicherung
  c: Die Erwerbsersatzordnung
  d: Die Alters- und Hinterlassenenversicherung
correct: b
explanation_de: Die obligatorische Unfallversicherung zahlt bei Berufsunfällen die Heilungskosten, also
  zum Beispiel die Spitalkosten. Arbeitnehmende sind über den Arbeitgeber dagegen versichert. Die anderen
  genannten Versicherungen decken andere Risiken ab.
