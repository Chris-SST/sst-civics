id: krankenversicherung-obligatorisch-alle-einwohner
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Wer muss in der Schweiz eine Grundversicherung bei einer Krankenkasse haben?
options_de:
  a: alle Personen, die in der Schweiz wohnen
  b: nur Personen mit niedrigem Einkommen
  c: nur Personen mit Schweizer Bürgerrecht
  d: nur Personen, die erwerbstätig sind
correct: a
explanation_de: Die Krankenversicherung ist für alle Personen mit Wohnsitz in der Schweiz obligatorisch.
  Das gilt unabhängig von Staatsangehörigkeit, Alter oder Erwerbstätigkeit. Die Krankenkassen müssen alle
  Personen in der Grundversicherung aufnehmen.
