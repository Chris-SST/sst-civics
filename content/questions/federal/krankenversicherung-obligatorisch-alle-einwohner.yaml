    reasoning: Nach dem Krankenversicherungsgesetz (KVG) gilt das Versicherungsobligatorium für alle Personen
      mit Wohnsitz in der Schweiz, unabhängig von Einkommen, Bürgerrecht oder Erwerbstätigkeit.
  source:
    verdict: supported
    note: Art. 3 KVG und die BAG-Seite besagen, dass jede Person mit Wohnsitz in der Schweiz versichert
      sein muss, unabhängig von der Staatsangehörigkeit. Die BAG-Seite hält zudem fest, dass die Versicherer
      alle ohne Vorbehalte aufnehmen müssen; die Zürcher Broschüre nennt die Grundversicherung für alle
      obligatorisch.
