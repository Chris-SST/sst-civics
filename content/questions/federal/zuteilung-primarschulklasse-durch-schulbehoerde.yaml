    note: Quelle 1 (§ 25 VSV, Rekursentscheid) zeigt, dass die Schulpflege bzw. Schulleitung Kinder Schulen
      und Klassen zuteilt und dass kein Anspruch auf freie Wahl von Schulhaus oder Klasse besteht. Quelle
      2 (§ 62 VSV) sagt, dass Eltern bei der Zuteilung zu einer Schule oder Klasse nicht mitwirken, und
      Quelle 3 nennt Schulbehörde und Schulleitung bei der Klassenbildung.
