topic: bund.geografie.sprachen
question_de: Was ist mit dem Begriff «Romandie» oder «Welschland» gemeint?
options_de:
  a: Der italienischsprachige Teil der Schweiz
  b: Der französischsprachige Teil der Schweiz
  c: Der rätoromanischsprachige Teil der Schweiz
  d: Der deutschsprachige Teil der Schweiz
correct: b
explanation_de: Mit Romandie oder Welschland bezeichnet man die Gebiete der Schweiz, in denen Französisch
  gesprochen wird. Dazu gehören zum Beispiel die Kantone Genf und Waadt. Der italienischsprachige Teil
  ist vor allem das Tessin.
