id: glaubensfreiheit-religion-ueberzeugung-leben
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was gehört nach der Bundesverfassung zur Glaubens- und Gewissensfreiheit?
options_de:
  a: Das Recht, einen Glauben und eine Überzeugung zu haben und danach zu leben
  b: Nur die Mitgliedschaft in einer anerkannten Landeskirche
  c: Die Pflicht, den Glauben der Eltern zu behalten
  d: Das Recht, andere zum eigenen Glauben zu verpflichten
correct: a
explanation_de: Jede Person darf ihre Religion und ihre weltanschauliche Überzeugung frei wählen und danach
  leben. Man darf auch den Glauben wechseln oder keinen haben. Niemand darf zu einem Glauben gezwungen
  werden.
