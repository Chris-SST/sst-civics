    reasoning: Art. 15 der Bundesverfassung garantiert das Recht, die Religion und die weltanschauliche
      Überzeugung frei zu wählen und allein oder in Gemeinschaft mit anderen zu bekennen, also danach
      zu leben, während die übrigen Antworten dieser Freiheit widersprechen.
  source:
    verdict: supported
    note: Die Bundesverfassung sagt, jede Person dürfe ihre Religion und weltanschauliche Überzeugung
      frei wählen und bekennen. Niemand darf gezwungen werden, einer Religionsgemeinschaft anzugehören
      oder eine religiöse Handlung vorzunehmen. Das stützt Antwort a) und die Erklärung. Die Überschrift
      von Art. 15 und das Recht, 'danach zu leben', fehlen im gekürzten Text, doch der Sinn ist eindeutig.
