topic: bund.alltag
question_de: Welchen Anteil an der ständigen Wohnbevölkerung der Schweiz machten Ausländerinnen und Ausländer
  im Jahr 2020 ungefähr aus?
options_de:
  a: etwa drei Fünftel
  b: etwa ein Zehntel
  c: etwa die Hälfte
  d: etwa ein Viertel
correct: d
explanation_de: 2020 war rund ein Viertel der ständigen Wohnbevölkerung ausländischer Nationalität. Das
  entspricht etwa 2,1 von 8,6 Millionen Personen. Die Schweiz hat damit im europäischen Vergleich einen
  hohen Ausländeranteil.
