question_de: Wie gross war im Jahr 2020 ungefähr der Anteil der Ausländerinnen und Ausländer an der ständigen
  Wohnbevölkerung der Schweiz?
options_de:
  a: etwa drei Fünftel
  b: etwa ein Zehntel
  c: etwa die Hälfte
  d: etwa ein Viertel
correct: d
explanation_de: Im Jahr 2020 hatte rund ein Viertel der ständigen Wohnbevölkerung keinen Schweizer Pass.
  Ende 2020 waren es rund 2,2 von 8,7 Millionen Personen, also etwa 25 Prozent. Im Vergleich mit anderen
  Ländern in Europa ist dieser Anteil hoch.
