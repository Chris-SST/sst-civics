id: schwingen-schweizer-traditionssport
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Welche Sportart gilt in der Schweiz als traditioneller Nationalsport, bei dem zwei Männer
  in Hosen aus Zwilch miteinander ringen?
options_de:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
correct: b
explanation_de: Schwingen ist eine Form des Ringens und gilt als Schweizer Traditionssport. Gekämpft wird
  auf einem Sägemehlring. Bekannt sind die Schwingfeste, zum Beispiel das Eidgenössische Schwing- und
  Älplerfest.
