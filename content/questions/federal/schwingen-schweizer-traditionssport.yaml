    reasoning: Schwingen ist der traditionelle Schweizer Nationalsport, bei dem zwei Schwinger in Zwilchhosen
      miteinander ringen, während Hornussen, Curling und Steinstossen keine Ringkämpfe sind.
  source:
    verdict: supported
    note: Quelle 1 nennt Schwingen als «eine Art Ringen» und als einzigartigen Schweizer Brauch; sie erwähnt
      auch das Eidgenössische Schwing- und Älplerfest. Quelle 2 beschreibt Schwingen (Hosenlupf) als Variante
      des Freistilringens, Hornussen und Steinstossen sind andere Sportarten. Zwilchhosen, Sägemehlring
      und die Bezeichnung «Nationalsport» für Schwingen werden nicht wörtlich bestätigt, die Kernaussage
      ist aber gestützt.
