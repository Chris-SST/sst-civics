topic: bund.kultur.feiertage_brauchtum
question_de: Welche traditionelle Sportart in der Schweiz ist eine Art Ringkampf?
options_de:
  a: Hornussen
  b: Schwingen
  c: Curling
  d: Steinstossen
correct: b
explanation_de: 'Schwingen ist ein Ringkampf zwischen zwei Personen auf einem runden Platz mit Sägemehl
  und gilt als Schweizer Traditionssport. Hornussen und Steinstossen sind auch alte Schweizer Sportarten,
  aber keine Ringkämpfe: Beim Hornussen schlägt man eine kleine Scheibe weit durch die Luft, beim Steinstossen
  wirft man einen schweren Stein. Curling spielt man auf dem Eis, und es kommt ursprünglich aus Schottland.'
