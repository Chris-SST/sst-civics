id: militaerdienstpflicht-schweizer-maenner
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wen trifft in der Schweiz die Pflicht zum Militärdienst oder zum Ersatzdienst?
options_de:
  a: Alle Einwohnerinnen und Einwohner ab 18 Jahren
  b: Männer mit Schweizer Bürgerrecht
  c: Alle Männer, die in der Schweiz wohnen
  d: Nur Frauen mit Schweizer Bürgerrecht
correct: b
explanation_de: Nach der Bundesverfassung ist jeder Schweizer Mann zum Militärdienst verpflichtet. Wer
  dies mit seinem Gewissen nicht vereinbaren kann, leistet zivilen Ersatzdienst. Ausländer sind nicht
  dienstpflichtig.
