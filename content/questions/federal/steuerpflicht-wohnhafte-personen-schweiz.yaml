id: steuerpflicht-wohnhafte-personen-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wer ist in der Schweiz grundsätzlich verpflichtet, Steuern zu bezahlen?
options_de:
  a: Personen, die in der Schweiz wohnen
  b: Nur Personen, die ein Unternehmen führen
  c: Nur Personen mit Schweizer Bürgerrecht
  d: Nur Personen, die das Stimmrecht haben
correct: a
explanation_de: Die Steuerpflicht knüpft am Wohnsitz an und nicht am Bürgerrecht. Auch Ausländerinnen
  und Ausländer, die in der Schweiz wohnen, zahlen Steuern. Das Stimmrecht spielt dafür keine Rolle.
