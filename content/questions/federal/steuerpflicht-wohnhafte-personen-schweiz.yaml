    reasoning: Die Steuerpflicht knüpft in der Schweiz grundsätzlich an den Wohnsitz an, sodass alle Personen,
      die hier wohnen, unabhängig von Staatsangehörigkeit, Stimmrecht oder Unternehmertätigkeit Steuern
      zahlen müssen.
  source:
