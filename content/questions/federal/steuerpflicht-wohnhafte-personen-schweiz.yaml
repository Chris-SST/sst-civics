    note: Quelle 1 (DBG) sagt, dass natürliche Personen steuerpflichtig sind, wenn sie ihren steuerrechtlichen
      Wohnsitz oder Aufenthalt in der Schweiz haben. Quelle 3 hält fest, dass jeder Mensch als natürliche
      Person steuerpflichtig ist. Das Bürgerrecht oder das Stimmrecht wird nicht als Voraussetzung genannt.
