id: krankenversicherung-pflicht-wohnhafte-personen
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Was gilt für Personen, die in der Schweiz wohnen, in Bezug auf die Krankenversicherung?
options_de:
  a: Sie müssen sich nur versichern, wenn sie in der Schweiz arbeiten
  b: Sie sind gesetzlich verpflichtet, eine Krankenversicherung abzuschliessen
  c: Sie müssen sich nur versichern, wenn sie älter als 50 Jahre sind
  d: Sie können frei entscheiden, ob sie sich versichern wollen
correct: b
explanation_de: Das Krankenversicherungsgesetz verpflichtet jede Person mit Wohnsitz in der Schweiz zur
  Krankenversicherung. Man muss sich innert drei Monaten nach der Geburt oder der Wohnsitznahme versichern.
