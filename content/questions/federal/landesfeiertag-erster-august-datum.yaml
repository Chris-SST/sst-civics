topic: bund.kultur.feiertage_brauchtum
question_de: Auf welches Datum fällt der Schweizer Bundesfeiertag, der Landesfeiertag der Schweiz?
options_de:
  a: Der 1. August
  b: Der 26. Dezember
  c: Der 11. November
  d: Der 1. Mai
correct: a
explanation_de: Der Landesfeiertag der Schweiz ist am 1. August. Man erinnert dabei an den Bundesbrief
  von 1291. Zum Feiern gehören vielerorts Feuerwerk, Höhenfeuer und Reden.
