    reasoning: Die Dampfmaschine wurde im 18. Jahrhundert entwickelt und prägte die frühe Industrialisierung
      (auch in der Schweiz, wo zudem mechanische Spinnmaschinen wichtig waren), während Computer, Fliessband
      und Auto erst im 19. und 20. Jahrhundert aufkamen.
  source:
    verdict: supported
    note: Quelle 1 (Broschüre, Seite 12) sagt, die Industrialisierung habe mit der Erfindung der Dampfmaschine
      begonnen und die Schweizer Industrie stark verändert. Die Quelle nennt allerdings das 19. Jahrhundert
      statt des 18. in der Frage; die Antwort a) wird dennoch gestützt, weil die anderen Optionen nicht
      als Auslöser genannt werden.
