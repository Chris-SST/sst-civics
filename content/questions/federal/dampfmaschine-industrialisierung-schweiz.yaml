question_de: Welche Erfindung hat im 19. Jahrhundert die Industrialisierung in der Schweiz stark geprägt?
options_de:
  a: Das Flugzeug
  b: Die Dampfmaschine
  c: Der Computer
  d: Das Fliessband
correct: b
explanation_de: Im 19. Jahrhundert wurde die Dampfmaschine in der Schweiz wichtig. Sie trieb Maschinen
  in Fabriken und später auch Eisenbahnen an, und immer mehr Menschen arbeiteten in Fabriken. Flugzeug,
  Fliessband und Computer wurden erst im 20. Jahrhundert wichtig.
