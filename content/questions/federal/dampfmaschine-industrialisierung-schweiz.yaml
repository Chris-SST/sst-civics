id: dampfmaschine-industrialisierung-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Welche Erfindung prägte im 18. Jahrhundert den industriellen Umbruch in der Schweiz?
options_de:
  a: Die Dampfmaschine
  b: Der Computer
  c: Das Fliessband
  d: Das Auto
correct: a
explanation_de: Mit der Dampfmaschine begann die Industrialisierung, und die Arbeit verlagerte sich zunehmend
  in Fabriken. Computer, Fliessband und Auto kamen erst viel später.
