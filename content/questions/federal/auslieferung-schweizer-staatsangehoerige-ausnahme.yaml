id: auslieferung-schweizer-staatsangehoerige-ausnahme
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Staatsangehörigen ins Ausland?
options_de:
  a: Sie werden auf Verlangen jedes Staates ausgeliefert.
  b: Sie werden nicht ausgeliefert, ausser an ein internationales Gericht.
  c: Sie werden nur an Nachbarstaaten der Schweiz ausgeliefert.
  d: Sie werden ausgeliefert, wenn der Bundesrat dies im Einzelfall will.
correct: b
explanation_de: Artikel 25 der Bundesverfassung schützt Schweizerinnen und Schweizer vor Ausweisung und
  Auslieferung. Eine Auslieferung an ein internationales Gericht ist nur dann möglich, wenn dieses dort
  ein Verfahren führt.
