    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Nach Art. 25 Abs. 1 der Bundesverfassung dürfen Schweizer Bürgerinnen und Bürger nicht
      aus der Schweiz ausgewiesen werden und dürfen nur mit ihrer Zustimmung einer ausländischen Behörde
      überstellt werden; da Antwort b die Nichtauslieferung als Grundsatz mit der Ausnahme eines internationalen
      Gerichts nennt, ist sie die beste Antwort, wobei die Frage vereinfacht ist (das Gesetz kennt auch
      die Zustimmung der betroffenen Person).
  source:
    verdict: not_supported
    note: Quelle 2 (Art. 25 Abs. 1 BV) sagt, Schweizerinnen und Schweizer dürfen nur mit ihrem Einverständnis
      an eine ausländische Behörde ausgeliefert werden. Von einer Ausnahme für internationale Gerichte
      steht dort nichts, und die Aussage der Erklärung zu einem Verfahren vor Ort ist nicht belegt. Quelle
      1 behandelt das Thema nicht.
