id: auslieferung-schweizer-staatsangehoerige-ausnahme
version: 2
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was gilt grundsätzlich für die Auslieferung von Schweizer Staatsangehörigen ins Ausland?
options_de:
  a: Sie werden auf Verlangen jedes Staates ausgeliefert.
  b: Sie werden nicht gegen ihren Willen an einen anderen Staat ausgeliefert. An ein internationales Gericht
    können sie aber übergeben werden.
  c: Sie werden nur an Nachbarstaaten der Schweiz ausgeliefert.
  d: Sie werden ausgeliefert, wenn der Bundesrat dies im Einzelfall will.
correct: b
explanation_de: Nach Artikel 25 der Bundesverfassung dürfen Schweizerinnen und Schweizer nicht ausgewiesen
  werden. An einen anderen Staat dürfen sie nur ausgeliefert werden, wenn sie selbst einverstanden sind.
  Ein internationales Gericht, zum Beispiel der Internationale Strafgerichtshof, ist keine ausländische
  Behörde, deshalb erlaubt ein Bundesgesetz, Schweizer Staatsangehörige für ein Verfahren dorthin zu übergeben.
