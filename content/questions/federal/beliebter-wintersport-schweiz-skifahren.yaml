topic: bund.kultur.feiertage_brauchtum
question_de: Welche Sportart betreiben in der Schweiz im Winter besonders viele Menschen?
options_de:
  a: Wasserball
  b: Skifahren
  c: Rudern
  d: Beachvolleyball
correct: b
explanation_de: Skifahren ist in der Schweiz im Winter sehr beliebt, und viele Menschen fahren in den
  Bergen Ski. Oft lernen schon Kinder das Skifahren, zum Beispiel in einem Skilager der Schule. Wasserball,
  Rudern und Beachvolleyball sind dagegen Sportarten, die man vor allem im Sommer oder im Wasser betreibt.
