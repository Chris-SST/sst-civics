topic: bund.demokratie.foederalismus
question_de: Welche Ebene steht im dreistufigen Staatsaufbau der Schweiz ganz unten?
options_de:
  a: Die Gemeinde
  b: Die Region
  c: Der Kanton
  d: Der Bezirk
correct: a
explanation_de: 'Der Staatsaufbau der Schweiz hat drei Stufen: Bund, Kantone und Gemeinden. Die Gemeinde
  ist die unterste Stufe und den Menschen am nächsten. Sie erfüllt Aufgaben, die ihr Bund und Kanton übertragen.'
