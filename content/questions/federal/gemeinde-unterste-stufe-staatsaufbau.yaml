question_de: Welche Ebene steht im dreistufigen Staatsaufbau der Schweiz ganz unten?
options_de:
  a: Die Gemeinde
  b: Die Region
  c: Der Kanton
  d: Der Bund
correct: a
explanation_de: 'Die Schweiz ist in drei Stufen aufgebaut: Bund, Kantone und Gemeinden. Die Gemeinde ist
  die unterste Stufe und den Menschen am nächsten. Sie erledigt viele Aufgaben selbst, zum Beispiel die
  Primarschule, die Baubewilligungen oder die Sozialhilfe.'
