id: staendemehr-mehrheit-der-kantone
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was bedeutet der Begriff «Ständemehr» bei eidgenössischen Abstimmungen?
options_de:
  a: Die Mehrheit der Kantone muss der Vorlage zustimmen.
  b: Die Mehrheit der Gemeinden muss der Vorlage zustimmen.
  c: Die Mehrheit der Parteien muss der Vorlage zustimmen.
  d: Die Mehrheit der Mitglieder des Ständerates muss anwesend sein.
correct: a
explanation_de: Das Ständemehr verlangt, dass die Mehrheit der Kantone einer Vorlage zustimmt. Die Stimmen
  eines Kantons zählen dabei nach dem Ergebnis der Abstimmung in diesem Kanton. Bei Verfassungsänderungen
  braucht es neben dem Volksmehr auch das Ständemehr.
