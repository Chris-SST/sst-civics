id: armee-zustaendigkeit-bund
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Welche staatliche Ebene ist für die Armee zuständig?
options_de:
  a: Die Kantone
  b: Der Bund
  c: Die Bezirke
  d: Die Gemeinden
correct: b
explanation_de: Das Militärwesen ist Sache des Bundes. Er regelt die Armee und ihre Aufgaben in der Bundesverfassung
  und in Bundesgesetzen. Die Kantone wirken beim Vollzug mit, zum Beispiel bei der Rekrutierung.
