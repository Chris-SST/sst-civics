    reasoning: Nach Artikel 58 der Bundesverfassung ist das Militärwesen grundsätzlich Sache des Bundes,
      der die Schweizer Armee führt und gesetzlich regelt.
  source:
    verdict: supported
    note: 'Die Bundesverfassung sagt: «Die Militärgesetzgebung sowie Organisation, Ausbildung und Ausrüstung
      der Armee sind Sache des Bundes» und «Der Einsatz der Armee ist Sache des Bundes». Dass die Kantone
      beim Vollzug mitwirken, etwa bei der Rekrutierung, steht im Text nicht ausdrücklich, widerspricht
      der Antwort aber nicht.'
