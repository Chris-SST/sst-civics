topic: bund.geschichte.gruendung
question_de: Welche bedeutende religiöse Bewegung prägte im 16. Jahrhundert Europa und auch die Schweiz?
options_de:
  a: Die Reformation
  b: Die Aufklärung
  c: Die Regeneration
  d: Die Helvetik
correct: a
explanation_de: Die Reformation spaltete im 16. Jahrhundert die Kirche in Europa. In der Schweiz waren
  zum Beispiel Huldrych Zwingli in Zürich und Johannes Calvin in Genf wichtig. Die anderen Begriffe bezeichnen
  spätere Entwicklungen.
