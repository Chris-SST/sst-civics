    note: Quelle 1 beschreibt die Reformation als Spaltung des christlichen Abendlandes ab dem 16. Jahrhundert
      und nennt Zwingli (Zürich) und Calvin (Genf) als Reformatoren in der Schweiz. Aufklärung und Helvetische
      Republik werden dort im 18. Jahrhundert beziehungsweise ab 1798 eingeordnet, also später.
