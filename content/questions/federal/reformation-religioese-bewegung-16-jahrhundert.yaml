    reasoning: Die Reformation im 16. Jahrhundert, in der Schweiz mit Zwingli in Zürich und Calvin in
      Genf, war die bedeutende religiöse Bewegung, während Aufklärung, Regeneration und Helvetik andere
      Epochen oder politische Entwicklungen des 18. und 19. Jahrhunderts bezeichnen.
  source:
