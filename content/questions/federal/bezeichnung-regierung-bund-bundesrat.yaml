topic: bund.demokratie.bundesrat
question_de: Wie heisst die Regierung der Schweiz auf Bundesebene?
options_de:
  a: Bundesversammlung
  b: Bundesrat
  c: Bundeskanzlei
  d: Bundesgericht
correct: b
explanation_de: Die Regierung des Bundes heisst Bundesrat. Die Bundesversammlung ist das Parlament, das
  Bundesgericht ist das oberste Gericht. Die Bundeskanzlei unterstützt den Bundesrat.
