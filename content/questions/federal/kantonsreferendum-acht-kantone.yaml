id: kantonsreferendum-acht-kantone
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wer kann neben 50'000 Stimmberechtigten ebenfalls ein fakultatives Referendum gegen ein Bundesgesetz
  verlangen?
options_de:
  a: Acht Kantone
  b: Drei grosse Parteien gemeinsam
  c: Der Bundesrat
  d: Das Bundesgericht
correct: a
explanation_de: Laut Bundesverfassung können auch acht Kantone eine Volksabstimmung über ein Bundesgesetz
  verlangen. Man nennt dies Kantonsreferendum. Es wird selten genutzt, zeigt aber, dass die Kantone im
  Bundesstaat Mitspracherechte haben.
