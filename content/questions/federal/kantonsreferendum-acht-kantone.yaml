        erst sehr wenige Male genutzt».'
      - 'Klein: Die Frage steht ohne Tatsache aus der Themenliste da; die Formulierung «ebenfalls» wäre
        klarer als «alternativ»: «Wer kann statt 50''000 Stimmberechtigten ein fakultatives Referendum
        verlangen?», denn die Kantone können es unabhängig von den Stimmberechtigten verlangen.'
