topic: bund.geschichte.gruendung
question_de: In welcher Schweizer Stadt bauten die Römer ein Amphitheater, dessen Reste noch heute zu
  sehen sind?
options_de:
  a: Chur
  b: Thun
  c: Sitten
  d: Avenches
correct: d
explanation_de: Avenches hiess in römischer Zeit Aventicum und war eine wichtige Stadt. Das Amphitheater
  dort ist ein bekanntes Zeugnis der Römerzeit in der Schweiz. Die anderen Städte sind für dieses Bauwerk
  nicht bekannt.
