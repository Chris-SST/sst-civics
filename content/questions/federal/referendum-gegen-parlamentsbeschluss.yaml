id: referendum-gegen-parlamentsbeschluss
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Gegen welche Beschlüsse richtet sich ein Referendum auf Bundesebene?
options_de:
  a: Gegen Gesetze, die National- und Ständerat verabschiedet haben
  b: Gegen Entscheide, die die Bundeskanzlei getroffen hat
  c: Gegen Urteile, die das Bundesgericht gefällt hat
  d: Gegen Verordnungen, die einzelne Gemeinden erlassen haben
correct: a
explanation_de: Ein Referendum richtet sich gegen Gesetze, die das Parlament beschlossen hat. Das Parlament
  besteht aus National- und Ständerat. Gerichtsurteile und Verwaltungsentscheide kann man mit einem Referendum
  nicht anfechten.
