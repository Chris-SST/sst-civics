topic: bund.geschichte.bundesstaat
question_de: Was geschah 1798 unter dem Einfluss von Napoleon Bonaparte mit der Schweiz?
options_de:
  a: Sie wurde ein Teil des Deutschen Reiches.
  b: Sie wurde eine Monarchie mit einem eigenen König.
  c: Sie wurde dauerhaft in zwei Staaten geteilt.
  d: Sie wurde vorübergehend ein Zentralstaat, die Helvetische Republik.
correct: d
explanation_de: 1798 entstand nach dem Einmarsch französischer Truppen die Helvetische Republik. Sie war
  ein zentral regierter Einheitsstaat und löste die alte Eidgenossenschaft vorübergehend ab. Die Kantone
  hatten kaum eigene Rechte.
