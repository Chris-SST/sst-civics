id: kind-krankenversicherung-frist-geburt
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Innert welcher Frist ab der Geburt muss für ein in der Schweiz wohnhaftes Kind eine Krankenversicherung
  bestehen?
options_de:
  a: innert 12 Monaten
  b: innert 3 Monaten
  c: innert 14 Tagen
  d: innert 6 Monaten
correct: b
explanation_de: Für ein Kind müssen die Eltern innert drei Monaten nach der Geburt eine Krankenversicherung
  abschliessen. Wird die Frist eingehalten, besteht der Versicherungsschutz rückwirkend ab der Geburt.
