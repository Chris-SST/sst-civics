topic: bund.geschichte.gesellschaftswandel
question_de: Im 19. Jahrhundert verliessen viele Menschen die Schweiz und wanderten zum Beispiel nach
  Amerika aus. Was war ein wichtiger Grund dafür?
options_de:
  a: Not und fehlende Arbeit bedrohten ihre Existenz.
  b: Der Bund verbot ihnen, in der Schweiz zu wohnen.
  c: Die Schweiz hatte zu wenig Platz für Fabriken.
  d: Im Ausland gab es keine Steuern für Neuankömmlinge.
correct: a
explanation_de: Im 19. Jahrhundert war die Schweiz noch ein Auswanderungsland. Hungersnöte, Armut und
  fehlende Arbeit trieben viele Menschen dazu, im Ausland ein neues Leben zu suchen. Erst später wurde
  die Schweiz zum Einwanderungsland.
