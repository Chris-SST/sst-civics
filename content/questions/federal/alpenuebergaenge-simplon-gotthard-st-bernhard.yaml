topic: bund.geografie.landschaft
question_de: Was haben Simplon, Gotthard und Grosser St. Bernhard gemeinsam?
options_de:
  a: Es sind Kantone in den Alpen.
  b: Es sind Flüsse, die ins Meer münden.
  c: Es sind Seen im Mittelland.
  d: Es sind Übergänge über die Alpen.
correct: d
explanation_de: Simplon, Gotthard und Grosser St. Bernhard sind bekannte Pässe, die über die Alpen führen.
  Sie verbinden die Alpennordseite mit der Alpensüdseite.
