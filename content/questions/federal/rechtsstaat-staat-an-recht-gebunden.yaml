id: rechtsstaat-staat-an-recht-gebunden
version: 2
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Was gilt in einem Rechtsstaat wie der Schweiz für die Behörden und die Regierung?
options_de:
  a: Sie dürfen selbst auswählen, welche Gesetze sie befolgen.
  b: Auch sie müssen sich an das geltende Recht halten.
  c: Sie stehen über dem geltenden Recht.
  d: Sie müssen sich nur nach den Entscheiden der Medien richten.
correct: b
explanation_de: In einem Rechtsstaat muss sich nicht nur die Bevölkerung an das Recht halten, sondern
  auch der Staat selbst. Behörden und Regierung dürfen nur so handeln, wie es das Recht erlaubt. So schützt
  der Rechtsstaat die Menschen vor Willkür.
