id: rechtsstaat-staat-an-recht-gebunden
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Was gilt in einem Rechtsstaat wie der Schweiz für die Behörden und die Regierung?
options_de:
  a: Sie dürfen im Notfall ohne gesetzliche Grundlage handeln.
  b: Sie sind selbst an das geltende Recht gebunden.
  c: Sie stehen über dem geltenden Recht.
  d: Sie sind nur an Entscheide der Medien gebunden.
correct: b
explanation_de: 'Die Bundesverfassung sagt: Grundlage und Schranke staatlichen Handelns ist das Recht.
  Das gilt auch für Behörden und Regierung. So wird Willkür verhindert.'
