topic: bund.geschichte.gesellschaftswandel
question_de: Was bedeutet die Gleichberechtigung von Frau und Mann im Grundsatz?
options_de:
  a: Frauen und Männer haben im Grundsatz dieselben Rechte.
  b: Frauen und Männer haben in jedem Lebensbereich die gleichen Pflichten, aber unterschiedliche Rechte.
  c: Frauen und Männer verdienen in jedem Beruf genau gleich viel.
  d: Frauen und Männer müssen alle Aufgaben in der Familie gleich teilen.
correct: a
explanation_de: Gleichberechtigung heisst, dass beide Geschlechter im Grundsatz dieselben Rechte besitzen.
  Sie ist in der Bundesverfassung verankert. Der Grundsatz sagt nichts darüber, wie Familien ihre Aufgaben
  im Einzelnen aufteilen.
