    reasoning: Artikel 8 Absatz 3 der Bundesverfassung verankert die Gleichberechtigung von Frau und Mann,
      das heisst, beide haben im Grundsatz dieselben Rechte, während die anderen Antworten Pflichten,
      Lohn oder Familienaufgaben fälschlich absolut festlegen.
  source:
    verdict: supported
    note: 'Quelle 1 zitiert Art. 8 Abs. 3 BV: «Mann und Frau sind gleichberechtigt» und nennt die gleichen
      politischen Rechte sowie die gleichberechtigte Partnerschaft in der Ehe. Das stützt Antwort a und
      die Verankerung in der Bundesverfassung. Die Aussage, der Grundsatz sage nichts über die Aufgabenteilung
      in Familien, steht dort nicht ausdrücklich, widerspricht aber nichts.'
