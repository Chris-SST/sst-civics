id: ahv-abkuerzung-bedeutung
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wofür steht die Abkürzung AHV?
options_de:
  a: Alters- und Hinterlassenenversicherung
  b: Amtliche Haushaltsversicherung
  c: Allgemeine Hilfe für Versicherte
  d: Arbeitslosen- und Heilungsversicherung
correct: a
explanation_de: AHV heisst Alters- und Hinterlassenenversicherung. Sie zahlt Renten im Alter und an Hinterbliebene,
  etwa an Witwen, Witwer und Waisen.
