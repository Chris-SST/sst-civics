topic: bund.demokratie.foederalismus
question_de: Die Schweiz ist in drei Staatsebenen aufgebaut. Welche Ebene ist die oberste?
options_de:
  a: Die Gemeinden
  b: Der Bund
  c: Die Kantone
  d: Die Bezirke
correct: b
explanation_de: Der Bund ist die oberste der drei Staatsebenen. Darunter kommen die Kantone und dann die
  Gemeinden. Bezirke sind keine eigene Staatsebene, sondern in manchen Kantonen nur Verwaltungseinheiten
  innerhalb des Kantons.
