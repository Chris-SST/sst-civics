id: bund-spitze-dreistufiger-staatsaufbau
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Welche Staatsebene steht im dreistufigen Staatsaufbau der Schweiz an der Spitze?
options_de:
  a: Der Bund
  b: Der Kanton Bern
  c: Die Bundesversammlung allein
  d: Der Gemeindeverband
correct: a
explanation_de: An der Spitze des Staatsaufbaus steht der Bund. Darunter folgen die Kantone und danach
  die Gemeinden. Die Bundesverfassung regelt, welche Aufgaben beim Bund liegen und welche bei den Kantonen.
