      issues:
      - 'Klein: Die falschen Antworten sind sehr leicht zu erkennen. Eine plausiblere Alternative wie
        «Sie ist ein Staat, in dem nur das Parlament entscheidet und das Volk nicht abstimmt» würde die
        Frage etwas anspruchsvoller machen.'
      - 'Klein: Die Erklärung könnte erwähnen, dass die Schweiz eine direkte Demokratie ist, zum Beispiel
        mit dem Satz «Die Schweiz ist eine direkte Demokratie: Das Volk wählt und stimmt auch direkt über
        Sachfragen ab.»'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung könnte «direkte Demokratie» erwähnen, damit sie näher an der Broschüre ist,
        zum Beispiel: «Die Schweiz ist eine direkte Demokratie: Das Volk wählt das Parlament und stimmt
        über Sachfragen ab.»'
      - 'Klein: Die Erklärung sagt, die Bundesverfassung halte die Demokratie als Grundlage des Staates
        fest. Das stützt keine der angegebenen Quellen ausdrücklich. Besser wäre, diesen Satz zu streichen
