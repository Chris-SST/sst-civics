topic: bund.demokratie.staatsprinzipien
question_de: Welche Staatsform hat die Schweiz?
options_de:
  a: Sie ist eine Diktatur mit einer einzigen Partei.
  b: Sie ist eine Monarchie mit einem gewählten König.
  c: Sie ist ein demokratischer Staat.
  d: Sie ist ein Staat, der von einer Adelsfamilie regiert wird.
correct: c
explanation_de: Die Schweiz ist eine Demokratie. Die Bevölkerung wirkt über Wahlen und Abstimmungen an
  den politischen Entscheiden mit. Die Bundesverfassung hält dies als Grundlage des Staates fest.
