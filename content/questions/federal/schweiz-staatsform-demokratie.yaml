      verdict: approve
      issues:
      - 'Klein: Der Satz «Die Bundesverfassung hält dies als Grundlage des Staates fest» ist etwas vage;
        besser wäre etwa «Schon die Präambel der Bundesverfassung nennt die Demokratie als Ziel des Staates».'
      - 'Klein: Die Erklärung könnte den Begriff «direkte Demokratie» nennen, da er im Test oft vorkommt,
        zum Beispiel: «Weil das Volk auch über Sachfragen abstimmt, nennt man die Schweiz eine direkte
        Demokratie.»'
    - role: exam
      model: claude-opus-5-5
