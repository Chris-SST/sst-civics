id: bundesverwaltung-justiz-und-polizeidepartement
version: 1
scope: federal
canton: null
topic: bund.demokratie.bundesrat
question_de: Welche der folgenden Einheiten gehört zur Bundesverwaltung?
options_de:
  a: Der Nationalrat
  b: Die Bundesversammlung
  c: Das Bundesgericht
  d: Das Justiz- und Polizeidepartement
correct: d
explanation_de: Die Bundesverwaltung ist in Departemente gegliedert. Das Justiz- und Polizeidepartement
  ist eines davon und gehört zur Verwaltung unter der Leitung des Bundesrats. Nationalrat und Bundesversammlung
  gehören zum Parlament, das Bundesgericht zur Justiz.
