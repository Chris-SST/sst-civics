    reasoning: Das Eidgenössische Justiz- und Polizeidepartement ist ein Departement des Bundesrates und
      gehört damit zur Bundesverwaltung, während Nationalrat und Bundesversammlung zur Legislative und
      das Bundesgericht zur Judikative zählen.
  source:
    verdict: supported
    note: Quelle 1 nennt das Eidgenössische Justiz- und Polizeidepartement (EJPD) unter den Departementen
      als zentralen Organisationseinheiten der Bundesverwaltung, die vom Bundesrat geführt wird. Die Zuordnung
      von Nationalrat, Bundesversammlung und Bundesgericht zu Parlament bzw. Justiz wird nur indirekt
      gestützt (Verweise auf «Das Schweizer Parlament» und «Schweizerische Gerichte»), ändert aber die
      richtige Antwort nicht.
