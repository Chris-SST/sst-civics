topic: bund.international
question_de: In welcher Schweizer Stadt ist der Weltfussballverband FIFA ansässig?
options_de:
  a: Zürich
  b: Bern
  c: Luzern
  d: Genf
correct: a
explanation_de: Die FIFA hat ihren Sitz in Zürich. Die Schweiz ist Standort vieler internationaler Sportverbände,
  etwa auch des Internationalen Olympischen Komitees in Lausanne.
