question_de: Was geschieht beim Morgestraich, dem Beginn der Basler Fasnacht?
options_de:
  a: Der Bürgermeister übergibt den Stadtschlüssel an die Fasnachtsgesellschaft.
  b: Die Gassen werden hell beleuchtet und ein Feuerwerk beginnt.
  c: Die Lichter in den Gassen gehen aus, dann beginnen Pfeifen und Trommeln zu spielen.
  d: Die Fasnächtler werfen Konfetti vom Münsterturm und läuten alle Kirchenglocken.
correct: c
explanation_de: Der Morgestraich beginnt am Montag nach Aschermittwoch um vier Uhr morgens. Dann werden
  die Lichter in den Gassen gelöscht. Danach setzt das Spiel von Pfeifen und Trommeln ein.
