    note: Quelle 2 sagt, wer in der Schweiz arbeitet oder wohnt, sei versichert und beitragspflichtig,
      und spricht von der «obligatorischen AHV/IV/EO-Versicherung». Auch Selbständige und Nichterwerbstätige
      zahlen Beiträge. Damit sind b, c und d widerlegt.
