id: ahv-pflichtversicherung
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche Aussage zur AHV ist richtig?
options_de:
  a: Die AHV gehört zu den Pflichtversicherungen.
  b: Die AHV ist eine freiwillige Versicherung für Selbständige.
  c: Die AHV gilt nur für Personen mit Schweizer Pass.
  d: Die AHV ist eine private Versicherung der Arbeitgeber.
correct: a
explanation_de: Die AHV ist obligatorisch. Wer in der Schweiz wohnt oder arbeitet, ist grundsätzlich versichert
  und muss Beiträge zahlen.
