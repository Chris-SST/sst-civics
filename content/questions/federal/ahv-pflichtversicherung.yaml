    reasoning: Die AHV ist die obligatorische staatliche Alters- und Hinterlassenenversicherung, die für
      alle in der Schweiz wohnhaften oder erwerbstätigen Personen unabhängig von der Staatsangehörigkeit
      gilt, und gehört damit zu den Pflichtversicherungen.
  source:
