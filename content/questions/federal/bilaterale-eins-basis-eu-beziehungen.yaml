topic: bund.geschichte.weltkriege_neutralitaet
question_de: Welche Verträge, vom Volk im Jahr 2000 angenommen, bilden die Basis der heutigen Beziehungen
  der Schweiz zur EU?
options_de:
  a: Die Bilateralen I
  b: Der EWR-Vertrag
  c: Der Schengen-Vertrag allein
  d: Der Beitrittsvertrag zur EU
correct: a
explanation_de: Das Stimmvolk nahm die Bilateralen I im Jahr 2000 an. Sie regeln den Zugang zu bestimmten
  Bereichen des Binnenmarkts, zum Beispiel Personenfreizügigkeit und Landverkehr. Dem EWR hatte das Volk
  1992 nicht zugestimmt.
