    reasoning: Das Schweizer Stimmvolk hat im Mai 2000 die Bilateralen I mit der EU angenommen, die bis
      heute die Grundlage der Beziehungen bilden, während der EWR 1992 abgelehnt wurde, Schengen erst
      2005 angenommen wurde und es nie einen EU-Beitrittsvertrag gab.
  source:
    verdict: supported
    note: Die Seite nennt die Abstimmung vom 21. Mai 2000, bei der das Volk die Bilateralen Abkommen I
      angenommen hat, und die Ablehnung des EWR am 6. Dezember 1992. Dass sie die Basis der heutigen Beziehungen
      bilden und Personenfreizügigkeit und Landverkehr regeln, steht auf der Seite nicht ausdrücklich;
      die Kernaussage von Antwort und Erklärung ist aber gestützt.
