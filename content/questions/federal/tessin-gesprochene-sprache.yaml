topic: bund.geografie.sprachen
question_de: Welche Sprache wird im Kanton Tessin gesprochen?
options_de:
  a: Rätoromanisch
  b: Französisch
  c: Italienisch
  d: Deutsch
correct: c
explanation_de: Im Tessin ist Italienisch die Sprache der Bevölkerung und die Amtssprache des Kantons.
  Italienisch ist eine der vier Landessprachen der Schweiz. Es wird auch in Teilen Graubündens gesprochen.
