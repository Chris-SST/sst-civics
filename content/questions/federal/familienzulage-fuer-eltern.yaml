id: familienzulage-fuer-eltern
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche staatliche Leistung erhalten Eltern in der Schweiz, wenn sie angestellt oder selbstständig
  erwerbstätig sind und Kinder haben?
options_de:
  a: Die Invalidenrente
  b: Die Arbeitslosenentschädigung
  c: Die Ergänzungsleistung zur AHV
  d: Die Familienzulage
correct: d
explanation_de: Die Familienzulagen helfen Familien, einen Teil der Kosten für Kinder zu tragen. Sie bestehen
  aus Kinderzulagen und Ausbildungszulagen. Auch Selbstständigerwerbende können sie erhalten.
