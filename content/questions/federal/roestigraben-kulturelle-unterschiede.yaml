id: roestigraben-kulturelle-unterschiede
version: 1
scope: federal
canton: null
topic: bund.geografie.sprachen
question_de: Was bezeichnet man in der Schweiz mit dem Begriff «Röstigraben»?
options_de:
  a: Die Alpen als Trennlinie zwischen Nord und Süd
  b: Die Unterschiede zwischen Stadt und Land
  c: Die Grenze zwischen der Schweiz und Deutschland
  d: Die kulturellen Unterschiede zwischen der Deutschschweiz und der Romandie
correct: d
explanation_de: Der Begriff «Röstigraben» ist ein bildlicher Ausdruck. Er beschreibt die kulturellen Unterschiede
  zwischen der Deutschschweiz und der französischsprachigen Romandie. Diese zeigen sich zum Beispiel manchmal
  bei Abstimmungen.
