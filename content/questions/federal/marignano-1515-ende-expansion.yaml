id: marignano-1515-ende-expansion
version: 1
scope: federal
canton: null
topic: bund.geschichte.gruendung
question_de: Welche Folge hatte die Niederlage der Eidgenossen bei Marignano im Jahr 1515?
options_de:
  a: Sie lösten den Bund der Orte auf.
  b: Sie beendeten ihre Expansionspolitik.
  c: Sie führten die Reformation ein.
  d: Sie eroberten danach Mailand dauerhaft.
correct: b
explanation_de: Nach Marignano gaben die Eidgenossen ihre Politik der Eroberung auf. Das gilt als Anfang
  der späteren Neutralität. Der Bund der Orte blieb bestehen.
