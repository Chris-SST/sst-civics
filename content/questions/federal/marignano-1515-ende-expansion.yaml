    reasoning: Nach der Niederlage bei Marignano 1515 gaben die Eidgenossen ihre Expansionspolitik in
      Oberitalien auf und gingen zur Neutralität über, während der Bund weiterbestand, die Reformation
      erst ab 1519 von Zwingli ausging und Mailand nicht dauerhaft erobert wurde.
  source:
    verdict: unclear
    note: Quelle 3 sagt nur, dass die Neutralität der Schweiz auf die Niederlage bei Marignano 1515 (und
      den Westfälischen Frieden 1648) zurückgeht. Dass die Eidgenossen danach ihre Expansionspolitik beendeten
      und der Bund der Orte bestehen blieb, steht in keiner Quelle ausdrücklich. Die Quellen 1 und 2 äussern
      sich nicht zu Marignano.
