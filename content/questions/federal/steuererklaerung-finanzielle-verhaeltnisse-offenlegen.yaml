id: steuererklaerung-finanzielle-verhaeltnisse-offenlegen
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wozu dient die Steuererklärung, die Steuerpflichtige jedes Jahr ausfüllen?
options_de:
  a: Sie dient der Registrierung beim Einwohneramt.
  b: Sie ist der Antrag auf eine Krankenversicherung.
  c: Sie ist die Anmeldung für den Zivildienst.
  d: Sie legt gegenüber den Steuerbehörden die finanziellen Verhältnisse offen.
correct: d
explanation_de: Mit der Steuererklärung geben Steuerpflichtige Einkommen, Vermögen und Abzüge an. Auf
  dieser Grundlage berechnet die Steuerbehörde die Steuer.
