id: steuerhoehe-richtet-sich-nach-einkommen-vermoegen
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wovon hängt es hauptsächlich ab, wie viel Einkommens- und Vermögenssteuer eine Person im
  Kanton Zürich zahlt?
options_de:
  a: Vom steuerpflichtigen Einkommen und Vermögen
  b: Vom Beruf der Person
  c: Von der Dauer des Wohnsitzes in der Gemeinde
  d: Von der Anzahl der Stimmrechtsausübungen
correct: a
explanation_de: Die Steuer wird auf dem steuerpflichtigen Einkommen und Vermögen berechnet. Wer mehr verdient
  oder besitzt, zahlt in der Regel mehr Steuern.
