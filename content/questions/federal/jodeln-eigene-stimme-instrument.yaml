    note: Quelle 1 beschreibt das Jodeln als text- und wortlose Singweise mit Wechsel zwischen Kopf- und
      Brustregister, Quelle 2 als Gesangstechnik mit bedeutungsfreien Silben. Damit ist die Stimme das
      Instrument. Instrumente wie das Akkordeon erscheinen nur als gelegentliche Begleitung. Alphorn und
      Schwyzerörgeli werden nicht erwähnt, die Verbindung in der Erklärung ist also nicht belegt, ändert
