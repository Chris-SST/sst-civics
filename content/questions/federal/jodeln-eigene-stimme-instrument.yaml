      - 'Klein: In der Erklärung «ohne Worte» auf den Naturjodel und den gejodelten Teil beschränken,
        da Jodellieder auch Strophen mit Text haben, etwa: «Beim Jodeln singt man ohne Worte, nur mit
        Silben (beim Jodellied im Refrain)».'
      - 'Klein: Der Satz in der Erklärung, Jodeln werde oft mit dem Schwyzerörgeli verbunden, macht eine
