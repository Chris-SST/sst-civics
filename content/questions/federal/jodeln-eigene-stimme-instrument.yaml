id: jodeln-eigene-stimme-instrument
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Was dient beim Jodeln als Instrument?
options_de:
  a: Das Alphorn
  b: Die eigene Stimme
  c: Das Schwyzerörgeli
  d: Die Handorgel
correct: b
explanation_de: Beim Jodeln singt man ohne Worte, meist nur mit Silben, und wechselt schnell zwischen
  Brust- und Kopfstimme. Die Stimme selbst ist das Instrument. Jodeln gehört zum Brauchtum der Schweiz
  und wird oft mit dem Alphorn oder dem Schwyzerörgeli verbunden.
