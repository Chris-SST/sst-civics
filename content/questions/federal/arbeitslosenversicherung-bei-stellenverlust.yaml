    reasoning: Bei Verlust der Arbeitsstelle springt die Arbeitslosenversicherung (ALV) ein, die Taggelder
      und Unterstützung bei der Stellensuche bietet, während IV, AHV und Unfallversicherung andere Risiken
      abdecken.
  source:
    verdict: supported
    note: Quelle 1 (AVIG) regelt, dass die versicherte Person bei Arbeitslosigkeit Anspruch auf Arbeitslosenentschädigung
      hat, und verlangt Bemühungen und Vermittlung bei der Stellensuche. Quelle 2 (Glossar) nennt die
      Arbeitslosenversicherung als Beispiel, wenn jemand keine Arbeit findet.
