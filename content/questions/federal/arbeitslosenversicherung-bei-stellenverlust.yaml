id: arbeitslosenversicherung-bei-stellenverlust
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche Sozialversicherung greift, wenn eine Person ihre Arbeitsstelle verliert?
options_de:
  a: Die Invalidenversicherung
  b: Die Alters- und Hinterlassenenversicherung
  c: Die Arbeitslosenversicherung
  d: Die Unfallversicherung
correct: c
explanation_de: Die Arbeitslosenversicherung zahlt unter bestimmten Bedingungen eine Entschädigung, wenn
  jemand die Stelle verliert. Sie hilft auch bei der Suche nach neuer Arbeit.
sources:
