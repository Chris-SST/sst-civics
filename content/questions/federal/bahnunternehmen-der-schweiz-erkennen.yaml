id: bahnunternehmen-der-schweiz-erkennen
version: 1
scope: federal
canton: null
topic: bund.alltag
question_de: Welche der folgenden Abkürzungen stehen alle für Bahnunternehmen der Schweiz?
options_de:
  a: SOB, SEM, BLS und SZU
  b: SBB, BLS, SOB und SZU
  c: SBB, SRF, SOB und SUVA
  d: BLS, SZU, SNB und SBB
correct: b
explanation_de: SBB, BLS, SOB und SZU sind Bahnunternehmen, die in der Schweiz Züge betreiben. Die SBB
  sind das grösste Unternehmen, die anderen sind kleinere Bahnen, die oft regional unterwegs sind. Die
  anderen Abkürzungen stehen für Organisationen wie die Nationalbank (SNB), das Staatssekretariat für
  Migration (SEM) oder die Unfallversicherung (SUVA).
