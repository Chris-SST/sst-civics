id: dienstpflicht-nur-maenner-bis-alter
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wer ist in der Schweiz verpflichtet, bis zu einem bestimmten Alter Militärdienst oder Ersatzdienst
  zu leisten?
options_de:
  a: Nur die Männer
  b: Frauen und Männer gleichermassen
  c: Nur Personen mit einer Ausbildung
  d: Nur Personen, die in einer Gemeinde ein Amt haben
correct: a
explanation_de: Die Dienstpflicht gilt in der Schweiz nur für Männer. Für Frauen ist der Militärdienst
  freiwillig. Die Pflicht dauert bis zu einem gesetzlich festgelegten Alter.
