    reasoning: Nach Art. 59 der Bundesverfassung sind nur Schweizer Männer zum Militärdienst oder zivilen
      Ersatzdienst verpflichtet, während der Dienst für Frauen freiwillig ist.
  source:
    verdict: supported
    note: 'Art. 59 BV (Quelle 1) sagt: «Jeder Schweizer ist verpflichtet, Militärdienst zu leisten. Das
      Gesetz sieht einen zivilen Ersatzdienst vor» und «Für Schweizerinnen ist der Militärdienst freiwillig».
      Das stützt Antwort a und den Kern der Erklärung. Die Altersgrenze wird im gezeigten Text nicht genannt,
      aber die Antwort hängt nicht davon ab.'
