question_de: Wo erhält man Auskünfte zu Lehrstellen, Berufswahl und Arbeit?
options_de:
  a: Im Berufsinformationszentrum
  b: Im Zivilstandsamt
  c: Im Kindergarten
  d: Im Betreibungsamt
