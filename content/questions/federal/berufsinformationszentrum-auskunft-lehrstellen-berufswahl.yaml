explanation_de: Das Berufsinformationszentrum (BIZ) informiert und berät zu Lehrstellen, Berufswahl, Weiterbildung
  und Arbeit. Das Angebot steht Jugendlichen und Erwachsenen offen. Die anderen Stellen haben andere Aufgaben.
