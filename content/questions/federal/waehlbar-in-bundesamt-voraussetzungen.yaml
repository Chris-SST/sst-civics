id: waehlbar-in-bundesamt-voraussetzungen
version: 2
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Wer kann in den Nationalrat, in den Bundesrat oder ins Bundesgericht gewählt werden?
options_de:
  a: Nur wer eine Hochschule abgeschlossen hat
  b: Nur wer seit mindestens zehn Jahren in der Schweiz wohnt
  c: Nur wer Mitglied einer politischen Partei ist
  d: Alle stimmberechtigten Schweizerinnen und Schweizer ab 18 Jahren
correct: d
explanation_de: Laut Bundesverfassung sind alle Stimmberechtigten wählbar. Stimmberechtigt sind Schweizerinnen
  und Schweizer ab 18 Jahren. Eine Parteimitgliedschaft oder eine bestimmte Ausbildung braucht es nicht.
