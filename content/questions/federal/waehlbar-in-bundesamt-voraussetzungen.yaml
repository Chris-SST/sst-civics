id: waehlbar-in-bundesamt-voraussetzungen
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Welche Voraussetzungen muss erfüllen, wer in ein Bundesamt wählbar sein will?
options_de:
  a: Abgeschlossene Hochschulausbildung
  b: Wohnsitz in der Schweiz seit mindestens zehn Jahren
  c: Mitgliedschaft in einer politischen Partei
  d: Schweizer Staatsangehörigkeit und Mündigkeit
correct: d
explanation_de: Wählbar ist, wer das Schweizer Bürgerrecht besitzt und mündig ist. Eine Parteimitgliedschaft
  oder eine bestimmte Ausbildung wird nicht verlangt.
