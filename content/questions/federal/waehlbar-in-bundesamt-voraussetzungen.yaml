    reasoning: Wählbar in Bundesbehörden ist nach der Bundesverfassung, wer stimmberechtigt ist, also
      Schweizer Bürgerin oder Bürger und mindestens 18 Jahre alt (mündig) ist, während Hochschulabschluss,
      zehnjähriger Wohnsitz oder Parteimitgliedschaft nicht verlangt werden.
  source:
    verdict: unclear
    note: Die Quellen nennen Schweizer Bürgerrecht und Alter 18 als Voraussetzung für die Wählbarkeit
      ins Parlament (Quelle 1, 3) und dass man auch ohne Partei gewählt werden kann (Quelle 3). Von einem
      «Bundesamt» ist aber nirgends die Rede, ebenso wenig von Ausbildung oder Wohnsitz als Voraussetzung.
      Die Frage bezieht sich auf ein Bundesamt, die Quellen behandeln nur die Wählbarkeit in den Nationalrat;
      die Antwort ist daher nicht eindeutig belegt.
