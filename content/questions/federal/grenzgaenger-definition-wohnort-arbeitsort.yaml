topic: bund.sozial.wirtschaft_arbeit
question_de: Wer gilt in der Schweiz als Grenzgängerin oder Grenzgänger?
options_de:
  a: Eine Person, die in der Schweiz arbeitet, ihren Wohnsitz aber im Ausland hat und regelmässig dorthin
    zurückkehrt
  b: Eine Person, die beim Zoll arbeitet und die Landesgrenze kontrolliert
  c: Eine Person, die ohne Bewilligung über die Grenze kommt, um hier zu arbeiten
  d: Eine Person, die in einem Kanton wohnt und jeden Tag in einem anderen Kanton arbeitet
correct: a
explanation_de: Grenzgängerinnen und Grenzgänger haben ihre Arbeitsstelle in der Schweiz, wohnen aber
  in einem anderen Land. Sie brauchen eine Grenzgängerbewilligung und kehren regelmässig, mindestens einmal
  pro Woche, an ihren Wohnort im Ausland zurück. Wer nur zwischen zwei Kantonen pendelt, ist kein Grenzgänger.
