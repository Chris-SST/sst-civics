    reasoning: Ein Grenzgänger (Grenzgängerbewilligung G) ist eine Person, die im Ausland wohnt und in
      der Schweiz arbeitet, in der Regel in der Grenzzone und mit mindestens wöchentlicher Rückkehr an
      den Wohnort.
  source:
    verdict: supported
    note: Quelle 1 (SEM) definiert Grenzgängerinnen und Grenzgänger als Personen, die in einem EU/EFTA-Staat
      wohnen und in der Schweiz arbeiten, und nennt die Grenzgängerbewilligung. Das stützt Antwort a und
      die Erklärung. Die genannten Herkunftsländer (Deutschland, Frankreich, Italien, Österreich) stehen
      nicht ausdrücklich auf der Seite, und «nahe der Grenze» wird dort sogar relativiert, weil keine
      Grenzzonen mehr gelten. Quellen 2 und 3 liefern dazu nichts Eindeutiges.
