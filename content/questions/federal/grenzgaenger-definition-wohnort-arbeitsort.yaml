topic: bund.sozial.wirtschaft_arbeit
question_de: Was versteht man in der Schweiz unter einem Grenzgänger?
options_de:
  a: Eine Person, die in der Schweiz arbeitet, aber im Ausland nahe der Grenze wohnt
  b: Eine Person, die für den Zoll an der Landesgrenze arbeitet
  c: Eine Person, die ohne Bewilligung die Grenze überquert, um zu arbeiten
  d: Eine Person, die in der Schweiz wohnt, aber täglich im Ausland arbeitet
correct: a
explanation_de: Grenzgängerinnen und Grenzgänger haben ihre Arbeitsstelle in der Schweiz, wohnen aber
  jenseits der Landesgrenze. Sie brauchen dafür eine besondere Bewilligung. Sie kommen zum Beispiel aus
  Deutschland, Frankreich, Italien oder Österreich.
