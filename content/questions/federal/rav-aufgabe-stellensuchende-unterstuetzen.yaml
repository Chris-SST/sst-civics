topic: bund.sozial.wirtschaft_arbeit
question_de: Welche Aufgabe hat das Regionale Arbeitsvermittlungszentrum (RAV)?
options_de:
  a: Es kontrolliert die Löhne in den Betrieben
  b: Es zahlt allen Einwohnern eine Rente aus
  c: Es unterstützt Stellensuchende bei der Arbeitssuche und vermittelt Stellen
  d: Es stellt Arbeitszeugnisse für Stellensuchende aus
correct: c
explanation_de: Das RAV ist die regionale Anlaufstelle für Stellensuchende. Es berät sie und vermittelt
  ihnen Stellen. Im Kanton Zürich gehört es zum Amt für Arbeit.
