  panel:
    verdict: approve
    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die USA sind das wichtigste einzelne Exportland der Schweiz; die Erklärung könnte das
        kurz aufnehmen, damit niemand Antwort d) für vertretbar hält, etwa: «Die USA sind zwar das wichtigste
        einzelne Exportland, aber mit allen EU-Ländern zusammen handelt die Schweiz viel mehr.»'
      - 'Klein: «Deshalb» stellt den Zusammenhang zwischen Handel und Verträgen zu einfach dar; besser
        wäre: «Die Beziehungen zur EU sind deshalb durch die bilateralen Abkommen geregelt, zum Beispiel
        das Freihandelsabkommen von 1972 und die Bilateralen I und II.»'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die USA sind das wichtigste einzelne Exportland der Schweiz, was Lernende verwirren kann;
        die Erklärung sollte ergänzen, dass die EU als Ganzes vor den USA und China liegt (z. B. «Zusammen
        sind die EU-Länder der wichtigste Partner, noch vor den USA und China»).'
      - 'Klein: Das «deshalb» in der Erklärung stellt einen zu einfachen Zusammenhang her, und «läuft
        mit» ist umgangssprachlich; besser: «Der grösste Teil des Schweizer Handels mit dem Ausland findet
        mit Ländern der EU statt. Die Schweiz und die EU haben darum viele bilaterale Verträge abgeschlossen,
        zum Beispiel über den freien Handel.»'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung könnte konkreter sein, zum Beispiel mit der Angabe, dass rund die Hälfte
        der Schweizer Exporte und etwa 60 bis 70 Prozent der Importe auf die EU entfallen.'
      - 'Klein: Die Erklärung sagt «deshalb» verbunden durch Verträge, das ist eine leicht verkürzte Begründung.
        Besser wäre: «Die Schweiz hat mit der EU viele bilaterale Verträge, um den Handel zu erleichtern.»'
