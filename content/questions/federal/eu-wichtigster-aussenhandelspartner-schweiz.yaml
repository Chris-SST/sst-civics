checks:
  independent_answer:
    option: c
    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Die Europäische Union ist mit rund der Hälfte der Schweizer Exporte und über der Hälfte
      der Importe der mit Abstand wichtigste Handelspartner der Schweiz.
  source:
    verdict: supported
    note: Quelle 1 (SECO) nennt die EU ausdrücklich «die mit Abstand wichtigste Handelspartnerin der Schweiz».
      Damit ist Antwort c) gestützt; die Verbundenheit durch bilaterale Verträge steht ebenfalls auf der
      Seite.
    at: *id001
