id: eu-wichtigster-aussenhandelspartner-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Wer ist für die Schweizer Wirtschaft der bedeutendste Partner im Aussenhandel?
options_de:
  a: China
  b: Japan
  c: Die Europäische Union
  d: Die Vereinigten Staaten von Amerika
correct: c
explanation_de: Der grösste Teil des Schweizer Handels mit dem Ausland läuft mit den Ländern der Europäischen
  Union. Die Schweiz ist deshalb mit der EU durch verschiedene Verträge verbunden.
