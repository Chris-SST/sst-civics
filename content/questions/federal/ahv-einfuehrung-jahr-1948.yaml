id: ahv-einfuehrung-jahr-1948
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: In welchem Jahr wurde die AHV, die staatliche Rentenversicherung für Alter und Hinterbliebene,
  eingeführt?
options_de:
  a: '1975'
  b: '1918'
  c: '1930'
  d: '1948'
correct: d
explanation_de: Die AHV nahm 1948 ihre Tätigkeit auf, nachdem das Volk das Gesetz 1947 angenommen hatte.
  Sie bildet die erste Säule des Schweizer Dreisäulensystems. Sie sichert die Existenz im Alter und für
  Hinterbliebene.
