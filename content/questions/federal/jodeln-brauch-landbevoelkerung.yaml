topic: bund.kultur.feiertage_brauchtum
question_de: Welcher überlieferte Brauch der Schweizer Landbevölkerung ist eine Art zu singen, bei der
  die Stimme schnell zwischen Brust- und Kopfstimme wechselt?
options_de:
  a: Alphornblasen
  b: Jodeln
  c: Hornussen
  d: Fahnenschwingen
correct: b
explanation_de: Beim Jodeln wechselt die Stimme schnell zwischen Brust- und Kopfstimme. Jodeln ist ein
  überlieferter Brauch der Schweizer Landbevölkerung. Der Naturjodel kommt ohne Worte aus, viele Jodellieder
  haben aber einen Text.
