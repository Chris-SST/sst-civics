topic: bund.kultur.feiertage_brauchtum
question_de: Welcher überlieferte Brauch der Schweizer Landbevölkerung ist ein Gesang ohne Text, bei dem
  die Stimme schnell zwischen Brust- und Kopfstimme wechselt?
options_de:
  a: Alphornblasen
  b: Jodeln
  c: Silvesterchlausen
  d: Fahnenschwingen
correct: b
explanation_de: Jodeln gehört zu den überlieferten Bräuchen der Schweizer Landbevölkerung. Typisch ist
  der Wechsel zwischen Brust- und Kopfstimme. Es gibt Jodlerklubs und Jodlerfeste im ganzen Land.
