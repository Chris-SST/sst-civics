id: staenderat-vertritt-anliegen-kantone
version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Welche Kammer des Parlaments nimmt hauptsächlich die Anliegen der Kantone wahr?
options_de:
  a: Der Bundesrat
  b: Der Nationalrat
  c: Der Ständerat
  d: Das Bundesgericht
correct: c
explanation_de: Der Ständerat vertritt vor allem die Kantone. Jeder Kanton schickt Vertreterinnen und
  Vertreter in diese Kammer. Der Nationalrat vertritt dagegen das Volk.
