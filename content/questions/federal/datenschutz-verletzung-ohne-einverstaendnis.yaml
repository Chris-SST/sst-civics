id: datenschutz-verletzung-ohne-einverstaendnis
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: In welchem Fall wird der Datenschutz verletzt?
options_de:
  a: Private Angaben über eine Person werden ohne ihr Einverständnis und ohne gesetzliche Grundlage bekannt
    gemacht.
  b: Eine Behörde speichert Daten, wie es ein Gesetz verlangt.
  c: Eine Person gibt freiwillig ihre eigene Adresse an.
  d: Eine Person erlaubt ausdrücklich die Veröffentlichung ihres Fotos.
correct: a
explanation_de: Der Schutz der Privatsphäre umfasst den Schutz vor dem Missbrauch persönlicher Daten.
  Private Informationen dürfen nur mit Einverständnis der Person oder aufgrund eines Gesetzes bekannt
  gemacht werden. Fehlt beides, liegt eine Verletzung vor.
