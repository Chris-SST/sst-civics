    reasoning: Der Datenschutz wird verletzt, wenn private Angaben über eine Person ohne ihr Einverständnis
      und ohne gesetzliche Grundlage bekannt gemacht werden, während die übrigen Fälle auf Gesetz oder
      Einwilligung beruhen.
  source:
    verdict: supported
    note: Das DSG verlangt für die Bearbeitung durch Bundesorgane eine gesetzliche Grundlage und für die
      Bekanntgabe eine gesetzliche Grundlage oder Einwilligung bzw. allgemein zugängliche Daten. Es dient
      dem Schutz der Persönlichkeit. Damit stützt es, dass Bekanntgabe ohne Einverständnis und ohne gesetzliche
      Grundlage den Datenschutz verletzt; die Aussage zu privaten Personen ist weniger ausdrücklich.
