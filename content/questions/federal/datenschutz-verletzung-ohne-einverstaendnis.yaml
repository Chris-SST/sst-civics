      verdict: approve
      issues:
      - 'Klein: Die Erklärung sagt, private Angaben dürften «nur» mit Einverständnis oder aufgrund eines
        Gesetzes bekannt gemacht werden; nach dem DSG (Art. 31) kann bei Privaten auch ein überwiegendes
        privates oder öffentliches Interesse eine Bekanntgabe rechtfertigen, deshalb besser «in der Regel
        nur» schreiben.'
      - 'Klein: Die Tatsache der Themenliste verbindet die Bedingungen mit «oder». Logisch korrekt ist
        das «und» in Antwort a), denn schon eine der beiden Grundlagen reicht aus. Die Frage ist so richtig
        formuliert und sollte nicht an die Themenliste angepasst werden.'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die richtige Antwort a) ist viel länger und genauer als die anderen und fällt dadurch
        sofort auf; besser die falschen Antworten ähnlich lang formulieren, etwa «Eine Behörde speichert
        Daten, weil ein Gesetz dies ausdrücklich verlangt.»'
      - 'Klein: Die falschen Antworten c) und d) sind sehr leicht als falsch zu erkennen; eine plausiblere
        Ablenkung wäre zum Beispiel «Eine Zeitung berichtet mit Erlaubnis der Person über ihre Krankheit.»'
      - 'Klein: In der Erklärung «nur mit Einverständnis oder aufgrund eines Gesetzes» durch «in der Regel
        nur mit Einverständnis oder aufgrund eines Gesetzes» ersetzen, weil das Datenschutzgesetz auch
        andere Rechtfertigungen kennt, etwa ein überwiegendes Interesse.'
    - role: second
