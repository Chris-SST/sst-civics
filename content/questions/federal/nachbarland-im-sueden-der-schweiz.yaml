id: nachbarland-im-sueden-der-schweiz
version: 1
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Welches Land liegt südlich der Schweiz und grenzt an sie?
options_de:
  a: Spanien
  b: Italien
  c: Slowenien
  d: Frankreich
correct: b
explanation_de: Italien ist der südliche Nachbar der Schweiz. Die Grenze verläuft unter anderem durch
  die Alpen und über das Tessin und Graubünden. Spanien und Slowenien grenzen nicht an die Schweiz.
