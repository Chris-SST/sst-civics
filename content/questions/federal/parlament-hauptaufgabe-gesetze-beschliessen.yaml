    reasoning: Die Bundesversammlung (Nationalrat und Ständerat) ist die gesetzgebende Gewalt des Bundes
      und hat als Hauptaufgabe, Gesetze zu beraten und zu verabschieden, während Polizei und Vollzug Sache
      der Exekutive und Streitentscheide Sache der Gerichte sind.
