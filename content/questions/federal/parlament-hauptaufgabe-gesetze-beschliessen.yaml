id: parlament-hauptaufgabe-gesetze-beschliessen
version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Was ist die wichtigste Aufgabe des Bundesparlaments?
options_de:
  a: Die Polizei im ganzen Land zu leiten
  b: Streitfälle zwischen Personen zu entscheiden
  c: Gesetze zu beraten und zu verabschieden
  d: Gesetze im Alltag durchzusetzen
correct: c
explanation_de: Das Parlament ist die gesetzgebende Gewalt. Es berät und beschliesst die Bundesgesetze.
  Die Regierung setzt sie um, und die Gerichte urteilen in Streitfällen.
