id: mutterschaftsurlaub-anspruch-erwerbstaetige-frauen
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wer hat in der Schweiz nach der Geburt eines Kindes einen gesetzlichen Anspruch auf Mutterschaftsurlaub?
options_de:
  a: Nur Frauen, die in einem Betrieb mit mehr als 50 Angestellten arbeiten
  b: Jede erwerbstätige Frau, die ein Kind zur Welt bringt
  c: Nur Frauen, die verheiratet sind
  d: Nur Frauen mit Schweizer Bürgerrecht
correct: b
explanation_de: Das Gesetz sieht für erwerbstätige Mütter einen Anspruch auf Mutterschaftsurlaub und eine
  Entschädigung vor. Die Betriebsgrösse, die Staatsangehörigkeit und der Zivilstand spielen dafür keine
  Rolle. Die Entschädigung wird über die Erwerbsersatzordnung finanziert.
