id: mieterverband-vertritt-mietende
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Welche Aufgabe hat der Mieterverband?
options_de:
  a: Er vertritt die Anliegen der Hauseigentümer
  b: Er legt die Mietzinse für alle Wohnungen fest
  c: Er vermietet Wohnungen im Auftrag des Kantons
  d: Er vertritt die Anliegen der Mietenden
correct: d
explanation_de: Der Mieterverband ist eine Organisation, die sich für die Interessen der Mietenden einsetzt.
  Er berät seine Mitglieder zum Beispiel bei Fragen zum Mietrecht. Die Interessen der Hauseigentümer vertreten
  andere Verbände.
