    reasoning: Der Mieterverband ist eine Interessenvertretung, die die Anliegen der Mietenden vertritt
      und sie berät, während Hauseigentümer vom Hauseigentümerverband vertreten werden und weder Mietzinse
      festgelegt noch Wohnungen im Auftrag des Kantons vermietet werden.
  source:
    verdict: supported
    note: Die Broschüre (Abschnitt «Miete und Wohnung») sagt, der Mieterinnen- und Mieterverband schaue,
      dass die mietenden Personen beim Mietvertrag gut behandelt werden, und mietende Personen könnten
      sich bei Fragen oder Problemen an ihn wenden. Das stützt Antwort d; die weiteren Aussagen der Erklärung
      (andere Verbände für Hauseigentümer) stehen nicht ausdrücklich da, sind aber für die Antwort nicht
      nötig.
