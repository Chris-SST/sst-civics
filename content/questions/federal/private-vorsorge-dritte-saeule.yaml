id: private-vorsorge-dritte-saeule
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Was bildet in der Schweiz den dritten Pfeiler der Altersvorsorge?
options_de:
  a: Die obligatorische Unfallversicherung
  b: Die private Vorsorge
  c: Die Pensionskasse des Arbeitgebers
  d: Die Ergänzungsleistungen
correct: b
explanation_de: Der dritte Pfeiler ist die private Vorsorge, zum Beispiel das gebundene Sparen. Sie ist
  freiwillig und ergänzt die ersten beiden Pfeiler.
