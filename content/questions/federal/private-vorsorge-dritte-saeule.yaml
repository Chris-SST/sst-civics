checks:
  independent_answer:
    option: b
    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Der dritte Pfeiler der Schweizer Altersvorsorge ist die private Vorsorge (gebundene Säule
      3a und freie Säule 3b), während die AHV den ersten und die Pensionskasse den zweiten Pfeiler bilden.
  source:
    verdict: supported
    note: Die BSV-Seite nennt als 3. Säule ausdrücklich die private Vorsorge. Sie beschreibt sie als Sparen
      auf Bankkonto oder Police mit Sperrung bis zur Pensionierung und als Deckung zusätzlicher individueller
      Bedürfnisse. Das Wort «freiwillig» steht nicht wörtlich da, ergibt sich aber aus der Beschreibung.
    at: *id001
    model: claude-sonnet-5-5
    version: 1
