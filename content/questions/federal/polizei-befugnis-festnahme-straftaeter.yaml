id: polizei-befugnis-festnahme-straftaeter
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Wer ist befugt, mutmassliche Straftäter festzunehmen?
options_de:
  a: Die Schulbehörde
  b: Die Polizei
  c: Das Parlament
  d: Das Steueramt
correct: b
explanation_de: Die Polizei darf Personen, die verdächtigt werden, eine Straftat begangen zu haben, unter
  den gesetzlichen Voraussetzungen festnehmen. Über eine Verurteilung entscheidet danach ein Gericht.
  Andere Behörden haben diese Befugnis nicht.
