id: polizei-befugnis-festnahme-straftaeter
version: 2
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Welche Stelle darf Personen festnehmen, die verdächtigt werden, eine Straftat begangen zu
  haben?
options_de:
  a: Die Schulbehörde
  b: Die Polizei
  c: Das Parlament
  d: Das Steueramt
correct: b
explanation_de: Die Polizei darf Personen, die einer Straftat verdächtigt werden, unter den gesetzlichen
  Voraussetzungen festnehmen. Ob jemand schuldig ist, entscheidet danach ein Gericht. Die Schulbehörde,
  das Parlament und das Steueramt haben diese Befugnis nicht.
