topic: bund.geografie.sprachen
question_de: Welche Sprachen sind in der Schweiz Landessprachen?
options_de:
  a: Deutsch, Französisch, Rätoromanisch und Spanisch
  b: Deutsch, Französisch, Italienisch und Rätoromanisch
  c: Deutsch, Französisch, Italienisch und Englisch
  d: Deutsch, Französisch und Italienisch
correct: b
explanation_de: Die Bundesverfassung nennt Deutsch, Französisch, Italienisch und Rätoromanisch als Landessprachen.
  Englisch ist keine Landessprache, wird aber oft als Verständigungssprache genutzt.
