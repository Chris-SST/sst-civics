    verdict: unclear
    note: Quelle 1 erklärt nur das Wahlrecht (Regierung und Parlament wählen) und das Stimmrecht (Ja oder
      Nein bei Sachfragen), kennt aber die Begriffe «aktives» und «passives Wahlrecht» nicht. Quelle 1
