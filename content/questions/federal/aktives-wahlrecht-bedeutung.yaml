id: aktives-wahlrecht-bedeutung
version: 2
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Was bedeutet das aktive Wahlrecht?
options_de:
  a: Das Recht, eine Partei zu gründen
  b: Das Recht, selbst in ein Amt gewählt zu werden
  c: Das Recht, im Parlament Vorstösse einzureichen
  d: Das Recht, an Wahlen teilzunehmen und Politikerinnen und Politiker zu wählen
correct: d
explanation_de: 'Aktives Wahlrecht heisst: Man darf selbst wählen, zum Beispiel das Parlament. Das Recht,
  selbst gewählt zu werden, heisst passives Wahlrecht. Bei Sachabstimmungen spricht man vom Stimmrecht.'
