id: aktives-wahlrecht-bedeutung
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Was versteht man unter dem aktiven Wahlrecht?
options_de:
  a: Das Recht, eine Partei zu gründen
  b: Das Recht, sich selbst in ein Amt wählen zu lassen
  c: Das Recht, im Parlament Vorstösse einzureichen
  d: Das Recht, bei Wahlen und Abstimmungen seine Stimme abzugeben
correct: d
explanation_de: Das aktive Wahlrecht bedeutet, dass man bei Wahlen und Abstimmungen mitentscheiden darf.
  Das Recht, selbst gewählt zu werden, heisst passives Wahlrecht.
