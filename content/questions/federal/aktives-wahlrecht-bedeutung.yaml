canton: null
topic: bund.demokratie.wahlen
question_de: Was bedeutet das aktive Wahlrecht?
options_de:
  a: Das Recht, eine Partei zu gründen
  b: Das Recht, selbst in ein Amt gewählt zu werden
  c: Das Recht, im Parlament Vorstösse einzureichen
  d: Das Recht, bei Wahlen und Abstimmungen mitzumachen und die eigene Stimme abzugeben
correct: d
explanation_de: Wer das aktive Wahlrecht hat, darf bei Wahlen und Abstimmungen selbst die Stimme abgeben,
  zum Beispiel bei der Wahl des Nationalrats oder bei einer Volksabstimmung. Das Recht, selbst in ein
  Amt gewählt zu werden, nennt man dagegen passives Wahlrecht.
