id: eidgenoessische-abstimmungstermine-pro-jahr
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie oft im Jahr finden in der Schweiz normalerweise eidgenössische Volksabstimmungen statt?
options_de:
  a: Einmal
  b: Nur alle vier Jahre
  c: Bis zu viermal
  d: Jeden Monat
correct: c
explanation_de: Für eidgenössische Volksabstimmungen sind pro Jahr bis zu vier Abstimmungssonntage vorgesehen.
  An einem Termin wird oft über mehrere Vorlagen gleichzeitig abgestimmt. Alle vier Jahre finden dagegen
  die Wahlen in den Nationalrat statt, die keine Abstimmungen sind.
