question_de: In welchem Kanton wird Rätoromanisch gesprochen?
options_de:
  a: Im Kanton Freiburg
  b: Im Kanton Tessin
  c: Im Kanton Wallis
  d: Im Kanton Graubünden
correct: d
explanation_de: Rätoromanisch ist die vierte Landessprache der Schweiz. Es wird im Kanton Graubünden gesprochen.
  Graubünden ist der einzige dreisprachige Kanton der Schweiz.
