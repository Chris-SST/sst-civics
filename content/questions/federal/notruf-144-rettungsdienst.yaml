id: notruf-144-rettungsdienst
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Welche Telefonnummer wählt man in der Schweiz bei einem medizinischen Notfall, um den Rettungsdienst
  zu rufen?
options_de:
  a: '118'
  b: '117'
  c: '144'
  d: '145'
correct: c
explanation_de: Die Nummer 144 ist der Notruf für den Rettungsdienst bei medizinischen Notfällen. Die
  117 gilt für die Polizei und die 118 für die Feuerwehr. Die 145 ist die Nummer von Tox Info Suisse bei
  Vergiftungen.
