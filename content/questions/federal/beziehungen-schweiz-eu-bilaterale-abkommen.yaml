    reasoning: Die Schweiz ist nicht Mitglied der EU und hat keine gemeinsame Regierung oder Verfassung
      mit ihr, ihre Beziehungen beruhen im Kern auf einem Paket bilateraler Abkommen.
  source:
    verdict: supported
    note: Die Seite des EDA sagt, die Schweiz und die EU hätten in allen Bereichen bilaterale Abkommen
      abgeschlossen. Sie nennt die Bilateralen I und II als wichtigste Vertragspakete, unter anderem zu
      Marktzugang, Handel und Personenfreizügigkeit. Dass die Schweiz nicht EU-Mitglied ist, steht nicht
      ausdrücklich da, ergibt sich aber aus der Beschreibung der Beziehungen über Abkommen.
