id: beziehungen-schweiz-eu-bilaterale-abkommen
version: 1
scope: federal
canton: null
topic: bund.international
question_de: Worauf beruhen die Beziehungen zwischen der Schweiz und der Europäischen Union (EU) im Kern?
options_de:
  a: Auf einem Paket bilateraler Abkommen
  b: Auf einer gemeinsamen Regierung
  c: Auf der Mitgliedschaft der Schweiz in der EU
  d: Auf einer gemeinsamen Verfassung
correct: a
explanation_de: Die Schweiz ist nicht Mitglied der EU. Ihre Beziehungen regeln viele bilaterale Abkommen,
  also Verträge zwischen zwei Partnern. Sie betreffen zum Beispiel den Handel und den Personenverkehr.
