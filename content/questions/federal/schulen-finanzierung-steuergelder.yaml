topic: bund.sozial.pflichten
question_de: Woraus werden die öffentlichen Schulen in der Schweiz hauptsächlich bezahlt?
options_de:
  a: Aus den Schulgebühren, welche die Eltern jeden Monat bezahlen
  b: Aus den Steuergeldern von Kanton und Gemeinden
  c: Aus den Einnahmen der Post und der SBB
  d: Aus den Beiträgen der Krankenkassen
correct: b
explanation_de: Die obligatorische öffentliche Schule ist nach der Bundesverfassung unentgeltlich. Sie
  wird aus Steuergeldern finanziert, vor allem von Kantonen und Gemeinden.
