id: erderwaermung-gletscher-schrumpfen
version: 1
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Was bewirkt die Erderwärmung bei den Gletschern in den Schweizer Alpen?
options_de:
  a: Die Gletscher schrumpfen.
  b: Die Gletscher verschieben sich nach Norden.
  c: Die Gletscher wachsen schneller.
  d: Die Gletscher bleiben unverändert.
correct: a
explanation_de: Bei steigenden Temperaturen schmilzt mehr Eis, als durch Schnee nachkommt. Deshalb werden
  die Schweizer Gletscher kleiner. Das beeinflusst auch Gewässer und Landschaft in den Alpen.
