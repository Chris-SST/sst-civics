topic: bund.kultur.feiertage_brauchtum
question_de: Welche Symbolfigur ist auf dem Zweifränkler abgebildet?
options_de:
  a: Das Matterhorn
  b: Helvetia
  c: Wilhelm Tell
  d: Ein Schweizer Bundesrat
correct: b
explanation_de: Auf der Schweizer Zweifrankenmünze ist Helvetia zu sehen, die weibliche Symbolfigur der
  Eidgenossenschaft. Sie steht für die Schweiz als Nation. Helvetia erscheint auch auf anderen Münzen
  und Briefmarken.
