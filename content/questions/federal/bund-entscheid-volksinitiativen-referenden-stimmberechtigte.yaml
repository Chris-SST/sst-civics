id: bund-entscheid-volksinitiativen-referenden-stimmberechtigte
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wer entscheidet auf Bundesebene in einer Abstimmung endgültig darüber, ob eine Volksinitiative
  oder ein Referendum angenommen wird?
options_de:
  a: Die Bundesversammlung in einer gemeinsamen Sitzung beider Räte
  b: Der Bundesrat nach Anhörung der Kantonsregierungen
  c: Das Bundesgericht nach einer rechtlichen Prüfung der Vorlage
  d: Die Stimmberechtigten, die an der Urne oder brieflich abstimmen
correct: d
explanation_de: Bei Volksinitiativen und Referenden haben die Stimmberechtigten das letzte Wort. Sie entscheiden
  in der Volksabstimmung an der Urne, die in der Schweiz auch brieflich möglich ist. Bundesrat, Parlament
  und Bundesgericht können das Ergebnis nicht ersetzen.
