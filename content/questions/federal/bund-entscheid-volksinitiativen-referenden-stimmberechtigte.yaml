    reasoning: Auf Bundesebene entscheiden die Stimmberechtigten mit ihrer Stimme an der Urne oder brieflich
      endgültig über die Annahme einer Volksinitiative oder eines Referendums (bei Initiativen zusätzlich
      mit dem Ständemehr).
  source:
    verdict: supported
    note: Quelle 3 (Bundesverfassung) sagt, dass Initiativen Volk und Ständen zur Abstimmung unterbreitet
      werden und «das Volk entscheidet», und Akte der Bundesversammlung und des Bundesrates können nicht
      beim Bundesgericht angefochten werden. Dass die Stimmberechtigten das letzte Wort haben, ist damit
      gedeckt. Die Quellen 1 und 2 erwähnen die Volksabstimmung nur beiläufig. Die Möglichkeit der brieflichen
      Stimmabgabe steht in keiner Quelle, ist für die Kernaussage aber nicht entscheidend.
