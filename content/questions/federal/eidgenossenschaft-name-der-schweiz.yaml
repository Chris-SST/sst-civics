    reasoning: Die Bundesverfassung nennt die Schweiz in Artikel 1 und der Präambel ausdrücklich «Schweizerische
      Eidgenossenschaft», sodass «Eidgenossenschaft» ebenfalls als Name verwendet wird.
  source:
    verdict: supported
    note: Quelle 1 (Art. 1 BV) sagt, Volk und Kantone «bilden die Schweizerische Eidgenossenschaft», und
      die Bundesverfassung trägt den Titel «der Schweizerischen Eidgenossenschaft». Quelle 2 nennt «Schweizerische
      Eidgenossenschaft» den amtlichen Namen der Schweiz und erklärt den historischen Bezug zum Eid der
      Urkantone.
