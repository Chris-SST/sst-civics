id: eidgenossenschaft-name-der-schweiz
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Welcher Name wird in der Bundesverfassung für die Schweiz ebenfalls verwendet?
options_de:
  a: Bundesrepublik
  b: Eidgenossenschaft
  c: Konföderation der Kantone
  d: Eidgenössisches Königreich
correct: b
explanation_de: Der offizielle Name lautet «Schweizerische Eidgenossenschaft». Das Wort Eidgenossenschaft
  steht also für die Schweiz als Ganzes. Es erinnert an die Bünde, die durch einen Eid besiegelt wurden.
