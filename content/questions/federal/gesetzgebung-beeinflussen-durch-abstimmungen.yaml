id: gesetzgebung-beeinflussen-durch-abstimmungen
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie beeinflussen die Stimmberechtigten in der Schweiz direkt die Gesetzgebung des Bundes?
options_de:
  a: Sie stimmen an der Urne über Initiativen und Referenden ab.
  b: Sie wählen die Richter, die über neue Gesetze entscheiden.
  c: Sie ernennen die Bundesräte, die neue Gesetze erlassen.
  d: Sie beschliessen die Gesetze an der Bundesversammlung selbst.
correct: a
explanation_de: Die Stimmberechtigten nehmen an Volksabstimmungen über Initiativen und Referenden teil
  und entscheiden dort mit. So wirken sie zwischen den Wahlen direkt an der Gesetzgebung mit. Das ist
  ein Kennzeichen der direkten Demokratie.
