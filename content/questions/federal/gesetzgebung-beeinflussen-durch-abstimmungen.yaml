    reasoning: Die Stimmberechtigten nehmen mit Abstimmungen über Volksinitiativen und Referenden direkt
      Einfluss auf die Bundesgesetzgebung, während Bundesräte und Bundesrichter von der Bundesversammlung
      gewählt werden und die Gesetze von Parlament beschlossen werden.
  source:
