topic: bund.sozial.sozialversicherungen
question_de: Gegen welche Risiken sichert das Sozialversicherungssystem der Schweiz unter anderem ab?
options_de:
  a: Gegen Verluste bei privaten Geldanlagen
  b: Gegen Schäden an Auto und Hausrat durch Diebstahl
  c: Gegen die Folgen von Krankheit und Unfall
  d: Gegen Preissteigerungen bei Mieten
correct: c
explanation_de: Die Sozialversicherungen schützen Menschen vor finanziellen Folgen wichtiger Lebensrisiken.
  Dazu gehören Krankheit und Unfall. Die Krankenversicherung und die Unfallversicherung sind Beispiele.
