question_de: An welchem Datum feiert die Schweiz ihren Nationalfeiertag?
options_de:
  a: Am 12. September
  b: Am 1. August
  c: Am 11. November
  d: Am 1. Mai
correct: b
explanation_de: Der 1. August ist der Nationalfeiertag der Schweiz. Er erinnert an den Bundesbrief von
  1291. Man feiert ihn mit Feuern, Feuerwerk und Reden.
