topic: bund.sozial.bildung
question_de: Was ist ein Berufsbildungszentrum?
options_de:
  a: Eine Schule, die verschiedene Angebote der beruflichen Aus- und Weiterbildung an einem Ort bündelt
  b: Eine Universität für Berufsleute mit Doktorat
  c: Ein Betrieb, in dem man die Lehre ausschliesslich praktisch absolviert
  d: Eine Stelle, die Lehrstellen vermittelt und Arbeitslose berät
correct: a
explanation_de: Ein Berufsbildungszentrum fasst verschiedene Ausbildungen und Weiterbildungen der Berufsbildung
  an einem Ort zusammen. Lernende besuchen dort etwa die Berufsfachschule. Die Beratung zur Berufswahl
  bieten dagegen die Berufsinformationszentren an.
