id: eigentum-garantie-bundesverfassung
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Welches Grundrecht schützt in der Schweiz Häuser, Grundstücke und andere Vermögenswerte von
  Privatpersonen?
options_de:
  a: Die Eigentumsgarantie
  b: Die Glaubens- und Gewissensfreiheit
  c: Die Niederlassungsfreiheit
  d: Die Versammlungsfreiheit
correct: a
explanation_de: Die Bundesverfassung gewährleistet das Eigentum in Artikel 26. Der Staat darf Eigentum
  nur unter bestimmten Voraussetzungen einschränken, zum Beispiel mit gesetzlicher Grundlage und voller
  Entschädigung bei einer Enteignung.
