topic: bund.demokratie.parlament
question_de: Aus welchen beiden Kammern besteht das Schweizer Parlament auf Bundesebene?
options_de:
  a: Aus Bundesrat und Ständerat
  b: Aus Bundesrat und Nationalrat
  c: Aus Ständerat und Bundesgericht
  d: Aus Nationalrat und Ständerat
correct: d
explanation_de: 'Die Bundesversammlung, das Parlament des Bundes, besteht aus zwei Kammern: dem Nationalrat
  und dem Ständerat. Der Bundesrat ist die Regierung und gehört nicht zum Parlament.'
