id: schwarzenbach-initiative-ziel-auslaenderanteil
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Was wollte die Schwarzenbach-Initiative, über die 1970 abgestimmt wurde?
options_de:
  a: Sie wollte die Einbürgerung für alle Ausländer erleichtern.
  b: Sie wollte die Zuwanderung nur aus Italien verbieten.
  c: Sie wollte den Anteil der in der Schweiz lebenden Ausländer beschränken.
  d: Sie wollte das Stimmrecht für Ausländer einführen.
correct: c
explanation_de: Die Initiative verlangte, den Anteil der Ausländer in der Schweiz zu beschränken. Sie
  wurde 1970 vom Volk abgelehnt. Sie zeigt, wie stark die Zuwanderung damals diskutiert wurde.
