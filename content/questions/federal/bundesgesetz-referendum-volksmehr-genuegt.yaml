id: bundesgesetz-referendum-volksmehr-genuegt
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Gegen ein neues Bundesgesetz wurde das fakultative Referendum ergriffen. Was braucht es,
  damit das Gesetz in der Volksabstimmung angenommen wird?
options_de:
  a: Die Mehrheit der Stimmenden in der ganzen Schweiz
  b: Eine Zweidrittelmehrheit der Stimmenden
  c: Die Mehrheit der Kantone allein
  d: Die Mehrheit der Stimmenden und die Mehrheit der Kantone
correct: a
explanation_de: Bei einem fakultativen Referendum gegen ein Bundesgesetz zählt nur das Volksmehr, also
  die Mehrheit der gültigen Stimmen in der ganzen Schweiz. Das Ständemehr, die Mehrheit der Kantone, braucht
  es zusätzlich nur bei Änderungen der Bundesverfassung und bei bestimmten Staatsverträgen.
