    reasoning: Beim fakultativen Referendum gegen ein Bundesgesetz genügt nach Art. 142 Abs. 1 BV das
      Volksmehr, also die Mehrheit der Stimmenden in der ganzen Schweiz, während das Ständemehr nur beim
      obligatorischen Referendum, etwa bei Verfassungsänderungen, nötig ist.
  source:
    verdict: supported
    note: Quelle 1 hält fest, dass mit dem fakultativen Referendum Gesetze «dem Volk zur Abstimmung unterbreitet»
      werden. Quelle 2 (Art. 142 BV) sagt, dass solche Vorlagen angenommen sind, wenn die Mehrheit der
      Stimmenden zustimmt; das Ständemehr braucht es nur bei Vorlagen an Volk und Stände wie Verfassungsänderungen.
