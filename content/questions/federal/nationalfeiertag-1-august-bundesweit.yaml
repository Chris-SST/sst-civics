    reasoning: Der 1. August ist als Nationalfeiertag seit 1993 durch die Bundesverfassung (Art. 110 Abs.
      3) einem Sonntag gleichgestellt und damit als einziger der genannten Tage in der ganzen Schweiz
      arbeitsfrei, während Berchtoldstag, Fasnachtsmontag und Karfreitag nur kantonal oder regional gelten.
  source:
    verdict: supported
    note: Quelle 1 (SECO) nennt den 1. August als einzigen eidgenössischen Feiertag, der den Sonntagen
      gleichgestellt ist, während die Kantone die übrigen Feiertage bestimmen. Quelle 2 bestätigt, dass
      nur der 1. August in der ganzen Schweiz gesetzlicher Feiertag ist und die anderen von Kanton zu
      Kanton verschieden sind.
