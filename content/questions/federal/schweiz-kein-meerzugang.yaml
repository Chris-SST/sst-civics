id: schweiz-kein-meerzugang
version: 1
scope: federal
canton: null
topic: bund.geografie.landschaft
question_de: Welche Aussage zur geografischen Lage der Schweiz stimmt?
options_de:
  a: Die Schweiz hat keinen direkten Zugang zum Meer.
  b: Die Schweiz hat über den Rhein einen eigenen Meerzugang.
  c: Die Schweiz grenzt im Süden ans Mittelmeer.
  d: Die Schweiz grenzt im Norden an die Nordsee.
correct: a
explanation_de: Die Schweiz ist ein Binnenland und liegt nicht am Meer. Ihre Flüsse wie Rhein und Rhone
  fliessen aber in Meere.
