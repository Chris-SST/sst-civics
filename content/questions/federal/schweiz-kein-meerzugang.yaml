topic: bund.geografie.landschaft
question_de: Welche Aussage zur geografischen Lage der Schweiz stimmt?
options_de:
  a: Die Schweiz hat keinen direkten Zugang zum Meer.
  b: Die Schweiz grenzt im Westen an den Atlantik.
  c: Die Schweiz grenzt im Süden ans Mittelmeer.
  d: Die Schweiz grenzt im Norden an die Nordsee.
correct: a
explanation_de: 'Die Schweiz ist ein Binnenland: Sie ist ganz von anderen Ländern umgeben und hat keine
  Meeresküste. Auf dem Rhein fahren zwar Schiffe von Basel bis zur Nordsee, aber kein Meer grenzt direkt
  an die Schweiz.'
