    reasoning: Die Schweiz ist ein Binnenland ohne eigene Meeresküste und hat daher keinen direkten Zugang
      zum Meer, auch wenn der Rhein ins Meer fliesst.
  source:
    verdict: supported
    note: Quelle 1 sagt, dass die Schweiz an fünf Länder grenzt (Deutschland, Frankreich, Italien, Liechtenstein,
      Österreich), also an kein Meer. Die Quelle nennt Rhone, Rhein und Inn als Flüsse, die in den Schweizer
      Alpen entspringen, und nennt keinen Meerzugang. Das Wort «Binnenland» und die Mündung von Rhein
      und Rhone ins Meer stehen nicht ausdrücklich im Text.
