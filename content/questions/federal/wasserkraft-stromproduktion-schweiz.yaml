id: wasserkraft-stromproduktion-schweiz
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Die Schweiz hat reichlich Wasser. Wie wird es zur Stromproduktion genutzt?
options_de:
  a: In Gaskraftwerken
  b: In Ölraffinerien
  c: In Wasserkraftwerken
  d: In Kohlekraftwerken
correct: c
explanation_de: Das Wasser aus Flüssen und Stauseen treibt in Wasserkraftwerken Turbinen an. Die Wasserkraft
  ist in der Schweiz eine zentrale einheimische Quelle für Strom.
sources:
