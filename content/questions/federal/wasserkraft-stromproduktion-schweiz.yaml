    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Die Schweiz nutzt ihr reichlich vorhandenes Wasser zur Stromproduktion in Wasserkraftwerken,
      die rund die Hälfte des Schweizer Stroms liefern.
  source:
    verdict: supported
    note: Quelle 1 (BFE) nennt die Wasserkraft die wichtigste einheimische Quelle erneuerbarer Energie,
      mit rund 58.5% der inländischen Stromproduktion aus Wasserkraftwerken. Quelle 2 (Zürcher Broschüre)
      sagt, Seen und Flüsse würden für Wasserkraftwerke zur Stromproduktion genutzt. Das Antreiben von
      Turbinen steht nicht wörtlich da, ist aber nebensächlich.
