topic: bund.geschichte.bundesstaat
question_de: Welche bekannte humanitäre Organisation wurde 1863 in Genf gegründet?
options_de:
  a: Die Vereinten Nationen (UNO)
  b: Die Weltgesundheitsorganisation (WHO)
  c: Das Welternährungsprogramm (WFP)
  d: Das Internationale Komitee vom Roten Kreuz (IKRK)
correct: d
explanation_de: Das IKRK entstand 1863 in Genf, unter anderem auf Anregung von Henry Dunant. Es steht
  für die humanitäre Tradition der Schweiz. Die anderen Organisationen wurden später gegründet.
