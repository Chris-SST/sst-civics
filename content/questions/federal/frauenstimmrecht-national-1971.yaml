id: frauenstimmrecht-national-1971
version: 2
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Seit welchem Jahr dürfen Frauen in der Schweiz auf Bundesebene wählen und abstimmen?
options_de:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
correct: d
explanation_de: Im Jahr 1971 nahmen die Schweizer Männer in einer Volksabstimmung das Frauenstimmrecht
  auf Bundesebene an. Seither dürfen Frauen national wählen, abstimmen und sich wählen lassen. Die Kantone
  führten das Frauenstimmrecht zu unterschiedlichen Zeiten ein, einige schon vor 1971, Appenzell Innerrhoden
  als letzter Kanton erst 1990.
