    reasoning: Die Schweizer Männer stimmten am 7. Februar 1971 der Einführung des Frauenstimm- und Wahlrechts
      auf Bundesebene zu, sodass Frauen seit 1971 national abstimmen und wählen dürfen.
  source:
    verdict: supported
    note: Quelle 1 nennt 1971 als Jahr der Einführung des Frauenstimm- und Wahlrechts auf eidgenössischer
      Ebene (seit dem 7. Februar 1971 gleiche politische Rechte). 1959 wird als gescheiterte Volksabstimmung
      genannt. Die Aussage der Erklärung zu den Kantonen wird in der Quelle nicht behandelt, ist für die
      Antwort aber nicht entscheidend.
