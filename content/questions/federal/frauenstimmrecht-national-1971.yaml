id: frauenstimmrecht-national-1971
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: In welchem Jahr erhielten die Frauen in der Schweiz das Stimm- und Wahlrecht auf nationaler
  Ebene?
options_de:
  a: '1959'
  b: '1991'
  c: '1948'
  d: '1971'
correct: d
explanation_de: Die Männer stimmten 1971 in einer Abstimmung für das Frauenstimmrecht auf Bundesebene.
  Seither dürfen Frauen national wählen und abstimmen. In einzelnen Kantonen kam es später auch auf kantonaler
  Ebene.
