id: umweltschutz-aufgabe-des-bundes
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Welche Ebene ist in der Schweiz dafür zuständig, die Umwelt zu schützen und dafür Vorschriften
  zu erlassen?
options_de:
  a: Der Bund
  b: Private Organisationen
  c: Allein die Gemeinden
  d: Allein die Bezirke
correct: a
explanation_de: Die Bundesverfassung beauftragt den Bund, Mensch und Umwelt vor schädlichen Einwirkungen
  zu schützen. Er erlässt dazu Gesetze, zum Beispiel zum Gewässer- und Naturschutz. Die Kantone setzen
  viele dieser Vorschriften um.
