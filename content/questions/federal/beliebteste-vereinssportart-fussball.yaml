    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: Fussball hat mit dem Schweizerischen Fussballverband die meisten Vereinsmitglieder und
      lizenzierten Spielerinnen und Spieler, wobei der Schweizer Turnverband als Gesamtverband ebenfalls
      sehr gross ist, bei einer einzelnen Sportart aber Fussball vorne liegt.
  source:
    verdict: supported
    note: Quelle 1 nennt den Schweizerischen Fussballverband mit rund 300 000 Mitgliedern den mitgliederstärksten
      Sportverband der Schweiz. Quelle 3 nennt Fussball die beliebteste Sportart und führt über 1300 Vereine
      und über 270 000 lizenzierte Spielerinnen und Spieler auf. Das stützt die Antwort Fussball, auch
      wenn kein Text ausdrücklich sagt, dass Fussball am meisten in Vereinen betrieben wird.
