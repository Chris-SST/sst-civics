id: beliebteste-vereinssportart-fussball
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Welche Sportart wird in der Schweiz am meisten in Vereinen betrieben?
options_de:
  a: Turnen
  b: Schwimmen
  c: Skifahren
  d: Fussball
correct: d
explanation_de: Fussball ist die Sportart mit den meisten Vereinsmitgliedern in der Schweiz. Viele Kinder
  und Erwachsene spielen in einem lokalen Fussballclub. Daneben sind auch Turnen, Skifahren und andere
  Sportarten verbreitet.
