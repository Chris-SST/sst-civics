topic: bund.kultur.feiertage_brauchtum
question_de: Welche Sportart wird in der Schweiz am meisten in Vereinen betrieben?
options_de:
  a: Eishockey
  b: Schwimmen
  c: Skifahren
  d: Fussball
correct: d
explanation_de: Fussball ist in der Schweiz die beliebteste Sportart in Vereinen. Der Schweizerische Fussballverband
  zählt rund 300 000 Mitglieder in über 1300 Vereinen. Jedes Wochenende finden im ganzen Land Tausende
  von Spielen statt.
