id: ehe-voraussetzungen-volljaehrig-urteilsfaehig
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Welche Voraussetzungen müssen Personen erfüllen, damit sie in der Schweiz heiraten dürfen?
options_de:
  a: Sie müssen das Schweizer Bürgerrecht besitzen und volljährig sein
  b: Sie müssen volljährig und fähig sein, vernunftgemäss zu handeln
  c: Sie müssen seit mindestens fünf Jahren zusammenleben
  d: Sie müssen derselben Religion angehören
correct: b
explanation_de: Heiraten darf, wer volljährig und urteilsfähig ist. Urteilsfähig heisst, dass man vernunftgemäss
  handeln kann. Staatsangehörigkeit, Religion oder eine bestimmte Dauer des Zusammenlebens sind keine
  Voraussetzung.
