id: kindererziehung-verantwortung-eltern
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Wer ist in der Schweiz hauptverantwortlich für die Erziehung der Kinder?
options_de:
  a: Die Gemeinde
  b: Die Eltern
  c: Die Schule
  d: Der Kanton
correct: b
explanation_de: Nach dem Zivilgesetzbuch sorgen die Eltern für das Wohl des Kindes und leiten seine Erziehung.
  Die Schule ergänzt diese Aufgabe mit der Bildung. Der Staat greift nur ein, wenn das Wohl des Kindes
  gefährdet ist.
