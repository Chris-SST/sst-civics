question_de: Was muss eine Person im Kanton Zürich zusätzlich tun, wenn sie einen Hund hält?
options_de:
  a: Sie muss dafür jährlich eine Abgabe, die Hundesteuer, bezahlen
  b: Sie muss den Hund alle zwei Jahre dem Bundesrat melden
  c: Sie muss die Mehrwertsteuer auf das Futter nicht bezahlen
  d: Sie muss dafür einen Militärdienst-Ersatz leisten
correct: a
explanation_de: Hundehalterinnen und Hundehalter zahlen jährlich eine Hundesteuer an die Gemeinde. Der
  Hund muss ausserdem registriert sein. Die Abgabe gehört zu den Pflichten gegenüber dem Staat.
