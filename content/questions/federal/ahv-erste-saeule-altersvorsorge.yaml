canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche Einrichtung bildet den ersten Pfeiler der Altersvorsorge in der Schweiz?
options_de:
  a: Die private Säule 3a
  b: Die staatliche AHV
  c: Die Pensionskasse
  d: Die Krankenkasse
correct: b
explanation_de: Die AHV ist die staatliche Vorsorge und bildet die erste Säule. Die Pensionskasse ist
  die zweite Säule, die private Vorsorge die dritte Säule.
