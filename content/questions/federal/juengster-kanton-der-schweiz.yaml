canton: null
topic: bund.demokratie.kantone_rolle
question_de: Welcher Kanton ist der jüngste Kanton der Schweiz?
options_de:
  a: Jura
  b: Appenzell Ausserrhoden
  c: Basel-Landschaft
  d: Neuenburg
correct: a
explanation_de: Der Kanton Jura wurde 1979 gegründet. Er hat sich vom Kanton Bern gelöst und ist seither
  der jüngste der 26 Kantone. Die Bundesverfassung nennt ihn unter den Kantonen der Schweizerischen Eidgenossenschaft.
