topic: bund.demokratie.foederalismus
question_de: Wie viele Kantone hat die Schweiz und wie viele davon sind Halbkantone?
options_de:
  a: 26 Kantone, davon 6 Halbkantone
  b: 26 Kantone, davon 3 Halbkantone
  c: 23 Kantone, davon 6 Halbkantone
  d: 20 Kantone, davon 6 Halbkantone
correct: a
explanation_de: 'Die Schweiz hat 26 Kantone. Sechs davon sind Halbkantone: Obwalden, Nidwalden, Basel-Stadt,
  Basel-Landschaft, Appenzell Ausserrhoden und Appenzell Innerrhoden. Sie haben im Ständerat je eine Stimme
  statt zwei.'
