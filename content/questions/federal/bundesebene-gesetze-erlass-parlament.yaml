topic: bund.demokratie.parlament
question_de: Welche Behörde erlässt auf Bundesebene die Gesetze?
options_de:
  a: Die Bundesversammlung, also National- und Ständerat
  b: Die Schweizerische Nationalbank
  c: Die Bundeskanzlei
  d: Die Konferenz der Kantonsregierungen
correct: a
explanation_de: Die Bundesversammlung ist das Parlament des Bundes und besteht aus National- und Ständerat.
  Sie ist für die Gesetzgebung zuständig. Die Bundeskanzlei unterstützt dagegen den Bundesrat als Stabsstelle.
