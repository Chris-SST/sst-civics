id: oeffentliches-amt-bezahlte-freizeit
version: 2
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Ein Angestellter hat ein öffentliches Amt, zum Beispiel in der Schulbehörde seiner Gemeinde.
  Was bekommt er dafür normalerweise von seinem Arbeitgeber?
options_de:
  a: Einen Bonus zum Lohn
  b: Eine Beförderung
  c: Bezahlte Freizeit
  d: Nichts, er muss das Amt in seinen Ferien erledigen
correct: c
explanation_de: Wer ein öffentliches Amt ausübt, bekommt vom Arbeitgeber dafür in der Regel bezahlte Freizeit.
  Er muss dafür also keine Ferien nehmen. Einen Bonus oder eine Beförderung gibt es dafür nicht.
