id: oeffentliches-amt-bezahlte-freizeit
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Eine Person übt neben ihrer Arbeit ein öffentliches Amt aus. Was erhält sie dafür in der
  Regel von der Arbeitgeberseite?
options_de:
  a: Eine Kündigung
  b: Bezahlte Freizeit
  c: Eine Lohnkürzung
  d: Ein zusätzliches Ferienverbot
correct: b
explanation_de: Wer ein öffentliches Amt ausübt, zum Beispiel in einer Behörde, erhält dafür von der Arbeitgeberseite
  bezahlte Freizeit. So wird das Engagement für die Allgemeinheit unterstützt.
