id: oeffentliches-amt-bezahlte-freizeit
version: 3
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Eine Angestellte oder ein Angestellter übt neben der Arbeit ein öffentliches Amt aus, zum
  Beispiel in der Schulbehörde der Gemeinde. Was gibt der Arbeitgeber dafür normalerweise?
options_de:
  a: Einen Bonus zum Lohn
  b: Eine Beförderung
  c: Bezahlte Freizeit
  d: Nichts, für das Amt muss man Ferien nehmen
correct: c
explanation_de: Wer ein öffentliches Amt ausübt, erhält vom Arbeitgeber dafür in der Regel bezahlte Freizeit.
  Wie viel genau, hängt vom Arbeitsvertrag, vom Gesamtarbeitsvertrag oder von anderen Regelungen ab. Einen
  Bonus oder eine Beförderung gibt es für ein Amt nicht, und normalerweise muss man dafür auch keine Ferien
  nehmen.
