    agrees: true
    model: claude-sonnet-5-5
    at: 2026-11-02
    version: 1
    reasoning: In der Schweiz wird das Milizsystem unterstützt, indem Arbeitgebende Personen mit einem
      öffentlichen Amt in der Regel bezahlte oder zumindest bewilligte Freizeit gewähren, während Kündigung,
      Lohnkürzung oder Ferienverbot nicht üblich sind; die Frage ist leicht vereinfacht, aber b ist die
      beste Antwort.
  source:
    verdict: supported
    note: Quelle 2 (ZH-Broschüre, Arbeit und Beruf) sagt ausdrücklich, dass man bei einem öffentlichen
      Amt als Arbeitnehmende ein Recht auf bezahlte Zeit dafür hat. Quelle 1 (OR, Lohnfortzahlung bei
      Verhinderung durch Ausübung eines öffentlichen Amtes) stützt dies ebenfalls; Quelle 3 ist für die
      Frage nicht relevant.
