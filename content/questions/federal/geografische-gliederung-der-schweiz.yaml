question_de: In welche drei grossen Landschaftsräume gliedert sich die Schweiz geografisch?
options_de:
  a: Jura, Mittelland und Alpen
  b: Jura, Bodensee und Alpen
  c: Schwarzwald, Mittelland und Alpen
  d: Mittelland, Voralpen und Tessin
correct: a
explanation_de: Der Jura liegt im Nordwesten, die Alpen nehmen den grössten Teil der Fläche ein. Dazwischen
  liegt das Mittelland, in dem die meisten Menschen leben.
