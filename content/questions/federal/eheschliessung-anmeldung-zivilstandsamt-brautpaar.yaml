id: eheschliessung-anmeldung-zivilstandsamt-brautpaar
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Wer meldet die geplante Eheschliessung beim Zivilstandsamt an?
options_de:
  a: Die Trauzeugen im Namen des Paares
  b: Das Brautpaar gemeinsam
  c: Das Einwohneramt der Wohngemeinde automatisch
  d: Die Eltern der Braut oder des Bräutigams
correct: b
explanation_de: Das Brautpaar stellt das Gesuch um Durchführung des Ehevorbereitungsverfahrens gemeinsam
  beim Zivilstandsamt. Andere Personen können dies nicht an seiner Stelle tun. Danach prüft das Amt die
  Voraussetzungen der Ehe.
