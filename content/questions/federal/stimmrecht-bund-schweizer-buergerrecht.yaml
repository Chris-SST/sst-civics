id: stimmrecht-bund-schweizer-buergerrecht
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Was ist eine Voraussetzung für das Stimm- und Wahlrecht auf Bundesebene?
options_de:
  a: Das Schweizer Bürgerrecht
  b: Die Mitgliedschaft in einer politischen Partei
  c: Mindestens zehn Jahre Wohnsitz in der Schweiz
  d: Eine Niederlassungsbewilligung C
correct: a
explanation_de: Auf Bundesebene dürfen nur Personen mit Schweizer Bürgerrecht wählen und abstimmen. Ausländerinnen
  und Ausländer haben auf Bundesebene kein Stimm- und Wahlrecht, auch nicht mit einer Niederlassungsbewilligung.
  Eine Parteimitgliedschaft ist nicht nötig.
