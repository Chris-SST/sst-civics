id: bundesverfassung-1848-bundesstaat-kantone
version: 1
scope: federal
canton: null
topic: bund.geschichte.bundesstaat
question_de: Was änderte sich mit der Bundesverfassung von 1848 für die Schweiz?
options_de:
  a: Sie wurde wieder ein loser Staatenbund
  b: Sie wurde eine Monarchie mit einem König
  c: Sie wurde ein Bundesstaat, in dem die Kantone eigenständig bleiben
  d: Sie wurde ein Einheitsstaat ohne Kantone
correct: c
explanation_de: 1848 entstand der moderne Bundesstaat mit gemeinsamen Institutionen. Die Kantone behielten
  aber eigene Aufgaben und eine eigene Staatlichkeit. Diese Aufteilung prägt die Schweiz bis heute.
