id: folterverbot-bundesverfassung
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was sagt die Bundesverfassung zur Folter?
options_de:
  a: Folter ist nur bei Straftätern verboten.
  b: Folter ist in Notlagen für die Polizei erlaubt.
  c: Folter ist erlaubt, wenn ein Gericht zustimmt.
  d: Niemand darf gefoltert werden.
correct: d
explanation_de: Artikel 10 der Bundesverfassung verbietet Folter und jede andere Art grausamer, unmenschlicher
  oder erniedrigender Behandlung. Dieses Verbot gilt für alle Menschen ohne Ausnahme. Auch der Staat darf
  keine Ausnahmen machen.
