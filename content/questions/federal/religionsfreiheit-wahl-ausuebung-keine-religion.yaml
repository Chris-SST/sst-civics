id: religionsfreiheit-wahl-ausuebung-keine-religion
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Frau zieht in die Schweiz und möchte ihre Religion selbst wählen. Sie überlegt auch,
  gar keiner Religion anzugehören. Was sichert ihr die Bundesverfassung in diesem Zusammenhang zu?
options_de:
  a: Sie darf nur einer Religion angehören, die im Kanton öffentlich-rechtlich anerkannt ist.
  b: Sie darf ihre Religion frei wählen, ausüben oder keiner Religion angehören.
  c: Sie darf ihre Religion privat wählen, aber nirgends gemeinsam mit anderen ausüben.
  d: Sie muss sich bei der Gemeinde für eine anerkannte Religion entscheiden.
correct: b
explanation_de: Die Glaubens- und Gewissensfreiheit ist in Artikel 15 der Bundesverfassung garantiert.
  Jede Person kann ihre Religion frei wählen, allein oder mit anderen ausüben oder keiner Religion angehören.
  Niemand darf zu einer Religionsgemeinschaft gezwungen werden.
