id: arbeitsgericht-streit-arbeitsverhaeltnis
version: 1
scope: federal
canton: null
topic: bund.sozial.wirtschaft_arbeit
question_de: Eine Arbeitnehmerin hält ihre Kündigung für unbegründet und will dagegen vorgehen. Welche
  Stelle behandelt solche Streitigkeiten aus dem Arbeitsverhältnis?
options_de:
  a: Das Regionale Arbeitsvermittlungszentrum (RAV)
  b: Das Strassenverkehrsamt
  c: Das Arbeitsgericht
  d: Das Betreibungsamt
correct: c
explanation_de: Das Arbeitsgericht ist für Streitigkeiten zwischen Arbeitgebenden und Arbeitnehmenden
  zuständig. Dazu gehört auch der Streit um eine Kündigung. Das RAV hilft dagegen bei der Stellensuche.
