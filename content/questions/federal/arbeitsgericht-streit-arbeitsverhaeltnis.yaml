    reasoning: Streitigkeiten aus dem Arbeitsverhältnis, etwa wegen einer missbräuchlichen Kündigung,
      werden von der Schlichtungsbehörde und dem Arbeitsgericht behandelt, während RAV, Strassenverkehrsamt
      und Betreibungsamt dafür nicht zuständig sind.
  source:
    verdict: unclear
    note: Quelle 2 verweist bei privatrechtlichen Themen wie Kündigung nur auf die unentgeltliche Rechtsauskunft
      des Bezirks- oder Arbeitsgerichts. Sie sagt nicht ausdrücklich, dass das Arbeitsgericht Kündigungsstreitigkeiten
      behandelt. Quelle 1 bestätigt nur, dass das RAV bei der Stellensuche unterstützt, was den zweiten
      Teil der Erklärung stützt.
