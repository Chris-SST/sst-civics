id: stimmrecht-bund-ab-18-geburtstag
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Ab welchem Alter dürfen Schweizerinnen und Schweizer auf eidgenössischer Ebene abstimmen
  und wählen?
options_de:
  a: Ab dem 20. Geburtstag
  b: Ab dem 21. Geburtstag
  c: Ab dem 16. Geburtstag
  d: Ab dem 18. Geburtstag
correct: d
explanation_de: Das Stimm- und Wahlrecht auf Bundesebene beginnt mit der Mündigkeit, also mit dem 18.
  Geburtstag. Das Alter gilt für Wahlen und Abstimmungen des Bundes gleichermassen.
