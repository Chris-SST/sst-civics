    reasoning: Die Reformation führte in der Eidgenossenschaft zu einer konfessionellen Spaltung in reformierte
      und katholische Orte, während die Schweiz weder Teil des Deutschen Reiches wurde, noch alle Orte
      reformiert wurden, noch die Kirche überall ihren politischen Einfluss verlor.
  source:
    verdict: supported
    note: Quelle 1 beschreibt die Reformation als Spaltung in Katholiken und Protestanten, die in der
      Schweiz zu Spannungen, Unruhen und kriegerischen Konflikten führte. Der Sonderbundskrieg zwischen
      katholisch-konservativen und liberal-radikalen Kantonen bestätigt den bleibenden Gegensatz. Dass
      einige Orte katholisch blieben, steht nicht ausdrücklich da, ergibt sich aber eindeutig aus der
      Spaltung.
