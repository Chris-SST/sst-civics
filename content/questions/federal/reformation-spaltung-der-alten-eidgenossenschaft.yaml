topic: bund.geschichte.gruendung
question_de: Welche Folge hatte die Reformation für die Schweiz?
options_de:
  a: Die Schweiz war religiös in einen reformierten und einen katholischen Teil gespalten.
  b: Die Schweiz wurde ein Teil des Deutschen Reiches.
  c: Die Kirche verlor überall jeden Einfluss auf die Politik.
  d: Alle Orte der Eidgenossenschaft wurden reformiert.
correct: a
explanation_de: Einige Orte nahmen die Reformation an, andere blieben katholisch. So entstand ein religiöser
  Gegensatz, der die Eidgenossenschaft lange belastete. Es kam auch zu Konflikten zwischen den Konfessionen.
