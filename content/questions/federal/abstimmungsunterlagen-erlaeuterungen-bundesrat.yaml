    reasoning: Gemäss Bundesgesetz über die politischen Rechte erhalten die Stimmberechtigten zusammen
      mit dem Stimmmaterial die Erläuterungen des Bundesrates (das «Abstimmungsbüchlein»), welche die
      Vorlagen sachlich erklären und auch die Argumente der Gegnerschaft wiedergeben.
  source:
    verdict: supported
    note: Art. 11 Abs. 2 BPR (Quelle 3) hält fest, dass der Abstimmungsvorlage eine kurze, sachliche Erläuterung
      des Bundesrates beigegeben wird, die auch die Argumente der Urheberkomitees berücksichtigt; Abs.
      3 regelt die Zustellung zusammen mit den Stimmunterlagen. Die Empfehlung von Bundesrat und Parlament
      wird im Text nicht ausdrücklich erwähnt, und die Quellen 1 und 2 enthalten dazu nichts.
