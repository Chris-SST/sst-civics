id: abstimmungsunterlagen-erlaeuterungen-bundesrat
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Was erhalten die Stimmberechtigten vor einer eidgenössischen Abstimmung zusammen mit dem
  Stimmmaterial, damit sie sich über die Vorlagen informieren können?
options_de:
  a: Die Erläuterungen des Bundesrates
  b: Eine Stellungnahme des Bundesgerichts
  c: Ein Gutachten des eigenen Kantons
  d: Die Wahlliste aller Parteien
correct: a
explanation_de: Der Bundesrat erklärt in den Erläuterungen, oft Abstimmungsbüchlein genannt, worum es
  bei jeder Vorlage geht. Darin stehen auch die Argumente des Initiativ- oder Referendumskomitees sowie
  die Empfehlung von Bundesrat und Parlament. So können sich alle eine eigene Meinung bilden.
