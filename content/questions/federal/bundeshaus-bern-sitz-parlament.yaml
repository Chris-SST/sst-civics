id: bundeshaus-bern-sitz-parlament
version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Welches Gebäude in Bern ist der Tagungsort des Schweizer Parlaments?
options_de:
  a: Das Kornhaus
  b: Das Rathaus
  c: Das Bundesverwaltungsgericht
  d: Das Bundeshaus
correct: d
explanation_de: Das Schweizer Parlament tagt im Bundeshaus in Bern. Dort treffen sich National- und Ständerat
  zu ihren Sessionen. Das Rathaus ist ein Gebäude des Kantons Bern oder der Stadt, nicht des Bundesparlaments.
