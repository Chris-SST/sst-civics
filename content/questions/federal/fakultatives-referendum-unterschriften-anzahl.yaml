id: fakultatives-referendum-unterschriften-anzahl
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wie viele Unterschriften braucht es für ein fakultatives Referendum gegen ein Bundesgesetz?
options_de:
  a: 200 000 Unterschriften
  b: 30 000 Unterschriften
  c: 50 000 Unterschriften
  d: 100 000 Unterschriften
correct: c
explanation_de: Für ein fakultatives Referendum braucht es 50 000 gültige Unterschriften von Stimmberechtigten.
  Sie müssen innerhalb von 100 Tagen nach der Veröffentlichung des Gesetzes gesammelt werden.
