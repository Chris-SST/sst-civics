id: stimmrecht-bund-ab-18-jahren
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Wer hat auf Bundesebene das Stimm- und Wahlrecht?
options_de:
  a: Schweizer Staatsangehörige, die 20 Jahre alt sind
  b: Alle Personen mit Niederlassungsbewilligung ab 18 Jahren
  c: Schweizer Staatsangehörige, die 18 Jahre alt sind
  d: Alle Personen mit Wohnsitz in der Schweiz ab 16 Jahren
correct: c
explanation_de: Auf Bundesebene sind Schweizerinnen und Schweizer ab dem vollendeten 18. Altersjahr stimm-
  und wahlberechtigt. Die Staatsangehörigkeit ist ebenso nötig wie das Alter. Der Wohnsitz in der Schweiz
  spielt keine Rolle.
