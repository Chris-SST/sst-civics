id: stimmrecht-bund-ab-18-jahren
version: 2
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Wer darf auf Bundesebene abstimmen und wählen?
options_de:
  a: Schweizer Staatsangehörige ab 20 Jahren
  b: Alle Personen mit Niederlassungsbewilligung ab 18 Jahren
  c: Schweizer Staatsangehörige ab 18 Jahren
  d: Alle Personen mit Wohnsitz in der Schweiz ab 16 Jahren
correct: c
explanation_de: Im Bund dürfen Schweizerinnen und Schweizer ab dem 18. Geburtstag abstimmen und wählen.
  Ausländerinnen und Ausländer haben dieses Recht auf Bundesebene nicht, auch nicht mit einer Niederlassungsbewilligung.
  Auch Schweizerinnen und Schweizer, die im Ausland leben, dürfen mitmachen, wenn sie sich im Stimmregister
  eintragen lassen.
