question_de: Welche dieser Stufen gehört in der Schweiz zur obligatorischen Schulzeit?
options_de:
  a: Die Hochschule
  b: Die Primarschule
  c: Die Spielgruppe
  d: Die Berufsfachschule
correct: b
explanation_de: 'Im Kanton Zürich dauert die obligatorische Schulzeit elf Jahre: Kindergarten, Primarschule
  und Sekundarstufe I. Die Spielgruppe für kleine Kinder ist freiwillig. Berufsfachschule und Hochschule
  besucht man erst nach der obligatorischen Schulzeit.'
