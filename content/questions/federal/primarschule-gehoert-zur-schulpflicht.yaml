id: primarschule-gehoert-zur-schulpflicht
version: 1
scope: federal
canton: null
topic: bund.sozial.bildung
question_de: Welche Schulstufe gehört in der Schweiz zur gesetzlichen Schulpflicht?
options_de:
  a: Die Hochschule
  b: Die Primarschule
  c: Das Gymnasium
  d: Die Berufsfachschule
correct: b
explanation_de: Die Schulpflicht umfasst die obligatorische Schule. Dazu gehört die Primarschule, die
  alle Kinder besuchen müssen. Gymnasium, Berufsfachschule und Hochschule sind freiwillige Ausbildungen
  nach der obligatorischen Schulzeit.
