    reasoning: Die Primarschule gehört zur obligatorischen Schulzeit, während Hochschule, Gymnasium und
      Berufsfachschule nachobligatorische Bildungsangebote sind (das Gymnasium kann zwar teilweise die
      Sekundarstufe I umfassen, die Primarschule ist aber die eindeutig richtige Antwort).
  source:
    verdict: supported
    note: Quelle 1 (Kanton Zürich) nennt die Primarschule als Teil der Volksschule (Kindergarten-, Primar-
      und Sekundarstufe, elf Jahre, unentgeltlich). Gymnasium, Berufsfachschule und Hochschule erscheinen
      dort als weiterführende Schulen. Das Wort «obligatorisch» steht nur im Titel eines Merkblatts, und
      die Freiwilligkeit der Mittelschulen wird nicht ausdrücklich gesagt, doch die Antwort wird klar
      gestützt. Quelle 2 (Bundesverfassung, gekürzt) enthält dazu nichts Verwertbares.
