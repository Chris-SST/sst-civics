topic: bund.kultur.feiertage_brauchtum
question_de: Wie oft erscheint eine Sonntagszeitung in der Schweiz?
options_de:
  a: Einmal pro Woche
  b: Zweimal pro Woche
  c: Einmal pro Monat
  d: Jeden Tag
correct: a
explanation_de: Eine Sonntagszeitung erscheint nur einmal wöchentlich, am Sonntag. Tageszeitungen erscheinen
  dagegen an den meisten Tagen der Woche. Die Presse gehört zur Kultur und zur Meinungsbildung im Land.
