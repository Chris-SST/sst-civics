id: bundesstaat-1848-neue-verfassung
version: 1
scope: federal
canton: null
topic: bund.geschichte.bundesstaat
question_de: Was entstand in der Schweiz im Jahr 1848?
options_de:
  a: Die Helvetische Republik mit einer Zentralregierung
  b: Der Staatenbund unter französischer Aufsicht
  c: Der moderne Bundesstaat mit einer neuen Verfassung
  d: Der Bund der drei Urkantone
correct: c
explanation_de: 1848 gaben sich die Kantone eine Bundesverfassung und gründeten den modernen Bundesstaat.
  Er verband gemeinsame Aufgaben des Bundes mit der Eigenständigkeit der Kantone. Diese Verfassung ist
  die Grundlage der heutigen Schweiz.
