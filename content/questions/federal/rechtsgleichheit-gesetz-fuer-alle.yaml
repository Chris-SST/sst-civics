id: rechtsgleichheit-gesetz-fuer-alle
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Was bedeutet der Grundsatz der Rechtsgleichheit?
options_de:
  a: Alle Kantone haben dieselben Gesetze.
  b: Alle Personen haben dieselben politischen Ämter.
  c: Alle Personen haben dasselbe Einkommen.
  d: Das Gesetz gilt für alle Personen gleichermassen.
correct: d
explanation_de: Rechtsgleichheit steht in Artikel 8 der Bundesverfassung. Alle Menschen sind vor dem Gesetz
  gleich und niemand darf zum Beispiel wegen Herkunft oder Geschlecht diskriminiert werden. Es bedeutet
  nicht, dass alle gleich viel besitzen.
