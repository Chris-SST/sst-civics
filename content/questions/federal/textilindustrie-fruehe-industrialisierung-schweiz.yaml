    reasoning: In der frühen Industrialisierung der Schweiz im späten 18. und frühen 19. Jahrhundert war
      die Textilindustrie (Baumwollspinnerei und Weberei, später Seide und Stickerei) der wichtigste Wirtschaftszweig,
      während Maschinen-, Uhren- und Pharmaindustrie erst später an Bedeutung gewannen.
