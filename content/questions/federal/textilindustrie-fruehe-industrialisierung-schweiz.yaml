topic: bund.geschichte.bundesstaat
question_de: Welcher Wirtschaftszweig war in der frühen Industrialisierung der Schweiz am wichtigsten?
options_de:
  a: Die Uhrenindustrie
  b: Die Pharmaindustrie
  c: Die Textilindustrie
  d: Die Maschinenindustrie
correct: c
explanation_de: In der frühen Industrialisierung prägte die Textilindustrie die Schweizer Wirtschaft,
  etwa mit Spinnereien, Webereien und Stickereien. Ein bekanntes Beispiel sind die St. Galler Stickereien,
  die weltweit begehrt waren. Andere Branchen wurden erst später so wichtig.
