topic: bund.sozial.zivilgesellschaft
question_de: Wofür setzt sich die Organisation Amnesty International in erster Linie ein?
options_de:
  a: Für die Rechte von Mieterinnen und Mietern
  b: Für den Schutz bedrohter Tier- und Pflanzenarten
  c: Für den Schutz der Menschenrechte
  d: Für die Förderung des internationalen Handels
correct: c
explanation_de: Amnesty International ist eine Nichtregierungsorganisation. Sie macht auf Verletzungen
  der Menschenrechte aufmerksam und setzt sich für Betroffene ein. Solche Organisationen sind Teil der
  Zivilgesellschaft.
