id: krankenkasse-freie-wahl-versicherte
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Wer entscheidet in der Schweiz, bei welcher Krankenkasse eine Person die Grundversicherung
  abschliesst?
options_de:
  a: Die Wohngemeinde legt die Krankenkasse fest
  b: Die versicherte Person wählt ihre Krankenkasse selbst aus
  c: Der Arbeitgeber bestimmt die Krankenkasse für alle Angestellten
  d: Der Wohnkanton teilt jeder Person eine Krankenkasse zu
correct: b
explanation_de: In der Schweiz gilt die freie Wahl der Krankenkasse. Die Versicherten können unter den
  zugelassenen Krankenkassen auswählen und die Kasse unter bestimmten Bedingungen wechseln.
