topic: bund.geschichte.weltkriege_neutralitaet
question_de: Wie verhielt sich die Schweiz im Zweiten Weltkrieg?
options_de:
  a: Sie brach alle Kontakte zu den Kriegsparteien ab und schloss die Grenzen vollständig.
  b: Sie schloss sich Deutschland an und lieferte Truppen.
  c: Sie blieb neutral und pflegte zu den Kriegsparteien politische und wirtschaftliche Kontakte.
  d: Sie trat dem Bündnis der Alliierten bei und kämpfte mit.
correct: c
explanation_de: Die Schweiz wurde im Zweiten Weltkrieg nicht Kriegspartei. Sie hielt aber politische und
  wirtschaftliche Kontakte zu den Kriegsparteien aufrecht. Diese Haltung wird historisch bis heute diskutiert.
