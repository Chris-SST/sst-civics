id: mehrehe-in-schweiz-verboten
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Was gilt in der Schweiz für die Ehe mit mehreren Partnerinnen oder Partnern gleichzeitig?
options_de:
  a: Sie ist erlaubt, wenn alle zustimmen
  b: Sie ist verboten
  c: Sie ist erlaubt, wenn sie religiös begründet ist
  d: Sie ist nur für Personen mit ausländischem Pass erlaubt
correct: b
explanation_de: Die Schweiz kennt nur die Einehe. Wer bereits verheiratet ist oder in eingetragener Partnerschaft
  lebt, kann nicht eine weitere Ehe schliessen. Das gilt unabhängig von Religion oder Herkunft.
