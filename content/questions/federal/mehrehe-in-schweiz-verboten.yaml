    at: 2026-11-02
    version: 1
    reasoning: In der Schweiz ist die Mehrfachehe (Polygamie) verboten, da nach dem Zivilgesetzbuch eine
      neue Ehe nur eingehen darf, wer nicht bereits verheiratet oder in eingetragener Partnerschaft lebt,
      und eine bestehende Ehe ein Ehehindernis darstellt.
  source:
    verdict: supported
    note: Quelle 1 (ZGB) verlangt den Nachweis, dass eine frühere Ehe oder eingetragene Partnerschaft
      aufgelöst wurde, und nennt als Ungültigkeitsgrund, dass ein Ehegatte bereits verheiratet ist oder
      in eingetragener Partnerschaft lebt. Quelle 2 (Broschüre) sagt in einem abgeschnittenen Satz, man
      dürfe nur mit einer Person verheiratet sein, und stützt damit das Verbot der Mehrehe.
