topic: bund.geschichte.gruendung
question_de: Welche drei Gebiete verbündeten sich 1291 und gelten als Kern der späteren Eidgenossenschaft?
options_de:
  a: Uri, Schwyz und Unterwalden
  b: Glarus, Zug und Uri
  c: Basel, Schaffhausen und Appenzell
  d: Zürich, Bern und Luzern
correct: a
explanation_de: Uri, Schwyz und Unterwalden schlossen 1291 einen Bund. Dieses Datum gilt als Ursprung
  der Schweiz und wird am 1. August gefeiert. Die anderen Orte kamen erst später zum Bund.
