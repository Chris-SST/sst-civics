    reasoning: Jede Änderung der Bundesverfassung unterliegt dem obligatorischen Referendum und muss zwingend
      von Volk und Ständen angenommen werden, während Bundesgesetze nur bei einem Referendum mit 50'000
      Unterschriften, Verordnungen und Budgets gar nicht dem Volk vorgelegt werden.
  source:
    verdict: supported
    note: Quelle 2 (BV, Art. 140 Obligatorisches Referendum sowie die Bestimmungen zur Revision) sagt,
      dass die revidierte Bundesverfassung erst in Kraft tritt, wenn Volk und Stände sie angenommen haben;
      Bundesgesetze kommen nach Quelle 1 und Art. 141 nur auf Verlangen vor das Volk (fakultatives Referendum).
      Der Auszug in Quelle 2 ist allerdings lückenhaft, die Aussage ergibt sich aber eindeutig.
