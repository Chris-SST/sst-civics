id: obligatorisches-referendum-verfassungsaenderung
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Über welche Vorlage muss in der Schweiz immer abgestimmt werden, auch wenn keine Unterschriften
  gesammelt werden?
options_de:
  a: Über jedes neue Bundesgesetz
  b: Über jede Änderung der Bundesverfassung
  c: Über jede Verordnung des Bundesrates
  d: Über jedes Budget des Bundes
correct: b
explanation_de: Jede Änderung der Bundesverfassung muss obligatorisch dem Volk und den Kantonen vorgelegt
  werden. Man nennt das obligatorisches Referendum. Bundesgesetze unterstehen nur dem fakultativen Referendum.
sources:
