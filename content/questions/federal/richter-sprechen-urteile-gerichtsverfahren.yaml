id: richter-sprechen-urteile-gerichtsverfahren
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Wer spricht in einem Gerichtsverfahren das Urteil aus?
options_de:
  a: Die Richterin oder der Richter
  b: Die Polizistin oder der Polizist
  c: Die Gemeindepräsidentin oder der Gemeindepräsident
  d: Die Staatsanwältin oder der Staatsanwalt
correct: a
explanation_de: Richterinnen und Richter entscheiden in Gerichtsverfahren unabhängig und fällen das Urteil.
  Die Staatsanwaltschaft führt die Untersuchung und erhebt Anklage. Die Polizei ermittelt, urteilt aber
  nicht.
