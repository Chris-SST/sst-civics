topic: bund.demokratie.wahlen
question_de: Was beschreibt eine politische Partei am besten?
options_de:
  a: Ein Gericht, das über politische Streitfälle entscheidet
  b: Ein Zusammenschluss von Personen mit ähnlichen politischen Zielen
  c: Eine Gruppe von Gemeinden, die gemeinsam Aufgaben erfüllen
  d: Eine Behörde, die Wahlen und Abstimmungen durchführt
correct: b
explanation_de: In einer Partei schliessen sich Menschen zusammen, die ähnliche politische Ziele verfolgen.
  Parteien stellen bei Wahlen Kandidatinnen und Kandidaten auf und äussern sich zu Abstimmungsvorlagen.
  Sie sind keine staatlichen Behörden.
