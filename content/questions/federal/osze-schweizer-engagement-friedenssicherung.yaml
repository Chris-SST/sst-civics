    reasoning: Die OSZE befasst sich mit Sicherheit, Frieden und Stabilität in Europa, Osteuropa und Zentralasien,
      und die Schweiz engagiert sich dort für Konfliktprävention und Frieden, während Fördergelder, eine
      gemeinsame Währung und Zölle nicht zu den Aufgaben der OSZE gehören.
  source:
    verdict: unclear
    note: Die Quellen 1 und 3 sagen, die Schweiz setze sich in der OSZE für Frieden und Sicherheit in
      Europa (und der Welt) ein. Ein besonderer Schwerpunkt auf Osteuropa und Zentralasien wird nirgends
      ausdrücklich genannt. Nur die Ukraine und zentralasiatische Projekte werden erwähnt. Auch die Gründungsmitgliedschaft
      wird nicht eindeutig belegt, da die Schweiz seit 1973 dabei ist. Quelle 2 behandelt das Thema nicht.
