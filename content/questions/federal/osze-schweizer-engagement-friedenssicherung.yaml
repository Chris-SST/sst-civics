topic: bund.international
question_de: Wofür setzt sich die Schweiz in der Organisation für Sicherheit und Zusammenarbeit in Europa
  (OSZE) ein?
options_de:
  a: Für Frieden und Sicherheit in Europa, zum Beispiel in Osteuropa und Zentralasien
  b: Für die Verteilung von Fördergeldern in Westeuropa
  c: Für die Einführung einer gemeinsamen Währung
  d: Für die Senkung von Zöllen im Welthandel
correct: a
explanation_de: Die Schweiz ist Gründungsmitglied der OSZE und nutzt sie, um Frieden und Sicherheit in
  Europa zu fördern. Die OSZE ist mit Feldmissionen besonders in Ost- und Südosteuropa und in Zentralasien
  tätig. 2026 hat die Schweiz den Vorsitz der OSZE.
