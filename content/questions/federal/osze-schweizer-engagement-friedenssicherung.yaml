id: osze-schweizer-engagement-friedenssicherung
version: 1
scope: federal
canton: null
topic: bund.international
question_de: Wofür setzt sich die Schweiz innerhalb der Organisation für Sicherheit und Zusammenarbeit
  in Europa (OSZE) vor allem ein?
options_de:
  a: Für den Frieden in Osteuropa und Zentralasien
  b: Für die Verteilung von Fördergeldern in Westeuropa
  c: Für die Einführung einer gemeinsamen Währung
  d: Für die Senkung von Zöllen im Welthandel
correct: a
explanation_de: Die Schweiz engagiert sich in der OSZE für Frieden und Sicherheit, vor allem in Osteuropa
  und Zentralasien. Die OSZE ist eine Organisation für Sicherheit und Zusammenarbeit. Die Schweiz ist
  seit der Gründung dabei.
