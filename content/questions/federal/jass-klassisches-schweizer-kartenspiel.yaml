topic: bund.kultur.feiertage_brauchtum
question_de: Welches Kartenspiel gilt in der Schweiz als das klassische heimische Kartenspiel?
options_de:
  a: Bridge
  b: Jass
  c: Poker
  d: Rommé
correct: b
explanation_de: Jass gilt als das typische Schweizer Kartenspiel. Es wird meist zu viert in zwei Teams
  gespielt, oft mit französischen oder deutschschweizer Karten. Man spielt es in vielen Familien und Beizen.
