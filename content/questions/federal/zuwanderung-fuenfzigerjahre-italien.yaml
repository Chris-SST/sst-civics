id: zuwanderung-fuenfzigerjahre-italien
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Aus welchem Land stammten in den 1950er-Jahren die meisten Arbeitskräfte, die in die Schweiz
  zuwanderten?
options_de:
  a: Aus Italien
  b: Aus der Türkei
  c: Aus Portugal
  d: Aus Spanien
correct: a
explanation_de: In den 1950er-Jahren kamen die meisten zugewanderten Arbeitskräfte aus Italien. Die Wirtschaft
  brauchte damals viele Arbeitskräfte, etwa auf dem Bau und in der Industrie. Später kamen auch viele
  Menschen aus anderen Ländern.
