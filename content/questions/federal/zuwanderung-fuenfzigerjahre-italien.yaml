    note: 'Quelle 1 (Seite 12) sagt: «Ab den 1950er-Jahren sind viele Arbeitnehmende aus Italien gekommen.»
      Quelle 2 nennt, dass nach 1947 vermehrt Arbeitskräfte aus Italien und anderen Nachbarländern angeworben
