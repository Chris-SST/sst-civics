topic: bund.sozial.wirtschaft_arbeit
question_de: In welchem Wirtschaftszweig steht die Schweiz seit langer Zeit international an der Spitze?
options_de:
  a: Textilindustrie
  b: Schiffbau
  c: Automobilbau
  d: Uhrmacherei
correct: d
explanation_de: Schweizer Uhren sind weltweit für ihre Qualität bekannt. Die Uhrmacherei hat in der Schweiz
  eine lange Tradition und ist bis heute ein wichtiger Exportzweig.
