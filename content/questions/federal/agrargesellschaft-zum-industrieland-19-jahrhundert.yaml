id: agrargesellschaft-zum-industrieland-19-jahrhundert
version: 1
scope: federal
canton: null
topic: bund.geschichte.bundesstaat
question_de: Wie veränderte sich die Schweiz im 19. Jahrhundert wirtschaftlich?
options_de:
  a: Sie lebte vor allem vom Handel mit Kolonien.
  b: Sie blieb bis 1900 fast ausschliesslich ein Bauernland.
  c: Sie entwickelte sich von einem Industrieland zu einer Agrargesellschaft.
  d: Sie entwickelte sich von einer Agrargesellschaft zu einem Industrieland.
correct: d
explanation_de: Im 19. Jahrhundert verlagerte sich die Arbeit von der Landwirtschaft in Fabriken. Neue
  Verkehrswege wie die Eisenbahn unterstützten diesen Wandel. So wurde aus dem Agrarland ein Industrieland.
