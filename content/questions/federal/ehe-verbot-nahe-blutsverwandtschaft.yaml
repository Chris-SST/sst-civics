id: ehe-verbot-nahe-blutsverwandtschaft
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Wer darf in der Schweiz nicht heiraten?
options_de:
  a: Personen, die schon einmal geschieden wurden
  b: Personen, die aus verschiedenen Kantonen stammen
  c: Personen, die nah blutsverwandt sind
  d: Personen, die in verschiedenen Gemeinden wohnen
correct: c
explanation_de: Die Ehe zwischen nahen Blutsverwandten ist verboten, zum Beispiel zwischen Geschwistern
  oder zwischen Eltern und Kindern. Die Herkunft, der Wohnort und eine frühere Scheidung sind dagegen
  kein Ehehindernis.
