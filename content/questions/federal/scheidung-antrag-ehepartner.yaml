id: scheidung-antrag-ehepartner
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Wer kann in der Schweiz die Scheidung beantragen?
options_de:
  a: Nur beide Ehepartner gemeinsam
  b: Einer der Ehepartner allein oder beide gemeinsam
  c: Nur der Ehepartner, der die Scheidung wünscht, mit Zustimmung des anderen
  d: Nur die Eltern der Ehepartner oder ein Familienmitglied
correct: b
explanation_de: Eine Scheidung kann von einem Ehepartner allein oder von beiden gemeinsam verlangt werden.
  Eine Zustimmung des anderen Teils ist für den Antrag nicht nötig. Zuständig ist das Gericht.
