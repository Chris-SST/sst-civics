    reasoning: Nach dem Schweizerischen Zivilgesetzbuch (Art. 111 ff. und Art. 114 f. ZGB) können beide
      Ehegatten gemeinsam die Scheidung verlangen (Scheidung auf gemeinsames Begehren), oder ein Ehegatte
      kann sie allein einreichen (Scheidungsklage), etwa nach zweijährigem Getrenntleben oder bei Unzumutbarkeit.
  source:
    verdict: unclear
    note: Die Seite enthält nur Bruchstücke des ZGB. Art. 111 und 112 (gemeinsames Begehren) kommen vor,
      aber die Scheidungsklage eines Ehegatten allein (Art. 114/115) fehlt im Text. Dass einer allein
      die Scheidung verlangen kann, ist daher nicht belegt.
