    reasoning: Nach dem Schweizerischen Zivilgesetzbuch (Art. 111 ff. und Art. 114 f. ZGB) können beide
      Ehegatten gemeinsam die Scheidung verlangen (einvernehmlich) oder ein Ehegatte allein klagen, ohne
      dass der andere zustimmen muss, etwa nach zwei Jahren Trennung.
