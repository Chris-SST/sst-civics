    reasoning: Die Chilbi (Kirchweih) ist ein traditioneller Jahrmarkt bzw. Volksfest mit Fahrgeschäften,
      Ständen und Festbetrieb, während Schwingfeste, Fasnachtsumzüge und Alpabzüge (Määs/Alpabzug) andere
      Anlässe sind.
  source:
    verdict: unclear
    note: Die Seite nennt Chilbi-Varianten (Bénichon-Kilbi, Älpler- oder Sennenchilbi) als Herbst-Strassenfeste
      mit Mahlzeiten, Tänzen, Umzügen und Musik. Sie sagt aber nicht, dass die Chilbi ein Jahrmarkt mit
      Fahrgeschäften ist, und erwähnt die Herkunft des Namens aus der Kirchweihe nicht. Fahrgeschäfte
      werden nur bei der Basler Herbstmesse genannt.
