question_de: Was ist eine Chilbi in der Schweiz?
options_de:
  a: Ein Wettkampf im Schwingen und Steinstossen
  b: Ein Umzug mit Masken und Guggenmusik im Winter
  c: Ein Fest zum Abtrieb der Kühe von der Alp
  d: Ein Jahrmarkt mit Fahrgeschäften wie der Achterbahn
correct: d
explanation_de: Die Chilbi ist ein Jahrmarkt mit Fahrgeschäften, Verkaufsständen und Festwirtschaften.
  Der Name geht auf die Kirchweihe zurück, das Fest findet vor allem im Herbst statt. Die anderen Antworten
  beschreiben Fasnacht, Schwingfest und Alpabzug.
