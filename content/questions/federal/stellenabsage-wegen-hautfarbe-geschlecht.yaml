id: stellenabsage-wegen-hautfarbe-geschlecht
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Bewerberin wird für eine Stelle abgelehnt, nur wegen ihres Geschlechts. Welches Grundrecht
  wird dadurch verletzt?
options_de:
  a: Das Recht auf Niederlassungsfreiheit
  b: Das Recht auf Versammlungsfreiheit
  c: Das Gebot der Rechtsgleichheit und das Diskriminierungsverbot
  d: Das Recht auf Schutz der Privatsphäre
correct: c
explanation_de: Artikel 8 der Bundesverfassung verbietet Diskriminierung, zum Beispiel wegen Herkunft,
  Hautfarbe oder Geschlecht. Eine Ablehnung allein aus solchen Gründen ist deshalb nicht zulässig. Dasselbe
  gilt für die Hautfarbe.
