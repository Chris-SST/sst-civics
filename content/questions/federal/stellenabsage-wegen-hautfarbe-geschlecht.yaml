id: stellenabsage-wegen-hautfarbe-geschlecht
version: 2
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Frau bewirbt sich für eine Stelle. Sie wird nur abgelehnt, weil sie eine Frau ist. Welches
  Grundrecht wird dadurch verletzt?
options_de:
  a: Die Niederlassungsfreiheit
  b: Die Versammlungsfreiheit
  c: Die Rechtsgleichheit und das Verbot der Diskriminierung
  d: Der Schutz der Privatsphäre
correct: c
explanation_de: Artikel 8 der Bundesverfassung sagt, dass alle Menschen vor dem Gesetz gleich sind und
  dass Frau und Mann gleichberechtigt sind. Niemand darf diskriminiert werden, zum Beispiel wegen der
  Herkunft, der Rasse oder des Geschlechts. Wer eine Bewerberin nur wegen ihres Geschlechts ablehnt, verletzt
  deshalb die Rechtsgleichheit und das Diskriminierungsverbot.
