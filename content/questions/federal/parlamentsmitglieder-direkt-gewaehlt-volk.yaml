version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Wer bestimmt die Mitglieder des Nationalrats?
options_de:
  a: Der Bundesrat ernennt sie.
  b: Die Parteien bestimmen sie ohne Wahl.
  c: Das Bundesgericht wählt sie aus.
  d: Die wahlberechtigten Bürgerinnen und Bürger wählen sie direkt.
correct: d
explanation_de: Die Mitglieder des Nationalrats werden vom Volk direkt gewählt, und zwar alle vier Jahre.
  Auch die Ständerätinnen und Ständeräte werden in fast allen Kantonen vom Volk gewählt.
