id: parlamentsmitglieder-direkt-gewaehlt-volk
version: 2
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Wer wählt die Mitglieder des Nationalrats?
options_de:
  a: Der Bundesrat ernennt sie.
  b: Die Parteien bestimmen sie ohne Wahl.
  c: Das Bundesgericht wählt sie aus.
  d: Die wahlberechtigten Bürgerinnen und Bürger wählen sie direkt.
correct: d
explanation_de: Die Mitglieder des Nationalrats werden alle vier Jahre direkt von den Stimmberechtigten
  gewählt. Auch die Mitglieder des Ständerats wählt heute in allen Kantonen das Volk, nach den Regeln
  des jeweiligen Kantons; in Appenzell Innerrhoden geschieht das an der Landsgemeinde.
