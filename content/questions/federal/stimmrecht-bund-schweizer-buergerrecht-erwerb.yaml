id: stimmrecht-bund-schweizer-buergerrecht-erwerb
version: 1
scope: federal
canton: null
topic: bund.demokratie.wahlen
question_de: Ab welchem Zeitpunkt erhält eine Person aus dem Ausland das Stimm- und Wahlrecht auf Bundesebene?
options_de:
  a: Sobald sie zehn Jahre lang in der Schweiz gelebt hat.
  b: Sobald sie eine Niederlassungsbewilligung (Ausweis C) erhält.
  c: Sobald sie in der Schweiz Steuern zahlt und arbeitet.
  d: Sobald sie das Schweizer Bürgerrecht hat und volljährig ist.
correct: d
explanation_de: Das Stimm- und Wahlrecht auf Bundesebene ist an das Schweizer Bürgerrecht gebunden. Eine
  Niederlassungsbewilligung, eine bestimmte Aufenthaltsdauer oder das Bezahlen von Steuern reichen dafür
  nicht aus. Wer eingebürgert wird und volljährig ist, darf bei eidgenössischen Wahlen und Abstimmungen
  mitmachen.
