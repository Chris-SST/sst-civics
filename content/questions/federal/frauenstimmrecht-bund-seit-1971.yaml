id: frauenstimmrecht-bund-seit-1971
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Seit wann dürfen Frauen in der Schweiz auf nationaler Ebene wählen und abstimmen?
options_de:
  a: Seit 1918
  b: Seit 1848
  c: Seit 1971
  d: Seit 1991
correct: c
explanation_de: Auf Bundesebene wurde das Frauenstimmrecht 1971 eingeführt. Einzelne Kantone und Gemeinden
  kannten es früher, andere führten es erst später ein. Als letzter Kanton folgte Appenzell Innerrhoden
  1990.
