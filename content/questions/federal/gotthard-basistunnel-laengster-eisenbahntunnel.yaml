question_de: Was zeichnet den Gotthard-Basistunnel im weltweiten Vergleich aus?
options_de:
  a: Er ist der längste Eisenbahntunnel der Welt.
  b: Er ist der höchstgelegene Eisenbahntunnel der Welt.
  c: Er ist der längste Strassentunnel der Welt.
  d: Er ist der älteste Eisenbahntunnel Europas.
correct: a
explanation_de: Der Gotthard-Basistunnel ist der längste Eisenbahntunnel der Welt. Er verbindet die Nordschweiz
  mit dem Tessin und ist ein wichtiger Teil der Nord-Süd-Achse durch die Alpen.
