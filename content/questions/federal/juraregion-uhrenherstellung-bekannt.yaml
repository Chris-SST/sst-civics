question_de: Wofür ist die Juraregion in der Schweiz wirtschaftlich berühmt?
options_de:
  a: Für die Pharmaindustrie
  b: Für grosse Banken
  c: Für den Weinbau am Zürichsee
  d: Für die Herstellung von Uhren
correct: d
explanation_de: Im Jurabogen haben viele bekannte Uhrenfirmen ihren Sitz und ihre Werkstätten. Die Region
  ist daher ein Zentrum der Schweizer Uhrenindustrie.
