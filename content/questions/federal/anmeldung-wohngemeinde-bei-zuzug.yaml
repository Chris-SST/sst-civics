id: anmeldung-wohngemeinde-bei-zuzug
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Was müssen Personen tun, die sich in einer Gemeinde niederlassen?
options_de:
  a: Sie müssen sich bei der Wohngemeinde anmelden.
  b: Sie müssen sich bei der Armee melden.
  c: Sie müssen sich beim Bundesrat melden.
  d: Sie müssen sich bei der Steuerverwaltung des Bundes melden.
correct: a
explanation_de: Wer an einen neuen Ort zieht, muss sich bei der Wohngemeinde registrieren. Dies geschieht
  in der Regel bei der Einwohnerkontrolle. So ist die Gemeinde über ihre Einwohnerinnen und Einwohner
  informiert.
