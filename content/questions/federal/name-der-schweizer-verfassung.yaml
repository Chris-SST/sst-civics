    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die kantonale Broschüre nennt die Bundesverfassung «das Grundgesetz der Schweiz». Die
        Antwort a) «Eidgenössisches Grundgesetz» kann Lernende deshalb verwirren; besser durch eine klar
        falsche Bezeichnung wie «Eidgenössische Landesordnung» ersetzen.'
      - 'Klein: In der Erklärung kann man ergänzen, dass die geltende Bundesverfassung am 18. April 1999
        vom Volk angenommen wurde und seit dem 1. Januar 2000 gilt. So entsteht keine Unklarheit über
        das Jahr.'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Erklärung könnte zur Klarheit ergänzen, dass die Bundesverfassung 1999 vom Volk angenommen
        wurde und seit dem 1. Januar 2000 gilt, damit «Fassung von 1999» nicht missverstanden wird.'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Antwort a) «Eidgenössisches Grundgesetz» ist nahe an der Broschüre des Kantons, die
        die Bundesverfassung als «Grundgesetz der Schweiz» beschreibt; sie ist aber kein offizieller Name
        und damit klar falsch. Zur Sicherheit könnte man a) durch eine weniger nahe Bezeichnung ersetzen,
        etwa «Eidgenössisches Staatsgesetz».'
      - 'Klein: Die Erklärung könnte genauer sein: Die geltende Bundesverfassung wurde am 18. April 1999
        vom Volk angenommen und ist seit dem 1. Januar 2000 in Kraft.'
    round: 1
