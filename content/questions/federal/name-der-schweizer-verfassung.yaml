    note: 'Quelle 3 sagt ausdrücklich: «Die Verfassung in der Schweiz heisst Bundesverfassung», und Quelle
      1 trägt den Titel «Bundesverfassung der Schweizerischen Eidgenossenschaft vom 18. April 1999». Das
      stützt auch die Angabe zur geltenden Fassung von 1999 und die Erklärung, dass sie die oberste Rechtsgrundlage
