id: name-der-schweizer-verfassung
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Wie heisst die Verfassung der Schweiz?
options_de:
  a: Eidgenössisches Grundgesetz
  b: Bundesverfassung
  c: Bundesordnung der Schweiz
  d: Schweizerische Staatscharta
correct: b
explanation_de: Die Verfassung der Schweiz heisst Bundesverfassung, kurz BV. Sie ist die oberste Rechtsgrundlage
  des Landes. Die geltende Fassung stammt von 1999.
