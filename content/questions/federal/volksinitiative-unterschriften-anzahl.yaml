question_de: Wie viele Unterschriften von Stimmberechtigten braucht eine eidgenössische Volksinitiative,
  damit sie zustande kommt?
options_de:
  a: 50 000 Unterschriften
  b: 150 000 Unterschriften
  c: 200 000 Unterschriften
  d: 100 000 Unterschriften
correct: d
explanation_de: Für eine eidgenössische Volksinitiative braucht es 100 000 gültige Unterschriften. Diese
  müssen innerhalb von 18 Monaten gesammelt werden.
