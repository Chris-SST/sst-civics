id: bundeskanzlei-stabsstelle-des-bundesrats
version: 1
scope: federal
canton: null
topic: bund.demokratie.bundesrat
question_de: Welche Aufgabe hat die Bundeskanzlei für den Bundesrat?
options_de:
  a: Sie ist die Stabsstelle des Bundesrats.
  b: Sie überprüft Bundesratsbeschlüsse als Gericht.
  c: Sie leitet das Finanzdepartement.
  d: Sie wählt die Mitglieder des Bundesrats.
correct: a
explanation_de: Die Bundeskanzlei unterstützt den Bundesrat bei seiner Arbeit, zum Beispiel bei der Vorbereitung
  der Sitzungen. Sie steht unter der Leitung der Bundeskanzlerin oder des Bundeskanzlers. Der Bundesrat
  wird von der Bundesversammlung gewählt.
