id: fluechtlinge-ex-jugoslawien-neunzigerjahre
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Aus welchem Grund suchten in den 1990er-Jahren viele Menschen aus dem ehemaligen Jugoslawien
  in der Schweiz Aufnahme?
options_de:
  a: Sie wollten an Schweizer Hochschulen studieren.
  b: Sie flohen vor einer grossen Naturkatastrophe.
  c: Sie flohen vor dem Krieg in ihrer Heimat.
  d: Sie wurden von Schweizer Firmen als Saisonniers angeworben.
correct: c
explanation_de: Der Zerfall Jugoslawiens führte in den 1990er-Jahren zu Kriegen. Viele Menschen suchten
  deshalb Schutz in der Schweiz. Ein Teil von ihnen ist geblieben und lebt heute hier.
