id: soziale-sicherheit-bund-verantwortung
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Welche staatliche Ebene trägt in der Schweiz die Verantwortung, die Bevölkerung sozial abzusichern,
  zum Beispiel durch die Altersvorsorge?
options_de:
  a: Die Bezirke
  b: Nur die Gemeinden
  c: Der Bund
  d: Nur die Kantone
correct: c
explanation_de: Die Bundesverfassung weist dem Bund wichtige Aufgaben der sozialen Sicherheit zu. Dazu
  gehören zum Beispiel die Alters- und Hinterlassenenversicherung (AHV) und die Invalidenversicherung.
  So gelten für die ganze Schweiz einheitliche Grundlagen.
