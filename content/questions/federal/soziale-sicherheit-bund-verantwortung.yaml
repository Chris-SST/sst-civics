    reviews:
    - role: facts
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Die Wörter «Nur» bei b) und d) machen diese Antworten fast automatisch falsch und verraten
        die Lösung; besser alle Antworten gleich formulieren, etwa «Die Gemeinden» und «Die Kantone»,
        und in der Frage klar nach der Altersvorsorge (AHV) fragen.'
      - 'Klein: Die Erklärung könnte kurz erwähnen, dass Kantone und Gemeinden ebenfalls Aufgaben haben
        (zum Beispiel Sozialhilfe und, zusammen mit dem Bund, Ergänzungsleistungen), damit kein falsches
        Bild entsteht, etwa mit dem Satz: «Kantone und Gemeinden sind zum Beispiel für die Sozialhilfe
        zuständig.»'
    - role: exam
      model: claude-opus-5-5
      verdict: approve
      issues:
      - 'Klein: Nur die Antworten b) und d) enthalten «Nur», was die richtige Antwort leicht verrät; besser
        wäre zum Beispiel «Die Gemeinden allein» und «Die Kantone allein» neben «Der Bund», oder eine
        einheitliche Formulierung aller Antworten.'
      - 'Klein: Die Erklärung könnte kurz erwähnen, dass Kantone und Gemeinden zum Beispiel bei der Sozialhilfe
        ebenfalls Aufgaben haben, der Bund aber die grossen Sozialversicherungen wie AHV und IV regelt.'
    - role: second
      model: claude-sonnet-5-5
      verdict: approve
      issues:
      - 'Klein: Die Antworten b) und d) enthalten das Wort «nur», die richtige Antwort c) nicht. Das verrät
        die Lösung. Besser wären gleich gebaute Antworten, zum Beispiel «Der Bund», «Die Kantone», «Die
        Gemeinden», «Die Bezirke».'
      - 'Klein: Nach Art. 41 BV sind Bund und Kantone gemeinsam zuständig, und Sozialhilfe ist Sache der
        Kantone und Gemeinden. Die Erklärung sollte das kurz erwähnen, etwa: «Die wichtigsten Sozialversicherungen
        wie die AHV regelt der Bund; die Kantone ergänzen sie, zum Beispiel mit der Sozialhilfe.»'
