    reasoning: Der Bund ist für die Altersvorsorge zuständig, denn die AHV und die Pensionskassenregelung
      (BVG) sind in der Bundesverfassung geregelt und werden auf Bundesebene gesetzlich festgelegt.
  source:
    verdict: supported
    note: 'Die Bundesverfassung sagt: «Der Bund trifft Massnahmen für eine ausreichende Alters-, Hinterlassenen-
      und Invalidenvorsorge» und «Der Bund erlässt Vorschriften über die Alters-, Hinterlassenen- und
      Invalidenversicherung». Das stützt Antwort c und die Erklärung (AHV, IV).'
