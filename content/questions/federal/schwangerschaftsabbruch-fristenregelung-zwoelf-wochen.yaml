    note: Quelle 1 (StGB, Art. 119 Abs. 2, seit 1. Okt. 2002) macht den Abbruch innerhalb von zwölf Wochen
      straflos, und zwar auf schriftliches Verlangen der Frau, die eine Notlage geltend macht. Quelle
      3 bestätigt die Fristenregelung seit 2002 mit straffreiem Abbruch in den ersten zwölf Wochen. Ein
      Verbot, eine Zustimmung des Partners oder eine gerichtliche Bewilligung ist nirgends vorgesehen.
