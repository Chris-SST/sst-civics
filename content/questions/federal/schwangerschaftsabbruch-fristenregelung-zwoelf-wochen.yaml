    reasoning: Seit der Einführung der Fristenregelung im Jahr 2002 (Art. 119 StGB) ist ein Schwangerschaftsabbruch
      in den ersten zwölf Wochen straffrei, wenn die schwangere Frau ihn schriftlich verlangt und sich
      in einer Notlage befindet, sie entscheidet also selbst, ohne Zustimmung des Partners oder eines
      Gerichts.
  source:
