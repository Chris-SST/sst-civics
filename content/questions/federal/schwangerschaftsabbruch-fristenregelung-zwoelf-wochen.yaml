id: schwangerschaftsabbruch-fristenregelung-zwoelf-wochen
version: 1
scope: federal
canton: null
topic: bund.geschichte.gesellschaftswandel
question_de: Welche Regelung gilt in der Schweiz seit 2002 für den Schwangerschaftsabbruch in den ersten
  zwölf Wochen?
options_de:
  a: Der Abbruch ist in dieser Zeit grundsätzlich verboten.
  b: Die Frau kann selbst über den Abbruch entscheiden.
  c: Der Ehemann oder Partner muss dem Abbruch zustimmen.
  d: Ein Gericht muss den Abbruch bewilligen.
correct: b
explanation_de: Seit 2002 gilt die sogenannte Fristenregelung. Danach entscheidet die Frau in den ersten
  zwölf Schwangerschaftswochen selbst. Sie muss dafür schriftlich eine Notlage geltend machen.
