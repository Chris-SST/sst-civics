id: krankenversicherung-obligatorisch-einwohner
version: 1
scope: federal
canton: null
topic: bund.sozial.pflichten
question_de: Wer muss in der Schweiz eine Krankenversicherung abschliessen?
options_de:
  a: Nur Personen mit Schweizer Bürgerrecht
  b: Alle Personen, die in der Schweiz wohnen
  c: Nur Personen unter 65 Jahren
  d: Nur Erwerbstätige
correct: b
explanation_de: Die obligatorische Krankenpflegeversicherung gilt für alle Personen mit Wohnsitz in der
  Schweiz. Das Bürgerrecht, die Erwerbstätigkeit und das Alter spielen keine Rolle. Die Versicherung muss
  innert drei Monaten nach dem Zuzug abgeschlossen werden.
