    reasoning: Nach dem Krankenversicherungsgesetz (KVG) gilt das Versicherungsobligatorium für alle Personen
      mit Wohnsitz in der Schweiz, unabhängig von Staatsbürgerschaft, Alter oder Erwerbstätigkeit.
  source:
    verdict: supported
    note: Art. 3 KVG (Quelle 1) und die BAG-Seite (Quelle 2) sagen, dass jede Person mit Wohnsitz in der
      Schweiz sich innert drei Monaten nach der Wohnsitznahme versichern muss, unabhängig von der Staatsangehörigkeit.
      Damit sind auch die Aussagen zu Bürgerrecht, Erwerbstätigkeit und Alter sowie die Dreimonatsfrist
      gestützt.
