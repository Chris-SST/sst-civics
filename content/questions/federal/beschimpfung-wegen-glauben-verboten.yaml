id: beschimpfung-wegen-glauben-verboten
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Eine Person beschimpft öffentlich Menschen wegen ihres Glaubens oder ihrer Abstammung. Wie
  ist das in der Schweiz geregelt?
options_de:
  a: Es ist nur in Schulen und Betrieben untersagt.
  b: Es ist untersagt und kann bestraft werden.
  c: Es ist nur verboten, wenn es in der Zeitung steht.
  d: Es ist durch die Meinungsfreiheit immer geschützt.
correct: b
explanation_de: Das Strafgesetzbuch verbietet die öffentliche Herabsetzung von Menschen wegen ihrer Rasse,
  Ethnie, Religion oder sexuellen Orientierung. Die Meinungsfreiheit gilt nicht unbegrenzt.
