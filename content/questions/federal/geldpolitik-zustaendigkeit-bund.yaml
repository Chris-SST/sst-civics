id: geldpolitik-zustaendigkeit-bund
version: 1
scope: federal
canton: null
topic: bund.demokratie.foederalismus
question_de: Wer ist in der Schweiz für die Geldpolitik zuständig?
options_de:
  a: Der Bund
  b: Die Gemeinden
  c: Die Kantonalbanken
  d: Die Kantone gemeinsam
correct: a
explanation_de: Die Geld- und Währungspolitik ist nach der Bundesverfassung Sache des Bundes. Er hat das
  Recht, Münzen und Banknoten auszugeben. Die Schweizerische Nationalbank führt die Geldpolitik im Auftrag
  des Bundes aus und ist dabei unabhängig.
