    reasoning: Die Geld- und Währungspolitik ist nach Artikel 99 der Bundesverfassung Sache des Bundes
      und wird von der unabhängigen Schweizerischen Nationalbank als Bundesinstitution im Gesamtinteresse
      des Landes geführt, nicht von Gemeinden, Kantonalbanken oder Kantonen.
  source:
    verdict: supported
    note: Art. 99 Abs. 1 BV sagt ausdrücklich, das Geld- und Währungswesen sei Sache des Bundes und nur
      ihm stehe das Recht zur Ausgabe von Münzen und Banknoten zu. Abs. 2 bestätigt, dass die unabhängige
      Nationalbank die Geld- und Währungspolitik führt und dabei unter Mitwirkung und Aufsicht des Bundes
      verwaltet wird.
