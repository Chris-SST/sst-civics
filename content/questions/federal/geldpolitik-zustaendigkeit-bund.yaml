        wäre: «Die Schweizerische Nationalbank führt die Geldpolitik als unabhängige Zentralbank, so wie
        es die Bundesverfassung vorsieht.»'
      - 'Klein: Der Satz über Münzen und Banknoten wäre genauer mit «Nur der Bund hat das Recht, Münzen
        und Banknoten auszugeben.», denn genau das sagt die Bundesverfassung (Art. 99).'
    - role: second
