id: volksinitiative-unterschreiben-wer-darf
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wer darf eine eidgenössische Volksinitiative unterschreiben?
options_de:
  a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
  b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung C
  c: Nur Mitglieder einer politischen Partei ab 18 Jahren
  d: Stimmberechtigte Schweizerinnen und Schweizer ab 18 Jahren
correct: d
explanation_de: Eine eidgenössische Volksinitiative unterschreiben dürfen nur Personen, die auf Bundesebene
  stimmberechtigt sind. Das sind Schweizerinnen und Schweizer ab 18 Jahren, auch jene, die im Ausland
  leben. Ausländerinnen und Ausländer haben auf Bundesebene keine politischen Rechte, auch nicht mit einer
  Niederlassungsbewilligung.
