    reasoning: Eine eidgenössische Volksinitiative dürfen nur in eidgenössischen Angelegenheiten stimmberechtigte
      Schweizerinnen und Schweizer ab 18 Jahren unterschreiben, auch Auslandschweizer, nicht aber Ausländerinnen
      und Ausländer oder Jugendliche unter 18 Jahren.
  source:
    verdict: supported
    note: Quelle 2 (Art. 136 Abs. 1 BV) hält fest, dass die politischen Rechte in Bundessachen allen Schweizerinnen
      und Schweizern ab dem 18. Altersjahr zustehen. Quelle 1 ergänzt, dass die Stimmbürgerinnen und Stimmbürger
      mit einer Volksinitiative eine Verfassungsänderung verlangen können. Ausdrücklich, dass die Unterschrift
      unter eine Initiative zu diesen Rechten gehört (Art. 136 Abs. 2), steht im gekürzten Text allerdings
      nicht.
