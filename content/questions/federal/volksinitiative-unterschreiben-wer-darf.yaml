id: volksinitiative-unterschreiben-wer-darf
version: 2
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wer darf eine eidgenössische Volksinitiative unterschreiben?
options_de:
  a: Alle Personen ab 16 Jahren mit Wohnsitz in der Schweiz
  b: Alle Personen ab 18 Jahren mit Niederlassungsbewilligung C
  c: Nur Mitglieder einer politischen Partei ab 18 Jahren
  d: Schweizer Bürgerinnen und Bürger ab 18 Jahren
correct: d
explanation_de: Eine eidgenössische Volksinitiative unterschreiben darf, wer auf Bundesebene stimmberechtigt
  ist. Das sind Schweizerinnen und Schweizer ab 18 Jahren, auch jene im Ausland, wenn sie im Stimmregister
  eingetragen sind. Ausgeschlossen sind nur Personen, die wegen dauernder Urteilsunfähigkeit unter umfassender
  Beistandschaft stehen oder durch eine vorsorgebeauftragte Person vertreten werden; Ausländerinnen und
  Ausländer haben auf Bundesebene keine politischen Rechte, auch nicht mit Ausweis C.
