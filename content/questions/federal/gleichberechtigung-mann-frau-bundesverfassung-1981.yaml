topic: bund.geschichte.gesellschaftswandel
question_de: Seit wann steht die Gleichberechtigung von Mann und Frau in der Schweizer Bundesverfassung?
options_de:
  a: Seit 1999
  b: Seit 1971
  c: Seit 1981
  d: Seit 1848
correct: c
explanation_de: 1981 wurde der Gleichstellungsartikel in die Bundesverfassung aufgenommen. Er verpflichtet
  den Staat, die Gleichstellung in Familie, Ausbildung und Arbeit zu sichern. Das Frauenstimmrecht gab
  es schon seit 1971.
