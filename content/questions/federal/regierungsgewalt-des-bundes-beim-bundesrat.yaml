id: regierungsgewalt-des-bundes-beim-bundesrat
version: 1
scope: federal
canton: null
topic: bund.demokratie.bundesrat
question_de: Welche Behörde übt auf Bundesebene die oberste Regierungsgewalt aus?
options_de:
  a: Der Bundesrat
  b: Der Nationalrat
  c: Die Bundeskanzlei
  d: Das Bundesgericht
correct: a
explanation_de: Nach der Bundesverfassung ist der Bundesrat die oberste leitende und vollziehende Behörde
  des Bundes. Das Parlament macht die Gesetze, das Bundesgericht spricht Recht.
