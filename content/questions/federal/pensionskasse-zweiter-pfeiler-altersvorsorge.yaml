id: pensionskasse-zweiter-pfeiler-altersvorsorge
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Die Altersvorsorge in der Schweiz beruht auf drei Säulen. Welche Einrichtung bildet den zweiten
  Pfeiler?
options_de:
  a: Die Ergänzungsleistungen zur AHV
  b: Die AHV (staatliche Rentenversicherung)
  c: Die Pensionskasse (berufliche Vorsorge)
  d: Das private Sparkonto mit Steuerabzug (Säule 3a)
correct: c
explanation_de: Die Pensionskasse gehört zur beruflichen Vorsorge und bildet den zweiten Pfeiler. Sie
  ergänzt die AHV, damit Rentnerinnen und Rentner ihren gewohnten Lebensstandard in angemessener Weise
  weiterführen können. Die AHV ist der erste, die private Vorsorge der dritte Pfeiler.
