id: volksinitiative-eigene-forderungen-durchsetzen
version: 1
scope: federal
canton: null
topic: bund.demokratie.volksrechte
question_de: Wozu dient eine Volksinitiative den Stimmberechtigten?
options_de:
  a: Sie können damit ein Urteil des Bundesgerichts ändern.
  b: Sie können damit eigene Forderungen auf die politische Agenda bringen.
  c: Sie können damit den Termin der nächsten Wahlen festlegen.
  d: Sie können damit ein Gesetz des Parlaments verhindern.
correct: b
explanation_de: Mit einer Volksinitiative können Stimmberechtigte eine Änderung der Bundesverfassung vorschlagen.
  Kommt sie zustande, wird darüber abgestimmt. So können sie eigene Anliegen auch gegen den Willen des
  Parlaments durchsetzen, wenn Volk und Stände zustimmen.
