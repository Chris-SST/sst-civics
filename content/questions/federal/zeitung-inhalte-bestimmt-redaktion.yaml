    reasoning: Wegen der in der Bundesverfassung garantierten Medien- und Pressefreiheit und des Zensurverbots
      entscheidet die Redaktion der Zeitung selbst über ihre Inhalte, nicht der Staat.
  source:
    verdict: supported
    note: Quelle 1 (Medienfreiheit) sagt, dass die Zensur verboten ist und die Medien selber entscheiden,
      welche Berichte und Artikel sie veröffentlichen. Quelle 2 (Art. 17 BV) bestätigt das Zensurverbot;
      dass die Redaktion entscheidet, steht dort aber nicht ausdrücklich.
