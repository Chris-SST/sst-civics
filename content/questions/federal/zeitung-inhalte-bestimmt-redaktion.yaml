id: zeitung-inhalte-bestimmt-redaktion
version: 1
scope: federal
canton: null
topic: bund.demokratie.grundrechte
question_de: Wer entscheidet in der Schweiz darüber, welche Inhalte in einer Zeitung veröffentlicht werden?
options_de:
  a: Das Bundesgericht
  b: Die Gemeinde, in der die Zeitung erscheint
  c: Die Redaktion der Zeitung
  d: Der Bundesrat
correct: c
explanation_de: Die Medienfreiheit schützt die Zeitungen vor staatlicher Einflussnahme. Die Redaktion
  entscheidet selbst, was sie veröffentlicht. Die Bundesverfassung verbietet die Zensur.
sources:
