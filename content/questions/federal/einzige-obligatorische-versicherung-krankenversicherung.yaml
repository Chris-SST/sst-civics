id: einzige-obligatorische-versicherung-krankenversicherung
version: 1
scope: federal
canton: null
topic: bund.sozial.gesundheit
question_de: Welche der folgenden Versicherungen ist in der Schweiz für alle Einwohnerinnen und Einwohner
  gesetzlich vorgeschrieben?
options_de:
  a: Die Rechtsschutzversicherung
  b: Die Krankenversicherung
  c: Die Reiseversicherung
  d: Die Hausratversicherung
correct: b
explanation_de: Die Krankenversicherung ist für alle Personen mit Wohnsitz in der Schweiz obligatorisch.
  Hausrat-, Rechtsschutz- und Reiseversicherungen sind freiwillig.
