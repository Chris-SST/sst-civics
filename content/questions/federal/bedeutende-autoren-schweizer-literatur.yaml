topic: bund.kultur.feiertage_brauchtum
question_de: Welche zwei Personen gehören zu den bedeutenden Autoren der Schweizer Literatur?
options_de:
  a: Hermann Hesse und Franz Kafka
  b: Thomas Mann und Bertolt Brecht
  c: Johann Wolfgang von Goethe und Friedrich Schiller
  d: Max Frisch und Friedrich Dürrenmatt
correct: d
explanation_de: Max Frisch und Friedrich Dürrenmatt gelten als wichtige Schweizer Schriftsteller des 20.
  Jahrhunderts. Beide sind auch im Ausland bekannt. Die anderen Autoren stammen nicht aus der Schweiz
  oder werden nicht als Schweizer Autoren bezeichnet.
