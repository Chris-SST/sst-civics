question_de: Welche zwei Schriftsteller sind wichtige Autoren der Schweizer Literatur?
options_de:
  a: Günter Grass und Heinrich Böll
  b: Thomas Mann und Bertolt Brecht
  c: Johann Wolfgang von Goethe und Friedrich Schiller
  d: Max Frisch und Friedrich Dürrenmatt
correct: d
explanation_de: Max Frisch und Friedrich Dürrenmatt sind zwei sehr wichtige Schweizer Schriftsteller des
  20. Jahrhunderts. Ihre Bücher und Theaterstücke kennt man auch im Ausland. Die Autoren in den anderen
  Antworten sind Schriftsteller aus Deutschland.
