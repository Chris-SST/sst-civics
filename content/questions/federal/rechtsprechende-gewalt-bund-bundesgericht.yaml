topic: bund.demokratie.gerichte
question_de: Welche Behörde ist auf Bundesebene das oberste rechtsprechende Organ der Schweiz?
options_de:
  a: Die Bundeskanzlei
  b: Der Bundesrat
  c: Die Bundesversammlung
  d: Das Bundesgericht
correct: d
explanation_de: Die Bundesverfassung weist die rechtsprechende Gewalt des Bundes dem Bundesgericht zu.
  Es ist die oberste rechtsprechende Behörde des Bundes. Bundesrat und Bundesversammlung üben die vollziehende
  beziehungsweise die gesetzgebende Gewalt aus.
