id: sirenen-ernstfall-radio-einschalten
version: 1
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Was sollen Sie tun, wenn im Ernstfall die Sirenen ertönen?
options_de:
  a: Das Haus sofort verlassen
  b: Die Feuerwehr anrufen
  c: Das Radio einschalten
  d: Das Auto nehmen und wegfahren
correct: c
explanation_de: Bei einem Sirenenalarm gibt die Behörde über das Radio Informationen und Anweisungen durch.
  Man soll also das Radio einschalten und den Anweisungen folgen. Die Notrufnummern sollen frei bleiben.
