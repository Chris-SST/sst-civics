id: sirenen-ernstfall-radio-einschalten
version: 2
scope: federal
canton: null
topic: bund.kultur.feiertage_brauchtum
question_de: Im Ernstfall ertönt der «Allgemeine Alarm» der Sirenen (ein auf- und absteigender Heulton).
  Was sollen Sie tun?
options_de:
  a: Sofort das Haus verlassen
  b: Die Feuerwehr anrufen
  c: Radio hören und die Anweisungen der Behörden befolgen
  d: Mit dem Auto wegfahren
correct: c
explanation_de: Beim Allgemeinen Alarm informieren die Behörden über das Radio, was man tun soll. Informationen
  gibt es auch in der App Alertswiss. Man soll den Anweisungen folgen und die Notrufnummern nicht unnötig
  anrufen, damit sie für echte Notfälle frei bleiben.
