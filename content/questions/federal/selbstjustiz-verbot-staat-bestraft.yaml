id: selbstjustiz-verbot-staat-bestraft
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz gebrochen hat?
options_de:
  a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
  b: Der Staat verfolgt und bestraft die Tat; Selbstjustiz ist verboten.
  c: Das Opfer darf die Strafe selbst bestimmen und vollziehen.
  d: Die Tat bleibt straflos, wenn das Opfer sich selbst gewehrt hat.
correct: b
explanation_de: Das Gewaltmonopol liegt beim Staat. Nur Polizei, Staatsanwaltschaft und Gerichte dürfen
  Straftaten verfolgen und Strafen verhängen. Wer selbst Rache übt, macht sich unter Umständen selbst
  strafbar.
