id: selbstjustiz-verbot-staat-bestraft
version: 2
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Was gilt in der Schweiz, wenn jemand ein Gesetz gebrochen hat?
options_de:
  a: Die Nachbarschaft entscheidet gemeinsam über die Strafe.
  b: Der Staat verfolgt und bestraft die Tat; Selbstjustiz ist verboten.
  c: Das Opfer darf die Strafe selbst bestimmen und vollziehen.
  d: Die Familie des Opfers darf die Täterin oder den Täter selbst bestrafen.
correct: b
explanation_de: In der Schweiz hat nur der Staat das Recht, Straftaten zu verfolgen und zu bestrafen.
  Dafür sind Polizei, Staatsanwaltschaft und Gerichte zuständig. Wer sich selbst rächt, auch als Opfer
  oder als Familie des Opfers, kann sich dabei selbst strafbar machen.
