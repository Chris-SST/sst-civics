id: gewaltmonopol-des-staates
version: 2
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Wer darf in der Schweiz grundsätzlich physische Gewalt anwenden?
options_de:
  a: Private Sicherheitsfirmen im Auftrag von Vereinen
  b: Jede Person, die sich bedroht fühlt
  c: Nur der Staat
  d: Jede Gemeinde mit eigenen Bürgerwehren
correct: c
explanation_de: 'In der Schweiz hat der Staat das Gewaltmonopol: Grundsätzlich darf nur er physische Gewalt
  einsetzen, zum Beispiel durch die Polizei oder die Armee. Eine Ausnahme ist die Notwehr: Wer rechtswidrig
  angegriffen wird, darf sich angemessen verteidigen, aber das blosse Gefühl, bedroht zu sein, genügt
  dafür nicht.'
