id: gewaltmonopol-des-staates
version: 1
scope: federal
canton: null
topic: bund.demokratie.staatsprinzipien
question_de: Wer darf in der Schweiz physische Gewalt anwenden, zum Beispiel durch Polizei und Armee?
options_de:
  a: Private Sicherheitsfirmen im Auftrag von Vereinen
  b: Jede Person, die sich bedroht fühlt
  c: Nur der Staat
  d: Jede Gemeinde mit eigenen Bürgerwehren
correct: c
explanation_de: Der Staat hat das Gewaltmonopol. Nur er darf zum Schutz der Ordnung physische Gewalt einsetzen,
  etwa durch Polizei und Armee. So sollen Streitigkeiten nicht mit Selbstjustiz gelöst werden.
