question_de: Wie viele Personen ohne Schweizer Pass wohnten im Jahr 2020 ungefähr ständig in der Schweiz?
options_de:
  a: rund 2,1 Millionen
  b: rund 0,8 Millionen
  c: rund 3,5 Millionen
  d: rund 1,4 Millionen
correct: a
explanation_de: Ende 2020 lebten rund 2,1 Millionen Ausländerinnen und Ausländer in der Schweiz. Sie gehören
  zur ständigen Wohnbevölkerung. Die Zahlen veröffentlicht das Bundesamt für Statistik.
