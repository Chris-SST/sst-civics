id: bundesgesetz-referendum-volksabstimmung
version: 1
scope: federal
canton: null
topic: bund.demokratie.parlament
question_de: Was gilt für ein Bundesgesetz, das beide Kammern des Parlaments verabschiedet haben?
options_de:
  a: Die Stimmberechtigten können mit einem Referendum eine Volksabstimmung darüber verlangen.
  b: Der Bundesrat muss es danach noch dem Bundesgericht zur Genehmigung vorlegen.
  c: Es tritt immer sofort in Kraft, ohne dass das Volk mitreden kann.
  d: Die Kantonsregierungen müssen es zuerst einzeln genehmigen.
correct: a
explanation_de: Nach dem Beschluss beider Kammern unterstehen Bundesgesetze dem fakultativen Referendum.
  Kommt es zustande, entscheiden die Stimmberechtigten an der Urne über das Gesetz.
