  source:
    verdict: supported
    note: Quelle 1 nennt die Meldepflicht für alle Arbeitnehmenden bis zum gesetzlichen Renteneintrittsalter
      und hält fest, dass bei Pensionierten auf Lohn über dem Freibetrag nur AHV/IV/EO-Beiträge, nicht
      aber ALV-Beiträge zu leisten sind. Das stützt Antwort b und die Erklärung. Die Aussage zu Teilzeit-
      und Vollzeitangestellten wird nicht ausdrücklich bestätigt, folgt aber aus der allgemeinen ALV-Pflicht
      für Angestellte. Dass das Rentenalter 'ordentlich' ist, wird nicht eigens thematisiert.
