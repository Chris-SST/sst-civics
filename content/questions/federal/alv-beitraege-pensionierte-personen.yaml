id: alv-beitraege-pensionierte-personen
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wer muss in der Schweiz keine Beiträge mehr an die Arbeitslosenversicherung (ALV) bezahlen?
options_de:
  a: Personen, die in einem unbefristeten Arbeitsverhältnis stehen
  b: Personen, die das ordentliche AHV-Rentenalter erreicht haben
  c: Personen, die in einem Teilzeitpensum arbeiten
  d: Personen, die in den letzten zwei Jahren nie arbeitslos waren
correct: b
explanation_de: Die Beitragspflicht für die Arbeitslosenversicherung endet mit dem Erreichen des AHV-Rentenalters.
  Wer pensioniert ist, bezahlt auf einem allfälligen Lohn keine ALV-Beiträge mehr. Teilzeit- und Vollzeitangestellte
  bezahlen dagegen Beiträge.
