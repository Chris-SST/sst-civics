topic: bund.geschichte.bundesstaat
question_de: Was bewirkte der Einmarsch französischer Truppen in der Schweiz im Jahr 1798?
options_de:
  a: Er machte die Schweiz zu einem Teil Frankreichs
  b: Er stärkte die Macht der alten Orte
  c: Er führte zur Gründung des Bundesstaates von 1848
  d: Er beendete die alte Ordnung der Eidgenossenschaft
correct: d
explanation_de: Mit der Besetzung durch Frankreich brach die alte Eidgenossenschaft zusammen. An ihre
  Stelle trat die Helvetische Republik als Einheitsstaat. Der heutige Bundesstaat entstand erst 1848.
