  source:
    verdict: supported
    note: Quelle 1 (StPO Art. 15) sagt, dass die Polizei Straftaten aus eigenem Antrieb, auf Anzeige oder
      im Auftrag der Staatsanwaltschaft ermittelt, und stützt damit Antwort a. Dass Gerichte urteilen
      und das Parlament Gesetze macht, stützt Quelle 2, aber die Hauptaussage ist durch Quelle 1 belegt.
