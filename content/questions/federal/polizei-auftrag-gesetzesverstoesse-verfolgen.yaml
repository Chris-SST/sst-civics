id: polizei-auftrag-gesetzesverstoesse-verfolgen
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Welche Aufgabe gehört zum Auftrag der Polizei?
options_de:
  a: Gesetzesverstösse zu verfolgen
  b: Volksabstimmungen durchzuführen
  c: Gesetze für das Land zu erlassen
  d: Gerichtsurteile über Straftäter zu fällen
correct: a
explanation_de: Die Polizei sorgt für Sicherheit und Ordnung und verfolgt Gesetzesverstösse. Sie klärt
  Straftaten ab und leitet die Ergebnisse weiter. Gesetze erlässt das Parlament, Urteile fällen die Gerichte.
