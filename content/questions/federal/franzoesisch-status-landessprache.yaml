topic: bund.geografie.sprachen
question_de: Welchen Status hat Französisch in der Schweiz?
options_de:
  a: Französisch ist nur eine Fremdsprache in der Schule.
  b: Französisch ist nur eine regionale Verkehrssprache.
  c: Französisch ist eine Landessprache.
  d: Französisch ist eine Minderheitensprache ohne amtlichen Status.
correct: c
explanation_de: Französisch ist eine der Landessprachen der Schweiz. Es wird vor allem in der Westschweiz
  gesprochen und ist auf Bundesebene eine Amtssprache.
