id: zivilgesetzbuch-ehe-scheidung-regeln
version: 1
scope: federal
canton: null
topic: bund.demokratie.gerichte
question_de: Welches Gesetz regelt unter anderem, wie eine Ehe geschlossen und wieder geschieden wird?
options_de:
  a: Das Zivilgesetzbuch
  b: Das Strafgesetzbuch
  c: Das Asylgesetz
  d: Das Bundesgerichtsgesetz
correct: a
explanation_de: Das Zivilgesetzbuch regelt das Personen-, Familien-, Erb- und Sachenrecht. Dazu gehören
  auch Eheschliessung und Scheidung. Das Strafgesetzbuch befasst sich dagegen mit Straftaten und Strafen.
