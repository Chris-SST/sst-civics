    reasoning: Die Invalidenversicherung (IV) ist eine staatliche Sozialversicherung der Schweiz, während
      Reise-, Rechtsschutz- und Hausratversicherung private Versicherungen sind.
  source:
    verdict: supported
    note: Quelle 1 nennt die IV zusammen mit der AHV als staatliche Vorsorge (1. Säule) mit gesetzlich
      geregelten Beiträgen und Leistungen. Quelle 2 führt die IV unter den Beiträgen an die Sozialversicherungen
      auf. Die Aussage zu privaten Versicherungen (Hausrat, Reise, Rechtsschutz) wird nicht ausdrücklich
      belegt, folgt aber daraus, dass sie nirgends als Sozialversicherung erscheinen.
