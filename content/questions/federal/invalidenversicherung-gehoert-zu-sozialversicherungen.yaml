id: invalidenversicherung-gehoert-zu-sozialversicherungen
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Welche der folgenden Einrichtungen gehört zu den Sozialversicherungen der Schweiz?
options_de:
  a: Die Invalidenversicherung
  b: Die Reiseversicherung
  c: Die Rechtsschutzversicherung
  d: Die Hausratversicherung
correct: a
explanation_de: Die Invalidenversicherung (IV) ist eine staatlich geregelte Sozialversicherung. Sie unterstützt
  Menschen, die wegen Krankheit oder Unfall nicht oder nur eingeschränkt arbeiten können. Hausrat-, Reise-
  und Rechtsschutzversicherungen sind private Versicherungen.
