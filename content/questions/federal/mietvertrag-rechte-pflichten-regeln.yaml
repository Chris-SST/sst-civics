id: mietvertrag-rechte-pflichten-regeln
version: 1
scope: federal
canton: null
topic: bund.sozial.zivilgesellschaft
question_de: Was wird in einem Mietvertrag festgelegt?
options_de:
  a: Die Rechte der Nachbarn in der Liegenschaft
  b: Die Höhe der Steuern der Mietenden
  c: Die Pflichten der Gemeinde gegenüber den Mietenden
  d: Die Rechte und Pflichten von Vermietenden und Mietenden
correct: d
explanation_de: Der Mietvertrag regelt das Verhältnis zwischen der Person, die vermietet, und der Person,
  die mietet. Dazu gehören zum Beispiel der Mietzins und die Dauer der Miete. Das Obligationenrecht enthält
  die gesetzlichen Regeln dazu.
