id: iv-kuerzel-invalidenversicherung
version: 1
scope: federal
canton: null
topic: bund.sozial.sozialversicherungen
question_de: Wofür steht die Abkürzung «IV» im Schweizer Sozialversicherungssystem?
options_de:
  a: Inlandversicherung
  b: Invalidenversicherung
  c: Integrationsversicherung
  d: Individualversicherung
correct: b
explanation_de: IV steht für Invalidenversicherung. Sie gehört zur ersten Säule der Altersvorsorge und
  hilft Menschen mit gesundheitlichen Einschränkungen, zum Beispiel mit Eingliederungsmassnahmen oder
  Renten.
