    reasoning: Die Abkürzung «IV» steht im Schweizer Sozialversicherungssystem für die Invalidenversicherung,
      die Menschen mit gesundheitlich bedingter Erwerbsunfähigkeit unterstützt.
  source:
    verdict: supported
    note: Quelle 1 ist das «Bundesgesetz über die Invalidenversicherung (IVG)» und spricht von der «IV-Stelle»,
      Quelle 2 nennt «die Invalidenversicherung (IV)» als Teil der ersten Säule. Quelle 3 (BSV) bestätigt,
      dass die 1. Säule aus AHV und IV besteht. Quelle 1 behandelt zudem Eingliederungsmassnahmen und
