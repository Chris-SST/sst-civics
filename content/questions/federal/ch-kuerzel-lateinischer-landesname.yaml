topic: bund.demokratie.staatsprinzipien
question_de: Wofür steht das Länderkürzel «CH» der Schweiz?
options_de:
  a: Für den französischen Namen Confédération Helvétique
  b: Für den Begriff «Cantons Helvétiques»
  c: Für den lateinischen Namen Civitas Helvetica
  d: Für den lateinischen Landesnamen Confoederatio Helvetica
correct: d
explanation_de: CH ist die Kurzform von Confoederatio Helvetica, dem lateinischen Namen der Schweiz. Latein
  wird verwendet, weil es keine der vier Landessprachen bevorzugt. Das Kürzel steht zum Beispiel auf Autokennzeichen
  und in Internetadressen.
