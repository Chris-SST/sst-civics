canton: ch
# "Rest of Switzerland": learners whose canton has no question set of its own yet. They study
# the federal questions only (the topics below are the federal topics of zh.yaml); their own
# canton's and commune's questions are not covered. Mock test: federal questions only, in the
# Zurich format, labelled unconfirmed (each canton sets its own format).
test:
  questions: 50
  minutes: 60
  pass_mark: 30          # unconfirmed: the Zurich value; each canton sets its own
  proportions: {federal: 1.0, canton: 0.0, commune: 0.0}
