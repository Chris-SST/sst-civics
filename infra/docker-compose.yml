# Civics stack (staging shares the tutor VPS; see docs/runbooks/deploy-staging.md and D-004).
# Run from the repository root (/opt/civics):
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Binds no host ports. The web service joins the external Docker network "edge", where the
# shared edge Caddy (tutor stack) reaches it as civics-web:80 and terminates TLS.
# Create the network once on the server: docker network create edge
name: civics

services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      default: {}
      edge:
        aliases:
          - civics-web
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 64m

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://civics:${POSTGRES_PASSWORD}@postgres:5432/civics
      REDIS_URL: redis://redis:6379/0
      JOBS_INLINE: "false"
    volumes:
      - outbox:/srv/var/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: ["arq", "worker.main.WorkerSettings"]
    # The image's HTTP health check does not apply to the worker; arq records its own health
    # key in Redis, which `arq --check` reads.
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.main.WorkerSettings"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://civics:${POSTGRES_PASSWORD}@postgres:5432/civics
      REDIS_URL: redis://redis:6379/0
    volumes:
      - outbox:/srv/var/outbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512m

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://civics:${POSTGRES_PASSWORD}@postgres:5432/civics
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    profiles: ["ops"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: civics
      POSTGRES_USER: civics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civics -d civics"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          memory: 160m

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "-c", "apk add --no-cache gnupg rclone >/dev/null && while true; do sh /backup.sh; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

# Compose prefixes volume names with the project name (civics_pg_data, ...), so they cannot
# collide with the tutor stack's volumes.
volumes:
  pg_data:
  backups:
  outbox:

networks:
  edge:
    external: true
