question_de: "Auf wie vielen staatlichen Ebenen ist die Schweiz organisiert?"
options_de:
  a: "Auf zwei Ebenen: Bund und Kantone"
  b: "Auf drei Ebenen: Bund, Kantone und Gemeinden"
  c: "Auf vier Ebenen: Bund, Regionen, Kantone und Gemeinden"
  d: "Auf einer Ebene: nur beim Bund"
correct: b
explanation_de: >-
  Die Schweiz ist ein föderaler Staat mit drei Ebenen: dem Bund, den Kantonen und den
  Gemeinden. Jede Ebene hat eigene Aufgaben, eigene Behörden und erhebt eigene Steuern.
