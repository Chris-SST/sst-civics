[project]
name = "civics-trainer"
version = "0.1.0"
description = "Citizenship test trainer: API and background worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pwdlib[argon2]>=0.2",
  "pyotp>=2.9",
  "cryptography>=42",
  "stripe>=12.0",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "sentry-sdk[fastapi]>=2.0",
  "anthropic>=2.3",
  "tzdata>=2024.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "E501"]
"alembic/*" = ["I", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# One event loop for the whole run: pooled asyncpg connections must not cross loops.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
