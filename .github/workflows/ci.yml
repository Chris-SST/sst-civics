name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend (ruff, pytest on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civics_test
          POSTGRES_USER: civics
          POSTGRES_PASSWORD: civics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civics -d civics_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app worker tests scripts alembic
      - run: ruff format --check app worker tests scripts alembic
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://civics:civics@localhost:5432/civics_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Content check (questions, topics, translations)
        run: python scripts/validate_content.py
      - name: Tests (SQLite, fast)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          CI_DATABASE_URL: postgresql+asyncpg://civics:civics@localhost:5432/civics_test
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict --skip-editable || true

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --audit-level=high || true

  images:
    name: Container images (build and scan)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          load: true
          tags: civics-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          load: true
          tags: civics-web:ci
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civics-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civics-web:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  # Deploys run from tagged releases only, by SSH to the staging host.
  # Fill in the secrets (STAGING_HOST, STAGING_USER, STAGING_SSH_KEY) once the server exists.
  deploy-staging:
    name: Deploy to staging (tags only)
    runs-on: ubuntu-latest
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v') && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          REF: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd /opt/civics && git fetch --tags && git checkout $REF && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env --profile ops build && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env --profile ops run --rm migrate && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env up -d --remove-orphans"
