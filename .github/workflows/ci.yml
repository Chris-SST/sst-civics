name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend (ruff, pytest on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civics_test
          POSTGRES_USER: civics
          POSTGRES_PASSWORD: civics
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U civics -d civics_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app worker tests scripts alembic
      - run: ruff format --check app worker tests scripts alembic
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://civics:civics@localhost:5432/civics_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Content check (questions, topics, translations)
        run: python scripts/validate_content.py
      - name: Tests (SQLite, fast)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          CI_DATABASE_URL: postgresql+asyncpg://civics:civics@localhost:5432/civics_test
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict --skip-editable || true

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm audit --audit-level=high || true

  guide-site:
    name: Guide site (astro check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx astro check
      - name: Build
        env:
          # Repository variables; the defaults are the staging names.
          SITE_URL: ${{ vars.SITE_URL || 'https://civics-staging.swisssciencetutors.ch' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.civics-staging.swisssciencetutors.ch' }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: guide-site-dist
          path: site/dist
          retention-days: 14

  # End-to-end tests (task 1.14): Playwright and Chromium against the API on SQLite with the
  # built front end and the example questions from tests/e2e/make_fixture_content.py (never content/).
  e2e:
    name: End-to-end (Playwright, accessibility)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          CI: "true"
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  # Guide site quality (task 1.14): hreflang alternates, and Lighthouse on the phone profile
  # (performance, accessibility, best practices and SEO at 90 or more) for the German home page,
  # the knowledge-test page and the FAQ.
  guide-site-quality:
    name: Guide site (hreflang, Lighthouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://civics-staging.swisssciencetutors.ch' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.civics-staging.swisssciencetutors.ch' }}
        run: npm run build
      - run: npm run check:hreflang
      - name: Lighthouse
        env:
          CI: "true"
        run: npm run lighthouse
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: site/.lighthouseci
          retention-days: 14

  # Guide site release (D-056): tags only, gated like deploy-staging. Uses the same secrets
  # and the same SSH account (it must be able to write /opt/civics/site-releases).
  guide-site-deploy:
    name: Deploy guide site (tags only)
    runs-on: ubuntu-latest
    needs: [guide-site]
    if: startsWith(github.ref, 'refs/tags/v') && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guide-site-dist
          path: site/dist
      - name: Release over SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          RELEASE_ID: ${{ github.sha }}
          SMOKE_URL: ${{ vars.SITE_URL || 'https://civics-staging.swisssciencetutors.ch' }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scripts/deploy_site.sh

  images:
    name: Container images (build and scan)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: false
          load: true
          tags: civics-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          load: true
          tags: civics-web:ci
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civics-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: civics-web:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  # Deploys run from tagged releases only, by SSH to the staging host.
  # Fill in the secrets (STAGING_HOST, STAGING_USER, STAGING_SSH_KEY) once the server exists.
  deploy-staging:
    name: Deploy to staging (tags only)
    runs-on: ubuntu-latest
    needs: [images]
    if: startsWith(github.ref, 'refs/tags/v') && vars.STAGING_DEPLOY_ENABLED == 'true'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          KEY: ${{ secrets.STAGING_SSH_KEY }}
          REF: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh "$USER@$HOST" "cd /opt/civics && git fetch --tags && git checkout $REF && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env --profile ops build && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env --profile ops run --rm migrate && \
            docker compose -p civics -f infra/docker-compose.yml --env-file .env up -d --remove-orphans"
